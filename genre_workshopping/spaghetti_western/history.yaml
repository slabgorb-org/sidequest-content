# Spaghetti Western — Genre-Level History Template
# World packs use this structure to build campaign progression.
# This file provides the template and genre-level guidance.

history_structure:
  description: >-
    Campaign history in the spaghetti western follows the arc of a
    film trilogy: the stranger arrives, becomes entangled, and either
    transforms the landscape or is consumed by it. Each chapter deepens
    the web of allegiances, debts, and vendettas.

  chapters:
    - maturity: FRESH
      session_range: [1, 5]
      description: >-
        The stranger arrives. First impressions. The town reveals its
        surface — the saloon, the sheriff, the obvious power structure.
        The player is an outsider reading the room.
      narrative_focus:
        - Establishing reputation through first encounters
        - Discovering which factions hold power and why
        - First standoff — small stakes, high tension
        - Learning the landscape — routes, dangers, resources
      mechanical_focus:
        - Build initial faction reputation
        - First bounty or job
        - Establish LUCK economy habits

    - maturity: EARLY
      session_range: [6, 12]
      description: >-
        The stranger is known. Factions court or threaten. The first
        betrayal happens — maybe to the player, maybe by them. The
        web of obligation begins to form. The player's choices start
        having consequences they did not anticipate.
      narrative_focus:
        - Faction alignment decisions with real trade-offs
        - A major betrayal reshapes relationships
        - The gold/revenge/search objective becomes concrete
        - An unlikely alliance forms under pressure
      mechanical_focus:
        - Reputation shifts open and close doors
        - LUCK is tested — the first time it runs out
        - Standoff mechanics against a named antagonist
        - Bounty board becomes personally relevant

    - maturity: MID
      session_range: [13, 25]
      description: >-
        The stranger is a player in the game, not a piece. Alliances
        deepen or shatter. The true villain reveals themselves — not
        the obvious one, but the one pulling strings. The stakes move
        from personal to structural: the town, the territory, the future.
      narrative_focus:
        - The power behind the power is revealed
        - A point of no return — a choice that cannot be undone
        - The cost of the player's earlier decisions comes due
        - Protecting something worth protecting — or deciding nothing is
      mechanical_focus:
        - Multi-faction reputation consequences cascade
        - Major standoff with genuine death stakes
        - LUCK economy at its most strained
        - Environmental challenges compound — the territory fights back

    - maturity: VETERAN
      session_range: [25, 999]
      description: >-
        The reckoning. Every thread converges. The stranger faces the
        sum of their choices — the allies they kept, the enemies they
        made, the debts they honored or broke. The final standoff is
        not about skill. It is about what kind of person the frontier
        made them.
      narrative_focus:
        - The final standoff — everything on the line
        - Resolution of the core drive (revenge, gold, redemption)
        - The territory after — what changed, what didn't
        - The ride out — does the stranger stay, or vanish?
      mechanical_focus:
        - All faction relationships reach their conclusion
        - LUCK spent to its last point — or replenished by trust
        - The standoff system at its fullest expression
        - Legacy: what the territory remembers
