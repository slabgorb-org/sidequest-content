  # ── CHEKHOV'S-GUN PAYOFF SEEDS (2) ──────────────────────────

  - slug: selenium_image_plate
    name: The Selenium Image Plate
    mccoy_purpose: >-
      A light-sensing plate McCoy built for an "image transmission"
      bench experiment, inspired by Willoughby Smith's 1873 paper.
      Currently unreliable — images are blurry and the plate drifts.
      Stored in the workshop car under a dust cover.
    description_mechanical: >-
      12x12 grid of selenium cells on a copper substrate, one wire
      per cell, 144 wires routed to a commutator bank. When paired
      with a Nipkow-style scanning disk (not yet built) could
      transmit a crude 12x12 image down a wire. Mechanically:
      dormant until the narrator decides a future session opens
      the payoff. On that day, the plate works and someone's face
      arrives by wire.
    practicality: 0.2
    absurdity: 0.5
    danger: 0.1
    real_science_citation: >-
      Willoughby Smith, "Effect of Light on Selenium during the
      passage of an Electric Current," Journal of the Society of
      Telegraph Engineers 1873. Paul Nipkow's scanning disk
      German Reichspatent 30105 (1884) — post-period, the payoff
      can introduce it as a Markham leak.
    world_weaponization: []
    payoff_seed: true

  - slug: analytical_engine_core
    name: The Analytical Engine Core
    mccoy_purpose: >-
      A Babbage-designed mechanical general-purpose computer core,
      uncased, ~40 percent complete. McCoy acquired the Menabrea-
      Lovelace papers in 1872 and has been assembling a partial
      mill and store since. Currently it can compute the first
      seven Bernoulli numbers; when finished it could do much more.
    description_mechanical: >-
      Brass cams and toothed-wheel columns, Jacquard punched-card
      reader (adapted from a Pittsburgh textile-loom), mill with
      40 columns of 8-digit registers. Occupies the rear half of
      the library car. Mechanically: dormant. When the crew needs
      it — a cryptographic puzzle, a schedule optimization, a
      counterfeit-detection computation — the narrator may enable
      it as a permanent +4 CUNNING resource at the cost of 1 Luck
      (the engine takes Tabitha a full week to reconfigure).
    practicality: 0.25
    absurdity: 0.7
    danger: 0.15
    real_science_citation: >-
      Charles Babbage, Analytical Engine, designed 1837, never
      completed. Ada Lovelace's Notes on Menabrea's paper, 1843
      (first published algorithm, for Bernoulli numbers).
      Jacquard loom punched-card program input, 1804. Henry
      Babbage assembled partial mill 1888. Scheutz difference
      engine built 1843 and sold 1856 — the proof of concept.
    world_weaponization: []
    payoff_seed: true
