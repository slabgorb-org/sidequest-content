cover_poi: the_workshop_car_at_four_in_the_morning
name: The Real McCoy
slug: the_real_mccoy
genre: spaghetti_western
tagline: "He makes wonders. The world makes weapons."
description: >-
  Pittsburgh, 1878. The sky is "hell with the lid taken off," the mills run
  day and night, and a quiet physician-engineer named Dr. Granville McCoy
  travels the rails in an armored Pullman workshop making devices nobody else
  thinks to build. He never means any of them for harm. The world has other
  ideas. Rivals copy his designs; the War Department wires from Washington;
  an apprentice who stole the plans keeps selling them out of Paris. Between
  Raubritter Concern's paid press, Pinkerton men at the rail yards, and the
  rumor of manlike automata walking the Strip District, the crew around the
  train is the closest McCoy has to a firing pin on a weapon that keeps
  going off in other people's hands.

era: 1878
setting: "Pittsburgh metropolitan, Allegheny County, Pennsylvania"
starting_region: downtown
time_anchor: "spring 1878, coal-smoke inversion season"
