    description: Three hundred acres of rolling ground on Penn Avenue, chartered 1844, the second rural
      cemetery in the country after Mount Auburn. Stephen Foster has been buried here since 1864; the
      family plot is in Section 8 with a carved lyre on the headstone. Weeping willows, broken-column
      obelisks, draped-urn monuments, a pair of cast-iron lions at the gatehouse. Sunday picnics are general;
      courting couples keep to the upper lanes. Adelaide Sayre McCoy is not buried here — her grave is
      in Lancaster County, at the Quaker meeting — but the doctor has a marker in Section 11 with her
      name on it and no dates.
  st_mary_of_the_mount:
    name: St. Mary of the Mount
    region: mount_washington
    visual_prompt: >-
