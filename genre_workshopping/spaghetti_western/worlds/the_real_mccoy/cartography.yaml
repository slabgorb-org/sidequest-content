  monongahela_house:
    name: The Monongahela House Hotel
    region: downtown
    visual_prompt: >-
      the_real_mccoy, a five-story Italianate red-brick hotel at the
      downtown corner of Water and Smithfield in late afternoon, wrought-iron
      balconies at each of the four upper floors with ornamental scrollwork,
      tall round-arched windows with dark green shutters flanking each
      balcony, a gaslit portico of four cast-iron Corinthian columns at
      the ground floor entrance with a scripted MONONGAHELA HOUSE sign
      across the entablature, cream sandstone trim at the cornice and
      window surrounds darkened by soot and weathered to charcoal at the
      rainline, a liveried Black porter in a green frock coat and gold
      epaulettes standing at the door with white-gloved hands folded at
      his waist, a horse-drawn hansom cab with a glossy bay horse waiting
      at the curb, a gaslight standard at the corner, coal-smoke sepia
      sky above with a Brush arc-lamp just visible at the cross-street.
    description: Five stories of Italianate brick at Water and Smithfield, two blocks from the Point.
      Opened 1847, rebuilt in 1859 and again after the 1877 fire damage. The all-Black staff — front desk,
      bellhops, porters, waiters, laundresses, and the kitchen in its entirety — are the household's informal
      signals corps. Mr. Absalom Teague, head porter, runs the signals. The grand parlor is papered in
      a hand-blocked French print of the Rhine; the dining room seats one hundred and sixty and is filled
      on Saturday nights; the press-room in the basement prints the McCoy Industries broadsides on a Hoe
      Type Revolving press the hotel bought secondhand from the Post. McCoy keeps a suite on the third
      floor for the nights when the train is away and he is not.
  the_duquesne_incline:
    name: The Duquesne Incline
    region: mount_washington
    visual_prompt: >-
      the_real_mccoy, a thirty-degree funicular railway climbing an
      eight-hundred-foot cliff face at dusk, two cherry-wood passenger
      cars with polished brass fittings and gaslit interior lamps — one
      cresting the upper ridge and one descending the lower track on the
      balance cable — running on a pair of heavy steel rails, a brick-and-timber
      engine house at the lower station beside Carson Street with two
      lit gas windows and a small ticket kiosk, a one-legged veteran
      operator with a crutch at the upper station door in a blue wool
      coat, a frame observation pavilion at the upper ridgetop station
      with a railing and a glass-panelled gable, coal-smoke sepia sky
      behind darkening to indigo at the zenith, the Monongahela river
      valley visible in the cleft between the cars with gaslamp pinpricks.
    description: Diescher's 1877 funicular from Carson Street on the South Side to Grandview Avenue on
      Mount Washington. 30-degree grade, 800- foot rise, cherry cars with brass fittings and gas lamps.
      The lower station is a brick-and-timber building with an engine house; the upper station is a frame
      pavilion with an observation deck. The fare is five cents. The operator's shift is twelve hours
      and the operator this season is a one-legged veteran of the 2nd Pennsylvania Heavy Artillery named
      Jonas Bick, who reads the Commercial Gazette between runs and does not miss a face on either car.
  edgar_thomson_works:
    name: Edgar Thomson Steel Works
    region: braddock
    visual_prompt: >-
      the_real_mccoy, the Edgar Thomson Bessemer steelworks at night seen
      from across a wide Monongahela river bend, four blast furnaces
      lined along the south riverbank with their stacks crowned in orange
      flare and sparks rising in a steady column, a converter house
      mid-blow throwing a minutes-long geyser of orange sparks against
      a pure coal-black sky, a rolling-mill building with long corrugated
      shed roofs running parallel to the river, a three-story office
      block of cream sandstone set back behind a low brick wall, a muddy
