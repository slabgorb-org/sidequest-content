# The Real McCoy — World Cartography
# Pittsburgh metro + the train (rolling HQ) + landmarks
# Merged from cartography_poi_prose.yaml (writer) + structural adjacency (world-builder)

world_name: The Real McCoy
starting_region: downtown
map_style: 'Hand-tinted photograph-over-topographic-survey of Pittsburgh 1878: coal-smoke sepia atmosphere,
  brass compass rose, three rivers rendered in iron-gall ink, incline railways marked with dashed lines,
  rail yards in crosshatched plate, German-Fraktur labels for Allegheny City districts, Currier & Ives
  lithographic border trim, ''Pittsburg'' spelled without the ''h'' per period convention.'
regions:
  the_point:
    name: The Point
    summary: Where the Monongahela joining the Allegheny forms the Ohio.
    terrain: river confluence, rail-yard
    visual_prompt: >-
      the_real_mccoy, a wide river confluence at dawn where two rivers
      merge into a third, four- and five-story red-brick warehouses
      crowding both banks with crosshatched rail yards on the right bank
      running north along the Allegheny, three coal barges moored two-deep
      at a timber wharf on the left with a tugboat easing a fourth into
      position, a fog_grey_white layer pressing low on the water with a
      coal-smoke inversion layer hanging above it, the two layers not
      quite mixing, three gaslamps still burning at the piers of a low
      iron truss bridge in the middle distance and doubled in the water,
      a small brick Fort Pitt blockhouse foundation visible at the near
      waterline, the Duquesne Incline cable visible against the far cliff
      face, gulls circling over the warehouse roofs, coal-smoke sepia sky.
    description: Where the Monongahela joining the Allegheny forms the Ohio. The old Fort Pitt brick is
      visible at low water under the fill. Rail yards and coal wharves crowd both banks; warehouses stand
      four and five stories tall in the smoke. At dawn the river-fog lies in the valley like cotton batting
      and the coal-smoke inversion lies above it, the two layers not quite mixing, and the gaslamps burn
      on the bridges well past ten. At dusk the Bessemer flare from Edgar Thomson throws orange onto the
      undersides of the clouds. The Duquesne Incline cable ticks rhythmically against its pylon on the
      far south bank. Trinitarians call it a cosmogram. Catholics call it a baptismal font. Stevedores
      call it the dumping ground. All three are right.
    adjacent:
    - strip_district
    - downtown
    - allegheny_city
    - mount_washington
    - braddock
  strip_district:
    name: The Strip District
    summary: A half-mile strip between the Allegheny wharf and the bluff, running northeast from the Point
      along Liberty and Penn Avenues.
    terrain: industrial wharf
    visual_prompt: >-
      the_real_mccoy, a wide cobblestone avenue at dawn between the
      Allegheny river wharf and a rising bluff, three rows of produce
      stalls under striped canvas awnings along the right curb stacked
      with crates of apples, cabbages, and potatoes, three-story red-brick
      wholesale houses with heavy timber awnings on the left flank, a
      brewer's pair of heavy German draft-horses in harness at a beer
      dray at centre-curb with wooden kegs stacked three-high on the
      flatbed, streetcar rails embedded in wet cobblestone running down
      the centre, gaslight standards every sixty feet along both curbs,
      five Irish and German labourers in flannel shirtsleeves and wool
      waistcoats in the middle distance unloading a crate, faint butcher's
      smoke curling from a chimney four blocks down, a single streetcar
      approaching in the far distance, coal-smoke sepia sky.
    description: A half-mile strip between the Allegheny wharf and the bluff, running northeast from the
      Point along Liberty and Penn Avenues. Produce markets from four in the morning, in Italian and German
      and Polish and English; slaughterhouses at 16th Street, venting the smell of hog down the river
      breeze; Irish laborers with flannel shirts and heavy wool trousers, German brewers in loden jackets
      with leather suspenders, Czech and Polish men just beginning to arrive in numbers and board in the
      flats. A streetcar every ten minutes on Liberty Avenue; a coal dray every five. The Eberhardt &
      Ober brewery wagon passes at noon with the shift-change beer. The Strip is four languages before
      breakfast and three religions before Sunday dinner.
    adjacent:
    - the_point
    - downtown
    - lawrenceville
    - allegheny_city
  hill_district:
    name: The Hill District
    summary: The ridge running east from Downtown, climbing steeply from the Lower Hill at Wylie Avenue
      into the Upper Hill toward Arthursville.
    terrain: urban residential, mixed-ethnicity
    visual_prompt: >-
      the_real_mccoy, Wylie Avenue climbing a steep ridge in late afternoon,
      close-packed two- and three-story red-brick rowhouses with painted
      wooden stoops and tall narrow windows flanking both sides of the
      cobblestone street, Bethel AME's red-brick facade and white bell
      tower rising a block ahead at the crest with its double front
      doors standing open, three Black professional men in frock coats
      and stovepipe hats walking an uneven plank sidewalk on the right,
      a Black woman in a mourning-jet bonnet passing on the opposite
      walk with a market basket, a white-haired Black lamplighter in
      shirtsleeves and leather apron reaching a gaslamp with a long
      brass pole at the left-foreground curb, damp cobbles reflecting
      the first amber, a barbershop pole and a mercantile sign visible
      on the ground-floor storefronts, coal-smoke sepia sky above.
    description: 'The ridge running east from Downtown, climbing steeply from the Lower Hill at Wylie
      Avenue into the Upper Hill toward Arthursville. The Black professional and working community is
      settled along Wylie: barbershops, tailors, physicians, teachers, and the rising entrepreneurial
      class whose sons will attend Lincoln University. Bethel AME on Wylie Avenue is the axis. The Allegheny
      Argus is above the mercantile a block down. Prince Hall Doric No. 18 meets two blocks over. The
      houses are frame and brick, closer-packed on the Lower Hill, with gardens in the Upper. The Irish,
      Italian, and Jewish arrivals live alongside and do not always share streets with. A dispensation
      of mutual wariness and a decade-long working accommodation.'
    adjacent:
    - downtown
    - lawrenceville
  lawrenceville:
    name: Lawrenceville
    summary: North and east of the Strip along the Allegheny.
    terrain: industrial
    visual_prompt: >-
      the_real_mccoy, a riverside industrial district in late afternoon,
      long Civil-War-era red-brick arsenal workshop walls with crenellated
      iron gates on the right of a wide cobblestone street, padlocked
      yards visible through the gates with empty timber munitions racks,
      a tall Lucy Furnace Bessemer smokestack with an orange flare crown
      rising above a stand of elms in the middle distance, a gothic
      wrought-iron Allegheny Cemetery gate at the end of the block with
      two cast-iron lions flanking the entrance, a carved lyre headstone
      under three weeping willows visible beyond the gate, two-story
      red-brick workers' rowhouses along the river bluff on the left with
      vegetable gardens visible behind, a flagpole on the arsenal parade
      ground beyond, coal-smoke sepia sky.
    description: North and east of the Strip along the Allegheny. The Allegheny Arsenal grounds lie between
      39th and 40th Streets, the buildings Civil-War-era brick, the shops quieter than they were in '63,
      winding down from the munitions peak. The Lucy Furnace (Carnegie) stands at 51st Street, visible
      for a mile up the river by its plume alone; Isabella is across the water at Etna. The Allegheny
      Cemetery runs on 300 acres of rolling ground east of the arsenal — rural-cemetery planting, Stephen
      Foster buried since 1864, the broken-column obelisks and weeping willows are a Sunday destination
      for courting couples who have read Mount Auburn in the pages of Godey's.
    adjacent:
    - hill_district
    - east_liberty
    - strip_district
  allegheny_city:
    name: Allegheny City
    summary: Across the Allegheny River, a separate city until the 1907 consolidation.
    terrain: independent municipality
    visual_prompt: >-
      the_real_mccoy, a wide street view across an iron suspension bridge
      from a neighboring city into German Deutschtown, East Ohio Street
      running away from the viewer, three-story red-brick row-houses with
      painted Fraktur shop-signs on the ground-floor storefronts flanking
      both sides, a grey stone Western Penitentiary wall with a dry moat
      closing the far end of the avenue, a narrow four-story brick
      storefront at 610 Arch on the right with a printer's sign on the
      upper floors and amber lamplight in the tall windows, a Rodef Shalom
      synagogue dome visible three blocks west above the rooflines, two
      gaslight standards every sixty feet along the curbs, a horse-drawn
      cart crossing the bridge deck in the middle distance, coal-smoke
      sepia sky above.
    description: Across the Allegheny River, a separate city until the 1907 consolidation. Sixth Street
      Bridge and Seventh Street Bridge cross from the Point and from Downtown; the toll is two cents either
      way. Deutschtown — the East End — runs along East Ohio Street, German in street-sign and window-sign
      and church. The Western Penitentiary (1826) stands on Ohio River Boulevard, grey stone and a dry
      moat. Federal Street climbs north from the river through the German commercial core to 610 Arch,
      the Bible House, where C. T. Russell's Watch Tower will be printed starting July 1879. Miss Semple's
      Academy is on Stockton Avenue. The Rodef Shalom first synagogue was dedicated in 1862 three blocks
      west — the first synagogue west of the Alleghenies.
    adjacent:
    - the_point
    - strip_district
    - downtown
  south_side:
    name: The South Side (Birmingham)
    summary: The south bank of the Monongahela, flat ground between the river and the base of Mount Washington's
      cliff.
    terrain: industrial flats
    visual_prompt: >-
      the_real_mccoy, a riverside ironworks at dusk on flat ground beneath
      a four-hundred-foot Mount Washington cliff face, two blast-furnace
      stacks of Jones & Laughlin's Eliza and Clinton furnaces venting
      orange flare against the dark cliff rising behind, three Welsh
      puddlers in scorched leather aprons and flat cloth caps working
      long iron rods at a tuyere opening at the casting pad, a bottom-poured
      ingot glowing white-hot on the casting floor with heat-shimmer
      visible above it, a row of coke-laden flatcars on a siding on the
      right, close-packed two-story wooden-frame workers' houses with
      vegetable patches behind the mill at far right, a line of Czech
      and Polish workers at shift change crossing a plank walkway,
      wet cobblestones in the foreground reflecting furnace-orange, a
      Smithfield Street Bridge truss visible at the far left.
    description: The south bank of the Monongahela, flat ground between the river and the base of Mount
      Washington's cliff. Jones & Laughlin's Eliza Furnace and Clinton Furnace (1859) dominate the wharf.
      The Welsh puddlers work the tuyeres at the Eliza; they sing at the blow and they die young. Czech
      and Polish men are beginning to take the worst of the casting-floor jobs. The houses are two- story
      frame, close together, with vegetable patches behind; the smell of cabbage and kielbasa and sulphur
      hangs in the air in varying proportions depending on wind. St. Adalbert's Polish Catholic parish
      keeps the Sunday masses that matter. The Smithfield Street Bridge crosses to Downtown at the north
      end; the Monongahela Incline climbs to Mount Washington behind.
    adjacent:
    - downtown
    - mount_washington
  mount_washington:
    name: Mount Washington (Coal Hill)
    summary: Four hundred feet above the Monongahela, an almost-cliff that forced the city's vertical
      transit to evolve into the inclines.
    terrain: ridgetop
    visual_prompt: >-
      the_real_mccoy, a panoramic ridgetop overlook at dusk four hundred
      feet above the Monongahela river valley, a cherry-wood Duquesne
      Incline funicular cable-car cresting the summit on a thirty-degree
      grade at the lower-right with its gaslit interior glowing amber, a
      red-brick German-Catholic St. Mary of the Mount church with a
      gothic spire and an openwork bell tower on the left at the crest
      of Grandview Avenue, the Pittsburgh city valley spread below with
      thousands of gaslamp pinpricks along three rivers, a distant orange
      Bessemer flare at Edgar Thomson bleeding through the haze on the
      far horizon, the iron trusses of the Smithfield Street Bridge
      visible at middle-left, coal-smoke haze thickening the middle
      distance into fog-grey-white, deep amber-to-indigo sky above.
    description: Four hundred feet above the Monongahela, an almost-cliff that forced the city's vertical
      transit to evolve into the inclines. St. Mary of the Mount (1861, German Catholic) stands at the
      summit, bell visible and — in an east wind — audible across the river; a pilgrimage climb for South
      Side Catholics of a Sunday. The Monongahela Incline (1870) climbs from Carson Street; the Duquesne
      Incline (1877) climbs from a pair of blocks west on the same bank, Diescher's work, 30-degree grade,
      800-foot rise, cherry cars with brass fittings. From the Grandview overlook the entire river valley
      glitters at night with gaslamp, Bessemer flare, and — after the 1879 Brush rollout — the first arc
      lights.
    adjacent:
    - the_point
    - south_side
  downtown:
    name: Downtown / Fifth Avenue
    summary: The triangle between the rivers.
    terrain: commercial core
    visual_prompt: >-
      the_real_mccoy, a wide Fifth Avenue commercial avenue at midday,
      cream sandstone Italianate bank and hotel facades darkened by soot
      on both sides, wrought-iron balconies at each of five storeys on
      the Monongahela House hotel on the left, tall arched windows with
      dark green shutters down the right-side facades, streetcar rails
      on iron tracks down the centre of the street, a horse-drawn coal
      dray passing in the near-middle distance with a passenger streetcar
      following fifty feet behind, gaslight standards every sixty feet
      along both curbs, a Brush arc-lamp experimental standard at the
      far corner intersection, two newspaper-boys in flat caps with
      broadsheets held up and calling from the foreground corner, a
      liveried doorman at the hotel portico in a green frock coat, coal-smoke
      sepia sky above.
    description: The triangle between the rivers. Banks on Fourth Avenue, papers on Smithfield and Wood,
      the Monongahela House hotel at Water and Smithfield, two blocks from the Point. Union Station is
      being rebuilt — the old one went in the Roundhouse Riot of '77 — the paint still curing on the replacement.
      The courthouse sits on Grant Street beside the county jail. St. Paul's Cathedral rises five blocks
      east. The Pittsburg Leader's offices are over the Wood Street mercantile; the Commercial Gazette's
      are one street over; the Dispatch is three blocks south; the Post is two blocks west. Gaslamps on
      every corner, Brush arc rollout expected by autumn '79. The streetcar lines converge on Fifth Avenue
      and run out to every neighborhood.
    adjacent:
    - the_point
    - hill_district
    - strip_district
    - east_liberty
    - south_side
    - allegheny_city
  east_liberty:
    name: East Liberty / Shadyside / Homewood
    summary: Four miles east of the Point on the streetcar line, old-money country.
    terrain: bourgeois residential
    visual_prompt: >-
      the_real_mccoy, Ellsworth Avenue in late afternoon rain, Second-Empire
      mansard-roofed red-brick mansions set back forty feet behind
      wrought-iron fences and lamp-topped gateposts on both sides of a
      wide cobblestone street, mature sycamores and magnolias along the
      verge with leaves dark with rain, a red-brick coachman's quarters
      visible at the rear of the near lot with its own small stable yard,
      a black closed carriage with two matched bay horses waiting at a
      carriage sweep on the right, cream sandstone facades softened by
      mist and flaked at the upper cornices, a Krupp-iron fence painted
      forest green with ornate finials enclosing the middle-ground
      courtyard with two potted fig trees flanking its gate, gaslamps on
      tall iron standards already lit and doubled in puddles, a coachman
      in a long caped coat at the reins.
    description: Four miles east of the Point on the streetcar line, old-money country. Mansarded brick
      and stone houses set back from Ellsworth and Fifth, mature sycamores and magnolias, iron fences,
      a coachman's quarters at the rear of every second lot. The Raubritter city residence is on Ellsworth
      at Negley, Second- Empire brick with a Krupp-iron fence painted forest green. Homewood Cemetery
      is chartered as of 1878 and will open its gates to burials in 1880; the cemetery architect has laid
      out the lanes and the first monuments are being cut at Pittsburgh granite-works this spring. The
      Mellons are four blocks east. The Carnegies, when they are in town, are five blocks south.
    adjacent:
    - downtown
    - lawrenceville
  braddock:
    name: Braddock
    summary: Seven miles east of the Point by the Pennsylvania Railroad main line.
    terrain: industrial
    visual_prompt: >-
      the_real_mccoy, the Edgar Thomson Steel Works at night on a wide
      Monongahela river bend, two Bessemer converter vessels tipped and
      throwing a minutes-long geyser of orange sparks against a pure
      coal-black sky, four blast furnaces lined along the south riverbank
      with their stacks venting orange flare at their crowns, a rolling
      mill with long shed roofs on the right, a glowing steel rail
      rolling slow on the hot line in the middle ground with steam rising,
      a string of coke-laden flatcars on a siding at the far left, a
      muddy hiring yard under the lee of No. 2 Blast Furnace on the left
      with loose rows of waiting men, an office block of cream sandstone
      set back behind a low brick wall, water reflecting furnace-orange
      along the wharf, molten metal glow on wet cobblestones in the
      foreground.
    description: Seven miles east of the Point by the Pennsylvania Railroad main line. The Edgar Thomson
      Steel Works (Carnegie, 1875) dominates the south bank of the Monongahela on a bend where the river
      widens and the flats carry four furnaces and a Bessemer converter house. The first Bessemer heat
      was blown 22 August 1875. Capt. Bill Jones is superintendent. Frick coke arrives by the Pittsburgh,
      McKeesport & Youghiogheny Railroad from the Connellsville field. The hiring line forms under the
      lee of No. 2 Blast Furnace and, when the foreman's glass is in use, the line moves slowly and the
      rejected men walk back to town along the railroad grade without speaking. The town itself is a mile
      of clapboard boarding houses, two saloons, a Slovak Catholic parish beginning construction, and
      a brick Methodist chapel.
    adjacent:
    - the_point
  the_train:
    name: The Train
    summary: A private six-car train commissioned from Pullman's Detroit shops in 1874.
    terrain: rolling HQ
    visual_prompt: >-
      the_real_mccoy, a private six-car train parked at a rail siding at
      dusk, a matte-black Baldwin 4-4-0 locomotive with polished brass
      fittings, a varnished walnut cab, and a brass nameplate reading
      MCCOY INDUSTRIES on the running board at the head, a tall diamond
      stack with a steam plume drifting from it, six trailing Pullman-type
      cars in mahogany with brass railings and small gold-leaf lettering
      on the flanks ordered engine-boiler-workshop-armory-study-library-observation-caboose,
      coal-smoke drifting along the rooflines, a single Brush arc-lamp
      standard casting hard white light on the yard from the far left
      with crushed coal-black shadows beneath the trucks, a yard switcher
      idle on a parallel track, a brick yard office visible in the far
      background with amber lamplight in its windows, a nightwatch
      lantern swinging along the consist.
    description: A private six-car train commissioned from Pullman's Detroit shops in 1874. Baldwin 4-4-0
      locomotive in matte black, with the brass nameplate MCCOY INDUSTRIES on the running board. Six-wheel
      trucks with elliptical leaf springs. Mahogany and walnut interiors with brass throughout. Pintsch
      gas lighting (adopted '77 on a pre- order through a Hamburg agent) supplementing kerosene. Baker
      coal stoves in the passenger cars; steam heat piped from the locomotive when stationary long enough.
      The household's home and laboratory and field HQ. Runs the Pittsburgh, Fort Wayne & Chicago main
      and branches; PRR Pittsburgh Division with rights; B&O Pittsburgh Branch with advance notice. The
      car graph below reads forward-to-aft.
    adjacent: []
train_cars:
  engine:
    name: Engine
    visual_prompt: >-
      the_real_mccoy, interior of a Baldwin 4-4-0 engineer's cab, a
      bronze-and-walnut pressure-gauge panel on the forward bulkhead
      with three brass-rimmed dials and a water-glass sight tube between
      them, a brass steam-whistle pull cord overhead threaded through a
      ceiling bracket, the iron firebox door cracked open on the lower
      left glowing bessemer_orange with coal visible in the grate, the
      engineer in a striped blue-denim jacket and flat cap at the right-hand
      controls with one hand on the Johnson bar, the fireman in shirtsleeves
      and leather gauntlets on the left bent to the tender with a
      long-handled coal shovel, coal dust settled on every surface, a
      hanging oil lantern on a hook over the right window, a small
      brass plate stamped BALDWIN LOCOMOTIVE WORKS PHILADELPHIA on the
      backhead, warm amber over polished brass.
    description: A Baldwin 4-4-0 of 1871 vintage, rebuilt at the Altoona Shops in 1876 with McCoy's own
      additions — a Planté-cell auxiliary bank in the tender for starting the dynamo, a set of pressure
      gauges in a bronze-and-walnut panel that the engineer regards with suspicion, and a brass steam
      whistle that plays three notes in rising thirds because McCoy cannot help himself. Engineer Silas
      Proctor, three years in service, has learned not to comment.
    adjacent:
    - boiler_car
  boiler_car:
    name: Boiler Car
    visual_prompt: >-
      the_real_mccoy, interior of a converted coal tender, bulk coal
      heaped forward to a timber plank divider reaching chest height,
      the aft half of the car fitted with a bank of twenty-four tall
      glass-jar Planté wet cells arranged in three rows of eight in a
      polished walnut rack with brass terminals at each cell top and
      black rubber insulator pads beneath, dilute sulfuric electrolyte
      visible at half-fill in every jar with faint green oxide at the
      lead plates, a Gramme ring dynamo on a cast-iron frame at the far
      end with a drive-belt running down to a flywheel, a copper bus-bar
      running the length of the overhead and tapping each cell row with
      insulated leads, a single gaslight burning through a frosted roof
      skylight, the faint smell of ozone suggested by a thin vapor curl
      above the cells, warm amber on polished wood and brass.
    description: Coal tender with a capacity of eight tons and — below the coal — a Planté-cell bank of
      twenty-four cells in a glass-walled rack, dilute sulphuric acid, the smell of ozone faint when the
      dynamo is running. Auxiliary Gramme ring dynamo, Viennese build, driven off a belt from a siding-mounted
      donkey engine when the train is parked. Recharges the workshop benches, the medical car autoclave,
      and Prudence.
    adjacent:
    - engine
    - workshop
  workshop:
    name: The Workshop
    visual_prompt: >-
      the_real_mccoy, interior of a rolling laboratory car thirty feet
      long, long polished walnut benches with iron-strap edges running
      the full length of both walls, a brass microscope on a gimbal
      mount on the left bench with a specimen slide clipped in place,
      a Crookes tube glowing faint violet in a walnut cradle on the
      right bench with copper leads running to a Planté-cell tap, a lit
      acetylene brazing torch on a ceramic pad beside a fine-jaw iron
      vise, three coils of gutta-percha insulated wire on an iron hook,
      a rack of hand tools — calipers, a parallel-rule, two pliers, a
      jeweler's hammer — mounted above the left bench, a drafting board
      on the end wall with three pinned blueprints and a T-square laid
      across, a small Franklin stove at the aft end venting through the
      roof with a coal scuttle beside it, a work coat on a peg by the
      door, gaslight amber overhead with a violet corona at the tube.
    description: Thirty feet of Pullman-length car converted to laboratory. Brass microscope on a gimbal
      mount. A Crookes tube humming violet in a walnut cradle. Acetylene brazing torch on a ceramic pad.
      Gutta- percha wire in coils. Three benches; the drafting board on the fourth wall; a Franklin stove
      at the aft end venting through the roof. Coal-smoke sepia light by day; Jablochkoff-candle flare
      by night when the doctor wants real illumination. The door into the boiler car is tight-seal against
      acid vapor. The door into the armory is double-locked; Tabitha keeps one key.
    adjacent:
    - boiler_car
    - armory
  armory:
    name: The Armory
    visual_prompt: >-
      the_real_mccoy, interior of a narrow armory car, mahogany-panelled
      walls to a chair-rail with dark walnut above, wall racks on both
      sides holding brass-and-walnut mechanical instruments — a compressed-air
      stun-rifle in a vertical clip, a Faraday-cage net-thrower, a
      resonance-harmonic tuning-fork weapon in a padded cradle, two
      hydraulic field splints racked horizontally — each catalogued on
      an engraved brass plate with a serial number, six wrought-iron
      crates bolted to the plank floor holding ammunition and compressed-air
      tanks, two Spencer repeating carbines on a forward rack, a locked
      steel cabinet mortared into the forward bulkhead, a framed Currier
      and Ives print of the Horseshoe Curve hanging above the cabinet,
      a single gaslight on a swiveled brass sconce throwing hard shadows,
      a chart of the train's car graph pinned to the rear door, cool
      cemetery-slate undertone throughout.
    description: A narrow car between the workshop and the study. Racked McCoy hydraulic field splints;
      crated fluoroscope monocles the household has reclaimed; a hoop of gutta-percha-insulated electrical
      cable; two Spencer repeating carbines on a rack the doctor does not like to look at; a locked steel
      cabinet holding the devices the household will not publish and will not sell. Tabitha's ledger-safe
      is mortared into the forward bulkhead, under a Currier & Ives print of the Horseshoe Curve.
    adjacent:
    - workshop
    - study
  study:
    name: McCoy's Study
    visual_prompt: >-
      the_real_mccoy, interior of a private drafting-room car, mahogany-and-walnut
      panelling on every wall to a coffered ceiling, a large draftsman's
      table at centre with a brass T-square and a parallel-rule laid
      across an unrolled blueprint of a splint mechanism, a side desk
      on the right with neat stacks of correspondence tied in red ribbon,
      a green-shaded banker's oil lamp at the desk's near corner pooling
      warm amber across the blotter, a globe on a brass stand in the
      corner showing the Indian Territory turned forward, floor-to-ceiling
      bookshelves behind the desk filled with leather-bound volumes —
      gilt-spined Verne novels, Maxwell's Treatise on Electricity and
      Magnetism, Babbage's Passages from the Life of a Philosopher, a
      King James Bible flat on the top shelf — a small framed daguerreotype
      of a young woman in 1860s dress angled toward the chair, a brass
      loupe and iron-gall ink stains on the blotter, a telegraph-key on
      the forward end of the side desk, warm gaslight amber on mahogany.
    description: 'Mahogany panelling, a green-shaded banker''s lamp, a globe that still has the Indian
      Territory on it. Bookshelves: Verne''s voyages in leather; Maxwell''s Treatise on Electricity and
      Magnetism; Babbage''s Passages from the Life of a Philosopher; a first edition of Ada Lovelace''s
      notes on Menabrea; a King James Bible Adelaide gave the doctor the day they were married, Proverbs
      31 marked. A cabinet photograph of Adelaide at nineteen sits angled so only the doctor sees it from
      his chair. Tabitha''s desk at the fore end runs logistics; the telegraph key clacks through the
      bulkhead from the workshop. The Morocco ledger of Weaponizations lives in the safe behind a painted
      panel.'
    adjacent:
    - armory
    - library
  library:
    name: The Library
    visual_prompt: >-
      the_real_mccoy, interior of a reading-and-research rail car,
      floor-to-ceiling mahogany bookcases running both walls with a
      brass rail along the third shelf at hand height, bound volumes of
      scientific periodicals in green cloth stamped SCIENTIFIC AMERICAN
      and PATENT OFFICE GAZETTE on the lower shelves, the Allegheny Argus
      and the Pittsburg Leader folded on a side table, a brass-stand
