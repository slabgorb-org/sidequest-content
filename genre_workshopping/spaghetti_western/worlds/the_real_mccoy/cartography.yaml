  allegheny_cemetery:
    name: Allegheny Cemetery
    region: lawrenceville
    visual_prompt: >-
      the_real_mccoy, a wide rural cemetery in late afternoon overcast,
      three hundred acres of rolling mown lawns dotted with broken-column
      obelisks, draped-urn monuments, and low slate markers, three mature
      weeping willows trailing long branches over a carved stone lyre
      headstone at centre with the name FOSTER cut into the base, a
      cast-iron gatehouse with a pair of seated bronze lions flanking
      the entrance arch at the far end of a gravel carriageway lined
