# The Real McCoy — Deep History (Legends)
# Told in the register of the city that tells them: Pittsburgh barrooms,
# Hill District pulpits, Braddock blast-furnace yards, Strip District
# kitchens, and the Workshop Car at three in the morning.

- id: the_night_the_roundhouse_burned
  name: The Night the Roundhouse Burned
  era: "July 21, 1877"
  description: >-
    The story, as the Edgar Thomson blowing-mill tells it, is this. A crowd
    of three hundred had burned Union Station and was headed up the 28th
    Street yards with torches and the idea of every locomotive going the
    same way. McCoy's train was in the yards. Cap'n Bill Jones had ridden
    down from Braddock without an order from the superintendent and without
    a man who wasn't his own. He stepped into the torchlight at the yard
    gate and he did not draw. He called four men by name. He shared a
    flask. He walked the torch-party out of the yard by a route that took
    them past the roundhouse gates on the way to the courthouse fire. The
    roundhouse burned. One hundred and four locomotives went with it. The
    train did not. At dawn McCoy and Jones drank coffee brewed on a coal
    shovel by a nightwatchman who went home and did not tell his wife
    about it for three years. McCoy said "I owe you more than a drink."
    Jones said "We'll settle up as we go." The coal shovel is propped
    in the corner of the Edgar Thomson blowing-mill foreman's office,
    behind the door. It has not been used for coal since. The two
    coffee cups are on the same shelf, washed, upside down.

- id: the_leak
  name: The Leak
  era: "November 1876"
  description: >-
    Silas Markham was twenty-three and McCoy's apprentice of nine years
    and the one the doctor trusted with the master drawings. He had been
    sleeping in the drafting room because the rent on his boarding-house
    in Lawrenceville was past-due and the doctor had told him there was
    no need to pay rent when the drafting room had a sofa. The last man
    to see him in Pittsburgh was the Monongahela House night clerk, who
    signed for a trunk at two in the morning. The next person who saw
    him recognized him from a carte-de-visite was a porter on the Cunard
    steamer out of New York. He sent the doctor a wire from the Gare du
    Nord in January with an apology that used the word "unforgivable"
    three times and asked after Tabitha. The doctor has never publicly
    accused him of anything. He has never stopped writing back. The
    cipher is the one he taught the boy. Every time a new replicant
    turns up wearing one of the tells Markham would have put in — a
    left-hand grip a degree too strong, a too-steady pulse at the wrist
    in fever — the doctor goes into the Study and closes the door and
    nobody asks what he is thinking. On the desk in the Study, inside
    the green pasteboard folder marked only *S.M.*, are forty-one
    letters from Paris in a hand the doctor taught, and forty-one
    carbons of his replies in his own.

- id: the_making_of_prudence
  name: The Making of Prudence
  era: "Winter 1874"
  description: >-
    Tabitha was twelve and had been running fever for eight weeks and
    the three physicians McCoy had consulted had all given different
    diagnoses and none of the three had given her mother's. The doctor
    closed the Workshop Car and did not come out for thirteen weeks.
    Markham brought him meals. Tabitha, from her bed in the Passenger
    Quarters, heard the lathe and the brazing torch and the soft voice
    in German when the doctor talked himself through a problem. What
    came out of the Workshop Car when it opened again was a woman of
    about twenty-five, in a plain dark dress, with a voice like a new
    cello, and a memory that did not need a notebook. She took
    Tabitha's hand and sang to her in the Pennsylvania Dutch her
    mother had sung. The fever broke in four days. When Tabitha was
    well, Prudence stayed. She has never not been there. She was named
    from the King James — it was Tabitha's choice, from the same verse
    Adelaide had underlined in the family Bible, and the doctor wept
    for the first time since the burial when his daughter said the
    name. The underlined verse is Proverbs 8:12. The Bible sits on the
    Study shelf between Maxwell and Babbage, and the pencil mark in
    the margin is still legible.

- id: the_etheric_vapor
  name: The Etheric Vapor
  era: "1872 onward"
  description: >-
    The tale as the downtown barrooms tell it is that Mr. John Worrell
    Keely of Philadelphia has discovered a new force in nature, "etheric
    vapor," that will drive a locomotive for a fortnight on a quart of
    tap water, and that a demonstration office for his motor company
    has opened in Pittsburgh in the second floor over the Sixth Avenue
    pharmacy, financed — though not in his own name — by Herr Doktor
    Raubritter. Investors have been taken through by appointment. The
    machine whistles. The machine trembles. The machine sometimes runs
    a brass flywheel that was not connected a moment ago. The machine
    has never been taken apart in the investor's presence. McCoy was
    invited by Raubritter's secretary in the summer of 1878 and went
    once, out of what he called "professional courtesy," and sat through
    the demonstration with his hands folded on the head of his cane and
    a mild smile and asked at the end whether the gentleman might
    consent to a single valve being opened. The gentleman declined.
    McCoy thanked him and left. The Allegheny Argus ran a column the
    following week under the headline *Our Doctor's Silence*. The
    Pittsburg Leader replied two days later by calling McCoy a
    mechanical materialist. Keely is on his fourth round of
    subscriptions. The Sixth Avenue office has taken on a second
    clerk.

- id: the_argus_and_the_ironmonger
  name: The Argus and the Ironmonger
  era: "1861-1862"
  description: >-
    The Allegheny Argus is not as old as the Christian Recorder and not
    as old as the Pittsburgh Commercial Gazette but it is old enough.
    Mordecai Carrington tells the story this way in the Bethel vestibule
    when a visiting preacher asks. The paper was founded in the second
    year of the war by his father, Josiah Carrington, then a Hill
    District barber-shop proprietor, with a hand-press borrowed from
    a white ironmonger named Thaddeus Ackerley who had taken three of
    Josiah's barbering customers to freedom by way of his foundry
    attic and had never once said so aloud. Ackerley was killed at
    Gettysburg in July of '63, in a regiment he volunteered for at
    forty-one because, he told Josiah, he had some things to settle.
    The hand-press was returned to Ackerley's widow in Wilkinsburg in
    the autumn. She sent it back a week later with a note that said
    *it was never my husband's to lend, and so it is never mine to
    take back.* The press has printed the Argus for sixteen years.
    There is a brass plate on the side of the frame with Ackerley's
    name engraved by Mordecai himself on the morning he took the
    editor's chair. Every issue goes out with his name running in
    iron between the words.

- id: the_song_of_evan_pritchard
  name: The Song of Evan Pritchard at the Tuyere
  era: "1866"
  description: >-
    The Welsh puddlers at the South Side mills keep a song that is
    not sung outside the blowing-house. Evan Pritchard, of the
    Cwmbach valley, was a puddler at Jones & Laughlin Eliza Furnace
    when the tuyere wall cracked in April of '66 and the cinders
    cast a line of fire across the floor that had three men between
    it and the door. Pritchard went out through it rather than
    around it and carried two of them on his shoulders and came back
    for the third. He lived through the night and died at dawn of
    burns that the Irish-Catholic women at St. Adalbert's said were
    worse than the ones the saints had. His wake was a three-chapel
    affair — Calvinistic Methodist, Roman Catholic, and the AME
    congregation that had bought his life insurance through a
    fraternal burial society — and the song that came out of it is
    a Welsh hymn tune with a Gaelic chorus and an AME amen, and it
    is sung only on the night-shift, only at the blow, only between
    one charge and the next. Prudence has heard it sung and has
    asked whether she might learn the Welsh. The night-shift
    foreman said yes. She does not sing it in company.

- id: the_wake_of_the_keely_investor
  name: The Wake of the Keely Investor
  era: "February 1878"
  description: >-
    Thomas O'Hara of the Strip District, late foreman of the Eliza
    Furnace cast-floor and husband to Bridget O'Hara of the same
    parish, put his retirement savings into a subscription of Keely
    Motor Company stock in the autumn of 1877, on the assurance of a
    well-dressed German gentleman who had knocked at the door of the
    saloon on a Sunday and left a calling card that smelled of
    bay-rum. The stock was worthless by February. Thomas O'Hara was
    dead of apoplexy within the week — the doctor said from the
    shock, the priest said from the shame, and Bridget said from
    the German gentleman. The wake was held at the O'Hara flat above
    the Liberty Avenue mercantile. The body lay on the kitchen table
    for two days. The clocks were stopped. The mirrors were covered.
    The window was opened for the soul and the cat kept being
    evicted so the cat would not stop the soul. The keening was
    Maggie Donovan's — she is the last of the Lower Hill keeners
    and she charges by the hour — and the wake games went on past
    two in the morning of the second night, which Father Reilly of
    St. Patrick's has written two sermons against and attended four
    times. McCoy sent flowers. Bridget returned them with a note.
    The note said *I will accept flowers from the doctor when the
    doctor has brought me the German.* The note is framed behind
    the bar at the Liberty Avenue mercantile. The doctor has been
    told, by Dr. Teague, that the note exists. He has not yet
    gone to see it.
