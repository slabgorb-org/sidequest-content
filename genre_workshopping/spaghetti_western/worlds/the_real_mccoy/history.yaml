  - id: veteran
    label: "The Ledger Keeps Itself — Winter on the Train"
    session_range: [21, 99]
    location: the_train
    time_of_day: night
    atmosphere: >-
      The river has iced at the banks. Coal barges are jammed at the
      Point waiting for thaw. The train is somewhere between Braddock
      and the 28th Street yards on a cold clear night, Pintsch-gas
      mantles glowing down the length of the cars. Tabitha is in the
      Library Car with a ledger open and the evening's dispatches
      sorted into three stacks by urgency; she has done this at this
      hour on a Tuesday since September. Prudence is at the galley
      stove arguing with Dr. Teague about whether the coffee has been
      on the burner past its useful life; this is the fourth such
      argument this week. A crew member sleeping two cars forward has
      left boots drying on the register of the passenger coach — the
      boots belong there now; nobody moves them. The household ledger
      of Weaponizations is maintained in a bound black Morocco volume
      in the Study safe, written in Tabitha's hand. The map of
      Markham's network has a dozen names and four question marks.
      The federal patron will call again. The Shadyside rival has
      spent a year learning exactly how to hurt the household without
      ever touching it. The Workshop Car has been lit past midnight
      six nights in the last eleven months, the drawing on the board
      kept covered when the door opens; the last uncovered piece was
      a brass-jointed splint sized for a Pullman porter's shoulder,
      and the one before that was a small locked case with no label
      on it.
    active_stakes: >-
      The household is stable and the world is not. Every long-running
      thread is load-bearing. McCoy builds. The crew fields. Tabitha
      keeps the ledger. Prudence asks harder questions. Raubritter
      makes a move the crew will have to answer or concede. The
      Presidential relationship demands a renewal or a break. The
      Markham dossier is one good interview from naming the Paris
      address. And whatever McCoy is making in the Workshop Car
      tonight is for them, though he would never say so.
    points_of_interest:
      - name: The Study at Midnight
        visual_prompt: >-
          the_real_mccoy, interior of a private drafting-room car at
          midnight, mahogany-and-walnut panelling on every wall, a large
          draftsman's table at centre strewn with six ink sketches of
          instrument details and an unrolled blueprint held flat by a
          brass parallel-rule, a green-shaded banker's oil lamp at the
          near-right corner pooling warm amber across the blotter and
          picking out iron-gall ink stains, a brass globe on a walnut
          stand at the far-left corner with the Indian Territory turned
          toward the viewer, floor-to-ceiling leather-bound bookshelves
          behind filled with gilt-spined Verne novels, Maxwell's Treatise,
          and a King James Bible laid flat on the top shelf, a small
          framed cabinet photograph of a young woman in 1860s dress on
          the desk angled toward the empty chair on the right, a wooden
          draftsman's T-square leaned against the desk's left edge, deep
          coal-black shadow filling the edges of the car, shallow focal
          depth with the lamplit desk in sharp focus.
        description: >-
          McCoy's private drafting room on the train. Mahogany panelling,
          a green-shaded banker's lamp, a globe that still has the
          Indian Territory on it. Bookshelves: Verne's voyages bound in
          leather, Maxwell's Treatise, Babbage's Passages from the Life
          of a Philosopher, a first edition of Ada Lovelace's notes on
          Menabrea, a King James Bible Adelaide gave him the day they
          married. A cabinet photograph of Adelaide at nineteen sits
          angled so only he sees it from his chair. The desk is covered
          in drawings nobody else has been shown.
      - name: The Observation Platform in a Snowstorm
        visual_prompt: >-
          the_real_mccoy, the brass-railed rear observation platform of a
          private train at night in a snowstorm, heavy snow blowing sideways
          across receding rail tracks that curve into coal-black darkness
          a hundred yards out, a Pintsch-gas lantern on a gooseneck bracket
          swaying over the railing at left casting a narrow amber cone into
          the squall, a second lantern mounted on the car's rear bulkhead,
          the distant orange flare of a Bessemer converter at Edgar Thomson
          bleeding through the storm a mile downriver on the right, melted
          snow refreezing on the rail in a glassy skin, a single figure in
          a long wool overcoat and a low-brimmed felt hat standing at the
          railing in silhouette with a short pipe at the mouth, the wrought-iron
          rear gate standing partly open on the left, snow accumulating on
          the planked deck in drifts, deep cold amber light on wet brass,
          coal-smoke sepia just barely readable in the upper sky.
        description: >-
          Aft of the train, the brass-railed observation platform open
          to the weather. A Pintsch-gas globe on a gooseneck swaying
          in the wind. Snow coming in sideways across the Monongahela,
          the Bessemer converters at Edgar Thomson throwing orange
          light through the squall a mile downriver. The snow melts
          on the rail and re-freezes. Dr. Teague's gaslamp reflects
          off two hundred feet of track before the dark swallows it.
          This is where private conversations happen.
      - name: The Workshop Car at Four in the Morning
        visual_prompt: >-
          the_real_mccoy, interior of a rolling laboratory car in the
          small hours, polished walnut benches with iron-strap edges on
          both walls, a Jablochkoff arc lamp guttering white-violet on a
          cast-iron stand at the centre aisle throwing hard rim-light
          against the mahogany panelling, a Crookes tube glowing deep
          violet in a walnut cradle on the right bench, a bank of twelve
          Planté-cell jars on a walnut rack venting faint sulfuric vapor
          at the forward end, a lit acetylene torch on a ceramic pad
          beside a fine-jaw vise, a male figure in shirtsleeves and a
          waistcoat unbuttoned at the collar bent to the bench with his
          hair out of morning shape, a young woman in a wool dressing
          robe and loose braid standing in the doorway at right with a
          tin coffeepot in both hands, a female figure with too-precise
          posture at the second bench on the left holding a glass lens
          steady with her bare palm because a metal clamp would crack
          the glass, a drafting board on the end wall with one uncovered
          drawing, dim amber overhead gaslight, a violet corona at the tube.
        description: >-
          Acetylene torch lit, Jablochkoff arc guttering, the Crookes
          tube violet and the Planté bank venting faint sulfuric vapor.
          McCoy at the bench in shirt sleeves, hair out of its morning
          shape. Tabitha in the doorway in a wool robe with a coffee
          pot. Prudence at the second bench holding a fine-jaw vise
          steady with her palm because the clamp would damage the glass.
          The drawing on the drafting board does not have a name on it
          yet. The crew, asleep two cars forward, does not know that
          by dawn they will have been given something they had given
          up expecting.
