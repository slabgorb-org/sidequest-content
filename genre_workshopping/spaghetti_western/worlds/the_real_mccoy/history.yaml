# Pre-game timeline — the decade that made the household.
# Names flagged `proposed: true` await Keith's Step 7 review.

pregame_timeline:
  - year: 1835
    event: >-
      Granville McCoy born in Fells Point, Baltimore, the only son of a
      ship's caulker and a laundress. The household is a two-up-two-down
      on a brick court off Aliceanna Street. Father's trade is hemp,
      pitch, and tarred oakum; the smell never quite leaves the boy's
      clothes. Mother reads him Franklin's Autobiography, Paul and
      Virginia, and the King James Bible, in that order of preference.

  - year: 1851
    event: >-
      McCoy, sixteen, apprenticed to Herr Johannes Reinhardt of Front
      Street, Philadelphia, a German machinist late of the Stuttgart
      Polytechnic, emigre of the 1848 collapse. Reinhardt's shop makes
      precision regulators for railroad watches and one-off instruments
      for the Franklin Institute bench. The apprenticeship runs seven
      years. Reinhardt teaches him lathe, die-stock, German scientific
      register, and the proposition that a workshop is a moral
      institution.

  - year: 1858
    event: >-
      Apprenticeship concluded. McCoy refuses journeyman wages and
      enrolls at the Jefferson Medical College, Philadelphia. Reinhardt
      privately approves but says so in writing only. McCoy pays
      tuition by contracting instrument repairs for the college
      dispensary.

  - year: 1862
    event: >-
      McCoy, twenty-seven, marries Adelaide Sayre of Lancaster County,
      Pennsylvania — schoolteacher, Quaker, cousin of a Reinhardt
      apprentice. She dies in childbirth the following February at
      their rented house on Pine Street. The daughter survives and is
      named Tabitha, for Adelaide's mother. McCoy does not remarry.
    entities:
      - name: "Adelaide Sayre McCoy"
        proposed: true

  - year: 1864
    event: >-
      McCoy serves the last year of the war as a contract surgeon for
      the Army of the Potomac's medical wagon-train, treating minie-
      ball wounds at the field hospitals of Cold Harbor and Petersburg.
      The experience makes him the kind of physician-engineer who
      designs splints and cautery instruments and carries a child's
      daguerreotype in a watch-case.

  - year: 1867
    event: >-
      Silas Markham, fourteen, orphan of a canal-lock keeper at
      Lyons, New York, is apprenticed to McCoy at McCoy's new
      Philadelphia shop at Ninth and Pine. The boy is brilliant,
      plausible, and chronically short of money. McCoy treats him
      as a son. Tabitha, five, calls him Uncle Silas.
    entities:
      - name: "Lyons, New York (Markham's hometown)"
        proposed: true

  - year: 1872
    event: >-
      McCoy liquidates the Philadelphia shop and buys out a Pittsburgh
      optician's lease at Fifth and Wood with the proceeds plus a
      quiet loan from the Mellon bank. Motive: the mills need an
      instrument-maker who understands steel, and the smoke in the
      river valley has lately begun to interest him as a physiological
      problem. Markham, nineteen, makes the move with him. Tabitha,
      ten, is enrolled at Miss Semple's Academy on Stockton Avenue in
      Allegheny City.

  - year: 1874
    event: >-
      The first train-workshop commissioned. Pullman Palace Car
      Company, Detroit shops, custom order on Pittsburgh, Fort Wayne
      & Chicago rolling stock. Six cars: locomotive, boiler, workshop,
      study, library, observation. Delivered in November, first run
      in December, Fort Wayne to Pittsburgh. McCoy's intention is a
      mobile medical-instrument service for the mill-and-railroad
      corridor. Within six months he is also fulfilling war-department
      instrumentation commissions he does not remember accepting.
  - year: 1874
    event: >-
      Prudence is commissioned and built as Tabitha's nursemaid
      during an eight-month illness the doctors cannot name. She is
      the first of her kind. McCoy builds her in the workshop car
      over thirteen weeks, from Siemens regulators, a gutta-percha
      chassis, a Planté cell bank, a Crookes-tube nerve simulant,
      and a quantity of tempered brass. She sings in two languages
      and has never once been wrong about a fever.

  - year: 1876
    event: >-
      Late November. Markham, twenty-three, disappears from the
      Pittsburgh shop after thirty-six hours alone with the master
      drawings of the Prudence-type chassis. Ship's manifest from
      New York traces him to Le Havre, thence Paris. He wires
      McCoy from the Gare du Nord in January 1877 to apologize.
      McCoy replies. Markham replies. The correspondence is still
      running, in cipher, from both sides. McCoy has never publicly
      accused him of anything.

  - year: 1877
    event: >-
      July 19-22. The Great Railroad Strike reaches Pittsburgh. The
      Philadelphia militia fires on a crowd; twenty-six dead; the
      roundhouse, thirty-nine depot buildings, one hundred and four
      locomotives, and Union Station burn. The McCoy train is in
      the 28th Street yards that night, fueling for a run to
      Altoona. A crowd of perhaps three hundred rioters is headed
      up the yard with torches when Capt. Bill Jones — who has
      ridden down from Braddock on his own initiative — steps
      into the torchlight at the yard gate with sixteen of his
      Edgar Thomson men, calls four rioters by name, offers them
      whiskey from a flask, and walks the torch-party out of the
      yard by a route that takes them past the roundhouse gates
      on the way to the courthouse fire. The train survives.
      McCoy and Jones meet at dawn at the yard gate over coffee
      a nightwatch brewed on a coal shovel. Jones says "You owe
      me a drink, Doctor." McCoy says "I owe you more than that."
      Jones pays for the first round at the Monongahela House bar
      that Tuesday. McCoy pays for the second. The barman on the
      Tuesday night shift has logged the two of them at the same
      end of the bar, most Tuesdays, for every week since.

  - year: 1878
    event: >-
      March. Raubritter Concern announces its "Industrial Sciences
      Bench" in Shadyside, Heidelberg-educated staff, Krupp-plate
      laboratory. The Pittsburg Leader welcomes it. The Allegheny
      Argus does not. By April, the first unlicensed Prudence-type
      chassis is walking a hiring line at the Homestead construction
      site; by May, another one has been photographed at a
      Washington reception the War Department denies hosting. The
      crew of the train has been assembled over the winter. The
      campaign opens on an April morning at the 28th Street yards.
