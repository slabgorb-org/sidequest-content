        status: dormant
        progression: 0.0
        notes: []

  - id: early
    label: "Summer Dispatches — Smoke in the Papers"
    session_range: [6, 12]
    location: hill_district
    time_of_day: afternoon
    atmosphere: >-
      July heat in the river valley, the inversion layer trapping the
      sulphurous coke-oven vent downriver until every north wind smells
      like a struck match. The Argus has been running a weekly column on
      "Our Doctor." Raubritter's paper has begun calling him "The Self-
      Appointed Physician of Progress," which is worse because it is
      somehow accurate. The crew has recovered a monocle that shouldn't
      be in the hands that had it. A Pinkerton flashpan photograph of
      the train crew appeared on an inside page of a Southern Redeemer
      weekly reprinted as far south as Atlanta. And a wire from a Paris
      address the crew now recognizes arrived in cipher on a Tuesday,
      which is the day Silas Markham used to like.
    active_stakes: >-
      The crew is no longer new. They have enemies by name. The
      Bessemer's Shadow trope is active — fluoroscope monocles have
      been sighted on the hiring line at Edgar Thomson — and Capt. Bill
      Jones wants a meeting in Braddock. The Paris dispatch names a
      new buyer of the plans. The War Department envoy missed his own
      appointment. Somewhere on the Strip District, a Pullman porter
      has recognized a replicant who used to be a friend.
    points_of_interest:
      - name: Bethel AME on Wylie Avenue
        visual_prompt: >-
          the_real_mccoy, interior of a red-brick AME church sanctuary in
          mid-afternoon summer light, five plain-glass arched windows on
          each side wall admitting long shafts of warm light that cross
          the centre aisle, twelve rows of dark-polished walnut pews with
          brass hymnal-rails, a carved walnut pulpit raised three steps
          at the far end, a simple brass cross on the white-plastered
          wall behind the pulpit, worn dark floorboards underfoot with
          seventy years of polish, an open hymnal on the third pew from
          the front, a brass kerosene chandelier overhead unlit at this
          hour, two gas sconces on the side walls, a small communion
          table with a white linen cloth at the pulpit's foot, bethel_ame_gold
          highlights on the pulpit brass, calm diffused light.
        description: >-
          Red brick, white trim, a bell tower visible from the lower
          Hill. The floorboards in the vestibule have stood since the
          congregation was a fugitive-railroad station. Afternoon light
          through plain glass the congregation refuses to replace with
          stained pictorials — Bishop Payne's decorous-worship lineage
          takes its plainness seriously. The sanctuary smells of lamp
          oil and cedar and the lye-soap the ladies' auxiliary uses
          on Saturday. Mordecai Carrington conducts editorial business
          on the third pew when the editorial office is too public.
      - name: The Edgar Thomson Hiring Line
        visual_prompt: >-
          the_real_mccoy, a muddy steel-mill hiring yard at dusk under
          the lee of a blast furnace, four loose rows of roughly fifty
          working-class men in flannel shirts, waistcoats, and wool caps
          waiting their turn, boots caked in mud, a plank-and-sawhorse
          table at the head of the line with a clerk in a black frock
          coat and green celluloid eyeshade leaning forward and peering
          through a brass-rimmed monocular device mounted on a small
          kerosene-fed housing at an applicant's chest, a single kerosene
          lamp on the table beside a ledger, a Bessemer converter throwing
          a minutes-long geyser of orange sparks against the sky at the
          far left casting a flare-shadow on every man's face in rhythm,
          a burly foreman in a scorched leather vest and rolled sleeves
          arms-folded in the doorway of the blowing-mill on the right
          watching the loupe, long rim-lit shadows flickering across
          the mud, coal-smoke sepia sky darkening to bessemer_orange at
          the horizon.
        description: >-
          A muddy yard east of Braddock, under the lee of No. 2 Blast
          Furnace. Two hundred men in four loose rows, stamping the mud
          off their boots. The Bessemer converter is in the blow — a
          minutes-long geyser of orange sparks visible across the
          Monongahela, casting a flare-shadow on every man's face in
          rhythm with the oxygen cycle. At the foreman's table a clerk
          peers through a brass-rimmed device like a jeweler's loupe
          attached to a small kerosene-fed housing. The men in the line
          do not know what he is looking at. Cap'n Bill Jones stands
          at the doorway of the blowing-mill, arms folded, not saying
          what he thinks of the loupe.
      - name: The Paris Dispatch on the Library Car Table
        visual_prompt: >-
          the_real_mccoy, close interior of a mahogany library-car table,
          a folded yellow Western Union cable-form at centre with a
          Pittsburgh date-stamp in violet ink and a sender's row of
          cipher groups in ink-pencil on the top line, a white china
          teacup on a saucer beside it with the tea half-drunk and a
          silver spoon laid across, a decoded transcription sheet unfolded
          at right with ink-pencilled annotations in two columns and
          three words circled, a graphite pencil laid beside the sheet,
          a brass loupe on a small stand at the upper-left corner, a
          green-shaded banker's oil lamp at the near corner pooling warm
          gaslight amber across the tabletop and catching the brass of
          the loupe, floor-to-ceiling mahogany bookshelves blurred in
          soft focus behind with bound green-cloth periodicals just
          distinguishable, a globe on a brass stand at the far edge of
          frame, shallow focal depth, coal-smoke particulate drifting in
          the lamp beam.
        description: >-
          A cable-form yellow telegraph sheet, folded twice, sitting on
          the mahogany table of the Library Car beside a half-drunk
          cup of tea. Transatlantic via Valentia Island to Heart's
          Content to New York City to Pittsburgh's Western Union main
          office, relayed to the train at the yard. Ten words minimum
          at ten dollars a word. The cipher is Markham's personal one,
          the key half-burnt on the stove of the Workshop Car. The
          decoded sheet beside it names a buyer the crew has not heard
          of. McCoy has not come out of the Study to read it.
    npcs:
      - archetype: "The Muckraker Editor"
        name: "Mordecai Carrington"
        location: hill_district
        disposition: 20
        notes: >-
          Editor of the Allegheny Argus. Claims McCoy in print, lectures
          the crew in person about what McCoy owes the race, does not
          accept the answer that McCoy owes the race nothing because he
          owes nobody anything.
      - archetype: "The Mill Foreman"
        name: "Capt. Bill Jones"
        location: braddock
        disposition: 25
        notes: >-
          Welsh-American, labor-progressive, 8-hour-shift experimenter.
          Has seen the loupes. Wants them gone. Will not burn them
          himself because it has to be done in a way the papers can
          use.
      - archetype: "The Pinkerton Superintendent"
        name: "Agent Oscar Holm"
        location: downtown
        disposition: -10
        notes: >-
          Swedish-immigrant, polite, ruthless. Introduces himself in a
          Monongahela House parlor. Mentions, without threatening, the
          Aliquippa draft on his desk.
    quests: {}
    lore:
      - The Paris cipher key is McCoy's own — Markham is using the apprentice-cipher he was taught
      - Carrington's column has begun attracting angry letters from the Southern Redeemer weeklies
      - The Presidential Request trope will open when the Washington envoy rebooks — the missed appointment was not an accident
    notes:
      - The Weaponization trope activates around the fluoroscope monocle
      - The Watchmaker's Apprentice trope ramps; Markham's buyer is not Raubritter
      - Real McCoy Among Us fires at least once — a porter recognizes a face
    narrative_log: []
    tropes:
