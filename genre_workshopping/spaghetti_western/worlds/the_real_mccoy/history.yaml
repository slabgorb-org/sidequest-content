  - id: mid
    label: "Autumn Accounts — The Ledger Grows"
    session_range: [13, 20]
    location: east_liberty
    time_of_day: evening
    atmosphere: >-
      October. The inversion has cleared for a fortnight each side of
      the equinox, and the city can briefly see itself — mansarded
      East Liberty row houses, the new Homewood Cemetery gate lanterns,
      the Duquesne Incline ticking up and down against an actual sky.
      The crew has made choices by now. Some inventions the crew
      carried away have come back in ways that cannot be undone. Some
      replicants the crew identified have been quietly extracted and
      are now the crew's problem in other ways. The Argus has printed
      two corrections. Raubritter's paper has printed none. A
      Presidential envoy — third attempt — is actually in town, staying
      at the Monongahela House, asking for a meeting the train cannot
      politely refuse.
    active_stakes: >-
      The crew is no longer reactive. They are managing a dossier of
      Weaponizations the city does not know is being kept. Raubritter
      has picked up a contract the crew declined and is running it
      badly. Markham's network has a seam the crew can pull. The
      Presidential Request names a specific Indian Wars application
      for a specific McCoy device and the doctor's answer — typically
      oblique — arrives on the Library Car table in his own hand.
    points_of_interest:
      - name: The Duquesne Incline at Dusk
        visual_prompt: >-
          the_real_mccoy, a thirty-degree funicular railway climbing an
          eight-hundred-foot cliff face at dusk, a cherry-wood passenger
          car with polished brass fittings and a gaslit interior lamp
          midway up a pair of steel rails, a brick-and-timber engine house
          at the lower station beside Carson Street with amber lamplight
          in its windows, a frame observation pavilion at the upper
          ridgetop station framing a single silhouetted figure in a
          pressed wool suit and bowler hat clutching a leather federal
          portfolio under one arm at the rail, the Pittsburgh river valley
          spread eight hundred feet below glittering with thousands of
          gaslamp pinpricks along three rivers, a distant orange Bessemer
          flare at Edgar Thomson on the far horizon, a balance-cable
          descending empty on the parallel track, coal-smoke haze
          thickening middle distance, deep amber-to-indigo sky above.
        description: >-
          Diescher's 1877 funicular, 30-degree grade, 800-foot rise from
          Carson Street to Mount Washington's Grandview overlook. The
          cars are cherry-wood with brass fittings and gas lamps inside.
          At dusk the operator runs them empty on the half-hour, balance-
          cable only, and the lamps cast a slow amber slide up and down
          the hillside. From the top, the whole river valley glitters
          with gaslight: a cathedral of labor lit from below. A man
          with a pressed wool suit and a federal portfolio has been
          waiting at the Grandview platform for three-quarters of an
          hour.
      - name: Raubritter's City Residence, Shadyside
        visual_prompt: >-
          the_real_mccoy, interior of a Heidelberg-style drawing room,
          dark oak panelling on every wall to a chair-rail and running
          up to a coffered ceiling, a framed Fraktur broadside in black
          ink on cream over a carved white marble mantel at the rear wall,
          a walnut vitrine on the left wall displaying twelve Heidelberg
          beer-steins on three glass shelves, an oval oil portrait of a
          woman in half-mourning crape in a gilt frame on the opposite
          wall, four deep-red velvet upholstered armchairs arranged around
          a low mahogany tea table at centre with a silver service and a
          Sachertorte on a porcelain stand, a gaslight chandelier with
          six etched-glass shades on brass arms overhead, heavy burgundy
          damask drapes at two tall windows on the left, a galvanic bench
          with a Crookes tube and copper coils visible through an open
          doorway at right, formal cool gaslight with cemetery-slate
          undertones, no warmth in the shadows.
        description: >-
          A Second-Empire brick mansion on Ellsworth Avenue, fig trees
          in the courtyard, a Krupp-iron fence painted forest green. The
          drawing room is Heidelberg — dark oak panelling, a Fraktur
          broadside framed on the mantel, a stein collection, a portrait
          of Raubritter's mother in half-mourning crape. The industrial-
          science library in the next room is where the work actually
          happens. A galvanic bench. A Crookes tube bigger than McCoy's.
          The maid is the fourth member of a German-American family that
          has served three generations of Raubritters and will not meet
          a visitor's eye.
      - name: The Library Car on a Night of Rain
        visual_prompt: >-
          the_real_mccoy, interior of a rail library car at night, rain
          running in long vertical streaks down a tall plate-glass window
          on the left with a distant arc-lamp pinprick visible through the
          rain on the far side of the yard, floor-to-ceiling mahogany
          bookcases on both walls with bound periodicals in green cloth
          and a brass rail running along the third shelf, a central
          mahogany table with a yellow Western Union federal dispatch
          unfolded flat under a green-shaded banker's oil lamp, a graphite
          pencil and a two-column notation sheet in a woman's hand beside
          it listing "Things We Have" on the left and "Things We Can
          Refuse" on the right, a brass globe on a stand at the far end
          of the car, two deep oxblood horsehair-leather armchairs flanking
          a side table with a decanter, a gaslight chandelier with etched-glass
          shades overhead reflected in the wet window, warm gaslight amber
          pooling on polished wood, coal-smoke sepia beyond the glass.
        description: >-
          The train parked at the 28th Street siding, rain drumming the
          copper roof, Pintsch-gas mantles bright enough to read a
          cipher by. McCoy is in the Study with the door closed. Tabitha
          is at the Library table with a federal dispatch open in front
          of her and a pencil making a list in two columns — Things We
          Have, Things We Can Refuse. Dr. Teague is on the observation
          platform, smoking a short Dunhill pipe, watching a Pinkerton
          photographer pretend not to be photographing the train.
    npcs:
      - archetype: "The Antagonist Industrialist"
        name: "Cornelius Raubritter"
        location: east_liberty
        disposition: -15
        notes: >-
          First meeting. Tea, Sachertorte, English with a Heidelberg
          cadence. He does not raise his voice. He has read the Argus's
          last four columns and made a joke at their expense that is
          funnier than the crew is comfortable with.
      - archetype: "The Federal Operative"
        name: "Undersecretary Alvin Prescott"
        location: downtown
        disposition: 0
        notes: >-
          Third envoy from the War Department. Polite, pressed, has a
          portfolio with a named Indian Wars application. Will not raise
          his voice either.
      - archetype: "The Replicant Companion"
        name: "Prudence"
        location: the_train
        disposition: 25
        notes: >-
          McCoy's first benign replicant, built as Tabitha's nursemaid
          in 1874. Slightly-too-perfect diction, sings when content,
          recently begun refusing assignments she considers inconsistent
          with her duty of care.
    quests: {}
    lore:
      - Raubritter's paper has a new editor and the tone has sharpened — someone is paying for the sharpness
      - The Paris cipher has been changed; Markham knows the key was compromised
      - Prudence has begun asking Tabitha what "consent" means in her copy of Mill's Subjection of Women
    notes:
      - The Weaponization is at the center of every scene this chapter
      - The Presidential Request reaches crisis — the crew must decide for or against
      - Markham's seam is exposed; a subordinate can be turned
