  - id: veteran
    label: "Dust and Lead — The Last Town Standing"
    session_range: [26, 40]
    location: sangre_del_paso
    time_of_day: sunset
    atmosphere: >-
      The sun sets over the Sierra Perdida and the sky is the color of a
      bruise — purple and orange and red at the edges like something
      bleeding out. The town is quieter than it should be. Half the
      buildings on the main street are shuttered or burned. The saloon
      piano plays for an audience of three. The railroad tracks reach the
      edge of town now — steel rails ending in raw dirt like a sentence
      nobody finished. The territory has been broken open and everything
      that was underneath is showing. You are the only person in the
      Sangre Territory that every faction still talks to. That makes
      you either the peacemaker or the last target. The sunset is
      beautiful. It always is, the night before the killing.
    active_stakes: >-
      Endgame. The Consolidated makes its final play for total control.
      Los Cuervos launch their revolution or die trying. The Apache
      coalition strikes. The Families make their stand. The player's
      choices across the entire campaign converge into a final reckoning
      that reshapes the territory. Not everyone survives. The question
      is whether anything worth saving does.
    points_of_interest:
      - name: The Railhead at Sangre del Paso
        description: >-
          Fresh-laid steel rails ending in bare dirt at the edge of town.
          A locomotive sits on the tracks, boiler cold, stack black against
          an orange sky. Stacks of railroad ties and kegs of spikes
          beside the grade. The Consolidated's flag flies from a pole
          bolted to the engine. A crowd has gathered — not to celebrate
          the railroad's arrival but to see what happens when the engine
          tries to cross land that three factions claim. The sunset
          paints everything in blood light.
        visual_prompt: >-
          spaghetti_western, a black iron locomotive at sunset stopped
          on fresh-laid steel rails that end abruptly in bare packed
          dirt at the edge of a frontier town, the engine facing
          three-quarter from the right, a tall riveted smokestack
          silhouetted against a bruised orange and purple sky, a cold
          dark boiler with no smoke, two stacks of fresh-cut railroad
          ties beside the grade and three iron kegs of spikes on the
          near side, frontier storefronts in low silhouette on the far
          horizon.
      - name: The Burned Harwick Homestead
        description: >-
          Charred timber and a stone chimney standing alone on forty acres
          that smell like ash and creosote. The child's swing is a blackened
          rope on a blackened branch. The fence posts are still standing.
          The survey stakes with their red ribbons survived the fire
          perfectly — almost as if they were placed after it. A single
          wildflower grows in the doorway where the threshold used to be.
        visual_prompt: >-
          spaghetti_western, a burned homestead at sunset on bare dry
          ground, a lone tall fieldstone chimney rising mid-frame from
          a rectangular footprint of charred black timbers and grey ash,
          a scorched blackened mesquite to the left with a burnt rope
          swing hanging from a lower branch, a dozen red-ribboned wooden
          survey stakes running untouched in a clean diagonal across
          the foreground, low orange sun on the right horizon, long hard
          shadows raking east, pale pink sky above.
      - name: The Mission at Dusk
        description: >-
          The Mission of Santo Puente in the last hour of light. Adobe
          walls turned amber by the setting sun. The bell tower casts a
          shadow that reaches the main street. The heavy wooden doors
          stand open and candlelight flickers inside — a hundred small
          flames reflected in painted saints' eyes. Father Mateo's
          congregation has never been larger. People who have not prayed
          in years are kneeling tonight. Tomorrow, the territory will
          decide what it becomes. Tonight, it asks for mercy.
        visual_prompt: >-
          spaghetti_western, a Spanish colonial adobe mission at dusk,
          thick hand-plastered walls deep amber under low setting sun
          from the right, a single square bell tower left of the facade
          with a dark iron bell in its arched window and a crumbling
          top course of adobe, the tower throwing a long hard shadow
          left across packed earth, two heavy timber doors standing
          open mid-frame with warm flickering candlelight within, three
          clumps of prickly pear at the base of the near wall.
      - name: The Three-Way Standoff Ground
        description: >-
          The open ground south of town where the road forks — one branch
          to the river, one to the canyon, one to the railroad. A circular
          clearing fifty yards across, flat and bare, with nothing to
          hide behind. Three riders approaching from three directions,
          dust plumes rising behind each one. The sun is exactly at the
          horizon, blinding anyone facing west. Long shadows stretch
          east like dark fingers. This is where it ends. The ground
          has been waiting.
        visual_prompt: >-
          spaghetti_western, a flat circular clearing of bare packed dirt
          fifty yards across at sunset, three dirt roads meeting its edge
          from three directions, three distant mounted riders approaching
          as small dark silhouettes with long dust plumes trailing behind,
          the sun sitting exactly on the flat western horizon as a hard
          orange disc backlighting the scene, extremely long black shadows
          reaching east across bare ground, violet sky above, no trees
          or cover anywhere.
    npcs:
      - archetype: "The Stranger"
        name: "The Stranger"
        location: sangre_del_paso
        disposition: 0
        notes: A second drifter — mirror of the player, arrived for the reckoning
      - archetype: "The Hunter"
        name: "Solomon Cole"
        location: sangre_del_paso
        disposition: -25
        notes: Final contract is on the player
      - archetype: "The Frontier Matriarch"
        name: "Alma Reyes"
        location: quieto_valle
        disposition: 20
        notes: Señora Reyes — last appeal to save the valley without more blood
    quests: {}
    lore:
      - The territorial governor has signed the Consolidated's land grant — it's legal now
      - Los Cuervos' ammunition came from the Apache — an alliance nobody predicted
      - The mission bell has not rung since the fire — Father Mateo says it will ring when the territory finds peace
    notes:
      - All major tropes converge and resolve
      - The final standoff should be the campaign's defining moment
      - The territory's future depends on the player's choices — no clean endings
      - Whoever controls the railhead controls the next fifty years
