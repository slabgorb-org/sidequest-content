  - id: early
    label: "Entanglement — Blood in the Water"
    session_range: [6, 12]
    location: quieto_valle
    time_of_day: dusk
    atmosphere: >-
      The territory knows your name now, or the name you gave it. Dusk
      paints the valley in amber and long shadow. Cottonwood leaves rattle
      in a wind that smells like dust and creosote. Somewhere upstream a
      coyote tests the darkness with a single bark. You have allies — or
      people who act like allies because they need something. The railroad
      survey stakes creep closer to the Reyes ranch every morning. Los
      Cuervos hit a silver shipment last Tuesday and the Rangers found
      nothing. The Consolidated is patient. Patience, out here, looks
      a lot like a noose tightening slowly.
    active_stakes: >-
      The player is embedded in faction politics. The Consolidated's land
      grab is accelerating. Los Cuervos are escalating raids. The Families
      are caught between. At least one NPC the player trusts is not what
      they seem. The standoff trope is building toward its first eruption.
    points_of_interest:
      - name: Reyes Ranch
        description: >-
          A sprawling adobe hacienda at the end of a cottonwood-lined lane,
          the oldest structure in Quieto Valle. Thick walls enclose a dusty
          courtyard with a dry fountain and a fig tree older than the border.
          Chickens scratch in the shade. Saddles hang on fence rails. Señora
          Alma Reyes holds court on the covered porch in a high-backed chair,
          a Winchester leaning against the wall within arm's reach. The
          evening light turns the adobe walls the color of dried blood.
        visual_prompt: >-
          spaghetti_western, a sprawling single-story adobe hacienda at
          dusk at the end of a cottonwood-lined dirt lane, low amber sun
          from the left washing thick plaster walls deep ochre, a walled
          courtyard with a dry round stone fountain at its center and a
          massive ancient fig tree branching over the west wall, three
          worn leather saddles hung across a timber fence rail on the
          courtyard's right edge, long shadows reaching east, a covered
          porch in back shade.
      - name: The Harwick Homestead
        description: >-
          A raw timber house and barn on forty acres directly in the
          railroad's path. Laundry on a line. A child's swing hanging
          from a lone mesquite tree. Fence posts driven into ground so
          hard the posts split before the earth gave. Survey stakes with
          red ribbons appear along the property line like a slow invasion.
          The family is still here. The Consolidated's patience has a
          deadline.
        visual_prompt: >-
          spaghetti_western, a raw plank homestead at dusk on flat open
          dry grass, a single-story pine-board house with a low-pitched
          roof mid-frame and a small matching plank barn to its right,
          low amber sun raking across the field from the left, white
          sheets pinned to a rope clothesline between two posts in front
          of the house, a lone mesquite on the left with a child's
          rope-and-plank swing hanging from a lower branch, red-ribboned
          wooden survey stakes cutting diagonally across the foreground.
      - name: Smuggler's Crossing by Moonlight
        description: >-
          The hidden ford three miles downstream from town, seen at night.
          Moonlight turns the river to hammered silver. A stand of
          cottonwoods throws black shadow across the bank. Two riders
          emerge from the water leading packhorses loaded heavy and low.
          The far bank is Mexico. The near bank is technically America.
          At this hour, at this crossing, the distinction is academic.
        visual_prompt: >-
          spaghetti_western, a hidden river ford at night under a full
          moon high and slightly left of frame, moonlight catching slow
          water in hammered silver ripples, two mounted riders in dark
          coats crossing knee-deep water left to right leading two
          stocky packhorses loaded with bulging canvas bundles strapped
          low across their backs, a stand of tall cottonwoods on the
          near right bank throwing a solid black shadow wedge across
          the mud, cool blue moonlight.
      - name: The Acequia
        description: >-
          An ancient irrigation ditch running from the river through the
          valley fields, lined with hand-placed stones worn smooth by
          decades of water. Where the acequia forks, a wooden gate
          determines whose fields get water this week. The gate is
          chained. The chain has been cut and re-locked three times
          this month. Muddy boot prints surround it.
        visual_prompt: >-
          spaghetti_western, a stone-lined irrigation ditch cutting
          diagonally through dry cracked valley fields at dusk, hand-placed
          smooth grey river stones terracing the banks under shallow
          running water, a Y-fork mid-frame with a weathered plank sluice
          gate wedged into the left branch, a heavy iron chain wrapped
          three times around the gate post and padlocked, muddy boot
          prints clustered in the clay on the near bank, low amber sun
          from the left casting long shadows east.
    npcs:
      - archetype: "The Desperate Bandit"
        name: "Rafael Soto"
        location: seco_llano
        disposition: 5
        notes: Cuervo lieutenant making contact — testing the stranger's loyalty
      - archetype: "The Homesteader's Wife"
        name: "Martha Harwick"
