# Dust and Lead — Campaign History
# Four chapters tracking the Sangre Territory from first arrival to climax.
# POI descriptions are written for Flux image generation — visual, atmospheric, specific.

chapters:
  - id: fresh
    label: "Arrival — The Drifter Dismounts"
    session_range: [1, 5]
    location: sangre_del_paso
    time_of_day: high_noon
    atmosphere: >-
      The sun is directly overhead and the shadows have nowhere to hide.
      A lone rider appears at the east end of the main street, silhouetted
      against white sky and dust. The horse is tired. The rider is not.
      Shutters close. The saloon piano stops. A dog crosses the street
      and nobody looks at it. Three hundred people hold their breath and
      wait to see which faction this stranger will break for or break against.
    active_stakes: >-
      Establishing yourself in a territory where neutrality is temporary.
      Every faction is sizing you up. The Rangers want to know if you're
      trouble. Los Cuervos want to know if you're useful. The Consolidated
      wants to know if you're for sale. The Families just want to know if
      you'll leave their water alone.
    points_of_interest:
      - name: Sangre del Paso Main Street
        description: >-
          A wide dirt street baking under merciless noon sun. Adobe and
          timber buildings on both sides cast no shadow at this hour. A
          water trough with a single horse tied to a hitching post. The
          courthouse at the north end, the saloon at the south, and between
          them a hundred yards of open ground where a man walking feels
          every window watching. Dust devils spin in the stillness.
        visual_prompt: >-
          spaghetti_western, a wide dirt main street under hard overhead
          noon sun, crushed black shadows pooling directly beneath
          weathered sun-split timber and adobe storefronts on both sides,
          single-story false-front facades with covered plank boardwalks,
          a lone saddled bay horse tied to a single iron-ringed hitching
          post beside a long plank water trough mid-left, a twisting dust
          devil rising in the empty center of the street, pale bleached sky.
      - name: Rosita's Cantina
        description: >-
          The cooler, quieter rival to the Anglo saloon. Thick adobe walls
          keep the interior dim and ten degrees cooler than the street.
          Strings of dried chiles hang from the ceiling beams. A woman
          in her fifties pours mezcal behind a scarred wooden bar without
          being asked. The clientele is Frontera — vaqueros, ranch hands,
          the occasional Cuervo scout in civilian clothes. The back door
          opens onto an alley that leads to the river.
        visual_prompt: >-
          spaghetti_western, the dim interior of a Mexican cantina at
          midday, thick hand-plastered adobe walls in deep shadow, a
          long scarred dark-wood bar across the foreground with three
          tin candle holders and an unstoppered clay mezcal bottle on
          its surface, two strings of dried red chiles hanging from
          rough pine ceiling beams above the bar, a narrow slash of
          white daylight through a single shuttered window at upper
          left, warm amber lantern glow.
      - name: The Sangre River Ford
        description: >-
          Muddy brown water forty feet across and knee-deep at the ford,
          framed by cottonwood trees whose pale bark peels in the heat.
          A rope stretched bank to bank for the crossing. On the far side,
          Mexico — the same dirt, the same sky, a different flag. Boot
          prints and hoof marks churn the mud on both banks. A heron
          stands motionless in the shallows, ignoring the border entirely.
        visual_prompt: >-
          spaghetti_western, a shallow muddy-brown river ford forty feet
          across under hard overhead noon sun, four pale peeling
          cottonwoods crowding each bank with bark sloughing in long grey
          strips, a single thick hemp rope stretched taut bank to bank
          at knee height above the water, a tall grey heron standing
          motionless in knee-deep shallows mid-right, cracked clay banks
          churned deep with overlapping hoof prints and two sets of boot
          tracks, glare off the water, no shadows.
      - name: The Courthouse
        description: >-
          Two-story stone building, the only one in town that isn't adobe.
          A covered porch with a single rocking chair. The territorial flag
          hangs limp in dead air. Wanted posters paper the wall beside the
          door — faces rendered in woodcut, prices in bold type. The jail
          window on the ground floor shows two iron bars and darkness.
          Captain Stone's office is upstairs. The light is always on.
        visual_prompt: >-
          spaghetti_western, a two-story pale sandstone courthouse on a
          dusty street corner under hard overhead noon sun, a covered
          plank porch along the front with a single empty wooden rocking
          chair right of the door, a territorial flag hanging limp on
          a tall pole at the porch's left corner, a dozen wanted posters
          papering the wall beside a heavy iron-strapped oak door, a
          ground-floor window left of the door fitted with two vertical
          iron bars over black interior.
    npcs:
      - archetype: "The Corrupt Authority"
        name: "Harlan Dent"
        location: sangre_del_paso
        disposition: -5
        notes: Deputy — compromised, watching the stranger for the Consolidated
      - archetype: "The Broker"
        name: "Silas Cobb"
        location: sangre_del_paso
        disposition: 10
        notes: First friendly face in the saloon; works for information, not money
      - archetype: "The Frontier Padre"
        name: "Father Mateo"
        location: sangre_del_paso
        disposition: 20
        notes: At the mission — neutral ground, source of local history
    quests: {}
    lore:
      - The ford is the only crossing for twenty miles; whoever controls it controls traffic
      - Los Cuervos have not raided in three weeks — the town is nervous about what that means
      - The Consolidated's surveyor was seen staking the Harwick homestead yesterday
    notes:
      - Players establish base, make first faction contacts
      - The stranger_rides_in trope should activate immediately
      - Deputy Dent approaches casually to gather intelligence
