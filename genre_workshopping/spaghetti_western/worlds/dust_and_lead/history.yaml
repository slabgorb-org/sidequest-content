  - id: mid
    label: "The Reckoning — Nobody Rides Free"
    session_range: [13, 25]
    location: viejo_canon
    time_of_day: dawn
    atmosphere: >-
      The canyon walls glow red at dawn like the inside of a furnace that
      hasn't cooled yet. Everything has escalated. The Consolidated burned
      the Harwick barn. Los Cuervos killed a Ranger deputy. The Apache
      sent a warning nobody understood until the mine foreman's horse
      came back without a rider. You are in the middle of all of it —
      not because you chose to be, but because the territory decided
      you're the fulcrum. Every road out of here goes through someone
      who wants you dead. Every road that stays goes through someone
      who needs you alive. The canyon is beautiful at dawn. The beauty
      doesn't care about any of this.
    active_stakes: >-
      Open conflict between factions. The railroad confrontation reaches
      crisis. Los Cuervos launch their largest raid. The Apache make their
      move on the mine. The player must commit to a side or try to play
      kingmaker — but the territory punishes indecision harder than bad
      decisions. Multiple standoffs. People die who the player cared about.
    points_of_interest:
      - name: The Canyon Ambush Site
        description: >-
          A narrow passage in Viejo Cañón where the walls close to fifteen
          feet apart and rise three hundred feet straight up. The sky is a
          bright slash overhead. Boulders litter the floor where a landslide
          was — or was arranged. Spent brass casings glint in the dust among
          the rocks. A hat with a bullet hole. A dark stain on sandstone
          that nobody will wash away. The perfect killing ground, used
          exactly as designed.
        visual_prompt: >-
          spaghetti_western, a narrow red sandstone canyon passage at
          dawn fifteen feet wide, sheer striated walls rising three
          hundred feet to a bright slash of pale sky, warm low eastern
          light catching only the highest rim of the left wall, the
          floor in cool blue shadow, six large boulders scattered across
          the sand from a fresh landslide, a dark irregular stain low
          on the right wall, a black felt hat with a single bullet hole
          on the sand nearby.
      - name: Ghost Ridge at Dawn
        description: >-
          The high shelf of rock deep in the canyon, reached by a trail
          barely wide enough for a horse. The 1862 massacre site. At dawn,
          the light hits the ridge from the east and turns the bones and
          bullet casings that surface after rain into bright points against
          dark stone. A cairn of stacked rocks marks something nobody alive
          remembers building. The wind sounds like voices if you're tired
          enough. The Apache say you can hear them even when you're not.
        visual_prompt: >-
          spaghetti_western, a high flat rock shelf at dawn deep in a
          red sandstone canyon, warm low eastern sun raking hard from
          the right across dark-red striated stone, a weathered
          waist-high cairn of eight stacked flat rocks mid-frame near
          the shelf's outer edge, a single long eagle feather wedged
          vertically into a crack at the cairn's base, four bleached
          bone fragments in the sand nearby, long sharp shadows reaching
          west, cool shadow pooled in the canyon below.
      - name: The Sierra Perdida Mine Entrance
        description: >-
          A dark mouth in the mountainside braced with timber going grey
          and soft with age. Ore cart tracks disappear into the black.
          Lantern hooks line the entrance, most empty. A guard shack with
          a chair and a repeating rifle leaning against it. Below, the
          switchback trail winds down through stunted pines and bare
          scree. The wind carries the smell of blasting powder and the
          rhythmic ring of picks on stone. The mountain is being eaten
          from the inside.
        visual_prompt: >-
          spaghetti_western, a dark timber-braced mine adit cut into a
          grey shale mountainside at dawn, warm low eastern sun from
          the right lighting the slope, the adit interior receding into
          solid black, weathered grey-pine beams framing the entrance
          with two iron lantern hooks above the lintel, iron ore-cart
          tracks running out across bare scree, a plank guard shack
          with a tin roof right of the entrance, a wooden chair outside
          with a repeating rifle leaning against the wall.
      - name: Rojo Mesa Signal Fire
        description: >-
          The flat summit of the red sandstone mesa, two hundred feet above
          the desert. The remains of a signal fire — blackened stones in a
          circle, ash, charred mesquite branches. From here, every rider
          crossing Seco Llano is visible as a dust plume against white
          earth. To the north, the canyon. To the south, Mexico. The
          wind never stops up here. Whoever lit the last fire left a
          single eagle feather wedged between the stones.
        visual_prompt: >-
          spaghetti_western, the flat red sandstone summit of a desert
          mesa at dawn two hundred feet above the desert floor, low warm
          eastern sun from the right raking across bare rock, a ring of
          a dozen soot-blackened stones mid-frame enclosing cold
          grey-white ash and three charred mesquite branches, a single
          long eagle feather wedged upright between two of the stones,
          the pale flat desert stretching to the horizon far below, cool
          pink-violet dawn sky, long shadows reaching west.
    npcs:
      - archetype: "The Instrument"
        name: "Solomon Cole"
        location: viejo_canon
        disposition: -20
        notes: Hunting the player now, ledger updated
      - archetype: "The Revolutionary"
        name: "Capitán Emilio Fierro"
