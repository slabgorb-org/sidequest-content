# Dust and Lead — Deep History (Legends)
# These are the events that shaped the territory before the player arrives.
# They inform NPC motivations, faction tensions, and the world's scars.

- id: the_crossing
  name: The Crossing
  era: "1848"
  description: >-
    Thirty years ago, a treaty moved the border south. Families who had
    lived on their land for generations woke up in a different country
    without moving a step. The Reyes family, the Vargases, the Delgados —
    their deeds were Mexican. Their land was suddenly American. Some kept
    their holdings. Others lost everything to Anglo lawyers who knew the
    new system better than the old families ever would. The wound never
    healed. It just stopped bleeding where anyone could see.

- id: the_ghost_ridge_massacre
  name: The Ghost Ridge Massacre
  era: "1862"
  description: >-
    During the war between the states, a Confederate patrol rode into
    Viejo Cañón hunting deserters. They found an Apache camp instead.
    What happened next depends on who tells the story. The Anglos say
    the patrol was ambushed. The Apache say the soldiers opened fire
    on women and children. The canyon walls still have bullet scars.
    The Apache call it Ghost Ridge and they have not forgotten.

- id: the_silver_strike
  name: The Silver Strike
  era: "1874"
  description: >-
    A prospector named Cornelius Harwick found silver in the Sierra
    Perdida — a vein thick enough to see from the mine entrance. He
    filed his claim in Sangre del Paso and was dead within a month.
    Officially: heatstroke. The claim passed to his business partner,
    who sold it to the Consolidated Mining & Rail Company for a price
    nobody in town believes was honest. The mine has been producing
    steadily since, staffed by men who have few other options and
    guarded by men who answer to nobody local.

- id: the_first_cuervo
  name: The First Cuervo
  era: "1870"
  description: >-
    When the Rangers hanged three Mexican cattle hands on suspicion
    of rustling — no trial, no evidence, just rope and a cottonwood
    tree — a young vaquero named Emilio Vargas rode south across the
    border and swore he would take back from the Anglos everything
    they had taken from his people. He painted a crow on his saddle.
    Within a year, thirty men rode under that sign. Vargas is dead
    now — killed in a raid in '75 — but Los Cuervos survived him.
    His nephew leads them. The crow still flies.

- id: the_buffalo_soldiers_arrive
  name: The Buffalo Soldiers Arrive
  era: "1875"
  description: >-
    The 10th Cavalry rode into the Sangre Territory with orders to
    pacify the Apache and secure the border. Black soldiers in a
    territory that did not want them, fighting a people they had no
    quarrel with, on behalf of a government that barely acknowledged
    their service. They built Fort Resolución on the eastern edge of
    Viejo Cañón and have held it since, earning the grudging respect
    of everyone except the people they are ordered to hunt.

- id: the_salt_war
  name: The Salt War
  era: "1877"
  description: >-
    The salt flats east of Sangre del Paso had been common ground for
    decades — anyone could harvest salt, Mexican or Anglo. Then an
    Anglo politician filed a claim and declared the salt his private
    property. The Mexican community erupted. Two men died. The Rangers
    came. More men died. The Army came. The salt flats are fenced now.
    The politician is rich. The families who depended on that salt buy
    it from his company at prices they can barely afford. Marshal Dent
    was a deputy then. He stood with the claimant. The Families
    remember.
