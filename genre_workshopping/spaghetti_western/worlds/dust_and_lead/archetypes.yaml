# Dust and Lead — World-Specific NPC Archetypes
# Sangre Territory characters shaped by the three-culture collision.

- name: The Company Man
  description: >-
    A representative of Consolidated Mining & Rail, sent to acquire
    right-of-way by any means the law allows and several it doesn't.
    Educated, soft-handed, and backed by more money than the territory
    has ever seen. Treats the frontier as a business problem.
  personality_traits:
    - persuasive
    - patient
    - utterly amoral about outcomes
  typical_classes:
    - Gambler
    - Drifter
  typical_races:
    - City Exile
  stat_ranges:
    CUNNING: [14, 18]
    PRESENCE: [12, 16]
  inventory_hints:
    - leather portfolio of legal documents
    - a derringer in the vest pocket
    - cash money in quantities the territory finds obscene
  dialogue_quirks:
    - speaks in contract language when cornered
    - never threatens directly — implies with a smile
    - removes his hat indoors, replaces it the moment talk turns to money
    - uses the word reasonable the way other men use a pistol
    - offers to buy drinks with money that smells like eastern banks
    - writes everything down, including things people wish he hadn't heard
    - smiles when delivering ultimatums, as if sharing good news
    - adjusts his cufflinks when the conversation displeases him
  disposition_default: 0
  ocean:
    openness: 4.0
    conscientiousness: 8.0
    extraversion: 6.0
    agreeableness: 3.0
    neuroticism: 2.5

- name: The Ranchera
  description: >-
    A Mexican rancher whose family has worked this land for generations.
    Knows every arroyo, every water source, every boundary marker.
    Tough, practical, and fiercely protective of what's theirs. The
    railroad wants their land. They're not selling.
  personality_traits:
    - stubborn
    - generous with allies
    - long memory for wrongs
  typical_classes:
    - Bounty Hunter
    - Marshal
  typical_races:
    - Frontier Born
  stat_ranges:
    GRIT: [12, 16]
    NERVE: [12, 14]
  inventory_hints:
    - a well-maintained revolver
    - a rope that's lassoed more cattle than people
    - a deed to the land in a strongbox at home
  dialogue_quirks:
    - switches between Spanish and English mid-sentence
    - quotes their grandmother as final authority
    - measures people by how they treat horses
    - uses land features as metaphors — stubborn as caliche, loyal as a river
    - goes quiet before making a decision, like the land before a storm
    - refers to the border as something that moved, not something that is
    - names their tools and speaks to them while working
    - offers food before asking your business — manners are non-negotiable
  disposition_default: 5
  ocean:
    openness: 3.5
    conscientiousness: 7.0
    extraversion: 5.0
    agreeableness: 6.0
    neuroticism: 4.0

- name: The Ranger
  description: >-
    A Texas Ranger assigned to the border district. Enforces the law
    to the river's edge and stops there, staring at the other side
    with professional frustration. Competent, overworked, and slowly
    realizing that the law serves whoever writes it.
  personality_traits:
    - dutiful
    - conflicted
    - increasingly cynical
  typical_classes:
    - Marshal
    - Bounty Hunter
  typical_races:
    - Frontier Born
    - War Survivor
  stat_ranges:
    DRAW: [12, 16]
    NERVE: [14, 16]
  inventory_hints:
    - a star badge worn thin at the edges
    - a repeating rifle in the saddle scabbard
    - a warrant book with too many names
  dialogue_quirks:
    - cites the law even when it doesn't apply
    - long pauses before answering questions about the border
    - touches his badge when making a point, like swearing an oath
    - speaks to outlaws with the same respect he gives the judge
    - keeps a running tally of jurisdiction boundaries in his head
    - says the territory three times in every conversation
    - drinks coffee at every opportunity like a man who's forgotten how to sleep
    - reads warrant descriptions aloud, correcting inaccuracies as he goes
  disposition_default: 0
  ocean:
    openness: 3.0
    conscientiousness: 8.0
    extraversion: 4.0
    agreeableness: 5.0
    neuroticism: 5.5

- name: The Apache Scout
  description: >-
    A member of the Ndé people who moves between the Anglo and Mexican
    worlds with careful neutrality. Knows the mountains better than
    anyone alive. Offers guidance to those who earn trust, and silence
    to everyone else. Watches the territory change with patient grief.
  personality_traits:
    - observant
    - patient
    - deeply private
  typical_classes:
    - Drifter
    - Bounty Hunter
  typical_races:
    - Frontier Born
  stat_ranges:
    CUNNING: [14, 18]
    GRIT: [12, 14]
  inventory_hints:
    - a knife older than the territory
    - a water skin that's always full
    - no gun — by choice, not inability
  dialogue_quirks:
    - answers questions with questions
    - refers to Anglo and Mexican settlements by older names
    - speaks about the mountains the way others speak about family
    - pauses to listen to wind or birds mid-conversation, as if consulting them
    - uses Anglo words only when no better word exists
    - tells you what you need to know by telling you a story about something else
    - tracks the sun's position while talking, timing departures by shadow length
    - looks at your hands before your face when meeting you
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 7.0
    extraversion: 2.0
    agreeableness: 4.0
    neuroticism: 3.0

- name: The Cantinera
  description: >-
    The woman who runs the cantina in Sangre del Paso — the only neutral
    ground in the territory. Hears everything, serves everyone, judges
    quietly. Has thrown out Rangers, outlaws, and railroad men with equal
    authority. The cantina has never been robbed. Nobody talks about why.
  personality_traits:
    - unflappable
    - shrewd
    - protective of her space
  typical_classes:
    - Gambler
  typical_races:
    - Frontier Born
  stat_ranges:
    PRESENCE: [14, 18]
    CUNNING: [12, 16]
  inventory_hints:
    - a shotgun under the bar
    - a ledger of debts owed
    - keys to rooms that are rented by the hour and the secret
  dialogue_quirks:
    - pours drinks while delivering devastating assessments of character
    - knows your name before you introduce yourself
    - wipes the bar in circles when she's thinking, stops when she's decided
    - refers to the cantina as her territory the way a general refers to a battlefield
    - remembers what you drank last time and pours it without asking
    - speaks to everyone like she's already forgiven them for something
    - turns her back to reach for a bottle at the exact moment a point lands
    - calls closing time whenever a conversation turns dangerous
  disposition_default: 5
  ocean:
    openness: 5.5
    conscientiousness: 7.0
    extraversion: 6.0
    agreeableness: 5.0
    neuroticism: 2.0
