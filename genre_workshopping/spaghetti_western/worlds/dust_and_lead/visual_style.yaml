# Dust and Lead — World-Specific Visual Style
# Overrides genre defaults for the Sangre Territory setting.
# Chihuahuan desert specifics — red rock, white alkali, the river.

positive_suffix: >-
  cinematic western film still, harsh Chihuahuan desert midday sun,
  red rock canyons and white alkali flats, the Sangre River cutting
  through dusty lowland, adobe mission walls and wooden ranch buildings,
  sweat on leather, extreme close-up Leone framing, 1860s frontier
  clothing and equipment, Technicolor film grain, Mexican and Anglo
  frontier architecture side by side, the railroad's iron reaching west

negative_prompt: >-
  clean, new, shiny, soft lighting, pastel colors, modern, anime,
  cartoon, green lush landscape, snow, rain, fantasy, medieval,
  armor, swords, magic, neon, digital art, 3d render, smooth skin,
  prairie grassland, Pacific coast, forest

preferred_model: dev

base_seed: 1966

visual_tag_overrides:
  town: >-
    sun-bleached frontier town with wooden false-front buildings, a
    dusty main street wide enough for a stagecoach, a saloon with
    batwing doors, a general store, hitching posts, horses standing
    in thin shade, heat shimmer rising from packed earth
  ranch: >-
    adobe ranch house with a covered porch, corrals of weathered
    timber, cattle visible in the distance, cottonwood trees along
    an irrigation ditch, a windmill turning slowly, the mountains
    blue in the background
  cantina: >-
    interior of a Mexican cantina, cool dark adobe walls, a wooden
    bar stained with decades of use, candles in tin holders, a guitar
    leaning against the wall, colorful papel picado banners, the
    sound of someone who was just talking stopping
  river: >-
    the Sangre River — wide, shallow, muddy brown, cottonwoods on
    both banks, a ford crossing with wheel ruts, the Mexican side
    visible through river willows, footprints and hoofprints in
    the mud bank
  canyon: >-
    red rock canyon with sheer walls, narrow passage, shade that
    feels like ambush, petroglyphs visible on the rock face,
    a thin stream at the bottom, hawk circling overhead
  desert: >-
    Chihuahuan desert stretching to the horizon, creosote bush
    and mesquite, white alkali patches, distant mountains purple
    with haze, a road that's really just wheel tracks in dust,
    vultures circling something you can't see yet
  railroad: >-
    fresh-laid railroad track stretching into desert, wooden ties
    on gravel bed, survey stakes with red flags, a work crew in the
    distance, a water tower, the iron and wood geometry of progress
    cutting through wilderness
  mission: >-
    Spanish colonial mission with crumbling adobe walls, a bell tower
    with one bell, a graveyard with wooden crosses, prickly pear
    cactus growing through the walls, interior cool and dark with
    painted santos on the altar
