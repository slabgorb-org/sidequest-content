# Road Warrior cultures are crew types and road backgrounds.
# These are generic fallbacks — worlds should override with
# their own faction-specific cultures and conlang systems.
# Names blend road handles, rig nicknames, and crew traditions.
# Every rider has a road name. Every rig has a name.

- name: Convoy Born
  summary: "Crew families — raised in the culture"
  description: >-
    Born into a crew. Raised in garages, grew up at meets, learned to
    ride before they learned to drive. Crew names are family names.
    Road names are earned young and stick forever.
  slots:
    given_name:
      word_list:
        - Axle
        - Blaze
        - Cinder
        - Diesel
        - Ember
        - Flint
        - Gauge
        - Haze
        - Junction
        - Keel
        - Lug
        - Meridian
        - Nox
        - Piston
        - Ratchet
        - Sable
        - Torque
        - Vex
        - Wire
        - Zenith
    family_name:
      word_list:
        - Cruz
        - Ironside
        - Nakamura
        - Kovacs
        - Redline
        - Santos
        - Blacktop
        - Okafor
        - Chen
        - Petrov
    title:
      word_list: [Boss, Lead, Elder, First, Captain, Chief]
    place_noun:
      word_list: [garage, corner, lot, block, strip, yard, alley, crossing]
    adjective:
      word_list: [old, iron, black, red, chrome, broken, long, neon]
  person_patterns:
    - "{given_name} {family_name}"
    - "{title} {given_name}"
    - "{given_name}"
  place_patterns:
    - "{given_name}'s {place_noun}"
    - "The {adjective} {place_noun}"
    - "{family_name} {place_noun}"

- name: Pit Crew
  summary: "Mechanics, engineers, and builders"
  description: >-
    Mechanics, engineers, and builders. Pit Crew names are earned —
    nicknames based on what you're good at or what you survived.
    Formal names exist but nobody uses them.
  slots:
    given_name:
      word_list:
        - Wrench
        - Spark
        - Gasket
        - Cam
        - Bore
        - Rivet
        - Clutch
        - Crank
        - Socket
        - Flux
        - Solder
        - Lathe
        - Shim
        - Tap
        - Bearing
    family_name:
      word_list:
        - Fingers
        - Hands
        - Two-Stroke
        - Boltcutter
        - Greasefire
        - Flathead
        - Torchlight
        - Overhaul
