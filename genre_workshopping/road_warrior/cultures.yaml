- name: Outlaw
  summary: "Runners, smugglers, and road criminals"
  description: >-
    Runners, smugglers, and road criminals. Outlaws use handles — short,
    sharp, memorable. Your handle IS your identity. Real names are
    secrets or forgotten.
  slots:
    given_name:
      word_list:
        - Razor
        - Slash
        - Ghost
        - Smoke
        - Viper
        - Jackal
        - Fang
        - Hex
        - Shade
        - Ruin
        - Havoc
        - Spite
        - Grim
        - Scar
        - Blight
    family_name:
      word_list:
        - Runner
        - Rider
        - Burner
        - Drifter
        - Breaker
        - Chaser
        - Stalker
        - Rattler
        - Howler
        - Cutter
    title:
      word_list: [The, Old, Mad, Dead, Last, One-Eyed, No-Name]
    place_noun:
      word_list: [den, hideout, alley, strip, turf, hole, corner, blind]
    adjective:
      word_list: [bloody, burned, hollow, wrecked, stolen, cursed, nameless, dark]
  person_patterns:
    - "{given_name}"
    - "{title} {given_name}"
    - "{given_name} the {family_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{given_name}'s {place_noun}"

- name: Gearhead
  summary: "Came to the culture through the machine"
  description: >-
    Not born into a crew — drawn in by the machines. Gearheads are
    the technical obsessives, the ones who came for the engines and
    stayed for the culture. Names are often borrowed from parts,
    tools, or the sound an engine makes when it's perfect.
  slots:
    given_name:
      word_list:
        - Apex
        - Cam
        - Rev
        - Boost
        - Dyno
        - Nitro
        - Torque
        - Intake
        - Bore
        - Turbo
        - Shift
        - Stroke
        - Valve
        - Timing
        - Throttle
    family_name:
      word_list:
        - Works
        - Customs
        - Speed
        - Motor
        - Racing
        - Performance
        - Machine
        - Engineering
        - Tuning
        - Fabrication
    title:
      word_list: [Top, Head, Chief, Master, Senior]
    place_noun:
      word_list: [shop, works, garage, dyno, track, bench, pit, bay]
    adjective:
      word_list: [fast, tuned, bored, stroked, ported, polished, balanced, blueprinted]
  person_patterns:
    - "{given_name}"
    - "{given_name} {family_name}"
    - "{title} {given_name}"
  place_patterns:
    - "{given_name}'s {place_noun}"
    - "The {adjective} {place_noun}"
    - "{family_name} {place_noun}"

- name: Scrapper
  summary: "Self-made riders who built their way in"
  description: >-
    Nobody gave them anything. Found the frame in a yard, the engine
    in a listing, the will in themselves. Scrappers earned every mile.
    Their names are what sticks — whatever someone called them the
    first time they showed up and it just stayed.
  slots:
    given_name:
      word_list:
        - Patch
        - Stitch
        - Scrap
        - Wire
        - Salvage
        - Junk
        - Rust
        - Scratch
        - Dent
        - Duct
        - Bolt
        - Weld
        - Hammer
        - Nail
        - Hack
    family_name:
      word_list:
        - Yard
        - Parts
        - Salvage
        - Junk
        - Found
        - Built
        - Made
        - Earned
        - Pulled
        - Dragged
    title:
      word_list: [Old, Young, Little, Big, Lucky, Scrappy]
    place_noun:
      word_list: [yard, lot, heap, pile, shed, barn, ditch, curb]
    adjective:
      word_list: [rusty, bent, patched, welded, found, stolen, rebuilt, salvaged]
  person_patterns:
    - "{given_name}"
    - "{title} {given_name}"
    - "{given_name} {family_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{given_name}'s {place_noun}"

- name: Legacy
  summary: "Inherited status, reputation, or a rig"
  description: >-
    Came into the culture carrying someone else's name. A parent's
    rig, a dead rider's patch, an old Boss's reputation. Legacy
    riders are judged before they open their mouths — the question
    is always whether they're living up to or hiding from the name.
  slots:
    given_name:
      word_list:
        - Junior
        - Ghost
        - Echo
        - Shadow
        - Heir
        - Second
        - Next
        - Young
        - New
        - Little
        - Minor
        - Last
        - Late
        - Namesake
        - Son
    family_name:
      word_list:
        - the name they inherited
        - the crew they were born into
    title:
      word_list: [Young, Junior, Little, The Next, The Other, The New]
    place_noun:
      word_list: [garage, corner, house, seat, territory, route, run, mile]
    adjective:
      word_list: [old, original, first, last, same, new, other, true]
  person_patterns:
    - "{given_name}"
    - "{title} {given_name}"
    - "Young {given_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{given_name}'s {place_noun}"
