tone: defiant-kinetic
lethality: gritty
magic_level: none
# DRAFT (2026-04-27): the `magic_level` flag is being retired and is wrong here.
# The named vehicle (Interceptor, War Rig, Pursuit Special) is the magic item.
# "The man with the V8 Interceptor" is mythic-folkloric item-magic; the mechanic
# is the McCoy/inventor source. World-knowledge is folkloric. See ./magic.yaml
# for the napkin-shaped truth and docs/design/magic-taxonomy.md for the framework.

stat_generation: point_buy
point_buy_budget: 27

ability_score_names:
  - Grip
  - Iron
  - Nerve
  - Scrap
  - Road Sense
  - Swagger

allowed_classes:
  - Wheelman
  - Wrecker
  - Grease Monkey
  - War Rider
  - Chrome Saint
  - Road Preacher

allowed_races:
  - Convoy Born
  - Gearhead
  - Outlaw
  - Pit Crew
  - Scrapper
  - Legacy


stat_display_fields:
  - hp
  - max_hp
  - rig_hp
  - rig_max_hp
  - fuel
  - injuries


default_class: Wheelman
default_race: Scrapper
race_label: Background
class_label: Role
default_location: "In a garage with the hood up, radio on, crew somewhere nearby"
default_time_of_day: dawn

custom_rules:
  lethality: gritty
  rest_variant: gritty_realism
  encumbrance: variant

  # --- DAMAGE MODEL: RIG IS YOUR ARMOR ---

  damage_model: >-
    The rig is the character's protection. While mounted, all incoming
    damage hits Rig HP first — the driver is shielded by steel, speed,
    and momentum. The rig degrades visibly as Rig HP drops: panels fly
    off, engine smokes, systems fail. The narrator MUST reflect rig
    damage in the scene — this is not a hidden number, it is the most
    visible thing happening.

    When Rig HP hits zero: CRASH EVENT. The rig is wrecked. The driver
    takes an injury roll from the crash itself, and is now dismounted —
    exposed, slow, vulnerable. Whatever caused the crash is still there.

    Dismounted characters have no HP buffer. Every hit lands directly.
    Injury system applies — humans don't have hit point pools, they get
    hurt and it's bad.

  rig_damage_tiers: >-
    100% — Tight. Everything works. Engine purrs.
    75%  — Cosmetic damage. Rattles, dents, a cracked mirror. Functional.
    50%  — Systems failing. Door hanging off, windshield gone, exhaust
           dragging sparks. Speed penalty begins.
    25%  — Skeleton mode. Barely holding together. Major speed penalty,
           mount slots may be destroyed, fire risk on any hit.
    0%   — Wreck. Crash event. Driver takes injury roll. Rig is dead
           until repaired (if salvageable) or replaced (story arc).

  injury_system: >-
    Humans don't have hit point pools. When a character takes direct
    damage (dismounted, crash event, boarding combat, or rig pierced),
    they take an INJURY — a specific, narratable wound with mechanical
    consequences. A slashed arm means Grip penalty. A concussion means
    Road Sense penalty. Injuries linger — they heal slowly, require
    medical attention, and the narrator references them until healed.
    Enough injuries and you're out — unconscious, dying, or dead
    depending on the lethality axis.

  # --- RIG AS IDENTITY ---

  rig_rules: >-
    Every character has a Rig Block on their Car-acter Sheet. The rig is
    not equipment — it is your armor, your weapon, and your home. Rig
    stats: Rig Name (player-chosen), Rig Type (world-defined), Rig HP,
    Speed, Armor, Fuel, Mount Slots (weapon/tool hardpoints that scale
    with level), and Scars (narrative history of damage and repairs).

    Losing your rig is the worst thing that can happen short of death.
    You lose your HP buffer, your speed, your mounts, your identity.
    You're meat on the road.

  fuel_system: >-
    Fuel is tracked during chases and long runs — not as a survival
    resource but as a tactical one. Running low mid-chase means hard
    decisions. Running dry means your rig is dead weight — still
    provides cover (Rig HP remains) but no speed, no escape. In normal
    play, fuel is available at gas stations like anywhere else. The
    drama isn't "can I find fuel" — it's "can I afford to burn fuel
    on this chase and still make it across town."

  chase_system: >-
    Chases are structured as beat sequences, not single rolls. Each chase
    has an Opening (engage or evade?), Pursuit (distance, terrain, hazards),
    Escalation (boarding, weapons, rig damage), Crisis (something breaks,
    someone falls, a choice), and Resolution (wreckage, escape, or victory).
    Each beat is a decision point. If there is no decision, skip the beat.
    Rig HP degrades through the chase — the narrator reflects this as
    progressive visible damage. Allies can fall. The fortress crumbles.

  dismounted_rules: >-
    A driver without a rig is in survival mode. No Rig HP buffer — all
    damage is direct injury. All Grip checks are at disadvantage. Swagger
    checks to maintain reputation take a penalty. Movement is slow in a
    world built for wheels. The world treats you differently — you're a
    driver who lost their ride. Getting a new rig or recovering your old
    one is a story arc, not a shopping trip. The narrator should make
    dismounted sequences feel desperate and wrong — this is not where
    you belong.

resources:
  - name: fuel
    label: Fuel
    min: 0.0
    max: 100.0
    starting: 50.0
    voluntary: false
    decay_per_turn: 0.0

encounter_base_tension:
  random: 0.10
  road_encounter: 0.20
  ambush: 0.35
  chase: 0.40
  boss: 0.45
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Wasteland Bargain"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Make Your Case"
        metric_delta: 2
        stat_check: Swagger
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: Iron
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Rev the engine. Let them hear what's coming."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: Swagger
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: Iron
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player fires up the rig and leaves. No deal."
    mood: tension

  - type: combat
    label: Vehicular Combat
    category: combat
    # Momentum as "control of the engagement" — who's on the offensive,
    # who's running. Rig damage and character HP live on character state;
    # momentum tracks whether the pack is routing you or you them.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: ram
        label: Ram
        metric_delta: 4
        stat_check: Grip
        risk: "Rig damage on failure — lose 2 momentum and take hull damage"
        effect: "Target rig takes severe damage"
        narrator_hint: Steel on steel at speed. Sparks, crumpled panels, the shriek of metal.
      - id: sideswipe
        label: Sideswipe
        metric_delta: 2
        stat_check: Grip
        effect: "Force target to swerve, deal glancing damage"
        narrator_hint: Paint trades paint. The two rigs grind together at sixty and part.
      - id: evasive
        label: Evasive Maneuver
        metric_delta: 1
        stat_check: Iron
        effect: "Reduce incoming rig damage this round"
        narrator_hint: Cut the wheel hard, thread the gap, let them shoot dust.
      - id: disengage
        label: Peel Off
        metric_delta: 0
        stat_check: Road Sense
        resolution: true
        consequence: "Combat ends — break away from the pack"
        narrator_hint: Cut the throttle, fall back, let them roar past into the dust.
    mood: combat
  - type: chase
    label: Road Chase
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: floor_it
        label: Floor It
        metric_delta: 2
        stat_check: Road Sense
        narrator_hint: Engine screams, dust plume stretches behind.
      - id: terrain_cut
        label: Terrain Cut
        metric_delta: 3
        stat_check: Scrap
        risk: "Rollover — take rig damage on failure"
        narrator_hint: Leave the road. Cut across hardpan, jump a wash.
      - id: smoke_screen
        label: Smoke Screen
        metric_delta: 1
        stat_check: Scrap
        effect: "Oil burn or dust cloud blinds pursuit"
      - id: engine_kill
        label: Kill the Engine
        metric_delta: 0
        stat_check: Road Sense
        resolution: true
        consequence: "Chase ends — coast to a stop in the dust, hidden"
    mood: tension

