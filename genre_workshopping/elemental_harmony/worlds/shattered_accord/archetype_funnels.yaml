funnels:

  # ── Jade Reclamation — Earth Channelers & Imperial Apparatus ───────────────
  - name: Celestial Wall Garrison
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Jade Reclamation
    lore: >-
      Songnan the Silent has garrisoned the Celestial Wall and the Shou Pass
      ostensibly against spirit incursions — but every neighboring nation reads
      the deployment correctly. A Celestial Wall Garrison soldier is an earth
      channeler trained in the deep-root form, immovable in combat and equally
      immovable in their certainty that Jade sovereignty over the Broken Nexus is
      natural law rather than political position. Privately, more than one has
      started to wonder whether the doctrine they enforce can mend what hubris broke.
    cultural_status: imperial authority in Jade territory, occupying force everywhere else
    disposition_toward:
      The Sealed Gate: hostile pressure
      The Accord Reborn: uneasy alignment of convenience
      The Monsoon Pact: active adversary

  - name: Pingzhou Network Agent
    absorbs:
      - [outlaw, control]
      - [explorer, stealth]
    faction: The Jade Reclamation
    lore: >-
      Pingzhou Anhai coordinates the Jade Reclamation's shadow operations across
      every nation — bribing, assassinating, and destabilizing governments that
      resist Jade expansion. A Pingzhou Network Agent operates without insignia or
      acknowledgment, funded through trade networks that look legitimate until the
      ledgers are examined by someone who knows what to look for. They are not
      soldiers; they are pressure applied in places where soldiers would cause
      incidents. The Jade Kingdoms view them as diplomacy by other means. Their
      targets call them something less euphemistic.
    cultural_status: invisible by design, catastrophic when exposed
    disposition_toward:
      The Sealed Gate: active subversion
      The Monsoon Pact: ongoing destabilization
      The Drowned Covenant: exploited as useful chaos

  # ── Accord Reborn — Air Channelers & Idealist Missionaries ─────────────────
  - name: Spirit-Tear Mender
    absorbs:
      - [sage, healer]
      - [caregiver, healer]
      - [magician, healer]
    faction: The Accord Reborn
    lore: >-
      The Accord Reborn began as a scholarly monastic order at the Sky Temples
      and has grown increasingly desperate as elemental instability worsens. A
      Spirit-Tear Mender travels between the shards attempting to seal the rents
      in reality through voluntary elemental alignment — a process that costs
      pieces of themselves each time it fails. They carry cracked focus stones
      and journals full of failed binding attempts, and they apologize to spirits
      before channeling them. Their idealism has not broken. It has simply been
      tempered by exhaustion into something that looks like stubbornness.
    cultural_status: respected across most factions, recruited by some against their will
    disposition_toward:
      The Jade Reclamation: wary cooperation, deepening disillusionment
      The Drowned Covenant: principled opposition
      The Sealed Gate: blocked at every border crossing

  - name: Sacred Spire Adjudicant
    absorbs:
      - [sage, control]
      - [ruler, support]
    faction: The Accord Reborn
    lore: >-
      Dhya of the Eternal Cloud has become convinced that nations unwilling to
      contribute to the reconstruction effort must be guided — a euphemism for
      compelled. A Sacred Spire Adjudicant carries that mandate in every room they
      enter, trailing the Sky Temples' self-appointed authority to adjudicate
      elemental disputes and demand channeler contributions from any nation they
      deem insufficiently committed. The spiritual robes are genuine. The imperialism
      wearing them has become harder to distinguish from the doctrine underneath.
    cultural_status: authoritative in Sky Temple territory, resented beyond it
    disposition_toward:
      The Monsoon Pact: aggressive recruitment
      The Jade Reclamation: theological rivalry barely masking territorial competition
      The Sealed Gate: declared them uncooperative, awaiting instruction

  # ── Drowned Covenant — Ocean Channelers & Spirit-Merged ────────────────────
  - name: Covenant Tide-Caller
    absorbs:
      - [magician, control]
      - [magician, dps]
    faction: The Drowned Covenant
    lore: >-
      The Drowned Covenant believes the Shattering liberated spirits from unjust
      imprisonment, and their channelers have merged partially with the deep-ocean
      spirits Taamila's sacrifice awakened. A Covenant Tide-Caller can call
      localized tsunamis, bend currents to crush ship hulls, and breathe
      underwater for hours — but each use of these powers costs something human.
      Their skin has grown translucent. Their eyes carry no light. Their voice
      holds the harmonic resonance of very deep water. They are visibly changed
      and entirely certain they chose correctly.
    cultural_status: terrifying to encounter, worshipped within the Covenant's inner circles
    disposition_toward:
      The Jade Reclamation: sworn annihilation
      The Accord Reborn: theological war, will not seal the tears
      The Monsoon Pact: dangerous allies, incompatible ideology

  - name: Qalanolei Diver
    absorbs:
      - [explorer, stealth]
      - [outlaw, stealth]
    faction: The Drowned Covenant
    lore: >-
      The sunken ruins of Qalanolei's Atoll are visible on clear days as dark
      shapes beneath the waves, haunted by the deep-ocean spirits that Taamila's
      drowning fed. A Qalanolei Diver navigates those lightless streets on
      behalf of the Covenant, retrieving artifacts from before the Shattering,
      scouting Jade naval movements from below, and passing messages through
      water-channels that no surface-based intelligence network can intercept.
      They move through the world as though gravity is a preference rather than
      a fact — which, for someone partially merged with a current-spirit, it is.
    cultural_status: unknown to most; those who've seen them describe something that used to be human
    disposition_toward:
      The Jade Reclamation: underwater warfare
      The Accord Reborn: contempt for those who want to seal the spirits away again

  # ── Sealed Gate — Iron Peaks Isolationists ─────────────────────────────────
  - name: Hyeong Ridge Forgemaster
    absorbs:
      - [hero, tank]
      - [hero, dps]
    faction: The Sealed Gate
    lore: >-
      The fire-spirits that Tsuka of Ash Peak's conflagration left behind still
      nest in the twisted iron of Hyeong Ridge. A Hyeong Ridge Forgemaster has
      learned not to tame them but to negotiate with them, hammer-blow by hammer-blow,
      extracting weapons and tools from spirit-infested ore that any other smith
      would walk away from. The resulting equipment is irregular, temperamental,
      and extraordinarily effective. The Forgemaster carries burn scars that pattern
      like forge-script and taps metal surfaces to listen to their composition before
      striking — a habit that transfers, unnerving, to wooden tables and stone floors.
    cultural_status: irreplaceable within the Iron Peaks, practically unknown outside sealed borders
    disposition_toward:
      The Jade Reclamation: absolute refusal
      The Accord Reborn: blocked at the wall
      The Sealed Gate: one of the things keeping it standing

  - name: Namhan Wall-Warden
    absorbs:
      - [ruler, support]
      - [sage, support]
    faction: The Sealed Gate
    lore: >-
      Mong of Iron Stronghold commands the Sealed Gate from Suwon Stronghold, and
      a Namhan Wall-Warden is the doctrine made walking — an earth channeler who
      can sense vibrations through a hundred meters of solid rock and has devoted
      that sensitivity entirely to monitoring the Jade Reclamation's tunneling
      operations beneath the fortified passes. They know every Jade probe before
      it surfaces. They are also aware, with the specificity of someone who knows
      exactly how many food convoys have not arrived, that the sealed borders are
      slowly starving the people they protect. The internal opposition Jungnyasan
      leads is not wrong. A Wall-Warden knows this and walls anyway.
    cultural_status: fortress authority within the Iron Peaks, the seal enforced in living form
    disposition_toward:
      The Jade Reclamation: hostile vigilance
      The Accord Reborn: distrustful of any outside offer, however sincere

  # ── Monsoon Pact — Naval Coalition & Jungle Court Diplomats ─────────────────
  - name: Storm Shore Channeler
    absorbs:
      - [hero, dps]
      - [magician, dps]
    faction: The Monsoon Pact
    lore: >-
      Garuda Kreah forged the Monsoon Pact at the Moonlit Palace with storm-
      channeling rituals that sealed the alliance in force as well as intention.
      A Storm Shore Channeler — trained in the monsoon-dance tradition at Rathep's
      Temple — combines wind and ocean currents into an offensive form that is
      simultaneously performance and devastation. Their blood-offerings are their
      own, which the ocean-spirits apparently read as genuine commitment. Pounamilaq
      of the Storm Shore commands them from Upapuuk's Shore, and they patrol sea
      lanes that both the Jade Reclamation and the Accord Reborn badly need.
    cultural_status: celebrated in Monsoon Courts, feared at sea, unknown inland
    disposition_toward:
      The Jade Reclamation: defensive patrol hardening into offense
      The Drowned Covenant: dangerous fanatics the Pact cannot afford to alienate

  - name: Flowering Falls Envoy
    absorbs:
      - [lover, healer]
      - [lover, support]
      - [caregiver, support]
    faction: The Monsoon Pact
    lore: >-
      Rishi Kalamphaitie has been dispatched to Amber Harbor in the Lotus Provinces
      to negotiate Ngọc of the Misty Garden's support — protection for access to
      trade wealth. A Flowering Falls Envoy carries that mandate into rooms where
      force would only produce corpses, finding the precise intersection of what
      each party needs and what they fear to lose. They remember names, moods, the
      particular grief behind a political position. In a world where most channelers
      solve problems with elemental force, an envoy who solves them with attention
      is a rare and genuinely threatening advantage.
    cultural_status: respected in all courts, trusted only in their own
    disposition_toward:
      The Lotus Provinces: active negotiation
      The Accord Reborn: diplomatic competition for the same neutral nations
      The Sealed Gate: ongoing, fruitless outreach

  # ── Unaffiliated & Wandering ────────────────────────────────────────────────
  - name: Spirit-Fog Navigator
    absorbs:
      - [explorer, jack_of_all_trades]
      - [hero, jack_of_all_trades]
      - [everyman, jack_of_all_trades]
    faction: null
    lore: >-
      Travel between the eight shards requires either navigating the spirit-fog by
      ship or crossing through the tears themselves, and both methods kill the
      unprepared. A Spirit-Fog Navigator has survived long enough to know the
      difference between a tear that leads somewhere traversable and one that
      simply unmakes whoever enters. They carry no faction allegiance because all
      factions pay for passage, and neutrality between powers who would otherwise
      compete for your services is the oldest form of route-based wealth. Their
      charts are incomprehensible to anyone who hasn't developed the ability to
      read elemental resonance as a navigational sense.
    cultural_status: essential to inter-shard trade, trusted only as far as the charter
    disposition_toward:
      The Drowned Covenant: contractual navigation, careful distance
      The Jade Reclamation: reluctant service, they pay the best

  - name: Kṛṣṇa Mandala Ascetic
    absorbs:
      - [sage, dps]
      - [innocent, healer]
      - [innocent, support]
    faction: null
    lore: >-
      The Saffron Reaches' sacred sites — the Kṛṣṇa Mandala, the Lantern Garden —
      are threatened by elemental instability that worsens with each passing year,
      as the great powers recruit or press-gang the Reaches' channelers into larger
      conflicts. A Kṛṣṇa Mandala Ascetic is what remains when a tradition that
      once trained scholars has been stripped of everyone with martial utility:
      the earnest, the idealistic, the ones the recruiters judged too young or too
      gentle to conscript. They turn out to be harder than expected. Gentleness
      in an unstable world requires more discipline, not less.
    cultural_status: overlooked by the great powers, load-bearing for the communities they serve
    disposition_toward:
      The Accord Reborn: sincere alignment, unease at the faction's growing authoritarianism
      The Jade Reclamation: avoidance and quiet resistance

  - name: Broken Nexus Seeker
    absorbs:
      - [magician, control]
      - [everyman, support]
    faction: null
    lore: >-
      The great theological question of the age is whether the Accord Eternal can
      ever be restored — or whether the spirit world and the mortal world are now
      permanently fused, and whether that fusion is a catastrophe or a new reality
      to be mastered. A Broken Nexus Seeker has chosen to find out by going to look,
      which every faction considers either noble or suicidal depending on what they
      want from the Nexus. They carry eight cracked focus stones, one for each
      element, and a journal of theories that is also a record of how many times
      reality has refused to cooperate with theory.
    cultural_status: respected in the abstract, avoided in practice — people who go to the Nexus change
    disposition_toward:
      The Accord Reborn: the thing they want to believe is right
      The Drowned Covenant: the dark possibility they cannot stop thinking about

  - name: Hyeong Ridge Survivor
    absorbs:
      - [outlaw, dps]
      - [everyman, support]
    faction: null
    lore: >-
      The Iron Peaks' sealed borders have left whole communities starving for trade
      goods while Jungnyasan of Frosted Hall quietly argues for opening at least one
      gate. A Hyeong Ridge Survivor comes from the people squeezed between those two
      positions — neither the committed isolationism of Mong's garrison nor the
      measured pragmatism of the internal opposition, but simple necessity: they
      crossed the wall because crossing the wall was the only way to keep someone
      alive. They carry skills built by a culture that expects no outside help and
      the wariness of someone who has been on the wrong side of every faction's
      border policy simultaneously.
    cultural_status: outlaw in the Iron Peaks, foreigner everywhere else
    disposition_toward:
      The Sealed Gate: complicated loyalty mixed with active resentment
      The Jade Reclamation: deep distrust of the force that made the wall necessary

  - name: Lotus Delta Merchant
    absorbs:
      - [artist, support]
      - [artist, control]
    faction: null
    lore: >-
      The Lotus Provinces' coastal trading states have survived the Shattering by
      being useful to everyone and dangerous to no one — a position that requires
      both commercial acumen and the kind of cultural performance that makes
      visiting powers feel welcome rather than managed. A Lotus Delta Merchant
      carries calligraphy tools alongside cargo manifests, practices the art of
      the graceful presentation, and maintains relationships with every faction's
      buyers through the simple expedient of being genuinely interesting company.
      Ngọc of the Misty Garden's negotiation with the Monsoon Pact runs through
      exactly this network.
    cultural_status: welcome in every port, trusted by the commerce itself rather than any power
    disposition_toward:
      The Monsoon Pact: cautious alignment developing toward genuine partnership
      The Jade Reclamation: commercial compliance and private anxiety

  - name: Wind-Mad Wanderer
    absorbs:
      - [jester, control]
      - [jester, stealth]
    faction: null
    lore: >-
      Spirit-tears that pour wind-spirits into the mortal world have driven listeners
      mad with voices that carried too much information about what the world actually
      is. A Wind-Mad Wanderer received that gift at the wrong moment — or the right
      one — and came out the other side with a grip on reality that is technically
      functional but runs on completely different rails from everyone else's. They
      move in ways that look like play, misdirect through apparent confusion, and
      arrive at correct conclusions through routes that cannot be mapped after the
      fact. The Accord Reborn wants to study them. Everyone else wants to stand
      slightly to one side.
    cultural_status: harmless-seeming until they are not, which is the point
    disposition_toward:
      The Accord Reborn: the one faction they find genuinely funny
      The Drowned Covenant: deep mutual recognition, deeply uncomfortable
