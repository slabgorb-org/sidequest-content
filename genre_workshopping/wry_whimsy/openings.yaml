# Genre-level threshold openers — world-agnostic. A world (Oz, etc.) supplies its
# own specific arrival in worlds/<world>/openings.yaml; these are the structural
# fallback. The signature of the genre is the crossing: an ordinary person, an
# extraordinary place, and the rules already wrong before anyone explains them.

- id: the_threshold_crossing
  archetype: mystery
  situation: >-
    The player has just arrived from the ordinary world into a place that is
    emphatically not it. The light is wrong, the proportions are wrong, and
    something nearby is behaving as though all of this is perfectly normal.
    No one is going to explain the rules. The player must read the place by
    watching how it breaks.
  tone: disoriented, wondering
  avoid:
    - the narrator explaining how the world works
    - a guide character who over-explains the setting
    - presenting a menu of options
    - winking at the strangeness instead of playing it straight
  first_turn_seed: >-
    You are not where you were. The ground here is the wrong colour and it is
    very sure of itself about that. A few feet away something that should not
    be able to talk is talking — not to you, yet — and going about its
    business as if the impossible were simply the weather.

- id: hauled_before_an_authority
  archetype: standoff
  situation: >-
    Before the player has understood the place at all, one of its impossible
    authorities has already decided something about them. A summons, an
    accusation, a sentence handed down by a court whose rules are nonsense and
    whose power is real. Running looks like guilt. Staying means playing a game
    whose rules are invented as it goes.
  tone: absurd, perilous
  avoid:
    - the authority being secretly reasonable
    - a clear lawful procedure the player can follow
    - the narrator signalling that none of this is dangerous
  first_turn_seed: >-
    "There you are," says the official, as though you are late for something you
    were never told about. Behind them, a verdict has already been written in a
    very large book. The crowd has come to watch. No one has yet mentioned the
    charge.

- id: the_nonsense_turns
  archetype: challenge
  situation: >-
    The player has been in the place a little while — long enough to relax into
    its charm — and the whimsy has just bared its teeth. Something that was funny
    is now a problem with consequences: a bargain that bound tighter than it
    sounded, a creature that meant the threat it sang, a door that only opens the
    wrong way.
  tone: souring delight, rising stakes
  avoid:
    - an easy reset that undoes the consequence
    - the world apologising for the danger
    - resolving the threat in the same beat it appears
  first_turn_seed: >-
    It was charming right up until it wasn't. The thing you laughed at a moment
    ago has stopped being a joke, and it is waiting — quite politely — to see
    what you'll do now that the rules it lives by have turned out to apply to you.
