# Wry Whimsy — Genre-Level Lore
#
# GENRE TIER — the portal-fairytale FORM as thin structural context for the narrator,
# NOT a specific world's flavor. No Oz/Wonderland/Gulliver proper nouns as canon here;
# the active world REPLACES this with its own factions, geography, named places, and
# culture. world_name is required by the Lore schema and intentionally empty at genre
# scope — the active world's lore.yaml fills it in.

world_name: ""

history: >-
  There is no shared history to carry, because the traveler arrives without one. A
  Secondary World has a past — usually a deep, half-remembered one of fairy carve-ups,
  vanished rightful rulers, and pretenders who filled the vacuum — but the traveler
  walks into the middle of it knowing none of it, and the world is in no hurry to
  explain. What matters at the start is not the world's chronicle but the crossing:
  the traveler was somewhere ordinary, and then, through a threshold they did not mean
  to find, they were here. Everything before the threshold is the ordinary world.
  Everything after it has to be learned the hard way.

geography: >-
  The world is SEALED. A traveler does not arrive by road and cannot leave by one — the
  way home is a threshold, not a door, and the border that rings the Secondary World is
  its own hazard, a thing that turns back or unmakes anyone who tries to simply walk
  out. This is what makes the world a PLACE to be stuck wandering rather than a level to
  exit: you are in it now, and getting home is a problem to be solved, not a direction
  to walk. Within the seal, distance behaves like a dream — regions are vivid, distinct,
  and arranged more by meaning than by miles. Every famous location is somewhere the
  traveler can actually go and walk into.

cosmology: >-
  The world runs on dream-logic. Cause and effect keep their own counsel; rules appear
  to be broken and vanish once obeyed; a question is as likely to be answered with a
  question as with a fact. No reliable higher power intervenes — what looks like fate is
  usually just the place being earnestly, arbitrarily itself. The one constant a
  sensible traveler can hold to is their own ordinariness, which is both their anchor
  and the thing the world is forever trying to erode.

# Genre-specific structural framing (lands in Lore.extras via extra="allow"). These
# describe the FORM the narrator must respect, world-agnostically.

the_threshold: >-
  Every campaign begins at a THRESHOLD — the seam between the ordinary world and the
  Secondary World, crossed by accident more often than by choice. A cyclone, a fall, a
  shipwreck, a rabbit-hole: the crossing is sudden and irreversible, and the traveler is
  on the far side before they understand they have left. The threshold is the genre's
  front door and its locked back door at once: it brought you in, and it will not simply
  let you out the way you came.

the_only_sensible_person: >-
  The traveler is the ONE sensible person in a place that runs on nonsense. They are
  always a visitor, never a native — the comedy and the menace both come from a
  reasonable person colliding with a world that has no interest in being reasonable.
  This is the genre's central engine: the traveler's ordinariness is the lens that makes
  the world's strangeness legible, and the world's strangeness is the pressure that
  tests the traveler's grip. Reason is the traveler's best tool and the thing the world
  keeps confiscating.

hollow_authorities: >-
  Authority in these worlds is often HOLLOW. The ruler who booms the loudest is
  frequently a fraud, a pretender, or a tyrant running on pure illusion and other
  people's fear — and the genre always builds in a seam where that hollowness can be
  seen through. These "the emperor has no clothes" moments are the heart of the form,
  and they are FINDABLE, never protected: a traveler who points at the curtain gets the
  truth. The discovery that the great power is humbug is not a guarded twist; it is the
  promise the genre keeps.

menace_transforms: >-
  Menace in this genre tends to TRANSFORM and ENSLAVE rather than kill. The danger is
  rarely a clean death — it is being enchanted, condemned, caged, made small, made a
  servant, made a curiosity, or unmade by degrees into something that belongs to the
  world. The tracked stake is COMPOSURE, the traveler's grip on themselves; when it goes
  they BREAK rather than die, and a break resolves as flight, surrender, enchantment, or
  bondage. The active world's lethality dial sets how cruel this gets and whether a break
  heals — the light end unmakes strangers gently, the savage end does not.

# Named structural concepts above are FORM, not setting — they apply to any world in
# this genre and reference no specific source. Example sources that exemplify the form
# (Baum's Oz, Carroll's Wonderland, Swift's Gulliver) are authored at the world tier,
# never canonized here.
