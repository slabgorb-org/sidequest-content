# Wry Whimsy — Genre Achievements
#
# GENRE TIER — achievements tied to the four structural genre tropes. Each binds to a
# trope_id (must match an id in tropes.yaml) and a trigger_status (activated / resolved),
# per the Achievement schema. World tropes that EXTEND these ids inherit the wiring.

# ── threshold_crossing ──────────────────────────────────────
- id: through_the_threshold
  name: Through the Looking-Door
  description: You crossed a threshold you did not mean to find, into a world that runs on dream-logic.
  trope_id: threshold_crossing
  trigger_status: activated
  emoji: "\U0001FA9E"

- id: no_way_back
  name: No Walking Home
  description: You learned the world is sealed — the way back is a problem to solve, not a direction to walk — and chose to wander it anyway.
  trope_id: threshold_crossing
  trigger_status: resolved
  emoji: "\U0001F300"

# ── impossible_authority ────────────────────────────────────
- id: before_the_throne
  name: Before the Throne
  description: You stood before an authority that governs by nonsense, and did not flinch.
  trope_id: impossible_authority
  trigger_status: activated
  emoji: "\U0001F451"

- id: talked_your_way_out
  name: The Tongue, Not the Fist
  description: You survived an impossible authority by wit and nerve alone — no violence, no fold. You out-argued the nonsense and walked out free.
  trope_id: impossible_authority
  trigger_status: resolved
  emoji: "\U0001F5E3"

# ── helpful_companion ───────────────────────────────────────
- id: a_creature_joins
  name: An Unlikely Fellow-Traveller
  description: A creature of this world attached itself to you — and named, sincerely, the very quality it most plainly has.
  trope_id: helpful_companion
  trigger_status: activated
  emoji: "\U0001F43E"

- id: kindness_repaid
  name: The Kindness Economy
  description: The companion proved itself when it counted, and an early kindness came back around. In this genre, gentleness is currency.
  trope_id: helpful_companion
  trigger_status: resolved
  emoji: "\U0001F49D"

# ── the_seam_reveal ─────────────────────────────────────────
- id: behind_the_curtain
  name: Something Doesn't Add Up
  description: You spotted the seam — the tell, the lever, the curtain the great authority did not want looked behind.
  trope_id: the_seam_reveal
  trigger_status: activated
  emoji: "\U0001F50D"

- id: pulled_the_curtain
  name: Pulled the Curtain
  description: You exposed a hollow authority for the humbug it was. It stayed deflated — because the truth was in the book all along.
  trope_id: the_seam_reveal
  trigger_status: resolved
  emoji: "\U0001F3AD"
