# =============================================================================
# Oz (wry_whimsy) — WORLD VISUAL STYLE
# =============================================================================
# Renderer: Z-Image Turbo. There is NO negative_prompt — Z-Image runs at
# guidance_scale=0 and ignores it (see PROMPTING_Z_IMAGE.md). Every "not X"
# constraint is phrased as POSITIVE exclusion text inside positive_suffix.
#
# THE LOOK: William Wallace Denslow's plates for the FIRST EDITION of
# "The Wonderful Wizard of Oz" (1900) — American Art-Nouveau line work, bold
# confident black outlines, flat poster-like fields of unmodeled color,
# decorative period children's-book composition, the warmth of a hand-lettered-
# era chromolithograph. This is the ANTI-CLICHE WEAPON. It is NOT the 1939 MGM
# Technicolor film: silver shoes never ruby, the Emerald City's green lives in
# the visitors' locked spectacles and not in the white-marble city itself, the
# Witch of the West is a one-eyed old woman with an umbrella and is NOT
# green-skinned (green skin is a 1939 film invention). Encoded positively below.
#
# THE FOUR-COUNTRY PALETTE (load-bearing — Oz is color-coded by quarter; POI
# and scene prompts must key their dominant color to the region depicted):
#   Munchkin Country  (East)   -> BLUE
#   Winkie Country    (West)   -> YELLOW
#   Quadling Country  (South)  -> RED
#   Gillikin Country  (North)  -> PURPLE
#   Emerald City      (center) -> GREEN, but ONLY through the spectacles;
#                                 the city itself is white marble.
# Portraits stay neutral-ground; the regional color is carried by a POI/scene's
# foreground-to-background fields and by one or two named accent colors on a
# subject, which Z-Image honors as a selective hand-tint over the flat plate.
# =============================================================================

positive_suffix: >-
  1900 first-edition color-plate illustration in the manner of W. W. Denslow,
  American Art-Nouveau children's-book chromolithograph, bold confident black
  ink outlines of varying weight, flat poster-like fields of unmodeled color,
  limited hand-tinted palette, decorative period composition with generous
  flat negative space, gentle stylized forms, the warmth of a 1900 hand-pressed
  picture book. Color keyed to the country of Oz shown: Munchkin East blue,
  Winkie West yellow, Quadling South red, Gillikin North purple, the central
  Emerald City white marble whose green is seen only through green spectacles.
  Silver shoes, silver-grey not ruby red. A flat ink-and-flat-color storybook
  plate, not a photograph, not a Technicolor film still, not a glossy modern
  cartoon, not a 3D render, not painterly oil rendering. No text, no caption,
  no title, no lettering, no writing, no signature, no labels, no watermark,
  no page numbers, no decorative border, no frame.

preferred_model: dev

base_seed: 1900
