name: The Deadly Desert
era: "as old as the seal — older than any living power in Oz"
summary: >-
  The killing sand that rings the whole of Oz and turns any living thing that
  touches it to dust. It is the country's lethal border, the reason a traveler
  cannot simply walk home, and the one thing in all the gentle fairyland that the
  world refuses to soften.

details: >-
  Every soul in Oz grows up knowing the desert the way a cliff-village child knows
  the edge of the drop. It rings the four colored countries on every side — pale,
  restless, shifting sand with no far shore that any eye can find across the
  heat-haze — and its touch is instant and absolute: a bird that settles on it
  crumbles to powder, a leaf tossed onto it is gone before it lands. They tell of
  travelers who walked to the edge of the country meaning to go home the way they
  came, and found the road simply ends in sand, and turned back because there is
  nothing else to do. The Deadly Desert cannot be crossed by anything living
  except by magic that can carry the living over it: the silver shoes that step
  three times; the Wizard's balloon on a fair wind; a charmed bird; Glinda's word.
  The way home, the desert teaches, is never a direction — it is a power to be won,
  borrowed, or learned. The country's whole gentleness elsewhere is bought against
  this one hard border, and the wise speak of the sand quietly, the way mortals
  speak of a deep well in the dark.

notable_figures:
  - "The travelers who walked to the edge meaning to go home, and turned back from the sand"
  - "Glinda the Good, whose word is among the few powers that can carry the living across"

