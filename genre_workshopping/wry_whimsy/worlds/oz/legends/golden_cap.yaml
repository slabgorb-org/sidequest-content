name: The Golden Cap and the Winged Monkeys
era: "the witch-age — the Cap has passed through more than one pair of hands"
summary: >-
  A charmed crown that commands the Winged Monkeys of the western air — but only
  three times, and then it passes on. The Wicked Witch of the West used her three
  commands to enslave a nation; whoever holds the Cap after her holds a finite,
  precious force and the same three wishes' worth of unstoppable flying power.

details: >-
  The Golden Cap is the great prize of the yellow Winkie country: a band of worked
  gold, set with gems, whose charm summons the Winged Monkeys — the swift, agile,
  mischievous band that rules the air over the West. Speak the charm and they must
  come, and they must obey, whatever is asked. But the binding is strict: the
  owner of the Cap may call the Monkeys exactly THREE TIMES, and not a fourth;
  after the third command the Cap and its three fresh commands pass to whoever
  takes it next. The Wicked Witch of the West spent her three: once to drive an
  invading people out of the West, once to enslave the Winkie nation, and once
  more besides — and so by the end her hold on the Monkeys was already spent, for
  all the terror it had bought her. The Monkeys themselves are not wicked. They
  were bound to the Cap long ago against their own liking, by an old slight and an
  old bargain, and the King of the Winged Monkeys will tell anyone who asks that
  they serve the Cap, not the cruelty, and would rather be free of the thing
  entirely. To hold the Golden Cap is to hold three unstoppable favors and a
  band of fliers who resent every one of them.

notable_figures:
  - "The Wicked Witch of the West — who spent her three commands and ruled the West by terror until a bucket of water ended her"
  - "The King of the Winged Monkeys — who serves the Cap against his people's own inclination and longs to be free of it"

