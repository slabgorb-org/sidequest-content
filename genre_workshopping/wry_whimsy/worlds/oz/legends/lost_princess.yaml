name: The Lost Princess of Oz
era: "no one living can say — the secret is older than its keepers admit"
summary: >-
  The deepest and least-spoken story in Oz: that the country has a rightful ruler
  it has misplaced. The tale, where it is told at all, is told as a wrongness
  rather than a fact — a feeling that the thrones are filled by the wrong sort of
  people, the humbug Wizard above all, and that somewhere a true sovereign waits.

details: >-
  Press anyone in Oz on who truly rules the country and the answers go strange.
  The Wizard, they will say — and then look uneasy, because the Wizard rules only
  the green city and only by tricks. The witches, then — but the witches hold
  quarters, not the crown. The oldest rumor, kept alive mostly in the wild purple
  North, says the country was meant to be ruled by a princess; that she was
  spirited away as an infant and hidden, not killed but CHANGED, enchanted out of
  her own shape so thoroughly that even she does not know what she is; and that an
  old hedge-witch was paid or threatened to perform the hiding and keep it. No one
  can produce the princess. No one can name her present shape with confidence. The
  story persists anyway, the way a missing tooth persists — as an absence the
  tongue keeps finding. Glinda the Good is said to know the truth of it, and to be
  waiting, for reasons of her own, on the right moment to speak it. This is a deep
  thing, sensed long before it can be solved; it is the matter Oz keeps under all
  its other matters, and it pays off only when the disguise is undone and the
  right name is finally spoken.

notable_figures:
  - "The hidden princess — the rightful sovereign of all Oz, enchanted out of her own shape and unaware of herself"
  - "Mombi — the old Gillikin hedge-witch said to guard the enchantment that conceals the heir"
  - "Glinda the Good — the one power said already to hold the secret, waiting to act on it"
  - "The Wizard — a humbug keeping the green throne warm for a claim that is not his"

