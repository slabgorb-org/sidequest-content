world_name: Oz

history: >-
  Oz was an ordinary country once, until a fairy queen named Lurline passed over
  it and enchanted it, and ever after it has been a fairyland — a place where
  things talk that should not, where the years sit lighter on a body, and where
  the dead do not stay reliably dead. No one in Oz can tell you the date with
  confidence, and no one minds. What every Munchkin child can tell you is the
  shape of the country: four colored quarters around a green hub, and a ring of
  killing sand around the whole. The four wicked witches of the old days carved
  the quarters between them and ruled what they had taken; the good witches held
  the North and the South. Then, by a road few in Oz can name, a humbug came up
  in a balloon out of the sky and made himself the master of the green city at
  the center, and the country has run on his illusion and the witches' fear ever
  since. The traveler walks into the middle of all this knowing none of it, and
  Oz is in no hurry to explain.

geography: >-
  Oz is a sealed square of country, ringed on every side by the Deadly Desert,
  and divided into four colored countries that meet at the Emerald City in the
  middle. To the EAST lies the blue Munchkin country — tidy farms, round-roofed
  cottages, blue fences, blue everything; this is where a traveler most often
  comes to ground. To the WEST lies the yellow Winkie country, where the Wicked
  Witch of the West held the whole nation in slavery. To the SOUTH lies the red
  Quadling country, the domain of Glinda the Good. To the NORTH lies the purple
  Gillikin country, wild and least-traveled, where hedge-witches keep to
  themselves. The green EMERALD CITY stands exactly at the hub. The Yellow Brick
  Road runs from the Munchkin country to the City gate, golden and well-laid,
  the safe spine of any traveler's first journey. Within the seal, distance
  behaves like a dream: each country is vividly, uniformly its color, and a day's
  walking can carry you between wonders that ought to be a hundred miles apart.

cosmology: >-
  Oz runs on fairy-logic, but a gentler logic than its sister-worlds. The land
  is kind by inclination — it mostly wants the traveler to win — and cruelty in
  it is the exception, lodged in a few wicked powers rather than woven through
  the whole. Magic is real, common, and unevenly distributed: it pools in the
  witches, the good and the wicked alike, and is largely ABSENT from the men who
  hold the public thrones. There is no reliable higher power that intervenes —
  what saves a traveler is usually a kindness banked earlier, a clever question,
  or the right humble creature remembering a debt. Death is a rare and reversible
  thing inside the seal; the great danger is not dying but being changed —
  enchanted into an ornament, enslaved to a tyrant, sent on an impossible errand,
  or unmade by degrees into something that belongs to Oz. The one place the
  gentleness fails entirely is the border.

# ── Genre-form framing, filled in for Oz (lands in WorldLore extras) ──────────

the_matriarchy: >-
  The deepest truth of Oz is that the real power is female, and the famous men
  are defined by what they lack. GLINDA the Good, witch of the red South, is the
  most powerful sorceress in the country and the only authority who is exactly
  what she appears to be. The WICKED WITCHES were the country's real rulers
  before her — the Witch of the East who enslaved the Munchkins, the Witch of the
  West who enslaved the Winkies. Against them stand the men: the WIZARD, a
  humbug with no magic at all; the SCARECROW, who frets he has no brains while
  he out-thinks everyone; the TIN WOODMAN, who mourns he has no heart while he
  weeps for a trodden beetle; the COWARDLY LION, who trembles as he charges the
  thing that frightens him. Every celebrated man in Oz is a fraud or an
  inadequate; every genuine power wears a woman's shape. A traveler who learns
  to ask "who is the woman behind this?" is rarely wrong.

the_humbug_wizard: >-
  The Wizard of Oz — Oscar Zoroaster Phadrig Isaac Norman Henkle Emmannuel
  Ambroise Diggs, whose initials spell OZ PINHEAD and who therefore shortened
  himself to "Oz" — is a Nebraska ventriloquist and balloonist who came down out
  of the sky into a country that took him for a sorcerer and let him stay one. He
  has no magic whatsoever. He rules the Emerald City entirely by illusion: he is
  never seen in his true shape, presenting himself by turns as a giant disembodied
  Head, a beautiful Lady, a terrible Beast, and a Ball of Fire, each a trick of
  paint, paper, wire, and a screen. He hides behind a curtain and a booming
  voice. He keeps the City prosperous and frightened in equal measure, and he is
  privately a kind, sad, embarrassed old man who knows exactly how thin the
  illusion is. "I have been making believe," he admits, when the curtain finally
  goes. He is the seam at the heart of the whole country, and the seam is
  findable: anyone who looks behind the curtain gets the truth.

the_green_spectacles: >-
  The Emerald City is not actually emerald. Its walls are plain white marble and
  its goods are ordinary colors. The green is a standing illusion, maintained
  with no villain behind it: every soul who enters — citizen, soldier, and
  stranger alike — is fitted at the gate with green-tinted spectacles, buckled
  on with a gold clasp and locked, the only key kept by the Guardian of the
  Gates. The reason given is that the glory of the place would blind an
  unprotected eye. The truth is that the green is all in the glass. Bread, milk,
  babies' cheeks, and the very air read the same impossible uniform green so
  long as the spectacles stay on. Take them off and the green goes with them,
  and the City is revealed as a clean white town, lovely enough on its own,
  dressed in a lie of tinted glass.

the_deadly_desert: >-
  The border of Oz is the one thing in the country that will simply kill you. A
  great shifting waste of sand — called the Deadly Desert, the Shifting Sands,
  the Impassable Desert — rings the whole fairyland on every side, and its sands
  turn any living thing that touches them instantly to dry dust. A bird that
  settles on it crumbles; a tossed leaf powders in mid-fall. It cannot be
  walked, ridden, swum, or out-waited. This is what makes Oz a PLACE the traveler
  is stuck in rather than a level to be exited: you are inside the seal now, and
  the way home is not a direction you can walk but a magic you must win, borrow,
  or learn. The silver shoes that step three times; the Wizard's balloon on a
  fair wind; a charmed bird; Glinda's word — these are the only crossings. The
  desert earns Oz the right to be gentle everywhere else.

the_silver_shoes: >-
  The silver shoes are the witch-treasure of the Munchkin country: the charmed
  footwear of the Wicked Witch of the East, left behind on her feet when a
  falling house ended her, and gone to whoever the good witch of the North says
  may have them. (Silver — never ruby; the ruby is a Hollywood invention this
  world refuses.) Their power is not understood even by the one who wears them
  until the very end: they can carry the wearer anywhere in three steps, across
  the Deadly Desert itself, faster than thought. They are one of the very few
  things in Oz that can cross the killing border — and so one of the very few
  ways home — and their owner spends the whole journey not knowing it.

the_golden_cap: >-
  The Golden Cap is a charmed crown that commands the Winged Monkeys — the swift,
  mischievous flying band of the western air. Whoever owns the Cap and speaks the
  charm may summon the Monkeys exactly THREE TIMES, and they must obey, and then
  the Cap passes to a new owner and a new three. The Wicked Witch of the West
  used her three commands to enslave the Winkies, drive off invaders, and capture
  travelers. After her, the Cap passes on, and its remaining commands are a
  finite, precious resource: three wishes' worth of unstoppable flying force, no
  more. The Monkeys themselves are not wicked; they are bound to the Cap against
  their own inclination, and they would rather be free of it.

the_witch_powers: >-
  Map of who actually wields power in Oz, by quarter. NORTH (purple Gillikin):
  the good Witch of the North, kindly and minor, and the hedge-witches of the
  wild country, of whom MOMBI is the one that matters — a crooked old conjurer
  who keeps to herself and guards an old secret. EAST (blue Munchkin): the Wicked
  Witch of the East, enslaver of the Munchkins, now dead under a house, her
  silver shoes loose in the country. WEST (yellow Winkie): the Wicked Witch of
  the West, enslaver of the Winkies, mistress of the Golden Cap and the Winged
  Monkeys, undone by a thrown bucket of water. SOUTH (red Quadling): GLINDA the
  Good, the most powerful and the most trustworthy power in all of Oz, who keeps
  her own counsel and already knows more about the country's hidden rightful
  ruler than she has told anyone. CENTER (green Emerald City): the Wizard, a
  humbug with no power at all, holding the hub by illusion alone.

the_lost_princess: >-
  Beneath everything runs a wrongness about who truly rules Oz, and it is the
  country's deepest secret — too deep for any Munchkin or Winkie to know they are
  carrying it. The rightful sovereign of all Oz is a princess, alive and hidden,
  enchanted out of her own shape and into the form of a boy, and given into the
  keeping of an old hedge-witch in the wild purple North, where no one would
  think to look. The men hold the public power and are humbugs or stand-ins; the
  throne's true claim lies elsewhere, disguised and unaware even to itself. This
  is not a thing the traveler will solve early or easily — it hums under the
  whole country, a latent truth waiting on the long game. It pays off only when
  the disguise is found and the right name is spoken.
