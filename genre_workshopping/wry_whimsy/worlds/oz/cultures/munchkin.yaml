name: Munchkin
summary: The small, neat, blue-clad farming folk of the East, freshly freed from the Witch of the East
description: >-
  Munchkins are the little people of the East Country, where everything is blue —
  blue cottages with round roofs, blue fences, blue clothes, and blue-curtained
  windows. They are tidy, timid, hard-working farmers who keep their fields in
  precise rows and have only just learned what it is to be unafraid: the wicked
  Witch of the East ruled them in bondage for generations until a falling house
  put an end to her. Munchkins are polite to a fault, easily startled, and given
  to nervous gratitude. Their names are plain and homely — the everyday names of
  country folk — with a fondness for short, knobbly sounds. (Canon: Boq, the rich
  Munchkin who first sheltered Dorothy.)
