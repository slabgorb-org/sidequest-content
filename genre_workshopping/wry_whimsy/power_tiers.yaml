# Power Tiers — Wry Whimsy
# Per-class visual descriptions at each level range. Keyed by class from
# rules.yaml: Curious Child, Practical Servant, Earnest Scholar, Weary Soldier,
# Wayward Dreamer, Stubborn Skeptic.
#
# The "tiers" are SAVVY, not strength. A traveler's appearance shifts not toward
# armour and scars but toward a person who has learned the world — steadier eyes,
# stranger keepsakes, a wariness or a wonder that was not there at the threshold.
# Three bands: fresh-off-the-threshold / world-wise / part-of-the-tale.
# `player` is second-person-facing visual flavor; `npc` is how others read them.

Curious Child:
  - level_range: [1, 3]
    label: just arrived
    player: >-
      ordinary clothes from the other side of the threshold, already grass-stained
      and a size too neat for this place, wide eyes that go to every impossible
      thing at once, a death-grip on whatever small object you carried across, and
      questions spilling out faster than anyone will answer them
    npc: >-
      a child plainly not from here, gawping at the talking flowers, the kind of
      newcomer the whole road wants to adopt or eat
  - level_range: [4, 6]
    label: getting the hang of it
    player: >-
      the same ordinary clothes, mended now with thread the wrong colour and a
      ribbon a creature gave you, eyes that have learned which wonders to ignore,
      a satchel of strange small keepsakes, and the dawning confidence of someone
      who has out-argued at least one adult-shaped authority
    npc: >-
      a sharp youngster who has clearly been here a while, no longer startles at
      the impossible, asks fewer questions and better ones
  - level_range: [7, 9]
    label: a child of the tale
    player: >-
      clothes that are now half of this world and half of home, pockets full of
      things that should not fit, a steadiness in the gaze that unsettles grown
      sovereigns, and the easy, slightly eerie poise of a child who understands
      the place better than the people who live in it
    npc: >-
      the uncanny child the locals tell stories about, the one who talked the
      king down, met with a quiet that makes courts nervous

Practical Servant:
  - level_range: [1, 3]
    label: out of place
    player: >-
      a tidy apron and serviceable boots fit for a kitchen that is a world away,
      sleeves still rolled for work that no longer exists, a deep reflexive urge to
      fix and feed and tidy, and the slightly affronted air of someone who finds
      all this nonsense terribly impractical
    npc: >-
      a brisk, capable newcomer plainly used to being useful, eyeing the chaos
      like a mess that simply wants sorting
  - level_range: [4, 6]
    label: keeping house in chaos
    player: >-
      the apron now pinned with odd small tools and a borrowed brooch, hands that
      have learned to make tea for a creature with no mouth and directions out of
      contradictory signposts, a calm competence that treats the impossible as one
      more chore
    npc: >-
      the unflappable hand who somehow keeps a household running in a place with no
      rules, the one strangers go to when they need a sensible thing done
  - level_range: [7, 9]
    label: the indispensable stranger
    player: >-
      a working uniform half-remade from this world's cloth, a ring of impossible
      keys, the bearing of someone an entire court has quietly come to depend on,
      and a dry, bottomless patience that has outlasted three kings and a flood
    npc: >-
      the foreign servant who runs the place better than its rulers, indispensable
      and faintly feared for exactly that reason

Earnest Scholar:
  - level_range: [1, 3]
    label: clutching the notebook
    player: >-
      spectacles, a travelling coat with too many pockets, and a notebook held like
      a shield, scribbling furious observations about a world that refuses to be
      catalogued, certain that if you only understood the system you would be safe
    npc: >-
      a bookish newcomer taking notes on everything, visibly trying to reason their
      way out of a place that does not reward reasoning
  - level_range: [4, 6]
    label: revising the theory
    player: >-
      the coat now patched, the notebook fattened with pressed impossible flowers
      and crossed-out laws, spectacles mended with creature-spun thread, and the
      humbler, sharper look of a scholar who has learned how much they were wrong
      about and how to use what is left
    npc: >-
      a learned traveler who has stopped lecturing the world and started listening
      to it, quoted by some of the odder locals
  - level_range: [7, 9]
    label: the one who understands
    player: >-
      a coat that is now a small museum of the world, a notebook so full it speaks
      back, and the unsettling calm of a scholar who has found the rule beneath the
      nonsense and is not entirely sure they should tell anyone
    npc: >-
      the foreign sage who decoded the place, sought out by creatures and kings
      alike and trusted by neither completely

Weary Soldier:
  - level_range: [1, 3]
    label: still standing to attention
    player: >-
      a worn uniform from a war on the other side, boots that have marched real
      miles, a hand that keeps reaching for a weapon that does no good here, and the
      flinching wariness of someone braced for an enemy this world refuses to provide
    npc: >-
      a hard-bitten newcomer plainly used to violence, looking for a threat to fight
      and unnerved to find only riddles
  - level_range: [4, 6]
    label: learning the war is different here
    player: >-
      the uniform softened and re-stitched, the weapon set aside more often than
      drawn, a grizzled patience that has learned the local battles are won with
      nerve and words, and eyes that have stopped looking for soldiers and started
      reading courts
    npc: >-
      a steady, scarred traveler who no longer reaches for the gun, the one who
      stays calm when the absurdity turns genuinely dangerous
  - level_range: [7, 9]
    label: the unbreakable stranger
    player: >-
      a uniform now more keepsake than kit, an immovable composure that whole
      hostile courts have battered against and failed to crack, and the quiet of a
      veteran who finally found a war they can win by simply refusing to break
    npc: >-
      the foreign soldier nothing can rattle, set like a stone in the middle of the
      nonsense, spoken of with wary respect

Wayward Dreamer:
  - level_range: [1, 3]
    label: half here already
    player: >-
      mismatched clothes chosen for no practical reason, a faraway look that was
      strange even back home, an instant unguarded delight at every impossible thing,
      and not nearly enough fear of a world that ought to terrify you
    npc: >-
      a dreamy newcomer who took to the place far too easily, wandering toward every
      wonder with an open, unwary smile
  - level_range: [4, 6]
    label: walking the logic
    player: >-
      clothes already going strange at the hems, eyes that catch the world's hidden
      seams, a growing ease with nonsense that lets you slip through it — and a faint
      something in your gaze that makes old friends ask if you are still quite yourself
    npc: >-
      a traveler who moves through the impossible like water, charming and a little
      unsettling, clearly getting comfortable in a way that should not be comfortable
  - level_range: [7, 9]
    label: one foot in the dream
    player: >-
      clothes more of this world than of home, a presence that bends the strange a
      little toward you, the dangerous grace of someone who can do almost anything
      the dream allows — and the quiet ache of being one good bargain from never
      going back
    npc: >-
      the stranger who has nearly become local, beautiful and wrong, whom the world's
      own creatures treat as one of their own

Stubborn Skeptic:
  - level_range: [1, 3]
    label: refusing to believe it
    player: >-
      sensible practical clothes worn like armour against absurdity, arms crossed, a
      jaw set in flat denial, insisting loudly that none of this is real even as it
      argues back, and a contempt for nonsense that is, secretly, a kind of courage
    npc: >-
      a flatly disbelieving newcomer telling a talking rabbit it does not exist,
      maddening and somehow impossible to enchant
  - level_range: [4, 6]
    label: arguing with the world
    player: >-
      the same sensible clothes, scuffed by an obstacle course of things that
      "aren't real," a sharper scowl and a sharper tongue, having discovered that
      refusing to play along is itself a weapon against authorities who run on belief
    npc: >-
      a hard-nosed traveler who deflates pomp and humbug by simply declining to be
      impressed, the bane of every self-important king
  - level_range: [7, 9]
    label: the one nonsense cannot catch
    player: >-
      practical clothes now patched with grudging trophies of the impossible, a dry
      unshakeable certainty about which authorities are frauds, and the rare poise of
      a doubter who has learned exactly how much of this world is bluff — and calls it
    npc: >-
      the foreign skeptic the humbugs dread, the one immune to spectacle, who walks
      through enchantments because they refuse to grant them power
