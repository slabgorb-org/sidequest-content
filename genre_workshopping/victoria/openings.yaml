- id: mysterious_letter
  archetype: mystery
  situation: >-
    The player receives a letter that makes no sense — from someone they
    don't know, referencing events they weren't part of, requesting their
    presence at an address that may not exist. The handwriting is immaculate.
    The paper smells faintly of laudanum.
  tone: gothic, intriguing
  avoid:
    - parlour introductions
    - helpful servants explaining the household
    - errand-based openings
  first_turn_seed: >-
    The letter arrived with the morning post, addressed in a hand you
    don't recognize. The ink is fresh but the paper is impossibly old.
    It contains a single address and the words "Come alone. Tonight."

- id: scandal_erupts
  archetype: standoff
  situation: >-
    The player is at the center of a social explosion — a secret revealed
    at dinner, an accusation in the drawing room, a body found where it
    shouldn't be. Society's veneer has cracked and everyone present is
    a suspect, a witness, or a liar.
  tone: charged, theatrical
  avoid:
    - gentle social introductions
    - arriving at an estate for the first time
    - being briefed by staff
  first_turn_seed: >-
    The dinner party dies mid-sentence. Lady Ashworth's glass shatters on
    the floor. She's staring at you. Everyone is staring at you. And the
    letter she's holding has your handwriting on it.

- id: seance_gone_wrong
  archetype: survival
  situation: >-
    A spiritualist session has produced results no one expected — real ones.
    Something has been contacted, summoned, or released. The gaslight
    flickers. The medium is unconscious. And something in the room is
    breathing that shouldn't be.
  tone: terrifying, intimate
  avoid:
    - rational investigation openings
    - social climbing scenes
    - errand quests
  first_turn_seed: >-
    The candles went out all at once. The medium slumped forward. And then
    the voice that spoke was not hers — it was yours. Your voice, from
    somewhere you have never been.

- id: inheritance_trap
  archetype: mystery
  situation: >-
    The player has inherited something — a house, a title, a collection —
    from someone they barely knew or never met. The inheritance comes with
    conditions, enemies, and a history that someone would prefer stayed buried.
  tone: ominous, labyrinthine
  avoid:
    - simple property tours
    - helpful solicitor explanations
    - comfortable new-home scenes
  first_turn_seed: >-
    The solicitor's office smells of old paper and newer lies. The will is
    straightforward — everything goes to you. What the solicitor cannot
    explain is why the previous three heirs declined.
