# Character portraits for Blackthorn Moor
# Visual descriptions for Flux portrait generation

characters:
  - name: Lady Blackthorn
    role: The Widow
    type: npc_major
    appearance: >-
      A striking woman in her mid-forties with sharp cheekbones and pale grey
      eyes that miss nothing. Impeccably dressed in full mourning — black silk,
      jet earrings, a cameo brooch at her throat. Dark hair streaked with silver,
      swept up in a severe but elegant arrangement. Her posture is perfect, her
      composure absolute. The only warmth is a flush at the temples that suggests
      the composure costs more than she lets anyone see.
    culture_aesthetic: >-
      English Gentry — old money, old taste. The mourning dress is Worth of
      Paris, the jewellery is family. Nothing ostentatious, everything expensive.
      The aesthetic of someone who was born to this and married into more.

  - name: Captain Hale
    role: The Heir Presumptive
    type: npc_major
    appearance: >-
      A handsome man in his early thirties, sun-darkened from years in India,
      with restless hazel eyes and a smile that arrives a beat too late. Wears
      a brown tweed Norfolk jacket over a high-collared shirt with a loosely
      knotted silk cravat. Dark hair slightly too long, a cavalry moustache
      in the fashion of the Indian Army. His bearing is military but his
      civilian clothes sit on him as if borrowed — the jacket is too English,
      the posture too rigid for a country house.
    culture_aesthetic: >-
      1860s colonial returned — Norfolk jacket and tweed, not a modern suit.
      Victorian high collar, silk cravat, no necktie. The tan and moustache
      of a man who served in British India.

  - name: Mrs. Poole
    role: The Housekeeper
    type: npc_major
    appearance: >-
      A solid woman in her late fifties with iron-grey hair pulled tight
      beneath a white cap. Sharp dark eyes set in a face that has mastered
      the art of revealing nothing. Dressed in severe black with a ring of
      keys at her waist that she touches like a rosary. Her hands are
      strong and capable. She stands as though she owns every room she
      enters — which, below stairs, she does.
    culture_aesthetic: >-
      Servant Class at the highest rank — the black dress is as good as
      her mistress's, the cap is starched perfection. Authority expressed
      through absolute propriety.

  - name: Miss Fairfax
    role: The Governess
    type: npc_major
    appearance: >-
      A young woman of twenty-four with dark auburn hair and watchful brown
      eyes. Pretty in a way that she deliberately underplays — plain dress
      in grey wool, no jewellery except a small locket, hair pinned simply.
      Her face is composed and attentive, with a slight furrow between the
      brows that appears when she is thinking — which is always. Small hands
      stained faintly with ink. She carries herself with the quiet dignity
      of someone who has nothing to prove and no one to impress.
    culture_aesthetic: >-
      Clergy-background governess — educated, modest, deliberately
      unremarkable in dress. The aesthetic of someone who exists in the
      space between family and servant, belonging to neither.

  - name: Mr. Graves
    role: The Solicitor
    type: npc_major
    appearance: >-
      A thin man of fifty with a pince-nez on a gold chain and a face like a
      closed ledger. Clean-shaven, grey at the temples, dressed in a black
      frock coat with silk lapels over a grey waistcoat and high wing collar
      with a black silk cravat. His eyes are pale blue and extraordinarily
      steady. He carries a leather document case that never leaves his
      person. His hands are long-fingered and precise — a man who has spent
      a lifetime turning pages and finding the paragraph that changes
      everything.
    culture_aesthetic: >-
      1860s London Professional — black frock coat, wing collar, cravat.
      No necktie. Victorian solicitor, not modern barrister. Pince-nez
      not wire-frame spectacles.
