cover_poi: the_blackthorn_arms
name: Blackthorn Moor
description: >-
  A great house on the Yorkshire moors. A death that wasn't right. A gathering
  of people who all have reasons to lie. Sir Edmund Blackthorn is dead, the
  will is about to be read, and the player arrives as the outsider who sees
  what the household has stopped seeing.

axis_snapshot:
  gothic: 0.15
  romance: 0.5
  intrigue: 0.8

starting_location: blackthorn_hall
starting_time: "Late afternoon, autumn"

premise: >-
  Sir Edmund Blackthorn, master of Blackthorn Hall and owner of the Millbridge
  cotton mills, died three weeks ago. The death certificate says heart failure.
  The doctor signed it. The vicar buried him. The county accepted it. But
  someone — a letter, unsigned, posted from London — has suggested otherwise.
  Now the solicitor has called everyone back to the Hall for the reading of
  the will, and every person under this roof was there the night Sir Edmund
  died.

mood: >-
  Yorkshire in autumn — the light is low and golden, the moors are brown and
  purple with dying heather, and the wind finds every gap in every window.
  The house is handsome, well-maintained, and full of rooms where conversations
  stop when you enter. The mystery is human-scaled — no ghosts, no curses,
  just people with secrets and the slowly tightening pressure of the truth.
  Rain is frequent. Tea is constant. Nobody says what they mean.

themes:
  - "The truth costs something — finding it may be worse than not knowing"
  - "Class determines who is believed, who is suspected, and who is invisible"
  - "Every person in this house loved Sir Edmund, or feared him, or both"
  - "Loyalty and self-interest wear the same face"
