# Character portraits for The Shattered Reach
# Visual descriptions for Flux portrait generation
# Culture aesthetics map to the 3 cultures in cultures.yaml

characters:
  # ── PROTAGONIST ────────────────────────────────────────────────

  - name: Kael Ashford
    role: Reluctant Hero of the Reach
    type: npc_major
    appearance: >-
      A broad-shouldered young man in his early twenties with calloused
      hands and a fresh scar across his left cheek. Sun-darkened skin
      from years of farmwork, dark hair cropped short for practicality.
      Wears patched leather armor reinforced with river-iron plates,
      dented from a dozen battles. Carries a reforged iron sword at
      his hip — the blade nicked but well-maintained. His expression
      is guarded, watchful, the look of someone who learned early that
      the world takes everything it can.
    culture_aesthetic: >-
      Brevonne Freeholder — Franco-Celtic rural working class. No
      heraldry, no noble colors. Practical leather and homespun wool,
      iron fittings instead of silver. The aesthetic of people who
      answer to no lord.
    element_visual: >-
      Iron affinity — a faint darkening around his sword hand, calluses
      that have gone grey like old metal. Maren's silver amulet at his
      throat pulses faintly with warmth.

  # ── KEY ALLIES ─────────────────────────────────────────────────

  - name: Old Maren
    role: Hedge Witch of Thornfield
    type: npc_major
    appearance: >-
      An ancient woman, gaunt and frail, with wild white hair and
      eyes that burn with sharp intelligence despite her failing body.
      Her hands are gnarled but steady when she works her wards —
      fingers tracing patterns in the air that leave faint afterimages.
      Wears layers of patched shawls and a heavy apron stained with
      herb-work. Her cottage smells of dried sage and iron filings.
    culture_aesthetic: >-
      Brevonne hedge tradition — pre-Sundering folk magic aesthetic.
      Dried herbs braided into her hair, bone charms at her belt,
      ward-stones sewn into her shawl hems. Everything handmade,
      nothing decorative.
    element_visual: >-
      Ward magic — faint shimmer around her hands when she works,
      the air near her smells of ozone and sage. Her skin has gone
      translucent with age and power drain, blue veins visible at
      her temples.

  - name: Captain Hask
    role: Retired Militia Captain
    type: npc_supporting
    appearance: >-
      A tired middle-aged man with a missing right ear and the
      permanent squint of someone who has spent too many years
      scanning treelines for ambushes. Iron-grey beard, deep lines
      around his mouth. Wears his old chain shirt out of habit even
      in retirement. His hands are scarred and steady.
    culture_aesthetic: >-
      Brevonne militia — practical military dress, dark leather and
      iron chain. No polish, no ceremony. A working soldier's kit
      worn until it falls apart.
    element_visual: >-
      No magical markers. The missing ear and the thousand-yard stare
      are his distinguishing features. A man shaped entirely by war.

  - name: Sister Vael
    role: Excommunicated Priestess and Advisor
    type: npc_major
    appearance: >-
      A young woman in her mid-twenties with sharp, watchful features
      and dark eyes that dart to every doorway. Her Ashen Veil robes
      are gone — she wears plain traveler's clothes now, but her
      posture still carries the rigid discipline of temple training.
      Prayer beads wrapped around her left wrist, fidgeted constantly.
      A faded brand mark on her collarbone where her order's seal
      was burned away during excommunication.
    culture_aesthetic: >-
      Ashen Veil apostate — remnants of religious austerity stripped
      of authority. Grey and black fabrics, simple cut, no ornament
      except the prayer beads she cannot bring herself to discard.
    element_visual: >-
      The excommunication brand — a circular scar where the Veil's
      flame seal was pressed and then struck through. She covers it
      but it shows at the collar.

  - name: Greta Voss
    role: Millhaven Blacksmith
    type: npc_supporting
    appearance: >-
      A powerfully built woman with arms like oak branches and hands
      blackened by forge-work. Ruddy face, strong jaw, hair pulled
      back under a leather headband. Burns and small scars map her
      forearms. Wears a heavy leather apron over simple working
      clothes. Her eyes light up when she sees good steel.
    culture_aesthetic: >-
      Brevonne artisan — forge aesthetic, soot-stained leather,
      iron tools at her belt. The practical beauty of a working
      smithy. Nothing wasted, nothing decorative.
    element_visual: >-
      Standing-stone iron dust on her hands — a faint blue-grey
      sheen from her experimental forgework with the ancient metal.
      Ashford's Edge is her masterwork and she carries the pride of
      it in her bearing.

  # ── ANTAGONISTS ────────────────────────────────────────────────

  - name: The Thorn Queen
    role: Bandit Warlord of the Western Hills
    type: npc_major
    appearance: >-
      A scarred, charismatic woman in her late thirties with hard
      eyes and a wolf's smile. A ragged scar runs from her left
      temple to her jaw — a reminder of the tax raid that took her
      family. Lean and rangy, built for endurance not bulk. Wears
      scavenged armor pieced together from a dozen defeated enemies,
      a crown of iron thorns welded to a stolen helmet. Her real
      name is Sera Blackthorn, but no one uses it anymore.
    culture_aesthetic: >-
      Brevonne Freeholder gone feral — thorn-branch armbands on her
      soldiers, stolen noble finery worn as mockery, a fortress built
      from ruins. The aesthetic of justified rage given form.
    element_visual: >-
      The iron thorn crown — welded spikes radiating from a battered
      helmet. Thorn-branch sigils carved into her leather vambraces.
      She quotes Freeholder oaths with bitter sincerity.

  - name: Captain Roth
    role: Ashen Veil Senior Enforcer
    type: npc_major
    appearance: >-
      A gaunt man with hollow cheeks and the fevered eyes of a true
      believer. Clean-shaven, pale skin, thin lips pressed into a
      permanent line of disapproval. Wears the Ashen Veil's black
      and grey vestments with military precision — every clasp
      aligned, every fold sharp. A silver flame pendant at his
      throat. His hands are always clean, even after the burnings.
    culture_aesthetic: >-
      Ashen Veil enforcement — religious military aesthetic. Black
      surcoat over grey chain, silver flame iconography, the severe
      geometry of zealot architecture. Everything designed to
      intimidate.
    element_visual: >-
      The silver flame pendant and the writ of inquisition he carries
      like a weapon. His eyes have the flat certainty of someone who
      has never once doubted himself.

  - name: Grand Inquisitor Morath
    role: Highest Veil Authority in the Reach
    type: npc_major
    appearance: >-
      A tall, elegant man who looks more like a university chancellor
      than an inquisitor. Silver hair swept back, aquiline features,
      hands folded precisely. Wears rich black robes with subtle
      flame embroidery visible only in certain light. His voice is
      soft and his manners are impeccable and he has ordered more
      deaths than Captain Roth could imagine. His smile is warm.
      His eyes are not.
    culture_aesthetic: >-
      Ashen Veil upper hierarchy — the refined face of institutional
      cruelty. Expensive black fabric, understated silver accents,
      the quiet wealth of an organization that takes everything and
      gives back scripture.
    element_visual: >-
      Subtle flame embroidery on black robes — visible only when
      light catches it. A heavy silver ring of office. The contrast
      between his cultured appearance and his terrifying authority.

  # ── SECONDARY CAST ─────────────────────────────────────────────

  - name: Keeper Yew
    role: Guardian of the Standing Stones
    type: npc_major
    appearance: >-
      An ancient figure of indeterminate age — he could be seventy
      or seven hundred. Weathered skin like old bark, deep-set eyes
      the color of moss, long grey-green hair tangled with lichen.
      Wears shapeless robes of undyed wool that seem to blend into
      the stone and earth around him. His movements are slow and
      deliberate, as if he operates on geological time. He claims
      to be a groundskeeper. No one believes him.
    culture_aesthetic: >-
      Pre-Sundering, pre-cultural — an aesthetic older than any
      current nation. Undyed wool, stone jewelry, the patina of
      deep time. He belongs to the land, not to any people.
    element_visual: >-
      The standing stones hum when he is near. Lichen grows on his
      robes as if on rock. His eyes catch light like polished stone.
      The boundary between him and the earth he guards is unclear.

  - name: Elda Greymoor
    role: Merchant House Heir
    type: npc_supporting
    appearance: >-
      A sharp-featured young woman with auburn hair pinned in a
      practical style and cool grey eyes that miss nothing. Dressed
      in well-tailored traveling clothes of quality fabric — not
      ostentatious, but unmistakably expensive. Ink stains on her
      fingers from constant ledger work. A thin blade at her hip
      that she clearly knows how to use.
    culture_aesthetic: >-
      Brevonne merchant aristocracy — the understated wealth of river
      trade. Quality fabrics in muted colors, House Greymoor's grey
      and blue, practical elegance that travels well.
    element_visual: >-
      The Greymoor house seal ring on her right hand. Ledger and
      quill always within reach. The careful composure of someone
      who grew up calculating margins on human lives.

  - name: Daveth One-Eye
    role: Thorn Queen's Lieutenant
    type: npc_supporting
    appearance: >-
      A heavyset man with one milky, ruined eye socket — he doesn't
      bother with a patch — and one sharp brown eye that does the
      work of two. Shaved head, thick neck, arms covered in crude
      tattoos of thorn branches. Wears battered studded leather
      and carries a hand-and-a-half sword across his back. His
      remaining eye is calm, almost gentle. His hands are not.
    culture_aesthetic: >-
      Brevonne outlaw — the anti-aesthetic of banditry. Stolen gear,
      thorn-branch tattoos, the deliberate ugliness of people who
      have been cast out and wear it as armor.
    element_visual: >-
      The empty eye socket, unpatched and unapologetic. Thorn-branch
      tattoos climbing both forearms. A man who has turned his
      injuries into intimidation.

  - name: Lira Blackthorn
    role: Thorn Queen's Daughter and Emissary
    type: npc_supporting
    appearance: >-
      A young woman in her late teens who looks nothing like a bandit
      warlord's daughter. Open face, earnest dark eyes, her mother's
      strong jaw softened by youth. Hair worn loose, not braided for
      war. Wears simple but clean traveling clothes — no thorn
      insignia, no stolen finery. She carries herself like someone
      who genuinely believes in second chances.
    culture_aesthetic: >-
      Brevonne Freeholder — but the hopeful version, not the bitter
      one. Clean homespun, practical boots, a small token of peace
      knotted in white cloth at her shoulder.
    element_visual: >-
      The peace token at her shoulder — white cloth knotted in the
      old Freeholder style. Her mother's features visible but
      softened, carrying the Blackthorn name without the Blackthorn
      rage.

  - name: Nessa Thatch
    role: Hidden Apprentice
    type: npc_supporting
    appearance: >-
      A girl of fourteen or fifteen with her mother Wenna's fierce
      eyes and an unsettling stillness for someone so young. Mousy
      brown hair, freckled face, work-roughened hands that sometimes
      crackle with static she cannot control. Wears plain farm
      clothes. Tries very hard to look ordinary. Fails when she
      is frightened or excited.
    culture_aesthetic: >-
      Brevonne Freeholder rural — a farm girl's clothes, patched
      and practical. Nothing to draw attention. The deliberate
      invisibility of someone hiding a dangerous gift.
    element_visual: >-
      Faint static discharge around her hands when her emotions spike.
      The air near her smells of ozone. Old Maren's training beads
      hidden under her sleeve. A power too large for its container.
