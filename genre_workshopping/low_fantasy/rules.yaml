stat_generation: point_buy
point_buy_budget: 27
magic_level: low

allowed_classes:
  - Fighter
  - Ranger
  - Rogue
  - Cleric
  - Druid
  - Bard
  - Barbarian
  - Monk
  - Wizard

allowed_races:
  - Human
  - Dwarf
  - Elf
  - Halfling

banned_spells:
  - Fireball
  - Wish
  - Meteor Swarm
  - Power Word Kill
  - Gate
  - Teleport
  - Plane Shift
  - True Resurrection
  - Time Stop

hp_formula: "class_base * level"

custom_rules:
  rest_variant: gritty_realism
  encumbrance: variant
  injuries: lingering

default_class: Fighter
default_race: Human
default_hp: 10
default_ac: 10
default_location: "The crossroads outside a small village"
default_time_of_day: dusk

class_hp_bases:
  Fighter: 10
  Barbarian: 12
  Wizard: 6
  Rogue: 8
  Cleric: 8
  Ranger: 10
  Paladin: 10
  Bard: 8
  Sorcerer: 6
  Warlock: 8
  Druid: 8
  Monk: 8

ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

stat_display_fields:
  - hp
  - max_hp
  - ac

encounter_base_tension:
  random: 0.10
  ambush: 0.30
  boss: 0.40
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Tense Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Make Your Case"
        metric_delta: 2
        stat_check: CHA
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: STR
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: CHA
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: WIS
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player turns and leaves. No deal."
    mood: tension
  - type: combat
    label: Melee
    category: combat
    # Momentum as narrative command of the skirmish. Real HP lives on
    # character state — this tracks whether the line is holding.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: attack
        label: Attack
        metric_delta: 2
        stat_check: STR
        effect: "Target takes damage this round"
        narrator_hint: Describe the blow connecting or missing based on the check result.
      - id: defend
        label: Defend
        metric_delta: 1
        stat_check: CON
        effect: "Reduce incoming damage this round"
        narrator_hint: The character braces, parries, or raises a shield.
      - id: heavy_strike
        label: Heavy Strike
        metric_delta: 4
        stat_check: STR
        risk: "Overcommits — lose 2 momentum and take a counter on failure"
        effect: "Target takes heavy damage"
        narrator_hint: A committed overhead swing or lunging thrust.
      - id: disengage
        label: Disengage
        metric_delta: 0
        stat_check: DEX
        resolution: true
        consequence: "Combat ends — the character flees or the enemy retreats"
        narrator_hint: Break contact, step back, let steel settle.
    mood: combat
  - type: chase
    label: Chase
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: sprint
        label: Sprint
        metric_delta: 2
        stat_check: DEX
        narrator_hint: Flat-out running through streets or wilderness.
      - id: maneuver
        label: Maneuver
        metric_delta: 1
        stat_check: WIS
        effect: "Use terrain to gain distance"
      - id: shortcut
        label: Shortcut
        metric_delta: 3
        stat_check: WIS
        risk: "Dead end — lose 2 separation on failure"
        narrator_hint: Duck through an alley, vault a fence, cut across a field.
      - id: hide
        label: Hide
        metric_delta: 0
        stat_check: DEX
        resolution: true
        consequence: "Chase ends — the quarry vanishes"
    mood: tension
