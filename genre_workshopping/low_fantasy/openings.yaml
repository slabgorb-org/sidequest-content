- id: wrongful_accusation
  archetype: standoff
  situation: >-
    The player is accused of something they didn't do — or did they? A
    crime, a broken oath, a desecration. The town guard is at the door.
    Running proves guilt. Staying means a trial the player may not survive.
  tone: unjust, defiant
  avoid:
    - tavern introductions
    - quest board browsing
    - helpful merchant NPCs
  first_turn_seed: >-
    The knock comes before dawn. Three guards, a magistrate, and a woman
    pointing at you through tears. You've never seen her before.

- id: mercenary_contract
  archetype: challenge
  situation: >-
    The player has taken a job — bodyguard, bounty, or escort — and
    the first complication has already arrived. The employer lied about
    something. The target isn't what was described. The road ahead is
    worse than promised.
  tone: cynical, dangerous
  avoid:
    - job acceptance scenes
    - tavern recruitment
    - calm travel montages
  first_turn_seed: >-
    The merchant said bandits. He didn't mention the bodies — or that they
    were soldiers. Crown soldiers. Whatever you signed up for, this isn't it.

- id: monster_sighting
  archetype: mystery
  situation: >-
    Something has been seen in the hills, the woods, or the marshes.
    Livestock torn apart. A child missing. The locals are terrified and
    divided — some want to hunt it, some want to leave, some say it's
    punishment from the gods. No one agrees on what it actually is.
  tone: dread, superstitious
  avoid:
    - clear quest assignments
    - monster hunting parties already organized
    - simple combat encounters
  first_turn_seed: >-
    The goats are dead — not eaten, just killed. Whatever did this didn't
    want food. The tracks lead toward the old barrow, the one the village
    doesn't talk about.

- id: oath_conflict
  archetype: standoff
  situation: >-
    Two obligations the player holds are now in direct conflict. A lord
    demands one thing, a sworn companion demands the opposite. Honor
    requires both. Reality permits one. The player must choose before
    sunset.
  tone: tragic, inevitable
  avoid:
    - adventure hooks from strangers
    - exploration openings
    - fetch quests
  first_turn_seed: >-
    The rider carries two messages. One bears your lord's seal — march
    north by morning. The other is from someone you swore to protect.
    They're south. And they're running out of time.
