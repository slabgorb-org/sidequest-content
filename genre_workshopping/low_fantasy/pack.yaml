name: Low Fantasy
version: "1.0.0"
description: >-
  A gritty, low-magic world where steel matters more than spells.
  Inspired by the mud-and-blood realism of sword-and-sorcery fiction,
  where magic is rare, feared, and never flashy.
lobby_blurb: "Mud, steel, and hard choices. Sword-and-sorcery where magic is feared and the next meal isn't guaranteed."
recommended_players:
  min: 2
  max: 5
  sweet_spot: 4
min_sidequest_version: "0.1.0"
refine_hooks: false
