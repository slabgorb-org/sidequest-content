# Caverns Sünden — Approach Hamlets
#
# Each descent passes through a half-abandoned hamlet on the way down
# and on the way back. Sünden is the hub town; these are the bones of
# what was. NOT a loader-consumed file — this is narrator-zone fodder
# read by the prompt-zone via region/sin routing.
#
# Folded 2026-05-10 from dungeons/{grimvault,horden,mawdeep}/approach.yaml.
# Region ids match cartography.yaml.
#
# Schema (per region):
#   name: hamlet display name
#   slug: id token (separate from cartography region_id)
#   description: prose, the hamlet's lived-in shape
#   state: hollowed | thriving | gone (etc.)
#   population_remaining: int
#   what_remains: list[str] — what still works in the hollowed town
#   scene_hooks: list[{id, when, description}] — narrator beat library
#   points_of_interest: list[{name, slug, description}]

regions:

  grimvault_descent:
    name: Ashgate
    slug: ashgate
    description: Ashgate was a clean ridge-town of pale limestone and quiet pride, the
      kind of place that polished its doorsteps and kept its accounts in order. The pride
      drift took it first — and slowest. Year by year the bread tasted of less. The ale
      lost bite. Voices lost carry, so people spoke louder and never noticed. By the time
      the Patient Butcher's pull was named for what it was, half of Ashgate had already
      moved to Sünden carrying boxes of things they could no longer remember enjoying.
      The square is still swept. The fountain still runs. The water still tastes of nothing
      at all. The few who stayed are the ones whose tongues went flat in the cradle and
      could not be cured by distance — pride-touched in the bone, with nowhere else that
      food would taste any different.
    state: hollowed
    population_remaining: 16
    what_remains:
    - The Assayer Hall on the north side of the square stands open as it always did, its
      doors propped wide; nobody works the desk now, but a ledger lies on the counter
      in case someone brings something out worth weighing.
    - Wren Peatford still keeps the Recovery Bench at the field's edge, tuning fork in
      her apron pocket, because somebody has to check returning delvers for what the vault
      took, and she is the only one left who learned the trick of it.
    - Households still set the table for the absent — a clean plate at the empty seat,
      a cup turned upright — though nobody now in Ashgate can remember whose seats those
      used to be.
    scene_hooks:
    - id: arrival
      when: party_first_enters
      description: The road from Sünden ends at a square paved in pale stone that has
        forgotten how to hold colour. A fountain runs clear in the middle, pigeons drinking
        from it without sound. Three women at a window watch the party pass and do not
        call out. The bread cooling on a sill smells of warm air and nothing else. The
        vault's mouth is visible past the last roofline.
    - id: return
      when: party_returns_from_delve
      description: Wren is already on the bench when the party crests the field, fork
        in hand before the first delver reaches her. The square seems smaller on the way
        back — the buildings the same height, the streets the same width, the air thinner
        around them. Someone has laid out cups of the tasteless water on a trestle. They
        are for the party. Nobody says so.
    points_of_interest:
    - name: The Quiet Field
      slug: the_quiet_field
      description: Two hundred paces of silent grass between the last Ashgate rooftop
        and the vault's rectangular entrance. A stone path runs down the centre. By the
        middle of the field a delver's footsteps stop reaching their own ears; by the
        entrance a torch burns a shade paler than it should. Birds cross the field in
        silence and come out the other side singing again, as though nothing had been
        wrong.
    - name: The Spillway
      slug: the_spillway
      description: A tavern built over a spring that emerges through the floor and runs
        out under the back wall in a cut stone channel. The ale is still brewed on-site
        with a hard hand of hops, because the brewer who stayed says it is the last drink
        in the hamlet that tastes of anything at all. Durmach's chair still sits in the
        corner, empty. Nobody uses it. Nobody has explained who Durmach was for a long
        time.
    - name: The Recovery Bench
      slug: the_recovery_bench
      description: A plain wooden bench at the edge of the Quiet Field, set under a lean-to
        roof so the rain does not come down on whoever is sat on it. Wren Peatford keeps
        a tuning fork, a candle, a thumb-mirror, and a small slate by her side — enough
        to test what came back with the delver and what stayed behind in the vault. The
        slate is wiped clean between parties. The chalk dust never quite leaves her cuffs.

  horden_warren:
    name: Copperbridge
    slug: copperbridge
    description: Copperbridge was a working town once — a creekside settlement with a
      copper-stained bridge and a square paved in mismatched flagstones, where the Spillers
      raked the Spillfield at dawn and Kern Saltwall ran honest scales at the post. The
      greed pull made the town impossible. Things that came up out of Horden could not
      be moved on; the Hoarder's retention reaches further than its walls, and a coin
      pulled from the dungeon's throat refuses to leave Copperbridge entirely. Half the
      buildings now stand stuffed to the rafters with hoards that nobody wants and nobody
      can sell. Most people left for Sünden with what little they could carry past the
      town line. The few who remain are the ones who could not bring themselves to walk
      out without their pile, useless as it is, watching the Mouth for the rare days when
      something else rolls free.
    state: hollowed
    population_remaining: 11
    what_remains:
    - Kern's Post is still upright on the south side of the square, the Spiller's Scale
      still bolted to its counter of stacked ingots, though Kern stopped weighing packs
      out months ago and now only weighs them in.
    - Noll Thatcher sits at his counting table on what used to be Spiller Row, tallying
      the day's spillage in his ledger and muttering corrections to numbers that have
      not changed in eight weeks.
    - Households still leave a copper coin on the threshold every morning — an old Spiller
      habit meant to keep the count balanced — and every morning every coin is still there,
      exactly where it was placed.
    scene_hooks:
    - id: arrival
      when: party_first_enters
      description: The road comes in over the green-stained bridge and the first thing
        the party sees is a doorway sagging open, the room behind it stacked chest-high
        with tarnished plate the homeowner did not take with him. The square is silent.
        The Spillfield beyond it glints with coins nobody has bothered to pick up in a
        week. Kern stands behind his scale, watching the road, scale-pan empty.
    - id: return
      when: party_returns_from_delve
      description: The Spillfield has been raked since the party went down, but raked
        badly — half the rows neat, half abandoned mid-stroke. Noll is at the doorway
        of his house counting under his breath as they pass. Kern comes out to meet them
        at the post and asks, without preamble, what they are carrying. The scale is already
        uncovered. The brass pan catches the light too brightly for the hour.
    points_of_interest:
    - name: Kern's Post
      slug: kerns_post
      description: A low stone shop on the south side of the square, its counter built
        from stacked silver ingots that a buyer once tried to purchase and could not move
        past the bridge. Kern Saltwall runs it alone now — the other Spillers are gone
        — and keeps the Spiller's Scale clean. He will weigh a returning party's pack
        for a copper. He will not weigh his own ledger and grows quiet if asked why.
    - name: The Spillfield
      slug: the_spillfield
      description: The open ground between Copperbridge and the Mouth of Horden, where
        the dungeon's overflow accumulates in coins and buckles and ring-fragments shaken
        loose from its throat. The Spillfield used to be worked at dawn by every able
        hand in town. Now Noll rakes a corner of it in the early hours, and the rest sits
        as it falls. Some days nothing comes out at all. Most days, lately, are some days.
    - name: Noll's Table
      slug: nolls_table
      description: A weather-warped counting table set on Spiller Row outside Noll Thatcher's
        house. A ledger is open on it from one dawn to the next, and Noll is at the bench
        more often than not, tallying. The Counters once called this place their chapel.
        Noll calls it his work. The sums he writes do not match anything any other ledger
        in town remembers. He is the only one still keeping a count, and the count is
        creeping.

  mawdeep_gullet:
    name: Gristwell
    slug: gristwell
    description: Gristwell clings to the lip of Mawdeep the way a barnacle clings to a
      whale — fastened to a thing that is alive, growing, and indifferent to whatever
      rides on its hide. The town was a hardscrabble crossroads once, propped together
      from timber salvaged out of older houses that had already fallen into the earth.
      Now the houses lean further. The ground at the eastern edge has dropped ten feet
      since last spring, and the Mouth has crept closer with it. Most people went up the
      road to Sünden once they understood the dungeon was not done eating. The remainder
      are those who profit from the dying — Bonecounters who weigh and price what comes
      out of delvers' packs, renderers who boil down what comes out of delvers — or those
      who have nowhere else, no kin to take them in, no road they have any business on.
      The wells taste of bile most days. Smoke from below drifts up through cracks in
      the flagstones and smells like a kitchen at dawn.
    state: hollowed
    population_remaining: 8
    what_remains:
    - The single well in the centre of the square still draws water; nobody drinks it
      without straining it through cloth and salt, and on bad mornings even that does
      not help.
    - A rendering man named Tobel keeps a fire behind the second row of houses where he
      boils down what the delvers can no longer use, sells the fat and the bone-meal to
      the Bonecounters, and sleeps under the awning when the smoke gets bad.
    - Townsfolk still avoid stepping on the stones at the eastern edge of the square —
      an older custom from when the sinkhole was fresh — though the edge has moved twice
      since then and nobody has redrawn the line.
    scene_hooks:
    - id: arrival
      when: party_first_enters
      description: The road into Gristwell tilts before the buildings do, the flagstones
        canted toward the Mouth. The smell hits before the first house — warm, sweet,
        wrong, like meat in a copper pan somewhere underground. Tobel's smoke threads
        up between the roofs. Nobody comes out to look at the party. The well in the square
        is uncapped and the bucket is missing.
    - id: return
      when: party_returns_from_delve
      description: The square is closer to the Mouth than it was when the party went down.
        Not by much — by a stride, perhaps — but the stride is real, and the line of stones
        the townsfolk avoid is now under the corner of the inn. Tobel is at his fire,
        looking up. He counts the party as they come out of the throat. Then he counts
        them again. The number is the same. He nods, once, and goes back to his pot.
    points_of_interest:
    - name: Gristwell Square
      slug: gristwell_square
      description: A canted crossroads of timber houses leaning against each other, their
        cellars long since fallen into the earth and patched with whatever wood was nearest.
        A single well stands at the centre, its stone rim worn shiny by hands that do
        not pull on the rope gently. The water smells faintly of bile every dawn and worse
        by noon. The eastern quarter of the square is where the sinkhole is moving, and
        the ground there gives a little under the boot.
    - name: Bonecounter Alley
      slug: bonecounter_alley
      description: The narrow lane behind the square where the Bonecounters still keep
        two tables open — one for worked silver, one for everything else. They weigh what
        the party drags out of Mawdeep, name a price, and pay in coin that Sünden will
        accept. They do not ask where any of it came from. They do not answer if asked.
        Most of the alley is shuttered now. Two tables is enough for the trade that is
        left.
    - name: The Gristwell Sinkhole
      slug: the_gristwell_sinkhole
      description: The collapse at the eastern edge of the square where last spring's
        farmstead used to be. The stone at its lip is still warm to the hand. Mawdeep's
        digestion made the hole, and the Mouth has crept ten feet nearer the town since.
        Nothing has been rebuilt across it. Nothing will be. Children — the few left —
        throw small stones into it and listen for a sound that never comes back.
