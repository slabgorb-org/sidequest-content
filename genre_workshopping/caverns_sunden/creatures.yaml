# Sünden — Unified Bestiary
#
# ONE world, THREE descents into three sins. Creatures grouped by the
# cartography region they inhabit. Region keys mirror the keys in
# cartography.yaml exactly (grimvault_descent, horden_warren,
# mawdeep_gullet) — keep them in sync.
#
# Each region carries:
#   - name / keeper / sin: narrator-facing flavor (Patient Butcher, Hoarder, Glutton Below)
#   - summary: the in-fiction logic of why these creatures exist here
#   - creatures: the bestiary itself (full stat blocks, abilities, loot, room hints)
#
# Folded forward 2026-05-10 from
#   worlds/caverns_sunden/dungeons/{grimvault,horden,mawdeep}/creatures.yaml
# (each dungeon was being treated as a separate world before consolidation).

regions:

  grimvault_descent:
    name: Grimvault Descent
    keeper: The Patient Butcher
    sin: pride
    summary: >-
      The Patient Butcher's fauna: things that survived partial separation.
      Nothing here is natural. Everything has had something taken from it.
      The creatures are not hostile by instinct — they are incomplete.
    creatures:

      # === TIER 1: NUISANCE ===

      - id: chalk_moth
        name: Chalk Moth
        description: >-
          Finger-length moths with wings that leave no color behind
          them — wherever they land, pigment is drained. Cloth fades.
          Skin pales. They feed on color the way normal moths feed on
          wool. Individually harmless. In clouds, they can bleach a
          torchbearer's cloak white in minutes. The moths themselves
          are pure white, but their bellies shimmer with stolen hues
          that shift as they fly.
        threat_level: 1
        morale: cowardly
        hp: 1
        max_hp: 1
        ac: 10
        damage: "0 (color drain, gear degradation)"
        abilities:
          - name: Color Feed
            description: >-
              Lands on organic material and drains pigment. No physical
              damage, but prolonged exposure makes equipment harder to
              distinguish in dim light — all gear looks the same shade
              of grey. Torchlight scatters them for two rounds.
          - name: Shimmer Cloud
            description: >-
              In groups of twenty or more, the stolen colors on their
              bellies create a disorienting shimmer. Anyone moving
              through the cloud must pause or risk walking into walls —
              depth perception fails when every surface is the same hue.
        loot:
          - description: "Chalk moth wings — worthless, crumble to white powder."
        tags: [level_1, swarm, vermin, butcher_fauna]
        rooms: [receiving, sorting_floor]
        notes: >-
          Nuisance encounter. Not dangerous but they degrade gear
          visibility and signal that the vault is paying attention.
          Treat like pale rats — resource tax, not combat threat.

      - id: seam_cricket
        name: Seam Cricket
        description: >-
          Glossy black insects the size of a thumb. They eat the
          joins between things — mortar between stones, stitching
          in leather, the binding of a book. They do not eat the
          materials themselves, only the connection. A pack left
          unguarded near seam crickets will come apart at every
          seam. The crickets make a sound like a fingernail on
          slate — a thin, continuous scraping that is worse than
          silence.
        threat_level: 1
        morale: cowardly
        hp: 1
        max_hp: 1
        ac: 11
        damage: "0 (gear destruction)"
        abilities:
          - name: Seam Eating
            description: >-
              Targets connections: stitching, knots, lashings, mortar.
              A swarm can disassemble a rope coil in one turn or
              loosen armor straps in two. Does not trigger in combat —
              only when equipment is set down unattended.
          - name: Joint Sense
            description: >-
              Drawn to joins and connections. Will ignore solid objects
              entirely. A seamless metal flask is invisible to them.
              A stitched leather pack is a feast.
        loot:
          - description: "Nothing. The crickets leave no residue."
        tags: [level_1, swarm, vermin, butcher_fauna]
        rooms: [cold_store, waste_chute]
        notes: >-
          Gear attrition encounter. Check for unattended packs and
          equipment. Hirelings who set down their loads are vulnerable.

      # === TIER 2: HAZARD ===

      - id: husk_walker
        name: Husk Walker
        description: >-
          A person-shaped thing that has had its weight separated.
          It moves like a human but weighs nothing — the wind from
          a closing door pushes it sideways. It was something else
          before the Butcher processed it. Now it is an outline
          filled with habit. It walks patrol routes through the
          workshop rooms, turning where it always turned, stopping
          where it always stopped. It does not notice intruders
          unless touched. Then it remembers it has hands.
        threat_level: 2
        morale: fearless
        hp: 6
        max_hp: 6
        ac: 10
        damage: "1d4 (grip — separates warmth from flesh on contact)"
        abilities:
          - name: Weightless
            description: >-
              Cannot be knocked prone or pushed by physical force.
              Also cannot push back — its attacks drain warmth
              rather than inflict blunt trauma. Falls from any
              height without damage. Blown by strong drafts.
          - name: Patrol Memory
            description: >-
              Follows a fixed route through its room and adjacent
              corridors. Ignores all stimuli unless physically
              contacted. Breaking its route — blocking a doorway
              it always passes through — causes it to stop and
              stand motionless, vibrating silently.
          - name: Cold Grip
            description: >-
              Melee contact separates warmth from the target.
              No physical wound — the touched area becomes numb
              and cold for one hour. Accumulated cold grip can
              render a limb useless.
        loot:
          - description: "Whatever the husk was carrying when it was processed — usually nothing."
            chance: 0.1
          - description: "A token with the Butcher's notation (5 GP to the Ledger)"
            value: 5
            chance: 0.3
        tags: [level_1, undead, patrol, butcher_fauna]
        rooms: [sorting_floor, separation_chamber_west, separation_chamber_east]
        notes: >-
          Avoidable if the party maps the patrol route. Dangerous if
          cornered — cold grip stacks. The weightless body is unsettling
          but the real threat is the numbing touch.

      - id: pane_lurker
        name: Pane Lurker
        description: >-
          A flat, translucent creature that presses itself against walls
          and floors. It has had its depth separated — it exists in two
          dimensions only. Invisible edge-on, a faint shimmer face-on.
          It feeds on the dimensions of other things, briefly flattening
          whatever it wraps around. A pane lurker on your arm makes the
          arm look painted on — flat, without volume, still functional
          but disorienting to look at.
        threat_level: 2
        morale: cautious
        hp: 4
        max_hp: 4
        ac: 13
        damage: "1d3 (dimensional drain — target area appears flat for 1 hour)"
        abilities:
          - name: Two-Dimensional
            description: >-
              Invisible when viewed edge-on. Only visible as a faint
              shimmer when facing directly. Cannot be hit by piercing
              weapons from the side. Slashing weapons effective from
              any angle.
          - name: Dimension Feed
            description: >-
              Wraps around a surface or limb and drains its apparent
              depth. Affected area looks painted-on — flat, like a
              drawing of itself. No mechanical damage but the visual
              distortion imposes disadvantage on fine manipulation
              with affected limbs.
        loot:
          - description: "Pane residue — a film that makes any surface appear perfectly flat (2 GP)"
            value: 2
            chance: 0.4
        tags: [level_1, ambush, butcher_fauna]
        rooms: [receiving, holding_cells, cold_store]
        notes: >-
          Ambush predator. Perceptive characters spot the shimmer.
          The dimensional drain is disorienting but temporary. More
          dangerous in dark rooms where the shimmer is harder to see.

      # === TIER 3: THREAT ===

      - id: silence_stalker
        name: Silence Stalker
        description: >-
          A quadruped the size of a large dog. It has had its sound
          separated completely — it moves, breathes, and kills in
          total silence. Its body is covered in a fine grey fur that
          absorbs light. Its eyes are wide and white, adapted to a
          world without echolocation or auditory hunting. It tracks
          by vibration through the stone floor. Within ten feet of a
          silence stalker, all sound ceases — your voice, your
          footsteps, the crackle of your torch. This is how you know
          it is close.
        threat_level: 3
        morale: aggressive
        hp: 12
        max_hp: 12
        ac: 14
        damage: "1d6+2 (bite, silent — no audible warning)"
        abilities:
          - name: Silence Aura
            description: >-
              All sound within ten feet of the stalker ceases. This
              includes speech, equipment noise, and combat sounds.
              Hirelings cannot communicate while in the aura. Morale
              checks in the silence aura are made at disadvantage.
          - name: Vibration Sense
            description: >-
              Detects movement through stone within thirty feet.
              Standing still makes you invisible to it. Walking on
              stone alerts it. Walking on the residue in the Residue
              Well muffles vibration.
          - name: Pack Hunter
            description: >-
              In pairs, silence stalkers flank from opposite sides.
              Their overlapping auras create a twenty-foot sphere of
              total silence. Communication is impossible.
        loot:
          - description: "Silence stalker pelt — absorbs sound when worn (25 GP)"
            value: 25
            chance: 0.5
          - description: "Stalker teeth — ground to powder, used in Assayer equipment calibration (10 GP)"
            value: 10
            chance: 0.3
        tags: [level_2, predator, pack, butcher_fauna]
        rooms: [refinement_hall, intake, specimen_gallery]
        notes: >-
          The primary combat threat on Level 2. The silence aura is
          the real danger — parties that rely on verbal coordination
          are crippled. Plan hand signals before engaging.

      - id: prism_sentinel
        name: Prism Sentinel
        description: >-
          A humanoid figure made of crystallized separated light. It
          stands motionless in the Refinement Hall until a threshold
          of Keeper awareness is reached, then activates with a
          shudder of color. Its body refracts torchlight into blinding
          spectra. It moves like a person remembering how to walk —
          stiffly, deliberately, each step a decision. It does not
          pursue. It positions itself between intruders and the exits.
        threat_level: 3
        morale: fearless
        hp: 16
        max_hp: 16
        ac: 15
        damage: "1d6+1 (prismatic strike — burns on contact, leaves no wound)"
        abilities:
          - name: Light Refraction
            description: >-
              Refracts all nearby light into blinding spectra. Torches
              within fifteen feet cast prismatic glare instead of useful
              illumination. Detailed vision is impossible — you see
              color but not form.
          - name: Threshold Guardian
            description: >-
              Only activates when Keeper awareness reaches 10 or higher.
              Below that, stands motionless and can be walked past. Once
              active, positions itself at exits and does not pursue
              beyond its assigned room.
          - name: Prismatic Strike
            description: >-
              Melee contact causes a burning sensation without heat —
              the sensation of brightness applied to nerves. No visible
              wound. Pain is real. Accumulated strikes cause disorientation.
        loot:
          - description: "Prism shard — a fragment of crystallized light (40 GP, fragile)"
            value: 40
            chance: 0.3
        tags: [level_2, guardian, keeper_construct, butcher_fauna]
        rooms: [refinement_hall]
        notes: >-
          Gate guardian. Only fights when awareness is high. Can be
          avoided entirely by keeping awareness low. The prismatic
          glare is the main threat — fighting blind is fighting dead.

      # === TIER 4: BOSS ===

      - id: the_catalogue
        name: "The Catalogue"
        description: >-
          The Butcher's lieutenant — a composite entity assembled from
          separated qualities bound into a shape. Not a creature but a
          process given form. It looks different each time it manifests:
          a figure of stolen warmth one delve, a shape of compressed
          silence the next. What is consistent is its function — it
          guards the Press and it catalogs everything it encounters.
          Fighting the Catalogue means fighting the vault's filing
          system. It knows where every quality is stored and can
          withdraw specific properties from its opponents at will.
        threat_level: 4
        morale: fearless
        hp: 30
        max_hp: 30
        ac: 16
        damage: "2d6 (targeted separation — removes a specific quality per hit)"
        abilities:
          - name: Targeted Separation
            description: >-
              Each hit separates a specific quality from the target.
              First hit: warmth (numbness, cold damage vulnerability).
              Second hit: weight (cannot carry heavy objects, cannot
              brace against force). Third hit: color (visual distinction
              of objects becomes impossible). Fourth hit: sound (cannot
              speak or hear). The Catalogue always separates in this
              order. Recovery takes one full rest outside the vault.
          - name: Quality Shield
            description: >-
              The Catalogue's body is made of separated qualities.
              Physical attacks pass through the quality-mass without
              effect. It can only be harmed by returning separated
              qualities to it — throwing the contents of the Quiet
              Archive (stored sounds), or shattering prism shards
              (crystallized light) near it. Each returned quality
              deals damage and destabilizes its form.
          - name: Manifest
            description: >-
              When destroyed, the Catalogue disperses into its
              component qualities. The Patient Butcher reassembles
              it from fresh material between delves. Each incarnation
              has different quality-composition but the same function.
        loot:
          - description: "Catalogue core — a dense sphere of interwoven qualities (100 GP)"
            value: 100
            chance: 1.0
          - description: "Quality residue — loose separated properties that slowly reattach to nearby objects (30 GP)"
            value: 30
            chance: 0.7
        tags: [level_2, boss, keeper_construct, butcher_fauna]
        rooms: [the_press]
        notes: >-
          The Maw-equivalent for Grimvault. Unlike the Maw, the
          Catalogue has a puzzle component — it cannot be damaged
          by normal weapons. Players must use the vault's own
          separated materials against it. Reward exploration and
          looting of the archive rooms before attempting the boss.

  horden_warren:
    name: Horden Warren
    keeper: The Hoarder
    sin: greed
    summary: >-
      The Hoarder's fauna: things trapped in the accumulation.
      Nothing here was made. Everything got stuck. The hoard has
      its own ecology — vermin that eat treasure, predators that
      are treasure, and one poor soul who never stopped counting.
    creatures:

      # === TIER 1: NUISANCE ===

      - id: tarnish_mite
        name: Tarnish Mite
        description: >-
          Pinhead-sized insects with copper-green shells that feed on
          the shine of metal. They leave trails of verdigris and dull
          patina wherever they crawl. A single mite is invisible. A
          colony turns a gold coin green overnight. They infest packs,
          pockets, and coin purses — anywhere metal touches metal in
          the dark. Treasure they have been on is worth less because
          the shine is the first thing a buyer checks.
        threat_level: 1
        morale: cowardly
        hp: 1
        max_hp: 1
        ac: 10
        damage: "0 (treasure degradation)"
        abilities:
          - name: Tarnish Feed
            description: >-
              Feeds on the luster of metal surfaces. Infested coins lose
              their shine and appear older, reducing resale value by half.
              Does not destroy the metal — a smith can restore it, but
              that costs more than the coin is worth. Torchlight drives
              them off temporarily.
          - name: Colony Spread
            description: >-
              Transfers between metal objects in contact. An infested
              coin purse infests every coin inside it within one rest.
              The only prevention is separating metals with cloth or
              leather wrapping.
        loot:
          - description: "Nothing. The mites are too small to harvest."
        tags: [outer_ring, swarm, vermin, hoard_fauna]
        rooms: [coin_drift, scrap_hall, tarnish_hall]
        notes: >-
          Economic threat, not physical. The mites attack treasure
          value, which in a treasure-as-XP system means they attack
          experience points. Keep your coins wrapped.

      - id: ledger_worm
        name: Ledger Worm
        description: >-
          Fat, pale grubs the length of a finger that eat ink. They
          nest in paper, parchment, and vellum — anywhere ink meets
          fiber. A map left near ledger worms goes blank. A scroll
          becomes clean parchment. They leave the paper intact and
          consume only the markings. Their castings are tiny pellets
          of compressed ink that stain anything they touch permanently.
        threat_level: 1
        morale: cowardly
        hp: 1
        max_hp: 1
        ac: 9
        damage: "0 (document destruction)"
        abilities:
          - name: Ink Feed
            description: >-
              Consumes ink, charcoal, and pigment from any document
              surface. A map exposed for one turn loses its newest
              markings. Two turns, the labels. Three turns, blank
              parchment. Does not eat carved or chiseled marks — only
              applied pigment.
          - name: Ink Pellets
            description: >-
              Castings are dense pellets of compressed ink. Step on one
              and it stains your boot permanently — useful for nothing,
              impossible to remove. Annoying, not dangerous.
        loot:
          - description: "Ink pellets — worthless but indelible."
        tags: [outer_ring, swarm, vermin, hoard_fauna]
        rooms: [moth_gallery, bolt_room, appraisal_niche]
        notes: >-
          Targets maps and notes. The party's documentation is the
          real target. Losing your map in the middle ring is
          potentially fatal.

      # === TIER 2: HAZARD ===

      - id: stack_lurker
        name: Stack Lurker
        description: >-
          A predator that is indistinguishable from a pile of treasure.
          It builds itself from coins, jewelry, and scrap metal,
          arranging the pieces with its pale, multi-jointed limbs
          until it looks exactly like every other heap in the room.
          It waits — days, weeks, however long it takes — until a
          hand reaches into the pile. Then it has teeth. The teeth
          are coins, turned edge-on and driven by a jaw that is mostly
          spring steel and hunger.
        threat_level: 2
        morale: cautious
        hp: 8
        max_hp: 8
        ac: 14
        damage: "1d6 (bite — coin-edge teeth, ragged wounds)"
        abilities:
          - name: Treasure Mimicry
            description: >-
              Indistinguishable from a normal treasure pile until it
              attacks or is disturbed by physical contact. Poking with
              a pole triggers it. Visual inspection does not — the
              camouflage is perfect. Can only be detected by noticing
              that the pile breathes, which requires watching it for
              a full turn without moving.
          - name: Scatter
            description: >-
              When hit, the lurker explodes into its component coins
              and metal. It reforms two rooms away within an hour.
              The scattered coins are real treasure but tarnish-mite
              infested.
        loot:
          - description: "Scattered coins (3d6 GP worth, tarnish-mite infested)"
            value: 10
            chance: 1.0
        tags: [outer_ring, middle_ring, ambush, predator, hoard_fauna]
        rooms: [coin_drift, trophy_wall, tarnish_hall, gem_bower]
        notes: >-
          The classic mimic, reimagined as a practical ambush predator
          that builds its disguise from the environment. The real
          danger is reaching into treasure piles without checking.
          Pole-first exploration is the counter.

      - id: rust_ghost
        name: Rust Ghost
        description: >-
          The corroded remnant of an armored warrior who died in the
          hoard and never stopped walking. The armor has fused with
          the bones — iron and calcium married by centuries of
          oxidation. It moves slowly, each step grinding, shedding
          flakes of rust. It carries the weight it could not put
          down in life. The pack on its back is full of treasure,
          welded shut by corrosion. It does not attack unless you
          try to take the pack.
        threat_level: 2
        morale: fearless
        hp: 10
        max_hp: 10
        ac: 15
        damage: "1d6+1 (corroded fist — rust infection on wound)"
        abilities:
          - name: Immovable Burden
            description: >-
              The rust ghost carries a pack weighing more than most
              delvers can lift. It cannot put it down. It cannot be
              knocked prone — the weight anchors it. Pushing or
              tripping effects fail automatically.
          - name: Rust Touch
            description: >-
              Metal struck by the rust ghost corrodes rapidly. A hit
              on a shield degrades it by one AC point until repaired.
              A hit on armor does the same. Wooden and leather items
              are unaffected.
          - name: Territorial
            description: >-
              Does not pursue. Stands in its area and guards its pack.
              Walk past without touching its treasure and it watches
              you go. Reach for the pack and it swings.
        loot:
          - description: "Rust ghost pack — sealed by corrosion, requires a smith to open (50 GP contents)"
            value: 50
            chance: 0.4
          - description: "Corroded iron scraps (2 GP to a collector)"
            value: 2
            chance: 0.6
        tags: [middle_ring, undead, guardian, hoard_fauna]
        rooms: [rust_gallery, goat_path, tarnish_hall]
        notes: >-
          Avoidable if the party does not try to loot its pack. The
          pack is extremely valuable but requires town resources to
          open. The rust touch is the real threat — armor degradation
          in a dungeon with no smith is expensive.

      # === TIER 3: THREAT ===

      - id: the_appraiser
        name: "The Appraiser"
        description: >-
          A former delver. You can tell because it still wears boots
          and carries a pack — though the pack is open and empty now,
          the straps cutting into shoulders that forgot how to shrug
          them off. Its eyes are open and focused. Its lips move
          constantly. It is counting. It counts everything it sees —
          your torches, your rations, your coins, your teeth, your
          breaths. When it finishes counting your inventory, it
          whispers the total to the walls. Then the Hoarder knows
          exactly what you are carrying.
        threat_level: 3
        morale: fearless
        hp: 14
        max_hp: 14
        ac: 12
        damage: "1d4 (grasping hands — tries to hold you still while it counts)"
        abilities:
          - name: Inventory Scan
            description: >-
              Follows the party at a distance, counting their
              possessions. Takes three turns to complete a full count.
              If uninterrupted for three turns, the Hoarder's awareness
              increases by 5 immediately — it now knows exactly what
              the party carries and where every item is.
          - name: Whisper Report
            description: >-
              After completing a count, whispers the inventory to the
              dungeon walls. The awareness spike is immediate and
              cannot be undone by stealth — the count is filed.
          - name: Grasping Count
            description: >-
              In melee, grabs and holds a target while continuing to
              count their possessions. The grip is not strong but it
              is persistent — breaking free requires a STR check. It
              does not try to hurt. It tries to hold you still long
              enough to finish counting.
        loot:
          - description: "The Appraiser's empty pack — good condition, worth 3 GP"
            value: 3
            chance: 0.5
          - description: "A tally stick with precise notches (5 GP to the Counters, worthless otherwise)"
            value: 5
            chance: 0.3
        tags: [middle_ring, inner_sanctum, tracker, hoard_fauna]
        rooms: [counting_hall, goat_path, tarnish_hall]
        notes: >-
          The Appraiser is the Hoarder's sensor. Killing it is easy.
          Preventing the count is hard — it follows quietly, and in
          the cluttered middle ring, it blends with the shadows between
          stacks. The three-turn timer creates tension: do you spend
          a turn hunting it, or push forward and accept the awareness
          spike?

      - id: coin_golem
        name: Coin Golem
        description: >-
          A humanoid shape assembled from thousands of coins held
          together by nothing visible. It stands in the transition
          between rings — the toll gate, the weight lock — and
          activates when the Hoarder's awareness is high. It does
          not guard treasure. It guards exits. Its body is the
          treasure, and every hit scatters coins that must be
          recollected. Hitting it is profitable. Surviving the hit
          back is the problem.
        threat_level: 3
        morale: fearless
        hp: 18
        max_hp: 18
        ac: 16
        damage: "1d8+2 (coin-mass slam — heavy, blunt, coins embed in flesh)"
        abilities:
          - name: Coin Shell
            description: >-
              Each successful hit on the golem scatters 1d6 GP worth
              of coins. At half HP, it is visibly smaller. At zero HP,
              it collapses into a pile of coins worth its remaining
              value. But every coin scattered is a coin the Hoarder
              notices missing — each hit increases awareness by 1.
          - name: Exit Guard
            description: >-
              Only activates when Keeper awareness is 10 or higher.
              Positions itself at chokepoints between rings. Does not
              pursue beyond its assigned passage.
          - name: Reassemble
            description: >-
              If not fully destroyed, pulls scattered coins back
              together over one hour. Coins picked up by delvers
              are replaced from the dungeon's reserves — it is
              always the same size when it reforms.
        loot:
          - description: "Coin golem remnants — a pile of mixed coins (total value equals remaining HP in GP)"
            value: 18
            chance: 1.0
        tags: [middle_ring, guardian, keeper_construct, hoard_fauna]
        rooms: [toll_gate, weight_lock, antechamber]
        notes: >-
          The tactical dilemma: hitting it is profitable (coins scatter)
          but each hit raises awareness. Fighting it is literally a
          test of greed — do you keep hitting for more coins, or stop
          when you have enough and run?

      # === TIER 4: BOSS ===

      - id: the_ledger
        name: "The Ledger"
        description: >-
          The master inventory of Horden made manifest. A book the size
          of a door, bound in leather that pulses with warmth, pages
          that turn themselves and are never blank. It does not fight
          the way a creature fights — it reclaims. It opens, and every
          item in your inventory that appears on its pages flies from
          your hands, your pack, your pockets, and returns to its
          catalogued position in the dungeon. Fighting the Ledger means
          carrying things it has not yet catalogued — new items, items
          from outside, things the Hoarder does not know about. Your
          own belongings, brought from the surface, are your only
          weapons.
        threat_level: 4
        morale: fearless
        hp: 30
        max_hp: 30
        ac: 14
        damage: "2d6 (reclamation — strips items from inventory, each hit removes highest-value item)"
        abilities:
          - name: Reclamation Pulse
            description: >-
              Each turn, the Ledger emits a pulse. Every item in the
              party's inventory that exists in the Hoarder's catalogue
              (anything picked up inside Horden) is pulled toward the
              Ledger. STR check to hold on, per item. Items that fly
              free return to their catalogued position in the dungeon.
              Items brought from outside are not affected — the Ledger
              does not know about them.
          - name: Page Turn
            description: >-
              The Ledger can be damaged by tearing pages. Each torn page
              reduces its HP by 3 and permanently removes the items on
              that page from the catalogue — those items can no longer
              be reclaimed. But the pages are tough, requiring a blade
              and a free hand.
          - name: New Entry
            description: >-
              When the Ledger detects an uncatalogued item (something
              from outside the dungeon), it pauses reclamation to
              catalogue it. This takes one full turn during which the
              Ledger is vulnerable and not pulsing. The tactical key:
              feed it new items to create attack windows.
        loot:
          - description: "Ledger pages — parchment cataloguing specific items (100 GP to scholars)"
            value: 100
            chance: 1.0
          - description: "Ledger binding — warm leather that resists cutting (40 GP to a tanner)"
            value: 40
            chance: 0.7
        tags: [inner_sanctum, boss, keeper_construct, hoard_fauna]
        rooms: [counting_house]
        notes: >-
          The boss is a puzzle. Brute force does not work — the Ledger
          reclaims dungeon items faster than you can swing them. The
          solution is to bring items from outside (surface gear, personal
          belongings) and use the New Entry pause to tear pages. Parties
          that looted heavily on the way in are WEAKER against the boss
          because they are carrying catalogued items. Parties that
          carried little are stronger. The dungeon rewards restraint
          and punishes greed — at the end, when it matters most.

  mawdeep_gullet:
    name: Mawdeep Gullet
    keeper: The Glutton Below
    sin: gluttony
    summary: >-
      The Glutton shapes everything that lives here. Nothing in
      Mawdeep is natural. Everything is adapted to the dark, the
      damp, and the hunger of the dungeon itself.
    creatures:

      # === TIER 1: NUISANCE ===

      - id: pale_rat
        name: Pale Rat
        description: >-
          Eyeless, bloated, and albino. These rats have adapted to total darkness
          and feed on the amber resin that grows in the cracks of the dungeon's
          stone. They scatter from torchlight but never far — they know the dark
          will return. Their bites are septic. Their numbers are inexhaustible.
        threat_level: 1
        morale: cowardly
        hp: 2
        max_hp: 2
        ac: 10
        damage: "1 (bite, septic)"
        abilities:
          - name: Swarm
            description: >-
              In groups of six or more, pale rats attack as a swarm — a single
              attack roll at +2 dealing 1d4 damage. Torchlight scatters the
              swarm for one round.
          - name: Resin-Fed
            description: >-
              Pale rats subsist on the amber resin in the dungeon's cracks.
              They do not need food from the surface. They are part of the
              dungeon's ecology — or its digestion.
        loot:
          - description: "Nothing. Rat pelts are worthless and stink of bile."
        tags: [level_1, swarm, vermin, glutton_fauna]
        rooms: [junction]
        notes: >-
          Colony in the Junction. Not a serious threat to an armed party, but
          they drain resources if engaged — torches used to scatter them,
          rations contaminated by their presence, wounds that fester.

      - id: bone_beetle
        name: Bone Beetle
        description: >-
          Fist-sized beetles with shells made of calcite — actual bone mineral,
          grown from the dungeon's walls. They eat organic matter and excrete
          calcium deposits. The clicking of their mandibles echoes in the dark.
          Individually harmless. In the dozens that infest the Pantry's shelves,
          they strip a leather pack in minutes.
        threat_level: 1
        morale: cowardly
        hp: 1
        max_hp: 1
        ac: 12
        damage: "1 (mandibles, gear damage)"
        abilities:
          - name: Devour Gear
            description: >-
              Bone beetles target organic equipment — leather, rope, cloth,
              rations. A swarm of beetles on a dropped pack destroys one
              item per round. They ignore metal and stone.
          - name: Calcite Shell
            description: >-
              Their shells are hard mineral. Crushing them underfoot is
              noisy — each beetle crunches loudly. Clearing a room of
              beetles raises Keeper awareness by +1.
        loot:
          - description: "Calcite shell fragments. Worthless but crunchy."
        tags: [level_1, swarm, vermin, glutton_fauna]
        rooms: [pantry, throat]
        notes: >-
          Equipment hazard, not a combat encounter. The beetles exist to
          punish carelessness — unattended packs, dropped rations, leather
          left on the ground.

      # === TIER 2: THREAT ===

      - id: crawling_scavenger
        name: Crawling Scavenger
        description: >-
          Once human. Once delvers, probably. Emaciated figures that crawl on
          all fours, jawless, their mouths fused into a permanent gape. They
          feed on the amber resin growing in the dungeon's cracks, licking it
          from the stone with elongated tongues. Their eyes have not adapted
          to the dark — they are simply gone, the sockets smooth and sealed.
          They flinch from torchlight. They are not hostile unless cornered,
          but they are deeply, profoundly unsettling.
        threat_level: 2
        morale: cowardly
        hp: 6
        max_hp: 6
        ac: 11
        damage: "1d4 (claw scratch)"
        abilities:
          - name: Cornered Frenzy
            description: >-
              If trapped or cornered, scavengers attack with desperate,
              flailing claws. +2 to hit, 1d4+1 damage. Three scavengers
              in frenzy can overwhelm an unarmored target.
          - name: Resin Addiction
            description: >-
              Scavengers are drawn to amber resin. Dropping a piece of
              resin-crusted stone distracts them for 1d4 rounds while
              they fight over it.
          - name: Unsettling Presence
            description: >-
              Hirelings seeing scavengers for the first time must make a
              morale check. Not from danger — from the recognition of what
              the dungeon does to people who stay too long.
        loot:
          - description: "Tattered remnants of delving gear — a corroded belt buckle (2 CP), a broken compass"
            value: 1
          - description: "Occasionally, a scavenger still wears a ring or amulet from its former life"
            value: 15
            chance: 0.2
        tags: [level_1, undead_adjacent, glutton_fauna, unsettling]
        rooms: [hall]
        notes: >-
          Three in the Swallowing Hall. They are a moral horror, not a
          combat challenge. The party should wonder if this is what happens
          to delvers who run out of torches.

      - id: warren_crawler
        name: Warren Crawler
        description: >-
          Pale, eyeless quadrupeds the size of large dogs, with elongated limbs
          and flattened bodies adapted to the narrow passages of the Warren.
          Their skin is translucent — you can see the dark shapes of their
          organs pulsing beneath. They are scavengers by nature but predators
          by opportunity. They do not attack the strong. They wait for the
          weak.
        threat_level: 2
        morale: steady
        hp: 8
        max_hp: 8
        ac: 12
        damage: "1d6 (bite, crushing jaws)"
        abilities:
          - name: Patient Predator
            description: >-
              Warren crawlers do not initiate combat against healthy,
              lit, and armed targets. They follow at the edge of torchlight,
              waiting. When a party member is wounded, encumbered, or
              separated, they strike.
          - name: Pack Tactics
            description: >-
              Two or more crawlers attacking the same target gain +1 to hit
              each. Three crawlers can drag a prone target into the dark
              in a single round.
          - name: Squeeze
            description: >-
              Crawlers can compress their bodies to fit through gaps as
              narrow as eight inches. No door or barricade stops them
              unless it is sealed airtight.
        loot:
          - description: "Contents of the crawler's gut — occasionally coins or small items from previous victims"
            value: 5
            chance: 0.3
        tags: [level_2, predator, pack, glutton_fauna]
        rooms: [warren]
        notes: >-
          The Warren's native predators. They embody the dungeon's patience —
          they never attack the strong, only the weak and the dying. A healthy
          party walks past them. A wounded party does not.

      - id: gullet_polyp
        name: Gullet Polyp
        description: >-
          A growth on the walls of the Gullet passage — a fleshy protrusion
          the color of raw liver, the size of a human head, that extends on
          a muscular stalk when vibrations approach. It is part of the dungeon.
          It is the dungeon tasting what passes through. Its touch numbs flesh
          and its secretions dissolve leather.
        threat_level: 2
        morale: fearless
        hp: 4
        max_hp: 4
        ac: 8
        damage: "1d4 (acid touch) + gear damage"
        abilities:
          - name: Ambush Growth
            description: >-
              Polyps are indistinguishable from the ribbed walls until they
              extend. A careful examination (WIS check) reveals them before
              they strike. Otherwise, the first party member through a
              polyp-infested section takes an automatic hit.
          - name: Acid Secretion
            description: >-
              Contact with a polyp coats the affected area in digestive
              acid. Leather armor loses 1 AC permanently. Cloth dissolves.
              Metal is unaffected.
          - name: Regeneration
            description: >-
              Severed polyps regrow between delves. They cannot be
              permanently cleared. The dungeon grows them back.
        loot:
          - description: "Nothing. They are part of the walls."
        tags: [level_2, hazard_creature, glutton_organ, sessile]
        rooms: [gullet_passage]
        notes: >-
          Not a traditional creature — more like a dungeon organ. They exist
          to tax the party's gear on the way to the Vault. Fire kills them
          instantly but wastes torch-time.

      # === TIER 3: DANGEROUS ===

      - id: amber_hulk
        name: Amber Hulk
        description: >-
          A humanoid figure encased in hardened amber resin — the same
          substance that fills the cracks in the dungeon's walls. Beneath
          the amber, the shape of a human body is visible: a delver,
          preserved and puppeted. The amber moves with a grinding, cracking
          sound. It is slow but enormously strong. The Glutton has found a
          use for the dead it cannot fully digest.
        threat_level: 3
        morale: fearless
        hp: 18
        max_hp: 18
        ac: 16
        damage: "1d8+2 (amber fist, crushing)"
        abilities:
          - name: Amber Shell
            description: >-
              The resin coating absorbs blunt damage — clubs, maces, and
              fists deal half damage. Piercing weapons crack the shell.
              Fire softens it, reducing AC by 2 for 1d4 rounds.
          - name: Engulf
            description: >-
              On a critical hit, the amber hulk attempts to pull the
              target into its mass. STR save or be partially engulfed —
              restrained, taking 1d4 acid damage per round as the resin
              begins to digest. Allies can hack the target free (10 HP
              of damage to the resin).
          - name: Glutton's Puppet
            description: >-
              The amber hulk does not think. It follows the Keeper's will.
              At Keeper awareness 15+, amber hulks patrol corridors they
              normally ignore. At awareness 20, they actively hunt.
        loot:
          - description: "Cracking the amber shell reveals the original delver's gear — corroded but sometimes valuable"
            value: 30
            chance: 0.5
          - description: "Amber resin chunks (alchemically valuable on the surface)"
            value: 20
            weight: 2.0
        tags: [level_1, level_2, construct, glutton_puppet, slow]
        rooms: [hall, landing, stomach]
        notes: >-
          The dungeon's enforcers. They appear in rooms when Keeper awareness
          is high — wandering monsters that are literally made from previous
          delvers. Fighting one is loud and slow and wastes resources the
          party cannot spare.

      - id: marrow_worm
        name: Marrow Worm
        description: >-
          A segmented worm six feet long, translucent and pulsing with
          orange bioluminescence. It lives in the bone-lined walls of
          Marrow Hall, burrowing through calcified remains to feed on
          the marrow within. Its bite injects a numbing enzyme that
          dissolves bone — the victim does not feel the damage until
          the limb stops working.
        threat_level: 3
        morale: steady
        hp: 12
        max_hp: 12
        ac: 11
        damage: "1d6+1 (bite, bone-dissolving enzyme)"
        abilities:
          - name: Numbing Bite
            description: >-
              The worm's bite is painless. The victim does not know they
              have been bitten until 1d4 rounds later when the affected
              limb weakens. CON save or the limb is useless for 1 hour.
              Successive bites on the same limb cause permanent damage.
          - name: Wall Ambush
            description: >-
              Marrow worms emerge from the bone walls without warning.
              They attack anyone who leans against or touches the walls
              of Marrow Hall — which is easy to do, because the corridor
              is narrow.
          - name: Heat Sense
            description: >-
              The worms sense body heat. Dousing a torch does not hide you
              from them. Cold iron or ice repels them temporarily.
        loot:
          - description: "Worm enzyme glands — an alchemist in Gristwell pays well for them"
            value: 15
            weight: 0.1
          - description: "Bioluminescent segments glow for 1d4 hours after the worm dies — dim but free light"
            value: 5
            weight: 0.1
        tags: [level_2, ambush, glutton_fauna, bone]
        rooms: [marrow_hall]
        notes: >-
          The danger of Marrow Hall. The corridor is narrow, the walls are
          bone, and the worms are in the bone. Touching the walls is
          unavoidable in armor. Fire clears a section temporarily.

      # === TIER 4: BOSS ===

      - id: the_maw
        name: The Maw
        description: >-
          The Glutton's lieutenant. A composite horror assembled from the
          digested remains of everything the dungeon has consumed — armor
          plates fused to stone, weapons jutting from a torso of compacted
          rubble, a skull assembled from a dozen smaller skulls. It breathes.
          It watches with eyes that are gemstones set in sockets of mortar.
          It does not speak. It does not negotiate. It guards the Full Belly
          because the Glutton shaped it to. When destroyed, the Glutton will
          eventually grow another.
        threat_level: 4
        morale: fearless
        hp: 40
        max_hp: 40
        ac: 17
        damage: "2d6+3 (composite weapon limbs)"
        abilities:
          - name: Composite Form
            description: >-
              The Maw's body is made of stone, metal, and bone. It has no
              single weakness. Slashing weapons chip it. Piercing weapons
              lodge in it. Blunt weapons crack it. All damage types work,
              but none work exceptionally well. Resistance to the first 2
              points of all damage.
          - name: Weapon Limbs
            description: >-
              The Maw's arms end in fused weapon fragments — a sword blade
              on one, a mace head on the other. It alternates between
              slashing (1d8+3) and crushing (2d6+3) attacks depending on
              which arm it swings.
          - name: Absorb
            description: >-
              When the Maw takes 10+ damage in a single hit, it may absorb
              a piece of the attacker's weapon. The weapon takes 1 point of
              permanent damage (cumulative). A weapon reduced to 0 durability
              shatters and becomes part of the Maw, healing it for 1d6 HP.
          - name: Gemstone Gaze
            description: >-
              The Maw's gem-eyes pulse with bioluminescence. Any creature
              meeting its gaze must save vs. paralysis or be rooted for one
              round. Looking away imposes -2 to attack rolls against it.
              Smashing an eye (called shot, -4 to hit, 8 HP) removes this
              ability permanently for the current incarnation.
          - name: Regeneration (Slow)
            description: >-
              The Maw heals 1 HP per round as the dungeon feeds material
              into it through the floor. Standing on stone or bone, it
              cannot be starved. Lifting it off the ground (impractical)
              or fighting it on metal flooring (impossible in Mawdeep)
              would stop the regeneration.
          - name: Death Rattle
            description: >-
              When the Maw is destroyed, the dungeon screams — a vibration
              through every wall on Level 2. Keeper awareness drops by 5
              (the Glutton is stunned by the loss). The bone door to the
              Full Belly unseals. The party has a window before the Glutton
              recovers.
        loot:
          - description: "Gemstone eyes — two flawless gems worth 75 GP each"
            value: 150
            weight: 0.2
          - description: "Gold-inlaid breastplate fragment, pried from the torso"
            value: 80
            weight: 4.0
          - description: "Silver-capped bone club — a functional weapon salvaged from its limbs"
            value: 35
            weight: 3.0
          - description: "Assorted metal fragments and coins fused into its body"
            value: 40
            weight: 6.0
        tags: [level_2, boss, epitome, glutton_construct, unique]
        rooms: [maw_chamber]
        respawn: >-
          The Glutton assembles a new Maw over 2-3 delves. Each incarnation
          is different — built from whatever the dungeon has consumed since
          the last one fell. The new Maw may have different weapons, different
          armor, different weaknesses. The stats above are a baseline. The
          narrator should vary the form and abilities with each incarnation
          to prevent the fight from becoming routine.
        notes: >-
          The set-piece boss. The repeatable loop: fight the Maw, loot the
          Full Belly, extract, resupply, return to find a new Maw waiting.
          The Maw should feel like a real fight — not unfair, but expensive.
          Victory costs torches, rations, HP, and weapon durability. The
          question is never "can we kill it" but "can we afford to."
