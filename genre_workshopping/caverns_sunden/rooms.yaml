# Sünden — Unified Room Graph
#
# ONE world, THREE descents. 54 rooms total: Grimvault Descent (17),
# Horden Warren (18), Mawdeep Gullet (19). Flat list per the loader
# contract (`_load_cartography` reads this as `list[RoomDef]`).
#
# Activated by `navigation_mode: room_graph` in cartography.yaml. Until
# that flag is set, this file is loaded but unused.
#
# Folded forward 2026-05-10 from
#   worlds/caverns_sunden/dungeons/{grimvault,horden,mawdeep}/rooms.yaml
#
# Collision renames applied during fold:
#   horden:mouth       → coin_mouth      (mawdeep keeps `mouth` — it IS the maw)
#   horden:antechamber → index_chamber   (its description: "this is the index")
#
# Order: Grimvault (Pride) → Horden (Greed) → Mawdeep (Gluttony).
# Within each region: entrance first, then natural descent order.

# ===========================================================================
# === GRIMVAULT DESCENT — Pride / The Patient Butcher ===
# ===========================================================================
# 17 rooms across 2 levels. Linear processing flow with branching side-paths.
# The Patient Butcher's workshop: rooms have functions, not just contents.
# tactical_scale: 4 for all rooms (grid = size * 4 cells)

# --- Level 1: The Workshop ---

- id: threshold
  name: "The Threshold"
  room_type: entrance
  size: [3, 2]
  keeper_awareness_modifier: 0.8
  description: >-
    A rectangular chamber with walls cut flat. The floor is a single
    slab of polished stone — no seams, no joints. Your torch dims
    slightly as you enter, as though the flame has been asked to be
    quieter. Tool marks on the walls, but not from any tool you
    recognize — the grooves are too precise, too evenly spaced.
    A stone lectern near the entrance holds nothing.
  exits:
    - type: corridor
      target: receiving
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..........#
    #.L.........
    #...........
    #..........#
    #..........#
    ############
  legend:
    L: { type: interactable, label: "Stone lectern near the entrance" }

- id: receiving
  name: "The Receiving Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A wide room with a low ceiling. Along both walls, stone niches
    are cut at regular intervals — hundreds of them, each the size
    of a fist. Some contain objects: a pebble, a tooth, a coin, a
    button. Each niche is labeled with a mark that is not a letter
    in any language you know. The air is dry and still. Dust does
    not settle here — it has been separated from the air.
  exits:
    - type: corridor
      target: threshold
    - type: door
      target: sorting_floor
      is_locked: false
    - type: corridor
      target: cold_store
  tactical_scale: 4
  grid: |
    ############
    #N........N#
    #..........#
    ..........N#
    ..........N#
    #N........N#
    #N........N#
    #..........#
    #N..........
    #N..........
    #..........#
    #####..#####
  legend:
    N: { type: atmosphere, label: "Stone niche with catalogued object" }

- id: sorting_floor
  name: "The Sorting Floor"
  room_type: normal
  size: [4, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    The largest room on Level 1. Stone tables arranged in rows,
    each with a shallow depression at its center. The depressions
    contain residue — not dust, not liquid, but a film that catches
    torchlight and reflects a color that was not in the flame.
    Channels are cut into the floor between the tables, leading
    to drains at the far wall. The channels are dry. Whatever
    flowed through them was not liquid.
  exits:
    - type: door
      target: receiving
      is_locked: false
    - type: corridor
      target: separation_chamber_west
    - type: corridor
      target: separation_chamber_east
    - type: door
      target: calibration_room
      is_locked: true
  tactical_scale: 4
  grid: |
    #######..#######
    #..............#
    #..T..T..T..T..#
    #.G..........G.#
    ...............#
    ...............#
    #.G..........G.#
    #...............
    #...............
    #.G..........G.#
    #..T..T..T..T..#
    #######..#######
  legend:
    T: { type: cover, label: "Stone processing table with shallow depression" }
    G: { type: hazard, label: "Drainage channel cut into the floor" }

- id: separation_chamber_west
  name: "West Separation Chamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    A room where warmth has been removed. Not cold in the way
    winter is cold — cold in the way a thing is cold when the
    concept of warmth has been taken out of it. Your torch burns
    but does not warm. Your breath fogs but the fog does not
    dissipate — it hangs in the air as though the air has
    forgotten how to move it.
  exits:
    - type: corridor
      target: sorting_floor
    - type: secret
      target: quiet_archive
      discovered: false
  tactical_scale: 4
  grid: |
    ########
    #......#
    #......#
    ........
    ........
    #......#
    #......#
    ########

- id: separation_chamber_east
  name: "East Separation Chamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    A room where color has been removed. Your torchlight still
    illuminates but everything it touches is grey — the stone,
    your clothing, your skin. The effect is disorienting. The
    shadows are the wrong shade. When you leave, color returns
    slowly — first reds, then blues, then the rest.
  exits:
    - type: corridor
      target: sorting_floor
    - type: door
      target: holding_cells
      is_locked: false
  tactical_scale: 4
  grid: |
    ########
    #......#
    #......#
    ........
    ........
    #......#
    #......#
    ########

- id: cold_store
  name: "The Cold Store"
  room_type: treasure
  size: [2, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A room full of shelves. On the shelves: objects that have been
    processed. A sword with no weight. A shield with no hardness.
    A lantern with no light. Each item is labeled with the same
    unreadable marks as the niches in the Receiving Hall. The
    objects are arranged by type, then by what was removed. This
    is a catalog of subtraction.
  exits:
    - type: corridor
      target: receiving
    - type: door
      target: waste_chute
      is_locked: false
  tactical_scale: 4
  grid: |
    ########
    #......#
    #......#
    #......#
    #......#
    ........
    ........
    #......#
    #......#
    #......#
    #......#
    ###..###

- id: waste_chute
  name: "The Waste Chute"
  room_type: normal
  size: [1, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A narrow room with a hole in the floor. The hole descends into
    darkness. Objects lie scattered around its edge — things the
    Butcher discarded after separation. A gold ring with no shine.
    A gem with no color. A coin with no weight. Waste to the
    Butcher. Treasure to delvers.
  exits:
    - type: door
      target: cold_store
      is_locked: false
    - type: chute_down
      target: residue_well
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #..#
    #..#

- id: calibration_room
  name: "The Calibration Room"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    Behind a locked door. The walls are covered in marks — the same
    unreadable notation, but denser here, overlapping in layers.
    At the center of the room, a stone pedestal holds a sphere of
    polished stone that reflects nothing. It absorbs torchlight
    without warming. This is where the Butcher measures its work.
    Standing near the sphere, you feel your own qualities being
    assessed — not taken, but weighed.
  exits:
    - type: door
      target: sorting_floor
      is_locked: true
    - type: corridor
      target: descent
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    #..L...#
    #......#
    #......#
    #......#
    ###..###
  legend:
    L: { type: interactable, label: "Stone pedestal holding a sphere of polished stone" }

- id: quiet_archive
  name: "The Quiet Archive"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 0.9
  description: >-
    Found through the secret passage. A room of absolute silence.
    Your footsteps make no sound. Your breathing makes no sound.
    The torch crackles silently. Stone boxes line the walls, each
    sealed with wax. Inside the boxes — recorded sound, somehow
    made solid. A box of birdsong. A box of thunder. A box of
    a woman laughing. The Butcher separated these sounds from
    the world and stored them here.
  exits:
    - type: secret
      target: separation_chamber_west
      discovered: false
  tactical_scale: 4
  grid: |
    ########
    #N....N#
    #......#
    #N......
    #.......
    #N....N#
    #......#
    ########
  legend:
    N: { type: atmosphere, label: "Wax-sealed stone box of captured sound" }

- id: holding_cells
  name: "The Holding Cells"
  room_type: normal
  size: [3, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A row of ten stone cells, each sealed with an iron gate. Most
    are empty. Two contain creatures — things that were partially
    processed and survived. They press against the bars without
    sound. Their eyes track your torch. The gates are not locked
    from the outside. They are locked from inside. The creatures
    are not imprisoned. They are waiting.
  exits:
    - type: door
      target: separation_chamber_east
      is_locked: false
    - type: corridor
      target: descent
  tactical_scale: 4
  grid: |
    ############
    #.#.#.#....#
    #.#.#.#....#
    ............
    ............
    #.#.#.#....#
    #.#.#.#....#
    ############

- id: descent
  name: "The Descent"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.2
  description: >-
    A spiral staircase carved into the ridge's bedrock. The stairs
    are worn smooth but not by feet — the stone itself has been
    polished by the absence of texture flowing downward. Each step
    is colder than the last. By the halfway point, your torch
    burns grey. The air tastes of chalk and forgetting.
  exits:
    - type: corridor
      target: calibration_room
    - type: corridor
      target: holding_cells
    - type: chute_down
      target: intake
  tactical_scale: 4
  grid: |
    #..##..#
    #......#
    #......#
    ###..###

# --- Level 2: The Collection ---

- id: intake
  name: "The Intake"
  room_type: normal
  size: [3, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    The base of the descent opens into a room that is wrong. The
    proportions are correct but the surfaces have been stripped of
    every quality that makes stone look like stone. The walls are
    smooth beyond polish — frictionless, featureless, the color
    of absolute nothing. Your torch illuminates but casts no
    shadow. Nothing here casts a shadow. The shadows have been
    collected elsewhere.
  exits:
    - type: corridor
      target: descent
    - type: corridor
      target: refinement_hall
    - type: door
      target: specimen_gallery
      is_locked: false
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..........#
    #...........
    #...........
    #..........#
    #..........#
    #####..#####

- id: refinement_hall
  name: "The Refinement Hall"
  room_type: normal
  size: [4, 4]
  keeper_awareness_modifier: 1.3
  description: >-
    The central chamber of Level 2. Stone pillars support a ceiling
    you cannot see — not because it is high, but because it has
    been separated from visibility. Between the pillars, the air
    itself has texture — zones where qualities pool like water.
    Walk through a warm patch and you feel someone else's stolen
    warmth. Walk through a bright patch and colors intensify
    beyond natural range. The Butcher's work-in-progress, visible
    in cross-section.
  exits:
    - type: corridor
      target: intake
    - type: door
      target: the_press
      is_locked: true
    - type: corridor
      target: residue_well
  tactical_scale: 4
  grid: |
    ################
    #..............#
    #..............#
    #...#......#...#
    #..............#
    ...............#
    ...............#
    #..............#
    #..............#
    #...#......#....
    #...............
    #..............#
    #...#......#...#
    #..............#
    #..............#
    #######..#######

- id: specimen_gallery
  name: "The Specimen Gallery"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    Glass cases — or something like glass, smooth and perfectly
    transparent. Inside each case, a creature or object suspended
    in stillness. Not dead. Not alive. Separated from time. A rat
    mid-leap. A beetle mid-click. A delver mid-scream, mouth open,
    no sound emerging. Each specimen labeled with the Butcher's
    notation. This is a museum. You are browsing the collection.
  exits:
    - type: door
      target: intake
      is_locked: false
    - type: secret
      target: the_index
      discovered: false
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..........#
    #..........#
    #..........#
    ...........#
    ...........#
    #..........#
    #..........#
    #..........#
    #..........#
    ############

- id: the_index
  name: "The Index"
  room_type: treasure
  size: [2, 3]
  keeper_awareness_modifier: 1.1
  description: >-
    A hidden chamber filled with stone tablets arranged in
    precise rows. Each tablet bears the Butcher's notation —
    a catalog of everything that has been separated, from what,
    and where the separated quality is stored. A complete index
    of the vault's work. To a scholar, priceless. To a delver,
    the tablets themselves are heavy, valuable stone.
  exits:
    - type: secret
      target: specimen_gallery
      discovered: false
  tactical_scale: 4
  grid: |
    ########
    #L....L#
    #......#
    #L....L#
    #......#
    #L......
    #.......
    #L....L#
    #......#
    #L....L#
    #......#
    ########
  legend:
    L: { type: interactable, label: "Stone tablet bearing the Butcher's notation" }

- id: residue_well
  name: "The Residue Well"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.3
  description: >-
    Where the waste chute empties. The floor is covered in
    discarded material — the husks of objects stripped of their
    defining qualities. Metal that is not hard. Fabric that is
    not soft. Stone that is not heavy. The residue shifts
    underfoot like sand. It is technically treasure — gold is
    gold regardless of weight, and weightless gold is easier
    to carry.
  exits:
    - type: corridor
      target: refinement_hall
    - type: chute_up
      target: waste_chute
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    .......#
    .......#
    #......#
    #..GG..#
    ########
  legend:
    G: { type: hazard, label: "Pool of quality-stripped residue" }

- id: the_press
  name: "The Press"
  room_type: boss
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    Behind a locked door in the deepest chamber. The room is a
    perfect cube — each wall exactly the same distance from the
    center. At the center, a mechanism of stone and something
    that is not stone. It turns slowly, without sound, without
    visible power. This is where the Butcher does its finest
    work. The air around the mechanism is thick with separated
    qualities — patches of pure warmth, pure color, pure sound,
    floating free of any host. The Catalogue guards this room.
  exits:
    - type: door
      target: refinement_hall
      is_locked: true
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..........#
    #..........#
    #..........#
    #....LL....#
    #....LL....#
    #..........#
    #..........#
    #..........#
    #..........#
    ############
  legend:
    L: { type: interactable, label: "The separation mechanism — stone and not-stone" }

# ===========================================================================
# === HORDEN WARREN — Greed / The Hoarder ===
# ===========================================================================
# 18 rooms across 3 concentric rings. Tightening inward.
# The Hoarder's den: rooms are defined by what they contain, not what they do.
#
# Collision renames in this section:
#   mouth       → coin_mouth      (Mawdeep claims `mouth`)
#   antechamber → index_chamber   (Mawdeep claims `antechamber`)

# --- Outer Ring: The Spillover ---

- id: coin_mouth
  name: "The Mouth"
  room_type: entrance
  size: [4, 3]
  keeper_awareness_modifier: 0.8
  description: >-
    A ragged opening in the ridge face — not cut but pushed outward
    from inside, stone cracked and bent like a mouth frozen mid-yawn.
    The Mule Track ends here in a fan of tarnished copper filings.
    Inside, the first chamber is wide and high-ceilinged, but the
    floor is uneven — drifts of loose coins shift underfoot like
    gravel on a beach. Broken furniture, split crates, and tangled
    cloth spill from the darkness ahead. The air smells of old
    metal and rotting leather. Everything glints.
  exits:
    - type: corridor
      target: scrap_hall
    - type: corridor
      target: coin_drift

- id: scrap_hall
  name: "The Scrap Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 0.9
  description: >-
    A long chamber lined with broken things. Shattered swords in
    heaps. Dented helmets stacked like bowls. Shield bosses pried
    from their boards and sorted by size into stone bins. Nothing
    here is whole — the Hoarder keeps the pieces separately. The
    stacks are organized by material: iron to the left, bronze in
    the center, tin and copper to the right. Each stack is exactly
    the same height. Someone has been tidying.
  exits:
    - type: corridor
      target: coin_mouth
    - type: corridor
      target: trophy_wall
    - type: door
      target: moth_gallery
      is_locked: false

- id: coin_drift
  name: "The Coin Drift"
  room_type: treasure
  size: [3, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A room where the floor has vanished under coins. Knee-deep at
    the entrance, waist-deep at the far wall. Copper, mostly —
    green with verdigris, fused into crusts along the bottom.
    Silver coins surface like fish in a pond. Gold is rare here
    but visible — single coins placed on top of the drifts at
    precise intervals, as if marking a grid only the Hoarder can
    read. Walking is slow. Every step clinks. The sound carries.
  exits:
    - type: corridor
      target: coin_mouth
    - type: corridor
      target: bolt_room
    - type: door
      target: moth_gallery
      is_locked: false

- id: trophy_wall
  name: "The Trophy Wall"
  room_type: normal
  size: [2, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    Weapons. Hundreds of them, driven point-first into the walls
    and ceiling. Swords, axes, spears, daggers, a few things that
    are not weapons but have been filed with them — a fireplace
    poker, a bread knife, a shepherd's crook with an iron ferrule.
    The Hoarder does not distinguish function. It sorts by material
    and shape. Between the weapons, the plaster is scarred with
    the merchant's trade cipher — inventory marks counting each
    blade. Pull one out and the wall bleeds rust.
  exits:
    - type: corridor
      target: scrap_hall
    - type: corridor
      target: toll_gate

- id: moth_gallery
  name: "The Moth Gallery"
  room_type: normal
  size: [3, 2]
  keeper_awareness_modifier: 0.9
  description: >-
    Textiles. Rotting tapestries draped over mounds of folded cloth.
    Silk gone to cobweb. Wool felted into solid blocks by centuries
    of compression. The moths that give the room its name are not
    insects — they are scraps of fabric that flutter when you pass,
    stirred by the draft of your movement. The cloth is worthless
    but the thread-of-gold embroidery peeled from the tapestries
    lies in coiled heaps on stone shelves, still bright.
  exits:
    - type: door
      target: scrap_hall
      is_locked: false
    - type: door
      target: coin_drift
      is_locked: false
    - type: corridor
      target: bolt_room

- id: bolt_room
  name: "The Bolt Room"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A small room stacked floor to ceiling with bolts of cloth,
    rolls of leather, and bundles of cord. The organization is
    meticulous — each bolt tagged with a scrap of vellum bearing
    the trade cipher. The oldest bolts at the bottom have
    compressed into something like stone. The newest, near the
    top, are still supple. A narrow path winds between the stacks.
    The air is thick with fiber dust that catches torchlight and
    hangs motionless.
  exits:
    - type: corridor
      target: coin_drift
    - type: corridor
      target: moth_gallery
    - type: corridor
      target: toll_gate

- id: toll_gate
  name: "The Toll Gate"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.2
  description: >-
    A chokepoint between the outer and middle rings. The passage
    narrows to a stone arch with a brass tray set into the wall
    at chest height. The tray is polished smooth from use. Above
    it, the trade cipher is carved deep — the same symbol repeated
    three times. Every delver who has passed this point agrees on
    what it means: put something in. The door beyond the tray is
    stone, heavy, and closed. It opens when the tray holds
    something it did not hold before. What you deposit stays.
  exits:
    - type: corridor
      target: trophy_wall
    - type: corridor
      target: bolt_room
    - type: door
      target: tarnish_hall
      is_locked: true

# --- Middle Ring: The Collection ---

- id: tarnish_hall
  name: "The Tarnish Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.1
  description: >-
    The first room past the toll gate and the difference is
    immediate. The treasure here is real. Silver candlesticks
    black with tarnish. Gold chains draped over stone pedestals.
    Gemstones loose in stone bowls — garnets, tourmalines, a few
    pale sapphires. But the stacks are taller and the paths are
    narrower. You walk single-file between walls of treasure that
    lean inward. The air tastes of verdigris and old wax. Something
    in the walls ticks — a faint, regular sound, like a clock or
    a tongue clicking.
  exits:
    - type: door
      target: toll_gate
      is_locked: true
    - type: corridor
      target: gem_bower
    - type: corridor
      target: rust_gallery

- id: gem_bower
  name: "The Gem Bower"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    A low-ceilinged room where gems have been pressed into every
    surface — walls, floor, ceiling. Not set by a jeweler but
    pushed in by force, the stone cracked around each stone like
    a fist punched into clay. The effect is a cave of color —
    torchlight fractures into reds, greens, blues that shift as
    you move. The gems closest to the floor are dull with dust.
    The ones near the ceiling are bright, recently placed. The
    Hoarder is still decorating.
  exits:
    - type: corridor
      target: tarnish_hall
    - type: secret
      target: appraisal_niche
      discovered: false

- id: rust_gallery
  name: "The Rust Gallery"
  room_type: normal
  size: [3, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    The oldest part of the middle ring. Everything here has been
    here for centuries. Iron has rusted to lace. Bronze has gone
    green. Silver is black. Leather has become powder. Only the
    gold remains — dull yellow shapes half-buried in the decay of
    everything that was stored beside it. The floor is soft with
    decomposed organic matter. The stacks have fused into solid
    masses of corroded metal and rotted wood. Walking here sounds
    like stepping on dry leaves.
  exits:
    - type: corridor
      target: tarnish_hall
    - type: door
      target: goat_path
      is_locked: false
    - type: chute_down
      target: deep_pile

- id: appraisal_niche
  name: "The Appraisal Niche"
  room_type: treasure
  size: [1, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A hidden alcove behind the gem-studded wall. Inside, a stone
    desk and a brass scale — the merchant's original equipment,
    preserved perfectly. Weights in a velvet-lined case, each
    marked with the trade cipher. A ledger book lies open on the
    desk, its pages filled with inventory in a hand that started
    neat and grew increasingly frantic. The last entry is a single
    line repeated across the page: a number. The same number. The
    count when it became the count.
  exits:
    - type: secret
      target: gem_bower
      discovered: false

- id: goat_path
  name: "The Goat Path"
  room_type: normal
  size: [1, 3]
  keeper_awareness_modifier: 1.3
  description: >-
    The passage narrows to shoulder-width. The walls are not stone —
    they are treasure, stacked and compressed into solid masses on
    both sides. Coin edges protrude at shin height. A crown is
    embedded in the left wall at eye level, its jewels arm's reach
    away. The ceiling is a shelf of compacted ingots. You walk
    sideways. Your pack scrapes both walls. Things shift behind you
    as you pass — settling, tightening, closing the gap. The path
    behind you is always narrower than the path ahead.
  exits:
    - type: door
      target: rust_gallery
      is_locked: false
    - type: corridor
      target: weight_lock
    - type: corridor
      target: counting_hall

- id: weight_lock
  name: "The Weight Lock"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.3
  description: >-
    A square room with a stone door on the far wall and a brass
    platform set into the floor. The platform is a scale. The
    door opens only when the platform reads the same weight it
    read when you entered from the goat path — your body weight,
    without gear. Everything you are carrying must be set down
    on the room's stone shelves to pass. The shelves are full of
    things other delvers set down and could not bring themselves
    to leave behind. They went back for them. They did not come
    out.
  exits:
    - type: corridor
      target: goat_path
    - type: door
      target: index_chamber
      is_locked: true

- id: counting_hall
  name: "The Counting Hall"
  room_type: normal
  size: [3, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A long room with stone tables down the center, each holding
    an abacus made of gold wire and gemstone beads. The abacuses
    move on their own — beads sliding, clicking, tallying. They
    count everything in the dungeon. One abacus per ring. The
    outer ring's abacus moves constantly. The middle ring's moves
    less. The inner sanctum's abacus has not moved in a very long
    time. The whispering is loudest here — the Hoarder's voice,
    reading the count aloud to itself, endlessly, in a language
    made entirely of numbers.
  exits:
    - type: corridor
      target: goat_path
    - type: door
      target: index_chamber
      is_locked: true

# --- Inner Sanctum: The Counting House ---

- id: index_chamber
  name: "The Antechamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    The last room before the Hoarder. The treasure here is sorted
    by type with inhuman precision — every coin facing the same
    direction, every gem cut to the same size, every ingot aligned
    to the same axis. The air is still. The dust does not move.
    The walls are lined with ledger books — thousands of them,
    floor to ceiling, each spine marked with a date range in the
    trade cipher. This is the index. The catalog of the catalog.
    The ticking sound from the Tarnish Hall is louder here. It is
    not a clock. It is a tongue.
  exits:
    - type: door
      target: weight_lock
      is_locked: true
    - type: door
      target: counting_hall
      is_locked: true
    - type: corridor
      target: counting_house

- id: counting_house
  name: "The Counting House"
  room_type: boss
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    A perfect circle of a room. The walls are gold — not gilded,
    solid. The floor is a mosaic of coins pressed flat and fitted
    together without gaps. At the center, a stone desk holds the
    master ledger — a book the size of a coffin lid, its pages
    turning on their own, the trade cipher flowing across them in
    fresh ink that writes itself. This is where the counting lives.
    The Hoarder is not in this room. The Hoarder IS this room.
    The walls pulse faintly when you breathe. The mosaic floor
    shifts under your weight, coins turning to show their faces —
    all the same face. The merchant's face. Worn smooth by
    counting.
  exits:
    - type: corridor
      target: index_chamber

- id: deep_pile
  name: "The Deep Pile"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 1.5
  description: >-
    Below the Rust Gallery, accessible only by a one-way chute
    through corroded metal. A chamber of pure treasure — the oldest
    and most valuable items in Horden, compressed by the weight of
    everything above them. Crown jewels fused to scepters. Gem-
    encrusted armor crushed flat. A king's ransom in gold dust
    ground from coins by centuries of pressure. The air is warm
    from the mass of metal. The only exit is up, through the
    Counting Hall, past the abacuses that will count every item
    you carry.
  exits:
    - type: chute_up
      target: counting_hall

# ===========================================================================
# === MAWDEEP GULLET — Gluttony / The Glutton Below ===
# ===========================================================================
# 19 rooms across 2 levels. Jaquayed layout with loops and one-way drops.
# The Glutton Below shapes every room — organic textures, warmth, constriction.
# tactical_scale: 4 for all rooms (grid = size * 4 cells)

# --- Level 1: The Gullet ---

- id: mouth
  name: "The Mouth"
  room_type: entrance
  size: [3, 3]
  keeper_awareness_modifier: 0.8
  description: >-
    Sixty feet across. Stone lips worn smooth. Cold air breathes outward
    in a slow, rhythmic pulse. The floor slopes gently downward. Chalk
    marks from previous parties cover the walls near the entrance.
    Daylight reaches about thirty feet in before the dark swallows it.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..........#
    #..........#
    #..........#
    #...........
    #...........
    #..........#
    #..........#
    #..........#
    #..........#
    #####..#####

- id: throat
  name: "The Throat"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A descending passage wide enough for three abreast. The walls have
    a ribbed texture — horizontal ridges of stone that look disturbingly
    like cartilage. The air is warmer here. Your torchlight catches
    moisture on the ceiling.
  exits:
    - type: corridor
      target: mouth
    - type: door
      target: cistern
      is_locked: false
    - type: corridor
      target: junction
  tactical_scale: 4
  grid: |
    ###..###
    #.......
    #.......
    ###..###

- id: antechamber
  name: "The Antechamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A roughly circular room. The floor is covered in a fine grit that
    crunches underfoot — ground bone mixed with stone dust. Three archways
    lead deeper. A pile of abandoned equipment sits against the far wall.
  exits:
    - type: corridor
      target: mouth
    - type: corridor
      target: junction
    - type: corridor
      target: gallery
  tactical_scale: 4
  grid: |
    _##..##_
    #......#
    #......#
    #.......
    #.......
    #......#
    #......#
    _##..##_

- id: cistern
  name: "The Cistern"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A domed room with a sunken pool in the center. The water is black,
    still, and warm to the touch. It smells faintly sweet — not pleasant
    sweet, but the sweetness of something decomposing. Your reflection
    does not look quite right.
  exits:
    - type: door
      target: throat
      is_locked: false
    - type: corridor
      target: pantry
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #..~~..#
    #..~~..#
    #..~~..#
    #......#
    #......#
    ###..###

- id: junction
  name: "The Junction"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A crossroads where three passages meet under a high vaulted ceiling.
    The stone here is cracked and the cracks are filled with something
    amber and translucent, like hardened sap. The air is noticeably
    warmer. A faint vibration comes through the floor.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber
    - type: corridor
      target: hall
    - type: corridor
      target: chute
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..V....V..#
    #..........#
    #..........#
    ............
    ............
    #..........#
    #..........#
    #..V....V..#
    #..........#
    #####..#####
  legend:
    V: { type: atmosphere, label: "Amber-filled crack in the stone" }

- id: gallery
  name: "The Gallery of the Eaten"
  room_type: treasure
  size: [3, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    A long rectangular room. The walls are lined with alcoves, each
    containing objects — a rusted sword, a child's doll, a merchant's
    scale, a holy symbol. Personal effects of the swallowed. Hundreds
    of them, arranged with a care that suggests curation.
  exits:
    - type: corridor
      target: antechamber
    - type: door
      target: hall
      is_locked: false
  tactical_scale: 4
  grid: |
    #####..#####
    #A........A#
    #..........#
    #A..........
    #...........
    #A........A#
    #..........#
    ############
  legend:
    A: { type: atmosphere, label: "Alcove with relics of the eaten" }

- id: pantry
  name: "The Pantry"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A low-ceilinged room that smells of rot and vinegar. Wooden shelves
    line the walls, stocked with supplies that should not exist this
    deep — rations, waterskins, torches. All are spoiled.
  exits:
    - type: corridor
      target: cistern
    - type: door
      target: stairs_down
      is_locked: false
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    ###..###

- id: hall
  name: "The Swallowing Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A vast hall with a domed ceiling lost in shadow above the torchlight.
    The floor is a mosaic of different stones — fragments of buildings,
    roads, foundations. This is where Edgeholm went. A stone well in
    the center descends into darkness.
  exits:
    - type: corridor
      target: junction
    - type: door
      target: gallery
      is_locked: false
    - type: corridor
      target: stairs_down
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..........#
    #..........#
    #....WW....#
    #....WW.....
    #...........
    #..........#
    #..........#
    #..........#
    #..........#
    #####..#####
  legend:
    W: { type: interactable, label: "Stone well descending into darkness" }

- id: chute
  name: "The Chute"
  room_type: normal
  size: [1, 1]
  keeper_awareness_modifier: 1.1
  description: >-
    A steep, smooth-walled passage angled at forty-five degrees. The
    stone is slick with moisture. Once you start sliding, you cannot
    stop. This is a one-way passage to Level 2.
  exits:
    - type: corridor
      target: junction
    - type: chute_down
      target: warren
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #..#
    #..#

- id: stairs_down
  name: "The Stairs"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A carved staircase descending into warmth. The steps are uneven —
    some are six inches, some are eighteen, as though the stone is
    shifting over time. The walls are damp.
  exits:
    - type: door
      target: pantry
      is_locked: false
    - type: corridor
      target: hall
    - type: corridor
      target: landing
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #..#
    #...
    #...
    #..#
    #..#
    #..#

# --- Level 2: The Belly ---

- id: landing
  name: "The Landing"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    The foot of the stairs opens into a room where the stone changes.
    The walls are smooth, curved, and faintly warm. An orange
    bioluminescence pulses in the veins of the stone, providing just
    enough light to see shapes but not details.
  exits:
    - type: corridor
      target: stairs_down
    - type: corridor
      target: gullet_passage
    - type: corridor
      target: acid_pool
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    #.......
    #.......
    #......#
    #......#
    ###..###

- id: gullet_passage
  name: "The Gullet"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.3
  description: >-
    A corridor that narrows as you proceed. The walls are warm and
    slick. The ribbed texture from the Throat is more pronounced here.
    The ceiling drops until you are crouching. Something ahead reflects
    your torchlight with a golden glint.
  exits:
    - type: corridor
      target: landing
    - type: door
      target: vault
      is_locked: false
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #,,#
    #,,#
    #,,#
    #,,#
    #..#
    #..#

- id: acid_pool
  name: "The Acid Pool"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    A room dominated by a shallow pool of clear liquid that steams
    gently. The liquid is warm and smells of bile. The far wall has
    a shaft going straight up — this is where the well from the
    Swallowing Hall terminates.
  exits:
    - type: corridor
      target: landing
    - type: corridor
      target: warren
  tactical_scale: 4
  grid: |
    _##..##_
    #......#
    #..~~..#
    #.~~~~.#
    #.~~~~.#
    #..~~..#
    #......#
    _##..##_

- id: warren
  name: "The Warren"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    A tangle of narrow passages connecting small, round chambers —
    each barely large enough for two people. The walls pulse with
    orange light. Navigation is disorienting — the passages curve
    and branch unpredictably.
  exits:
    - type: corridor
      target: acid_pool
    - type: corridor
      target: stomach
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..#....#..#
    #..#....#..#
    #..........#
    #....##....#
    #....##....#
    #..........#
    #..#....#..#
    #..#....#..#
    #..........#
    _####..####_

- id: vault
  name: "The Vault of Teeth"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A domed room. The walls are studded with stone teeth — not
    decorative, but the real teeth of the dungeon, grown from the
    rock like stalactites. Among the teeth: treasure. Coins, gems,
    and jewelry are embedded in the stone.
  exits:
    - type: door
      target: gullet_passage
      is_locked: false
    - type: corridor
      target: stomach
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #.T..T.#
    #......#
    #......#
    #.T..T.#
    #......#
    ###..###
  legend:
    T: { type: atmosphere, label: "Stone tooth studded with gems" }

- id: stomach
  name: "The Stomach"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.3
  description: >-
    The largest room on Level 2. The floor is soft — not mud, not
    flesh, but something between. Your boots sink half an inch with
    every step. The walls undulate slowly, almost imperceptibly. The
    orange bioluminescence is brightest here. This is where the
    Glutton digests.
  exits:
    - type: corridor
      target: warren
    - type: corridor
      target: vault
    - type: door
      target: marrow_hall
      is_locked: false
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..,,,,,,..#
    #.,,,,,,,,.#
    #.,,,,,,,,.#
    #.,,,,,,,,,.
    #.,,,,,,,,,.
    #.,,,,,,,,.#
    #.,,,,,,,,.#
    #..,,,,,,..#
    #..........#
    #####..#####

- id: marrow_hall
  name: "Marrow Hall"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A short passage lined with exposed bone — not stone carved to
    look like bone, but actual bone grown into the walls. Femurs,
    ribs, skulls. The heat radiates from the bone itself.
  exits:
    - type: door
      target: stomach
      is_locked: false
    - type: door
      target: maw_chamber
      is_locked: false
  tactical_scale: 4
  grid: |
    #..#
    #B.#
    #.B#
    #B.#
    #.B#
    #B.#
    #.B#
    #..#
  legend:
    B: { type: atmosphere, label: "Exposed bone grown into the wall" }

- id: maw_chamber
  name: "The Maw"
  room_type: boss
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    A domed chamber where the ceiling is lost in shadow and the floor
    is a bowl of fused bone and stone. The bioluminescence pulses fast
    here — a heartbeat. In the center, something massive crouches. It
    is made of everything the Glutton has eaten and failed to digest.
    The Glutton's lieutenant. Its favorite thing.
  exits:
    - type: door
      target: marrow_hall
      is_locked: false
    - type: door
      target: full_belly
      is_locked: true
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..........#
    #..........#
    #....MM....#
    #....MM....#
    #..........#
    #..........#
    #..........#
    #..........#
    #..........#
    _####..####_
  legend:
    M: { type: hazard, label: "The Glutton's lieutenant crouches here" }

- id: full_belly
  name: "The Full Belly"
  room_type: treasure
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    The deepest room. Vast and warm and golden. The bioluminescence
    here is so bright you could read by it. The floor is a carpet
    of treasure — coins, gems, jewelry, weapons, armor, the accumulated
    wealth of generations of swallowed caravans, villages, and delvers.
    The walls breathe. You are standing inside the Glutton.
  exits:
    - type: door
      target: maw_chamber
      is_locked: false
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..........#
    #.T......T.#
    #..........#
    #..........#
    #....TT....#
    #..........#
    #..........#
    #.T......T.#
    #..........#
    _##########_
  legend:
    T: { type: atmosphere, label: "Mound of treasure embedded in living stone" }
