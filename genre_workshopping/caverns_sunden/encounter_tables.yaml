# Sünden — Unified Encounter Tables
#
# ONE world, THREE descents. Per-room encounter probabilities referencing
# creatures.yaml IDs in the same world file.
#
# Region keys mirror cartography.yaml exactly. Each region carries a
# levels: list (depth tiers within that descent) and each level carries:
#   - wandering_monster_chance: base per-room-entry probability
#   - wandering_monster_awareness_bonus: per-Keeper-awareness-tick bonus
#   - wandering_monsters: weighted spawn pool
#   - room_encounters: fixed per-room encounter chances (mawdeep was
#     "rooms:" in its source — normalized to room_encounters: on fold)
#
# Folded forward 2026-05-10 from
#   worlds/caverns_sunden/dungeons/{grimvault,horden,mawdeep}/encounter_tables.yaml

regions:

  grimvault_descent:

    levels:

      - id: level_1
        name: "The Workshop"
        wandering_monster_chance: 0.12
        wandering_monster_awareness_bonus: 0.02
        wandering_monsters:
          - creature_id: chalk_moth
            weight: 4
            count: "3d6"
            description: >-
              A cloud of white moths drifts through the corridor. Where
              they pass, the walls fade to grey. Your torchlight catches
              the stolen colors on their bellies — brief flashes of red,
              blue, green.
            loot:
              - description: "Nothing. Moth wings crumble to powder."
          - creature_id: seam_cricket
            weight: 3
            count: "2d6"
            description: >-
              A thin scraping sound from the walls. Glossy black shapes
              flow along the mortar lines between stones, eating the
              joins. Check your pack straps.
            loot:
              - description: "Nothing."
          - creature_id: husk_walker
            weight: 2
            count: "1"
            description: >-
              A figure in the corridor ahead. It walks with purpose but
              no weight — its feet make no impression on the dust. It
              does not see you. It is following a route it has followed
              for years. Give it room.
            loot:
              - description: "A token with the Butcher's notation (5 GP)"
                value: 5
                chance: 0.3
          - creature_id: pane_lurker
            weight: 1
            min_awareness: 6
            count: "1d2"
            description: >-
              A shimmer on the wall. Not a reflection — the wall itself
              is rippling. Something flat and nearly invisible is pressed
              against the stone, waiting for something three-dimensional
              to pass close enough.
            loot:
              - description: "Pane residue (2 GP)"
                value: 2
                chance: 0.4

        room_encounters:
          - room_id: receiving
            encounters:
              - creature_id: chalk_moth
                count: "4d6"
                probability: 0.3
                description: >-
                  The niches are full of moths — one per niche, wings
                  folded, bellies glowing faintly with stored color. They
                  stir as your torch approaches.
              - creature_id: pane_lurker
                count: "1"
                probability: 0.15
                description: >-
                  One of the niches contains not an object but a shimmer.
                  The pane lurker is curled inside, two-dimensional and
                  nearly invisible.

          - room_id: sorting_floor
            encounters:
              - creature_id: husk_walker
                count: "1d3"
                probability: 0.4
                description: >-
                  Husks at the sorting tables. Their hands move over the
                  surfaces in practiced motions — sorting, categorizing,
                  filing. They do not look up. They are working.
              - creature_id: chalk_moth
                count: "2d6"
                probability: 0.2
                description: >-
                  Moths along the ceiling, following the channels in the
                  floor. They drain color from the stone as they go.

          - room_id: cold_store
            encounters:
              - creature_id: seam_cricket
                count: "3d6"
                probability: 0.5
                description: >-
                  The shelves are infested. Crickets flow along the joins
                  between shelf and wall, between label and object. Some
                  of the stored items have come apart at their seams.

          - room_id: holding_cells
            encounters:
              - creature_id: husk_walker
                count: "2"
                probability: 0.6
                description: >-
                  Two husks in separate cells. The gates are not locked.
                  The husks stand still, hands at their sides, watching
                  through the bars. If a gate is opened, the husk steps
                  out and resumes its patrol route.

      - id: level_2
        name: "The Collection"
        wandering_monster_chance: 0.18
        wandering_monster_awareness_bonus: 0.04
        wandering_monsters:
          - creature_id: silence_stalker
            weight: 3
            count: "1d2"
            description: >-
              Sound drops away. Your torch still crackles but you cannot
              hear it. Something is close — four-legged, grey-furred,
              white-eyed. It has not seen you yet. It is listening to
              the stone.
            loot:
              - description: "Silence stalker pelt (25 GP)"
                value: 25
                chance: 0.5
          - creature_id: husk_walker
            weight: 2
            count: "1d2"
            description: >-
              A husk from Level 1, descended. More processed than the
              ones above — this one has had its color separated too.
              A grey, weightless figure drifting through the corridors.
            loot:
              - description: "A token with dense notation (8 GP)"
                value: 8
                chance: 0.3
          - creature_id: pane_lurker
            weight: 2
            count: "1d3"
            description: >-
              The walls shimmer in patches. More pane lurkers down here —
              and they are larger, or at least occupy more surface area.
              They have had more time to feed on dimensions.
            loot:
              - description: "Pane residue (2 GP)"
                value: 2
                chance: 0.4
          - creature_id: prism_sentinel
            weight: 1
            min_awareness: 10
            count: "1"
            description: >-
              A shape of refracted light activates in the corridor ahead.
              Color erupts from it — blinding, prismatic, beautiful. It
              steps into position between you and the way forward.
            loot:
              - description: "Prism shard (40 GP, fragile)"
                value: 40
                chance: 0.3

        room_encounters:
          - room_id: refinement_hall
            encounters:
              - creature_id: prism_sentinel
                count: "1"
                probability: 0.5
                min_awareness: 10
                description: >-
                  The sentinel stands between the pillars. Motionless
                  until awareness rises. Then it shudders, and color
                  floods the room.
              - creature_id: silence_stalker
                count: "1d3"
                probability: 0.3
                description: >-
                  Among the quality-pools, stalkers drink from a patch
                  of stolen sound. They are feeding. They are not hungry
                  enough to hunt. Yet.

          - room_id: specimen_gallery
            encounters:
              - creature_id: pane_lurker
                count: "1d3"
                probability: 0.4
                description: >-
                  Lurkers pressed against the glass cases, feeding on the
                  depth of the specimens inside. They peel away when
                  disturbed, disoriented by the transition from surface
                  to air.

          - room_id: the_press
            encounters:
              - creature_id: the_catalogue
                count: "1"
                probability: 1.0
                description: >-
                  The Catalogue manifests from the separated qualities
                  pooling around the mechanism. Its form shifts — now a
                  figure of compressed silence, now a shape of stolen
                  warmth. It does not speak. It catalogs.

  horden_warren:

    levels:

      - id: outer_ring
        name: "The Spillover"
        wandering_monster_chance: 0.10
        wandering_monster_awareness_bonus: 0.02
        wandering_monsters:
          - creature_id: tarnish_mite
            weight: 4
            count: "3d6"
            description: >-
              A glint of copper-green on the wall. Tiny shapes flowing
              across the surface of a coin pile, leaving dull trails
              behind them. Check your purse.
            loot:
              - description: "Nothing. The mites are too small to harvest."
          - creature_id: ledger_worm
            weight: 3
            count: "2d6"
            description: >-
              Fat pale shapes on the floor between stacks. They are
              eating something — a scrap of parchment, a tag from a
              bolt of cloth. The ink vanishes as you watch.
            loot:
              - description: "Ink pellets (worthless, indelible)."
          - creature_id: stack_lurker
            weight: 2
            count: "1"
            description: >-
              A pile of coins in the corridor. Exactly like every other
              pile. Except this one is breathing. You notice only if
              you stop and watch.
            loot:
              - description: "Scattered coins (3d6 GP, tarnish-mite infested)"
                value: 10
                chance: 1.0
          - creature_id: rust_ghost
            weight: 1
            min_awareness: 6
            count: "1"
            description: >-
              A grinding sound from behind a stack. A shape steps out —
              human-sized, coated in rust, carrying a pack it cannot
              set down. It watches you. It does not move unless you
              reach for the pack.
            loot:
              - description: "Corroded iron scraps (2 GP)"
                value: 2
                chance: 0.6

        room_encounters:
          - room_id: coin_drift
            encounters:
              - creature_id: tarnish_mite
                count: "4d6"
                probability: 0.4
                description: >-
                  The surface of the coin drift ripples with tiny green
                  shapes. Mites, thousands of them, skating across the
                  metal surface. The coins they have passed over are dull.
              - creature_id: stack_lurker
                count: "1"
                probability: 0.2
                description: >-
                  Among the coin drifts, one pile is taller than the
                  rest. It has been here longer than the others. It is
                  also warmer.

          - room_id: scrap_hall
            encounters:
              - creature_id: tarnish_mite
                count: "2d6"
                probability: 0.3
                description: >-
                  Green trails on the iron stacks. The broken swords are
                  duller than they should be. Mites flow along the edges,
                  feeding on whatever shine the iron had left.

          - room_id: trophy_wall
            encounters:
              - creature_id: stack_lurker
                count: "1"
                probability: 0.25
                description: >-
                  A heap of weapons at the base of the wall. Did that
                  heap exist when you entered? It looks like fallen
                  weapons. It is very still.
              - creature_id: rust_ghost
                count: "1"
                probability: 0.15
                min_awareness: 6
                description: >-
                  Standing among the weapons, a figure in corroded
                  armor. Its back is to you. Its pack is full. Its
                  hands are at its sides. It has been standing here
                  for a very long time.

          - room_id: moth_gallery
            encounters:
              - creature_id: ledger_worm
                count: "3d6"
                probability: 0.5
                description: >-
                  The cloth is infested. Fat pale shapes nest in the
                  folds of rotting tapestry, eating the embroidered
                  lettering. The gold thread survives. The words do not.

      - id: middle_ring
        name: "The Collection"
        wandering_monster_chance: 0.15
        wandering_monster_awareness_bonus: 0.03
        wandering_monsters:
          - creature_id: rust_ghost
            weight: 3
            count: "1"
            description: >-
              Grinding footsteps from the corridor ahead. Heavy, slow,
              relentless. A rust ghost on patrol — following a route
              it has followed since it died. Its pack scrapes both
              walls of the goat path.
            loot:
              - description: "Rust ghost pack — sealed, requires smith (50 GP contents)"
                value: 50
                chance: 0.4
          - creature_id: the_appraiser
            weight: 2
            count: "1"
            description: >-
              A whisper from behind a stack. Not the Hoarder's whisper —
              a human voice, counting. Your torches. Your rations. Your
              coins. It is behind you and it has been following for
              longer than you realized.
            loot:
              - description: "Empty pack (3 GP)"
                value: 3
                chance: 0.5
          - creature_id: coin_golem
            weight: 1
            min_awareness: 10
            count: "1"
            description: >-
              A shape assembles in the chokepoint ahead. Coins rise
              from the floor, clicking into position, forming limbs,
              a torso, a head. It stands between you and the exit.
              It does not move. It waits for you to try to pass.
            loot:
              - description: "Coin pile (value equals remaining HP in GP)"
                value: 18
                chance: 1.0
          - creature_id: stack_lurker
            weight: 2
            count: "1d2"
            description: >-
              Two piles of treasure, side by side in the passage.
              One is real. One is not. Or perhaps both are not.
            loot:
              - description: "Scattered coins (3d6 GP, tarnish-mite infested)"
                value: 10
                chance: 1.0

        room_encounters:
          - room_id: tarnish_hall
            encounters:
              - creature_id: rust_ghost
                count: "1d2"
                probability: 0.3
                description: >-
                  Rust ghosts among the silver candlesticks. Standing
                  motionless, packs full, watching the entrance. They
                  have been here since the middle ring had wider paths.
              - creature_id: stack_lurker
                count: "1"
                probability: 0.2
                description: >-
                  A pile of tarnished silver near the wall. One of
                  many. This one is slightly warmer than the others.

          - room_id: goat_path
            encounters:
              - creature_id: the_appraiser
                count: "1"
                probability: 0.4
                description: >-
                  In the narrow passage, pressed against the treasure-wall,
                  a figure. It is not blocking the path. It is counting
                  the items on the shelves as you pass. Its lips move.
                  Its eyes follow your pack.

          - room_id: counting_hall
            encounters:
              - creature_id: the_appraiser
                count: "1d2"
                probability: 0.5
                description: >-
                  Appraisers at the abacuses, hands moving the beads
                  alongside the automated counting. They are helping.
                  They do not look up. They count.
              - creature_id: coin_golem
                count: "1"
                probability: 0.3
                min_awareness: 10
                description: >-
                  A golem stands at the entrance to the antechamber.
                  It assembled when the abacus clicked past a threshold.
                  It is made of gold coins. It is worth a fortune.
                  It will kill you if you try to take it.

          - room_id: counting_house
            encounters:
              - creature_id: the_ledger
                count: "1"
                probability: 1.0
                description: >-
                  The Ledger rises from the desk. Its pages spread
                  open like wings. The trade cipher flows across them
                  in fresh ink — your inventory, listed in the
                  Hoarder's hand. It knows what you carry. It wants
                  it back.

  mawdeep_gullet:

    levels:

      - id: level_1
        name: "The Gullet"
        wandering_monster_chance: 0.15
        wandering_monster_awareness_bonus: 0.03
        wandering_monsters:
          - creature_id: pale_rat
            weight: 4
            count: "2d6"
            description: >-
              A swarm of pale rats, squealing and scrabbling. They scatter from
              torchlight but regroup behind you. Something drove them this way.
            loot:
              - description: "Nothing. Rats carry nothing of value."
          - creature_id: bone_beetle
            weight: 3
            count: "3d4"
            description: >-
              A clicking carpet of bone beetles flowing along the corridor walls.
              They ignore you unless you set down your pack.
            loot:
              - description: "Calcite fragments, worthless."
          - creature_id: crawling_scavenger
            weight: 2
            count: "1d3"
            description: >-
              Shapes at the edge of your torchlight. Crawling. Watching. They
              were people once. They flinch when you look at them directly.
            loot:
              - description: "A corroded copper ring (1 CP)"
                value: 1
                chance: 0.2
          - creature_id: amber_hulk
            weight: 1
            min_awareness: 10
            count: "1"
            description: >-
              A grinding sound in the corridor ahead. Something heavy, moving
              slowly. The amber light of its resin shell reflects your torch.
              The Glutton has sent an enforcer.
            loot:
              - description: "Amber resin chunks (20 GP to an alchemist)"
                value: 20
                chance: 0.5

        room_encounters:
          - room_id: mouth
            encounters: []
            notes: "Safe zone. No encounters. The Glutton lets you enter freely."

          - room_id: throat
            encounters:
              - creature_id: bone_beetle
                probability: 0.2
                count: "2d4"
                trigger: "Disturbing the ribbed walls or scraping against them"
                loot:
                  - description: "Nothing."

          - room_id: antechamber
            encounters:
              - creature_id: pale_rat
                probability: 0.25
                count: "1d6"
                trigger: "Searching the abandoned equipment"
                loot:
                  - description: "A tarnished silver button (1 SP)"
                    value: 1
                    chance: 0.3

          - room_id: cistern
            encounters: []
            notes: "No creatures. The water is the hazard."

          - room_id: junction
            encounters:
              - creature_id: pale_rat
                probability: 0.6
                count: "3d6"
                trigger: "Always present — the colony lives here"
                loot:
                  - description: "Nothing."
              - creature_id: amber_hulk
                probability: 0.15
                min_awareness: 12
                count: "1"
                trigger: "Keeper awareness 12+. The hulk patrols through the Junction."
                loot:
                  - description: "Corroded delver's dagger fused in amber (5 GP)"
                    value: 5
                    chance: 0.4

          - room_id: gallery
            encounters:
              - creature_id: crawling_scavenger
                probability: 0.3
                count: "1d2"
                trigger: "Removing items from the alcoves"
                loot:
                  - description: "A bent copper bracelet (3 CP)"
                    value: 1
                    chance: 0.15

          - room_id: pantry
            encounters:
              - creature_id: bone_beetle
                probability: 0.5
                count: "4d6"
                trigger: "Opening containers or disturbing the shelves"
                loot:
                  - description: "Nothing. The beetles have eaten everything organic."

          - room_id: hall
            encounters:
              - creature_id: crawling_scavenger
                probability: 0.8
                count: "3"
                trigger: "Always present — they live here, feeding on the amber in the rubble"
                loot:
                  - description: "A finger bone with a gold ring still on it (8 GP)"
                    value: 8
                    chance: 0.1
              - creature_id: amber_hulk
                probability: 0.2
                min_awareness: 8
                count: "1"
                trigger: "Keeper awareness 8+. Emerges from behind the well."
                loot:
                  - description: "A half-dissolved shield boss (3 GP)"
                    value: 3
                    chance: 0.3

          - room_id: chute
            encounters: []
            notes: "No creatures. The chute itself is the encounter."

          - room_id: stairs_down
            encounters:
              - creature_id: pale_rat
                probability: 0.3
                count: "2d4"
                trigger: "Rats fleeing from Level 2 — something drove them upward"
                loot:
                  - description: "Nothing."

      - id: level_2
        name: "The Belly"
        wandering_monster_chance: 0.25
        wandering_monster_awareness_bonus: 0.05
        wandering_monsters:
          - creature_id: warren_crawler
            weight: 4
            count: "1d3"
            description: >-
              Shapes low to the ground, just beyond your light. Translucent
              skin, dark organs pulsing. They are not attacking. They are
              following. Waiting.
            loot:
              - description: "Coins from a previous victim's gut (1d6 GP)"
                value: 3
                chance: 0.3
          - creature_id: gullet_polyp
            weight: 3
            count: "1d4"
            description: >-
              The wall twitches. Fleshy stalks extend from what you thought
              was stone. The corridor is growing new mouths.
            loot:
              - description: "Nothing. They are part of the walls."
          - creature_id: amber_hulk
            weight: 2
            count: "1"
            description: >-
              Heavier footsteps than anything down here should have. The amber
              glow of the Glutton's enforcer rounds the corner ahead.
            loot:
              - description: "Amber resin chunks (20 GP)"
                value: 20
                chance: 0.5
          - creature_id: marrow_worm
            weight: 1
            count: "1d2"
            description: >-
              A wet, segmented shape drops from the ceiling, glowing faintly
              orange. Its mandibles click once. You do not feel the bite.
            loot:
              - description: "Enzyme glands (15 GP to Gristwell alchemist)"
                value: 15
                chance: 0.4

        room_encounters:
          - room_id: landing
            encounters:
              - creature_id: warren_crawler
                probability: 0.2
                count: "1"
                trigger: "A lone crawler scouts the landing, retreats if confronted"
                loot:
                  - description: "Nothing — scouts carry nothing."

          - room_id: gullet_passage
            encounters:
              - creature_id: gullet_polyp
                probability: 0.7
                count: "2d4"
                trigger: "Always present — they grow from the walls"
                loot:
                  - description: "Nothing."
              - creature_id: amber_hulk
                probability: 0.1
                min_awareness: 15
                count: "1"
                trigger: "Keeper awareness 15+. Blocking the passage."
                loot:
                  - description: "Amber-encased short sword (15 GP, functional if freed)"
                    value: 15
                    chance: 0.3

          - room_id: acid_pool
            encounters: []
            notes: "No creatures. The acid and the well shaft are hazard enough."

          - room_id: warren
            encounters:
              - creature_id: warren_crawler
                probability: 0.9
                count: "2d4"
                trigger: "Always present — the warren is their nest"
                loot:
                  - description: "Gut contents — 1d4 GP in corroded coins"
                    value: 2
                    chance: 0.25
              - creature_id: pale_rat
                probability: 0.4
                count: "3d6"
                trigger: "Rats from Level 1 that fell down the Chute"
                loot:
                  - description: "Nothing."

          - room_id: vault
            encounters:
              - creature_id: amber_hulk
                probability: 0.3
                min_awareness: 10
                count: "1"
                trigger: "Keeper awareness 10+. Guards the treasure teeth."
                loot:
                  - description: "A gem fragment embedded in the hulk's amber (25 GP)"
                    value: 25
                    chance: 0.4

          - room_id: stomach
            encounters:
              - creature_id: warren_crawler
                probability: 0.4
                count: "1d4"
                trigger: "Crawlers circle the digestion mound, feeding on scraps"
                loot:
                  - description: "A half-digested gold chain (12 GP)"
                    value: 12
                    chance: 0.2
              - creature_id: amber_hulk
                probability: 0.25
                min_awareness: 8
                count: "1d2"
                trigger: "The Stomach spawns amber hulks from the digestion mound"
                loot:
                  - description: "Amber resin chunks (20 GP)"
                    value: 20
                    chance: 0.5

          - room_id: marrow_hall
            encounters:
              - creature_id: marrow_worm
                probability: 0.8
                count: "2d4"
                trigger: "Always present — they live in the bone walls"
                loot:
                  - description: "Enzyme glands (15 GP each)"
                    value: 15
                    chance: 0.4
                  - description: "Bioluminescent segments (dim light source, 5 GP)"
                    value: 5
                    chance: 0.6

          - room_id: maw_chamber
            encounters:
              - creature_id: the_maw
                probability: 1.0
                count: "1"
                trigger: "Always present until destroyed. Respawns between delves."
                loot:
                  - description: "Gemstone eyes (150 GP total)"
                    value: 150
                  - description: "Gold-inlaid breastplate fragment (80 GP)"
                    value: 80
                  - description: "Silver-capped bone club (35 GP, usable weapon)"
                    value: 35
                  - description: "Assorted fused metal and coin (40 GP)"
                    value: 40

          - room_id: full_belly
            encounters: []
            notes: >-
              No creatures. The room itself is the encounter — the Glutton
              is the walls, the floor, the ceiling. Every round spent here
              raises Keeper awareness. The treasure is the bait. Time is the trap.
