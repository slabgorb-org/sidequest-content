# Hamlet of Sünden — Audio Configuration
# Inherits the genre-level audio palette (silence-default, dripping stone,
# Keeper Pulse on tension). Adds Sünden-specific hamlet ambience and the
# three stress-service cues. Per-dungeon overrides may live at
# dungeons/<name>/audio.yaml if needed; none currently override.

world: caverns_sunden
genre: caverns_and_claudes

inherits_from: genre_packs/caverns_and_claudes/audio.yaml
override_policy: extend
# `extend` = world-level mood_tracks/sfx are appended to the genre-level
# library; the player picks from the union. Set to `replace` if a future
# world wants to wipe the genre defaults.

mixer:
  music_volume: 0.7
  sfx_volume: 0.85
  crossfade_default_ms: 1200

# Sünden-specific mood tracks. The genre-level audio.yaml handles
# exploration / tension / combat / extraction in the dungeons; these
# add hub-world contexts. None of these track files exist yet — the
# audio plan ships them in a separate task.
mood_tracks:
  hamlet:
    - path: audio/music/hamlet_dawn.ogg
      title: "Sünden Square at First Light"
      bpm: 50
      notes: "lamp-soot weather, low brass, no melody yet"
    - path: audio/music/hamlet_dusk.ogg
      title: "Returning Through the Square"
      bpm: 55
      notes: "slightly warmer than dawn — the Hamlet seen with delve-eyes"
  the_wall:
    - path: audio/music/the_wall.ogg
      title: "The Carving Bench"
      bpm: 40
      notes: >-
        very slow; chisel-on-stone foley should be allowed to bleed
        through the music bed
  stress_relief:
    - path: audio/music/confessional.ogg
      title: "Through the Screen"
      bpm: 45
      notes: "Confessional rite — single low instrument, sparse"
    - path: audio/music/workhouse.ogg
      title: "Plain Labor, Plain Bread"
      bpm: 60
      notes: "Workhouse rite — light percussive labor sounds, hammer pulse"
    - path: audio/music/masquerade.ogg
      title: "False Face, Festival Hall"
      bpm: 90
      notes: >-
        Masquerade rite — small ensemble, festival reels played a touch
        out of tune; should feel like a celebration that knows itself

# Sünden-specific SFX. Again, none of these files exist yet; the audio
# plan ships them. Inherits from genre-level for everything dungeon-side.
sfx_library:
  - id: chisel_on_stone
    path: audio/sfx/chisel_on_stone.ogg
    notes: "the Wall being carved; can also play during the_wall mood"
  - id: confessional_screen
    path: audio/sfx/confessional_screen.ogg
    notes: "wood screen sliding open; cue for the rite to begin"
  - id: workhouse_bell
    path: audio/sfx/workhouse_bell.ogg
    notes: "rings on the half-hour, never the hour (per drift profile)"
  - id: mask_fitting
    path: audio/sfx/mask_fitting.ogg
    notes: "leather and feather; cue at Masquerade rite start"
  - id: recruiter_papers
    path: audio/sfx/recruiter_papers.ogg
    notes: "papers leafed on a counter; cue at Recruiter's Post"
