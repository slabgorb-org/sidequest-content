id: confessional
name: "The Confessional"
region: sunden_hamlet
room_type: settlement
description: >-
  A narrow stone chapel on the north-west corner of the Square: two rows of low
  benches, a single carved screen between penitent and keeper. The rite is Generosity —
  the penitent confesses what was taken and from where; Anselm Vail accepts a portion
  for the poor box, and the count is broken. The surrendered coin is not displayed,
  the count not spoken aloud after it is broken. The Greed-stress lifts the way a
  held breath releases. Best for stress from Horden; tolerated for spillover from
  elsewhere, but not preferred. The screen is not breached. The box has one key.
exits:
  - {to: sunden_square, label: "to Sünden Square"}
  - {to: the_wall, label: "east to the Wall"}
  - {to: copperbridge_step, label: "east road to the Horden Warren"}
