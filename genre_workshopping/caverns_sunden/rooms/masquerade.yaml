id: masquerade
name: "The Masquerade"
region: sunden_hamlet
room_type: settlement
description: >-
  A vaulted single-room hall on the south side of the Square, walls hung with
  carved wooden masks of every face but the wearer's. The rite is Humility: the
  penitent is fitted with a mask at dusk, carries it through three public services
  across the festival week, and speaks the whole time as the masked face — not as
  themselves, not as their delver, not as anyone they have ever been. The risk is
  small and named: a mask can stick. On rare nights the masked face overwrites a
  flavor trait permanently. Mistress Coro tells every penitent the risk before the
  first service. Best for stress from Grimvault.
exits:
  - {to: sunden_square, label: "north to Sünden Square"}
  - {to: recruiter_post, label: "east to the Recruiter's Post"}
  - {to: ashgate_door, label: "north road to the Grimvault Descent"}
