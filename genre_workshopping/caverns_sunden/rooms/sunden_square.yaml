id: sunden_square
name: "Sünden Square"
region: sunden_hamlet
room_type: settlement
description: >-
  The hamlet's heart, flagged in three radial wedges — pale north-ridge limestone,
  copper-stained east-flagstone, dark southern hill-stone — meeting at a central
  drainage where a low fountain runs water that tastes of nothing. The Wall stands
  along the north face. Three dungeon mouths watch from their respective ridges,
  never quite out of sight. Newcomers arrive by the road their coach was hired for
  and the first thing every newcomer does, without being told to, is read the Wall.
exits:
  - {to: the_wall, label: "to the Wall of Names"}
  - {to: recruiter_post, label: "south to the Recruiter's Post"}
  - {to: confessional, label: "north-west to the Confessional"}
  - {to: workhouse, label: "east to the Workhouse"}
  - {to: masquerade, label: "south to the Masquerade"}
  - {to: mouth, label: "south road to the Mawdeep Gullet"}
  - {to: ashgate_door, label: "north road to the Grimvault Descent"}
  - {to: copperbridge_step, label: "east road to the Horden Warren"}
