id: the_wall
name: "The Wall"
region: sunden_hamlet
room_type: settlement
description: >-
  A freestanding monument three courses high and twenty paces along the northern
  face of Sünden Square, faced in smooth slate divided into seven columns. Three
  fill — Pride, Greed, Gluttony — cut by chisel, never stamped, never sawn; the
  other four are kept blank by standing custom. The Wallwrights work at dusk and
  never in rain. They verify before they cut. They cut once per soul. The morning
  light reads the eastern face sharpest at first hour, and whoever has been here
  a day already knows where to stand when they read it.
exits:
  - {to: sunden_square, label: "back to Sünden Square"}
  - {to: confessional, label: "west to the Confessional"}
