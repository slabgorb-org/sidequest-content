# Sünden — World-Level NPC Portraits
# Resident cast of the Hamlet of Sünden itself: the three institutions
# that live in Sünden Square (Wallwrights, Vetters' Office, Confraternity
# of Three Rites) plus Wren Peatford, who relocated to Sünden two
# seasons ago to run the Workhouse south-door Recovery Bench.
#
# Per-dungeon NPCs (Ashgate / Copperbridge / Gristwell residents) live
# in dungeons/<name>/portrait_manifest.yaml. Do not duplicate them here.
#
# B&W pen and ink, Erol Otus / David Trampier style. Z-Image Turbo
# render target — descriptions are renderable scene blocks, not lore.

characters:

  - name: Sevra Tarn
    role: Elder Wallwright, head of the carving guild
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a spare adult woman
      in her sixties, weather-cut face, grey hair pulled back under
      a plain linen kerchief, deep-set eyes that have measured more
      slate than they will measure in the years she has left.
      Wearing a stoneworker's leather apron over plain wool, sleeves
      rolled to the elbow, forearms dusted pale with stonedust to
      the wrist. Her hands are the giveaway — squared, calloused,
      faint grey worked permanently into the knuckle creases. She
      stands at the Wall, the slate face behind her carved with
      names in three columns, lamp-light warming the cuts from the
      left. A chisel rests in her right hand at the angle of
      finishing, not striking. Plain limestone background,
      lamp-soot shadows in the eaves above. No text, no caption,
      no watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Wallwrights are a carving guild three generations deep,
      descended from the original Ashgate coroner who founded
      Sünden. Their stoneyard inheritance is closer to a
      stonemasons' livery company than to a craft shop — formal
      verification, rituals around dusk, refusal-as-discipline. Sevra
      reads as the oldest unbroken thread of that lineage.

  - name: Wallwright Cael
    role: Junior carver, third-generation Wallwright
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult man in his
      late twenties, lean build, dark hair tied back at the nape, a
      patient expression held just short of a smile. Wearing
      the same leather apron over plainer wool than Sevra's, the
      apron less worn at the chest where he has not yet leaned
      against the slate as long. Stonedust on his hands and on the
      cuff of his right sleeve. He is finishing a shallow cut — the
      underline beneath a returned-delver's name — and the chisel
      is held delicately. Lamp-light from a brazier on the
      stoneyard wall behind him, slate practice-blocks leaned in
      stacks. No text, no caption, no watermark, fully clothed,
      modest, correct human anatomy.
    culture_aesthetic: >-
      Sevra's nephew, the youngest carver currently certified to
      cut a name unsupervised. He is the public face of the guild
      for everything except a death-cut, and he handles grieving
      families more patiently than Sevra does. Same stonemasons'-
      livery inheritance, with an apprentice's lighter hand.

  - name: Mira Thorn
    role: Senior vetter, kinder desk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a heavy-set adult
      woman in her fifties seated behind a plank desk, a leather-
      bound drift profile open before her, ink-stained right hand
      resting on the page. Iron-grey hair pinned plain, a steady
      patient face that has refused more clearances than it has
      signed. Plain wool overdress under a linen apron, sleeves
      pushed up to the forearm, a Workhouse pin still on her collar
      from her old branch. Behind her: ranks of pigeonhole files,
      folded letters, a brass lamp throwing warm cream-white light
      onto the desk and warm dark shadow onto the wall. A clay cup
      of cold tea at her elbow. No text, no caption, no watermark,
      fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Vetters' Office is the local equivalent of an early
      coffeehouse-and-correspondence bureau — Lloyd's-of-London at
      hireling-evaluation scale. Mira came up through the
      Confraternity's Workhouse before crossing to the office, and
      she still keeps the discipline of plain food and plain work
      in her habits.

  - name: Korven Daish
    role: Senior vetter, colder desk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a wiry adult man in
      his forties seated at a plank desk opposite Mira's, sleeves
      rolled, a former delver's economy in the shoulders. Dark
      hair cropped short, clean-shaven, an unsmiling face that
      reads pragmatic rather than cruel. Old ink stains and a
      faded delver's brand on the inside of his right wrist where
      the cuff folds back. Wearing a plain linen shirt and leather
      jerkin, no insignia. A clearance card pinched between two
      fingers, half-signed. Lamp-light from above and behind, his
      face split between cream-white highlight and warm dark shadow.
      Stacked drift profiles on the corner of the desk, a separate
      pigeonhole rack from Mira's behind him. No text, no caption,
      no watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      Same coffeehouse-correspondence-bureau institution as Mira,
      opposite temperament. Korven is a returned delver himself,
      cleared by the office he now staffs, and he runs the colder
      desk on the theory that field-experience beats mercy. The
      vetting office's two-desk culture is structural, not
      personal — but the air between his desk and Mira's reads
      cool in any frame they share.

  - name: Toller Renn
    role: Junior vetter, file clerk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult man in his
      late twenties standing at a tall clerk's lectern, quill in
      his right hand, a half-written formal clearance on the
      slanted desk in front of him. Sandy hair, careful unfussy
      face, plain wool waistcoat over a linen shirt with the cuffs
      ink-blackened past the second knuckle. A stack of inter-
      hamlet correspondence at his elbow, each letter folded
      identically. The lectern is positioned between Mira's and
      Korven's desks in the background — a small figure visible at
      each, neither in focus. Warm lamp-light from a single sconce
      on the wall behind him. No text, no caption, no watermark,
      fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The clerk who actually keeps the office running. Trained in
      the same coffeehouse-correspondence-bureau tradition as the
      seniors, not yet attached to a temperament. He maintains the
      drift profiles, files the inter-hamlet correspondence, and
      writes the formal clearances after the seniors have decided.

  - name: Anselm Vail
    role: Keeper of the Confessional, Generosity branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a spare adult man
      in his fifties seated on a low bench inside the narrow
      Confessional chapel, the carved screen visible to one side,
      a poor box on the floor between his feet. Thinning hair
      combed back, hollow cheeks, a bookish careful face. Wearing
      plain dark wool vestments cut without ornament, a linen
      collar, no chain, no ring. His right hand rests on a small
      ledger of broken-count tallies; his left is open, palm up,
      empty — the gesture of the rite when the count is broken and
      the surrender is accepted. A single tallow candle on the
      bench-end throws a single cream-white highlight onto his
      face from below. No text, no caption, no watermark, fully
      clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Confraternity's Generosity branch is closest in tradition
      to the Florentine lay confraternities — penitential rite,
      poor-box discipline, screen between penitent and keeper.
      Anselm's manner is the bookish-rigorous variant. He runs the
      rite by the rule and considers Greed the most dangerous of
      the three sins because it endangers other people, not just
      its host.

  - name: Brother Hesh
    role: Master of the Workhouse, Temperance branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a heavy-shouldered
      adult man in his forties standing at the cold hearth at the
      far end of the long Workhouse hall. Dark beard kept short,
      face weathered from a delver's career and then a laborer's,
      a plain unvarnished expression. Wearing a coarse wool habit
      pushed up at the sleeves, a leather apron over it, and the
      same plank-bed-and-plain-food discipline visible in the cut
      of his clothing as in the room behind him. Forearms heavy
      and scar-laced from old delves into Mawdeep. He is mid-rite,
      ladling plain stew into a wooden bowl for a penitent kneeling
      out of frame. Long timber benches and looms recede into the
      hall behind him. Warm dark shadow on the high beams; cream-
      white highlight on the ladle and bowl rim. No text, no
      caption, no watermark, fully clothed, modest, correct human
      anatomy.
    culture_aesthetic: >-
      Workhouse-style Temperance as labor rather than worship —
      lay-monastic in inheritance, plain food and plain work, a
      cold hearth on principle. Hesh is a former Mawdeep delver
      who walked north and stayed. He is the loudest keeper in
      joint session, by some distance.

  - name: Mistress Coro
    role: Host of the Masquerade, Humility branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult woman of
      indeterminate age standing in the vaulted single-room
      Masquerade hall, walls hung behind her with painted wooden
      masks of every face but her own. She wears one of her own
      masks pushed up onto the crown of her head — a carved
      shallow-relief mask in pale wood — so the viewer sees the
      face beneath, which reads as composed, watchful, no longer
      young, no specific age. Long dark robes cut for movement,
      plain at the cuff and hem. One hand resting on the rim of
      another mask hung on the wall beside her. Lamp-light from a
      stand on the floor casts long warm shadows up the wall of
      masks. No text, no caption, no watermark, fully clothed,
      modest, correct human anatomy.
    culture_aesthetic: >-
      The Masquerade's Humility rite is theatre crossed with
      confession — penitents wear carved masks through three
      public services and speak as the masked face. The branch
      reads as part-commedia, part-lay-confraternity, part-public-
      ritual-stage. Mistress Coro is the senior Confraternity voice
      in the current phase and the only keeper currently speaking
      to the other two.

  - name: Sister Pell
    role: Confraternity steward, all three branches
    type: npc_minor
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult woman in
      her late twenties seated at a plain table in the Confraternity
      Hall behind the Masquerade, three account-ledgers open in
      front of her in a row — Confessional, Workhouse, Masquerade —
      one quill, one inkpot, one careful posture. Dark hair pinned
      simply, a quiet steady face. Wearing a plain linen overdress
      with a Confraternity steward's pin, no branch insignia. On
      the wall behind her, three poor-box keys hang on a single
      iron ring. A carved wooden mask rests on the table corner —
      the only one in the Masquerade hall whose face is her own.
      Warm lamp-light from a single brass lamp; warm dark in the
      corners of the symmetrical room. No text, no caption, no
      watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Confraternity's joint steward — keeper of the joint
      accounts, scheduler of the quarterly sessions, drafter of
      the joint statements when the three keepers can be made to
      agree. Trained originally as Mistress Coro's apprentice in
      the Masquerade tradition; now formally above all three
      branches and quietly disliked by all three keepers in turn.

  - name: Wren Peatford
    role: Recovery Bench tech, south door of the Workhouse
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a small adult woman
      in her thirties seated on a long pine bench against the
      south wall of the Workhouse, holding up a tuning fork to a
      delver out of frame. Dark hair half-escaping a plain braid,
      a kind careful face, a small steady smile. Wearing layers of
      warm medieval wool — she is always cold — over a linen shift,
      a pouch of dried herbs at her belt, a fan of plain colored
      cards in her left hand. The bench is worn smooth by waiting.
      Lamp-light from a sconce above her warms the wall; the pine
      of the bench reads pale, the wool of her layers reads dark.
      A practiced small-room intimacy in the framing — patient
      work, no audience. No text, no caption, no watermark, fully
      clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      Pre-existing Sünden resident, relocated from Ashgate two
      seasons ago to run the Workhouse south-door Recovery Bench.
      Her tradition is the gentlest in the hamlet — neither
      penitential like the Confessional nor disciplinary like the
      Workhouse proper, but the long care of delvers whose drift
      has gone past what the rites can lift. She does not promise
      to undo the change. She teaches them how to live inside it.

  - name: Helga Untersee
    role: Innkeeper at the Lampwick
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a stout adult woman
      in her late forties standing behind the long oak counter of
      the Lampwick tavern, polishing a pewter cup with a linen rag.
      Hair pinned up under a plain south-German village cap, broad
      shoulders, capable hands with knife-scars at the knuckles.
      Apron over a heavy wool dress; a wide leather belt with a
      ring of cellar keys. The counter is worn smooth at the elbow
      where a generation of hirelings have leaned. A trimmed-short
      lamp wick burns in a brass cresset above her — the tavern's
      namesake. Pour-and-listen disposition: she watches the door
      while she works the rag. No text, no caption, no watermark,
      fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      South-German village wirtin tradition — second-generation
      tavernkeeper, broker of rumor by trust rather than gossip.
      The Lampwick is neutral ground in Sünden: the Confraternity
      cannot preach inside it, the Vetters cannot vet inside it,
      and Helga keeps both rules by reflex. She lends the back
      room to both institutions in turn and tells neither what the
      other does. Her father ran the place before her; her son
      runs the kitchen. She has never been past Sünden's south
      road in her life.

  - name: Joost Marlebrand
    role: Itinerant preacher
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a lean weathered man
      in his fifties standing on the cobbles of Sünden Square in
      front of the Wall, salt-coast wanderer's wide-brimmed hat in
      one hand and a worn leather-bound book in the other. Long
      coat patched and re-patched with mismatched cloth, boots
      pale with road dust, a salt-bleached scarf knotted at the
      throat. Sun-damaged face, eyes slightly mismatched in cast,
      a brand mark just visible on the inside of his left wrist.
      Mouth open mid-sentence — he is preaching, but quietly,
      below the volume that would draw a constable. Behind him,
      blurred, the four blank columns of the Wall. No text, no
      caption, no watermark, fully clothed, modest, correct human
      anatomy.
    culture_aesthetic: >-
      Late-medieval Rhineland eschatological wanderer translated
      to a salt-coast register — not from Sünden, not from any of
      the three approaches; came up from the lowland salt valleys
      a year and a half ago and has not left. Treats the four
      absent sins (Wrath, Sloth, Lust, Envy) as a held breath, not
      a finished story. Theological irritant to the Confraternity
      (Anselm Vail in particular). Tolerated by the Vetters because
      he is good at noticing when a returning hireling has gone
      past the rites. Sleeps on the chapel step when the Recruiter
      turns him away.

  # ===========================================================
  # Ashgate / grimvault_descent — Pride portraits
  # (folded from dungeons/grimvault/portrait_manifest.yaml 2026-05-10)
  # ===========================================================

  - name: Falk Stonehelm
    role: Chief Assayer studying maps in the Assayer Hall
    type: npc_major
    appearance: >-
      A tall, gaunt man in his forties standing before a wall
      covered in dungeon maps in a stone-walled guild hall. His
      left hand holds a pen with mechanical precision, annotating
      a chart. His right hand hangs at his side, fingers slightly
      curled — they cannot grip. He wears plain medieval clothing,
      every button aligned, every crease deliberate. A lead-lined
      notebook in his breast pocket. Hollow cheeks, eyes that
      stare too long. A slate board behind him covered in precise
      handwritten measurements.
    culture_aesthetic: >-
      Medieval guild hall interior. Maps pinned to stone walls,
      shelves of leather-bound ledgers, chalk and instruments on
      workbenches. Everything measured and ordered.

  - name: Agna Ironjaw
    role: Ledger master assessing goods at her scale
    type: npc_major
    appearance: >-
      A broad woman with a square jaw standing behind a counter
      in a medieval merchant's shop, hands moving an abacus. Dark
      hair streaked grey, pulled back severely. A heavy leather
      apron over merchant's wool, pockets full of brass weights.
      A multi-lensed brass monocle hangs from a chain at her neck.
      Her vault-standard scale sits on the counter — brass pans
      balanced with strange weights. Shelves behind her hold bolts
      of pale cloth and stoppered glass bottles.
    culture_aesthetic: >-
      Medieval merchant's assessment office. Stone-walled, lantern-
      lit, scales and instruments on every surface. Strange goods
      on shelves — cloth with no color, metal with no weight.

  - name: Durn Oakwell
    role: Equipment supplier in his torch shop
    type: npc_minor
    appearance: >-
      A quiet, middle-aged man in a medieval leather apron standing
      amid racks of torches in a well-organized stone shop. Torches
      sorted by type — standard on the left, lead-lined on the
      right. Coils of rope on pegs, rations in waxed packages on
      shelves. His hands are stained with lead-compound residue.
      An honest, forgettable face. A price board on the wall
      marked with columns of tally notches and simple symbols, no
      readable letters. Everything in its place.
    culture_aesthetic: >-
      Medieval tradesman's shop. Stone walls, timber shelving,
      lantern light. Immaculately organized. The most ordered
      room in town.

  # ===========================================================
  # Copperbridge / horden_warren — Greed portraits
  # (folded from dungeons/horden/portrait_manifest.yaml 2026-05-10)
  # ===========================================================

  - name: Kern Saltwall
    role: Spiller boss weighing packs at his post
    type: npc_major
    appearance: >-
      A lean man in his fifties standing behind a counter made of
      stacked copper ingots, hands on a brass scale. Green stains
      run from his fingertips to his elbows — thirty years of
      handling corroded copper. Weathered face, sharp eyes, a
      leather apron with pockets full of weights. A leather-bound
      ledger open beside him to a page of neat columns and tally marks. Behind him, shelves of
      sorting sacks and hooked poles. The counter is cluttered
      with samples — coins, scrap metal, a tarnished buckle being
      assessed.
    culture_aesthetic: >-
      Medieval provisioner's shop built from salvage. Stone walls,
      copper-stained countertops, shelves of practical equipment.
      Everything functional, nothing decorative. The wealth is in
      the goods, not the fittings.

  - name: Petra Brewer
    role: Tavern keeper serving ale in dented silver
    type: npc_major
    appearance: >-
      A sturdy woman in her forties behind a copper bar top, pouring
      ale from a clay jug into a dented silver goblet. Brown hair
      tied back, sleeves rolled, a knowing smile. The bar is covered
      in ring-marks from goblets. Behind her, shelves of mismatched
      silver cups — no two alike, all from the Spillfield. A
      chalkboard on the wall covered in dense tally marks and
      geometric shorthand, no readable letters.
      Kreveld's Chair is visible in the background — heavy, bolted
      down, empty.
    culture_aesthetic: >-
      Medieval tavern furnished with dungeon spillage. Copper bar,
      silver drinking vessels, treasure-chest stools. Prosperous
      but uneasy — the wealth came from somewhere that wants it
      back.

  - name: Sigri Forger
    role: Appraiser examining treasure with her loupe
    type: npc_major
    appearance: >-
      A sharp-featured woman in her thirties holding a multi-lensed
      brass loupe to her eye, examining a coin pinched between her
      fingers. Dark hair, precise hands, a leather vest with pockets
      of testing equipment — acid vials, reference weights, a small
      hammer for striking metal. Her expression is neutral,
      professional, unimpressed. A table before her holds a
      morning's work — sorted piles of metal, a ledger open to a
      page of neat columns and tally marks, a cup of cold tea she
      has not touched.
    culture_aesthetic: >-
      Medieval assayer's office. Stone walls, good light from a
      high window, every surface covered with instruments and
      samples. The tidiest room in Copperbridge.

  - name: Noll Thatcher
    role: Counter elder counting flagstones in a corner
    type: npc_major
    appearance: >-
      A thin man in his forties sitting alone at a corner table,
      hunched over a ledger, lips moving constantly. Hollow cheeks,
      restless fingers that tap the table in rhythm with his counting.
      His clothes are plain but his ledger is elaborate — leather-
      bound, tabbed with ribbon markers, pages dense with rows of
      tally marks and geometric symbols.
      A pouch of wooden counting tokens sits beside his elbow. His
      eyes are focused on the floor. He is counting the flagstones.
      A tally stick lies across his lap, notched beyond readability.
    culture_aesthetic: >-
      Medieval obsessive at a tavern corner table. Isolated from
      the room's activity. Everything about him is precise except
      his expression, which is anxious. The ledger is his world.

  # ===========================================================
  # Gristwell / mawdeep_gullet — Gluttony portraits
  # (folded from dungeons/mawdeep/portrait_manifest.yaml 2026-05-10)
  # ===========================================================

  - name: Brecca Half-Hand
    role: Delvers Guild elder at the dungeon mouth
    type: npc_major
    appearance: >-
      A weathered woman in her fifties standing at the mouth of a
      dungeon, chalk in her remaining fingers, marking tallies on
      the cave wall. Three fingers missing from her right hand.
      Short grey hair cropped close. Deep-set eyes scanning the
      dark below. Wears boiled leather over roughspun wool, a heavy
      coin purse at her belt. Medieval frontier clothing, patched
      and practical. Torchlight from below catches the scars on
      her jaw.
    culture_aesthetic: >-
      Medieval frontier mining town. No decoration, no vanity.
      Rough-hewn stone walls behind her, chalk tallies scratched
      into the rock. Dungeon entrance yawning dark behind.

  - name: Torchboy Fen
    role: Torchbearer trainer outside the dungeon
    type: npc_major
    appearance: >-
      A wiry nineteen-year-old crouching near a pile of torches,
      wrapping pitch-soaked rags around wooden shafts. Burns on
      both forearms, some fresh, some scarred. Soot-stained face
      with old eyes. Wears a medieval leather vest with too many
      pockets stuffed with flint and tinder. Hair singed short on
      one side. Sitting on a stone bench near a cave entrance.
    culture_aesthetic: >-
      Medieval working poor of a dungeon-country village. Castoff
      clothing, hand-repaired leather. Stone and mud surroundings.

  - name: Marga Provisioner
    role: Supplies dealer behind her shop counter
    type: npc_major
    appearance: >-
      A stocky woman standing behind a rough wooden counter in a
      narrow medieval shop. Torches stacked like cordwood on
      shelves behind her. Coils of hemp rope on pegs. Waxed-paper
      ration bundles in rows. She wears a plain homespun dress
      under a clean linen apron, hair pulled back under a kerchief.
      A tally wall behind her — hundreds of marks, most not crossed
      out. Her hands rest on the counter, assessing.
    culture_aesthetic: >-
      Medieval frontier provisioner. Timber-framed shop interior,
      barred windows, lantern light. Everything functional.

  - name: Rendel the Lender
    role: Moneylender in his counting house
    type: npc_major
    appearance: >-
      A thin man sitting behind a heavy oak desk in a dim medieval
      counting house. Long fingers resting on an open ledger bound
      in pale leather, the visible page filled with neat columns
      and tally marks. He wears a wool coat with pewter buttons —
      the finest clothing in town, which is not fine. Round
      spectacles perched on his nose, looking over the rims. A
      strongbox behind him, iron-banded. Candles in brass holders.
      His smile does not reach his eyes.
    culture_aesthetic: >-
      Medieval moneylender. Dark wood paneling, ledger books, wax
      seals. The only clean room in a muddy frontier town.

  - name: Old Kettle
    role: Innkeeper behind the bar of The Sinkhole tavern
    type: npc_minor
    appearance: >-
      A barrel-shaped bald man with a beard to his belt, standing
      behind a bar made from a single slab of dark stone. Forearms
      like legs of mutton from decades lifting barrels. One clouded
      eye. Wiping the bar with a rag that has never been clean.
      Medieval tavern interior — low ceiling, smoke-darkened beams,
      tallow candles on rough tables. Ale barrels stacked behind.
    culture_aesthetic: >-
      Medieval frontier tavern. Stone walls, timber beams, sawdust
      floor. Dim and smoke-stained.

  - name: Kel Bonecounter
    role: Black-market fence in his cellar
    type: npc_minor
    appearance: >-
      A sweating, nervous man hunched over a table in a cellar
      lit by a single tallow candle. Balding, with slicked-down
      remnants of hair. His scales are made from a creature's
      jawbone — the teeth serve as counterweights. A ledger open
      before him to a page of dense rows of strange geometric
