# Caverns & Claudes — Hamlet of Sünden session openings.
# Spec: docs/superpowers/specs/2026-05-01-canned-openings-design.md §1.1
#
# Hard contracts (loader validators):
#   - first_turn_invitation must NOT contain "?"
#   - establishing_narration / first_turn_invitation must NOT contain
#     "[authored", "[TBD", "[migrated", "[placeholder"
#   - location-anchored entries set setting.location_label (not
#     chassis_instance); exactly one anchor per setting
#   - solo + MP coverage required at world level
#
# All openings anchor at the Hamlet of Sünden so the player begins in
# town and walks down to the dungeon they choose — not narrator-imposed.
# Voice contract: limestone, lamp-soot, Wall, the careful courtesy of
# a town that knows a fraction of its sons and daughters by name and
# the rest by chiselled inscription.

version: "0.1.0"
world: caverns_sunden
genre: caverns_and_claudes

openings:
  # ---------------------------------------------------------------
  # SOLO — first lamp-light in the square
  # ---------------------------------------------------------------

  - id: solo_sunden_first_lamp
    name: "Sünden Square, First Lamp-Light"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "Sünden Square at first lamp-light, the Wall of Names along the north face, the Recruiter's Post visible at the south edge"
      situation: >-
        Dusk in Sünden. The four cardinal lamps have just been lit; the
        Workhouse rota's lighter is still walking back to the Workhouse
        with their pole over one shoulder. The Wall is shadowed but
        legible. The Recruiter's Post door is open, which means today
        was a recruitment day; whoever was taken on is somewhere in
        town tonight.
    tone:
      register: "weathered limestone, lamp-soot, the careful courtesy of a place that has buried a lot of its own — neither doom-laden nor falsely hopeful"
      stakes: "low on turn 1"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - any combat in the first scene
        - any dice roll
        - the narrator walking the player toward a specific dungeon
        - generic ye olde tavern framing
        - generic you-wake-up-in framing
        - an old man approaches you with a quest
        - ending the turn with a question
    establishing_narration: |
      First lamp-light in Sünden. The four cardinal lamps were lit a
      few minutes ago; the Workhouse rota's lighter is still walking
      back across the square with their pole over their shoulder, the
      flame at the tip swaying once with each step. The fountain at
      the center runs clear water that tastes of nothing — you tried
      it on your way in this afternoon and you are not going to try
      it again. Above the fountain, the Wall of Names runs along the
      north face of the square, half-shadowed by the lamp angle. You
      have been here long enough to read some of the older inscriptions
      and to recognise that the chisel work changes from generation
      to generation.

      The Recruiter's Post stands at the south edge of the square, a
      narrow door in a narrow building, the door open. Today was a
      recruitment day; you saw two people go in and one come out. The
      one who came out went to the Spillway tavern, which is where
      you would have gone if the Recruiter had asked you the three
      questions and you had given the right answers, which today the
      Recruiter did not ask.

      Three dungeon mouths watch the town from their respective
      ridges. Grimvault's threshold is visible to the northwest as
      a rectangle of darker shadow above the limestone scarp.
      Horden's trapdoor is invisible from here — it is inside the
      Counting House at Copperbridge, an hour's walk south. Mawdeep
      is closer; Gristwell Quay sits half a mile downriver and the
      shaft itself is only another ten minutes past that, but the
      sound of running water from the Mawriver carries up to the
      square at this hour and you have been hearing it since you
      arrived. Tonight you are not committed. Tonight, you can walk
      anywhere you like.
    first_turn_invitation: |
      The lamp-light is on. The fountain is at your back. The Wall is
      to your right, the Recruiter's Post to your left, the three
      dungeon mouths each at their own compass point. Take whichever
      direction you like.
    party_framing:
      already_a_crew: false
      bond_tier_default: neutral
      shared_history_seeds:
        - "you have been in Sünden for one full day"
        - "the Recruiter did not call you in today"
      narrator_guidance: >-
        Treat the player as a single delver who arrived in Sünden
        recently and has not yet committed to a dungeon. Do not
        introduce a quest-giver. Do not have an NPC walk up. Wait
        for the player to choose a direction.
    per_pc_beats:
      # Cleric — rite-house / imported-faith pick. Surfaced as a
      # passing observation by the lamp-lighter or another townsperson
      # who recognises the holy_symbol_form on sight. Player declares
      # the rite in their reply; narrator canonises it via Yes-And.
      # The five canonical houses are: confessional, workhouse,
      # masquerade (local rite-houses) and herdsman, green_watcher,
      # dust_listener (imported faiths). See worlds/caverns_sunden/
      # spellbook.yaml for full per-house flavor.
      - applies_to:
          class: Cleric
        beat: |
          The Workhouse rota's lighter passes close enough to see the
          holy symbol at your collar — the pierced copper of the
          Confessional, the plain pinewood disc of the Workhouse, the
          carved mask-fragment of the Masquerade, the dark wooden
          crook of a Herdsman's Witness, the pressed-leaf disc of a
          Green-Watcher, the limestone chip of a Dust-Listener — and
          their nod adjusts by a fraction to match the rite. They do
          not ask which house you serve. The symbol speaks for itself.
          Tonight, in the square, the form your symbol takes is the
          form the town will read you by for the rest of the season.

      # Mage — spell-pack pick. Surfaced as Brecca Half-Hand reading
      # the spine of the Mage's spellbook in the silver-market window.
      # The C&C/Sünden Mage starts with three workings copied into the
      # book (per genre classes.yaml: starting_known_spells: 3). The
      # canonical L1 catalog is at genre_packs/caverns_and_claudes/
      # spells/arcane_l1.yaml — twelve options. Player picks three in
      # their reply; narrator canonises via Yes-And.
      - applies_to:
          class: Mage
        beat: |
          You walk past the silver-market on your way out of the
          square earlier and Brecca Half-Hand is at the back-room
          window, her three remaining left-hand fingers rested against
          the glass. She sees the spellbook at your hip and reads the
          spine by lamp-light — the way she reads every Mage's spine
          in Sünden — and her mouth moves once for each working she
          identifies. Three workings. Brecca knows the count without
          opening the book. She nods; the nod is her version of
          "carry on." The three workings you copied in are the three
          you can cast tomorrow morning, and Brecca has just confirmed
          to half the silver-market that you came south with them in
          your book.

  # ---------------------------------------------------------------
  # MP — two or more delvers at the Spillway after the lamps light
  # ---------------------------------------------------------------

  - id: mp_sunden_spillway_evening
    name: "The Spillway, Sünden — After the Lamps"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "the back room of the Spillway tavern in Sünden's Hamlet, the night the cardinal lamps were lit"
      situation: >-
        The Spillway's back room runs over a natural spring. The
        water moves through a stone channel cut into the floor; the
        sound is half the appeal. The party is together at the long
        table with a pitcher of dark ale and three lit candles; the
        Recruiter took on a delver from each of them today, which is
        why all of them are still in town tonight. Outside in the
        square, the lamps are lit. Tomorrow morning is when the
        delving party walks down to whichever dungeon the table
        chooses.
    tone:
      register: "the careful courtesy of veteran delvers in a tavern they have all been in before — quiet, considered, the conversation circling around what tomorrow's descent should be"
      stakes: "low on turn 1; the choice is what's at stake, not blood"
      complication: "the table does not have to agree by the end of turn 1"
      avoid_at_all_costs:
        - combat in the first scene
        - dice rolls
        - an NPC walking up to the table with a quest
        - the narrator picking a dungeon for the party
        - running water sounds described more than once on turn 1
        - ending the turn with a question
    establishing_narration: |
      The Spillway's back room is full but quiet. The natural spring
      runs through the stone channel under the table; one of you has
      a boot on the channel-grating and you can feel the cold come
      up through the leather. Three candles are lit on the table,
      one for each of you the Recruiter took on this morning — that's
      the Spillway's tradition for delvers between contracts, and
      the candles will keep being relit by the staff for as long as
      the table is at the table. The pitcher is dark ale and is the
      one thing in Sünden that still tastes the way it is supposed to.

      Outside the Spillway, the four cardinal lamps were lit half an
      hour ago, and through the back-room window you can see the
      square half in light and half in shadow. The Wall of Names is
      on the lit side tonight. None of you have read it yet on this
      visit; one of you read it last visit and is not going to read
      it tonight. The Recruiter's Post is on the dark side and is
      closed.

      Tomorrow morning is the descent. The choice is the table's.
      Pride is two hours' walk to Ashgate ridge and another half
      hour across the Quiet Field to Grimvault's threshold. Greed
      is one hour to Copperbridge and however long it takes to find
      the right counting-house door, which is almost always the same
      door. Gluttony is the closest — Gristwell Quay is forty minutes
      down the Mawriver path, and Mawdeep itself is another ten past
      that. The pitcher is half-full.
    first_turn_invitation: |
      The candles are lit. The pitcher is half-full. The descent is
      tomorrow. Talk among yourselves.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "the Recruiter took each of you on this morning"
        - "the Spillway lit a candle per delver, as they always do"
      narrator_guidance: >-
        Treat the party as veteran delvers who have all worked in
        Sünden before but not necessarily together. Do not have an
        NPC join the table. Let the players decide which dungeon
        tomorrow's descent goes to. Do not narrate them moving;
        wait for their actions.
    per_pc_beats:
      # Cleric — rite-house / imported-faith pick, MP framing. The
      # Spillway's third candle is the rite-house tell — the staff
      # match the candle's wax color to the Cleric's house when they
      # know it, and ask without asking when they don't. Player
      # declares the rite in their reply; narrator canonises via
      # Yes-And. Five canonical houses: confessional, workhouse,
      # masquerade, herdsman, green_watcher, dust_listener.
      - applies_to:
          class: Cleric
        beat: |
          The Spillway's barkeep — Mira behind the counter, who has
          been here long enough to know the shorthand — sets down the
          third candle and pauses with the wax-pot at the ready.
          Confessional candles are pierced-coin coloured; Workhouse
          candles are unbleached pinewood; Masquerade candles are
          mask-pale; Witness candles are the river-grey of the Aldkin
          cloak; Watcher candles burn with a single pressed leaf in
          the wax; Listener candles are limestone-chalk white. Mira
          does not ask. She waits to be told, the way the Spillway's
          staff have always waited. Once she lights it, the rest of
          the room will know which rite is at the table tonight.

      # Mage — spell-pack pick, MP framing. The MP frame keeps Brecca
      # offstage but shifts the visibility to a fellow delver at the
      # table noticing the spellbook spine in the candlelight. The
      # Mage's three workings are common knowledge by the next dawn.
      # See solo opening's per_pc_beat for the spell catalog reference.
      - applies_to:
          class: Mage
        beat: |
          One of the other delvers at the table — whichever of the
          party is sitting closest — leans over the candle and reads
          the spine of your spellbook upside-down, the way veterans
          do, and counts the workings under their breath. Three. They
          nod, settle back, and do not ask which three. Sünden Mages
          carry three. The party will know which three by the morning
          regardless; whether you say them now or wait for tomorrow's
          first cast is a Mage's call, but the three are the three.

  # ===========================================================
  # Ashgate / Grimvault Descent — Pride
  # (folded dungeons/grimvault/openings.yaml 2026-05-10)
  # ===========================================================

  - id: dawn_at_the_approach
    name: "Ashgate Ridge, Dawn Crossing"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Ashgate ridge road, the Recovery Bench at dawn"
      situation: >-
        Dawn in Ashgate. The party gathers at the ridge road as pale
        light washes the limestone square. The Quiet Field stretches
        between town and the vault entrance — two hundred paces of
        meadow where sound does not carry right. Wren Peatford waits
        at the Recovery Bench with her tuning fork. Gear is checked.
        Lead-lined torches distributed. Entry time marked on the
        Threshold Stone. The party stands at the Stone with the vault
        mouth ahead of them; they have not stepped through.
    tone:
      register: "clinical anticipation, muted"
      stakes: "low — preparation phase"
      complication: "defer to descent"
      avoid_at_all_costs:
        - combat in the first scene
        - loud or dramatic entrances
        - exposition about the vault's nature (the player knows)
        - ending the turn with a question
        - narrating the party stepping through the Ashgate Door into
          the vault before a player declares it — the establishing
          narration closes with their hand on the Threshold Stone;
          they have NOT entered the vault
        - inventing a chamber, passage, or exit geometry on the vault
          side of the Threshold Stone — no room interior has been
          authored at the threshold and the party cannot see past
          the door until they cross it
    establishing_narration: |
      Dawn. The ridge catches the first light and holds it without
      warmth. Ashgate's fountain runs clear water that tastes of
      nothing — you filled your waterskin an hour ago and already
      cannot remember if it had flavor. Across the Quiet Field,
      the vault entrance waits — a rectangle cut into stone with
      edges too sharp for any chisel. Wren Peatford holds up three
      fingers from the Recovery Bench. You count them. She nods.
      Your senses are intact. For now. Falk Stonehelm's flat voice
      carries from the Assayer Hall: today's conditions are posted.
      The Butcher's awareness is at baseline. The Sorting Floor
      was clear as of yesterday's last return. Lead-lined torches
      burn six hours. Standards burn four. Both are available at
      Durn's. You cross the Quiet Field. By the halfway point your
      footsteps make no sound. The Threshold Stone is cool under
      your hand. You mark your entry time. The vault is open — and
      you are still on this side of it.
    first_turn_invitation: |
      The Threshold Stone is cool. The Quiet Field has eaten your
      footsteps. The vault is open and waiting. You have not stepped
      through.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "Wren Peatford recognises each of you by your tuning-fork response"
        - "an entry-time on the Threshold Stone with all your names beside it"
      narrator_guidance: >-
        Treat the party as a working delve crew who have crossed the
        Quiet Field together before. Do not re-introduce them to
        Ashgate or to one another. CRITICAL: the party is OUTSIDE the
        vault, hands on the Threshold Stone — they have not crossed
        into it. The opener is a pre-descent pause. Do not narrate
        any PC stepping through the Ashgate Door. Do not describe the
        chamber, passages, exits, or any interior of the vault — none
        has been authored at the threshold and inventing one will
        contradict whatever the player commits to next. Per-PC entry
        beats must show the PC at the Recovery Bench or with their
        hand on the Stone, not inside.

  - id: the_spillway
    name: "The Spillway, Evening After Return"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "The Spillway tavern, Ashgate, evening"
      situation: >-
        Evening at The Spillway tavern. The ale is the only thing in
        Ashgate with full flavor — the brewer compensates. Durmach's
        Chair sits empty in the corner. Returning delvers sit at the
        bar, testing their senses. One holds a colored card at arm's
        length and squints. The Assayer board has been updated.
    tone:
      register: "quiet commerce, muted camaraderie"
      stakes: "low; ambient unease"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - raucous tavern scenes
        - bar fights
        - loud music or entertainment
        - ending the turn with a question
    establishing_narration: |
      The Spillway. Water runs through a channel in the stone floor —
      a natural spring that emerges from the ridge and tastes of
      chalk. The ale does not taste of chalk. The brewer adds enough
      hops to fight the vault's proximity. Durn Oakwell sits at the
      bar nursing a standard mug and talking to nobody. A returned
      delver at a corner table is testing colored cards against each
      other, whispering their names like a prayer. Red. Blue. Green.
      She hesitates on yellow. Durmach's Chair is empty. It is always
      empty. The Assayer board on the wall lists today's conditions
      in Falk Stonehelm's precise hand. The Sorting Floor has been
      restocked. The Holding Cells have two new occupants. The Quiet
      Archive remains undiscovered by any active party. A note at the
      bottom in different handwriting: The Quiet Field has expanded
      twelve paces since spring.
    first_turn_invitation: |
      The ale is in front of you. The Assayer board is on the wall.
      Durmach's Chair is still empty.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "a Spillway table you tend to claim when you come back up"
        - "the colored-card sense-test you all run on each other after a return"
      narrator_guidance: >-
        These delvers know each other and know The Spillway. They are
        a working crew unwinding, not strangers meeting. Do not
        re-introduce them.

  - id: ledger_row_morning
    name: "Ledger Row, Trader's Morning"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Ledger Row, Ashgate merchant quarter, morning"
      situation: >-
        Morning on Ledger Row. The Quiet Trader has new stock from
        yesterday's returns. Agna Ironjaw is assessing a batch of
        weightless iron at her scale. A courier from downriver waits
        with new purchase orders.
    tone:
      register: "commercial precision, strange goods"
      stakes: "low; ambient unease"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - haggling comedy
        - merchant stereotypes
        - explaining the trade to the player (they know)
        - ending the turn with a question
    establishing_narration: |
      Ledger Row. Three steps down from the square into the merchant
      quarter. Agna Ironjaw has her vault-standard scale out — brass
      pans balanced with weights that measure more than mass. On the
      left pan, a bar of iron that should weigh ten pounds and does
      not register. On the right pan, nothing visible, but the pan
      sinks. She is weighing the iron's missing weight. The number
      she writes in her ledger means something to a buyer in the
      lowlands. At the Quiet Trader, new stock: a bolt of cloth the
      color of nothing, three soundless bells in velvet cases, a
      jar of extracted warmth that keeps a room comfortable for a
      week. The courier from downriver has standing orders for more
      mourning cloth. The Ledger needs delvers to go deeper.
    first_turn_invitation: |
      Agna's ledger is open. The courier is waiting. The Quiet
      Trader's new stock is laid out for whoever names a price first.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "Agna's ledger has each of your names against past hauls"
        - "a standing arrangement with the downriver courier nobody renegotiates anymore"
      narrator_guidance: >-
        The party are known faces on Ledger Row. Treat the merchants
        as people who recognise them; do not re-introduce the
        commerce or the trade.

  # ===========================================================
  # Copperbridge / Horden Warren — Greed
  # (folded dungeons/horden/openings.yaml 2026-05-10)
  # ===========================================================

  - id: dawn_on_the_spillfield
    name: "Spillfield, Dawn at Kern's Post"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Copperbridge — Kern's Post above the Spillfield, dawn"
      situation: >-
        Dawn in Copperbridge. The Spillers are already on the field,
        sorting the overnight spillage by torchlight. The party gathers
        at Kern's Post to weigh their empty packs. The Mule Track
        glints copper-green in the first light.
    tone:
      register: "anticipation, greed-adjacent, morning commerce"
      stakes: "low — preparation phase"
      complication: "defer to descent"
      avoid_at_all_costs:
        - combat before entering the dungeon
        - exposition about the Hoarder's nature (the player knows)
        - making the spillage seem magical (it is mundane — treasure falls out)
        - ending the turn with a question
    establishing_narration: |
      Dawn. The creek runs copper-green under the bridge and the
      Spillfield catches the first light in a thousand glints — last
      night's overflow, spread across the slope like coins dropped
      from a giant's pocket. Three Spillers are already at work,
      sorting with hooked poles and leather sacks. Kern Saltwall
      stands at his post, scale out, recording weights in his ledger.
      He nods at you without looking up. Your empty pack is on his
      counter. He writes the weight. You will weigh it again when
      you return. The Mule Track climbs the ridge ahead, copper
      filings catching in the ruts. The Twelve Posts are visible at
      the top — grey stone against grey sky. The mouth of Horden
      is a dark shape beyond them. It is always open.
    first_turn_invitation: |
      Kern has logged your empty weight. The Mule Track climbs ahead.
      Horden's mouth is open and patient.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "Kern knows each of your empty-pack weights without rechecking"
        - "a Mule Track marker the party always pauses at on the climb up"
      narrator_guidance: >-
        Treat the party as a returning delve crew. Kern Saltwall
        recognises them; the Spillers do not look up. Do not
        re-explain Copperbridge's economy.

  - id: the_clinker
    name: "The Clinker, Evening After Haul"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "The Clinker tavern, Copperbridge, evening"
      situation: >-
        Evening at The Clinker tavern. Returning delvers compare
        hauls over copper bar tops. Kreveld's Chair is empty.
        Noll Thatcher sits in the corner, counting something in
        a ledger nobody else is allowed to read.
    tone:
      register: "commerce, uneasy prosperity, muted celebration"
      stakes: "low; ambient unease"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - raucous celebration (Copperbridge is rich but nervous)
        - bar fights
        - Noll being played as comic relief (his compulsion is genuine and tragic)
        - ending the turn with a question
    establishing_narration: |
      The Clinker. The copper bar top is dented from years of
      coins slapped down as payment — nobody counts change here,
      they weigh it. Petra Brewer pulls ale into a dented silver
      goblet that would cost a month's wages in any other town.
      Here it is a mug. A returned delver at the corner table is
      counting coins on a cloth, sorting by tarnish level — bright
      coins fetch more because mite-free means deep haul. Kreveld's
      Chair sits empty, reinforced legs bolted to the floor. Noll
      Thatcher is in his usual corner, ledger open, lips moving.
      He is counting the flagstones again. He counted them yesterday.
      The number was the same. He will count them tomorrow. On the
      wall behind the bar, a chalkboard lists today's spillage
      yield in Kern's neat hand: 14 lbs copper scrap, 3 lbs mixed
      coin, 1 intact silver chain (buyer found). Normal day.
    first_turn_invitation: |
      Petra has poured. The chalkboard is up. Noll is at his count
      and Kreveld's Chair is still bolted to the floor.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "a Clinker corner the party tends to claim after a haul"
        - "an unspoken rule among you about not interrupting Noll's count"
      narrator_guidance: >-
        These delvers are regulars at The Clinker. Petra knows their
        order; Noll does not see them at all. Do not re-introduce
        the tavern or the town.

  - id: spiller_row_morning
    name: "Spiller Row, Sorting Morning"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Spiller Row, Copperbridge, morning"
      situation: >-
        Morning on Spiller Row. The sorting blankets are out. Fresh
        spillage is being priced. A courier from downriver has arrived
        with purchase orders for dungeon-touched goods.
    tone:
      register: "commercial precision, strange economy"
      stakes: "low; ambient unease"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - haggling comedy
        - treating spillage as magical curiosity (it is the local economy)
        - explaining the system to the player (they know how it works)
        - ending the turn with a question
    establishing_narration: |
      Spiller Row. The blankets are out — oilcloth squares laid on
      cobbles, each one a Spiller's claim. Rolf Ashgate has the best
      position, nearest the square, and his blanket shows the morning's
      best: a brass compass, a handful of silver rings green at the
      band, and a short sword in a rotted scabbard. The sword edge
      is still sharp. The Hoarder kept it well. Sigri Forger is
      making rounds with her loupe, tapping metal, naming prices in
      a voice that does not invite negotiation. A courier from the
      lowlands waits at the end of the row with a list of standing
      orders — dungeon copper for a smith who swears it holds an
      edge better, tarnished silver for a jeweler who markets the
      patina as antique. The demand is steady. The supply is
      infinite. The only limit is what the Hoarder lets spill.
    first_turn_invitation: |
      Rolf's blanket is laid. Sigri is on her rounds. The courier's
      list is waiting at the end of the row.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "a working relationship with at least one Spiller on the Row"
        - "a recognised place in the morning sort — you do not have to push in"
      narrator_guidance: >-
        The party are known on Spiller Row. Sigri prices for them
        without performance; Rolf nods them through. Do not
        re-introduce the trade.

  # ===========================================================
  # Gristwell / Mawdeep Gullet — Gluttony
  # (folded dungeons/mawdeep/openings.yaml 2026-05-10)
  # ===========================================================

  - id: dawn_at_the_mouth
    name: "The Mouth, Dawn at the Threshold"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Gristwell — the Mouth of Mawdeep at dawn"
      situation: >-
        Dawn in Gristwell. The party gathers at the Mouth as the sun rises
        behind them. The dungeon exhales its cold morning breath. Gear is
        checked, torches counted, hirelings paid. The chalk marks on the
        entrance walls are a census of the lost.
    tone:
      register: "quiet dread, ritual"
      stakes: "low — preparation phase"
      complication: "defer to descent"
      avoid_at_all_costs:
        - combat in the first scene
        - NPC quest assignments
        - exposition about the dungeon's nature (the player knows)
        - ending the turn with a question
    establishing_narration: |
      Dawn. The Mouth breathes out — a slow, cold exhalation that smells
      of copper and wet stone. Your torch gutters in the draft before you
      have even lit it. The hirelings stamp their feet and do not look at
      the dark. Brecca Half-Hand chalked another mark on the wall this
      morning — the hundred and ninth party to enter this season. She did
      not chalk how many came back. You check your pack. Rope. Iron spikes.
      Six torches. Rations for two days. A waterskin you filled at the well
      an hour ago, when the water still tasted clean. The Mouth is sixty
      feet across and slopes gently downward into nothing. The daylight
      reaches about thirty feet in. After that, it is yours to carry.
    first_turn_invitation: |
      Brecca's chalk is dry. Your torch is unlit. The Mouth is breathing
      out and the daylight only goes thirty feet.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "Brecca Half-Hand has chalked your party in before"
        - "a hireling who has been paid by you before and stayed"
      narrator_guidance: >-
        Treat the party as returning delvers. They know the Mouth and
        the morning ritual; do not re-explain Gristwell.

  - id: the_sinkhole_tavern
    name: "The Sinkhole, Planning Over Stew"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "The Sinkhole tavern, Gristwell, evening"
      situation: >-
        Evening at The Sinkhole. The tavern is full of delvers spending what
        they dragged out of the dark. Rumors circulate — which rooms are
        restocked, whether the Maw has reformed, what the Glutton swallowed
        last week. The party plans tomorrow's descent over weak ale and
        Old Kettle's stew.
    tone:
      register: "gallows humor, anticipation"
      stakes: "low; ambient unease"
      complication: "defer to turn 2 or 3"
      avoid_at_all_costs:
        - dungeon encounters
        - immediate danger
        - long NPC monologues about lore
        - ending the turn with a question
    establishing_narration: |
      The Sinkhole is loud tonight. Two parties came back today — one heavy
      with gold from the Gallery, the other missing their porter and not
      talking about it. Old Kettle is pouring the dark ale, the one he
      saves for delvers who look like they need it. The fire pops. Someone
      at the corner table is selling a map of Level 2 that they swear is
      current. Torchboy Fen is at the hiring board, chalking rates for
      tomorrow — torchbearers at six gold a day, porters at ten, sellswords
      at twenty and they bring their own weapon. The Provisioner sent word
      that torch prices are going up again. Pitch is scarce. The trade road
      cracked last week and the wagons are taking the long way around. You
      nurse your ale and think about the Vault of Teeth. The ruby. The
      one you saw last time but did not have the crowbar to free.
    first_turn_invitation: |
      Old Kettle's dark ale is in front of you. Fen's chalk rates are on
      the board. The ruby in the Vault of Teeth is still there.
    party_framing:
      already_a_crew: true
      bond_tier_default: trusted
      shared_history_seeds:
        - "the ruby in the Vault of Teeth — you all saw it, none of you got it"
        - "a hireling you lost and a hireling you kept"
      narrator_guidance: >-
        The party is a working crew with at least one prior delve in
        common. Treat them as established; do not re-introduce them
        to the Sinkhole or to one another.

  - id: the_morning_count
    name: "Rented Room, The Morning Count"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "The rented room above The Sinkhole, morning"
      situation: >-
        Morning in the rented room above The Sinkhole. The party inventories
        what they have, what they need, and what they can afford. The math
        of delving: torches times rooms divided by danger. The numbers never
        quite work out.
    tone:
      register: "grim arithmetic, resolve"
      stakes: "low — preparation phase"
      complication: "defer to descent"
      avoid_at_all_costs:
        - action scenes
        - new NPC introductions
        - dungeon descriptions (save it for the descent)
        - ending the turn with a question
    establishing_narration: |
      You spread it all on the bed. Four torches — three hours of light
      if you are careful, two if you are not. Rations for a day and a half.
      One waterskin. Fifty feet of rope, fraying where the acid touched it
      last time. A hand axe with a notch in the blade from the amber hulk
      in the Junction. Fourteen gold pieces and some copper — not enough
      for another torch at Marga's prices, not unless you skip breakfast.
      The hireling is downstairs eating your share of the stew. You paid
      him in advance because the last one ran when the walls started
      sweating, and Torchboy Fen says they are less likely to bolt if the
      money is already spent. You are not sure that is true. Through the
      floor, you hear Old Kettle's voice and the scrape of chairs. Another
      party is forming. They will reach the Junction before you if you do
      not move. You begin packing.
    first_turn_invitation: |
      The gear is on the bed. The hireling is on the stew. Another party
      is moving for the Junction downstairs.
    party_framing:
      already_a_crew: true
      bond_tier_default: trusted
      shared_history_seeds:
        - "the notched hand axe from the amber hulk in the Junction"
        - "the rope frayed by acid on a previous descent"
        - "a hireling who ran on you, and the lesson you took from it"
      narrator_guidance: >-
        These delvers have descended together before; the gear on the
        bed has shared scars. Do not re-introduce them or re-explain
        the math.

  - id: the_mouth_remembers
    name: "The Mouth, Wider This Morning"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Gristwell — the Mouth of Mawdeep, the morning it grew"
      situation: >-
        The party arrives at the Mouth to find it changed. Something is
        different — the breath is warmer, the opening is wider, or there
        are fewer chalk marks than yesterday. The Glutton has been active
        overnight.
    tone:
      register: "wrongness, unease"
      stakes: "immediate; nonlethal in turn 1"
      complication: "defer escalation to turn 2 or 3"
      avoid_at_all_costs:
        - explaining the change (let the players theorize)
        - immediate combat
        - NPC hand-holding
        - ending the turn with a question
    establishing_narration: |
      The Mouth is wider. You are sure of it. The chalk marks on the left
      wall — the ones Brecca carves at shoulder height — are at chest
      height now. The stone lips have spread another foot overnight,
      smooth and worn as if decades of rain shaped them between dusk and
      dawn. The morning exhalation is warmer than yesterday. Not cold
      cave air — warm, like breath from a throat. Your torchbearer stops
      at the threshold and looks at you. He does not say anything. He
      does not need to. The dungeon grew last night. It ate something
      underground — a root cellar, a well, a grave. You cannot see what.
      You can only see that the Mouth is wider and the dark inside is
      deeper. The trade road behind you has a new crack running across it,
      hairline thin, that was not there yesterday. Gristwell is three
      hundred yards from the Mouth. It used to be four hundred. You
      light your torch and step inside. The Mouth swallows the daylight
      behind you, and the breathing of the stone closes in.
    first_turn_invitation: |
      The chalk marks are at chest height. The breath is warm. The
      torch is lit and the daylight is already behind you.
    party_framing:
      already_a_crew: true
      bond_tier_default: familiar
      shared_history_seeds:
        - "Brecca's chalk marks at the height you remember from yesterday"
        - "a torchbearer who has worked your party long enough to read your faces"
      narrator_guidance: >-
        Treat the party as returning delvers who recognise the wrongness
        because they know the baseline. Do not explain the change for
        them.
