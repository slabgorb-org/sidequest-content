# spellbook.yaml — caverns_and_claudes / caverns_sunden world layer
#
# 2026-05-07: Sünden ships three Cleric "rite-house" domains keyed to
# the town's three stress-service houses (Confessional / Workhouse /
# Masquerade). A Cleric chooses one at chargen — the choice surfaces
# via per_pc_beats in worlds/caverns_sunden/openings.yaml on turn 1
# (no separate chargen scene; the narrator asks and Yes-And canonizes
# the player's reply per SOUL).
#
# This file is FLAVOR-ONLY. The loader-canonical L1 spell list lives at
# genre_packs/caverns_and_claudes/spells/{arcane,divine}_l1.yaml (per
# 2026-05-09 / PR #194 — see the genre spellbook.yaml header for the
# design-reference vs loader-canonical split). Domains do NOT add new
# spells. Domain affects narration register, signature phrasings,
# broken-vow consequences, the holy_symbol_form the Cleric carries,
# and a small bias toward favored spells in narrator framing.
#
# Magic-User has no domain in Sünden — guild outsiders, lodge where
# they can. No housing, no domain, no broken-vow consequence.

world: caverns_sunden
genre: caverns_and_claudes

# === Cleric domains (Sünden) ==========================================

cleric_domains:
  - id: confessional
    house: The Confessional
    rite: Generosity
    opposing_sin: Greed
    keeper: Anselm Vail
    location: "north-west corner of the Square (narrow stone chapel, two rows of benches and a single carved screen between penitent and keeper)"
    flavor: |
      Clerics of the Confessional channel mercy through tithed-coin
      penance. Their healing comes after a count is broken — coin
      surrendered, sum forgiven. Their prayers are low and even,
      spoken across a screen rather than face to face. They do not
      look at the people they heal until after the count is done.
    holy_symbol_form: |
      A pierced copper coin on a leather thong — the same shape as the
      Confessional's poor-box token, struck on the same press but with
      the screen-mark rather than the box-mark. Cleric grips it through
      the screen in the gesture; before strangers it sits inside the
      collar, never on the chest, because Anselm Vail considers
      ostentation a separate sin.
    favored_spells: [cure_light_wounds, remove_fear]
    signature_phrasing: |
      "The count is broken. The poor box is heavier. Be lighter."
    broken_vow: |
      Refusing to surrender coin when a brother asks; spending the
      poor box on personal need. The Cleric loses spellcasting until
      they surrender three times the missing sum at the screen.
      Anselm Vail keeps the ledger; he does not forget.

  - id: workhouse
    house: The Workhouse
    rite: Temperance
    opposing_sin: Gluttony
    keeper: Brother Hesh
    location: "east side of the Square (long timber hall, cold hearth, benches and looms set for plain labor)"
    flavor: |
      Clerics of the Workhouse channel through plain labor and plain
      food. Their healing is patient — wounds close at the speed of
      bread proving. Their prayers are physical: kneading, sawing,
      turning, looms worked. Casting is unhurried, and they will not
      be hurried by anyone — not pursuers, not patrons, not the
      bleeding party member.
    holy_symbol_form: |
      A plain disc of unfinished pinewood the diameter of a working
      thumb, hung on twine. The Workhouse cuts a fresh disc each year
      from the off-cut bin and the Cleric burns the previous one in the
      hearth on the same morning. Brother Hesh approves of nothing
      ornamented. The disc is meant to look like nothing in particular
      and to weigh nothing in the hand. Both qualities are part of the
      working.
    favored_spells: [cure_light_wounds, resist_cold, purify_food_and_water]
    signature_phrasing: |
      "Eat the plain bread. Drink the cold water. Be still."
    broken_vow: |
      Indulging in fine food, drink, or drug; rushing the rite by
      paying others to labor in your stead. The Cleric loses
      spellcasting until they complete two delve-ticks at the long
      bench under Brother Hesh's hand.

  - id: masquerade
    house: The Masquerade
    rite: Humility
    opposing_sin: Pride
    keeper: "(by Sünden tradition unnamed; a different mask each season; the office is older than any wearer's tenure)"
    location: "south side of the Square (vaulted single-room hall, walls hung with carved wooden masks of every face but the wearer's)"
    flavor: |
      Clerics of the Masquerade channel through becoming someone
      else. Their prayers are spoken as the masked face — never as
      themselves, never as their delver, never as anyone they have
      ever been. They do not introduce themselves; they introduce
      the mask. Healing comes when the cleric's own name is set
      aside.
    holy_symbol_form: |
      A carved wooden fragment the size of a thumbnail — a chip from
      one of the hall's older masks, replaced when the mask was retired
      from the wall and ground down for kindling. Each fragment shows a
      partial feature: a corner of mouth, the curve of a brow, half a
      shut eye. The Cleric never wears the same fragment for two full
      delves; the office rotates the chip with the mask. The fragment
      is held against the cheek, not extended outward, because the
      Masquerade's gesture is to hide the face one wore in coming, not
      to show the face the rite has lent.
    favored_spells: [cure_light_wounds, remove_fear, ventriloquism]
    signature_phrasing: |
      "I am not the one who asks. The mask asks."
    broken_vow: |
      Speaking as oneself during a working; refusing to wear the
      assigned mask in public. The Cleric loses spellcasting until
      they complete a three-day Masquerade vigil — and risks the
      mask sticking permanently.
    risk: |
      Per Sünden custom, on rare nights the masked face overwrites a
      flavor trait of the cleric — a cadence of speech, a preference,
      a small habit — and the Wallwrights add nothing to the Wall,
      because the cleric is not changed in any way the Wall records.

  # === Imported faiths (the three rite-houses are local; below are =====
  # === wanderers, exiles, and converts whose god travels with them.  ===
  # ====================================================================
  #
  # Sünden does not export its rite-houses, but it accepts foreign
  # faiths in proportion to whether the foreigner can pay their own
  # cost. A Cleric whose god demands years-of-life or childlessness or
  # the steady pull-toward-the-Wall costs Sünden nothing, and the
  # Confraternity's rule on visitors is that no doctrine is heretical
  # so long as it does not ask the village to subsidise it.
  #
  # Each imported domain below is a portable faith — a Cleric of one of
  # these comes from somewhere else and ends up in Sünden because the
  # Wall, the dungeons, and the Three Sins have a magnetic pull on
  # disciplines that already know how to count their dead.

  - id: herdsman
    house: The Herdsman's Witness
    rite: Separation
    opposing_sin: Sloth
    keeper: "(no resident keeper in Sünden; the wandering Witness is the priesthood)"
    location: "no fixed seat — Witnesses lodge at the Recruiter's Post by tradition; on holy days they walk the Wall of Names from dawn-side to dusk-side and back"
    origin: |
      Imported from the Klas steppes by Aldkin shepherds who came
      south after a bad winter and stayed because the Wall of Names
      reminded them of the Mjöndenheill's roll-call. The Herdsman is
      a pastoral shepherd-deity of gathering and separating — the
      same god the Klas tribes pay in years-of-life through their
      Njörkte priests. In Sünden the Witnesses pay the same way, and
      Anselm Vail keeps a shorter ledger for them than for his own
      penitents because the Witness is paying the toll in the only
      currency the Wall accepts back.
    flavor: |
      Witnesses of the Herdsman channel through separating the good
      from the bad — a sick from a healthy ewe, a cursed coin from a
      true one, a dying delver from a delver who can be carried out.
      Their healing is brief and final: the cleric reads the body,
      decides which side of the line it sits on, and the working
      flows or doesn't. Their prayers are spoken in the Aldkin
      cadence with the Sünden vocabulary — flat consonants, long
      vowels, a half-step pause after each name. They count years.
    holy_symbol_form: |
      A short wooden crook the length of a forearm, peeled smooth
      and stained dark by generations of working hands. The crook is
      passed Witness-to-Witness on retirement and the wood absorbs
      a fraction of every prayer ever cast across it; older crooks
      grow heavier in the same way salt-pillared driftwood does. A
      new Witness inherits a crook with a known toll already paid
      into it. They are told the names of the previous holders
      before they take it up.
    favored_spells: [cure_light_wounds, detect_evil, remove_fear]
    signature_phrasing: |
      "Stand on this side. The other side is not for today."
    broken_vow: |
      Refusing to make the separation when the body asks for it —
      keeping a dying delver a turn longer because the Witness is
      not ready to let them go. The cost is exact and immediate: the
      Witness loses one year of life from their own count, payable
      to the Herdsman that same night. A Witness who breaks the vow
      twice in a season is recalled by the wandering council and
      not seen in Sünden again.
    cost_register: |
      Every working, even the small ones, draws a measured weight
      from the Witness's own remaining years. The cost is not
      visible to the laity, but the Confraternity's recordkeepers
      can compare a Witness's apparent age to their stated age and
      the difference is the prayer-toll. Witnesses age in jumps:
      ten years quiet, then a season's worth of grey at the
      temples after a hard delve. They do not complain about it.
    risk: |
      A Witness who ages out mid-season leaves the party with no
      replacement; the Aldkin do not produce trainees on demand.
      The Wallwrights keep the name on file before the Witness
      arrives, in anticipation.

  - id: green_watcher
    house: The Green-Watcher
    rite: Continuation
    opposing_sin: Lust
    keeper: "(no Sünden seat — the local Watcher is whoever currently patrols the hill country between the village and the dungeon mouths)"
    location: "the Watcher walks a circuit through the limestone hills outside the village; takes water at the Workhouse but does not lodge there; sleeps under whichever tree is upwind of the dungeon's last vent"
    origin: |
      Imported from a celibate druidic order that patrols forests
      and swamps far north of Sünden — the Scouts of the Green. A
      Watcher who comes south is usually one whose home stand was
      cut down or burned, and who chose to take their oath into
      whatever wilderness still remained. Sünden's hill country is
      not their first choice. It is no one's first choice. But the
      Watcher keeps the Green's bond by tending it where it actually
      grows, and what grows around Sünden's dungeon mouths is what
      they will tend.
    flavor: |
      Watchers channel through the bond between the living world
      and the working caster — a bond paid for by celibacy, and
      by the resulting childlessness. Their healing has a green
      register: gashes close as if knit by root-thread, fevers
      break with the smell of crushed leaf, the pulse evens out
      to the rhythm of stand-of-trees in slow wind. Their prayers
      are spoken half under the breath, the way one speaks to a
      working animal that will spook if addressed directly. They
      do not raise their voice. The Green hears soft voices first.
    holy_symbol_form: |
      A pressed leaf in a glass disc the size of a thumbprint, the
      disc backed with thin lead and worn on a long cord around the
      neck. The leaf is from the Watcher's home stand — the trees
      they bonded with at the celibacy-rite — and the leaf does not
      decay because the bond holds. A Watcher whose home stand is
      destroyed presses one final leaf and carries it dead, and the
      decay is slow enough to count seasons by. Sünden's lampwrights
      have been asked to make the discs and refuse, citing
      apprentice safety; the discs come from north traders.
    favored_spells: [cure_light_wounds, resist_cold, purify_food_and_water]
    signature_phrasing: |
      "What grows is meant to keep growing. Your body will be told."
    broken_vow: |
      Breaking celibacy for love — the same vow Gan son of Gan broke
      in the old Klas account, with the same result. The Green
      withdraws the bond in specific, usually tragic ways: the leaf
      in the disc browns within a fortnight, the working register
      curdles to nothing, and any later love the Watcher takes is
      followed within a year by a Black Pox death or its local
      equivalent. The Confraternity does not pretend to understand
      this and does not interfere. The Watcher is asked to leave
      Sünden when the leaf browns; they are not asked twice.
    cost_register: |
      Every working takes a measured fraction from the Watcher's
      capacity to bear or beget — a slow narrowing rather than a
      sharp toll. A Watcher in the Green for thirty years has
      crossed a threshold they cannot cross back from. They are
      told this at the rite. The ones who stay knew what they
      were taking on, and the ones who didn't are not Watchers.
    risk: |
      A Sünden Watcher in the field is a one-life resource — there
      is no second Watcher coming if the first falls. Plan deeply.
      Several of the Wallwrights' shorter inscriptions are for
      Watchers who fell on duty before their replacement could
      walk south.

  - id: dust_listener
    house: The Dust-Listener
    rite: Remembrance
    opposing_sin: Wrath
    keeper: "(no living keeper; the office is the Wall of Names itself, and the eldest active Listener serves as informal vicar)"
    location: "the Wall of Names, north face of Sünden Square — the Listener works there at first lamp-light and at the hour before dawn, when the Wall is most permeable"
    origin: |
      Indigenous to Sünden in form, imported in theology. The
      Dust-Listener doctrine holds that the dead do not depart into
      a god's keeping but cross the Chalky Cliffs into the Land of
      Dust — a plane-of-shadows afterlife older than any of
      Sünden's three sins. In thin places, where the boundary is
      worn smooth by repeated crossings, a sufficiently disciplined
      cleric can listen to the named dead without summoning them or
      compelling them. The Wall of Names is the thinnest place in
      Sünden by an order of magnitude. The Listeners have been
      around since before the Confraternity was founded, but the
      doctrine — Listeners admit — was inherited from a Tismenni
      practice that survived because the limestone did.
    flavor: |
      Listeners channel through the dead they have learned to hear.
      Their healing comes laced with a register the laity recognise
      as funeral cadence — the closing words of the Wall's
      chiselling rite repurposed for the living. Their prayers are
      spoken to a name on the Wall, not into the air, and the name
      is chosen for the moment: a Listener treating a stab wound
      may pray to a delver who took the same wound forty years ago
      and survived. The dead do not always answer, and when they
      do, they answer in fragments. Listeners have learned to fill
      the gaps.
    holy_symbol_form: |
      A piece of limestone the size and shape of a knuckle, taken
      from a corner of the Wall during a chiselling and tied to a
      cord with the chip's source-name written on the cord in the
      Listener's own hand. Listeners replace the chip — not the
      cord — every time the source-name's anniversary passes,
      effectively rotating the symbol through the Wall's full
      register over a working life. A Listener with a fresh chip
      is paying close attention; one with an old chip has been
      distracted, and the Wall notices.
    favored_spells: [detect_evil, detect_magic, remove_fear]
    signature_phrasing: |
      "She had this same wound. She kept her hand. So will you."
    broken_vow: |
      Compelling a named dead — using the Listener's discipline to
      summon, force, or interrogate rather than listen. The Wall
      responds by adding a new pull on the Listener: each compelled
      name draws the Listener half a step toward the Chalky Cliffs
      themselves. Listeners who break this vow repeatedly walk into
      the Wall on a foggy night and are not seen on the other side.
      The Confraternity stops short of forbidding the working
      because there is no need to forbid what the Wall enforces
      directly.
    cost_register: |
      Every working draws on the Listener's own footing in the
      living world — a slow magnetisation toward the Chalky Cliffs.
      A first-year Listener stands square; a thirty-year Listener
      finds themselves walking toward the Wall in their sleep and
      having to be turned around by a friend. The pull is small,
      cumulative, and exact. Listeners keep journals so the
      successor knows where the line is.
    risk: |
      A Listener in late career is unstable as a party member at
      night — the pull is strongest in the dead hours, and the
      Listener may rise from camp and walk toward the nearest
      named place without waking. Most parties tie a long cord
      between the Listener's wrist and a sleeping companion's.
      The Listeners themselves provide the cord.

# === Magic-User in Sünden =============================================
# Tolerated guild outsiders. No domain. No housing. No broken-vow.
# A Magic-User who lodges at Brecca Half-Hand's silver-market back
# rooms is the most common arrangement; the Recruiter's Post takes
# them too if they pay the bond.

magic_user:
  housing: "tolerated; lodges at Recruiter's Post (two-silver bond) or Brecca's silver-market back rooms"
  social_register: "guild outsider — neither honored like a Cleric nor reviled like a cursed-item carrier"
  narrator_hint: |
    Sünden Magic-Users get the Detect Magic / Read Magic / Sleep
    package and are watched by the Wallwrights. They are not asked
    to heal; they are not asked to bless. They are asked to identify
    the scroll Brecca brought back from Horden last week.
