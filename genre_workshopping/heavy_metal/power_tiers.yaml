# Power Tiers — heavy_metal
# Per-class visual descriptions at each level range, in the baroque-elegy
# register of the pack. Costs are always visible on the body.

Fighter:
  - level_range: [1, 3]
    label: house-blade
    player: >-
      serviceable chain under a coat in fading house-colors, a sword whose
      grip is wrapped in cord the wearer re-wraps themselves, boots that
      have been re-soled more than once, and the posture of someone who
      has drilled in a courtyard but not yet bled for a reason they
      actually believe in
    npc: >-
      a retainer of one of the declining houses, armored in inherited kit
      a little too large for them, carrying a blade whose sigil is half
      scratched out, watchful in the way that small household retainers
      are when they think no one is looking
  - level_range: [4, 6]
    label: duelist
    player: >-
      fitted mail under a long coat with subtle house embroidery, a
      properly balanced blade with the maker's mark visible, a parrying
      dagger on the off-hand, a small ledger of formal challenges kept
      in a breast pocket, and the measured economy of someone who has
      killed politely and does not wish to do so again today
    npc: >-
      a named duelist in the courts, coat cut for ease of draw, carrying
      a blade known by its own small reputation, accompanied by a second
      who carries the challenge-book and speaks less than they do
  - level_range: [7, 9]
    label: captain-of-arms
    player: >-
      fine plate worked with the restrained ornament of an old house,
      a blade whose history is known in at least three courts, a cloak
      whose color has aged into something heavier than it began as, and
      the authority of someone whose presence ends arguments without a
      word being said
    npc: >-
      a house captain whose name opens and closes doors, armored in the
      kit of a decade's campaigns, attended by a small entourage who
      speak for them when they prefer silence, and preferring silence
      more than they used to
  - level_range: [10, 10]
    label: the last blade of the house
    player: >-
      armor that is itself a minor relic, the ancestral blade of a line
      that is ending, a cloak whose heraldry is recognized in rooms where
      no living member of the house has been received in a generation,
      and the quiet grief of someone who has become their family's entire
      living inheritance
    npc: >-
      the sword of a dying line, standing attendance in a hall that still
      honors an older order, their presence itself a kind of obligation
      rendered visible

Ranger:
  - level_range: [1, 3]
    label: stratum-tracker
    player: >-
      worn traveling leathers patched at the knees, a short bow with
      cord wrappings, a small book of ruin-entries copied from an older
      notebook, and the alertness of someone who has learned which
      silences are safe to walk through and which are not
    npc: >-
      a journeyman ruin-guide at the edge of a stratified wilderness,
      hiring themselves to small parties who need to enter a site without
      getting something's attention, carrying the bare minimum and
      knowing where every inch of it is
  - level_range: [4, 6]
    label: path-warden
    player: >-
      oiled leathers over a long coat, a proper longbow, a pilgrim-token
      knotted into the belt, a blade kept razor for road-work, and the
      slow, economical movements of someone who has walked a hundred
      dangerous miles and catalogued most of them in their head
    npc: >-
      a road-warden for one of the pilgrim-routes, carrying the
      authority of the Path-Eater's registry, able to speak the names
      of every watering-site along two days of road, and choosing not
      to
  - level_range: [7, 9]
    label: deep-road walker
    player: >-
      armor of well-kept leathers worked with small devotional marks,
      a bow whose grip is black with use, a long knife with a history,
      a ranger's cloak that reads differently by starlight than by sun,
      and the stillness of someone who has stood in places older than
      writing and come back
    npc: >-
      a legendary guide to the deep strata, known to three different
      scholars' circles, keeping no fixed residence, arriving when
      summoned by the right introduction and in no other circumstance
  - level_range: [10, 10]
    label: grey pilgrim
    player: >-
      a figure indistinguishable from the road itself — cloak the color
      of old stone, a bow that sings faintly when drawn, the pilgrim's
      token of a route no one else currently walks, and the particular
      agedlessness of someone who has given years to the Path-Eater and
      received in return only further distance

    npc: >-
      a grey pilgrim whose footfalls are heard on roads no living guide
      knows, a relic weapon at their side, a route-token no one has
      seen issued in recent memory, and the wordless authority of the
      very long walked

Rogue:
  - level_range: [1, 3]
    label: ledger-thief
    player: >-
      dark plain clothes with serviceable boots, a belt knife, a small
      set of lockpicks and a smaller set of wax-seals, a battered
      notebook used for copying and forging entries, and the quick
      unworried movements of someone who has learned that information
      is easier to steal than coin
    npc: >-
      a freelance records-breaker hiring themselves to the kind of
      client who needs an entry removed from a book that is not
      supposed to be removed from, carrying tools of their trade in a
      hidden pocket and a ready story about which trade they actually
      practice
  - level_range: [4, 6]
    label: scribe-breaker
    player: >-
      dark leathers that move silently, a fine blade and a concealed
      second, a small professional kit of scribe's tools for forgeries
      and amendments, a narrow mask folded into a sleeve, and the
      careful precision of someone who has altered ledgers they were
      not supposed to touch and been paid, and left
    npc: >-
      a professional records-thief with a guild mark only the initiated
      recognize, known by reputation to those who have needed a
      specific paragraph to vanish from an official record, leaving a
      careful note behind and nothing else
  - level_range: [7, 9]
    label: shadow-keeper
    player: >-
      armor of dark cloth that bends light around its edges, a
      signature blade worn cross-draw, a kit of lock-tools and
      scribe-tools interchangeable in a hidden roll, a cloak that
      seems to drink the candlelight, and the unhurried stillness of
      someone who has robbed a feeding temple and lived to forget about
      it
    npc: >-
      a legendary records-thief whose work is recognized by its
      absences, commissioned only through intermediaries, walking into
      rooms where no living witness can say they were present
  - level_range: [10, 10]
    label: the unrecorded
    player: >-
      clothing that seems at once formal and impossible to describe
      afterwards, a relic blade of shadow-metal, a scribe's kit that
      is also a grimoire, and the particular uncanny absence of
      someone who has been expunged from their own entries in the books
    npc: >-
      a figure whose name no ledger currently holds, acknowledged by
      scholars only through the holes they leave in otherwise complete
      records, their face remembered only by those they have chosen to
      let remember it

Cleric:
  - level_range: [1, 3]
    label: acolyte-of-the-rite
    player: >-
      plain vestments tied with a cord of rank-appropriate color, a
      tally-stick for the month's offerings, a walking staff, and the
      still-earnest bearing of someone whose devotion is new enough to
      still feel like a choice
    npc: >-
      a novice Astran acolyte in the liturgical cold of a small
      temple, sweeping the offering-floor, checking the day's tally,
      speaking only when addressed
  - level_range: [4, 6]
    label: rite-keeper
    player: >-
      vestments in the full color of a specific feeding, a properly
      inscribed tally-book chained to the belt, a mace blessed at a
      rank-commensurate altar, a small censer for offerings, and the
      quiet cadence of someone who has administered a feeding and
      watched the god actually respond
    npc: >-
      a parish feed-keeper attached to one of the six deities,
      vestments bearing the precise markings of their rite-rank,
      measuring the day's offerings before attending to anything else
  - level_range: [7, 9]
    label: prefect-of-the-feeding
    player: >-
      fine vestments worked with the sigils of a rank held for years,
      a consecrated weapon kept more as a relic than a tool, a ledger
      bound in a material the faithful do not discuss, and the
      unshakable administrative presence of someone who has personally
      balanced a declining temple's books through a bad winter
    npc: >-
      a prefect of one of the great feeding cults, presiding over a
      temple complex, attended by junior rite-keepers, keeping the
      god fed through a combination of bureaucratic skill and
      increasingly inventive solicitation
  - level_range: [10, 10]
    label: first-of-the-rite
    player: >-
      vestments that are themselves a continuing devotion, a relic
      weapon whose edge has touched the altar of a god actively being
      fed, a holy symbol that hums when the caster is fasting, and
      the serene unshakable focus of someone who has kept a major
      feeding unbroken for a decade
    npc: >-
      the senior cleric of a major feeding cult, their presence a kind
      of guarantee that a god is being properly fed this year, their
      word enough to shift tithes across an entire province

Druid:
  - level_range: [1, 3]
    label: hollow-tender
    player: >-
      rough-spun clothing in undyed wool and bark-cloth, bare feet or
      simple cord sandals, a gnarled staff, a pouch of Orvinnic kin-
      charms, and the watchful stillness of someone who has begun
      hearing the older strata through the ground
    npc: >-
      a hermit or minor grove-keeper living at the edge of a
      settlement, tending to a small covenant-site, speaking softly
      of things the villagers do not like to discuss directly
  - level_range: [4, 6]
    label: covenant-holder
    player: >-
      leathers bearing traced patterns from an old kin-language, a
      living staff that buds in unlikely seasons, a sickle of dark
      iron, kin-tokens braided into the hair, and the quiet authority
      of someone who speaks on behalf of a population that speaks
      less of itself each year
    npc: >-
      an Orvinnic elder or a Thessil stratum-watcher, maintaining the
      terms of an old covenant at the practical, daily level, animals
      of the nearby wilds deferring without fuss
  - level_range: [7, 9]
    label: kin-voice
    player: >-
      armor of patient materials — bark grown rather than cut, stone
      threaded through cloth — a staff that is itself a minor covenant,
      a small token that is clearly not of the current age, and the
      presence of someone who has held a covenant's terms through a
      season no one else believed could be held
    npc: >-
      an old voice-of-the-kin whose words are taken as binding by
      their people, whose presence in a room changes the terms of
      what is and is not permitted to be said in it
  - level_range: [10, 10]
    label: the covenant itself
    player: >-
      a figure who is partly a person and partly the continuing
      sentence of an old pact — bark along one arm, an indescribable
      weather in the eyes, animals and plants responding to their
      mood — and the particular grief of someone who has become
      inseparable from the terms of their binding
    npc: >-
      a legendary kin-voice whose physical body is already half
      converted into the terms of their covenant, approached only in
      formal circumstances and addressed only in the old forms

Bard:
  - level_range: [1, 3]
    label: chronicler's-apprentice
    player: >-
      road-worn colorful clothes showing a dozen small patches, a
      second-hand instrument with the previous owner's mark still
      visible, a small belt-blade, a notebook of current rumors and
      song-fragments, and the light curiosity of someone collecting a
      trade
    npc: >-
      a tavern chronicler in a guild quarter, playing for coin and
      supper, trading in the day's gossip and the previous night's
      fragment of news, known by first name only
  - level_range: [4, 6]
    label: salon-performer
    player: >-
      a well-cut travelling coat with distinctive personal details,
      a quality instrument with its own small reputation, a rapier
      worn in the courtly style, a journal of overheard things, and
      the measured warmth of someone who has been admitted to courts
      where most entertainers are merely tolerated
    npc: >-
      a court-rated performer carrying a patron's token, instrument
      of visibly good make, known for the kind of songs that can
      repair or ruin a house's reputation inside a single evening
  - level_range: [7, 9]
    label: ledger-voice
    player: >-
      an ensemble that is equal parts garment and performance kit,
      a legendary instrument with a minor devotion paid to it each
      morning, a blade worn in the older formal style, a chronicler's
      book whose entries are quoted in at least three languages, and
      the magnetic calibrated presence of someone whose songs move
      money, people, and weapons
    npc: >-
      a chronicler whose work is cited by scholars and feared by
      houses, attending a specific court or circuit, a senior
      performer whose next song could rewrite a local political
      ledger
  - level_range: [10, 10]
    label: the voice-that-is-remembered
    player: >-
      clothing that seems to shift register with the company they
      are in, an instrument that plays accompaniment for itself, a
      voice whose pronouncements enter the histories verbatim, and
      the particular weight of someone whose songs are expected to
      outlive the current empire
    npc: >-
      a figure whose songs are already taught, who no longer
      performs for coin, whose next public appearance is listed in
      chronicles before it happens

Barbarian:
  - level_range: [1, 3]
    label: covenant-warrior
    player: >-
      heavy hides and bound-cloth stitched in old kin-patterns,
      visible tribal or covenant scars on the arms, a simple iron
      axe or heavy blade, bare head or hood, and the coiled
      tension of someone whose fury is not a temperament but the
      practice of a specific old devotion
    npc: >-
      a warrior of one of the covenant-peoples in traveling kit,
      armed with the tools of their particular rite-combat,
      bearing marks of the kin, not especially impressed by people
      who have not seen what they have seen
  - level_range: [4, 6]
    label: rite-breaker
    player: >-
      layered armor assembled from salvaged and covenant-worked
      pieces, a greataxe or greatsword whose balance is slightly
      wrong to anyone who has not wielded it, elaborated ritual
      scarring marking particular actions taken in particular fights,
      and the quiet composure of someone whose battlefield rage is a
      formal invocation
    npc: >-
      a clan warrior whose combat is understood locally as a form
      of covenant observance, traveling with a small number of
      similarly bound companions, unsettling to strangers at close
      range
  - level_range: [7, 9]
    label: war-keeper
    player: >-
      armor worked from materials that should not hold together and
      do, a legendary weapon whose name is older than the wielder's
      house, full ritual scarring covering every visible skin, and
      the devastating, almost sacramental, composure of someone who
      has fought in the proper form and been answered by the proper
      response
    npc: >-
      a war-keeper of one of the surviving covenants, leading a
      warband small in number and disproportionate in effect, their
      bare presence altering the terms of an engagement
  - level_range: [10, 10]
    label: the-rite-incarnate
    player: >-
      armor and scarring indistinguishable from each other, a
      weapon that participates in its own handling, and the
      absolute, quiet, almost-mournful authority of someone whose
      every combat is already the continuation of an older rite
    npc: >-
      the final warrior of a covenant nearly run out, their
      presence on a battlefield a kind of living closing
      ceremony

Monk:
  - level_range: [1, 3]
    label: offered-one
    player: >-
      plain unbleached robes tied with a cord, bare feet already
      hard from practice-stone, hands wrapped in linen, a walking
      staff, and the careful new stillness of someone who has
      just begun to offer hours of their life to a specific god
      and is not yet sure what is being withdrawn
    npc: >-
      a pilgrim-novice of the Path-Eater or the Keeper of Hours,
      travelling between temples, sleeping in the lees of waysides,
      carrying the bare accoutrements of an offering practice
  - level_range: [4, 6]
    label: rite-walker
    player: >-
      robes in the color of a specific feeding cult with a sash of
      rank, calluses on the hands and feet that speak of daily
      practice, a small talisman for the precise cost they have
      agreed to pay, and the measured, slightly-slow bearing of
      someone who is already visibly paying it
    npc: >-
      a confirmed practitioner of one of the body-offering cults,
      traveling alone, breaking up disputes with open-handed
      precision that is unsettling to observe
  - level_range: [7, 9]
    label: long-offered
    player: >-
      robes of good cloth worn to softness, hands and feet whose
      practice has made them into instruments, prayer-beads worn
      smooth, the visible signs of having been partly consumed by
      the offering, and the profound stillness of someone who has
      paid enough to begin to be heard
    npc: >-
      a senior monastery elder of a body-offering cult, attended
      in small ways by younger practitioners, moving with a
      quietness that makes rooms reorganize themselves around it
  - level_range: [10, 10]
    label: paid-in-full
    player: >-
      simple robes concealing a body that has already begun to
      pass beyond its original terms, hands and feet that radiate
      the visible residue of their offering, and the absolute
      quiet of someone whose account is already closed and who
      continues to move only out of generosity
    npc: >-
      a figure whose practice is already complete and who is,
      by all accounts, living on borrowed time granted by the god
      themselves as recognition of a very long observance

Wizard:
  - level_range: [1, 3]
    label: apprentice-of-the-workshop
    player: >-
      ink-stained robe of a middle guild rank, a spellbook chained
      to the wrist, a crooked staff with a dim crystal, a pouch of
      reagents weighed out in small portions, and the anxious
      focus of someone whose master has begun letting them perform
      the smaller workings unsupervised
    npc: >-
      a young Kragmoor workshop apprentice running errands between
      the guild hall and the reagent-yards, covered in the residues
      of whatever they prepared most recently, eager and slightly
      overworked
  - level_range: [4, 6]
    label: guild-thaumaturge
    player: >-
      properly fitted workshop robes in the color of a specific
      trade, a spellbook bound in workmanlike leather, a staff whose
      crystal pulses when worked, a ledger of completed workings
      and their costs, and the focused steady presence of someone
      who charges their rates by the hour and keeps honest books
    npc: >-
      a mid-tier guild sorcerer of one of the Kragmoor cities,
      attending a client in a workshop or on commission, their
      rates and their honesty both a matter of public guild record
  - level_range: [7, 9]
    label: senior-thaumaturge
    player: >-
      robes bearing the sigils of senior guild rank, a spellbook
      whose workings have their own visible history, a staff that
      hums faintly in the quiet, residues of workings visible at
      the cuffs, and the authority of someone whose name moves
      three different guild ledgers when cited
    npc: >-
      a guild senior on formal business, attended by a junior who
      carries the reagent kit, walking with the calibrated weight
      of someone whose work is visibly expensive to interrupt
  - level_range: [10, 10]
    label: master-of-the-workshop
    player: >-
      robes whose embroidery reads differently depending on the
      workings done by the wearer that week, a staff whose presence
      alters the faint taste of the air, a spellbook that opens to
      the needed working unbidden, and the quiet certainty of
      someone who has personally altered the rates-tables of an
      entire guild
    npc: >-
      the senior practitioner of an entire guild, approached only
      through formal introduction, their word on a working
      determining what is and is not permitted to be performed
      inside a quarter

Warlock:
  - level_range: [1, 3]
    label: newly-pledged
    player: >-
      common traveling clothes that no longer quite fit the way
      they used to, a small token of the pact worn where it can be
      kept private, a belt-knife, a notebook of recorded terms,
      and the nervous alertness of someone who has started hearing
      the patron's voice in places where nothing should be speaking
    npc: >-
      a freshly-pledged warlock working small contracts for coin,
      still testing the limits of what their patron will and will
      not permit, looking over their own shoulder at moments that
      do not seem to require it
  - level_range: [4, 6]
    label: pact-worker
    player: >-
      well-kept clothes with a discreet sigil worked into the
      collar-lining, the pact-token now carried openly enough that
      the informed can read it, a focus whose nature is plain to
      anyone who has studied such things, and the measured
      practicality of someone who has already paid several real
      installments on their agreement
    npc: >-
      a working warlock on retainer to a small house or guild,
      bearing a pact-token recognized by specialists, known for a
      specific kind of working their patron will reliably deliver
  - level_range: [7, 9]
    label: hand-of-the-patron
    player: >-
      clothing that carries fine detailed devotional work, a focus
      that has become a quiet extension of the wielder, visible
      small marks of the cost paid (a whitening of an eye, a patch
      of strange skin, an odd habit of the voice), and the
      composed presence of someone who has become trusted enough
      by their patron to be used as the patron's spokesperson
    npc: >-
      a senior warlock whose patron is recognized by the
      scholarly, their cost visible to those who know what to look
      for, attended in a limited way by others pledged to the same
      agreement
  - level_range: [10, 10]
    label: vessel
    player: >-
      clothing that has become a devotional uniform, a focus that
      may itself be part of the patron, a body whose visible
      changes mark a very long accumulating offering, and the
      almost-serenity of someone who has stopped distinguishing
      clearly between their own voice and the voice that speaks
      through them
    npc: >-
      a warlock whose pact has become their public identity, their
      presence treated by the informed as the presence of the
      patron at one remove

Sorcerer:
  - level_range: [1, 3]
    label: blood-marked
    player: >-
      common clothing in the color of a family a little too old to
      still be fashionable, a plain walking staff, a small charm
      worn to keep the worst of the inherited gift quiet, and the
      slightly-too-still bearing of someone whose magic chose them
      and who has not yet chosen back
    npc: >-
      a young member of an old family whose bloodline carries an
      inherited working, finding it surfacing in them at moments
      they do not always control, not yet sure what relationship
      they want to have with it
  - level_range: [4, 6]
    label: bloodline-worker
    player: >-
      clothing of restrained quality with a house motif, a focus
      worn as an old piece of jewelry rather than an instrument, a
      belt-knife, a small journal of the gift's episodes, and the
      careful controlled presence of someone who has learned to
      live with a working that was not asked for
    npc: >-
      a bloodline sorcerer in the service of the surviving fragment
      of their family, using the inherited gift with the practiced
      restraint of someone whose accumulating cost is becoming visible
  - level_range: [7, 9]
    label: line-holder
    player: >-
      clothing in the severe old style of a house still maintaining
      its forms, a focus that is actually a family relic, visible
      small marks of the inherited cost on the skin and in the
      manner of speech, and the grave composed presence of someone
      whose bloodline's working has begun to outweigh the rest of
      their identity
    npc: >-
      a senior bloodline sorcerer holding an old family's final
      remaining obligation alone, attended by a few remaining
      retainers, their appearance in public a kind of notice
  - level_range: [10, 10]
    label: the inheritance
    player: >-
      clothing that reads as formal house mourning regardless of
      context, a relic that is indistinguishable from an organ of
      the body, and the absolute quiet authority of someone whose
      family's working is, at this point in the line, no longer
      distinguishable from the wielder
    npc: >-
      the final inheritor of a bloodline whose magic has become
      the last remaining fact of the house, their presence a kind
      of continuing funeral

Paladin:
  - level_range: [1, 3]
    label: oath-sworn
    player: >-
      plain but well-kept arming coat in the colors of a specific
      feeding cult, a properly hung sword, a holy symbol worn as a
      working badge rather than an ornament, a tally-book of
      observances, and the earnest stillness of someone whose oath
      is still bright to them
    npc: >-
      a junior oath-sworn attached to a temple, escorting clergy
      and performing small administrative acts on their behalf,
      their oath visibly new enough to still be the center of their
      bearing
  - level_range: [4, 6]
    label: rite-bound knight
    player: >-
      fitted mail under liturgical surcoat in the detailed colors
      of the oath, a sword blessed at a specific altar, a shield
      bearing the working sigil of the cult they serve, an offering
      kit, and the steady observant presence of someone whose
      daily devotions are now indistinguishable from their
      combat practice
    npc: >-
      a temple knight attached to one of the six cults, traveling
      on formal business, attending services at any temple of the
      cult they encounter without being asked
  - level_range: [7, 9]
    label: sworn-of-the-feeding
    player: >-
      quality plate in the full formal colors of their cult, a
      sword whose history is recorded in at least two temple
      chronicles, a shield that has taken a blow from something
      sacrilegious and not broken, and the unshakable calibrated
      presence of someone whose oath and body have become
      continuous with each other
    npc: >-
      a senior temple knight whose presence at a rite is a kind of
      continuing guarantee, attended by junior oath-sworn who
      carry their field kit, an authority only loosely under the
      authority of the prefects
  - level_range: [10, 10]
    label: the hand-of-the-rite
    player: >-
      plate that is itself a continuing offering to the cult, a
      weapon whose edge has touched the altar of the feeding god,
      a holy symbol that hums at the approach of sacrilege, and
      the absolute composed authority of someone whose oath has,
      at this point, outlasted several of their living superiors
    npc: >-
      a legendary sworn of one of the great feeding cults, their
      arrival at a temple understood as a continuing validation of
      the cult's current practice, their word outweighing the
      administrative authority of any resident prefect
