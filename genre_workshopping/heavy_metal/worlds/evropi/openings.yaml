# Evrópí — World-tier opening hooks
#
# All openings drop the party into Upre on the Egzami frontier — the
# canonical starting region per world.yaml. Named factions and figures
# are drawn from worlds/evropi/lore.yaml, history.yaml, and cartography.yaml.
# Respect the Zkęd secret-police tone: quiet, watched, paperwork.

- id: upre_gabra_hireblades
  archetype: arrival
  situation: >-
    Gabra Ebbe of Upre — the hereditary Zkęd ruler of the frontier
    township — is hiring hireblades directly in the town hall, which
    is unusual. The local militia has been unable to hold the Waznoty
    road against the Daggereyes, and Upre's grain prices have climbed
    for six straight weeks. The party has arrived at Ebbe's hall as
    one of several groups answering the notice. The meeting is already
    underway. Ebbe is measuring them in the Zkęd manner — politely,
    without appearing to. At least one Wazdia informer is present and
    not speaking.
  tone: watchful, cold, formal
  avoid:
    - tavern rollcalls
    - dungeon-master-gives-a-quest vibe
    - hearty adventuring-party banter
    - NPCs who trust strangers quickly
  first_turn_seed: >-
    The town hall of Upre is a wooden structure older than the
    Kingdom of Zkędzała, and it smells of zami-wood smoke. Gabra
    Ebbe sits at the high end of a table not quite polished, her
    beads braided into her grey hair with the faint rattle they
    make whenever she turns her head. She is reading a list in
    Tismenni — names, debts, tithes — and she does not look up when
    your party is shown in. A tall man in a plain coat at the wall
    is also not looking up. The door closes behind you. Ebbe finishes
    the line she is on, sets the paper down, and speaks.

- id: waznoty_severed_hand
  archetype: standoff
  situation: >-
    The party is travelling the Waznoty road — the only road between
    Upre and the deeper Kingdom — when they come upon a mile-marker
    with a severed right hand nailed to its southern face. The hand
    is fresh. The cut between the knife-tattoos of the eyebrows is
    clean. A small caravan ahead has turned around and is now
    visible retreating north at a canter. Whoever left this hand is
    still close enough to have heard the party's approach. A decision
    is about to be made — continue, retreat, investigate, or cut the
    hand down and carry it to Ebbe for the Gabra's standing bounty
    of five zvonów per Daggereyes mark.
  tone: cold, decisive, dangerous
  avoid:
    - long establishing travel scenes
    - benign wildlife encounters
    - NPCs arriving to save or explain
  first_turn_seed: >-
    The Egzami forest is quiet in the way it only gets when something
    has just been killed or something is about to be. The mile-marker
    is the twelfth one out of Upre. The hand is nailed palm-outward.
    The tattoos between the knuckles are Daggereyes work — the thin
    blue-black knife-mark each of them carries from the age of nine.
    The caravan ahead is definitely not coming back. Your party is
    standing in the road and the road is no longer occupied.

- id: wazdia_paperwork_anomaly
  archetype: mystery
  situation: >-
    A Wazdia informer has quietly asked to meet the party in a back
    room of Upre's only inn. The informer is holding a ledger entry
    that does not balance — a name in the book that should not be in
    the book, or a tithe-mark that was paid twice, or a Waznoty
    transit that happened without papers. They are not accusing the
    party. They are not threatening them. They are simply asking —
    in the measured Wazdian cadence of "mind before heart" — for the
    party to explain the anomaly, or help the informer explain it,
    before they have to escalate it to the Wazdia proper. The
    informer is clearly afraid of something, and it is not the party.
  tone: quiet, oppressive, paperwork-dread
  avoid:
    - interrogation scenes with raised voices
    - obvious villain reveals
    - combat-first resolutions
  first_turn_seed: >-
    The back room of Upre's inn has one lamp, one chair opposite a
    small writing-table, and a Wazdia informer whose beard is braided
    in the Wazdia fashion — two plain strands, no beads, the lack of
    ornament being the ornament. They gesture for the party to sit.
    They open a thin leather ledger to a page marked with a strip of
    grey wool. They turn the ledger so the party can read it. The
    entry at the middle of the page should not exist.
