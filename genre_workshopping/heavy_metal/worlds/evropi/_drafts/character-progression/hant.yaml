# Hant — Antman Bard, pheromone-composer
# Layered on top of heavy_metal/progression.yaml baseline affinity effects.
#
# DESIGN NOTE: Hant's path is the most ADR-082+-dependent of the six. His
# signature mechanics are party-wide effects (ally_edge_grant,
# ally_beat_discount), all deferred. In v1 he ships with preserved labels
# and narration_hints but thin mechanical backing. This is a known gap —
# see README for rationale.

character:
  save_id: hant
  name: Hant
  race: Antman
  class: Bard
  affinity_emphasis:
    primary: [Pact, Lore]   # Pact reads through the pheromone-working lens
    secondary: [Court]
    rare: [Ruin, Iron]
    absent: [Craft]

starting_kit:
  label: "Composer on the Surface"
  flavor: "Surface strangers, pheromone-courts, the current he followed up out of the Deep Hollows. All three are crafts."
  grants:
    - id: drowse_kit
      label: "Drowse"
      narration_hint: |
        Once per scene, Hant destabilizes one enemy through pheromone
        composition. Narrator describes sudden fatigue, a misplaced word,
        a step out of stance. No NPC in the scene ever attributes the
        effect to Hant.
      effects:
        - { type: leverage_bonus, beat_id: argue, target_edge_delta_mod: -2 }

    - id: pheromone_court_etiquette_kit
      label: "Pheromone-Court Etiquette"
      narration_hint: |
        Once per scene, Hant reads an NPC's emotional state. Narrator
        answers truthfully and concretely ("she is afraid of the older
        priest"), never vaguely ("she seems nervous").
      effects:
        - { type: lore_reveal_bonus, scope: emotional_state }

    - id: surface_stranger_kit
      label: "Surface Stranger"
      narration_hint: |
        NPCs who have never seen an antman default to wonder or menace
        on first meeting, not hostility. Hant's opening social beat in
        any scene with new NPCs resolves cleaner.
      effects:
        - { type: beat_discount, beat_id: argue, edge_delta_mod: -1 }

trunk:
  id: composition_not_explanation
  label: "Composition, Not Explanation"
  narration_hint: |
    Hant never names the chemistry. His songs affect scene mood — NPCs
    find themselves calmed, unsettled, or bold without understanding why.
    Per world narrator_tone, no NPC ever says "pheromone." Astran priests
    log minor miracles. Vaermm book-checkers narrow their eyes. Hant does
    not explain. He composes.
  effects:
    - { type: lore_reveal_bonus, scope: emotional_state }

paths:
  - id: composition
    label: "Composition"
    flavor: "Party support through pheromone workings. Heavy ADR-082+ dependency."
    nodes:
      - tier: 1
        id: drowse
        label: "Drowse"
        milestone_category: revelation
        grant_trigger:
          condition: "affinity:Pact:tier:1"
          usage: "1/scene"
        narration_hint: |
          Once per scene, one enemy loses composure visibly. Narrator
          describes sudden fatigue, a misplaced word, a step out of
          stance. No NPC in the scene ever attributes the effect to
          Hant.
        effects:
          - { type: leverage_bonus, beat_id: argue, target_edge_delta_mod: -2 }

      - tier: 2
        id: courage_of_the_hollow
        label: "Courage of the Hollow"
        milestone_category: oath
        grant_trigger:
          condition: "affinity:Pact:tier:2"
        narration_hint: |
          When Hant opens a scene with a phrase, the first party member
          to act does so with the narrator's explicit description of
          calm. Their opening beat lands cleaner.
        effects: []  # TODO ADR-082+ — needs AllyBeatDiscount variant (next ally
                      # beat, any beat_id, reduced edge cost)

      - tier: 3
        id: hive_chord
        label: "Hive Chord"
        milestone_category: revelation
        grant_trigger:
          condition: "affinity:Pact:tier:3"
          usage: "1/arc"
        narration_hint: |
          The party acts before all enemies for one exchange. Narrator
          writes the beat as one unified motion; Hant's composition has
          moved through all of them.
        effects: []  # TODO ADR-082+ — needs AllyInitiativeGrant variant
                      # (entire party-side beats resolve before enemy-side)

  - id: unheard_chord
    label: "Unheard Chord"
    flavor: "Read the room. Hive knowledge of courts, emotions, currents."
    nodes:
      - tier: 1
        id: pheromone_court_etiquette
        label: "Pheromone-Court Etiquette"
        milestone_category: revelation
        grant_trigger:
          condition: "affinity:Lore:tier:1"
          usage: "1/scene"
        narration_hint: |
          Once per scene, Hant reads an NPC's emotional state. Narrator
          answers truthfully and concretely ("she is afraid of the older
          priest"), never vaguely ("she seems nervous").
        effects:
          - { type: lore_reveal_bonus, scope: emotional_state }

      - tier: 2
        id: the_current_he_followed
        label: "The Current He Followed"
        milestone_category: revelation
        grant_trigger:
          condition: "affinity:Lore:tier:2"
          usage: "1/session"
        narration_hint: |
          Once per session, Hant knows which exit the scene's danger will
          come through. Narrator must place the danger there.
        effects:
          - { type: lore_reveal_bonus, scope: scene_threat_vector }

      - tier: 3
        id: drowse_the_miracle_logger
        label: "Drowse the Miracle-Logger"
        milestone_category: reckoning
        grant_trigger:
          condition: "affinity:Court:tier:2"
          usage: "1/arc"
        narration_hint: |
          Hant causes an institutional record of the party to be misfiled.
          The next pursuing faction loses one beat of tracking. Narrator
          honors the misfiling in the next scene with that faction.
        effects: []  # TODO ADR-082+ — needs FactionTrackingDelay variant
                      # (skip one pursuit beat against the party)

  - id: stay_ahead_of_a_name
    label: "Stay Ahead of a Name"
    flavor: "Surface survival. He is a legendary creature here, and he knows it."
    nodes:
      - tier: 1
        id: surface_stranger
        label: "Surface Stranger"
        milestone_category: oath
        grant_trigger:
          condition: "affinity:Court:tier:1"
        narration_hint: |
          On first meeting, NPCs who have never seen an antman default to
          wonder or menace, not hostility. Hant's opening move in any
          social scene resolves unopposed.
        effects:
          - { type: beat_discount, beat_id: argue, edge_delta_mod: -1 }

      - tier: 2
        id: legendary_creature
        label: "Legendary Creature"
        milestone_category: revelation
        grant_trigger:
          condition: "affinity:Court:tier:2"
          usage: "1/session"
        narration_hint: |
          Once per session, an NPC treats Hant's testimony as miraculous,
          regardless of content. Court officials, priests, and scholars
          record it.
        effects:
          - { type: leverage_bonus, beat_id: argue, target_edge_delta_mod: -2 }

      - tier: 3
        id: the_name_that_doesnt_reach
        label: "The Name That Doesn't Reach"
        milestone_category: ruin
        grant_trigger:
          condition: "affinity:Ruin:tier:2"
          usage: "1/arc"
        narration_hint: |
          A named pursuer loses Hant's trail permanently. Narrator writes
          them as giving up, misled, or redirected. It does not matter
          which. Hant's name does not reach them again.
        effects: []  # TODO ADR-082+ — needs PermanentPursuerDismissal variant

capstones:
  unlock_condition: "any path tier 2 reached"
  choose: 1
  options:
    - id: composer_to_the_surface
      label: "Composer to the Surface"
      narration_hint: |
        Hant stops traveling upward and starts working. He can be
        commissioned; the party gains income from his compositions between
        sessions.
      permanent_effect: "Between-session income stream. Narrator-tracked."
      effects: []  # TODO ADR-082+ — needs BetweenSessionIncome variant

    - id: the_current_followed_home
      label: "The Current Followed Home"
      narration_hint: |
        Hant reaches the Deep Hollows again. The hive remembers him. One
        hive-kin appears in the next session as a resource — a scout, a
        messenger, a second voice in a working.
      permanent_effect: "One hive-kin NPC available 1/session."
      effects:
        - { type: lore_reveal_bonus, scope: deep_hollows }

    - id: bard_of_no_ones_court
      label: "Bard of No One's Court"
      narration_hint: |
        Hant renounces the pheromone-courts. He composes for the surface
        now, permanently. The hive no longer answers — but his surface
        work gains weight.
      permanent_effect: "Surface compositions gain narrator-honored authority."
      effects:
        - { type: edge_max_bonus, amount: 2 }
