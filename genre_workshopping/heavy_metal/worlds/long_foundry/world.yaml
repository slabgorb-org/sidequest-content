name: The Long Foundry
slug: long_foundry
cover_poi: the_long_span
description: >-
  A foundry-city straddling a slow iron-rich river, where Kragmoor
  guild sorcerers work shifts and the air is never without the
  residues of the day's thaumaturgy. The old Perault houses hold
  quiet courts in the high quarter, Astran temples keep their
  feeding ledgers in the temple precinct, and the hills east of the
  span are being excavated by scholars who should probably stop.
  Every empire is ending. Every account is a little overdue. The
  city is still working, for now, and still magnificent.
