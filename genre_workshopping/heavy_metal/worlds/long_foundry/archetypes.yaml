- name: Inheritor with an Inconvenient Debt
  description: >-
    A scion of one of the old Perault houses carrying a covenant they
    did not sign. They travel under an assumed name, spend their days
    avoiding creditors they've never met, and know more about the
    wording of their ancestors' pacts than they would ever willingly
    admit. The geas is quiet, for now. It will not be quiet forever.
  personality_traits:
    - composed
    - cautious with names
    - haunted by an obligation that is not theirs
  typical_classes:
    - Fighter
    - Paladin
  typical_races:
    - Human
    - Elf
  stat_ranges:
    charisma: [12, 16]
    wisdom: [12, 16]
  catalog_items:
    - sword_iron
    - leather_armor_worn
  inventory_hints:
    - a letter of safe-conduct in someone else's handwriting
    - a ring whose sigil they do not wear openly
    - a small notebook of dates they refuse to explain
  dialogue_quirks:
    - answers questions with further questions, politely
    - corrects their own pronouns when talking about their family
  disposition_default: 0
  ocean:
    openness: 5.0
    conscientiousness: 7.0
    extraversion: 3.0
    agreeableness: 5.0
    neuroticism: 6.5

- name: Grey Thaumaturge
  description: >-
    A Kragmoor guild sorcerer who hires their working out by the day.
    Not a court wizard, not a hedge witch — a tradesman. They keep
    their ledger in a small leather book, settle their debts monthly,
    and do not work on credit. Their hands are stained with the
    residues of whatever materials they used most recently, and their
    clothes smell faintly of the forge-quarter where they take their
    meals.
  personality_traits:
    - matter-of-fact
    - meticulous
    - politely unsentimental
  typical_classes:
    - Sorcerer
    - Wizard
  typical_races:
    - Human
    - Dwarf
  stat_ranges:
    intelligence: [14, 18]
    constitution: [10, 14]
  catalog_items:
    - spellbook
    - dagger_iron
  inventory_hints:
    - a guild-mark token, worn on a cord
    - a small leather ledger with the day's debits
    - a pouch of reagents weighed out in precise doses
  dialogue_quirks:
    - quotes their rates before they quote their opinions
    - uses the word "work" where most people would say "spell"
  disposition_default: 5
  ocean:
    openness: 6.0
    conscientiousness: 7.5
    extraversion: 4.0
    agreeableness: 5.0
    neuroticism: 3.5

- name: The Collector at the Door
  description: >-
    An itinerant specialist who arrives when an account has been
    quiet too long. They carry the right papers, the right memorized
    precedents, and the authority — legal, ritual, or older — to
    extract payment. They are rarely violent, but they are always
    absolute. The best thing that can happen to a household is that
    the Collector leaves satisfied. The second-best is that they
    leave at all.
  personality_traits:
    - patient
    - precise
    - quietly implacable
  typical_classes:
    - Rogue
    - Bard
  typical_races:
    - Human
    - Halfling
  stat_ranges:
    intelligence: [14, 16]
    charisma: [12, 16]
  inventory_hints:
    - a sealed writ naming the debt and the creditor
    - a small, very sharp knife kept in a coat lining
    - a ledger stamped by three separate authorities
  dialogue_quirks:
    - addresses people by the name on the paperwork, never the one they prefer
    - never raises their voice, and never has to
  disposition_default: -5
  ocean:
    openness: 4.0
    conscientiousness: 8.5
    extraversion: 4.5
    agreeableness: 3.0
    neuroticism: 2.5

- name: Feed-keeper
  description: >-
    An Astran priest whose life is the maintenance of a specific
    feeding. They administer the rites, keep the ledgers, measure
    the offerings, and know exactly how their god is doing this
    month. They are not mystics. They are clerks — careful,
    conservative, and quietly frightened of missing a meal.
  personality_traits:
    - precise
    - mild
    - privately anxious
  typical_classes:
    - Cleric
  typical_races:
    - Human
    - Elf
  stat_ranges:
    wisdom: [14, 18]
    charisma: [10, 14]
  catalog_items:
    - holy_symbol
  inventory_hints:
    - a tally-stick marked for the current month's offerings
    - vestments with fine, specific pattern-work
    - a small carved token whose purpose they will not explain
  dialogue_quirks:
    - speaks in the cadence of a liturgy even during small talk
    - keeps track of time in rite-hours rather than clock-hours
  disposition_default: 5
  ocean:
    openness: 3.5
    conscientiousness: 9.0
    extraversion: 3.5
    agreeableness: 6.0
    neuroticism: 6.0

- name: Flesh-ledger Laborer
  description: >-
    An Orvinnic worker whose body carries the visible marks of a
    covenant they inherited at birth. The marks are not
    disfigurements — they are an accounting, written in the skin.
    They work a specific trade, and their craft is tied directly to
    the terms of their covenant: a weaver whose threads remember
    things they should not, a mason whose walls keep counts that
    never turn out wrong. They are usually quiet. They are usually
    kinder than they need to be.
  personality_traits:
    - quiet
    - patient
    - privately generous
  typical_classes:
    - Warlock
    - Cleric
  typical_races:
    - Human
  stat_ranges:
    constitution: [14, 18]
    charisma: [10, 14]
  inventory_hints:
    - a well-kept tool of their trade
    - a small charm tied with cord — the kin-token of the bound
    - a set of counting-beads worn smooth from use
  dialogue_quirks:
    - doubles their own name when introducing themselves formally
    - refers to their patron obliquely, never directly
  disposition_default: 10
  ocean:
    openness: 5.0
    conscientiousness: 7.5
    extraversion: 3.0
    agreeableness: 7.5
    neuroticism: 5.0

- name: Pilgrim on the Long Path
  description: >-
    A devotee of the Path-Eater, seen and not seen along the
    pilgrim-roads of the current age. They are road-worn, often
    strangely older than their birthdate should allow, and walk
    with the steady, unforced rhythm of someone who measures the
    world in steps. They carry little. They speak rarely. They
    know which roads are longer than they were.
  personality_traits:
    - taciturn
    - observant
    - quietly devout
  typical_classes:
    - Monk
    - Ranger
  typical_races:
    - Human
    - Halfling
  stat_ranges:
    constitution: [12, 16]
    wisdom: [14, 18]
  catalog_items:
    - walking_staff
  inventory_hints:
    - a pilgrim-token stamped with a specific route
    - well-worn boots, resoled more than once
    - a small bowl for offerings along the way
  dialogue_quirks:
    - measures distances in days, not in leagues
    - mentions roads the way others mention people
  disposition_default: 5
  ocean:
    openness: 5.5
    conscientiousness: 6.5
    extraversion: 2.0
    agreeableness: 5.5
    neuroticism: 3.0

- name: Refuser Scholar
  description: >-
    An academic, usually Thessil-descended or Astran-trained, who
    specializes in the ruins of the Refuser stratum — the buried
    civilization that tried to escape the feeding economy. They
    are the most educated and least reassured person in any room.
    They keep their notebooks close. They will not always tell
    you what they are looking for, and they will rarely tell you
    what they have found.
  personality_traits:
    - erudite
    - withdrawn
    - carrying a specific private dread
  typical_classes:
    - Wizard
    - Bard
  typical_races:
    - Human
    - Elf
  stat_ranges:
    intelligence: [15, 18]
    wisdom: [12, 16]
  inventory_hints:
    - a notebook in a cipher of their own devising
    - rubbings of inscriptions from a ruin they have not told anyone about
    - a small metal object whose purpose they will not name
  dialogue_quirks:
    - pauses mid-sentence to reconsider what they were about to say
    - uses archaic terms without noticing the effect
  disposition_default: 0
  ocean:
    openness: 9.0
    conscientiousness: 7.0
    extraversion: 2.0
    agreeableness: 4.0
    neuroticism: 7.0
