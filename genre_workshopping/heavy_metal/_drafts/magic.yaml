# magic.yaml — heavy_metal genre layer
#
# Status: DRAFT — schema validation pass for the magic-taxonomy framework
# Reference: docs/design/magic-taxonomy.md
# Purpose: validate that the napkin's structure can hold the most fully-elaborated
#   magic system in the repo without losing fidelity. Heavy Metal's cosmology
#   is the most napkin-aligned content in the codebase — if the schema can't
#   capture it, the schema is wrong, not the cosmology.
#
# The Long Reckoning is heavy_metal's signature world; this magic.yaml lives
# at the genre layer and declares the *space of allowable tuples*. Worlds
# (including The Long Reckoning) commit to specific tuples in their own
# worlds/<world>/magic.yaml.

magic:
  # ─────────────────────────────────────────────────────────────────────
  # ONTOLOGY — how much magic exists?
  # ─────────────────────────────────────────────────────────────────────
  intensity:
    # heavy_metal's gravity axis already scales consequence weight; magic
    # intensity rides it. At low gravity, the ledger is forgiving;
    # at high gravity (default), every working bills five scales at once.
    dial: gravity
    default: 0.85
    floor: 0.4    # magic cannot dial below this — heavy_metal is never light

  # ─────────────────────────────────────────────────────────────────────
  # EPISTEMOLOGY — does the world know magic exists?
  # ─────────────────────────────────────────────────────────────────────
  world_knowledge:
    default: acknowledged
    permitted: [acknowledged]
    # Heavy Metal commits — the cosmology states the metaphysical economy
    # as fact. Worlds cannot dial to denied/classified; the ledger is real
    # and everyone knows. Pretending otherwise breaks the genre.
    rationale: |
      The cosmology asserts that gods are real, specific, and hungry; that
      churches are feeding operations; that obligation propagates at five
      scales. A world where the populace doesn't know this isn't heavy_metal —
      it's gothic-pulp or low-fantasy.

  # ─────────────────────────────────────────────────────────────────────
  # SOCIOLOGY — given knowledge, how is magic socially treated?
  # ─────────────────────────────────────────────────────────────────────
  visibility:
    default: regulated
    permitted: [regulated, feared, persecuted]
    # Working religious bureaucracies, sorcerer guilds, witch-burnings —
    # all valid heavy_metal flavors. Never ubiquitous, never celebrated
    # without caveat.

  # ─────────────────────────────────────────────────────────────────────
  # SOURCES — where the power comes from
  # ─────────────────────────────────────────────────────────────────────
  allowed_sources:
    - id: bargained_for
      label: Bargained-for
      always_available: true
      examples: [demonic pact, fae compact, crossroads deal, soul-debt]
      narrator_note: |
        The signature heavy_metal source. Every pact has an account-holder;
        the bill comes due. Sorcerers who outlive their patrons are the
        luckiest people in the world.

    - id: innate
      label: Innate (inherited / acquired)
      always_available: true
      flavors: [born_with, acquired_via_event]
      # The covenant-peoples (born_with) and the stratigraphic-touched
      # (acquired_via_event) collapse into a single Innate Source. Both
      # carry obligation from outside one's choosing; both manifest as
      # debt-assumed-without-consent.
      examples:
        - "bloodline curse, covenant-people biology, marked-at-birth (born_with)"
        - "touched by the un-closed, stratigraphic exposure (acquired_via_event)"
      narrator_note: |
        Heavy Metal Innate is debt-assumed-without-consent. Covenant-peoples
        carry contract via biology; the stratigraphic-touched carry it via
        unwitting exposure. The character did not bargain — yet the bill
        accrues. The covenant-peoples scale of obligation lives here.
      narrative_only_for: [acquired_via_event]    # only born_with is a player-build option

    - id: divine
      label: Divine
      always_available: true
      examples: [feeding-cult priesthood, oracle, hierophant, blessed-cursed]
      narrator_note: |
        Gods are real, specific, and hungry. Divine magic is *participation
        in the feeding economy*, not communion. Failure to feed has
        predictable consequences, none of them good.
      plugin: divine_v1

    - id: learned
      label: Learned (ritual knowledge)
      always_available: true
      examples: [grimoires, communal rites, hierophantic training]
      narrator_note: |
        Heavy Metal does not allow "studied and cast" magic. Learned magic
        means knowing *which ledger to debit* and *what to feed it*. Theory
        without obligation does nothing.
      plugin: learned_v1

    - id: item_based
      label: Item-based
      always_available: true
      mechanisms: [discovery, relational, faction, condition, mccoy]
      examples: [bargained blade, relic, stratigraphic artifact, smith-forged regalia]
      narrator_note: |
        Items are pacts in object form. The blade drinks. The relic
        remembers what was promised. Stratigraphic artifacts (the
        un-closed pacts of older civilizations) are particularly
        dangerous — the account-holder may no longer exist to honor
        the contract. mccoy mechanism (smith-flavor) covers the
        wizard-smith forging once.
      plugin: item_legacy_v1

    # bargained_for inherited from the top of this section's list
    # NOT permitted:
    # - mccoy as a Source (it's now a delivery mechanism for item_based)

  # ─────────────────────────────────────────────────────────────────────
  # COST — what does using magic take?
  # ─────────────────────────────────────────────────────────────────────
  required_costs:
    # Every working MUST surface at least one of these. The narrator
    # cannot describe magic without naming the bill.
    - soul_debt
    - vitality
    - sanity
    - components
    - time
    - karma         # heavy_metal calls this "obligation"
  cost_panoply: full  # all napkin cost types are in scope

  # ─────────────────────────────────────────────────────────────────────
  # OBLIGATION SCALES — heavy_metal's signature feature
  # ─────────────────────────────────────────────────────────────────────
  # The cosmology states that obligation propagates at five scales.
  # Every magical act debits one or more. The schema captures this as
  # a tag set the narrator can attach to any working.
  obligation_scales:
    - id: individual
      label: Individual pacts
      description: One soul, one bargain. The classical Faustian unit.
    - id: communal
      label: Communal rituals
      description: A village, a guild, a quarter — feeding a shared debt.
    - id: covenant
      label: Covenant-peoples
      description: A whole population whose biology is a continuing contract.
    - id: divine
      label: Divine apparatus
      description: Organized feeding of gods through religious bureaucracy.
    - id: stratigraphic
      label: Stratified prehistory
      description: The un-closed pacts of older civilizations, still live in the bedrock.
  obligation_invariant: |
    A single act of magic can debit any combination of these. The caster
    does not always know where the bill is being sent. This uncertainty
    is the load-bearing dramatic engine of heavy_metal magic.

  # ─────────────────────────────────────────────────────────────────────
  # LIMITS — the genre's named impossibilities
  # ─────────────────────────────────────────────────────────────────────
  hard_limits:
    # Mirrors rules.yaml banned_spells, with the napkin's vocabulary
    resurrection: forbidden               # banned: True Resurrection, Raise Dead
    true_creation: forbidden              # implicit; no ex-nihilo workings
    plane_shift: forbidden                # banned: Gate, Plane Shift, Teleport
    high_evocation_unlimited: forbidden   # banned: Meteor Swarm, Power Word Kill
    wish_fulfillment: forbidden           # banned: Wish
    mind_compulsion: with_cost
    permanence_without_renewal: forbidden # all workings decay unless re-fed

  soft_limits:
    # Allowed, but the bill scales with ambition
    range: bounded_by_obligation
    self_targeting: allowed_with_cost
    repeatability: allowed_but_ledger_compounds

  # ─────────────────────────────────────────────────────────────────────
  # RELIABILITY — does it work when invoked?
  # ─────────────────────────────────────────────────────────────────────
  reliability:
    default: negotiated
    permitted: [negotiated, skill_checked, faith_gated]
    # Heavy Metal magic always answers, but the answer may bill differently
    # than expected. Negotiated is the dominant mode — the account-holder
    # decides the terms.

  # ─────────────────────────────────────────────────────────────────────
  # COUNTER — how is magic fought?
  # ─────────────────────────────────────────────────────────────────────
  counter:
    - id: opposing_pact
      description: Another sorcerer with a sufficient debt of their own
    - id: account_holder_intervention
      description: The patron of the working refusing or revoking
    - id: stratigraphic_disruption
      description: Walking on bedrock with un-closed pacts — magic stalls
    - id: faith_against_faith
      description: Divine magic countered by another god's hunger
    - id: severance
      description: Cutting the obligation chain — fatal to caster

  # ─────────────────────────────────────────────────────────────────────
  # MANIFESTATION — Mode × Domain
  # ─────────────────────────────────────────────────────────────────────
  manifestation:
    modes: [invoked, ritual, item_channeled, reflexive]
    # Reflexive admitted only for innate sources (covenant-peoples or
    # stratigraphic-touched); never for learned. Heavy Metal magic
    # does not "go off."
    domains:
      - elemental
      - physical
      - psychic
      - necromantic         # constrained — see hard_limits.resurrection
      - illusory
      - divinatory
      - transmutative
      - alchemical
      - spatial             # gated — local only, no plane-shift
    domain_constraints:
      necromantic: "communing only; no resurrection, no animation as labor"
      spatial: "local distortion only; no teleport, no portals"
      divinatory: "asking is allowed; the answer may be deceptive or unwanted"

  # ─────────────────────────────────────────────────────────────────────
  # NARRATOR INSTRUCTIONS
  # ─────────────────────────────────────────────────────────────────────
  narrator_register: |
    Magic in heavy_metal is never casual and never free. Every working is
    a withdrawal from a ledger; the narrator must surface the cost in the
    same beat as the effect. Use the five obligation scales as a tag set —
    a working may debit one, three, or all five. The caster does not
    always know where the bill goes. Gods are specific and hungry; treat
    divine workings as participation in a feeding economy, not as
    communion or grace. Sorcerers who outlive their patrons are lucky;
    everyone else is paying. Do not narrate magic as study-and-cast.
    Do not narrate magic without consequence. Do not narrate workings
    that violate hard_limits — those spells do not exist in this world,
    and a caster who attempts them debits the stratigraphic scale and
    pays in something the player has not yet thought to fear.

  # ─────────────────────────────────────────────────────────────────────
  # PLAYER OPTIONS
  # ─────────────────────────────────────────────────────────────────────
  player_options:
    can_build_caster: true            # Cleric, Druid, Bard exist (rules.yaml)
    can_acquire_in_play: true         # items, pacts, inheritance arcs
    chargen_caster_classes: [Cleric, Druid, Bard]
    chargen_pact_required: true       # any caster build must declare a patron
    pact_visibility_to_player: partial  # the player knows some terms; not all

  # ─────────────────────────────────────────────────────────────────────
  # SCHEMA VALIDATION NOTES
  # ─────────────────────────────────────────────────────────────────────
  _schema_validation:
    framework_version: "draft-2026-04-27"
    captures_existing_content:
      cosmology: yes              # full coverage
      banned_spells: yes          # mapped to hard_limits
      allowed_classes: yes        # mapped to player_options.chargen_caster_classes
      gravity_axis: yes           # bound to intensity dial
      spell_components_strict: yes  # mapped to required_costs.components
      death_saves_hard: yes       # implicit in vitality cost
    extensions_beyond_existing:
      obligation_scales: "new — captures the five-scale propagation rule"
      cost_panoply: "new — explicit listing of admissible cost types"
      stratigraphic_counter: "new — uses heavy_metal's unique geography"
    notes_for_review:
      - "Pre-Ordained removed from Source list (resolved 2026-04-27 — narrative role, not Source)"
      - "obligation_scales is heavy_metal-specific — handled via plugin/registration model"
      - "Vehicle as item subtype not relevant for heavy_metal (low-tech genre)"
