- id: implant_glitch
  archetype: mystery
  situation: >-
    The player's neural implant malfunctions — showing data that shouldn't
    exist, memories that aren't theirs, or a message from someone who died
    six months ago. Reality is unreliable. Trust nothing displayed.
  tone: disorienting, paranoid
  avoid:
    - anonymous comm job offers
    - simple data courier missions
    - friendly fixer introductions
  first_turn_seed: >-
    Your optics glitch — static, then a face you don't recognize saying
    your real name. The one you buried three identities ago.

- id: identity_burn
  archetype: survival
  situation: >-
    The player's cover identity has been compromised. Corp security,
    street gangs, or someone worse now knows who they are. Every camera
    is a threat. Every crowd is a trap. They need to disappear — fast.
  tone: hunted, claustrophobic
  avoid:
    - casual job hunting
    - bar scene introductions
    - exposition from fixers
  first_turn_seed: >-
    Your face is on every screen in the district. Not a wanted poster —
    an auction. Someone is selling your location in real time.

- id: heist_in_progress
  archetype: challenge
  situation: >-
    The player is mid-operation when something goes wrong. The plan was
    solid but reality disagrees. Alarms, locked doors, guards that weren't
    in the briefing. Adapt or get flatlined.
  tone: high-stakes, improvisational
  avoid:
    - job setup scenes
    - meeting the crew
    - planning phase
  first_turn_seed: >-
    The alarm wasn't supposed to trigger for another ninety seconds. The
    vault door is still locked. And the exit you came in through just sealed.

- id: blackout_wake
  archetype: survival
  situation: >-
    The player wakes with gaps in their memory — hours or days missing.
    They're somewhere they don't recognize, wearing clothes that aren't
    theirs, with bruises they can't explain. Piecing together what happened
    IS the opening.
  tone: noir, unsettling
  avoid:
    - clean starting position
    - NPC briefings
    - job offers
  first_turn_seed: >-
    You don't know this room. The blood on your hands is dry. There's a
    credstick in your pocket loaded with more than you've ever seen.
    And a message on your optics: "Don't go home."
