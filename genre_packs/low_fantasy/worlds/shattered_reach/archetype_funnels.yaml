funnels:

  # ── Iron Accord Soldiers & Defenders ───────────────────────────────────────
  - name: Accordkeeper
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Merchant Consortium
    lore: >-
      The Merchant Consortium's private enforcement arm, tasked with holding
      the Iron Accord's checkpoints and keeping the trade roads passable.
      Accordkeepers are drawn from veteran sellswords who traded freelance
      chaos for steady wages and a tabard. They are better equipped than
      most lords' soldiers and know it — which breeds a certain cold
      professionalism that makes common folk uneasy and bandits careful.
    cultural_status: respected by merchants and travelers, resented by petty lords
    disposition_toward:
      The Crown Remnant: wary
      The Thornfield Freeholders: transactional
      The Order of the Ashen Veil: cautious

  - name: Hearthguard
    absorbs:
      - [hero, dps]
      - [hero, jack_of_all_trades]
    faction: The Crown Remnant
    lore: >-
      Sworn swords who serve the Crown Remnant's fortified towns — not the
      ceremonial guards of a stable monarchy but fighters who have held a
      wall against raiders and know what a real siege smells like. The name
      comes from the old Brevonne phrase for those who stand between the
      hearth and the door. Hearthguards carry themselves with a mix of
      pride and exhaustion; the cause of reunification burns in them, but
      the years are long and the Duchess's coin is often late.
    cultural_status: honored in Crown territory, seen as loyalist relics elsewhere
    disposition_toward:
      The Merchant Consortium: transactional
      The Thornfield Freeholders: hostile

  # ── Scouts, Wanderers & Rogues ─────────────────────────────────────────────
  - name: Greyvein Runner
    absorbs:
      - [explorer, stealth]
      - [explorer, jack_of_all_trades]
    faction: null
    lore: >-
      The Greyvein River and its tributaries form the Reach's only reliable
      highways, and the Runners are the unaffiliated pilots, scouts, and
      go-betweens who know every bend. They move between towns carrying
      messages, contraband, and the occasional paying passenger who cannot
      afford to ask questions. No faction fully trusts them, which is
      precisely why all factions use them. A Greyvein Runner's neutrality
      is their most valuable commodity.
    cultural_status: indispensable, trusted by no one, used by everyone
    disposition_toward:
      The Order of the Ashen Veil: avoidant

  - name: Thornfield Scout
    absorbs:
      - [outlaw, stealth]
      - [jester, stealth]
    faction: The Thornfield Freeholders
    lore: >-
      The Freeholders' answer to standing armies is a loose network of
      scouts who know the border terrain by feel in the dark. They operate
      without uniforms, chain of command, or mercy for Accord toll-riders
      who cross unmarked into Freeholder land. The jester's edge in this
      role is real — a Scout who can talk her way past a checkpoint is
      worth three who cannot, and dark humor keeps them sane between the
      watching and the waiting.
    cultural_status: folk heroes in Freeholder villages, outlaws to the Accord
    disposition_toward:
      The Merchant Consortium: hostile
      The Crown Remnant: hostile

  - name: Dustblade
    absorbs:
      - [outlaw, dps]
      - [jester, dps]
    faction: null
    lore: >-
      The western hills are lousy with played-out silver mines and the
      hard men who never left after the ore ran out. Dustblades are
      freelance fighters who live in that grey country between mercenary
      and bandit — they take work where they find it and ask fewer
      questions the hungrier they are. The name is Khorvath slang for a
      blade worn to a nub by too much use and not enough pay. The Jester
      variant is the one who whistles while he bleeds on you.
    cultural_status: useful when controlled, dangerous when not
    disposition_toward:
      The Order of the Ashen Veil: avoidant

  - name: Ink-Hand Fixer
    absorbs:
      - [outlaw, control]
    faction: The Merchant Consortium
    lore: >-
      Every Consortium trade house keeps at least one Ink-Hand on retainer —
      a specialist who resolves problems through blackmail, forgery, bribery,
      and the carefully timed revelation of embarrassing debts. The name
      comes from the ink-stained fingers of someone who has read too many
      other people's private ledgers. They work entirely through leverage
      and information, and their greatest weapon is the fact that they never
      need to draw a blade.
    cultural_status: feared, useful, socially invisible
    disposition_toward:
      The Crown Remnant: predatory
      The Thornfield Freeholders: dismissive

  # ── Healers, Clergy & Carers ───────────────────────────────────────────────
  - name: Pale Fire Mendicant
    absorbs:
      - [sage, healer]
      - [innocent, healer]
      - [caregiver, healer]
    faction: The Order of the Ashen Veil
    lore: >-
      Not every Ashen Veil adherent is an inquisitor burning hedge witches.
      The Mendicants are the Order's traveling healers — austere, self-denying,
      and genuinely effective with wound-craft and fever-breaking. They
      charge nothing and accept only prayers and floor space. Common folk
      receive them warmly, even those who distrust the Order's inquisition
      branch. The Mendicant's faith teaches that suffering is purgative,
      so they dress wounds without complaint and frequently suffer alongside
      their patients.
    cultural_status: welcomed in villages, tolerated in towns, watched by the wise
    disposition_toward:
      The Merchant Consortium: indifferent
      The Thornfield Freeholders: tense

  - name: Thornwife
    absorbs:
      - [caregiver, support]
      - [lover, healer]
      - [innocent, support]
    faction: The Thornfield Freeholders
    lore: >-
      Freeholder communities have no professional clergy and little coin
      for trained healers, so the Thornwife fills every gap: midwife,
      herbalist, grief-counselor, and the person you go to when the
      Mendicant isn't within three days' walk. The title is gender-neutral
      in practice — what matters is the knowledge and the willingness to
      be awake at 3 a.m. when someone needs you. They are the social fabric
      of their village and the first person any outsider should befriend.
    cultural_status: beloved and essential in Freeholder settlements
    disposition_toward:
      The Order of the Ashen Veil: deeply suspicious

  # ── Scholars, Strategists & Advisors ──────────────────────────────────────
  - name: Compact Scholar
    absorbs:
      - [sage, control]
      - [sage, support]
    faction: The Merchant Consortium
    lore: >-
      The Consortium funds a small college of scholars whose job is to
      know everything that could affect trade — border disputes, plague
      vectors, succession crises, the crop yield three territories over.
      Compact Scholars serve as advisors, negotiators, and the people in
      the room who have already read the treaty that everyone else is
      arguing about. They are politically neutral in theory and Consortium
      assets in practice, which they are not always comfortable with.
    cultural_status: prestigious, slightly suspect, indispensable at any negotiation
    disposition_toward:
      The Crown Remnant: analytical
      The Order of the Ashen Veil: wary

  - name: War-Reader
    absorbs:
      - [ruler, support]
    faction: The Crown Remnant
    lore: >-
      Duchess Maren Aldric keeps a cadre of War-Readers — veterans who
      have shifted from the blade to the map table and now advise on
      troop movements, supply chains, and the political geometry of
      alliance-building. The title comes from the old Nordmark tradition
      of reading the field before committing to a fight. They are
      strategists without sentimentality; they burned through that in the
      war and never found where to buy more.
    cultural_status: respected within Crown Remnant, invisible to everyone else
    disposition_toward:
      The Merchant Consortium: calculating
      The Thornfield Freeholders: contemptuous

  # ── Practitioners of the Arcane (and the hunted) ───────────────────────────
  - name: Cinder Witch
    absorbs:
      - [magician, control]
      - [magician, dps]
    faction: null
    lore: >-
      Magic exists in the Reach, small and close and dangerous. The Order
      of the Ashen Veil calls it corruption. Everyone else just calls it
      trouble. Cinder Witches are practitioners who have survived long
      enough to get careful — they hide in plain sight, take unassuming
      occupations, and deploy their craft quietly. The name is derogatory,
      reclaimed. Some of them work for the Freeholders. Some of them work
      for themselves. None of them advertise.
    cultural_status: feared, illegal in Crown territory, tolerated in the borderlands
    disposition_toward:
      The Order of the Ashen Veil: hunted
      The Crown Remnant: fugitive

  # ── Common Folk & Working Survivors ───────────────────────────────────────
  - name: Road-Worn
    absorbs:
      - [everyman, jack_of_all_trades]
      - [everyman, support]
    faction: null
    lore: >-
      Most people in the Reach are just trying to get from here to there
      without becoming a cautionary tale. The Road-Worn are those who have
      been at it long enough to know all three routes out of any town and
      which inn water doesn't give you the flux. They are not heroes, not
      scholars, not fighters by preference — they are survivors with broad
      competence and low expectations, which in the Reach is often enough.
    cultural_status: unremarkable, which is exactly the point

  # ── Performers, Artists & Social Operators ─────────────────────────────────
  - name: Accord Minstrel
    absorbs:
      - [artist, support]
      - [lover, support]
    faction: null
    lore: >-
      Traveling performers are the Reach's informal news network, therapy
      service, and diplomatic lubricant all at once. A skilled Accord
      Minstrel knows which lord's ego needs stroking before a negotiation,
      which rumors to amplify and which to bury, and how to make a tense
      room breathe again with the right song. The Merchant Consortium
      quietly subsidizes the good ones. The Order of the Ashen Veil
      quietly watches all of them.
    cultural_status: welcome everywhere in theory, trusted nowhere in practice
    disposition_toward:
      The Order of the Ashen Veil: carefully respectful

  - name: Memory-Keeper
    absorbs:
      - [artist, control]
    faction: The Crown Remnant
    lore: >-
      The Crown Remnant's court historian is called the Memory-Keeper, and
      the role is more politically powerful than it sounds. Controlling
      the official record of the Sundering — who burned what, who betrayed
      whom, whose claim is oldest — is a form of soft dominance that
      Duchess Maren Aldric understands completely. The Memory-Keeper shapes
      narrative rather than wielding a blade, and in the politics of
      fractured succession, narrative is the sharpest weapon available.
    cultural_status: prestigious within Crown Remnant, regarded with suspicion by rivals
    disposition_toward:
      The Thornfield Freeholders: revisionist
      The Merchant Consortium: professionally courteous
