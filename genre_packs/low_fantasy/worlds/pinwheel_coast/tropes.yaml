# Pinwheel Coast world tropes — factions, magic debris, and scholarly rivalries.

- id: beaumont_debris
  name: Beaumont's Debris
  description: >-
    Another fragment of Saint Beaumont's Ladder has surfaced — crystallized
    moonlight washing ashore, or embedded in a cliff face exposed by storms.
    The Lamplighters want it for research. The Regatta Commission wants it
    cleared from the racing lanes. Everyone else wants to sell it.
  category: mystery
  triggers:
    - finding crystallized moonlight fragments
    - the Lamplighters mobilizing researchers
    - strange magical effects along the coast
  narrative_hints:
    - fishermen pulling up nets that glow
    - lighthouse beams bending toward the debris field
    - tides behaving unusually near fragment deposits
  tension_level: 0.5
  resolution_hints:
    - recover the fragment for the Lamplighters
    - sell it to the highest bidder
    - destroy it before it causes another Folly
    - use it as leverage between factions
  tags: [magic, factions, mystery, coast]
  escalation:
    - at: 0.25
      event: >-
        A fragment washes up on the beach near a fishing village. It hums
        faintly and the local cats won't go near it. A Lamplighter arrives
        within hours, offering to buy it. The village elder isn't selling.
      npcs_involved: [The Lamplighter]
      stakes: A magical artifact in civilian hands.
    - at: 0.5
      event: >-
        The fragment is attracting more fragments. Smaller shards are
        drifting along the coast toward the first one. The Regatta
        Commission declares the area a navigation hazard and demands
        removal. The Lamplighters demand research access.
      npcs_involved: [The Lamplighter, The Commissioner]
      stakes: Two factions with competing claims and no patience.
    - at: 0.75
      event: >-
        The accumulated fragments begin to do something — light bends
        around them, tides reverse locally, and anyone who sleeps near
        them dreams of a ladder stretching to the moon. The Lamplighters
        are ecstatic. Everyone else is terrified.
      npcs_involved: [The Lamplighter]
      stakes: Whatever Beaumont was building might be rebuilding itself.
    - at: 1.0
      event: >-
        The fragments assemble. A partial structure of crystallized
        moonlight rises from the beach, beautiful and impossible. The
        Lamplighters say it's the discovery of a lifetime. The Warding
        Keepers say it's the Folly happening again. Someone has to decide.
      npcs_involved: [The Lamplighter, The Commissioner]
      stakes: History repeating, or history completing.
  passive_progression:
    rate_per_turn: 0.012
    rate_per_day: 0.03
    accelerators: [fragment, moonlight, ladder, beaumont, crystal]
    decelerators: [destroy, bury, distance, ignore]
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03

- id: glass_waste_claim
  name: The Glass Waste Claim
  description: >-
    The Glasswrights of Solenne are expanding their claim on the Glass
    Waste, and the old Khorvath steppe-clans say enough. The fused
    earth is a mass grave, not a quarry. The Glasswrights say it's
    both, and the dead don't need sovereignty.
  category: conflict
  triggers:
    - encountering Glasswrights expanding operations
    - hearing Khorvath grievances about the Glass Waste
    - trade disputes over glass-craft goods
  narrative_hints:
    - new Glasswright workshops opening on disputed ground
    - Khorvath riders watching the Waste's edge in silence
    - glass-edged weapons appearing in unexpected hands
  tension_level: 0.5
  escalation:
    - at: 0.25
      event: >-
        The Glasswrights begin quarrying a new section of the Waste.
        The steppe-clans say it's consecrated ground — the Burned
        Ones rest there. The Glasswrights offer compensation. The
        clans find the offer insulting.
      npcs_involved: [The Glasswright Master]
      stakes: Cultural heritage versus economic necessity.
    - at: 0.5
      event: >-
        A Khorvath rider destroys a Glasswright quarry camp at night.
        No one killed, but the message is clear. The Glasswrights
        respond by hiring mercenaries. The steppe-clans respond by
        sending riders.
      npcs_involved: [The Glasswright Master, The Steppe Elder]
      stakes: Escalation from politics to violence.
    - at: 0.75
      event: >-
        The quarrying has disturbed something — the glass is singing.
        A low tone audible for miles, and the Burned Ones' ghosts are
        visible again, drifting across the Waste at dusk. Both sides
        claim this proves their case.
      npcs_involved: [The Glasswright Master, The Steppe Elder]
      stakes: The dead are restless. Both sides blame the other.
    - at: 1.0
      event: >-
        The Glass Waste cracks. The singing stops. What's beneath
        the fused earth is visible for the first time — and it isn't
        just the dead. Something was built down there before the
        flash, and it's still intact.
      npcs_involved: [The Glasswright Master, The Steppe Elder]
      stakes: What's under the Glass Waste changes everything.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.025
    accelerators: [glass, khorvath, quarry, waste, burned]
    decelerators: [negotiate, peace, trade, distance]
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03

- id: regatta_season
  name: The Pinwheel Regatta
  description: >-
    The annual sailing race around the Pinwheel Coast is approaching.
    It's the biggest event of the year — commerce, politics, espionage,
    and genuine athletic competition all wrapped in nautical pageantry.
    Everyone has something riding on the outcome.
  category: event
  triggers:
    - the sailing season approaching
    - factions positioning for regatta advantage
    - unusual bets or wagers on the outcome
  narrative_hints:
    - ships being refitted in every harbor
    - Lamplighters sabotaging race buoys again
    - betting odds shifting on suspiciously specific information
  tension_level: 0.4
  escalation:
    - at: 0.25
      event: >-
        Registration opens and an unexpected entrant appears — a ship
        from outside the Pinwheel Coast, flying no recognized colors,
        with a crew that nobody can identify. The Commission is nervous.
      npcs_involved: [The Commissioner]
      stakes: An unknown quantity in a race where everyone knows everyone.
    - at: 0.5
      event: >-
        Sabotage. Two favored ships damaged overnight in harbor. The
        Lamplighters deny involvement despite their documented history
        of sabotaging race buoys. The Commission threatens to cancel
        the regatta. The economy of four towns says they can't.
      npcs_involved: [The Commissioner, The Lamplighter]
      stakes: The regatta is too important to cancel and too compromised to run clean.
    - at: 0.75
      event: >-
        Race day. The mystery ship takes an impossible lead — sailing
        through water that should be unnavigable, near the debris field
        where the fragments hum. Their sails catch light that isn't wind.
      npcs_involved: [The Commissioner]
      stakes: Someone is using Beaumont's debris to cheat. Or it's using them.
    - at: 1.0
      event: >-
        The finish line is chaos. The mystery ship crosses first but
        the debris field is pulsing. The Lamplighters are arguing with
        the Commission. A storm is building that shouldn't exist. The
        regatta is over. What comes next is not.
      npcs_involved: [The Commissioner, The Lamplighter]
      stakes: The regatta has awakened something in the debris field.
  passive_progression:
    rate_per_turn: 0.015
    rate_per_day: 0.04
    accelerators: [regatta, race, ship, sail, coast, competition]
    decelerators: [delay, cancel, storm, inland]
    accelerator_bonus: 0.05
    decelerator_penalty: 0.03
