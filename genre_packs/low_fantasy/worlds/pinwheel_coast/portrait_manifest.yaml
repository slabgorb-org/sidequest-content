# Character portraits for Pinwheel Coast
# Visual descriptions for Flux portrait generation
# Maritime fantasy — weathered coastal life, scholarly eccentricity,
# glass-craft elegance, sea-salt practicality

characters:
  - name: Magister Calluna Vos
    role: Senior Lamplighter and Fragment Researcher
    type: npc_major
    appearance: >-
      A Brevonne woman in her fifties with steel-grey hair pulled into a
      severe bun, spectacles with one cracked lens she never replaced,
      and hands that glow faintly blue at the fingertips from decades of
      handling crystallized moonlight. Sharp features, thin lips, eyes
      that look through you to the interesting thing behind you. Wears a
      long scholar's coat over practical sailing clothes — she runs a
      lighthouse-laboratory, not a library. Ink stains and chemical burns
      compete for space on her sleeves.
    culture_aesthetic: >-
      Brevonne academic — scholar's coat, spectacles, the unconscious
      authority of someone who knows more than you and isn't trying to
      hide it. Practical concessions to coastal weather underneath.
    element_visual: >-
      Faintly glowing blue fingertips, cracked spectacle lens, a fragment
      of crystallized moonlight in a leather pouch at her belt, lighthouse
      beam visible through the window behind her.

  - name: Forge-Captain Drazh
    role: Glasswrights Guild Master
    type: npc_major
    appearance: >-
      A broad Khorvath man in his forties with copper skin and a shaved
      head tattooed with geometric patterns in glass-dust ink that catch
      light like embedded gems. Heavy-set and powerful, with the thick
      wrists of someone who has worked molten glass since childhood. Wears
      a leather apron over embroidered Khorvath riding clothes — he has
      never ridden a horse but dresses like his ancestors who did. A
      glass-edged knife at his belt, ceremonial and sharp.
    culture_aesthetic: >-
      Glasswrights of Solenne — Khorvath heritage dress adapted for
      artisan work. Glass-dust tattoos as marks of mastery. The fusion
      of steppe tradition and urban craft.
    element_visual: >-
      Glass-dust tattoos catching light, glass-edged knife at belt,
      leather apron over embroidered riding clothes, the glow of the
      Glass Waste visible through a workshop window.

  - name: Elder Sigrid Tidewalker
    role: Warding Keeper of the Nordmark Tradition
    type: npc_major
    appearance: >-
      An old Nordmark woman, age indeterminate, with white hair braided
      with seaweed and shells that click when she moves. Wind-burnt skin
      the color of driftwood, pale blue eyes that have stared down storms.
      Small and wiry, moves with the rolling gait of someone more
      comfortable on a deck than on land. Wears layered wool and sealskin,
      salt-stiff and smelling of the ocean. Carries a staff carved from
      a single piece of whale rib, older than she is.
    culture_aesthetic: >-
      Nordmark Warding Keeper — layered natural fibers, marine materials
      woven into hair and clothing, the staff of office carved from bone.
      The sea is in everything she wears.
    element_visual: >-
      Seaweed and shells in white braids, whale-rib staff, sealskin
      layers, salt spray in the air around her.

  - name: Commodore Alain Brevisse
    role: Regatta Commissioner
    type: npc_supporting
    appearance: >-
      A Brevonne man in his sixties who has never been to sea but dresses
      as if he commands a fleet. Immaculate naval-style coat with brass
      buttons, white gloves, a tricorn hat that somehow stays perfect in
      coastal wind. Clean-shaven, pink-cheeked, with the round belly of
      someone whose relationship with the sea is entirely administrative.
      Carries a spyglass he uses to watch the races and a ledger he uses
      to run everything else.
    culture_aesthetic: >-
      Brevonne administrative class — overdressed, over-accessorized,
      and convinced that organization is the highest form of civilization.
    element_visual: >-
      Brass-buttoned naval coat, white gloves, spyglass in one hand,
      ledger under the other arm, harbor and racing buoys behind him.
