sub_graphs:
  solenne:
    nodes:
      - id: river_docks
        name: River Docks
        description: The southern waterfront where the diverted Brevonne meets Solenne's
          old canal system. Cargo barges jostle fishing skiffs while toll collectors
          argue with smugglers about what counts as "personal effects."
      - id: merchant_quarter
        name: Merchant Quarter
        description: The intact western half of the city where trade houses, guildhalls,
          and the Glasswright workshops cluster around the covered market. The streets
          are narrow, deliberately — wide enough for a handcart but not a cavalry charge.
      - id: temple_hill
        name: Temple Hill
        description: The elevated district where Brevonne's old cathedral and the newer
          Lamplighter chapel share an awkward hilltop, their competing bell schedules
          a source of ongoing civic dispute.
      - id: warehouse_row
        name: Warehouse Row
        description: A long strip of converted granaries along the old city wall, now
          serving as storage for the Glasswright guild, the river trade, and several
          enterprises that prefer not to specify their inventory.
      - id: brevonne_keep
        name: Brevonne Keep
        description: The fortified seat of the Brevonne governance council, perched
          above Temple Hill with a commanding view of the river and the Lantern Quarter's
          glowing ruins. The keep's walls are thick enough to have survived the Sun-Lantern's
          crack, which is the nicest thing anyone says about the architecture.
