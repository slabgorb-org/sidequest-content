# Pinwheel Coast — World History

world_name: The Pinwheel Coast

overview: >-
  A crescent of coastline shaped by magic gone wrong and the people
  who picked up the pieces. Three cultures — the scholarly Brevonne,
  the steppe-born Khorvath, and the sea-singing Nordmark — share the
  coast and disagree about everything except that the Folly was bad
  and the weather is unpredictable.

eras:
  - name: Before the Folly
    period: ancient
    summary: >-
      The Pinwheel Coast was unremarkable coastline — fishing villages,
      small harbors, and the occasional Nordmark sea-shrine. The Brevonne
      hadn't arrived yet. The Khorvath grazed their herds on the inland
      steppe and traded wool for fish. The Nordmark sang to the sea and
      the sea, mostly, listened.

  - name: The Folly of Saint Beaumont
    period: centuries ago
    summary: >-
      The Brevonne scholar-mage Beaumont attempted to build a ladder of
      crystallized moonlight from the coast to the moon. The experiment
      succeeded for approximately eleven seconds before the structure
      collapsed, scattering fragments of solidified magic across the
      coast and flash-fusing a wide swath of Khorvath steppe into the
      Glass Waste — a plain of vitrified earth that still glows faintly
      at night. The Khorvath lost their best grazing land and several
      hundred people. The Nordmark lost three sea-shrines to the tidal
      wave. The Brevonne lost a saint and gained a cautionary tale.

  - name: The Glass Settlement
    period: centuries ago
    summary: >-
      The Khorvath, displaced from the steppe, split. Traditionalists
      moved further inland. Pragmatists settled the Glass Waste itself,
      discovering that the fused earth could be worked into beautiful
      and nearly indestructible glass. The Glasswrights of Solenne were
      born — artisans and merchants who turned a mass grave into the
      coast's most valuable real estate.

  - name: The Lamplighters' Founding
    period: centuries ago
    summary: >-
      Brevonne scholars, guilt-stricken and fascinated in equal measure,
      established the Lamplighters' Collegium to study the fragments of
      Beaumont's Ladder. They built lighthouse-laboratories along the
      coast and developed techniques for handling crystallized moonlight.
      Their stated goal — completing Beaumont's work "responsibly" —
      continues to make everyone deeply nervous.

  - name: The Present Day
    period: now
    summary: >-
      The Pinwheel Coast is prosperous, contentious, and held together
      by commerce. The annual Regatta is the biggest event of the year.
      The Glasswrights control the most valuable trade goods. The
      Lamplighters control the most dangerous knowledge. The Nordmark
      Warding Keepers maintain traditions everyone else considers
      quaint until the sea gets angry. And the debris field from
      Beaumont's Ladder still drifts offshore, humming faintly, waiting
      to be either studied or feared.
