name: Road Warrior
version: "1.1.0"
description: >-
  Road culture as identity. Your rig is your identity — named, scarred, and
  irreplaceable. Chases are the primary drama, crews are family, and the
  road is the only world that matters. Whether you're running formation on
  a midnight expressway or cruising low-and-slow through your crew's turf,
  the genre truth is the same: you are what you drive.
lobby_blurb: "Your rig is your name. Your crew is your family. The road is the only world left."
recommended_players:
  min: 2
  max: 4
  sweet_spot: 3
min_sidequest_version: "0.1.0"
refine_hooks: false

# --- Creative DNA (reference for all subsequent steps) ---

inspirations:
  - name: "Akira"
    element: "Bosozoku gang warfare, neon-lit expressways, motorcycle as power symbol, youth rebellion against hierarchy"
  - name: "Quadrophenia"
    element: "Mods vs Rockers, scooter culture, tribal identity through fashion and machine, seaside riots"
  - name: "The Warriors"
    element: "Ten gangs, one city, turf as sacred ground, running a gauntlet through hostile territory"
  - name: "Sons of Anarchy"
    element: "MC club politics, chapter hierarchy, loyalty tested by greed and law enforcement, the vote"
  - name: "Initial D / Redline"
    element: "Racing as identity, the driver-machine bond, absurdist speed worship, mountain passes at midnight"
  - name: "American Graffiti / Dazed and Confused"
    element: "Cruise night ritual, car culture as coming-of-age, the strip, the drive-in, the endless loop"
  - name: "City of God / La Haine"
    element: "Urban territory, reputation economy, violence with consequences, knowing every alley"
  - name: "Mad Max: Fury Road"
    element: "Vehicular combat choreography, the rig as fortress, war rigs and war riders"
  - name: "Interstate '76"
    element: "Vehicular RPG mechanics, car customization as progression, funk-infused road adventure"
  - name: "Road Rash / Skitchin'"
    element: "Melee-while-riding, the race IS the fight, gleeful two-wheel destruction"
  - name: "Fast & Furious (early films)"
    element: "Crew loyalty over everything, street racing stakes, living a quarter-mile at a time"
  - name: "Turbo Kid / Bomb City"
    element: "Subculture as identity, DIY aesthetic, real consequences for people who live outside the lines"

era_range: "Any — world-defined"

core_vibe: >-
  You grip the handlebars. The engine answers. Your crew is behind you in
  formation and the road ahead belongs to whoever takes it. This isn't about
  survival — it's about territory, reputation, and the machine that carries
  your name. The Car-acter Sheet is your soul.

emotional_tone:
  - defiance
  - velocity
  - reckless freedom
  - crew loyalty
  - the thrill of the run

differentiation: >-
  Not post-apocalyptic by default — that's a world choice, not a genre
  constraint. The genre is road culture: vehicles as identity, chases as
  the primary dramatic engine, crews as social structure. Your rig lives
  on your character sheet — it has a name, scars, and a history. Losing it
  is a crisis, not a shopping trip. Foot combat exists but it's diminished —
  you're a rider without a bike, a samurai without a sword. The world
  decides WHERE you ride. The genre decides what happens WHEN you ride.

  The default assumption is an urban or semi-urban setting with functioning
  infrastructure — roads, fuel stations, garages, neighborhoods. The drama
  comes from gang politics, turf, reputation, and the chase — not from
  resource scarcity or apocalyptic survival. Post-apocalyptic is a valid
  world choice, but it is not the genre's center of gravity.
extensions:
  - magic
  - classes
  - projection
  - beat_vocabulary
  - achievements
