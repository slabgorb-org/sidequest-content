# Power Tiers — road_warrior
# Per-class visual descriptions at each level range.
# Keyed by class from rules.yaml:
#   Wheelman, Wrecker, Grease Monkey, War Rider, Chrome Saint, Road Preacher

Wheelman:
  - level_range: [1, 3]
    label: runner
    player: >-
      beat-up rig with mismatched panels and a coughing engine, goggles
      held together with tape, a jacket that's mostly patches, white-knuckle
      grip on the wheel because the steering pulls left, the hunched focus
      of someone who survives by being faster than everything else on the road
    npc: >-
      a courier in a rattling hatchback, weaving through traffic on instinct,
      no armor, no weapons, just speed and a prayer
  - level_range: [4, 6]
    label: road runner
    player: >-
      tuned engine purring under a reinforced hood, driving gloves worn smooth,
      a rig with personality — painted stripes, a name scratched into the dash,
      a lucky charm dangling from the mirror, the relaxed confidence of someone
      who has outrun everything the road has thrown at them so far
    npc: >-
      a veteran courier or convoy runner with a fast rig and a reputation,
      knows every shortcut, pulls into settlements like they own the road
  - level_range: [7, 9]
    label: ace
    player: >-
      custom-built rig that turns heads — turbocharged, armored at the
      stress points, every system hand-tuned, a driving record that includes
      runs nobody else would attempt, the rig IS the legend and the driver
      knows it, moves through traffic like water through rock
    npc: >-
      legendary driver whose name is a route — "take the Ace's line" means
      the fastest path through the worst terrain, rigs painted with tally
      marks for races won
  - level_range: [10, 10]
    label: road ghost
    player: >-
      the rig is silent, impossibly fast, appears and vanishes like a rumor,
      engine technology that shouldn't exist cobbled from three different
      wrecks, the driver's eyes read the road like sheet music, every turn
      is a note in a performance nobody else can hear, the road itself seems
      to bend for them

Wrecker:
  - level_range: [1, 3]
    label: scrapper
    player: >-
      heavy rig with dents from both sides of the fight, a ram bar welded
      from a highway guardrail, knuckles scarred from roadside brawls,
      a tire iron on the passenger seat and a grin that says this is going
      to be fun
    npc: >-
      a bruiser in a dented truck, hired muscle for convoys, more
      comfortable hitting things than driving around them
  - level_range: [4, 6]
    label: demolisher
    player: >-
      armored rig bristling with ram plates and spike strips, reinforced
      chassis that's been through more walls than doors, a reputation for
      ending chases by ending the other rig, scars on both the driver
      and the machine that tell the same stories
    npc: >-
      convoy enforcer whose rig is a weapon — the sound of that engine
      is enough to make raiders reconsider
  - level_range: [7, 9]
    label: war rig
    player: >-
      mobile fortress — multi-ton rig armored in layered salvage plate,
      mounted weapons that fire while driving, a crew of two or three
      riding the frame, the rig has survived things that should have
      killed it and the driver has become the thing raiders tell stories
      about to scare each other
    npc: >-
      warlord-class wrecker whose rig is a territory unto itself, convoys
      form around them for protection, settlements negotiate passage rights
  - level_range: [10, 10]
    label: juggernaut
    player: >-
      the rig is a legend — a beast of welded steel and fury that has
      destroyed more vehicles than some settlements have ever owned,
      the driver and the machine have merged into a single identity,
      the road clears when the juggernaut approaches, not from fear
      but from respect for physics

Grease Monkey:
  - level_range: [1, 3]
    label: wrench
    player: >-
      oil-stained coveralls and permanently dirty fingernails, a tool belt
      heavier than most weapons, a rig that runs better than it looks
      because they rebuilt the engine themselves, the distracted squint of
      someone who sees every machine as a puzzle to solve
    npc: >-
      a settlement mechanic crouching under a rig, trading repairs for
      fuel, more comfortable talking to engines than people
  - level_range: [4, 6]
    label: gearhead
    player: >-
      custom tool harness with integrated diagnostic gear, a rig modified
      beyond factory spec — turbo where there shouldn't be turbo, armor
      integrated into the frame instead of bolted on, the hands of someone
      who can hear what's wrong with an engine by listening to it idle
    npc: >-
      a sought-after mechanic whose modifications are signature — you can
      tell a gearhead's work by the way the rig breathes
  - level_range: [7, 9]
    label: artificer
    player: >-
      walking workshop — the rig itself is a mobile garage with fold-out
      workbenches and a parts library, creations that combine salvage in
      ways nobody else would think of, personal rig runs on a power plant
      they designed, the engineer the whole road depends on when things break
    npc: >-
      legendary mechanic whose workshop is a pilgrimage site, builds rigs
      that other drivers name and love, has standing offers from every
      faction on the road
  - level_range: [10, 10]
    label: forge lord
    player: >-
      master engineer whose rigs redefine what's possible — engines that
      burn fuel nobody else can refine, armor composites from pre-war
      formulas they reverse-engineered, a personal rig that is a prototype
      for the future of the road, the one who makes the machines that
      make the legends

War Rider:
  - level_range: [1, 3]
    label: prospect
    player: >-
      a motorcycle or light rig with more courage than armor, leathers
      marked with a probationary crew patch, weapons strapped to the
      frame with bungee cord, the reckless speed of someone who hasn't
      learned what they should be afraid of yet
    npc: >-
      a young rider running errands for a crew, eager and expendable,
      trying to earn their place on the road
  - level_range: [4, 6]
    label: blooded
    player: >-
      a fast rig scarred from combat, crew colors displayed proudly,
      a mounted weapon that's been used enough to have a name, the
      steady nerve of someone who's been in a chase that went wrong
      and survived it
    npc: >-
      a veteran crew rider, trusted on the flank of a convoy, whose
      loyalty has been tested and held
  - level_range: [7, 9]
    label: road captain
    player: >-
      a command rig that leads from the front — fast, armored, bristling
      with comms gear, riders form up behind them by instinct, crew
      tattoos that tell a history of campaigns and losses, the weight
      of command visible in every decision
    npc: >-
      a war leader whose convoy is a mobile army, feared and respected
      in equal measure, negotiates territory with other captains as
      equals
  - level_range: [10, 10]
    label: road marshal
    player: >-
      the war rider who ended a war — whose name is a ceasefire, whose
      rig flies colors that every faction recognizes, the one who can
      ride into any territory and demand a hearing, not because of the
      weapons but because of the reputation behind them

Chrome Saint:
  - level_range: [1, 3]
    label: initiate
    player: >-
      chrome jewelry over road-worn leathers, a rig decorated with
      polished hubcaps and mirror fragments, the fierce devotion of a
      true believer in the road's spiritual power, fights with the
      conviction that the road protects its own
    npc: >-
      a young zealot handing out chrome talismans at fuel stops,
      preaching the road gospel to anyone who'll listen
  - level_range: [4, 6]
    label: witness
    player: >-
      chrome-plated armor over reinforced leathers, a rig that shines
      like a beacon, ritual scars and chrome piercings, the calm intensity
      of someone who has seen something on the road that changed them,
      fights with terrifying certainty
    npc: >-
      a wandering holy warrior who blesses rigs and curses enemies with
      equal conviction, feared for their absolute lack of self-preservation
  - level_range: [7, 9]
    label: shining one
    player: >-
      fully chromed rig — every surface polished to a mirror, blinding in
      sunlight, the driver moves with ritual precision, their devotion has
      become something tangible, other road warriors make way not from fear
      but from an instinct they can't explain
    npc: >-
      a living legend of the chrome faith whose rig is a rolling shrine,
      followers ride in formation behind them, settlements provide fuel
      and food without being asked
  - level_range: [10, 10]
    label: eternal chrome
    player: >-
      the rig and the driver are a single sacrament — chrome fused with
      steel fused with devotion, a presence on the road that changes
      the behavior of everyone who witnesses it, the living proof that
      the road is more than asphalt and the machines are more than metal

Road Preacher:
  - level_range: [1, 3]
    label: circuit rider
    player: >-
      a battered rig loaded with salvage-trade goods and a loudspeaker
      bolted to the roof, dusty robes over practical road clothes, a
      voice that carries over engine noise, the tireless energy of
      someone who believes they have a message the road needs to hear
    npc: >-
      a travelling preacher-trader who arrives at settlements with news,
      goods, and opinions in equal measure
  - level_range: [4, 6]
    label: voice of the road
    player: >-
      a rig that doubles as a mobile broadcast station, radio equipment
      jury-rigged from salvage, a following of listeners who tune in
      across the frequency, the preacher's word carries weight because
      they've been everywhere and survived it
    npc: >-
      a radio personality whose broadcasts shape opinion on the road,
      settlements tune in for news, gossip, and the preacher's particular
      brand of defiant philosophy
  - level_range: [7, 9]
    label: prophet
    player: >-
      a convoy of believers following the preacher's rig like a mobile
      congregation, broadcast range that covers half the territory,
      the preacher's word can start or stop a war, personal rig is
      modest by choice — the power is in the voice, not the machine
    npc: >-
      a figure of genuine authority whose moral weight rivals any
      warlord's guns, settlements dispute their words but nobody
      ignores them
  - level_range: [10, 10]
    label: road saint
    player: >-
      the voice of the road itself — a figure whose broadcasts have
      become the shared mythology of an entire territory, whose rig
      is a pilgrimage destination, whose words are quoted by people
      who've never met them, the one who gave the road its meaning
