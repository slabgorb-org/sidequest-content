# Seed tropes for road_warrior — short-arc narrative hooks dealt at session
# start from a per-pack deck (ADR-018, ADR-128). Dealt without replacement;
# each seed expires after its lifespan_turns and lingers as a ghost for
# later callback. Seeds are baited hooks (ADR-014 diamonds-and-coal) —
# vague on purpose; the narrator retroactively threads engaged seeds into
# whatever the road demands.
#
# World-agnostic by design (ADR-140): genre grammar only — the rig as
# identity, the crew as family, the chase as the primary drama, turf and
# respect as the economy. No assumption about apocalypse or city; these
# must land anywhere road culture IS the culture.

- id: the_rig_recognized_at_the_pumps
  name: Somebody Recognizes the Rig
  description: >-
    At a fuel stop, a stranger circles a player's rig slowly, like
    they're reading it — the welds, the scars, one particular panel.
    They knew this machine before the party did, under another name,
    with another crew's colors. What they want from it, or from its
    history, they haven't said yet. They've started with a question
    about who did the bodywork.
  flavor_tags: [rig, history, stranger, identity]
  lifespan_turns: 7
  delivery_hints:
    - The stranger names a detail about the rig that's under the paint — they're not guessing
    - The rig's previous life involved a night people still argue about
    - An offer to buy arrives soon after, generous and oddly specific about ONE component staying with the sale
  narrative_hint: >-
    The rig's past is the player's inheritance whether they want
    it or not. Let the specific component be the secret — what's
    hidden in, welded to, or proven by it — and let the rig's old
    night have a survivor with a different version.

- id: the_crew_colors_worn_wrong
  name: Colors Worn by Somebody Who Shouldn't
  description: >-
    Somebody is wearing a crew's colors — patch, paint scheme, the
    signature trim — and the crew didn't give them. Either a
    defector kept what they should have surrendered, a fake is
    trading on a reputation they didn't earn, or a new outfit is
    deliberately flying false colors to start something between
    two crews that had a working peace.
  flavor_tags: [colors, crew, impersonation, provocation]
  lifespan_turns: 6
  delivery_hints:
    - The wearer's detailing is almost right — perfect to outsiders, wrong to anyone who's earned the real thing
    - The crew whose colors they are hasn't heard yet, and several people are deciding whether to be the one who tells them
    - The wearer is doing something specific in the colors — collecting, recruiting, being seen at particular corners
  narrative_hint: >-
    False colors are a slow detonation — the moment the real crew
    learns, clocks start. Let the party choose their position:
    inform, investigate, or intercept. The wearer's specific
    errand reveals the author, and the author wants the war.

- id: the_race_with_a_second_purse
  name: The Race Has a Second Purse
  description: >-
    A race is being organized — informal, invitational, the kind
    where the route matters more than the rules. The posted purse
    is respectable. The real action is the second purse: side
    bets, a title, a debt to be settled by proxy, or one entrant
    who must not finish and a quiet fee for whoever ensures it.
  flavor_tags: [race, wager, sabotage, honor]
  lifespan_turns: 6
  delivery_hints:
    - The route includes one stretch chosen by somebody with an agenda — it favors a build, or hides a hazard
    - An entrant is racing for stakes nobody posted — a pink slip they can't afford to lose, a debt that isn't money
    - The quiet fee gets offered to the party, politely, with room to pretend it wasn't
  narrative_hint: >-
    The race is the genre's formal duel. Let the second purse
    force a choice between winning and what winning costs somebody
    sympathetic, and let the agenda-stretch be where everything
    converges at speed.

- id: the_breakdown_lane_inheritance
  name: The Breakdown Comes with a Last Request
  description: >-
    A rig is dying on the shoulder — and its driver, an old hand
    everyone half-knows, is dying with it, or near enough: sick,
    done, finished with the road. They have one request: the rig,
    or something in it, or something it's owed, goes to somebody —
    delivered, settled, made right. The party is who stopped.
  flavor_tags: [legacy, road, request, debt]
  lifespan_turns: 8
  delivery_hints:
    - The old hand's name opens doors the party didn't know were closed — being their executor has weight
    - The request's recipient doesn't want it, at first, for reasons that are the actual story
    - Somebody else believes the rig, or its cargo, or its debts, are rightfully theirs — and has paper, or muscle, or both
  narrative_hint: >-
    The roadside inheritance is a courier job wrapped around a
    family wound. Let the executor's weight pay the party's way
    into rooms and feuds alike, and the reluctant recipient's
    reasons reframe who the old hand actually was.

- id: the_new_interchange_kills_the_strip
  name: The New Route Will Kill the Strip
  description: >-
    A new route is coming — a bypass, a corridor, a reopened pass —
    and everyone who can read a map can see what it does: the strip,
    the stops, the whole economy of the old road dies in a season.
    Surveyors' marks are already up. Some people are selling, some
    are organizing, and somebody is quietly buying every parcel
    along the NEW alignment.
  flavor_tags: [road, turf, economics, change]
  lifespan_turns: 8
  delivery_hints:
    - The quiet buyer's agents pay in cash and know the alignment before it's posted
    - One holdout sits on the single parcel the new route cannot route around
    - The crews are split — the new road is faster, and fast is the religion, and that's the argument
  narrative_hint: >-
    The new route is change-as-antagonist, with no one to punch.
    Let the holdout be the pressure point everyone converges on,
    the early-knowledge buyer be the corruption thread, and the
    crews' fast-versus-home argument be the genre arguing with
    itself.

- id: the_phantom_runs_at_night
  name: Something Runs the Long Stretch at Night
  description: >-
    Drivers on the long stretch report the same thing: lights in
    the mirror that close impossibly fast, hold at a distance, and
    vanish at the same marker. Nobody's been run off. Yet. The
    descriptions agree on the silhouette and disagree on the sound,
    and the crews have started routing around a road that belongs,
    by every law of the culture, to whoever can hold it.
  flavor_tags: [phantom, night, challenge, legend]
  lifespan_turns: 7
  delivery_hints:
    - The vanish-marker is consistent, and something about that mile is different — surface, grade, an old exit that isn't on current maps
    - One driver got a long look and has stopped driving at night, which for this driver is like stopping breathing
    - The silhouette matches a rig that has a story attached, and the story has a grave in it
  narrative_hint: >-
    The night runner is a legend the party can investigate, race,
    or become. Keep it playable as machine, hoax, or haunting per
    the world's register — the off-map exit is the rational thread,
    the grave-story the other one, and holding the stretch at
    midnight the genre-true way to ask.

- id: the_parts_counterfeiter
  name: The Parts Are Lying
  description: >-
    Failures are clustering — a brake line here, a bearing there,
    good crews with good wrenches losing components that shouldn't
    fail. The parts all came through legitimate counters, with
    legitimate marks. The marks are forged. Somebody is moving
    counterfeit components into the supply, and the failures are
    starting to land at speed.
  flavor_tags: [parts, counterfeit, supply, danger]
  lifespan_turns: 7
  delivery_hints:
    - The fakes are good — only a failed one, cut open, shows the difference
    - "The distribution pattern has a shape: one counter, one route, one crew's territory disproportionately hit"
    - A supplier who noticed got bought out, or burned out, or went quiet, depending who tells it
  narrative_hint: >-
    Counterfeit parts are sabotage of the culture's whole social
    contract — the wrench-trust between crews. Let the
    disproportionate territory raise the question of whether it's
    greed or targeting, and the quiet supplier be the witness the
    party has to find before the next failure happens at the
    worst speed.

- id: the_kid_with_the_fast_build
  name: The Kid Built Something Fast in a Shed
  description: >-
    There's a kid — too young for colors, no crew, no name — who
    has built something in a shed out past the edge of things, and
    it's FAST. Faster than it should be on the parts anyone admits
    selling them. The kid wants in: a crew, a race, a chance.
    Three crews want the build, with or without the kid attached.
  flavor_tags: [youth, build, recruitment, talent]
  lifespan_turns: 8
  delivery_hints:
    - The build has one genuinely new idea in it, the kind veterans pretend they'd already thought of
    - Where the parts came from is a question the kid answers a little too smoothly
    - One crew's offer is real, one is for the build alone, and one is to make sure nobody else gets either
  narrative_hint: >-
    The kid is the culture's future arriving rude and unsponsored.
    Let the party's treatment of them — sponsor, exploit, or
    protect — be the moral line, the parts-question be the hook
    that complicates it, and the new idea be worth exactly as
    much as everyone fears.

- id: the_convoy_needs_outriders
  name: The Convoy Pays for Outriders
  description: >-
    A convoy is forming — freight, families, a whole operation
    relocating — and it needs outriders for the hard leg. Pay is
    good, terms are clear, and the convoy master is straightforward
    about the cargo and evasive about the route. The route is the
    tell: it threads territory where straightforward people don't
    take convoys, on a schedule that only makes sense if arrival
    timing matters more than safety.
  flavor_tags: [convoy, escort, route, schedule]
  lifespan_turns: 7
  delivery_hints:
    - The schedule aligns with something — a gate, a tide, a shift change, a date — that the convoy master watches obsessively
    - One vehicle in the convoy doesn't fit the manifest and is always parked in the middle
    - Somebody expects the convoy; the question the route answers is from which direction
  narrative_hint: >-
    The convoy is a rolling siege with a secret in the middle
    lane. Let the timing-obsession reveal the real deadline, the
    misfit vehicle be the actual cargo, and the hard leg deliver
    the chase the genre promises — with the party deciding
    mid-pursuit what they're actually protecting.

- id: the_old_champions_rig_for_sale
  name: The Old Champion's Rig Is for Sale
  description: >-
    A rig with a NAME — the one that won the thing, the one from
    the story — is up for sale, suddenly, by a seller with thin
    paper and a flexible price. The rig is real; the question is
    everything else. The champion isn't answering anyone. The
    culture treats certain machines as relics, and the relic
    market just hiccuped.
  flavor_tags: [rig, relic, provenance, champion]
  lifespan_turns: 6
  delivery_hints:
    - Authenticating details only the champion's old crew would know — and they split badly, years ago
    - The seller's thin paper traces to a debt settlement nobody admits to brokering
    - Two collectors are bidding; one wants the rig, the other clearly wants it OFF the market
  narrative_hint: >-
    The relic sale is a history dispute conducted in money. Let
    authentication require reuniting people who hate each other,
    the debt-trail explain how the champion lost it, and the
    off-the-market bidder be erasing the proof of something the
    famous night included.

- id: the_toll_crew_waves_them_through
  name: The Toll Crew Waves the Party Through
  description: >-
    A stretch everyone pays to run — crew toll, official toll, the
    distinction varies — suddenly costs the party nothing. Waved
    through, by name, with professional courtesy. Nobody paid on
    their behalf. The free passage is the message: somebody wants
    the party in particular moving down this road, and wants them
    to know they're expected.
  flavor_tags: [toll, invitation, turf, courtesy]
  lifespan_turns: 6
  delivery_hints:
    - Other travelers paid full rate the same hour — the courtesy is precise
    - The toll crew's manner is the manner of people who've been instructed and are curious themselves
    - The road only goes a few places, and at one of them somebody has prepared for company
  narrative_hint: >-
    The waived toll is a summons dressed as respect. Let the party
    arrive informed or rattled depending on what they do en route,
    and let the host's hospitality be real — the genre's powers
    do business face to face, and this one has a proposition the
    free passage was the cover charge for.

- id: the_garage_that_keeps_a_secret
  name: The Garage with the Closed Bay
  description: >-
    A garage everyone trusts — fair prices, good hands, neutral
    ground — has one bay that's been closed for weeks. Tarped,
    locked, lights on at strange hours. The owner's been turning
    away work they'd normally take, and turning it away TIRED.
    Whatever's in the bay is consuming the best wrench in the
    territory, and the territory is starting to feel the gap.
  flavor_tags: [garage, secret, neutral_ground, project]
  lifespan_turns: 7
  delivery_hints:
    - Deliveries arrive at night — components in crates with the labels peeled
    - The owner's apprentice was sent away for the duration, with paid wages and no explanation
    - One sound from the bay, heard once, was identified differently by everyone who heard it
  narrative_hint: >-
    The closed bay is a mystery box with a deadline implied by the
    owner's exhaustion. Let what's being built — restoration,
    weapon, payment, penance — implicate someone the owner can't
    refuse, and the neutral ground's neutrality be what's actually
    at stake when it rolls out.

- id: the_crossing_guard_arrangement
  name: The Crossing Has an Arrangement
  description: >-
    At a border, bridge, or checkpoint, the inspection is theater —
    a known rhythm of which vehicles get waved past and which get
    the full treatment. The arrangement has worked for years.
    Someone new has been posted to the crossing, someone who
    wasn't briefed, or won't be bought, or is keeping a different
    ledger — and the whole corridor's freight is rescheduling
    around one diligent stranger.
  flavor_tags: [checkpoint, smuggling, corruption, disruption]
  lifespan_turns: 7
  delivery_hints:
    - The diligent one's record is clean in a way that took effort to arrange — they were SENT
    - The arrangement's beneficiaries are meeting, and the meeting's mood is "solutions"
    - One shipment can't be rescheduled, and its owner is the most dangerous person in the corridor
  narrative_hint: >-
    The broken arrangement is an ecosystem losing its keystone.
    Let the sent inspector's actual mission be the reveal — audit,
    bait, or hostile takeover of the racket — and the
    unreschedulable shipment force every party's hand on the same
    night.

- id: the_funeral_run
  name: The Funeral Run Is Forming
  description: >-
    A driver died — on the road or off it — and the culture is
    doing what it does: a funeral run, every crew invited, colors
    out, the long slow ride to wherever they're laid down. Runs
    like this have rules and truces. Two of the invited crews are
    at war. The dead driver was the last person both sides trusted,
    and the run will put them bumper to bumper for forty miles.
  flavor_tags: [funeral, truce, crews, ritual]
  lifespan_turns: 6
  delivery_hints:
    - The route passes through both crews' turf, by design — the dead driver's design, per a letter
    - Somebody plans to use the truce as cover for something, and somebody else suspects exactly that
    - The dead driver's rig rides the run driverless, towed or pushed, and what's in it hasn't been inventoried
  narrative_hint: >-
    The funeral run is the genre's high ceremony — grief at
    highway speed under a truce nobody fully trusts. Let the dead
    driver's letter be a posthumous play to end the war, the
    cover-user be the threat to it, and the uninventoried rig
    carry the leverage that decides which way the forty miles end.
