tone: defiant-kinetic
lethality: gritty
magic_level: none
# DRAFT (2026-04-27): the `magic_level` flag is being retired and is wrong here.
# The named vehicle (Interceptor, War Rig, Pursuit Special) is the magic item.
# "The man with the V8 Interceptor" is mythic-folkloric item-magic; the mechanic
# is the McCoy/inventor source. World-knowledge is folkloric. See ./magic.yaml
# for the napkin-shaped truth and docs/design/magic-taxonomy.md for the framework.

stat_generation: point_buy
point_buy_budget: 27

# Cities Without Number binding (epic 86, Plan 1). road_warrior runs CWN
# personal combat: ablative HP + Shock/Trauma/Mortal/Major Injury, reached via
# the shared cwn ruleset module (the same one neon_dystopia binds). Decision D3
# (2026-06-04): adopt the standard CWN six on the sheet and drop the flavor
# names (Grip/Iron/Nerve/Scrap/Road Sense/Swagger) — zero attribute-map risk.
# The narrator may still *call* DEX "grip" in prose; the SHEET uses the standard
# label.
ruleset: cwn
cwn:
  # Identity-style map: the standard six are the ability_score_names, so each
  # CWN canonical attribute maps to its own abbreviation (D3 "zero map risk").
  attribute_map:
    STRENGTH: STR
    DEXTERITY: DEX
    CONSTITUTION: CON
    INTELLIGENCE: INT
    WISDOM: WIS
    CHARISMA: CHA
  system_strain:
    max_source: CONSTITUTION
    rest_recovery_per_night: 1
    first_aid_cost: 1
  trauma:
    default_trauma_target: 6
    mortal_injury_rounds: 6
    major_injury_save: physical

ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

allowed_classes:
  - Wheelman
  - Wrecker
  - Grease Monkey
  - War Rider
  - Chrome Saint
  - Road Preacher

allowed_races:
  - Convoy Born
  - Gearhead
  - Outlaw
  - Pit Crew
  - Scrapper
  - Legacy


# The driver is an ablative-HP CWN character (epic 86, D2: Driver Edge / ADR-078
# retired in favour of the engine-wide ablative HpPool + Shock/Trauma/Mortal/
# Major-Injury, reached through ruleset: cwn). Rig Composure still lives on the
# rig vessel item (see inventory.yaml + custom_rules.rig_composure_spec) but is
# DORMANT for Plan 1 — Plans 2-4 wire it. Fuel/injuries/dismounted remain
# character-side trackers. (edge_config removed with Driver Edge.)
stat_display_fields:
  - fuel
  - injuries
  - dismounted


default_class: Wheelman
default_race: Scrapper
race_label: Background
class_label: Role
default_location: "In a garage with the hood up, radio on, crew somewhere nearby"
default_time_of_day: dawn

custom_rules:
  lethality: gritty
  rest_variant: gritty_realism
  encumbrance: variant

  # --- DAMAGE MODEL: TWO POOLS, ADR-078 ALIGNED ---

  damage_model: >-
    Road Warrior runs a TWO-POOL damage model. As of epic 86 Plan 1 the
    DRIVER pool is LIVE (ablative CWN HP); the RIG pool is DORMANT prose
    pending Plan 2 — do not imply mechanical rig backing yet.

    1. DRIVER HP (LIVE) — the character's own ablative CWN HpPool. Damage
       on foot / dismounted / boarding hits HP directly; 0 HP triggers the
       hp_depletion kill, with Shock/Trauma/Mortal/Major Injury via the cwn
       ruleset. This replaces the retired Driver Edge (ADR-078 / D2). This is
       the human inside the rig.

    2. RIG COMPOSURE (DORMANT — Plan 2) — a vessel-attached pool on the named
       rig item (see inventory.yaml vessels + custom_rules.rig_composure_spec).
       Intended as the character's armor while mounted; NOT yet a wired
       mechanic. The narrator may describe rig damage as colour but there is
       no Rig Composure number in play until Plan 2.

    WHILE MOUNTED (Plan 2, dormant):
    Incoming damage is intended to be absorbed by Rig Composure — panels fly
    off, engine smokes, exhaust drags sparks. Narrative colour only for now.

    CRASH EVENT (Rig Composure → 0) (Plan 2, dormant):
    The rig is wrecked; the driver takes an injury tag (see injury_system) and
    is DISMOUNTED. Not yet mechanically fired.

    WHILE DISMOUNTED:
    No vessel buffer. Incoming damage hits Driver HP directly. DEX checks at
    disadvantage. The world treats a driver who lost their rig differently —
    getting back on the road is a story arc, not a shopping trip.

    HP ZERO:
    Driver is down or dead per lethality_policy.yaml (gritty / permanent /
    road is indifferent). The road doesn't owe anyone a recovery.

  rig_damage_tiers: >-
    Rig Composure narrative tiers (for narrator description as the
    Composure pool drains, not separate mechanical bands):

    full Composure   — Tight. Everything works. Engine purrs.
    75% Composure    — Cosmetic damage. Rattles, dents, cracked mirror.
                       Functional. Body shop fix.
    50% Composure    — Systems failing. Door hanging off, windshield
                       gone, exhaust dragging sparks. Mounted-only
                       Speed penalty kicks in.
    25% Composure    — Skeleton mode. Barely holding. Major Speed
                       penalty, a mount slot may be destroyed, any
                       hit risks fire.
    0  Composure     — CRASH EVENT (see damage_model).

  rig_composure_spec: >-
    Backend reference (see backlog story for RigComposurePool wiring):

    - Each character has one named rig (vessel item, inventory.yaml).
    - The vessel item carries: composure (current), composure_max
      (per rig tier), speed, armor, fuel_capacity, mount_slots, scars.
    - Composure_max by rig tier:
        tier 1 (prospect)         max 4   1 mount slot
        tier 2 (runner)           max 6   2 mount slots
        tier 3 (road name)        max 8   3 mount slots + 1 signature trait
        tier 4 (convoy legend)    max 10  4 mount slots + 2 signature traits
        tier 5 (road immortal)    max 12  5 mount slots + legendary tag
    - Composure recovery:
        on_resolution: 0 (rig damage is sticky — repair is a story beat)
        on_long_rest: 0 (you fix it at a garage; the bed doesn't fix it)
        on_repair_scene: full (a Grease Monkey + parts + time)
    - Crash event hook (Composure crosses 0 downward): fire
      event_id: rig_crash. The handler MUST emit OTEL span
      `rig_pool.crash_event` with {rig_slug, location, attacker} per
      ADR-031, write the dismounted status, and apply crash damage + 1
      injury tag to the driver's ablative HP. (Plan 2 — dormant.)

  injury_system: >-
    Per ADR-080: injuries are narrative_weight tags on the character,
    not a parallel HP pool. When the driver takes direct damage
    (dismounted, crash event, boarding combat, or rig pierced) they
    take an INJURY tag — a specific, named wound with a stat penalty:

      Slashed Arm     → DEX -1      (heals in 2 sessions / medical care)
      Concussion      → WIS -1
      Broken Rib      → STR -1, CON -1 in fast scenes
      Burned          → INT -1 until salved
      Whiplash        → -1 to all checks first round of any chase scene
      Internal        → -1 max HP until full medical (this is the bad one)

    Tags live as narrative_weight entries on the character; the narrator
    references them until healed. Light injuries dissolve at long rest;
    serious ones (Broken Rib, Internal) require a medical scene.

  # --- RIG AS VESSEL ---

  rig_rules: >-
    Per magic.yaml: the rig is an item_based / vessel — a first-class
    item in inventory.yaml, not a Car-acter-Sheet sidebar. Every
    character has exactly one named rig (vessel_id pointer on the
    character → rig vessel item).

    Vessel fields (authored in inventory.yaml under vessels:):
      name           — player-chosen at chargen (the_name scene)
      type           — world-defined chassis class (kaidō racer, chopper,
                       Vespa, dekotora, lowrider Impala, matatu, tuk-tuk,
                       Raggare V8, etc.)
      composure      — current Rig Composure
      composure_max  — by tier (see rig_composure_spec)
      speed          — base movement / chase tier
      armor          — flat reduction on incoming Composure damage
      fuel           — current fuel; max from fuel_capacity
      mount_slots    — weapon/tool hardpoints, scales with tier
      signature_traits — per-tier narrative descriptors (Tier-3+)
      scars          — narrative history array (each scar is a repair
                       story; do NOT prune them)

    Losing your rig means losing your armor pool, your speed, your mount
    slots, your signature traits, your identity. You're meat on the
    road. Getting a new rig is a story arc, not a transaction —
    inheritance, salvage rebuild (Grease Monkey + parts + time), or
    earning a faction-issued vessel.

  fuel_system: >-
    Fuel is tracked during chases and long runs — not as a survival
    resource but as a tactical one. Running low mid-chase means hard
    decisions. Running dry means your rig is dead weight — Rig
    Composure still absorbs hits (you're cover), but Speed → 0 means
    no escape. In normal play, fuel is available at gas stations like
    anywhere else. The drama isn't "can I find fuel" — it's "can I
    afford to burn fuel on this chase and still make it across town."

  chase_system: >-
    Chases are structured as beat sequences, not single rolls. Each chase
    has an Opening (engage or evade?), Pursuit (distance, terrain, hazards),
    Escalation (boarding, weapons, rig damage), Crisis (something breaks,
    someone falls, a choice), and Resolution (wreckage, escape, or victory).
    Each beat is a decision point. If there is no decision, skip the beat.
    Rig Composure degrades through the chase — the narrator reflects this
    as progressive visible damage. Allies can fall. The fortress crumbles.

  dismounted_rules: >-
    A driver without a rig is in survival mode. No Rig Composure buffer —
    incoming damage hits Driver HP directly. All DEX checks at
    disadvantage. CHA checks to maintain reputation take a penalty.
    Movement is slow in a world built for wheels. The world treats you
    differently — you're a driver who lost their ride. Getting a new
    rig or recovering your old one is a story arc, not a shopping trip.
    The narrator should make dismounted sequences feel desperate and
    wrong — this is not where you belong.

  rig_progression_arc: >-
    The level arc for narrator reference (mechanical bonuses come from the
    standard progression.yaml level_bonuses; this arc colors the *flavor*
    of each tier):

    Level 1 — Prospect: Fresh on the road. Your rig is new to you or you're
    new to it. 1 mount slot.

    Level 3 — Runner: You've survived enough runs to know what you're doing.
    2 mount slots, +10 Rig HP.

    Level 5 — Road Name: People know your name and your rig's name.
    Reputation opens doors. 3 mount slots, +20 Rig HP, rig gains a
    Signature Trait.

    Level 7 — Convoy Legend: War boys want to ride with you. Fuel brokers
    give you credit. Your rig is famous. 4 mount slots, +30 Rig HP, rig
    gains a second Signature Trait.

    Level 10 — Road Immortal: Your name is spoken on every frequency. Your
    rig is a legend. The road itself seems to bend for you. 5 mount slots,
    +50 Rig HP, rig becomes Legendary (narratively indestructible except
    for story reasons).

resources:
  - name: fuel
    label: Fuel
    min: 0.0
    max: 100.0
    starting: 50.0
    voluntary: false
    decay_per_turn: 0.0

encounter_base_tension:
  random: 0.10
  road_encounter: 0.20
  ambush: 0.35
  chase: 0.40
  boss: 0.45
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Wasteland Bargain"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093.
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Make Your Case"
        kind: strike
        base: 2
        stat_check: CHA
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        stat_check: STR
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Rev the engine. Let them hear what's coming."
      # concede_point: strategic give-ground to reveal opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: CHA
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: STR
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player fires up the rig and leaves. No deal."
    mood: tension

  # Plan 1 (epic 86): DRIVER-ON-FOOT personal combat — standard CWN combat on
  # the ablative HpPool (attack-vs-AC + hp_depletion; Shock/Trauma/Mortal/Major
  # Injury layer on via the cwn ruleset module, same as neon_dystopia). Damage
  # comes from the driver's equipped weapon (inventory.yaml personal weapons
  # carry damage specs). RIG-vs-rig combat (ram/sideswipe, Rig Composure) is
  # Plan 2 — its mechanics live as DORMANT prose in custom_rules above and are
  # not yet a wired confrontation.
  - type: combat
    label: "Roadside Firefight"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [strike, attack, fight, kill, slay, swing, shoot, hit, stab]
    on_intent_mismatch: reprompt
    category: combat
    resolution_mode: beat_selection
    win_condition: hp_depletion
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
      # Reserved combat-seed keys (not ability scores) — seed the runtime
      # CreatureCore for hp_depletion. hp = HP pool; armor_class = ascending AC
      # the attack rolls against; dexterity = SWN/CWN 1d8+DEX initiative.
      # Road scav: AC 13 (leathers + scrap plate), HP 8, drops in ~2-3 hits.
      hp: 8
      armor_class: 13
      dexterity: 10
    # Momentum tracks who controls the engagement (narrator colour); the kill
    # resolves on the ablative HP pool, not this dial.
    player_metric:
      name: momentum
      starting: 0
      threshold: 7
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 7
    beats:
      - id: shoot
        label: "Open Fire"
        kind: strike
        base: 2
        stat_check: DEX
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Target takes weapon damage"
        narrator_hint: "Shotgun roar across the asphalt. Two barrels of persuasion."
      - id: melee
        label: "Close In"
        kind: strike
        base: 2
        stat_check: STR
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Tire iron, chain, fists — close-quarters work"
        narrator_hint: "Three feet of oily chain swings wide. Up close it's wet work."
      - id: take_cover
        label: "Take Cover"
        kind: brace
        base: 1
        stat_check: WIS
        effect: "Reduce incoming damage behind a wreck or engine block"
        narrator_hint: "Drop behind a burned-out hulk. Let the rounds spark off steel."
      - id: disengage
        label: "Break Contact"
        kind: push
        stat_check: WIS
        consequence: "Combat ends — break away into the dust"
        narrator_hint: "Back to the rig, throttle open, gone before they reload."
    mood: combat

  - type: chase
    label: "Road Chase"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [chase, pursue, flee, run, escape, follow]
    on_intent_mismatch: reprompt
    category: movement
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093.
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: floor_it
        label: "Floor It"
        kind: push
        base: 2
        stat_check: WIS
        narrator_hint: "Engine screams, dust plume stretches behind."
      - id: terrain_cut
        label: "Terrain Cut"
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: INT
        risk: "Rollover — take rig damage on failure"
        narrator_hint: "Leave the road. Cut across hardpan, jump a wash."
      # smoke_screen: oil burn or dust cloud — angle (misdirection tag on pursuers)
      - id: smoke_screen
        label: "Smoke Screen"
        kind: angle
        target_tag: "Blinded"
        stat_check: INT
        effect: "Oil burn or dust cloud blinds pursuit"
        narrator_hint: "Pop the smoker, pull the rip-cord, leave them coughing in your wake."
      - id: engine_kill
        label: "Kill the Engine"
        kind: push
        stat_check: WIS
        consequence: "Chase ends — coast to a stop in the dust, hidden"
        narrator_hint: "Cut the engine. Glide silent into cover. Let them roar past."
    mood: tension

  # War Rig (crewed vessel) — Story 86-6. The whole crew mans one rig against an
  # external threat: each station commits a concurrent verb per round (the SOUL
  # Guitar-Solo wider-action), all riding the ADR-129 N-Seat Table Engine via the
  # `war_rig_crew` table game. Cooperative, so victory reads table_state (Hull
  # depletion), never the dual dials — no player/opponent metrics. This is the
  # MINIMAL playable wiring proof (spec §6): full vessel stat blocks, mount_slot →
  # CWN weapon remap, and lethality calibration are 86-5; the road_boss Command
  # Points layer is 86-7.
  - type: war_rig
    label: "The War Rig"
    # `movement` (the chase precedent), NOT `combat`: this is a vehicular crew
    # action resolved by the table engine (reads table_state, never the dial/HP
    # combat seam). `combat` would wrongly enlist it in the single-combat
    # opponent-seed assertions road_warrior's CWN tests pin (86-1).
    category: movement
    resolution_mode: table_resolution
    win_condition: table_showdown
    table_game: war_rig_crew
    max_decision_points: 4
    intent_verbs:
      - steer
      - shoot
      - repair
      - scan
    on_intent_mismatch: warn
    beats:
      - id: steer
        label: "Steer"
        kind: push
        base: 2
        stat_check: DEX
        effect: "Hold the line — thread wreckage, keep the rig out of the kill box"
        narrator_hint: "Hands locked on the wheel, you read the road and pick the gap."
      - id: shoot
        label: "Man the Guns"
        kind: strike
        base: 3
        stat_check: DEX
        risk: "Miss and the threat closes — a wasted burst is a wasted round"
        narrator_hint: "Swing the turret, lead the target, squeeze. Brass rains on the deck."
      - id: repair
        label: "Patch the Rig"
        kind: brace
        base: 2
        stat_check: INT
        effect: "Crawl the chassis under fire — shore the Hull where it's failing"
        narrator_hint: "Sparks, a wrench, a curse. You weld the wound shut as it spreads."
      - id: scan
        label: "Spot the Threat"
        kind: push
        base: 1
        stat_check: WIS
        effect: "Call the threat's next move so the crew can answer it"
        narrator_hint: "Up in the cupola, glassing the dust line. You see them before they commit."
    mood: tension

