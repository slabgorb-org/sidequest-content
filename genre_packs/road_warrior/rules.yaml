tone: defiant-kinetic
lethality: gritty
magic_level: none
# DRAFT (2026-04-27): the `magic_level` flag is being retired and is wrong here.
# The named vehicle (Interceptor, War Rig, Pursuit Special) is the magic item.
# "The man with the V8 Interceptor" is mythic-folkloric item-magic; the mechanic
# is the McCoy/inventor source. World-knowledge is folkloric. See ./magic.yaml
# for the napkin-shaped truth and docs/design/magic-taxonomy.md for the framework.

stat_generation: point_buy
point_buy_budget: 27

# D3 (Story 86-1 Plan 1): road_warrior adopts the STANDARD CWN six on the sheet
# and drops the old flavor names (Grip/Iron/Nerve/Scrap/Road Sense/Swagger).
# The narrator may still *call* DEX "grip", STR "iron", etc. in prose, but every
# MECHANICAL stat reference uses the standard six. Flavor->stat mapping (locked):
#   Grip -> DEX, Iron -> STR, Nerve -> WIS, Scrap -> INT, Road Sense -> CON,
#   Swagger -> CHA.
ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

# CWN binding (Story 86-1 Plan 1). The validator (_validate_cwn) requires a
# complete six-key identity attribute_map even though the sheet already uses the
# canonical labels ("zero attribute-map risk" — the obvious identity map).
ruleset: cwn
cwn:
  attribute_map:
    STRENGTH: STR
    DEXTERITY: DEX
    CONSTITUTION: CON
    INTELLIGENCE: INT
    WISDOM: WIS
    CHARISMA: CHA

allowed_classes:
  - Wheelman
  - Wrecker
  - Grease Monkey
  - War Rider
  - Chrome Saint
  - Road Preacher

allowed_races:
  - Convoy Born
  - Gearhead
  - Outlaw
  - Pit Crew
  - Scrapper
  - Legacy


# D2 (Story 86-1 Plan 1): Driver Edge (ADR-078) is REMOVED. The driver is now a
# full ablative-HP CWN character (ADR-114) — survivability is the standard CWN
# HP/Shock/Trauma/Mortal-Injury stack, the same combat model as space_opera and
# neon_dystopia. Fuel, injuries, and dismounted remain character-side trackers.
stat_display_fields:
  - hp
  - max_hp
  - fuel
  - injuries
  - dismounted


default_class: Wheelman
default_race: Scrapper
race_label: Background
class_label: Role
default_location: "In a garage with the hood up, radio on, crew somewhere nearby"
default_time_of_day: dawn

custom_rules:
  lethality: gritty
  rest_variant: gritty_realism
  encumbrance: variant

  # --- DAMAGE MODEL: ABLATIVE HP (ADR-114 / CWN) ---

  damage_model: >-
    Road Warrior runs the standard CWN personal-combat model: the driver
    is a full ablative-HP character (ADR-114). Driver Edge (ADR-078) has
    been removed — there is one combat model engine-wide, the same as
    space_opera and neon_dystopia.

    PERSONAL / DISMOUNTED COMBAT (mechanically live in Plan 1):
    Attacks roll to-hit vs the target's Armor Class; on a hit the weapon's
    damage ablates HP after armor soak. Lethal weapons also roll Trauma — a
    Traumatic Hit multiplies damage. At 0 HP a character takes a Mortal
    Injury: they die within a handful of rounds unless someone stabilizes
    them. Never narrate a kill, a Trauma multiplier, or an injury you did
    not let the engine roll. The dice and the tools are the truth; your
    prose dramatizes them.

    RIG COMPOSURE (NOT YET MECHANICALLY LIVE — Plan 2):
    The rig-as-armor / Rig Composure two-pool vehicle model described in
    the rig_* prose below is INERT in Plan 1. It is retained as a design
    target for Plan 2 (solo rig vehicle combat) and Plan 4 (the War Rig).
    Do NOT imply mechanical backing for Rig Composure, crash events, or
    chase pools yet — no RigComposurePool is wired into a confrontation in
    Plan 1. The only mechanically live combat is personal ablative-HP
    driver combat (the `combat` confrontation below).

  rig_damage_tiers: >-
    INERT in Plan 1 (no RigComposurePool wired yet — Plan 2).
    Rig Composure narrative tiers (for narrator description as the
    Composure pool drains, not separate mechanical bands):

    full Composure   — Tight. Everything works. Engine purrs.
    75% Composure    — Cosmetic damage. Rattles, dents, cracked mirror.
                       Functional. Body shop fix.
    50% Composure    — Systems failing. Door hanging off, windshield
                       gone, exhaust dragging sparks. Mounted-only
                       Speed penalty kicks in.
    25% Composure    — Skeleton mode. Barely holding. Major Speed
                       penalty, a mount slot may be destroyed, any
                       hit risks fire.
    0  Composure     — CRASH EVENT (see damage_model).

  rig_composure_spec: >-
    INERT in Plan 1 (no RigComposurePool wired yet — Plan 2).
    Backend reference (see Plan 2 for RigComposurePool wiring):

    - Each character has one named rig (vessel item, inventory.yaml).
    - The vessel item carries: composure (current), composure_max
      (per rig tier), speed, armor, fuel_capacity, mount_slots, scars.
    - Composure_max by rig tier:
        tier 1 (prospect)         max 4   1 mount slot
        tier 2 (runner)           max 6   2 mount slots
        tier 3 (road name)        max 8   3 mount slots + 1 signature trait
        tier 4 (convoy legend)    max 10  4 mount slots + 2 signature traits
        tier 5 (road immortal)    max 12  5 mount slots + legendary tag
    - Composure recovery:
        on_resolution: 0 (rig damage is sticky — repair is a story beat)
        on_long_rest: 0 (you fix it at a garage; the bed doesn't fix it)
        on_repair_scene: full (a Grease Monkey + parts + time)
    - Crash event hook (Composure crosses 0 downward): fire
      event_id: rig_crash. The handler MUST emit OTEL span
      `rig_pool.crash_event` with {rig_slug, location, attacker} per
      ADR-031, write the dismounted status, and apply crash damage to
      the driver's ablative HP (ADR-114) + 1 injury tag.

  injury_system: >-
    Per ADR-080: injuries are narrative_weight tags on the character,
    not a parallel HP pool. When the driver takes direct damage
    (dismounted, crash event, boarding combat, or rig pierced) they
    take an INJURY tag — a specific, named wound with a stat penalty:

      Slashed Arm     → DEX -1      (heals in 2 sessions / medical care)
      Concussion      → CON -1
      Broken Rib      → STR -1, WIS -1 in fast scenes
      Burned          → INT -1 until salved
      Whiplash        → -1 to all checks first round of any chase scene
      Internal        → -1 max HP until full medical (this is the bad one)

    Tags live as narrative_weight entries on the character; the narrator
    references them until healed. Light injuries dissolve at long rest;
    serious ones (Broken Rib, Internal) require a medical scene.

  # --- RIG AS VESSEL ---

  rig_rules: >-
    Per magic.yaml: the rig is an item_based / vessel — a first-class
    item in inventory.yaml, not a Car-acter-Sheet sidebar. Every
    character has exactly one named rig (vessel_id pointer on the
    character → rig vessel item).

    Vessel fields (authored in inventory.yaml under vessels:):
      name           — player-chosen at chargen (the_name scene)
      type           — world-defined chassis class (kaidō racer, chopper,
                       Vespa, dekotora, lowrider Impala, matatu, tuk-tuk,
                       Raggare V8, etc.)
      composure      — current Rig Composure
      composure_max  — by tier (see rig_composure_spec)
      speed          — base movement / chase tier
      armor          — flat reduction on incoming Composure damage
      fuel           — current fuel; max from fuel_capacity
      mount_slots    — weapon/tool hardpoints, scales with tier
      signature_traits — per-tier narrative descriptors (Tier-3+)
      scars          — narrative history array (each scar is a repair
                       story; do NOT prune them)

    Losing your rig means losing your armor pool, your speed, your mount
    slots, your signature traits, your identity. You're meat on the
    road. Getting a new rig is a story arc, not a transaction —
    inheritance, salvage rebuild (Grease Monkey + parts + time), or
    earning a faction-issued vessel.

  fuel_system: >-
    Fuel is tracked during chases and long runs — not as a survival
    resource but as a tactical one. Running low mid-chase means hard
    decisions. Running dry means your rig is dead weight — Rig
    Composure still absorbs hits (you're cover), but Speed → 0 means
    no escape. In normal play, fuel is available at gas stations like
    anywhere else. The drama isn't "can I find fuel" — it's "can I
    afford to burn fuel on this chase and still make it across town."

  chase_system: >-
    NOT YET A MECHANICAL CONFRONTATION (Plan 3). The `chase` confrontation
    below is a dial-threshold encounter with no Rig Composure backing in
    Plan 1. This prose is the design target for Plan 3.
    Chases are structured as beat sequences, not single rolls. Each chase
    has an Opening (engage or evade?), Pursuit (distance, terrain, hazards),
    Escalation (boarding, weapons, rig damage), Crisis (something breaks,
    someone falls, a choice), and Resolution (wreckage, escape, or victory).
    Each beat is a decision point. If there is no decision, skip the beat.
    Rig Composure degrades through the chase — the narrator reflects this
    as progressive visible damage. Allies can fall. The fortress crumbles.

  dismounted_rules: >-
    A driver without a rig is in survival mode. No Rig Composure buffer
    (Plan 2) — incoming damage hits the driver's ablative HP directly. All
    DEX checks at disadvantage. CHA checks to maintain reputation take a
    penalty.
    Movement is slow in a world built for wheels. The world treats you
    differently — you're a driver who lost their ride. Getting a new
    rig or recovering your old one is a story arc, not a shopping trip.
    The narrator should make dismounted sequences feel desperate and
    wrong — this is not where you belong.

  rig_progression_arc: >-
    The level arc for narrator reference (mechanical bonuses come from the
    standard progression.yaml level_bonuses; this arc colors the *flavor*
    of each tier):

    Level 1 — Prospect: Fresh on the road. Your rig is new to you or you're
    new to it. 1 mount slot.

    Level 3 — Runner: You've survived enough runs to know what you're doing.
    2 mount slots, +10 Rig HP.

    Level 5 — Road Name: People know your name and your rig's name.
    Reputation opens doors. 3 mount slots, +20 Rig HP, rig gains a
    Signature Trait.

    Level 7 — Convoy Legend: War boys want to ride with you. Fuel brokers
    give you credit. Your rig is famous. 4 mount slots, +30 Rig HP, rig
    gains a second Signature Trait.

    Level 10 — Road Immortal: Your name is spoken on every frequency. Your
    rig is a legend. The road itself seems to bend for you. 5 mount slots,
    +50 Rig HP, rig becomes Legendary (narratively indestructible except
    for story reasons).

resources:
  - name: fuel
    label: Fuel
    min: 0.0
    max: 100.0
    starting: 50.0
    voluntary: false
    decay_per_turn: 0.0

encounter_base_tension:
  random: 0.10
  road_encounter: 0.20
  ambush: 0.35
  chase: 0.40
  boss: 0.45
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Wasteland Bargain"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093.
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Make Your Case"
        kind: strike
        base: 2
        stat_check: CHA
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        stat_check: STR
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Rev the engine. Let them hear what's coming."
      # concede_point: strategic give-ground to reveal opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: CHA
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: STR
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player fires up the rig and leaves. No deal."
    mood: tension

  - type: combat
    label: "Roadside Brawl"
    # Story 86-1 Plan 1: PERSONAL driver combat (CWN on-foot, ablative HP).
    # This is NOT rig/vehicle combat — that is Plan 2 (the ram/sideswipe
    # vehicular beats were moved out). This is the wheelman out of the cab:
    # pistols, scrap iron, and cover, resolved on HP-to-0 like space_opera
    # and neon_dystopia personal combat.
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [strike, attack, fight, kill, shoot, fire, gun, hit, stab, swing]
    on_intent_mismatch: reprompt
    category: combat
    # CWN personal combat: attack-vs-AC + hp_depletion on the ablative HpPool.
    # Trauma/Shock/Mortal/Major Injury layer on via the cwn ruleset module.
    resolution_mode: beat_selection
    win_condition: hp_depletion
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
      # Reserved combat-seed keys (not ability scores) — seed the runtime
      # CreatureCore for hp_depletion. hp = HP pool; armor_class = ascending
      # AC the attack rolls against; dexterity = SWN 1d8+DEX initiative.
      # Road raider: AC 12 (leathers + scavenged plate), HP 12, drops in a
      # few solid hits.
      hp: 12
      armor_class: 12
      dexterity: 10
    beats:
      - id: shoot
        label: "Snap Shot"
        kind: strike
        base: 2
        stat_check: DEX
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Target takes weapon damage from your sidearm"
        narrator_hint: "Pistol up over the door, a flat crack across the hardpan."
      - id: pistol_whip
        label: "Pistol-Whip"
        kind: strike
        base: 2
        stat_check: STR
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Close-quarters strike — scrap iron, a wrench, the butt of a gun"
        narrator_hint: "Up close it's elbows and steel. Wet, ugly, fast."
      - id: take_cover
        label: "Take Cover"
        kind: brace
        base: 1
        stat_check: DEX
        effect: "Reduce incoming damage behind the wreck or the engine block"
        narrator_hint: "Drop behind the chassis. Let the rounds spang off the block."
      - id: break_off
        label: "Break Off"
        kind: push
        stat_check: CON
        consequence: "Combat ends — get back to the rig and gun it"
        narrator_hint: "Sprint for the cab, drop into the seat, fire it up and go."
    # The raider reprises — a playable fight the wheelman can LOSE.
    # opponent_attack drives the to-hit; opponent_damage is the reprisal
    # damage the dispatcher reads (the seeded opponent NPC has no inventory,
    # so without opponent_damage the enemy hits but deals 0 — playtest 67-10).
    opponent_attack:
      stat_check: DEX
      attack_bonus: 1
      combat_skill: 1
      damage:
        dice: "1d6"
        trauma_die: "1d8"
        trauma_rating: 2
        trauma_target: 8
    opponent_damage:
      dice: "1d6"
      trauma_die: "1d8"
      trauma_rating: 2
      trauma_target: 8
    mood: combat

  - type: chase
    label: "Road Chase"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [chase, pursue, flee, run, escape, follow]
    on_intent_mismatch: reprompt
    category: movement
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093.
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: floor_it
        label: "Floor It"
        kind: push
        base: 2
        stat_check: CON
        narrator_hint: "Engine screams, dust plume stretches behind."
      - id: terrain_cut
        label: "Terrain Cut"
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: INT
        risk: "Rollover — take rig damage on failure"
        narrator_hint: "Leave the road. Cut across hardpan, jump a wash."
      # smoke_screen: oil burn or dust cloud — angle (misdirection tag on pursuers)
      - id: smoke_screen
        label: "Smoke Screen"
        kind: angle
        target_tag: "Blinded"
        stat_check: INT
        effect: "Oil burn or dust cloud blinds pursuit"
        narrator_hint: "Pop the smoker, pull the rip-cord, leave them coughing in your wake."
      - id: engine_kill
        label: "Kill the Engine"
        kind: push
        stat_check: CON
        consequence: "Chase ends — coast to a stop in the dust, hidden"
        narrator_hint: "Cut the engine. Glide silent into cover. Let them roar past."
    mood: tension

