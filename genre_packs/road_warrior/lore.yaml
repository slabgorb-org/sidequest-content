world_name: Road Warrior
setting_anchor: "A world defined by what you ride, who you ride with, and whose road you're on."
history: >-
  The road is the only world that matters. Civilization exists all around
  it — cities, towns, gas stations, diners — but the culture that matters
  happens on asphalt, between crews, at speed. How the crews formed, why
  they ride, what they fight over — that depends on the world. The genre
  only cares about what happens now: you grip the handlebars, the engine
  answers, and the road belongs to whoever takes it.
factions: []
cosmology: >-
  There are no gods on the road. There are engines, reputation, and the
  next corner. Some riders find religion in speed. Some find it in the
  crew. Some find it in the machine itself — the rig as altar, the ride
  as prayer.
geography: >-
  World-defined. The genre supports any terrain — urban, suburban, coastal,
  mountain, rural. The road adapts. The rules don't change. The default
  assumption is a city or region with functioning infrastructure where
  road culture exists as a parallel world underneath everyday life.
