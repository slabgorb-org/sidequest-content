# Character portraits for The Circuit
# Visual descriptions for Flux portrait generation
# Late-1970s Kodachrome photography aesthetic — sun-bleached, high contrast,
# warm desaturated palette, gritty and road-worn

characters:
  # ── FRESH: NEW BLOOD ───────────────────────────────────────────

  - name: Spark Greasefire
    role: Pit Crew Mechanic
    type: npc_major
    appearance: >-
      A woman in her forties with a shaved head and safety goggles pushed
      up on her forehead like a crown. Dark skin covered in a permanent
      patina of engine grease that she's stopped trying to wash off. Burn
      scars ladder up both forearms from years of welding. Broad shoulders,
      thick wrists, hands that could palm a transmission housing. Wears a
      sleeveless mechanic's coverall over a tank top, steel-toed boots
      worn smooth at the toe. A heavy tool belt hangs low on her hips. Her
      expression is patient, appraising — the look of someone who listens
      to your engine before she listens to you.
    culture_aesthetic: >-
      Pit Crew origin — working-class garage culture, function over form.
      Coveralls, burn marks, oil stains as badges of competence. No faction
      colors — she fixes everyone's rig and belongs to no one.
    element_visual: >-
      Welding goggles on forehead, oversized wrench tucked through belt
      loop, grease-blackened fingernails, a small blowtorch holstered at
      her hip like a sidearm.

  - name: Haraka
    role: Matatu Tout and Information Broker
    type: npc_supporting
    appearance: >-
      A lean young man in his twenties with close-cropped hair and a smile
      that never quite reaches his calculating eyes. Dark brown skin, sharp
      cheekbones, a thin scar across the bridge of his nose from a side-mirror
      impact. Wears a brightly patterned button-up shirt open over a white
      vest, slim trousers, and canvas sneakers good for jumping on and off
      moving vehicles. A whistle on a cord around his neck. Moves like he's
      always in transit — never standing still, always half-turned toward
      the next thing.
    culture_aesthetic: >-
      Matatu Crews — Nairobi street style, loud patterns, practical shoes,
      the uniform of a tout who spends twelve hours hanging from a minibus
      doorway shouting destinations.
    element_visual: >-
      Metal whistle on a cord, a rolled wad of currency in his shirt pocket,
      a battered Nokia phone in each hand, the scar across his nose catching
      light.

  # ── EARLY: EARNING COLORS ──────────────────────────────────────

  - name: Souchou Hayate
    role: Bosozoku Formation Leader
    type: npc_major
    appearance: >-
      A young man barely twenty with a sharp angular face and hair spiked
      straight up in a pompadour that adds six inches to his height. Pale
      skin, dark eyes lined with exhaustion and adrenaline. Lean and wiry —
      built for a motorcycle, not a fight, though he's been in plenty. Wears
      a modified tokkoufuku — a long embroidered coat in black and crimson
      with kanji down the back, open over a white jumpsuit. Tall boots
      with steel plates riveted to the shins. His jaw is set in a permanent
      challenge.
    culture_aesthetic: >-
      Bosozoku — Japanese biker punk, tokkoufuku long coats, rising-sun
      headbands, the aesthetic of 1970s Japanese youth rebellion filtered
      through Germanic precision. Every stitch is deliberate provocation.
    element_visual: >-
      Six-inch pompadour, crimson-and-black embroidered long coat with
      faction kanji, steel-plated boots, a hachimaki headband tied at
      the temple, white knuckle gloves.

  - name: Tombstone
    role: 1%er Chapter President
    type: npc_major
    appearance: >-
      A massive man in his fifties with a grey beard braided into two forks
      and hands like engine blocks. Weathered white skin tanned to leather
      by decades of highway sun. A face that looks like it lost arguments
      with pavement — twice-broken nose, a scar bisecting his left eyebrow,
      one ear cauliflowered. Shaved head under a faded black bandana. Wears
      a patched denim vest over a black t-shirt, the vest heavy with club
      patches and pins. Arms sleeved in old tattoos blurred by sun and age.
      His eyes are pale blue and absolutely empty of warmth.
    culture_aesthetic: >-
      1%er outlaw MC — American outlaw biker, patched denim and leather,
      club colors, the aesthetic of men who treat their vest patches like
      military insignia because that's exactly what they are.
    element_visual: >-
      Patched denim cut with president's rocker, braided grey beard, faded
      sleeve tattoos, heavy silver rings on every finger, a chain wallet
      hanging to his knee.

  - name: Ace Nifty
    role: Mod Intelligence Broker
    type: npc_major
    appearance: >-
      A slim person of indeterminate age — could be thirty, could be
      forty-five — with a narrow face, sharp cheekbones, and immaculately
      styled hair in a side-parted sweep that hasn't moved since 1965.
      Olive skin, dark eyes that inventory everything in a room before
      their body finishes entering it. Wears a tailored three-button suit
      in charcoal over a black turtleneck, Italian leather shoes polished
      to mirrors. Not a wrinkle, not a thread out of place. In a city of
      grease and dust, Ace Nifty is surgically clean. That is the threat.
    culture_aesthetic: >-
      Mods — British mod subculture, continental tailoring, obsessive
      attention to detail, the aesthetic of someone who believes style
      is a weapon and deploys it accordingly. Italian-English fusion.
    element_visual: >-
      Immaculate charcoal suit, mirror-polished shoes, a Vespa key on a
      silver chain visible at the hip, multiple mirrors on a parked scooter
      behind them reflecting the scene.

  # ── MID: THE WAR FOR THE ROAD ──────────────────────────────────

  - name: Kongou-maru
    role: Dekotora Convoy Master
    type: npc_major
    appearance: >-
      Portrait of an old heavyset Japanese man in his sixties, broad
      weathered face with deep wrinkles and sun damage, deep-set dark eyes,
      grey hair cropped close under a peaked driver's cap. Heavy jowls,
      thick neck, large calloused hands with thick fingers. Wearing a
      pressed white short-sleeve shirt with a pen in the breast pocket,
      dark work trousers, and leather driving gloves worn thin at the palm.
      A small Buddhist shrine charm hangs from a cord at his neck. Serious
      formal expression, the face of an old trucker who has seen everything
      and says nothing. Weathered skin, age spots, deep nasolabial folds.
    culture_aesthetic: >-
      Dekotora — Japanese decorated truck culture. A modest old working man,
      plain clothes, no glamour. The neon lights of a decorated truck reflect
      faintly in his eyes and on the sweat on his forehead. Dust and diesel
      grime on his collar.
    element_visual: >-
      Peaked driver's cap casting shadow over his eyes, shrine charm at the
      neck, leather driving gloves worn thin at the palm, the colorful
      reflection of neon truck lights on his weathered face, a leather-bound
      journal visible in his shirt pocket. Solo portrait, single male
      subject, no other people in frame.

  - name: Don Flaco de la Cruz
    role: Lowrider Elder and Peacemaker
    type: npc_major
    appearance: >-
      Portrait of a thin elderly Mexican man in his sixties, gaunt face
      with prominent cheekbones, a carefully maintained thin pencil
      mustache, slicked-back silver hair combed tight to the skull. Dark
      brown weathered skin with deep creases and sun damage, the texture
      of old leather. Deep-set brown eyes under heavy brows. Erect posture,
      narrow shoulders, bony hands with visible veins and a gold watch.
      Wearing a pressed white guayabera shirt over a white undershirt,
      creased khaki trousers, mirror-polished black shoes. A single thin
      gold chain at his neck. Thin lips, serious dignified expression,
      the face of an old veterano who has buried friends and outlived
      enemies.
    culture_aesthetic: >-
      Lowrider Chicano car culture, East LA boulevard elegance. An old
      man in immaculate plain clothes, no flash except the gold chain
      and watch. Dust on his shoes from a desert parking lot. The faint
      reflection of candy-apple-red paint on his face.
    element_visual: >-
      Pencil mustache, slicked silver hair, white guayabera, thin gold
      chain, bony hands resting on his knees, the curved chrome bumper
      of a lowrider Impala reflected behind him. Solo portrait, single
      male subject, no other people in frame.

  - name: Phi Lek
    role: Tuk-Tuk Syndicate Operator
    type: npc_major
    appearance: >-
      A small man — lek means small and he earned that name twice over.
      Late fifties, wiry, with sun-darkened skin, a shaved head, and eyes
      that are always slightly amused. His face is lined but not aged —
      more weathered than old, like a piece of driftwood that's been
      shaped by current rather than decay. Wears a loose collarless shirt,
      fisherman's pants, and rubber sandals. No jewelry, no watch, nothing
      that would snag or identify. He sits in a plastic chair in an alley
      that shouldn't fit a chair and drinks iced tea and knows everything.
    culture_aesthetic: >-
      Tuk-Tuk Syndicate — Southeast Asian alley culture, Thai-Khmer
      aesthetic. Deliberate plainness, the invisibility of someone who has
      decided that being overlooked is the most powerful position in any
      room.
    element_visual: >-
      Bare shaved head, rubber sandals, a glass of iced tea, plastic chair
      in a narrow alley with electrical wires overhead, the handlebars of
      a tuk-tuk visible at the edge of frame.

  # ── VETERAN: THE THREAD ────────────────────────────────────────

  - name: The Kungansen Magnus
    role: Raggare Elder
    type: npc_major
    appearance: >-
      A large man in his sixties with a belly that speaks to decades of
      drive-in food and a face that speaks to decades of Scandinavian
      winter — ruddy, broad, framed by grey muttonchop sideburns that
      haven't been fashionable since 1958 and never will be again. Pale
      blue eyes, a wide nose broken at least once, and a gap-toothed
      smile that is entirely genuine. Wears a white t-shirt with the
      sleeves rolled up over thick forearms, jeans with a two-inch cuff,
      and engineer boots. A pack of cigarettes rolled into his left
      sleeve. Pomade in his thinning grey hair, combed back in a ducktail
      that the years have not been kind to.
    culture_aesthetic: >-
      Raggare — Swedish greaser culture, 1950s American nostalgia filtered
      through Scandinavian pragmatism. Rolled-sleeve tees, cuffed jeans,
      pomade, the aesthetic of a man who lives in a permanent 1957 that
      never existed outside a parking lot in Bromsviken.
    element_visual: >-
      Muttonchop sideburns, rolled-sleeve white tee with cigarette pack,
      greased-back ducktail, engineer boots, a set of car keys on a
      long chrome chain, the curved chrome bumper of a '57 Chevy
      reflected behind him.

  - name: Ton Redline
    role: Cafe Racer Speed Legend
    type: npc_major
    appearance: >-
      A person of indeterminate age and minimal words — could be thirty,
      could be fifty, with a runner's build whittled down to wire and
      sinew. Angular face, sharp jaw, skin browned by wind and sun to
      a uniform leather tone. Eyes that are always focused on a vanishing
      point nobody else can see. Wears a scuffed brown leather jacket
      zipped to the throat, dark jeans, and racing boots with steel
      toe sliders worn to bright metal. A scratched open-face helmet
      hangs from one hand. No patches, no faction colors, no name
      visible anywhere on their person. The helmet has a single stripe —
      faded red — and nothing else.
    culture_aesthetic: >-
      Cafe Racer — British speed culture, stripped-down minimalism, the
      aesthetic of someone who has removed everything that doesn't make
      the bike go faster, including their own personality.
    element_visual: >-
      Scuffed brown leather jacket, steel-toed racing boots worn bright
      at the slider, open-face helmet with a single faded red stripe,
      no visible insignia, the outline of a stripped-down Norton or
      Triton behind them.

  # ── CROSS-FACTION ──────────────────────────────────────────────

  - name: Elsa Bruckner
    role: The Architect (Historical / Ghost)
    type: npc_supporting
    appearance: >-
      A woman in her forties as captured in a faded 1970s photograph —
      severe blonde hair pulled back in a tight chignon, sharp Nordic
      features, wire-rimmed glasses, and the unsmiling expression of
      someone who builds things that outlast people. Wears a white
      blouse under a grey blazer, a slide rule visible in the breast
      pocket. Her hands rest on a drafting table covered in blueprints.
      The photograph is sun-damaged, the colors shifted to amber and
      cyan, the edges curling. She looks directly into the camera as
      if she knows exactly who will be looking at this picture and when.
    culture_aesthetic: >-
      Swiss engineering professional, 1970s — clinical European
      modernism, the aesthetic of postwar infrastructure planning.
      Functional, precise, and utterly without vanity.
    element_visual: >-
      Wire-rimmed glasses, slide rule in pocket, blueprints on the
      table behind her, a faded Kodachrome color shift in the image,
      the Meridian Asphalt logo on a nameplate at the edge of frame.

  - name: Bruckner's Ghost
    role: The Ghost Rig Driver (Apparition)
    type: npc_supporting
    appearance: >-
      A figure seen only in peripheral vision and tunnel darkness — a
      silhouette behind a windshield lit from below by dashboard
      instruments. The shape suggests a woman, upright, both hands on
      the wheel. The vehicle changes depending on who sees it — a
      kaido racer, an Impala, a decorated truck — but the driver is
      always the same: still, focused, and driving a road that was
      designed before anyone else knew it existed. Seen in motion,
      never stopped. Headlights but no engine sound.
    culture_aesthetic: >-
      No culture — or all cultures simultaneously. The ghost rig
      reflects the observer's faction aesthetic back at them. The
      driver alone is constant and cultureless.
    element_visual: >-
      Dashboard glow on a silhouetted face, headlights in tunnel
      darkness, the vehicle blurred by motion while the driver is
      perfectly still, no exhaust, no sound, just light on asphalt.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS (20)
  # Pre-generated sample faces for the chargen portrait chooser.
  # Each entry names a real rendered POI slug (backdrop_poi) from the
  # world's history.yaml POI set, confirmed present in r2_manifest.json;
  # the daemon's portrait-in-location preset plants the subject inside
  # that POI under the late-70s Kodachrome register.
  #
  # DISCIPLINE: `appearance` is a folded scalar, PHYSICAL face / upper
  # body ONLY (2–4 sentences) — no POI scene, montage-safe. Wardrobe and
  # faction colors live in cultures/<id>.yaml; do not restate the POI
  # here or a second wide-scene clause triggers the Z-Image split montage.
  # `culture` = world.yaml faction id; `archetype` = real archetype name
  # (world archetypes.yaml + pack archetypes.yaml).
  #
  # Allocation: 10M / 10F across all 10 cultures, two faces each.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Bōsōzoku ──────────────────────────────────────────

  - id: picker_bosozoku_souchou_f01
    name: picker bosozoku souchou f01
    role: The Souchou
    type: player_picker
    culture: bōsōzoku
    archetype: The Souchou
    sex: female
    backdrop_poi: dunkelkurve
    appearance: >-
      Young woman, barely twenty. Round determined face, jet-black hair
      cut in a blunt fringe and pinned back hard. Narrow watchful eyes
      that go flat and certain, a small stubborn mouth. A faded hachimaki
      knotted across the brow. Soft and shy in repose, iron under pressure.

  - id: picker_bosozoku_tokkoutai_m01
    name: picker bosozoku tokkoutai m01
    role: The Tokkoutai
    type: player_picker
    culture: bōsōzoku
    archetype: The Tokkoutai
    sex: male
    backdrop_poi: sturmrohr
    appearance: >-
      Man, early twenties, wiry and reckless. Lean Japanese face, sharp
      jaw, a half-healed gash across one eyebrow. Black hair greased into
      a high wave, a wide manic grin that arrives a half-second too late.
      Bright fearless eyes. The laughing look of someone who volunteers first.

  # ── Picker · Mods ──────────────────────────────────────────────

  - id: picker_mods_face_m01
    name: picker mods face m01
    role: The Face
    type: player_picker
    culture: mods
    archetype: The Face
    sex: male
    backdrop_poi: nachtglas
    appearance: >-
      Man, late twenties. Sharp clean-shaven English face, high cheekbones,
      a neat side-parted mod crop. Cool grey eyes that price your shoes
      before your name, an easy half-smile held just shy of warmth.
      Immaculate. Faintly, deliberately bored.

  - id: picker_mods_ticket_f01
    name: picker mods ticket f01
    role: The Ticket
    type: player_picker
    culture: mods
    archetype: The Ticket
    sex: female
    backdrop_poi: the_mod_exchange
    appearance: >-
      Woman, thirties, forgettable on purpose. Even pale English face, mousy
      bobbed hair, quiet hazel eyes that miss nothing and reveal less. A
      plain neat mouth, no jewellery, nothing to describe to a stranger
      afterward. Calm, attentive, untraceable.

  # ── Picker · 1%ers ─────────────────────────────────────────────

  - id: picker_one_percenters_prez_m01
    name: picker one percenters prez m01
    role: The Prez
    type: player_picker
    culture: 1%ers
    archetype: The Prez
    sex: male
    backdrop_poi: langbrenner_overpass
    appearance: >-
      Man, fifties. Heavy weathered face seamed by sun and road, iron-grey
      beard cropped close, deep-set eyes that have decided everything in
      advance. A flat hard mouth, a broken nose long since set crooked. The
      controlled stillness of a man who never has to raise his voice.

  - id: picker_one_percenters_enforcer_f01
    name: picker one percenters enforcer f01
    role: The Enforcer
    type: player_picker
    culture: 1%ers
    archetype: The Enforcer
    sex: female
    backdrop_poi: aschpfeiler
    appearance: >-
      Woman, forties, broad and unhurried. Wide scarred face, sandy hair
      shaved at the sides and tied back, pale unblinking eyes. A jaw set
      like a clenched fist, knuckle-split lip healed twice over. Calm in a
      way that is its own warning.

  # ── Picker · Café Racers ───────────────────────────────────────

  - id: picker_cafe_racers_ton_m01
    name: picker cafe racers ton m01
    role: The Ton
    type: player_picker
    culture: café_racers
    archetype: The Ton
    sex: male
    backdrop_poi: bruveil_serpentine
    appearance: >-
      Man, thirties, spare and quiet. Narrow windburned face, short dark
      hair flattened by a helmet, pale eyes fixed on some middle distance
      measured in seconds. A thin closed mouth that answers in nods. Lean,
      precise, entirely without decoration.

  - id: picker_cafe_racers_lone_rider_f01
    name: picker cafe racers lone rider f01
    role: The Lone Rider
    type: player_picker
    culture: café_racers
    archetype: The Lone Rider
    sex: female
    backdrop_poi: grauturm
    appearance: >-
      Woman, late twenties. Sharp wind-chapped face, freckles under a salt
      tan, short dark hair raked back from a high forehead. Steady green
      eyes that hold a fraction too long, a faint scar lining one cheekbone.
      Self-contained, unhurried, watchful.

  # ── Picker · Rockers ───────────────────────────────────────────

  - id: picker_rockers_bruiser_m01
    name: picker rockers bruiser m01
    role: The Bruiser
    type: player_picker
    culture: rockers
    archetype: The Bruiser
    sex: male
    backdrop_poi: motorheim
    appearance: >-
      Man, forties, built like a garage door. Big square face, heavy brow,
      greasy black quiff falling loose over a creased forehead. Thick muttonchop
      sideburns, a flattened nose, small good-humoured eyes. Knuckles he cracks
      without thinking. Direct, fair, and very hard to move.

  - id: picker_rockers_mechanic_f01
    name: picker rockers mechanic f01
    role: The Mechanic
    type: player_picker
    culture: rockers
    archetype: The Mechanic
    sex: female
    backdrop_poi: sparks_bench
    appearance: >-
      Woman, thirties. Broad capable face streaked with engine grease at
      one temple, dark hair tied up under a knotted bandana. Steady brown
      eyes that listen to your engine before they listen to you, a small
      wrench-shaped burn scar on the jaw. Patient, appraising, unbothered.

  # ── Picker · Lowriders ─────────────────────────────────────────

  - id: picker_lowriders_veterano_m01
    name: picker lowriders veterano m01
    role: The Veterano
    type: player_picker
    culture: lowriders
    archetype: The Veterano
    sex: male
    backdrop_poi: dorapinta
    appearance: >-
      Man, sixties. Lined dignified Chicano face, silver hair combed back
      sleek, a neat pencil moustache gone grey. Warm hooded eyes set in
      deep crow's-feet, a faded teardrop tattoo at one eye. The patient,
      proud stillness of an elder who cruises now and races never.

  - id: picker_lowriders_veteran_f01
    name: picker lowriders veteran f01
    role: The Veteran
    type: player_picker
    culture: lowriders
    archetype: The Veteran
    sex: female
    backdrop_poi: flacos_doravio
    appearance: >-
      Woman, fifties. Strong handsome Chicana face, dark hair pinned high
      with a single curl set at the brow, gold hoops at the ears. Sharp dark
      eyes lined in kohl, a knowing red mouth, a small cross at the throat.
      Carries decades of the boulevard in the set of her chin.

  # ── Picker · Matatu Crews ──────────────────────────────────────

  - id: picker_matatu_makanga_m01
    name: picker matatu makanga m01
    role: The Makanga
    type: player_picker
    culture: matatu_crews
    archetype: The Makanga
    sex: male
    backdrop_poi: harijumba
    appearance: >-
      Man, mid-twenties, all motion even when still. Lean dark-brown face,
      close-cropped hair, a thin scar across the bridge of the nose from a
      side-mirror. Bright fast-calculating eyes, a wide quick grin, a brass
      whistle on a cord at the throat. Loud, connected, never quiet.

  - id: picker_matatu_broker_f01
    name: picker matatu broker f01
    role: The Broker
    type: player_picker
    culture: matatu_crews
    archetype: The Broker
    sex: female
    backdrop_poi: harijumba
    appearance: >-
      Woman, forties. Round shrewd dark-brown face, hair wrapped in a bright
      printed headscarf, steady amused eyes that tally everyone in the room.
      A gold tooth in an easy smile, reading glasses pushed up on the brow.
      Warm, unhurried, and always counting.

  # ── Picker · Tuk-Tuk Syndicate ─────────────────────────────────

  - id: picker_tuk_tuk_phi_f01
    name: picker tuk tuk phi f01
    role: The Phi
    type: player_picker
    culture: tuk_tuk_syndicate
    archetype: The Phi
    sex: female
    backdrop_poi: leks_damthra
    appearance: >-
      Woman, fifties, quiet to the point of disappearing. Calm lined Thai
      face, grey-streaked black hair drawn into a low knot, dark eyes that
      rest steadily on you while you lean in to hear her. A small still mouth,
      a faded amulet on a cord. Observant, soft-voiced, never where expected.

  - id: picker_tuk_tuk_broker_m01
    name: picker tuk tuk broker m01
    role: The Broker
    type: player_picker
    culture: tuk_tuk_syndicate
    archetype: The Broker
    sex: male
    backdrop_poi: rongkhla
    appearance: >-
      Man, thirties. Lean watchful Thai face, short black hair, a thin neat
      moustache. Quick dark eyes that read an alley before a face, a faint
      knife-line scar along the jaw, a small tattooed sak yant at the collar.
      Soft-spoken, alert, weighing every word for its price.

  # ── Picker · Raggare ───────────────────────────────────────────

  - id: picker_raggare_kungansen_m01
    name: picker raggare kungansen m01
    role: The Kungansen
    type: player_picker
    culture: raggare
    archetype: The Kungansen
    sex: male
    backdrop_poi: bromsveld
    appearance: >-
      Man, thirties, broad and cheerful. Fair Swedish face going ruddy, a
      towering blond pompadour combed to a sculptural peak, long sideburns.
      Pale blue eyes, a wide generous grin, a comb tucked behind one ear.
      The contented king of a parking lot he never intends to leave.

  - id: picker_raggare_boss_f01
    name: picker raggare boss f01
    role: The Boss
    type: player_picker
    culture: raggare
    archetype: The Boss
    sex: female
    backdrop_poi: bromsveld
    appearance: >-
      Woman, forties. Strong fair Scandinavian face, platinum hair set in a
      stiff fifties roll, winged eyeliner and a bold red mouth. Cool
      appraising blue eyes, a small scar nicking one brow. Holds court without
      raising her voice; everyone in the lot already knows her answer.

  # ── Picker · Dekotora ──────────────────────────────────────────

  - id: picker_dekotora_oyakata_f01
    name: picker dekotora oyakata f01
    role: The Oyakata
    type: player_picker
    culture: dekotora
    archetype: The Oyakata
    sex: female
    backdrop_poi: faroporta
    appearance: >-
      Woman, fifties, ceremonial and calm. Square weathered Japanese face,
      iron-grey hair pulled back severe, deep steady eyes that consider
      before they answer. A formal closed mouth, a faded driver's tan line
      across the brow. Patient, exact, and immovable when challenged.

  - id: picker_dekotora_voice_m01
    name: picker dekotora voice m01
    role: The Voice
    type: player_picker
    culture: dekotora
    archetype: The Voice
    sex: male
    backdrop_poi: bruckners_office
    appearance: >-
      Man, forties. Lean composed Japanese face, dark hair neatly cut, calm
      authoritative eyes. A trim moustache, a steady measured mouth that
      speaks formally and seldom. The settled gravity of a man the whole
      convoy turns to hear.
