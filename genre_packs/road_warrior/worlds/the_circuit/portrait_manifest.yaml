# Character portraits for The Circuit
# Visual descriptions for Flux portrait generation
# Late-1970s Kodachrome photography aesthetic — sun-bleached, high contrast,
# warm desaturated palette, gritty and road-worn

characters:
  # ── FRESH: NEW BLOOD ───────────────────────────────────────────

  - name: Spark Greasefire
    role: Pit Crew Mechanic
    type: npc_major
    appearance: >-
      A woman in her forties with a shaved head and safety goggles pushed
      up on her forehead like a crown. Dark skin covered in a permanent
      patina of engine grease that she's stopped trying to wash off. Burn
      scars ladder up both forearms from years of welding. Broad shoulders,
      thick wrists, hands that could palm a transmission housing. Wears a
      sleeveless mechanic's coverall over a tank top, steel-toed boots
      worn smooth at the toe. A heavy tool belt hangs low on her hips. Her
      expression is patient, appraising — the look of someone who listens
      to your engine before she listens to you.
    culture_aesthetic: >-
      Pit Crew origin — working-class garage culture, function over form.
      Coveralls, burn marks, oil stains as badges of competence. No faction
      colors — she fixes everyone's rig and belongs to no one.
    element_visual: >-
      Welding goggles on forehead, oversized wrench tucked through belt
      loop, grease-blackened fingernails, a small blowtorch holstered at
      her hip like a sidearm.

  - name: Haraka
    role: Matatu Tout and Information Broker
    type: npc_supporting
    appearance: >-
      A lean young man in his twenties with close-cropped hair and a smile
      that never quite reaches his calculating eyes. Dark brown skin, sharp
      cheekbones, a thin scar across the bridge of his nose from a side-mirror
      impact. Wears a brightly patterned button-up shirt open over a white
      vest, slim trousers, and canvas sneakers good for jumping on and off
      moving vehicles. A whistle on a cord around his neck. Moves like he's
      always in transit — never standing still, always half-turned toward
      the next thing.
    culture_aesthetic: >-
      Matatu Crews — Nairobi street style, loud patterns, practical shoes,
      the uniform of a tout who spends twelve hours hanging from a minibus
      doorway shouting destinations.
    element_visual: >-
      Metal whistle on a cord, a rolled wad of currency in his shirt pocket,
      a battered Nokia phone in each hand, the scar across his nose catching
      light.

  # ── EARLY: EARNING COLORS ──────────────────────────────────────

  - name: Souchou Hayate
    role: Bosozoku Formation Leader
    type: npc_major
    appearance: >-
      A young man barely twenty with a sharp angular face and hair spiked
      straight up in a pompadour that adds six inches to his height. Pale
      skin, dark eyes lined with exhaustion and adrenaline. Lean and wiry —
      built for a motorcycle, not a fight, though he's been in plenty. Wears
      a modified tokkoufuku — a long embroidered coat in black and crimson
      with kanji down the back, open over a white jumpsuit. Tall boots
      with steel plates riveted to the shins. His jaw is set in a permanent
      challenge.
    culture_aesthetic: >-
      Bosozoku — Japanese biker punk, tokkoufuku long coats, rising-sun
      headbands, the aesthetic of 1970s Japanese youth rebellion filtered
      through Germanic precision. Every stitch is deliberate provocation.
    element_visual: >-
      Six-inch pompadour, crimson-and-black embroidered long coat with
      faction kanji, steel-plated boots, a hachimaki headband tied at
      the temple, white knuckle gloves.

  - name: Tombstone
    role: 1%er Chapter President
    type: npc_major
    appearance: >-
      A massive man in his fifties with a grey beard braided into two forks
      and hands like engine blocks. Weathered white skin tanned to leather
      by decades of highway sun. A face that looks like it lost arguments
      with pavement — twice-broken nose, a scar bisecting his left eyebrow,
      one ear cauliflowered. Shaved head under a faded black bandana. Wears
      a patched denim vest over a black t-shirt, the vest heavy with club
      patches and pins. Arms sleeved in old tattoos blurred by sun and age.
      His eyes are pale blue and absolutely empty of warmth.
    culture_aesthetic: >-
      1%er outlaw MC — American outlaw biker, patched denim and leather,
      club colors, the aesthetic of men who treat their vest patches like
      military insignia because that's exactly what they are.
    element_visual: >-
      Patched denim cut with president's rocker, braided grey beard, faded
      sleeve tattoos, heavy silver rings on every finger, a chain wallet
      hanging to his knee.

  - name: Ace Nifty
    role: Mod Intelligence Broker
    type: npc_major
    appearance: >-
      A slim person of indeterminate age — could be thirty, could be
      forty-five — with a narrow face, sharp cheekbones, and immaculately
      styled hair in a side-parted sweep that hasn't moved since 1965.
      Olive skin, dark eyes that inventory everything in a room before
      their body finishes entering it. Wears a tailored three-button suit
      in charcoal over a black turtleneck, Italian leather shoes polished
      to mirrors. Not a wrinkle, not a thread out of place. In a city of
      grease and dust, Ace Nifty is surgically clean. That is the threat.
    culture_aesthetic: >-
      Mods — British mod subculture, continental tailoring, obsessive
      attention to detail, the aesthetic of someone who believes style
      is a weapon and deploys it accordingly. Italian-English fusion.
    element_visual: >-
      Immaculate charcoal suit, mirror-polished shoes, a Vespa key on a
      silver chain visible at the hip, multiple mirrors on a parked scooter
      behind them reflecting the scene.

  # ── MID: THE WAR FOR THE ROAD ──────────────────────────────────

  - name: Kongou-maru
    role: Dekotora Convoy Master
    type: npc_major
    appearance: >-
      A heavyset man in his sixties with a broad weathered face, deep-set
      eyes, and grey hair cropped close under a peaked cap. Dark olive skin
      creased with laugh lines that have hardened into permanent grooves.
      Large hands, thick fingers, the slow deliberate movements of someone
      who has driven heavy rigs for forty years and never hurries. Wears a
      pressed white short-sleeve shirt with a pen in the breast pocket, dark
      work trousers, and leather driving gloves worn thin at the palm. A
      small shrine charm hangs from a cord at his neck. His expression is
      formal, courteous, and completely unreadable.
    culture_aesthetic: >-
      Dekotora — Japanese decorated truck culture, the aesthetic of a convoy
      master who presents as a modest working man while commanding a rig
      covered in ten thousand neon lights. Portuguese-Japanese fusion in the
      ornamentation, Buddhist temple grandeur in chrome and steel.
    element_visual: >-
      Peaked driver's cap, shrine charm at the neck, leather driving gloves,
      the reflection of neon truck lights in his eyes, a leather-bound
      journal visible in his shirt pocket.

  - name: Don Flaco de la Cruz
    role: Lowrider Elder and Peacemaker
    type: npc_major
    appearance: >-
      A thin man in his sixties — "flaco" earned, not given — with a
      carefully maintained pencil mustache, slicked-back silver hair, and
      the erect posture of someone who has never slouched in a photograph.
      Brown skin weathered to the texture of fine leather. Deep-set brown
      eyes that are warm until they aren't. Wears a pressed white guayabera
      over a white undershirt, creased khakis, and mirror-polished black
      shoes. A single gold chain at his neck, a gold watch on his left
      wrist. Every element is deliberate, modest, and immaculate — the
      uniform of a man whose Impala does the talking.
    culture_aesthetic: >-
      Lowrider — Chicano car culture, East LA boulevard elegance. Clean
      lines, gold accents, the aesthetic of a veterano who has outlived
      every war because he understood that respect is cheaper than violence.
    element_visual: >-
      Pencil mustache, slicked silver hair, white guayabera, single gold
      chain, a hydraulic switch resting on his knee, candy-apple-red paint
      reflected in his polished shoes.

  - name: Phi Lek
    role: Tuk-Tuk Syndicate Operator
    type: npc_major
    appearance: >-
      A small man — lek means small and he earned that name twice over.
      Late fifties, wiry, with sun-darkened skin, a shaved head, and eyes
      that are always slightly amused. His face is lined but not aged —
      more weathered than old, like a piece of driftwood that's been
      shaped by current rather than decay. Wears a loose collarless shirt,
      fisherman's pants, and rubber sandals. No jewelry, no watch, nothing
      that would snag or identify. He sits in a plastic chair in an alley
      that shouldn't fit a chair and drinks iced tea and knows everything.
    culture_aesthetic: >-
      Tuk-Tuk Syndicate — Southeast Asian alley culture, Thai-Khmer
      aesthetic. Deliberate plainness, the invisibility of someone who has
      decided that being overlooked is the most powerful position in any
      room.
    element_visual: >-
      Bare shaved head, rubber sandals, a glass of iced tea, plastic chair
      in a narrow alley with electrical wires overhead, the handlebars of
      a tuk-tuk visible at the edge of frame.

  # ── VETERAN: THE THREAD ────────────────────────────────────────

  - name: The Kungansen Magnus
    role: Raggare Elder
    type: npc_major
    appearance: >-
      A large man in his sixties with a belly that speaks to decades of
      drive-in food and a face that speaks to decades of Scandinavian
      winter — ruddy, broad, framed by grey muttonchop sideburns that
      haven't been fashionable since 1958 and never will be again. Pale
      blue eyes, a wide nose broken at least once, and a gap-toothed
      smile that is entirely genuine. Wears a white t-shirt with the
      sleeves rolled up over thick forearms, jeans with a two-inch cuff,
      and engineer boots. A pack of cigarettes rolled into his left
      sleeve. Pomade in his thinning grey hair, combed back in a ducktail
      that the years have not been kind to.
    culture_aesthetic: >-
      Raggare — Swedish greaser culture, 1950s American nostalgia filtered
      through Scandinavian pragmatism. Rolled-sleeve tees, cuffed jeans,
      pomade, the aesthetic of a man who lives in a permanent 1957 that
      never existed outside a parking lot in Bromsviken.
    element_visual: >-
      Muttonchop sideburns, rolled-sleeve white tee with cigarette pack,
      greased-back ducktail, engineer boots, a set of car keys on a
      long chrome chain, the curved chrome bumper of a '57 Chevy
      reflected behind him.

  - name: Ton Redline
    role: Cafe Racer Speed Legend
    type: npc_major
    appearance: >-
      A person of indeterminate age and minimal words — could be thirty,
      could be fifty, with a runner's build whittled down to wire and
      sinew. Angular face, sharp jaw, skin browned by wind and sun to
      a uniform leather tone. Eyes that are always focused on a vanishing
      point nobody else can see. Wears a scuffed brown leather jacket
      zipped to the throat, dark jeans, and racing boots with steel
      toe sliders worn to bright metal. A scratched open-face helmet
      hangs from one hand. No patches, no faction colors, no name
      visible anywhere on their person. The helmet has a single stripe —
      faded red — and nothing else.
    culture_aesthetic: >-
      Cafe Racer — British speed culture, stripped-down minimalism, the
      aesthetic of someone who has removed everything that doesn't make
      the bike go faster, including their own personality.
    element_visual: >-
      Scuffed brown leather jacket, steel-toed racing boots worn bright
      at the slider, open-face helmet with a single faded red stripe,
      no visible insignia, the outline of a stripped-down Norton or
      Triton behind them.

  # ── CROSS-FACTION ──────────────────────────────────────────────

  - name: Elsa Bruckner
    role: The Architect (Historical / Ghost)
    type: npc_supporting
    appearance: >-
      A woman in her forties as captured in a faded 1970s photograph —
      severe blonde hair pulled back in a tight chignon, sharp Nordic
      features, wire-rimmed glasses, and the unsmiling expression of
      someone who builds things that outlast people. Wears a white
      blouse under a grey blazer, a slide rule visible in the breast
      pocket. Her hands rest on a drafting table covered in blueprints.
      The photograph is sun-damaged, the colors shifted to amber and
      cyan, the edges curling. She looks directly into the camera as
      if she knows exactly who will be looking at this picture and when.
    culture_aesthetic: >-
      Swiss engineering professional, 1970s — clinical European
      modernism, the aesthetic of postwar infrastructure planning.
      Functional, precise, and utterly without vanity.
    element_visual: >-
      Wire-rimmed glasses, slide rule in pocket, blueprints on the
      table behind her, a faded Kodachrome color shift in the image,
      the Meridian Asphalt logo on a nameplate at the edge of frame.

  - name: Bruckner's Ghost
    role: The Ghost Rig Driver (Apparition)
    type: npc_supporting
    appearance: >-
      A figure seen only in peripheral vision and tunnel darkness — a
      silhouette behind a windshield lit from below by dashboard
      instruments. The shape suggests a woman, upright, both hands on
      the wheel. The vehicle changes depending on who sees it — a
      kaido racer, an Impala, a decorated truck — but the driver is
      always the same: still, focused, and driving a road that was
      designed before anyone else knew it existed. Seen in motion,
      never stopped. Headlights but no engine sound.
    culture_aesthetic: >-
      No culture — or all cultures simultaneously. The ghost rig
      reflects the observer's faction aesthetic back at them. The
      driver alone is constant and cultureless.
    element_visual: >-
      Dashboard glow on a silhouetted face, headlights in tunnel
      darkness, the vehicle blurred by motion while the driver is
      perfectly still, no exhaust, no sound, just light on asphalt.
