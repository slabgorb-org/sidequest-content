  # No clean CWN-verbatim analog; honest mode=bespoke at the world tier
  # (ADR-145 D3). Definitions moved VERBATIM from the genre inventory.yaml.
  # Rig Parts
  - id: scrap_metal
    name: Scrap Metal
    description: "Generic salvage. Enough of it fixes anything."
    category: rig_part
    value: 1
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [salvage, repair, rig]
    lore: Bent, rusted, beautiful. Every pile of scrap is a rig waiting to happen.
    narrative_weight: 0.1
    provenance: {mode: bespoke, license: na}

  - id: tire_worn
