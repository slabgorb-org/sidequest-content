    narrative_weight: 0.2
    provenance: {mode: bespoke, license: na}

  - id: alternator
    name: Alternator
    description: "Working alternator. Keeps the battery alive. Rare."
    category: rig_part
    value: 10
    weight: 3.0
    rarity: rare
    power_level: 3
    tags: [engine, rig, electrical]
    lore: The heartbeat of the electrical system. Find one and guard it with your life.
