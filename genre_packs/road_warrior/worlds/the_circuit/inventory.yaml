    lore: One shot. One cable. A hundred uses.
    narrative_weight: 0.4
    provenance: {mode: bespoke, license: na}

  - id: flame_rig
    name: Flame Rig
    description: "Side-mounted flamethrower. Short range, dramatic effect."
    category: weapon
    # CWN vehicle weapon (Story 86-5). Short-range area burn — solid sustained
    # damage, fire trauma against exposed crew and fuel.
    damage: {dice: "2d6", bonus: 0, trauma_die: "1d8", trauma_rating: 3}
    value: 15
    weight: 12.0
    rarity: rare
    power_level: 3
    tags: [mounted, rig, weapon, fire]
    lore: The road behind you glows orange. Nobody follows.
    narrative_weight: 0.5
    provenance: {mode: bespoke, license: na}

  - id: mounted_gun
    name: Mounted Gun
    description: "Bolted-on firearm. Gunner-operated during chases."
    category: weapon
    # CWN vehicle weapon (Story 86-5). The heavy hitter — belt-fed automatic,
