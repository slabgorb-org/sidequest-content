    narrative_weight: 0.4
    provenance: {mode: bespoke, license: na}

  - id: engine_block
    name: Engine Block
    description: "A whole working engine. The holy grail of scavenging."
    category: rig_part
    value: 50
    weight: 100.0
    rarity: legendary
    power_level: 5
    tags: [engine, rig, upgrade]
    lore: V8. Intact. Running. You'd kill for it. Someone probably did.
    narrative_weight: 0.7
    provenance: {mode: bespoke, license: na}

  # Mount Weapons
  - id: spike_strip_launcher
    name: Spike Strip Launcher
    description: "Drops spikes behind you. One use per chase."
    category: weapon
    # CWN vehicle weapon (Story 86-5). Tire-shredder — light hull damage but a
    # high trauma die: a blown tire at speed wrecks a pursuer's control.
    damage: {dice: "1d6", bonus: 0, trauma_die: "1d10", trauma_rating: 2}
    value: 8
    weight: 6.0
    rarity: uncommon
    power_level: 2
    tags: [mounted, rig, weapon, chase, defensive]
