id: the_ghost_rig
name: The Ghost Rig
era: ancient
description: 'A vehicle seen on the Thread — the underground road that connects all
  districts. Witnesses describe it differently depending on their faction: the Bōsōzoku
  see a kaido racer with impossible fairings. The Lowriders see a ''64 Impala that
  gleams despite the tunnel darkness. The Dekotora see a truck lit with lights that
  cast no shadow. The Café Racers say they''ve never seen it, but they ride faster
  when they''re underground.'
