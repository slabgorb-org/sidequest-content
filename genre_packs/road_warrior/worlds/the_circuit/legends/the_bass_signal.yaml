id: the_matatu_frequency
name: The Bass Signal
era: recent
description: Matatu sound systems are legendarily powerful. What other factions hear
  as music, the Matatu crews hear as communication — specific bass frequencies at
  specific volumes encode messages. Route changes, warnings, crew calls. The city
  thinks they're just playing loud music. The Matatu are running an encrypted broadcast
  network that requires 2000 watts of subwoofer to decode.
