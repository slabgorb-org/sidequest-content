id: the_raggare_anomaly
name: The Cars That Shouldn't Exist
era: ancient
description: The Raggare drive 1950s American cars. This is normal — Sweden has more
  vintage American cars per capita than anywhere outside the US. What is not normal
  is that some of the cars in The Circuit have VIN numbers that don't correspond to
  any manufactured vehicle. Factory records show these serial numbers were allocated
  but the cars were never built. The Raggare don't know this. They bought the cars
  at auction and they run fine. Better than fine. They run like they were built for
  roads that don't exist yet.
