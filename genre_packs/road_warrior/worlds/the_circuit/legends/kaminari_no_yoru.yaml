id: the_great_race
name: Kaminari no Yoru
era: recent
description: The Night of Thunder. Three years ago, every faction showed up at Sturmichi
  on the same night — nobody planned it, nobody called it. Two hundred vehicles on
  the expressway loop at midnight. The police sealed the on-ramps and let it play
  out. Four hours of running chaos. No deaths — which is either a miracle or evidence
  that something was keeping order from inside. The factions still argue about who
  won. The police still argue about who to blame. Nobody argues about whether it was
  glorious.
