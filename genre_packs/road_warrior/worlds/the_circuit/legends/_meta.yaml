origin_myth:
  name: The Convergence
  description: Nobody agrees on why every road culture on earth ended up in the same
    city. The official history says it was economics — a port city with cheap fuel,
    loose regulation, and a highway system built by foreign engineers who each brought
    their own design philosophy. The expressway loops feel Japanese. The boulevard
    feels Californian. The mountain pass feels Alpine. The market district feels Southeast
    Asian. It's as if the city's roads were designed by committee — and each member
    of the committee built a road from home.
  the_truth: 'The roads were not built by separate committees. They were built by
    a single international engineering firm — Meridian Asphalt — that was contracted
    by the city government in 1955 to design the entire road network. Meridian''s
    chief engineer, a Swiss national named Elsa Brückner, had a theory: that road
    design shapes the culture that drives on it. Build a touge and touge racers will
    come. Build a boulevard and cruisers will come. Build an expressway loop and formation
    riders will come. The city''s roads are not a coincidence — they are an experiment.
    Brückner designed each district''s road network to attract a specific vehicle
    culture. The experiment worked beyond anyone''s expectations. Or perhaps exactly
    as expected.'
  artifacts:
  - name: The Meridian Blueprints
    description: Original road plans filed at City Hall. If anyone bothered to compare
      them across districts, they would notice that the design annotations are in
      ten different languages — but the handwriting is the same.
  - name: The Brückner Journal
    description: 'A leather-bound notebook, rumored to be in the possession of the
      Dekotora convoy master Kongou-maru. Contains Brückner''s original theory and
      her notes on which cultures she expected each road section to attract. The last
      entry, dated 1979, reads: "They are all here now. The circuit is complete. What
      happens next is not mine to control."'
  - name: The Eleventh Road
    description: 'The blueprints show ten districts with ten road designs. But there
      is an eleventh — a road that connects all ten, running underground through the
      city''s drainage infrastructure. It appears on no public map. Its entrances
      are disguised as maintenance tunnels. Brückner called it "der Faden" — the Thread.
      It is the reason the Full Circuit run is possible without ever being caught:
      the Thread has exits into every faction''s territory.'
