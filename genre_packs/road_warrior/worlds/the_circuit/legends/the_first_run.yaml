id: the_first_run
name: The First Run
era: founding
description: The first driver to complete the Full Circuit — every faction's territory
  in a single run without stopping. Nobody knows who it was. Every faction claims
  it was one of theirs. The Mods say it was a scooter. The 1%ers say it was a Harley.
  The Café Racers say it was a stripped Norton. The Tuk-Tuk Syndicate says nothing,
  which the other factions find suspicious.
