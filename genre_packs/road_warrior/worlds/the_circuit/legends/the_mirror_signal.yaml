id: the_mod_intelligence_network
name: The Mirror Signal
era: recent
description: 'Mod scooters carry an absurd number of mirrors — this is historical
  fact. In The Circuit, the mirrors serve a second purpose: angled correctly, they
  can flash signals across line-of-sight distances using streetlight reflection. The
  Mods have built an optical semaphore network across the nightlife district. They
  know who is moving where before anyone else does. They sell this information. To
  everyone.'
