id: the_lowrider_covenant
name: The Sagrado Pact
era: recent
description: 'Five years ago, a crew war between two Lowrider families nearly destroyed
  the boulevard. Don Flaco de la Cruz brokered a peace: cruise night is sacred. No
  violence on the boulevard during cruise. Violate the pact and every Lowrider crew
  unites against you — temporarily. The pact has held. Nobody wants to test what "temporarily"
  means.'
