id: the_syndicate_origin
name: The Thousand Soi
era: founding
description: The Tuk-Tuk Syndicate claims they were here before the roads — that the
  alleys of Nokutori existed before Meridian Asphalt laid a single meter of highway.
  They claim the market was always here, the shortcuts were always here, and the city
  was built around them, not the other way around. This is almost certainly mythology.
  But the alleys of Nokutori do not appear on any Meridian blueprint.
