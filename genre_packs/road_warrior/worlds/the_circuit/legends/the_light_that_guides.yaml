id: the_convoy_masters_secret
name: The Light That Guides
era: ancient
description: The Dekotora convoys follow a route through the port that makes no logistical
  sense — longer than necessary, with detours through specific container corridors.
  The convoy masters say it's tradition. Their neon light configurations change on
  specific nights according to a pattern that, if mapped from above, traces the kanji
  for "thread." They may not know why they do this. Or they may know exactly why.
