name: Dekotora
summary: Japanese decorated truck culture
description: Japanese decorated truck culture. Their conlang blends Japanese with
  Portuguese — echoing the real historical Nanban trade that brought Portuguese merchants
  to Japan in the 1500s. Temple grandeur meets saudade.
slots:
  given_name:
    corpora: &id001
    - corpus: japanese.txt
      weight: 0.5
    - corpus: portuguese.txt
      weight: 0.5
    lookback: 3
    reject_files:
    - reject_common.txt
  family_name:
    corpora:
    - corpus: portuguese.txt
      weight: 0.6
    - corpus: japanese.txt
      weight: 0.4
    lookback: 3
    reject_files:
    - reject_common.txt
  title:
    word_list:
    - Oyakata
    - Oyabun
    - Sensei
    - Chourou
    - Taishou
    - Kumichou
  place_noun:
    word_list:
    - minato
    - iriguchi
    - misaki
    - touge
    - hatoba
    - hiroba
    - mon
    - tera
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
  adjective:
    word_list:
    - hikari
    - niji
    - kin
    - gin
    - ruri
    - kurenai
    - murasaki
    - tama
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
person_patterns:
- '{given_name} {family_name}'
- '{title} {given_name}'
- '{given_name}'
place_patterns:
- '{adjective} no {place_noun}'
- '{given_name} {place_noun}'
- '{adjective} {place_noun}'
