name: Rockers
summary: British motorcycle brawlers
description: British motorcycle brawlers. Their conlang blends English bluntness with
  Swedish grit — thick, guttural syllables that sound like they were shouted across
  a garage.
slots:
  given_name:
    corpora: &id001
    - corpus: english.txt
      weight: 0.7
    - corpus: swedish.txt
      weight: 0.3
    lookback: 2
    reject_files:
    - reject_common.txt
  family_name:
    corpora:
    - corpus: swedish.txt
      weight: 0.5
    - corpus: english.txt
      weight: 0.5
    lookback: 3
    reject_files:
    - reject_common.txt
  title:
    word_list:
    - Big
    - Old
    - Mad
    - Mean
    - Last
    - Young
    - Dirty
  place_noun:
    word_list:
    - garage
    - lot
    - yard
    - pit
    - strip
    - corner
    - ditch
    - bridge
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
  adjective:
    word_list:
    - rusty
    - broken
    - greasy
    - muddy
    - cracked
    - bent
    - battered
    - dark
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
person_patterns:
- '{given_name}'
- '{title} {given_name}'
- '{given_name} {family_name}'
place_patterns:
- The {adjective} {place_noun}
- '{given_name}''s {place_noun}'
