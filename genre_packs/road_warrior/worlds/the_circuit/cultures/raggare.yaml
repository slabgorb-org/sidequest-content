name: Raggare
summary: Swedish greasers in American land yachts
description: Swedish greasers in American land yachts. Their conlang blends Swedish
  with English — the sound of Scandinavia trying to speak 1950s American and making
  something entirely new.
slots:
  given_name:
    corpora: &id001
    - corpus: swedish.txt
      weight: 0.5
    - corpus: english.txt
      weight: 0.5
    lookback: 3
    reject_files:
    - reject_common.txt
  family_name:
    corpora:
    - corpus: swedish.txt
      weight: 0.7
    - corpus: english.txt
      weight: 0.3
    lookback: 3
    reject_files:
    - reject_common.txt
  title:
    word_list:
    - Stor
    - Lille
    - Gamla
    - Kungansen
    - Ansen
  place_noun:
    word_list:
    - rakan
    - stallet
    - parken
    - stranden
    - korven
    - macken
    - haken
    - lansen
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
  adjective:
    word_list:
    - stor
    - gammal
    - vild
    - krom
    - svart
    - rosten
    - blank
    - snabb
    corpora: *id001
    lookback: 3
    reject_files:
    - reject_common.txt
person_patterns:
- '{given_name}'
- '{title} {given_name}'
- '{given_name} {family_name}'
place_patterns:
- '{adjective} {place_noun}'
- '{given_name}''s {place_noun}'
- The {adjective} {place_noun}
