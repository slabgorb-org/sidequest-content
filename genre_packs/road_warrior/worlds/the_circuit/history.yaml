  - id: veteran
    name: "The Thread"
    maturity: VETERAN
    session_range: [25, 999]
    description: >-
      The player knows The Circuit like the back of their scarred hands.
      They have allies, enemies, legends, and a rig that's been rebuilt
      so many times it's more scar than original. The deepest secrets of
      the city are within reach — the ones that explain why this place
      exists, why these factions converged, and what the roads themselves
      are trying to tell anyone who drives them in the right sequence.

    character_progression:
      level_range: [8, 12]
      milestone_hints:
        - "The player IS a faction leader or independent power"
        - "Rig is legendary — other factions tell stories about it"
        - "The conspiracy threads converge"
      item_hints:
        - "a rig that is a legend in its own right"
        - "keys, maps, or knowledge that nobody else has"
        - "the respect or fear of every faction leader"

    npcs:
      - name: The Kungansen Magnus
        archetype: The Kungansen
        disposition: 10
        notes: >-
          Raggare elder whose '57 Chevy has a VIN that doesn't match any
          factory record. Doesn't know this. Doesn't care. But the car
          runs better than any vehicle its age should.
      - name: Ton Redline
        archetype: The Ton
        disposition: 0
        notes: >-
          The fastest rider alive. Has done the ton on every road in the
          city. Speaks in nods and lap times. If anyone has run the full
          underground route, it would be this person — but they've never
          said, and nobody has asked twice.

    active_quests:
      - "Uncover the truth about The Circuit's design"
      - "Unite or shatter the factions"
      - "Run the route that connects everything"

    narrative_log:
      - speaker: narrator
        text: >-
          You've been on these roads long enough that the city feels like an
          extension of your rig. You know every curve, every shortcut, every
          faction leader by name. But there's something underneath all of it
          — a pattern in the roads, a connection between the factions, a
          design that's too perfect to be coincidence. The circuit isn't just
          a name. It's a blueprint. And you're close to reading it.

    location: sturmichi
    atmosphere: culmination, revelation, the road has been waiting
    active_stakes: "Truth — what is The Circuit, and what happens when you complete it?"

    points_of_interest:
      - name: Der Faden
        slug: der_faden
        type: lore_site
        region: sturmichi
        description: >-
          A maintenance tunnel entrance beneath the expressway overpass.
          The door is steel, unmarked, and the lock accepts a key that no
          locksmith in the city recognizes. Beyond it, the tunnel descends —
          not to sewers or utility corridors but to a road. An actual paved
          road, two lanes, lit by overhead fixtures that still work despite
          being decades old. The road runs straight for a distance that
          shouldn't be possible given the surface geography. The air smells
          like old asphalt and something else — machine oil, exhaust, and
          time. The road has been driven. Recently.
        visual_prompt:
          solo: >-
            Wide landscape shot from inside an underground two-lane paved
            road tunnel, looking down its descending length toward
            impossible vanishing distance. Foreground: pristine paved
            asphalt with crisp white centerline stripes and a faint shine
            of recent tire tracks in the dust along the shoulder. Middle
            ground: a downhill grade with overhead fixtures (vintage
            recessed enamel lamps from the late 1970s, still glowing
            warm) lighting the tunnel at regular intervals, the lamps
            disappearing in geometric perspective. Background: the
            tunnel continuing straight far beyond any plausible surface
            geography, distant lamps shrinking to specks. The tunnel
            walls are dressed concrete, no signage, no graffiti. Cold
            blue-shadowed walls with warm-tungsten pools of overhead
            light. Air thick with dust catching the light. No people.
            Unmistakably a road that has been driven recently.
          backdrop: >-
            Underground two-lane paved road tunnel with vintage 1970s
            overhead lamps glowing warm at regular intervals, perfect
            white centerline, descending into impossible distance, dust
            catching the light.

      - name: Brückner's Office
        slug: bruckners_office
        type: lore_site
        region: farolumi
        description: >-
          A locked room on the third floor of the Port Authority building.
          The nameplate on the door reads MERIDIAN ASPHALT — CITY LIAISON
          in brass letters that haven't been polished since 1979. Inside,
          if you can get inside, there is a drafting table, a wall of
          blueprints, and a leather journal. The blueprints show the city's
          road network. All of it. Including the parts that aren't on any
          public map.
        visual_prompt:
          solo: >-
            Wide landscape interior shot of a small institutional office
            on a high floor of a 1970s Port Authority building at night,
            framed from the open doorway looking in. Foreground: a half-
            opened heavy wooden door with frosted-glass upper panel
            showing the reversed brass-letter nameplate MERIDIAN ASPHALT —
            CITY LIAISON, the letters tarnished and unpolished since 1979.
            Middle ground: a large wooden drafting table angled across
            the room, blueprint paper unrolled across it, an architect's
            lamp on a swing arm casting a tight pool of warm light, a
            leather-bound journal closed beside it. Background: an entire
            wall of pinned-up engineering blueprints showing branching
            road networks (some matching a recognizable city plan, some
            descending below it), wood-panel filing cabinets, a 1970s
            office chair, and through a tall industrial window the lights
            of a container port at night. Single warm tungsten desk lamp
            as primary light, cool blue exterior port-light through the
            window. Nobody present.
          backdrop: >-
            1970s Port Authority office interior at night, drafting table
            with unrolled blueprints under a warm architect's lamp, a
            full wall of pinned road-network blueprints behind, frosted-
            glass door with reversed brass nameplate, container port
            lights through a tall window.

      - name: Convergence Point
        slug: convergence_point
        type: hero
        region: aschgrund
        description: >-
          The exact center of the largest warehouse floor at Aschgrund.
          Not the pillar — a point on the concrete floor that, if you
          stand on it and look up through the collapsed roof, aligns with
          the expressway overpass, the mountain ridge, and the port crane
          gantry in a perfect sightline that runs north-south. The old
          marks on the pillar — the ones that predate every faction — point
          toward this spot. The concrete here is a slightly different color
          than the rest of the floor. Slightly newer. As if someone poured
          a new slab over something.
        visual_prompt:
          solo: >-
            Wide cinematic hero landscape shot — late 1970s anamorphic
            widescreen framing — taken at low ground level inside an
            abandoned industrial warehouse at night, looking straight up
            through a torn ragged hole in the corrugated steel roof.
            Foreground: a small square patch of concrete floor in the
            geometric center of the warehouse, the patch a slightly
            paler grey than the surrounding floor as if a newer slab
            had been poured, the seam around its edge visible as a fine
            line. Faint tool-scored marks on the floor near the patch
            point inward. Middle ground: the cavernous warehouse
            interior fading into deep darkness on all sides, hints of
            rusted I-beam columns and catwalks barely catching ambient
            light, the rusted central support pillar visible off to one
            side with layered faction-tally graffiti. Background, seen
            through the torn roof aperture above: a perfect north-south
            sightline aligning three distinct silhouettes against the
            night sky — the underside of an elevated expressway overpass
            (bottom of frame through the hole), the ridge of coastal
            mountains beyond (middle), and the gantry of a tall port
            crane (top), all three lined up in a deliberate vertical
            stack. Sodium-amber spill from the expressway overhead,
            cool moonlight from the gap, deep saturated blacks. Faint
            exhaust haze drifting up through the hole. Long-exposure
            light trails of a single motorcycle headlight tracing along
            the expressway above. Cinematic widescreen anamorphic framing,
            shallow depth of field, Kodachrome color shift, hyperreal,
            ceremonial-architectural-cosmic atmosphere. No people.
          backdrop: >-
            Cavernous abandoned warehouse interior at night, a slightly
            paler concrete patch at the geometric center of the floor,
            a torn roof aperture above revealing a perfect vertical
            sightline through expressway overpass, mountain ridge, and
            port crane gantry. Sodium-amber spill, cool moonlight,
            ceremonial alignment.

      - name: Grauturm
        slug: grauturm
        type: lore_site
        region: grisevont
        description: >-
          A decommissioned coastal navigation tower at the southernmost point
          of the coast road — a concrete cylinder twelve meters tall with a
          dead lamp housing at the top and an access ladder bolted to the
          seaward side. The tower predates the road. Inside, bolted to the
          interior wall at eye height, there is a brass plate with a route
          diagram etched into it — the same branching pattern that appears on
          the Dorapinta mural, on the floor of the warehouse, and in the
          blueprints. This one has a date: 1962. Before any faction arrived.
        visual_prompt:
          solo: >-
            Wide landscape shot of a decommissioned concrete coastal
            navigation tower standing alone on a rocky headland at the
            edge of a cliff road at twilight. Foreground: rough grey
            asphalt road ending at a gravel shoulder, a rusted chain
            barrier across a footpath leading to the tower. Middle
            ground: the concrete cylinder rising twelve meters, grey
            and salt-stained, a dead glass lamp housing at the top
            with no light, a rusted steel access ladder bolted to
            the seaward face, a heavy steel door at the base slightly
            ajar revealing darkness inside. Through the door gap: a
            glint of brass catching the last twilight. Background:
            the open ocean stretching to the horizon, twilight sky
            in steel blue and faded amber, sea fog beginning to form
            at the water's surface. Twilight, the last amber light
            catching the tower's western face, cool blue shadow on
            the east. No people.
          backdrop: >-
            Decommissioned concrete navigation tower on a rocky
            headland at twilight, dead lamp housing at top, rusted
            access ladder, heavy door slightly ajar, open ocean
            behind, steel-blue and amber sky.
        environment:
          solo: >-
            Twilight wind off the ocean gusting against the concrete
            cylinder, the heavy smell of salt and rust, surf crashing
            on rocks below the headland, the metallic tang of the
            brass plate inside, the hollow echo of the tower's
            interior amplifying the wind.
          backdrop: >-
            Ocean wind, salt and rust, surf on rocks, hollow tower echo.

      - name: Nordkette
        slug: nordkette
        type: lore_site
        region: langbrenner
        description: >-
          An abandoned fuel station thirty kilometers north on the highway —
          the last one before the territory markers end and the open road
          begins. The pumps are disconnected but the underground tanks are
          not empty. The station's garage bay contains something that
          shouldn't be there: a perfectly maintained road surface sample,
          one meter square, cut from a road that doesn't exist on any surface
          map. The asphalt composition matches the underground road beneath
          Aschgrund. Someone was testing materials here. The work order
          pinned to the garage wall is dated 1961 and signed by a company
          that appears nowhere in any business registry.
        visual_prompt:
          solo: >-
            Wide landscape shot of an abandoned 1960s fuel station on
            a straight four-lane highway at night, photographed from
            the highway shoulder looking across the forecourt.
            Foreground: cracked highway asphalt and a gravel turnoff,
            faded painted arrows on the forecourt concrete.
            Middle ground: two disconnected fuel pumps with rounded
            1960s housings, paint peeling, hoses removed, a flat
            concrete canopy overhead on thin steel poles. The garage
            bay to the right with its roller door half-raised,
            fluorescent light visible inside illuminating a workbench
            with a one-meter-square block of dark asphalt sitting
            on it like a specimen. A faded paper pinned to the
            garage wall. Background: the four-lane highway stretching
            north into absolute darkness, no lights beyond the
            station, the territory ending here. Single fluorescent
            source from the garage bay, everything else in sodium-
            amber spill from one remaining forecourt light. No people.
          backdrop: >-
            Abandoned 1960s fuel station on a night highway,
            disconnected pumps under a flat canopy, garage bay
            half-open with fluorescent light on a dark asphalt
            sample block, highway disappearing north into darkness.
        environment:
          solo: >-
            Highway wind carrying the smell of cold asphalt and old
            petrol, the buzz of a single fluorescent tube in the
            garage bay, crickets in the scrub beyond the forecourt,
            the absolute silence of a road with no traffic at
            3 AM, the chemical scent of the asphalt sample.
          backdrop: >-
            Highway wind, old petrol, lone fluorescent buzz, crickets, silence.

