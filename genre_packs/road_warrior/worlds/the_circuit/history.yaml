# The Circuit — Campaign History
# FRESH → EARLY → MID → VETERAN progression with POIs and chase set pieces.
# POI descriptions are written for image generation — visually rich and
# atmosphere-forward.

chapters:
  - id: fresh
    name: "New Blood"
    maturity: FRESH
    session_range: [1, 5]
    description: >-
      The player arrives in The Circuit with a rig and a reputation that
      means nothing here. Every faction sees fresh meat — someone to
      recruit, exploit, test, or ignore. The first sessions are about
      learning whose roads are whose, what the rules are (and aren't),
      and surviving long enough to earn a name.

    character_progression:
      level_range: [1, 3]
      milestone_hints:
        - "First faction contact — someone notices you"
        - "First chase — pursued or pursuing, the road teaches"
        - "First rig damage — the car-acter sheet takes its first scar"
      item_hints:
        - "a rig that's functional but unremarkable"
        - "basic tools and a half-tank of fuel"
        - "no faction colors, no crew, no reputation"

    npcs:
      - name: Spark Greasefire
        archetype: The Grease Witch
        disposition: 5
        notes: >-
          The first friendly face. A Pit Crew mechanic at Grensholt
          who fixes anyone's rig for a fair price and doesn't ask questions.
          The safest person in the city to owe a favor.
      - name: Haraka
        archetype: The Makanga
        disposition: 10
        notes: >-
          A Matatu tout who knows every face and every route. Will give
          information for free once, then charge for it forever. The best
          source of city knowledge for a newcomer.

    active_quests:
      - "Learn the territories — drive each district and survive"
      - "Find a regular fuel source"
      - "Earn a reputation with at least one faction"

    narrative_log:
      - speaker: narrator
        text: >-
          The city hits you with sound first. Engine noise layered ten deep —
          the high whine of scooters, the chest-thump of Harley pipes, the
          synchronized scream of formation exhausts from the expressway above.
          Then the neon. Then the smell — fuel, food, rain on hot asphalt.
          You are nobody here. Your rig is unknown. That changes tonight.

    location: nottavello
    atmosphere: overwhelming, electric, anonymous
    active_stakes: "Survival and orientation — learn the city before it eats you"

    points_of_interest:
      - name: Dunkelkurve
        slug: dunkelkurve
        type: chase_set_piece
        region: sturmichi
        description: >-
          The expressway's tightest curve — a banked concrete sweep under a
          tunnel overhang where the sodium lights cut out for exactly four
          seconds. In that darkness, at speed, with twenty formation riders
          ahead of you and the tunnel walls close enough to touch, the only
          thing that exists is the sound of engines and the red glow of
          taillights painting the concrete. This is where the Bōsōzoku test
          new riders. Pass through without breaking formation and you belong.
          Hesitate and you're out.
        visual_prompt:
          solo: >-
            Wide low-angle landscape shot of a banked concrete tunnel curve
            on an elevated expressway, taken from the tunnel mouth looking
            into the dark interior. Foreground: a sweep of banked concrete
            highway curving sharply left into the tunnel, white lane stripes
            arcing along the bank, a faint streak of motion-blurred red
            taillights painting the dim concrete walls. Middle ground: the
            mouth of the tunnel where sodium-orange light cuts off and
            absolute darkness begins, two bōsōzoku kaidō-racer headlights
            disappearing into the black. Background: the far side of the
            tunnel, distant sodium streetlights visible through the dark
            tube as small points of orange. Late night, sodium-vapor amber
            transitioning to black, long-exposure light trails. No riders
            visible up close — only taillights and a tunnel.
          backdrop: >-
            Banked concrete expressway curve sweeping left into a dim
            tunnel overhang, sodium-amber lights petering out into total
            darkness, motion-blurred red taillights painting the curve.

      - name: Flaco's Doravio
        slug: flacos_doravio
        type: turf
        region: doracanto
        description: >-
          A corner of Doracanto where three palm trees frame a
          parking triangle just large enough for four lowriders. On cruise
          nights, Don Flaco de la Cruz parks here — his '64 Impala under the
          streetlight, fourteen coats of candy apple red catching every photon,
          the hydraulic switch resting on his knee like a scepter. The mural
          on the hood is La Virgen de Guadalupe surrounded by roses. The bass
          from his trunk-mounted system makes the palm fronds tremble. To park
          at Flaco's corner uninvited is to misunderstand everything about
          how The Circuit works.
        visual_prompt:
          solo: >-
            Wide landscape shot of a boulevard corner at night under three
            tall palm trees, with a candy-apple-red 1964 Chevrolet Impala
            lowrider parked beneath a single streetlight in a small
            triangular parking pull-off. Foreground: warm asphalt with
            wet reflective patches, a low chrome bumper catching streetlight.
            Middle ground: the Impala in profile, fourteen-coat candy paint
            with deep reflections of palm fronds and streetlight, hood mural
            of La Virgen de Guadalupe surrounded by roses visible across the
            bonnet, hydraulic switches on the dashboard. Background: three
            tall palm trees framing the corner against a warm-amber and
            neon-pink boulevard, distant blurred lowrider headlights cruising
            past. Late evening, sodium amber and neon pink, mural detail
            crisp, vehicle in classic side-three-quarter framing. No people.
          backdrop: >-
            Boulevard corner at night with three palm trees framing a
            single streetlight, candy-apple-red '64 Impala lowrider parked
            beneath, warm amber and neon-pink light, palm fronds reflected
            on chrome.

      - name: Lek's Damthra
        slug: leks_damthra
        type: chase_set_piece
        region: nokutori
        description: >-
          The narrowest alley in the market district — a passage between two
          buildings that was never meant for vehicles. Electrical wires hang
          low enough to brush a rider's helmet. The walls are close enough to
          scrape paint. A single bare bulb hangs from a wire at the midpoint,
          swinging in the draft from passing tuk-tuks. Phi Lek uses this
          passage as a demonstration: if you can drive it without touching
          the walls, you can drive anything in Nokutori. The scrape marks
          on the walls are a history of everyone who couldn't.
        visual_prompt:
          solo: >-
            Tight low-angle landscape shot looking down an extremely narrow
            Southeast-Asian night-market alley between two weathered
            concrete buildings, photographed at vehicle height. Foreground:
            wet cobblestones with shallow puddles reflecting a single bare
            bulb. Middle ground: alley walls close enough to scrape paint,
            sagging electrical wires draped across overhead at helmet
            height, hand-painted Thai and Khmer shop signs on either side,
            faded chevron scrape-marks scored along both walls from years
            of vehicles brushing past. Background: a small modified
            three-wheeled tuk-tuk's red taillight disappearing into deeper
            alley shadows. Single warm tungsten bulb as primary light,
            blue neon from a sign at the alley mouth, claustrophobic
            framing. No people visible. Rain steam from food stalls
            curling in from a side entrance.
          backdrop: >-
            Extremely narrow night alley between concrete buildings, low
            overhead wires, scrape-marked walls, single tungsten bulb at
            the midpoint, wet cobblestones, blue neon at the alley mouth.

      - name: Nachtglas
        slug: nachtglas
        type: turf
        region: nottavello
        description: >-
          The basement soul club at the bottom of a narrow staircase behind
          a dry cleaner's. No sign. The entrance is a steel door with a
          sliding peephole — the only light from below is the purple glow
          leaking around the frame. Inside, two hundred Mods dance on a
          floor worn smooth by a decade of leather soles. The DJ booth is
          elevated on a scaffold of scooter frames welded together. Information
          moves here faster than anywhere else in the city — whispered
          between tracks, passed with pills, encoded in which records get
          played in which order.
        visual_prompt:
          solo: >-
            Wide landscape shot looking down a narrow concrete staircase
            descending from street level into a basement nightclub entrance.
            Foreground: worn concrete steps with chrome handrails, cigarette
            butts crushed into the treads, a line of military fishtail
            parkas hanging from wall hooks. Middle ground: a heavy riveted
            steel door at the bottom, slightly ajar, purple and magenta
            neon light bleeding through the gap and up the stairwell,
            casting long colored shadows on the concrete walls. Background
            visible through the door gap: a packed dance floor lit by a
            single mirrored disco ball, silhouettes of dancers, the
            elevated DJ booth constructed from welded chromed scooter
            frames, a turntable glowing amber under a desk lamp. Late
            night, the stairwell lit only by the club light below.
            No people in the foreground. No text on walls.
          backdrop: >-
            Narrow concrete staircase descending to a steel door ajar,
            purple neon bleeding up from a basement soul club below,
            mirrored disco ball visible through the gap, scooter-frame
            DJ scaffold.
        environment:
          solo: >-
            Purple and magenta neon from below, Northern Soul bass
            vibrating through the concrete steps, cigarette smoke
            layered at ankle height, the chemical scent of dry cleaning
            solvent from the shop above mixing with sweat and
            amphetamine energy from below.
          backdrop: >-
            Purple neon, bass through concrete, cigarette smoke, chemical solvent.

      - name: Spark's Bench
        slug: sparks_bench
        type: safe_haven
        region: grensholt
        description: >-
          The last repair bay on the east end of the garage strip — an open-
          fronted workshop under a corrugated steel awning, lit by four
          fluorescent strips that buzz and flicker on cold nights. A single
          hydraulic lift, a wall of hand tools on pegboard, and a workbench
          so thick with oil stains it has its own geology. The mechanic here
          fixes anyone's rig for a fair price. No faction colors on the walls.
          No questions about where the damage came from. The only neutral
          ground that isn't neutral because someone declared it — it's neutral
          because everyone needs it too much to ruin it.
        visual_prompt:
          solo: >-
            Wide landscape shot of an open-fronted motorcycle repair workshop
            at night on an industrial street, viewed from across the oil-
            stained concrete apron. Foreground: cracked concrete floor with
            decades of oil stains creating dark geological layers, scattered
            chrome tools and a pneumatic wrench. Middle ground: a single
            hydraulic vehicle lift raised to chest height with a partially
            disassembled British motorcycle on it, fluorescent strip lights
            buzzing overhead casting cold white light, a pegboard wall of
            hand tools in silhouette, a thick wooden workbench with a vice
            and parts trays. Background: the corrugated steel awning
            overhead, the dark industrial street beyond lit only by a
            single distant sodium streetlight, other garage bays closed and
            dark on either side. Cold fluorescent interior, warm sodium
            exterior, no decorations, no faction colors. No people.
          backdrop: >-
            Open-fronted motorcycle repair workshop at night, hydraulic
            lift with a disassembled bike, fluorescent strip lights,
            pegboard tools, oil-stained concrete, dark industrial street
            beyond.
        environment:
          solo: >-
            Cold fluorescent buzz overhead, the sharp smell of two-stroke
            oil and degreaser, metal-on-metal clinks of tools being set
            down, the ticking of a cooling engine block on the lift, cold
            night air drifting in from the open front.
          backdrop: >-
            Fluorescent buzz, two-stroke oil and degreaser, cooling engine ticks.

    tropes:
      - id: turf_race
        status: dormant
        progression: 0.0
      - id: rig_resurrection
        status: dormant
        progression: 0.0

  - id: early
    name: "Earning Colors"
    maturity: EARLY
    session_range: [6, 12]
    description: >-
      The player has survived long enough to be known. One or more factions
      have an opinion about them — positive, negative, or both. The city's
      deeper politics are becoming visible: faction alliances, grudges, and
      the unspoken rules that keep the whole thing from collapsing. The
      player is being pulled in directions. Everyone wants something.

    character_progression:
      level_range: [3, 5]
      milestone_hints:
        - "Faction alignment — whose colors do you wear?"
        - "First faction mission — a run, a delivery, a fight"
        - "Rig upgrade — the car-acter sheet grows"
      item_hints:
        - "rig modifications reflecting faction identity"
        - "faction tokens or colors"
        - "a contact list and a debt list"

    npcs:
      - name: Souchou Hayate
        archetype: The Souchou
        disposition: 5
        notes: >-
          Young Bōsōzoku formation leader. Respects anyone who can keep
          formation on Sturmichi. Doesn't respect anything else.
      - name: Tombstone
        archetype: The Prez
        disposition: -10
        notes: >-
          1%er chapter president. Views every other faction as children
          playing on roads the club built. Will use anyone who's useful
          and discard anyone who isn't.
      - name: Ace Nifty
        archetype: The Ticket
        disposition: 0
        notes: >-
          Mod intelligence broker. Sells information to everyone. Buys
          information from everyone. The most neutral and most dangerous
          person in the nightlife district.

    active_quests:
      - "Complete a faction mission — prove your worth"
      - "Navigate a turf dispute without making permanent enemies"
      - "Discover the Mod intelligence network — and decide if you're a customer"

    narrative_log:
      - speaker: narrator
        text: >-
          You have a name now. Not the one you came with — the one The Circuit
          gave you. Your rig has its first scars and its first upgrades. When
          you roll through a district, someone nods. Someone else glares. Both
          mean you exist.

    location: grensholt
    atmosphere: tense, political, choices closing in
    active_stakes: "Allegiance — who do you ride with, and what does it cost?"

    points_of_interest:
      - name: Faroporta
        slug: faroporta
        type: turf
        region: farolumi
        description: >-
          The port gate where the Dekotora convoys enter the city. At night,
          when the trucks turn their lights on for the final approach, the
          container walls on either side become a canyon of reflected color —
          neon blue, neon red, gold chrome, all of it bouncing between steel
          surfaces until the corridor blazes like a fever dream of a Buddhist
          temple. The lead truck's mural — always a deity, always Kongou-maru's
          Fudou Myouou in wrathful pose — appears to move in the shifting light.
          Dock workers stop to watch. They've seen it a thousand times. They
          still stop.
        visual_prompt:
          solo: >-
            Wide landscape shot down a corridor of stacked shipping containers
            forming a steel canyon at a port gate at night, viewed from
            ground level looking deep into the corridor. Foreground: wet
            concrete dock surface reflecting overhead colored lights, a
            painted yellow centerline. Middle ground: the steel container
            walls on either side stacked four high, the steel surfaces
            blazing with reflections of neon blue, neon red, and gold
            chrome bouncing between them in shifting patterns. Background:
            a single Japanese dekotora truck under heavy chrome and neon
            arrays, hood mural of Fudou Myouou (wrathful Buddhist deity in
            blue with sword and rope, fire-haloed) lit by floodlights,
            approaching slowly toward the camera. Late night, deep
            saturated neon, hyper-reflective steel, ceremonial atmosphere.
            No people. No CGI look.
          backdrop: >-
            Steel canyon of stacked shipping containers at night reflecting
            neon blue, red, and gold from a single dekotora truck's chrome
            and neon arrays, hood mural of a wrathful Buddhist deity,
            ceremonial.

      - name: Bromsveld
        slug: bromsveld
        type: turf
        region: bromsviken
        description: >-
          The drive-in at Bromsviken where the Raggare hold court. A
          semicircle of 1950s American steel under a neon sign that reads
          AUTOMAT in Swedish blue and yellow. The speaker posts still work.
          A jukebox glows inside the attached diner. The Raggare park in
          formation — biggest engines in the center — and idle. The combined
          rumble of eight V8 engines at rest shakes the gravel. Doo-wop
          plays from every open window. It is 1957 forever in this parking lot.
        visual_prompt:
          solo: >-
            Wide landscape shot of a 1950s American drive-in restaurant at
            Nordic summer twilight (sky still pale blue, never fully dark),
            framed from across the gravel parking lot. Foreground: gravel
            parking surface and a row of chromed speaker posts. Middle
            ground: a semicircle of 1957 American cars — finned Chevrolets,
            Plymouths, Pontiacs, all polished chrome and two-tone paint —
            parked nose-out in formation around the diner. Background: a
            single-storey diner with a large neon sign reading AUTOMAT in
            Swedish blue and yellow capital letters, warm window light from
            a jukebox interior, a tall pole sign with arrow-graphic.
            Pale-blue Nordic twilight sky. No people visible. Authentic
            1957 American chrome on every visible vehicle.
          backdrop: >-
            Drive-in restaurant in pale Nordic summer twilight, semicircle
            of 1957 American cars parked nose-out around a single-storey
            diner with a blue-and-yellow AUTOMAT neon sign, warm jukebox
            light spilling from windows.

      - name: Harijumba
        slug: harijumba
        type: turf
        region: harifasi
        description: >-
          The main Matatu terminus at evening rush — twelve wildly painted
          minibuses jostling for position at the curb, touts hanging from
          doorways shouting destinations in three languages, bass frequencies
          from competing sound systems making the puddles vibrate in opposing
          patterns. The buses are covered in graffiti-art murals of musicians,
          athletes, and political figures. One has a portrait of Bruce Lee
          across its entire side panel. Another has a sound system so powerful
          that the sheet metal of the bus visibly flexes with each bass hit.
          The air smells like diesel and fried plantain.
        visual_prompt:
          solo: >-
            Wide landscape shot of a Kenyan-style matatu minibus terminus
            at evening rush, viewed from a slight elevation across the
            curbside chaos. Foreground: wet asphalt with diesel rainbow
            sheens and small puddles visibly rippling in opposing bass
            patterns. Middle ground: a row of wildly graffiti-painted
            minibuses jammed nose-to-tail at the curb, each one covered
            in colourful mural art — one minibus showing a giant
            photo-realistic portrait of Bruce Lee mid-strike across its
            entire side panel, another with massive speaker stacks
            visible through the rear windows. Background: a tight
            East-African transit terminus with cluttered hand-painted
            signage in Swahili and English, a graffiti-tagged concrete
            wall, low neon and tungsten light, food-stall steam. Magic
            hour transitioning into night, deep saturated colors, sheet
            metal visibly flexed by sound systems.
          backdrop: >-
            Wildly painted Kenyan matatu minibuses at a curbside terminus
            at dusk, massive speaker stacks visible through rear windows,
            Bruce Lee mural on one side panel, diesel-rainbow puddles
            rippling, low neon.

      - name: Langbrenner Overpass
        slug: langbrenner_overpass
        type: chase_set_piece
        region: langbrenner
        description: >-
          The main highway's central overpass — a long concrete bridge that
          rises forty feet above a rail yard, giving a clear view north along
          four lanes of highway stretching to the horizon. At the bridge's
          apex, the road surface is scored with braking marks from a decade
          of confrontations. The 1%ers use this stretch as a toll point —
          anyone running freight north passes through their sightline here.
          Two service roads flank the highway below, creating a three-level
          pursuit environment: rail yard, service road, highway above.
        visual_prompt:
          solo: >-
            Wide landscape shot from the center of a four-lane highway
            overpass at night, looking north along the straight highway
            stretching to a distant vanishing point. Foreground: scored
            and pitted asphalt with heavy black braking marks, a dented
            steel guardrail on either side, orange reflector posts.
            Middle ground: the overpass apex with the road rising
            slightly then descending, sodium-vapor lights mounted on
            tall poles creating pools of amber light separated by dark
            gaps, the silhouette of a lone chopper motorcycle parked
            sideways across the shoulder. Background: the highway
            stretching north into darkness, a rail yard visible below
            through gaps in the guardrail — freight cars, signal lights,
            and the parallel service roads flanking the highway at a
            lower level. Late night, sodium amber on asphalt, long
            perspective, the sense of a corridor watched from above.
            No people visible.
          backdrop: >-
            Four-lane highway overpass at night looking north, scored
            asphalt with braking marks, sodium-vapor pools of amber,
            a chopper parked sideways on the shoulder, rail yard
            visible below.
        environment:
          solo: >-
            Wind across the elevated road surface at forty feet, the
            distant clatter of freight cars coupling below, sodium
            lights humming overhead, diesel and hot asphalt, the
            open-corridor exposure of being visible for half a mile
            in either direction.
          backdrop: >-
            Wind at elevation, freight car clatter below, sodium hum, diesel.

      - name: Rongkhla
        slug: rongkhla
        type: turf
        region: damreocha
        description: >-
          The dead-end alley behind the Syndicate's deepest safe house — a
          passage so narrow that the buildings on either side lean together
          overhead, nearly touching, creating a tunnel of corrugated steel
          and sagging laundry lines. The alley ends at a wall covered in
          hand-painted route maps that only Syndicate drivers can read —
          symbols for width clearance, turn angles, and timing windows coded
          in a system that looks like folk art to outsiders. A single three-
          wheeled vehicle is always parked here, facing out, engine warm.
        visual_prompt:
          solo: >-
            Wide landscape shot down an impossibly narrow dead-end alley
            at night, photographed from the open end looking toward the
            back wall. Foreground: wet packed-earth surface barely two
            meters wide, shallow drainage channel running along one
            side, the chrome fender of a modified three-wheeled vehicle
            parked facing the camera. Middle ground: buildings leaning
            together overhead from both sides, corrugated steel walls
            nearly touching at the top, sagging laundry lines and
            electrical wires creating a web overhead, a single bare
            bulb on a wire providing warm tungsten light at the
            alley's midpoint. Background: the dead-end wall entirely
            covered in hand-painted symbols — arrows, circles, slash
            marks, width measurements, and turn-angle diagrams in
            faded red, yellow, and white paint, looking like abstract
            folk art. Deep claustrophobic framing, warm tungsten
            against cool blue shadow.
          backdrop: >-
            Impossibly narrow dead-end alley with buildings leaning
            together overhead, a three-wheeled vehicle parked facing
            out, the back wall covered in hand-painted navigation
            symbols in faded colors, single bare bulb.
        environment:
          solo: >-
            Dripping water from overhead laundry, the idle tick of a
            warm three-wheeled engine, cooking spices from an unseen
            kitchen above, the close humid press of walls barely two
            meters apart, warm tungsten against cool shadow.
          backdrop: >-
            Dripping water, warm engine tick, cooking spices, close walls.

      - name: Graubucht
        slug: graubucht
        type: chase_set_piece
        region: grisevont
        description: >-
          A long sweeping left-hand curve on the coast road where the cliff
          drops straight to black rocks and surf sixty meters below. No
          guardrail. The road surface is salt-pitted and permanently damp
          from ocean spray. At dawn, when the café racers run this section,
          the grey-blue light makes the road edge invisible — you steer by
          feel and by the sound of the surf getting louder when you drift
          too far right. The fastest recorded speed through Graubucht is
          painted on a rock at the curve's exit. The number is terrifying.
        visual_prompt:
          solo: >-
            Wide sweeping landscape shot of a coastal cliff road curving
            left along a sea cliff at pre-dawn grey-blue light, taken
            from the outer edge looking along the curve. Foreground:
            wet salt-pitted asphalt with no road markings, no guardrail,
            the road edge crumbling directly into cliff face — jagged
            black rocks and white surf visible sixty meters below.
            Middle ground: the road curving left along the cliff face
            in a long sweeping arc, the asphalt glistening with ocean
            spray, a single white speed-number painted on a flat rock
            at the curve's exit point. Background: the grey pre-dawn
            ocean stretching to a flat horizon, sea fog clinging low
            to the water surface, the silhouette of distant sea stacks.
            Pre-dawn grey-blue light, no direct sun, the ocean a flat
            steel grey, salt haze softening everything beyond twenty
            meters. No vehicles, no people.
          backdrop: >-
            Coastal cliff road curving left with no guardrail, wet
            salt-pitted asphalt, black rocks and surf sixty meters
            below, pre-dawn grey-blue light, sea fog at the
            horizon.
        environment:
          solo: >-
            Pre-dawn grey-blue stillness, the constant crash of surf
            on rocks far below, salt spray misting the road surface,
            wind gusting from the ocean side pushing toward the cliff
            edge, the smell of kelp and cold stone.
          backdrop: >-
            Grey-blue stillness, surf crash below, salt spray, kelp wind.

    tropes:
      - id: turf_race
        status: progressing
        progression: 0.2
      - id: police_crackdown
        status: dormant
        progression: 0.0
      - id: convoy_war
        status: dormant
        progression: 0.0

  - id: mid
    name: "The War for the Road"
    maturity: MID
    session_range: [13, 25]
    description: >-
      The Circuit is fracturing. Alliances shift. Old grudges ignite. A
      major conflict — a turf war, a police crackdown, a challenge that
      pulls every faction in — is reshaping the power structure. The
      player is no longer a bystander. They are a factor. What they do
      next matters to people who matter.

    character_progression:
      level_range: [5, 8]
      milestone_hints:
        - "Faction leadership role or independent power base"
        - "Rig is now legendary in at least one district"
        - "Debts called in — the cost of alliances comes due"
      item_hints:
        - "heavily modified rig with faction-specific upgrades"
        - "allies and enemies in multiple factions"
        - "knowledge of routes and secrets others don't have"

    npcs:
      - name: Kongou-maru
        archetype: The Oyakata
        disposition: 5
        notes: >-
          Dekotora convoy master. His truck is the most elaborately decorated
          rig in the city. Speaks formally, moves slowly, and controls the
          port road with quiet certainty. Rumored to carry something old
          in his cab that he never shows anyone.
      - name: Don Flaco de la Cruz
        archetype: The Veterano
        disposition: 10
        notes: >-
          Elder of the Lowrider scene. Brokered the Sagrado Pact. His word
          holds the boulevard together. Patient, proud, and carrying more
          history than he lets on.
      - name: Phi Lek
        archetype: The Phi
        disposition: 0
        notes: >-
          Senior Tuk-Tuk Syndicate operator. Knows every alley in Nokutori
          including ones that appear on no map. Speaks softly. Appears and
          disappears without explanation.

    active_quests:
      - "Choose a side in the factional conflict — or find a third path"
      - "Attempt The Full Circuit"
      - "Discover what connects all ten factions to this city"

    narrative_log:
      - speaker: narrator
        text: >-
          The city is different now. The accommodations that kept the peace
          are breaking down. Turf that was settled is contested again. Old
          alliances are tested by new pressures. You've been on the road long
          enough to know that The Circuit isn't just a city with gangs — it's
          a system, and the system is designed. By whom, and why, is the
          question that keeps you up after the engines stop.

    location: aschgrund
    atmosphere: volatile, consequential, the stakes are real now
    active_stakes: "Power — who controls the roads, and what are they willing to destroy to keep them?"

    points_of_interest:
      - name: Aschpfeiler
        slug: aschpfeiler
        type: chase_set_piece
        region: aschgrund
        description: >-
          The rusted support column in the center of the largest warehouse
          floor at Aschgrund. Scored with marks from a hundred races —
          whoever touches the pillar first on the final lap wins. The column
          is pitted with impact dents from riders who cut too close. Spray-
          painted tallies mark faction victories. The 1%ers have the most
          marks. The Bōsōzoku have the most recent. Under the paint, if
          you look closely, there are marks that predate every faction —
          scored into the metal with a tool, not a vehicle.
        visual_prompt:
          solo: >-
            Wide landscape shot of an abandoned industrial warehouse
            interior at night, framed across the wide concrete floor toward
            a single rusted steel support column at the geometric center
            of the space. Foreground: wide expanse of pitted concrete
            floor scored with curving black tire marks and skid lines.
            Middle ground: a heavy rusted I-beam column rising to a high
            ceiling, the column covered in layered spray-painted faction
            tallies and victory marks (multicolored bars and crew symbols),
            visibly dented from vehicle impacts at chest height, with
            faint older marks scored into the metal beneath the paint.
            Background: rusted industrial machinery, catwalks in deep
            shadow, the silhouettes of spectator-shapes barely visible on
            elevated walkways, motorcycle and car headlights from off-frame
            creating crossed beams of light that arena-light the column.
            Late night, headlamp-amber lighting, smoke and exhaust haze in
            the crossed beams.
          backdrop: >-
            Abandoned warehouse interior at night with a rusted steel
            support column at center scored with spray-painted faction
            tallies and impact dents, crossed headlight beams from
            off-frame vehicles arena-lighting the pillar, exhaust haze.

      - name: Sturmrohr
        slug: sturmrohr
        type: chase_set_piece
        region: sturmichi
        description: >-
          The longest tunnel on the expressway loop — eight hundred meters
          of concrete tube lit by failing fluorescent strips that flicker in
          sequence, creating a strobe effect at speed. The sound inside is
          deafening — engine noise compressed and reflected until it becomes
          a physical force. At the tunnel's midpoint, there is a maintenance
          access door. It is always locked. The lock is new. The door is old.
        visual_prompt:
          solo: >-
            Long ultra-deep landscape shot taken from the center of the
            traffic lane inside an eight-hundred-meter concrete highway
            tunnel, looking down the full length of the tube toward a
            distant exit pinpoint. Foreground: pitted asphalt lane stripes
            stretching toward vanishing point. Middle ground: tunnel walls
            of dirty concrete with sound-absorbing ribbing, failing
            fluorescent strip lights overhead flickering in sequence with
            roughly half of them dark, creating a strobing alternation of
            cold white and deep shadow along the tunnel length. A small
            maintenance access door at the tunnel midpoint on the right
            wall, painted institutional grey, with a noticeably new shiny
            steel lock on the handle that contrasts with the door's age.
            Background: a distant tunnel exit shrunk to a pinpoint of
            sodium-amber far down the tube. Deep linear perspective, cold
            fluorescent light, motion-blur streaks barely visible at the
            edges.
          backdrop: >-
            Long concrete highway tunnel interior with failing fluorescent
            strip lights strobing along its length, lane stripes
            stretching to a distant exit pinpoint, an institutional-grey
            maintenance access door at the midpoint with a new shiny
            lock.

      - name: Dorapinta
        slug: dorapinta
        type: lore_site
        region: doracanto
        description: >-
          The wall at the north end of the boulevard where the Lowrider
          families have been painting for twenty years. Layer upon layer —
          faces of the dead, landscapes of places none of them have been,
          virgins and saints and classic cars floating in clouds. The newest
          panel is a map. Not of the boulevard. Not of the city. Of something
          underground, painted in the style of a religious illumination, with
          roads that branch and converge in patterns that look deliberate.
          The artist says it came to them in a dream.
        visual_prompt:
          solo: >-
            Wide landscape shot of a long Lowrider memorial mural wall at
            the north end of an urban boulevard at dusk, photographed
            head-on across an empty sidewalk. Foreground: cracked sidewalk
            with faded chalk votive marks and a single candle burning at
            the wall's base. Middle ground: twenty years of layered
            Chicano-style mural art covering a 30-meter concrete wall —
            faces of the dead, virgins and saints in religious-illumination
            framing, classic lowrider cars floating among clouds, gold leaf
            and rich blues, every inch painted, layered visibly. At the
            wall's center-right a newer panel — a stylized map painted in
            religious-illumination style with branching converging roads
            in gold and crimson, ornamental borders, looking like an
            ancient codex page. Background: palm trees, distant boulevard
            tail-lights, magic-hour sky transitioning to night. Warm
            saturated colors, devotional atmosphere. No people.
          backdrop: >-
            Layered Lowrider memorial mural wall at dusk with faces of
            the dead, virgins, classic cars in clouds, gold-leaf
            religious-illumination framing, and a newer mural panel
            depicting a branching road-map painted in codex style.

      - name: Bruveil Serpentine
        slug: bruveil_serpentine
        type: chase_set_piece
        region: bruveil
        description: >-
          The tightest sequence of switchbacks on the mountain pass — seven
          hairpins in rapid succession where the road doubles back on itself
          climbing a near-vertical cliff face. Each hairpin is blind, the
          inside wall is raw rock, and the outside has nothing but a gravel
          lip and empty air. At speed, you can see the rider above you or
          below you on the adjacent switchback — close enough to shout to,
          separated by a vertical drop. The café racers call it the serpentine
          and consider it a liturgy. Outsiders call it suicide.
        visual_prompt:
          solo: >-
            Wide aerial-angle landscape shot looking down at a mountain
            road carved into a steep cliff face, showing multiple
            switchback hairpins stacked vertically. Foreground: the
            uppermost hairpin — raw grey rock on the inside, gravel
            shoulder on the outside crumbling into vertical drop,
            black tire marks scoring the apex. Middle ground: three
            more hairpins visible below in rapid sequence, the road
            doubling back on itself in tight Z-patterns down the
            cliff face, each turn blind with rock walls, no
            guardrails anywhere, gravel scattered across the apex
            of each turn. Background: the sea far below, morning
            fog filling the valley between the cliff and the water,
            the road continuing down through more switchbacks
            disappearing into the fog layer. Early morning light,
            grey-blue and cold, the rock face dark and wet. No
            vehicles, no people.
          backdrop: >-
            Mountain road switchbacks carved into a steep cliff face,
            stacked hairpins with raw rock walls and no guardrails,
            gravel shoulders over vertical drops, morning fog below,
            grey-blue light.
        environment:
          solo: >-
            Cold mountain air thin at elevation, loose gravel
            crunching under tires at the apex of each turn, wind
            channeling up the cliff face, the distant sound of surf
            far below, the smell of wet rock and exhaust from a
            rider who passed minutes ago.
          backdrop: >-
            Thin cold air, loose gravel, cliff-face wind, distant surf.

      - name: The Mod Exchange
        slug: the_mod_exchange
        type: lore_site
        region: nottavello
        description: >-
          A phone box on the corner of the nightlife district's main
          intersection — not remarkable except that it rings at 2 AM every
          Thursday and whoever answers gets information. The Mods installed
          a second handset inside years ago, wired to their own network. The
          phone box has become a dead drop, a meeting point, and a symbol:
          anyone can pick up the phone, but only the Mods know who's calling.
          The intersection around it is always lit by three competing neon
          signs — blue, pink, and amber — creating a perpetual color wash
          that makes every face look different depending on where you stand.
        visual_prompt:
          solo: >-
            Wide landscape shot of an urban intersection at night,
            centered on a classic red telephone box standing on the
            corner under competing neon light from three different
            signs. Foreground: wet pavement reflecting three colors —
            blue, pink, and amber — from neon signs mounted at
            different heights on surrounding buildings, the reflections
            creating overlapping color pools on the asphalt. Middle
            ground: the red phone box at the intersection corner, its
            interior lit by a dim yellow bulb, the handset hanging
            slightly off the hook, a second non-standard handset
            mounted inside on a custom bracket. Background: the
            nightlife district intersection — narrow buildings with
            club awnings, parked mirror-covered scooters in a row
            catching all three neon colors, a basement club entrance
            with steps descending, the wet street disappearing into
            more neon in both directions. Late night, competing blue-
            pink-amber neon wash, no single dominant color.
            No people visible.
          backdrop: >-
            Red telephone box on a nightlife intersection corner under
            competing blue-pink-amber neon, wet pavement reflecting
            all three colors, mirror-covered scooters parked nearby,
            dim interior bulb.
        environment:
          solo: >-
            Three competing neon colors washing every surface in
            shifting blue-pink-amber, muffled bass from basement
            clubs beneath the pavement, the distant ring of a
            telephone, wet street reflecting everything twice, the
            smell of rain on warm neon tubes.
          backdrop: >-
            Competing neon wash, muffled bass below, telephone ring, wet streets.

      - name: Motorheim
        slug: motorheim
        type: safe_haven
        region: grensholt
        description: >-
          The largest of the garage-strip workshops — a double-bay converted
          bus depot where the Rockers have been rebuilding British iron since
          before anyone else showed up. The floor is a museum of oil stains
          going back twenty years. The walls are lined with engines in various
          states of assembly. A chalkboard above the main bench lists every
          faction's outstanding repair debts. The Rockers honor no allegiance
          except mechanical truth — a badly built engine offends them
          regardless of whose colors are on the tank.
        visual_prompt:
          solo: >-
            Wide landscape shot inside a large double-bay converted bus
            depot workshop at night, taken from one open bay door
            looking across the full interior. Foreground: wide oil-
            stained concrete floor with twenty years of layered dark
            stains, a rolling tool chest, chrome wrenches catching
            fluorescent light. Middle ground: two repair bays side by
            side, each with a British motorcycle in mid-rebuild — one
            a café-racer stripped to the frame on a bench, the other
            a heavy cruiser with engine block removed and hung from
            a chain hoist. A large chalkboard mounted above the main
            workbench covered in columns of tallied repair debts in
            different chalk colors. Background: walls lined with
            motorcycle engines on shelves in various states of
            assembly, exhaust headers hanging from ceiling hooks,
            leather jackets on pegs, a single radio playing from a
            shelf, the second bay door half-open revealing the dark
            industrial street. Fluorescent strip lighting, functional
            and cold. No people.
          backdrop: >-
            Double-bay bus depot workshop interior at night, British
            motorcycles in mid-rebuild, chalkboard of repair debts,
            engines on shelves, oil-stained concrete, fluorescent
            strips.
        environment:
          solo: >-
            Fluorescent strip hum and the smell of Castrol R racing
            oil, cold chrome under fingertips, the low crackle of a
            radio playing rockabilly between static bursts, the
            sharp chemical bite of brake cleaner, engine parts
            clicking as they cool.
          backdrop: >-
            Fluorescent hum, Castrol R oil smell, rockabilly radio static, cold chrome.

