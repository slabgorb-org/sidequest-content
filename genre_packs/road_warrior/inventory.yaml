# road_warrior — genre-tier CWN baseline + bespoke vehicular catalog (ADR-145, story 114-5)
#
# Two layers live here, both genre-tier:
#  1. The Cities Without Number SRD §3.0.0 PERSONAL gear chapter (Armor §3.3,
#     Weapons §3.4, Mission Gear §3.1, Cyberware §3.6.7), extracted VERBATIM by the
#     114-5 tool (cwn_equip_extract@114-5). road_warrior binds ruleset: cwn — the
#     same CWN module neon_dystopia binds — so on-foot driver combat resolves on
#     the SRD's own gear. Each `cwn_*` item carries mode=verbatim/srd=cwn/
#     license=wn-free provenance; system_strain is a verbatim FLOAT (0.25/0.5).
#  2. The bespoke road-warrior gear: rig parts, mount weapons, vessels (rigs), and
#     survival kit, plus the improvised personal weapons (tire iron, chain,
#     sawed-off, crossbow). These are mode=bespoke/license=na — honestly NOT
#     SRD-verbatim, freely re-stattable.
#
# SCOPE (114-5 = personal gear only): the rig Composure / vessel / mount-weapon
# stringly-typed homebrew below is UNCHANGED and remains bespoke. Binding CWN's
# vehicle chapter (speed/armor/AC/HP/crew/hardpoints) is story 114-6, deliberately
# out of scope here. Verbatim gaps the WN-family parser does not capture (sourced,
# never invented): Rifle's +2 flat bonus, weapon Trauma Die/Rating, armor Damage
# Soak + dual AC (armor_class = SRD Ranged AC), Dermal Armor Trauma-Target mod.

currency:
  name: Fuel
  abbreviation: F
  description: >-
    Fuel is the universal currency. Everything is priced in fuel units.
    A full tank is wealth. An empty tank is death. The world's economy
    runs on combustion — whoever controls fuel controls everything.
  secondary:
    - name: Parts
      abbreviation: P
      description: >-
        Scavenged mechanical components. Used for rig repairs and upgrades.
        More specialized parts are rarer and more valuable. A working
        alternator is worth more than gold.
    - name: Favor
      abbreviation: Fv
      description: >-
        Debts owed and favors earned. The informal economy of the road.
        A Fuel Broker who owes you a favor is better than a full tank.
        Tracked per NPC/faction, not as a number.


