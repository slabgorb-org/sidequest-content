  # The bespoke road-warrior gear (rig parts, mount weapons, the rig-tier
  # vessels, and survival consumables) moved to the world tier in story 120-2:
  # they have no clean CWN-verbatim analog, and a WN-family genre baseline
  # carries no bespoke (loader._validate_genre_baseline_no_bespoke). They now
  # live at worlds/the_circuit/inventory.yaml as honest mode=bespoke and resolve
  # into the combat-class kits via the non-droppable genre↔world merge. Story
  # 120-2 also DELETED four survival items (medkit, tool_kit, binoculars,
  # radio_handheld) that were exact duplicates of their CWN-verbatim twins
  # (cwn_medkit, cwn_basic_tools_kit, cwn_binoculars, cwn_handheld_radio); the
  # kits now point at the twins.


# Loadouts keyed by char_creation crucible class_hint (Wheelman, Grease Monkey,
# Wrecker, Chrome Saint, Road Preacher). The orphan `War Rider` key — no backing
# class_hint — was removed in 114-5. Every id resolves to a catalog item above
# (rig/bespoke survival ids or CWN baseline ids); no dead ids. Gold is fuel-scale.
starting_equipment:
  Wheelman: [rig_tier_1_prospect, cwn_basic_tools_kit, pistol, cwn_handheld_radio]
  Grease Monkey: [rig_tier_1_prospect, cwn_basic_tools_kit, tire_iron, engine_part, cwn_medkit]
  Wrecker: [rig_tier_1_prospect, chain, ram_plow, armor_plate]
  War Rider: [rig_tier_1_prospect, sawed_off_shotgun, armor_plate, cwn_medkit]
  Chrome Saint: [rig_tier_1_prospect, pistol, cwn_medkit, radio_rig, cwn_binoculars]
  Road Preacher: [rig_tier_1_prospect, sawed_off_shotgun, cwn_handheld_radio, cwn_medkit]

starting_gold:
  Wheelman: 15
  Grease Monkey: 20
  Wrecker: 10
