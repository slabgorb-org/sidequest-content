# road_warrior — genre-tier CWN-verbatim baseline (ADR-145 D3, story 120-2)
#
# The genre tier is now 100% CWN-verbatim: the 66 `cwn_*` items below are the
# Cities Without Number SRD §3.0.0 PERSONAL gear chapter (Armor §3.0.1, Melee
# §3.0.2, Ranged §3.0.3, General Equipment §3.0.4, Cyberware §3.0.5), extracted
# VERBATIM by the 114-5 tool (cwn_equip_extract@114-5). road_warrior binds
# ruleset: cwn — the same CWN module neon_dystopia binds — so on-foot driver
# combat resolves on the SRD's own gear. Each `cwn_*` item carries
# mode=verbatim/srd=cwn/license=wn-free provenance; system_strain is a verbatim
# FLOAT (0.25/0.5). A WN-family genre baseline carries NO bespoke and NO
# unprovenanced item (loader._validate_genre_baseline_no_bespoke).
#
# The bespoke road-warrior gear — rig parts, mount weapons, the rig-tier vessels,
# and the survival consumables — has NO clean CWN-verbatim analog, so it lives at
# the WORLD tier (worlds/the_circuit/inventory.yaml) as honest mode=bespoke
# (ADR-145 D3 — bespoke is a world-tier privilege). The improvised personal
# weapons (tire iron, chain, sawed-off, crossbow, pistol) moved there in 114-14;
# story 120-2 moved the rest. They resolve into the combat-class kits via the
# non-droppable genre↔world merge.
#
# Verbatim gaps the WN-family parser does not capture (sourced, never invented):
# Rifle's +2 flat bonus, weapon Trauma Die/Rating, armor Damage Soak + dual AC
# (armor_class = SRD Ranged AC), Dermal Armor Trauma-Target mod. Binding CWN's
# vehicle chapter (speed/armor/AC/HP/crew/hardpoints) is story 114-6, deferred.

currency:
  name: Fuel
  abbreviation: F
  description: >-
    Fuel is the universal currency. Everything is priced in fuel units.
    A full tank is wealth. An empty tank is death. The world's economy
    runs on combustion — whoever controls fuel controls everything.
  secondary:
    - name: Parts
      abbreviation: P
      description: >-
        Scavenged mechanical components. Used for rig repairs and upgrades.
        More specialized parts are rarer and more valuable. A working
        alternator is worth more than gold.
    - name: Favor
      abbreviation: Fv
      description: >-
        Debts owed and favors earned. The informal economy of the road.
        A Fuel Broker who owes you a favor is better than a full tank.
        Tracked per NPC/faction, not as a number.


