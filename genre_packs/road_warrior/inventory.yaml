  # ── VESSELS (RIGS) — magic.yaml vessel category ────────────────
  # Templates by tier. The player names their rig at chargen
  # (char_creation.yaml the_name scene). The materializer should
  # instantiate the appropriate tier template based on character level
  # (see custom_rules.rig_progression_arc and rig_composure_spec in
  # rules.yaml). Composure / Speed / Armor / Fuel / Mount Slots are
  # encoded in tags as ``composure:N``, ``speed:N``, etc. so the
  # backend can parse them at materialization (filed as backlog story).
  #
  # Type is left abstract — the player's chosen chassis (Bōsōzoku
  # kaidō racer, Vespa scooter, '64 Impala lowrider, dekotora, etc.)
  # colors the narrative without changing the mechanical pool.

  - id: rig_tier_1_prospect
    name: "Prospect Rig"
    description: >-
      A fresh-on-the-road rig. Beat-up, mismatched panels, coughing
      engine, steering pulls left, but it runs. Whatever you can salvage,
      inherit, or buy with what's in your pocket on day one.
    category: vessel
    value: 0
    weight: 0
    rarity: common
    power_level: 1
    tags:
      - vessel
      - rig
      - tier-1
      - "composure:4"
      - "composure_max:4"
      - "speed:3"
      - "armor:0"
      - "fuel_capacity:60"
      - "mount_slots:1"
    lore: >-
      Tier 1 — Prospect. Rig Composure 4. 1 mount slot. Fuel 60. The
      thing that gets you to tomorrow.
    narrative_weight: 0.5

  - id: rig_tier_2_runner
    name: "Runner Rig"
    description: >-
      Tuned engine purring under a reinforced hood. Painted stripes, a
      name scratched into the dash, a lucky charm dangling from the
      mirror. The relaxed confidence of someone who's been outrunning
      things for a year.
    category: vessel
    value: 0
    weight: 0
    rarity: uncommon
    power_level: 2
    tags:
      - vessel
      - rig
      - tier-2
      - "composure:6"
      - "composure_max:6"
      - "speed:4"
      - "armor:1"
      - "fuel_capacity:80"
      - "mount_slots:2"
    lore: >-
      Tier 2 — Runner. Composure 6. 2 mount slots. Light armor.
      The rig has a personality now.
    narrative_weight: 0.6

  - id: rig_tier_3_road_name
    name: "Road Name Rig"
    description: >-
      People know this rig before they know you. Custom paint that's
      survived three repaints. A signature trait — a particular exhaust
      note, a hood mural, a chrome detail — that the city recognizes.
      Reputation rolls off it at every gas station.
    category: vessel
    value: 0
    weight: 0
    rarity: rare
    power_level: 3
    tags:
      - vessel
      - rig
      - tier-3
      - "composure:8"
      - "composure_max:8"
      - "speed:5"
      - "armor:2"
      - "fuel_capacity:100"
      - "mount_slots:3"
      - "signature_traits:1"
    lore: >-
      Tier 3 — Road Name. Composure 8. 3 mount slots. Armor 2.
      One Signature Trait — choose at acquisition.
    narrative_weight: 0.7

