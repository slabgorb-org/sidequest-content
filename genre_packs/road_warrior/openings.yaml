- id: the_meet
  archetype: standoff
  situation: >-
    The player arrives at a crew meet — two factions in the same parking
    lot, engines idling, headlights pointed at each other. Something is
    being negotiated. The player is either invited, expected, or about
    to make a very memorable first impression.
  tone: tense, political
  avoid:
    - wilderness survival
    - scavenging
    - empty landscapes
  first_turn_seed: >-
    Two rows of headlights in a warehouse lot. Engines idling on both
    sides. Someone walks into the gap between them. They're looking at you.

- id: mid_chase
  archetype: chase
  situation: >-
    The player is already moving — on a bike, in a car, weaving through
    traffic or blasting down an empty expressway. Pursuit is happening
    NOW. There's no time to take stock or ask questions. Ride or crash.
  tone: kinetic, relentless
  avoid:
    - settlement arrival
    - calm introduction scenes
    - exposition
  first_turn_seed: >-
    The engine screams. Headlights in the mirror — two, maybe three.
    The intersection ahead is yellow. Your lane is closing.

- id: garage_night
  archetype: social
  situation: >-
    The player is in a garage after hours. Rigs being worked on, radio
    playing, crew members drinking and talking. This is where deals are
    made, alliances formed, and rumors traded. The mechanic knows
    something. The Boss needs something. The Prospect is watching.
  tone: ambient, layered
  avoid:
    - immediate danger
    - chase openings
    - survival urgency
  first_turn_seed: >-
    Fluorescent light, oil on concrete, and the radio playing something
    with bass. Three rigs up on lifts. Someone hands you a beer and
    leans against a fender. "Heard you were looking for work."

- id: cruise_night
  archetype: ritual
  situation: >-
    The player is on the boulevard during the slow cruise — vehicles in
    formation, bass shaking the street, spectators on the sidewalk. The
    cruise is sacred. This is where the culture shows itself. But
    something is wrong tonight — wrong crew, wrong corner, wrong look.
  tone: ceremonial, tension underneath
  avoid:
    - combat openings
    - wilderness
    - fetch quests
  first_turn_seed: >-
    Low and slow on the boulevard. Hydraulics hissing. Chrome catching
    neon. The crowd on the sidewalk is thicker than usual — and there's
    a crew parked at the corner that doesn't belong here.

- id: new_in_town
  archetype: arrival
  situation: >-
    The player has just rolled into a city they don't know. Every crew
    has territory. Every road belongs to someone. The player's rig and
    colors — or lack of colors — are being noticed. The first person
    who talks to them will shape everything that follows.
  tone: overwhelming, electric, anonymous
  avoid:
    - familiar settings
    - allies nearby
    - safety
  first_turn_seed: >-
    The sound hits first — engines layered ten deep, a dozen different
    cultures of exhaust and bass. Then the neon. Then the smell — fuel,
    food, rain on hot asphalt. You are nobody here. That changes tonight.

- id: the_job
  archetype: mission
  situation: >-
    Someone needs something moved from one end of the city to the other,
    through contested territory, by dawn. The cargo might be parts, a
    person, information, or something nobody will name. The route crosses
    at least two crews' turf. The pay is good enough that you're
    considering it.
  tone: calculating, opportunistic
  avoid:
    - open combat
    - wasteland survival
    - aimless wandering
  first_turn_seed: >-
    A map spread on a garage workbench, route marked in grease pencil.
    Three districts. Two hostile. One that owes you a favor that might
    not be worth as much as you think. "You in or not?"
