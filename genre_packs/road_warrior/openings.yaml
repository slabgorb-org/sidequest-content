- id: mid_chase
  archetype: chase
  situation: >-
    The player is already moving — in a vehicle, on foot, or clinging to
    something at speed. Pursuit is happening NOW. There's no time to take
    stock or ask questions. Drive or die.
  tone: kinetic, relentless
  avoid:
    - settlement arrival
    - job boards
    - calm introduction scenes
  first_turn_seed: >-
    The engine screams. Dust and chrome in the rearview. They're gaining —
    two rigs, maybe three. The fuel gauge is a prayer.

- id: fuel_crisis
  archetype: survival
  situation: >-
    The player's vehicle is running on fumes in hostile territory. The nearest
    fuel source is contested, trapped, or guarded. Walking means death.
    Every decision costs something irreplaceable.
  tone: desperate, calculating
  avoid:
    - friendly mechanics
    - simple fuel runs
    - NPC quest givers
  first_turn_seed: >-
    The engine coughs twice and dies. Silence hits like a fist. Nothing but
    heat shimmer and the distant rumble of someone else's engine.

- id: convoy_encounter
  archetype: standoff
  situation: >-
    The player encounters a convoy on the road — armed, loaded, and not
    stopping to chat. Are they traders, raiders, or refugees? The player has
    seconds to decide: approach, hide, or follow.
  tone: tense, predatory
  avoid:
    - settlement scenes
    - exposition dumps
    - being given instructions
  first_turn_seed: >-
    Dust cloud on the horizon. Big one — five vehicles at least, running in
    formation. Armed. They haven't seen you yet. Probably.

- id: wreck_scavenge
  archetype: mystery
  situation: >-
    The player finds a fresh wreck — vehicles, bodies, cargo scattered across
    the road. Something happened here minutes ago. Whatever did this might
    still be close. But the cargo is right there.
  tone: ominous, opportunistic
  avoid:
    - clean starting positions
    - friendly NPCs
    - fetch quests
  first_turn_seed: >-
    The wreck is still smoking. Three rigs, torn open like cans. Cargo
    everywhere. No survivors visible. The question is what hit them — and
    whether it's still here.
