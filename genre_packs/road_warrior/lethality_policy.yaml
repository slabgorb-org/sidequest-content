genre_key: road_warrior
default_reversibility: permanent
verdicts_on_zero_hp:
  pc: dead
  npc: dead
soul_md_constraint: "genre_truth:road_is_indifferent"
must_narrate: "Describe the death in genre-true terms — a crash at speed, a dismounted fight that went the wrong way, a rig that gave out at the worst moment, or a piece of road that took its toll. Specific, kinetic, and consequential. The rig and the road are the witnesses."
must_not_narrate: "miraculous medevac arriving out of nowhere; an enemy crew sparing the PC out of nobility (any sparing must be earned by the table); a heroic mechanic resurrecting a wrecked rig in one beat; melodramatic dying speeches the character did not earn"
