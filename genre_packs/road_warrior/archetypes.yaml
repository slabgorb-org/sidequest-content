- name: The Boss
  description: >-
    Crew leader. Earned the position through road cred, loyalty, and the
    ability to keep people alive and riding. Part strategist, part parent,
    part politician. Their word holds the crew together — not through fear
    but through the fact that everyone knows they'd ride into hell for any
    member. The Boss doesn't have to be the fastest or the toughest. They
    have to be the one nobody wants to disappoint.
  personality_traits:
    - decisive
    - protective
    - carries the weight
  typical_classes:
    - Road Preacher
    - Wheelman
  typical_races:
    - Convoy Born
    - Legacy
  stat_ranges:
    CHA: [16, 18]
    WIS: [14, 16]
  inventory_hints:
    - a rig that's been rebuilt six times and still runs
    - a radio frequency the whole crew monitors
    - scars from the time the crew almost didn't make it
  dialogue_quirks:
    - gives orders like suggestions but everyone knows they aren't
    - refers to the crew as "us" and "we" — never "my people"
  disposition_default: 10
  ocean:
    openness: 4.5
    conscientiousness: 7.5
    extraversion: 7.0
    agreeableness: 6.5
    neuroticism: 4.0

- name: The Mechanic
  description: >-
    The one who keeps everything running. Knows engines the way a surgeon
    knows anatomy — by sound, by feel, by the smell of what's burning.
    Every crew needs one. Most can't afford the best. Works out of a
    garage that smells like oil and ambition, with a waiting list and a
    reputation that crosses faction lines. Neutral by necessity — nobody
    wants to lose their mechanic access over politics.
  personality_traits:
    - obsessive
    - gruff
    - indispensable
  typical_classes:
    - Grease Monkey
  typical_races:
    - Gearhead
    - Pit Crew
  stat_ranges:
    INT: [16, 18]
    STR: [12, 14]
  inventory_hints:
    - a tool belt that weighs more than some people
    - grease under the fingernails that never comes out
    - a mental catalog of every part source in the city
  dialogue_quirks:
    - talks to engines like they're patients
    - gives rig diagnoses in the tone of a doctor delivering bad news
  disposition_default: 0
  ocean:
    openness: 3.5
    conscientiousness: 8.5
    extraversion: 2.5
    agreeableness: 3.5
    neuroticism: 3.0

- name: The Prospect
  description: >-
    New blood. Young, reckless, hungry for colors. Does the shit jobs,
    takes the worst risks, and grins through all of it because earning
    a patch means earning a family. Loyalty is absolute — to the crew,
    the Boss, the code. Has not yet learned that the road takes more
    than it gives. Dangerous because they have nothing to lose and
    everything to prove.
  personality_traits:
    - fanatical
    - fearless
    - desperately loyal
  typical_classes:
    - Wrecker
    - War Rider
  typical_races:
    - Convoy Born
    - Outlaw
  stat_ranges:
    CON: [16, 18]
    DEX: [14, 16]
  inventory_hints:
    - a rig held together by will and aftermarket parts
    - a crew jacket with no patch yet — that blank space is everything
    - bruises from last night's run that they won't mention
  dialogue_quirks:
    - volunteers for everything before anyone asks
    - defers to patched members but watches everything
  disposition_default: 5
  ocean:
    openness: 2.0
    conscientiousness: 3.0
    extraversion: 8.0
    agreeableness: 3.5
    neuroticism: 2.0

- name: The Broker
  description: >-
    Deals in information, parts, favors, and introductions. Connected to
    every crew without belonging to any of them. Knows who needs what,
    who hates whom, and which runs are happening tonight. Never rides
    in formation — always alone, always between factions, always knowing
    more than they should. The person you need and can never fully trust.
  personality_traits:
    - calculating
    - indispensable
    - smug
  typical_classes:
    - Road Preacher
  typical_races:
    - Scrapper
    - Legacy
  stat_ranges:
    CHA: [14, 16]
    CON: [14, 16]
  inventory_hints:
    - a phone with contacts in every crew
    - a garage bay rented under a name nobody recognizes
    - a ledger of who owes what that would start three wars if published
  dialogue_quirks:
    - quotes prices in favors, not money
    - knows what you need before you tell them
  disposition_default: -5
  ocean:
    openness: 3.0
    conscientiousness: 6.5
    extraversion: 5.0
    agreeableness: 2.0
    neuroticism: 3.5

- name: The Veteran
  description: >-
    Been riding since before most of the current crop were born. Has
    stories about every road, every crew, every feud. Survived because
    they're smart, not because they're lucky. Commands respect without
    asking for it — younger riders fall quiet when they speak. May still
    lead, or may have stepped back to an advisory role. Either way, their
    opinion shapes decisions whether it's asked for or not.
  personality_traits:
    - measured
    - authoritative
    - carrying history
  typical_classes:
    - Road Preacher
    - Wheelman
  typical_races:
    - Legacy
    - Convoy Born
  stat_ranges:
    WIS: [16, 18]
    CHA: [14, 16]
  inventory_hints:
    - a rig that's older than most riders and runs better than theirs
    - photographs nobody else has
    - a reputation that opens doors without knocking
  dialogue_quirks:
    - begins sentences with "Back when—" and everyone leans in
    - never raises their voice — quiet authority is louder than shouting
  disposition_default: 5
  ocean:
    openness: 4.0
    conscientiousness: 7.0
    extraversion: 5.0
    agreeableness: 5.5
    neuroticism: 3.0

- name: The Enforcer
  description: >-
    The crew's fist. When the Boss gives the word, the Enforcer makes it
    happen — a warning delivered, a debt collected, a message sent in
    bent chrome and cracked fairings. Big, visible, and exactly as
    dangerous as they look. Not stupid — muscle that's also smart is how
    crews survive. But diplomacy isn't the first tool in the box.
  personality_traits:
    - loyal
    - intimidating
    - surprisingly perceptive
  typical_classes:
    - Wrecker
    - War Rider
  typical_races:
    - Outlaw
    - Convoy Born
  stat_ranges:
    STR: [16, 18]
    CON: [14, 16]
  inventory_hints:
    - a rig built for impact, not beauty
    - knuckles that have connected with things that aren't steering wheels
    - a reputation that clears a room when they walk in
  dialogue_quirks:
    - lets silence do the talking — a stare says more than a threat
    - speaks in short sentences with long pauses between them
  disposition_default: -5
  ocean:
    openness: 2.5
    conscientiousness: 6.0
    extraversion: 4.0
    agreeableness: 2.0
    neuroticism: 3.5

- name: The Lone Rider
  description: >-
    No crew, no colors, no allegiance. Rides alone by choice or
    circumstance. Might be a courier, a bounty hunter, a disgraced
    ex-member of a crew, or someone who just doesn't play well with
    others. Competent in a way that makes crew riders nervous — anyone
    who survives alone on contested roads is either very good or very
    crazy. Usually both.
  personality_traits:
    - taciturn
    - self-reliant
    - haunted
  typical_classes:
    - Wheelman
  typical_races:
    - Outlaw
    - Legacy
  stat_ranges:
    DEX: [16, 18]
    WIS: [14, 16]
  inventory_hints:
    - a rig maintained to perfection — their only companion
    - a photograph or token they don't talk about
    - enough gear for one, exactly
  dialogue_quirks:
    - answers questions with nods or single words
    - watches exits and mirrors more than faces
  disposition_default: 0
  ocean:
    openness: 3.5
    conscientiousness: 7.5
    extraversion: 1.5
    agreeableness: 3.0
    neuroticism: 6.0

- name: The Voice
  description: >-
    The one who makes legends. Might be a radio DJ, a race announcer,
    a blogger, a barfly storyteller, or the person at the garage who
    always knows what happened last night. Every scene needs a narrator,
    and in road culture, the Voice decides who's famous, who's forgotten,
    and whose crash gets told at every bar for the next decade. Power
    through reputation, not chrome.
  personality_traits:
    - theatrical
    - omniscient (or pretends to be)
    - never shuts up
  typical_classes:
    - Road Preacher
  typical_races:
    - Legacy
    - Pit Crew
  stat_ranges:
    CHA: [16, 18]
    CON: [12, 14]
  inventory_hints:
    - a microphone, a radio transmitter, or a voice that carries over engines
    - stories about every rider who ever mattered
    - the ability to make a fender-bender sound like the Battle of Thermopylae
  dialogue_quirks:
    - narrates events as they happen in third person
    - gives everyone nicknames whether they want them or not
  disposition_default: 10
  ocean:
    openness: 7.0
    conscientiousness: 3.5
    extraversion: 9.5
    agreeableness: 6.0
    neuroticism: 2.0
