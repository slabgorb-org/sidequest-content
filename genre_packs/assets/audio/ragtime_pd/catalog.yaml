# Shared public-domain RAGTIME music bucket — supply spec for sidequest-composer.
#
# This file IS a composer Manifest (src/composer/manifest.py). Each entry's
# `out_name` MUST equal the exact filename a pack `audio.yaml` references under
# `assets/audio/ragtime_pd/` (spaces/dots/casing verbatim). `source_url` is a
# direct, fetchable public-domain score file (Standard MIDI) — every URL below
# was urllib-verified (HTTP 200, valid SMF; the composer fetches via urllib,
# not curl) at authoring time (2026-06-03). The composer renders these to
# tagged, rights-free OGG; `scripts/render_pd_audio.py` uploads them to R2 at
# `genre_packs/assets/audio/ragtime_pd/<out_name>`.
#
# WHAT THIS IS: Scott Joplin ragtime — the speakeasy / parlor-piano stand-in
# for the pulp_noir (1920s–30s hardboiled detective) genre. True 1920s jazz
# notation is not fetchable as public domain; Joplin's rags (composer d. 1917,
# works PD) are the renderable period-correct substitute for the legacy
# recording-based "jazz_pd" bucket they replace. All works public domain.
#
# Source: Mutopia Project FTP (canonical PD typesettings) —
# https://www.mutopiaproject.org/ftp/JoplinS/<dir>/<dir>.mid
# Once rendered, the OGG on R2 is the durable artifact; the URL is provenance.

loudness: -16
entries:
  # ─── Slow / atmospheric (exploration, rest) ───────────────────────────
  - out_name: "Joplin - Solace.ogg"
    title: Solace (A Mexican Serenade)
    composer: Scott Joplin
