# Shared public-domain PARLOR / FRONTIER music bucket — supply spec for sidequest-composer.
#
# This file IS a composer Manifest (src/composer/manifest.py). Each entry's
# `out_name` MUST equal the exact filename a pack `audio.yaml` references under
# `assets/audio/parlor_pd/` (spaces/dots/casing verbatim). `source_url` is a
# direct, fetchable public-domain score file (Standard MIDI) — every URL below
# was urllib-verified (HTTP 200, valid SMF; the composer fetches via urllib,
# not curl) at authoring time (2026-06-03). The composer renders these to
# tagged, rights-free OGG; `scripts/render_pd_audio.py` uploads them to R2 at
# `genre_packs/assets/audio/parlor_pd/<out_name>`.
#
# WHAT THIS IS: 19th-century American parlor song, Civil War-era tune, cowboy
# folk, saloon singalong, and Sousa civic march — the period-correct frontier
# register for the spaghetti_western pack (dust_and_lead Mexican-border world
# + baseline). Stephen Foster (d. 1864) and John Philip Sousa (d. 1932) are
# both long public domain; traditional folk tunes (Home on the Range, Red
# River Valley, Shenandoah, etc.) are anonymous PD. This is the diegetic
# "what a saloon piano or a soldier's fife would actually play" layer that
# sits alongside the ACE-Step Morricone-coded cinematic moods — NOT a
# replacement for them.
#
# Sources:
#   flutetunes.com  — https://www.flutetunes.com/tunes/<slug>.mid  (Foster, Civil War, folk)
#   Mutopia Foster  — https://www.mutopiaproject.org/ftp/FosterSC/<dir>/<dir>.mid
#   Mutopia Sousa   — https://www.mutopiaproject.org/ftp/SousaJP/<dir>/<dir>.mid
# Once rendered, the OGG on R2 is the durable artifact; the URL is provenance.

loudness: -16
