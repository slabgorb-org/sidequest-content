# Shared public-domain music bucket — supply spec for sidequest-composer.
#
# This file IS a composer Manifest (src/composer/manifest.py). Each entry's
# `out_name` MUST equal the exact filename a pack `audio.yaml` references under
# `assets/audio/classical_pd/` (spaces/dots/casing verbatim). `source_url` is a
# direct, fetchable public-domain score file (MIDI/MusicXML) — every URL below
# was curl-verified (HTTP 200, valid Standard MIDI) at authoring time
# (2026-06-02). The composer renders these to tagged, rights-free OGG;
# `scripts/render_pd_audio.py` uploads them to R2 at
# `genre_packs/assets/audio/classical_pd/<out_name>`.
#
# Source preference: Mutopia Project FTP (canonical PD typesettings) where
# available; durable third-party direct-MIDI hosts (mfiles.co.uk,
# classicalmidi.co.uk, bitmidi.com, flutetunes.com) for works Mutopia lacks.
# All underlying WORKS are public domain (every composer here d. >70y ago).
# Once rendered, the OGG on R2 is the durable artifact; the URL is provenance.
#
# COVERAGE: 33 catalogued of the original 47-track demand. (Dukas has since
# been removed from wry_whimsy's audio.yaml, so live `grep` demand is now 46;
# 33 catalogued + 13 still-demanded gaps = 46, + deferred Dukas = the 47.)
# 17 of the 18 tracks `wry_whimsy` (Oz / Wonderland / Gulliver) originally
# demanded are present; only Dukas (below) is deferred — removed from
# wry_whimsy's combat mood too, which still has Danse Macabre. The 14 KNOWN GAPS below have
# no directly-fetchable PD score file. They are intentionally absent:
# `render_pd_audio.py` will fail loud naming any uncatalogued demanded track
# (No Silent Fallbacks) — that error is the signal to source these.
#
#   KNOWN GAPS (need a PD MIDI/MusicXML source_url, then add an entry):
#     Dukas - The Sorcerer's Apprentice  (only a 729B flute-solo stub on urllib hosts; .zip/IMSLP-disclaimer otherwise — also removed from wry_whimsy combat)
#     Chopin - Nocturne Op.15 No.1 in F major        (not on Mutopia/IMSLP-direct)
#     Chopin - Nocturne Op.48 No.1 in C minor         (not on Mutopia/IMSLP-direct)
#     Chopin - Nocturne Op.55 No.2 in E-flat major    (not on Mutopia/IMSLP-direct)
#     Chopin - Nocturne Op.62 No.2 in E major         (not on Mutopia/IMSLP-direct)
#     Chopin - Nocturne B.108 in C minor              (posthumous; no clean PD file)
#     Chopin - Waltz Op.34 No.3 in F major            (no Op.34 on Mutopia)
#     Chopin - Waltz Op.64 No.2 in C-sharp minor      (Mutopia O64 has only No.1)
#     Chopin - Waltz Op.69 No.1 in A-flat major       (Mutopia O69 has only No.2)
#     Chopin - Ballade No.3 Op.47                      (IMSLP PDF/MP3 only)
#     Chopin - Fantasy Op.49 in F minor               (no PD MIDI/XML found)
#     Chopin - Polonaise Op.53 Heroic                 (IMSLP PDF/MP3 only)
#     Strauss - Emperor_Waltz                          (Op.437; only behind .zip/paywall)
#     Strauss - Roses_From_The_South                   (Op.388; IMSLP PDF only)

