name: Wry Whimsy
version: "0.1.0"
description: >-
  The golden-age literary portal fairytale. A sensible traveler from the
  ordinary world crosses a threshold into a Secondary World run on dream-logic,
  populated by talking creatures and impossible authorities, and survives it by
  wit and nerve far more than by force. Episodic, whimsical, with an undertow of
  real menace. One chassis hosts three public-domain worlds across a deliberate
  light-to-savage gradient.
lobby_blurb: "You are the only sensible person in a place that refuses to make sense. Wander it, argue with it, and try to keep your head."
recommended_players:
  min: 2
  max: 5
  sweet_spot: 4
min_sidequest_version: "0.1.0"
refine_hooks: false

inspirations:
  - name: The Wonderful Wizard of Oz (Baum)
    element: Earnest American fairyland, a matriarchy where male power is humbug, menace that enchants rather than kills
  - name: Alice's Adventures in Wonderland (Carroll)
    element: Nonsense logic as antagonist, capricious authority, trials with no rules, growing and shrinking
  - name: Gulliver's Travels (Swift)
    element: The absurd society as antagonist, satire that turns its mirror on the traveler, plotless voyages

era_range: "Storybook / unspecified — each world sets its own"

core_vibe: >-
  You wash up somewhere that runs on rules no one will explain, where the king
  is a fraud and the gardener is painting the roses red, and the only way out is
  through. Keep your wits. Keep your nerve. Try not to become the thing the
  place makes of strangers.

emotional_tone:
  - whimsy with teeth
  - the vertigo of nonsense
  - earnest wonder
  - dry wit under pressure

differentiation: >-
  Not a hero's journey and not a dungeon crawl. The danger is absurd authority
  and dream-logic, resolved on wit and Composure rather than HP — you lose by
  panicking, being condemned, or being transformed, not by hit points reaching
  zero. Each world dials lethality and tone independently across a light-to-savage
  range. The design target is a place, not a plot: every famous location is a
  room you can walk into and every famous character is someone running their own
  business. The narrator renders the source straight and never winks; the seams
  in the world are bait, not walls.

extensions:
  - openings
  - beat_vocabulary
  - archetype_constraints
  - achievements
