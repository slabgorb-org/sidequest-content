# Gulliver — World Openings (Wry Whimsy / gulliver)
#
# Unified Opening schema (the world loader requires triggers.mode coverage:
# >=1 solo-eligible and >=1 MP-eligible; mode is exactly 'solo' or 'multiplayer',
# never 'mp'). These SPECIALIZE the genre's generic crossing into Swift's
# particulars: the wreck of the Antelope, the waking staked to the grass by a
# thousand threads, and the scale-reveal that lands in the very first breath — an
# army of six-inch men swarming the chest with bows drawn.
#
# Doctrine: played DEAD STRAIGHT from Swift — Thomas Morten 1865, never the cute
# children's-book Gulliver, never a wink. The narrator renders the source straight
# and does NOT explain Lilliput or name its politics unprompted. The binding is
# genuinely frightening; the tiny soldiers are formal, ceremonious, and lethal,
# not cartoonish. Each opening sets a SITUATION, not a plot — a man pinned and
# outnumbered, with one question on the table.
#
# CRITICAL: first_turn_invitation contains NO question mark. Every prompt there is
# phrased as a statement. (establishing_narration and tone MAY use '?'.)

version: "0.1.0"
world: gulliver
genre: wry_whimsy

openings:
  - id: wrecked_on_the_shore
    name: "Wrecked on the Shore"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "The Lilliput shore, where you wake staked to the grass among a six-inch people"
    tone:
      register: dazed waking sharpening into helpless alarm, played grave and straight
      avoid_at_all_costs:
        - any wink at the absurdity — the binding and the tiny army are played dead straight
        - the cute children's-book Gulliver — this is Swift and Morten, a man pinned and in real danger
        - explaining how Lilliput works, or naming its court, parties, or politics unprompted
        - making the tiny soldiers cartoonish — they are formal, ceremonious, disciplined, and lethal
        - softening the threat — the needle-arrows genuinely wound, and the threads genuinely hold
        - resolving the scale or the binding in the same breath it is introduced — the situation is the bait
    establishing_narration: >-
      The Antelope struck on a rock in the storm, and of all her company you alone
      came living to land — swimming until your feet found bottom, wading ashore
      through the surf, and falling, spent past all strength, upon a soft short
      grass where you slept the dead sleep of a drowned man spared. You wake to a
      hot sun and the discovery that you cannot move. Not your arms, not your legs,
      not your head; even your long hair has been fastened down. Straining a little,
      you feel the truth of it: you are bound to the ground by a multitude of slender
      threads and ranks of little pegs, lashed flat from your armpits to your thighs,
      and across your chest — you can just see it, squinting down the length of
      yourself — something alive is moving. A great many somethings. They are men.
      They are not six inches high. One of them, bolder than the rest, comes forward
      almost to your chin with a tiny bow drawn, and a hundred behind him level theirs
      at your face, and a voice no louder than a cricket's cries out an order in a
      tongue you have never heard. You are a mountain washed up among a nation the
      size of your hand, and you are their prisoner before you have learned their name.
    first_turn_invitation: >-
      The threads bite into your skin and the little stakes hold firm; with one heave
      you could likely tear an arm free, and a hundred needle-arrows are aimed at your
      eyes against exactly that. The bold officer at your chin waits, his bow drawn,
      for some sign of what manner of creature he has caught. Tell me what the
      Man-Mountain does — whether you lie still and let them judge you tame, or strain
      against the threads and learn at once how well they hold, or try, with the few
      sounds and gestures a pinned giant has, to answer the cricket-voice that has
      just given an order over your heart.

  - id: the_crew_washed_ashore
    name: "The Crew Washed Ashore"
    triggers:
      mode: multiplayer
      backgrounds: []
    setting:
      location_label: "The Lilliput shore, where several wreck-survivors wake bound together among the tiny soldiers"
    tone:
      register: shared dazed waking and helpless alarm, companions pinned within earshot of each other
      avoid_at_all_costs:
        - any wink — the binding and the six-inch army are sincere and genuinely frightening
        - the cute children's-book Gulliver — this is Swift and Morten, grown survivors in real danger
        - one survivor explaining Lilliput to the others — none of you has ever been here
        - naming the court, parties, or politics of Lilliput before anyone has cause to learn them
        - making the tiny soldiers cartoonish — they are formal, ceremonious, disciplined, and lethal
        - separating you so far you cannot speak — you wake within earshot, pinned in a row on the same shore
    establishing_narration: >-
      The Antelope struck on a rock in the storm, and more than one of you came
      living to land — flung from the same swamped longboat, washed up along the same
      stretch of soft short grass, where you fell and slept the dead sleep of drowned
      men spared. You wake, each of you, to a hot sun and the same impossible
      discovery: you cannot move. Arms, legs, even your hair are fastened to the
      ground by a multitude of slender threads and ranks of little pegs, and when you
      turn your eyes — the only thing left free to turn — you find your companions
      pinned in a row along the shore beside you, near enough to call to, far too far
      to reach. And across each of your chests something alive is moving, a great
      many somethings, and they are men no taller than your hand. Ranks of them stand
      upon you with bows drawn; an officer no louder than a cricket cries an order in
      an unknown tongue; and a single arrow loosed at the nearest of you, when one of
      you strains, draws a bead of real blood. You are mountains washed up among a
      nation the size of a fist, bound and surrounded, and being judged this very
      moment for what you are.
    first_turn_invitation: >-
      The threads hold every one of you fast, and the ranks of tiny archers shift
      their aim from face to face as you stir, ready to loose at the first that pulls
      hard. You can speak to one another across the grass, though every word carries
      to the little officers too. The bold one at the foremost chin waits for some
      sign of what manner of creatures his soldiers have netted. Tell me what your
      band does — whether you go still together and let them take your measure, or
      one of you tests the threads and draws their volley, or you try to answer the
      cricket-voiced command with the few sounds and slow gestures that pinned giants
      can manage, and whether you face this as one or each in your own way.
