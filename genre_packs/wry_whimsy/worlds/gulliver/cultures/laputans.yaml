name: Laputans and Balnibarbians
summary: The abstracted intellectuals of the flying island of Laputa and the ruined experimental country of Balnibarbi beneath it — a people so lost in mathematics and music they must be flapped into hearing, whose projectors strain to draw sunbeams from cucumbers, and whose neighbours suffer the dead, the floor-licking court, and the immortal Struldbruggs
description: >-
  The Laputans are the inhabitants of the flying island of Laputa and the wide
  ruined country it sails over, Balnibarbi — a satire on reason cut loose from sense.
  The lords of the floating island are so wholly absorbed in mathematics and music
  that they cannot attend to a word said to them, and keep servants — the flappers,
  or climenoles — who strike them gently on the mouth and ear with a flap when they
  are to speak or listen; their heads tilt, one eye turned inward, one to the zenith;
  their food is cut into the shapes of theorems. The island itself is a weapon: it
  hangs in the air over Balnibarbi and, when a city below rebels, descends to
  smother it from the sun or crush it outright — as it tried with the rebel city of
  Lindalino. Below, the great Academy of Lagado is full of male projectors who have
  spent eight years extracting sunbeams from cucumbers, softening marble for pillows,
  building houses from the roof down, ploughing with buried acorns and hogs — while
  the one sane lord, Munodi, keeps the old methods and is despised for his full barns.
  Beyond lie stranger islands: Glubbdubdrib, where the governor summons the dead to
  serve at dinner and the traveler interviews the ancient kings and senates and
  learns how history lies; and Luggnagg, where courtiers crawl and lick the floor
  before the throne, and where the immortal Struldbruggs — born by chance with a
  red spot on the brow, never to die — are not the envied gift one imagines but a
  curse of endless decay, witless and miserable and reviled. A Laputan or Balnibarbian
  is named by the project that consumes him or the coinage that contains him; the
  satire is the vanity of male intellect that builds nothing it can eat.
  (Canon: Laputa, Lagado, Balnibarbi, Glubbdubdrib, Luggnagg; Maldonada; the rebel
  city Lindalino; Munodi the sane lord; the climenole flappers; the Struldbruggs.)
