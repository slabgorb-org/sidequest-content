name: Georgian British
summary: The ordinary Britons of 1726 — seafarers, tradesfolk, and townspeople of early-Georgian England, Wales, and Scotland, who put out from a real harbour on a real ship and wash up, again and again, as the lone sensible stranger on an impossible shore
description: >-
  The Georgian British are not a people of the voyage-country at all — they are the
  player's own kind, the ordinary Britons of 1726, the year Jonathan Swift set his
  Travels before the world. Lemuel Gulliver, ship's surgeon of Nottinghamshire, is
  the model: a plain, sensible, middling Englishman of the reign of George I, bred up
  at Emanuel College, apprenticed to a surgeon, married to Mary Burton the hosier's
  daughter, and forever putting back out to sea from Redriff when the practice fails.
  These are the people of the harbour and the counting-house, the coffee-house and the
  dockyard, the parish and the almshouse: ships' surgeons and naval clerks, coffee-house
  pamphleteers and merchants' factors, midshipmen and sailmakers, parsons and fishwives,
  coopers and apothecaries, maidservants and drapers. They bear plain Christian names
  out of the parish register — Lemuel, Samuel, Thomas, Nathaniel, Josiah; Mary, Anne,
  Bridget — and honest English, Welsh, and Scots surnames. They dress in the sober stuff
  of the early eighteenth century: the tricorne hat and frock coat, the knee-breeches and
  buckled shoes, the mob cap and stomacher and apron. The whole satire turns on their very
  ordinariness — they are us, the reasonable European, set down whole and small among
  giants, among the six-inch, among rational horses, and made to answer for the laws,
  wars, parties, and religion they carried from home. A Georgian Briton is named by the
  parish font and dressed in plain Hanoverian cloth, and that plainness is the lens through
  which every impossible country is judged. (Model: Lemuel Gulliver, ship's surgeon of
  Redriff; Mary Burton his wife; the home parish of Redriff and the port of Bristol; the
  reign of George I; the year of publication, 1726.)
