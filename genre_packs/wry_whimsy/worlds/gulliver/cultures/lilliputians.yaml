name: Lilliputians
summary: The six-inch people of Lilliput and rival Blefuscu — a court of toy magnitude that styles its tiny doings in the grandest possible titles, and kills over the height of a heel and the right end of an egg
description: >-
  The Lilliputians are the six-inch people of Lilliput and its rival empire across
  the channel, Blefuscu — a whole court of human pageantry scaled down to the size
  of a doll's-house and not one degree less grave for it. They name their tiny
  business in the largest words a tongue can hold: their Emperor is "Most Mighty
  Emperor of Lilliput, Delight and Terror of the Universe," taller than the sons of
  men by the breadth of a fingernail and absolute over a kingdom you could step
  across; their highest honour is Nardac, their grandees Hurgoes, and the visiting
  giant is gravely titled Quinbus Flestrin, the Great Man-Mountain, and bound to
  the ground with thread. Their politics are savage in exact proportion to their
  size. The whole state is split between two parties told apart only by the height
  of their shoe-heels — the Tramecksan (High-Heel) and the Slamecksan (Low-Heel) —
  who will not so much as eat together; and they have waged a long bloody holy war
  against Blefuscu over which end of an egg a man ought to crack, the Big-Endians
  exiled or martyred, the Little-Endians triumphant. The jealous Treasurer Flimnap
  ruins men out of spite; the Admiral Skyresh Bolgolam hates without cause; only
  the mild minister Reldresal speaks for mercy, and cannot make it carry. A
  Lilliputian is named by a Swiftian court-coinage and dressed in a title three
  sizes too large — the satire is that the pettiness is exactly ours, only small
  enough to see whole. (Canon: Flimnap, Skyresh Bolgolam, Reldresal; Quinbus
  Flestrin; the Tramecksan and Slamecksan; the Big-Endian schism; the capital
  Mildendo and the palace Belfaborac; the rival empire of Blefuscu.)
