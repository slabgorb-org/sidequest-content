name: Houyhnhnms and Yahoos
summary: Two peoples sharing one land — the Houyhnhnms, rational horses who are "the perfection of nature" and have no word for lying, and the Yahoos, the filthy brute-humans they govern as cattle, who have no names at all because they have nothing in them worth naming; between them the traveler learns the savage truth about his own kind
description: >-
  This land holds two peoples, and the savage core of the fourth voyage is the gulf
  between them. The Houyhnhnms are horses, and they are governed wholly by reason —
  so wholly that their language has no word for lying, and the nearest they can come
  to a falsehood is the long phrase "the thing which is not," which they can barely
  conceive a creature would do. They are temperate, clean, benevolent without
  passion, and entirely cold; they hold a Grand Assembly that debates, in the same
  even tone one might use about a harvest, whether the Yahoos ought to be
  exterminated and whether the traveler — a Yahoo who can talk and reason a little —
  ought to be expelled. Their name means "the perfection of nature," and they say it
  of themselves without vanity, because to them it is simply true. The traveler's
  master is one such; the Sorrel Nag, a servant, grows fond of him; the Grey Steed
  sits in the Assembly. The Yahoos are the other people: human in shape, naked,
  filthy, malicious, lustful, greedy, climbing trees to fling their dung — and the
  unbearable revelation of the voyage is that they are us, that the traveler is taken
  for one on sight and is one, that everything the Houyhnhnms despise in the Yahoo he
  recognizes in his own civilization's wars and law and avarice. The Yahoos have no
  proper names, none, and that is deliberate: there is nothing in a Yahoo worth
  distinguishing one from the next, so they are known only by what they do — the
  filthy, the clambering, the flinging, the lustful. To name them would be to grant
  them more than they are. A Houyhnhnm is named by a whinny-coinage or by the colour
  and breed of his coat — the Sorrel Nag, the Grey Steed, the Dapple-Grey, the Bay —
  and a Yahoo is named by his vice. The traveler will leave loving the horses and
  unable to bear the smell of his own wife.
  (Canon: Houyhnhnm, "the perfection of nature," and the phrase "the thing which is
  not"; the Sorrel Nag, the Grey Steed; the Yahoos, named only by behaviour.)
