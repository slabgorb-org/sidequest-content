name: Brobdingnagians
summary: The giants of Brobdingnag — sixty-foot people of a vast, well-governed country, named not by coinage but by scale and station, who keep the traveler as a curiosity and weigh his civilization in the King's plain balance and find it vermin
description: >-
  The Brobdingnagians are the giants of Brobdingnag, a vast continent of a country
  where the grass stands like a forest and a wheat-stalk is a tree, and where the
  traveler is no longer the Man-Mountain but a mannikin — Grildrig — small enough to
  be carried in a box, menaced by a house-cat the size of an ox, by rats the size of
  mastiffs, by wasps the size of partridges. Swift gives this people almost no proper
  names, and that is the point: a giant is known by his scale and his station — the
  farmer who finds the traveler in his corn and shows him for money at fairs until he
  near drops dead of it; the farmer's daughter, the kind little nurse Glumdalclitch,
  forty foot of tenderness; the Queen who buys him for her cabinet of pleasures; the
  malicious court-dwarf who resents losing his place as the smallest thing at court;
  the Maids of Honour who handle him without shame. Above them all the King, who
  hears the traveler's proud account of the laws, wars, parties, and religion of
  Europe, weighs it in a plain and unhurried balance, and pronounces the savage
  verdict at the heart of the second voyage — that the bulk of his countrymen are
  "the most pernicious race of little odious vermin that nature ever suffered to crawl
  upon the surface of the earth." The horror here is not caprice; it is the giant's
  calm, accurate eye, and a body magnified until its pores and lice and cancers are a
  landscape. A Brobdingnagian is named by what he is and where he stands — the King,
  the Queen, the farmer, the dwarf, the nurse — beside the three coinages Swift troubled
  to invent. (Canon: the capital Lorbrulgrud, "Pride of the Universe"; Grildrig, the
  name they give the traveler; Glumdalclitch, the little nurse; the King who judges
  Europe; the town of Flanflasnic.)
