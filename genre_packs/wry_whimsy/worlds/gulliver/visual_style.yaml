# Renderer: Z-Image Turbo. There is NO negative_prompt — Z-Image runs at
# guidance_scale=0 and ignores it (see PROMPTING_Z_IMAGE.md). Every "not X"
# constraint is phrased as POSITIVE exclusion text inside positive_suffix.
#
# THE LOOK: Thomas Morten's 1865 wood-engraved plates for the Cassell's
# illustrated "Gulliver's Travels" — dense cross-hatched Victorian
# wood-engraving line, confident black ink linework of varying weight, dramatic
# realist-fantastical compositions with SCALE-DRAMATIC framing (the giant among
# the tiny in Lilliput; the tiny man among giants in Brobdingnag). Engraving is
# black line: restrained or no tint, on a warm cream period-paper ground. This
# is the SAVAGE-pole sibling of Tenniel (Wonderland) and Denslow (Oz) — the
# third world's matched-set period engraving.
#
# COSTUME SUBTLETY: Gulliver is an early-Georgian ship's surgeon, c. 1700 —
# tricorn hat, frock coat, knee-breeches, buckled shoes — rendered in Morten's
# 1865 engraving TECHNIQUE. This is encoded POSITIVELY below by pushing toward
# the engraved-ink plate and the period dress, and away from Victorian costume,
# the cute children's-picture-book Gulliver, modern cartoon, and photograph —
# phrased as the engraved alternative, never as a negation (Z-Image ignores
# negations). Adult content (Maids of Honour, Yahoo filth, Struldbrugg decay)
# is handled with the restraint of a period anatomical engraving, never crude.
# =============================================================================

positive_suffix: >-
  a finely detailed wood-engraved plate in the style of Thomas Morten from the
  1865 Cassell's illustrated edition of Gulliver's Travels — confident black
  pen-and-ink linework of varying weight defining the forms, the interior dense
  with cross-hatching, hatching, and stippling that model texture, shadow, and
  depth, over a warm cream period-paper ground. A dramatic realist-fantastical
  composition with strong scale contrast between the great and the small. Tint
  restrained to almost none, the strong black engraved line carrying the image.
  Gulliver shown as an early-Georgian ship's surgeon of about 1700 — tricorn
  hat, long frock coat, knee-breeches, buckled shoes. An 1865 engraved-ink
  storybook plate with the period Georgian dress and dense cross-hatching
  throughout — not Victorian costume, not a children's picture-book cartoon,
  not a photograph, not a 3D render. No text, lettering, signature, or watermark.

