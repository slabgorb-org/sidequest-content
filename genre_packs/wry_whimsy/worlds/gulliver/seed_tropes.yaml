# Seed tropes for wry_whimsy/gulliver — world-tier deck (Epic 94: genre is the
# rulebook only; flavor lives in the world). Short-arc narrative hooks dealt at
# session start and on engagement draws, expiring after lifespan_turns and
# lingering as ghosts for later callback (ADR-018, ADR-128). Seeds are baited
# hooks (ADR-014 diamonds-and-coal) — deliberately vague; the narrator threads
# an engaged seed into whatever the voyage demands of the traveler.
#
# These supersede the genre-tier wry_whimsy/seed_tropes.yaml deck for gulliver:
# the engine reads world-first (websocket_session_handler `_seed_source =
# worlds.get(slug) or pack`), so without this file gulliver drew from an empty
# deck and the lull-escalation engine declined on every lull — which left the
# narrator inventing crowds of NPCs to fill quiet scenes (playtest 2026-06-13,
# oz had the identical gap).
#
# Pitched to Swift specifically (Gulliver's Travels 1726, public-domain): the
# Man-Mountain staked by threads, the Big-/Little-Endian and High-/Low-Heel war,
# office won by rope-dancing, the articles of impeachment, the pet Grildrig
# displayed for coin, the King's "little odious vermin" verdict, the Academy of
# Lagado extracting sunbeams from cucumbers, the descending island of Laputa,
# the Struldbrugs who only rot, the summoned dead of Glubbdubdrib, and the
# Houyhnhnms among whom the traveler is the Yahoo. Register is MORTEN's savage
# wood-engravings, never the cute children's Gulliver: every society is
# internally, relentlessly LOGICAL, and that is the horror, not their madness.
# This is the savage end of the pack's gradient — sentences are real and not
# commuted, violence only confirms the traveler is the brute the satire names,
# and the verdict on him and his civilization is mostly correct. Keep the
# politics male and savage; let the women be fond and powerless to save him.
#
# Faction/zone eligibility (epic-157, ADR-059 amendment): each seed carries a
# `factions:` list so the Seam-4 seed-deck draw (game/seed_deck.py,
# game/seed_tick.py) never deals a Houyhnhnm seed on the Lilliput shore. Values
# are exact cartography `controlled_by` slugs (the sentinel "*" = world-global;
# no seed here is world-global — every hook is voyage-anchored). The one
# scale-as-politics seed spans both scale voyages (Lilliput + Brobdingnag).

- id: gulliver_man_mountain
  name: Your Size Is a Political Fact Before It Is Anything Else
  factions: [the_lilliput_court, the_brobdingnag_crown]   # Voyages 1 & 2 — the giant staked / the speck a cat could kill
  description: >-
    The traveler wakes staked to the ground by a hundred slender threads, hair
    pegged down, swarmed by an army of six-inch men with bows drawn — or looms
    over a court as a useful colossus, or shrinks to a curiosity a cat could
    kill. Whatever the scale, it is read at once as power: an asset to be
    harnessed, a threat to be bound, a strategic problem the court must solve
    before the traveler has spoken a word.
  flavor_tags: [authority, politics, peril, traveler]
  lifespan_turns: 6
  delivery_hints:
    - The first negotiation is over the traveler's body — how to feed it, restrain it, point it at a rival kingdom
    - Ministers calculate the traveler as a weapon or a famine; gratitude and fear arrive in the same breath
    - The threads that bind are slight enough to snap, and everyone, including the traveler, knows the restraint is a courtesy that can be withdrawn
  narrative_hint: >-
    Scale here is leverage, not wonder. Let the players feel themselves
    weighed as an instrument of state, and let every kindness carry the
    unspoken clause that an instrument which will not serve is broken up.

- id: gulliver_endian_war
  name: A Total War Over a Trifle Nobody Will Call a Trifle
  factions: [the_lilliput_court]   # Voyage 1 — the egg-end / heel-height war of Lilliput
  description: >-
    Two factions are locked in generations of bloodshed over a question of no
    consequence whatever — which end of an egg to break, the height of a heel,
    a syllable in a prayer — and they hold it the gravest matter in the world.
    Thousands have died. Exiles plot. And the traveler, newly arrived, is
    pressed to declare a side, because here there is no neutral ground on the
    only question that does not matter.
  flavor_tags: [politics, authority, satire, traveler]
  lifespan_turns: 6
  delivery_hints:
    - The doctrine is explained with passion and scripture and a long list of martyrs, and the party cannot find the point of it
    - Refusing to choose is itself read as a choice, and the more dangerous one; both sides court the traveler as a deciding weight
    - A sober official privately admits the absurdity and will still go to the scaffold for his end of the egg
  narrative_hint: >-
    The satire is the verdict: this is every holy war, drawn to scale. Don't let
    the players resolve it with reason, which both sides have weaponized. Let
    their forced allegiance bind them to a faction's fortunes and make an enemy
    of half a kingdom over nothing.

- id: gulliver_office_by_rope_dance
  name: High Office Awarded for an Absurd Performance
  factions: [the_lilliput_court]   # Voyage 1 — rope-dancing for office at the Lilliput court
  description: >-
    Rank, favour, and the great offices of state are won here not by merit but
    by feats of ridiculous skill — dancing on a tightrope before the sovereign,
    leaping over or creeping under a stick to earn a coloured thread to wear.
    The ablest courtiers are the best acrobats; the gravest minister got his
    seal by the highest caper. The traveler, to be tolerated at all, must
    perform.
  flavor_tags: [authority, satire, trial, absurdity]
  lifespan_turns: 5
  delivery_hints:
    - A minister demonstrates his qualification — a leap, a dance — with deadly seriousness and expects admiration
    - The party is invited to caper for favour; declining is taken as either insult or incapacity, both costly
    - Dancers occasionally fall and break themselves, and this is regarded as the ordinary risk of statesmanship
  narrative_hint: >-
    The performance is the political confrontation. Let the players debase
    themselves for standing, or refuse and find every door shut to those who
    will not dance — and let a rival's fall from the rope be a vacancy and an
    opportunity with blood under it.

- id: gulliver_articles_of_impeachment
  name: The Service They Praised Becomes the Charge That Damns You
  factions: [the_lilliput_court]   # Voyage 1 — the palace-fire service turned to articles of impeachment
  description: >-
    The traveler does the state a great service — wins its war, quenches a fire
    in its palace — and is fêted for it. Then the very deed is drawn up as a
    crime by the same men who cheered: the method was improper, the manner an
    affront, the success itself an insolence. Articles of impeachment are read.
    The sentence — blinding, slow starvation — is offered as the court's
    tender mercy, the lesser punishment, and it is entirely real.
  flavor_tags: [trial, authority, peril, reversal]
  lifespan_turns: 5
  delivery_hints:
    - The courtiers who praised the deed loudest are first to sign the indictment, and see no contradiction in it
    - The favour shown earlier is itself entered as evidence of the traveler's dangerous over-reach
    - The merciful sentence is described in clinical, reasonable detail; flight is the only answer and it makes the party a fugitive
  narrative_hint: >-
    Ingratitude here is not a flaw in the system; it is the system, logical and
    cold. Let the players taste the favour before the turn, and let the sentence
    be one they cannot argue down — only outrun — so that escape costs them the
    place itself.

- id: gulliver_the_pet_named_grildrig
  name: Reduced to a Curiosity, Owned and Displayed for Coin
  factions: [the_brobdingnag_crown]   # Voyage 2 — Grildrig the pet, displayed for coin in Brobdingnag
  description: >-
    The traveler becomes a marvel the wrong way — small, helpless, charming —
    and is taken up not as a guest but as property: named like a lapdog,
    handled by children, set on a table to perform tricks, hired out to gaping
    crowds for money the traveler will never see. The ordinary world turns
    monstrous at this scale — a house-cat, a curious monkey, a hailstone, a
    reaper's scythe each become death.
  flavor_tags: [peril, authority, traveler, scale]
  lifespan_turns: 6
  delivery_hints:
    - The traveler is fond of a keeper who is genuinely fond back and still rents them out until exhaustion shows
    - A perfectly domestic thing — a wasp, a spaniel, a toddler's grip — arrives as a lethal event
    - Affection and ownership are not in tension here; the kindest hands are still the ones that hold the leash
  narrative_hint: >-
    The horror is tenderness that is also possession. Let the players be cared
    for and unfree at once, let the everyday turn deadly by scale, and let the
    way out cost them the one keeper who loved them as a pet.

- id: gulliver_the_reasonable_verdict
  name: A Ruler Examines Your Homeland and Finds It Vile — and Is Right
  factions: [the_brobdingnag_crown]   # Voyage 2 — the Brobdingnag King's "little odious vermin" verdict
  description: >-
    A patient, decent sovereign questions the traveler at length about the
    customs of home — its wars, its laws, its money, its medicine, its great
    men — and listens without heat. Then, gently, on the evidence the traveler
    themselves supplied, pronounces the traveler's whole race the most
    pernicious little odious vermin ever suffered to crawl upon the earth. The
    verdict is calm. The horror is that it is mostly deserved.
  flavor_tags: [satire, authority, reversal, trial]
  lifespan_turns: 6
  delivery_hints:
    - The questions are mild and exact, and each honest answer digs the grave a little deeper
    - The ruler takes no pleasure in the conclusion; it is arrived at the way a sum is, and is offered almost with regret
    - Every defence the traveler mounts of home supplies fresh proof against it
  narrative_hint: >-
    This is the savage core — the world's logic turned on the player's own
    civilization, and winning. Don't let the players argue it away; the more
    eloquently they defend home, the more they convict it. Let the verdict
    lodge, and let what they do carrying it become the real question.

- id: gulliver_sunbeams_from_cucumbers
  name: A Great Institution Earnestly Pursuing Useless Things
  factions: [the_lagado_academy]   # Voyage 3 — the Grand Academy of Lagado
  description: >-
    A famous academy, funded and revered, devotes itself to projects of
    magnificent futility — extracting sunbeams from cucumbers to bottle against
    cold summers, softening marble into pillows, building houses downward from
    the roof, restoring the soil by burying the harvest. The projectors are
    learned, sincere, and ruinous; the country starves around them in rags
    while honouring the work. The traveler is shown round as a distinguished
    guest.
  flavor_tags: [satire, absurdity, local-custom, traveler]
  lifespan_turns: 5
  delivery_hints:
    - Each projector explains a years-long labour with total conviction and asks for the traveler's admiration and a small donation
    - The fields outside the academy walls are barren and the people gaunt, and no one connects this to the work within
    - One abandoned project was nearly sensible and was dropped precisely because it threatened to be useful
  narrative_hint: >-
    The satire skewers progress worshipped for its own sake. Let the players be
    courted as patrons and witnesses, let a project's failure land on someone
    real and poor, and let the one almost-sane idea be a thread the party could
    rescue — at the cost of the academy's favour.

- id: gulliver_the_island_that_descends
  name: An Aloof Power That Rules by Lowering Its Weight Upon You
  factions: [the_lagado_academy]   # Voyage 3 — Laputa, the descending flying island
  description: >-
    Far overhead floats an abstracted authority — rapt in mathematics and music,
    its lords so lost in speculation they must be roused by attendants who flap
    their mouths and ears to make them attend — and it governs the land beneath
    by simple gravity: a town that rebels finds the island drifting above it,
    blotting the sun, threatening to settle and crush. Rule here is distance and
    the menace of descending weight.
  flavor_tags: [authority, politics, peril, satire]
  lifespan_turns: 6
  delivery_hints:
    - The rulers cannot attend to a plain question without a servant to rouse them, and find the traveler's concerns beneath notice
    - The shadow of the island passing over is itself the threat; petitions are answered by how low it deigns to hover
    - The people below have learned a trick that keeps the island from settling fully, and guard it as their only leverage
  narrative_hint: >-
    The image is government by lofty indifference and brute force married
    together. Let the players deal with rulers who literally will not look down,
    side with the ground that bears the weight, and weigh whether the people's
    secret leverage is worth the sun being blotted out in reprisal.

- id: gulliver_immortals_who_only_rot
  name: A Wish for Deathlessness, Granted in the Worst Way
  factions: [the_lagado_academy]   # Voyage 3 — the Struldbruggs of Luggnagg
  description: >-
    The traveler hears of people born now and then who never die, and leaps to
    envy them — imagining the wisdom, the wealth, the works of an endless life.
    Then he meets them: deathless but not ageless, the oldest mere relics of
    decay, toothless, friendless, mad with boredom and spite, the law long since
    stripping them of property at the age they should have died. They cannot
    even die to escape it. They are the most miserable creatures in the world.
  flavor_tags: [bargain, reversal, uncanny, wonder]
  lifespan_turns: 7
  delivery_hints:
    - The traveler's delighted assumptions about immortality are heard out and then dismantled one by one by people who know
    - The deathless ones are shunned by their own kin and stripped of estate and office at a fixed age, then left to outlast everything they loved
    - What looked like the greatest fortune is plainly the cruelest curse, and the locals are weary of explaining why
  narrative_hint: >-
    A monkey's-paw seed (SOUL: the wish granted literally and ruinously). Let
    the players covet the deathless thing before they see it, let the seeing
    curdle the want, and if any boon in play smells like this one, let it grant
    exactly what was asked for and nothing they actually meant.

- id: gulliver_the_summoned_dead
  name: The Past Called Up to Testify, and It Exposes the Record as a Lie
  factions: [the_lagado_academy]   # Voyage 3 — the summoned dead of Glubbdubdrib
  description: >-
    In this place the dead can be summoned to answer questions, and the
    traveler, calling up the great names of history, learns that the record is
    flattery and fraud: the famous conqueror a butcher, the celebrated patriot a
    bribe-taker, the revered philosopher a fool misquoted for centuries, whole
    pages of received history invented to please a prince. The honest dead are
    obscure; the celebrated ones are appalled at what they have been made to
    mean.
  flavor_tags: [reversal, satire, wonder, riddle]
  lifespan_turns: 6
  delivery_hints:
    - A hero of the party's own learning, summoned, turns out to be nothing the books described and says so plainly
    - The truly admirable dead are people history never bothered to name; the named are mostly frauds
    - A living authority nearby has staked everything on one of the comfortable lies and will not want it disturbed
  narrative_hint: >-
    The satire here is on history-as-propaganda. Let the players pull a thread
    of received truth and have it come apart in their hands, and let the
    disproof put them at odds with someone powerful who needs the lie standing.

- id: gulliver_taken_for_the_yahoo
  name: Among Creatures of Pure Reason, You Are the Brute You Resemble
  factions: [the_houyhnhnm_assembly]   # Voyage 4 — taken for a Yahoo among the Houyhnhnms
  description: >-
    The traveler comes among beings of calm, complete rationality — who have no
    word for lying because they have never needed one — and is classed at once
    with the filthy, howling, grasping animals he physically resembles. Every
    attempt to prove himself their equal in reason only demonstrates the cunning
    that makes him, in their eyes, the worse beast. The grave assembly debates,
    reasonably, whether his kind should simply be exterminated.
  flavor_tags: [satire, authority, peril, reversal]
  lifespan_turns: 7
  delivery_hints:
    - The traveler's clothes, speech, and manners are studied as the clever tricks of a dangerous animal, not the marks of a person
    - His defence of himself and his species is heard with cold attention and entered as further evidence against both
    - The kindest of these beings regards the traveler with pity, as one might a gifted and incurable animal, and still votes on the question of his removal
  narrative_hint: >-
    The savage heart of the voyage: the world's reason judges the player a
    monster, and is not entirely wrong. Don't let eloquence redeem it — eloquence
    is the cunning they fear. Let the players sit inside the verdict, and let the
    only road home be one that leaves them unable to bear their own kind again.
