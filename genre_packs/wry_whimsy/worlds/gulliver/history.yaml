# Gulliver — World History (Wry Whimsy / gulliver)
#
# The PAST of the four voyage-societies, not a campaign arc: what the four lands
# are, how they came to be the way they are, why men kill over the end of an egg,
# why immortals are pitied and a flying island hangs over a ruined country, and
# why a rational horse takes a human for a brute. Played dead straight from
# Jonathan Swift's Gulliver's Travels (1726), all four voyages treated as ONE
# savage voyage-country joined only by the sea — Thomas Morten's 1865 wood-
# engravings, never the cute children's-book Gulliver, never a wink, never
# explaining the joke. Story-Now framing: these are hooks, anchored facts, and
# named figures, not session gates or a fixed resolution.
#
# `chapters:` here are the four societies' own "histories" — the way each absurd
# land earnestly accounts for itself, told without irony, because to each of them
# its own logic is self-evident and the TRAVELER is the strange one. Each chapter
# carries `tropes:` instance-refs it seeds — every id resolves against the world
# tropes.yaml set (nine Gulliver tropes) ∪ the genre tropes.yaml set. These are
# seeded LATENT (status: dormant, progression: 0.0); nothing here triggers or
# resolves them. The savage doctrine: every society judges the traveler and his
# civilization, the verdict is largely RIGHT, the sentences are real and are not
# commuted, and the way home is always open — and that is the horror.

chapters:

  # ── CHAPTER 1 — THE FOUR VOYAGES ───────────────────────────────────────────
  - id: the_four_voyages
    label: "The Four Voyages — Four Absurd Lands and the Sea That Joins Them"
    era: "the voyages as a sensible ship's-surgeon keeps sailing into them, c. 1699–1715"
    atmosphere: >-
      There is no continent here and no kingdom to inherit; there are four
      separate lands that share nothing but the ocean around them and the man who
      keeps washing ashore on each in turn. A ship's-surgeon of Redriff, sober and
      observant and proud of his civilization, is wrecked or set adrift or marooned,
      and comes to his senses on a strange coast — bound flat by a six-inch nation,
      or crouching among corn-stalks tall as trees, or stepping onto a court that
      hangs in the air, or sorted on sight into a herd of filthy brutes. Each
      voyage is a whole self-contained reckoning: survive the absurd society, find
      that it has been judging you all along, and take the real boat home that is
      always, somehow, there. And then the surgeon does the one thing no sensible
      man should do: he goes back to sea. Four times he comes home and four times
      he embarks again, and the satire he set out to catalogue turns, every time,
      and catalogues him. The traveler arrives believing he is the reasonable man
      among the absurd; the country's whole work is to show him, calmly and
      correctly, that he is the monster, and that he agreed to come.
    established_facts:
      - "Gulliver is not one land but four — Lilliput, Brobdingnag, Laputa and the lands below it, and the country of the Houyhnhnms — with no walking-road between them; only the sea joins them."
      - "Each voyage is the same shape: wreck or marooning, survive the absurd society, discover it has been judging you, and take the real escape home that is always available."
      - "The traveler is a sensible early-Georgian ship's-surgeon of Redriff who measures, documents, and is proud of his country — and is the thing each society turns its instrument upon."
      - "The compulsion that drives the whole country is that the surgeon keeps going back to sea: four homecomings, four re-embarkations, and he never learns."
      - "The satire is savage and the verdict on the traveler is largely right; this is the horror, not caprice or humbug but a judgment that is accurate."
    hooks:
      - "Every land the traveler reaches is reachable again only by the sea, and the sea always offers one more voyage to a man who should stay home."
      - "The traveler who treats a strange society as a foreign curiosity to be catalogued is being catalogued in turn — the instrument is always about to be reversed."
      - "There is a real boat home at the end of every voyage; the only question the country ever truly asks is whether the traveler will stay on the road home or set sail again."
    tropes:
      - id: the_compulsion_to_reembark
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the savage go-home spine, established here as the standing shape of the whole voyage-country: the way home is always open, and the traveler keeps choosing the sea."
      - id: the_satire_turns_on_you
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the central engine, established as the standing condition of all four voyages: each society quietly turns its instrument on the traveler, and the mirror shows a thing that is real."

  # ── CHAPTER 2 — THE SAVAGE COURTS ──────────────────────────────────────────
  - id: the_savage_courts
    label: "The Savage Courts — The Egg-War, the Judging King, and the Weapon of Scale"
    era: "the courts of the first two voyages as they stand"
    atmosphere: >-
      The politics of these lands is male and savage, and it makes the traveler a
      thing before it makes him a man. In Lilliput the court of the Emperor —
      Delight and Terror of the Universe, six inches tall and contrived to stand a
      nail's breadth above the rest — runs on a quarrel about breakfast: the High-
      Heels and the Low-Heels, the Tramecksan and the Slamecksan, who will not eat
      at one table; and the holy war with the rival empire of Blefuscu over which
      end of an egg a man may crack, in which eleven thousand have chosen death
      rather than submit. Into this the giant falls, and the jealous Treasurer
      Flimnap and the hostile Admiral Skyresh Bolgolam weaponize the quarrel
      against him, drawing up articles of impeachment that mean blinding and slow
      starvation — and the Emperor calls the blinding mercy. In Brobdingnag the
      reckoning reverses: the traveler is the speck, the pet, the curiosity bought
      by the Queen and tormented by her dwarf, and the wise King hears his proud
      account of Europe and pronounces the whole species the most pernicious race
      of little odious vermin that ever crawled upon the earth. Scale makes the
      traveler a weapon, a pet, a freak — and the court, whichever court, judges
      him for it. The one decent minister, Reldresal, cannot save him; the fond
      Queen cannot free him; the women are kind and powerless, and the men rule.
    established_facts:
      - "Lilliput is governed by the Emperor, styled Delight and Terror of the Universe, who stands a nail's breadth above his court by contrivance and would make the Man-Mountain his weapon against Blefuscu."
      - "The Lilliput court is split into the High-Heels (Tramecksan) and Low-Heels (Slamecksan), and warring with Blefuscu over the Big-Endian heresy — which end of an egg to crack — over which eleven thousand have died."
      - "The Treasurer Flimnap and the Admiral Skyresh Bolgolam draw up the articles of impeachment against the Man-Mountain; the sentence is blinding then starvation, and is not theatre — only flight to Blefuscu saves him."
      - "In Brobdingnag the traveler is the pet — named Grildrig, sold to the Queen for a thousand gold pieces, tormented by the malicious court-dwarf, and judged by the wise King."
      - "The King of Brobdingnag, weighing the traveler's proud account of Europe by plain reason and no malice, calls his countrymen 'the most pernicious race of little odious vermin that nature ever suffered to crawl upon the surface of the earth' — and is right."
    hooks:
      - "Neutrality in the Lilliput court is read as the other side; a traveler who refuses the High-Heels and Low-Heels both is a heretic to both, and the egg-war has a use for him."
      - "Scale is the weapon: as the giant the traveler's least act is a public catastrophe, and as the pet his survival depends on a child's care and a Queen's whim against a dwarf's lethal jests."
      - "The Brobdingnag King's verdict cannot be argued away by defending Europe's glories — the proud defence is what damns the traveler; only honest humility earns any regard."
    tropes:
      - id: the_petty_holy_war
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the egg-war and the heel-factions, established as the standing deadly politics of the Lilliput court, administered by jealous men in earnest."
      - id: the_scale_reveal
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — size as weapon, pet, and horror across the first two voyages, established as the standing condition of being giant among the tiny and tiny among giants."

  # ── CHAPTER 3 — REASON AND THE IMMORTALS ───────────────────────────────────
  - id: reason_and_the_immortals
    label: "Reason and the Immortals — The Flying Island, the Academy, and the Curse of Never Dying"
    era: "the third voyage's lands as they stand"
    atmosphere: >-
      The third voyage is given over to minds that have cut reason loose from the
      world, and to a gift that turns out to be a curse. Laputa is an exact circle
      of land four miles and a half across, hanging in the air over the kingdom of
      Balnibarbi on the great loadstone at its core, its court so lost in
      mathematics and music that no man can attend to a spoken word without a
      servant — a flapper — to strike his mouth and ear with a bladder of pebbles;
      and beneath that abstraction lies the hard fact that the island can be lowered
      onto a rebel city below to blot out its sun and rain, or let down upon its
      roofs to crush it. Down in Balnibarbi the Grand Academy of Lagado labours at
      its five hundred projects — extracting sunbeams from cucumbers to bottle
      against cold summers, softening marble for pillows, building houses from the
      roof down, ploughing fields with hogs — while the country starves around it,
      reasoned into ruin, every project a faultless chain of argument that has lost
      its grip on the ground. Only Lord Munodi, out of favour for the crime of
      keeping his estate the old way, still prospers. And on Luggnagg the traveler
      hears of the Struldbruggs, immortals marked from birth by a red spot over the
      brow — and envies them, and frames glorious schemes for an endless life, until
      he is shown the truth: they do not stay young, they only stop dying, decaying
      into deaf, toothless, memoryless paupers, declared dead in law at eighty and
      left to rot for centuries without the mercy of the grave.
    established_facts:
      - "Laputa is a circular island four miles and a half across that hangs in the air over Balnibarbi, moved by a great loadstone, its court absorbed wholly in mathematics and music."
      - "The Laputan court cannot attend to speech without flappers — servants with pebble-bladders who strike a man's mouth and ear to recall his attention — and the King himself must be so roused."
      - "The flying island is a weapon: it can be lowered onto rebel cities of Balnibarbi to deprive them of sun and rain, or let down upon their roofs to crush them."
      - "The Grand Academy of Lagado pursues five hundred ruinous projects — sunbeams from cucumbers, marble softened for pillows, houses built from the roof down — while the country it improved starves; only Lord Munodi's old-method estate prospers."
      - "On Luggnagg, the Struldbruggs are immortals marked by a red spot over the left brow; they do not stay young but decay endlessly, are declared legally dead at eighty, and are envied by the foolish and pitied by all who learn the whole truth."
    hooks:
      - "There is no reasoning the projectors out of their projects — their logic is sound and only their premises are mad; the one survival is to keep your feet on the ground they have forgotten."
      - "The flying island menaces not by malice but by indifference; it can drop on a city as casually as a man swats a fly, and its descent is reasoned as coolly as a proof."
      - "The longing for immortality is the trap the Struldbruggs spring; the traveler who hears of the deathless and envies them is the one the reveal will land on hardest."
    tropes:
      - id: reason_without_sense
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the flying island and the Academy of Lagado, established as the standing condition of the third voyage: intellect divorced from use, brilliant and ruinous."
      - id: the_struldbrugg_curse
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Luggnagg immortals, established as a standing truth of the third voyage: immortality as endless decay, the thing every man wants and should most dread."

  # ── CHAPTER 4 — THE YAHOO VERDICT ──────────────────────────────────────────
  - id: the_yahoo_verdict
    label: "The Yahoo Verdict — The Rational Horses, the Mirror, and the Bleak Homecoming"
    era: "the fourth voyage and the homecoming it runs toward"
    atmosphere: >-
      The last voyage delivers the verdict the other three were building toward. In
      the country of the Houyhnhnms — rational horses in whose tongue the name means
      the perfection of nature — the traveler is sorted on sight into the Yahoos:
      the filthy, malicious, climbing, excrement-flinging brute-beasts that have the
      shape of a man and nothing of his mind. A grey horse, the Master, takes him in
      to study him as a Yahoo with a strange tincture of reason, teaches him the
      whinnying language, and hears his account of Europe — and cannot at first even
      comprehend it, for his nation founded wholly on reason and truth has no word
      for war, for law, for money, or for lying, which the traveler must call "the
      thing which is not." The more honestly he answers, the more plainly the Master
      concludes that the human animal is a Yahoo improved only in its genius for
      harm. Every act of force the traveler commits — the rats in the farmer's
      house, the wasps, the brutes who fall on him in the field — confirms the
      verdict; there is no sanctioned kill here, no vorpal exception, and to act the
      brute is to become the brute. The traveler comes to love the horses and loathe
      his own kind, and when the cold Grand Assembly decrees that a Yahoo with reason
      is the most dangerous Yahoo of all and must be expelled, it breaks him. He
      builds a canoe of stitched Yahoo skins, the fond Sorrel Nag working beside him,
      and is forced to sea — and home to Redriff, where he cannot bear the smell of
      his own wife and children, keeps two horses, and prefers the stable. The win is
      the knowledge he brought back, and he cannot put it down.
    established_facts:
      - "The Houyhnhnms are rational horses in whose tongue the word means 'the perfection of nature'; they live by reason alone and have no acquaintance with — or words for — vice, passion, deceit, war, law, or money."
      - "The Houyhnhnms have no word for lying; to convey it the traveler must call it 'saying the thing which is not', an act they can scarcely conceive because speech to them exists only to inform."
      - "The Yahoos are filthy brute-beasts with the human shape and none of the human mind; the Master demonstrates, limb by limb, that the traveler is anatomically one of them, improved only in his capacity for systematic harm."
      - "Every violent act the traveler commits across all four voyages confirms the Yahoo verdict; there is no sanctioned kill in this country, and restraint is the only move the verdict cannot use against him."
      - "The Grand Assembly decrees that a Yahoo with a tincture of reason is too dangerous to keep and must be expelled; the traveler builds a canoe, is forced to sea, and comes home to Redriff unable to bear his own family, preferring the company of horses in the stable."
    hooks:
      - "A single shaded word or evasion in Houyhnhnm-land confirms the worst the Master fears about the traveler's kind; the only defence is to be, here at least, the rare human who does not lie."
      - "Reaching for force is always effective here and always damning — the murderhobo lane is real and lethal-decisive, and every brute act turns the mirror on the traveler."
      - "The homecoming is the terminus, not the reward; softening it into reconciliation betrays the source — the horror is that the traveler got home every time and home is the thing he can no longer stand."
    tropes:
      - id: the_thing_which_is_not
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Houyhnhnms' want of any word for lying, established as the standing condition of the fourth voyage: a society founded on truth makes the lying, warring, lawyering human into the monster."
      - id: the_yahoo_within
        status: dormant
        progression: 0.0
        notes:
          - "PRIMED BUT LATENT — the savage losing-the-thread-of-home: coming to despise one's own kind, going native among the horses, and the bleak homecoming. Seeded at zero; never resolved by history."
      - id: priced_violence_marks_the_yahoo
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the priced-violence inversion, established as the standing law of the whole country: there is no sanctioned kill, and every act of force confirms the brute verdict."

  # ── POI LANDSCAPE MANIFEST (scripts/generate_poi_images.py) ─────────────────
  #
  # This chapter is NOT a history-chapter — it carries no tropes and seeds
  # nothing. It exists only to enumerate Gulliver's renderable landscapes for the
  # POI image pipeline, which reads chapters[].points_of_interest[] exclusively.
  # Each `slug` and `region` matches a cartography.yaml region id verbatim — one
  # POI per region, eighteen in all.
  #
  # Z-Image discipline (mirror Wonderland's and Oz's history.yaml exactly):
  #   - visual_prompt.solo is the renderable PLACE/SCENE only — concrete physical
  #     nouns, what the engraving depicts. NO style/medium/palette words: no
  #     "engraving", "Morten", "woodcut", "Victorian", "hand-tinted", "cross-
  #     hatched", "pen-and-ink". The Morten-plate style + restrained or no tint is
  #     appended automatically by visual_style.yaml positive_suffix at render time
  #     — do NOT repeat it here.
  #   - Keep each `solo` SHORT (one to two tight sentences) to respect the
  #     512-token render budget; lead with the dominant physical subject.
  #   - FIGURE FRAMING (Z-Image, 2026-06-02, REVISED): render every figure
  #     CONCRETELY and CONFIDENTLY as a plain camera-style noun — INCLUDING
  #     crowds (Lilliput soldiers, the Brobdingnag court, the Yahoo pack). Z-Image
  #     renders crowds and multiple figures fine when asked plainly; it rots them
  #     into uncanny mush only when the prompt HEDGES them ("suggested scatter",
  #     "only a dim knot", "distant suggestion", "a mass of dim shapes"). Either
  #     name a crowd as a real thing the camera sees ("ranks of soldiers", "a row
  #     of robed courtiers", "a pack of brutes") or leave it out — NEVER hedge it
  #     into a vague distant suggestion. The earlier "few large + rest suggested"
  #     doctrine was the bug; it has been removed. Also: no abstract ACTIONS as
  #     subjects ("objects take to the air") — use concrete static nouns.
  #   - backdrop is the same place as a wider establishing shot, no characters
  #     needed.
  #   - Source-faithful Swift, NEVER the nursery gloss: the man pinned by threads,
  #     the toy capital, the corn-stalks tall as trees, the eagle and the box, the
  #     circular island over the ruined land, the floor-licking court, the clean
  #     pasture fouled at its edge, the canoe of stitched skins, the stable.
  #     Adult content (the Yahoo filth, the Struldbrugg decay) is rendered with
  #     period-literary restraint, never crudeness.
  - id: the_voyage_country
    label: "The Voyage-Country — Renderable Landscapes"
    era: "the four lands as the traveler walks them, ringed by the sea"
    atmosphere: >-
      The standing places of the four voyages, sea by court by pasture — the open
      ocean with its wreck and its waiting ship, the shore where the giant wakes
      pinned by threads, the toy capital and the burning palace and the channel to
      Blefuscu, the corn-field tall as a forest and the farmer's house and the
      judging King's court and the box snatched by the eagle, the island hanging in
      the air over the Academy's ruin and the sorcerer's hall and the floor-licking
      throne, and the clean pasture fouled at its edge, the rational horse's lodge,
      the council in the grass, the half-built canoe, and the stable the traveler
      comes home to and never leaves. This chapter holds no chapter's tropes; it is
      the map made renderable, nothing more.
    points_of_interest:

      # ══ THE SEAM ═══════════════════════════════════════════════════════════════

      - name: The Open Sea
        slug: the_open_sea
        region: the_open_sea
        type: ocean
        description: >-
          The open ocean that joins the four lands — a small ship's-boat adrift on a
          vast swell, the half-foundered wreck of a ship behind it, and a distant
          unknown shore low on the horizon, the way in to every voyage and the way
          back from each.
        visual_prompt:
          solo: >-
            A small open ship's-boat adrift low in the foreground on a vast heaving
            ocean, a lone man bailing and shading his eyes, the half-foundered hull
            of a wrecked ship listing in the middle distance with broken masts and
            torn rigging. Far off across the empty water a thin strip of unknown
            shore shows on the horizon under a wide cloud-banked sky.
          backdrop: >-
            A vast open heaving ocean under a wide cloud-banked sky, a small open
            boat adrift low in the foreground, the half-foundered hull of a wrecked
            ship listing in the middle distance, and a thin strip of unknown shore
            far off on the horizon.

      # ══ VOYAGE 1 — LILLIPUT ════════════════════════════════════════════════════

      - name: The Lilliput Shore
        slug: the_lilliput_shore
        region: the_lilliput_shore
        type: shore
        description: >-
          A grassy shore where a giant man lies pinned flat on his back by hundreds
          of slender threads and ranks of little stakes, a swarm of six-inch soldiers
          massed across his chest with bows drawn.
        visual_prompt:
          solo: >-
            An enormous man lying flat on his back on a grassy shore, his arms, legs,
            and long hair lashed to the ground by hundreds of slender threads pegged
            with rows of tiny stakes, unable to stir. Swarming across his vast chest
            and along his outstretched arms are hundreds of soldiers no more than six
            inches high, ranks of them aiming bows, a little ladder propped against
            his side and a small railed stage built level with his ear.
          backdrop: >-
            A grassy shore beside a calm sea where an enormous man lies pinned flat on
            his back by hundreds of slender threads and rows of tiny stakes, swarms of
            six-inch soldiers crossing his chest and arms, a small railed stage built
            level with his ear.

      - name: Mildendo, the Capital
        slug: mildendo_capital
        region: mildendo_capital
        type: city
        description: >-
          A miniature walled city of toy palaces and narrow streets no wider than a
          gutter, a giant man kneeling outside the low wall to look over the rooftops
          into the capital.
        visual_prompt:
          solo: >-
            A tiny walled city in the foreground, its encircling wall no higher than a
            kneeling man's waist, packed with miniature three- and five-storey houses,
            toy palaces, and streets so narrow they look like channels between the
            roofs. An enormous man kneels outside the wall, bending low to peer down
            over the little rooftops into the crowded capital, his head and shoulders
            filling the sky above the city.
          backdrop: >-
            A miniature walled city of toy palaces and narrow gutter-like streets seen
            from above, its low encircling wall and towers level with a kneeling
            giant's knee, the enormous kneeling man bending over the rooftops in the
            background.

      - name: The Imperial Palace
        slug: the_imperial_palace
        region: the_imperial_palace
        type: palace
        description: >-
          A tiny ornate palace at the centre of the toy capital, one wing of it
          ablaze in the night, a giant figure stooping low over the burning rooms.
        visual_prompt:
          solo: >-
            A small ornate palace of many little turrets and courts at the centre of a
            miniature city, one wing of it on fire in the night with flames and smoke
            pouring from the tiny windows. An enormous man stoops down over the burning
            wing, his great shadowed bulk filling half the scene. In the near
            foreground below him a line of six-inch townsfolk passes thimble-sized
            buckets hand to hand from a well; along the lamplit streets beyond, more
            small townsfolk run toward the fire in clear ordered ranks.
          backdrop: >-
            A small ornate palace of turrets and courts at the centre of a miniature
            night-time city, one wing ablaze with flame and smoke, an enormous stooping
            man's bulk looming over the burning rooms, a line of six-inch townsfolk
            passing buckets from a well in the near street and more running through the
            lamplit streets beyond.

      - name: Blefuscu Strand
        slug: blefuscu_strand
        region: blefuscu_strand
        type: shore
        description: >-
          A narrow sea-channel which a giant man wades across, hauling behind him on
          a single cord a whole fleet of toy men-of-war, the rival empire's toy-town
          on the far strand.
        visual_prompt:
          solo: >-
            An enormous man wading waist-deep across a narrow sea-channel, leaning into
            the effort, hauling behind him on a single twisted cord a whole fleet of
            tiny men-of-war with masts and sails no taller than a finger, their little
            hulls cutting wakes in the water. On the far strand ahead a miniature walled
            toy-town waits, ranks of six-inch townsfolk lining its quay and crowding its
            little ramparts to watch the giant come.
          backdrop: >-
            A narrow sea-channel between two miniature toy-empires, an enormous man
            wading across it hauling a fleet of finger-tall men-of-war behind him on a
            cord, a small walled toy-town on the far strand with ranks of six-inch
            townsfolk lining its quay and ramparts.

      # ══ VOYAGE 2 — BROBDINGNAG ═════════════════════════════════════════════════

      - name: The Giant Cornfield
        slug: the_giant_cornfield
        region: the_giant_cornfield
        type: field
        description: >-
          A tiny man dwarfed among colossal stalks of standing corn that rise like
          tree-trunks far over his head, a vast reaping-hook swinging through the
          grain above him.
        visual_prompt:
          solo: >-
            A tiny man no larger than a mouse standing in a furrow at the foot of
            colossal stalks of standing corn that rise like the trunks of trees forty
            feet over his head, the heavy ears of grain hanging far above. Sweeping
            through the corn behind him comes the immense curved blade of a reaping-hook
            as long as a ship's spar, and beyond it the legs of a reaper tall as a
            steeple.
          backdrop: >-
            A field of standing corn whose stalks rise like tree-trunks forty feet high,
            a vast curved reaping-hook sweeping through the grain and the steeple-tall
            legs of a reaper beyond, a single tiny man lost in the furrow at their foot.

      - name: The Farmer's House
        slug: the_farmers_house
        region: the_farmers_house
        type: dwelling
        description: >-
          The interior of a huge plain farmhouse, a tiny man standing on an enormous
          table beside a giant house-cat the size of an ox and a looming child's face
          bending close.
        visual_prompt:
          solo: >-
            The interior of a vast plain farmhouse kitchen, everything built to a giant
            scale. On an enormous wooden table in the foreground stands a tiny man no
            taller than a salt-cellar, drawing a needle-sized sword. Crouched on the
            same table, dwarfing him, an ox-sized house-cat fixes him with one huge eye;
            beyond, the immense face of a child leans down close over the table to look
            at him.
          backdrop: >-
            The interior of a vast plain farmhouse kitchen built to giant scale, an
            enormous wooden table with a tiny man standing on it, an ox-sized house-cat
            crouched beside him, and the looming face of a child bending close over the
            table.

      - name: The King's Court
        slug: the_kings_court
        region: the_kings_court
        type: palace
        description: >-
          A vast royal hall where a giant crowned king sits on his throne and bends
          to peer at a tiny man standing on a box upon a table set before him.
        visual_prompt:
          solo: >-
            A vast royal hall with soaring pillars, where an enormous crowned king sits
            upon a great throne and leans far down, chin near to a long table set before
            him. On the table stands a small fitted box with a tiny man upon it, no
