      attentive close-set eyes and a thin precise mouth drawn as line, an ink-stain
      on one finger. A plain undressed brown wig, a grey clerk's coat worn at the
      cuff over a buttoned waistcoat, a sheaf of papers and a quill clutched to the
      breast. The shoulders rounded forward, the head bent in patient diligence.

  - id: picker_georgian_british_midshipman_m01
