  # ===========================================================================
  # PLAYER-PICKER FACES — character-creation roster
  # ===========================================================================
  # Faces a player chooses at chargen. Schema mirrors
  # mutant_wasteland/seaboard_of_saints: id / name / role / type /
  # culture / archetype / sex / backdrop_poi / appearance. `appearance`
  # describes ONE PERSON, the face and upper body ONLY — no background
  # prose (the backdrop is composed from `backdrop_poi`; a second wide
  # scene in appearance triggers the Z-Image split montage). Physical
  # fact only — bone, set of jaw, dress, posture — never mood-words.
  # `culture` = culture filename stem. Every backdrop_poi resolves to a
  # rendered POI in r2_manifest.json.
  #
  # PORTAL-FAIRYTALE FIX (2026-06-12): the players are NOT natives of the
  # voyage-countries. Gulliver is a portal world — the player-characters are
  # ORDINARY BRITONS OF GEORGIAN BRITAIN, c.1726 (the year Swift published the
  # Travels), seafarers and townsfolk who wash up on these shores exactly as
  # Lemuel Gulliver, ship's surgeon, does. The pickers were wrongly making the
  # player select an in-world people (lilliputians / brobdingnagians / laputans
  # / houyhnhnms_and_yahoos); that was the bug. Every picker sets
  # culture: georgian_british (file stem worlds/gulliver/cultures/
  # georgian_british.yaml — the StyleCatalog culture gate requires the file
  # stem to match the picker culture slug EXACTLY). The in-world peoples remain
  # the NPC cast above; they are not playable faces. Appearances are period-
  # accurate 1726 Georgian dress (tricorne, frock coat, mob cap, breeches,
  # buckled shoes) ending on physical posture — NO style words; the world
  # positive_suffix carries the Morten plate look. Castaways stand on real
  # shore / harbour / landing POIs verified against r2_manifest.json.
  #
  # 2026-07 AUDIT (this pass): re-confirmed the 2026-06-12 single-culture
  # decision deliberately — do NOT read "only one culture has pickers" as the
  # same flagship gap fixed in oz/wonderland. Unlike those two worlds, Gulliver
  # documents an explicit prior REVERT of native-culture pickers as a bug, and
  # the satire's whole thesis (the antagonist is the verdict, delivered BY each
  # voyage-people ON the human traveler) requires the player to stay the judged
  # outsider, never the judge. No lilliputian / brobdingnagian / laputan /
  # houyhnhnms_and_yahoos picker faces were added. Flagged to Keith in the task
  # report as a considered deviation from the wonderland-parallel pattern.
  #
  # A real archetype bug WAS found and fixed this pass: all 18 entries had
  # `archetype:` set to a worlds/gulliver/archetypes.yaml NPC-identity name
  # (e.g. "The Judging Sovereign" IS the King of Brobdingnag, a
  # named_individual: true NPC template) instead of a pack-tier PLAYABLE
  # Traveler coping-style. That is the same class of error oz/wonderland guard
  # against explicitly ("archetype=real playable Traveler coping-style
  # (pack-tier wry_whimsy/archetypes.yaml)"). Every entry below is remapped to
  # its nearest real value from wry_whimsy/archetypes.yaml (The Innocent / The
  # Wit / The Surveyor / The Scrapper / The Dreamer) by matching the
  # PERSON described in `appearance`, not the meaning of the old mislabeled
  # NPC archetype. worlds/gulliver/archetypes.yaml remains NPC-only, as its own
  # header documents ("the Gulliver-particular NPCs the materialiser dresses
  # scenes with").
  #
  # Allocation: 18 entries, all culture: georgian_british, M/F balanced 9/9,
  # period occupations, all five pack archetypes represented (Surveyor and
  # Scrapper skew heaviest — genuinely warranted: Surveyor is explicitly "the
  # Gulliver shape" per the pack tier, and this cast is disproportionately
