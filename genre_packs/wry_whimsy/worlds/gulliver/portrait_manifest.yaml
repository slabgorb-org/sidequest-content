      a high forehead, level brows, a straight nose and a composed steady mouth
      stated as drawn line. A modest powdered tie-wig, a sober brown frock coat
      buttoned over a plain waistcoat and white stock, a small surgeon's case held
      under one arm. The shoulders square and the head carried level in unhurried
      attention.

  - id: picker_georgian_british_clerk_m01
