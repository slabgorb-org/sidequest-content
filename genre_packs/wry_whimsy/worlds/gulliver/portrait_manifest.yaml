# =============================================================================
# Gulliver (wry_whimsy) — PORTRAIT MANIFEST
# =============================================================================
# Portrait prompt SPECS for Swift's Gulliver's Travels roster (1726), rendered
# DEAD STRAIGHT from the satire — never the cute children's-book Gulliver.
# Renderer: Z-Image Turbo (no negative_prompt). The world visual_style.yaml
# positive_suffix carries the Thomas Morten 1865 wood-engraving medium, the
# dense cross-hatched black-ink plate look, the scale-dramatic framing, and the
# safety clause — appended to EVERY render. It carries NO specific character:
# Gulliver's early-Georgian dress was pulled from the suffix (2026-06-03)
# because, appended universally, it stamped a stray tricorn-hatted Georgian
# figure into every NPC plate and every empty landscape. Each subject's own
# dress lives in its `appearance` here. Entries describe the SUBJECT ONLY (no
# style words — no "engraving", "Morten", "plate", "wood-cut"; the suffix adds
# the medium).
#
# SOURCE FIDELITY (Swift 1726 + the Cassell's / Morten plate tradition):
#  - Lilliputians are six inches tall in miniature 18th-c. court dress; the
#    Emperor a nail's breadth taller than his courtiers, and stands so it shows.
#  - Brobdingnagians are colossal humans; the tiny man sits in a palm, a pocket,
#    a box. Glumdalclitch is a giant nine-year-old farm-girl.
#  - Laputans are abstracted — the head reclined, one eye in, one eye up.
#  - Houyhnhnms are dignified naturalistic horses; the Yahoos are filthy naked
#    brute-humans, rendered as a TYPE, never named, never comic.
#  - The Struldbrugg is an ancient immortal with a livid round spot over the
#    left brow, decayed, gap-mouthed.
#
# DISCIPLINE (from PROMPTING_Z_IMAGE.md):
#  - Faces/forms described as PHYSICAL FACT (bone, set of the jaw, posture),
#    never as impression/expression editorial ("vain", "cruel", "mad") — mood
#    words drift the render cartoony. A sneer is stated as facial STRUCTURE.
#  - Every negation phrased positively (the engraved alternative, never "no X").
#  - "adult" + SOUL modesty clause for every HUMANOID figure (the Lilliputian,
#    Brobdingnagian, and Laputan people, the human-scale figures); horses
#    (Houyhnhnm master, sorrel nag, grey steed) carry the "no text" cleanup but
#    not the human-anatomy/modesty clause. The Yahoos are the one adult-but-
#    bestial exception, handled with period-anatomical-engraving restraint.
#  - element_visual carries the per-entry cleanup; matches the Oz / Wonderland /
#    five_points manifest schema (appearance / culture_aesthetic / element_visual).
# =============================================================================

characters:

