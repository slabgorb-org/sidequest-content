      Full-length figure of a monarch some six inches tall, a nail's breadth
      taller than the courtiers around him and standing so the difference shows,
      a strong masculine face with a level brow and a firm set mouth stated as
      drawn line. Dressed in an ornate court fashion part Asiatic, part European,
      a plumed helmet on the head, a short ceremonial sword three inches long
      drawn and held forward. An upright commanding pose, tiny attendants about
      his feet for scale, plain pale ground.
    culture_aesthetic: >-
      Lilliput court register — miniature 18th-century court regalia, the plumed
      helmet and tiny drawn sword the iconography, his single nail's-breadth of
      extra height contrived so it cannot be missed, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult man, fully clothed, modest, correct
      human anatomy, natural hands and fingers, non-sexualized depiction.

