  # ===========================================================================
  # COMPANION CREATURES — the player's pet at the table
  # ===========================================================================
  # Reusable animal-companion templates (same five species authored across many
  # worlds). Single subject on a plain plate; species rendered as PHYSICAL FACT
  # (pose, set of the eye), never impression-words. Gulliver's signature is
  # SCALE PLAY, so each is hinted with one period travel-book prop of contrived
  # size — a thumb-sized plinth, a giant coin, a thimble — rendered as fact.
  # element_visual carries the no-text cleanup only (the animal precedent, as
  # with the Houyhnhnm horses — no human-anatomy/modesty clause).
  # ===========================================================================

  - id: companion_cat
    name: Cat
    role: A self-possessed traveller's cat that suffers the company of lesser creatures
    type: companion_creature
    appearance: >-
      A domestic short-haired cat seated bolt upright, the chin lifted so the
      muzzle tips up and the eyes half-lidded above it, looking down its nose at
      the viewer. The forelegs straight and the spine vertical, the tail wrapped
      forward over the front paws with the tip laid precisely across the toes,
      every hair of the coat smooth and unruffled. It sits upon a small turned
      plinth no taller than a thumb, set on a vast bare floor that dwarfs it.
      A composed motionless pose, plain pale ground.
    culture_aesthetic: >-
      Travel-book companion register — the immaculate upright cat on its miniature
      thumb-high plinth lost on a giant's floor the scale-play, the precise curled
      tail and lifted chin the iconography, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_owl
    name: Owl
    role: A learned traveller's owl forever correcting a point of fact
    type: companion_creature
    appearance: >-
      A round-faced owl perched and leaning forward, the head tilted hard to one
      side and tipped down so it peers along the line of its hooked beak at the
      viewer, the brow-feathers drawn up into two raised tufts above the wide
      eyes. One feathered foot lifted clear of the perch with a single talon
      extended forward as if mid-point, the breast plumage fastidiously smooth and
      barred. It grips a quill-thin perch laid across an oversized brass coin
      standing on edge behind it. A poised lecturing pose, plain pale ground.
    culture_aesthetic: >-
      Travel-book companion register — the peering owl mid-correction, one talon
      raised and the brow-tufts up the iconography, the giant coin behind it the
      scale-play, neat barred plumage, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_raven
    name: Raven
    role: A sidelong traveller's raven that keeps more secrets than it tells
    type: companion_creature
    appearance: >-
      A glossy black raven hunched low on its perch with the head cocked sharply
      sideways, one round eye turned up to catch the light in a sidelong glint,
      the heavy beak half-parted to hold a small bright bead pinched at its tip.
      The wings folded tight and the shoulders drawn up into a conspiratorial
      stoop, the throat-hackles ruffled, one scaled foot curled over a second
      shiny trinket pinned to the perch. It stands beside a tipped thimble that
      towers like a metal drum. A secretive sidling pose, plain pale ground.
    culture_aesthetic: >-
      Travel-book companion register — the hunched sidelong raven with a bright
      bead in its beak and a trinket beneath one claw the iconography, the looming
      thimble the scale-play, glossy black plumage, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_toad
    name: Toad
    role: An unbothered traveller's toad that waits, mostly, for the next fly
    type: companion_creature
    appearance: >-
      A squat warty toad crouched low and flat on the ground, the broad body
      settled heavily over the splayed feet, the wide mouth closed in a long
      level seam and the eyes half-lidded under their heavy lids, utterly still as
      a wet stone. The mottled skin pebbled with raised glands, the throat barely
      swelled. A small beetle creeps across the bare ground a little before it,
      unregarded. Beside the toad an oversized coin lies flat on the ground like a
      bronze platter. A motionless settled pose, plain pale ground.
    culture_aesthetic: >-
      Travel-book companion register — the low flat unmoving toad with a beetle
      creeping past its closed mouth the iconography, the giant coin lying flat
      beside it the scale-play, pebbled warty skin, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_goat
    name: Goat
    role: A contrary traveller's goat with an appetite for whatever is to hand
    type: companion_creature
    appearance: >-
      A short-haired goat standing four-square with the legs braced wide and the
      weight set back, the head lowered so the pair of curved horns tip forward
      toward the viewer, the long jaw working sideways mid-chew. The eyes set wide
      with the horizontal rectangular slot-pupils plain, the gaze flat and fixed
      ahead. The square muzzle clamped on the trailing corner of a torn travel-map,
      it is braced over an oversized coin half its own height standing on edge in
      the ground. A planted immovable pose, plain pale ground.
    culture_aesthetic: >-
      Travel-book companion register — the braced lowered goat with horns tipped
      forward and a torn map-corner in its jaw the iconography, the giant upright
      coin the scale-play, the slot-pupil stare, restrained tint, plain ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.
