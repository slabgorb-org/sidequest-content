  # ===========================================================================
  # PLAYER-PICKER FACES — character-creation roster
  # ===========================================================================
  # Faces a player chooses at chargen. Schema mirrors
  # mutant_wasteland/seaboard_of_saints: id / name / role / type /
  # culture / archetype / sex / backdrop_poi / appearance. `appearance`
  # describes ONE PERSON, the face and upper body ONLY — no background
  # prose (the backdrop is composed from `backdrop_poi`; a second wide
  # scene in appearance triggers the Z-Image split montage). Physical
  # fact only — bone, set of jaw, dress, posture — never mood-words.
  # `culture` = culture filename stem; `archetype` = a real name from
  # worlds/gulliver/archetypes.yaml. Every backdrop_poi resolves to a
  # rendered POI in r2_manifest.json. The world's non-human peoples are
  # honored: the Houyhnhnms are naturalistic horses, the Yahoos brute-
  # humans rendered as a type with period anatomical restraint.
  #
  # Allocation: 18 entries across all four cultures. Where a culture has
  # two natural sexes, M/F are balanced; the Houyhnhnm horse-folk and the
  # Yahoo brute-kind carry both as best the form allows.
  # ===========================================================================

  # ── Picker · Lilliputians ──────────────────────────────────────────────

