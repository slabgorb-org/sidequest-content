name: "Quinbus Flestrin, the Great Man-Mountain"
era: "the first voyage, as Lilliput tells it ever after — the giant who came out of the sea and was driven back into it"
summary: >-
  Lilliput's own awed and fearful legend of the giant who washed ashore: Quinbus
  Flestrin, the Great Man-Mountain, who drank their cellars dry, doused the palace
  fire by the one gross means to hand, and waded the channel to haul off the whole
  fleet of Blefuscu by its anchor-cables — and whom the court, having used him,
  then voted to blind and starve. Played dead straight: to a six-inch people the
  giant is a wonder, a weapon, an unbearable expense, and a threat, all at once,
  and the savagery is that men so small can solemnly decree the blinding of a man
  so large and call it mercy.

details: >-
  He came out of the sea and was found insensible on the shore, and before he woke
  a whole nation six inches high had swarmed over him and pegged him to the grass
  with a thousand slender threads. They named him Quinbus Flestrin, the Great
  Man-Mountain, and they were right to fear him: he could have crushed the capital
  underfoot. Instead, once they judged him tame and fed him from baskets of
  thimble-sized meat and hogshead casks of wine, he proved the most useful engine
  the empire had ever owned. When the Empress's apartment in the palace of
  Belfaborac caught fire in the night and the whole toy-city could not fetch water
  fast enough to save it, the Man-Mountain put the fire out by the one gross,
  immediate means he had — and the saving of the palace by so unseemly an
  expedient became, in time, one of the charges against him. When Lilliput's holy
  war with Blefuscu over the cracking of an egg wanted a decisive stroke, he waded
  the eight-hundred-yard channel and towed the rival fleet to harbour by its
  cables, and was made a Nardac of the realm for it — and then refused to wade
  back and reduce all Blefuscu to a province, for he would not be the instrument
  by which a free people were enslaved. That refusal, to a court of jealous men, was
  the unforgivable thing. The Treasurer Flimnap, who believed the giant too fond of
  his wife and had the figure ready that one Man-Mountain ate as much as 1,728
  Lilliputians, drew up the articles of impeachment in his own hand; the Admiral
  Skyresh Bolgolam, the giant's enemy from the first hour, hardened every count; and
  the Emperor, styled Delight and Terror of the Universe, resolved that the
  Man-Mountain should be blinded first and then quietly starved, and called the
  blinding clemency. Only the secret warning of the one honest minister, Reldresal,
  sent the giant across the channel to Blefuscu in time, where a real boat lay
  overturned on the strand and an empire's resources refitted it, so that he put to
  sea and went home — and forgot nothing, and learned nothing, and sailed again.
  Lilliput tells the legend as a wonder and a deliverance both: the mountain that
  walked among them, that they fed and flattered and used, and that they were brave
  enough, in their six inches, to condemn.

