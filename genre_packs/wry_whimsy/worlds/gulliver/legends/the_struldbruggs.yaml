name: "The Struldbruggs, the Immortals of Luggnagg"
era: "the third voyage — a standing truth of Luggnagg, born now and then in every age"
summary: >-
  The Luggnagg immortals: children born now and again with a round red spot over
  the left brow, the certain mark of one who will never die. The foolish envy them
  as the luckiest of mortals, and the traveler who first hears of them glows with
  rapturous schemes for an endless life — until he is shown the truth, which is
  that they do not stay young, only stop dying: declared legally dead at eighty,
  stripped of all they had, and left to decay for centuries without the mercy of
  the grave. Played dead straight as the cruellest reveal of the whole country —
  the thing every man most wants is the thing he should most dread.

details: >-
  They are not made and not chosen; now and then, in no particular family and to
  no particular merit, a child is born in Luggnagg with a round red spot over the
  left eyebrow that never fades, and that spot is the mark of a Struldbrugg — one
  who will never die. When the traveler first hears of such people his blood
  quickens, and he frames, unbidden, a hundred glorious uses for a deathless life:
  the learning he would amass across the centuries, the fortune, the counsel he
  would give a grateful age, the wisdom that could only ripen with unending time.
  And then the Luggnaggians, gently and completely, correct him. The Struldbruggs
  do not stay young. They age into the full misery of the very old and then keep
  going. By thirty they grow melancholy; by eighty, which the law of the country
  reckons the term of a life, they are declared legally dead, that their heirs may
  inherit and the living not be ruined by an entail that never falls in, and they
  are stripped of their estates and left a bare pittance. After that they only
  decay: toothless, deaf, friendless, opinionated and despised, their memories
  failing until they cannot finish a sentence they have begun or recognize the
  children of their own children, the red spot gone livid and black, the very
  language of the country drifting under them across the generations until they are
  strangers in their own land, unable to speak with anyone now alive. They cannot
  read, for they forget the start of a sentence before they reach its end. They are
  envied by the foolish who hear only that they never die, and pitied without bottom
  by everyone who learns the whole of it, and they themselves pray for the death
  that will never come. The traveler leaves Luggnagg cured of the oldest wish — no
  longer envying the deathless but understanding them as Swift's bleakest mercy
  turned curse — and carries the knowledge onward as a corrective to every later
  temptation to grasp at more time than a mortal share. There is no rescue for the
  Struldbruggs and no cure; there is only the lesson, which lodges where it cannot
  be dislodged.

notable_figures:
  - "The Struldbruggs — the immortals of Luggnagg, marked from birth by a red spot over the left brow, who never die and never stop decaying"
  - "The Luggnaggians — who envy the Struldbruggs in their youth, declare them legally dead at eighty, and pity them for the rest of their endless lives"

