name: "The Perfection of Nature — the Houyhnhnm Ideal"
era: "the fourth voyage — the self-conception by which the rational horses have always governed their country"
summary: >-
  The Houyhnhnm self-conception: in their own whinnying tongue the very name means
  "the perfection of nature", and they hold themselves to be exactly that — a
  nation governed wholly by reason, with no acquaintance with or word for vice,
  passion, deceit, war, law, or money. By this ideal they measure all creatures,
  and against it they define the human: not as a fellow rational being but as a
  Yahoo, the filthy brute they keep as cattle, improved only in its genius for
  systematic harm. Played dead straight as the antagonist-verdict in its purest
  form — a society founded on truth that finds the lying, warring, lawyering human
  the lower beast, and is, by its own clean light, largely right.

details: >-
  They are horses, and they call themselves Houyhnhnms, which in their tongue means
  the perfection of nature, and they mean it not as a boast but as a plain
  description of a fact they have never had cause to doubt. Their whole nation is
  governed by reason alone. They have no acquaintance with passion, cruelty,
  vanity, or deceit, and therefore no words for any of them; they have no word for
  lying, and to convey it a stranger must call it "saying the thing which is not,"
  because in a people whose speech exists only to inform, the turning of speech
  against the truth is an absurdity they can scarcely think. They have no words for
  power, government, war, law, punishment, or money either, and a visitor who would
  describe the country he comes from must build clumsy compounds to hold them, and
  every compound exposes a vice. By this ideal the Houyhnhnms order everything,
  including their estimate of the human creature that once appeared among them
  walking upright and clothed and able, after long teaching, to speak. They studied
  it, heard out its account of Europe — its wars made over the smallest difference of
  opinion, its laws and lawyers who are hired to say the thing which is not for
  money, its commerce and its slaughter — and concluded, with grave wonder and no
  malice at all, that the creature was a Yahoo: the same filthy brute they kept as
  cattle, differing only in this, that it had reason enough to make its vices
  systematic. The brute herd was the body of the verdict; the creature's
  civilization was the aggravation. When the Grand Assembly, that quadrennial council
  of the whole nation, took up the question of the reasoning Yahoo, it decided by
  pure argument that an animal with a pretence to reason was the more dangerous for
  it, and could not be suffered to remain — and there was no anger in the decree and
  no appeal from it. The ideal is the terror of the place precisely because it is not
  cruel: the Houyhnhnms judge the human by holding him to plain truth and plain
  reason, and by that measure he cannot honestly be defended. The legend is told
  here as the rational horses tell it of themselves, and the savagery is in the
  telling — that the perfection of nature, looking at us clearly and without heat,
  sees the Yahoo, and is not wrong.

notable_figures:
  - "The Houyhnhnms — the rational horses whose name means 'the perfection of nature', governed wholly by reason, with no word for lying"
  - "The Houyhnhnm Master — the grey horse who studied the reasoning Yahoo, taught it to speak, and concluded the human animal a Yahoo improved only in harm"
  - "The Grand Assembly — the quadrennial council that debates exterminating the Yahoos and decrees the reasoning Yahoo expelled, by reason alone and beyond appeal"
  - "The Yahoos — the filthy brute-beasts of the human shape, the mirror by which the Houyhnhnms measure and condemn the human creature"

