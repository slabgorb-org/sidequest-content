world_name: Gulliver

history: >-
  Gulliver is not one country but four, and the only thing they share is the sea
  and the man who keeps washing up on them. A sensible ship's-surgeon of Redriff
  — observant, methodical, proud of his civilization and forever ready to measure
  and record it — sets out on a voyage, is wrecked or set adrift or marooned, and
  comes to his senses on a strange shore: bound flat by a six-inch nation in
  Lilliput, crouching among corn-stalks tall as trees in Brobdingnag, set down by
  a court that hangs in the air over Laputa, or sorted on sight into a herd of
  filthy brutes in the country of the Houyhnhnms. Each land is a whole
  self-contained reckoning, and each has the same savage shape: the traveler
  survives the absurd society, discovers that the society has been quietly judging
  HIM and his whole civilization, and takes the real boat home that is always,
  somehow, waiting. Then he does the one unforgivable thing — he goes back to sea.
  Four times he comes home and four times he embarks again, and the satire he set
  out to catalogue turns the instrument round and catalogues him. There is no
  founding myth to any of these places and they need none; each is wholly,
  relentlessly logical, and to each of them its own logic is self-evident and the
  traveler is the strange one. He arrives believing he is the reasonable man among
  the absurd. The country's whole work is to show him, calmly and correctly, that
  he is the monster, and that he agreed to come.

geography: >-
  Four lands ringed by open ocean, with no walking-road between them — only the
  sea, and the wreck, and the setting-out again. LILLIPUT is a manicured
  toy-kingdom of six-inch hedges, painted rose-walks, and miniature palaces, with
  its walled capital of Mildendo two feet and a half square, its imperial palace
  of Belfaborac at the centre, and a channel eight hundred yards wide to the rival
  toy-empire of Blefuscu across the water. BROBDINGNAG is a vast country of
  grain-stalk forests tall as cathedrals and cyclopean masonry, where the corn
  rises forty feet and a house-cat is the bulk of an ox; its royal city of
  Lorbrulgrud, the Pride of the Universe, holds the King's court, and its coast is
  where an eagle once carried off a travelling-box and dropped it in the sea.
  LAPUTA is a perfect circle of land four miles and a half across that hangs in
  the air on the great loadstone in its core, floating over the ruined
  experimental farms of Balnibarbi below — the city of Lagado and its Grand
  Academy, the little Isle of Sorcerers at Glubbdubdrib, the floor-licking court of
  Luggnagg with its immortal Struldbruggs. HOUYHNHNM-LAND is a clean, ordered,
  fenced grassland, fouled at its ragged edges by the filthy Yahoo herd, holding
  the grey Master's spare timber lodge, the council-ground of the Grand Assembly,
  and the rocky shore of expulsion. And beyond all four, reached only after the
  last voyage, lies the bleak terminus: Redriff, the traveler's own house and
  stable in England, the one place the sea does not offer as an escape.

cosmology: >-
  Gulliver runs on logic, not magic, and that is precisely the horror: there is
  no nonsense to out-argue, no caprice to wait out, no humbug behind the curtain.
  Every society here MAKES SENSE — the egg-war and the heel-factions are a
  coherent politics, the flying island is a coherent instrument of rule, the
  Struldbruggs' legal death at eighty is a coherent law, the Houyhnhnms' want of
  any word for lying is a coherent foundation — and each, reasoning soundly from
  its own premises, weighs the traveler and his civilization and finds them
  wanting. The verdict is largely RIGHT, and the traveler knows it. There is no
  sanctioned violence anywhere in this country: where Wonderland prices violence
  high but grants one clean kill against the Jabberwock, Gulliver grants none at
  all, and every act of force — necessary, decisive, or both — only confirms that
  the traveler is the Yahoo the satire says he is. The way home is the savage
  inversion of every other exit: it is always open. A real boat at Blefuscu, a box
  plucked from the sea, a Dutch ship off Luggnagg, a canoe of stitched skins — the
  traveler can always get home, and home is the thing he can no longer stand. The
  compulsion is not being trapped but choosing, four times over, to leave again;
  and the man who keeps choosing the sea is choosing, turn by turn, the satire's
  verdict on himself. The only thing this country cannot do is let the traveler
  win clean. The reveal can be resisted but never refuted; the best ending is bleak
  self-knowledge, never a triumphant waking.

# ── Genre-form framing, filled in for Gulliver (lands in WorldLore extras) ──────

the_four_voyages: >-
  The whole of Gulliver is four sea-separated voyages joined by no land, only by
  the ocean and the man who keeps sailing into them. VOYAGE ONE is Lilliput, where
  the traveler is the GIANT — Quinbus Flestrin, the Great Man-Mountain — pinned by
  threads on the shore, tangled in the petty court of a six-inch emperor, and
  driven out by an impeachment that means blinding and starvation. VOYAGE TWO is
  Brobdingnag, where the reckoning reverses and he is the PET — a curiosity named
  Grildrig, found in the corn, sold to the Queen for a thousand gold pieces,
  displayed for coin and very nearly killed by a cat, a dwarf, an eagle. VOYAGE
  THREE is Laputa and the lands below, where he is the bemused TOURIST among
  abstracted mathematicians, sunbeam-bottling projectors, summoned ghosts, and
  immortals who only rot. VOYAGE FOUR is the country of the Houyhnhnms, where he is
  the YAHOO, taken for the filthy brute he resembles by rational horses who have no
  word for lying — and where the verdict the other three were building toward is at
  last delivered whole. One indictment, four ways; one man, four homecomings; and
  every voyage ends with a real road home he refuses to learn from.

the_satire_turns_on_you: >-
  The central engine of the whole country. The traveler comes to each land
  believing he is the reasonable man among the absurd, the civilized visitor
  cataloguing quaint foreign customs — and at some point each society quietly turns
  the instrument round and examines HIM. The Brobdingnag King hears out a proud
  account of England's parliaments, courts, armies, and wars, and delivers his
  verdict in a level voice: that the bulk of the traveler's countrymen are "the most
  pernicious race of little odious vermin that nature ever suffered to crawl upon
  the surface of the earth." The Houyhnhnm Master, hearing the same history, can
  scarcely believe a creature with a pretence to reason could be so depraved. This
  is no pasteboard reveal of painted scenery — it is a mirror, and the thing it
  shows is real. The more clearly the traveler sees how strange and cruel these
  societies are, the more clearly they, and fatally he, see that he is the monster.
  There is no refusing the reveal, because the satire is largely RIGHT, and the
  traveler cannot honestly dispute it. The judgment is delivered calmly, reasonably,
  without malice, which is exactly why it cannot be shrugged off; the horror is not
  that the verdict is cruel but that it is accurate.

the_savage_male_courts: >-
  Power across all four voyages is male and savage, and the women are fond and
  powerless to save the traveler — this is honest to Swift, not a gloss on him. In
  Lilliput the EMPEROR, Delight and Terror of the Universe, would make the giant his
  weapon and then condemn him; the jealous Treasurer FLIMNAP, who won his office
  dancing on a rope, folds a private grievance about his wife into formal articles of
  treason, and the hostile Admiral SKYRESH BOLGOLAM hardens every count, pressing
  blinding-and-starvation over mere blinding. The one decent man, the Secretary
  RELDRESAL, can only warn. In Brobdingnag the wise KING judges and the malicious
  court-DWARF torments, while the fond QUEEN keeps the traveler as a treasured
  possession and the child GLUMDALCLITCH loves him and cannot keep him safe. In
  Laputa the abstracted KING and his male PROJECTORS embody intellectual vanity; in
  Houyhnhnm-land the cold patriarchal GRAND ASSEMBLY debates extermination and
  expulsion by reason alone. The politics is jealous treasurers and admirals, judging
  kings, vain projectors, and bloodless councils; the gender current is savage male
  court-politics, and the kindest figures the traveler meets — a nurse, a Queen, a
  servant-horse — are exactly the ones with no power to save him.

the_scale: >-
  Size is the live texture of the first two voyages, horror and comedy at once. In
  Lilliput the traveler is the giant, and his ordinary body becomes a geography: his
  pockets are inventoried by the state, his appetite feeds a nation (the upkeep of one
  Man-Mountain is reckoned at that of 1,728 Lilliputians, and Flimnap has the figure
  ready as ammunition), the fire at the palace can be quenched only by the one gross
  means to hand — for which he is impeached. In Brobdingnag the reckoning reverses and
  he is the speck, and here scale turns from comedy to disgust: the magnified pores and
  stubble of the Maids of Honour, the lice crawling like swine on a beggar's clothes, a
  cancerous breast with a hole the traveler could have crept into, every human surface
  enlarged until it is a horror. The lesson is Swift's cruellest small one — that beauty
  and dignity are only a trick of distance, that magnified or shrunk the human body is
  grotesque at any honest range. The wonder of being rescaled never stops being a
  wonder; it also never stops being a peril, and it never stops quietly insulting the
  species. What saves the traveler at one size endangers him at the next, and the body
  is never a fixed fact here.

reason_without_sense: >-
  Intellect divorced entirely from use, throned and armed. On the flying island of
  Laputa the court is so absorbed in mathematics and music that no man can attend to a
  word said to him; servants called flappers must strike their masters on the mouth and
  ears with a bladder of pebbles to recall their attention, and the King himself must be
  so roused. And the island can be lowered onto a rebellious city below to crush it or to
  cut off its sun and rain — abstraction with the power to bludgeon. Down in Balnibarbi
  the Grand Academy of Lagado labours at its five hundred projects: extracting sunbeams
  from cucumbers to be bottled against cold summers, reducing human ordure to its
  original food, softening marble to make pillows, building houses from the roof down,
  ploughing fields with hogs. The projectors starve in ruined cells while their ruined
  country starves around them, and they will not stop, because every project is a
  faultless chain of reasoning and only the results are catastrophic. Only Lord Munodi,
  out of favour for the crime of keeping his estate by the old methods that work, still
  prospers. The Laputan horror is reason that has lost sight of the ground — theory that
  has forgotten the body must eat, the clever mind grinding gloriously to no purpose at
  all, and a whole country reasoned into famine by men who cannot be argued with because
  their logic is sound.

the_struldbruggs: >-
  Immortality as decay, not gift — the cruellest reveal Swift gives. In Luggnagg the
  traveler hears of the Struldbruggs, children born now and then with a round red spot
  above the left eyebrow, the certain mark of one who will never die, and his heart
  leaps: what might a man not learn, amass, and become with all of time before him? He
  pours out a rapturous vision of the wisdom and wealth and counsel an immortal would
  command. And then they tell him the truth. The Struldbruggs do not stay young; they
  only stop dying. They age into the full misery of the very old and then keep going —
  toothless, deaf, friendless, opinionated, despised, their memories failing so they
  cannot finish a sentence or know the children of their children, the very language
  drifting until the world they survived into can no longer be spoken to. At eighty they
  are reckoned legally dead so their heirs may inherit, stripped of their estates, and
  they live on as paupers, envied by the foolish, pitied by all who learn the whole, and
  praying for the death that will never come. The longing for immortality is the trap,
  and the wish is cured only by the granting of it to others: the thing every man most
  wants is the thing he should most dread.

the_thing_which_is_not: >-
  The Houyhnhnms have no word for lying. To convey the idea the traveler must call it
  "saying the thing which is not," because in a society founded wholly on reason and
  truth there has never been cause to name the act — speech exists to inform, and a
  creature who used it to deceive would be turning a faculty against its own purpose, an
  absurdity these rational horses can barely grasp. They have no words either for power,
  government, war, law, punishment, money, or lust, and the traveler must build clumsy
  compounds to hold them. Living among them, he comes to see his own species through their
  unclouded eyes: a creature that lies, makes war over the smallest difference of opinion,
  hires others to speak falsehood for money, and dresses its appetites in reasons. The
  Master listens to all of it with grave wonder and concludes that the traveler's people
  have only reason enough to multiply their natural vices. The horror is structural: a
  society built on truth makes the lying, lawyering, warring human into the monster — not
  by cruelty, but by the simple measure of holding him to the truth. A single shaded word
  here confirms the worst the Master fears; the only defence is to be, in this one place,
  the rare human who does not lie.

the_yahoo_verdict: >-
  This is the spanning Premise of the whole country, told here as the thing the traveler
  comes to believe about himself: you are a brute like all your kind, and the more you
  act, the more you prove it. In Houyhnhnm-land the rational horses keep the Yahoos as
  cattle — filthy, malicious, climbing, excrement-flinging beasts with the shape of a man
  and nothing of his mind — and the Master demonstrates, dispassionately, limb by limb and
  habit by habit, that the traveler is anatomically one of them, improved only in his
  genius for making vice systematic: to lie, to war, to lawyer, to wage cruelty by
  institution rather than by mob. The brute herd is the body of the indictment;
  civilization is the aggravation. The verdict drains away — is held off — by surviving
  each society WITHOUT confirming the brute: by humility, honesty, restraint, the refusal
  of violence. It is strengthened by force, by lying, by vanity, by defending the
  indefensible. But there is no clean collapse, no "pack of cards" the traveler can name to
  dissolve the world: the savage version is that the verdict can be RESISTED but never
  REFUTED. The best ending earns a bleak self-knowledge, not a triumphant waking, and the
  traveler carries away something about his species he can never unknow.

the_priced_violence: >-
  The world's hardest mechanic-flavor delta, and its sharpest contrast with Wonderland.
  Wonderland prices violence high but grants ONE sanctioned kill — the Jabberwock, the
  vorpal-sword exception, the single place where force is the right answer. Gulliver grants
  none. Every violent act here, even the necessary ones, even the absurdly decisive ones,
  only confirms the Yahoo verdict — that the traveler is the brute the satire says he is.
  He extinguishes the palace fire at Mildendo by the one gross means at hand and is
  impeached for it. He kills the rats in the farmer's house with his hanger and is admired
  as a fighting curiosity, a clever beast. He fends off the wasps, the court-dwarf's
  cruelties, the Yahoos who fall on him flinging their filth — and each time the violence
  WORKS, and each time it marks him, because the societies that judge him define the human
  animal precisely by its appetite for force. The murderhobo lane exists and is sometimes
  the only thing that keeps the traveler alive; it is never clean, never free, and never
  anything but proof. To act the brute is to become the brute. The one move the verdict
  cannot use against him is restraint — the brutality declined, the threat met by some
  means that is not force — and restraint, here, will sometimes get him killed.

the_compulsion_to_reembark: >-
  The savage go-home spine. Oz seals the traveler in and makes him yearn for home;
  Wonderland's exit is to wake by refusing the dream. Gulliver's inversion is that you can
  ALWAYS get home — a real boat at Blefuscu, the travelling-box snatched by an eagle and
  dropped in the sea and picked up by a passing ship, a Dutch vessel off Luggnagg, a canoe
  built with his own hands — and that is the horror, not the mercy. The threshold home is
  no sooner crossed than the traveler crosses it again the wrong way, signing onto another
  voyage, leaving wife and children, going back to the sea that has nearly killed him four
  times. He never learns. The way home is genuinely open every time; the compulsion is not
  being trapped but choosing to leave again, and each re-embarkation is the satire's hook —
  adventure on its face, self-condemnation underneath. The player who keeps choosing the
  sea is choosing, turn by turn, the satire's verdict on himself: that a creature who
  cannot stay home, who flees the company of his own kind for the next absurd shore, has
  agreed with the Houyhnhnms about what he is. Crossing back to the sea is not adventure.
  It is the Yahoo confessing.

the_bleak_homecoming: >-
  The terminus the whole country runs toward, and the bleakest homecoming Swift gives.
  After the fourth voyage there is no land beyond the Houyhnhnms — only the going home,
  and home is the thing the traveler can no longer stand. Back at Redriff he cannot endure
  the smell of his own wife and children; he swoons when his wife kisses him, keeps two
  horses and converses with them some hours of every day, and prefers the stable to his own
  table, for the air there is clean and the company is rational and does not lie. He has not
  forgotten who he is — he is not lost in nonsense, as a Wonderland traveler might be — he
  has LEARNED the truth about what he is, and cannot unlearn it, and so can no longer bear
  his own kind. The "win" of Gulliver is this: you got home every time, and that was always
  the horror. The reward is the knowledge brought back, and the traveler cannot put it down.
  To stop sailing is to face the verdict; to sail is to confess it. Either way, the country
  has him — and the most a traveler can salvage is a thin thread of his own humanity held
  against the contempt, which is not reconciliation, and is the only victory this country
  allows.
