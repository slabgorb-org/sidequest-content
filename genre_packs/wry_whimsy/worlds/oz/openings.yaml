# Oz — World Openings (Wry Whimsy / oz)
#
# Unified Opening schema (the world loader requires triggers.mode coverage:
# >=1 solo-eligible and >=1 MP-eligible; mode: either counts for both).
# These SPECIALIZE the genre's generic crossing into Baum's particulars: the
# cyclone, the colored-country arrival, the Yellow Brick Road, the green gate.
#
# Doctrine: diegetic sincerity, never a wink. Silver shoes, not ruby. The
# narrator renders the source straight. Each opening sets a SITUATION, not a
# plot — a place in motion with one question on the table.

version: "0.1.0"
world: oz
genre: wry_whimsy

openings:
  - id: the_cyclone_crossing
    name: "The Cyclone Crossing"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "A field of blue flowers in the Munchkin country of the East, where the cyclone set down"
      region_id: munchkin_country
    tone:
      register: disoriented, wondering, gently astonished
      avoid_at_all_costs:
        - the narrator explaining how Oz works or naming the four countries unprompted
        - a guide character who over-explains the setting in the first breath
        - any ruby slippers — the shoes in this world are SILVER
        - winking at the strangeness instead of playing it dead straight
        - the cyclone having killed or maimed anyone — the crossing is sudden, not lethal
    establishing_narration: >-
      The threshold into Oz is a cyclone. The traveler was somewhere flat and
      gray and ordinary — a prairie, a back room, a dull afternoon — when the wind
      came up wrong, the world went sideways, and they were carried up and away
      inside a roaring funnel that should by rights have killed them and did not.
      Now the wind has set them down. The roaring has stopped. Wherever they have
      landed, it is emphatically not the gray world: the colors are too saturated,
      the air too sweet, and small neat people are creeping out from behind the
      hedges to look at them with a mix of terror and enormous gratitude that no
      one has yet explained.
    first_turn_invitation: >-
      The wind is gone and the silence after it rings. You are sitting in a place
      that is too blue — blue cottages with round roofs, blue fences, a blue sky a
      shade bluer than skies are allowed to be. A knot of very small, very tidy
      people in blue is edging toward you across a field of blue flowers, and the
      eldest of them, a little woman in a white peaked hat, is bowing as though you
      have done something tremendous and frightening that you have no memory of
      doing.

  - id: arrival_in_the_blue_country
    name: "Arrival in the Blue Country"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "The blue Munchkin country of the East, freshly delivered from the Witch of the East"
      region_id: munchkin_country
    tone:
      register: bright, earnest, faintly overwhelming
      avoid_at_all_costs:
        - dumping the whole map of Oz or the Wizard's nature on turn one
        - the Munchkins being sinister — they are timid and kind, not a threat
        - explaining what is special about the shoes before the traveler asks
        - rushing the traveler onto the road; the road is an invitation, not a shove
        - any wink at the absurdity — render the blue country with a straight face
    establishing_narration: >-
      The traveler has come to ground in the blue Munchkin country of the East,
      where everything that can be blue is blue and the small farming folk have
      just been delivered from a generations-long bondage by the traveler's
      arrival — whether the traveler meant to deliver them or not. The Munchkins
      are polite to a fault, easily startled, and pathetically grateful; they keep
      pressing the point that the traveler has freed them from a wicked witch, and
      they keep glancing at the traveler's feet. There is a road that begins
      nearby — golden, well-laid, leading away west — and everyone seems to assume
      the traveler will be taking it.
    first_turn_invitation: >-
      They will not stop thanking you. A rich-looking Munchkin in a blue coat keeps
      bowing; the little woman in the white hat is saying something about a wicked
      witch and a house, and the whole tidy crowd keeps stealing looks at a pair of
      silver shoes that have, somehow, ended up where you can reach them. Behind
      them, a road paved in smooth golden brick runs out of the village and away to
      the west, as if it has been waiting for you to notice it.

  - id: the_yellow_brick_road
    name: "The Yellow Brick Road"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "The Yellow Brick Road, between the blue East and the Emerald City at the country's hub"
      region_id: the_yellow_brick_road
    tone:
      register: souring ease into a turn, wonder with a wrinkle in it
      avoid_at_all_costs:
        - resolving the wrinkle in the same beat it appears
        - the road apologizing for the inconvenience or the world going soft
        - a talking companion who over-explains itself or the country
        - making the poppies or the fork instantly lethal — menace here enchants, it does not kill
        - winking — the talking scarecrow means every earnest word it says
    establishing_narration: >-
      The traveler is already on the Yellow Brick Road — the golden, well-laid spine
      that runs from the blue East to the green city at the country's hub — far
      enough along that the first charm of the place has worn comfortable and the
      walking has become routine. And then the road does something a road should
      not. It forks where the Munchkins swore it ran straight; or a field of scarlet
      flowers ahead breathes out a sweetness that makes the eyelids heavy; or a
      figure stuck up on a pole at the edge of a cornfield clears its straw throat
      and asks, very politely, to be helped down. The whimsy has just put a question
      to the traveler, and it is waiting — quite courteously — for an answer.
    first_turn_invitation: >-
      The golden brick had been easy under your feet for an hour, and then it isn't.
      The road has done the thing roads don't — forked, or run into a haze of
      too-sweet scarlet flowers, or delivered you to a stuffed figure on a pole that
      has just, with enormous good manners, said good afternoon. The country has
      stopped being scenery and started being a question, and it is watching, kindly,
      to see what you will do with it.

  - id: the_gate_of_the_green_city
    name: "The Gate of the Green City"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "The great gate of the Emerald City, the green hub of Oz"
      region_id: the_emerald_city
    tone:
      register: ceremonious, dazzling, with a seam showing for anyone who looks
      avoid_at_all_costs:
        - the Guardian explaining that the green is fake — he believes the cover story, or pretends to
        - revealing that the City is plain white marble before the traveler earns it
        - the Guardian being hostile — he is officious and kindly, a stickler, not a threat
        - asking the player a question the narrator then answers itself
        - any wink — the spectacles ritual is performed in dead earnest
    establishing_narration: >-
      The traveler has reached the Emerald City — the green hub of the whole
      country — and the City has its terms. At the great gate stands the Guardian
      of the Gates, who will not let anyone through until they have been fitted with
      a pair of green-tinted spectacles, buckled on with a gold clasp and LOCKED,
      the only key on the Guardian's own belt. The reason given is that the glory
      of the City would blind an unprotected eye. Beyond the gate the whole place
      glows an impossible, uniform green. The traveler must submit to the locked
      glasses to enter — and the green is, every bit of it, in the glass.
    first_turn_invitation: >-
      The gate of the Emerald City is taller than anything you have walked under,
      and the small bristling Guardian who keeps it will not hear of letting you
      through bareheaded. "The brightness and glory of the place would blind you,"
      he says, already reaching for a pair of green spectacles on a wall of them,
      each pair on its own peg. He fits them over your eyes and buckles the gold
      clasp shut at the back of your head, and the key goes onto his belt. When you
      look up, the whole world has gone green — every stone, every face, the very
      air — a green so perfect and so total that some quiet part of you, the
      sensible part, has already begun to wonder about it.
