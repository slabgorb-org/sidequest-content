name: Winkie
summary: The gentle, industrious yellow-clad tinkers and workers of the West, freed from the Witch of the West
description: >-
  Winkies are the yellow folk of the West Country, where the land is the colour
  of butter and brass — yellow brick, yellow fields of grain, lamps of polished
  tin. For long years the wicked Witch of the West held them in slavery, working
  them in her castle and her fields; since a bucket of water put an end to her,
  they have been free, and they took the Tin Woodman for their beloved ruler.
  Winkies are gentle, patient, and clever with their hands — tinsmiths, lamplighters,
  bell-founders, menders of broken things. Their names ring a little of the
  workshop and the foundry, fond of soft jangling syllables. (Canon: Nick Chopper
  the Tin Woodman; Nimmie Amee, the Munchkin girl he was to wed.)
