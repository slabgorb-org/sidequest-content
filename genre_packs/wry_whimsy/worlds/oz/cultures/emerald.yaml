name: Emerald City
summary: The courtly, cosmopolitan green-clad city folk of the capital, where everyone wears green spectacles
description: >-
  The folk of the Emerald City are the cosmopolitans of Oz, gathered at the green
  heart of the land where the four countries meet. Within the city walls everything
  glitters green — green marble, green glass, green livery — and every citizen and
  visitor must wear locked green spectacles, so that the whole city dazzles like a
  single great jewel. These are court people: palace maids and guardsmen, ministers
  and footmen, clerks of the Wizard's old offices and now of Ozma's, all polished,
  formal, and fond of a fine title. Their names mix proper city given-names with
  the playful descriptive compounds of palace service — a soldier's name is half a
  job. (Canon: Jellia Jamb, the green-spectacled maid; Omby Amby, the Soldier with
  the Green Whiskers; the Guardian of the Gates.)
