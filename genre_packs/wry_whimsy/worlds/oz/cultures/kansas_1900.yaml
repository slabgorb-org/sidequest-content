name: Kansas 1900
summary: Ordinary turn-of-the-century rural Americans swept by cyclone out of the grey prairie into Oz
description: >-
  The Travelers are not Oz folk at all. They are plain people of the American
  Midwest at the turn of the twentieth century — homesteaders and farmwives,
  schoolteachers and railway men, mail-order clerks and itinerant preachers —
  caught up by a prairie cyclone and set down in a colored land that breaks every
  rule of the grey, dusty, hard-working world they knew. Dorothy Gale of a Kansas
  farm is the model and the first of them. Their dress is sober and practical:
  gingham and calico, suspenders and work boots, Sunday black and a good hat.
  Their names are the homely given-names of the 1900 census and plain American
  surnames; their place-words are the nouns of a frontier farm county — homestead,
  depot, mercantile, schoolhouse, prairie. They arrive bewildered, sensible, and
  entirely out of place, which is exactly the point. (Canon: Dorothy Gale, the
  small girl from Kansas; Uncle Henry and Aunt Em of the grey farm.)
