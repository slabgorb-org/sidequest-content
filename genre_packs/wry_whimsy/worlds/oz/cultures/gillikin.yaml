name: Gillikin
summary: The wilder, witch-haunted purple folk of the North, home to hedge-witches, rebels, and a hidden princess
description: >-
  Gillikins are the purple folk of the wild North Country, the least tamed quarter
  of Oz, where the hills go violet at dusk and the woods are thick with old enchantment.
  This is witch country: the hedge-witch Mombi worked her crooked magic here, and it
  was here she hid a stolen prince under a boy's name and a boy's chores. The Gillikins
  are bolder and stranger than the other peoples of Oz — quick to rebel (General Jinjur
  raised her Army of Revolt out of Gillikin girls), quick to mischief, and not above a
  little magic of their own. Their names lean to the odd, the crooked, and the
  whimsically invented, the way names do in a country where a boy might be a princess
  and a pumpkin might walk. (Canon: Mombi the hedge-witch; Tip, the hidden Ozma; General
  Jinjur of the Army of Revolt.)
