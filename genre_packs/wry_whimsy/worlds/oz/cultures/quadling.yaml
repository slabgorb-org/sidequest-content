name: Quadling
summary: The red-clad southern folk of Glinda the Good, with the strange borderlands of the Hammer-Heads and the Dainty China Country
description: >-
  Quadlings are the red folk of the South Country, ruled with kindness and wisdom
  by Glinda the Good, the loveliest of the Witches. Their land is all warm reds and
  rich crimson — red roofs, red fields of poppies and ripe fruit, red banners over
  Glinda's white-and-ruby palace. Quadlings are open-hearted, generous, and a little
  given to wonder, for the southern borderlands are full of strange neighbours: the
  rude, headbutting Hammer-Heads who guard the hill passes, and the fragile, formal
  people of the Dainty China Country, who must never be tipped over lest they crack.
  Quadling names are warm and rounded, with a courtly polish borrowed from Glinda's
  household.
