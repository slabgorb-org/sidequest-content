  - id: guardian_of_the_gates
    name: The Guardian of the Gates
    role: The keeper of the Emerald City gate — fitter of the green spectacles
    type: npc_supporting
    appearance: >-
      Half-length portrait of a small round adult man, fully clothed, modest,
      a plump cheerful face, a short pointed grey beard, round green-tinted
