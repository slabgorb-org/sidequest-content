  # ═══════════════════════════════════════════════════════════════
  # PLAYER-PICKER FACES — character-creation portrait options.
  # ═══════════════════════════════════════════════════════════════
  # PORTAL-FAIRYTALE RULE: the players are NOT Oz natives. Oz is a
  # world you are SWEPT INTO, Dorothy-Gale style. Every player-picker
  # face is an ORDINARY REAL PERSON FROM 1900 AMERICA — a homesteader,
  # a schoolteacher, a railway brakeman, a circus roustabout — newly
  # blown by cyclone into a colored land, still wearing the sober
  # gingham / calico / Sunday-black / work-boots dress of the turn-of-
  # the-century Midwest. They do NOT pick an Oz faction; they are the
  # outsiders the four countries react to.
  #
  # Face options offered at character creation, one montage-safe
  # head-and-shoulders per option. Schema: type=player_picker,
  # culture=culture filename stem (ALWAYS `kansas_1900` for pickers —
  # the StyleCatalog culture gate matches the file stem to this slug
  # exactly; cultures/kansas_1900.yaml supplies it), archetype=real
  # playable Traveler coping-style (pack-tier wry_whimsy/archetypes.yaml:
  # The Innocent / The Wit / The Surveyor / The Scrapper / The Dreamer),
  # sex, backdrop_poi (a real rendered Oz POI from R2 —
  # munchkin/winkie/quadling/gillikin_country, yellow_brick_road,
  # emerald_city(_gate), wizard_throne_room, china_country,
  # deadly_poppy_field, deadly_desert, witch_west_castle; the renderer
  # composes the newly-arrived traveler into it — appearance prose
  # carries NO background). `appearance` is PHYSICAL ONLY: face and
  # upper body in PERIOD-ACCURATE 1900 AMERICAN dress and physique,
  # rendered in the Denslow plate look — NO Oz regional collar-color
  # (these people just arrived; they are not color-coded to a quarter).
  # Allocation: 9M / 9F across 18 faces, era-diverse occupations, every
  # archetype represented. Naming: id `picker_kansas_<short_role>_<m|f>NN`.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Kansas homestead folk ─────────────────────────────

  - id: picker_kansas_farmwife_f01
    name: picker kansas farmwife f01
    role: Kansas Farmwife
    type: player_picker
    culture: kansas_1900
    archetype: The Innocent
    sex: female
    backdrop_poi: munchkin_country
    appearance: >-
      A plain, weather-worn farmwife of about forty-five just blown in from the
      grey Kansas prairie, with a broad sun-browned face, deep crow's-feet, a
      strong jaw, and a careworn mouth softened by easy kindness. Faded brown
      hair, streaked grey, is parted centre and drawn into a low practical bun.
      Mild grey eyes blink, dazzled, at all this colour. She wears a high-necked
      grey calico dress with a small white collar pinned at the throat and a
      faded gingham sunbonnet pushed back off the brow. Drawn in bold confident
      storybook outlines, flat soft fields, sturdy work-worn anatomy.

  - id: picker_kansas_homesteader_m01
    name: picker kansas homesteader m01
    role: Kansas Homesteader
    type: player_picker
    culture: kansas_1900
    archetype: The Scrapper
    sex: male
    backdrop_poi: munchkin_country
    appearance: >-
      A lean, hard-handed prairie homesteader of about fifty, freshly cyclone-
      tossed, with a long sunburnt face, a jutting cheekbone, a grizzled tobacco-
      brown moustache, and the deep squint-lines of a man who has stared down a
      lot of weather. Greying hair is flattened by a battered broad-brimmed felt
      hat. Steady, wary grey eyes set under heavy brows. He wears a collarless
      grey flannel work-shirt buttoned to the neck under faded denim overalls
      with one brass-buckled suspender showing. Drawn in bold storybook outlines
      and flat fields, rangy weathered anatomy, jaw set and braced.

  - id: picker_kansas_farmhand_m02
    name: picker kansas farmhand m02
    role: Kansas Hired Farmhand
    type: player_picker
    culture: kansas_1900
    archetype: The Innocent
    sex: male
    backdrop_poi: yellow_brick_road
    appearance: >-
      A big, slow-smiling hired farmhand of perhaps nineteen, gawking at the
      yellow road, with a round freckled face, a snub sunburnt nose, jug ears,
      and a wide gap-toothed grin of plain good nature. Straw-blond hair sticks
      up in a cowlick under a shapeless straw field-hat. Trusting pale-blue eyes
      open wide with guileless wonder. He wears a coarse grey homespun shirt open
      at a thick neck, the sleeves rolled past big raw-boned forearms, a single
      patched suspender over one shoulder. Drawn in bold storybook outlines and
      flat fields, broad ungainly farm-boy anatomy.

