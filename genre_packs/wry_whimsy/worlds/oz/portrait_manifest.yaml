  - id: hammer_heads
    name: The Hammer-Heads
    role: The wild Hammer-Heads — armless hill-folk who butt with hard heads
    type: npc_supporting
    appearance: >-
      Full-length figure of a squat wild man with no arms at all, a thick
      barrel body, short sturdy legs, and a broad flat hard-topped head set on
      a thick spring-like neck that telescopes forward, a wide coarse face with
      a jutting brow, a flat nose, a broad scowling mouth, shaggy hair. Drawn
      in bold confident outlines and flat fields, simplified comic-grotesque
      storybook anatomy. Wearing a rough plain belted tunic. Mid-lunge, the
      neck stretching the head forward to butt, a wild defiant pose. Plain flat
      ground.
    culture_aesthetic: >-
      Drab earthy flat fields, the armless body and the long stretching
      neck-and-hard-head the whole iconography, a comic-grotesque hill creature
      drawn wild but bloodless.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Fully clothed, non-sexualized depiction.
