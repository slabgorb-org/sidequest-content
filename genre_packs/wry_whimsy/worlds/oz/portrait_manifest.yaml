  - id: jinjur
    name: General Jinjur
    role: General of the Army of Revolt — a young captain of knitting-needles
    type: npc_major
    appearance: >-
      Half-length portrait of a pretty determined adult young woman, fully
      clothed, modest, a bright bold face, dark eyes, dark hair worn in a long
      braid, a confident set jaw and a faint commanding smile. Wearing a smart
      improvised soldier's costume — a fitted green-and-gold jacket with a row
      of bright buttons, a short cape, a small peaked cap set jauntily. A long
      polished knitting needle worn at the belt like a sword, one hand resting
      on its haft. An upright commanding pose. Plain flat ground.
    culture_aesthetic: >-
      Emerald-City register — green-and-gold improvised uniform, the knitting
      needle worn as a blade the signature gag-turned-iconography, a young
      revolutionary captain drawn bright and bold.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult woman, fully clothed, modest, correct
