  # ═══════════════════════════════════════════════════════════════
  # PLAYER-PICKER FACES — character-creation portrait options.
  # ═══════════════════════════════════════════════════════════════
  # Face options offered at character creation, one montage-safe
  # head-and-shoulders per option. Mirrors the seaboard_of_saints
  # pilot. Schema: type=player_picker, culture=culture filename stem,
  # archetype=real playable Traveler coping-style (pack-tier
  # wry_whimsy/archetypes.yaml: The Innocent / The Wit / The Surveyor
  # / The Scrapper / The Dreamer), sex, backdrop_poi (a real rendered
  # Oz POI; the renderer composes the subject into it — appearance
  # prose carries NO background). `appearance` is PHYSICAL ONLY: face
  # and upper body in golden-age Denslow/Baum portal-fairytale tone,
  # silver-not-ruby, wit over force. Regional dress shows only at the
  # collar (blue East / yellow West / red South / purple North / green
  # City). Allocation: every culture covered, 9M / 9F across 18 faces.
  # Naming: id `picker_<culture>_<short_role>_<m|f>01`.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Munchkin ──────────────────────────────────────────

  - id: picker_munchkin_farmwife_f01
    name: picker munchkin farmwife f01
    role: Munchkin Farm-Goodwife
    type: player_picker
    culture: munchkin
    archetype: The Innocent
    sex: female
    backdrop_poi: munchkin_country
    appearance: >-
      A short, round little woman of the blue East country, perhaps fifty,
      with a soft plump face, ruddy apple cheeks, and a small startled mouth.
      Her grey hair is parted dead-centre and pinned into two neat coils over
      her ears. Wide pale-blue eyes blink with nervous gratitude under thin
      brows. A pointed blue felt hat trimmed with little tinkling bells sits
      square on her head; a stiff blue collar buttons to her chin. Drawn in
      bold confident storybook outlines, flat soft fields, plump tidy anatomy.

  - id: picker_munchkin_fieldhand_m01
    name: picker munchkin fieldhand m01
    role: Munchkin Field-Hand
    type: player_picker
    culture: munchkin
    archetype: The Scrapper
    sex: male
    backdrop_poi: munchkin_country
    appearance: >-
      A small stocky young farmer of the East, barely past boyhood, with a
      broad sunburnt face, a snub nose, and a stubborn set to a wide jaw. His
      dark hair is cropped blunt under a round-brimmed blue hat hung with bells;
      a thick neck rises from a buttoned blue smock-collar. Close-set brown
      eyes glower with the new, untested defiance of the lately-freed. Short and
      knobbly-knuckled. Drawn in bold storybook outlines and flat blue fields,
      sturdy simplified anatomy, chin tucked and braced.

