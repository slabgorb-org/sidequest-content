  - id: winged_monkey_king
    name: The King of the Winged Monkeys
    role: King of the Winged Monkeys — bound to the Golden Cap's three commands
    type: npc_major
    appearance: >-
      Half-length figure of a large monkey with broad feathered wings folded
      high behind the shoulders, a clever lined face, bright sharp eyes, a
      grizzled muzzle, a small jeweled band or crown on the brow. Brown-furred
      with darker wing feathers, drawn in bold confident outlines and flat
