# =============================================================================
# Oz (wry_whimsy) — PORTRAIT MANIFEST
# =============================================================================
# Portrait prompt SPECS for the named Oz roster. Renderer: Z-Image Turbo (no
# negative_prompt). The world visual_style.yaml positive_suffix carries the
# Denslow 1900 medium / four-country palette / silver-not-ruby / not-MGM
# exclusions and the safety clause, appended to EVERY render. Entries here
# describe the SUBJECT only.
#
# SOURCE FIDELITY (1900 novel + Denslow plates, NOT the 1939 film):
#  - Silver shoes, never ruby slippers.
#  - The Scarecrow is a painted-sack face on a Munchkin-farmer body, blue
#    Munchkin coat, pointed blue hat, straw at every cuff.
#  - The Tin Woodman is articulated jointed tin, a funnel cap, an axe.
#  - The Witch of the West is a small one-eyed old woman with an umbrella and
#    a peaked hat — NOT green-skinned (green skin is a 1939 invention).
#  - The Wizard is a small ordinary old humbug, no wizardry on his person.
#
# DISCIPLINE (from PROMPTING_Z_IMAGE.md):
#  - Faces described as PHYSICAL FACT, never as impression/expression editorial
#    ("manic", "unsettling") — that drifts the render cartoony.
#  - Every negation phrased positively ("bareheaded or a plain cap", not "no
#    hat").
#  - Named colors are deliberate selective hand-tints over the flat plate; the
#    regional color (blue/yellow/red/purple/green) is keyed by costume here.
#  - "adult" + SOUL modesty clause for every human; animal subjects carry the
#    "no text" cleanup but not the human-anatomy/modesty clause.
#  - element_visual carries the per-entry cleanup; matches the five_points
#    manifest schema (appearance / culture_aesthetic / element_visual).
# =============================================================================

characters:

  # ===========================================================================
  # THE COMPANIONS
  # ===========================================================================

  - id: the_scarecrow
    name: The Scarecrow
    role: The straw man who wants brains — a Munchkin farmer's scarecrow
    type: npc_major
    appearance: >-
      Full-length figure of a scarecrow built like a man, a soft sack head
      with a flat painted face — two round dot eyes, a small painted nose, a
      wide painted mouth turned up at one corner, all in simple ink lines.
      Wisps of yellow straw poking out at the neck, the cuffs of the sleeves,
      and the tops of the boots. Wearing a faded Munchkin-blue belted coat
      and pointed blue peasant hat, patched trousers, worn boots, the limbs
      stuffed loose and slightly bowed. Standing with arms a little out from
      the sides, an amiable tilted-head pose.
    culture_aesthetic: >-
      Munchkin East register — blue coat and pointed blue hat as the keyed
      regional color, pale straw-yellow accents, plain flat ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: the_tin_woodman
    name: The Tin Woodman
    role: The man of tin who wants a heart — a woodcutter rusted whole
    type: npc_major
    appearance: >-
      Full-length figure of a man built entirely of bright tin, jointed at the
      shoulders, elbows, hips, and knees with riveted seams and hinge plates,
      a smooth tin face with a simple kind expression, a small funnel worn as a
      cap tilted on the head. The whole body the bluish silver-grey of polished
      tin with darker tin shadow lines. Holding a long-handled woodcutter's
      axe with a bright tin blade resting head-down at his side, the other hand
      open. A small oilcan tucked at the belt. Upright, gentle, attentive pose.
    culture_aesthetic: >-
      Polished tin silver-grey as the dominant tone, the bright axe blade and
      the funnel cap doing the iconographic work, plain flat ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: the_cowardly_lion
    name: The Cowardly Lion
    role: The great timid lion who wants courage — king of beasts, afraid
    type: companion_creature
    appearance: >-
      Full-length figure of a very large lion standing on all four paws, a
      huge tawny-gold mane framing a broad expressive face with big soft
      worried eyes and a long muzzle, a tufted tail curled nervously, oversized
      soft paws. Drawn in bold confident outlines with flat tawny-gold and
      warm-brown fields, the mane a darker amber, simplified storybook anatomy,
      a gentle frightened tilt to the head and lowered brow. No human clothing.
    culture_aesthetic: >-
      Tawny-gold and warm amber flat fields, an oversized timid king-of-beasts
      drawn for warmth not menace, plain flat ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: toto
    name: Toto
    role: Dorothy's little dog — the one ordinary creature in Oz
    type: companion_creature
    appearance: >-
      Full figure of a small shaggy black terrier with bright dark eyes, a
      little black nose, short legs, and a stub of an upright tail, ears
      half-pricked, the tongue just showing in a small open mouth. Drawn in
      bold confident outlines with flat solid black fur and a few white
      highlight breaks, simplified lively storybook anatomy, an alert
      bright-eyed pose mid-trot. No clothing.
    culture_aesthetic: >-
      Solid flat black against a plain pale ground, a small lively ordinary
      dog, the one creature in Oz that does not talk.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  # ===========================================================================
  # THE POWERS
  # ===========================================================================

  - id: the_wizard
    name: "Oz, the Great and Terrible"
    role: The humbug ruler of the Emerald City — a small ordinary old man
    type: npc_major
    appearance: >-
      Half-length portrait of a small bald adult man of about sixty, fully
      clothed, modest, a round kindly face, a wrinkled brow, small bright eyes,
      clean-shaven with a soft double chin, an apologetic almost embarrassed set
      to the mouth. Wearing a plain ordinary dark frock coat over a buttoned
      waistcoat and a white collar, no wizardly robe and no wand — the dress of
      a circus showman caught out of costume. One hand half-raised in a small
      placating gesture. A plain pale flat ground.
    culture_aesthetic: >-
      Emerald-City register — a faint green accent at the collar or cuff for
      the City, but the figure himself plain and unmagical, the humbug behind
      the curtain shown without his tricks.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult man, fully clothed, modest, correct
      human anatomy, natural hands and fingers, non-sexualized depiction.

  - id: glinda
    name: Glinda the Good
    role: The Good Witch of the South — the rightful, gentle power of the land
    type: npc_major
    appearance: >-
      Half-length portrait of a beautiful adult woman, fully clothed, modest,
      young and tall in bearing, a serene kind face, clear eyes, long flowing
      red hair worn loose about the shoulders, a calm gracious smile. Wearing a
      flowing pure-white gown with soft draped folds and a high neckline, a thin
      jeweled circlet or coronet at the brow. Both hands resting gently before
      her, one lightly holding a slender wand at rest. An upright benevolent
      pose. Plain pale flat ground.
    culture_aesthetic: >-
      Quadling South register — white gown with red-keyed accents (the circlet
      jewel, a red sash) and the flowing red hair, gentle and radiant, Art-
      Nouveau grace.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult woman, fully clothed, modest gown,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

  - id: witch_of_the_west
    name: The Wicked Witch of the West
    role: The Wicked Witch of the West — a small one-eyed old tyrant
    type: npc_major
    appearance: >-
      Half-length portrait of a small wizened adult old woman, fully clothed,
      modest, ordinary fair-pink wrinkled skin (not green skin), a single eye
      set in a deeply lined sharp face, the other eye covered, a hooked nose, a
      thin hard mouth, grey hair tucked under a tall peaked black hat. Wearing a
      plain dark dress with a yellow-keyed apron or sash for the Winkie country
      she rules. Carrying a closed umbrella gripped like a stick in one hand.
      A small severe domineering pose. Plain pale flat ground.
    culture_aesthetic: >-
      Winkie West register — yellow accents on a dark dress, the peaked hat and
      the umbrella doing the iconographic work, an old-woman tyrant drawn small
      and sharp, emphatically pink-skinned not green.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult woman, fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

  - id: witch_of_the_north
    name: The Good Witch of the North
    role: The Good Witch of the North — the kindly little old greeter
    type: npc_supporting
    appearance: >-
      Half-length portrait of a small kindly adult old woman, fully clothed,
      modest, a round wrinkled gentle face, bright pale eyes, white hair, a
      warm grandmotherly smile, slightly stooped. Wearing a flowing white gown
      dotted with little stars, a tall pointed white hat with a small brim hung
      with tiny bells, the whole touched with blue-keyed accents for the
      Munchkin and Gillikin lands she watches over. Both hands folded warmly
      before her, a welcoming pose. Plain pale flat ground.
    culture_aesthetic: >-
      North/Gillikin register — white starred gown with blue-and-silver
      accents, the belled pointed hat the signature, a tiny benevolent
      greeter, Denslow warmth.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult woman, fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

  - id: mombi
    name: Mombi
    role: The old witch of the North country — a hidden, hoarding crone
    type: npc_major
    appearance: >-
      Half-length portrait of a thin adult old woman, fully clothed, modest, a
      narrow lined face, a sharp jutting chin, a long nose, small hard glinting
      eyes, grey-white hair pulled back severe under a faded headcloth. Wearing
      a worn dark country dress and a long apron with deep pockets, a heavy ring
      of old keys at the waist, a purple-keyed shawl for her northern Gillikin
      country drawn close about the shoulders. One hand clutching the shawl, the
      other half-curled and secretive. A guarded watchful pose. Plain flat
      ground.
    culture_aesthetic: >-
      Gillikin North register — purple shawl as the keyed regional color over
      a drab dark dress, the ring of keys and the deep apron pockets the
      iconography of a hoarder, a sharp hidden-witch crone.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
