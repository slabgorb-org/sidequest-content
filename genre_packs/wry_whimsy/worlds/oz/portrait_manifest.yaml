  - id: field_mouse_queen
    name: The Queen of the Field Mice
    role: Queen of the Field Mice — small sovereign of the meadow rescue
    type: npc_supporting
    appearance: >-
      Full figure of a small grey field mouse standing upright on her hind
      legs, large round dark eyes, big thin ears, delicate whiskers, a long
      thin tail curled behind, tiny paws held together before her. A very small
