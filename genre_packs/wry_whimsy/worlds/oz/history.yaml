# Oz — World History (Wry Whimsy / oz)
#
# The PAST of the country, not a campaign arc: how the fairyland came to be,
# how it was carved up, how the humbug came to rule the hub, and how the
# rightful heir was hidden. Story-Now framing — these are hooks, anchored
# facts, and named figures, not session gates or a predetermined resolution.
#
# `chapters:` here are ERAS of Oz's past, ordered oldest to most recent. Each
# carries `tropes:` instance-refs the era seeds — every id resolves against the
# resolved trope set (world tropes.yaml ids ∪ genre tropes.yaml ids). These
# tropes are seeded LATENT (status: dormant), primed for the Living World to
# advance toward; nothing here triggers or resolves them.

chapters:

  # ── ERA 1 — THE FAIRY ENCHANTMENT ──────────────────────────────────────────
  - id: the_enchantment
    label: "The Enchantment — How Oz Became a Fairyland"
    era: "the old days, before memory"
    atmosphere: >-
      Before it was strange, Oz was only a country — fields and forests and
      plain people, no different from the gray lands beyond the sand. Then a
      fairy queen passed over it and laid an enchantment on the whole, and ever
      after the years sat light on a body, the animals took to talking, and the
      dead grew careless about staying dead. No Munchkin can date it; the
      enchantment is simply the weather of the place, the first fact under all
      the others.
    established_facts:
      - "Oz is an enchanted fairyland, not an ordinary country — this is its oldest and most basic truth."
      - "The enchantment is the reason creatures talk, the years pass lightly, and death is rare and often reversible inside the seal."
      - "The Deadly Desert has ringed and sealed the country for as long as anyone remembers; the seal is older than any living power."
    hooks:
      - "A traveler who asks how long ago the enchantment fell gets a shrug — no one keeps the count, and Oz does not mind."
      - "The gentleness of Oz is a property of the enchantment, not of luck; the country mostly wants the traveler to win."
    tropes:
      - id: enchantment_not_kill
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the country's whole low-lethality character descends from the fairy enchantment."
      - id: deadly_desert
        status: dormant
        progression: 0.0
        notes:
          - "The sealed border is established here as the country's oldest fixed fact."

  # ── ERA 2 — THE WITCHES' CARVE-UP ──────────────────────────────────────────
  - id: the_carve_up
    label: "The Carve-Up — The Four Witches Quarter the Country"
    era: "the witch-age, generations past"
    atmosphere: >-
      With no king the fairyland would obey, the country fell to its witches.
      Four wicked ones took the four quarters and ruled what they had seized;
      two good ones held the North and the South against them. The Wicked Witch
      of the East bound the blue Munchkins into bondage and kept the silver
      shoes on her own feet; the Wicked Witch of the West yoked the whole yellow
      Winkie nation and won the Golden Cap that commands the Winged Monkeys.
      This is the shape of power the traveler walks into: a quartered country,
      its real authority female, its wickedness lodged in two of the four.
    established_facts:
      - "Four wicked witches once held the four colored quarters; two good witches held North and South."
      - "The Wicked Witch of the East enslaved the Munchkins of the blue East and owned the silver shoes."
      - "The Wicked Witch of the West enslaved the Winkies of the yellow West and owned the Golden Cap and the Winged Monkeys."
      - "Glinda the Good holds the red South; the kindly Witch of the North holds the purple Gillikin country."
      - "Real power in Oz is female — every quarter's true ruler, good or wicked, is a witch."
    hooks:
      - "The silver shoes are a witch-treasure loose in the world, their full power unknown even to their wearer."
      - "The Golden Cap commands the Winged Monkeys exactly three times before it passes to a new owner — a finite, precious force."
      - "The two enslaved nations, Munchkin and Winkie, both wait on a deliverance neither can manage alone."
    tropes:
      - id: water_weak_tyrant
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Witch of the West's reign of terror and her absurd water-weakness are established as standing facts."
      - id: enchantment_not_kill
        status: dormant
        progression: 0.0
        notes:
          - "The witches enslave and transform rather than kill — bondage, not graves."

  # ── ERA 3 — THE HUMBUG IN THE BALLOON ──────────────────────────────────────
  - id: the_humbug_arrives
    label: "The Humbug Arrives — A Wizard Comes Down Out of the Sky"
    era: "within living memory"
    atmosphere: >-
      Then a humbug came up in a balloon out of the gray world beyond the sand,
      blown off course at a fair, and came down in the middle of the country
      among people who had never seen a balloon and took the man in it for a
      great sorcerer. He had no magic at all. He let them believe it, built
      himself a green city at the very hub of the four quarters, fitted every
      eye that entered with green spectacles so the plain white marble would
      read as emerald, and ruled the City from behind a curtain by a booming
      voice and clever tricks — a Head, a Lady, a Beast, a Ball of Fire, each
      one paint and wire and ventriloquism. He keeps the City prosperous and
      frightened, and he knows, privately and sadly, exactly how thin it all is.
    established_facts:
      - "The Wizard came to Oz by balloon from the ordinary world and was mistaken for a sorcerer."
      - "He has no real magic; he rules the Emerald City entirely by illusion and showmanship."
      - "He built the Emerald City at the hub of the four quarters and fitted its gate with the locked green spectacles."
      - "He presents himself only in false shapes — a Head, a Lady, a Beast, a Ball of Fire — never his true form."
      - "The Wizard is the public master of the City; the witches remain the true powers of the four quarters."
    hooks:
      - "The Wizard's whole reign is a seam waiting to be seen through — anyone who looks behind the curtain gets the truth."
      - "The green of the Emerald City is in the glasses, not the city; the spectacles' only key is kept by the Guardian of the Gates."
      - "The Wizard fears the witches he cannot match, and would dearly love to go home in his patched old balloon."
    tropes:
      - id: green_spectacles
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the green-spectacles humbug is established as the City's permanent standing condition."
      - id: impossible_authority
        status: dormant
        progression: 0.0
        notes:
          - "Genre-tier parent — the hollow booming authority of the Wizard, findable as humbug."

  # ── ERA 4 — THE HIDDEN PRINCESS ────────────────────────────────────────────
  - id: the_hidden_heir
    label: "The Hidden Heir — A Princess Given to the Hedge-Witch"
    era: "within living memory, kept secret"
    atmosphere: >-
      Beneath the witches' quarters and the humbug's hub runs a wrongness no one
      in the country knows to name: the rightful sovereign of all Oz is a
      princess, and she is not on any throne. She was hidden — enchanted out of
      her own shape and given into the keeping of a crooked old hedge-witch in
      the wild purple North, where no one would think to look for a queen. The
      men hold the public power and are frauds or stand-ins; the true claim sits
      disguised and unaware, even to itself. Glinda the Good already knows more
      of this than she has told. It is the country's deepest secret, and it
      waits.
    established_facts:
      - "The rightful ruler of all Oz is a hidden princess, enchanted out of her own shape and kept by a hedge-witch in the purple Gillikin North."
      - "The hedge-witch Mombi guards the enchantment that conceals the heir."
      - "The men who hold public power — the Wizard above all — are humbugs or stand-ins keeping a throne warm that is not theirs."
      - "Glinda the Good already holds the secret of the rightful heir, and has not yet acted on it."
    hooks:
      - "A wrongness about who truly rules Oz can be SENSED long before it can be solved — it hums under every other matter."
      - "An overlooked child or servant in the wild North may be more than they appear, even to themselves."
      - "The payoff is restoration, not a kill: the disguise undone and the right name spoken — but that is the long game, not a thing to trigger early."
    tropes:
      - id: lost_princess
        status: dormant
        progression: 0.0
        notes:
          - "PRIMED BUT LATENT — the deep matriarchal-reveal hook. Seeded at zero, advanced only across the long game; never resolved by history."
      - id: enchantment_not_kill
        status: dormant
        progression: 0.0
        notes:
          - "The heir is hidden by transformation, not death — the enchantment is reversible, waiting on the right counter."

  # ── POI LANDSCAPE MANIFEST (scripts/generate_poi_images.py) ─────────────────
  #
  # This chapter is NOT an era — it carries no tropes and seeds nothing. It
  # exists only to enumerate Oz's renderable landscapes for the POI image
  # pipeline, which reads chapters[].points_of_interest[] exclusively.
  #
  # Z-Image discipline:
  #   - visual_prompt.solo is the renderable PLACE only. Style/medium/palette
  #     (Denslow 1900 pen-and-ink-in-flat-color) is appended automatically by
  #     visual_style.yaml positive_suffix at render time — do NOT repeat it here.
  #   - Each prompt is a WIDE establishing landscape with foreground /
  #     middle-ground / background structure and explicit lighting.
  #   - The dominant printed color is keyed to the region depicted (Munchkin
  #     East blue, Winkie West yellow, Quadling South red, Gillikin North
  #     purple, Emerald City green-only-through-the-spectacles).
  #   - Source-faithful Baum, NEVER the 1939 film: silver shoes not ruby; the
  #     Witch of the West is a one-eyed old woman with an umbrella, not green-
  #     skinned; the Emerald City is white marble whose green lives in the
  #     locked spectacles.
  - id: the_country_of_oz
    label: "The Country of Oz — Renderable Landscapes"
    era: "the country as the traveler walks it"
    atmosphere: >-
      The standing places of Oz, country by country, gate by gate — the four
      colored quarters around their green hub, the golden road that ties the
      East to the center, the lone tower in the West, and the killing sand that
      seals it all. This chapter holds no era's tropes; it is the map made
      renderable, nothing more.
    points_of_interest:

      # ── EAST — BLUE ────────────────────────────────────────────────────────
      - name: The Munchkin Country
        slug: munchkin_country
        region: munchkin_country
        type: country
        description: >-
          The blue East of Oz, where everything that can be blue is: round-roofed
          blue cottages, blue rail fences in neat rows, and broad fields of blue
          flowers. A tidy farming country of small, timid, lately-freed folk, and
          the place where a cyclone-blown traveler most often comes to ground.
        visual_prompt:
          solo: >-
            Wide establishing landscape view across a tidy farming country where
            everything is blue. Foreground: a field of small blue star-shaped
            flowers in long rows, a low blue-painted rail fence with rounded
            posts crossing the frame. Middle ground: three squat cottages with
            high domed round roofs, blue-washed walls and round arched doors, set
            among small square fields divided by more blue fencing, a single
            scarecrow on a pole standing in a far plot. Background: gentle
            scalloped blue-green hills rolling to a wide pale sky with a few
            rounded clouds. Bright clear mid-morning light from the left, the
            blue of the country deepening toward the hills.
          backdrop: >-
            A tidy blue farming country of high domed round-roofed cottages and
            low blue rail fences among small square fields of blue flowers,
            scalloped blue-green hills behind under a wide pale sky.

      # ── THE GOLDEN SPINE ───────────────────────────────────────────────────
      - name: The Yellow Brick Road
        slug: yellow_brick_road
        region: the_yellow_brick_road
        type: road
        description: >-
          A road paved in smooth golden brick, well-laid and easy to follow,
          winding from the blue Munchkin country in the East to the green city at
          the hub. The safe spine of any new traveler's first journey.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of a winding road paved in smooth
            golden-yellow brick. Foreground: the road in the near corner, each
            yellow brick clearly outlined, curving away from the viewer. Middle
            ground: the golden road snaking in a long S-curve through open green
            and blue countryside, past a cornfield with a single scarecrow on a
            pole and a small rounded copse of trees, low rail fences along its
            edge. Background: at the far end of the road, the small distant
            silhouette of a green-towered city rising on the flat horizon under a
            wide pale sky. Warm clear afternoon light, the road catching the sun
            as a bright gold ribbon through the land.
          backdrop: >-
            A golden-yellow brick road winding in a long curve through open green
            countryside toward the small distant silhouette of a green-towered
            city on the flat horizon, low rail fences along its edge.

      # ── CENTER — GREEN (THROUGH THE SPECTACLES) ────────────────────────────
      - name: The Emerald City
        slug: emerald_city
        region: the_emerald_city
        type: city
        description: >-
          The dazzling green city at the hub of the four quarters, seen as every
          visitor sees it through the locked green spectacles — green walls, green
          towers, green domes, green light. The green is in the glasses; the city
          itself is plain white marble.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of a dazzling city where absolutely
            everything is the same shade of bright green, as if seen through green
            glass. Foreground: a broad green-paved approach road and a low green
            wall. Middle ground: a great walled city of tall slender green towers,
            rounded green domes and green spires crowded close, every surface,
            window, banner and roof tinted the identical emerald green, sunlight
            glinting green off the domes. Background: more green towers receding
            into a faint green haze under a green-washed sky. Brilliant even
            daylight, the whole scene saturated in a single unnatural green as
            though the very air were green glass.
          backdrop: >-
            A dazzling walled city of tall slender towers, rounded domes and
            spires where every surface is tinted the identical bright emerald
            green, receding into a faint green haze under a green-washed sky.

      - name: The Gate of the Emerald City
        slug: emerald_city_gate
        region: the_emerald_city
        type: gate
        description: >-
          The great green gate of the city, where the Guardian of the Gates fits
          every entering eye with a pair of green spectacles, buckled and locked
          on, before they may pass into the green within.
        visual_prompt:
          solo: >-
            Wide establishing view of a great arched city gate set in a high green
            wall. Foreground: a broad paved forecourt before the gate, a few
            spectacle-frames hanging on pegs to one side. Middle ground: an
            enormous green arched gateway studded with green-glass jewels in its
            stonework, its tall iron-bound doors standing open, a small green-clad
            gatekeeper figure beside a wall-rack hung with rows of green-tinted
            spectacles on hooks, each pair with a little locking buckle. Through
            the open arch, a glimpse of bright green streets and towers beyond.
            Background: the high green city wall stretching away to either side
            under a pale sky. Bright clear daylight, the gate green against the
            paler outer country.
          backdrop: >-
            A great green arched city gate studded with green-glass jewels, its
            doors open on bright green streets beyond, a wall-rack of green-tinted
            spectacles on hooks beside it, set in a high green city wall.

      - name: The Throne Room of the Wizard
        slug: wizard_throne_room
        region: the_emerald_city
        type: landmark
        description: >-
          The great green hall at the heart of the City, a vast domed chamber of
          green marble with a high empty throne, where the Wizard appears only in
          false shapes and rules from behind a curtain by trickery and a booming
          voice.
        visual_prompt:
          solo: >-
            Wide establishing interior view of a vast domed throne hall, every
            surface the same bright green marble. Foreground: a long bare green
            marble floor leading inward, polished and empty. Middle ground: a
            huge empty green throne raised on a stepped dais at the center beneath
            the dome, oversized and unoccupied; to one side a tall folding screen
            or curtain stands slightly ajar, behind it the suggestion of levers,
            speaking-tubes and a painted prop-head on a stand. Background: a high
            ribbed green dome rising overhead, tall narrow green windows along the
            walls letting in green light. Dim, theatrical, faintly ominous green
            light pooling around the empty throne, deep shadow behind the curtain.
          backdrop: >-
            A vast domed hall of bright green marble with a huge empty raised
            throne at its center and a folding curtain ajar to one side hinting at
            levers and a painted prop-head, lit by dim theatrical green light.

      # ── WEST — YELLOW ──────────────────────────────────────────────────────
      - name: The Winkie Country
        slug: winkie_country
        region: winkie_country
        type: country
        description: >-
          The yellow West of Oz: yellow fields, yellow brick, yellow-clad folk,
          kindly and skilled with their hands but lately bowed down. A duller,
          more clouded country than the others, under the long shadow of the
          Witch who ruled it.
        visual_prompt:
          solo: >-
            Wide establishing landscape view across a yellow western country under
            a brooding sky. Foreground: stubbled yellow fields and a worn yellow-
            brick path, a few drooping yellow sunflowers. Middle ground: low
            yellow-walled cottages and a tinsmith's workshop with hammered metal
            wares hung outside, rolling yellow-ochre hills rising beyond them, the
            land emptier and more downtrodden than a happy country, a few small
            bowed figures at work in the fields. Background: tall steel-grey storm
            clouds massing over the yellow hills, a single shaft of pale light
            breaking through. Heavy, low, late-afternoon light, the cheerful
            yellow of the land dimmed under the gloom of the West.
          backdrop: >-
            A yellow western country of low yellow-walled cottages and worn
            yellow-brick paths among rolling ochre hills, dimmed and downtrodden
            under tall steel-grey storm clouds massing on the horizon.

      - name: The Castle of the Wicked Witch of the West
        slug: witch_west_castle
        region: winkie_country
        type: castle
        description: >-
          The lone yellow-stone tower from which the one-eyed old Witch of the
          West ruled the Winkie nation by terror, mistress of the Golden Cap and
          the Winged Monkeys, who kept all water far from her dried-up skin.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of a single lone tower over an empty
            yellow country. Foreground: a bare dusty yellow track winding up past a
            dry stone well-head. Middle ground: one tall, narrow, crooked tower of
            pale yellow stone, a single small barred window high near its conical
            roof, a low yellow curtain wall about its base, a few dark winged shapes
            wheeling above its peak. Background: bleak rolling yellow hills under a
            heavy darkening sky. Stark, lonely, late-day light low from the left, a
            long shadow thrown across the yellow ground.
          backdrop: >-
            A single tall crooked tower of pale yellow stone with one high barred
            window and a low curtain wall, standing alone over bleak yellow hills,
            dark winged shapes wheeling above it under a heavy darkening sky.

      - name: The Deadly Poppy Field
        slug: deadly_poppy_field
        region: the_yellow_brick_road
        type: field
        description: >-
          A vast field of scarlet poppies astride the road, so brilliant and so
          deadly-sweet that their perfume puts any living thing that lingers among
          them into a sleep from which it may never wake.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of an immense field of scarlet-red
            poppies stretching from edge to edge. Foreground: huge nodding scarlet
            poppy blossoms on tall green stems crowding right up to the viewer,
            the golden-brick road just visible cutting a thin line into them.
            Middle ground: an unbroken sea of brilliant red poppies rolling away
            in every direction, the road swallowed and lost among them, the air
            above shimmering with a faint sweet haze. Background: a far line of
            green hills and a small distant green city, almost veiled behind the
            heavy red glare and the soft drowsy haze. Warm, heavy, overripe light,
            the red almost too bright, a sleepy thickness hanging over the field.
          backdrop: >-
            An immense unbroken sea of brilliant scarlet poppies rolling to the
            horizon under a faint sweet shimmering haze, a thin golden-brick road
            lost among them, far green hills veiled behind the heavy red glare.

      # ── SOUTH — RED ────────────────────────────────────────────────────────
      - name: The Quadling Country
        slug: quadling_country
        region: quadling_country
        type: country
        description: >-
          The red South of Oz: red roads, red roofs, red-clad folk, a fair and
          well-governed country under Glinda the Good — the one quarter where the
          traveler meets a power that is exactly what it appears to be.
        visual_prompt:
          solo: >-
            Wide establishing landscape view across a fair and prosperous country
            where everything is red. Foreground: a red-paved road and a low red-
            brick wall, a bed of deep-red flowers along it. Middle ground: neat
            cottages with steep red-tiled roofs and red-washed walls set among
            well-kept red-fenced gardens and orchards heavy with red fruit, a
            slender red-banner pole, the land orderly and content. Background: soft
            scalloped rose-red hills and, far off, the pale towers of a great fair
            castle catching the light, under a warm sky. Clear gentle late-morning
            light, the red of the country rich and welcoming rather than harsh.
          backdrop: >-
            A fair prosperous country of steep red-tiled cottages and red-fenced
            gardens among scalloped rose-red hills, the pale towers of a great
            castle rising far off, under a warm welcoming sky.

      # ── NORTH — PURPLE ─────────────────────────────────────────────────────
      - name: The Gillikin Country
        slug: gillikin_country
        region: gillikin_country
        type: country
        description: >-
          The purple North of Oz, the wildest and least-traveled quarter: purple
          hills, purple thickets, dark hedges, and crooked hedge-witches in
          cottages no road quite reaches.
        visual_prompt:
          solo: >-
            Wide establishing landscape view across a wild, trackless purple
            country. Foreground: a tangle of dark purple thorn-hedge and bramble
            crowding a faint half-lost footpath, deep-purple thistles and tall
            weeds. Middle ground: rough purple thickets and dark twisted trees
            climbing rolling purple hills, a single crooked little cottage with a
            steep mossy roof half-hidden among the hedges and a thread of smoke
            from its bent chimney, no road reaching it. Background: deeper purple
            ridges receding wild and untamed into a dusky violet sky with a low
            rising moon. Cool, dim, late-dusk light, the purple of the land
            deepening toward night, lonely and witch-haunted.
          backdrop: >-
            A wild trackless purple country of dark thorn-hedges, twisted trees
            and rolling purple hills, a single crooked cottage half-hidden among
            the brambles, deeper violet ridges receding under a dusky moonrise.

      # ── THE BORDER — THE ONE LETHAL THING ──────────────────────────────────
      - name: The Deadly Desert
        slug: deadly_desert
        region: the_deadly_desert
        type: desert
        description: >-
          The band of pale, restless sand that rings the whole of Oz and seals it
          from the gray world beyond — sand that turns any living thing that
          touches it instantly to dry dust. The one genuinely lethal thing in the
          gentle country.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of a hard, forbidding border where a
            living country ends in killing sand. Foreground: the last green-and-
            colored grass of Oz cut off in a sharp shimmering line, and beyond it a
            small heap of grey dust and a few crumbling fragments where something
            living strayed onto the sand. Middle ground: a vast flat sweep of pale
            stippled sand drawn into restless drifting ripples, utterly bare, a haze
            of heat rising off it. Background: the far side lost in a wall of
            shimmering heat-haze, no opposite shore, an empty bleached sky. Harsh
            flat overhead light, no shadow, the sand pale and lethal and endless.
          backdrop: >-
            A forbidding border where colored country ends in a sharp shimmering
            line and an endless waste of pale restless rippling sand begins, the
            far side lost in shimmering heat-haze under a bleached empty sky.

      # ── A QUEER LITTLE CORNER OF THE SOUTH ─────────────────────────────────
      - name: The Dainty China Country
        slug: china_country
        region: quadling_country
        type: landmark
        description: >-
          A queer little country walled off behind a low wall, where everything —
          the ground, the houses, the people, the animals — is made of fine living
          porcelain, tiny and brittle and easily broken.
        visual_prompt:
          solo: >-
            Wide establishing landscape view of a tiny, dainty country made
            entirely of glazed porcelain, behind a low wall. Foreground: the top of
            a smooth low china wall, glossy and rounded, with a small porcelain
            stile to climb over. Middle ground: a miniature country of doll-sized
            china houses with glazed pastel walls and gold-edged roofs, little
            porcelain fences, and small delicate figures of porcelain people, a
            porcelain cow and milkmaid, all smooth and gleaming as fine crockery,
            one or two with a hairline crack. Background: low rolling china-smooth
            hills in glazed pastels under a bright sky, light glancing off the
            glossy porcelain.
          backdrop: >-
            A tiny dainty country made entirely of glazed porcelain behind a low
            glossy china wall — doll-sized pastel houses with gold-edged roofs,
            little fences and small porcelain figures, all gleaming like fine
            crockery under bright light.
