  # ===========================================================================
  # PLAYER-PICKER PORTRAITS
  # ---------------------------------------------------------------------------
  # Faces a player chooses at character creation — native inhabitants of
  # Wonderland and Looking-Glass Land, cast across the world's three cultures
  # (Card Folk, Chesspieces, Creature Folk). Archetype names draw from the
  # playable genre Traveler coping-styles (Innocent / Wit / Surveyor /
  # Scrapper / Dreamer) where they fit, plus world NPC archetypes. PHYSICAL
  # face / upper-body only, montage-safe, no background prose. backdrop_poi
  # values are real rendered POIs from r2_manifest.json. Render is a separate
  # operator step.
  # ===========================================================================

  # ── Picker · Card Folk ──

  - id: picker_card_folk_gardener_m01
    name: picker card folk soldier gardener m01
    role: Card Soldier Gardener
    type: player_picker
    culture: card_folk
    archetype: The Scrapper
    sex: male
    backdrop_poi: the_queens_croquet_ground
    appearance: >-
      A flat oblong of painted pasteboard standing on edge, the body a single
      thin playing-card bearing the three black pips of the Two of Spades, a
      small round printed face at the top. Stiff jointed arms of pasteboard, a
      spade-pip cap pulled low, a smear of red rose-paint across one painted
      cheek. The face holds a wide-eyed terrified stare, mouth pressed into a
      thin straight line.

  - id: picker_card_folk_herald_m01
    name: picker card folk herald m01
    role: Card Court Herald
    type: player_picker
    culture: card_folk
    archetype: The Surveyor
    sex: male
    backdrop_poi: the_hall_of_justice
    appearance: >-
      A court-card figure, a flat heraldic Knave printed in red and gold on
      pasteboard, a long narrow painted face beneath a flat crown-like cap. A
      pointed waxed mustache and a small forked beard inked onto the card, the
      brows arched high. A stiff ruffed collar of painted lace frames the
      throat, a herald's trumpet held upright against one shoulder.

