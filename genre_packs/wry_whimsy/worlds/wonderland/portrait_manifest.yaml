    backdrop_poi: the_tweedle_wood
    appearance: >-
      A carved chesspiece Red Knight, a stern man in dark crimson-painted
      armour, a square hard-jawed face under a raised visor, a short bristling
      black beard. Heavy down-drawn brows over fierce narrow eyes, a long scar
      carved down one cheek, a tall red horse-crest behind the helm. The
      armour is angular and battered, fists set against the breastplate.

