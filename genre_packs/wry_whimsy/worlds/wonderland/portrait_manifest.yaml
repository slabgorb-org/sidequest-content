# =============================================================================
# Wonderland (wry_whimsy) — PORTRAIT MANIFEST
# =============================================================================
# Portrait prompt SPECS for the named Wonderland / Looking-Glass roster.
# Renderer: Z-Image (mflux; high_fidelity z-image by default — see
# visual_style.yaml header). The world visual_style.yaml positive_suffix carries
# ONLY the Tenniel 1865/71 wood-engraving MEDIUM (line / paper / hand-tint) and
# the safety clause — appended to EVERY render in the world. It carries NO
# casting: as of 2026-06-02 the flat-card / carved-chesspiece / waistcoated-beast
# register was REMOVED from the suffix because it was polluting POI landscapes.
# That casting now lives HERE, per character, in each `appearance` field below
# (and in each POI's `visual_prompt.solo` for scenes). Entries here describe the
# SUBJECT ONLY (no style words — no "engraving", "Tenniel", "Victorian",
# "plate"; the suffix adds the medium).
#
# SOURCE FIDELITY (1865 Alice's Adventures + 1871 Through the Looking-Glass,
# Tenniel's original plates):
#  - Court figures are FLAT heraldic playing-card pasteboard with printed
#    faces — never realistic humans.
#  - Chess figures (the two Queens, the Red King, the White Knight) are
#    Tenniel's carved wooden chesspieces — never realistic humans.
#  - The Cheshire Cat is a broad striped tabby with a huge fixed grin, body
#    fading at its edges — never a purple cartoon cat.
#  - The Jabberwock is a genuine monster (long buck teeth, talons, vast bat-
#    wings) fearsome by physical fact, not by mood words.
#
# DISCIPLINE (from PROMPTING_Z_IMAGE.md):
#  - Faces/forms described as PHYSICAL FACT, never as impression/expression
#    editorial ("manic", "unsettling") — that drifts the render cartoony.
#    A sneer is stated as facial STRUCTURE (set jaw, downturned mouth), not mood.
#  - Every negation phrased positively ("ordinary tabby markings, not a single
#    flat colour" → here always written as the positive alternative).
#  - "adult" + SOUL modesty clause for every humanoid figure (the Hatter,
#    Duchess, Cook, the four monarchs, the Knave, the White Knight, the
#    Tweedles); animal / object / card / chesspiece subjects carry the "no text"
#    cleanup but not the human-anatomy/modesty clause.
#  - element_visual carries the per-entry cleanup; matches the five_points /
#    Oz manifest schema (appearance / culture_aesthetic / element_visual).
# =============================================================================

