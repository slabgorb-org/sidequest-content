  # ===========================================================================
  # PLAYER-PICKER PORTRAITS
  # ---------------------------------------------------------------------------
  # Faces a player chooses at character creation. TWO POOLS as of the 2026-07
  # expansion (mirrors the oz world's fix for the same flagship gap: 20/20
  # pickers were victorian_english, zero were Wonderland-native).
  #
  # VICTORIAN POOL (unchanged) — THIS IS A PORTAL FAIRYTALE: the players are
  # NOT Wonderland natives. They are ORDINARY REAL ENGLISH PEOPLE of 1865 —
  # the year Carroll published Alice's Adventures — who fall down the
  # rabbit-hole / step through the looking-glass and find the country of
  # nonsense strange. The model is Alice Liddell: a well-bred English child of
  # the cathedral close meeting impossible logic with stubborn manners. They
  # belong to the mid-Victorian world above (governesses, choristers, divinity
  # students, curates, footmen, milliners, clerks, schoolchildren, gardeners'
  # boys, ladies and gentlemen of the house) and are cast in the single
  # world-level culture `victorian_english`.
  #
  # WONDERLAND-NATIVE POOL (2026-07 addition) — culture: card_folk | chesspieces
  # | creature_folk (cultures/<stem>.yaml), each brought to >= 3 faces. A
  # player may instead sit down already a piece of Wonderland's own furniture:
  # a flat heraldic playing-card pasteboard figure (card_folk), a carved
  # wooden chesspiece given a face and arms (chesspieces), or a waistcoated
  # talking beast (creature_folk) — per the SOURCE FIDELITY casting rule at
  # the top of this file. No named canon individual (the Queen/King/Knave of
  # Hearts, the Red/White Queen, the White Knight, the March Hare, etc.) is
  # ever a pickable face; each entry is a generic, un-storied member of that
  # culture's population, invented within the culture file's own naming space.
  #
  # SHARED SCHEMA (both pools): culture=culture filename stem (StyleCatalog
  # gate: the file STEM must match this slug EXACTLY or the render dies with
  # CatalogMissError). Archetypes are real values from wry_whimsy/archetypes.yaml
  # only (The Innocent / The Wit / The Surveyor / The Scrapper / The Dreamer —
  # "The Weary Soldier" is NOT an archetype, it is a typical_class shared by
  # The Surveyor and The Scrapper; two pre-existing victorian entries that
  # miscast it as an archetype were corrected to their nearest real archetype
  # in this same 2026-07 pass). Each appearance is PHYSICAL face/upper-body
  # only stated as drawn fact (no style words — no "engraving", "Tenniel",
  # "Victorian"; the world portrait_positive_suffix adds the medium), ending
  # on the face/expression like the other pickers so it renders in the
  # world's Tenniel engraving look. backdrop_poi values are real rendered
  # POIs from r2_manifest.json / history.yaml — newcomers are placed at
  # neutral arrival / wood / waterside POIs they could plausibly stumble
  # into; natives are placed at POIs proper to their own country. Render is
  # a separate operator step.
  # ===========================================================================

  # ── Picker · Victorian English (women) ──

