    type: player_picker
    culture: chesspieces
    archetype: The Scrapper
    sex: male
    backdrop_poi: the_chessboard_country
    appearance: >-
      A carved wooden chesspiece given life, a White Knight shaped as a man in
      ill-fitting tin armour, the helm pushed up off a long mild face with a
      drooping grey mustache and soft sad eyes. The armour hangs loose and
      dented at the shoulders, a small carved horse-head crest rising behind,
      odd tin oddments and a mousetrap strapped across the chest-plate.

  - id: picker_chesspieces_pawn_m01
    name: picker chesspieces white pawn m01
    role: White Pawn
    type: player_picker
    culture: chesspieces
    archetype: The Innocent
    sex: male
    backdrop_poi: the_garden_of_live_flowers
    appearance: >-
      A short rounded carved-wood chesspiece pawn turned living, a small round
      cheerful face on a stout pale bulb-shaped body, the wood pale and lightly
      grained. A rounded smooth head with no hair, wide bright eyes and full
      rosy cheeks, a tiny upturned nose. Short stubby carved arms held out, the
      mouth open in eager wonder.

