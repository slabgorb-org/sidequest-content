      A carved chesspiece Red Queen, sharp and upright, a thin exacting face
      painted deep crimson, a tall spiked crown set precisely level. Hair drawn
      back smooth and tight, dark level brows over keen narrow eyes, a firm
      straight mouth. A high stiff collar and a rigidly upright bearing, the
      chin held flat and the gaze fixed steadily ahead.

