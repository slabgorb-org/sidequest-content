      Full-length figure of a white rabbit standing upright on its hind legs,
      a long-eared rabbit face with round eyes and small spectacles perched on
      the nose, drawn in confident outlines with flat white fur. Wearing a
      checked waistcoat over a small coat with a turned collar, neat kid gloves
      on the forepaws. One paw holding out a large round pocket-watch on a
      chain, the other lifted as if hurrying. An upright fretful pose, ears
      slightly back.
    culture_aesthetic: >-
      Waistcoated-beast register — the checked waistcoat, gloves, and pocket-
      watch the whole iconography, white fur with a restrained period tint,
      plain pale ground.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

