    name: picker card folk courtier f01
    role: Card Court Lady
    type: player_picker
    culture: card_folk
    archetype: The Wit
    sex: female
    backdrop_poi: the_coronation_feast
    appearance: >-
      A court-card Queen of Diamonds, flat pasteboard painted in red and yellow,
      a smooth oval face with high-set painted eyes and small bow-shaped lips.
      Fair printed ringlets tucked under a flat pointed diadem set with a single
      diamond pip, a high stiff collar of painted lace. The chin tilts slightly
      up, the painted brows raised in cool amusement.

  - id: picker_card_folk_gardener_f01
    name: picker card folk gardener f01
    role: Card Soldier Gardener
    type: player_picker
    culture: card_folk
    archetype: The Innocent
    sex: female
    backdrop_poi: the_garden_of_live_flowers
    appearance: >-
      A slim flat playing-card of Hearts, two red heart-pips on the pasteboard
      front, a small round freckled painted face at the top. A wide-brimmed
      gardener's straw hat tipped back, soft printed curls beneath, a streak of
      red paint dabbed on the painted nose. The eyes are large and round, the
      mouth open in a small startled O.

  - id: picker_card_folk_knave_f01
    name: picker card folk knave f01
    role: Card Court Knave
    type: player_picker
    culture: card_folk
    archetype: The Dreamer
    sex: female
    backdrop_poi: the_hall_of_justice
    appearance: >-
      A tall flat Knave of Hearts on red-bordered pasteboard, a single red
      heart-pip at the shoulder, a long fine-boned painted face. Dark printed
      hair falling in straight bands beside the cheeks under a narrow gold
      circlet, the painted eyes downcast and half-closed. A drooping painted
      mouth, the head leaning a little to one side as if dreaming.

  # ── Picker · Chesspieces ──

  - id: picker_chesspieces_knight_m01
