# Wonderland — World Openings (Wry Whimsy / wonderland)
#
# Unified Opening schema (the world loader requires triggers.mode coverage:
# >=1 solo-eligible and >=1 MP-eligible; mode: either counts for both).
# These SPECIALIZE the genre's generic crossing into Carroll's particulars: the
# White Rabbit, the long slow fall down the hole past the shelves and maps, and
# the landing in the Hall of Doors where the size-game begins at once.
#
# Doctrine: diegetic sincerity, never a wink. Tenniel and Carroll, never the
# 1951 cartoon. The narrator renders the source straight. Each opening sets a
# SITUATION, not a plot — a place in motion with one question on the table.

version: "0.1.0"
world: wonderland
genre: wry_whimsy

openings:
  - id: down_the_rabbit_hole
    name: "Down the Rabbit-Hole"
    triggers:
      mode: solo
      backgrounds: []
    setting:
      location_label: "The Hall of Doors at the bottom of the rabbit-hole, a low passage of locked doors all round"
    tone:
      register: drowsy curiosity sharpening into wonder, gently bewildered
      avoid_at_all_costs:
        - the narrator explaining how Wonderland works or naming its inhabitants unprompted
        - any wink at the absurdity — the fall and the doors are played dead straight
        - making the fall frightening or lethal — it is long, slow, and dreamlike, never a plunge to harm
        - resolving the size-game in the same breath it is introduced — the bottle and the cake are an invitation, not a solution
        - the Disney register — no singing, no doorknob with a face; this is Tenniel and Carroll
    establishing_narration: >-
      The threshold into Wonderland is a fall. The traveler was sitting on a bank
      on a hot, dull afternoon, heavy-eyed and bored, when a White Rabbit in a
      waistcoat hurried past muttering that it was late — and, fatally curious, the
      traveler followed it across the field and straight down the large rabbit-hole
      under the hedge, never once stopping to consider how in the world they were to
      get out again. The hole went straight on like a tunnel and then dipped
      suddenly down, and the traveler fell. But the fall was slow — so slow they had
      time to look about them: the well was lined with cupboards and bookshelves,
      maps and pictures hung upon pegs, and they passed a jar marked ORANGE
      MARMALADE, quite empty, which they dared not drop for fear of killing somebody
      underneath. Down, down, down. And then, with a soft thump on a heap of dry
      leaves, the fall was over, and the traveler stood unhurt in a long, low hall
      lit by a row of lamps, with doors all round it, every one of them locked.
    first_turn_invitation: >-
      The White Rabbit is just ahead — "Oh my ears and whiskers, how late it is
      getting!" — and gone down a passage before you can call out. The long hall is
      lined with doors, and you have tried every one and they are all locked. On a
      little three-legged table of solid glass there is a tiny golden key; and low
      in the wall, behind a curtain you had not noticed, there is a door no more than
      fifteen inches high that the key turns sweetly in — beyond it the loveliest
      garden you ever saw, far too small to put even your head through. On the table
      now, where there was nothing a moment ago, stands a little bottle labelled, in
      large letters, DRINK ME. What do you do?

  - id: the_party_falls_together
    name: "The Party Falls Together"
    triggers:
      mode: mp
      backgrounds: []
    setting:
      location_label: "The Hall of Doors at the bottom of the rabbit-hole, a low passage of locked doors all round"
    tone:
      register: shared bewilderment, drowsy wonder, companions clutching at each other
      avoid_at_all_costs:
        - one traveler explaining Wonderland to the others — none of them have been here
        - the narrator naming the size-rules or what the bottle does before anyone tastes it
        - separating the party in the fall — they land together, in a heap, on the leaves
        - any wink — the absurdity is sincere, and the travelers take it seriously
        - the Disney register — Tenniel and Carroll, no songs, no cartoon doorknob
    establishing_narration: >-
      The threshold into Wonderland is a fall, and this time more than one of you
      took it. A White Rabbit in a waistcoat hurried past muttering that it was
      late, and — whether you all chased it together, or one bolted after it and the
      rest gave chase to stop them — every one of you went down the large rabbit-hole
      under the hedge, one after another, and none of you stopped to think how you
      were to get out again. The fall was long and strangely slow: time enough to
      call to one another down the dark, time enough to see the well was lined with
      cupboards and bookshelves, maps and pictures on pegs, and an empty jar marked
      ORANGE MARMALADE that the foremost of you dared not drop for fear of braining
      whoever fell below. Down, down, down — and then a soft thump, and another, and
      another, as you came to rest, unhurt and tangled together, on a great heap of
      dry leaves at the bottom of a long, low hall whose doors stood all round you,
      every one of them locked.
    first_turn_invitation: >-
      The White Rabbit is already vanishing down a side-passage — "Oh my ears and
      whiskers!" — and not one of you is quick enough to catch it. You pick
      yourselves up in a low hall lit by a row of lamps, with doors on every side,
      and a quick check shows every door locked fast. On a little glass table in the
      middle stands a tiny golden key; behind a low curtain none of you spotted at
      first is a door barely fifteen inches high, and through its keyhole the
      loveliest garden any of you ever saw — far too small for so much as a head to
      pass. And on the glass table, where you would all swear there was nothing a
      moment ago, sits one small bottle labelled, in large plain letters, DRINK ME.
      There is one bottle, one key, and the lot of you. What do you do?
