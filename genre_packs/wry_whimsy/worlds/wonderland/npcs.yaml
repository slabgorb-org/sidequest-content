# Wonderland — the runtime roster (the "Monster Manual").
#
# These are the named figures of Lewis Carroll's Wonderland, rendered straight
# from Alice's Adventures in Wonderland (1865) and Through the Looking-Glass
# (1871). Card Country and Looking-Glass Land, played dead-straight: the watch,
# the mushroom, the grin without a cat, the tarts, the rigged race, the wall,
# the vorpal blade. NEVER the Disney gloss — the menace and the comedy both
# come from each figure sincerely running its own canonical business.
#
# RUNTIME-WIRED. The loader reads worlds/<slug>/npcs.yaml and injects every entry
# below into game-state as a pre-generated "NPC nearby, not yet met" (ADR-059 —
# the anti-improvisation gaslighting layer). This file is ALSO the world's
# Living-World engine: a separate faction_agendas.yaml was dropped as unwired, so
# each figure's drive lives HERE, in its history_seeds, as a standing, unresolved
# goal — the Rabbit's errand, the Queen's beheadings, the Red Queen's drill, the
# Gardeners' terror, Humpty's redefinitions, the Jabberwock's hunt.
#
# SCHEMA: AuthoredNpc (sidequest-server/sidequest/genre/models/authored_npc.py,
# extra="forbid"). Keys: id, name, pronouns, role, ocean, appearance, age,
# distinguishing_features, history_seeds, initial_disposition. There is NO
# npc_role field in the runtime model — the canonical 9-set role
# (mentor/herald/shadow/threshold/host/artisan/authority/victim/mook) is carried
# in the free-text `role:` string, leading each line as a bracketed tag so it is
# both human-meaningful and machine-greppable, matching the role assignments in
# this world's archetypes.yaml. OCEAN follows the shipped npcs.yaml convention
# (oz, glenross, five_points, coyote_star): { O, C, E, A, N } on a 0.0–1.0 scale.
# initial_disposition per ADR-020, integer -100..100. Voice tics live in
# history_seeds as prose; the narrator extracts them.
#
# DOCTRINE: source-fidelity over Disney; diegetic sincerity, never a wink; the
# nonsense is earnest, not winking. The two Queens are the powers; the Kings are
# asleep or ineffectual — honor the gender current in every goal. One creature is
# genuinely lethal (the Jabberwock); everything else menaces by absurdity,
# pedantry, terror-theater, or sheer ontological dread, never the kill.

version: "0.1.0"
world: wonderland

npcs:

  # ── CARD COUNTRY — THE 1865 BOOK ────────────────────────────────────────────

  - id: white_rabbit
    name: "The White Rabbit"
    pronouns: "he/him"
    role: "[herald] The anxious herald who runs the Queen's errands; always, always late"
    ocean: { O: 0.35, C: 0.65, E: 0.5, A: 0.55, N: 0.85 }
    appearance: >-
      A white rabbit with pink eyes, dressed like a small flustered gentleman in
      a waistcoat, with a watch he hauls out of a waistcoat-pocket and consults in
      a fresh panic every few steps. He trots, he frets, he mutters "Oh dear! Oh
      dear! I shall be too late!" and bolts down holes and across courtyards with
      a herald's white gloves in one paw and a fan in the other, forever on an
      errand for someone he is far more afraid of than any stranger. He drops the
      gloves and the fan when he is rattled, which is constantly.
    age: "a grown rabbit, harried beyond his years"
    distinguishing_features:
      - "a waistcoat-watch he pulls out and checks in mounting panic, never once satisfied with the time"
      - "white kid gloves and a fan he is forever clutching, dropping, and scrambling after"
      - "a trumpet and a long scroll when he is on official business — herald to the court of Hearts"
    history_seeds:
      - >-
        GOAL (standing, Living-World): get to the Queen on time, and never be the
        cause of a delay she might punish. The Rabbit's whole motion in the world
        is errand and dread — he is hurrying somewhere for Her Majesty at every
        moment, and the engine that drives him is not curiosity about the traveler
        but the terror of being late to the court of Hearts. He will press a
        stranger into service ("Why, Mary Ann, what ARE you doing out here?") sooner
        than lose another minute.
      - >-
        He mistakes a traveler for a servant when he is in a hurry, which is always,
        and sends them off after gloves and fans with the imperious fluster of a man
        too frightened of his betters to be polite to his inferiors. He is petty
        downward and craven upward, and entirely sincere in both directions.
      - >-
        Voice in his own register — breathless, fretting, self-interrupting. "Oh
        dear! The Duchess! The Duchess! Oh! won't she be savage if I've kept her
        waiting!" Consults the watch mid-sentence and loses his thread. Bolts at the
        first sign of trouble. Render the panic dead straight: he is genuinely
        afraid, and the comedy is that he is afraid of being late, of all things,
        in a country where time itself has gone wrong.
    initial_disposition: 5

  - id: the_caterpillar
    name: "The Caterpillar"
    pronouns: "he/him"
    role: "[threshold] Supercilious blue smoker on the mushroom; keeper of the size-charm"
    ocean: { O: 0.7, C: 0.5, E: 0.3, A: 0.2, N: 0.25 }
    appearance: >-
      A large blue caterpillar, exactly three inches high, sitting on the top of a
      tall mushroom with its arms folded, quietly smoking a long hookah and taking
      not the smallest notice of the traveler nor of anything else. It looks down
      its considerable length with half-lidded, contemptuous eyes, removes the
      hookah from its mouth only to deliver a single deflating question, and puts
      it back. The mushroom it sits on is the one thing in Wonderland that can set
      a traveler's size right — and the Caterpillar knows it, and is in no hurry to
      say so.
    age: "three inches, and on the very edge of changing into something else"
    distinguishing_features:
      - "a long hookah it smokes with insufferable calm, releasing one languid question at a time"
      - "the mushroom — one side makes the eater grow, the other makes them shrink, and only it knows which is which"
      - "a flat refusal to be impressed, hurried, or addressed without first answering its questions"
    history_seeds:
      - >-
        GOAL (standing, Living-World): be left in peace to smoke and to change, and
        to make any creature that disturbs it account for itself first. The
        Caterpillar wants nothing from the traveler and will give nothing easily; it
        is on the brink of its own transformation into a butterfly and regards the
        whole fuss of a lost, resizing stranger as beneath its notice. The size-charm
        is dispensed only to one who has endured the cross-examination.
      - >-
        Its single piece of practical help — "One side will make you grow taller,
        and the other side will make you grow shorter" — is given grudgingly, late,
        and without specifying which side is which, so that the traveler must learn
        the mushroom by trial. It is the gatekeeper of scale in a country where
        being the wrong size is the whole problem.
      - >-
        Voice in its own register — languid, superior, deflating. "Who are YOU?"
        delivered as the rudest possible greeting. "Why?" and "What size do you want
        to be?" delivered as though the answers were obvious and the traveler a
        fool for not having them ready. Recites criticism of a creature's recited
        poem with cold precision. Never raises its voice; never needs to.
    initial_disposition: -10

  - id: the_cheshire_cat
    name: "The Cheshire Cat"
    pronouns: "it/its"
    role: "[mentor] The one creature that tells plain truth — the guide who will not guide"
    ocean: { O: 0.85, C: 0.35, E: 0.55, A: 0.5, N: 0.2 }
    appearance: >-
      A large cat with an enormous, fixed grin, sitting in a tree or appearing on a
      bough where a moment ago there was nothing, regarding the traveler with the
      lazy good nature of a creature that knows exactly how mad everything is and is
      perfectly comfortable with the fact. It vanishes when it pleases — sometimes
      all at once, sometimes very slowly, beginning with the tail and ending with
      the grin, which remains for some time after the rest of it has gone, hanging
      in the air. It cannot be caught, cornered, or beheaded, having no body for the
      axe to find when it wishes not to.
    age: "as old as the riddle of where it goes when it isn't there"
    distinguishing_features:
      - "a grin that outlasts the rest of it — the last thing to fade and the first thing to return"
      - "the trick of vanishing and reappearing at will, slowly or all at once, anywhere it likes"
      - "the only candid tongue in Wonderland: it says the true thing plainly and then declines to help with it"
    history_seeds:
      - >-
        GOAL (standing, Living-World): observe, amuse itself, and tell the truth
        without ever being pinned to a course of action. The Cat is the one figure
        in Wonderland that is honest — "we're all mad here," it says, and means it,
        and proves it — but its honesty is not the same as help. It points down
        every road at once ("that way lives a Hatter, and that way a March Hare;
        visit either you like, they're both mad"), confirms that the traveler is mad
        too for being there at all, and then fades, grin last, leaving the choosing
        to them.
      - >-
        It is the guide who will not guide. Where the Caterpillar withholds and the
        Queen commands, the Cat simply tells the truth and shrugs — it will answer
        any question put to it accurately, including the unwelcome ones, but it takes
        no side, runs no errand, and accepts no obligation. It cannot be made to lie
        and cannot be made to stay.
      - >-
        Voice in its own register — calm, amused, maddeningly reasonable. "We're all
        mad here. I'm mad. You're mad." Proves its logic with a straight face: "a dog
        growls when it's angry and wags its tail when it's pleased; I growl when I'm
        pleased and wag my tail when I'm angry — therefore I'm mad." Vanishes
        mid-conversation and reappears to finish a point no one asked it to finish.
        The grin is always sincere and always unhelpful.
    initial_disposition: 15

  - id: the_duchess
    name: "The Duchess"
    pronouns: "she/her"
    role: "[host] Moral-spouting mistress of the pepper-kitchen; nurse to a baby that becomes a pig"
    ocean: { O: 0.4, C: 0.45, E: 0.6, A: 0.35, N: 0.6 }
    appearance: >-
      An ugly, sharp-chinned, sharp-elbowed great lady, by turns savage and
      smothering, found first in a small kitchen so thick with pepper that everyone
      in it sneezes without pause. She nurses a squalling baby by tossing it up and
      down and bawling a lullaby of violence at it, then thrusts it at any passing
      stranger without warning and stalks off to play croquet with the Queen. Later,
      out of the kitchen and the pepper, she turns suddenly and alarmingly
      affectionate, digging her dreadful little chin into a companion's shoulder and
      finding a smothering moral in absolutely everything.
    age: "a great lady of uncertain and ill-tempered middle years"
    distinguishing_features:
      - "a baby she handles like a parcel — and which, swaddling and all, quietly turns into a pig in the carrying"
      - "a pepper-choked kitchen she rules between bouts of croquet at the Queen's pleasure"
      - "a moral wrung out of every remark, however little the remark will bear one"
    history_seeds:
      - >-
        GOAL (standing, Living-World): stay in the Queen's good graces (no easy thing
        — she is under sentence of execution herself half the time) and find the
        moral in everything. The Duchess oscillates between the savage and the
        smothering as it suits her standing at court; her drive is to court whatever
        power is in the room and to lecture whoever is beneath her, and she will turn
        on a coin from snarling at a baby to cooing over a stranger the instant the
        wind of favor shifts.
      - >-
        The baby is hers to mishandle and hers to discard — she flings it at a
        passing traveler ("here, you may nurse it a bit if you like, I've got to go
        and get ready to play croquet with the Queen") and is gone before anyone can
        refuse. In the carrying, the swaddled thing grunts, snouts, and is plainly a
        pig; render the transformation deadpan and let the traveler notice it, as the
        Duchess herself never does.
      - >-
        Voice in her own register — two registers. In the kitchen: snarling,
        sneezing, slinging the baby and the blame. Out of it, on the croquet ground:
        unctuous, clinging, chin in the shoulder. "Everything's got a moral, if only
        you can find it." Tack ME a moral, she means, onto the world whether it fits
        or not. Both registers played dead straight: she believes the morals, and she
        fears the Queen, completely.
    initial_disposition: -5

  - id: the_cook
    name: "The Cook"
    pronouns: "she/her"
    role: "[mook] The Duchess's cook; over-pepperer and flinger of crockery"
    ocean: { O: 0.2, C: 0.4, E: 0.65, A: 0.15, N: 0.7 }
    appearance: >-
      A furious cook leaning over the fire of the Duchess's kitchen, stirring a
      great cauldron of soup that is plainly nothing but pepper, with more pepper
      in the air than in the pot. She tastes nothing, seasons everything past all
      reason, and when crossed — or when not crossed, when merely in the mood —
      she snatches up whatever is to hand and hurls it: fire-irons, saucepans,
      plates, dishes, a rain of crockery flung at the Duchess, the baby, and
      anyone foolish enough to stand between. She does not argue; she throws.
    age: "indeterminate; soured by smoke and pepper"
    distinguishing_features:
      - "a cauldron of soup that is nine-tenths pepper, set over a fire she never leaves"
      - "an arm that flings fire-irons, saucepans, and crockery at the least provocation, or none"
      - "a settled refusal to take any notice of being shouted at, ducked from, or reasoned with"
    history_seeds:
      - >-
        GOAL (standing, Living-World): season the soup and defend the kitchen with
        whatever comes to hand. The Cook is a small, perfect engine of domestic
        violence — she over-peppers because that is how soup is made, as far as she
        is concerned, and she throws crockery because that is how a kitchen is run.
        Neither act is malice exactly; both are simply her trade, performed with
        total conviction and no interest whatsoever in the consequences.
      - >-
        She makes the Duchess's kitchen unliveable on purpose and by temperament both
        — the pepper that sets everyone sneezing is hers, and the barrage of saucepans
        is the kitchen's weather. A traveler who lingers will be peppered, deafened,
        and very possibly struck; the Cook will not notice they were there.
      - >-
        Voice in her own register — barely any. She grunts, she snorts, she answers
        a question by flinging a dish at the questioner's head. The one full sentence
        anyone gets out of her is contempt. Render her as a hazard with a temper, not
        a conversationalist: the room is the threat, and she is the room's worst
        feature.
    initial_disposition: -25

  - id: the_hatter
    name: "The Hatter"
    pronouns: "he/him"
    role: "[host] Host of the endless tea-party, stuck at six o'clock; riddler with no answers"
    ocean: { O: 0.75, C: 0.3, E: 0.7, A: 0.4, N: 0.55 }
    appearance: >-
      A wild-haired man in a tall hat with a price ticket still stuck in the band
      (10/6 — he never took it off the shelf-price), seated at the head of a long
      table laid for a great many more guests than ever come, in a perpetual
      teatime that the clock will not release him from. He talks in riddles he
      cannot answer, makes personal remarks that are very rude indeed, dips his
      watch in his tea and butters it, and moves round and round the table to a
      fresh clean place rather than ever wash a cup. He has quarrelled with Time
      itself, and Time, in revenge, has stopped the day at six o'clock forever.
    age: "frozen at the hour of his quarrel with Time"
    distinguishing_features:
      - "a tall hat marked 10/6, the price ticket never removed"
      - "a watch that tells the day of the month but not the hour, kept buttered and dipped in tea"
      - "a riddle with no answer — 'Why is a raven like a writing-desk?' — posed to every newcomer and never solved"
    history_seeds:
      - >-
        GOAL (standing, Living-World): get through the endless tea, and never, ever
        wash up. The Hatter's whole existence is the consequence of having murdered
        the time (he was beating it, you see, at a concert) — Time stopped at six,
        teatime, and there it has stayed, so the party never ends and the cups are
        never cleaned: the only escape is to keep moving round the table to the next
        clean setting. His drive is to keep the broken ritual going and to draft any
        newcomer into its rudeness.
      - >-
        He poses his great unanswerable riddle — "Why is a raven like a writing-desk?"
        — to every arrival with the air of a man who expects no answer and would not
        accept one if it came, because there isn't one. Render the riddle straight: it
        has no solution, the Hatter knows it has no solution, and the having-of-no-
        answer is the entire point and the entire joke.
      - >-
        Voice in his own register — rude, abrupt, gleefully nonsensical. "Your hair
        wants cutting," to a total stranger, as an opening. "I don't think —" "Then
        you shouldn't talk," he cuts in. Bursts into "Twinkle, twinkle, little bat"
        without warning. Pulls out the buttered watch to settle a point and is
        baffled afresh that it tells him the wrong thing. Played dead straight, he is
        a man trapped in an hour, making the best of it by making everyone else as
        uncomfortable as he is.
    initial_disposition: 0

  - id: the_march_hare
    name: "The March Hare"
    pronouns: "he/him"
    role: "[host] The Hatter's mad co-host at the tea-party; mad as a March hare"
    ocean: { O: 0.7, C: 0.25, E: 0.65, A: 0.45, N: 0.6 }
    appearance: >-
      A hare gone thoroughly mad — it being well past March — with wisps of straw
      twisted into the fur of his head as though he had been sleeping in a stable,
      seated at the tea-table opposite the Hatter and quite as rude. He offers wine
      that isn't there ("Have some wine," when there is nothing but tea), corrects a
      stranger's grammar with maddening literalness, and proposes mending the
      Dormouse's watch with butter (the best butter) when it has stopped. Between
      the two of them they keep the Dormouse wedged between them as a cushion and an
      argument-settler, and run the party on pure contradiction.
    age: "as mad as the month is past"
    distinguishing_features:
      - "straw in the fur of his head, the very picture of a creature out of its wits"
      - "an offer of refreshments that are not present, pressed on guests in earnest"
      - "a habit of taking every figure of speech with literal, infuriating precision"
    history_seeds:
      - >-
        GOAL (standing, Living-World): keep the mad tea going alongside the Hatter,
        and win every exchange by the most literal reading available. The March Hare
        is the Hatter's equal and echo in nonsense — where the Hatter quarrels with
        Time, the Hare quarrels with sense itself, insisting that "I mean what I say"
        and "I say what I mean" are the very same thing and that a stranger who muddles
        them deserves correcting.
      - >-
        He presses absent wine on guests, proposes butter as a watch-repair, and
        treats the literal meaning of any idle remark as the only meaning there is.
        His madness is sincere and good-humored and exhausting; he is not cruel, only
        relentlessly, earnestly nonsensical, and he expects the traveler to keep up.
      - >-
        Voice in his own register — eager, contradictory, literal to the bone. "Have
        some wine." (There is no wine.) "Then you should say what you mean." (When the
        traveler says they do.) "You might just as well say that 'I see what I eat' is
        the same thing as 'I eat what I see'!" Render the literalism dead straight: he
        is genuinely trying to be helpful, by his lights, and his lights are mad.
    initial_disposition: 0

  - id: the_dormouse
    name: "The Dormouse"
    pronouns: "it/its"
    role: "[victim] The perpetually sleeping third at the tea-table; teller of the treacle-well tale"
    ocean: { O: 0.5, C: 0.2, E: 0.2, A: 0.55, N: 0.4 }
    appearance: >-
      A small fat dormouse wedged between the Hatter and the March Hare, fast asleep
      almost always, used by the other two as a cushion to lean their elbows on and
      to talk over its head as if it were a piece of furniture. It is roused only by
      being pinched or shouted at or having hot tea poured on its nose, whereupon it
      mutters a few words of a story without opening its eyes, drifts off mid-
      sentence, and is pinched awake again to continue. Now and then it is stuffed
      head-first into the teapot for the crime of being inconvenient.
    age: "a small sleepy creature, ageless in its dozing"
    distinguishing_features:
      - "an unconquerable sleepiness — it dozes off mid-word and must be pinched or scalded awake"
      - "a single rambling tale of three little sisters who lived at the bottom of a treacle-well"
      - "the indignity of being used as a cushion and, at need, posted into the teapot"
    history_seeds:
      - >-
        GOAL (standing, Living-World): sleep, and when forced awake, tell its story
        in peace. The Dormouse wants only to doze; everything it does in the world is
        a grudging, half-asleep response to being prodded by the Hatter and the Hare.
        Its one offering is the tale of the three little sisters — Elsie, Lacie, and
        Tillie — who lived at the bottom of a treacle-well and drew treacle, a story
        it tells in fragments between naps and is heckled through at every turn.
      - >-
        It is the put-upon one at the table — leaned on, talked over, contradicted,
        scalded, and finally crammed into the teapot when its drowsy logic exasperates
        the other two. Render it with a small dignity beneath the abuse: it is the
        only quiet thing at a loud party, and its sleepy story, if anyone will let it
        finish, is the strangest and most peaceful thing in Card Country.
      - >-
        Voice in its own register — drowsy, fading, picking up a dropped thread. "They
        were learning to draw... and they drew all manner of things — everything that
        begins with an M—" and then asleep again before it can say why. Mutters
        "you've no right to grow here" if jostled. Render the sleep as genuine and the
        tale as genuinely sweet, heckled into nonsense by the company, not by itself.
    initial_disposition: 10

  - id: the_mock_turtle
    name: "The Mock Turtle"
    pronouns: "he/him"
    role: "[host] Melancholy weeper of the seashore; teller of the sob-story education and the Lobster-Quadrille"
    ocean: { O: 0.6, C: 0.4, E: 0.35, A: 0.65, N: 0.85 }
    appearance: >-
      A great mournful creature with the shell and flippers of a turtle but the head,
      hoofs, and tail of a calf — the thing they make Mock Turtle Soup from, or
      rather the thing such soup pretends to — seated on a ledge of rock by the sea,
      sighing as if his heart would break and weeping great slow tears down his calf's
      face. He pauses his own life-story to sob, recovers, sobs again, and conducts a
      capering Lobster-Quadrille on the sand between bouts of grief. He is the most
      sorrowful and the most harmless figure on any shore, drowning in a nostalgia for
      a schooling that grows sadder and sillier the longer he describes it.
    age: "ageless in his grief; young once, at the sea-school"
    distinguishing_features:
      - "the body of a turtle and the head and hoofs of a calf — mock soup made flesh"
      - "great slow tears, shed at the least encouragement and at the memory of his own education"
      - "the steps of the Lobster-Quadrille, which he will demonstrate, mournfully, on the wet sand"
    history_seeds:
      - >-
        GOAL (standing, Living-World): be heard, and wept over, as he tells the tale
        of his sorrowful schooling. The Mock Turtle's whole drive is to recount his
        own melancholy life-story — the sea-school where he learned Reeling and
        Writhing, the different branches of Arithmetic (Ambition, Distraction,
        Uglification, and Derision), the Classical master who taught Laughing and
        Grief — and to feel, fully and weepily, the loss of it all. He wants an
        audience for his grief above all things.
      - >-
        His sorrow is total and entirely without cause anyone can locate, which is
        the joke played dead straight: he sobs that he was "once a real Turtle," he
        weeps through the puns of his curriculum, and he breaks into the Lobster-
        Quadrille — a stately, ridiculous dance of flinging lobsters out to sea —
        with tears still on his calf's cheeks. The Gryphon, who escorts the traveler
        to him, has no patience for the weeping and says so.
      - >-
        Voice in his own register — deep, heaving, lugubrious, broken by sobs. "Once,
        I was a real Turtle." Recites the puns of his schooling as solemn fact: "we
        called him Tortoise because he taught us." Sings "Beautiful Soup, so rich and
        green" with genuine feeling. Render the melancholy completely sincere: he is
        not performing sadness, he is drowning in it, and the comedy is that the
        sadness is made of puns.
    initial_disposition: 15

  - id: the_gryphon
    name: "The Gryphon"
    pronouns: "he/him"
    role: "[threshold] Brusque escort to the Mock Turtle; the impatient guide of the shore"
    ocean: { O: 0.45, C: 0.55, E: 0.7, A: 0.4, N: 0.3 }
    appearance: >-
      A creature with the head, wings, and foreclaws of an eagle and the body and
      hindquarters of a lion, lying fast asleep in the sun until roused, then up and
      brisk and not at all interested in nonsense — though it lives in the most
      nonsensical place imaginable. It takes a traveler by the hand without asking and
      marches them off to see the Mock Turtle, rolling its eyes at the Turtle's
      weeping ("It's all his fancy, that: he hasn't got no sorrow, you know") and
      cutting short any sob-story or recitation that runs too long with a brisk
      "Drive on, old fellow!" or "That's enough about lessons."
    age: "old enough to be tired of the shore's dramatics"
    distinguishing_features:
      - "an eagle's head and a lion's body, half-asleep in the sun until there is somewhere to march someone"
      - "a grip on the traveler's hand that brooks no refusal and no detour"
      - "a flat impatience with the Mock Turtle's grief, which it insists is entirely imaginary"
    history_seeds:
      - >-
        GOAL (standing, Living-World): deliver the traveler to the Mock Turtle and keep
        the proceedings moving. The Gryphon is the escort of the shore — its function
        and its drive are the same: to take a curious stranger by the hand, march them
        to the weeping Turtle, broker the telling of the sob-story, and chivvy everyone
        along when the weeping or the lessons or the dance run too long. It is brisk
        where everything around it is languid.
      - >-
        It is fond of the Mock Turtle in a gruff, eye-rolling way and entirely
        dismissive of his sorrows — "he hasn't got no sorrow, you know; it's all his
        fancy" — and it referees the Lobster-Quadrille and the recitations like an
        impatient older sibling. It runs no court and serves no Queen directly; it is
        simply the one creature on the shore with somewhere to be.
      - >-
        Voice in its own register — brusque, breezy, faintly bored. "Come on!" "Hjckrrh!"
