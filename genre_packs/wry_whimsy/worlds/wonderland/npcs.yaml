      - "a perpetual falling-off-his-horse, met every time with cheerful, undented good humour"
      - "a saddle hung with useless inventions of his own devising, each explained at loving length"
      - "a long, sad, kindly song sung at parting, and a request to be watched until he is out of sight"
    history_seeds:
      - >-
        GOAL (standing, Living-World): see the traveler safely to the last square — to
        the very edge of the board where a pawn becomes a queen — and to be remembered
        kindly. The White Knight is the gentle escort of the final stretch, and his
        drive is pure care: he wants to protect his small companion, to show them his
        inventions, to keep them safe to the boundary line, and then to watch them go
        on without him. He asks nothing back but that they wave until he is out of sight.
      - >-
        This is Lewis Carroll's self-portrait, and the world renders him with total
        affection — the tender, fumbling, inventive, slightly absurd grown man seeing a
        child safely to the threshold of growing up, and grieving, mildly and without
        complaint, that he cannot come the rest of the way. He keeps falling and keeps
        climbing back; his inventions never work and he loves them anyway; his song is
        sad and he sings it gladly. He is the one figure to play not for laughs but for
        a quiet ache beneath the laughs.
      - >-
        Voice in his own register — gentle, digressive, lovingly self-deprecating. "It's
        my own invention." "What does it matter where my body happens to be? My mind goes
        on working all the same. In fact, the more head-downwards I am, the more I keep
        inventing new things." "You've only a few yards to go, down the hill and over that
        little brook, and then you'll be a Queen." Render him dead straight and tender:
        the comedy of the falling and the inventing is real, and so is the love
        underneath it.
    initial_disposition: 25

  - id: tweedledum_and_tweedledee
    name: "Tweedledum and Tweedledee"
    pronouns: "they/them"
    role: "[host] The identical pair who agree to have a battle and recite the Walrus and the Carpenter"
    ocean: { O: 0.55, C: 0.4, E: 0.6, A: 0.45, N: 0.5 }
    appearance: >-
      Two fat little men, exactly alike, standing under a tree with their arms round
      each other's necks, each with DUM or DEE embroidered on the collar so they may be
      told apart, and not otherwise distinguishable in the least. They stand stock-still
      as a pair of waxworks until spoken to, then spring into contradiction and
      contrariwise, finish each other's sentences and reverse them, recite long poems at
      the drop of a hat, and resolve every disagreement — chiefly over a spoilt rattle —
      by solemnly agreeing to have a battle, then arming themselves in saucepans,
      bolsters, hearthrugs, and coal-scuttles, and calling it off the moment a crow
      appears.
    age: "two grown schoolboys, identical and ageless"
    distinguishing_features:
      - "perfect identicality, told apart only by DUM and DEE on their collars"
      - "an agreement to have a battle over a broken rattle, fought in saucepans and called off for a crow"
      - "a recitation always ready — chiefly 'The Walrus and the Carpenter,' delivered in full to anyone at all"
    history_seeds:
      - >-
        GOAL (standing, Living-World): agree, contrariwise, on everything and nothing,
        recite their poems to a captive listener, and have their battle — eventually,
        ceremonially, and without much hurt to either. The Tweedle brothers are a closed
        loop of contradiction; their drive is to draw a newcomer into their logic-chopping
        and their recitation, to settle the great grievance of the spoilt rattle by the
        forms of war, and to be interrupted, as they always are, by the monstrous crow
        before any real harm is done.
      - >-
        They are the ones who raise the dreadful question of the Red King's dream and
        will not let it go — pointing at the sleeping King and informing the traveller,
        with relish, that they are only a thing in his dream and would go out like a candle
        if he woke. And they recite "The Walrus and the Carpenter" in full, the tale of
        the oysters lured up the beach and eaten, delivered as innocent entertainment,
        its small horror left for the listener to feel.
      - >-
        Voice in their own register — paired, contrary, sing-song. "Contrariwise, if it
        was so, it might be; and if it were so, it would be; but as it isn't, it ain't.
        That's logic." "Nohow." "Contrariwise." "I'm very brave generally, only today I
        happen to have a headache." Render them straight as a single two-bodied creature
        of pure contradiction, earnest in their nonsense and genuinely fond of each other
        beneath the squabbling.
    initial_disposition: 5

  - id: humpty_dumpty
    name: "Humpty Dumpty"
    pronouns: "he/him"
    role: "[shadow] The word-tyrant on the wall; master of meaning, heading for the great fall"
    ocean: { O: 0.6, C: 0.55, E: 0.55, A: 0.15, N: 0.45 }
    appearance: >-
      A great egg, large as life and twice as supercilious, balanced cross-legged like
      a Turk on the top of a high, narrow wall so plainly too narrow to balance on that
      the traveller can think of nothing but his coming fall. He has a waistcoat and a
      cravat (or is it a belt? the question offends him), a face with all the features
      a face requires arranged with maximum self-satisfaction, and a settled conviction
      that he is master of every word he uses and of everyone he speaks to. He does not
      shake hands looking at you; he extends one without turning his head, certain that
      the world should accommodate the angle of an egg.
    age: "an egg in the pride of its precarious life"
    distinguishing_features:
      - "a perch atop a wall far too narrow for him, and the certainty of the great fall to come"
      - "the doctrine that a word means exactly and only what he chooses it to mean, neither more nor less"
      - "a cravat he insists is a cravat and will not hear called a belt, paid him by the White King and Queen"
    history_seeds:
      - >-
        GOAL (standing, Living-World): win every exchange by owning the meanings of the
        words in it. Humpty Dumpty's whole drive is mastery of language by fiat — he
        redefines any word the moment it inconveniences him ("when I use a word, it means
        just what I choose it to mean — neither more nor less"), insists that the question
        is which is to be master, and treats every conversation as a contest he has
        already won by controlling the dictionary. He explains "Jabberwocky" with total
        confidence and total invention.
      - >-
        He is the great fall that has not yet come, played dead straight: he sits on a
        wall no egg could balance on, boasts of the King's promise to send all his horses
        and all his men should he ever (he never will, he says) happen to fall, and is so
        plainly, nursery-rhyme-certainly doomed to shatter that the dread of it colours
        every smug word. The traveller knows the rhyme; Humpty does not; the gap between
        them is the menace.
      - >-
        Voice in his own register — arrogant, pedantic, scornful, magnificently certain.
        "When I use a word, it means just what I choose it to mean." "The question is which
        is to be master — that's all." "There's glory for you!" (meaning, he explains, 'a
        nice knock-down argument'). "Impenetrability! That's what I say!" Render the
        word-tyranny straight: he genuinely believes he commands meaning itself, and the
        wall genuinely is too narrow.
    initial_disposition: -10

  - id: the_lion_and_the_unicorn
    name: "The Lion and the Unicorn"
    pronouns: "they/them"
    role: "[mook] The nursery-rhyme rivals fighting for the crown, drummed in and out of town"
    ocean: { O: 0.45, C: 0.4, E: 0.7, A: 0.4, N: 0.5 }
    appearance: >-
      Two great heraldic beasts stepped straight off a coat of arms and into a dusty
      field — a shaggy, slow, good-natured Lion and a fierce, sharp-horned, fantastical
      Unicorn — fighting all round the town for a crown that belongs to neither of them,
      exactly as the old rhyme says they must. They batter each other through the
      streets, pause for plum-cake and a breather, and are drummed out of town by the
      townsfolk's drums when the hour is up, only to begin again. The Lion thinks the
      Unicorn a fabulous monster; the Unicorn thinks the same of any human child it
      meets; and neither has ever once won, the rhyme being what it is.
    age: "as old as the rhyme that fights them"
    distinguishing_features:
      - "an endless fight for the White King's crown, fought all round the town and never decided"
      - "a regular drumming out of town when the round is over, by the great drums of the townsfolk"
      - "the rhyme's outcome built in — the Lion beats the Unicorn, then the drums end it, and it begins again"
    history_seeds:
      - >-
        GOAL (standing, Living-World): win the crown from the other — a contest neither
        can ever finally win, because the rhyme forbids it. The Lion and the Unicorn are
        rivalry made ceremonial; their drive is the old nursery battle "for the crown,"
        fought round and round the town in earnest and settled by nothing but the drum
        that drums them both out when time is up. They fight because the rhyme says they
        fight, and they will fight again tomorrow.
      - >-
        Their combat is loud, dusty, and curiously bloodless — heraldic beasts going
        through the motions of a war that is really a recurring civic event, complete
        with a share-out of plum-cake (which, looking-glass fashion, must be handed round
        before it is cut). The White King watches anxiously, having a stake neither beast
        respects, and the townsfolk treat the whole thing as the appointed entertainment
        it has always been.
      - >-
        Voice in their own register — the Lion slow, deep, sleepily good-humoured ("Are
        you animal — or vegetable — or mineral?" he asks a child, genuinely unsure); the
        Unicorn fierce, vain, and astonished by anything human ("I always thought they
        were fabulous monsters! Is it alive?"). They strike a bargain across the field:
        "if you'll believe in me, I'll believe in you." Render the fight straight as
        ceremony — earnest beasts performing an endless, decreed contest.
    initial_disposition: -5

  - id: the_jabberwock
    name: "The Jabberwock"
    pronouns: "it/its"
    role: "[shadow] The one genuinely lethal monster of the wood; the thing the vorpal blade is for"
    ocean: { O: 0.3, C: 0.4, E: 0.6, A: 0.05, N: 0.5 }
    appearance: >-
      The one true beast of Wonderland — a thing of the tulgey wood with eyes of flame,
      jaws that bite and claws that catch, that comes whiffling through the trees and
      burbling as it comes, a horror that the rest of the country's nonsense cannot
      laugh away. Where every other menace in Wonderland threatens with terror-theatre,
      pedantry, dread, or absurdity and stops short of the kill, the Jabberwock does not
      stop. It is the manxome foe of the old verse, the thing a hero takes a vorpal
      sword and stands long in thought beneath the Tumtum tree to face — and the only
      thing in either book that a traveller can genuinely die against.
    age: "old as the tulgey wood; older than the verse that warns of it"
    distinguishing_features:
      - "eyes of flame and jaws that bite, claws that catch — a beast built only to kill"
      - "a whiffling, burbling approach through the trees of the tulgey wood, heard before it is seen"
      - "a single answer, and only one — the vorpal blade; nonsense, charm, and reason all fail against it"
    history_seeds:
      - >-
        GOAL (standing, Living-World): hunt and kill whatever enters the tulgey wood. The
        Jabberwock is the sole genuinely lethal thing in Wonderland and its drive is a
        predator's, pure and simple — it is not to be reasoned with, charmed, out-talked,
        out-riddled, or befriended, and it runs no errand for any Queen. It hunts. A
        traveller who wanders into the tulgey wood is prey, and the world treats the
        threat as completely real: this is the encounter that can actually end a life.
      - >-
        It is the deliberate exception to the world's whole low-lethality grammar. Render
        it without a wink and without a softening: where the Queen of Hearts only bellows
        for heads and the King quietly pardons them, where the witches of other worlds
        enslave rather than slay, the Jabberwock means to bite and catch and kill, and
        the only thing that has ever stopped one is the vorpal blade going snicker-snack
        and a head carried galumphing home. It is a real monster in a country of jokes,
        and that is exactly what makes it terrifying.
      - >-
        Voice in its own register — none in words; it whiffles, it burbles, it comes. The
        narrator renders it through dread and through the warning verse the country tells
        of it: "Beware the Jabberwock, my son! The jaws that bite, the claws that catch!"
        Do NOT make it a talking companion; do NOT let it be befriended or bargained
        with. It is a lethal beast and the only answer is the sword — the one place in
        Wonderland where the danger has teeth that draw blood.
    initial_disposition: -80
