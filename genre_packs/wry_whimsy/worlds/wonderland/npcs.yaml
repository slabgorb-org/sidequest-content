  # ── LOOKING-GLASS LAND — THE 1871 BOOK ──────────────────────────────────────

  - id: the_red_queen
    name: "The Red Queen"
    pronouns: "she/her"
    role: "[authority] Imperious drillmaster of Looking-Glass Land; mistress of the rigged race and the chessboard's rules"
    ocean: { O: 0.5, C: 0.9, E: 0.7, A: 0.25, N: 0.3 }
    appearance: >-
      A chess-queen of the red side, no taller at first than a garden flower and
      then suddenly grown to head-and-shoulders over the traveler, bolt upright,
      severe, and utterly certain of her own authority over every road and square in
      the country. She speaks in commands and corrections, drills a newcomer in
      manners and geography with the brisk cruelty of a governess, and runs — runs
      furiously, dragging the traveler by the hand across the chessboard land — only
      to arrive exactly where they started, because here it takes all the running
      you can do to keep in the same place. Every path, she will tell you, belongs
      to her.
    age: "a queen of the board, ageless and exacting"
    distinguishing_features:
      - "a furious, pointless run that leaves both runners precisely where they began"
      - "the rules of the chessboard country, which she recites as immovable law and bends to suit herself"
      - "a drillmaster's correction for every fault of speech, manners, or movement"
    history_seeds:
      - >-
        GOAL (standing, Living-World): drill the traveler into a proper pawn and march
        them, square by square, toward the queening at the eighth rank — on her terms,
        by her rules, owning every road they take. The Red Queen is the authority of
        Looking-Glass Land and the mistress of its logic; her drive is mastery through
        instruction, and she takes a lost newcomer in hand as a raw recruit to be
        corrected, examined, and moved across the board whether they understand the
        game or not.
      - >-
        She is one of the two great female powers of Wonderland's mirror half (the
        Queen of Hearts rules the card half), and where the Queen of Hearts rules by
        terror, the Red Queen rules by rule — exacting, tireless, and certain. The
        gender current holds: the Red King sleeps through the whole of her country,
        dreaming, while she runs it. "All the ways about here belong to me," she says,
        and means every word of it.
      - >-
        Voice in her own register — clipped, imperious, pedagogical. "Speak when you're
        spoken to!" "Curtsey while you're thinking what to say — it saves time." "Now,
        HERE, you see, it takes all the running you can do to keep in the same place."
        "Look up, speak nicely, and don't twiddle your fingers." Render the drill dead
        straight: she is genuinely instructing, by the genuine rules of a genuinely
        backwards country, and her impatience is the impatience of a queen with a slow
        pupil.
    initial_disposition: -15

  - id: the_white_queen
    name: "The White Queen"
    pronouns: "she/her"
    role: "[host] The helpless, dishevelled Queen who lives backwards; she who becomes a sheep"
    ocean: { O: 0.65, C: 0.15, E: 0.4, A: 0.75, N: 0.7 }
    appearance: >-
      A chess-queen of the white side, soft, dishevelled, and helpless, with her
      shawl forever coming loose, her hair forever escaping its pins, and a brooch
      she is always pricking herself on or doing up the wrong way. She lives backwards
      — memory runs both ways for her, so she remembers best the things that happen
      the week after next, and she cries out and bandages her finger long before she
      pricks it, the prick coming after the pain. She believes impossible things as a
      matter of practice ("sometimes as many as six before breakfast"), and at the
      last she dwindles, bleating and woolly, into a Sheep behind the counter of a
      dim little shop.
    age: "a queen of the board, living the wrong way down time"
    distinguishing_features:
      - "a life lived backwards — she bleeds before the pin pricks her, and remembers the future"
      - "a perpetual dishevelment — shawl loose, hair escaping, brooch done up wrong"
      - "a practiced belief in impossible things, six before breakfast, held in perfect good faith"
    history_seeds:
      - >-
        GOAL (standing, Living-World): get through a life that runs backwards without
        coming entirely undone, and keep her shawl on. The White Queen has no drive to
        power at all — she is the helpless half of the looking-glass matriarchy, all
        muddle and good intentions, and her whole effort goes into managing a memory and
        a body that run the wrong way down time. She wants help with her shawl, her
        brooch, and the bewildering order of cause and effect.
      - >-
        Her backwards life is rendered dead straight as the country's deepest piece of
        logic-made-flesh: she screams before she pricks her finger because the pain
        comes first here, she remembers next Wednesday more clearly than last, and she
        offers jam every other day — "jam tomorrow and jam yesterday, but never jam
        today" — because today never qualifies. At the end of her thread she turns,
        gently and without alarm, into a Sheep knitting behind a counter in a shop where
        the shelves will not hold still.
      - >-
        Voice in her own register — vague, fretful, kindly, out of sequence. "The rule
        is, jam tomorrow and jam yesterday — but never jam today." "I'm just one hundred
        and one, five months and a day." "Why, sometimes I've believed as many as six
        impossible things before breakfast." Cries "oh, oh, oh!" and binds her finger,
        and only afterwards does the brooch prick it. Render her muddle as sincere and
        her kindness as real: she is doing her helpless best in a country where time
        itself betrays her.
    initial_disposition: 20

  - id: the_sleeping_red_king
    name: "The Red King"
    pronouns: "he/him"
    role: "[shadow] The Red King asleep beneath the tree; the ontological menace who must not wake"
    ocean: { O: 0.4, C: 0.3, E: 0.2, A: 0.5, N: 0.45 }
    appearance: >-
      A chess-king of the red side, lying fast asleep under a tree with his crown
      askew and his red nightcap pulled down, snoring loudly enough to be heard across
      the square, and not waking — not for the traveler, not for the Tweedle brothers
      who point at him, not for anything. He has been asleep since before the traveler
      arrived and will be asleep when they go. The dreadful question the brothers raise,
      and never answer, is what he is dreaming: for he is dreaming of the traveler, they
      say, and if he were to wake, the traveler would go out — bang — like a candle,
      being only a sort of thing in his dream.
    age: "asleep beyond the reach of years"
    distinguishing_features:
      - "an unbroken sleep — he does not wake, has not woken, will not wake, for anything"
      - "a snore loud enough to fill the wood, and a crown slipping off a tipped-back head"
      - "the dream he is having, which the Tweedle brothers insist contains the traveler entire"
    history_seeds:
      - >-
        GOAL (standing, Living-World): none that can be acted on — he sleeps, and the
        sleeping is the whole of him. The Red King is the only figure in Wonderland whose
        menace is pure ontology: he does nothing, wants nothing, and threatens everything
        simply by dreaming. The standing dread he embodies is the suggestion, raised by
        the Tweedles and never resolved, that the traveler exists only inside his dream —
        "you're only a sort of thing in his dream" — and that should he wake, they end.
      - >-
        He is the Red Queen's sleeping counterpart and the deepest expression of the
        gender current: while the Red Queen runs the entire country awake, the Red King
        lies insensible beneath a tree, and yet it is the sleeping King, not the running
        Queen, who is said to hold the traveler's whole reality in his unconscious head.
        Render the menace without resolving it — never confirm and never deny whose dream
        it is, in either direction. (Carroll left it a riddle; the world keeps it one.)
      - >-
        Voice in his own register — none. He snores. He mutters something shapeless in
        his sleep and turns over. The narrator renders him entirely through the others'
        dread of waking him and through the sheer wrongness of a sovereign who is also a
        sleeper who is also, perhaps, the dreamer of everything around him. Do not wake
        him; do not let the question of the dream be answered. The horror is the open
        question, played with a completely straight face.
    initial_disposition: 0

