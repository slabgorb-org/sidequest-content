name: Victorian English
summary: Ordinary mid-Victorian English people, c.1865 — the children, servants, students, and gentlefolk who tumble down the rabbit-hole and find themselves out of place in a country of nonsense
description: >-
  The Victorian English are not natives of Wonderland at all. They are the real
  people of England in the year 1865 — the sunlit summer of riverbank picnics,
  parsonage drawing-rooms, and schoolroom slates — who slip through a rabbit-hole
  or a looking-glass and wake bewildered among the Card Folk, the Chesspieces, and
  the talking creatures of the wood. The model is Alice Liddell herself: a
  well-bred English child of the cathedral close, in pinafore and buttoned boots,
  meeting impossible logic with stubborn good manners. They come from every rung of
  the ordinary world — the daughters and sons of the house, the governesses and
  nursemaids who keep them, the choristers and divinity students of the college, the
  curates and gardeners and footmen and milliners and clerks who make the everyday
  machinery of a market town turn. They carry the plain furniture of 1865 with them:
  a name out of the parish register, a coat or a frock cut to the year's fashion, a
  memory of the parsonage, the riverbank, the drawing-room, the schoolroom, the
  conservatory. They are the audience-eye of the world — the only figures present who
  find any of it strange — and they survive Wonderland by wit and courtesy, never by
  force. A Victorian English person bears a Christian name from the font and a plain
  English surname, and belongs to a trade, a station, or a household of the real
  world above.
