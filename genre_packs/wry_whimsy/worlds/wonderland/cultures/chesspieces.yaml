name: Chesspieces
summary: The living chess pieces of Looking-Glass Land — the Red and White courts, pawns, knights, and messengers, who move by the board's rules
description: >-
  The Chesspieces are the people of Looking-Glass Land, the half of Wonderland
  reached through the mirror — a living chess-game ruled off into green-and-white
  squares by little leaping-brooks and low straight hedgerows, a match caught in
  mid-play with the pieces alive and walking their moves. Unlike the flat Card
  Folk, a chesspiece can see the whole board at once and speaks of itself in the
  language of the game: a square at a time, a move at a time, a piece of the Red
  side or the White. The Red court is sharp, exacting, and certain — the Red Queen
  drills every newcomer through a race that goes nowhere and recites the rules as
  iron law, while the Red King sleeps insensible beneath his tree, dreaming. The
  White court is soft and dishevelled and helpless — the White Queen lives backwards
  down time, the White Knight falls cheerfully off his horse at every other step.
  Below the royals run the pawns and the bustling messengers, who carry the King's
  word in and out of the wood with Anglo-Saxon attitudes and Anglo-Saxon names. A
  chesspiece is named for its colour and its kind — the White Knight, the Red Queen,
  a Red Pawn — save for the two messengers, who answer to the old coinages Haigha
  and Hatta. (Canon: the Red Queen and the sleeping Red King; the White Queen who
  becomes a Sheep and the gentle White Knight; the messengers Haigha and Hatta.)
