name: Creature Folk
summary: The talking dream-fauna and nonsense-logicians of both countries — each known by a definite-article epithet, plus Carroll's invented portmanteau beasts
description: >-
  The Creature Folk are the talking dream-fauna of Wonderland — the beasts,
  insects, and nonsense-logicians who run their own canonical business in both
  halves of the country, the card half below the mirror and the chessboard half
  above it. They are not flat pasteboard like the Card Folk nor bound to the squares
  like the Chesspieces; they are the loose, mad menagerie of the wood, the mushroom,
  and the tea-table — each one earnest, each one running a single sincere bit
  forever. The White Rabbit frets at his watch; the March Hare offers wine that
  isn't there; the Mock Turtle weeps through the puns of his schooling; the Cheshire
  Cat tells the plain truth and fades, grin last. None of them has a phonetic
  given-name; a creature here is known by a definite article and an epithet — the
  Adjective Creature, the season and the beast, the colour and the kind. Apart from
  these stand Carroll's own invented monsters of the tulgey wood, the portmanteau
  beasts of the warning-verse: the slithy toves, the borogoves, the Jubjub bird, the
  frumious Bandersnatch, and the manxome Jabberwock itself, the one genuinely lethal
  thing in a country of jokes. A creature is named "the [Adjective] [Creature]," or
  by one of Carroll's true nonsense-coinages. (Canon: the White Rabbit, the March
  Hare, the Mock Turtle, the Cheshire Cat, the Dormouse, the Gryphon; and the
  coinages Jabberwock, Bandersnatch, Jubjub, borogove, tove.)
