name: Card Folk
summary: The flat heraldic playing-cards of Card Country — gardeners, soldiers, courtiers, and the royal suits, ruled by terror
description: >-
  The Card Folk are the people of Card Country, the half of Wonderland reached by
  the rabbit-hole — a heraldic playing-card court laid out as a clipped formal
  garden of rose-trees in rows, a flat croquet-lawn, and a printed-card courtroom.
  Each is a single painted face on a single thin oblong of pasteboard, two
  dimensions doing the work of three, forever on edge and forever theatrical. The
  low cards are the labourers — gardeners and card-soldiers, named only by their
  rank and suit, who fling themselves face-down on the path when power approaches,
  since the Queen cannot tell one card's back from another's. The court cards are
  the gentry — Knaves, Queens, and Kings of the four suits — fond of titles and
  procession and pitched at a perpetual maximum of fear. They are governed by a
  single sentence delivered at a single volume, "Off with their heads!", and the
  whole pack lives in sincere, total terror of it, though the mild King of Hearts
  trails behind pardoning the condemned the moment the Queen's back is turned. A
  card is named for what it is: a number and a suit, a court-rank and a suit, or a
  bare painted role in the garden or the dock. (Canon: the Two, Five, and Seven of
  Spades, the terrified gardeners; the Knave of Hearts, on trial for the tarts; the
  Queen and King of Hearts who rule and pardon.)
