name: The Jabberwock and the Vorpal Blade
era: "the dream as it now runs — the wood has held the monster as long as anyone has dared to go in"
summary: >-
  The one genuinely lethal thing in a dream of harmless terror. Where everything
  else in Wonderland threatens and pardons, the Jabberwock means harm and follows
  through; it cannot be out-argued, refused, dosed, or woken away from, and the
  vorpal sword is the only answer to it. It is the rare thing in this world that
  violence is the right answer to — and the answer leaves a mark.

details: >-
  Deep in the tulgey wood, where the trees meet overhead and the rules of the dream
  grow thin, the Jabberwock comes whiffling and burbling as it comes — jaws that
  bite, claws that catch, eyes of flame. The warning carries a weight nothing else
  in Wonderland carries: beware the Jabberwock, beware the jaws that bite, the claws
  that catch. When the country sounds sincere about danger, this is why. Every
  Wonderland reflex fails against it — there is no nonsense to out-talk, no King
  trailing behind with a quiet pardon, no bottle or mushroom to dose it down to size,
  and no waking that walks the traveler clear of it. Only one thing answers the
  monster: the vorpal sword, which goes snicker-snack and takes its head, so that
  the one who slays it comes galumphing back crying "O frabjous day! Callooh!
  Callay!" But the dream is built for waking, not for killing, and it recoils from
  anyone who has drawn true blood in it. The vorpal stroke is remembered everywhere
  after; the nonsense-country, which can forgive a beheading because it never meant
  the beheading, cannot forget the one real death done in it, and flinches from the
  hand that did it. Violence works in Wonderland exactly once, against exactly this,
  and the day that is frabjous is also the day the traveler is changed.

notable_figures:
  - "The Jabberwock — jaws that bite, claws that catch, eyes of flame; the one thing in the dream that is not playing"
  - "The vorpal sword — the single answer to the monster, that goes snicker-snack and takes its head, idle against everything else"
  - "The one who came galumphing back — the slayer crying 'O frabjous day,' victorious and marked at once"

