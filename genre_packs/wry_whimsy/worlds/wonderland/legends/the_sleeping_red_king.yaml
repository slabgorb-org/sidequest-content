name: The Sleeping Red King
era: "no one living can say — he has slept under his tree since before anyone remembers"
summary: >-
  The deepest dread of Looking-Glass Land: the King who has slept under his tree
  since before anyone remembers, and the horror the Tweedle-brothers name to any
  traveler who will listen — that the whole country, and the traveler walking in it,
  may be only a thing in his dream, and that were he to wake, you would go out like
  a candle. It is the one question Wonderland will never answer.

details: >-
  Deep in the Tweedle wood, half in shadow among the trees, a great crowned king in
  a robe lies stretched fast asleep on the ground beneath a tree, his crown tipped,
  plainly snoring. He has fallen clean out of his own kingdom into sleep, and the
  Red Queen rules in his stead while he dreams. Tweedledum and Tweedledee will stop
  a traveler to point him out, and put the dread as plainly as if it were the most
  ordinary fact in the world: he's dreaming now, and what do you think he's dreaming
  about? Why, about you. You're only a sort of thing in his dream. If he were to
  wake, you'd go out — bang! — like a candle. A traveler who insists they are real,
  who weeps at the thought, is only asked, reasonably, what they suppose their tears
  are made of, since they aren't real either. It is unanswerable. The country will
  not confirm whether it is real, whether the traveler is real, or whose dream is
  dreaming whom; the locals find the answer obvious, and the obvious answer is
  unbearable. The threat is not a sword but a vertigo — that the ground of one's own
  reality is borrowed, switched on by another's sleep and snuffable at his waking —
  and once the question is asked it will not stop humming under everything. The only
  steady ground a traveler ever finds is the resolve to act as real and to want home
  as if home were real, with no proof either way.

notable_figures:
  - "The Red King — asleep under his tree since before anyone remembers, who may be dreaming the whole country, traveler and all"
  - "Tweedledum and Tweedledee — the fat identical brothers who point him out and name the dread, that you'd go out like a candle were he to wake"
  - "The Red Queen — who rules Looking-Glass Land while the King sleeps, and runs it through the race that goes nowhere"

