name: Nothing But a Pack of Cards
era: "told of a traveler before — the refusal that has ended the dream at least once"
summary: >-
  The legend of the traveler who, at the height of the trial, with the Queen
  screaming for sentence and the court closing in, finally refused the whole thing —
  "you're nothing but a pack of cards!" — and the dream blew apart and they woke.
  It is the refusal that ends the nonsense, and the one true way home: not a road,
  not a door, but the moment a traveler stops being afraid of pasteboard and says so.

details: >-
  Press anyone in Wonderland on how a traveler ever leaves, and the answer is always
  the same story, told as a thing that happened once and might happen again. There
  was a trial — the stolen tarts, the jury scratching on their slates, the King mild
  on the bench and the Queen roaring for the sentence before any verdict. And the
  traveler in the dock, who had been growing all through it, rose at last to full
  height, looked at the whole raging assembly, and named it for exactly what it was:
  nothing but a pack of cards. At that the cards rose up into the air and came flying
  down upon her — and she woke. The same waking is told of the looking-glass feast,
  where the nonsense climbed to its pitch and the traveler seized the Red Queen and
  shook her, and shook her, and shook her, until the whole dream came apart in the
  hands. The lesson the legend carries is the deepest law of the place: the authority
  of Wonderland is, at bottom, nothing — painted pasteboard, chesspieces, a kitten on
  a hearth-rug — and to say so out loud, decisively, refusing to be frightened a
  moment longer, is to dissolve the dream. But the refusal cannot be faked or rushed.
  It only works when the traveler has truly stopped believing the nonsense has any
  power over them; a half-hearted denial leaves the dream whole and tightening, and
  the cards settle back into their places, and the trial goes on.

notable_figures:
  - "The traveler who rose in the dock and named the court a pack of cards, and woke as they flew down upon her"
  - "The Queen of Hearts — screaming for sentence at the height of the trial, the loudest authority and the most pasteboard"
  - "The Red Queen — seized and shaken awake at the feast, the other refusal that ends the other country"

