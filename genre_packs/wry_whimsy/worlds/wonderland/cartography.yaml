      - id: the_cook
        label: the pepper-Cook
        tier: real_object
        binding:
          kind: npc
          ref: the_cook
        affordances:
          - speak_to
          - dodge_the_crockery
      - id: duchess_kitchen
        label: the Duchess's pepper-kitchen
        tier: real_object
        binding:
          kind: location_feature
          ref: wood_duchess_kitchen
        affordances:
          - enter
      - id: the_cheshire_cat
        label: the Cheshire-Cat
