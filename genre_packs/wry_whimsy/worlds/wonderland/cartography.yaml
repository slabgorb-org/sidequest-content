  # ── THE WOOD OF NO NAMES — the menace of forgetting, and the Knight ────────
  the_wood_of_no_names:
    name: The Wood of No Names
    summary: "A wood where you forget your own name and the names of things, and the gentle White Knight escorts you through"
    description: >-
      A dark little wood where the names of things will not stay. Step under its
      branches and your own name slips away from you, and so do the words for tree and
      bird and the very thought of what you came to do; a Fawn walks fearless beside you
      here only because neither of you can remember to be afraid of the other. To stay too
      long is to lose the thread altogether — to go native in the dream, forget you ever
      had a waking life to return to, and never come out the far side at all. Through it
      comes the White Knight, gentle and clumsy and always tumbling off his horse, hung
      about with his own foolish inventions, who appoints himself your escort and sees you
      safe to the edge and the last square beyond.
    terrain: forest
    controlled_by: the_rigged_game
    adjacent:
      - the_tweedle_wood
      - the_coronation_feast
    landmarks:
      - the line of branches under which all names slip away
      - the Fawn that walks beside you because neither can remember fear
      - the far edge where the names come back and the last square waits
      - the White Knight's track, strewn with his fallen foolish inventions
    entities:
      - id: the_white_knight
        label: the White Knight
        tier: real_object
        binding:
          kind: npc
          ref: the_white_knight
        affordances:
          - speak_to
          - be_escorted
      - id: the_namelessness
        label: the wood's stealing-away of all names
        tier: real_object
        binding:
          kind: location_feature
          ref: nonames_the_forgetting
        affordances:
          - resist
          - lose_the_thread
      - id: the_fearless_fawn
        label: the Fawn that has forgotten to fear
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE CORONATION FEAST — the glass climax ────────────────────────────────
  the_coronation_feast:
    name: The Coronation Feast
    summary: "The eighth square — you are crowned, the feast erupts into chaos, and you wake by shaking the Queen"
    description: >-
      The eighth square at last, and a golden crown that fastens itself upon your head:
      you are a Queen now, with a Red Queen and a White Queen seated stiff and sharp to
      either side of you, putting you through your catechism of nonsense. Then the great
      coronation feast: a leg of mutton that is introduced and bows, a pudding that
      objects to being cut, candles grown up to the roof, and guests who climb into the
      dishes and the soup. The Red Queen shrinks and the White Queen vanishes into the
      tureen; the whole table tilts and rises in an uproar, plates and all taking wing.
      In the middle of the wreck you seize the Red Queen and shake her with all your might —
      and she dwindles small and soft in your hands, and you are awake, and it was all a
      dream, and the kitten is on your knee.
    terrain: hall
    controlled_by: the_rigged_game
    adjacent:
      - humpty_dumptys_wall
      - the_wood_of_no_names
    landmarks:
      - the eighth square where the crown fastens itself on your head
      - the high seats where the Red Queen and White Queen put you through your catechism
      - the feast of bowing mutton, objecting pudding, and roof-high candles
      - the moment of uproar where you seize and shake the Queen and wake
    entities:
      - id: the_red_queen
        label: the Red Queen at the feast
        tier: real_object
        binding:
          kind: npc
          ref: the_red_queen
        affordances:
          - speak_to
          - seize_and_shake
      - id: the_white_queen
        label: the White Queen at the feast
        tier: real_object
        binding:
          kind: npc
          ref: the_white_queen
        affordances:
          - speak_to
      - id: the_feast_table
        label: the coronation feast that rises into uproar
        tier: real_object
        binding:
          kind: location_feature
          ref: feast_coronation_table
        affordances:
          - sit
          - overturn
      - id: the_self_crowning_crown
        label: the crown that fastens itself on your head
        tier: flavor_only
    rivers: []
    settlements: []
