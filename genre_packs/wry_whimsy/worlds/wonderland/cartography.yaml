  # ── THE QUEEN'S CROQUET-GROUND — the painted roses and the living game ─────
  the_queens_croquet_ground:
    name: The Queen's Croquet-Ground
    summary: "A living croquet-game of flamingoes and hedgehogs, painted roses, and a Queen who cries off with all heads"
    description: >-
      A wide, smooth lawn where the Queen of Hearts plays croquet with everything
      alive: the mallets are live flamingoes that twist their necks to look at you, the
      balls are curled hedgehogs that uncurl and crawl off, and the hoops are soldiers
      of the pack bent double on their hands and feet. By the entrance, three flat
      card-gardeners — Two, Five, and Seven — slap red paint over a rose-tree they
      planted white by mistake, in terror of the Queen finding it out. The whole game is
      chaos, no one keeps to turns, and the Queen storms about the ground crying "Off
      with his head!" at every other moment. Aside from it, a Gryphon dozes in the sun,
      and will haul you off to a weeping Mock Turtle at the edge of the lawn to hear his
      history.
    terrain: lawn
    controlled_by: the_queens_terror
    adjacent:
      - the_tulgey_wood
      - the_hall_of_justice
    landmarks:
      - the croquet-lawn of flamingo mallets, hedgehog balls, and soldier hoops
      - the rose-tree the gardeners are painting red before the Queen sees it
      - the sunny bank where the Gryphon dozes
      - the lawn's edge where the Mock Turtle sits weeping his history
    entities:
      - id: the_queen_of_hearts
        label: the Queen of Hearts
        tier: real_object
        binding:
          kind: npc
          ref: the_queen_of_hearts
        affordances:
