          - follow_to_the_mock_turtle
      - id: the_mock_turtle
        label: the Mock Turtle
        tier: real_object
        binding:
          kind: npc
          ref: the_mock_turtle
        affordances:
          - speak_to
          - hear_his_history
      - id: flamingo_mallets
        label: the flamingo mallets and hedgehog balls
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE HALL OF JUSTICE — the card climax ──────────────────────────────────
  the_hall_of_justice:
    name: The Hall of Justice
    summary: "The trial of the Knave over the stolen tarts — a court with a verdict but no procedure"
    description: >-
      A court-room packed with the whole pack: the King and Queen of Hearts on their
      throne, the twelve jurors scribbling on slates, the witnesses called in turn, and
      the Knave of Hearts in chains before them, accused of stealing the Queen's tarts.
      It is a court that has every form of justice and none of its substance — the King,
      a mild and muddled judge, would rather pardon everyone and quietly does so under
      his breath, while the Queen wants the sentence first and the verdict afterwards. The
      tarts sit on the table in plain sight. The evidence is nonsense read out as
      poetry, and as the case collapses into pure absurdity it is here, growing back to
      your full size, that you may at last say it plainly: they are nothing but a pack of
      cards. And the whole country flies up about you.
    terrain: court
    controlled_by: the_queens_terror
    adjacent:
      - the_queens_croquet_ground
      - the_looking_glass
    landmarks:
      - the throne where the King and Queen of Hearts preside over the trial
      - the jury-box of twelve creatures scribbling on slates
      - the table where the stolen tarts sit in plain sight
      - the witness-stand where the evidence is read out as nonsense verse
    entities:
      - id: the_king_of_hearts
        label: the King of Hearts
        tier: real_object
        binding:
          kind: npc
          ref: the_king_of_hearts
        affordances:
          - speak_to
          - appeal_to
      - id: the_knave_of_hearts
        label: the Knave of Hearts
        tier: real_object
        binding:
          kind: npc
          ref: the_knave_of_hearts
        affordances:
          - speak_to
          - defend
      - id: the_court_table
        label: the table of stolen tarts and evidence
        tier: real_object
        binding:
          kind: location_feature
          ref: justice_court_table
        affordances:
          - inspect
          - testify
      - id: the_jury_box
        label: the jury-box of twelve scribbling creatures
        tier: real_object
        binding:
          kind: location_feature
          ref: justice_jury_box
        affordances:
          - inspect
          - upset
      - id: the_packed_court
        label: the whole pack crowded into the court
        tier: flavor_only
    rivers: []
    settlements: []

  # ══ THE SEAM ═══════════════════════════════════════════════════════════════

  # ── THE LOOKING-GLASS — the mirror threshold between the two countries ─────
  the_looking_glass:
    name: The Looking-Glass
    summary: "The tall mantelpiece mirror whose silver surface goes soft, the one passage between the two countries"
    description: >-
      A tall mirror over a mantelpiece, in a quiet room of clocks and china and a
      dying fire. The card country lies behind you and something else waits on the other
      side of the glass, where everything is reversed — the books read backwards, the
      clock has a little face, and the room beyond is the same room turned the wrong way
      round. Touch the surface and it does not stop you: the silvery glass goes soft and
      bright as a gauze, and melts away like a haze, so that you step clean through the
      mantelpiece into the room beyond. This is the one threshold between Card Country
      and Looking-Glass Land, and it is never a wall — only a passage that asks to be
      stepped through.
    terrain: threshold
    controlled_by: no_one
    adjacent:
      - the_hall_of_justice
      - the_garden_of_live_flowers
    landmarks:
      - the tall mirror over the mantelpiece, its surface gone soft as gauze
      - the looking-glass room beyond, the same room turned the wrong way round
      - the clock with a little face and the books printed backwards
      - the dying fire and the chessmen walking on the hearth
    entities:
      - id: the_mirror
        label: the looking-glass over the mantelpiece
        tier: real_object
        binding:
          kind: location_feature
          ref: glass_the_mirror
        affordances:
          - inspect
          - touch
          - step_through
      - id: the_mantelpiece
        label: the mantelpiece beneath the glass
        tier: flavor_only
    rivers: []
    settlements: []

  # ══ LOOKING-GLASS LAND ═════════════════════════════════════════════════════

  # ── THE GARDEN OF LIVE FLOWERS — the glass entry ───────────────────────────
  the_garden_of_live_flowers:
    name: The Garden of Live Flowers
    summary: "A garden of talking, gossiping flowers, and the hill from which the whole country is a chessboard"
    description: >-
      The first ground of the looking-glass country: a garden of flowers in a bed,
      every one of them able to talk and most of them inclined to be rude. A Tiger-lily
      runs the conversation and keeps the others in order; a Rose passes remarks on your
      colour and the thinness of your petals; a Daisy chimes in until the Tiger-lily
      hushes the whole bed. The path here will not go where you point it and brings you
      back to the door however you walk away — until you give up and walk the other way.
      Beyond the garden rises a low hill, and from its top the whole country is spread
      out below you, marked off into squares by little brooks and low green hedges, for
      all the world like a great chessboard with a game in play across it.
    terrain: garden
    controlled_by: the_rigged_game
    adjacent:
      - the_looking_glass
      - the_chessboard_country
    landmarks:
      - the flower-bed where the Tiger-lily, the Rose, and the Daisy hold forth
      - the path that will not go where you point it
      - the low hill from whose top the country lies out as a chessboard
      - the little brooks and hedges that rule the land into squares
    entities:
      - id: the_live_flowers
        label: the bed of talking flowers
        tier: real_object
        binding:
          kind: location_feature
          ref: flowers_live_bed
        affordances:
          - speak_to
          - listen
      - id: the_chessboard_hill
        label: the hill overlooking the chessboard country
        tier: real_object
        binding:
          kind: location_feature
          ref: flowers_chessboard_hill
        affordances:
          - climb
          - survey
      - id: the_contrary_path
        label: the path that brings you back to the door
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE CHESSBOARD COUNTRY — the squares, the brooks, the queens ───────────
  the_chessboard_country:
    name: The Chessboard Country
    summary: "The open country ruled into squares by brooks, where the chess-game runs and the queens set the moves"
    description: >-
      The great country itself, laid out in squares of green and white, each square
      divided from the next by a little brook you must leap or a low hedge you must
      clamber. To cross a brook is to advance a square, and crossing the first puts you in
      a railway-carriage that leaps clean over the next while a chorus of passengers
      frets that you have no ticket and your time is worth a thousand pounds a minute.
      The Red Queen meets you here, sharp and quick, and runs you breathless hand-in-hand
      only to leave you exactly where you started, for here it takes all the running you
      can do to keep in the same place. She sets out the game and the squares you must
      pass to reach the eighth and be crowned. The White Queen drifts through it the other
      way, gentle and muddled, living backwards and bleeding before she pricks her finger.
    terrain: chessboard
    controlled_by: the_rigged_game
    adjacent:
      - the_garden_of_live_flowers
      - the_tweedle_wood
      - humpty_dumptys_wall
    landmarks:
      - the squares of green and white divided by leaping-brooks and hedges
      - the railway-carriage that leaps you clean over a brook
      - the Red Queen's hill, where all the running keeps you in the same place
      - the road across the board toward the eighth square and the crown
    entities:
      - id: the_red_queen
        label: the Red Queen
        tier: real_object
        binding:
          kind: npc
          ref: the_red_queen
        affordances:
          - speak_to
          - run_with
      - id: the_white_queen
        label: the White Queen
        tier: real_object
        binding:
          kind: npc
          ref: the_white_queen
        affordances:
          - speak_to
      - id: the_leaping_brook
        label: a brook between the squares
        tier: real_object
        binding:
          kind: location_feature
          ref: chessboard_leaping_brook
        affordances:
          - leap
          - advance_a_square
      - id: the_railway_carriage
        label: the railway-carriage over the brook
        tier: real_object
        binding:
          kind: location_feature
          ref: chessboard_railway_carriage
        affordances:
          - board
          - ride
      - id: the_green_and_white_squares
        label: the squares of green and white
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE TWEEDLE WOOD — the brothers and the sleeping King ──────────────────
  the_tweedle_wood:
    name: The Tweedle Wood
    summary: "A wood where two fat brothers recite a poem and a Red King sleeps the whole country into being"
    description: >-
      A wood off the high road where two stout little men stand under a tree, marked
      DEE and DUM on their collars, exactly alike and forever contradicting each other.
      Tweedledum and Tweedledee will shake your hand both at once, agree to recite, and
      give you the whole of the Walrus and the Carpenter — a long, sad, gluttonous tale of
      oysters lured up the beach and eaten — before falling to quarrel over a spoilt
      rattle and arming themselves with bolsters and saucepans for a battle the crows put
      off. Deeper among the trees the Red King lies asleep under a tree, snoring like a
      kettle, and the brothers will tell you the thing you least want to hear: that you
      are only a sort of thing in his dream, and if he were to wake, you would go out — bang
      — like a candle.
    terrain: forest
    controlled_by: the_rigged_game
    adjacent:
      - the_chessboard_country
      - the_wood_of_no_names
    landmarks:
      - the tree where Tweedledum and Tweedledee stand collared DEE and DUM
      - the spot where they recite the whole of the Walrus and the Carpenter
      - the heap of bolsters and saucepans for their put-off battle
      - the tree deeper in where the Red King sleeps and snores like a kettle
    entities:
      - id: tweedledum_and_tweedledee
        label: Tweedledum and Tweedledee
        tier: real_object
        binding:
          kind: npc
          ref: tweedledum_and_tweedledee
        affordances:
          - speak_to
          - hear_the_recitation
      - id: the_sleeping_red_king
        label: the sleeping Red King
        tier: real_object
        binding:
          kind: npc
          ref: the_sleeping_red_king
        affordances:
          - approach
          - try_to_wake
      - id: the_kings_tree
        label: the tree where the Red King sleeps
        tier: flavor_only
    rivers: []
    settlements: []

  # ── HUMPTY DUMPTY'S WALL — the egg and the fighting beasts ─────────────────
  humpty_dumptys_wall:
    name: Humpty Dumpty's Wall
    summary: "The great egg balanced on a narrow wall, master of words, and the Lion and Unicorn fighting for the crown"
    description: >-
      A high, narrow wall, so narrow you wonder how he keeps his balance, on top of
      which sits a great egg with a face, arms, and a cravat — Humpty Dumpty himself, who
      takes your word for an egg as an insult and your conversation as a contest. He is
      master of all words: he pays them extra to mean what he chooses, unpacks the hard
      ones of Jabberwocky for you, and never doubts that if he fell the King would send
      all his horses and all his men to set him up again. Below the wall, on the open
      ground, the Lion and the Unicorn are fighting for the crown all round the town, drum
      and all, pausing only to share out cake that must be handed round before it is cut.
    terrain: open
    controlled_by: the_rigged_game
    adjacent:
      - the_chessboard_country
      - the_coronation_feast
    landmarks:
      - the high narrow wall where Humpty Dumpty sits balanced
