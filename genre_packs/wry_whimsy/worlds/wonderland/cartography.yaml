      - id: the_jabberwock
        label: the Jabberwock
        tier: real_object
        binding:
          kind: npc
          ref: the_jabberwock
        affordances:
          - flee
          - confront
      - id: tulgey_trees
        label: the close-met trees of the tulgey wood
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE MAD TEA-PARTY — six o'clock forever ────────────────────────────────
  the_mad_tea_party:
    name: The Mad Tea-Party
    summary: "A table set under a tree, stuck forever at six o'clock, where the tea never ends"
    description: >-
      A large table set out under a tree before the Hatter's house, laid for a great
      many and crowded into one corner by three. The Hatter, with a price-ticket still
      in his hatband, and the March Hare, with straw woven through his fur, take their
      tea between a Dormouse fast asleep, whom they use for a cushion and an elbow-rest.
      Time has quarrelled with the Hatter and stopped his watch dead, so it is always
      six o'clock, always tea-time, and they move round and round the table to find clean
      cups rather than wash up. The questions have no answers, the riddles have no
      solutions, and you may be told quite firmly there is no room when the table is
      three-quarters empty.
    terrain: garden
    controlled_by: the_queens_terror
    adjacent:
      - the_tulgey_wood
    landmarks:
      - the long table laid for many and crowded into one corner
      - the Hatter's stopped watch fixed forever at six o'clock
      - the teapot the Dormouse is at last stuffed into
      - the tree before the Hatter's house where the party never breaks up
    entities:
      - id: the_hatter
        label: the Hatter
        tier: real_object
        binding:
          kind: npc
          ref: the_hatter
        affordances:
