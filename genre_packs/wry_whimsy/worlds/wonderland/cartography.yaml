map_resolution: null
map_style: >-
  A hand-engraved Tenniel-plate map of one dream-territory drawn in black line
  and dense cross-hatching, with a restrained period hand-tint. The lower half is
  Card Country, laid out as a heraldic playing-card garden — clipped hedge-maze
  paths, painted rose-trees in rows, a flat croquet lawn, a court like a printed
  card. The upper half is Looking-Glass Land, a vast green-and-white chessboard
  divided into squares by little brooks ruled across the plate like staves. The two
  halves meet at a tall mantelpiece mirror engraved edge-on, its silver face
  reflecting one country softly into the other, so the garden and the board seem to
  lean into each other across the glass. No compass rose; the doors below and the
  squares above carry the eye.
navigation_mode: region
starting_region: the_hall_of_doors
world_name: Wonderland

regions:

  # ══ CARD COUNTRY ═══════════════════════════════════════════════════════════

  # ── THE HALL OF DOORS — the start ──────────────────────────────────────────
  the_hall_of_doors:
    name: The Hall of Doors
    summary: "A long low hall of locked doors, a glass table, and the bottle and cake that change your size"
    description: >-
      A long, low hall lit all round with a row of lamps hanging from the roof,
      and every door in it locked. You have come down the rabbit-hole into the
      middle of it, and there is no way out but the doors. Low down behind a curtain
      is a little door, no more than fifteen inches high, and through its keyhole
      lies the loveliest garden you ever saw — and you are far too big to follow your
      eye through it. On a little three-legged table of solid glass stand the two
      cures for being the wrong size: a bottle labelled DRINK ME in large letters,
      and under it, in a small glass box, a very small cake marked EAT ME in
      currants. Neither is poison; both are nonsense; both work at once.
    terrain: hall
    controlled_by: the_queens_terror
    adjacent:
      - the_pool_of_tears
    landmarks:
      - the row of locked doors all the way round the long low hall
      - the little fifteen-inch door behind the curtain to the garden
      - the three-legged glass table that holds the bottle and the cake
      - the keyhole through which the loveliest garden can be seen but not reached
    entities:
      - id: little_garden_door
        label: the little fifteen-inch door to the garden
        tier: real_object
        binding:
          kind: location_feature
          ref: hall_little_garden_door
        affordances:
          - peer_through_keyhole
          - try_to_open
          - pass_through_when_small
      - id: drink_me_bottle
        label: the bottle labelled DRINK ME
        tier: real_object
        binding:
          kind: location_feature
          ref: hall_drink_me_bottle
        affordances:
          - inspect
          - drink
          - shrink
      - id: eat_me_cake
        label: the cake marked EAT ME
        tier: real_object
        binding:
          kind: location_feature
          ref: hall_eat_me_cake
        affordances:
          - inspect
          - eat
          - grow
      - id: glass_table
        label: the three-legged glass table
        tier: real_object
        binding:
          kind: location_feature
          ref: hall_glass_table
        affordances:
          - search
          - take_the_key
      - id: the_locked_doors
        label: the row of locked doors
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE POOL OF TEARS — the salt shore and the Rabbit's house ──────────────
  the_pool_of_tears:
    name: The Pool of Tears
    summary: "A salt pool of your own giant weeping, a caucus-race shore, and the White Rabbit's house"
    description: >-
      A great pool of salt water spreads across the bottom of the hall, nine inches
      deep and stretching off into the dark — and it is all your own, wept while you
      were nine feet tall and now nearly drowning you at three inches. Soaked,
      bewildered creatures swim and paddle in it: a Mouse, a Duck, a Dodo, a Lory, an
      Eaglet. On the shore beyond they wring themselves out and run a Caucus-race, a
      race with no start, no finish, and prizes for everyone. Past the shore stands a
      neat little house with a brass plate reading W. RABBIT, where the White Rabbit,
      forever late, mistakes you for his housemaid Mary Ann — and where one more sip
      of the wrong bottle leaves you grown so huge you fill the house and put an arm
      out the window.
    terrain: shore
    controlled_by: the_queens_terror
    adjacent:
      - the_hall_of_doors
      - the_tulgey_wood
    landmarks:
      - the salt pool wept while you were nine feet tall
      - the dripping shore where the Caucus-race runs round and round
      - the little house with the brass plate marked W. RABBIT
      - the upstairs window you fill with an arm when you grow too big
    entities:
      - id: white_rabbit
        label: the White Rabbit
        tier: real_object
        binding:
          kind: npc
          ref: white_rabbit
        affordances:
          - follow
          - speak_to
      - id: rabbits_house
        label: the White Rabbit's little house
        tier: real_object
        binding:
          kind: location_feature
          ref: pool_rabbits_house
        affordances:
          - enter
          - get_stuck_inside
      - id: caucus_race_shore
        label: the Caucus-race shore
        tier: real_object
        binding:
          kind: location_feature
          ref: pool_caucus_race_shore
        affordances:
          - join_the_race
          - dry_off
      - id: the_salt_pool
        label: the pool of your own tears
        tier: flavor_only
    rivers: []
    settlements: []

  # ── THE TULGEY WOOD — the deep nonsense wood and its dangers ───────────────
  the_tulgey_wood:
    name: The Tulgey Wood
    summary: "The deep nonsense wood — the Caterpillar's mushroom, the pepper-kitchen, the grinning Cat, and the Jabberwock"
    description: >-
      A deep, close wood where the trees meet overhead and the rules of the world
      grow thin. On a great mushroom sits a blue Caterpillar three inches high, smoking
      a hookah and asking, with no warmth at all, who you are — and the two sides of his
      mushroom will set you any size you please. Off through the trees a kitchen
      smokes with pepper enough to make the very air sneeze, where a Duchess nurses a
      howling baby and a Cook flings the crockery. Overhead, on a bough, a Cat with an
      enormous grin appears and vanishes a piece at a time, and will tell you that
      everyone here is mad, including you. And somewhere in the deepest part of the
      wood, with eyes of flame and jaws that bite, the Jabberwock comes whiffling — the
      one thing in this country that means you real harm.
    terrain: forest
    controlled_by: the_queens_terror
    adjacent:
      - the_pool_of_tears
      - the_mad_tea_party
      - the_queens_croquet_ground
    landmarks:
      - the great mushroom where the blue Caterpillar smokes his hookah
      - the pepper-kitchen where the Duchess nurses the baby and the Cook throws crockery
      - the bough where the Cheshire-Cat grins and vanishes a piece at a time
      - the deepest tangle of the wood where the Jabberwock comes whiffling through
    entities:
      - id: the_caterpillar
        label: the blue Caterpillar on the mushroom
        tier: real_object
        binding:
          kind: npc
          ref: the_caterpillar
        affordances:
