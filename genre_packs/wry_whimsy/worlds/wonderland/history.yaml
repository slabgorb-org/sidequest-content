# Wonderland — World History (Wry Whimsy / wonderland)
#
# The PAST of the dream-territory, not a campaign arc: what the two countries
# are, how the two raging queens came to rule and the two kings fell to nothing,
# why a monster runs loose in the wood, and what kind of place this is at root.
# Played dead straight from Lewis Carroll's Alice's Adventures in Wonderland
# (1865) and Through the Looking-Glass (1871), treated as ONE dream-territory —
# Tenniel's woodcuts, never Disney 1951. Story-Now framing: these are hooks,
# anchored facts, and named figures, not session gates or a fixed resolution.
#
# `chapters:` here are the dream's own "history" — the way Wonderland earnestly
# accounts for itself, told without a wink. Each carries `tropes:` instance-refs
# the chapter seeds — every id resolves against the resolved trope set (world
# tropes.yaml ids ∪ genre tropes.yaml ids). These are seeded LATENT (status:
# dormant); nothing here triggers or resolves them.

chapters:

  # ── CHAPTER 1 — THE TWO COUNTRIES ──────────────────────────────────────────
  - id: the_two_countries
    label: "The Two Countries — A Card Garden and a Game of Chess"
    era: "the dream as it has always stood"
    atmosphere: >-
      There is no founding to tell. The dream was never built; it is simply here,
      and has two halves that lean into each other across a mirror. Below the
      glass lies Card Country, a heraldic playing-card court laid out as a clipped
      garden — rose-trees in rows, a flat croquet lawn, a court like a printed
      card — where a whole pack of pasteboard people go about on edge and the
      Queen of Hearts rules by terror-theatre. Above the glass, through it, lies
      Looking-Glass Land, a vast green-and-white country ruled off into squares by
      little brooks and low hedges, a chess-game caught in mid-play with the
      pieces alive and walking their moves. The two are one territory and one
      dream; a tall mantelpiece mirror is the only door between them, and its
      silver face goes soft as gauze to let a traveler through. To cross into
      either is to find that nonsense, not reason, is the standing law.
    established_facts:
      - "Wonderland is one dream-territory in two halves: Card Country below the mirror, Looking-Glass Land above it."
      - "Card Country is a heraldic playing-card court laid out as a clipped garden, peopled by a whole pack of living cards."
      - "Looking-Glass Land is a country ruled into green-and-white squares by little brooks and hedges, a chess-game in play with the pieces alive."
      - "A tall mantelpiece mirror is the one passage between the two countries; its glass goes soft as gauze to admit a traveler."
      - "Nonsense, not reason, is the law of both halves — and everyone but the traveler treats it as the most ordinary thing in the world."
    hooks:
      - "Whichever way the traveler walks, they are sure to get somewhere, if only they walk long enough — but the somewhere is rarely the one they aimed at."
      - "The mirror is never a wall, only a passage that asks to be stepped through; the country on the far side is this room turned the wrong way round."
      - "A traveler who asks how the dream began gets no answer worth keeping; the place finds the question dull."
    tropes:
      - id: nonsense_as_authority
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the standing fact that nonsense, not reason, holds authority in both halves of the dream."

  # ── CHAPTER 2 — THE RAGING QUEENS, THE USELESS KINGS ───────────────────────
  - id: the_queens_and_the_kings
    label: "The Raging Queens and the Useless Kings"
    era: "the dream as it now runs"
    atmosphere: >-
      Power in Wonderland is held by women in a fury, and the men beside them have
      fallen to nothing. In Card Country the Queen of Hearts screams "Off with
      their heads!" at a wrong word, a botched croquet stroke, a rose painted the
      wrong colour — a death-sentence about once a minute, delivered in earnest,
      the whole court flattening itself in terror. And trailing quietly at her
      heel comes the mild King of Hearts, the do-nothing man on the bench, who
      pardons everyone she condemns under his breath, to the company generally, so
      that by day's end nobody has been beheaded at all. Through the glass it is
      the Red Queen who rules: sharp, quick, drilling her country through a rigged
      race in which all the running you can do keeps you in the same place. And the
      Red King — he merely sleeps, snoring under his tree, having dropped clean out
      of his own kingdom; some say the whole dream is only a thing that he is
      dreaming. The women rage and rule. The men sleep or dither. That is the shape
      of authority the traveler walks into.
    established_facts:
      - "The Queen of Hearts rules Card Country by terror, ordering beheadings over trifles roughly once a minute."
      - "The King of Hearts is a mild, useless judge who quietly pardons everyone the Queen condemns, so the sentences are almost never carried out."
      - "The Red Queen rules Looking-Glass Land, drilling her country through a rigged race where all the running you can do keeps you in the same place."
      - "The Red King has fallen to nothing but sleep, snoring under his tree — and it is said the whole dream may be only a thing he is dreaming."
      - "Real authority in Wonderland is female and furious; the kings have abdicated into pardon and sleep."
    hooks:
      - "The terror of the Queen of Hearts is sincere and the fear real, but the executions are theatre — the King's quiet pardons are the tell, and the traveler does not know which threat will be the exception."
      - "The Red Queen sets out the squares a traveler must pass to reach the eighth and be crowned, and calls her breathless pace plain good advice."
      - "No one will confirm or deny that the Red King is dreaming the world; the locals find it obvious, and the obvious answer is unbearable."
    tropes:
      - id: the_capricious_sentence
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Queen of Hearts' once-a-minute death-sentences and the King's quiet pardons behind them."
      - id: run_to_stay_in_place
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Red Queen's rigged race, established as the standing condition of the chessboard country."
      - id: only_a_thing_in_his_dream
        status: dormant
        progression: 0.0
        notes:
          - "PRIMED BUT LATENT — the sleeping Red King and the deep dread that the whole dream, traveler and all, is only something he dreams. Seeded at zero; never resolved by history."

  # ── CHAPTER 3 — THE MONSTER IN THE WOOD ────────────────────────────────────
  - id: the_monster_in_the_wood
    label: "The Monster in the Wood — The Jabberwock and the Vorpal Blade"
    era: "the dream as it now runs"
    atmosphere: >-
      There is one thing in this dream that is not playing. Deep in the tulgey
      wood, where the trees meet overhead and the rules grow thin, the Jabberwock
      comes whiffling and burbling — jaws that bite, claws that catch, eyes of
      flame — and it is not theatre and not nonsense: it kills. Everything else in
      Wonderland threatens and pardons, rescales and releases, frightens and
      forgets; this one creature simply means harm and follows through. Against it
      there is the vorpal sword, which goes snicker-snack and takes the monster's
      head, so that the one who slays it comes galumphing back crying "O frabjous
      day!" But the country is built for waking, not killing, and the dream
      recoils from anyone who has drawn true blood in it. Violence is the right
      answer exactly once, against exactly this — and it leaves a mark the
      nonsense-world remembers everywhere after.
    established_facts:
      - "The Jabberwock — jaws that bite, claws that catch, eyes of flame — runs loose in the tulgey wood and is the one genuinely lethal thing in the dream."
      - "Unlike every other threat in Wonderland, the Jabberwock cannot be out-argued, refused, dosed, or woken away from; it kills."
      - "The vorpal sword is the only answer to it — it goes snicker-snack and takes the monster's head."
      - "The dream is built for waking, not killing; one who draws true blood in it is marked, and the nonsense-country recoils from them after."
    hooks:
      - "The warning 'beware the Jabberwock' carries a weight nothing else in Wonderland carries — when the country sounds sincere about danger, this is why."
      - "The vorpal blade waits for a hand willing to use it; wit and refusal, which solve everything else here, do not touch the monster."
      - "Slaying the Jabberwock is a true victory and a true cost at once — the day is frabjous and the killer is changed."
    tropes:
      - id: the_jabberwock
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the one lethal thing in a world of harmless terror, established as a standing danger of the tulgey wood."

  # ── CHAPTER 4 — THE NATURE OF THE PLACE ────────────────────────────────────
  - id: the_nature_of_the_place
    label: "The Nature of the Place — Nonsense Is the Law, and the Way Out Is to Wake"
    era: "the dream as it has always stood"
    atmosphere: >-
      Under all the queens and courts and woods runs the one truth of the place,
      and it is the Cheshire-Cat who says it plainest: we're all mad here. Nonsense
      is not a thing that happens in Wonderland; it is the law the dream is built
      on. Time has quarrelled with the Hatter and stopped at six o'clock; a word
      means whatever a great egg pays it to mean; a body grows and shrinks at the
      bidding of a bottle or a cake or two sides of a mushroom; a court hands down
      the sentence first and the verdict afterwards. There is no door in any wall,
      no road that leads out, no clever argument that wins free — because the way
      home is not a way at all but a waking. The traveler leaves by refusing the
      dream decisively: by rising in the dock to name the court nothing but a pack
      of cards, or seizing the Red Queen at the feast and shaking her until the
      whole thing comes apart in their hands. And here is the trap the dream keeps
      for those who like it too well — the more a traveler reshapes the place, the
      more it wants to keep them, and the harder the waking comes.
    established_facts:
      - "Nonsense is the standing law of Wonderland — not an event but the rule the dream runs on."
      - "There is no road or door that leads out of the dream; the only way home is to WAKE."
      - "Waking is done by refusing the dream decisively — naming the court a pack of cards, or seizing the Red Queen and shaking her until it comes apart."
      - "The refusal only works when the traveler truly stops being afraid; a half-hearted denial leaves the dream intact."
      - "The deeper a traveler enters and reshapes the dream, the more it wants to keep them, and the harder the waking becomes."
    hooks:
      - "A traveler hunting for an exit door or a road home will not find one — the search itself is part of how the dream holds on."
      - "The Cheshire-Cat will tell the plain truth of the place and then refuse to be relied upon — the one sane voice that will not stay to be one."
      - "Every threat that can be out-argued, refused, or walked away from is theatre; learning to tell theatre from the one real thing is the whole craft of getting home."
    tropes:
      - id: stuck_in_the_nonsense
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the perpetual-present trap, the dream's tendency to enclose a traveler who engages it on its own terms."
      - id: the_truth_telling_cat
        status: dormant
        progression: 0.0
        notes:
          - "Seeded latent — the Cheshire-Cat, the one plain-truth voice in the dream, established as a standing feature of the wood."
      - id: the_pack_of_cards
        status: dormant
        progression: 0.0
        notes:
          - "PRIMED BUT LATENT — the way home itself: decisive refusal dissolves the dream and wakes the traveler. Seeded at zero; never triggered or resolved by history."

  # ── POI LANDSCAPE MANIFEST (scripts/generate_poi_images.py) ─────────────────
  #
  # This chapter is NOT a history-chapter — it carries no tropes and seeds
  # nothing. It exists only to enumerate Wonderland's renderable landscapes for
  # the POI image pipeline, which reads chapters[].points_of_interest[]
  # exclusively. Each `slug` and `region` matches a cartography.yaml region id.
  #
  # Z-Image discipline (per PROMPTING_Z_IMAGE.md; FULL REWRITE 2026-06-02 after
  # Keith's "too florid" verdict on the validation renders):
  #   - CAMERA-STYLE SCAFFOLD, not prose. Each `solo` is a shot list:
  #     [medium anchor] + [shot] + [foreground 1-3 concrete] + [middle 1-3] +
  #     [background] + [light] + [mood] + safety clause. Short clauses, concrete
  #     nouns. 80-150 words. Long-and-novelistic is worse than short.
  #   - LEAD WITH THE MEDIUM: open every solo "Pen-and-ink line illustration, ..."
  #     The buried suffix anchor was not reliably steering the medium in the
  #     validation renders, so the solo reinforces it up front. (This supersedes
  #     the older "no style words in solo" rule for this world.) Do NOT pile on
  #     hatching / cross-hatching / engraving-density vocabulary — that imports
  #     dense ruled-line fields and aliases the sky into moiré. Open cream-paper
  #     sky; that is the whole moiré fix.
  #   - COMMIT EVERY FIGURE (Z-Image, corrected 2026-06-02): render each figure
  #     and crowd CONCRETELY and CONFIDENTLY as a plain camera-style noun. Z-Image
  #     renders crowds fine. The uncanny mush came from HEDGING — "small and
  #     distant", "only suggested", "a mass of dim shapes, not individuated", "a
  #     blur rather than a crowd" tell the model to draw figures and de-emphasize
  #     them at once → half-formed bodies. NEVER hedge a figure. Either name it as
  #     a real thing the camera sees (e.g. "a jury box of twelve animal jurors",
  #     "the Queen in a red gown directing a line of card-soldiers") or leave it
  #     out. Carroll's scenes KEEP their casts, rendered plainly.
  #   - NO ABSTRACT ACTION: unrenderable motion ("food takes to the air", "the
  #     table tips into uproar") renders as unreadable blobs. Use concrete static
  #     nouns instead (a domed platter, an overturned cup).
  #   - SELECTIVE HAND-TINT: name 1-3 concrete colours per scene (red roses, gold
  #     crown, blue waistcoat); let the rest stay tonal line on cream paper.
  #   - backdrop is the same place as a wider establishing shot, same scaffold.
  #   - Source-faithful Carroll, NEVER the 1951 film: six-o'clock tea, painted
  #     roses, brook-divided squares, the bottle and cake on the glass table, the
  #     egg in a cravat on the wall.
  - id: the_dream_territory
    label: "The Dream-Territory — Renderable Landscapes"
    era: "the dream as the traveler walks it"
    atmosphere: >-
      The standing places of the dream, hall by garden by wood — the long hall of
      locked doors where a traveler comes to ground, the salt pool and the
      Rabbit's house, the deep tulgey wood with its mushroom and pepper-kitchen,
      the endless tea-table and the painted croquet-lawn, the court of the stolen
      tarts, the mirror that joins the two countries, and beyond it the talking
      flowers, the chessboard, the Tweedle wood, the egg on the wall, and the
      coronation feast. This chapter holds no chapter's tropes; it is the map made
      renderable, nothing more.
    points_of_interest:

      # ══ CARD COUNTRY ═════════════════════════════════════════════════════════

      - name: The Hall of Doors
        slug: the_hall_of_doors
        region: the_hall_of_doors
        type: hall
        description: >-
          The long low hall where a traveler comes down the rabbit-hole: a row of
          locked doors all the way round, a tiny curtained door no more than
          fifteen inches high opening on a bright garden beyond, and a three-legged
          glass table holding a labelled bottle and a small cake.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, interior shot down a long low narrow
            hall. Foreground: a small three-legged glass table holding a little
            bottle with a paper label and a small cake. Middle ground: many shut
            wooden doors of different sizes along both walls, a row of small hanging
            lamps overhead. Background: a tiny arched door low in the far wall,
            half behind a red curtain, standing ajar on a bright green sunlit garden
            with flowers. Soft warm lamplight. Quiet, expectant, strange. No text,
            no caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot down a long low narrow hall,
            many shut wooden doors of varied sizes along both walls, hanging lamps
            overhead, a three-legged glass table in the middle, a tiny curtained
            door in the far wall ajar on a bright green sunlit garden. No text, no
            caption, no watermark.

      - name: The Pool of Tears
        slug: the_pool_of_tears
        region: the_pool_of_tears
        type: shore
        description: >-
          A great salt pool of giant tears spread across the bottom of the vast
          hall, and the wet shore beyond it where soaked, bewildered creatures
          gather to wring themselves out and run the caucus-race.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, interior shot of a vast dim hall.
            Foreground: a narrow wet sandy shore where a ring of wet bedraggled
            animals stand dripping — a brown mouse, a white duck, a grey dodo, a
            green parrot and a few others, shaking themselves dry. Middle ground: a
            wide shallow pool of water spreading across the stone floor. Background:
            tall dim walls. Soft cool light. Damp, comic, bewildered. No text, no
            caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a vast dim hall, a wide
            shallow pool flooding the stone floor, a narrow wet sandy shore along
            one side, tall dim walls behind. No text, no caption, no watermark.

      - name: The White Rabbit's House
        slug: white_rabbits_house
        region: the_pool_of_tears
        type: house
        description: >-
          A neat little house with a brass door-plate, into which a traveler grown
          far too large has wedged themselves — one arm thrust out of an upstairs
          window and one foot jammed up the chimney.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, exterior shot of a neat little
            tile-roofed cottage with a small brass plate by the door. Foreground:
            three small animals in coats — a lizard, a guinea-pig, a rabbit — backing
            away across the garden path in alarm, looking up. Middle ground: the
            cottage, far too small for what is inside it — one enormous human arm
            thrust straight out of an upstairs window, one huge foot wedged up the
            chimney, the walls bulging. Background: a low hedge and open cream-paper
            sky. Bright daylight. Comic, alarmed, absurd. No text, no caption, no
            watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a neat little tile-roofed
            cottage with a brass door-plate, an enormous human arm out of an upstairs
            window and a huge foot up the chimney, the walls bulging, a low hedge and
            open cream-paper sky behind. No text, no caption, no watermark.

      - name: The Caterpillar's Mushroom
        slug: caterpillars_mushroom
        region: the_tulgey_wood
        type: landmark
        description: >-
          A great mushroom standing in the deep wood, broad as a small table, with
          a blue caterpillar three inches high seated upon its top, smoking a long
          hookah.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, close shot in a deep wood. Foreground: a
            single great round-capped mushroom, broad and flat as a small table, and
            seated upright on top of it a large blue caterpillar reared up tall like
            a person, several pairs of small arms along its body, one hand holding
            the mouthpiece of a long curled hookah-pipe, the bowl on the cap, a thin
            curl of smoke. Background: tall dark green trees crowding close, open
            cream-paper above. Soft dim woodland light. Calm, oracular, strange. No
            text, no caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, close shot in a deep wood, a single great
            round-capped mushroom broad and flat on top with a long curled
            hookah-pipe resting on it, tall dark green trees crowding close all
            around. No text, no caption, no watermark.

      - name: The Duchess's Pepper-Kitchen
        slug: duchess_pepper_kitchen
        region: the_tulgey_wood
        type: landmark
        description: >-
          A smoky cottage kitchen thick with pepper enough to make the air sneeze,
          a great cauldron of soup on the fire, and crockery flung and shattering
          all about.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, interior shot of a cramped low cottage
            kitchen, a thick haze of pepper-dust in the air. Foreground: broken
            white plates, cups and saucers scattered across the stone floor.
            Middle ground: a cook in an apron at a smoky hearth stirring a great
            black cauldron of soup, steam rising. Background: pots and ladles
            hanging crooked on the walls. Warm smoky firelight. Hot, close,
            disordered, comic. No text, no caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a cramped low cottage
            kitchen hazy with pepper-dust, a great black cauldron steaming on a
            smoky hearth, broken white crockery scattered across the stone floor,
            pots and ladles hanging crooked on the walls. No text, no caption, no
            watermark.

      - name: The Mad Tea-Party
        slug: the_mad_tea_party
        region: the_mad_tea_party
        type: landmark
        description: >-
          A long table laid for many and set out under a tree, crowded into one
          corner, littered with dirty cups, where it is perpetually six o'clock and
          the tea never ends.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, outdoor shot of a long table set under a
            large spreading tree before a small house. Foreground, jammed into one
            corner of the table: a thin man in a checked coat and a tall top-hat
            with a paper price ticket in the band, raising a teacup; beside him an
            upright brown hare in a buttoned coat with wisps of straw in its long
            ears, a forepaw lifted; and a small dormouse asleep inside a large
            teacup, only its head and tail showing. On the table: many mismatched
            cups, saucers and teapots, overturned cups, spilt tea, and a stopped
            pocket-watch with its hands at six. Background: green tree boughs and
            open cream-paper sky. Soft daylight. Absurd, cosy, mad. No text, no
            caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a long table laid with many
            mismatched cups and teapots under a large spreading tree before a small
            house, overturned cups and spilt tea along the cloth, green tree boughs
            and open cream-paper sky behind. No text, no caption, no watermark.

      - name: The Queen's Croquet-Ground
        slug: the_queens_croquet_ground
        region: the_queens_croquet_ground
        type: lawn
        description: >-
          A wide clipped lawn where a rose-tree is being hurriedly painted red,
          card-soldiers bend double to make the hoops, and live flamingoes serve as
          mallets.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, ground-level shot on a clipped green
            lawn. Foreground: one large flat playing-card gardener, a flat oblong
            card body and printed face, leaning into a small rose-tree and slapping
            red paint over its white roses from a paint-pot, red drips on the
            petals. Beside him a tall pink flamingo held upside-down by the legs
            like a croquet-mallet, and a curled brown hedgehog on the grass for a
            ball. Middle ground: the Queen of Hearts in a wide red gown and a gold
            crown stands directing a line of flat card-soldiers bent over into
            croquet-hoops across the lawn. Background: dark green trees and open
            cream-paper sky. Soft even daylight. Bright, busy, absurd. No text, no
            caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a clipped green lawn, a
            small rose-tree half-painted red in the foreground, a line of flat
            card-soldiers bent into croquet-hoops across the grass, dark green trees
            behind and open cream-paper sky above. No text, no caption, no watermark.

      - name: The Hall of Justice
        slug: the_hall_of_justice
        region: the_hall_of_justice
        type: court
        description: >-
          A crowded courtroom with a high throne for the King and Queen, a jury-box
          of small creatures scribbling on slates, and a table on which a dish of
          stolen tarts sits in plain sight.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, medium courtroom shot. Foreground left:
            a flat playing-card king and queen, oblong card bodies with printed
            faces and small red hearts, the king in a thin gold crown, the queen in
            a tall pointed crown, seated together at a high wooden bench. Foreground
            right: a young card-knave standing in a wooden dock, wrists in light
            chains, a small tray of red jam-tarts on a stand before him. Between
            them a white rabbit in a blue checked waistcoat raises a long brass
            herald's trumpet. Middle ground: a wooden jury box filled with twelve
            small animal jurors scratching on slates. Background: a plain panelled
            courtroom wall, open cream-paper above. Soft indoor light. Tense,
            absurd, formal. No text, no caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, wide shot of a panelled courtroom, a high
            wooden judge's bench, a wooden dock, a wooden jury box with twelve small
            animal jurors, a small table bearing a dish of red jam-tarts, open
            cream-paper above. No text, no caption, no watermark.

      # ══ THE SEAM ═══════════════════════════════════════════════════════════════

      - name: The Looking-Glass
        slug: the_looking_glass
        region: the_looking_glass
        type: threshold
        description: >-
          A tall mirror over a mantelpiece above a hearth, its silver surface gone
          soft and bright like a gauze, the one passage between the two countries.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, interior shot of a mantelpiece. Centre:
            a tall broad mirror in an ornate gold frame standing on the mantelshelf
            above a low hearth with a small fire. The mirror glass is bright silvery
            and softly glowing, a faint luminous haze at its centre, a dim reversed
            reflection of a quiet room within. Foreground: on the shelf, a small
            mantel clock with a little face and a few white china ornaments.
            Background: a plain panelled wall, open cream-paper above. Soft firelit
            glow. Still, uncanny, expectant. No text, no caption, no watermark.
          backdrop: >-
            Pen-and-ink line illustration, interior shot of a mantelpiece, a tall
            broad mirror in an ornate gold frame above a low hearth with a small
            fire, the glass bright silvery and softly glowing, a small clock and
            white china ornaments on the shelf, a plain panelled wall behind. No
            text, no caption, no watermark.

      # ══ LOOKING-GLASS LAND ═══════════════════════════════════════════════════════

      - name: The Garden of Live Flowers
        slug: the_garden_of_live_flowers
        region: the_garden_of_live_flowers
        type: garden
        description: >-
          A formal flower-bed of tall talking flowers holding forth among
          themselves, a low hill rising beyond, and the land past it laid out
          chequered like a board.
        visual_prompt:
          solo: >-
            Pen-and-ink line illustration, garden shot. Foreground: a formal
            flower-bed of tall full-blown flowers with little faces — an orange
            tiger-lily, red roses, white daisies — turned toward one another as if
            talking, leaves cocked like ears. Middle ground: a clear path running
