# =============================================================================

positive_suffix: >-
  a finely detailed Victorian wood-engraving plate in the style of John Tenniel
  from the 1865 first edition of Alice's Adventures in Wonderland — pen-and-ink
  line art, intricate and ornamental, with the refined draughtsmanship of a
  steel-engraved storybook plate. Confident black ink outlines of varying weight
  define the forms, and within them the drawing is dense with fine interior
  linework — delicate hatching, cross-hatching, and stippling that model texture,
  shadow, and depth — over generous areas of clean cream paper. A restrained
  hand-tinted wash sits lightly over the strong black line: muted period
  watercolour, soft and limited, never saturated, on a warm cream buff paper
  ground. Court figures rendered as flat heraldic playing-card pasteboard with
  printed faces; chess pieces as Tenniel's carved wooden chesspieces; talking
  creatures in waistcoated Victorian dress; people in 1860s costume. An 1865
  engraved-ink storybook plate with a hand-tinted Victorian look, fine linework
  and cross-hatching throughout — not a 1951 flat cel animation, not saturated
  candy-coloured cartoon, not rounded simplified shapes, not a photograph, not a
  3D render. No text, lettering, signature, or watermark.

preferred_model: dev

base_seed: 1865
