# =============================================================================
# Wonderland (wry_whimsy) — WORLD VISUAL STYLE
# =============================================================================
# Renderer: Z-Image (mflux); see zimage_mlx_worker.py + ADR-070. The batch path
# sends NO negative_prompt — every clause lands in the POSITIVE prompt — so we
# steer purely with positive vocabulary and a safety clause. There is no Flux/
# `dev` model here; the old `preferred_model: dev` was dead config and is gone.
#
# TIGHT-SUFFIX RULE (2026-06-02, per PROMPTING_Z_IMAGE.md): this suffix is
# appended to EVERY render (render_common has no per-tier split). It must be a
# SHORT medium/style/palette anchor ONLY — name Tenniel ONCE, fine pen-and-ink
# line, open cream-paper sky, restrained selective hand-tint, safety clause.
# The earlier ~160-word version piled on engraving-density vocabulary (Dalziel,
# Punch, cross-hatching, engraver's line, "dense all-over tone"); per the guide
# a style anchor imports its whole medium, so that hatching pile drowned the
# open-paper clause and aliased the sky into moiré. Cut to the anchor below.
# NO casting (per-POI solo / portrait_manifest appearance own it). NO negations.
# Per-scene selective hand-tint colours (1-3) are named in each solo, not here.
# =============================================================================

positive_suffix: >-
  fine pen-and-ink line illustration in the style of John Tenniel, 1865, crisp
  confident black outlines, light open linework, plenty of bare cream paper,
  open unmarked sky, a restrained selective hand-tinted wash in a few muted
  colours over the black line on warm cream paper. No text, no caption, no
  title, no writing, no signature, no labels, no watermark, no border, no frame.

base_seed: 1865
