world_name: Wonderland

history: >-
  Wonderland was never built and has no founding to tell; it is simply here, and
  has always been here, the way a dream is wholly present the moment you are in
  it. It is one dream-territory in two halves that lean into each other across a
  mirror. Below the glass lies Card Country, a heraldic playing-card court laid
  out as a clipped garden, where a whole pack of pasteboard people go about on
  edge and the Queen of Hearts rules by terror. Above the glass, through it, lies
  Looking-Glass Land, a green-and-white country ruled off into squares by little
  brooks and low hedges — a chess-game caught in mid-play with the pieces alive
  and walking their moves, where the Red Queen drives everyone through a race
  that goes nowhere. No one in Wonderland can tell you when any of it began, and
  no one minds; the place finds the question dull. What every creature here will
  tell you, with perfect gravity, is the one standing law: nonsense, not reason,
  is the authority, and reason is the foreigner in the dock. The traveler falls
  down a rabbit-hole or steps through a mirror into the middle of all this
  knowing none of it, and Wonderland is in no hurry to explain.

geography: >-
  Wonderland is two countries joined at a mirror. CARD COUNTRY is reached by the
  rabbit-hole: a traveler comes to ground in a long low hall lined with locked
  doors of every size, where a little glass table holds a labelled bottle and a
  small cake, and a curtain hides a fifteen-inch door onto the loveliest garden
  no full-grown body can yet fit through. Beyond the hall lie the salt pool of
  giant tears and its wet shore; the White Rabbit's neat house; the deep tulgey
  wood with its great mushroom and its pepper-choked kitchen; the endless
  tea-table stopped forever at six o'clock; the wide croquet-lawn where white
  roses are hurriedly painted red; and the crowded court where the stolen tarts
  sit on the table in plain sight. The one passage out of Card Country is a tall
  mantelpiece mirror, whose silver face goes soft as gauze to let a traveler
  through. LOOKING-GLASS LAND lies on the far side: a formal bed of talking
  flowers, a low hill, and then the open country ruled all over into green-and-
  white squares by little leaping-brooks and low straight hedgerows, a chessboard
  in play that the traveler must cross square by square to reach the eighth and
  be crowned. In it stand the Tweedle wood, where the Red King sleeps under his
  tree, and the high narrow wall where a great egg sits in a cravat, and at the
  end the coronation feast that tips over into uproar. Distance behaves like a
  dream: walk far enough any way and you are sure to get somewhere, rarely the
  somewhere you aimed at.

cosmology: >-
  Wonderland runs on broken logic, and the broken logic is not an accident in the
  world but the law the world is built on. Nonsense is the standing authority:
  time has quarrelled with the Hatter and stopped at six o'clock; a word means
  whatever a great egg pays it to mean; a body grows and shrinks at the bidding of
  a bottle, a cake, or two sides of a mushroom; a court hands down the sentence
  first and the verdict afterwards. The menace is sharper than a gentler
  fairyland's — a place that has abandoned sense can turn dangerous without
  warning — but nearly all of it is theatre: terror without follow-through, a
  death-sentence undone before the axe can fall, a threat that frightens and
  forgets. The one place the theatre stops is the tulgey wood, where the
  Jabberwock means harm and follows through; it is the single genuinely lethal
  thing in the dream, and the vorpal sword is the only answer to it. There is no
  door in any wall and no road that leads out, because the way home is not a way
  at all but a WAKING: the traveler leaves by refusing the dream decisively —
  rising in the dock to name the court a pack of cards, or seizing the Red Queen
  at the feast and shaking her until it all comes apart. And the dream keeps a
  trap for those who like it too well: the more a traveler reshapes the place, the
  more it wants to keep them, and the harder the waking comes.

# ── Genre-form framing, filled in for Wonderland (lands in WorldLore extras) ────

the_two_countries: >-
  The whole of Wonderland is two dream-countries that share one mirror. CARD
  COUNTRY, reached by the rabbit-hole, is a heraldic playing-card court laid out
  as a clipped formal garden — rose-trees in rows, a flat croquet lawn, a printed-
  card court — and its people are flat pasteboard folk: card-soldiers, card-
  gardeners, courtier cards, each a single painted face on a single thin body,
  forever terrified and forever theatrical, flattening themselves on the path at a
  cross word from the Queen. LOOKING-GLASS LAND, reached through the mirror, is a
  living chess-game: the country is ruled into green-and-white squares by little
  brooks and hedges, and its people are chesspieces — White and Red Queens, Kings,
  Knights, the bustling pawns — who move by the board's rules and speak of
  themselves in the language of the game, a square at a time, a move at a time.
  The two peoples never quite understand each other, because one is a deck dealt
  out and the other is a match in progress; but both are the same dream, and both
  hold nonsense for law.

nonsense_as_authority: >-
  The deepest truth of Wonderland is that the rules are invented on the spot and
  weaponized, and the antagonist of the whole country is logic itself. A trial
  proceeds with no procedure — the verdict demanded before the evidence, "sentence
  first, verdict afterwards," the jury writing down their own names so they shan't
  forget them. A great egg on a wall keeps a private dictionary in which a word
  means just what he chooses it to mean, neither more nor less, and pays the words
  extra when he works them overtime. A queen hands down sentences with no relation
  to any crime. There is no appeal to reason here, because reason has no standing —
  it is the foreigner in the dock, and the room treats the traveler's plain sense
  as the absurd thing. Everyone but the traveler treats the nonsense as the most
  ordinary matter in the world, delivered with perfect courtesy and perfect
  gravity. To get anywhere a traveler must learn the country's hardest lesson:
  you cannot win the argument inside the nonsense, because it was never an
  argument — you can only refuse the premise, or hold to plain sense so stubbornly
  the invented rule finds nothing to grip.

the_raging_queens: >-
  Power in Wonderland is held by women in a fury, and the famous men beside them
  have fallen to nothing — this is honest to Carroll, not a gloss on him. The
  QUEEN OF HEARTS rules Card Country by terror: "Off with their heads!" at a wrong
  word, a botched croquet stroke, a rose painted the wrong colour, a death-sentence
  about once a minute, delivered in dead earnest, the whole court flattening itself
  in fear. The RED QUEEN rules Looking-Glass Land by the rigged rules of the board:
  sharp, quick, drilling her country through a race in which all the running you
  can do keeps you in the same place, calling her breathless pace plain good advice
  while she lays out the squares a traveler must cross to be crowned. Against the
  two queens stand the two kings, who are nothing. The KING OF HEARTS is a mild,
  do-nothing judge on the bench who quietly pardons everyone the Queen condemns —
  "in a low voice, to the company generally" — so that by day's end nobody has been
  beheaded at all. The RED KING merely sleeps, snoring under his tree, having
  dropped clean out of his own kingdom, and it is whispered that the whole dream
  may be only a thing that he is dreaming. The women rage and rule; the men pardon
  and sleep. A traveler who learns to watch the woman in the room is rarely wrong.

the_mirror_seam: >-
  The two countries are not walled off from each other; they are joined, and the
  join is findable. A tall mirror over a mantelpiece is the one passage between
  Card Country and Looking-Glass Land, and its silver surface is never a barrier —
  it goes soft and bright as gauze, dissolving into a shimmering haze at its
  centre, and asks to be stepped through. On the far side is this same quiet room
  turned the wrong way round, and beyond it the chessboard country. This is the
  seam of the whole dream-territory: not a hidden wall to be broken but an open
  door to be walked, the place where one half of Wonderland leans through into the
  other. A traveler who finds a mirror in Wonderland should expect to be able to
  go through it; the only question is which country lies on the other side, and
  what game is being played there.

the_queen_of_hearts_terror: >-
  An open secret of Card Country, told here as the world's own gossip rather than
  any hidden fact: the Queen of Hearts' power is that everyone BELIEVES her
  sentences are real. Her "Off with their heads!" lands instantly — gardeners
  throw themselves flat on the path, courtiers go white, the whole game stops dead
  — because every soul in the court is sure the next sentence might be the one
  that is carried out, and that the cards could truly lose their heads. The terror
  is sincere and the fear is total in the moment, which is exactly why the threat
  keeps its force. But the court whispers the rest of it among themselves when the
  Queen is out of earshot: the mild King trails behind her pardoning everyone she
  condemns under his breath, so the executions outnumber the actual dead by the
  whole company; and in the end the court is only a pack of cards, painted
  pasteboard that can be named for what it is. The terror is the weapon; the
  sentence is mostly noise. A traveler who learns to read the King's quiet pardons
  has learned the seam of the Queen's whole power — though never quite which
  threat will turn out to be the exception.

the_red_queen_game: >-
  An open secret of Looking-Glass Land, likewise the country's own talk and not a
  buried mechanism: the Red Queen's power is that everyone BELIEVES the board's
  rules are fate. You must run to keep your place and run twice as fast to advance;
  you must cross the squares in their order; you must take your move when the board
  gives it — and because everyone treats these rules as the iron law of the world,
  the Red Queen who commands them commands everything. But the chesspieces murmur
  the rest of it too: that the race goes nowhere, that all the running you can do
  leaves the trees and the scenery exactly where they were and the runner exactly
  where they started, that effort here is motion mistaken for progress. And under
  even that lies the deeper open secret — the Red King asleep under his tree, and
  the dread the Tweedle-brothers will name to anyone who asks: that the whole game,
  board and pieces and traveler and all, may be only a thing in his dream, and
  that were he to wake you would go out like a candle. A traveler who stops running
  long enough to think has seen through the first illusion; the second one will
  not let go so easily.

the_size_changing: >-
  Wonderland rescales the body as freely as it rescales sense, and it does so by
  instruction: a bottle labelled DRINK ME shrinks the traveler to ten inches; a
  cake marked EAT ME shoots them up to nine feet; a fan, a pebble that turns to
  cake, a mushroom with one side that grows you and one that shrinks. The label is
  an order the dream expects to be obeyed, and the dose is never quite right.
  Smallness lets a traveler through the fifteen-inch door to the garden but drops
  the golden key out of reach on the glass table; bigness reaches the key but jams
  the traveler in a corridor or fills the White Rabbit's house until an arm comes
  out of the upstairs window and a foot up the chimney. A traveler grown huge weeps
  a whole pool of giant tears, then shrinks and very nearly drowns in it. The body
  is never a fixed fact here; size is a tool to be dosed deliberately and a hazard
  that punishes overshooting, and a traveler almost never gets the size they want
  at the moment they want it.

the_perpetual_present: >-
  The Mad Tea-Party is frozen at six o'clock forever, and it is the plainest model
  of how the nonsense holds a traveler: by enclosure, not by violence. The Hatter
  quarrelled with Time, and now Time will not move for him, so it is always
  tea-time — the clean cups always one place down the table, the riddle with no
  answer always being asked, the Dormouse always falling asleep mid-story. To sit
  down is to enter a loop with no exit; to try to win the argument or wait for the
  clean cups to come round again is only to feed the loop and become part of it.
  The danger of the whole dream is concentrated here in miniature: the nonsense is
  so total and so self-consistent that a traveler who engages it on its own terms
  stops moving through the story at all. The way out is never a cleverer answer —
  it is refusing to play: getting up, turning away from the riddle, and walking off
  down the wood, never to be invited back.

the_truth_telling_cat: >-
  The Cheshire-Cat is the one creature in Wonderland who speaks plain truth amid
  the nonsense, and the guide who will not be relied upon. It tells the traveler
  the truest and most unsettling thing in the country — "we're all mad here. I'm
  mad. You're mad" — and that whichever way they walk they are sure to get
  somewhere if only they walk long enough. But it cannot be pinned down: it
  appears and vanishes a tail-tip at a time, leaving the grin behind after the cat
  is gone, and answers a plain request for direction with "that depends a good deal
  on where you want to get to." Its help is real but never reliable, given on its
  own terms and withdrawn the moment a traveler leans on it. It is the rarest thing
  in the dream — a sane voice — and it will not stay to be one. A traveler's craft
  is to take the Cat's honest reading of the madness and then make, for themselves,
  the choice the Cat declined to make for them.

the_jabberwock: >-
  There is one thing in this dream that is not playing. Deep in the tulgey wood,
  where the trees meet overhead and the rules grow thin, the Jabberwock comes
  whiffling and burbling — jaws that bite, claws that catch, eyes of flame — and
  it is not theatre and not nonsense: it kills. Everything else in Wonderland
  threatens and pardons, rescales and releases, frightens and forgets; this one
  creature simply means harm and follows through, and the warning "beware the
  Jabberwock" carries a weight nothing else in the country carries. It cannot be
  out-argued, refused, dosed, or woken away from. Against it there is the vorpal
  sword, which goes snicker-snack and takes the monster's head, so that the one
  who slays it comes galumphing back crying "O frabjous day!" But the dream is
  built for waking, not killing, and it recoils from anyone who has drawn true
  blood in it: the vorpal stroke is remembered everywhere after, and the nonsense-
  country flinches from the traveler who used it. Violence is the right answer in
  Wonderland exactly once, against exactly this — and it leaves a mark.

the_way_home: >-
  Wonderland has no exit door and no road home, because the way out is not a way at
  all — it is WAKING. A traveler hunting for a door in the wall or a path that leads
  away will not find one, and the search itself is part of how the dream holds on.
  The dream is left by refusing it decisively: by rising in the dock at the height
  of the trial, grown to full height, and naming the whole raging court "nothing
  but a pack of cards," whereupon the cards rise into the air and fly down and the
  traveler wakes; or by seizing the Red Queen at the coronation feast as the
  nonsense reaches its pitch and shaking her — and shaking her, and shaking her —
  until the dream comes apart in the hands. The authority of Wonderland is, at
  bottom, nothing: painted pasteboard, chesspieces, a kitten on a hearth-rug. To
  say so out loud and mean it, to stop being frightened a moment longer, is to
  dissolve the dream. But the refusal cannot be faked or rushed; it only works when
  the traveler has truly stopped believing the nonsense has any power over them, and
  a half-hearted denial leaves the dream intact and tightening.
