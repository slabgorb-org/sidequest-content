# Wry Whimsy — Fate Core binding (ADR-144 / story 114-10).
#
# The golden-age literary portal fairytale (Baum's Oz, Carroll's Wonderland,
# Swift's Gulliver): a sensible traveler crosses into a Secondary World run on
# dream-logic and survives its impossible authorities by WIT and NERVE far more
# than by force. Fate Core is the native fit — the genre runs on aspects and
# compels, not hit points: you survive a humbug king by refusing his premise,
# not by out-rolling his guards.
#
# Fate REPLACES the native dial/confrontation engine here. The six wit-first
# "confrontation types" the native build carried (audience / wit_duel / escape /
# wonder_shock / persuasion / violence) are not authored as native beat tables
# anymore — under Fate they are ordinary contests and conflicts resolved on
# 4dF + skill vs opposition, with the Court's verdict, the Caterpillar's riddle,
# and the dream's pull all modeled as opposition + situation aspects. Only the
# genre flavor Fate does NOT own (the threshold races, scene defaults, the
# witnessed-act dispatch threshold) is retained below.

ruleset: fate
magic_level: none

fate:
  # The portal-fairytale skill ladder. One seeded starting spread for every
  # traveler for now (per-archetype allocation is a later story). A traveler
  # survives by reading the room, talking past nonsense, and keeping their nerve
  # when the world tries to overwhelm them — so the ladder peaks at Rapport
  # (sincerity is rare here and lands hard) and leans on the social/perceptive
  # skills, with a thin physical tail (force is the priced exception, not a plan).
  skills:
    Rapport: 4
    Empathy: 3
    Notice: 3
    Will: 3
    Deceive: 2
    Lore: 2
    Investigate: 2
    Provoke: 1
    Athletics: 1
    Burglary: 1
    Contacts: 1
    Physique: 1
    Fight: 1
  refresh: 3
  # Refresh-invariant knobs (114-10). SRD default 3/3. The signature kit below is
  # all aspect-/permission-gear (free), so a starting traveler keeps refresh 3.
  base_refresh: 3
  free_stunts: 3
  # Shared signature gear compiled onto every traveler's sheet at chargen
  # (gear.yaml). The sensible pinafore, the basket with a small dog, the good
  # manners that open doors, the head full of stories — the ordinary, human
  # things a traveler crosses the threshold carrying. (The silver/ruby shoes are
  # deliberately NOT here — they are a mid-game found item, not chargen kit.)
  gear:
    - whimsy_sensible_pinafore
    - whimsy_basket_with_a_dog
    - whimsy_good_manners
    - whimsy_head_full_of_stories
  default_high_concept: "Sensible Child a Very Long Way from Home"
  default_trouble: "Curiosity Always Gets the Better of Me"
  # Story 126-24 (content gap-fill, 2026-06-20): narrative-chargen seed table.
  # Maps each crucible class_hint (genre-tier char_creation.yaml; oz / wonderland /
  # gulliver all inherit it) to a COMPLETE legal pyramid (1 Great / 2 Good / 3 Fair
  # / 4 Average, per the SRD chargen_pyramid [1,2,3,4]@apex 4) + free-aspect seeds,
  # so the friendly narrative on-ramp presents a pre-ranked Fate sheet (editable
  # defaults — the player overrides any rating/aspect) instead of the blank pyramid
  # the seam read nothing for. Covers every crucible class_hint (No Silent
  # Fallbacks). Allocations draw ONLY from the 13-skill ladder above (survive-by-
  # wit, not force: no Shoot/Ride; Fight present but low across every calling).
  chargen_seed_table:
    Curious Child:
      pyramid: { Notice: 4, Investigate: 3, Rapport: 3, Empathy: 2, Athletics: 2, Will: 2, Burglary: 1, Deceive: 1, Contacts: 1, Lore: 1 }
      aspects:
        - "Too Small to Be Taken Seriously — Until It's Too Late"
        - "I Simply Have to Know What's Behind That Door"
    Practical Servant:
      pyramid: { Physique: 4, Will: 3, Notice: 3, Empathy: 2, Athletics: 2, Rapport: 2, Investigate: 1, Contacts: 1, Fight: 1, Lore: 1 }
      aspects:
        - "Nonsense Is Just One More Mess to Be Sorted"
        - "Someone Has to Keep Things Running"
    Earnest Scholar:
      pyramid: { Investigate: 4, Lore: 3, Notice: 3, Will: 2, Empathy: 2, Burglary: 2, Athletics: 1, Contacts: 1, Deceive: 1, Rapport: 1 }
      aspects:
        - "Anything Can Be Understood If You Observe It Closely Enough"
        - "Some Logic Must Be Played Along With, Not Solved"
    Weary Soldier:
      pyramid: { Will: 4, Physique: 3, Fight: 3, Notice: 2, Athletics: 2, Provoke: 2, Empathy: 1, Lore: 1, Burglary: 1, Contacts: 1 }
      aspects:
        - "These Battles Aren't Won with Force — They're Won by Keeping Your Nerve"
        - "I Came from a Real War, and I Carry It"
    Wayward Dreamer:
      pyramid: { Rapport: 4, Empathy: 3, Lore: 3, Deceive: 2, Notice: 2, Will: 2, Investigate: 1, Athletics: 1, Contacts: 1, Provoke: 1 }
      aspects:
        - "I Lean into the Impossible with an Open Heart"
        - "The Dream Would So Love to Keep Me"
    Stubborn Skeptic:
      pyramid: { Provoke: 4, Will: 3, Investigate: 3, Notice: 2, Lore: 2, Deceive: 2, Empathy: 1, Contacts: 1, Athletics: 1, Physique: 1 }
      aspects:
        - "I Decline to Believe in Any of This"
        - "An Authority That Runs on Belief Has No Power Over Me"
  stunts:
    - name: "But That's Not Fair"
      description: >-
        Once per scene, when you create an advantage with Rapport by naming, out
        loud and plainly, how unjust an impossible authority is being, you may
        invoke the resulting aspect for free — a place built on whim has no answer
        to a child who simply will not stop pointing out the rules it broke.
    - name: "I Don't Believe in You"
      description: >-
        +2 to Will to defend against any attempt to frighten, enchant, or
        intimidate you that runs on your belief in it. The towering nonsense is
        made of everyone agreeing to be afraid, and you have declined to grant it
        the one thing it was built out of.
    - name: "Mind Your Manners"
      description: >-
        +2 to Rapport when you address a capricious authority with scrupulous,
        old-fashioned courtesy. A curtsey and a "please" disarm a card-court or a
        humbug king far faster than any sword — they have prepared for defiance,
        never for politeness.
    - name: "A Story for Every Occasion"
      description: >-
        Once per scene, you may spend a fate point to declare that something you
        read in a book back home is true of the strange thing in front of you now
        — and create an advantage with Lore as though you had studied it for
        years. The dream is, after all, made of stories, and you have read a great
        many.

# The threshold-origin "race" axis the portal fairytale keeps (it is FLAVOR, not
# a Fate stat — Fate has no species mechanics; this seeds the chargen origin
# choice and reference-sheet label).
allowed_races:
  - Ordinary-Born
  - Threshold-Touched
  - Native Dreamer

default_race: Ordinary-Born
race_label: Origin
default_location: "The far side of a threshold you did not mean to cross"
default_time_of_day: afternoon

# A fairytale is not survived by counting rations or tracking encumbrance — it is
# survived by keeping your head. The genre deliberately ships none of those
# subsystems; violence is the priced exception, improvised, never a loadout.
custom_rules:
  lethality: forgiving
  injury_system: none
  encumbrance: none
  kindness_economy: >-
    Baum's rule and every fairytale's: be gentle to the small, frightened
    creature, and it returns when the giant's hand is closing. A kindness shown
    to the weak is the genre's most reliable currency — bank it as an aspect and
    invoke it exactly when it is needed most.
  going_native: >-
    The world would love to keep you. Leaning into its dream-logic grants insight
    and shortcuts at a quiet cost — each surrender makes the waking (the genre's
    true exit) a little harder. The Narrator may offer this as a compel: a free
    fate point now for a complication that pulls you one step further from home.

# Per-subsystem intent-router engagement thresholds (ADR-113). A witnessed act
# that reshapes a society's belief in its authority should be EARNED: require
# higher router confidence than the 0.6 default, so a low-confidence guess
# degrades to a narrator hint instead of moving the political dials.
dispatch_confidence_thresholds:
  witnessed_act: 0.7

encounter_base_tension:
  random: 0.10
  ambush: 0.25
  audience: 0.35
  boss: 0.40
  final: 0.50

# --- Native social-confrontation substrate (typed NATIVE flavor — these beats use
#     the native engine's stat names (WIT/HEART/GUILE/NERVE), NOT Fate skills; they are
#     unconsumed under the Fate binding and kept per the ADR-144 F5 boundary until a
#     separate F5 story removes them. Restored 2026-06-16 for parity with
#     spaghetti_western/tea_and_murder, which kept theirs). ---
confrontations:
  # 1. AUDIENCE / TRIAL — you stand before an impossible authority (a humbug
  #    king, a card-court, a council of little men) whose verdict is the danger.
  - type: audience
    label: "Audience / Trial"
    intent_verbs: [argue, plead, object, testify, appeal, defend, address, petition]
    on_intent_mismatch: reprompt
    category: social
    # player dial = standing / sway over the court; opponent dial = the verdict
    # tightening against you.
    player_metric:
      name: standing
      starting: 0
      threshold: 10
    opponent_metric:
      name: verdict
      starting: 0
      threshold: 10
    beats:
      - id: state_your_case
        label: "State Your Case"
        kind: strike
        base: 2
        stat_check: WIT
        effect: "the court weighs your reasoning against its own nonsense"
        narrator_hint: "Show the authority forced, briefly, to follow an argument it did not author."
      - id: appeal_to_fairness
        label: "Appeal to Fairness"
        kind: strike
        base: 3
        stat_check: HEART
        risk: "a sincere appeal in a court that does not value sincerity can deepen the verdict"
        consequence: "the room's sympathy turns — for you or sharply against you"
        narrator_hint: "Earnest conviction lands hard in a place built on whim. High stakes either way."
      - id: spot_the_contradiction
        label: "Spot the Contradiction"
        kind: angle
        target_tag: "Court's Own Rule Turned"
        base: 1
        stat_check: GUILE
        effect: "you catch the authority breaking its own absurd rule and bank it for later"
        narrator_hint: "The traveler notices the seam in the nonsense. Set it up; do not spring it yet."
      - id: hold_your_nerve
        label: "Hold Your Nerve"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you absorb the court's bluster without flinching — the verdict stalls"
        narrator_hint: "The pressure mounts; the traveler simply does not break under it."
      - id: refuse_the_premise
        label: "Refuse the Premise"
        kind: push
        stat_check: WIT
        resolution: true
        consequence: "you decline to play the game by its rules and walk out of the proceeding"
        narrator_hint: "Sentence first, verdict after? The traveler rejects the whole frame and leaves."
    escalates_to: chase
    mood: courtroom

  # 2. WIT-DUEL — a battle of riddles, retorts, and contradictions with a
  #    capricious interlocutor (a Cat, a Caterpillar, a talking door).
  - type: wit_duel
    label: "Wit-Duel"
    intent_verbs: [riddle, retort, quip, outwit, banter, puzzle, counter, answer]
    on_intent_mismatch: reprompt
    category: social
    player_metric:
      name: upper_hand
      starting: 0
      threshold: 10
    opponent_metric:
      name: upper_hand
      starting: 0
      threshold: 10
    beats:
      - id: sharp_retort
        label: "Sharp Retort"
        kind: strike
        base: 2
        stat_check: WIT
        effect: "you turn their words back on them"
        narrator_hint: "A clean, fast reversal. The interlocutor did not expect to be answered so well."
      - id: pose_a_riddle
        label: "Pose a Riddle"
        kind: strike
        base: 3
        stat_check: GUILE
        risk: "a riddle that misfires hands them the upper hand"
        consequence: "they either stall on your riddle or skewer it instantly"
        narrator_hint: "High-variance. A good riddle traps them; a bad one is a gift."
      - id: feign_confusion
        label: "Feign Confusion"
        kind: angle
        target_tag: "Lulled Opponent"
        base: 1
        stat_check: GUILE
        effect: "you play the simpleton to draw out their real reasoning"
        narrator_hint: "The traveler plays dumb on purpose. Banked leverage, not an immediate hit."
      - id: keep_a_straight_face
        label: "Keep a Straight Face"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you refuse to be rattled by the nonsense — their momentum drains"
        narrator_hint: "Unflappable. The absurdity rolls off and leaves the opponent looking foolish."
      - id: concede_the_game
        label: "Concede the Game"
        kind: push
        stat_check: HEART
        resolution: true
        consequence: "you bow out of the contest gracefully — no upper hand won, none lost"
        narrator_hint: "The traveler declines to win, and the contest simply ends. Dignity intact."
    mood: nonsense

  # 3. ESCAPE / NOT-GETTING-CAUGHT — slipping a pursuing authority through a
  #    shifting, dream-logic landscape (a garden that rearranges, a corridor of
  #    doors). Distinct from the priced violence path.
  - type: escape
    label: "Escape / Not-Getting-Caught"
    intent_verbs: [flee, run, slip, hide, evade, dodge, escape, vanish]
    on_intent_mismatch: reprompt
    category: movement
    # player dial = distance gained; opponent dial = the pursuit closing.
    player_metric:
      name: distance
      starting: 0
      threshold: 8
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 8
    beats:
      - id: bolt
        label: "Bolt"
        kind: push
        base: 2
        stat_check: NERVE
        narrator_hint: "Flat-out flight through a landscape that will not hold still."
      - id: take_the_wrong_door
        label: "Take the Wrong Door"
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: WONDER
        risk: "trusting the dream-logic can open a shortcut — or a dead end that loops back"
        narrator_hint: "The traveler leans INTO the nonsense to escape it. Reward or trap."
      - id: blend_in
        label: "Blend In"
        kind: angle
        target_tag: "Lost in the Crowd"
        base: 1
        stat_check: GUILE
        effect: "you pass yourself off as one more strange citizen of this place"
        narrator_hint: "Hide in plain sight among things stranger than you. Set up a clean break."
      - id: catch_your_breath
        label: "Catch Your Breath"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you steady yourself behind cover — the pursuit loses the thread"
        narrator_hint: "A held breath in a doorway. The hunt sweeps past."
      - id: go_to_ground
        label: "Go to Ground"
        kind: push
        stat_check: GUILE
        resolution: true
        consequence: "you vanish into the strangeness — the pursuit gives up the chase"
        narrator_hint: "The traveler is simply gone. The authority is left turning in circles."
    escalates_to: violence
    mood: tension

  # 4. WONDER-SHOCK — the world overwhelms the traveler with the sheer
  #    impossibility of itself (a sea of tears, a field of living chess, a giant's
  #    table). The contest is internal: keep your grip vs. let the dream take you.
  #    This is the one confrontation where the *traveler's own Composure* is the
  #    primary battlefield, so the player's strike beats debit their own pool.
  - type: wonder_shock
    label: "Wonder-Shock"
    intent_verbs: [endure, marvel, ground, steady, resist, anchor, behold, withstand]
    on_intent_mismatch: warn
    category: social
    # player dial = grip kept; opponent dial = the dream pulling you under.
    player_metric:
      name: grip
      starting: 0
      threshold: 8
    opponent_metric:
      name: dream_pull
      starting: 0
      threshold: 8
    beats:
      - id: name_what_you_see
        label: "Name What You See"
        kind: strike
        base: 2
        stat_check: WIT
        effect: "you describe the impossible thing plainly and rob it of some of its power"
        narrator_hint: "The traveler's stubborn ordinariness is a weapon. Naming the absurd tames it a little."
      - id: anchor_to_a_memory
        label: "Anchor to a Memory"
        kind: strike
        base: 3
        stat_check: HEART
        risk: "reaching for home in a place that erodes it can make the homesickness worse"
        consequence: "the memory steadies you — or the contrast nearly undoes you"
        narrator_hint: "A held thread to the ordinary world. Comfort and ache at once."
      - id: let_the_wonder_in
        label: "Let the Wonder In"
        kind: angle
        target_tag: "Half-Native Sight"
        base: 1
        stat_check: WONDER
        risk: "opening to the dream-logic grants insight at the cost of a little of yourself"
        effect: "you stop fighting the impossibility and briefly see by its rules"
        narrator_hint: "Dangerous WONDER play: the traveler goes a little native to gain an angle. Bank it."
      - id: breathe
        label: "Breathe"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you simply hold on — the dream's pull stalls against your nerve"
        narrator_hint: "No cleverness, just refusal. The vertigo crests and passes."
      - id: look_away
        label: "Look Away"
        kind: push
        stat_check: NERVE
        resolution: true
        consequence: "you tear your eyes from the impossible thing and the spell over you breaks"
        narrator_hint: "The traveler chooses not to look. The wonder-shock ends; they keep themselves."
    mood: dreamlike

  # 5. PERSUASION — winning over an eccentric ally, a frightened creature, or a
  #    minor functionary through sincerity rather than force.
  - type: persuasion
    label: "Persuasion"
    intent_verbs: [persuade, convince, reassure, befriend, coax, charm, entreat, win-over]
    on_intent_mismatch: warn
    category: social
    player_metric:
      name: rapport
      starting: 0
      threshold: 10
    opponent_metric:
      name: resistance
      starting: 0
      threshold: 10
    beats:
      - id: speak_plainly
        label: "Speak Plainly"
        kind: strike
        base: 2
        stat_check: HEART
        effect: "honest words land where flattery would not"
        narrator_hint: "Sincerity is rare here and it shows. The NPC softens."
      - id: clever_promise
        label: "Clever Promise"
        kind: strike
        base: 3
        stat_check: WIT
        risk: "a promise too clever may read as a trick and harden them"
        consequence: "they take the bargain — or smell the angle in it"
        narrator_hint: "A deal shaped to their want. Persuasive, but it can look like manipulation."
      - id: find_their_fear
        label: "Find Their Fear"
        kind: angle
        target_tag: "What They Truly Want"
        base: 1
        stat_check: GUILE
        effect: "you read what the creature is really frightened of, and bank it"
        narrator_hint: "Quiet observation. Learn the real need under the bluster; do not spend it yet."
      - id: wait_them_out
        label: "Wait Them Out"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you let their objections spend themselves against your patience"
        narrator_hint: "The traveler simply outlasts the protest. Resistance drains."
      - id: let_them_decide
        label: "Let Them Decide"
        kind: push
        stat_check: HEART
        resolution: true
        consequence: "you step back and leave the choice to them — and they come around, or you part on good terms"
        narrator_hint: "No pressure at the end. The traveler trusts them, and the matter resolves cleanly."
    mood: warm

  # 6. VIOLENCE — the priced exception. Force exists in this world but it is
  #    rarely the smart move and the genre frames it as a failure of wit. This is
  #    the only confrontation whose beats carry a real Composure (HP/Edge) channel:
  #    blows debit the traveler's own pool (self_edge) and press the opponent's,
  #    and a drop to 0 is a *break* (subdued, fled, condemned), not a death — the
  #    per-world lethality dial decides recoverability.
  - type: violence
    label: "Violence (Last Resort)"
    intent_verbs: [strike, attack, fight, hit, swing, kick, throw, shove, fend]
    on_intent_mismatch: reprompt
    category: combat
    player_metric:
      name: footing
      starting: 0
      threshold: 10
    opponent_metric:
      name: footing
      starting: 0
      threshold: 10
    beats:
      - id: scrappy_blow
        label: "Scrappy Blow"
        kind: strike
        base: 3
        stat_check: NERVE
        target_edge_delta: 2
        effect: "an inelegant, desperate strike that presses the opponent's Composure"
        narrator_hint: "Not a warrior's blow — a frightened person fighting back. It costs the opponent their footing."
      - id: throw_everything
        label: "Throw Everything"
        kind: strike
        base: 4
        deltas:
          crit_fail:
            own: -2
        stat_check: HEART
        risk: "an all-out, reckless effort — overcommit and you lose your own footing and grip"
        edge_delta: 1
        target_edge_delta: 3
        effect: "you spend yourself in one wild push against the opponent"
        narrator_hint: "Everything at once. Big swing, real cost to the traveler's own Composure."
      - id: ward_it_off
        label: "Ward It Off"
        kind: brace
        base: 2
        stat_check: NERVE
        effect: "you cover up and weather the assault — the opponent's footing slips"
        narrator_hint: "Arms up, eyes shut, holding on. Defensive, not heroic."
      - id: dirty_trick
        label: "Dirty Trick"
        kind: angle
        target_tag: "Off-Balance"
        base: 1
        stat_check: GUILE
        effect: "a handful of sand, an upended table — you set up an opening"
        narrator_hint: "Cleverness even inside a brawl. Bank an advantage; do not spend it yet."
      - id: break_off
        label: "Break Off"
        kind: push
        stat_check: NERVE
        resolution: true
        consequence: "you disengage and put the fight behind you — nobody has to be a corpse"
        narrator_hint: "The traveler stops fighting and gets out. Violence ends without a body, the genre default."
    mood: combat
