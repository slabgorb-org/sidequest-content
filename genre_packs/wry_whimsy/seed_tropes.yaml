# Seed tropes for wry_whimsy — short-arc narrative hooks dealt at session
# start from a per-pack deck (ADR-018, ADR-128). Dealt without replacement;
# each seed expires after its lifespan_turns and lingers as a ghost for later
# callback. Seeds are baited hooks (ADR-014 diamonds-and-coal) — vague on
# purpose; the narrator retroactively threads engaged seeds into whatever
# the portal world demands of the traveler.
#
# Flavor gradient: oz → wonderland → gulliver (wonder-terror → wit-under-siege
# → political satire). Seeds are written to land across any world in the pack.

- id: the_road_insists_on_a_direction
  name: The Road Insists on a Direction
  description: >-
    There is only one road and it goes one way. Everyone met on it is
    also going that way. A man near the back of the procession says he
    has been trying to leave for three weeks and cannot explain why
    he keeps ending up at the front again.
  flavor_tags: [travel, geography, law-of-the-land, wonder]
  lifespan_turns: 7
  delivery_hints:
    - The man near the back explains this cheerfully, as though it is merely inconvenient
    - A signpost read from the other side still points forward
    - The land behind is flat; the road curves; there is no logical reason to keep arriving
  narrative_hint: >-
    The road is a rule nobody made. Let it strand the players near someone
    useful or dangerous, and let "why can't I leave?" become the question
    that exposes the world's deeper logic.

- id: a_helpful_stranger_with_a_price
  name: A Helpful Stranger Who Mentions the Price Afterwards
  description: >-
    A creature, merchant, or fellow traveler provides exactly the help
    the party needs — directions, a key, a safe place to sleep — and
    then, only then, mentions that there is of course a small matter
    of repayment. The price is not money.
  flavor_tags: [bargain, wonder, companion, traveler]
  lifespan_turns: 8
  delivery_hints:
    - The price is named after the service is already rendered, so refusal is awkward
    - The price sounds small but opens onto something much larger (a favor, a name, a secret told)
    - The stranger is genuinely surprised the party expected help to be free
  narrative_hint: >-
    The price is the hook; let it bind the players to an obligation they
    cannot cleanly discharge, and let the stranger reappear when they
    have forgotten they owe.

- id: a_rule_turned_against_the_traveler
  name: A Rule of the Land, Turned Against the Traveler
  description: >-
    An ordinance, custom, or edict perfectly sensible in the context of
    this world applies to the party in a way that was clearly not intended
    — and the authorities enforcing it are not interested in intent.
  flavor_tags: [law-of-the-land, authority, trial, absurdity]
  lifespan_turns: 6
  delivery_hints:
    - The official is apologetic but firm; the rule is the rule
    - Another traveler passed through last month and was treated exactly the same way
    - The rule has a loophole, but the loophole requires something inconvenient
  narrative_hint: >-
    The rule is a compressed confrontation; let the players navigate it
    by wit or by learning which authority is above the one enforcing it.
    The loophole, when found, should create a new obligation.

- id: wonder_shock_something_impossible_is_ordinary
  name: Something Impossible Is Being Treated as Ordinary
  description: >-
    A local resident is doing something physically or logically
    impossible — walking on the sky, reading a book that writes itself,
    conversing with their own echo — and is mildly annoyed at the
    party's attention. It is simply what one does here on Thursdays.
  flavor_tags: [wonder, absurdity, local-custom, traveler]
  lifespan_turns: 5
  delivery_hints:
    - The resident uses the impossible thing as a prop for something entirely mundane (getting to market, settling a bet)
    - Asked to explain, the resident says there is nothing to explain; the party must be from away
    - Another local confirms this is perfectly normal and offers to explain a different impossible thing that is more interesting
  narrative_hint: >-
    The impossible thing is a lever; let the players use it if they think
    laterally. The real prize is learning which rules of this world bend
    and which are load-bearing.

- id: the_authority_that_cannot_be_appealed
  name: The Authority That Cannot Be Appealed
  description: >-
    A capricious figure — a queen, a magistrate, an ancient spirit with
    a title — has issued a demand. The demand is not negotiable. There
    is, however, a recognized procedure for satisfying it that nobody
    has thought to explain unprompted.
  flavor_tags: [authority, trial, capricious, wonder]
  lifespan_turns: 7
  delivery_hints:
    - A courtier mentions the procedure quietly, hoping the party will figure it out before the sentence is carried out
    - The authority is genuinely pleased when the procedure is correctly followed; it shows proper respect
    - A previous traveler satisfied the demand a generation ago; the story is told as legend, not instruction
  narrative_hint: >-
    The demand is the Bang; the procedure is the wit-engagement arc. Let
    the procedure require something the players already have or recently
    did, so finding it rewards attention rather than grinding.

- id: the_companion_with_one_terrible_problem
  name: A Potential Companion with One Terrible Problem
  description: >-
    A local — frightened, useful, or both — would make an excellent
    guide or ally, except for one thing they mention immediately: they
    have a curse, a debt, an oath, a nature. They are honest about it.
    They are asking for help anyway.
  flavor_tags: [companion, bargain, wonder, traveler]
  lifespan_turns: 8
  delivery_hints:
    - The problem is stated plainly; there is no attempt to hide it
    - The problem is relevant to where the party is going, not where they have been
    - The companion knows a way to fix the problem; it is dangerous and requires company
  narrative_hint: >-
    The companion's problem is a short arc the players can finish; let
    solving it shift the world's attitude toward the party, or open a
    door the players would not have found on their own.

- id: a_map_that_lies_politely
  name: A Map That Is Technically Accurate
  description: >-
    The party has a map, or finds one. It is beautifully drawn, clearly
    labeled, and correct in every particular — as of the time it was
    made, which was some years ago, before certain things changed.
    The cartographer is somewhere in the region; the map is their
    best work.
  flavor_tags: [travel, geography, absurdity, wonder]
  lifespan_turns: 6
  delivery_hints:
    - The map shows a bridge; the bridge has since become a river
    - The map shows a road; the road has since become a person who disputes it
    - The cartographer, tracked down, defends the map vigorously and says the world is wrong
  narrative_hint: >-
    The map's wrongness is a clue about what changed and who changed it.
    The cartographer is a witness to an earlier state of the world; let
    their memory of "how it was" matter.

- id: something_follows_without_following
  name: Something Is Following Without Following
  description: >-
    There is a sound, an object, or a creature that has been near the
    party for some time — always at the same distance, never closer,
    never gone. It does not respond to being addressed. It does not
    leave when the party moves on. It is not threatening. It is not
    nothing.
  flavor_tags: [wonder, uncanny, travel, absurdity]
  lifespan_turns: 6
  delivery_hints:
    - Local inhabitants do not find it strange; things follow travelers here
    - The thing has been at this distance from every traveler who came through last month
    - It stops when the party stops and sits down; it is patient
  narrative_hint: >-
    The thing is a catalyst for a confrontation or a revelation — let
    it be something the world is trying to return to its owner, or
    something a local set on the party for reasons they haven't
    admitted to yet.

- id: the_trial_no_one_remembers_calling
  name: The Trial No One Remembers Calling
  description: >-
    The party arrives somewhere to find that a trial is in progress.
    It becomes apparent, over some minutes, that one or more party
    members are the defendant. Nobody called the trial. Nobody sent a
    summons. It is simply happening, and the crowd has seats.
  flavor_tags: [trial, authority, absurdity, law-of-the-land]
  lifespan_turns: 5
  delivery_hints:
    - A court official explains the charges with professional courtesy; the charges are specific
    - A member of the crowd leans over and helpfully explains the rules of evidence here
    - The judge appears to be in a hurry; there is another trial scheduled and they would like to finish
  narrative_hint: >-
    The trial is a confrontation vehicle; let the charges encode something
    that is actually true about what the players did, filtered through
    the world's logic. Winning requires playing by the world's rules, not
    the players' own.

- id: the_local_who_has_been_waiting
  name: The Local Who Has Been Waiting
  description: >-
    Someone is sitting by the road — a gatekeeper, a riddle-setter, a
    lonely figure with a specific question — who is visibly relieved
    that travelers have finally arrived. They have been there a while.
    They will not leave until the matter is resolved.
  flavor_tags: [companion, traveler, wonder, riddle]
  lifespan_turns: 7
  delivery_hints:
    - The figure has made themselves comfortable; there is evidence of meals, a small camp
    - The matter is not dangerous but it cannot be resolved alone; it requires someone from away
    - Passing it by is possible; the figure calls after the party that they will still be here
  narrative_hint: >-
    The matter is small but resolving it earns something out of proportion
    to the effort — trust, a shortcut, knowledge. Let the figure's
    gratitude be genuine and their information reliable, so players learn
    that helping is worth the pause.

- id: a_reversal_of_the_expected_threat
  name: The Threat Is Not the Threat
  description: >-
    The thing the party feared — the fortress, the beast, the army —
    turns out to be harmless, benign, or on the party's side. The
    actual danger is whatever the party stopped paying attention to
    while they were preparing for the wrong fight.
  flavor_tags: [reversal, wonder, authority, traveler]
  lifespan_turns: 5
  delivery_hints:
    - The feared thing greets the party with confusion; nobody has come at it prepared for a fight before
    - A local, watching, says "oh, no, that's friendly; the one to worry about is—" and gestures at something else
    - The party's preparations for the wrong threat turn out to be exactly what the right threat fears
  narrative_hint: >-
    The reversal is the genre in a sentence — survival by wit, not force.
    Let the party's reaction to the "wrong" threat give them unearned
    credibility that the real problem then exploits.

- id: a_gift_with_instructions
  name: A Gift with Very Specific Instructions
  description: >-
    The party is given something — a token, a food, a piece of
    knowledge — along with precise instructions for its use. The
    instructions are plausible. The giver has left. The instructions
    are, at a critical moment, impossible to follow exactly.
  flavor_tags: [bargain, wonder, traveler, absurdity]
  lifespan_turns: 8
  delivery_hints:
    - The giver repeated the instructions twice and seemed confident; the confidence was earned
    - The impossible element is small — a wrong season, a missing object, a name that changed
    - Someone else nearby knows a workaround and is willing to share it for a favor
  narrative_hint: >-
    The gap between the instructions and reality is a negotiation
    opportunity; let the workaround cost something small but bind the
    players to a new actor in the world. The gift itself still works,
    imperfectly.

- id: the_shortcut_that_costs
  name: The Shortcut That Costs Exactly as Much as It Saves
  description: >-
    There is a faster way to wherever the party is going. It is real.
    It works. It will save considerable time. The cost of the shortcut
    is exactly equivalent to the time saved, in a currency the party
    did not expect to be spending.
  flavor_tags: [travel, bargain, absurdity, wonder]
  lifespan_turns: 6
  delivery_hints:
    - The person offering it is not a deceiver; they explain the cost clearly
    - The currency is not money; it might be reputation, a memory, a name, a truth
    - Other travelers who took it report arriving faster; they do not report regretting it
  narrative_hint: >-
    The cost is the story; let the players decide whether the trade is
    worth it and then live with whatever they gave up. The thing spent
    returns as a plot element later, in the hands of whoever received it.

- id: a_decree_about_travelers
  name: A Recent Decree Specifically About Travelers
  description: >-
    Someone in authority has issued, quite recently, a law that applies
    specifically to people who arrived from elsewhere. The law was
    written before the party arrived. It applies to them. It is
    inconvenient but not immediately fatal.
  flavor_tags: [law-of-the-land, authority, absurdity, traveler]
  lifespan_turns: 6
  delivery_hints:
    - The decree is posted; someone helpfully reads it to the party
    - The official enforcing it is embarrassed; it is clearly aimed at a different kind of traveler
    - There is an exemption, but claiming it requires proving something the party can probably prove
  narrative_hint: >-
    The exemption is the puzzle; let it require the party to engage with
    the world in order to prove who they are. The decree's actual target —
    whoever caused it to be written — may become relevant later.
