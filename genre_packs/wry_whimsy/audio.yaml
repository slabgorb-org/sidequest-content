# Wry Whimsy — public-domain orchestral whimsy. Cinematic cues, never looping.
# Tracks are the deferred-asset class (manifest is the spec; OGG sourced later
# from the shared classical_pd library). Mood keys cover every confrontation
# mood declared in rules.yaml: courtroom, nonsense, tension, dreamlike, warm, combat.

mood_tracks:
  exploration:
    # The traveler wandering a place that runs on rules no one will explain.
    - path: audio/classical_pd/Grieg - Morning Mood (Peer Gynt).ogg
      title: "Morning Mood"
      bpm: 70
    - path: audio/classical_pd/Satie - Gymnopedie No.1.ogg
      title: "Gymnopédie No.1"
      bpm: 60
    - path: audio/classical_pd/Debussy - Clair de Lune.ogg
      title: "Clair de Lune"
      bpm: 55

  courtroom:
    # Audience / Trial — pompous absurd authority, played dead straight.
    - path: audio/classical_pd/Elgar - Pomp and Circumstance March No.1.ogg
      title: "Pomp and Circumstance"
      bpm: 90
    - path: audio/classical_pd/Handel - Arrival of the Queen of Sheba.ogg
      title: "Arrival of the Queen of Sheba"
      bpm: 100

  nonsense:
    # Wit-Duel — the world refuses to make sense and finds it funny.
    - path: audio/classical_pd/Saint-Saens - The Cuckoo (Carnival of the Animals).ogg
      title: "The Cuckoo in the Depths of the Woods"
      bpm: 80
    - path: audio/classical_pd/Saint-Saens - Fossils (Carnival of the Animals).ogg
      title: "Fossils"
      bpm: 110

  tension:
    # Escape / Not-Getting-Caught — the corridor, the poppy field, the wrong door.
    - path: audio/classical_pd/Grieg - In the Hall of the Mountain King.ogg
      title: "In the Hall of the Mountain King"
      bpm: 85
    - path: audio/classical_pd/Mussorgsky - Night on Bald Mountain.ogg
      title: "Night on Bald Mountain"
      bpm: 95

  dreamlike:
    # Wonder-Shock — the uncanny presses against your grip on the ordinary.
    - path: audio/classical_pd/Debussy - Reverie.ogg
      title: "Rêverie"
      bpm: 55
    - path: audio/classical_pd/Satie - Gnossienne No.1.ogg
      title: "Gnossienne No.1"
      bpm: 60

  warm:
    # Persuasion — sincerity over force; the companion won over.
    - path: audio/classical_pd/Schumann - Traumerei.ogg
      title: "Träumerei"
      bpm: 55
    - path: audio/classical_pd/Dvorak - Humoresque.ogg
      title: "Humoresque"
      bpm: 75
    - path: audio/classical_pd/Elgar - Salut d'Amour.ogg
      title: "Salut d'Amour"
      bpm: 70

  combat:
    # Violence — the priced exception; wit has failed and the bucket comes out.
    - path: audio/classical_pd/Saint-Saens - Danse Macabre.ogg
      title: "Danse Macabre"
      bpm: 110
    - path: audio/classical_pd/Dukas - The Sorcerer's Apprentice.ogg
      title: "The Sorcerer's Apprentice"
      bpm: 120

  rest:
    # The breath after the scene — the fire low, the strange place quiet.
    - path: audio/classical_pd/Satie - Gymnopedie No.3.ogg
      title: "Gymnopédie No.3"
      bpm: 55
    - path: audio/classical_pd/Schumann - Of Foreign Lands and Peoples.ogg
      title: "Of Foreign Lands and Peoples"
      bpm: 60

# Genre-specific mood keywords — let the narrator's prose trigger the right cue.
mood_keywords:
  courtroom:
    - trial
    - court
    - verdict
    - sentence
    - judge
    - throne
    - audience
    - decree
    - the king commands
    - on trial
  nonsense:
    - riddle
    - nonsense
    - argue
    - tea party
    - backwards
    - makes no sense
    - puzzle
    - contradiction
    - the rules say
  dreamlike:
    - shrink
    - grow
    - falling
    - dream
    - mirror
    - impossible
    - unreal
    - the world tilts
    - too strange
    - wonder
  warm:
    - befriend
    - reassure
    - kindness
    - plead
    - sincere
    - companion
    - help me
    - take heart

sfx_library:
  page_turn:
    - audio/sfx/page_turn.ogg
  pocket_watch:
    - audio/sfx/pocket_watch_tick.ogg
  wind_gust:
    - audio/sfx/wind_gust.ogg
  small_bell:
    - audio/sfx/small_bell.ogg

mixer:
  music_volume: 0.4
  sfx_volume: 0.7
  crossfade_default_ms: 3000

ai_generation:
  enabled: false
