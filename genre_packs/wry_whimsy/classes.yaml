# Wry Whimsy — Class Definitions (ADR-095/097 Class Mechanical Surface)
#
# One signature ability per class. All six wry_whimsy classes are non-magical
# (magic_level: none in rules.yaml) — magic_access stays null on every class.
#
# These classes are the playable shapes of the portal fairytale: the six
# coping-styles a sensible traveler brings to a Secondary World run on
# dream-logic. They map onto the genre-tier coping archetypes in
# archetypes.yaml (The Innocent / Wit / Surveyor / Scrapper / Dreamer) via the
# `typical_classes` cross-reference there.
#
# DESIGN NOTES (read before editing):
#
#   - ruleset: native. There is no SRD module; abilities couple to the native
#     dual-track confrontation engine (rules.yaml > confrontations): each side
#     carries an ascending dial (player_metric / opponent_metric), beats declare
#     a kind (strike / brace / push / angle), and Composure rides the ablative
#     HP/Edge pool (ADR-078/ADR-114). The abilities below are stated in THAT
#     vocabulary so the narrator applies them consistently turn to turn.
#
#   - SOFT CRUNCH, by design. mechanical_effect is a description surfaced to the
#     player (Abilities tab) and to the narrator — the same content-defined
#     surface road_warrior/classes.yaml uses. The engine grants the ability at
#     level 1 (source=Class) and makes it legible; it is not a separately
#     hard-coded code path. Each is gated "once per confrontation" in fiction.
#
#   - encounter_beat_choices is REQUIRED non-empty (loader + beat_filter both
#     reject an empty list) and every id must exist in the confrontation beat
#     pool. It does NOT restrict play here: every wry_whimsy beat is
#     class_filter: None (universal), so beat_filter.beats_available_for serves
#     all beats to every class regardless (beat_filter.py — universal beats
#     bypass the per-class whitelist). The list below is the THEMATIC signature
#     set for each class and the scaffold for any future class-gated beat.
#
#   - kit_table is required by the model but inert here: wry_whimsy ships no
#     equipment_tables.yaml, so the builder's kit roll is guarded out
#     (builder.py — `self._equipment_tables is not None`). The real per-class
#     loadout comes from inventory.yaml > starting_equipment, exactly as in
#     road_warrior. The value is kept descriptive for when a kit table lands.
#
#   - saving_throws: null on every class — this genre uses confrontation dials
#     and Composure thresholds, not B/X saves (rules.yaml omits them).
#
# Locked ability axes (rules.yaml): WIT (cleverness/argument), NERVE (composure
# under absurdity), HEART (sincerity/conviction), GUILE (cunning/misdirection),
# WONDER (openness to dream-logic — the going-native risk stat).

- id: curious_child
  display_name: Curious Child
  rpg_role: support
  jungian_default: innocent
  prime_requisite: HEART
  minimum_score: 9
  kit_table: curious_child_kit
  flavor: >-
    You meet the impossible with questions instead of fear, and the world keeps
    forgetting to be frightening at you.
  encounter_beat_choices:
    - appeal_to_fairness
    - speak_plainly
    - feign_confusion
    - name_what_you_see
    - let_them_decide
    - blend_in
  magic_access: null
  abilities:
    - name: "Disarming Question"
      genre_description: >-
        You ask the question no one else will — the plain, honest, childish one
        that goes straight under the nonsense and out the other side. "But why
        would you do that?" "But that's not fair, is it?" "But who told you?"
        The authority opens its mouth to crush you and finds there is nothing to
        crush; you have not argued, you have only wondered, out loud, with your
        whole open face. For one terrible moment everyone in the room can hear
        how silly the rule is. And nobody can be angry at a child for asking.
      mechanical_effect: >-
        Once per confrontation, in place of a normal beat: ask the disarming
        question. Resolves as an angle beat that auto-succeeds with no roll and
        banks the tag "Underestimated" — your next strike beat this
        confrontation gains +base equal to your HEART modifier. The authority
        cannot retaliate for it: the opponent's dial does not advance in
        response this beat. No mechanical effect in Violence — a fist does not
        care what you asked.
      involuntary: false
  saving_throws: null

- id: practical_servant
  display_name: Practical Servant
  rpg_role: support
  jungian_default: caregiver
  prime_requisite: GUILE
  minimum_score: 9
  kit_table: practical_servant_kit
  flavor: >-
    While everyone else marvels or panics, you are already finding the sensible
    thing to do. Nonsense is just one more mess to be sorted.
  encounter_beat_choices:
    - spot_the_contradiction
    - find_their_fear
    - ward_it_off
    - catch_your_breath
    - wait_them_out
    - dirty_trick
    - blend_in
  magic_access: null
  abilities:
    - name: "The Sensible Thing"
      genre_description: >-
        Everyone else is busy being amazed. You have noticed that the door is
        only stuck, that the tea wants more water, that the dreadful machine has
        a lever clearly marked OFF. You roll up your sleeves and do the small,
        obvious, competent thing the dream never planned for, because the dream
        runs on wonder and you have declined to provide any. The nonsense has to
        stop and explain itself all over again, and it is never quite as
        frightening the second time.
      mechanical_effect: >-
        Once per confrontation: do the mundane, practical thing the scene
        overlooked. Resolves as a brace beat that costs you no Composure this
        beat (your edge does not erode) AND halves the base of the opponent's
        next beat — they must re-establish the nonsense you just no-sold. If you
        are carrying an item tagged `anchor` (e.g. Sensible Shoes, Pocket
        Handkerchief), also advance your own dial by 1.
      involuntary: false
  saving_throws: null

- id: earnest_scholar
  display_name: Earnest Scholar
  rpg_role: control
  jungian_default: explorer
  prime_requisite: WIT
  minimum_score: 9
  kit_table: earnest_scholar_kit
  flavor: >-
    You believe anything can be understood if you only observe it closely
    enough — and you will reason your way through this place, or be humbled hard.
  encounter_beat_choices:
    - state_your_case
    - spot_the_contradiction
    - pose_a_riddle
    - name_what_you_see
    - find_their_fear
  magic_access: null
  abilities:
    - name: "By My Reckoning"
      genre_description: >-
        You have been taking notes. While everyone else reeled, you watched —
        the order the cards deal, the way the Queen counts, the rule the place
        will not say aloud because saying it would break it. You lay your finger
        on the seam in the nonsense and announce, with the quiet confidence of a
        person who has done the arithmetic, exactly how this works. When you are
        right, the contradiction is a lever in your hand. When you are wrong, the
        place is delighted to remind you that some logic is to be played along
        with, not solved.
      mechanical_effect: >-
        Once per confrontation: declare By My Reckoning and make a WIT check
        against the opponent dial's current value. On success, bank a
        double-value "Rule Understood" angle — your next angle or strike beat
        spends it for +base equal to twice your WIT modifier. On failure you are
        humbled: the opponent's dial advances by 1 (the place resents being
        measured). High-information, real downside.
      involuntary: false
  saving_throws: null

- id: weary_soldier
  display_name: Weary Soldier
  rpg_role: tank
  jungian_default: hero
  prime_requisite: NERVE
  minimum_score: 9
  kit_table: weary_soldier_kit
  flavor: >-
    You came from a real war and you carry its wariness. The local battles are
    not won with force — they are won by keeping your nerve when the absurdity
    turns dangerous, and you can do that better than anyone.
  encounter_beat_choices:
    - hold_your_nerve
    - keep_a_straight_face
    - breathe
    - ward_it_off
    - catch_your_breath
    - scrappy_blow
    - break_off
  magic_access: null
  abilities:
    - name: "Hold the Line"
      genre_description: >-
        You have stood in worse than this. You plant your feet, you square your
        shoulders, and you simply decline to break — not bravado, just the flat
        professional knowledge that spectacle is only spectacle and panic is the
        thing that actually kills you. The Queen screams, the chess-board tilts,
        the giant leans in close enough to fog the air, and you hold. You have
        held before. You will hold until the others are clear.
      mechanical_effect: >-
        Once per confrontation: declare Hold the Line. Until the start of your
        next turn your Composure (HP/Edge) cannot drop below 1 and the
        opponent's dial cannot advance against you — you do not break, full stop.
        If an ally is present in the scene, the protection extends to one ally of
        your choice. The genre's steadiness answer to the priced-violence lane.
      involuntary: false
  saving_throws: null

- id: wayward_dreamer
  display_name: Wayward Dreamer
  rpg_role: dps
  jungian_default: magician
  prime_requisite: WONDER
  minimum_score: 9
  kit_table: wayward_dreamer_kit
  flavor: >-
    You took to this place far too easily. You delight in the impossible and
    lean into its logic with an open, unwary heart — your great gift and your
    great danger, because the dream would so love to keep you.
  encounter_beat_choices:
    - take_the_wrong_door
    - let_the_wonder_in
    - anchor_to_a_memory
    - pose_a_riddle
    - name_what_you_see
  magic_access: null
  abilities:
    - name: "Lean In"
      genre_description: >-
        You stop fighting it. You let the dream-logic come all the way in — and
        for a few bright, vertiginous seconds you see the place the way it sees
        itself: which door is really the door, what the riddle is really asking,
        where the impossible thing keeps its hinge. It is the most useful you
        will ever be here. It is also one step further from ever waking up. Each
        time is easier. That is exactly the problem.
      mechanical_effect: >-
        Once per confrontation: declare Lean In. Take a WONDER angle beat that
        auto-succeeds and advances your dial by your WONDER modifier + 3. Cost:
        debit your own Composure by 2 (edge_delta) and gain one "Half-Native"
        mark. Half-Native marks are the going-native price — they make the
        waking (the genre's exit) harder and accumulate across the campaign. The
        sharpest instrument in the kit, sold to you on credit.
      involuntary: false
  saving_throws: null

- id: stubborn_skeptic
  display_name: Stubborn Skeptic
  rpg_role: control
  jungian_default: sage
  prime_requisite: WIT
  minimum_score: 9
  kit_table: stubborn_skeptic_kit
  flavor: >-
    You flatly refuse to believe in any of this, and you will say so, loudly, to
    a talking rabbit's face. An authority that runs on belief has no power over
    someone who declines to grant it.
  encounter_beat_choices:
    - refuse_the_premise
    - sharp_retort
    - spot_the_contradiction
    - state_your_case
    - keep_a_straight_face
    - look_away
  magic_access: null
  abilities:
    - name: "Disbelief"
      genre_description: >-
        The court rises, the verdict gathers, the spell reaches for you — and you
        cross your arms and decline. Not defiance, exactly; something flatter and
        ruder than that. You simply do not grant it. "You're nothing but a pack
        of cards." The authority here is made entirely of everyone agreeing to be
        afraid, and you have withdrawn your subscription. For one beat the whole
        towering nonsense has no purchase on you at all, because you have refused
        to supply the one thing it was built out of.
      mechanical_effect: >-
        Once per confrontation, when the opponent's dial would advance, declare
        Disbelief: that advance is negated (the opponent's gain becomes 0 for
        that beat). Strongest against authority that runs on belief — a court's
        verdict, a wonder-shock's dream_pull, a persuader's resistance. It does
        NOT negate Composure/HP loss in Violence: a fist is real whether you
        believe in it or not, and the genre keeps that honest.
      involuntary: false
  saving_throws: null
