# Wry Whimsy is a collaborative wander-and-fuck-around sandbox, not a PvP game.
# The table coordinates openly (per ADR-036 — the playgroup doesn't slip notes),
# and mechanics-first players want to see the math. So the baseline broadcasts
# everything: everyone sees agency, confrontations, lore reveals, and rolls.
# (tone enum is broadcast_heavy | balanced | secret_heavy — broadcast_heavy is
# the maximum-visibility, everyone-sees-everything end.)
tone: broadcast_heavy
default_visibility:
  npc_agency: all
  confrontation_init: all
  stealth_roll_check: all
  lore_reveal: all
  dice_roll_private: all
status_effect_fidelity:
  blinded: {visual_only: drop, audio_only: keep}
  deafened: {audio_only: drop, visual_only: keep}
all_scope: protagonists
