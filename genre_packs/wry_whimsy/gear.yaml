# Wry Whimsy — Fate gear (ADR-144 gear model, story 114-10).
#
# Fate has no equipment economy: gear is not a carried inventory, it is the
# signature kit the sensible traveler crosses the threshold carrying, compiled
# into the FateSheet at chargen as aspects + a permission. All entries are
# aspect-/permission-gear (FREE — no refresh debit), so a wry_whimsy traveler
# keeps the SRD refresh of 3. None of it is a weapon: violence is the priced
# exception (custom_rules.lethality: forgiving), never a stat-block loadout.
#
# These are the ordinary, human, faintly sentimental things a traveler had on
# them when the world swallowed them — the genre's whole point is that you
# survive by what is in your head and your manners, not by what is in your pack.
# (The silver/ruby shoes are NOT here — they are a mid-game found item per the
# 121-4 design, not chargen kit.)
- id: whimsy_sensible_pinafore
  name: A Sensible Pinafore
  description: >-
    A plain gingham dress and a starched pinafore from the ordinary side of the
    threshold — grass-stained now, a size too neat for this place, and stubbornly,
    reassuringly real. As long as you are wearing your own clothes you remember
    exactly who and what you are, which is the one thing a world run on dream-logic
    most wants you to forget.
  grants_aspects:
    - text: Stubbornly, Reassuringly Ordinary
      kind: character

- id: whimsy_basket_with_a_dog
  name: A Basket (With a Small Dog In It)
  description: >-
    A wicker basket that was meant for a picnic and is now mostly occupied by a
    small, opinionated dog who came across the threshold with you and has no
    intention of behaving. He is no use in a fight and every use as a reason to be
    brave, a thing to protect, and a warm, growling argument that you are still a
    person from somewhere that made sense.
  grants_aspects:
    - text: Someone Small to Be Brave For
      kind: character

- id: whimsy_good_manners
  name: Impeccable Good Manners
  description: >-
    You were raised to curtsey, to say please and thank you, and to address even a
    talking caterpillar with scrupulous courtesy. In a Secondary World of humbug
    kings and capricious courts — authorities that have braced for defiance and
    never once for politeness — old-fashioned good manners are a key that quietly
    opens doors a sword would only get you thrown out of.
  grants_aspects:
    - text: Good Manners Open Doors
      kind: permission

- id: whimsy_head_full_of_stories
  name: A Head Full of Stories
  description: >-
    You have read a very great many books, and out here that turns out to matter
    enormously: the dream is made of stories, and you half-remember the shape of
    this one. You know that the youngest sets out alone, that the cruel riddle has
    a fair answer, that kindness to the small thing is never wasted — and knowing
    the rules of the tale is the closest thing to a map this place allows.
  grants_aspects:
    - text: I've Read This Sort of Story Before
      kind: character
