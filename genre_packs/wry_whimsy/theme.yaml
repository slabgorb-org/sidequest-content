primary: '#8C3B2E'      # faded clothbound red — the cover of a well-loved storybook
secondary: '#B8893C'    # antique gilt — the gold leaf worn off the spine
accent: '#4E7C6F'       # faded fairytale teal — a colour plate gone soft with age
background: '#EFE5CE'   # aged cream paper — the leaf you turn by lamplight
surface: '#F8F0DC'      # paler leaf — the margin around the engraving
text: '#2A2620'         # warm ink black — a careful 1900 typeface
border_style: light
web_font_family: Lora
display_font_family: Playfair Display
archetype: parchment

dinkus:
  enabled: true
  cooldown: 2
  default_weight: medium
  glyph:
    light: "—  ✦  —"
    medium: "✦ · ✦ · ✦"
    heavy: "✦ ✦ ✦ ✦ ✦"

session_opener:
  enabled: true
