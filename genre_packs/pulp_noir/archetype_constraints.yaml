# archetype_constraints.yaml — pulp_noir
# Defines valid Jungian x RPG Role pairings for this genre
# common: chargen default, NPC gen draws most
# uncommon: shown if player explores, NPC diversity
# rare: allowed but unusual, memorable characters
# forbidden: genuinely nonsensical for this genre
#
# Pulp noir is morally compromised by design. Everybody's working an angle.
# The outlaw is the default protagonist — bootleggers, shady detectives,
# grifters who'd sell their grandmother's address for the right price.
# The hero exists but arrives pre-tarnished, bourbon on the breath, doing
# the right thing for the wrong reasons. Rulers pull strings from backrooms
# full of cigar smoke. Sages know things that get people killed. The
# innocent is a lamb in a slaughterhouse — present only as the victim whose
# disappearance kicks off the plot, or the kid who hasn't learned yet.
# The magician is the occult angle: tunable from "rational con artist" to
# "the séance actually worked." The jester is the fast-talking nightclub
# comic, the con man whose patter never stops.

valid_pairings:
  common:
    - [outlaw, stealth]
    - [outlaw, dps]
    - [outlaw, jack_of_all_trades]
    - [hero, dps]
    - [hero, tank]
    - [hero, jack_of_all_trades]
    - [sage, control]
    - [sage, support]
    - [ruler, support]
