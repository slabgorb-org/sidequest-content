# Seed tropes for pulp_noir — short-arc narrative hooks dealt at session
# start from a per-pack deck (ADR-018, ADR-128). Dealt without replacement;
# each seed expires after its lifespan_turns and lingers as a ghost for
# later callback. Seeds are baited hooks (ADR-014 diamonds-and-coal) —
# vague on purpose; the narrator retroactively threads engaged seeds into
# whatever the case demands.
#
# World-agnostic by design (ADR-140): genre grammar only — clients who lie,
# a world sliding toward war, money with politics on it, and the occult
# kept strictly at a simmer (tunable per world from "purely rational" to
# "the ritual worked" — seeds must read true at EITHER setting). No named
# city, country, or year; those belong to the worlds.

- id: the_client_lies_about_the_small_thing
  name: The Client Lies About the Small Thing
  description: >-
    The job is straightforward and the client's story holds —
    except for one small detail, peripheral to the work, that
    checks out false. Not the money, not the target: a date, a
    relationship, where they were Tuesday. People lie about small
    things to protect big ones, and the big one is somewhere
    behind that date.
  flavor_tags: [client, deception, case, leverage]
  lifespan_turns: 7
  delivery_hints:
    - The lie is unnecessary — the truth would have served the cover story better, which means it protects something else
    - Confronted gently, the client adjusts the lie rather than dropping it
    - A third party knows the true detail and assumes the party was hired BECAUSE of it
  narrative_hint: >-
    The small lie is the case under the case. Let the job complete
    on its own terms while the lie's thread runs underneath, and
    let pulling it recast the client from employer to subject.

- id: the_package_everyone_insures
  name: The Package Everyone Wants Insured
  description: >-
    Something is moving through town — a crate, a courier's
    satchel, a person with a steamer trunk — and an improbable
    number of parties have taken out positions on it: insurance,
    guards, watchers in doorways, a customs man suddenly diligent.
    Nobody will say what it is. Everyone's behavior says what it's
    worth.
  flavor_tags: [macguffin, smuggling, watchers, convergence]
  lifespan_turns: 6
  delivery_hints:
    - The watchers don't know about each other yet, and the doorways are filling up
    - The paperwork around it is perfect, which in this town means expensive
    - One interested party approaches the players on the assumption they're another interested party
  narrative_hint: >-
    The package is a convergence engine — let the party be drawn
    in by misidentification, paid by one side, and educated by
    watching the others. What's inside should matter less than
    who is willing to do what before it ships out again.

- id: the_war_is_already_here_quietly
  name: The War Arrived Early, Quietly
  description: >-
    The war everyone says is coming has, in one small way, already
    started here: a warehouse leased by a foreign trade office that
    trades nothing, men with military posture and civilian clothes,
    a shortwave set in a respectable attic. Officially nothing is
    happening. The neighborhood knows better and has begun choosing
    sides by instinct.
  flavor_tags: [espionage, war, neighborhood, sides]
  lifespan_turns: 8
  delivery_hints:
    - The operation is mundane — counting, photographing, listing — which is somehow more ominous than sabotage
    - A local who works for them doesn't know what he's part of, and is starting to suspect
    - Both consulates would pay for proof; both would also prefer the proof-finder disposable
  narrative_hint: >-
    The early war is atmosphere with a fuse in it. Let the mundane
    espionage assemble toward one specific upcoming event, and let
    the suspicious local be the human stakes — he can be saved,
    used, or spent, and somebody will do one of those.

- id: the_widows_perfect_grief
  name: The Widow Grieves Beautifully
  description: >-
    A death — accident, they say — has left a widow, a partner, an
    heir, whose grief is impeccable. Perfectly composed, perfectly
    timed, photographed once for the papers at exactly the right
    angle. Grief that well-produced is either the deepest kind or
    a performance, and two people in town are quietly asking which.
  flavor_tags: [death, performance, inheritance, suspicion]
  lifespan_turns: 7
  delivery_hints:
    - The estate settles unusually fast; somebody greased the probate
    - The deceased's habits, reconstructed, include one appointment kept weekly and entered nowhere
    - The other person asking questions is asking better ones and is not who they claim
  narrative_hint: >-
    The beautiful grief is a locked room with a mourner in it.
    Let the weekly appointment be the door, the fast probate be
    the motive's receipt, and the rival questioner force the
    party to decide whether they're competitors or colleagues.

- id: the_photograph_with_a_sixth_man
  name: The Photograph Has a Sixth Man
  description: >-
    A photograph surfaces — a banquet, a hunting party, five
    gentlemen everybody can name. And a sixth figure, half-turned,
    at the table's end, whom nobody can. The five have alibis of
    granite for the night the photo touches; the sixth has no name
    at all. Someone is paying to collect every print.
  flavor_tags: [photograph, mystery, erasure, society]
  lifespan_turns: 8
  delivery_hints:
    - The photographer's studio burned, with the negatives, in a fire the insurer found unremarkable
    - One of the five, drunk, calls the sixth by a nickname and then loses the rest of the evening
    - The print-collector pays generously and his agents arrive everywhere about a day behind the party
  narrative_hint: >-
    The sixth man is an erasure in progress — let the nickname be
    the crack, the burned studio be the precedent, and the
    collector's one-day lag be the tempo of the whole seed. Who
    the sixth man WAS matters less than what the five did
    together that needs him gone.

- id: the_speakeasy_changes_its_password
  name: The Back Room Changed Its Rules
  description: >-
    A drinking den, card room, or after-hours club the district
    relies on has changed: new password, new doorman, a back room
    that's members-only as of last week. The liquor is the same.
    The clientele has been quietly sorted, and the sorting
    criterion is the interesting part — somebody upstairs is
    filtering for something.
  flavor_tags: [club, society, sorting, secrets]
  lifespan_turns: 6
  delivery_hints:
    - The new doorman's questions sound like small talk and assemble into a screening
    - A former regular, now excluded, is bitter, talkative, and wrong about why
    - The back room's members leave at odd hours with the look of people who have signed something
  narrative_hint: >-
    The sorted clientele is recruitment, ritual, or racket — let
    the screening's criterion reveal the operator's need, and the
    bitter regular's wrong theory contain one accidentally right
    detail. Getting INTO the back room should cost a small
    compromise that escalates beautifully.

- id: the_scholar_sells_his_library
  name: The Scholar Is Selling His Library
  description: >-
    A scholar, collector, or retired professor — known for one
    obsession pursued across decades — has abruptly begun selling
    his library. Piecemeal, fast, below value, in cash. Except for
    one shelf of books he will not sell at any price; those he has
    started, methodically, to burn.
  flavor_tags: [occult, scholar, books, fear]
  lifespan_turns: 8
  delivery_hints:
    - The sold books map the obsession's edges; the burned shelf was its center
    - A buyer has standing instructions with every dealer in town for anything from this collection
    - The scholar is not mad; he is frightened with great precision, of something with a date attached
  narrative_hint: >-
    The burning scholar plays at every occult setting — what he
    found is either real or believed with lethal sincerity, and
    the seed must not care which. Let the dated fear be the
    clock, a rescued book be the temptation, and the standing-order
    buyer be ahead of the party at every dealer but one.

- id: the_fixer_owes_the_party_a_favor
  name: The Favor Comes Due in Reverse
  description: >-
    A fixer, ward boss, or well-connected bartender owes the party
    a favor — and has started, unasked, to repay it: a tip here, a
    door opened there, a parking ticket vanished. The repayments
    are accelerating. Someone repaying a favor that fast is
    clearing their books, and people clear their books before a
    storm, a betrayal, or a departure.
  flavor_tags: [favor, fixer, omen, departure]
  lifespan_turns: 6
  delivery_hints:
    - Others who held the fixer's markers report the same accelerated generosity
    - The fixer's own debts, meanwhile, are being quietly bought up by a single creditor
    - The last repayment offered is too large — it's not repayment, it's a transfer for safekeeping
  narrative_hint: >-
    The book-clearing fixer is a weather report — let the bought-up
    debts name the storm's author, and the too-large final favor
    make the party custodians of something the fixer couldn't
    protect. When the storm lands, what they did with it decides
    their standing in the after.

- id: the_heiress_hires_a_double
  name: Somebody Is Auditioning Doubles
  description: >-
    Through theatrical agencies and modeling bureaus, somebody is
    discreetly auditioning for a double — right height, right
    profile, can learn a walk and a laugh. The original is a person
    of consequence. The pay is excellent. The contract's term is
    one specific evening, three weeks out.
  flavor_tags: [impersonation, society, conspiracy, deadline]
  lifespan_turns: 7
  delivery_hints:
    - The audition sides include real private mannerisms — whoever wrote them has intimate access
    - One earlier candidate got the job, was paid in full, and has not been seen since the fitting
    - The specific evening matches an event on no public calendar but on two private ones
  narrative_hint: >-
    The double-audition is a conspiracy with a casting call. Let
    the party enter through the agency, the missing first
    candidate be the dread, and the question of whether the double
    is for an alibi, a target, or an escape stay open until the
    evening itself.

- id: the_confession_to_the_wrong_priest
  name: The Confession Went to the Wrong Listener
  description: >-
    Somebody confessed something — in a church, to a doctor, across
    a pillow, into a wire recorder they thought was off — and the
    confession has begun to move. The listener was not bound by the
    rules the confessor assumed. The matter confessed has a price
    on it, and now so does the recording, the listener, and
    everyone who has heard it since.
  flavor_tags: [confession, blackmail, chain, secrets]
  lifespan_turns: 7
  delivery_hints:
    - The confession's content is never quite quoted — everyone trading on it paraphrases, and the paraphrases drift
    - Each holder of the secret has tried to sell it exactly once and been frightened by the buyer's response
    - The original confessor knows it's loose and is behaving like a person settling accounts
  narrative_hint: >-
    The traveling confession is a chain the party can trace from
    either end. Let the paraphrase-drift hide the secret's true
    shape until late, and let the confessor's account-settling be
    sympathetic — the genre's best blackmail victims did the thing,
    regret the thing, and are still worth saving from the price.

- id: the_charity_gala_has_a_second_ledger
  name: The Benefit Has Two Sets of Books
  description: >-
    A charitable committee — flood relief, refugees, war bonds for
    somebody's gallant little country — is the season's cause, and
    its gala the season's event. The cause is real. The books are
    not. Money is arriving as charity and leaving as something
    else, and one committee member has begun to suspect what.
  flavor_tags: [society, money, frontgroup, suspicion]
  lifespan_turns: 8
  delivery_hints:
    - The arithmetic is only visible across BOTH ledgers; either alone is clean
    - The suspecting member has started asking hypothetical questions at dinner parties
    - The money's actual destination is political, and arguably — this is the uncomfortable part — a cause some players might back
  narrative_hint: >-
    The two-ledger charity is noir's moral engine: real charity,
    real fraud, defensible treason, all in one set of evening
    clothes. Let the hypothetical-asker be in danger by the
    second act, and let exposing, joining, or quietly taxing the
    scheme all be live options.

- id: the_man_who_missed_his_own_funeral
  name: The Man Who Missed His Own Funeral
  description: >-
    A man the town buried — properly, with a casket and a stone —
    has been seen: a train platform, a hotel bar two towns over, a
    bank queue, always briefly, always by one witness at a time.
    The sightings are too consistent for grief and too shy for a
    swindle. Somebody went into that grave; the question has
    become who.
  flavor_tags: [death, identity, sightings, grave]
  lifespan_turns: 8
  delivery_hints:
    - The witnesses don't know each other and describe the same small new habit — a limp, spectacles, a beard
    - The estate passed cleanly; whoever benefits has perfect paper and a bad reaction to the sightings
    - Exhumation is possible, legal with cause, and somebody powerful finds the idea distasteful enough to block
  narrative_hint: >-
    The unburied man plays rational (insurance, debts, a new war
    coming for him) or uncanny (per the world's occult dial) with
    identical clues. Let the blocked exhumation be the pivot —
    what's in the grave answers everything, which is exactly why
    it's guarded.

- id: the_ticket_out_sold_twice
  name: The Last Berth Was Sold Twice
  description: >-
    Passage out — a liner berth, a seat on the mail plane, papers
    and a visa in a single elegant envelope — has been sold to two
    different desperate people by the same elegant broker. Both
    sail dates are real. Both buyers have begun, in their separate
    terrors, to prepare. The broker has done this before, and the
    overlap is not carelessness.
  flavor_tags: [escape, swindle, refugees, broker]
  lifespan_turns: 6
  delivery_hints:
    - Each buyer is fleeing something specific, and the broker chose them for the specifics
    - The duplicate sale guarantees one buyer will still be in town after the sailing — which serves a third party
    - The broker's earlier double-sales each ended with one buyer aboard and one buyer useful
  narrative_hint: >-
    The double-sold ticket is engineered desperation — the broker
    manufactures people with no choices for clients who need
    exactly such people. Let the party discover the pattern through
    the current pair, and let saving both buyers require breaking
    the broker's actual trade, not just this trade.

- id: the_orchestra_keeps_playing_one_song
  name: The Band Keeps Getting Requests for the Same Song
  description: >-
    At the clubs along the strip, the same song keeps being
    requested — different nights, different requesters, always
    paid for with a folded bill and never danced to. The bandleaders
    have compared notes. The requests cluster before certain
    nights, and things happen on those nights: a truck moves, a
    man leaves town, a door goes unlocked.
  flavor_tags: [signal, nightlife, code, observation]
  lifespan_turns: 6
  delivery_hints:
    - The song choice varies by venue — it's not the song, it's the request, the bill, and the hour
    - One bandleader has started keeping a log and is more frightened of stopping than continuing
    - Playing the song unrequested, once, by accident, caused a night's operation to abort
  narrative_hint: >-
    The musical signal is a code the party can read, spoof, or
    sell. Let the bandleader's log be the codebook, the abort
    prove the system listens, and the operators behind it be
    middle-men for something larger — the signal net outlives any
    single scheme it serves.
