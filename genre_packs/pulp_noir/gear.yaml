# pulp_noir — Fate gear (ADR-144 gear model, story 114-10).
#
# Fate has no equipment economy: gear is not a carried inventory, it is the
# signature kit each hard-boiled PI walks in with, compiled into the FateSheet at
# chargen as aspects + a permission. All entries are aspect-/permission-gear
# (FREE — no refresh debit), so a pulp_noir PC keeps the SRD refresh of 3. The
# guns and favors are story colour, not a damage table (lethality: forgiving;
# conflicts route to the Fate engine, not HP).
- id: noir_trench_coat
  name: Belted Trench Coat
  description: >-
    Rain-darkened wool, collar up, the belt knotted rather than buckled. It has
    been slept in, bled on, and walked through every kind of weather this city
    throws.
  grants_aspects:
    - text: Collar Always Up
      kind: character

- id: noir_pi_license
  name: Investigator's License
  description: >-
    A cardboard license in a cracked celluloid sleeve. It opens doors a badge
    can't and closes ones a gun would only kick down — and it is the difference
    between asking questions and loitering.
  grants_aspects:
    - text: Licensed Private Investigator
      kind: permission

- id: noir_service_revolver
  name: A Piece I'd Rather Not Use
  description: >-
    A snub-nosed revolver that rides under the left arm, more often produced than
    fired. Its weight is a kind of punctuation — the thing you reach for when the
    talking is over.
  grants_aspects:
    - text: A Piece I'd Rather Not Use
      kind: character

- id: noir_little_black_book
  name: The Little Black Book
  description: >-
    A dog-eared address book in three languages, half the entries crossed out,
    every survivor owing you a favor they would rather forget.
  grants_aspects:
    - text: A Contact for Every Occasion
      kind: character
