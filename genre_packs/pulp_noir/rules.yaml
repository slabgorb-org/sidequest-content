# pulp_noir — Fate Core binding (ADR-144 F4b / story 121-2).
# Fate REPLACES the native engine; conflicts route to the fate_conflict engine.
# Only the genre flavor Fate does NOT own (contacts/heat/occult, the Heat
# resource, encounter tension, scene defaults) is retained below.
ruleset: fate
magic_level: low

fate:
  # The hard-boiled skill ladder. One seeded starting spread for every PC for
  # now (per-archetype allocation is story 121-7). A noir PI peaks at
  # Investigate, leans on Contacts and reading people, can handle a piece but
  # would rather not.
  skills:
    Investigate: 4
    Contacts: 3
    Notice: 3
    Rapport: 3
    Deceive: 2
    Stealth: 2
    Will: 2
    Shoot: 2
    Empathy: 1
    Provoke: 1
    Athletics: 1
    Drive: 1
    Burglary: 1
    Fight: 1
    Lore: 1
    Resources: 1
    Physique: 1
  refresh: 3
  # Refresh-invariant knobs (114-10). SRD default 3/3. The signature gear below is
  # all aspect-/permission-gear (free), so a starting PI keeps refresh 3.
  base_refresh: 3
  free_stunts: 3
  # Shared signature gear compiled onto every PI's sheet at chargen (gear.yaml).
  gear:
    - noir_trench_coat
    - noir_pi_license
    - noir_service_revolver
    - noir_little_black_book
  default_high_concept: "Disbarred Lawyer Working the Other Side of the Law"
  default_trouble: "I Can't Leave a Loose Thread Alone"
  stunts:
    - name: "Read the Room"
      description: >-
        Once per scene, when you first enter a charged location, spend no action
        to create an advantage with Notice and invoke it for free — you clock the
        exits, the muscle, and the one person who doesn't belong.
    - name: "Know a Guy"
      description: >-
        +2 to Contacts when you call in a favor from the demimonde — bartenders,
        cabbies, fences, and night-shift clerks who owe you and would rather you
        forgot it.
    - name: "Talk Past the Lie"
      description: >-
        Once per scene, when an opponent succeeds with style to Deceive you, you
        may reduce it to a plain success — something in the delivery rang false and
        you caught it.
    - name: "Cold Under Fire"
      description: >-
        +2 to Will to defend against Provoke attacks while a weapon is pointed at
        you. You've had guns in your face before; the trick is not blinking.

allowed_races:
  - Old Money
  - Street
  - Immigrant
  - Military
  - Academic
  - Frontier

default_race: Street
race_label: Background
default_location: "A smoky bar in a city that never sleeps"
default_time_of_day: night

custom_rules:
  lethality: forgiving
  injury_system: none
  rest_variant: standard
  encumbrance: none
  contacts_system: >-
    Roll Contacts to "know a guy." Each contact is a one-time favor —
    information, a safe house, a forged document, a distraction.
    The Narrator decides if the contact is available and what they want
    in return.
  heat_tracker: >-
    Actions draw attention. Heat rises from 0 (anonymous) to 5 (hunted).
    Law, criminals, and foreign agents each track Heat independently.
    High Heat means NPCs come looking for you. Heat decays slowly
    between sessions or can be reduced through story actions.
  occult_exposure: >-
    Occult encounters are rare and unsettling. Players may stumble into
    rituals, artifacts, or conspiracies that hint at something real beneath
    the paranoia. The occult level is controlled by the world's tone axes —
    from "purely rational explanations" to "the artifact actually works."
    Even at maximum, the occult is climax fuel, not daily magic.

resources:
  - name: heat
    label: Heat
    min: 0.0
    max: 5.0
    starting: 0.0
    voluntary: false
    decay_per_turn: -0.1

encounter_base_tension:
  random: 0.05
  ambush: 0.20
  boss: 0.35
  final: 0.45
