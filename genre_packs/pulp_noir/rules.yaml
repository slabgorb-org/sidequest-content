stat_generation: point_buy
point_buy_budget: 27
magic_level: low

ability_score_names:
  - Brawn
  - Finesse
  - Grit
  - Savvy
  - Nerve
  - Charm

allowed_classes:
  - Detective
  - Brawler
  - Grifter
  - Soldier of Fortune
  - Scholar
  - Smuggler
  - Performer

allowed_races:
  - Old Money
  - Street
  - Immigrant
  - Military
  - Academic
  - Frontier

hp_formula: "class_base + (grit_mod * level)"

stat_display_fields:
  - hp
  - max_hp
  - defense

class_hp_bases:
  Detective: 8
  Brawler: 12
  Grifter: 6
  Soldier of Fortune: 10
  Scholar: 6
  Smuggler: 8
  Performer: 6

default_class: Detective
default_race: Street
race_label: Background
class_label: Archetype
default_hp: 8
default_ac: 10
default_location: "A smoky bar in a city that never sleeps"
default_time_of_day: night

custom_rules:
  lethality: forgiving
  injury_system: none
  rest_variant: standard
  encumbrance: none
  contacts_system: >-
    Spend Charm to "know a guy." Each contact is a one-time favor —
    information, a safe house, a forged document, a distraction.
    The Narrator decides if the contact is available and what they want
    in return.
  heat_tracker: >-
    Actions draw attention. Heat rises from 0 (anonymous) to 5 (hunted).
    Law, criminals, and foreign agents each track Heat independently.
    High Heat means NPCs come looking for you. Heat decays slowly
    between sessions or can be reduced through story actions.
  occult_exposure: >-
    Occult encounters are rare and unsettling. Players may stumble into
    rituals, artifacts, or conspiracies that hint at something real beneath
    the paranoia. The occult level is controlled by the world's tone axes —
    from "purely rational explanations" to "the artifact actually works."
    Even at maximum, the occult is climax fuel, not daily magic.

resources:
  - name: heat
    label: Heat
    min: 0.0
    max: 5.0
    starting: 0.0
    voluntary: false
    decay_per_turn: -0.1

encounter_base_tension:
  random: 0.05
  ambush: 0.20
  boss: 0.35
  final: 0.45

confrontations:
- type: combat
  label: Gunfight
  category: combat
  metric:
    name: hp
    direction: descending
    starting: 0
    threshold_low: 0
  beats:
  - id: shoot
    label: Shoot
    metric_delta: -10
    stat_check: Brawn
    narrator_hint: Revolver bark in a dark alley. Cordite and rain.
  - id: take_cover
    label: Take Cover
    metric_delta: 0
    stat_check: Grit
    effect: "Duck behind a car, a dumpster, a bar"
  - id: brawl
    label: Brawl
    metric_delta: -8
    stat_check: Brawn
    narrator_hint: Close quarters — fists, bottles, chair legs.
  - id: flee
    label: Flee
    metric_delta: 0
    stat_check: Finesse
    resolution: true
    consequence: "Combat ends — disappear into the rain"
  mood: combat
- type: chase
  label: Car Chase
  category: movement
  metric:
    name: separation
    direction: ascending
    starting: 3
    threshold_high: 10
    threshold_low: 0
  beats:
  - id: floor_it
    label: Floor It
    metric_delta: 2
    stat_check: Finesse
    narrator_hint: Tires scream on wet asphalt. Headlights sweep the rain.
  - id: sidestreet
    label: Side Street
    metric_delta: 3
    stat_check: Savvy
    risk: "Dead end — lose 2 separation"
  - id: weave
    label: Weave Through Traffic
    metric_delta: 1
    stat_check: Savvy
    effect: "Use civilian cars as cover"
  - id: ditch_the_car
    label: Ditch the Car
    metric_delta: 0
    stat_check: Finesse
    resolution: true
    consequence: "Chase ends — abandon the vehicle and vanish on foot"
  mood: tension
