# pulp_noir — Fate Core binding (ADR-144 F4b / story 121-2).
# Fate REPLACES the native engine; conflicts route to the fate_conflict engine.
# Only the genre flavor Fate does NOT own (contacts/heat/occult, the Heat
# resource, encounter tension, scene defaults) is retained below.
ruleset: fate
magic_level: low

fate:
  # The hard-boiled skill ladder. One seeded starting spread for every PC for
  # now (per-archetype allocation is story 121-7). A noir PI peaks at
  # Investigate, leans on Contacts and reading people, can handle a piece but
  # would rather not.
  skills:
    Investigate: 4
    Contacts: 3
    Notice: 3
    Rapport: 3
    Deceive: 2
    Stealth: 2
    Will: 2
    Shoot: 2
    Empathy: 1
    Provoke: 1
    Athletics: 1
    Drive: 1
    Burglary: 1
    Fight: 1
    Lore: 1
    Resources: 1
    Physique: 1
  refresh: 3
  # Refresh-invariant knobs (114-10). SRD default 3/3. The signature gear below is
  # all aspect-/permission-gear (free), so a starting PI keeps refresh 3.
  base_refresh: 3
  free_stunts: 3
  # Shared signature gear compiled onto every PI's sheet at chargen (gear.yaml).
  gear:
    - noir_trench_coat
    - noir_pi_license
    - noir_service_revolver
    - noir_little_black_book
  default_high_concept: "Disbarred Lawyer Working the Other Side of the Law"
  default_trouble: "I Can't Leave a Loose Thread Alone"
  # Story 126-24: narrative-chargen seed table. Maps each crucible class_hint
  # (char_creation.yaml) to a COMPLETE legal pyramid (1 Great / 2 Good / 3 Fair /
  # 4 Average) + free-aspect seeds, so the friendly narrative on-ramp presents a
  # pre-ranked, pre-filled Fate sheet (editable defaults) instead of a blank one.
  # Covers every crucible vocation (No Silent Fallbacks: no unseeded class_hint).
  chargen_seed_table:
    Detective:
      pyramid: { Investigate: 4, Notice: 3, Contacts: 3, Deceive: 2, Empathy: 2, Will: 2, Rapport: 1, Stealth: 1, Burglary: 1, Shoot: 1 }
      aspects:
        - "I Find Things Out"
        - "A Ghost in My Past"
    Brawler:
      pyramid: { Fight: 4, Physique: 3, Provoke: 3, Athletics: 2, Notice: 2, Will: 2, Shoot: 1, Contacts: 1, Drive: 1, Empathy: 1 }
      aspects:
        - "I Hit Things, and They Stay Hit"
        - "More Scars Than Sense"
    Grifter:
      pyramid: { Deceive: 4, Rapport: 3, Contacts: 3, Empathy: 2, Notice: 2, Provoke: 2, Stealth: 1, Burglary: 1, Will: 1, Investigate: 1 }
      aspects:
        - "I Talk My Way In"
        - "Never Met a Mark I Didn't Like"
    Soldier of Fortune:
      pyramid: { Shoot: 4, Physique: 3, Athletics: 3, Notice: 2, Will: 2, Fight: 2, Drive: 1, Contacts: 1, Stealth: 1, Provoke: 1 }
      aspects:
        - "I've Seen Action"
        - "There's Always Another War"
    Scholar:
      pyramid: { Lore: 4, Investigate: 3, Will: 3, Notice: 2, Empathy: 2, Contacts: 2, Rapport: 1, Resources: 1, Deceive: 1, Physique: 1 }
      aspects:
        - "I Know Things Others Have Forgotten"
        - "Booksmart, Street-Stupid"
    Smuggler:
      pyramid: { Drive: 4, Stealth: 3, Contacts: 3, Deceive: 2, Notice: 2, Burglary: 2, Shoot: 1, Physique: 1, Resources: 1, Will: 1 }
      aspects:
        - "I Move Things That Shouldn't Move"
        - "Everyone Wants a Cut"
    Performer:
      pyramid: { Rapport: 4, Provoke: 3, Empathy: 3, Deceive: 2, Contacts: 2, Notice: 2, Will: 1, Athletics: 1, Resources: 1, Investigate: 1 }
      aspects:
        - "I Own the Room"
        - "The Show Can't Go On Without Me"
  stunts:
    - name: "Read the Room"
      description: >-
        Once per scene, when you first enter a charged location, spend no action
        to create an advantage with Notice and invoke it for free — you clock the
        exits, the muscle, and the one person who doesn't belong.
    - name: "Know a Guy"
      description: >-
        +2 to Contacts when you call in a favor from the demimonde — bartenders,
        cabbies, fences, and night-shift clerks who owe you and would rather you
        forgot it.
    - name: "Talk Past the Lie"
      description: >-
        Once per scene, when an opponent succeeds with style to Deceive you, you
        may reduce it to a plain success — something in the delivery rang false and
        you caught it.
    - name: "Cold Under Fire"
      description: >-
        +2 to Will to defend against Provoke attacks while a weapon is pointed at
        you. You've had guns in your face before; the trick is not blinking.

allowed_races:
  - Old Money
  - Street
  - Immigrant
  - Military
  - Academic
  - Frontier

default_race: Street
race_label: Background
default_location: "A smoky bar in a city that never sleeps"
default_time_of_day: night

custom_rules:
  lethality: forgiving
  injury_system: none
  rest_variant: standard
  encumbrance: none
  contacts_system: >-
    Roll Contacts to "know a guy." Each contact is a one-time favor —
    information, a safe house, a forged document, a distraction.
    The Narrator decides if the contact is available and what they want
    in return.
  heat_tracker: >-
    Actions draw attention. Heat rises from 0 (anonymous) to 5 (hunted).
    Law, criminals, and foreign agents each track Heat independently.
    High Heat means NPCs come looking for you. Heat decays slowly
    between sessions or can be reduced through story actions.
  occult_exposure: >-
    Occult encounters are rare and unsettling. Players may stumble into
    rituals, artifacts, or conspiracies that hint at something real beneath
    the paranoia. The occult level is controlled by the world's tone axes —
    from "purely rational explanations" to "the artifact actually works."
    Even at maximum, the occult is climax fuel, not daily magic.

resources:
  - name: heat
    label: Heat
    min: 0.0
    max: 5.0
    starting: 0.0
    voluntary: false
    decay_per_turn: -0.1

encounter_base_tension:
  random: 0.05
  ambush: 0.20
  boss: 0.35
  final: 0.45

# ── Confrontations ──────────────────────────────────────────
# pulp_noir binds Fate (ADR-144): conflicts route to the fate_conflict engine
# (4dF + ladder + ablative stress/consequences). These defs exist so the intent
# router has an encounter_type to SEAT — without them every conflict fails loud
# ("unknown encounter_type … — not in pack confrontations") and the narrator is
# forced to improvise violence with no mechanical backing. Under Fate the
# native dial fields below (player_metric / opponent_metric / beat kind / stat_check)
# are INERT — the #964 gate keeps the native overlay off and the 4dF engine owns
# resolution; they survive only to satisfy the ConfrontationDef/BeatDef schema and
# to give the narrator mood + beat labels. Structure mirrors spaghetti_western
# (sibling gunplay-noir Fate pack); re-flavored for Paris, 1926.
confrontations:
  # The gun in the dark — a tense, deadly pause before someone moves. Seats as a
  # full Fate conflict (attack / defend / ablative stress), escalates to violence.
  - type: standoff
    label: "Drawn Guns"
    intent_verbs: [draw, level, aim, threaten, intimidate, square, confront, brace, demand]
    on_intent_mismatch: reprompt
    category: pre_combat
    player_metric:
      name: tension
      starting: 0
      threshold: 10
    opponent_metric:
      name: tension
      starting: 0
      threshold: 10
    beats:
      - id: read_them
        label: "Read Them"
        kind: angle
        target_tag: "Tell Spotted"
        stat_check: CUNNING
        reveals: opponent_detail
      - id: bluff
        label: "Bluff"
        kind: angle
        target_tag: "False Calm"
        base: 3
        stat_check: NERVE
        risk: "they call it — iron comes out"
      - id: hold_nerve
        label: "Hold Your Nerve"
        kind: brace
        base: 1
        stat_check: NERVE
      - id: make_your_move
        label: "Make Your Move"
        kind: push
        stat_check: NERVE
        consequence: "The standoff breaks — someone reaches for a gun"
    escalates_to: combat
    mood: tension
  # Sudden noir violence — a back-alley beating, a shootout in a stairwell. Seats
  # as a full Fate conflict so harm lands on stress / consequences (ADR-144).
  - type: combat
    label: "Sudden Violence"
    intent_verbs: [strike, attack, fight, kill, shoot, hit, stab, swing, slug, grab, beat]
    on_intent_mismatch: reprompt
    category: combat
    player_metric:
      name: momentum
      starting: 0
      threshold: 10
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 10
    beats:
      - id: open_fire
        label: "Open Fire"
        kind: strike
        base: 3
        stat_check: NERVE
        narrator_hint: "A muzzle flash in the dark. Plaster bursts off the wall."
      - id: close_in
        label: "Close In"
        kind: strike
        base: 2
        stat_check: PRESENCE
        narrator_hint: "Inside arm's reach now — fists, elbows, a bottle off the bar."
      - id: take_cover
        label: "Take Cover"
        kind: brace
        base: 1
        stat_check: CUNNING
        narrator_hint: "Behind the overturned table. Splinters where your head was."
      - id: back_off
        label: "Back Off"
        kind: push
        stat_check: NERVE
        consequence: "Hands open, backing toward the door — let them keep the room."
    mood: combat
  # The shakedown, the grilling, the deal that goes sour — tense noir negotiation.
  - type: negotiation
    label: "The Shakedown"
    intent_verbs: [haggle, bargain, offer, deal, negotiate, interrogate, question, press, lean, persuade]
    on_intent_mismatch: warn
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: press
        label: "Press the Point"
        kind: strike
        base: 2
        stat_check: PRESENCE
        effect: "the mark weighs what you're saying"
        narrator_hint: "Show the NPC reckoning with the player's words."
      - id: lean
        label: "Lean On Them"
        kind: strike
        base: 3
        stat_check: NERVE
        risk: "Heat +1 if it fails"
        consequence: "NPC turns hostile on a bad break"
        narrator_hint: "Escalate. The threat should feel like it could go somewhere ugly."
      - id: give_ground
        label: "Give Ground"
        kind: angle
        target_tag: "Real Angle Revealed"
        stat_check: PRESENCE
        effect: "NPC disposition +5, reveals what they actually want"
        narrator_hint: "Strategic retreat. Trade a concession for the truth."
      - id: walk
        label: "Walk"
        kind: push
        stat_check: NERVE
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player leaves. No deal."
    mood: tension
