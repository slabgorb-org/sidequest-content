chapters:
  - id: fresh
    label: "Arrival — A Stranger in Paris"
    session_range: [1, 4]
    location: montparnasse
    time_of_day: evening
    atmosphere: >-
      The café is warm and loud. A jazz trio plays in the corner. The
      waiter brings you something you didn't order and charges you for
      something else. Outside, the rain makes the cobblestones shine
      like they're made of obsidian. You don't know anyone yet, but
      by the end of the night, three people will owe you a favor and
      one will owe you an apology.
    active_stakes: >-
      Establishing yourself in a city that doesn't care if you live
      or die. Finding lodging, contacts, and a reason to stay. The
      first threads of something larger begin to appear — a rumor,
      a face in a crowd, a name mentioned twice by people who shouldn't
      know each other.
    points_of_interest:
      - name: La Rotonde
        slug: la_rotonde
        region: montparnasse
        type: cafe
        description: >-
          The café where everyone starts. Paintings on the walls traded
          for coffee. Hemingway's corner table. The smell of Gauloises
          and strong espresso. The owner knows everyone.
        visual_prompt:
          solo: >-
            Wide three-quarter view into a Montparnasse café interior at
            the boulevard corner on a wet evening. Foreground: a marble-
            topped café table set with a Pernod glass, a brass ashtray
            heaped with crushed Gauloises, a folded newspaper face-down,
            a single dark felt hat on the bentwood chair beside it.
            Middle ground: a long zinc bar in burnished metal, a barman
            in a white apron pouring at the tap, two unsigned canvases
            in heavy frames propped against the back-bar where the
            spirits should be, a violinist and a clarinettist seated on
            a small stage in the deep corner. Background: leaded windows
            running with rain, gas-lamp halos blooming on the wet
            cobbles outside, the silhouette of an omnibus passing.
            Cigarette smoke layered along the pressed-tin ceiling. Dim
            amber from a single low-hung electric pendant over the bar,
            blue dusk failing in the windows behind.
          backdrop: >-
            A long zinc bar and marble café tables in a Montparnasse
            corner café, unsigned canvases stacked against the back-bar,
            leaded windows running with rain behind, amber pendant light
            laying down warm pools through layered cigarette smoke.
        environment:
          solo: >-
            Warm amber pendant light spilling from frame-right against a
            cold blue rainlight from the windows, the smell of black
            tobacco and espresso and wet wool layered together, a low
            clarinet figure from the corner trio and the muffled bell
            of an omnibus passing on the boulevard outside.
          backdrop: >-
            Warm pendant amber over zinc, the smell of strong coffee and
            Gauloises, a clarinet held one bar too long in the corner.
      - name: A Cheap Hotel Near the Station
        slug: cheap_hotel_near_station
        region: gare_montparnasse
        type: hotel
        description: >-
          Third floor, no elevator, shared bathroom down the hall. The
          wallpaper is peeling and the radiator knocks. But the bed is
          clean and the landlady doesn't ask questions.
        visual_prompt:
          solo: >-
            Wide interior view of a narrow third-floor hotel room above
            the southern station quarter at night. Foreground: a
            scarred wooden writing-table under a sash window, a cast-
            brass desk lamp throwing a hard cone of warm light onto a
            single closed leather valise, a tin ashtray with one
            unsmoked cigarette, a glass of cloudy water. Middle ground:
            a narrow iron bedstead made up tight in coarse white linen,
            a folded grey overcoat across the foot rail, a cast-iron
            radiator under the window painted-over many times with one
            valve slightly weeping, a small enamel washstand. Background:
            faded fleur-de-lis wallpaper peeling at the seam, a single
            empty hook where a previous tenant's framed picture has
            been removed, the door to a hallway just ajar with the
            stairwell's lower light spilling in. Through the window:
            wet rail-yard glow, the silhouette of a station roof, a
            steam plume rising into rain.
          backdrop: >-
            A narrow station-quarter hotel room — iron bedstead, scarred
            writing table under a sash window, peeling fleur-de-lis
            wallpaper, a single desk lamp pooling warm light against
            the cold rail-yard glow in the window.
        environment:
          solo: >-
            One hard cone of warm light from the desk lamp on frame-left
            against the wet blue station-glow through the window, the
            smell of damp wool, coal smoke from below, and the brass
            polish on the radiator valve, the rhythmic clank of a
            heating pipe and the distant whistle of a late train pulling
            into the platform.
          backdrop: >-
            One desk lamp against rail-yard blue, the smell of damp wool
            and coal smoke, a distant station whistle.
      - name: Shakespeare and Company
        slug: shakespeare_and_company
        region: saint_germain
        type: bookshop
        description: >-
          Sylvia Beach's bookshop on Rue de l'Odéon. Lending library,
          meeting place, and the only place in Europe where you can
          borrow a copy of Ulysses without fear of arrest.
        visual_prompt:
          solo: >-
            Wide interior view of a Left Bank lending bookshop on a wet
            evening. Foreground: a long oak reading-table under a low
            green-shaded brass lamp, stacks of cloth-bound English-
            language novels with blank spines, a small open ledger
            face-down on a leather blotter, a chipped enamel teacup
            beside it. Middle ground: floor-to-ceiling pine shelves
            packed two-deep with books, a sliding library ladder on a
            rail, framed unsigned author photographs hung in a single
            row across the upper shelf, a worn club chair drawn close
            to a small coal-stove with smoke rising along a black
            stovepipe. Background: a glass shopfront with leaded
            mullions running with rain, the wet shine of Rue de l'Odéon
            cobbles beyond, a single gas lamp halo on the corner, an
            American student in a long coat shaking water from a hat
            in the doorway. Warm green-shaded lamplight against cold
            blue rain.
          backdrop: >-
            A Left Bank bookshop interior — pine shelves packed two-deep
            with cloth-bound books, a long reading-table under a green-
            shaded lamp, a small coal-stove in the back, leaded shopfront
            running with rain.
        environment:
          solo: >-
            Green-shaded lamp pooling warm light on the reading-table
            from frame-right against cold rain-blue from the shopfront,
            the smell of old paper, coal-stove smoke, and the lavender-
            water on a woollen coat hung at the door, the soft rasp of
            a turning page and rain steady against the leaded glass.
          backdrop: >-
            Warm green lamp against rain-blue glass, old paper and coal
            smoke, rain steady on leaded mullions.
    npcs:
      - archetype: "The Expatriate Writer"
        name: "Gil Brennan"
        location: montparnasse
        disposition: 15
      - archetype: "The Fixer"
        name: "Marcel Vautrin"
        location: montparnasse
        disposition: 10
    quests: {}
    lore:
      - The exchange rate makes Paris absurdly cheap for Americans
      - La Rotonde accepts artwork in exchange for food and drink
      - The Préfecture monitors all foreign nationals
    notes:
      - Players establish their base of operations and initial contacts
      - The first hints of larger plot threads should appear naturally
    narrative_log: []
    tropes:
      - id: the_heat_is_on
        status: dormant
        progression: 0.0
        notes: []
      - id: somebodys_talking
        status: dormant
        progression: 0.0
        notes: []
      - id: the_collection
        status: dormant
        progression: 0.0
        notes: []

  - id: early
    label: "Entanglement — The City Takes Hold"
    session_range: [5, 10]
    location: montparnasse
    time_of_day: night
    atmosphere: >-
      You know the streets now. You have a regular bar, a regular table,
      and regulars who nod when you walk in. The city has accepted you —
      which means it's started asking for things in return. Favors owed,
      debts unpaid, questions that lead to more questions. The jazz
      hasn't stopped. The rain hasn't stopped. Neither have you.
    active_stakes: >-
      The player is now embedded in Paris's social networks. Faction
      relationships deepen. At least one major plot thread — political,
      criminal, or occult — has engaged. The player has allies and
      enemies now, and the distinction isn't always clear.
    points_of_interest:
      - name: The Milieu's Territory
        slug: the_milieus_territory
        region: pigalle
        type: cabaret
        description: >-
          Pigalle at night. The neon signs, the doormen who decide
          if you enter, the back rooms where the real business happens.
          You've been invited. That's either an opportunity or a trap.
        visual_prompt:
          solo: >-
            Wide ground-level view of a Pigalle back-street at night
            outside a Corsican-run cabaret. Foreground: wet cobblestones
            puddled with red and amber reflections, a brass-bound
            cabaret door standing half-open under a low canopy, a black
            Citroën sedan parked at the kerb with its bonnet beaded
            with rain. Middle ground: a heavy doorman in a long dark
            overcoat planted on the step with arms crossed and a flat
            cap drawn low, the silhouette of a second man waiting just
            behind him inside a curtained vestibule, an unlit neon
            tube on a wall bracket gone dark against a scuffed plaster
            wall painted-over many times. Background: the narrow throat
            of an alley running off into deeper darkness, a fire-escape
            zigzag on a tenement above, a single bare bulb burning
            over a service door at the far end, washing lines slung
            high between buildings. The cabaret's interior glows red
            through the gap in the door. Hard amber from a single
            wall-sconce, hard red from inside, the rest of the frame
            in cold blue rain-shadow.
          backdrop: >-
            A wet Pigalle back-street at night, a half-open brass-bound
            cabaret door spilling red light onto cobblestones, a heavy
            doorman silhouetted on the step, a black Citroën at the
            kerb, a narrow alley running into darkness behind.
        environment:
          solo: >-
            Hard amber wall-sconce from frame-left and a hot red wash
            spilling from the doorway against the cold rain-blue of the
            cobbles, the smell of cheap cologne, anisette, and engine
            oil from the idling Citroën, a piano on the lower floor
            playing a tune somebody is paying not to recognise, and
            water running steady in a corner gutter.
          backdrop: >-
            Hot red door-spill against rain-blue cobbles, cheap cologne
            and engine oil, a piano under the street.
      - name: A Salon in the 16th
        slug: salon_in_the_16th
        region: seizieme
        type: mansion
        description: >-
          Champagne, candelabras, and conversation that's more dangerous
          than anything in Pigalle. The hostess introduces you to people
          whose names you recognize from the newspapers.
        visual_prompt:
          solo: >-
            Wide three-quarter interior view of a 16th-arrondissement
            drawing room set for an evening salon. Foreground: a long
            mahogany side-table laid with a silver champagne service —
            a slender-necked bottle in a hammered bucket of half-melted
            ice, a half-circle of crystal coupes, an ebony cigarette
            box open beside a heavy cut-glass ashtray. Middle ground:
            an oval Aubusson rug, six high-backed gilt chairs drawn
            into a loose circle around a low oak séance table inlaid
            with an abstract pattern, a tall silver candelabrum with
            seven tapers burning unevenly, a woman in a long beaded
            silk gown standing with one gloved hand on a chairback in
            profile, a man in evening dress just behind her with a
            single white orchid in his lapel. Background: heavy
            burgundy velvet drapes drawn closed across tall windows,
            three oil portraits in gilt frames receding into the
            wallpaper, a fireplace with the embers banked, a Bugatti's
            shape just visible through a gap in the drapes. Warm
            candlelight pooled in the foreground, the back of the room
            sinking into deep amber-brown shadow.
          backdrop: >-
            A 16th-arrondissement drawing room — gilt chairs around a
            low séance table, a silver candelabrum with seven burning
            tapers, heavy burgundy drapes drawn shut behind, oil
            portraits in gilt frames receding into amber shadow.
        environment:
          solo: >-
            Seven-taper candlelight from frame-centre warm and uneven
            against the deep amber-brown shadow of the back of the
            room, the smell of beeswax, cold champagne, Cuban tobacco,
            and lavender from a hostess's wrist, a slow Debussy figure
            on a piano somewhere in the next room and the soft tick
            of a marble mantel clock.
          backdrop: >-
            Uneven candlelight against velvet shadow, beeswax and cold
            champagne, slow piano in the next room.
      - name: The Préfecture
        slug: the_prefecture
        region: ile_de_la_cite
        type: office
        description: >-
          You've been asked to come in for a conversation. The
          commissaire is polite. The questions are not.
        visual_prompt:
          solo: >-
            Wide interior view of a commissaire's interview room at the
            Paris police headquarters on the island, late evening.
            Foreground: a battered oak interview table with two empty
            chairs facing each other, a single steel-shaded gooseneck
            lamp throwing a hard pool of light onto a closed buff-card
            dossier and a fountain pen laid neatly across it, a tin
            ashtray with the stubs lined up. Middle ground: a tall
            sash window with the venetian blind half-drawn casting
            stripes of harsh shadow across the bare plaster wall, a
            cast-iron radiator under the sill, a single bentwood chair
            angled away into the corner, a frame of empty paint-faded
            wall where a portrait has recently been taken down. The
            commissaire stands half-turned in the doorway in a long
            black overcoat, his face in shadow, one hand on the brass
            doorknob. Background: a glimpse through the doorway of a
            green-painted corridor with a uniformed gardien at the
            far end, a single overhead bulb in a wire cage. Hard
            gooseneck light on the dossier, blind-stripes across the
            wall, the rest of the room in deep noir shadow.
          backdrop: >-
            A Préfecture interview room — oak table under a hard
            gooseneck lamp, venetian-blind stripes laid across a bare
            plaster wall, a cast-iron radiator under a sash window,
            green-painted corridor visible through a half-open door.
        environment:
          solo: >-
            One hard gooseneck cone from frame-centre against deep
            shadow everywhere else, venetian-blind stripes laid across
            the back wall from frame-right, the smell of cold tobacco,
            ink, brass polish, and damp wool, a typewriter through the
            wall in irregular bursts and a tram bell carrying up from
            the quai outside.
          backdrop: >-
            One hard lamp against blind-stripe shadow, cold tobacco and
            ink, a typewriter through the wall.
    npcs:
      - archetype: "The Commissaire"
        name: "Commissaire Étienne Lascaux"
        location: ile_de_la_cite
        disposition: -10
      - archetype: "The Chanteuse"
        name: "Delphine Noël"
        location: montmartre
        disposition: 5
      - archetype: "The Salon Hostess"
        name: "Comtesse Hélène de Varannes"
        location: seizieme
        disposition: 10
    quests: {}
    lore:
      - The Milieu controls Pigalle through a combination of bribery and violence
      - The Salon Occultists are better connected than they appear
      - The Préfecture is stretched thin monitoring political extremists
    notes:
      - Major plot threads engage — at least one trope should reach 0.4
      - Players begin to see how factions interact and conflict
    narrative_log: []
    tropes:
      - id: the_stavisky_web
        status: active
        progression: 0.2
        notes:
          - First financial irregularities surface
      - id: the_shadow_network
        status: active
        progression: 0.2
        notes:
          - Connections between factions begin to emerge

  - id: mid
    label: "Descent — The City Reveals Itself"
    session_range: [11, 18]
    location: pigalle
    time_of_day: night
    atmosphere: >-
      The easy days are over. The people who smiled at you in the
      beginning have shown their other faces. The city's beauty has
      a cost and you're paying it. The political situation is
      deteriorating — Action Française marches through the Latin
      Quarter, the communists answer with their own demonstrations,
      and the police stand between them with insufficient conviction.
      Something is going to break.
    active_stakes: >-
      Multiple plot threads converge. The player's Heat is rising —
      law, criminal, or intelligence attention is now active. The
      occult thread, if engaged, has moved from fashionable curiosity
      to something genuinely unsettling. The player must make choices
      about which factions to support and which to oppose.
    points_of_interest:
      - name: The Catacombs
        slug: the_catacombs
        region: ile_de_la_cite
        type: ruins
        description: >-
          Beneath the city. The bones of six million Parisians and
          tunnels that nobody has fully mapped. Someone has been
          down here recently. The candles are still warm.
        visual_prompt:
          solo: >-
            Wide low-angle view down a narrow Catacomb gallery deep
            beneath the city. Foreground: a stone offering-niche set
            into the wall at chest height, a single beeswax candle
            in a tin holder burning short and steady, three earlier
            stubs melted flat beside it, the wax still glossy and
            warm, a small leather-bound notebook left open face-down
            on the niche's lip. Middle ground: the gallery walls
            stacked floor-to-ceiling with the dry ivory of densely
            packed femurs and crowning courses of skulls arranged in
            a single decorative band, the masonry between dark with
            damp, a low arched stone lintel carved with an abstract
            chiselled mark, the gallery floor of compacted pale grit
            tracked with a single recent set of bootprints leading
            inward. Background: the tunnel narrowing to a far black
            opening, a faint warm glow flickering in the deeper
            distance, the air thick enough to see. One warm candle
            cone in the foreground, the rest of the frame in deep
            cold cellar-blue and bone-ivory.
          backdrop: >-
            A narrow Catacomb gallery — walls stacked with ranked femurs
            and a single course of skulls, a low arched lintel, a
            single candle in a tin holder burning on a stone niche, the
            tunnel narrowing to deeper darkness behind.
        environment:
          solo: >-
            One warm candle from frame-left against the cold blue dark
            of the gallery, the smell of damp limestone, wet wool,
            beeswax, and the dry mineral neutrality of old bone, the
            slow plink of water from the unseen tunnel ahead and the
            faint shuffle of a footstep somewhere deeper in.
          backdrop: >-
            One candle against cellar-blue dark, beeswax and damp
            limestone, water plinking somewhere ahead.
      - name: Gare Montparnasse
        slug: gare_montparnasse
        region: gare_montparnasse
        type: train_station
        description: >-
          Spanish refugees arriving. The platform is crowded with
          people carrying everything they own. Among them, agents
          from both sides of a war that hasn't officially started.
        visual_prompt:
          solo: >-
            Wide elevated three-quarter view down a long covered station
            platform at the southern terminus, evening. Foreground: a
            black locomotive halted at the platform edge with steam
            still escaping from its valves in heavy white plumes,
            wheels and side-rods slick with rain, a soot-streaked
            number-plate on the boiler-front blurred and unreadable, a
            wet leather suitcase lashed with rope set down on the
            flagstones beside an open-laced pair of dust-grey boots.
            Middle ground: a dense column of arriving refugees moving
            slowly along the platform — families with bundled coats,
            an exhausted mother with two small children gripping her
            skirt, a thin man carrying a wood-cased violin in one
            hand and a folded blanket in the other, a porter pushing
            a trolley stacked with battered cases. A man in a long
            dark overcoat and a fedora standing motionless against a
            cast-iron pillar, watching the column. Background: the
            great glass-and-iron train-shed roof rising into vaulted
            grey shadow, its skylights run with rain, gas-electric
            lamps in clusters on tall standards, the silhouettes of
            two more men in long coats on the far platform, the
            station clock face above the gate left abstract. Cold
            blue rain-light overhead, warm sodium-yellow from the
            platform lamps in tight pools below.
          backdrop: >-
            A long covered station platform — a halted black locomotive
            still venting steam, a slow column of refugee families
            moving past cast-iron pillars beneath a vaulted glass-and-
            iron train-shed, rain on the skylights overhead.
        environment:
          solo: >-
            Cold rain-blue from the train-shed skylights above against
            warm sodium pools from platform standards below, the smell
            of coal smoke, hot brass, wet wool overcoats, and the
            faint sourness of long travel, the hiss of cooling steam
            from the locomotive and the distant blast of a guard's
            whistle from another platform.
          backdrop: >-
            Cold skylight blue against warm sodium platform pools, coal
            smoke and wet wool, the hiss of cooling steam.
      - name: The Bourse
        slug: the_bourse
        region: opera_grands_boulevards
        type: bourse
        description: >-
          The stock exchange. Rumors of a financial scandal are
          circulating. The traders are nervous. Someone is about
          to get very rich or very arrested.
        visual_prompt:
          solo: >-
            Wide three-quarter view of the trading floor at the Paris
            stock exchange, late afternoon, the corbeille after the
            close. Foreground: a wide circular oak trading rail
            polished black by a century of palms, the floor inside
            it scattered with discarded paper-slips and crumpled
            order-tickets, a single bowler hat fallen on its crown,
            a brass spittoon kicked over against the rail. Middle
            ground: knots of dark-suited brokers in long frock coats
            and stiff collars standing in tight argument, three of
            them turned toward a fourth who reads from a half-folded
            telegram with a hand visibly unsteady, a young runner
            paused mid-stride between groups, the floor itself laid
            with a worn pattern of inlaid stone. Background: the
            classical colonnade rising into the great central hall,
            tall arched windows running with rain, a vast unreadable
            chalkboard column wiped to indistinct grey smears, a
            single gilt-bronze clock high on the wall left as an
            abstract disc, the gallery balconies above receding into
            cold shadow. Cold blue-grey daylight from the high
            windows, a single warm amber wall-sconce by a pillar
            spilling against the corbeille rail.
          backdrop: >-
            A Paris exchange trading floor — circular oak corbeille rail
            polished black, scattered order-tickets across stone inlay,
            dark-suited brokers in tight knots beneath a classical
            colonnade and tall arched windows running with rain.
        environment:
          solo: >-
            Cold blue-grey from the high windows above and one warm
            amber sconce at frame-right pooling against the corbeille,
            the smell of pipe tobacco, brilliantine, wet wool, and
            the dry chalk of the smeared boards, the rising hum of
            close-pitched argument and the rain steady against the
            tall windows.
          backdrop: >-
            Cold daylight against amber pillar-sconce, pipe tobacco and
            chalk, the close hum of nervous argument.
    npcs:
      - archetype: "The White Russian"
        name: "Count Nikolai Volkov"
        location: seizieme
        disposition: 0
      - archetype: "The Antiquaire"
        name: "Augustin Morel"
        location: marais
        disposition: 5
      - archetype: "The Colonial Student"
        name: "Tahar Benali"
        location: latin_quarter
        disposition: -5
    quests: {}
    lore:
      - The catacombs connect to chambers sealed since before the Revolution
      - The Spanish situation is producing refugees and arms traffic
      - A financial scandal is about to break that reaches into the government
    notes:
      - This is the act two turn — stakes escalate dramatically
      - The player should feel the city closing in from multiple directions
    narrative_log: []
    tropes:
      - id: the_stavisky_web
        status: active
        progression: 0.6
        notes:
          - The scandal is public knowledge but nobody can prove anything
      - id: the_catacombs_below
        status: active
        progression: 0.4
        notes:
          - The underground chambers have been found
      - id: the_spanish_connection
        status: active
        progression: 0.4
        notes:
          - Arms are moving through Paris

  - id: veteran
    label: "Reckoning — The Storm Breaks"
    session_range: [19, 24]
    location: ile_de_la_cite
    time_of_day: night
    atmosphere: >-
      The city is on fire — not literally, not yet, but the metaphor
      is failing. Barricades on the Place de la Concorde. Police
      firing into crowds. The Republic teeters. In the confusion,
      everything you've been chasing — the scandal, the artifact,
      the spy network, the person you came here to find — converges
      on a single night where every faction makes their move and the
      only question is whether you're a player or a piece.
    active_stakes: >-
      The climax. All major tropes reach resolution. The player's
      choices throughout the campaign determine the outcome — who
      survives, what is revealed or buried, and whether Paris emerges
      from this night as the same city or something different. The
      occult thread, if active, reaches its culmination beneath the
      city. The political crisis plays out on the streets above.
    points_of_interest:
      - name: Place de la Concorde
        slug: place_de_la_concorde
        region: opera_grands_boulevards
        type: street
        description: >-
          The square where the guillotine stood during the Revolution.
          Now it's where the Republic might fall again. Demonstrators
          on one side, police on the other, and the National Assembly
          behind them deciding France's future.
        visual_prompt:
          solo: >-
            Wide elevated three-quarter view across the great octagonal
            square at night, the city burning orange on the river bank
            beyond. Foreground: cold wet stone paving streaked with
            running water and torn handbills, a single black bicycle
            fallen on its side, a dropped felt cap, a paving stone
            recently levered up from its bed. Middle ground: a tight
            line of mounted gardes mobiles in dark capes and steel
            helmets across the centre of the square with carbines
            angled across the saddle, three brassieres of upturned
            café chairs and a butcher's barrel lashed together as a
            low barricade twenty paces opposite, a knot of
            demonstrators in workers' caps and long coats braced
            behind it, one figure with a raised right arm. Background:
            the great obelisk rising central and unlit against a low
            ochre sky, the colonnaded facade of the Chamber of Deputies
            across the river through a haze of smoke, two of the
            square's fountain pools dark and reflecting the burning
            orange of a fire on the embankment, a column of black
            smoke leaning west. Hard amber from a single overturned
            brazier in the middle distance, cold blue from the wet
            stone everywhere else, the obelisk a black needle against
            ochre.
          backdrop: >-
            The great octagonal square at night — a central obelisk
            black against an ochre sky, a line of mounted gardes mobiles
            opposite a low improvised barricade of café chairs, dark
            fountain pools reflecting fire on the embankment beyond.
        environment:
          solo: >-
            Cold blue from wet paving across the foreground against the
            hard amber of a single overturned brazier mid-frame and a
            distant orange firelight on the embankment, the smell of
            wood smoke, kerosene, wet leather, and the iron of horse
            sweat, the muffled stamp of cavalry on stone and the rise
            and fall of a chanted slogan carried on a wind off the
            Seine.
          backdrop: >-
            Cold paving against fire-amber and distant orange, wood
            smoke and horse sweat, a chant on the river wind.
      - name: Beneath the Palais Garnier
        slug: beneath_the_palais_garnier
        region: opera_grands_boulevards
        type: ruins
        description: >-
          Five levels below the opera house. The underground lake.
          The chambers that don't appear on any map. If the occult
          thread is active, this is where it ends.
        visual_prompt:
          solo: >-
            Wide three-quarter view of a vast vaulted stone chamber on
            the lowest level beneath the opera house, the underground
            lake stretching back into darkness. Foreground: a stone
            landing-quay at the water's edge, three thick beeswax
            candles burning low on a hewn altar-block of pale
            limestone, a chalk circle drawn on the stone laid with an
            abstract sigil, a single white silk glove dropped at the
            altar's foot, the still black water reflecting candle
            flames in long shivering streaks. Middle ground: a low
            wooden punt drifted half-out from the quay on a slack
            mooring rope, the water otherwise mirror-flat, a second
            altar-block further out on a small stone islet half-seen
            in the dark, four robed figures seated motionless on the
            far quay in a half-circle with hoods lowered, their
            backs to the camera. Background: the ribbed vault rising
            into deep shadow overhead, iron mooring rings hammered
            into the wet limestone walls at regular intervals, a
            distant arched opening to a deeper gallery showing only
            black, the boundary of the chamber's light dying inside
            twenty paces. Three warm candle pools against vast
            cellar-cold blue and black water.
          backdrop: >-
            The vaulted lowest chamber beneath the opera house — a
            stone landing-quay at the edge of a black mirror-flat
            underground lake, three beeswax candles burning on an
            altar-block of pale limestone, ribbed vaulting receding
            into darkness above.
        environment:
          solo: >-
            Three warm candle cones from the altar at frame-centre
            against vast cellar-cold blue and the black mirror of the
            water, the smell of wet limestone, beeswax, mildew, and
            something faintly metallic on the air, the slow dripping
            of seepage from the vault overhead and the muffled
            distant rumble of the opera house above.
          backdrop: >-
            Candle cones against cellar-blue water-mirror, wet
            limestone and beeswax, slow seepage overhead.
      - name: A Bridge Over the Seine
        slug: bridge_over_the_seine
        region: ile_de_la_cite
        type: bridge
        description: >-
          Midnight. The river is black. The city is burning orange
          on both banks. Someone is waiting for you in the middle
          of the bridge with an offer, a threat, or a gun. Probably
          all three.
        visual_prompt:
          solo: >-
            Wide low-angle three-quarter view down the deck of an old
            stone arched bridge over the river at midnight. Foreground:
            wet flagstones laid in a herringbone pattern, the metalwork
            of a low cast-iron rail in close detail with its rivets
            picked out, a single dark felt fedora set crown-down on
            the parapet as if left there on purpose. Middle ground: a
            solitary figure standing dead centre of the bridge in a
            long black overcoat with the collar turned up, hands in
            pockets, face entirely in shadow under a low brim, planted
            and waiting, a wisp of cigarette smoke trailing from one
            corner of the mouth. The bridge's iron gas-lanterns on
            twisted posts at intervals along the parapet, the nearest
            one lit and the next one out, the one after that lit
            again. Background: the river running black and broad in
            both directions, the silhouettes of the city's spires and
            chimneys on both banks burning low orange against a
            charcoal sky, a column of smoke from one bank, the dome
            of an institutional building backlit by a fire below it.
            Hard amber from the nearest gas lantern at frame-right,
            cold blue from the river below, distant orange firelight
            on the horizon.
          backdrop: >-
            An old stone arched bridge at midnight — herringbone
            flagstones, a low cast-iron rail with iron gas-lanterns at
            intervals along the parapet, the river running black below,
            the city silhouettes on both banks lit low orange against
            charcoal sky.
        environment:
          solo: >-
            One warm gas-lantern amber at frame-right against the cold
            blue of the river and the distant orange of fires on the
            far bank, the smell of cold river water, wet stone, coal
            smoke drifting across from the embankment, and the
            cigarette smoke of the waiting figure, the slow lap of
            water against the bridge piers and the muffled crack of
            something distant on the far shore.
          backdrop: >-
            Gas-lantern amber against river-cold blue and distant fire-
            orange, cold water and coal smoke, the slow lap below.
