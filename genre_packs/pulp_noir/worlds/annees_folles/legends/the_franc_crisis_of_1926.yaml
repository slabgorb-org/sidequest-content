name: The Franc Crisis of 1926
era: 1924-1926
summary: The French franc collapsed, falling from 5 to 50 against the dollar. Savings
  evaporated. The middle class panicked. American expatriates suddenly found they
  could live like kings on journalist salaries. Raymond Poincaré stabilized the currency,
  but the damage was done — nobody trusted the franc anymore, and the class resentment
  between those who lost everything and those who profited from the crash became a
  permanent feature of Parisian politics.
cultural_impact: The crisis drew a flood of Americans to Paris — the exchange rate
  made the city irresistible. It also radicalized the French working class, who watched
  their wages buy less every week while foreign tourists drank champagne. The seeds
  of the Popular Front were planted in the bitterness of 1926.
affected_cultures:
- Continental European
- Anglo-American
faction_grudges:
- from: The Popular Front
  to: The Expatriate Circle
  reason: Working-class Parisians resent the Americans who treat their poverty as
    a lifestyle accessory.
monuments:
- The Bourse (stock exchange) near the Grands Boulevards
terrain_scars:
- type: economic
  region: les_halles
  name: The Empty Market Stalls
  description: During the worst of the crisis, vendors couldn't afford to stock their
    stalls. The gaps in Les Halles told you more about the economy than any newspaper.
