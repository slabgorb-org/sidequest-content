name: The Phantom of the Opéra
era: 1910 (echoes into the 1920s)
summary: Gaston Leroux published his novel in 1910, inspired by real events at the
  Palais Garnier — the chandelier that fell during a performance in 1896, the underground
  lake beneath the building, the labyrinthine cellars that nobody has fully mapped.
  By the 1920s, the story has become part of the building's mythology. Stagehands
  swear they hear things in the sub-basements. The management keeps certain doors
  locked and doesn't explain why.
cultural_impact: The Palais Garnier's underground spaces became a source of endless
  rumor and speculation. The real underground lake exists. The cellars really are
  labyrinthine. What else might be down there? The Salon Occultists have theories.
  The management has no comment.
affected_cultures:
- Continental European
faction_grudges: []
monuments:
- The Palais Garnier opera house
- The underground lake beneath the building
terrain_scars:
- type: architectural
  region: opera_grands_boulevards
  name: The Sub-Basements of the Palais Garnier
  description: Five levels below the stage. The lowest contains a reservoir of water
    that was never fully drained. Nobody goes down there alone. The stories about
    what lives in the dark are probably just stories.
