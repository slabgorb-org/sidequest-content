name: The Catacombs
era: 1786-present
summary: Beneath Paris lie the ossuary tunnels — the bones of six million Parisians
  transferred from overflowing cemeteries in the 18th century. The official tourist
  route covers a fraction of the network. The rest — hundreds of kilometers of tunnels,
  chambers, and passages — is unmapped, illegal to enter, and regularly entered anyway.
  Urban explorers, smugglers, and people who don't want to be found use the catacombs.
  During the occupation, both the Resistance and the Germans will establish headquarters
  down there. In the 1920s, the tunnels are just dark, quiet, and full of the dead.
cultural_impact: The catacombs are Paris's unconscious — everything the city wants
  to forget, buried beneath its feet. The Salon Occultists are fascinated by them.
  The criminals use them. The police avoid them. There are rumors of chambers that
  don't appear on any map, sealed off for reasons nobody recorded.
affected_cultures:
- Continental European
faction_grudges: []
monuments:
