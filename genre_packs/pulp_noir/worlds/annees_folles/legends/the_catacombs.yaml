terrain_scars:
- type: subterranean
  region: montparnasse
  name: The Unofficial Entrances
  description: Manholes, basement passages, forgotten stairways. The cataphiles know
    where they are. So do certain members of the Milieu. Getting in is easy. Getting
    out requires knowing the way.
