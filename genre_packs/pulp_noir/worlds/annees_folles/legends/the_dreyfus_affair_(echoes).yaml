name: The Dreyfus Affair (Echoes)
era: 1894-1906 (reverberations through the 1920s-30s)
summary: Captain Alfred Dreyfus, a Jewish officer, was falsely convicted of treason
  in 1894. The affair split France in two — the Dreyfusards who fought for justice,
  and the anti-Dreyfusards who preferred a convenient scapegoat to an inconvenient
  truth. Dreyfus was eventually exonerated, but the anti-Semitism the affair revealed
  never went away. It went underground, into Action Française, into the whispered
  complaints about Jewish bankers, into the casual cruelty that the Jewish community
  of the Marais navigates every day.
cultural_impact: The affair created a permanent fault line in French politics between
  republican universalism and ethnic nationalism. Action Française was born from the
  anti-Dreyfusard movement. The Jewish community learned that assimilation was no
  protection. The echoes of the affair poison every political crisis that involves
  questions of loyalty, foreignness, or betrayal.
affected_cultures:
- Continental European
- Eastern European
faction_grudges:
- from: Action Française
  to: The Expatriate Circle
  reason: The far right views all foreigners — and especially Jews — as threats to
    French national identity.
monuments:
- The statue of Dreyfus in the Jardin des Tuileries
terrain_scars:
- type: social
  region: marais
  name: Rue des Rosiers
  description: The heart of Jewish Paris. The shop windows display Hebrew lettering.
    The synagogues fill on Shabbat. And every few months, someone paints something
    ugly on a wall that gets cleaned off before morning.
