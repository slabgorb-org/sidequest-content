name: The Armistice
era: November 11, 1918
summary: The Great War ended in a railway carriage in Compiègne. France won, but the
  victory felt like a funeral. A generation of young men were dead or broken. The
  survivors came home to a country that didn't know what to do with them. The celebrations
  lasted a week. The grief lasted a decade.
cultural_impact: Every family in Paris lost someone. The war memorials went up on
  every corner and in every village. November 11th became sacred. The veterans drink
  in certain bars and don't talk about what they saw. The phrase "plus jamais" — never
  again — became a prayer that nobody believed.
affected_cultures:
- Continental European
- Anglo-American
faction_grudges:
- from: Action Française
  to: The Popular Front
  reason: The right blames the left for undermining national unity. The left blames
    the right for starting the war. Both are partially correct.
- from: Foreign Intelligence Services
  to: The Préfecture de Police
  reason: The intelligence services of defeated nations operate in Paris with impunity
    while the French police struggle to monitor them.
monuments:
- The Tomb of the Unknown Soldier beneath the Arc de Triomphe
- War memorials in every arrondissement
- The railway carriage at Compiègne, preserved as a museum
terrain_scars:
- type: memorial
  region: opera_grands_boulevards
  name: The Arc de Triomphe Eternal Flame
  description: The flame that burns day and night for the unknown dead. Veterans gather
    here on November 11th. Wreaths pile up in the rain.
