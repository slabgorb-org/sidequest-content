# Authoring rule: positive_suffix is STYLE/MEDIUM/PALETTE vocabulary only —
# no concrete setting nouns (no rain, streets, rooftops, Seine, Paris, etc.).
# Concrete settings belong in the layer that wants them: a POI's
# visual_prompt.solo/backdrop describes its own scene, and a portrait's
# element_visual places a character outdoors only when the shot intends it.
# A world suffix bleeds into EVERY render, so a setting noun here puts a
# rainy street behind a head-and-shoulders portrait whether the shot wants
# one or not. See PROMPTING_Z_IMAGE.md, "World style suffix bleeds concrete
# nouns into every portrait".

positive_suffix: >-
  Noir illustration, ink-wash and brush on paper, visible brushwork and
  ink texture. High-contrast chiaroscuro with a single strong key light,
  heavy shadows pooling deep black with hard edges, figures carved from
  darkness. Limited palette of deep black, warm amber, and cold blue with
  occasional teal — amber and teal held as the emotional accents, saved
  not spent. Pulp-magazine-cover quality, cinematic and atmospheric. No
  text, no caption, no title, no writing, no signage, no label, no
  watermark, no border, no frame.
