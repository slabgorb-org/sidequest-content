# Les Années Folles — world bestiary
#
# World-tier bestiary for the pulp_noir pack, Paris 1926. In a 1920s
# detective story the threats are overwhelmingly human — the Milieu enforcer,
# the Action Française brawler, the bought flic — and those are NPCs, not
# bestiary stat blocks. This roster is deliberately SPARSE: only the mundane
# animals and beasts a mystery in Paris might actually put in front of the
# party. No supernatural monsters; the world's occult is séance-table
# fashion (world.yaml occult 0.3), not creatures in the streets.
#
# Stat lines follow the same generic ladder as the heavy_metal Barsoom
# bestiary template: level == HD, ascending AC, morale on the 2d12 ladder,
# physical save 15 - floor(level/2). Mundane animals are level 1, low hp.
entries:
  - id: cellar_rat
    name: Cellar Rat
    level: 1
    hp: 3
    armor_class: 11
    attack_bonus: 0
    damage: "1d3"
    move: "30 ft."
    morale: 5
    skill: 0
    save: 15
    role: vermin of the cellars, sewers, and Métro tunnels
    tags: [beast, vermin]
    abilities:
      - "Swarms — alone it flees; cornered in numbers in the dark it will bite a man bloody"
    description: >-
      A grey-brown rat fattened on the refuse of a great city, denning in
      coal cellars, sewer mains, and the older Métro tunnels. One is nothing;
      a boiling pack of them between you and the only door is a different
      matter entirely.
  - id: guard_dog
    name: Guard Dog
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d6"
    move: "40 ft."
    morale: 8
    skill: 1
    save: 15
    role: warehouse and townhouse watchdog
    tags: [beast, animal]
    abilities:
      - "Raises the alarm — barking brings the concierge, the night-watchman, or worse before the lock is even picked"
    description: >-
      A chained mastiff or shepherd kept by a Right Bank warehouse, a
      Pigalle club, or a nervous antiquaire behind his shutters. The bite is
      bad; the noise is worse, because in this city the thing that answers
      the barking carries a pistol.
  - id: apache_fighting_dog
    name: Apache Fighting Dog
    level: 2
    hp: 9
    armor_class: 12
    attack_bonus: 3
    damage: "1d6+1"
    move: "40 ft."
    morale: 9
    skill: 1
    save: 14
    role: pit-bred attack dog of the street gangs
    tags: [beast, animal]
    abilities:
      - "Locks its jaws — once it has hold it will not let go until beaten off or killed"
    description: >-
      Bred and starved mean in the courtyards of Belleville and the
      fortifs, set on rivals or debtors by the apache street toughs who
      keep it. Scarred, silent until it strikes, and trained to go for the
      arm and hold.
  - id: cart_horse
    name: Cart Horse
    level: 2
    hp: 11
    armor_class: 11
    attack_bonus: 2
    damage: "1d6"
    move: "60 ft."
    morale: 6
    skill: 0
    save: 14
    role: dray horse of the markets and delivery yards
    tags: [beast, animal, mount]
    abilities:
      - "Bolts — a backfiring auto, a gunshot, or a fire sends it stampeding through the crowd, cart and all"
    description: >-
      A heavy Percheron or Boulonnais still hauling brewers' drays, coal
      carts, and Les Halles produce wagons through streets the motorcar
      hasn't fully taken yet. Placid in harness, lethal when something
      spooks it down a narrow lane full of people.
  - id: menagerie_panther
    name: Menagerie Panther
    level: 3
    hp: 14
    armor_class: 13
    attack_bonus: 4
    damage: "1d8+1"
    move: "50 ft."
    morale: 7
    skill: 2
    save: 14
    role: escaped or smuggled exotic cat
    tags: [beast, animal, exotic]
    abilities:
      - "Pounce — drops from a height or springs from cover for a second attack the round it closes"
    description: >-
      A black leopard from the Ménagerie du Jardin des Plantes, a winter
      circus cage, or some rich eccentric's private collection in the 16th —
      loose now in a dark courtyard or a shuttered house, more frightened
      than vicious, but cornered all the same.
