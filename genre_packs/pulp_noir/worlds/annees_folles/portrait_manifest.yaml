# Character portraits for Les Années Folles
# Visual descriptions for Flux portrait generation
# 1930s Paris pulp noir — ink wash aesthetic, chiaroscuro lighting

characters:
  # ── MONTPARNASSE ───────────────────────────────────────────────

  - name: Marcel Devereaux
    role: The Fixer
    type: npc_major
    appearance: >-
      A compact man in his forties with a thin mustache trimmed to
      surgical precision and dark eyes that are always calculating.
      Olive skin, slicked-back hair, a face built for smiling that
      never quite reaches genuine. Wears a well-cut but not flashy
      suit — charcoal, double-breasted, with a silk pocket square
      that changes color depending on which café he's working. Moves
      through a room like smoke, appearing at your elbow without
      having visibly crossed the floor.
    culture_aesthetic: >-
      Parisian street elegance — not wealthy but impeccable. The suit
      is slightly too good for the neighborhoods he frequents. Art deco
      cufflinks, polished shoes, the practiced ease of a man who belongs
      everywhere because he belongs nowhere.
    element_visual: >-
      A worn leather address book visible in his breast pocket. Ink
      stains on his right index finger. A business card with no name,
      just a telephone number. Cigarette perpetually between his fingers,
      unlit — a prop, not a habit.

  - name: Jack Morrow
    role: The Expatriate Writer
    type: npc_major
    appearance: >-
      An American in his early thirties with sandy hair that hasn't
      seen a barber in weeks and bloodshot blue eyes that still catch
      everything worth writing about. Lean, slightly gaunt from choosing
      whiskey over dinner too many nights in a row. Stubble that
      suggests intention rather than neglect. Wears a rumpled linen
      shirt with the sleeves rolled to the forearms, a loose tie pulled
      down from the collar, and a tweed jacket with leather elbow
      patches worn through to the cloth.
    culture_aesthetic: >-
      American expatriate bohemian — Left Bank shabby-genteel. Ivy
      League education visible in the posture, Greenwich Village rebellion
      visible in the wrinkled clothes. Everything he wears was good
      quality two years ago.
    element_visual: >-
      A half-finished manuscript sticking out of a battered leather
      satchel. A whiskey glass always within reach. Pencil tucked behind
      the ear. A creased letter from a New York publisher in his jacket
      pocket. Cigarette smoke curling around his head like a halo that
      gave up.

  - name: Josephine "Josie" Delacroix
    role: The Chanteuse
    type: npc_major
    appearance: >-
      A striking Black American woman in her late twenties with close-
      cropped hair marcelled into elegant waves, high cheekbones that
      catch the stage light like sculpture, and dark eyes that hold
      the room from the first note to the last. Tall and lean with the
      posture of a dancer. Wears a floor-length beaded gown that
      catches light like a constellation — midnight blue, slit to the
      thigh. Long satin gloves to the elbow. A voice like smoke and
      honey that carries over the trumpet section without effort.
    culture_aesthetic: >-
      Harlem Renaissance meets Montmartre glamour — the freedom and
      fame that Paris offered Black American artists. Art deco jewelry,
      Parisian couture, a deliberate magnificence that is both armor
      and invitation.
    element_visual: >-
      A single spotlight carving her from the darkness of the jazz
      club stage. Beaded dress throwing tiny points of light across
      the ceiling. A cigarette holder in ebony and silver. A gardenia
      pinned behind her left ear. The glint of a dressing room key
      on a silk ribbon at her wrist.

  # ── ÎLE DE LA CITÉ ────────────────────────────────────────────

  - name: Commissaire Renard
    role: The Commissaire
    type: npc_major
    appearance: >-
      A heavyset man in his fifties with iron-grey hair, a broad face
      scored with deep lines, and eyes like wet slate — flat, grey,
      missing nothing. A nose that has been broken at least once and
      set badly. Heavy dark mustache going grey at the edges. Wears a
      dark wool overcoat that has seen ten winters, a fedora pushed
      back on his head, and a suit that was never fashionable but is
      always clean. Hands like a boxer's — thick, scarred across the
      knuckles. Stands with his weight forward, as if permanently
      about to lean across a desk at you.
    culture_aesthetic: >-
      French institutional authority — the Préfecture de Police, not
      the boulevard. Functional clothing, no vanity. The overcoat and
      fedora are uniform, not fashion. Everything about him says civil
      servant who has outlasted six ministers.
    element_visual: >-
      Police credentials in a worn leather wallet. A pack of Gauloises
      in the breast pocket. A notebook filled with shorthand nobody else
      can read. Venetian blind shadows falling across his face as he
      sits behind the desk. A single desk lamp casting harsh upward
      light.

  # ── PIGALLE ────────────────────────────────────────────────────

  - name: Carlo Saviano
    role: The Don
    type: npc_major
    appearance: >-
      A Corsican man in his late fifties with silver hair swept back
      from a widow's peak, a face like carved mahogany — handsome once,
      now imposing. Dark eyes that radiate warmth until they don't.
      Lean rather than large, with the stillness of a man who hasn't
      needed to raise his hand in twenty years because other hands
      raise for him. Wears a bespoke black suit, white shirt with
      French cuffs, and a burgundy silk tie. A gold signet ring on the
      left hand. No other jewelry. Everything about him is understated
      except the quiet, absolute authority.
    culture_aesthetic: >-
      Corsican-Parisian crime aristocracy — old-world Mediterranean
      manners transplanted to Pigalle. Tailored Italian fabric, French
      cut. The refinement of a man who controls the ugliest streets
      in Paris without getting any of it on his cuffs.
    element_visual: >-
      Seated in a leather booth at the back of a club, face half in
      shadow. A glass of Armagnac untouched on the table. The gold
      signet ring catching candlelight. Two men standing behind him
      who are never introduced. Smoke from someone else's cigarette
      drifting past his face.

  - name: Big Léon Marchetti
    role: The Muscle
    type: npc_supporting
    appearance: >-
      A massive man in his thirties with a shaved head, a broken nose
      flattened across his face, and small dark eyes set deep under a
      heavy brow. Shoulders like a stevedore. Hands that look like they
      were designed for one thing and it wasn't shaking. A scar running
      from his left ear to the corner of his mouth, pulling his face
      into a permanent half-smile that isn't one. Wears a dark suit
      that strains across the shoulders, no tie, collar open.
    culture_aesthetic: >-
      Pigalle working muscle — Marseille docks transplanted to Paris
      nightlife. The suit is expensive because the boss requires it.
      Everything underneath is blunt force.
    element_visual: >-
      Brass knuckles visible as a bulge in the right jacket pocket.
      A shoulder holster glimpsed when the jacket shifts. Standing in
      a doorway with arms crossed, blocking the light. A flat cap
      pulled low when working the streets.

  # ── SEIZIÈME ───────────────────────────────────────────────────

  - name: Comtesse Madeleine de Vaurien
    role: The Salon Hostess
    type: npc_major
    appearance: >-
      A woman in her early forties with porcelain skin, auburn hair
      pinned in a sculptural chignon, and green eyes that appraise
      everyone who enters her drawing room like an artwork she might
      or might not acquire. Beautiful in a severe, architectural way —
      cheekbones, jawline, everything precisely placed. Wears a black
      Schiaparelli evening gown with a single strand of pearls. Moves
      through her own parties like a curator through a gallery — never
      hurrying, always watching, touching your arm exactly when she
      needs your attention.
    culture_aesthetic: >-
      Parisian haute bourgeoisie — sixteenth arrondissement old money
      with a taste for the avant-garde. Art deco interiors, surrealist
      art on the walls, champagne in crystal coupes. The occult as
      salon entertainment, treated with an irony that conceals genuine
      knowledge.
    element_visual: >-
      Champagne coupe in one hand, the other resting on a marble
      mantelpiece. Candlelight from a crystal chandelier. A cameo
      brooch at her throat that looks older than the Revolution.
      Behind her, a bookshelf with titles in Latin, Greek, and
      something older. A Ouija board visible on a side table,
      positioned like a conversation piece.

  - name: Count Dmitri Volkonsky
    role: The White Russian
    type: npc_major
    appearance: >-
      A gaunt man in his late forties with sharp Slavic features —
      high cheekbones, deep-set grey eyes, a long aristocratic nose.
      Hair still dark but receding at the temples, always immaculately
      combed. Clean-shaven, with a jawline that could cut paper. Tall
      and thin, carrying himself with the rigid posture of a former
      cavalry officer even while wearing a taxi driver's cap. His
      hands are elegant — pianist's fingers — but the calluses are
      from a steering wheel now.
    culture_aesthetic: >-
      Russian émigré nobility in exile — Romanov-era bearing in a
      République setting. The suit is twenty years old, brushed and
      pressed daily. A pocket watch that belonged to his grandfather.
      Imperial dignity maintained on a taxi driver's salary.
    element_visual: >-
      A taxi driver's cap held in one hand, a glass of vodka in the
      other. The ghost of a military posture beneath civilian clothes.
      A faded photograph visible in a worn leather wallet. Eyes that
      look past you toward St. Petersburg. Rain on the window of a
      sixteenth-arrondissement apartment that isn't his.

  # ── MARAIS ─────────────────────────────────────────────────────

  - name: Ephraim Goldschmidt
    role: The Antiquaire
    type: npc_supporting
    appearance: >-
      A slight man in his sixties with a neatly trimmed white beard,
      wire-rimmed spectacles perched on a prominent nose, and pale
      blue eyes magnified by thick lenses into something owlish and
      unsettling. Stooped from decades of leaning over manuscripts.
      Wears a brown wool waistcoat over a white shirt with the sleeves
      rolled, a jeweler's loupe on a chain around his neck. His shop
      smells of old paper, brass polish, and secrets.
    culture_aesthetic: >-
      Jewish Marais intellectual — a scholar-merchant in the tradition
      of the Quai Voltaire dealers. Cluttered shop filled with objects
      from a dozen civilizations, each one catalogued in his memory
      if not on paper.
    element_visual: >-
      A magnifying loupe held to one eye, the other squinting shut.
      Leather-bound ledgers in three languages stacked on a desk.
      Something wrapped in oilcloth that he keeps behind the counter
      and does not show to everyone. Dust motes in a shaft of window
      light. An object on the desk that shouldn't exist.

  # ── LATIN QUARTER ──────────────────────────────────────────────

  - name: Nguyen Van Thien
    role: The Colonial Student
    type: npc_supporting
    appearance: >-
      A young Vietnamese man in his early twenties with sharp,
      intelligent features, close-cropped black hair, and dark eyes
      that burn with a controlled intensity. Thin — the leanness of
      a student budget, not of choice. Wears a threadbare but clean
      dark suit, a white shirt buttoned to the collar without a tie,
      and round wire spectacles. Carries himself with a quiet
      precision that makes him look older than he is. His French is
      flawless. His patience is not.
    culture_aesthetic: >-
      Colonial intellectual in the metropole — Sorbonne student by
      day, anti-colonial organizer by night. Western dress adopted
      strategically, not aspirationally. The wire spectacles and
      buttoned collar project seriousness. Everything about him says
      discipline.
    element_visual: >-
      A stack of banned political pamphlets glimpsed inside a worn
      book bag. Ink-stained fingers from a hand-cranked printing
      press. A student identity card from the Sorbonne. A letter in
      Vietnamese script folded into a French philosophy textbook.
      Rain on the cobblestones of the Rue des Écoles.

  - name: Professeur Henri Aubert
    role: The Professor
    type: npc_supporting
    appearance: >-
      A disheveled man in his fifties with wild grey hair that defies
      any comb, a deeply lined face tanned from years of fieldwork in
      North Africa and the Levant, and bright, excitable brown eyes
      behind smudged pince-nez glasses. Wears a tweed suit that has
      survived three archaeological digs, chalk dust on the lapels,
      a bow tie perpetually askew. His leather satchel is stuffed to
      bursting with papers, rubbings, and at least one object that
      should be in a museum.
    culture_aesthetic: >-
      French academic — Sorbonne archaeology faculty, more comfortable
      in a Mesopotamian tomb than a Parisian salon. The absent-minded
      professor incarnate, except the things he's absent-minded about
      are social niceties, not ancient Sumerian.
    element_visual: >-
      Chalk dust on his fingers and lapels. A leather satchel bulging
      with rolled papers. Pince-nez glasses reflecting lamplight. A
      rubbing on translucent paper spread across a café table, weighted
      down with coffee cups. The excited, slightly manic expression of
      a man who has found something that will either make his career
      or end his life.

  # ── GARE MONTPARNASSE ──────────────────────────────────────────

  - name: Teresa Montoya
    role: The War Veteran
    type: npc_supporting
    appearance: >-
      A Spanish woman in her mid-thirties with dark hair pulled back
      in a severe bun, olive skin weathered beyond her years, and
      black eyes that have the flat, distant look of someone who has
      seen the inside of a war. A thin scar across her left cheekbone.
      Lean and wiry, moves with the economical precision of someone
      trained to fight. Wears a man's leather jacket over a dark
      blouse, trousers instead of a skirt, and boots meant for
      walking long distances. Arrived on the train from Barcelona
      three weeks ago with one bag and no intention of going back.
    culture_aesthetic: >-
      Spanish Republican exile — the civil war hasn't officially
      started but the killing has. Practical clothing with no
      concession to Parisian fashion. Military surplus worn as
      civilian dress. The leather jacket is a political statement
      as much as a garment.
    element_visual: >-
      A worn leather jacket with a Republican pin on the collar. A
      flask of something strong in the inside pocket. Hands that are
      steady when they shouldn't be. A train ticket stub from
      Barcelona tucked into a passport with too-fresh stamps. Rain
      on the platform at Gare Montparnasse.
