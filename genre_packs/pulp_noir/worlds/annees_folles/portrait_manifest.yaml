characters:

  - name: Marcel Devereaux
    role: The Fixer
    type: npc_major
    appearance: >-
      A compact man in his forties with a thin mustache trimmed to
      surgical precision and dark eyes that are always calculating.
      Olive skin, slicked-back hair, a face built for smiling that
      never quite reaches genuine. Wears a well-cut but not flashy
      suit — charcoal, double-breasted, with a silk pocket square
      that changes color depending on which café he's working. Moves
      through a room like smoke, appearing at your elbow without
      having visibly crossed the floor.
    culture_aesthetic: >-
      Parisian street elegance — not wealthy but impeccable. The suit
      is slightly too good for the neighborhoods he frequents. Art deco
      cufflinks, polished shoes, the practiced ease of a man who belongs
      everywhere because he belongs nowhere.
    element_visual: >-
      A worn leather address book visible in his breast pocket. Ink
      stains on his right index finger. A business card with no name,
      just a telephone number. Cigarette perpetually between his fingers,
      unlit — a prop, not a habit.

  - name: Jack Morrow
    role: The Expatriate Writer
    type: npc_major
    appearance: >-
      An American man in his early thirties with overgrown sandy hair
      and tired blue eyes with dark circles beneath. Lean and slightly
      gaunt, several days of stubble. Wears a rumpled linen shirt with
      the sleeves rolled to the forearms, a loose tie pulled down from
      the open collar, and a tweed jacket with leather elbow patches
      worn through to the cloth.
    culture_aesthetic: >-
      American expatriate bohemian — Left Bank shabby-genteel. Ivy
      League education visible in the posture, Greenwich Village rebellion
      visible in the wrinkled clothes. Everything he wears was good
      quality two years ago.
    element_visual: >-
      A half-finished manuscript sticking out of a battered leather
      satchel. A whiskey glass always within reach. Pencil tucked behind
      the ear. A creased letter from a New York publisher in his jacket
      pocket. Cigarette smoke curling around his head like a halo that
      gave up.

  - name: Josephine "Josie" Delacroix
    role: The Chanteuse
    type: npc_major
    appearance: >-
      A striking Black American woman in her late twenties with close-
      cropped hair marcelled into elegant waves, high cheekbones that
      catch the stage light like sculpture, and dark eyes that hold
      the room from the first note to the last. Tall and lean with the
      posture of a dancer. Wears a floor-length beaded gown that
      catches light like a constellation — midnight blue, slit to the
      thigh. Long satin gloves to the elbow. A voice like smoke and
      honey that carries over the trumpet section without effort.
    culture_aesthetic: >-
      Harlem Renaissance meets Montmartre glamour — the freedom and
      fame that Paris offered Black American artists. Art deco jewelry,
      Parisian couture, a deliberate magnificence that is both armor
      and invitation.
    element_visual: >-
      A single spotlight carving her from the darkness of the jazz
      club stage. Beaded dress throwing tiny points of light across
      the ceiling. A cigarette holder in ebony and silver. A gardenia
      pinned behind her left ear. The glint of a dressing room key
      on a silk ribbon at her wrist.


  - name: Commissaire Renard
    role: The Commissaire
    type: npc_major
    appearance: >-
      A heavyset man in his fifties with iron-grey hair, a broad face
      scored with deep lines, and eyes like wet slate — flat, grey,
      missing nothing. A nose that has been broken at least once and
      set badly. Heavy dark mustache going grey at the edges. Wears a
      dark wool overcoat that has seen ten winters, a fedora pushed
      back on his head, and a suit that was never fashionable but is
      always clean. Hands like a boxer's — thick, scarred across the
      knuckles. Stands with his weight forward, as if permanently
      about to lean across a desk at you.
    culture_aesthetic: >-
      French institutional authority — the Préfecture de Police, not
      the boulevard. Functional clothing, no vanity. The overcoat and
      fedora are uniform, not fashion. Everything about him says civil
      servant who has outlasted six ministers.
    element_visual: >-
      Police credentials in a worn leather wallet. A pack of Gauloises
      in the breast pocket. A notebook filled with shorthand nobody else
      can read. Venetian blind shadows falling across his face as he
      sits behind the desk. A single desk lamp casting harsh upward
      light.


  - name: Carlo Saviano
    role: The Don
    type: npc_major
    appearance: >-
      A Corsican man in his late fifties with silver hair swept back
      from a widow's peak, a face like carved mahogany — handsome once,
      now imposing. Dark eyes that radiate warmth until they don't.
      Lean rather than large, with the stillness of a man who hasn't
      needed to raise his hand in twenty years because other hands
      raise for him. Wears a bespoke black suit, white shirt with
      French cuffs, and a burgundy silk tie. A gold signet ring on the
      left hand. No other jewelry. Everything about him is understated
      except the quiet, absolute authority.
    culture_aesthetic: >-
      Corsican-Parisian crime aristocracy — old-world Mediterranean
      manners transplanted to Pigalle. Tailored Italian fabric, French
      cut. The refinement of a man who controls the ugliest streets
      in Paris without getting any of it on his cuffs.
    element_visual: >-
      Seated in a leather booth at the back of a club, face half in
      shadow. A glass of Armagnac untouched on the table. The gold
      signet ring catching candlelight. Two men standing behind him
      who are never introduced. Smoke from someone else's cigarette
      drifting past his face.

  - name: Big Léon Marchetti
    role: The Muscle
    type: npc_supporting
    appearance: >-
      A massive man in his thirties with a shaved head, a broken nose
      flattened across his face, deep-set dark eyes under a heavy brow,
      and broad heavy shoulders. A scar runs from his left ear to the
      corner of his mouth. Wears a dark suit that strains across the
      shoulders, no tie, collar open.
    culture_aesthetic: >-
      Pigalle working muscle — Marseille docks transplanted to Paris
      nightlife. The suit is expensive because the boss requires it.
      Everything underneath is blunt force.
    element_visual: >-
      Brass knuckles visible as a bulge in the right jacket pocket.
      A shoulder holster glimpsed when the jacket shifts. Standing in
      a doorway with arms crossed, blocking the light. A flat cap
      pulled low when working the streets.


  - name: Comtesse Madeleine de Vaurien
    role: The Salon Hostess
    type: npc_major
    appearance: >-
      A woman in her early forties with porcelain skin, auburn hair
      pinned in a sculptural chignon, and green eyes that appraise
      everyone who enters her drawing room like an artwork she might
      or might not acquire. Beautiful in a severe, architectural way —
      cheekbones, jawline, everything precisely placed. Wears a black
      Schiaparelli evening gown with a single strand of pearls. Moves
      through her own parties like a curator through a gallery — never
      hurrying, always watching, touching your arm exactly when she
      needs your attention.
    culture_aesthetic: >-
      Parisian haute bourgeoisie — sixteenth arrondissement old money
      with a taste for the avant-garde. Art deco interiors, surrealist
      art on the walls, champagne in crystal coupes. The occult as
      salon entertainment, treated with an irony that conceals genuine
      knowledge.
    element_visual: >-
      Champagne coupe in one hand, the other resting on a marble
      mantelpiece. Candlelight from a crystal chandelier. A cameo
      brooch at her throat that looks older than the Revolution.
      Behind her, a bookshelf with titles in Latin, Greek, and
      something older. A Ouija board visible on a side table,
      positioned like a conversation piece.

  - name: Count Dmitri Volkonsky
    role: The White Russian
    type: npc_major
    appearance: >-
      A gaunt man in his late forties with sharp Slavic features —
      high cheekbones, deep-set grey eyes, a long aristocratic nose.
      Hair still dark but receding at the temples, always immaculately
      combed. Clean-shaven, with a jawline that could cut paper. Tall
      and thin, carrying himself with the rigid posture of a former
      cavalry officer even while wearing a taxi driver's cap. His
      hands are elegant — pianist's fingers — but the calluses are
      from a steering wheel now.
    culture_aesthetic: >-
      Russian émigré nobility in exile — Romanov-era bearing in a
      République setting. The suit is twenty years old, brushed and
      pressed daily. A pocket watch that belonged to his grandfather.
      Imperial dignity maintained on a taxi driver's salary.
    element_visual: >-
      A taxi driver's cap held in one hand, a glass of vodka in the
      other. The ghost of a military posture beneath civilian clothes.
      A faded photograph visible in a worn leather wallet. Eyes that
      look past you toward St. Petersburg. Rain on the window of a
      sixteenth-arrondissement apartment that isn't his.


  - name: Ephraim Goldschmidt
    role: The Antiquaire
    type: npc_supporting
    appearance: >-
      A slight man in his sixties with a neatly trimmed white beard,
      thick wire-rimmed spectacles on a prominent nose, and pale blue
      eyes behind the lenses. Stooped posture. Wears a brown wool
      waistcoat over a white shirt with the sleeves rolled, a jeweler's
      loupe on a chain around his neck.
    culture_aesthetic: >-
      Jewish Marais intellectual — a scholar-merchant in the tradition
      of the Quai Voltaire dealers. Cluttered shop filled with objects
      from a dozen civilizations, each one catalogued in his memory
      if not on paper.
    element_visual: >-
      A magnifying loupe held to one eye, the other squinting shut.
      Leather-bound ledgers in three languages stacked on a desk.
      Something wrapped in oilcloth that he keeps behind the counter
      and does not show to everyone. Dust motes in a shaft of window
      light. An object on the desk that shouldn't exist.


  - name: Nguyen Van Thien
    role: The Colonial Student
    type: npc_supporting
    appearance: >-
      A young Vietnamese man in his early twenties with sharp features,
      close-cropped black hair, and dark eyes. Thin build. Wears a
      threadbare but clean dark suit, a white shirt buttoned to the
      collar without a tie, and round wire spectacles. Upright,
      composed posture.
    culture_aesthetic: >-
      Colonial intellectual in the metropole — Sorbonne student by
      day, anti-colonial organizer by night. Western dress adopted
      strategically, not aspirationally. The wire spectacles and
      buttoned collar project seriousness. Everything about him says
      discipline.
    element_visual: >-
      A worn book bag held close. Ink-stained fingers. A stack of
      plain folded papers under one arm. Standing under a café awning
      out of the rain.

  - name: Professeur Henri Aubert
    role: The Professor
    type: npc_supporting
    appearance: >-
      A man in his fifties with untidy grey hair, a deeply lined
      sun-weathered face, and brown eyes behind smudged pince-nez
      glasses. Wears a worn tweed suit with chalk dust on the lapels
      and a slightly askew bow tie. Carries a bulging leather satchel
      stuffed with rolled papers.
    culture_aesthetic: >-
      French academic — Sorbonne archaeology faculty, more comfortable
      in a Mesopotamian tomb than a Parisian salon. The absent-minded
      professor incarnate, except the things he's absent-minded about
      are social niceties, not ancient Sumerian.
    element_visual: >-
      Chalk dust on his fingers and lapels. A leather satchel bulging
      with rolled papers. Pince-nez glasses reflecting lamplight. A
      rubbing on translucent paper spread across a café table, weighted
      down with coffee cups. The excited, slightly manic expression of
      a man who has found something that will either make his career
      or end his life.


  - name: Teresa Montoya
    role: The War Veteran
    type: npc_supporting
    appearance: >-
      A Spanish woman in her mid-thirties with dark hair pulled back
      in a severe bun, olive skin weathered beyond her years, and
      black eyes that have the flat, distant look of someone who has
      seen the inside of a war. A thin scar across her left cheekbone.
      Lean and wiry, moves with the economical precision of someone
      trained to fight. Wears a man's leather jacket over a dark
      blouse, trousers instead of a skirt, and boots meant for
      walking long distances. Arrived on the train from Barcelona
      three weeks ago with one bag and no intention of going back.
    culture_aesthetic: >-
      Spanish Republican exile — the civil war hasn't officially
      started but the killing has. Practical clothing with no
      concession to Parisian fashion. Military surplus worn as
      civilian dress. The leather jacket is a political statement
      as much as a garment.
    element_visual: >-
      A worn leather jacket with a Republican pin on the collar. A
      flask of something strong in the inside pocket. Hands that are
      steady when they shouldn't be. A train ticket stub from
      Barcelona tucked into a passport with too-fresh stamps. Rain
      on the platform at Gare Montparnasse.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER FACES — character-creation portrait options.
  # type: player_picker. Covers all five world cultures, M/F balanced,
  # varied archetypes. Physical-only appearance (head-and-shoulders,
  # montage-safe); backdrop comes from backdrop_poi (all resolve in
  # r2_manifest.json). Appended per the seaboard_of_saints pilot.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Parisian French ───────────────────────────────────

  - id: picker_parisian_french_commissaire_m01
    name: picker parisian french commissaire m01
    role: The Commissaire
    type: player_picker
    culture: parisian_french
    archetype: The Commissaire
    sex: male
    backdrop_poi: the_prefecture
    appearance: >-
      Man in his fifties, heavyset and broad through the shoulders. A
      square, jowled face with deep nasolabial lines, grey stubble he
      shaves twice a day and never quite beats, and hooded brown eyes
      that have stopped being surprised by anything. Iron-grey hair
      combed flat and thinning at the crown, a clipped grey moustache.
      A dark wool overcoat over a stiff collar and a sober knotted tie.
      A faded burn scar on the back of one hand rests near his lapel.

  - id: picker_parisian_french_salon_hostess_f01
    name: picker parisian french salon hostess f01
    role: The Salon Hostess
    type: player_picker
    culture: parisian_french
    archetype: The Salon Hostess
    sex: female
    backdrop_poi: salon_in_the_16th
    appearance: >-
      Woman in her forties, poised and unhurried. An oval face with
      fine pale skin, arched plucked brows, and cool grey eyes that
      weigh a room before they greet it. Dark bobbed hair waved close
      to the head in the marcel style, a single drop pearl at each ear.
      A high-necked silk blouse with a cameo at the throat under a
      tailored grey jacket. Carmine lipstick, otherwise restrained;
      the look of old money that no longer needs to advertise.

  - id: picker_parisian_french_antiquaire_m01
    name: picker parisian french antiquaire m01
    role: The Antiquaire
    type: player_picker
    culture: parisian_french
    archetype: The Antiquaire
    sex: male
    backdrop_poi: bridge_over_the_seine
    appearance: >-
      Slight man in his sixties with a narrow, scholarly face, sallow
      skin, and quick pale-blue eyes magnified behind round wire-rimmed
      spectacles. A neat white goatee and waxed moustache, bald above
      a fringe of white hair at the temples. A velvet-collared frock
      coat over a wing collar and a loosely tied silk cravat. A loupe
      on a black ribbon hangs at his chest; ink stains the side of one
      finger.

  - id: picker_parisian_french_camelot_m01
    name: picker parisian french camelot m01
    role: The Camelot du Roi
    type: player_picker
    culture: parisian_french
    archetype: The Camelot du Roi
    sex: male
    backdrop_poi: place_de_la_concorde
    appearance: >-
      Young man in his early twenties, lean and tightly wound. A pale
      angular face, high colour in the cheeks, and pale grey eyes with
      a fixed zealot's brightness. Dark hair oiled and parted sharp on
      the left. A cheap dark suit buttoned to the throat with a stiff
      detachable collar slightly too large. A small cloth rosette
      pinned to his lapel; a freshly split lip and a bruise yellowing
      along one cheekbone.

  - id: picker_parisian_french_torch_singer_f01
    name: picker parisian french torch singer f01
    role: The Torch Singer
    type: player_picker
    culture: parisian_french
    archetype: The Torch Singer
    sex: female
    backdrop_poi: beneath_the_palais_garnier
    appearance: >-
      Woman in her late twenties with a heart-shaped face, very pale
      powdered skin, and dark kohl-rimmed eyes that look perpetually
      half-grieving. Black hair in tight finger waves close to the
      skull, a single spit-curl at each cheek. Thin painted brows and a
      small dark cupid's-bow mouth. A beaded black evening gown with a
      plunging halter neckline draped at the collarbone, a long jet
      necklace, a black silk rose tucked behind one ear.

  # ── Picker · American Expatriate ───────────────────────────────

  - id: picker_american_expatriate_writer_m01
    name: picker american expatriate writer m01
    role: The Expatriate Writer
    type: player_picker
    culture: american_expatriate
    archetype: The Expatriate Writer
    sex: male
    backdrop_poi: la_rotonde
    appearance: >-
      Man in his early thirties, broad-faced and ruddy, with a strong
      jaw, a sunburnt nose, and amused brown eyes set in a face that is
      starting to soften from too much drink. Thick dark hair pushed
      back off a high forehead, a heavy dark moustache. A rumpled tweed
      jacket over an open-collared shirt with no tie, the collar points
      curling. A few days' stubble on his cheeks and a smudge of ink at
      the side of his thumb resting near his lapel.

  - id: picker_american_expatriate_journalist_f01
    name: picker american expatriate journalist f01
    role: The Journalist
    type: player_picker
    culture: american_expatriate
    archetype: The Journalist
    sex: female
    backdrop_poi: shakespeare_and_company
    appearance: >-
      Woman in her late twenties with a frank, open American face,
      freckled fair skin, and clear hazel eyes behind no-nonsense
      tortoiseshell spectacles. Light brown hair shingled short and
      tucked behind the ears. A practical tailored jacket over a soft
      collared shirt and a loosely knotted necktie worn man-fashion. A
      stub of pencil tucked behind one ear; minimal makeup, a wry set
      to the mouth.

  - id: picker_american_expatriate_grifter_m01
    name: picker american expatriate grifter m01
    role: The Fixer
    type: player_picker
    culture: american_expatriate
    archetype: The Fixer
    sex: male
    backdrop_poi: the_bourse
    appearance: >-
      Man in his late thirties, smooth and well-fed, with an oval face,
      tanned skin, and quick dark eyes that smile without commitment.
      Black hair slicked back and glossy with pomade, a thin pencil
      moustache. A sharply tailored double-breasted suit with wide
      peaked lapels, a silk pocket square, and a stickpin gleaming in a
      patterned tie. A gold signet ring catches the light where his
      hand rests at his chest.

  # ── Picker · Black American & Afro-Caribbean ───────────────────

  - id: picker_black_american_chanteuse_f01
    name: picker black american chanteuse f01
    role: The Chanteuse
    type: player_picker
    culture: black_american_&_afro_caribbean
    archetype: The Chanteuse
    sex: female
    backdrop_poi: beneath_the_palais_garnier
    appearance: >-
      Woman in her late twenties, radiant and self-possessed, with a
      heart-shaped face, warm deep-brown skin, and large dark eyes lined
      in kohl beneath finely arched brows. Black hair sleeked into a
      lacquered Eton crop with a single sculpted kiss-curl at the brow.
      High cheekbones, a wide confident smile, deep-red lips. A beaded
      gold lamé gown with a halter neck draped at the shoulders, long
      jet-and-crystal earrings, an ostrich-feather band at the hairline.

  - id: picker_black_american_performer_m01
    name: picker black american performer m01
    role: The Torch Singer
    type: player_picker
    culture: black_american_&_afro_caribbean
    archetype: The Torch Singer
    sex: male
    backdrop_poi: la_rotonde
    appearance: >-
      Man in his thirties with a long, expressive face, rich dark-brown
      skin, and heavy-lidded eyes that hold a tired warmth. A neat thin
      moustache, close-cropped hair with a sharp side part edged in. A
      crisp white dinner shirt and black bow tie under the satin lapels
      of a tuxedo jacket, a white carnation in the buttonhole. A faint
      sheen of stage sweat at the brow; a brass cornet mouthpiece held
      loosely near his collar.

  - id: picker_black_american_student_f01
    name: picker black american afro caribbean student f01
    role: The Colonial Student
    type: player_picker
    culture: black_american_&_afro_caribbean
    archetype: The Colonial Student
    sex: female
    backdrop_poi: shakespeare_and_company
    appearance: >-
      Young woman in her early twenties with a round, intelligent face,
      smooth dark skin, and steady brown eyes that hold a careful,
      watchful intensity. Black hair drawn back into a low neat coil. A
      modest high-necked grey wool dress with a white Peter Pan collar
      under a plain student's coat. A stack of journals held against her
      chest; small gold studs at her ears, no other ornament.

  - id: picker_black_american_student_m01
    name: picker black american afro caribbean student m01
    role: The Colonial Student
    type: player_picker
    culture: black_american_&_afro_caribbean
    archetype: The Colonial Student
    sex: male
    backdrop_poi: shakespeare_and_company
    appearance: >-
      Young man in his early twenties with a lean, fine-boned face, deep
      brown skin, and earnest dark eyes behind round wire spectacles.
      Closely cropped hair, a faint moustache just coming in. A worn but
      carefully pressed dark three-piece suit with a starched collar and
      a sober knitted tie. A fountain pen clipped to the breast pocket;
      a rolled pamphlet tucked under one arm against his chest.

  # ── Picker · Russian Émigré ────────────────────────────────────

  - id: picker_russian_emigre_officer_m01
    name: picker russian emigre white russian m01
    role: The White Russian
    type: player_picker
    culture: russian_émigré
    archetype: The White Russian
    sex: male
    backdrop_poi: cheap_hotel_near_station
    appearance: >-
      Man in his fifties, gaunt and erect, with a long bony face, pale
      sallow skin, and deep-set grey eyes carrying a permanent quiet
      grief. Iron-grey hair cropped close in a military fashion, a
      sweeping waxed moustache and short imperial beard. The collar of a
      threadbare but immaculately brushed dark uniform tunic, brass
      buttons polished, an empty place where decorations once hung. A
      single old enamelled order pinned crooked at the breast.

  - id: picker_russian_emigre_countess_f01
    name: picker russian emigre white russian f01
    role: The White Russian
    type: player_picker
    culture: russian_émigré
    archetype: The White Russian
    sex: female
    backdrop_poi: cheap_hotel_near_station
    appearance: >-
      Woman in her forties with a fine, fading aristocratic beauty — a
      narrow face, pale translucent skin, high cheekbones, and large
      grey eyes shadowed with sleeplessness. Ash-blonde hair pinned in a
      soft low chignon, a few strands escaping. A high-necked dark dress
      of good cut gone shiny at the seams, a moth-spotted fur collar, a
      single inherited cameo at the throat. Pale lips, no rouge she can
      still afford.

  - id: picker_russian_emigre_grifter_m02
    name: picker russian emigre grifter m02
    role: The Grifter
    type: player_picker
    culture: russian_émigré
    archetype: The Emigre
    sex: male
    backdrop_poi: gare_montparnasse
    appearance: >-
      Man in his thirties, sleek and watchful, with a smooth oval face,
      olive-pale skin, and clever dark eyes that miss nothing. Black
      hair combed straight back and gleaming, a thin precise moustache.
      A well-cut but slightly out-of-season grey suit, a stiff collar,
      and a silk scarf knotted at the throat in place of an overcoat he
      pawned. A cigarette held near his lapel between two stained
      fingers; a faint knowing half-smile.

  # ── Picker · Corsican & Mediterranean ──────────────────────────

  - id: picker_corsican_don_m01
    name: picker corsican mediterranean don m01
    role: The Don
    type: player_picker
    culture: corsican_&_mediterranean
    archetype: The Don
    sex: male
    backdrop_poi: the_milieus_territory
    appearance: >-
      Heavyset man in his late fifties with a broad, fleshy face, olive
      skin darkened by the sun, and small hard black eyes set in folds.
      Thick silver hair combed straight back, a heavy grey moustache
      over a wide unsmiling mouth. A black wool suit of expensive cut, a
      black silk shirt, a black tie with a pearl pin. A thick gold ring
      on one finger and a heavy gold watch chain crossing his waistcoat
      where his hand rests.

  - id: picker_corsican_muscle_m01
    name: picker corsican mediterranean muscle m01
    role: The Muscle
    type: player_picker
    culture: corsican_&_mediterranean
    archetype: The Muscle
    sex: male
    backdrop_poi: the_catacombs
    appearance: >-
      Thickset young man in his late twenties, bull-necked and heavy
      through the shoulders, with a blunt square face, weathered olive
      skin, and flat dark eyes under a low brow. Black hair cropped
      short, a day's stubble, a flattened boxer's nose and a small white
      scar through one eyebrow. A cheap dark suit straining at the
      shoulders, the collar open, a wool cap shoved back. A cauliflowered
      ear; thick knuckles resting near his lapel.

  - id: picker_corsican_chanteuse_f01
    name: picker corsican mediterranean chanteuse f01
    role: The Torch Singer
    type: player_picker
    culture: corsican_&_mediterranean
    archetype: The Torch Singer
    sex: female
    backdrop_poi: the_milieus_territory
    appearance: >-
      Woman in her early thirties with a strong oval face, warm olive
      skin, and large dark flashing eyes under heavy brows. Black hair
      parted in the centre and coiled low at the nape, gold hoops in her
      ears. A full carmine mouth, a small mole at the corner. A
      wine-dark silk dress cut close at a square neckline, a fringed
      shawl knotted across one shoulder, a thin gold crucifix at the
      throat. A defiant, level set to the jaw.
