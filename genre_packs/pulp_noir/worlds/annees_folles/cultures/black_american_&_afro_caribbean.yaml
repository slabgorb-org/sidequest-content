summary: African Americans who came to Paris to escape Jim Crow and found a
description: African Americans who came to Paris to escape Jim Crow and found a city
  that, if not free of racism, at least didn't have sundown laws. Jazz musicians,
  dancers, singers, soldiers who stayed after the war. Also West Indian and North
  African performers and workers from the French colonial empire.
