# Seed tropes for pulp_noir/annees_folles — world-tier deck (Epic 94: genre is
# the rulebook only; flavor lives in the world). Short-arc narrative hooks dealt
# at session start and on lull/engagement draws, expiring after lifespan_turns
# and lingering as ghosts for later callback (ADR-018, ADR-128). Seeds are
# baited hooks (ADR-014 diamonds-and-coal) — deliberately vague; the narrator
# threads an engaged seed into whatever the macro-mystery becomes.
#
# Without this file annees_folles drew from an empty deck: the lull-escalation
# engine declined `none_available` on every quiet turn, so the narrator filled
# the silence by inventing crowds of NPCs from whole cloth — the bug this fixes.
#
# Pitched to THIS world's canon (world.yaml: occult 0.3, intrigue 0.6, scope
# 0.7; Paris 1926, the années folles). Register per openings.yaml: hardboiled
# French, observational, a little tired, NOT parody — Simenon's room before the
# body, not the gumshoe in the smoky office. The occult is séance-table fashion,
# not monsters in the street; keep all but one seed worldly. Specific period
# particulars over cliche: Montparnasse vs the Milieu's Montmartre, the
# Lost-Generation expatriate set, the apache street-gangs and the fortifs, opium
# fumeries, the Dada/Surrealist feuds, a forged provenance, the Revue Nègre and
# the music-halls, the wagon-lits, the White-Russian émigrés, the cataphiles
# below. The body lands turn 2 at the earliest — a seed is the breath before it.

- id: annees_folles_the_unturned_figaro
  name: The Man Who Will Not Turn the Page
  description: >-
    The same man has taken the same café table three afternoons running,
    a folded Le Figaro before him, and in an hour he never turns a page.
    He orders one fine à l'eau and lets it warm. He is not reading and he
    is not waiting for anyone who comes. He is watching a door, or a
    window, or a person who does not yet know they are watched.
  flavor_tags: [surveillance, cafe, intrigue, montparnasse]
  lifespan_turns: 6
  delivery_hints:
    - The waiter mentions him without being asked — three days, one drink a day, no tip and no trouble
    - His paper is yesterday's, and the crease has not moved since he sat down
    - When a particular regular enters the café his eyes lift from the page for exactly as long as it takes them to choose a seat
  narrative_hint: >-
    SOUL — show, don't tell: plant the watcher as ambient texture and let
    the players decide whether the watched party is one of them. If
    ignored, bind him to whichever faction is later hunting the crew, so
    his three idle afternoons read in hindsight as the casing of a mark.

- id: annees_folles_provenance_on_quai_voltaire
  name: A Provenance Too Clean
  description: >-
    A small canvas has surfaced in a Quai Voltaire window — a portrait the
    dealer attributes to a painter who died poor at the Charité last
    winter, with papers tracing it through three respectable hands. The
    papers are immaculate. That is the problem: a picture off a Montparnasse
    easel does not arrive with a baptismal certificate. Someone wanted this
    one laundered before a buyer with money looked too closely.
  flavor_tags: [forgery, art, money, expatriate]
  lifespan_turns: 7
  delivery_hints:
    - The dealer recites the chain of ownership a little too smoothly, the way a man recites an alibi he has practiced
    - A model who sat for the dead painter swears he never finished this canvas, or any like it
    - The middle name in the provenance belonged to a collector who has been dead longer than the picture is supposed to have existed
  narrative_hint: >-
    SOUL — consequences are real: the forged paper is a thread to a living
    fraud, not set dressing. Let the buyer the papers were prepared for
    matter, and let exposing the picture cost the party the dealer's good
    will and the buyer's far worse will.

- id: annees_folles_the_fumerie_debt
  name: The Slate in the Back Room
  description: >-
    Behind a tailor's in the ninth there is a quiet room of low couches
    and a sweet brown smell, and on its slate a name the party knows owes
    more than a clerk's wages could clear in ten years. The house that
    keeps the slate is not patient and is not the kind that goes to a
    magistrate. The debtor has stopped coming, which is worse than coming.
  flavor_tags: [opium, debt, vice, milieu]
  lifespan_turns: 6
  delivery_hints:
    - The tailor in front does no measuring and keeps the curtain to the back drawn even in the day
    - A pawnbroker two streets over has lately taken in a watch, a ring, and a wife's brooch from the same trembling hand
    - The men who collect for the house have begun asking, very politely, who the debtor's friends are
  narrative_hint: >-
    SOUL — agency with teeth: the debt is a lever someone will pull on a
    person the party cares about. Let the fumerie be a place of choices,
    not vice-spectacle, and let clearing or ignoring the slate decide
    whose knees the collectors visit next.

- id: annees_folles_revue_understudy
  name: The Understudy Who Was Sent For
  description: >-
    A Montmartre music-hall has a Revue going that sells out on the strength
    of one dancer from across the water, and last night the understudy went
    on instead — not because the star was ill, but because a car came for
    the star at the stage door and she got into it. The house was told she
    was indisposed. The understudy danced like a woman who had been promised
    something, or threatened with it.
  flavor_tags: [music-hall, performer, intrigue, montmartre]
  lifespan_turns: 6
  delivery_hints:
    - The stage-door keeper describes the car as too good for the street it idled on, and the man who held the door as no chauffeur
    - The understudy has a new fur and will not say from whom, and flinches when the star's name is spoken
    - The star's dressing room is exactly as she left it mid-makeup, one shoe still under the chair
  narrative_hint: >-
    SOUL — the world reacts: a person was taken or bought, and the silence
    of the house is complicity. Let the players read the understudy's good
    luck as someone else's bad, and bind the car to whichever powerful
    patron the macro-plot later seats at the table.

- id: annees_folles_wagon_lits_compartment
  name: The Compartment That Arrived Empty
  description: >-
    The Calais boat-train pulled into the Gare du Nord this morning and a
    first-class wagon-lits compartment booked through to Paris came in
    locked from the inside and empty — a coat on the hook, a valise strapped
    shut, a half-cup of cold coffee, and no passenger anywhere on the train.
    The conductor punched the ticket at Amiens. Between Amiens and Paris a
    man does not simply cease.
  flavor_tags: [railway, disappearance, intrigue, wagon-lits]
  lifespan_turns: 7
  delivery_hints:
    - The conductor swears the corridor door was bolted from within and the window-strap was up the whole run
    - The valise, when it is finally opened, holds a stranger's clothes and a name sewn into the lining that is not the name on the ticket
    - A porter remembers a second gentleman who boarded at Amiens and detrained nowhere
  narrative_hint: >-
    SOUL — show, don't tell: lay out the locked compartment as a clean
    impossible fact and let the players work it, not a narrator-supplied
    solution. The cold coffee and the bolted door are the clues; let the
    name in the lining open the case the body will later confirm.

- id: annees_folles_apache_truce_broken
  name: A Truce Broken at the Fortifs
  description: >-
    Out past the boulevards, where the old fortifications rot into a no-man's
    ground of shacks and ragpickers, two apache bands have kept an uneasy
    line for years. Last week a body turned up on the wrong side of it,
    and now the lavabos and the bal-musettes of Belleville are too quiet.
    When the apaches go quiet, someone with more money than either band has
    paid one of them to start something.
  flavor_tags: [street-gang, territory, violence, fortifs]
  lifespan_turns: 5
  delivery_hints:
    - The accordion at the corner bal-musette has gone silent three nights, and the dancing with it
    - A girl who runs with one band has a knife she did not have last month and will not say who gave it
    - The flics who patrol the zone have suddenly stopped patrolling it, which they only do when told
  narrative_hint: >-
    SOUL — consequences are real: a street war is a means, not a backdrop.
    Let the party trace who profits from the broken truce, and let the
    answer reach up out of the fortifs into a respectable arrondissement —
    the apaches are someone's blunt instrument.

- id: annees_folles_dada_feud_pamphlet
  name: The Pamphlet That Named a Name
  description: >-
    The avant-garde has split again — manifestos nailed up, a café reading
    broken up with thrown chairs, two former friends now declaring each
    other dead to art and to France. But the latest pamphlet does more than
    insult: buried in the abuse it names a man and a date and a sum of
    money, and the named man is not a poet. He is the sort who answers an
    insult in print with something quieter.
  flavor_tags: [surrealist, feud, scandal, expatriate]
  lifespan_turns: 6
  delivery_hints:
    - Two literary cafés have stopped serving each other's regulars, and a reading ended with a broken jaw and no police
    - The pamphlet's printer took the job in cash and has since shuttered his press and left town
    - The named man's secretary has been buying up every copy of the pamphlet she can find, paying above cover
  narrative_hint: >-
    SOUL — agency with teeth: a poets' quarrel is the cover for a real
    accusation. Let the players choose whether the buried name is libel or
    leak, and let the man so named act on whoever keeps the pamphlet in
    circulation — including the crew.

- id: annees_folles_emigre_taxi_passenger
  name: The Fare Who Never Got Out
  description: >-
    A White Russian who drives nights — a colonel once, he will tell you,
    of a regiment that no longer exists — picked up a fare outside a 16th
    arrondissement embassy and was told an address that does not exist.
    He drove an hour. When he stopped, the back seat was empty and a roll
    of franc notes lay on it, far too many for the meter. He has not driven
    since, and he keeps the violin case on the passenger seat now.
  flavor_tags: [emigre, espionage, intrigue, sixteenth]
  lifespan_turns: 7
  delivery_hints:
    - The driver counts the money out for a player and will not touch it again, as if it were marked
    - The embassy he waited outside flies a flag the émigré community spits at, and he waited there on purpose, for a reason he is slow to give
    - Another émigré driver took a near-identical fare the same week and has not been seen at the rank since
  narrative_hint: >-
    SOUL — the world reacts: Paris is the espionage capital and the
    émigrés are everyone's recruiting ground. Let the impossible address
    and the over-large fare be the opening move of a handler, and let the
    colonel's old loyalties decide whether he is a witness or already a
    piece on the board.

- id: annees_folles_concierge_ledger
  name: The Concierge Who Logs the Hours
  description: >-
    Every Paris building has its concierge in her loge, and this one keeps
    a ledger no tenant has asked her to keep: who came in, who went up,
    which floor, what hour, who did not come down. She has noticed that a
    quiet tenant on the fourth has had the same three callers at the same
    odd hour all month, and that one of them is a face from the newspapers.
    She would tell the right person. For a consideration. Or out of spite.
  flavor_tags: [household, surveillance, gossip, intrigue]
  lifespan_turns: 5
  delivery_hints:
    - She knows the party's own comings and goings before they mention them, and lets them know she knows
    - The quiet fourth-floor tenant pays her well to forget, and she takes the money and remembers anyway
    - One of the three regular callers arrives by the service stair, which respectable callers do not use
  narrative_hint: >-
    SOUL — show, don't tell: the concierge is a living surveillance camera;
    her loge is where the case's timeline already exists, written down. Let
    the players court or fear her, and let her ledger pin a suspect to an
    hour once the body fixes the hour that matters.

- id: annees_folles_dud_franc_bearer_bonds
  name: Bonds Drawn on a Bank That Burned
  description: >-
    Since the franc shuddered last summer, frightened money has gone looking
    for anything that holds its value, and a smooth gentleman has been
    selling bearer bonds in a provincial bank — gilt-edged, handsome, paying
    a rate too good to be true. The bank exists. It also burned, with its
    records, in 1919. The bonds are beautiful and they are paper. The buyers
    are respectable people who cannot afford to be seen having been fooled.
  flavor_tags: [fraud, finance, scandal, money]
  lifespan_turns: 7
  delivery_hints:
    - A respectable acquaintance presses the party to get in before the issue closes, with the brightness of a man who has already bought
    - The bonds are engraved beautifully and the bank's seal is real, copied from a document older than the fire
    - The smooth gentleman keeps no office and takes only cash, in person, in cafés he never visits twice
  narrative_hint: >-
    SOUL — consequences are real: this is the années folles in one object —
    cheap money chasing a beautiful lie. Let the swindle have respectable
    victims who would rather be robbed twice than admit it once, and let
    the party's exposure of it threaten people too proud to thank them.

- id: annees_folles_sealed_chamber_cataphiles
  name: A Door That Was Sealed Before the Revolution
  description: >-
    The cataphiles who haunt the tunnels below the city trade maps and
    boasts, and lately they trade a rumour: a gallery off the old quarry
    network, walled up with cut stone and a date chiselled above it from
    before the Terror, has been opened — neatly, recently, by someone with
    a mason's tools and a reason. Fresh wax pools below the breach. Whoever
    went in did not scrawl their name beside it the way cataphiles always do.
  flavor_tags: [catacombs, occult, mystery, underground]
  lifespan_turns: 8
  delivery_hints:
    - A cataphile shows the party a chalk rubbing of the chiselled date and asks, only half-joking, what was worth sealing for a hundred years
    - The mortar dust at the breach is pale and new against stone gone black with age
    - The candle stubs left below the opening are good wax, beeswax, the kind a parlour buys, not the dripping tallow the tunnel crowd carries
  narrative_hint: >-
    SOUL — restraint: this is the deck's one occult-tinged seed, and the
    world's occult is 0.3 — keep it ambiguous as long as the players let
    you. Let the salon set's money be the obvious worldly hand behind the
    masonry, and reveal nothing below the wax that the table has not earned.

- id: annees_folles_brawler_at_the_kiosk
  name: The Newspaper Seller Who Carries a Cane
  description: >-
    A young man has set up selling Action Française at a kiosk on a corner
    that was not his last week, and he is not alone — there are always three
    or four of them now, loud, selling papers and watching who buys the
    rival sheets. The weighted cane one of them carries is not for walking.
    They have chosen this corner because someone the party knows lives, or
    works, or drinks within sight of it.
  flavor_tags: [politics, street, violence, action-francaise]
  lifespan_turns: 5
  delivery_hints:
    - The papers are sold loudly and the buyers noted quietly; a notebook comes out when certain customers pass
    - A foreign-looking student who used to take this corner home now goes three streets around
    - The shopkeeper across the way has begun closing his shutters an hour early and will say why only in a whisper
  narrative_hint: >-
    SOUL — the world reacts: the fascism is creeping, not arrived — let the
    menace be a corner gone wrong, not a rally. Let the players feel the
    street narrowing around someone they value, and let the choice to face
    the kiosk or route around it cost something either way.
