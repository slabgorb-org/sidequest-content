- id: crime_scene
  archetype: mystery
  situation: >-
    The player arrives at a crime scene — called in, stumbled upon, or
    already there when it happened. The body is fresh. The cops haven't
    arrived yet. Or they have, and they're wrong about everything.
  tone: hard-boiled, observational
  avoid:
    - office introduction scenes
    - client walking in with a job
    - exposition-heavy openings
  first_turn_seed: >-
    The blood is still wet. Whoever did this left in a hurry — the back
    door is open and there's a shoe print in the alley mud. The phone is
    off the hook and someone on the other end is still breathing.

- id: blackmail_drop
  archetype: standoff
  situation: >-
    The player has something someone wants — or someone has something on
    the player. An exchange is about to happen in a public place. The
    rules are simple: show up, trade, leave alive. But rules break.
  tone: paranoid, transactional
  avoid:
    - office scenes
    - casual investigation start
    - being hired for a case
  first_turn_seed: >-
    The envelope under your door this morning had three things: a photo
    you can't explain, an address, and a time. That time is now. And
    you're not the only one watching the bench.

- id: client_in_trouble
  archetype: chase
  situation: >-
    Someone the player knows — or just met — is in immediate danger.
    They called, they ran, they showed up bleeding at the wrong door.
    The why comes later. Right now, the how is all that matters.
  tone: urgent, protective
  avoid:
    - office consultation scenes
    - slow case buildup
    - research montages
  first_turn_seed: >-
    She didn't knock — she fell through the door. Mascara and blood and
    a story that's going to get someone killed. Probably you. The car
    outside is still running and it isn't hers.

- id: double_cross
  archetype: survival
  situation: >-
    The player's been set up. A job that was too good to be true turned out
    to be exactly that. Now they're holding evidence that points at them,
    in a room that's about to have company. Think fast.
  tone: betrayed, calculating
  avoid:
    - establishing scenes
    - meeting new contacts
    - slow mystery buildup
  first_turn_seed: >-
    The safe was supposed to have bearer bonds. Instead it has a dead man's
    journal with your name in it — and the sound of sirens getting closer.
