# PURCHASED/PD-FIRST audio (revamped 2026-06-14).
#
# The `themes:` block was REMOVED. library_backend._resolve_music plays a mood's
# `themes` variations before it ever reads `mood_tracks`, so the ACE-Step set-1
# leitmotifs (exploration_full, combat_full, …) were shadowing the entire curated
# catalog below — the Joplin ragtime and the real 1920s jazz recordings never
# played. Removing `themes:` makes `mood_tracks` the live source.
#
# Two music sources here, both period-correct for the Années folles (1920s Paris):
#   - assets/audio/ragtime_pd/ : Scott Joplin rags, composer-rendered from PD
#     notation (Mutopia MIDI). See that bucket's catalog.yaml.
#   - assets/audio/jazz_pd/    : GENUINE public-domain 1920s jazz RECORDINGS
#     (78rpm transfers, recording first published <=1925 -> PD in the US).
#     See jazz_pd/jazz_pd_backlog.md for per-track provenance + the PD-year rule.
mood_tracks:
  exploration:
    # Public domain Scott Joplin ragtime — slow/atmospheric rags & waltz
    - path: assets/audio/ragtime_pd/Joplin - Solace.ogg
      title: "Solace (A Mexican Serenade)"
      bpm: 70
    - path: assets/audio/ragtime_pd/Joplin - Magnetic Rag.ogg
      title: "Magnetic Rag"
      bpm: 78
    - path: assets/audio/ragtime_pd/Joplin - The Sunflower Slow Drag.ogg
      title: "The Sunflower Slow Drag"
      bpm: 80
    - path: assets/audio/ragtime_pd/Joplin - Sugar Cane Rag.ogg
      title: "Sugar Cane Rag"
      bpm: 82
  combat:
    # Hot jazz scores the violence (jazz-age gunplay). Real 1920s recordings.
    - path: assets/audio/jazz_pd/Tiger Rag.ogg
      title: "Tiger Rag"            # Original Dixieland Jazz Band, 1918 (PD)
      bpm: 180
    - path: assets/audio/jazz_pd/Dipper Mouth Blues.ogg
      title: "Dipper Mouth Blues"   # King Oliver's Creole Jazz Band, 1923 (PD)
      bpm: 92
  tension:
    # Slow blues — real 1920s recordings.
    - path: assets/audio/jazz_pd/Crazy Blues.ogg
      title: "Crazy Blues"          # Mamie Smith & Her Jazz Hounds, 1920 (PD)
      bpm: 72
    - path: assets/audio/jazz_pd/Weeping Willow Blues.ogg
      title: "Weeping Willow Blues" # Bessie Smith, 1924 (PD)
      bpm: 70
  rest:
    # Public domain Scott Joplin ragtime — slow/atmospheric rags & waltz
    - path: assets/audio/ragtime_pd/Joplin - Bethena.ogg
      title: "Bethena (A Concert Waltz)"
      bpm: 72
    - path: assets/audio/ragtime_pd/Joplin - Eugenia.ogg
      title: "Eugenia"
      bpm: 78
    - path: assets/audio/jazz_pd/St Louis Blues.ogg
      title: "St. Louis Blues"      # Bessie Smith w/ Louis Armstrong, 1925 (PD)
      bpm: 85
  # tavern alias — maps core interpreter keywords to speakeasy jazz
  tavern: &speakeasy_tracks
    # Genuine public-domain 1920s jazz recordings (the real article).
    - path: assets/audio/jazz_pd/Helen Gone.ogg
      title: "Helen Gone"           # Vincent Rose & His Montmartre Orch., 1924 (PD)
      bpm: 95
    - path: assets/audio/jazz_pd/Montmartre Rag.ogg
      title: "Montmartre Rag"       # Mitchell's Jazz Kings, Paris, 1922 (PD)
      bpm: 100
    - path: assets/audio/jazz_pd/Dipper Mouth Blues.ogg
      title: "Dipper Mouth Blues"   # King Oliver's Creole Jazz Band, 1923 (PD)
      bpm: 92
    # Public domain Scott Joplin ragtime — mid-tempo social parlor piano
    - path: assets/audio/ragtime_pd/Joplin - Maple Leaf Rag.ogg
      title: "Maple Leaf Rag"
      bpm: 110
    - path: assets/audio/ragtime_pd/Joplin - The Entertainer.ogg
      title: "The Entertainer"
      bpm: 100
    - path: assets/audio/ragtime_pd/Joplin - Elite Syncopations.ogg
      title: "Elite Syncopations"
      bpm: 115
    - path: assets/audio/ragtime_pd/Joplin - Pineapple Rag.ogg
      title: "Pineapple Rag"
      bpm: 108
    - path: assets/audio/ragtime_pd/Joplin - Original Rags.ogg
      title: "Original Rags"
      bpm: 105
    - path: assets/audio/ragtime_pd/Joplin - Peacherine Rag.ogg
      title: "Peacherine Rag"
      bpm: 112
    - path: assets/audio/ragtime_pd/Joplin - Something Doing.ogg
      title: "Something Doing"
      bpm: 118
  speakeasy: *speakeasy_tracks
  intrigue:
    # Moody slow blues — real 1920s recordings.
    - path: assets/audio/jazz_pd/Crazy Blues.ogg
      title: "Crazy Blues"          # Mamie Smith & Her Jazz Hounds, 1920 (PD)
      bpm: 72
    - path: assets/audio/jazz_pd/Weeping Willow Blues.ogg
      title: "Weeping Willow Blues" # Bessie Smith, 1924 (PD)
      bpm: 70
    - path: assets/audio/jazz_pd/St Louis Blues.ogg
      title: "St. Louis Blues"      # Bessie Smith w/ Louis Armstrong, 1925 (PD)
      bpm: 85
  chase:
    # Public domain Scott Joplin ragtime — uptempo, driving two-steps
    - path: assets/audio/ragtime_pd/Joplin - The Cascades.ogg
      title: "The Cascades"
      bpm: 132
    - path: assets/audio/ragtime_pd/Joplin - Wall Street Rag.ogg
      title: "Wall Street Rag"
      bpm: 130
    - path: assets/audio/ragtime_pd/Joplin - A Breeze from Alabama.ogg
      title: "A Breeze from Alabama"
      bpm: 134
    - path: assets/audio/ragtime_pd/Joplin - The Strenuous Life.ogg
      title: "The Strenuous Life"
      bpm: 138
    # Fast hot jazz — real 1920s recordings.
    - path: assets/audio/jazz_pd/Tiger Rag.ogg
      title: "Tiger Rag"            # Original Dixieland Jazz Band, 1918 (PD)
      bpm: 180
    - path: assets/audio/jazz_pd/Montmartre Rag.ogg
      title: "Montmartre Rag"       # Mitchell's Jazz Kings, Paris, 1922 (PD)
      bpm: 100

# Genre-specific mood keywords — triggers mood detection for non-standard moods
mood_keywords:
  speakeasy:
    - speakeasy
    - jazz
    - bar
    - cabaret
    - drinks
    - cocktail
    - lounge
    - nightclub
    - smoke
    - bourbon
    - whiskey
    - dance
    - singer
    - piano
    - club
  intrigue:
    - secret
    - whisper
    - conspire
    - plot
    - betray
    - spy
    - double-cross
    - scheme
    - shadows
    - hidden
    - blackmail
    - informant
    - coded
    - dossier
  chase:
    - chase
    - run
    - flee
    - pursuit
    - escape
    - sprint
    - racing
    - getaway
    - cobblestones
    - alley
    - rooftop

sfx_library:
  gunshot:
    - audio/sfx/gunshot.ogg
  glass_break:
    - audio/sfx/glass_break.ogg
  car_engine:
    - audio/sfx/car_engine.ogg
  rain:
    - audio/sfx/rain.ogg
  crowd_murmur:
    - audio/sfx/crowd_murmur.ogg
  phone_ring:
    - audio/sfx/phone_ring.ogg
  door_slam:
    - audio/sfx/door_slam.ogg
  footsteps_cobblestone:
    - audio/sfx/footsteps_cobblestone.ogg
  jazz_applause:
    - audio/sfx/jazz_applause.ogg
  typewriter:
    - audio/sfx/typewriter.ogg

mixer:
  music_volume: 0.4
  sfx_volume: 0.7
  crossfade_default_ms: 3000

# Library always resolves now (every mood has tracks), so musicgen never fires.
ai_generation:
  enabled: true
  model: musicgen_small
  max_generation_time_s: 15
  cache_generated: true
