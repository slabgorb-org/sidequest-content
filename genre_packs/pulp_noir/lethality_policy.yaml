genre_key: pulp_noir
default_reversibility: reversible_with_cost
verdicts_on_zero_edge:
  pc: defeated
  npc: dying
soul_md_constraint: "genre_truth:the_gumshoe_wakes_up_bloodied_but_breathing"
must_narrate: "The investigator goes down — pistol-whipped in an alley, drugged at a hotel bar, run off the road in a borrowed Citroën. A fade to black, then a slow return: hospital bed, a contact's spare room, the back of a moving train. Time has passed. The case has cooled. Something is missing — a notebook, a contact, a tail of evidence — and the cost is named on the table the same turn the rescue lands."
must_not_narrate: "graphic permadeath of the PI; a clean wake-up where nothing was taken; the rescuer asking no favor in return; a hero arriving in time to spare the beating entirely; melodramatic last words the investigator did not earn"
