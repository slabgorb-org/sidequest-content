# Elemental Harmony — Disciplines (Classes)
#
# Six Disciplines mapped onto four WWN archetypes per
# docs/superpowers/plans/2026-05-29-wwn-content-binding.md Task 11.
#
# Design contract:
#   The pack's ability-score FLAVOR names (Strength/Agility/Endurance/
#   Insight/Spirit/Harmony) are used for prime_requisite — NOT canonical
#   STR/DEX (mirror space_opera which uses Physique/Reflex/etc.).
#
# class_label in rules.yaml: "Discipline".
#
# Four archetype groups:
#   1. Casters (slot + Effort): Channeler, Spirit Medium
#   2. Vowed (Effort-only Art user): Martial Artist
#   3. Warrior: Guardian
#   4. Experts: Scholar, Wanderer
#
# wwn_magic.governing_attr: "WISDOM" — Spirit in the pack's flavor names
# (rules.yaml attribute_map: WISDOM → Spirit). Spirit is the
# magic-governing attribute for all WWN-magic classes in this pack;
# the WwnEffortSource.governing_attr key MUST be a canonical WWN key
# (WISDOM), not the pack flavor name.
#
# Three required-but-inert fields (documented per space_opera convention):
#   - minimum_score: standard-array pack — no roll-minimum gate;
#     9 mirrors caverns_and_claudes/space_opera convention.
#   - kit_table: descriptive placeholder — starting equipment keyed by
#     display_name in inventory.yaml, not via class_kit path.
#   - jungian_default: archetype tag per class narrative posture.
#
# encounter_beat_choices reference real beat IDs from rules.yaml
# confrontations (Martial Exchange / Diplomatic Council / Pursuit):
#   Martial Exchange: strike, elemental_burst, cast_spell, guard, yield
#   Diplomatic Council: persuade, threaten, concede_point, walk_away
#   Pursuit: dash, leap, blend, vanish
#
# cast_spell is EXCLUDED from non-caster beat lists — the rules.yaml
# class_filter restricts it to [Channeler, Spirit Medium] so the WWN
# cast resource gate fires correctly (mirrors caverns_and_claudes
# class_filter: [Mage] pattern on cast_spell).
#
# Per ADR-095: roughly ONE signature ability per non-magical class.
# Casters get two entries reflecting their Art + spellcasting flavor.

# ── Caster archetype ────────────────────────────────────────────────────────

- id: channeler
  display_name: Channeler
  rpg_role: striker
  jungian_default: magician
  minimum_score: 9
  kit_table: channeler_kit
  prime_requisite: Spirit
  flavor: >-
    The Channeler does not learn magic so much as become a conduit for
    the raw elemental forces that underpin the world. Fire answers their
    call; water parts before them; stone yields where they press. They do
    not contain the element — they become briefly and voluntarily
    permeable to it, at real cost to the body that serves as the gate.
  encounter_beat_choices:
    - strike
    - elemental_burst
    - cast_spell
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - leap
    - vanish
  magic_access: wwn
  # governing_attr: WISDOM → Spirit (pack flavor). All casters use WISDOM
  # as the governing canonical key; see file-level header comment.
  wwn_magic:
    effort_sources:
      - source: channeler
        governing_attr: WISDOM
        relevant_skill: Channel
        starting_skill_level: 1
    casts_per_day_by_level:
      "1": 2
    max_spell_level_by_level:
      "1": 1
    prepared_by_level:
      "1": 2
    # Two L1 spells suited to elemental/fire Channeler flavor.
    # Count matches prepared_by_level["1"] = 2.
    starting_prepared:
      - cinder_lance
      - river_step
    partial: false
  abilities:
    - name: "Elemental Gate"
      genre_description: >-
        You open yourself to the element — not as a weapon but as a
        threshold. The force passes through you rather than from you,
        which means the cost is borne in the body, not the will. A
        Channeler who holds the gate open too long pays in bruises and
        burns even when the magic lands perfectly.
      mechanical_effect: >-
        When you cast a spell or use an elemental_burst beat, you may
        accept 1 System Strain to boost the effect by one step (damage
        die up one size, or duration extended one round). Each activation
        costs Effort (Effort-1). Cannot activate if Effort is 0.
      involuntary: false
    - name: "Elemental Attunement"
      genre_description: >-
        Channelers develop a persistent awareness of the element they
        channel most often. The fire on the other side of the wall is
        as readable as a text; the current beneath the bridge speaks in
        pressure and pull. This is not clairvoyance — it is intimacy.
      mechanical_effect: >-
        Once per scene, sense the presence and rough condition of your
        primary element within far range without casting a spell. If
        enemies are concealed by fire, smoke, water, or stone, you are
        not surprised by them.
      involuntary: false

# ── Caster archetype ────────────────────────────────────────────────────────

- id: spirit_medium
  display_name: Spirit Medium
  rpg_role: control
  jungian_default: sage
  minimum_score: 9
  kit_table: spirit_medium_kit
  prime_requisite: Spirit
  flavor: >-
    Spirit Mediums negotiate the border between the living world and
    the ancestral one, trading favors with things that remember before
    the empire and listening to voices that speak in feeling rather
    than words. They do not command the spirit world; they have an
    ongoing and occasionally contentious relationship with it.
  encounter_beat_choices:
    - strike
    - cast_spell
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - blend
    - vanish
  magic_access: wwn
  # governing_attr: WISDOM → Spirit (pack flavor). See file-level header.
  wwn_magic:
    effort_sources:
      - source: spirit_medium
        governing_attr: WISDOM
        relevant_skill: Commune
        starting_skill_level: 1
    casts_per_day_by_level:
      "1": 2
    max_spell_level_by_level:
      "1": 1
    prepared_by_level:
      "1": 2
    # Two L1 spells suited to spirit/control Medium flavor.
    # Count matches prepared_by_level["1"] = 2.
    starting_prepared:
      - still_the_breath
      - ember_veil
    partial: false
  abilities:
    - name: "Spirit Passage"
      genre_description: >-
        The Medium does not cast spells so much as broker them — each
        prepared form was bargained out of the spirit that originally
        held it, and casting is a brief loan, not a purchase. When the
        spell releases, the spirit reclaims whatever was lent. The
        Medium is the contract, not the power.
      mechanical_effect: >-
        When you cast a prepared spell, you may spend 1 Effort (Effort-1)
        to suppress the spell's evasion or physical save requirement —
        the spirit finds a gap in the target's defenses. One use per
        scene, only on L1 spells while at character level 1.
      involuntary: false
    - name: "Spirit Sense"
      genre_description: >-
        The dead do not keep secrets from a Medium who knows how to
        listen. Lingering presences, places where something ended badly,
        objects that carry heavy emotional residue — these register as
        a low-grade pressure behind the eyes and a faint change in the
        light.
      mechanical_effect: >-
        Passively detect spirits, restless dead, or strong emotional
        impressions within near range without rolling. Counts as having
        asked one question of any spirit in range when a scene begins.
        Cannot override a spirit that actively refuses contact.
      involuntary: false

# ── Vowed archetype (Effort-only Arts, no cast tables) ──────────────────────

- id: martial_artist
  display_name: Martial Artist
  rpg_role: skirmisher
  jungian_default: warrior
  minimum_score: 9
  kit_table: martial_artist_kit
  prime_requisite: Agility
  flavor: >-
    The Martial Artist has turned the body into the argument. Each
    technique is a sentence; a full exchange is a conversation held at
    the speed of muscle memory and breath. They do not use elemental
    energy so much as route it — through footwork, through breath
    control, through the thousand repetitions that have made certain
    patterns cheaper to run than ordinary motion.
  encounter_beat_choices:
    - strike
    - elemental_burst
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - leap
    - vanish
  # No cast_spell — Vowed archetype uses Effort for Arts only, not spells.
  # No casts_per_day / max_spell_level / prepared_by_level / starting_prepared.
  # SpellcastingState is seeded as None; Effort pool is seeded via effort_sources.
  magic_access: wwn
  # governing_attr: WISDOM → Spirit (pack flavor). Vowed Arts channel
  # elemental resonance through physical technique, governed by Spirit
  # (the practitioner's inner harmony). WISDOM is the canonical key that
  # maps to Spirit in rules.yaml attribute_map.
  wwn_magic:
    effort_sources:
      - source: vowed
        governing_attr: WISDOM
        relevant_skill: Combat
        starting_skill_level: 1
    partial: false
  abilities:
    - name: "Iron Body"
      genre_description: >-
        Years of practice have conditioned the Martial Artist's body
        to take impact in ways that would hospitalize anyone else. A
        blow that should fold them shifts their stance. A grip that
        should break a joint finds the joint has been prepared for
        exactly this grip. The body has become a practiced argument
        against being stopped.
      mechanical_effect: >-
        Once per confrontation, spend 1 Effort (Effort-1) to convert
        an incoming strike that would reduce your HP to a guard beat
        result instead — you take reduced damage as if you had selected
        guard this round. Declared before the damage is applied.
      involuntary: false

# ── Warrior archetype ────────────────────────────────────────────────────────

- id: guardian
  display_name: Guardian
  rpg_role: tank
  jungian_default: warrior
  minimum_score: 9
  kit_table: guardian_kit
  prime_requisite: Strength
  flavor: >-
    Guardians do not fight because they want to hurt someone. They
    fight because something they care about is standing behind them
    and they have decided the fight stops here. This gives them a
    quality that is difficult to explain to people who have not
    encountered it: a settled quality, an absence of urgency about
    their own survival that makes them very hard to move.
  encounter_beat_choices:
    - strike
    - elemental_burst
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - vanish
  # WWN Warrior archetype. No magic_access, no wwn_magic.
  # warrior: true gates Killing Blow + Veteran's Luck dispatch seams
  # in sidequest-server dice.py (Task 9/10 wiring).
  warrior: true
  abilities:
    - name: "Killing Blow"
      genre_description: >-
        A Guardian who has your measure will, at the moment the fight
        pivots, put everything available into a single committed strike.
        Not an act of rage — an act of completion. The body executes
        what the mind decided three moves ago.
      mechanical_effect: >-
        Once per scene, on a successful strike beat, deal bonus damage
        equal to half your character level (minimum 1, rounded down).
        This is the WWN Warrior Killing Blow (SRD §1.5.18). Requires
        warrior: true.
      involuntary: false
    - name: "Veteran's Luck"
      genre_description: >-
        Guardians develop a quality that looks from the outside like
        luck and is in fact the accumulated consequence of having
        survived situations that were statistically unwinnable. When
        the odds are against them, something shifts slightly in the
        wrong direction for whatever is trying to kill them.
      mechanical_effect: >-
        Once per scene, convert a missed attack that targeted you into
        a near-miss instead — you suffer no damage or secondary effect
        from the attack. This is the WWN Warrior Veteran's Luck
        (SRD §1.5.18). Requires warrior: true.
      involuntary: false

# ── Expert archetype ─────────────────────────────────────────────────────────

- id: scholar
  display_name: Scholar
  rpg_role: support
  jungian_default: sage
  minimum_score: 9
  kit_table: scholar_kit
  prime_requisite: Insight
  flavor: >-
    Scholars have read more texts about the elemental traditions than
    most practitioners have had conversations about them. Their value
    in a confrontation is not raw power but rather the capacity to
    know — to recognize the technique being deployed, predict the
    next three moves, and reframe the situation in terms that make
    the others in the room more effective.
  encounter_beat_choices:
    - strike
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - blend
    - vanish
  abilities:
    - name: "Lore Advantage"
      genre_description: >-
        When the Scholar recognizes what they are dealing with — an
        obscure technique, a creature type, a political situation — they
        do not just know the theory. They know the theory's gap. The
        weakness the practitioner assumes you won't know about because
        it was not in the mainstream texts. The Scholar was reading the
        wrong texts on purpose.
      mechanical_effect: >-
        Once per confrontation, identify a single weakness or
        exploitable tag on the opponent (spend your beat in study).
        The next strike that targets that tag resolves at advantage.
        Works against any opponent with a discernible technique or
        pattern — not random violence.
      involuntary: false

# ── Expert archetype ─────────────────────────────────────────────────────────

- id: wanderer
  display_name: Wanderer
  rpg_role: skirmisher
  jungian_default: explorer
  minimum_score: 9
  kit_table: wanderer_kit
  prime_requisite: Agility
  flavor: >-
    Wanderers have been places and come back from them, which gives
    their confidence a different texture than the confidence of someone
    who has only trained. They read terrain the way other people read
    faces, find exits in rooms where exits are not obvious, and have a
    working relationship with luck that feels earned because it was.
  encounter_beat_choices:
    - strike
    - elemental_burst
    - guard
    - yield
    - persuade
    - concede_point
    - walk_away
    - dash
    - leap
    - blend
    - vanish
  abilities:
    - name: "Open Road"
      genre_description: >-
        The Wanderer has left enough places quickly to have developed
        a feel for when a situation is about to become untenable. Not
        precognition — pattern recognition. Every situation has a
        moment before it goes wrong, and the Wanderer has been
        standing in enough of those moments to recognize the one
        they are standing in now.
      mechanical_effect: >-
        Once per scene, declare an escape route before a confrontation
        becomes violent. If combat starts, you and one ally may take a
        push beat (yield or vanish) at advantage on the first round.
        Outside combat, you automatically locate the nearest exit or
        concealment within a scene-scale space.
      involuntary: false
