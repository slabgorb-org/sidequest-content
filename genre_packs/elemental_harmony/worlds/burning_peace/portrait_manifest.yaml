  # ═══════════════════════════════════════════════════════════════
  # COMPANION CREATURES (5)
  # Reusable spirit-animal templates — the player's pet at the table.
  # The same five species ship across many worlds; these read in
  # burning_peace's discipline: a few decisive ink-outlined strokes,
  # flat color washes on open paper, poised and weightless.
  # ═══════════════════════════════════════════════════════════════

  - id: companion_cat
    name: Cat
    role: A small temple cat that holds court like the abbot's superior
    type: companion_creature
    appearance: >-
      A house cat seated bolt upright on a swept stone step, forepaws
      placed exactly together, spine drawn vertical in a single confident
      brush line. Short clean fur, indigo-grey along the back washing pale
      at the chest. Chin tilted up, eyes half-lidded over a small straight
      nose, looking just past the viewer down the length of its whiskers.
      One long tail curled around the paws and laid to a precise point.
      Ears upright, unhurried, the whole body held in one composed vertical
      line.
    culture_aesthetic: >-
      Open pale paper ground with one swept stone step; indigo-grey wash on
      the fur, a single vermillion thread at the collar.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_owl
    name: Owl
    role: A perched owl forever certain it knows the matter better than you
    type: companion_creature
    appearance: >-
      A round-bodied owl perched on a bare branch, body leaned forward and
      head tilted low so it peers down the line of a hooked beak. Brow
      feathers drawn up into two raised tufts over wide pale-ringed eyes
      fixed in close scrutiny. Neat barred plumage in soft grey and warm
      ochre, every feather laid in orderly strokes. One feathered talon
      lifted off the perch and held aloft mid-gesture, as if pausing to
      correct a small error. The lifted talon hangs there unmoving, the
      head still tilted low down the beak.
    culture_aesthetic: >-
      Open paper with one bare ink branch; grey-and-ochre washes on the
      plumage, a thread of gold leaf ringing each eye.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_raven
    name: Raven
    role: A raven keeping some small bright secret it will not surrender
    type: companion_creature
    appearance: >-
      A glossy black raven hunched low on a mossed rock, shoulders drawn
      up and head cocked hard to one side. A single bright eye catches the
      light in a sidelong sliver, angled back at the viewer. A small shiny
      coin pinned beneath one curled claw, half-hidden by the toes. Heavy
      wedge bill closed, throat hackles ruffled forward into a conspiratorial
      cowl. Wing feathers laid in long decisive black strokes with a faint
      indigo sheen. The cocked head and clamped wings keep the crouch drawn
      tight over the hidden coin.
    culture_aesthetic: >-
      Bare pale paper with one mossed grey rock; near-solid black wash on
      the plumage, a single bright gold-leaf glint at the hidden coin.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_toad
    name: Toad
    role: A toad of perfect patience, waiting only for the next insect
    type: companion_creature
    appearance: >-
      A broad squat toad settled low and flat on a wet flagstone, body
      pooled to the ground with no neck and no haste. Warm olive-brown
      hide stippled with darker warts, throat sac slack and low. Wide mouth
      shut in a long level closed line, heavy lids drooped to two thin
      slits over the eyes. Stubby forelimbs planted square beneath. A small
      beetle resting on the stone a hand's-width from the snout, plainly
      noted and not yet worth the effort. Nothing about it moves; it sits
      as fixed as the flagstone beneath it.
    culture_aesthetic: >-
      Wet grey flagstone on open paper; olive-brown wash on the hide, a
      single vermillion dot on the small beetle.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_goat
    name: Goat
    role: A goat that argues with the tether and crops the meditation garden to gravel
    type: companion_creature
    appearance: >-
      A short-haired goat planted in a low square stance, all four legs
      braced and set wide, head lowered so the two curved horns tip forward
      toward the viewer. Coarse cream-and-grey coat laid in a few blunt
      strokes, a wisp of beard at the chin. Long jaw worked sideways
      mid-chew, a torn green leaf caught at the corner of the mouth.
      Rectangular slot pupils set in flat amber eyes, staring level and
      unblinking. Ears out sideways, tail flat, every leg locked square
      against being moved.
    culture_aesthetic: >-
      Open paper with a swept ink groundline; cream-and-grey wash on the
      coat, one vermillion fleck on the torn leaf.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.
