# Character portraits for Burning Peace
# Visual descriptions for Flux portrait generation
# Edo-period Japan meets wuxia aesthetics — ink-wash texture,
# natural light, textile detail, lived-in warrior elegance

characters:
  - name: Master Sōgen
    role: Temple Guardian and Martial Arts Teacher
    type: npc_major
    appearance: >-
      A man in his sixties with a shaved head and a face creased by sun
      and laughter in equal measure. Dark bronze skin weathered by decades
      of outdoor training. A broken nose set slightly crooked, hands thick
      with calluses, bare feet on packed earth. Wears a faded indigo gi
      with the sleeves torn off at the shoulder, revealing arms roped with
      lean muscle. A simple rope belt. Stands with the stillness of someone
      who could move very quickly and chooses not to.
    culture_aesthetic: >-
      Temple tradition — austere, functional, well-worn. The gi is patched
      and faded from years of washing. No ornament, no rank insignia. His
      authority comes from posture, not attire.
    element_visual: >-
      Bare feet on stone, torn sleeves showing scarred forearms, a wooden
      practice sword leaning against the wall behind him, morning light
      through a paper screen.

  - name: Mei-Lin of the Monsoon Court
    role: Travelling Diplomat and Spirit Medium
    type: npc_major
    appearance: >-
      A woman in her thirties with long black hair pinned up with jade
      sticks, one strand perpetually escaping across her face. Warm brown
      skin, sharp intelligent eyes that narrow when she's reading someone.
      Tall and lean, moves with the deliberate grace of someone trained
      in both etiquette and combat. Wears layered silk robes in deep
      green and storm-grey, travel-stained at the hem. A spirit bell on
      a cord at her wrist. Ink stains on her right hand.
    culture_aesthetic: >-
      Monsoon Court formal — layered silks, jade accessories, calligraphy
      as both art and weapon. The travel stains mark her as a diplomat
      in motion, not a courtier in residence.
    element_visual: >-
      Jade hair sticks, spirit bell on wrist, ink-stained fingers, silk
      robes with rain-grey lining visible where the wind catches the hem.

  - name: Iron Ox Chen
    role: Blacksmith and Reluctant Village Protector
    type: npc_supporting
    appearance: >-
      A massive man in his forties with arms like tree limbs and a face
      that defaulted to stern twenty years ago and never changed. Dark
      skin sheened with forge-sweat, a thick beard braided with iron
      rings. Wears a leather apron over bare chest, loose trousers, and
      sandals that look too small for his feet. Burn scars on his hands
      and forearms are old enough to be smooth and silver.
    culture_aesthetic: >-
      Iron Peaks artisan class — leather, iron, function. The forge is
      his temple and the hammer is his scripture.
    element_visual: >-
      Leather forge apron, braided beard with iron rings, tongs in one
      hand, the orange glow of coals reflected in his face.

  - name: Sparrow
    role: Young Thief and Accidental Student
    type: npc_supporting
    appearance: >-
      A child of fourteen with a narrow face, quick dark eyes, and hair
      chopped short with a knife. Thin and fast, with scraped knees and
      fingers stained with stolen food. Wears a patchwork of scavenged
      clothing — a merchant's discarded vest over a farmer's undershirt,
      rope belt, bare feet calloused hard as leather. A stolen calligraphy
      brush tucked behind one ear.
    culture_aesthetic: >-
      Street orphan — no culture claims them, every culture's castoffs
      clothe them. The stolen brush hints at ambition above station.
    element_visual: >-
      Calligraphy brush behind ear, bare feet, oversized vest, eyes that
      are already calculating the fastest exit.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS (18)
  # Pre-generated sample faces for the chargen portrait chooser.
  # portrait-in-POI convention: each entry carries a `backdrop_poi`
  # naming a real rendered POI slug (assets/poi/*.png on R2); the
  # daemon's `portrait_in_location` preset plants the subject inside
  # that POI with a long telephoto lens and shallow depth-of-field
  # (montage guard). Naming: id `picker_<culture>_<short_role>_<sex>nn`.
  #
  # DISCIPLINE: `appearance` is a folded scalar describing PHYSICAL
  # face / upper-body ONLY — montage-safe head-and-shoulders. Do NOT
  # describe the POI scene here; the backdrop is composed from
  # `backdrop_poi`. `culture` = culture filename stem (cultures/*.yaml:
  # burning_peace_ember_isles, emishi_northern_people, nanban_visitors).
  # `archetype` = real archetype name (world archetypes.yaml + pack
  # archetypes.yaml).
  #
  # Allocation: 18 faces, 9M / 9F across all 3 cultures, weighted
  # toward the populous Ember Isles fire-culture mainstream (12),
  # then Emishi northern people (3) and Nanban visitors (3).
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Burning Peace Ember Isles ─────────────────────────

