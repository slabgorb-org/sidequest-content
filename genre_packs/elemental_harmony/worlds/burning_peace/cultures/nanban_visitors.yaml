name: Nanban Visitors
summary: Foreign merchants and missionaries from the Lotus Provinces and beyond
description: Foreign merchants and missionaries from the Lotus Provinces and beyond
  — their names follow different patterns, marking them as outsiders in every interaction.
  Based on Portuguese and Southern European naming.
