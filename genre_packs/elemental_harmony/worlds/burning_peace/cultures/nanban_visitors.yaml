    - Fernão
    - Diogo
    - António
    - Maria
    - Isabel
    - Catarina
    - Ana
    - Beatriz
    - Leonor
  family_name:
    word_list:
    - Ferreira
    - Cardoso
    - Valignano
    - Almeida
    - Rodrigues
    - Pinto
    - Coutinho
    - Tavares
    - Mendes
    - Correia
  title:
    word_list:
    - Padre
    - Capitão
    - Senhor
    - Senhora
    - Irmão
person_patterns:
- '{given_name} {family_name}'
- '{title} {family_name}'
- '{title} {given_name}'
place_patterns:
- '{family_name} {given_name}'
