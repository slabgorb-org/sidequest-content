# Seed tropes for elemental_harmony/burning_peace — world-tier deck (Epic 94:
# genre is the rulebook only; flavor lives in the world). Short-arc narrative
# hooks dealt at session start and on lull/engagement draws, expiring after
# lifespan_turns and lingering as ghosts for later callback (ADR-018, ADR-128).
# Seeds are baited hooks (ADR-014 diamonds-and-coal) — deliberately vague; the
# narrator threads an engaged seed into whatever the road and the Peace demand.
#
# Without this file burning_peace drew from an empty deck and the lull engine
# declined `none_available` on every quiet turn, so the narrator filled silence
# by inventing crowds of NPCs (the bug this fixes; the engine reads world-first
# per websocket_session_handler `_seed_source = worlds.get(slug) or pack`).
#
# Pitched to THIS world specifically and FINER than wuxia/xianxia cliche — no
# "a kung-fu master appears." Every seed reference-stacks on burning_peace canon:
# the alternate-attendance hostage system and the Hakone checkpoint; the
# image-stepping test and the Hidden Way's step-and-weep; the three lost arts of
# the Sealing (Shimora storm-fire, the Kurogane volcano-forge, Amakusa Shion's
# four-element barrier); named monuments (the Kneeling Stone, the Victory Pillars,
# the Melted Walls of Shimabara, the Burned Wharves of Sakai, the Coastal Fire
# Beacons); the Metsuke inspectors; Mount Kasai's rumble and the yamabushi who
# read it. Register: Tokugawa-era jidaigeki under enforced order — administrators
# who forgot what their fire was for, grudges three generations deep, honor and
# law in genuine conflict, the spirit world pressing close. Lethality is real but
# the violence is duty and consequence, not splatter. Keep it quiet, formal, and
# watched; the censor reads everything, so warnings travel in metaphor.

- id: burning_peace_attendance_palanquin
  name: A Hostage Travels Home Without Leave
  description: >-
    A curtained palanquin moves along the Tōkaidō against the season — an outer
    lord's relation, one of the families held in Edo under alternate attendance,
    traveling the wrong direction at the wrong time. The bearers carry no
    domain crest and answer no questions. Someone has decided a hostage is worth
    more at home than the Shogunate's goodwill is worth keeping.
  flavor_tags: [politics, authority, peril, road]
  lifespan_turns: 6
  delivery_hints:
    - A posting-station register shows a high-status party that paid to have its names left unwritten
    - The palanquin's escort changes horses by night and avoids the Hakone road where papers are read closely
    - A Metsuke inspector at the teahouse asks, too lightly, whether anyone has seen a covered litter heading south
  narrative_hint: >-
    SOUL — every choice a consequence. To shelter the palanquin is to help a
    domain break faith with the Throne; to report it is to hand a child back to
    its captors. Let the players learn whose family it is only after they have
    already helped or hindered, so the side they took has a face.

- id: burning_peace_step_and_weep
  name: The Image-Stepping Test, and One Who Will Not Falter
  description: >-
    The village is gathered for the annual inspection, each soul made to set a
    bare foot on the sacred image to prove they do not hold the foreign faith.
    The line moves. The temple clerk marks his scroll. And one person in that
    line steps cleanly on the image with dry eyes and a steady mouth — too
    composed, the way only the truly devoted have learned to be.
  flavor_tags: [faith, authority, peril, underground]
  lifespan_turns: 7
  delivery_hints:
    - A neighbor steps on the image and weeps with relief; the next steps on it and does not, and the clerk does not notice the difference
    - A small object passes between two hands in the waiting line — a knotted cord, a plain coin turned a certain way
    - The temple clerk is new, zealous, and counting how many in this village wept and how many did not
  narrative_hint: >-
    SOUL — meaningful choice over safe spectacle. The Hidden Way survives by
    separating the act from the belief. Let the players notice the dry-eyed one
    before they understand what noticing costs, and make the choice to look away,
    to warn, or to report cost them something internal either way.

- id: burning_peace_storm_fire_scroll
  name: A Lost Form Surfaces Where It Should Not
  description: >-
    A channeler in a backwater dojo is teaching a form that should have died at
    Sekimori — Shimora storm-fire, flame married to weather, burned out of the
    world when the western war-masters were trapped in the Ash Fields of
    Nishigawa. Either the technique was written down after all, or someone has
    reconstructed it, and either way its mere existence is a capital matter the
    Metsuke would pay well to learn of.
  flavor_tags: [martial, secret, politics, rival]
  lifespan_turns: 6
  delivery_hints:
    - A demonstration goes slightly wrong — a clear sky spits a single thread of lightning the channeler did not mean to call
    - An old retainer recognizes the opening stance and goes white, because he saw it last on a battlefield three generations gone
    - A quiet patron has been funding the dojo and asks no fee, only that the form be taught to certain students and not others
  narrative_hint: >-
    SOUL — the world reacts to what the players do. A forbidden art is leverage:
    the outer lords want it, the Shogunate wants it gone, and the teacher wants
    only to finish what the Shimora started. Let the players' interest mark them,
    and let whoever they tell — or don't — reshape who comes hunting.

- id: burning_peace_kneeling_stone_summons
  name: A Summons to Stand Upon the Kneeling Stone
  description: >-
    Word comes that a lord the players know — or a household they have touched —
    has been called to audience at Edo Castle, made to stand upon the Kneeling
    Stone where the Kurogane prostrated himself eighty years ago. Such summons
    are rarely about what they claim. Someone wants this lord humbled in the
    audience hall, on basalt worn smooth by three generations of the conquered,
    and wants witnesses to see it.
  flavor_tags: [authority, politics, honor, reversal]
  lifespan_turns: 5
  delivery_hints:
    - The summons praises the lord's loyalty in language so fulsome that everyone reading it understands the opposite is meant
    - A rival house has been seen entering the castle by a side gate the week before the audience is set
    - The lord's senior retainer quietly puts the household's affairs in order, the way a man does who is not sure he is coming back
  narrative_hint: >-
    SOUL — consequence and reaction over spectacle. The Stone is humiliation made
    architecture. Let the players carry a message, a warning, or a bribe toward
    Edo, and let the audience resolve not in violence but in a man's face as he
    kneels — and in what he decides to do about it afterward.

- id: burning_peace_yamabushi_descending
  name: A Mountain Ascetic Comes Down Who Should Not
  description: >-
    A yamabushi has left the high hermitages of Mount Kasai and come down to the
    posting road, and the ascetics do not abandon the mountain for small reasons.
    He will not say plainly what he has seen, only that the wards are thinning and
    the fire is answering things it should not. The Shogunate's official word is
    that the rumbling is nothing. The ascetic's presence on the lowland road says
    otherwise to anyone who knows how to read it.
  flavor_tags: [supernatural, environmental, prophecy, road]
  lifespan_turns: 8
  delivery_hints:
    - The yamabushi speaks in temple-metaphor that passes the censors but carries a warning to those who can hear it
    - The hot springs along this stretch have run too hot this week; a traveler shows a scalded hand
    - A second ascetic was expected behind him on the road and has not arrived, and the first will not discuss why
  narrative_hint: >-
    SOUL — the world is alive and reacts. The mountain is the slow doom under
    everything; the yamabushi is its early warning. Let the players dismiss him
    with the officials or believe him against the official line, and let the
    springs, the spirits, and the tremors confirm which choice was wise.

- id: burning_peace_leaf_money_writ
  name: A Writ of Safe Passage That May Be Leaves by Dawn
  description: >-
    Someone offers the party a sealed travel pass — exactly the document needed
    to clear the next checkpoint without a search — and asks a small favor in
    return. The seal looks correct. The paper is good. But this is a road where a
    bake-danuki can sell you a fine scabbard that turns to river-mud at first
    light, and the giver smiles a half-beat too long before they let the document
    go.
  flavor_tags: [intrigue, road, supernatural, bargain]
  lifespan_turns: 5
  delivery_hints:
    - The favor asked seems trivial and is described with great and unnecessary warmth
    - A drunk at the teahouse swears the same generous stranger gave him a purse of coin last month that he woke to find full of dead leaves
    - The checkpoint ahead is the strict kind, and the official there knows real Shogunate seals by feel as much as by sight
  narrative_hint: >-
    SOUL — meaningful choice with teeth. The pass may be a true gift, a forgery
    that damns whoever presents it, or a danuki's leaf-trick that betrays them at
    the gate. Don't resolve which until the players commit to using it; let the
    convenience be the bait and the checkpoint be where the bill comes due.

- id: burning_peace_forty_seventh_grave
  name: A Grave Tended by Someone Who Should Be Far Away
  description: >-
    A retainer's grave in a quiet temple yard has been freshly swept and given
    incense, though the man's lord was stripped of his domain and his people
    scattered years ago. The one tending it is too disciplined in his bearing to
    be the masterless drifter he dresses as. Loyalty that outlives a lord and a
    domain is the kind that ends, eventually, in a raid and a row of surrenders
    at the executioner's ground.
  flavor_tags: [honor, revenge, underground, moral_dilemma]
  lifespan_turns: 6
  delivery_hints:
    - The grave-tender's hands are a swordsman's, callused exactly where a wrapped hilt sits, though he carries only a pilgrim's staff
    - The temple priest mentions that several such drifters have visited this same grave in the past season, never together
    - A Metsuke agent has been asking the priest, gently, for the names of everyone who has come to pray here
  narrative_hint: >-
    SOUL — consequence over spectacle; honor and law in true conflict. These are
    the disciplined dead-enders of a wronged house, gathering for a reckoning they
    intend to answer for with their lives. Let the players be asked a small favor
    that is not small, and let helping or refusing decide whether the raid finds
    them complicit, witness, or in its path.

- id: burning_peace_beacon_dark
  name: A Fire Beacon That Failed to Light
  description: >-
    One tower in the Coastal Fire Beacon chain stayed dark the night an
    unauthorized ship was rumored off the Forbidden Coast — a channeler's flame
    that should ignite the next beacon in seconds, simply absent. A beacon does
    not fail by accident; it fails because its keeper was paid, or threatened, or
    is no longer who the Shogunate believes him to be. Someone wanted a window of
    darkness on the perimeter, and got one.
  flavor_tags: [intrigue, authority, peril, underground]
  lifespan_turns: 6
  delivery_hints:
    - The beacon-keeper has new money he cannot account for, or a new fear he will not name
    - Smugglers in the Burned Wharves of Sakai speak of a delivery that came ashore the night the tower stayed cold
    - The Metsuke have replaced the keeper already, and are now quietly asking who he spoke to in the fortnight before
  narrative_hint: >-
    SOUL — the world reacts to what the players touch. A dark beacon is a hole in
    the Sealing, and through it comes contraband, foreign teachers, or worse. Let
    the players trace the window of darkness toward whoever bought it, and let
    naming them — or shielding them — pull the perimeter's whole apparatus down on
    one side or the other.

- id: burning_peace_cool_air_pilgrim
  name: A Pilgrim Bound for the Melted Walls
  description: >-
    A traveler is making quiet pilgrimage toward the Melted Walls of Shimabara,
    where thirty thousand of the faithful burned and the air inside the fused
    fortress is said to stay cold the year round. They carry flowers, the kind
    left at the ruin each spring by hands no one has ever caught. To be seen on
    that road is to be marked; to leave flowers there is to be marked as
    something the Shogunate executes people for being.
  flavor_tags: [faith, mourning, underground, peril]
  lifespan_turns: 7
  delivery_hints:
    - The pilgrim travels light and reverent and flinches from temple inspectors the way the guilty and the grieving both do
    - They know a verse of mourning that is not from any sanctioned rite, and sing it only when they think themselves alone
    - A fellow traveler on the same road watches the pilgrim a little too steadily, and is not dressed for pilgrimage
  narrative_hint: >-
    SOUL — meaningful choice over safe spectacle. Amakusa Shion's martyrdom is the
    Hidden Way's beating heart, and the road to Shimabara is a road of the
    faithful and the informers who hunt them. Let the players walk beside the
    pilgrim before they know which they are sharing the road with, and let the
    watcher behind decide how dangerous the company has become.

- id: burning_peace_candle_extinguished
  name: A Candle Snuffed From Across the Room
  description: >-
    At a teahouse a flame goes out — a single candle on a far table, pinched
    dark without a draft, without a hand near it, between one breath and the next.
    Only a handful of channelers alive have control that fine; one of them runs
    the Iga shadow school and is a rumor more than a man. Someone in this room
    just signed a contract, sent a message, or marked a target, and did it so
    quietly that only the candle noticed.
  flavor_tags: [intrigue, martial, secret, peril]
  lifespan_turns: 5
  delivery_hints:
    - No one else seems to have seen the candle die; the conversation at that far table does not pause
    - A traveler the players had taken for a merchant settles their account and leaves within the minute, unhurried
    - The teahouse keeper, asked who sat at that table, gives a name that the keeper plainly does not believe is real
  narrative_hint: >-
    SOUL — consequence rippling from a small thing. The Shadow Schools take
    contracts from every side and answer to none; that snuffed flame is a job
    beginning, and the players have witnessed it without knowing the target. Let
    them choose to follow the departing 'merchant' or let it lie, and let the
    contract's mark turn out to be someone they will wish they had warned.

- id: burning_peace_censored_poem
  name: A Poem That Passed the Censor and Should Not Have
  description: >-
    A verse is circulating — pinned at a shrine, copied at a teahouse, recited by
    a child who does not understand it — gentle and seasonal on its surface, all
    plum blossom and mountain mist. But read with the right ear it names a date,
    a domain, and a warning, threaded past the Shogunate's readers in metaphor.
    Someone with reach is using the poets' oldest trick to move a message the
    Metsuke would kill to intercept.
  flavor_tags: [intrigue, politics, prophecy, underground]
  lifespan_turns: 6
  delivery_hints:
    - Three people recite the same new poem in three towns in the same week, which is not how poems usually travel
    - A retired official reads it once, grows very still, and burns his copy in the teahouse brazier
    - A Metsuke clerk has begun collecting copies and comparing the handwriting, having sensed something he cannot yet name
  narrative_hint: >-
    SOUL — the world is alive and speaking. Under enforced order, warnings travel
    as art. Let the players hear the poem before they crack it, let the cracking
    place them ahead of a coming crisis — a raid, a rebellion, the mountain — and
    let knowing the message early make them a party someone now needs to find.
