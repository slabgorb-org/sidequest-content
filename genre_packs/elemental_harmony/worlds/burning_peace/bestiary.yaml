# Burning Peace — world bestiary (burning_peace_bestiary)
#
# World-tier roster for the elemental_harmony pack. The pack ships NO
# genre-level bestiary, so this file is the full populated stat-block set
# encountergen samples for the Monster Manual encounters of the Ember Isles
# under the Tokigane Burning Peace (ADR-140: the genre is the rulebook, the
# world owns the cast). Narrative layers (OCEAN, visual prompt) are composed at
# generation time; image medium/style lives in visual_style.yaml, never in a
# per-entity appearance field.
#
# WWN ruleset module (see ../../rules.yaml: ruleset: wwn). Generic OSR stat
# lines: level == HD, hp == the WWN ladder table (avg 4.5/HD rounded — a TABLE,
# not a formula), ascending AC, attack_bonus == level, morale on the 2d6 ladder
# (12 = Fearless / auto-pass), save == 15 − floor(level/2).
#
# ════════════════════════════════════════════════════════════════════
#  BESTIARY-CURATION PROVENANCE  (recipe: ../../../../docs/bestiary-curation-recipe.md)
# ════════════════════════════════════════════════════════════════════
#  SOURCE: the SETTING ITSELF, not the D&D SRD. 25 rows of Ember-Isles fauna,
#    sworn martial orders, and Japanese-myth yōkai/kami (corpus/monsters.yaml),
#    rendered setting-true to the Edo/sengoku Burning Peace.
#
#  GATE 1 — world_register.yaml genre-truth, applied against corpus/monsters
#    .yaml: kept 25, dropped 0. The corpus is wholly Burning-Peace setting-true,
#    so nothing is culled — that clean pass IS the fidelity proof. The deny
#    lists (Western dungeon-fantasy types / tags / name_globs: dragons, demons,
#    goblins, owlbears, liches, vampires, the fairy-tale fey …) are the firewall
#    against a future author padding the isles with the SRD menagerie, not
#    active culls here.   [tool: bestiary_curator]
#  GATE 2 — tone curation ("wuxia/elemental, mannered, mournful, lethal; never
#    comic, never cute"): HAND pass. No GATE-1 survivor removed for tone — every
#    row is setting-true to the Tōkaidō-at-dusk register. The yōkai are rendered
#    as folk-myth dread (yūrei bound to a grievance, the starved battle-dead,
#    the lantern-lure over black water), never as joke-monsters.
#
#  CONVERSION — WWN ladder via bestiary_curator: level assigned by CR band
#    (L1 road-vermin & lesser lures → L8 the named river-leviathan and the
#    mountain oni; the isles top out modestly — no dragon-tier inflation);
#    hp/save/attack_bonus VERBATIM off the ladder (hp table; save 15 − level//2;
#    attack_bonus == level). skill follows the ladder band, EXCEPT the mindless
#    cohort — raw elemental kami, animated-stone constructs, and the will-less
#    battle-dead — which take skill 0 with morale 12 / Fearless (the recipe's
#    beneath_sunden & barsoom treatment). AC and morale are archetype-tuned by
#    hand. Prose (description, abilities, damage, move, role) authored here.
#  PRESERVATION (ADR-140): this pass RE-LADDERED the world's existing 25-entry
#    roster onto the verbatim ladder — it did not clobber it. The prior file ran
#    attack_bonus one-or-more high (e.g. battlefield ghost +6 at L4, leviathan
#    +10 at L8) and put L5 hp at 23; both are corrected here. All 25 original
#    entries survive with their prose, abilities, damage, move, AC, and morale
#    intact. Numbers are ladder-derived, NEVER hand-balanced (SOUL: "Bind the
#    Ruleset, Don't Balance It").
#
#  DIAMONDS (ADR-014, the illustrated capstones — flagged, not gate-exempt):
#    oni of the Red Mountain · the named river-leviathan · the nue · the
#    jorōgumo · the karasu-tengu swordmaster. world_register marquee is empty:
#    every corpus row is admissible under allow_types, so nothing needs rescue
#    from the deny gate.
#
#  SIBLING: shares its allow/deny algebra and creature philosophy with
#    elemental_harmony/shattered_accord (pan-East-Asian); each world carries its
#    own institutional vocabulary over the shared gate.
#  VALIDATION: load_genre_pack PASS; validate pack PASS.
# ════════════════════════════════════════════════════════════════════
entries:

  # ── LOW BAND (L1-2) — road vermin, mooks, lesser lures & lesser spirits ──
