      - "Grave-stench — a creature within 10 ft. must save or be stunned for a round by the reek of the unburied"
      - "Clutching bite — a creature it seizes must save or be paralyzed while it gnaws"
    description: >-
      A small horror knit from the finger-bones and jaws of soldiers who
      starved on the losing side of the civil war, left where they fell. It
      clacks and gnashes along the old battlefields, an arm's-length scrap
      of the vast bone-giant the priests pray will never finish forming.
  - id: battlefield_ghost
