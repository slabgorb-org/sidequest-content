      - "Wind-step — when missed by a melee attack it may dart away on the gust, ending out of reach"
      - "Mountain disdain — those who fight it on its own peak make their attacks at a penalty, mocked and unbalanced by its taunts"
    description: >-
      A crow-headed swordsman in the robes of a mountain ascetic, perched
      where the cedar forest climbs the flank of Mount Kasai. It taught
      swordplay to the dynasty's founders, or so it claims, and it has not
      forgiven how thoroughly they have forgotten the lesson.
  - id: rogue_earth_spirit
