      A palace soldier in full lamellar with a banner-spear, drilled to
      hold formation through fire and flood alike.
  - id: noppera_wraith
    name: Noppera-bō
    level: 3
    hp: 14
    armor_class: 13
    attack_bonus: 3
    damage: "1d6"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 14
    role: faceless draining spirit
    tags: [spirit, undead, mid]
