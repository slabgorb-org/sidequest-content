    tags: [beast, mid]
    abilities:
      - "Pounce from the dark — with the cave's blackness for cover its first strike comes unseen; a surprised creature is bowled sprawling and rent"
      - "Soundless on the karst — it makes no sound on the wet stone until it is already upon you"
    description: >-
      In the Ember Isles a tiger is a creature of imported ink-screens and
      temple carvings — no one living has seen one in the flesh, which is
      precisely why the white beast of the high karst caves is so feared.
      Broad-pawed, near soundless, its coat the colour of old bone, it has
      learned that the cliff-paths feed it travelers. The mountain-folk leave
      it bowls of rice and bowed heads and call it by no name, lest the
      naming call it down.
  - id: karasu_tengu_swordmaster
