      valleys with stolen banners and absolute discipline.
  - id: onibi_of_kasai
    name: Onibi of Kasai
    level: 6
    hp: 27
    armor_class: 17
    attack_bonus: 6
    damage: "2d8"
    move: "40 ft. fly"
    morale: 12
    skill: 0
    save: 12
    role: volcanic corpse-fire lure
    tags: [spirit, elemental, mid]
    abilities:
      - "Flies"
      - "Pyre-lure — a creature within range that meets the floating fire makes a Mental save or is enthralled and led astray, save ends"
      - "Claim the dying — a mortally wounded creature near the flame dies at once, its last warmth devoured"
      - "Immune to mundane weapons"
    description: >-
      A cluster of blue-white flames that drift up from the vents of Mount
      Kasai on nights the mountain rumbles, beautiful as floating lanterns
      at a festival. They are the unspent fire of the war-dead, hungry for
      the small warmth left in anyone foolish enough to follow them uphill.
  - id: nue_chimera
    name: Nue
    level: 6
    hp: 27
    armor_class: 15
    attack_bonus: 6
    damage: "1d8"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 12
    role: ill-omen chimera
    tags: [yokai, beast, mid]
    abilities:
      - "Serpent-tail sting — on a hit the snake that serves as its tail strikes; the victim makes a Physical save or takes 2d12 venom damage"
      - "Black-cloud shroud — it gathers a roiling dark mist about itself, attacking from cover"
      - "Omen of sickness — its night-cry is said to herald an illness that no channeler's fire can warm away"
    description: >-
      A thing with the face of a monkey, the body of a tiger, the limbs of
      something else again, and a living serpent for a tail. It comes down
      off Mount Kasai on a black cloud and settles on the roof-ridge of a
      great house, and by morning someone inside has taken a fever that
      will not break.

  # ── DEEP BAND (L8) — the named river-leviathan and the mountain oni ──
  - id: deep_current_leviathan
    name: Leviathan of the Deep Current
    level: 8
    hp: 36
    armor_class: 15
    attack_bonus: 8
    damage: "2d6+4"
    move: "40 ft. swim"
    morale: 9
    skill: 3
    save: 11
    role: tutelary water-dragon of the Inland Sea road
    tags: [beast, apex, deep]
    abilities:
      - "Two attacks per round"
      - "Drowning coils — a creature it strikes makes a Physical save or is wound under the surface and held there, drowning, until it breaks the hold"
      - "Floodcall — once per scene it churns the channel into a sudden rising flood; footing turns to deep fast current and any small craft is swamped"
      - "Spirit-scaled — old as the trade-road itself, it shrugs off a fisherman's iron; only channeled flame, blessed steel, or a properly consecrated offering-blade bites deep"
    description: >-
      A mizuchi — the great water-dragon of the Inland Sea road, old enough
      to wear a name in four tongues and to remember when each of them was
      new. Its coils are scaled like flood-polished jade and run longer than
      a merchant's barge; its wake alone overturns the careless. For a
      thousand years the river-villages floated it a bride and a barrel of
      new rice each flood-season, and in return it kept their channels deep
      and their nets heavy. The villages are gone or forgetful now, the
      offerings long unpaid — and the old serpent keeps no bargain anymore
      but its hunger.
  - id: oni_of_the_red_mountain
    name: Oni of the Red Mountain
    level: 8
    hp: 36
    armor_class: 15
    attack_bonus: 8
    damage: "2d6+1"
    move: "40 ft."
    morale: 10
    skill: 3
    save: 11
    role: great mountain ogre
    tags: [oni, apex, deep]
    abilities:
      - "Two attacks per round"
      - "Regeneration — it heals 8 damage at the start of each of its turns unless the wound was dealt by fire or channeled flame"
      - "Iron club — its kanabō shatters shields and armor on a solid blow"
    description: >-
      A horned giant the dull red of cooled lava, hide like cracked
      basalt, dragging a studded iron club longer than a man is tall. It
      ruled the high passes of Mount Kasai before the Shogun's grandfather
      drove it up the slopes, and it remembers every road that once was
      its own. Cut it and the wound closes — unless the steel comes wreathed
      in fire.

# ── GENERICS (story 162-3) — the sanctioned last-resort Other ─────────────
# When the seater must stat a router-named opponent with no roster, pool, or
# room binding behind it, it draws from these rows instead of fabricating an
# ephemeral stub (No Silent Fallbacks). Nameless-grade only: the Burning
# Peace's masterless and desperate, never a named order or a spirit.
generics:

  - id: masterless_blade
    name: Masterless Blade
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d6"
    move: "30 ft."
    morale: 7
    skill: 1
    save: 15
    role: oath-broken sword drifting the trade roads
    tags: [human, low, generic]
    description: >-
      A sword with no banner and a scabbard worn white at the mouth. The
      Burning Peace made thousands of them: retainers whose lords knelt,
      whose stipends stopped, and whose pride did not. Most beg. Some
      teach. This one has decided, today, to take.

  - id: shrine_road_footpad
    name: Shrine-Road Footpad
    level: 1
    hp: 4
    armor_class: 11
    attack_bonus: 1
    damage: "1d4"
    move: "30 ft."
    morale: 6
    skill: 1
    save: 15
    role: pilgrim-route mugger working the lantern gaps
    tags: [human, low, generic]
    description: >-
      Works the dark stretches between shrine lanterns with a weighted
      cord and an apology already rehearsed. Steals offertory strings and
      travel papers, never blades — blades bring the sworn orders, and
      the sworn orders bring the fire.
