      - "Silk-binding — a struck creature must save or be wrapped and held fast in webbing"
      - "True shape — beneath the courtesan's silks she is half great spider"
    description: >-
      The loveliest hostess in a southern-port teahouse, who plays the
      biwa so sweetly that her guests forget to leave. Those who linger
      past the last lamp find the rafters above their cushion thick with
      silk, and eight patient legs already descending.
  - id: cave_tiger
