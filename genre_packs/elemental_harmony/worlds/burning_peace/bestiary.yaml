# Elemental Harmony — pack bestiary (story 90-1)
#
# SRD-aligned combat stat blocks for the wwn ruleset module. Encountergen
# samples these for the Monster Manual encounters pool (free-play reachable
# hostiles); narrative layers (OCEAN, visual prompt) are composed at
# generation time. Stats are faithful to the Worlds Without Number SRD 1.0
# (Sine Nomine Publishing) generic stat lines — level == HD, hp == average
# (4.5/HD), ascending AC, morale on the 2d12 ladder.
#
# Genre tier rules (ADR-120): names here are genre-generic — no named
# world cultures, factions, or POIs. World-specific hostiles belong in
# worlds/<slug>/ overrides.
entries:
  - id: mountain_pass_bandit
    name: Mountain Pass Bandit
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d6"
    move: "30 ft."
    morale: 8
    skill: 1
    save: 15
    role: highway robber
    tags: [human, bandit]
    description: >-
      A lean cutpurse in a straw cloak and lacquered scraps of stolen
      armor, watching the trade road from above the tree line.
