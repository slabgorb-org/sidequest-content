      toppled, its offering-dish robbed, its rope-and-paper streamers gone
      to rags. It travels the pass as a walking squall of grit and torn
      shide, and it remembers the face of every traveler who passed the
      broken gate without a bow. Oath-breakers it hounds downhill, shrieking
      in a voice like wind through a cracked bamboo flute.
  - id: musha_yurei
