      - "Mountain disdain — those who fight it on its own peak make their attacks at a penalty, mocked and unbalanced by its taunts"
    description: >-
      A crow-headed swordsman in the robes of a mountain ascetic, perched
      where the cedar forest climbs the flank of Mount Kasai. It taught
      swordplay to the dynasty's founders, or so it claims, and it has not
      forgiven how thoroughly they have forgotten the lesson.
  - id: rogue_earth_spirit
    name: Rogue Earth Spirit
    level: 6
    hp: 27
    armor_class: 15
    attack_bonus: 6
    damage: "1d10"
    move: "20 ft."
    morale: 12
    skill: 0
    save: 12
    role: roused yama-no-kami
    tags: [spirit, elemental, mid]
    abilities:
      - "Fearless — never checks morale"
      - "Swallowing scree — a creature it strikes makes a Physical save or is dragged knee-deep into churning stone and held fast until it tears loose"
      - "Landslide step — once per scene its tread shudders the slope; creatures nearby save or be knocked prone in the sliding rock"
    description: >-
      A yama-no-kami of the terraced slopes, roused when a daimyō's road-gangs
      robbed its boundary cairns to face a castle wall. The hillside itself
      stands up — retaining-stones for knuckles, the snapped roots of felled
      cedars for sinew, a cold spring weeping where a mouth should be — and it
      will not lie back down until every stolen stone is carried home and set
      right in the dark soil it was prised from.
  - id: bandit_warlord
    name: Bandit Warlord
    level: 6
    hp: 27
    armor_class: 18
    attack_bonus: 6
    damage: "1d8+3"
    move: "30 ft."
    morale: 9
