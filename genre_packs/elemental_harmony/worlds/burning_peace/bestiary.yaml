    attack_bonus: 6
    damage: "1d10"
    move: "20 ft."
    morale: 12
    skill: 0
    save: 12
    role: unbound mountain spirit
    tags: [spirit, elemental, mid]
    abilities:
      - "Fearless — never checks morale"
    description: >-
      A hillside that stood up: boulders for shoulders, roots for sinew,
      furious that someone moved the boundary stones.
  - id: bandit_warlord
    name: Bandit Warlord
    level: 6
    hp: 27
    armor_class: 18
    attack_bonus: 6
    damage: "1d8+3"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 12
    role: outlaw army commander
    tags: [human, commander, mid]
    description: >-
      A former imperial officer turned mountain king, holding three
      valleys with stolen banners and absolute discipline.
  - id: onibi_of_kasai
    name: Onibi of Kasai
    level: 6
    hp: 27
    armor_class: 17
    attack_bonus: 6
    damage: "2d8"
    move: "40 ft. fly"
    morale: 12
    skill: 0
    save: 12
    role: volcanic corpse-fire lure
    tags: [spirit, elemental, mid]
    abilities:
      - "Flies"
      - "Pyre-lure — a creature within range that meets the floating fire makes a Mental save or is enthralled and led astray, save ends"
      - "Claim the dying — a mortally wounded creature near the flame dies at once, its last warmth devoured"
      - "Immune to mundane weapons"
    description: >-
      A cluster of blue-white flames that drift up from the vents of Mount
      Kasai on nights the mountain rumbles, beautiful as floating lanterns
      at a festival. They are the unspent fire of the war-dead, hungry for
      the small warmth left in anyone foolish enough to follow them uphill.
  - id: nue_chimera
    name: Nue
    level: 6
    hp: 27
    armor_class: 15
    attack_bonus: 6
    damage: "1d8"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 12
    role: ill-omen chimera
    tags: [yokai, beast, mid]
    abilities:
      - "Serpent-tail sting — on a hit the snake that serves as its tail strikes; the victim makes a Physical save or takes 2d12 venom damage"
      - "Black-cloud shroud — it gathers a roiling dark mist about itself, attacking from cover"
      - "Omen of sickness — its night-cry is said to herald an illness that no channeler's fire can warm away"
    description: >-
      A thing with the face of a monkey, the body of a tiger, the limbs of
      something else again, and a living serpent for a tail. It comes down
      off Mount Kasai on a black cloud and settles on the roof-ridge of a
      great house, and by morning someone inside has taken a fever that
      will not break.

  # ── DEEP BAND (L8) — the named river-leviathan and the mountain oni ──
  - id: deep_current_leviathan
    name: Leviathan of the Deep Current
    level: 8
    hp: 36
    armor_class: 15
    attack_bonus: 8
    damage: "2d6+4"
    move: "40 ft. swim"
    morale: 9
    skill: 3
    save: 11
    role: great water beast
    tags: [beast, apex, deep]
    abilities:
      - "Two attacks per round"
    description: >-
      A river-serpent old enough to have a name in four languages, scaled
      like flood-polished jade, owed offerings nobody pays anymore.
  - id: oni_of_the_red_mountain
    name: Oni of the Red Mountain
    level: 8
    hp: 36
    armor_class: 15
    attack_bonus: 8
    damage: "2d6+1"
    move: "40 ft."
    morale: 10
    skill: 3
    save: 11
    role: great mountain ogre
    tags: [oni, apex, deep]
    abilities:
      - "Two attacks per round"
      - "Regeneration — it heals 8 damage at the start of each of its turns unless the wound was dealt by fire or channeled flame"
      - "Iron club — its kanabō shatters shields and armor on a solid blow"
    description: >-
      A horned giant the dull red of cooled lava, hide like cracked
      basalt, dragging a studded iron club longer than a man is tall. It
      ruled the high passes of Mount Kasai before the Shogun's grandfather
      drove it up the slopes, and it remembers every road that once was
      its own. Cut it and the wound closes — unless the steel comes wreathed
      in fire.
