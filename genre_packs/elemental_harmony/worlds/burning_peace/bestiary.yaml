      - "Lurks in darkness — nearly invisible until it is upon you"
    description: >-
      A traveler turns at the sound of weeping on the night road and finds
      a kindly stranger — who lifts a hand and wipes their own face smooth,
      featureless as an egg. The cold that follows the touch is the cold of
      a life being quietly spent.
  - id: gashadokuro_fragment
