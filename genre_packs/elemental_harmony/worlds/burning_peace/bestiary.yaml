    attack_bonus: 5
    damage: "1d8"
    move: "30 ft."
    morale: 8
    skill: 2
    save: 13
    role: solitary mountain predator
    tags: [beast, mid]
    description: >-
      A pale tiger of the high karst caves, broad-pawed and silent, that
      has learned to take travelers from the cliff paths.
  - id: karasu_tengu_swordmaster
