    tags: [spirit, undead, mid]
    abilities:
      - "Immune to mundane weapons — only fire, channeled flame, or blessed steel can harm it"
      - "Walks through walls — no barrier stops its advance"
      - "Bound to its last duel — it cannot rest until the matter that killed it is settled"
    description: >-
      A warrior in the lamellar of a vanished house, still saluting before
      a duel ended generations ago. Its sword finds the gap in your guard
      with the patience of a man who has had a very long time to practice,
      and ordinary steel passes through it like smoke.
  - id: jorogumo_courtesan
