    morale: 9
    skill: 1
    save: 14
    role: expelled student of the elemental forms
    tags: [human, channeler, low]
    description: >-
      A young channeler cast out of the temple schools, forms gone sloppy
      and dangerous without a master's correction.
  - id: temple_guardian_statue
    name: Temple Guardian Statue
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "30 ft."
    morale: 12
    skill: 0
    save: 14
    role: animated stone sentinel
    tags: [construct, low]
    abilities:
      - "Fearless — never checks morale"
    description: >-
      A stone temple-dog come grinding to life, moss still clinging to its
      shoulders, bound to a threshold and an old oath.
  - id: kappa_ferryman
    name: Kappa of the Crossing
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 2
    damage: "1d6+1"
    move: "30 ft. swim"
    morale: 8
    skill: 1
    save: 14
    role: river-ford ambusher
    tags: [yokai, beast, low]
    abilities:
      - "Drag under — a struck creature must save or be hauled into deep water and held below"
      - "Bow it down — if offered courtesy or a cucumber it must bow in return, spilling the water-dish on its crown and losing its strength for the scene"
    description: >-
      A green child-sized thing with a turtle's back and a beak, crouched
      at the river ford where the alternate-attendance road crosses. The
      shallow dish atop its skull trembles with brackish water; it watches
      your horses' fetlocks the way a fisher watches a float.
  - id: ashen_jizo_sentinel
    name: Ashen Jizō Sentinel
    level: 2
    hp: 9
    armor_class: 14
    attack_bonus: 2
    damage: "1d6"
    move: "20 ft."
    morale: 12
    skill: 0
    save: 14
    role: defiled wayside guardian
    tags: [construct, spirit, low]
    abilities:
      - "Fearless — never checks morale"
      - "Reproachful stare — once per scene every living creature in sight must make a Mental save or spend its turn unable to raise a weapon, shamed by the stone"
    description: >-
      A roadside Jizō statue, the kind travelers dress in a red bib and
      pray to for safe passage, but this one's stone has gone grey as cold
      ash and its carved smile has slipped. It grinds a half-step from its
      pedestal when no one is quite looking, mourning the war-dead nobody
      buried.
  - id: bake_danuki_trickster
    name: Bake-danuki Trickster
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "30 ft."
    morale: 7
    skill: 1
    save: 14
    role: shapeshifting con-artist spirit
    tags: [yokai, shapeshifter, low]
    abilities:
      - "False shape — the danuki takes the seeming of a person, monk, or sum of coin; a creature that trusts the disguise makes a Mental save or is led astray for the scene"
      - "Leaf-money — its proffered gifts are real to the touch until dawn, when they turn back to dirt and dead leaves"
    description: >-
      A round-bellied raccoon-dog that walks like a man when it thinks
      itself unwatched, drumming on its own belly in the dark. It will
      sell you a fine lacquered scabbard, a night's lodging, a writ of safe
      passage — all of it leaves and river-mud by morning.

  # ── MID BAND (L3-7) — soldiery, the restless dead, the mountain spirits ──
