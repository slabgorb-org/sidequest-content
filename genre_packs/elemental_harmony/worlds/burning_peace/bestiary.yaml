    armor_class: 15
    attack_bonus: 4
    damage: "1d10"
    move: "40 ft."
    morale: 12
    skill: 0
    save: 13
    role: unquiet dead warrior
    tags: [spirit, undead, mid]
    abilities:
      - "Fearless — never checks morale"
      - "Reforms at dusk unless its grievance is settled"
    description: >-
      The cold after-image of a soldier who died badly, still fighting a
      battle thirty years finished.
  - id: warlords_champion
