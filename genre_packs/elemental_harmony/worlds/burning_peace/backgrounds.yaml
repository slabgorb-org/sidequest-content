# The Burning Peace — WWN Backgrounds, world tier (SRD §1.3)
#
# Backgrounds keyed to the eight cultural origins in char_creation.yaml.
# The Burning Peace is a Shogunate-enforced peace on volcanic islands —
# every culture here is shaped by the tension between disciplined
# channeling and the spirit activity that is quietly getting worse.
# Skill names must be in elemental_harmony/skills.yaml.

- id: ember-isles-born
  display_name: Ember Isles Born
  description: >-
    You were raised on the Ember Isles' volcanic archipelago under the
    Tokigane Shogunate's long disciplinary gaze. Channeling is the
    primary social currency — ranked, graded, and watched by the Metsuke
    fire inspector corps. The forms are precise because imprecision
    costs rank, and rank is survival.
  free_skill: Exert
  quick_skills:
    - Exert
    - Perform

- id: jade-kingdoms-born
  display_name: Jade Kingdoms Born
  description: >-
    You carry the stone-patience of a diminished empire that still
    remembers its full size and fully intends to get it back. Standing
    between what you guard and what would harm it is not metaphor here —
    it is the political and martial posture that three thousand years
    of empire refined into doctrine.
  free_skill: Lead
  quick_skills:
    - Lead
    - Know

- id: tide-reaches-born
  display_name: Tide Reaches Born
  description: >-
    Half-drowned island chains where the sea is teacher, healer, and
    destroyer in the same tidal cycle. You followed the tide out past
    the sunken atolls because the sunken atolls were where the old
    currents went, and the old currents know things about the spirit
    world that the land-bound never learn.
  free_skill: Sail
  quick_skills:
    - Sail
    - Survive

- id: sky-temples-born
  display_name: Sky Temples Born
  description: >-
    Mountain monasteries above the cloud-line, where the rope-bridges
    are spiritual as well as physical and channeling as breath and
    altitude is the founding doctrine. You learned patience at elevation
    and self-mastery in the cold, and both of them feel lighter at sea
    level than they ever did at home.
  free_skill: Pray
  quick_skills:
    - Pray
    - Survive

- id: iron-peaks-born
  display_name: Iron Peaks Born
  description: >-
    Granite ranges honeycombed with mines and mountain fortresses, gates
    sealed with channeled stone after the betrayal at Hyeong Ridge. You
    were raised to trust the mountain and no one beyond it. You left
    anyway, which is something you and the mountain have not yet resolved.
  free_skill: Craft
  quick_skills:
    - Craft
    - Exert

- id: monsoon-courts-born
  display_name: Monsoon Courts Born
  description: >-
    Jungle river kingdoms where channeling is monsoon-dance and
    blood-offering: at the first storm of the wet season, each household
    opens a vein into the river and dances the flood-prayer to the storm
    spirits that come up the water, asking the year's rains to break
    over the fields and not over the houses. You danced it from the year
    you could stand. You still flinch, a little, at the smell of rain on
    hot earth, because that is the smell of the cut about to be made.
  free_skill: Perform
  quick_skills:
    - Perform
    - Connect

- id: lotus-provinces-born
  display_name: Lotus Provinces Born
  description: >-
    Coastal trading cities of the Silk Delta, squeezed between spheres
    of influence and surviving on the principle that knowledge flows
    like water. Every merchant keeps a scholar's ledger; every scholar
    keeps a merchant's caution. You grew up knowing that what you know
    is often worth more than what you can carry.
  free_skill: Trade
  quick_skills:
    - Trade
    - Know

- id: saffron-reaches-born
  display_name: Saffron Reaches Born
  description: >-
    Temple cities on golden plains where the boundary between world and
    spirit is thinnest — and where proximity to that thinness has produced
    a people who navigate both sides with a calm that looks like fatalism
    to outsiders and is, in fact, something more considered.
  free_skill: Pray
  quick_skills:
    - Pray
    - Heal
