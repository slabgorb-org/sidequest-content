name: The Unification War of the Three Flames
era: 80 years ago
summary: For a century, the Ember Isles tore themselves apart in civil war as three
  great fire channeler dynasties — the Tokigane of the eastern plains, the Shimora
  of the western mountains, and the Kurogane of the southern coast — fought for supremacy.
  The war ended at the Battle of Sekimori Plain, where Tokigane Yasuhiro, a patient
  strategist who had spent decades forging alliances with lesser lords, lured the
  Shimora and Kurogane armies into a pincer between his fire channelers and the sudden
  betrayal of three western lords he had secretly turned. The conflagration at Sekimori
  burned for three days. When the fires died, Tokigane Yasuhiro declared himself Taishōgun
  — Supreme Fire Marshal — and imposed a peace backed by the threat of absolute channeling
  supremacy. The Shimora surrendered. The Kurogane knelt. The islands unified for
  the first time in recorded history.
cultural_impact: The Unification War defines everything about the current political
  order. The Tokigane dynasty rules from Edo Castle, and every lord who fought beside
  Yasuhiro at Sekimori — the inner lords, or uchidaimyō — holds privileged positions
  in government. The lords who surrendered after the battle — the outer lords, or
  sotodaimyō — rule larger, wealthier domains but are excluded from power and watched
  constantly. The alternate attendance system forces every outer lord to spend half
  their years in Edo, leaving family members as hostages. The peace is real but brittle.
  Three generations have passed and the outer lords have not forgotten.
affected_cultures:
- Ember Isles
faction_grudges:
- from: Outer Lords (sotodaimyō)
  to: Tokigane Shogunate
  reason: The western lords who were betrayed at Sekimori — the Shimora and their
    allies — were stripped of their best channeling grounds and forced into submission.
    Their descendants maintain secret fire training academies in defiance of Shogunate
    weapons restrictions.
- from: Kurogane remnants
  to: Tokigane Shogunate
  reason: The Kurogane clan's ancestral volcano-forge was confiscated and converted
    into a Shogunate military academy. The family serves as minor administrators,
    burning with resentment passed from parent to child.
lost_arts:
- Shimora storm-fire — a technique combining fire channeling with weather manipulation
  that died with the Shimora war-masters at Sekimori
- The Kurogane volcano-forge method — deep-earth fire channeling that drew power directly
  from magma, now forbidden by Shogunate decree
monuments:
- The Victory Pillars at Sekimori Plain — twelve obsidian columns marking where each
  betraying lord turned their flames against the western army, maintained by the Shogunate
  as a reminder of what happens to those who resist unification
- The Kneeling Stone at Edo Castle — a flat basalt slab where the Kurogane lord prostrated
  himself before Tokigane Yasuhiro, now embedded in the castle's audience hall floor
  where every visiting lord must stand upon it
terrain_scars:
- type: battlefield
  name: The Scorched Plain of Sekimori
  description: A vast expanse of blackened earth east of the central mountains where
    the three-day conflagration fused the topsoil into a dark, glassy crust. Nothing
    grows there. Fire channelers report their flames burning hotter and wilder on
    the plain, as though the concentrated violence left a permanent elemental scar.
    Local farmers avoid it and claim to hear war-drums on windless nights.
- type: cursed_ground
  name: The Ash Fields of Nishigawa
  description: The western mountain passes where the Shimora army was trapped and
    incinerated. The ash layer is still several feet deep in places, and the mountain
    slopes are permanently stained grey. Spirits of the war dead drift through the
    passes at dusk — fire-ghosts that flicker at the edge of vision and vanish when
    addressed.
