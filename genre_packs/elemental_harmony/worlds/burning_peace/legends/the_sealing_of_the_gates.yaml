name: The Sealing of the Gates
era: 40 years ago
summary: In the aftermath of the Uprising, the third Taishōgun — Tokigane Iemasa —
  declared the Ember Isles closed to all foreign contact except through a single controlled
  port at Nagasaki. The Lotus Provinces trading houses, which had operated freely
  in Osaka and the southern ports for decades, were expelled. Nanban missionaries
  from multiple cultures were hunted down and executed or driven underground. A tiny
  artificial island — Dejima — was constructed in Nagasaki harbor, and only Lotus
  Provinces secular merchants were permitted to dock there, under armed guard, forbidden
  to set foot on the mainland. The Sealing transformed the Ember Isles from an outward-looking
  maritime culture into an isolated fortress-state. Trade routes that had connected
  the isles to the Jade Kingdoms, the Tide Reaches, and the Lotus Provinces withered.
  Knowledge of the outside world became contraband. The Shogunate's fire channeler
  inspectors — the Metsuke — patrol the coastline, and any unauthorized ship approaching
  the islands is burned on sight.
cultural_impact: 'The Sealing created the world the players inhabit: an island chain
  that has turned inward, its warrior class growing restless in peace, its merchants
  growing wealthy despite their low status, its spiritual life controlled by a government
  that fears any power it cannot channel through fire. The outside world has become
  mythical — younger generations know the Jade Kingdoms and the Tide Reaches only
  from old stories and the carefully censored goods that arrive at Dejima. Meanwhile,
  the isolation has concentrated the spirit world''s attention on the isles. With
  fewer channelers traveling abroad, the elemental balance within the islands has
  grown increasingly unstable. Mount Kasai''s rumbling is the most visible symptom,
  but spirit-sightings have tripled in the past decade, and the yokai — spirits that
  take animal or monstrous form — have grown bolder, appearing in villages and castle
  towns where they were once confined to deep forests and mountain passes.'
affected_cultures:
- Ember Isles
- Lotus Provinces
- Jade Kingdoms
- Tide Reaches
faction_grudges:
- from: Lotus Provinces merchants
  to: Tokigane Shogunate
  reason: Decades of profitable trade relationships were severed overnight. The Lotus
    Provinces lost their most lucrative market and their merchants — confined to tiny
    Dejima — are treated as potential spies rather than partners.
- from: Ember Isles merchants
  to: Tokigane Shogunate
  reason: The merchant class, already the lowest in the social hierarchy, lost their
    most profitable foreign trade routes. Some have grown wealthy through domestic
    trade, but they resent the Shogunate's restrictions and quietly fund smuggling
    operations.
lost_arts:
- Cross-cultural channeling techniques — Ember Isles channelers who trained with Jade
  Kingdoms earth masters or Tide Reaches water teachers brought home hybrid forms
  that are now dying out as the teachers are gone and the techniques are not written
  down
- Nanban navigation — foreign star-reading and current-mapping techniques that allowed
  long-distance ocean travel, now deliberately suppressed
monuments:
- Dejima Island — the tiny artificial island in Nagasaki harbor where foreign merchants
  are confined, connected to the mainland by a single guarded bridge that is closed
  and fire-sealed each night
- The Coastal Fire Beacons — a chain of signal towers along the entire coastline,
  each staffed by fire channelers who can ignite the next beacon within seconds, creating
  a perimeter warning system that can alert the Shogunate to any approaching ship
  within minutes
terrain_scars:
- type: ruin
  name: The Burned Wharves of Sakai
  description: The once-thriving international port of Sakai, south of Osaka, was
    deliberately burned by Shogunate channelers when the Sealing was declared. The
    charred pilings still stand in the harbor, too large to remove, a forest of blackened
    wood rising from the water. Foreign merchant houses that lined the waterfront
    are hollow shells. Smugglers use the ruins as a meeting point, knowing the Metsuke
    consider the area too visible to hide in.
- type: dead_zone
  name: The Forbidden Coast
  description: A stretch of southern coastline where the Shogunate maintains a permanent
    fire channeling patrol. The beaches are swept clean of boats, the fishing villages
    relocated inland, and anyone found on the shore without authorization is arrested.
    The sea itself seems to respond to the isolation — currents have shifted, making
    unauthorized approach by ship genuinely dangerous even without the fire patrols.
