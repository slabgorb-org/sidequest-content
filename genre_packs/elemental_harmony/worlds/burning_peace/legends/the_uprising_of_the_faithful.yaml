name: The Uprising of the Faithful
era: 45 years ago
summary: Thirty-five years into the Burning Peace, a charismatic young spirit medium
  named Amakusa Shion emerged among the farming communities of the southern islands.
  Shion preached a foreign spiritual doctrine brought by Nanban missionaries from
  the Lotus Provinces — a faith that taught all elements were equal expressions of
  a single divine source, that fire held no special authority, and that the spirit
  world was not to be feared but embraced as a doorway to enlightenment. The doctrine
  spread like wildfire among overtaxed farmers and masterless channelers. When the
  local lord attempted to arrest Shion, thirty thousand followers — farmers, ronin,
  and spirit-touched outcasts — fortified an abandoned coastal castle and declared
  themselves free of the Shogunate. The Taishōgun mobilized eighty thousand fire channelers
  and besieged the fortress for four months. The final assault was a coordinated conflagration
  that melted the castle walls. No quarter was given. Amakusa Shion died channeling
  a barrier of pure spirit energy that held for three hours before collapsing. Every
  defender was killed.
cultural_impact: 'The Uprising terrified the Shogunate far more than the Unification
  War. Farmers — people without fire channeling — had nearly overthrown a regional
  lord using spirit channeling and sheer numbers. The Shogunate responded with three
  policies that define the current era: First, all Nanban missionaries were expelled
  and the southern ports sealed to foreign spiritual teachers. Second, spirit channeling
  was placed under strict regulation — spirit mediums must register with the local
  temple authority and submit to annual inspection. Third, the practice of any faith
  not sanctioned by the Shogunate became punishable by death. Despite this, the Hidden
  Way persists underground, its followers meeting in secret, recognizing each other
  by small gestures and coded phrases. The Shogunate''s inspection system — requiring
  citizens to step on a sacred image to prove they do not follow the foreign faith
  — is enforced in every village.'
affected_cultures:
- Ember Isles
faction_grudges:
- from: The Hidden Way (underground faithful)
  to: Tokigane Shogunate
  reason: The massacre at Shimabara Castle is remembered as a martyrdom. Amakusa Shion's
    spirit barrier — three hours of pure channeling against eighty thousand — is whispered
    about as proof that the foreign faith grants power beyond fire alone.
- from: Tokigane Shogunate
  to: Nanban missionaries (Lotus Provinces)
  reason: The Shogunate views the foreign faith as a weapon designed to undermine
    fire channeler authority. Any Nanban spiritual teacher found on the islands faces
    execution. Secular traders are tolerated only at Dejima, the artificial island
    in Nagasaki harbor.
lost_arts:
- Amakusa Shion's spirit barrier technique — a sustained defensive channeling form
  that drew on all four elements simultaneously, something modern channelers consider
  impossible
- The Nanban communion ritual — a group meditation technique that allowed non-channelers
  to briefly perceive the spirit world
monuments:
- The Melted Walls of Shimabara — the ruins of the coastal fortress, deliberately
  left uncleared as a warning. The stone walls are partially fused into smooth glass
  from the final assault's heat. Flowers appear at the base each spring, left by unknown
  hands.
- The Sealed Southern Gate at Nagasaki — a massive iron gate across the harbor entrance,
  opened only for approved Nanban trading vessels and closed with channeled fire-welds
  at all other times
terrain_scars:
- type: ruin
  name: The Melted Fortress of Shimabara
  description: The remains of the coastal castle where thirty thousand followers of
    the foreign faith made their last stand. The walls are fused into smooth obsidian
    from the final conflagration. The ground inside the walls is barren — nothing
    grows in the footprint of the fortress. Spirit mediums report hearing chanting
    from within the ruins at night, and the air inside the walls is always several
    degrees cooler than outside, as though Shion's spirit barrier left a permanent
    chill.
- type: cursed_ground
  name: The Weeping Shore
  description: The beach below Shimabara where the tide carried ash and remains for
    weeks after the massacre. Fishermen avoid the waters. On still nights, the sea
    glows faintly blue — the color of spirit energy — and shapes move beneath the
    surface that are not fish.
