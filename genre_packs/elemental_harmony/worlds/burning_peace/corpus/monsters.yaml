# Burning Peace — bestiary-curation SOURCE corpus (recipe Stage 0).
#
# The source is the SETTING ITSELF, not the D&D SRD. These are the fauna,
# martial orders, and yōkai of the Ember Isles under the Burning Peace — an
# Edo/sengoku-flavoured wuxia/elemental world — authored onto the SRD row
# shape with a plausible 5e `type` (the GATE-1 allow/deny key in
# world_register.yaml) and a `cr` (the WWN stat-ladder key — see the
# bestiary-curation recipe CR->level table).
#
# Provenance of the CR choices: each row's CR is the band that lands the
# creature on its setting-true WWN level — the road-side vermin and lesser
# lures sit low, the oni and the named river-leviathan sit at the deep cap of
# what this world reaches (the Ember Isles top out modestly; no dragon-tier
# inflation). The numbers that come OUT of the ladder (hp / save /
# attack_bonus / skill) are derived, NEVER hand-balanced (SOUL: "Bind the
# Ruleset, Don't Balance It"). Prose (description / abilities / damage / move /
# role) is authored in bestiary.yaml.
#
# `source` notes the lineage. The human martial rows are the sworn orders of
# the Tokigane era (ronin, channeler soldiery, shinobi, outer-lord retainers);
# the yōkai are drawn from Japanese folk myth (out-of-copyright tradition),
# rendered setting-true to the isles, never as comic-relief.
#
# This corpus PRESERVES the world's existing 25-entry roster (ADR-140: the
# world owns the cast). GATE 1 culls nothing — every row is Ember-Isles
# setting-true — and that clean pass is itself the fidelity proof. The
# world_register deny lists are the firewall against a FUTURE author padding
# the isles with the Western dungeon menagerie, not active culls here.

