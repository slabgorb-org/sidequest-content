# The Burning Peace — WWN Foci, world tier (SRD §1.5)
#
# Eight foci matched to the Burning Peace's eight cultural backgrounds.
# Referenced as focus_id values in char_creation.yaml's `origins` choices.
# Register: Shogunate peace enforcement, channeling as discipline and
# inheritance, spirit activity increasing, something coming.
# Skill names must be in elemental_harmony/skills.yaml.

- id: kata-memory
  display_name: Kata Memory
  description: >-
    The Shogunate grades channeling by the precision of its forms, and
    you were drilled in the kata until they are faster than conscious
    thought. In a crisis, the form fires before the fear does.
  levels:
    - skills:
        Exert: 1
      abilities:
        - name: Muscle Form
          genre_description: >-
            Years of kata training mean your body knows the form when
            your mind is elsewhere. Fear, distraction, and pain don't
            erase the training — they don't reach that deep.
          mechanical_effect: >-
            Once per scene, when a channeling or physical action would
            be penalized by surprise, fear, or mental disturbance, you
            may ignore that penalty by defaulting to trained form. This
            does not guarantee success — it removes the penalty.
          involuntary: false

- id: empire-bearing
  display_name: Empire Bearing
  description: >-
    The Jade Kingdoms carry three thousand years of imperial doctrine
    in their posture, and you carry it in yours. When you stand still
    and say nothing, rooms become quieter.
  levels:
    - skills:
        Lead: 1
      abilities:
        - name: Imperial Stillness
          genre_description: >-
            You have inherited the imperial bearing that comes from a
            culture that spent three millennia expecting to be obeyed.
            You do not perform authority — you have it, and it shows.
          mechanical_effect: >-
            Once per session, you may compel a moment of stillness in a
            heated situation — a fight that hasn't started, a negotiation
            about to break down — by simply not moving and not speaking.
            All parties pause for one round. On a successful Lead check
            (difficulty 10), one party will not initiate aggression
            during that pause.
          involuntary: false

- id: tide-reading
  display_name: Tide Reading
  description: >-
    You read the sea, and you read the spirit currents that run beneath
    it, and you have learned that both of them follow patterns that
    reward patient attention and punish impatience.
  levels:
    - skills:
        Notice: 1
      abilities:
        - name: Current Sense
          genre_description: >-
            The Tide Reaches people develop a sensitivity to the rhythm
            of things that change — tides, moods, spirit flows, the
            direction a conversation is turning. You read these early.
          mechanical_effect: >-
            Once per scene, you may make a Notice check (difficulty 10)
            to anticipate the direction of a change before it happens —
            a shift in wind, a change in a crowd's mood, an increase in
            local spirit activity. Success gives you one round of advance
            knowledge; failure gives you nothing and costs nothing.
          involuntary: false

- id: altitude-patience
  display_name: Altitude Patience
  description: >-
    Rope-bridge monasteries above the cloud-line teach a specific kind
    of patience — one that is not passive but structural, like stone.
    You wait when waiting is the right tool, and you know when it is.
  levels:
    - skills:
        Pray: 1
      abilities:
        - name: Long Vigil
          genre_description: >-
            Sky Temple training includes disciplines for sustained
            attention — the ability to maintain alertness and composure
            across very long periods without stimulation. The spirit
            world rewards this. So do night watches.
          mechanical_effect: >-
            You may maintain concentration on a channeling working or
            a watching vigil for twice the normal duration without
            rolling for distraction. Once per session, at the end of a
            long vigil or meditation, you may ask the narrator one
            factual question about something you have been paying
            sustained attention to.
          involuntary: false

- id: mountain-craft
  display_name: Mountain Craft
  description: >-
    Iron Peaks mountain fortresses are built in stone that has been
    channeled as well as cut, and you learned to work with both — the
    material and the force in it. You know the difference between a
    wall that was built and one that was sealed.
  levels:
    - skills:
        Craft: 1
      abilities:
        - name: Sealed Work
          genre_description: >-
            You can look at a construction and tell whether the builder
            intended it to be opened again. The Iron Peaks sealed their
            gates after Hyeong Ridge; you understand the difference
            between a door and a finality.
          mechanical_effect: >-
            When examining a sealed or channeled construction, you may
            make a Craft check (difficulty 10) to determine the method
            of sealing and whether it has been disturbed since. On a
            success, you also identify one physical method of bypassing
            or reinforcing it.
          involuntary: false

- id: dance-speak
  display_name: Dance-Speak
  description: >-
    Monsoon Courts channeling involves the body as language — you move
    while you channel, while you speak, while you negotiate. You have
    never been entirely still in any of these activities, and you have
    found this gives you a legibility that more formal people lack.
  levels:
    - skills:
        Perform: 1
      abilities:
        - name: Gesture Reading
          genre_description: >-
            You communicate intent with your body as clearly as with
            words, and you read it in others just as clearly. The
            Monsoon Courts' spirits respond to gesture over syntax;
            you have imported that habit into mortal negotiations.
          mechanical_effect: >-
            Once per scene, you may read one person's genuine intent —
            not their stated intent — from their physical bearing.
            Make a Notice check (difficulty 10). Success tells you
            whether what they are doing matches what they are saying.
            It does not tell you their specific motivation.
          involuntary: false

- id: current-price
  display_name: Current Price
  description: >-
    Lotus Provinces merchants keep a scholar's ledger and a survivor's
    caution. You grew up knowing that information has a price, that
    the price changes with circumstances, and that the person who knows
    the current price is always in a better position than the person
    who knew last week's.
  levels:
    - skills:
        Trade: 1
      abilities:
        - name: Leverage Point
          genre_description: >-
            You know, almost automatically, what the thing you are
            negotiating for is worth to the other party — not to the
            market, but to them, specifically, today.
          mechanical_effect: >-
            Once per session, when negotiating for something, you may
            make a Trade check (difficulty 10) to learn the other
            party's actual bottom line — not their opening position.
            On a success, the narrator tells you whether they would
            accept significantly less than they have asked.
          involuntary: false

- id: spirit-adjacent
  display_name: Spirit-Adjacent
  description: >-
    On the Saffron Reaches' golden plains, the boundary between mortal
    and spirit world is thin enough that most people grow up with at
    least one spirit they know personally. You are not a Spirit Medium —
    you simply grew up next door to the other side, and you are not
    surprised by what comes through.
  levels:
    - skills:
        Pray: 0
        Notice: 0
      abilities:
        - name: Spirit-Side Familiarity
          genre_description: >-
            You are not alarmed by spirits. You grew up around them.
            The ones that work hard to be frightening strike you as
            working rather hard, and the genuinely dangerous ones you
            recognized early precisely because they were not performing.
          mechanical_effect: >-
            You are immune to fear effects from spirits who are
            attempting to frighten you. Spirits who are not performing
            may choose to speak to you directly without a roll;
            this is a courtesy, not a command — they may decline.
            Once per session, you may ask a spirit present in the scene
            one question it is permitted to answer.
          involuntary: false
