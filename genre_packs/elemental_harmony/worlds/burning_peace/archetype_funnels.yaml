funnels:

  # ── Sworn Fire Channelers & Warriors ────────────────────────────────────────
  - name: Retainer-at-Sword
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Burning Throne
    lore: >-
      The Tokigane Shogunate's peacetime armies are full of men and women who
      trained since childhood to fight a war that ended before they were born.
      A Retainer-at-Sword holds a posting, a crest, and a lord's authority —
      and privately wonders whether fire forms practiced in a courtyard are the
      same thing as fire forms used in battle. They are the Burning Peace
      incarnate: all discipline, all readiness, and nothing to actually defend
      against except unease.
    cultural_status: honored in court, quietly pitied by those who read the mood of the isles
    disposition_toward:
      The Outer Flame: suspicion
      The Shadow Schools: professional wariness
      The Hidden Way: active hostility

  - name: Sekimori Descendant
    absorbs:
      - [hero, dps]
      - [hero, jack_of_all_trades]
    faction: The Outer Flame
    lore: >-
      The outer lords lost the Battle of Sekimori Plain, but they did not forget
      it. A Sekimori Descendant carries the weight of that defeat as a personal
      inheritance — the stripped titles, the alternate attendance exile, the
      domains taxed to exhaustion. They have trained in secret academies in the
      western mountains, learning techniques the Shogunate does not officially
      know exist. Whether they are a hero in the making or a grudge looking for
      a war depends entirely on the decade they were born.
    cultural_status: noble in their own domain, watched and resented under Shogunate gaze
    disposition_toward:
      The Burning Throne: cold hatred
      The Imperial Shrine: complicated loyalty
      The Shadow Schools: cautious recruitment

  # ── Shadow Schools & Intelligence ──────────────────────────────────────────
  - name: Kagerō Operative
    absorbs:
      - [explorer, stealth]
      - [outlaw, stealth]
    faction: The Shadow Schools
    lore: >-
      The Iga and Kōga mountain villages produce operatives who serve no single
      master — a neutrality that is their most valuable and most dangerous
      quality. A Kagerō Operative takes contracts from Shogunate inspectors and
      outer lords alike, maintaining a studied indifference to which side wins
      the larger game as long as the mountain villages remain autonomous. They
      channel fire in ways that invert the standard forms: not to produce heat
      but to suppress it, moving through shadows that are slightly darker than
      they should be.
    cultural_status: officially nonexistent, practically indispensable
    disposition_toward:
      The Burning Throne: contractual
      The Outer Flame: contractual
      The Hidden Way: avoidant

  - name: Metsuke Watcher
    absorbs:
      - [outlaw, control]
      - [sage, control]
    faction: The Burning Throne
    lore: >-
      The Shogunate's inspector network is staffed by fire channelers who see
      surveillance as a form of discipline — both for the watched and for themselves.
      A Metsuke Watcher operates openly in their assigned domain (everyone knows
      who they are) and covertly among the population (nobody knows all of them).
      They are trained to ask questions they already know the answer to, watching
      for the tell of a lie. Some are incorruptible servants of order. Others have
      decided that flexibility is its own kind of loyalty.
    cultural_status: feared and respected, never trusted
    disposition_toward:
      The Outer Flame: predatory observation
      The Hidden Way: active persecution
      The Shadow Schools: uneasy cooperation

  # ── Scholars, Sages & Spiritual Practitioners ───────────────────────────────
  - name: Yamabushi Ascetic
    absorbs:
      - [sage, support]
      - [sage, healer]
    faction: null
    lore: >-
      Mountain hermits who practice a syncretic blend of fire channeling, spirit
      communion, and physical austerity answer to no lord — they answer to the
      mountain. A Yamabushi Ascetic has meditated under freezing waterfalls and
      walked barefoot across volcanic terrain because they believe suffering opens
      doorways to the spirit world that comfort keeps shut. As the boundary between
      the mortal world and the spirit realm thins, their warnings have grown more
      urgent and their visions more coherent. The Shogunate tolerates them because
      they serve as early seismic warning for Mount Kasai's moods.
    cultural_status: cryptic authority, respected by commoners, watched by the Metsuke
    disposition_toward:
      The Burning Throne: contemptuous of its pretensions
      The Imperial Shrine: deep reverence
      The Hidden Way: wary kinship

  - name: Daimyō's War-Reader
    absorbs:
      - [ruler, support]
      - [sage, dps]
    faction: The Outer Flame
    lore: >-
      Every outer lord who is serious about the next fifty years keeps a War-Reader —
      a scholar who has studied the Battle of Sekimori not as history but as a map
      of what went wrong and how to correct it. The title comes from the practice of
      reading a battlefield before committing troops. In peacetime, a War-Reader reads
      political terrain instead: the alternate attendance burden, the Shogunate's
      military dispositions, the leverage points in every alliance. When they shift
      from analysis to action, their fire channeling tends toward precision and
      disruption rather than overwhelming force.
    cultural_status: prestigious within their lord's court, invisible to outsiders by design
    disposition_toward:
      The Burning Throne: calculating
      The Shadow Schools: valuable tools to be managed carefully

  # ── Healers & Caregivers ────────────────────────────────────────────────────
  - name: Hidden Way Shepherd
    absorbs:
      - [caregiver, healer]
      - [innocent, healer]
      - [sage, healer]
    faction: The Hidden Way
    lore: >-
      The outlawed foreign faith teaches that all elements are equal and the spirit
      world is a doorway to embrace rather than a threat to manage. A Hidden Way
      Shepherd moves between safe houses carrying Lotus Provinces medicines, offering
      healing that owes nothing to fire channeling and asks nothing in return.
      Commoners who distrust the Shogunate receive them with quiet gratitude; a few
      do not know they are harboring heresy. When the Metsuke comes, the Shepherd
      steps on the sacred image with a face of stone and weeps inside.
    cultural_status: beloved by those who know, hunted by those who govern
    disposition_toward:
      The Burning Throne: concealed opposition
      The Metsuke: mortal fear
      The Imperial Shrine: cautious hope

  - name: Townswife Herbalist
    absorbs:
      - [caregiver, support]
      - [lover, healer]
      - [innocent, support]
    faction: null
    lore: >-
      The great posting stations on the Tōkaidō highway draw every kind of
      traveler, and every kind of traveler eventually needs someone with steady
      hands and no obligation to report to the Metsuke. A Townswife Herbalist
      fills the gap — midwife, wound-dresser, grief-listener, and the person
      who quietly identifies which inn's water is giving people the flux.
      The title is gender-neutral in practice; what matters is competence and
      discretion, two virtues that the Burning Peace has made into survival skills.
    cultural_status: essential in every posting town, invisible to official record
    disposition_toward:
      The Hidden Way: practical sympathy
      The Burning Throne: studied neutrality

  # ── Performers, Artists & Social Operators ─────────────────────────────────
  - name: Kabuki Chameleon
    absorbs:
      - [artist, support]
      - [jester, control]
    faction: null
    lore: >-
      The kabuki theater is the one place where a merchant's son can sit in a
      seat that a lord's daughter vacated last week. A Kabuki Chameleon knows
      this and uses it. They observe their audience with the same care their
      audience gives the stage, and they traffic in exactly the kind of information
      — about lords' debts, merchants' mistresses, inspectors' drinking habits —
      that passes teahouse to teahouse in the coded seasonal references of a well-
      circulated haiku. Their hidden martial training is practical, not theatrical.
      The theater district is not safe after dark.
    cultural_status: celebrated publicly, socially suspect, indispensable informationally
    disposition_toward:
      The Shadow Schools: occasional overlapping interests
      The Burning Throne: cheerful contempt, carefully hidden

  - name: Geisha Strategist
    absorbs:
      - [lover, support]
      - [artist, control]
    faction: null
    lore: >-
      The licensed quarters of Edo and Kyōen are where the real decisions get made,
      because it is the only place where men who govern feel safe enough to say what
      they actually think. A Geisha Strategist has built an information network that
      rivals the Shadow Schools — but where shinobi trade in secrets for money, a
      Geisha Strategist trades in them for protection, influence, and the quiet
      satisfaction of knowing more than anyone in the room. They ask no direct
      questions. They remember everything anyway.
    cultural_status: celebrity and social asset, never granted the power they actually hold
    disposition_toward:
      The Outer Flame: selective loyalty for the right price
      The Burning Throne: indifferent exploitation of both sides

  - name: Highway Poet
    absorbs:
      - [explorer, jack_of_all_trades]
      - [everyman, jack_of_all_trades]
    faction: null
    lore: >-
      A traveler who wanders the Five Highways composing verse about frog ponds and
      abandoned checkpoints and the way firelight looks on snow. Poets are tolerated
      everywhere because they seem harmless — and because everyone, from the Metsuke
      to the outer lords, has privately wept at a poem that seemed to be about autumn
      but was actually about them. A Highway Poet who has walked every posting station
      knows the terrain, the moods of the countryside, and the things officials
      would prefer remain unwritten. Their seasonal references carry coded warnings
      for those who know how to read them.
    cultural_status: welcomed in every teahouse, trusted by no one, necessary to everyone
    disposition_toward:
      The Hidden Way: quiet sympathy in coded stanzas
      The Burning Throne: satirical affection, plausibly deniable

  # ── Merchants, Operators & Survivors ───────────────────────────────────────
  - name: Dejima Trader
    absorbs:
      - [everyman, support]
      - [lover, support]
    faction: null
    lore: >-
      Confined to Dejima island in Nagasaki harbor — the only legal point of
      foreign contact — the Lotus Provinces merchant has one commodity that no
      domain lord can manufacture: knowledge of what the outside world looks like.
      A Dejima Trader knows what the Jade Kingdoms are building, what technologies
      the other nations have developed while the Ember Isles turned inward. Every
      lord wants what they know. The Shogunate wants to control what they say.
      The Shogunate is losing that particular struggle, one private conversation
      at a time.
    cultural_status: officially restricted, practically essential, watched constantly
    disposition_toward:
      The Hidden Way: old networks, new uses
      The Burning Throne: scrupulous compliance, creative interpretation

  - name: Masterless Wanderer
    absorbs:
      - [outlaw, dps]
      - [hero, dps]
    faction: null
    lore: >-
      Ronin are what happens when a lord's house collapses and leaves trained
      warriors with fire forms they spent twenty years perfecting and nowhere to
      use them. A Masterless Wanderer ranges from the honorable wanderer seeking
      new service to the man who stopped practicing his forms two years ago and
      fights with cheap steel and worse temper. The Shogunate distrusts all of
      them. Some still channel fire. Others have let the flame die and prefer not
      to be reminded of what it felt like when it was lit.
    cultural_status: legally suspect, practically everywhere, morally variable
    disposition_toward:
      The Outer Flame: potential recruitment
      The Hidden Way: occasional protection in exchange for safe houses

  # ── Practitioners of the Spirit World ──────────────────────────────────────
  - name: Spirit-Lure Channeler
    absorbs:
      - [magician, control]
      - [magician, healer]
    faction: The Imperial Shrine
    lore: >-
      As the boundary between the mortal world and the spirit realm thins, the
      Emperor's court in Kyōen has become the center of growing spiritual urgency.
      A Spirit-Lure Channeler trains in the old techniques — not fire control
      alone, but the ritual forms that allow a channeler to speak to kami without
      being consumed by them. The Shogunate officially approves of shrine practice
      and officially disapproves of everything this role actually does in private
      session. Young Kazuhime, the Tennō, receives Spirit-Lure Channelers with the
      focused attention of someone who understands exactly what they are for.
    cultural_status: sacred office in Kyōen, politically radioactive in Edo
    disposition_toward:
      The Burning Throne: performing deference, practicing independence
      The Yamabushi: deep collegial respect

  - name: Iga Form-Reader
    absorbs:
      - [magician, dps]
      - [outlaw, stealth]
    faction: The Shadow Schools
    lore: >-
      The Kōga and Iga schools developed fire channeling techniques that the
      Shogunate academies do not teach — forms that emphasize surgical precision
      over overwhelming force, that can extinguish a candle across a room without
      disturbing the air, or light a fuse inside a locked cabinet. An Iga Form-
      Reader applies the same analytical discipline to opponents in combat, reading
      their stance, their breath, and their elemental resonance before moving. The
      current Iga grandmaster, known as Kagerō — Heat Haze — is said to have
      refined these techniques to the point where they leave no evidence at all.
    cultural_status: feared by those who understand what they're looking at, invisible to everyone else
    disposition_toward:
      The Burning Throne: contractual neutrality
      The Outer Flame: contractual neutrality

  - name: Tea-Room Sage
    absorbs:
      - [sage, control]
      - [artist, stealth]
    faction: null
    lore: >-
      The Way of Tea is simultaneously meditation, status display, philosophy, and
      the finest espionage opportunity in the Ember Isles. A Tea-Room Sage knows
      that the pause before pouring is where the real negotiation happens — that
      the tea room is the one space where a merchant can sit across from a lord
      as something approaching an equal, and where both of them will say things
      they would never say in any other room. The best Tea-Room Sages maintain an
      almost supernatural stillness that makes powerful people forget they are
      being observed.
    cultural_status: prestigious and socially sanctified, which is exactly the cover they need
    disposition_toward:
      The Burning Throne: formal courtesy, careful distance
      The Hidden Way: a debt paid in safe locations and silence

  - name: Jester-Form Fighter
    absorbs:
      - [jester, stealth]
      - [jester, dps]
    faction: The Shadow Schools
    lore: >-
      The Shadow Schools produce graduates who have studied the same texts on
      misdirection that kabuki actors study, and some of them take the lesson
      further than their masters intended. A Jester-Form Fighter uses apparent
      clumsiness, visible distraction, and the assumption of harmlessness as their
      primary combat tools. They move like someone who has had too much sake, land
      strikes that arrive from impossible angles, and laugh at exactly the moment
      their opponent expects a tell of fear. This is a genuine martial tradition —
      Drunken Fist has been practiced in the mountain villages for two centuries.
    cultural_status: mistaken for harmless until the moment they are not
    disposition_toward:
      The Burning Throne: amused contempt, operationalized
