# Character portraits for The Shattered Accord
# Visual descriptions for Flux portrait generation
# Culture aesthetics map to the 8 cultures in cultures.yaml

characters:
  # ── THE PARTY ──────────────────────────────────────────────────

  - name: Won Pyru
    role: The Master Who Walks
    type: npc_major
    appearance: >-
      An old man in his seventies with deep weathered skin and calloused
      hands that look like they belong to a farmer, not a channeler.
      White hair pulled back in a simple knot. Eyes that miss nothing
      but pretend to see only the middle distance. Wears plain undyed
      linen, patched and re-patched. A worn ironwood staff leans
      against his shoulder. No jewelry, no insignia, no sign of rank.
      The only tell is his posture — perfectly balanced, weight
      centered, the unconscious stance of someone who has trained
      for fifty years.
    culture_aesthetic: >-
      Saffron Reaches origin — Vedic India aesthetic, but deliberately
      stripped of all markers. No ochre robes, no sacred threads, no
      temple marks. He has erased his own identity.
    element_visual: >-
      Multi-element master — faint shimmer in the air around his hands,
      barely visible. Earth stability, wind in his hair, warmth
      radiating from his skin, moisture in his breath. All elements
      present but none dominant.

  - name: Zhang
    role: The Soldier Who Chose
    type: npc_major
    appearance: >-
      Eighteen years old, lean and angular, with the close-cropped
      hair and rigid bearing of a garrison soldier who left his post
      three weeks ago. Clean-shaven, sharp jawline, dark eyes that
      hold steady when others would look away. A fading tan line on
      his forehead where a helmet sat. Wears civilian clothes now but
      stands like a soldier — feet shoulder-width, hands never in his
      pockets, always aware of exits.
    culture_aesthetic: >-
      Saffron Reaches garrison — Vedic India military aesthetic, ochre
      and saffron tones faded from his clothes, leather bracers from
      his kit still worn out of habit. The Kṛṣṇa Mandala unit badge
      is gone but the mark on his sleeve where it was stitched remains.
    element_visual: >-
      Channeling student — no visible elemental affinity yet. Clean,
      unadorned, potential rather than power.

  - name: Bao Shen
    role: Highland Resistance Commander
    type: npc_major
    appearance: >-
      A woman in her fifties with iron-grey hair worn in a practical
      braid, sun-darkened skin from decades of highland farming, and
      hands that are equally comfortable holding reins and writing
      orders. Strong build, not tall but commanding. Wears highland
      working clothes — layered wool and leather, practical boots,
      a belt hung with message pouches and a jade-stamped rider token.
      Her face shows the lines of someone who smiles rarely but means
      it when she does.
    culture_aesthetic: >-
      Jade Kingdoms highland — Chinese rural aesthetic, practical
      and unadorned compared to the imperial lowlands. Jade-green
      accents in cloth and stone jewelry, but working-class, not
      courtly.
    element_visual: >-
      Not a channeler — no elemental markers. Her power is
      organizational, human, earned through trust.

  # ── JADE RECLAMATION ───────────────────────────────────────────

  - name: Songnan the Silent
    role: Jade Reclamation Strategist
    type: npc_major
    appearance: >-
      A man who looks carved from the same jade-veined stone as his
      throne room. Late forties, heavyset, completely still. Shaved
      head, heavy brow, eyes like polished obsidian that reflect
      light but reveal nothing. Wears layered imperial robes of deep
      green and grey, each layer embroidered with earth-channeling
      sigils. His hands rest on the stone table and you cannot tell
      where the stone ends and his skin begins. He has not spoken in
      three days. He does not need to.
    culture_aesthetic: >-
      Jade Kingdoms imperial — dynastic China aesthetic, monumental
      and severe. Heavy silk robes, jade ornaments, earth tones.
      Every element of his appearance communicates permanence and
      authority.
    element_visual: >-
      Earth channeler — skin has a faint mineral sheen, fingernails
      dark as basalt, the stone beneath him hums when he concentrates.
      Deep earth resonance made flesh.

  - name: Pingzhou Anhai
    role: Jade Reclamation Intelligence
    type: npc_supporting
    appearance: >-
      A handsome man in his thirties who looks like a prosperous
      merchant — pleasant smile, well-tailored traveling clothes,
      ink-stained fingers that suggest a scholar. Nothing about him
      says assassin. That is the point. His eyes are warm and his
      handshake is firm and his assessment notices arrive after he
      has already mapped your water sources and counted your
      defenders.
    culture_aesthetic: >-
      Jade Kingdoms bureaucratic — Chinese scholar-official aesthetic,
      understated elegance, ink and paper, jade seal ring.
    element_visual: >-
      Earth channeler — subtle, concealed. No visible markers when
      he chooses to hide them.

  # ── ACCORD REBORN ──────────────────────────────────────────────

  - name: Dhya of the Eternal Cloud
    role: Accord Reborn Leader
    type: npc_major
    appearance: >-
      A tall woman in her sixties with silver-white hair that floats
      around her head in a permanent halo of static charge. Thin,
      almost gaunt, with the hollow cheeks and enormous lungs of
      someone who has lived at extreme altitude for decades. Her skin
      is weathered by wind to the texture of old parchment. Wears
      layered robes of sky-blue and white that billow constantly
      even in still air. Her voice carries unnaturally far.
    culture_aesthetic: >-
      Sky Temples monastic — Tibetan-Nepali aesthetic, prayer flags,
      wind-worn fabrics, floating stone monastery. High altitude
      ascetic, not comfortable.
    element_visual: >-
      Air channeler — hair floats in static charge, robes billow
      without wind, her breath is visible even in warm air. Lightning
      scars trace her forearms like white tattoos.

  # ── DROWNED COVENANT ───────────────────────────────────────────

  - name: Ananga of the Deep Atoll
    role: Drowned Covenant Leader
    type: npc_major
    appearance: >-
      A woman whose humanity is slipping away. Her skin has gone
      translucent — you can see blue veins and the shadow of bone
      beneath. Her eyes are lightless, dark as deep ocean, with no
      visible iris. Her voice carries the harmonic resonance of deep
      water, as if two people are speaking at once. Black hair hangs
      wet and heavy, draped with strands of living coral and tiny
      shells. She is beautiful in the way a riptide is beautiful —
      the beauty is the warning.
    culture_aesthetic: >-
      Tide Reaches deep — Polynesian-Pacific Islander aesthetic
      pushed to the supernatural. Coral jewelry, shell armor, tattoos
      of wave patterns that seem to move. Drowned palace elegance.
    element_visual: >-
      Water channeler, spirit-merged — translucent skin, lightless
      eyes, coral growing from her jewelry into her skin. The water
      around her rises when she is angry.

  # ── SEALED GATE ────────────────────────────────────────────────

  - name: Mong of Iron Stronghold
    role: Sealed Gate Commander
    type: npc_supporting
    appearance: >-
      A broad man built like the granite he channels, with iron-grey
      hair cut close to the skull and a face that looks like it was
      hewn with a chisel. Deep-set eyes, permanent frown, massive
      hands that he keeps flat on surfaces — feeling vibrations
      through a hundred meters of solid rock. Wears Iron Peaks
      military dress — dark leather and steel, practical, no
      ornamentation except the fortress-mine seal on his collar.
    culture_aesthetic: >-
      Iron Peaks military — Joseon Korea aesthetic, austere and
      martial. Dark leather, hammered steel, mountain fortress
      severity. Function over form in everything.
    element_visual: >-
      Earth channeler (iron specialization) — faint metallic sheen
      to his skin, calluses that look more like stone than flesh.
      The ground does not shake when he walks. It listens.

  # ── MONSOON PACT ───────────────────────────────────────────────

  - name: Garuda Kreah
    role: Monsoon Pact Leader
    type: npc_major
    appearance: >-
      A commanding man in his forties with deep brown skin, an
      athlete's build, and the scarification patterns of a monsoon-
      dance channeler across his chest and arms — raised lines that
      follow the paths of wind currents. His hair is long, black,
      worn loose, and it moves with a life of its own in the charged
      air around him. Gold rings in both ears, gold at his wrists,
      gold thread in his storm-blue robes. His smile is wide and
      warm and does not reach his eyes.
    culture_aesthetic: >-
      Monsoon Courts royal — Khmer-Thai aesthetic, Angkor Wat temple
      elegance. Gold, storm-blue silk, serpent motifs, monsoon-dance
      scarification, elevated temple-city opulence.
    element_visual: >-
      Wind and storm channeler — scarification patterns glow faintly
      during storms, his hair moves against the wind, the air around
      him smells of ozone and rain.

  # ── THE ARCHITECT ──────────────────────────────────────────────

  - name: Grand Master Po
    role: The Puppeteer
    type: npc_major
    appearance: >-
      An old man — older than Won Pyru, perhaps eighty, perhaps more.
      Small, thin, with a face like crumpled paper that has been
      carefully smoothed out. His eyes are the only young thing about
      him — bright, quick, calculating, sad. Wears the robes of no
      nation and every nation — layers that suggest Sky Temple cuts,
      Jade Kingdom embroidery, Saffron weave, Monsoon Courts gold
      thread, all faded, all patched, all from a life spent
      everywhere and belonging nowhere. His hands shake. His voice
      does not.
    culture_aesthetic: >-
      No single culture — a composite of all eight, deliberately.
      Layers from every nation, faded and worn. A walking map of
      the world he is trying to save.
    element_visual: >-
      Multi-element master (retired) — no visible channeling. The
      absence of elemental display is itself the tell. Every other
      master leaks. Po is perfectly still. That is terrifying.
