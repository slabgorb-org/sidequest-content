  # ════════════════════════════════════════════════════════════════════
  # COMPANION CREATURES — player's pet at the table
  # Reusable animal-companion templates, rendered in this world's discipline.
  # ════════════════════════════════════════════════════════════════════

  - id: companion_cat
    name: Cat
    role: A temple-shrine cat that allows the channelers to feed it
    type: companion_creature
    appearance: >-
      A short-haired cat seated bolt upright on worn stone steps, spine
      vertical, chin lifted so the muzzle tilts skyward. Eyes half-closed
      to amber slits, gaze angled down past the viewer. Forelegs perfectly
      straight and parallel, paws set precisely together. The long tail
      curls in one clean arc around the paws, tip resting just so. Coat
      smooth and unbroken, every whisker symmetrical. A single ear swivels
      back while the body holds its composed, statuesque stillness.
    culture_aesthetic: >-
      Saffron and warm gold ink-wash over jade temple stone, a thread of
      spirit-light leaking from a tear in the air behind.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_owl
    name: Owl
    role: A monastery owl who has read the spirit-ward scrolls and disagrees
    type: companion_creature
    appearance: >-
      A round-bodied owl perched on a carved wooden rail, head tilted
      sharply to one side and lowered so it peers down the curve of its
      hooked beak. The feathered brows are drawn up and forward, bunching
      above wide forward-facing eyes fixed in scrutiny. One taloned foot is
      lifted clear of the perch, claws half-spread mid-gesture. Breast
      plumage lies in neat overlapping rows; the facial disc is sharply
      defined. Wings folded tight and trim, the whole posture leaning in
      to examine.
    culture_aesthetic: >-
      Cool grey and ash-blue ink wash on parchment-pale ground, the thin
      light of a high mountain dusk.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_raven
    name: Raven
    role: A crossroads raven that knows which travellers never arrived
    type: companion_creature
    appearance: >-
      A large glossy raven hunched low on a weathered post, shoulders
      drawn up and head cocked far to one side, a single round eye catching
      the light in a sidelong glint. Held beneath one lifted claw is a small
      bright object — a coin-round shard that throws a hard spark. The thick
      beak parts slightly. Plumage is sleek and oiled, throat hackles
      bristling, the long primary feathers crossed over the tail. The whole
      crouched silhouette leans inward, conspiratorial and watchful.
    culture_aesthetic: >-
      Brushed black and deep indigo against a storm-grey wash, one cold
      spark of spirit-light caught at the eye.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_toad
    name: Toad
    role: A shrine-pond toad that outwaits everyone and everything
    type: companion_creature
    appearance: >-
      A large squat toad settled low on damp flat stone, belly nearly
      touching the rock, legs tucked compact beneath the heavy body. The
      wide mouth is closed in a long flat line; the lidded eyes are
      half-shut, bulging gently above. Warty mottled skin sits loose over
      the broad back. It does not move — the pose is entirely still, weighty
      and grounded. A single small beetle rests on the stone a hand's-width
      from its nose, and the toad simply watches it.
    culture_aesthetic: >-
      Mossy jade-green and wet-bronze ink over pond-dark shrine stone, a
      low warm glow pooling at the water's edge.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_goat
    name: Goat
    role: A highland goat that has eaten one of every nation's prayer flags
    type: companion_creature
    appearance: >-
      A shaggy highland goat standing square and braced, all four hooves
      planted wide, head lowered so the curved horns tip forward toward the
      viewer. The jaw works visibly to one side, mid-chew, a frayed end of
      cloth hanging from the corner of the mouth. The eyes are pale with
      horizontal rectangular slot pupils, fixed in a flat unblinking stare.
      A short beard hangs from the chin; the coat is thick and weather-matted
      over a stocky frame. Ears held low and back, the whole stance set and
      immovable.
    culture_aesthetic: >-
      Earthen ochre and slate ink-wash against drifting highland cloud,
      cold mountain light raking the horns.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.
