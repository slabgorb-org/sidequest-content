# Shattered Accord — WWN Backgrounds, world tier (SRD §1.3)
#
# Backgrounds matched to the eight cultural origins in char_creation.yaml.
# The Shattered Accord is the Burning Peace's darker mirror: the Accord
# Eternal shattered fourteen centuries ago, the spirit world now bleeds
# through tears in the sky, and every culture carries the specific shape
# of how it adapted to living in a world that is permanently broken.
# Skill names must be in elemental_harmony/skills.yaml.

- id: ember-isles-born
  display_name: Ember Isles Born
  description: >-
    Volcanic archipelagos wreathed in forge-smoke where channeling is
    refined through rigid kata at Shijin Shrine and the Shattering's
    legacy is a strict policy of elemental discipline. Fire that is not
    controlled is fire that consumes the one who carries it. You were
    taught this before you were taught to read.
  free_skill: Exert
  quick_skills:
    - Exert
    - Perform

- id: jade-kingdoms-born
  display_name: Jade Kingdoms Born
  description: >-
    A diminished empire of stone and patience that still claims sovereign
    right over the Broken Nexus and has garrisoned the Celestial Wall to
    prove it. You carry three thousand years of imperial doctrine in your
    posture, and you carry the weight of knowing the empire is no longer
    what those three thousand years were building toward.
  free_skill: Lead
  quick_skills:
    - Lead
    - Know

- id: sky-temples-born
  display_name: Sky Temples Born
  description: >-
    Mountain monasteries above the cloud-line where the Accord Reborn
    insists that air is the binding breath of a new world. You pursued
    channeling as breath and altitude and the long patience of the
    rope-bridges, and you have noticed that the rope-bridges are more
    political than they used to be.
  free_skill: Pray
  quick_skills:
    - Pray
    - Survive

- id: iron-peaks-born
  display_name: Iron Peaks Born
  description: >-
    Granite ranges honeycombed with mines and gates sealed with channeled
    stone after the betrayal at Hyeong Ridge. You were raised to trust
    the mountain and no one beyond it. You are a long way from the
    mountain now, and you have not resolved how you feel about that.
  free_skill: Craft
  quick_skills:
    - Craft
    - Exert

- id: monsoon-courts-born
  display_name: Monsoon Courts Born
  description: >-
    Jungle river kingdoms where channeling is monsoon-dance and
    blood-offering: at the Flowering Falls below Rathep's Temple, the
    storm-dancers cut their palms over the cataract and dance the
    storm down out of the tears in the sky, and the storm that answers
    a gift of pain answers with devastating force. Since the Monsoon
    Pact began garrisoning Rathep's Temple, the offerings have gotten
    larger and the storms harder to send home. You move while you
    speak, never entirely still, and your palms carry the thin pale
    dance-scars that mark everyone raised to the Falls.
  free_skill: Perform
  quick_skills:
    - Perform
    - Connect

- id: tide-reaches-born
  display_name: Tide Reaches Born
  description: >-
    Half-drowned island chains that never recovered from the Drowning of
    Qalanolei. You followed the tide out past the sunken atolls and have
    never stayed long in any one harbor since — partly by necessity,
    partly because the atolls taught you that permanence is a preference,
    not a guarantee.
  free_skill: Sail
  quick_skills:
    - Sail
    - Survive

- id: lotus-provinces-born
  display_name: Lotus Provinces Born
  description: >-
    Coastal trading cities of the Silk Delta, squeezed between expanding
    spheres of influence and surviving because they know what everyone
    wants. Knowledge flows like water here, and every merchant keeps a
    scholar's ledger and a survivor's caution. You are careful about what
    you know and more careful about what you let anyone know you know.
  free_skill: Trade
  quick_skills:
    - Trade
    - Know

- id: saffron-reaches-born
  display_name: Saffron Reaches Born
  description: >-
    Temple cities on golden plains where the boundary between world and
    spirit is thinnest — and where complicity with the Jade Reclamation
    has begun to wear ochre robes. You walk closer to the spirits than
    most dare. You have also learned to walk carefully around the people
    who have noticed that you do.
  free_skill: Pray
  quick_skills:
    - Pray
    - Heal
