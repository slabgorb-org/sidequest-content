# Shattered Accord — World-Specific NPC Archetypes
# A world where elemental spirits flood through tears in reality.

- name: The Jade Officer
  description: >-
    A channeler-soldier of the Jade Reclamation, disciplined and
    certain that reunification under the Jade Kingdoms is the only
    path to restoring the Accord. Earth-channeling training makes
    them immovable in combat and inflexible in negotiation.
  personality_traits:
    - disciplined
    - loyal to the empire
    - privately doubtful
  typical_classes:
    - Guardian
    - Martial Artist
  typical_races:
    - Jade Kingdoms
  stat_ranges:
    STR: [12, 16]
    CON: [14, 18]
  inventory_hints:
    - jade-inlaid armor of rank
    - a sealed scroll of orders
    - earth-channeling focus stone
  dialogue_quirks:
    - quotes imperial doctrine as if it were natural law
    - pauses before speaking, as if listening to something underground
  disposition_default: -5
  ocean:
    openness: 2.5
    conscientiousness: 8.5
    extraversion: 4.0
    agreeableness: 3.0
    neuroticism: 4.5

- name: The Spirit Mender
  description: >-
    A member of the Accord Reborn who travels between the shattered
    nations, attempting to heal the spirit-tears through voluntary
    elemental alignment. Carries the scars of failed bindings and
    the hope that the next one will hold.
  personality_traits:
    - idealistic
    - exhausted
    - stubbornly hopeful
  typical_classes:
    - Channeler
    - Spirit Medium
  typical_races:
    - Sky Temples
    - Spirit-Touched
  stat_ranges:
    WIS: [14, 18]
    CHA: [14, 18]
  inventory_hints:
    - a set of eight elemental focus stones, most cracked
    - a journal of failed binding attempts
    - meditation incense from the Sky Temples
  dialogue_quirks:
    - apologizes to spirits before channeling them
    - describes the Shattering as a wound, not an event
  disposition_default: 10
  ocean:
    openness: 8.0
    conscientiousness: 6.0
    extraversion: 5.0
    agreeableness: 8.0
    neuroticism: 6.0

- name: The Iron Forgemaster
  description: >-
    A smith from Hyeong Ridge who works spirit-infested iron into
    weapons and tools. The fire-spirits that nest in the twisted
    metal of the Ridge are not tamed — they are negotiated with,
    hammer-blow by hammer-blow. Every piece they forge has a temper
    in both senses.
  personality_traits:
    - gruff
    - proud of craft
    - wary of outsiders
  typical_classes:
    - Guardian
    - Wanderer
  typical_races:
    - Iron Peaks
  stat_ranges:
    STR: [14, 18]
    CON: [12, 16]
  inventory_hints:
    - a forge-hammer with spirit-marks
    - iron filings that glow faintly orange
    - burn scars that pattern like forge-script
  dialogue_quirks:
    - talks about metal the way others talk about people
    - taps surfaces to listen to their composition
  disposition_default: -5
  ocean:
    openness: 3.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 3.5
    neuroticism: 4.0

- name: The Monsoon Dancer
  description: >-
    A water-channeler from Rathep's Temple trained in the monsoon-dance
    tradition. Their channeling is performance — fluid, violent, and
    beautiful. The blood-offerings they make are their own, and the
    ocean-spirits respond to the gift with devastating force.
  personality_traits:
    - passionate
    - theatrical
    - deeply spiritual
  typical_classes:
    - Channeler
    - Martial Artist
  typical_races:
    - Monsoon Courts
  stat_ranges:
    DEX: [14, 18]
    WIS: [12, 16]
  inventory_hints:
    - ritual scarification knife
    - a vial of monsoon water from Rathep's Temple
    - dancer's wraps in storm-grey silk
  dialogue_quirks:
    - moves while speaking, never entirely still
    - refers to the ocean as a person with moods
  disposition_default: 5
  ocean:
    openness: 7.0
    conscientiousness: 5.0
    extraversion: 7.5
    agreeableness: 5.5
    neuroticism: 5.0
