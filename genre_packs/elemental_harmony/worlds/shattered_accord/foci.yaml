# Shattered Accord — WWN Foci, world tier (SRD §1.5)
#
# Eight foci matched to the Shattered Accord's eight cultural backgrounds.
# The Shattered Accord register: spirit-tears in the sky, the broken nexus,
# each culture carrying the specific shape of its adaptation to a world
# where the spirit plane is permanently fused with the mortal one.
# Skill names must be in elemental_harmony/skills.yaml.

- id: kata-memory
  display_name: Kata Memory
  description: >-
    Shijin Shrine's instruction holds that fire not controlled is fire
    that consumes its bearer. The kata were refined over fourteen
    centuries of managing that risk, and you carry them in your muscles
    as a permanent precaution.
  levels:
    - skills:
        Exert: 1
      abilities:
        - name: Controlled Burn
          genre_description: >-
            When the spirit-tears open near you, the kata fires before
            the panic does. Fourteen centuries of Shijin Shrine training
            is in your hands, and your hands know what to do.
          mechanical_effect: >-
            Once per scene, when a spirit or elemental effect would
            disrupt your channeling or impose a penalty on a physical
            action, you may make an Exert check (difficulty 10) to act
            through the disruption at full capacity. Failure still
            reduces the penalty by half.
          involuntary: false

- id: empire-bearing
  display_name: Empire Bearing
  description: >-
    Three thousand years of empire is in your posture, and the Jade
    Kingdoms' long memory is in your arguments. When you say the
    empire was here before the Shattering, you are not wrong — and the
    weight of that fact is something you know how to use.
  levels:
    - skills:
        Lead: 1
      abilities:
        - name: The Long Claim
          genre_description: >-
            You carry an empire's institutional memory as a negotiating
            position. This is both impressive and, depending on who is
            listening, deeply unwelcome.
          mechanical_effect: >-
            Once per session, when negotiating with a faction or individual
            who has any relationship — positive or adversarial — with the
            Jade Kingdoms or its history, you may invoke the empire's
            precedent to demand a hearing. The party cannot simply dismiss
            you; they must engage with your position before declining.
            This is social, not magical, and they may still decline.
          involuntary: false

- id: altitude-patience
  display_name: Altitude Patience
  description: >-
    Rope-bridge monasteries above the spirit-fog teach a patience that
    is structural rather than passive — the kind that holds the weight
    of the world because the alternative is letting it fall. You learned
    to wait when waiting is right, and you learned it in a place where
    waiting wrong was immediately fatal.
  levels:
    - skills:
        Pray: 1
      abilities:
        - name: Long Vigil
          genre_description: >-
            Spirit-tears in the sky are not announced. You have learned
            to maintain sustained attention across long periods without
            stimulation, because the tear that opens while you are
            distracted is the one that gets people killed.
          mechanical_effect: >-
            You may maintain concentration on a channeling working or
            watching vigil for twice the normal duration without rolling
            for distraction. Once per session, at the end of a long vigil
            or meditation, you may ask the narrator one factual question
            about something you have been paying sustained attention to.
          involuntary: false

- id: mountain-craft
  display_name: Mountain Craft
  description: >-
    Iron Peaks gates are sealed with channeled stone, and you learned
    to work with both the material and the force in it. You know when
    something is sealed against entry and when it is sealed to protect
    what is inside. The distinction matters more than most people realize.
  levels:
    - skills:
        Craft: 1
      abilities:
        - name: Sealed Work
          genre_description: >-
            After Hyeong Ridge, the Iron Peaks sealed every gate into
            their ranges. You understand the craft of that sealing —
            and therefore the craft of its bypass.
          mechanical_effect: >-
            When examining a sealed or channeled construction, you may
            make a Craft check (difficulty 10) to determine the method
            of sealing and whether it has been disturbed. On a success,
            you also identify one physical method of bypassing or
            reinforcing it without triggering what the sealing was
            meant to prevent.
          involuntary: false

- id: dance-speak
  display_name: Dance-Speak
  description: >-
    The Monsoon Courts channel through movement, and the spirits that
    answered them for centuries knew to look for the gesture before the
    word. You carry this as a fluency — you communicate with your body
    as precisely as with language, and you read others' bodies the same way.
  levels:
    - skills:
        Perform: 1
      abilities:
        - name: Gesture Reading
          genre_description: >-
            You read intent from movement before you read it from speech.
            In a world where spirits communicate through elemental gesture,
            this is not a metaphor — it is a literacy.
          mechanical_effect: >-
            Once per scene, you may read one person's genuine intent —
            not their stated intent — from their physical bearing. Make
            a Notice check (difficulty 10). Success tells you whether
            what they are doing matches what they are saying. It does not
            tell you their specific motivation, only the alignment.
          involuntary: false

- id: tide-reading
  display_name: Tide Reading
  description: >-
    The Tide Reaches follow currents — water currents, spirit currents,
    the current of a situation about to change direction. You followed
    the tide out past the Drowning of Qalanolei's sunken atolls and
    found that everything in the world has a tide if you watch long enough.
  levels:
    - skills:
        Notice: 1
      abilities:
        - name: Current Sense
          genre_description: >-
            The spirit-tears shift — they open and close on patterns that
            reward attention. You read changes early, whether they are
            elemental, meteorological, or political.
          mechanical_effect: >-
            Once per scene, you may make a Notice check (difficulty 10)
            to anticipate the direction of a change before it occurs —
            a spirit-tear opening, a shift in faction pressure, a change
            in a crowd's mood. Success gives you one round of advance
            knowledge. Failure costs nothing.
          involuntary: false

- id: current-price
  display_name: Current Price
  description: >-
    Lotus Provinces merchants keep a scholar's ledger and a survivor's
    caution in a city squeezed between expanding spheres of influence.
    You learned that information is a commodity, that its price changes
    with circumstances, and that the person who knows what something is
    worth today is always better positioned than the person who knew
    last month.
  levels:
    - skills:
        Trade: 1
      abilities:
        - name: Leverage Point
          genre_description: >-
            You know what the thing you are negotiating for is worth to
            the other party — not to the market, but to them, today,
            given their current position relative to the Jade Reclamation
            or the Accord Reborn or whichever faction is pressing them.
          mechanical_effect: >-
            Once per session, when negotiating for something, you may
            make a Trade check (difficulty 10) to learn the other party's
            actual bottom line — not their opening position. On a success,
            the narrator tells you whether they would accept significantly
            less than they have asked.
          involuntary: false

- id: spirit-adjacent
  display_name: Spirit-Adjacent
  description: >-
    On the Saffron Reaches, the boundary between mortal and spirit world
    is thin — thinner since the Shattering — and walking close to it has
    produced a people who navigate both sides with a considered calm that
    others mistake for fatalism. You are not afraid of spirits. You are
    watching to see which ones are also watching you.
  levels:
    - skills:
        Pray: 0
        Notice: 0
      abilities:
        - name: Spirit-Side Familiarity
          genre_description: >-
            You grew up next door to the other side, and you are not
            alarmed by what comes through. The ones that perform fright
            strike you as working hard. The genuinely dangerous ones
            you recognized early because they were not performing.
          mechanical_effect: >-
            You are immune to fear effects from spirits who are attempting
            to frighten you. Spirits who are not performing may choose to
            speak to you directly without a roll — this is their option,
            not a command. Once per session, you may ask a spirit present
            in the scene one question it is permitted to answer.
          involuntary: false
