# Shattered Accord — bestiary-curation SOURCE corpus (recipe Stage 0).
#
# The source is the SETTING ITSELF, not the D&D SRD. These are the fauna,
# channeler-castes, and yaoguai / restless dead of the eight shards, fourteen
# centuries after the Shattering of the Accord Eternal — a pan-East-Asian
# wuxia/elemental world (a Chinese-myth core of jiangshi, hungry ghosts,
# fox-spirits, buried terracotta hosts and lung dragon-serpents, joined by the
# Iron Peaks' granite-channelers and the southern Monsoon/Sky-Temple castes).
# Each row is authored onto the SRD row shape with a plausible 5e `type` (the
# GATE-1 allow/deny key in world_register.yaml) and a `cr` (the WWN stat-ladder
# key — see the bestiary-curation recipe CR->level table).
#
# Provenance of the CR choices: each row's CR is the band that lands the
# creature on its setting-true WWN level — the hopping corpse and the hungry
# ghost sit low, the lung dragon and the deathless Accord-era sorcerer sit at
# the deep cap of what this world reaches. The numbers that come OUT of the
# ladder (hp / save / attack_bonus / skill) are derived, NEVER hand-balanced
# (SOUL: "Bind the Ruleset, Don't Balance It"). Prose is authored in
# bestiary.yaml.
#
# SIBLING: this corpus shares its allow/deny ALGEBRA and creature philosophy
# with elemental_harmony/burning_peace (Edo/Japanese). The two read as siblings
# (like evropi/long_foundry); each carries its own regional vocabulary.
#
# This corpus PRESERVES the world's existing 25-entry roster (ADR-140: the
# world owns the cast). GATE 1 culls nothing — every row is shard setting-true
# — and that clean pass is itself the fidelity proof. The world_register deny
# lists are the firewall against a FUTURE author padding the shards with the
# Western dungeon menagerie, not active culls here.

