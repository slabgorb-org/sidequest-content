      hoppers raised from the same plague-pit that took its house.
  - id: deathless_accord_sorcerer
    name: Deathless Accord-Era Sorcerer
    level: 8
    hp: 36
    armor_class: 16
    attack_bonus: 8
    damage: "1d8"
    move: "30 ft."
    morale: 12
    skill: 3
    save: 11
    role: undying mage who survived the Shattering
    tags: [undead, sorcerer, deathless, deep]
    abilities:
      - "Fearless — never checks morale"
      - "Immune to mundane damage, poison, and mind-altering magic — its veins run cinnabar and refined mercury"
      - "Twice per fight it vents the shard-fire banked in its core; a 40-ft. burst, evasion save for half of 5d8"
      - "Cannot be truly slain until the golden core refined in its belly — a stolen shard-splinter fused to its own hoarded breath — is cut out and shattered"
    description: >-
      A cultivator of the old Accord who, when the order shattered, refused the
      death it had earned him. Across fourteen centuries he has refined his own
      corpse from the inside out — swallowing the last breath of the dying,
      folding it down with cinnabar and a stolen splinter of one of the eight
      shards until a golden core sat hard and cold behind his sternum where a
      heart once beat. His flesh has cured to something between jade and dried
      meat; he does not breathe, does not age, does not forgive. Cut him open
      and the core still burns — and until it is broken, neither will he stop.
