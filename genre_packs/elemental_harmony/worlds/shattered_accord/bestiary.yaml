      Reclamation's tunnel-channelers boring through living rock toward their
      enemies' foundations. It does not so much appear as the tunnel itself
      stands up — a churning wall of stope-rubble, severed root, and broken
      shoring that takes a shape only to crush the diggers who disturbed it.
      It cannot be bargained with and cannot be outrun underground; it is the
      mountain refusing to be mined.
