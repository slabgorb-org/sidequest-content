      that gash the sky and given a furious half-shape by the fall. It is
      less a body than a knot of screaming wind — and the screaming carries.
      Folk who live beneath the tears stop their ears with wax against the
      voices that ride the gales, for the wind of a loosed sky-spirit speaks,
      and what it says unmakes the listener's nerve.
  - id: cave_tiger
    name: Cave Tiger
    level: 5
    hp: 22
    armor_class: 13
    attack_bonus: 5
    damage: "1d8"
    move: "30 ft."
    morale: 8
    skill: 2
    save: 13
    role: white tiger the mountain villages name the peak-spirit's hound
    tags: [beast, mid]
    abilities:
      - "Pounce from the dark — its first strike out of the cave-black goes unseen; a surprised creature is bowled down and savaged"
      - "Mountain-lord's hound — the high villages set goats at its cave-mouth and dare not lift a hand against it, half-certain it answers to the spirit of the peak"
    description: >-
      A pale tiger of the high karst caves, broad-pawed and silent on the wet
      stone, its coat the white of the West and the autumn that the old shrines
      paint on the Tiger of the four directions. The mountain villages leave it
      goats at the cave-mouth and will not call it a beast: to them it is the
      peak-spirit's own hound, and to strike it is to open a feud with the
      mountain itself. It has simply learned that the cliff-paths are easier
      hunting than the goats.
  - id: rogue_earth_spirit
    name: Rogue Earth Spirit
    level: 6
    hp: 27
    armor_class: 15
    attack_bonus: 6
    damage: "1d10"
    move: "20 ft."
    morale: 12
    skill: 0
