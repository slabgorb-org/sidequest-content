# Shattered Accord — world bestiary (shattered_accord_bestiary)
#
# World-tier roster for the elemental_harmony pack. The pack ships NO
# genre-level bestiary, so this file is the full populated stat-block set
# encountergen samples for the Monster Manual encounters of the eight shards,
# fourteen centuries after the Shattering (ADR-140: the genre is the rulebook,
# the world owns the cast). Narrative layers (OCEAN, visual prompt) are composed
# at generation time; image medium/style lives in visual_style.yaml, never in a
# per-entity appearance field.
#
# WWN ruleset module (see ../../rules.yaml: ruleset: wwn). Generic OSR stat
# lines: level == HD, hp == the WWN ladder table (avg 4.5/HD rounded — a TABLE,
# not a formula), ascending AC, attack_bonus == level, morale on the 2d6 ladder
# (12 = Fearless / auto-pass), save == 15 − floor(level/2).
#
# ════════════════════════════════════════════════════════════════════
#  BESTIARY-CURATION PROVENANCE  (recipe: ../../../../docs/bestiary-curation-recipe.md)
# ════════════════════════════════════════════════════════════════════
#  SOURCE: the SETTING ITSELF, not the D&D SRD. 25 rows of shard fauna,
#    channeler-castes, and pan-East-Asian-myth yaoguai / restless dead
#    (corpus/monsters.yaml) — a Chinese-myth core (jiangshi, hungry ghosts,
#    fox-spirits, terracotta hosts, lung dragon-serpents, deathless cultivators)
#    joined by the Iron Peaks and the southern Monsoon/Sky-Temple castes.
#
#  GATE 1 — world_register.yaml genre-truth, applied against corpus/monsters
#    .yaml: kept 25, dropped 0. The corpus is wholly shard setting-true, so
#    nothing is culled — that clean pass IS the fidelity proof. The deny lists
#    (Western dungeon-fantasy types / tags / name_globs: SRD chromatic dragons,
#    demons, goblins, owlbears, liches, vampires, the fairy-tale fey …) are the
#    firewall against a future author padding the shards with the SRD menagerie,
#    not active culls here.   [tool: bestiary_curator]
#  GATE 2 — tone curation ("wuxia/elemental, grand, grudge-bound, lethal; never
#    comic, never cute"): HAND pass. No GATE-1 survivor removed for tone — every
#    row is setting-true to the shard-war register. The restless dead are folk-
#    myth dread (the hopping corpse, the hungry ghost before a ruined kitchen,
#    the buried clay host still holding its picket), never joke-monsters.
#
#  CONVERSION — WWN ladder via bestiary_curator: level assigned by CR band
#    (L1 hopping corpses & vermin → L8 the drowned leviathan and the deathless
#    Accord-era sorcerer; the shards top out modestly — no dragon-tier
#    inflation); hp/save/attack_bonus VERBATIM off the ladder (hp table; save
#    15 − level//2; attack_bonus == level). skill follows the ladder band,
#    EXCEPT the mindless cohort — raw elemental spirits, animated clay/jade
#    constructs, and the will-less battle-dead/hopping corpses — which take
#    skill 0 with morale 12 / Fearless (the recipe's beneath_sunden & barsoom
#    treatment). AC and morale are archetype-tuned by hand. Prose authored here.
#  PRESERVATION (ADR-140): this pass RE-LADDERED the world's existing 25-entry
#    roster onto the verbatim ladder — it did not clobber it. The prior file ran
#    attack_bonus one-or-more high (e.g. grudge-bound officer +5 at L3, jade
#    guardian +7 at L5, leviathan +10 at L8) and put L5 hp at 23; both are
#    corrected here. All 25 original entries survive with their prose,
#    abilities, damage, move, AC, and morale intact. Numbers are ladder-derived,
#    NEVER hand-balanced (SOUL: "Bind the Ruleset, Don't Balance It").
#
#  DIAMONDS (ADR-014, the illustrated capstones): the Lesser Lung Dragon (the
#    Eastern long — a dragon-serpent SPIRIT, MARQUEED in world_register so the
#    shared Dragon-type firewall cannot bar it; typed Monstrosity, never an SRD
#    wyrm) · the deathless Accord-era sorcerer · the greater jiangshi lord · the
#    river-mother naga · the jade threshold-guardian.
#
#  SIBLING: shares its allow/deny algebra and creature philosophy with
#    elemental_harmony/burning_peace (Edo/Japanese); each world carries its own
#    institutional vocabulary over the shared gate.
#  VALIDATION: load_genre_pack PASS; validate pack PASS.
# ════════════════════════════════════════════════════════════════════
