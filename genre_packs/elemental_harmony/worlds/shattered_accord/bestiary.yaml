      - "Undertow — the water around it runs against the wind; a creature caught in the current makes a Physical save or is dragged down into the lightless deep"
      - "Drowning-song — it sings from far below, and a creature that hears makes a Mental save or strikes out swimming toward the sound, certain there is air ahead"
      - "Glutted on the drowned — six centuries fat on the drowning, its wounds seal over in deep water unless they are dealt by channeled flame or raw shard-light"
    description: >-
      One of the deep-ocean spirits that Taamila's pact glutted and never
      sated — grown across six centuries into a serpent vast enough to wear a
      name in four reef-tongues, scaled like wet slate, prowling the lightless
      trenches off drowned Qalanolei. Sailors who try the Hungering Deep hear
      it first as singing beneath the hull: low, patient, sweet — the sound
      that has emptied every ship to attempt the crossing. By the time they
      understand the song is a mouth, the current already has them.

