  - id: river_serpent_naga
    name: River-Mother Serpent-Spirit
    level: 4
    hp: 18
    armor_class: 15
    attack_bonus: 4
    damage: "1d10"
    move: "30 ft. swim 40 ft."
    morale: 9
    skill: 2
    save: 13
    role: bereaved drowning-mother of a flooded shrine
    tags: [spirit, serpent, naga, mid]
    abilities:
      - "Cradling coils — a creature she takes hold of makes a physical save or is gathered tight against her and borne gently, inexorably, down under the water"
      - "A creature that meets her grieving gaze makes a mental save or stands becalmed, unwilling to raise a hand against so sorrowful a thing"
      - "Adopts the warm — she does not devour what she drowns; she carries it down and arranges it in the silt of her nest among the pale shapes already there"
    description: >-
      A great pale-scaled serpent with a woman's grieving face, coiled in the
      silt of a shrine the flood took whole — her own nest, her own clutch
      gone cold in the drowning with everything else. She is owed no tribute
      and asks for none. She only wants the warmth back. Travelers who wade
      the flooded shrine she gathers up almost tenderly and bears down to lie
      among the others arranged in the murk below, so that her children, she
      is certain, will not be left alone in the dark.
