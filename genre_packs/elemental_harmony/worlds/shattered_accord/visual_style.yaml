# Shattered Accord — World-Specific Visual Style
# A world torn by elemental forces — spirit-tears in reality,
# eight warring nations, elemental energy visible in the landscape.

positive_suffix: >-
  wuxia fantasy digital painting, dramatic elemental energy visible
  in the environment, torn reality showing spirit-world through
  glowing tears in the air, East Asian inspired architecture damaged
  by elemental forces, martial arts poses with channeling energy,
  dramatic mountain and coastal landscapes, ink-wash texture with
  vibrant elemental color accents, cinematic lighting through storm
  clouds. No text, no caption, no title, no writing, no calligraphy,
  no characters, no banner lettering, no signature, no chop seal, no
  cartouche, no museum label, no watermark, no frame, no border.

# Z-Image Turbo runs at guidance_scale=0 and ignores negative_prompt
# entirely (see sidequest-content/PROMPTING_Z_IMAGE.md). All constraints
# live in positive_suffix above. Field kept for pipeline compatibility.
negative_prompt: ""

preferred_model: dev

base_seed: 88

visual_tag_overrides:
  temple: >-
    East Asian mountain temple with sweeping eaved roofs, stone steps
    worn smooth by centuries, spirit-ward talismans hanging from the
    eaves, incense smoke, a tear in reality glowing faintly above
    the meditation garden
  battlefield: >-
    scarred earth where elemental channeling has left visible marks —
    fused stone, scorched grass in spiral patterns, frozen puddles in
    summer, the ground cracked in geometric lines where earth-channelers
    fought
  forge: >-
    mountainside forge built into living rock, orange glow from within,
    fire-spirits visible as heat-shimmer faces in the flames, iron
    tools glowing with residual elemental energy, hammer-scarred anvil
  coast: >-
    dramatic coastline with monsoon waves crashing against cliffs,
    ocean-spirit faces visible in the spray, a temple built into the
    cliff face, prayer flags snapping in salt wind, storm clouds
    churning with visible elemental energy
  spirit_tear: >-
    a tear in reality — a glowing wound in the air through which the
    spirit world is visible, distorted colors, elemental energy
    bleeding through, the mortal world's edges fraying around the breach
  ruins: >-
    ancient temple ruins where the Shattering hit hardest — stone
    walls cracked by elemental force, vegetation growing through
    channeling-scarred ground, spirit-light pooling in the broken
    foundations
  mountain: >-
    towering peaks wreathed in clouds and elemental energy, wind-spirits
    visible as translucent shapes in the high passes, Sky Temple spires
    barely visible at the summit, paths carved into the cliff face
  market: >-
    crowded market town at a crossroads, merchants from multiple
    nations — jade-armored Reclamation soldiers browsing alongside
    monsoon-dancers and iron-forge apprentices, spirit-ward talismans
    for sale alongside rice and silk
