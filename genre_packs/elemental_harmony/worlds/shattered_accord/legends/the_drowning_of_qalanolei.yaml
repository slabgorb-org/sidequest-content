affected_cultures:
- Tide Reaches
- Jade Kingdoms
- Lotus Provinces
- Monsoon Courts
cultural_impact: The Tide Reaches lost their ancestral capital and a third of their
  population in an act of self-sacrifice that remains deeply controversial among their
  own people. Taamila is venerated as a savior by some clans and cursed as a mass-murderer
  by others — the division defines Tide Reaches politics to this day. The Jade Kingdoms'
  imperial navy never recovered its former strength, and a cultural terror of deep
  water persists across the empire. The deep-ocean spirits awakened by Taamila's pact
  now patrol the waters between the continents, making all long-distance sea travel
  extraordinarily dangerous. The Lotus Provinces, whose Silk Delta trade routes were
  strangled by the newly hostile seas, blame both the Jade Kingdoms and the Tide Reaches
  for their economic decline. The Monsoon Courts' river-mouth ports at The Drowned
  Palace were inundated by aftershock flooding and took generations to rebuild.
era: 600 years ago
faction_grudges:
- from: Tide Reaches
  reason: The invasion of Qalanolei's Atoll is the defining atrocity in Tide Reaches
    memory. Meishangdao the Imperial's name is a curse-word in every reef-tongue dialect.
  to: Jade Kingdoms
- from: Lotus Provinces
  reason: Hiền Thịnh, the great merchant-scholar of Amber Harbor, documented how the
    awakened deep-spirits destroyed Lotus Province trade for a century. The Lotus
    Provinces view Taamila's pact as reckless — she drowned their livelihood along
    with the Jade fleet.
  to: Tide Reaches
- from: Monsoon Courts
  reason: The flooding of The Drowned Palace and Nayutsa's Basin was collateral devastation
    from a war the Monsoon Courts had no part in. Garuda Kreah, the Monsoon Courts'
    ruler at the time, declared the Jade Kingdoms 'a people who poison every water
    they cannot own.'
  to: Jade Kingdoms
- from: Tide Reaches (Coral Clans)
  reason: 'Internal schism: the Coral Clans of the surviving atolls hold that Taamila
    had no right to sacrifice island civilians for a military victory, creating a
    rift within the culture that persists six centuries later.'
  to: Tide Reaches (Deep Clans)
lost_arts:
- Coral-font channeling — the Qalanolei coral beds amplified water channeling tenfold;
  they are now submerged beneath spirit-haunted waters too dangerous to dive
- Jade Kingdoms deep-water shipbuilding — the empire's naval engineering tradition
  died with its fleet and was never rebuilt
- The Tidal Accord — a Tide Reaches governing tradition where all clan leaders convened
  at Qalanolei's Atoll during solstice tides; no replacement site has ever been accepted
  by all clans
monuments:
- The Pillar of Taamila at Upapuuk's Shore — a lone stone column rising from the shallows,
  carved by Naumehau Tiruana a generation after the drowning, listing the names of
  every island lost
- The Chain of Meishangdao at the Imperial Terrace — eight hundred iron links set
  into the floor of the Jade Kingdoms' throne hall, one for each ship lost, maintained
  as a reminder of imperial hubris by reformist bureaucrats
- Amber Harbor's Tide Markers — brass lines set into the walls of the Lotus Provinces'
  greatest port showing how high the aftershock flooding reached, still visible today
name: The Drowning of Qalanolei
summary: Two centuries after the Shattering destabilized the elemental balance, the
  Jade Kingdoms launched a vast naval invasion of the Tide Reaches, seeking to secure
  sea routes and coral-bed channeling fonts that the empire believed could restore
  earth-element dominance. Meishangdao the Imperial commanded a fleet of eight hundred
  warships that converged on Qalanolei's Atoll, the Tide Reaches' sacred governing
  seat. Taamila of the Deep Atoll, the Tide Reaches' greatest water channeler, performed
  a forbidden spirit-pact — she offered her own life and the lives of her entire bloodline
  to the deep-ocean spirits in exchange for a single cataclysmic wave. The resulting
  tsunami annihilated the Jade fleet entirely, but also drowned Qalanolei's Atoll
  and six surrounding island chains, killing tens of thousands of Tide Reaches civilians
  alongside the invaders. The ocean spirits, glutted on death, have never returned
  to dormancy.
terrain_scars:
- description: The sunken remains of the Tide Reaches' former capital, visible through
    clear water on calm days — coral-crusted towers, ceremonial platforms, and the
    great navigation stones all submerged beneath twenty fathoms of spirit-thick ocean.
    Channelers report hearing singing from below.
  name: Drowned Qalanolei
  region: ''
  type: ruin
- description: A vast stretch of open ocean between the Tide Reaches and the continent
    where the awakened deep-spirits patrol. Ships that enter are dragged under by
    currents that move against the wind. No vessel larger than a outrigger canoe has
    survived the crossing in six centuries.
  name: The Hungering Deep
  region: ''
  type: cursed_ground
- description: A reef-system northwest of Singing Current formed entirely from the
    calcified remains of Meishangdao's fleet — wooden hulls turned to stone, anchors
    fused to coral, and the skeletal remains of soldiers visible at low tide. The
    water here is perpetually warm and smells of iron.
  name: The Bone Shallows
  region: ''
  type: battlefield
- description: The land surrounding the Monsoon Courts' ancient riverside palace that
    was scoured flat by aftershock flooding. The soil never recovered its fertility.
    Rishi Nouk declared the ground 'salted by foreign grief,' and the Monsoon Courts
    built their new temples uphill at The Moonlit Temple, leaving the flats as a permanent
    wasteland.
  name: The Drowned Palace Flats
  region: ''
  type: dead_zone
