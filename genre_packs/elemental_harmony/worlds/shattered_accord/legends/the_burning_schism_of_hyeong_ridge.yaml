affected_cultures:
- Iron Peaks
- Ember Isles
- Jade Kingdoms
- Saffron Reaches
cultural_impact: The Iron Peaks survived as an independent kingdom but at devastating
  cost — their greatest mines were destroyed, their finest general killed by an ally's
  arrogance, and their mountains permanently infested with hostile fire-spirits that
  make deep mining nearly impossible. The Iron Peaks now trust no outside power and
  maintain the most heavily fortified borders in the known world. The Ember Isles
  consider the Battle of Hyeong Ridge a righteous victory and teach it as a case study
  in decisive channeling at Yuragasasasu Forge's war academy, which enrages Iron Peaks
  diplomats. The Jade Kingdoms lost an entire army and abandoned continental expansion
  northward, hardening instead into isolationist paranoia behind the Celestial Wall.
  The Saffron Reaches, whose temple-scholars Tyāga the Sacred and Pañcāla the Still
  had attempted to mediate the conflict before the battle, withdrew entirely from
  inter-state diplomacy after their peace envoys were ignored by all three sides,
  retreating into spiritual isolationism at The Gayā Sanctuary.
era: 300 years ago
faction_grudges:
- from: Iron Peaks
  reason: Tsuka of Ash Peak killed Dojin of Granite Stronghold and destroyed three
    fortress-mines while ostensibly fighting as an ally. The Iron Peaks saying 'ember
    aid is ash' reflects a 300-year grudge that has never softened.
  to: Ember Isles
- from: Iron Peaks
  reason: Shengguan the Verdant's invasion is the foundational trauma of Iron Peaks
    national identity. Every child in Suwon Stronghold learns to recite the names
    of the fallen.
  to: Jade Kingdoms
- from: Ember Isles
  reason: The Ember Isles believe Dojin's forces were positioned incorrectly and that
    the Iron Peaks' refusal to follow Tsuka's command structure caused the friendly
    casualties. They view Iron Peaks resentment as ingratitude.
  to: Iron Peaks
- from: Saffron Reaches
  reason: Tyāga the Sacred's peace delegation was turned away at Namhan Pass, at Kwon
    Gate, and at Nain Gate in succession. The Saffron Reaches concluded that the warring
    peoples were beyond redemption and retreated into isolationist contemplation,
    a posture they maintain to this day.
  to: all belligerents
lost_arts:
- Iron Peaks deep-vein extraction — the techniques for mining the deepest iron deposits
  in Hyeong Ridge died with the miners and are now inaccessible due to fire-spirit
  infestation
- The Mountain Accord — a mutual-defense pact between the Iron Peaks and the Sky Temples
  that collapsed when the Sky Temples refused to intervene, severing centuries of
  highland solidarity
- Saffron meditation-diplomacy — the Saffron Reaches' tradition of sending unarmed
  scholar-mediators into conflict zones ended permanently after this humiliation
monuments:
- The Granite Cenotaph at Kwon Gate — a monolithic block of unworked granite placed
  at the entrance to the Iron Peaks, carved only with Dojin's name and the words 'betrayed
  by fire, unbroken by earth'
- The Victory Frieze at Yuragasasasu Forge — a massive bas-relief depicting Tsuka
  of Ash Peak's conflagration as a moment of glorious triumph, pointedly omitting
  all Iron Peaks casualties
- The Closed Gate at The Gayā Sanctuary — the Saffron Reaches sealed the western entrance
  to their holiest sanctuary with a stone slab bearing the names of the three gates
  that rejected Tyāga's peace mission, vowing it would not reopen until the world
  proved worthy of wisdom
name: The Burning Schism of Hyeong Ridge
summary: When the Iron Peaks refused to swear fealty to the Jade Kingdoms' expanding
  border, Shengguan the Verdant marched an army of ten thousand earth channelers through
  Namhan Pass to crush the mountain fortresses. Dojin of Granite Stronghold rallied
  the Iron Peaks' defenders and sent emissaries to the Ember Isles for military aid.
  Tsuka of Ash Peak answered the call — but the Ember Isles' fire channelers, bred
  on rigid tactical doctrine, treated the Iron Peaks as a subordinate force rather
  than allies. When the decisive battle came at Hyeong Ridge, Tsuka ordered a full
  elemental conflagration that incinerated the Jade army but also collapsed three
  Iron Peaks fortress-mines and immolated Dojin's rearguard, killing the very people
  the Ember Isles had come to save. The fire burned so intensely that the mountain's
  iron ore deposits melted and re-solidified into twisted formations, and fire-spirits,
  drawn by the carnage, have nested in the ridge ever since.
terrain_scars:
- description: The upper third of Hyeong Ridge is a landscape of twisted iron formations
    — ore deposits melted by Tsuka's conflagration and re-solidified into jagged,
    unnatural spires. The stone is permanently warm to the touch. Fire-spirits nest
    in the crevices, glowing like embers at night, and attack any miners who attempt
    to work the deposits.
  name: The Molten Ridge of Hyeong
  region: ''
  type: battlefield
- description: Three vast sinkholes along Hyeong Ridge's western face where Iron Peaks
    fortress-mines once stood. The tunnels below are flooded with toxic air and inhabited
    by territorial fire-spirits. Iron Peaks sappers have attempted to reclaim them
    four times in three centuries; every expedition has ended in casualties.
  name: The Three Collapsed Mines
  region: ''
  type: ruin
- description: The mountain pass through which Shengguan's army marched is still coated
    in a layer ofiteiteiteiteiteite fine volcanic glass from the conflagration's blowback.
    Nothing grows in the pass. The glass cuts through boot leather within hours, making
    overland travel between the Jade Kingdoms and the Iron Peaks punishing even in
    peacetime.
  name: The Ash Corridor of Namhan Pass
  region: ''
  type: dead_zone
- description: Fissures along Hyeong Ridge that emit high-pitched whistling sounds
    when wind passes over them — the locals say they are the screams of Dojin's rearguard,
    trapped in the moment of their burning. Channelers of any element report nausea
    and disorientation near the vents, and fire channeling becomes dangerously unstable
    within a league of the ridge.
  name: The Screaming Vents
  region: ''
  type: cursed_ground
