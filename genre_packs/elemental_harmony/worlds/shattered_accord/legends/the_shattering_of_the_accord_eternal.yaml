cultural_impact: 'This is the defining event of the world''s history and the origin
  of its name. No pan-cultural alliance has been attempted since. The elemental balance
  remains fractured — fire and earth run dominant across most of the world, while
  water and air currents have become erratic, spawning unnatural storms, droughts,
  and spiritual bleeds. The spirit world now pushes through the old wound-sites, and
  restless spirits wander freely near the scars. Every culture remembers the Shattering
  differently: the Jade Kingdoms claim Anhuanzhou acted to prevent a Sky Temple plot;
  the Sky Temples preserve oral accounts of his naked ambition. The Ember Isles honor
  Ayuriko as a martyr-saint whose sacrifice contained the worst of the blast. Channelers
  today are measurably weaker than pre-Shattering records suggest, and multi-element
  channeling — once rare but possible — is now virtually extinct.'
era: 1,400 years ago
faction_grudges:
- from: Sky Temples
  reason: The monks hold that Anhuanzhou the Jade deliberately shattered the Accord
    to seize elemental supremacy, killing Chomolun of the Singing Cloud and dozens
    of air channelers in the process. They have never forgiven this.
  to: Jade Kingdoms
- from: Ember Isles
  reason: Ayuriko of Ash Tower died attempting to contain the detonation. The Ember
    Isles consider this a blood-debt the Jade Kingdoms have never acknowledged, let
    alone repaid.
  to: Jade Kingdoms
- from: Jade Kingdoms
  reason: Imperial histories record that the Sky Temple delegation sabotaged the ritual
    first, and Anhuanzhou acted in defense. This version is taught in every school
    behind the Celestial Wall.
  to: Sky Temples
lost_arts:
- Multi-element channeling — the ability to harmonize two or more elements simultaneously
- The Accord Ritual itself — the precise ceremonial forms that once realigned the
  world's elemental currents
- Spirit-binding without coercion — pre-Shattering channelers could commune with spirits
  as equals; now spirits are agitated and must be subdued or bargained with
monuments:
- The Empty Dais at Dignagālavā Monastery — a circular stone platform where the Sky
  Temples' delegation departed for the last Accord, kept bare and unadorned as a permanent
  accusation
- The Ash Cenotaph at Shijin Shrine — a towering column of fused volcanic glass containing
  Ayuriko's broken channeling staff, recovered from the blast site
- The Celestial Wall's Foundation Stones — Anhuanzhou's name is carved into the base
  of every section of the Jade Kingdoms' great border wall, recast as a hero who 'defended
  the earth from sky treachery'
name: The Shattering of the Accord Eternal
summary: The eight elemental peoples once maintained a sacred pact — the Accord Eternal
  — a ritual alignment performed every century at the nexus where all elemental currents
  converged. When Anhuanzhou the Jade, the Jade Kingdoms' emperor-channeler, attempted
  to bind the nexus permanently to earth, the ritual collapsed catastrophically. The
  resulting detonation tore the elemental balance apart, shattered the convergence
  site into eight drifting shards, and killed every channeler present — including
  Ayuriko of Ash Tower and Chomolun of the Singing Cloud, who had tried to stabilize
  the backlash. The spirit world, which had been layered gently atop the mortal plane,
  was ripped open in dozens of places, and has never fully closed.
terrain_scars:
- description: Eight massive tears in the landscape radiating outward from a central
    point in what is now contested borderland between the Jade Kingdoms and the Sky
    Temples. Each rift hums with a different elemental resonance, and spirits drift
    freely through them. The land between the rifts is a shimmering, unstable zone
    where gravity shifts, fires ignite spontaneously, and rain falls upward.
  name: The Accord Wounds
  region: ''
  type: rift
- description: The exact point of detonation is a perfectly flat, glass-smooth disc
    of fused stone three leagues across. Nothing grows on it. Channelers who step
    onto it report hearing all eight elements screaming simultaneously. Spirit-sightings
    here are constant and often violent.
  name: The Nexus Scar
  region: ''
  type: cursed_ground
- description: A vast corridor of land stretching from the Nexus Scar toward the Tide
    Reaches where elemental channeling simply does not function. Water channelers
    crossing it become ordinary mortals. The Tide Reaches consider this dead zone
    a permanent wound inflicted upon them by continental arrogance.
  name: The Silenced Reach
  region: ''
  type: dead_zone
