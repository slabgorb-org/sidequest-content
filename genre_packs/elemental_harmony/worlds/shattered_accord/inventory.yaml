currency:
  name: Mon
  abbreviation: M
  description: >-
    Hammered copper and silver coins stamped with the elemental sigils of the
    shard that minted them. Between the shards, trust in any one nation's coin
    rises and falls with the war — so the spirit-fog ports weigh coin by metal,
    and the highland interior still runs on barter: rice, silk, and spirit-marked
    steel.

item_catalog:
  - id: jian_steel
    name: Steel Jian
    description: A straight double-edged sword balanced for both thrust and cut.
    category: weapon
    value: 30
    weight: 1.5
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed, martial]
    lore: The jian is the scholar's sword — precision over brute force, favoured in the Lotus Provinces.
    narrative_weight: 0.2
    damage: {dice: "1d8", bonus: 0, shock: 2, shock_ac: 15}

  - id: dao_broad
    name: Broad Dao
    description: A heavy single-edged sabre made for sweeping cuts.
    category: weapon
    value: 25
    weight: 2.0
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed, martial]
    lore: Jade garrison soldiers carry dao. Tide Reaches raiders carry dao. On the contested borders, everyone carries dao.
    narrative_weight: 0.2
    damage: {dice: "1d8", bonus: 0, shock: 2, shock_ac: 15}

  - id: staff_ironwood
    name: Ironwood Staff
    description: A six-foot staff of dense ironwood, dark as charcoal and heavy as intent.
    category: weapon
    value: 10
    weight: 2.5
    rarity: common
    power_level: 1
    tags: [melee, blunt, two-handed, focus]
    lore: A channeler's first focus and last weapon — what you practice the deep-root form with when all else is lost.
    narrative_weight: 0.2
    damage: {dice: "1d6", bonus: 0, shock: 1, shock_ac: 13}

  - id: monsoon_dance_blade
    name: Monsoon Dance-Blade
    description: A curved, water-light blade weighted for the spinning forms of the monsoon-dance.
    category: weapon
    value: 40
    weight: 0.5
    rarity: uncommon
    power_level: 2
    tags: [melee, blade, one-handed, focus]
    lore: Forged at Rathep's Temple to move like falling rain. The dancer's blood is the offering; the storm is the answer.
    narrative_weight: 0.4
    damage: {dice: "1d6", bonus: 0, shock: 1, shock_ac: 13}

  - id: throwing_knives
    name: Throwing Knives (set of 6)
    description: Balanced steel blades, each wrapped in silk cord at the grip.
    category: weapon
    value: 20
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [ranged, thrown, blade]
    lore: Silent and recoverable, if you can reach where they land before the fog does.
    narrative_weight: 0.1
    damage: {dice: "1d4", bonus: 0}

  - id: unarmed_strike
    name: Open Hand
    description: Palm, fist, elbow, knee — the body trained into a weapon no checkpoint can confiscate.
    category: weapon
    value: 0
    weight: 0.0
    rarity: common
    power_level: 1
    tags: [melee, unarmed, martial]
    lore: The Ember Isles kata teach that the form is the weapon, and the weapon is always carried across every tear.
    narrative_weight: 0.2
    damage: {dice: "1d4", bonus: 0}

  - id: spirit_bell
    name: Spirit Bell
    description: A small bronze bell whose calligraphy hums faintly when a spirit-tear opens nearby.
    category: tool
    value: 50
    weight: 0.2
    rarity: uncommon
    power_level: 2
    tags: [focus, spirit, divination]
    lore: Spirit Menders carry them to find rents in reality. The bell finds the tears whether or not you wished to know.
    narrative_weight: 0.5

  - id: focus_stone_cracked
    name: Cracked Focus Stone
    description: A polished elemental focus stone, hairline-fractured from one binding too many.
    category: tool
    value: 35
    weight: 0.2
    rarity: uncommon
    power_level: 2
    tags: [focus, spirit, channeling]
    lore: A Spirit Mender's set numbers eight, one per element. Most are cracked. They keep working — until, abruptly, they do not.
    narrative_weight: 0.4

  - id: incense_pouch
    name: Meditation Incense (pouch)
    description: A pouch of sandalwood and ghost-cedar incense that steadies the mind before channeling.
    category: consumable
    value: 8
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [focus, meditation, calming]
    lore: A stick burns for an hour — long enough to find your center near a tear, or to lose it entirely.
    narrative_weight: 0.1

  - id: herbal_compress
    name: Herbal Compress
    description: A cloth bundle of medicinal herbs that reduces swelling and draws out infection.
    category: consumable
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [healing, herbal]
    lore: Every highland village herbalist prepares these differently. With trade routes cut by the war, they all run short.
    narrative_weight: 0.1

  - id: silk_rope
    name: Silk Rope (30 feet)
    description: Fine-spun silk rope, stronger than hemp and half the weight.
    category: tool
    value: 15
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [utility, climbing]
    lore: Indispensable on the Iron Peaks' rope-bridges, where the chasm below is haunted and the fall is long.
    narrative_weight: 0.0

  - id: calligraphy_set
    name: Calligraphy Set
    description: Brush, ink stone, and a sheaf of rice paper in a lacquered travel case.
    category: tool
    value: 20
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [focus, knowledge, craft]
    lore: For letters, maps, and — in the right hands, working from the Old River Tongue — the calligraphy that binds a spirit.
    narrative_weight: 0.3

  - id: travel_tea_set
    name: Travel Tea Set
    description: A compact ceramic tea set with a small iron kettle, wrapped in quilted cloth.
    category: tool
    value: 12
    weight: 1.0
    rarity: common
    power_level: 0
    tags: [social, comfort, ritual]
    lore: Sharing tea across a border is diplomacy. Refusing it, in these years, is nearly a declaration of war.
    narrative_weight: 0.2

  - id: jade_passage_seal
    name: Jade Passage Seal
    description: A carved jade stamp bearing the Reclamation's authority, used to pass garrison checkpoints.
    category: treasure
    value: 80
    weight: 0.1
    rarity: rare
    power_level: 3
    tags: [social, authority, valuable]
    lore: A genuine seal opens the Shou Pass that swords cannot. A forged one opens a far shorter road to the deep mines.
    narrative_weight: 0.7

  - id: ward_stone_chip
    name: Ward-Stone Chip
    description: A fragment of Sealed Gate ward-stone, inscribed to dull a spirit's hostility at close range.
    category: consumable
    value: 18
    weight: 0.2
    rarity: uncommon
    power_level: 2
    tags: [spirit, protection, consumable]
    lore: The Gate erects ward-stones around fresh tears and refuses all channelers entry. A chipped one, smuggled out, still holds — for a while.
    narrative_weight: 0.3

  - id: spirit_ward_paper
    name: Spirit Ward (paper talisman)
    description: A yellow paper strip inscribed with protective calligraphy in cinnabar ink.
    category: consumable
    value: 10
    weight: 0.0
    rarity: common
    power_level: 1
    tags: [spirit, protection, consumable]
    lore: Stick it on a door, a coffin, or a forehead near a tear. The flooding spirits respect the calligraphy, if not the calligrapher.
    narrative_weight: 0.3

  - id: silk_robes
    name: Silk Robes
    description: Layered silk robes, loose enough for high kata and tight enough to look deliberate.
    category: armor
    value: 15
    weight: 1.0
    rarity: common
    power_level: 1
    tags: [light, torso, robes]
    lore: The wandering channeler's uniform between shards. Offers nothing but dignity — sometimes, at a border post, dignity is enough.
    narrative_weight: 0.1
    armor_class: 11

  - id: padded_war_robe
    name: Padded War Robe
    description: Quilted cotton over leather panels, worn by garrison soldiers and serious duelists.
    category: armor
    value: 35
    weight: 2.5
    rarity: common
    power_level: 2
    tags: [light, torso, padded]
    lore: Stops a knife, slows a dao. Will not stop an Ember Isles fire-form — but it will make the channeler feel the cost.
    narrative_weight: 0.2
    armor_class: 13
    mitigation: 1

  - id: jade_lamellar
    name: Jade-Inlaid Lamellar
    description: Overlapping lacquered iron plates laced in the ancient style, inlaid with the jade marks of rank.
    category: armor
    value: 90
    weight: 5.0
    rarity: uncommon
    power_level: 3
    tags: [medium, torso, lamellar]
    lore: The armor of Jade officers and Celestial Wall garrison. Heavy enough to matter, immovable enough to suit the doctrine.
    narrative_weight: 0.3
    armor_class: 16
    mitigation: 1

