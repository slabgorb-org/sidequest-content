chapters:
  - id: fresh
    label: "The Jade Road"
    session_range: [1, 5]
    character:
      name: ""
      level: 1
      gold: 20
      relationships:
        - name: Bao Shen
          role: highland village headwoman
          disposition: 10
          notes: "Gave you water and rice when you stumbled into her village. Watches you with the look of someone deciding whether to ask for help."
        - name: Pingzhou Anhai
          role: Jade Reclamation assessor
          disposition: -5
          notes: "Polite. Thorough. His papers carry the imperial seal and his questions carry the weight of an empire that considers you a subject."
      progression:
        primary_affinity: null
        affinity_scores: {}
        milestones_earned: []
    npcs:
      - archetype: Village Elder
        name: Bao Shen
        disposition: 10
        location: jade_kingdoms
        notes: "Headwoman of a highland farming village between the Songnan Terrace and the Anhuanzhou Wall. Her riders carry messages between twenty villages. She knows the assessors are coming."
      - archetype: Imperial Agent
        name: Pingzhou Anhai
        disposition: -5
        location: jade_kingdoms
        notes: "Jade Reclamation intelligence coordinator. Operates ahead of the assessors — mapping water sources, cataloguing land value, identifying resistance leaders. Charming and lethal."
      - archetype: Border Guard
        name: Qing the Stone
        disposition: -15
        location: jade_kingdoms
        notes: "Commander of the deep-earth channeler corps. Patrols the Anhuanzhou Wall. His tunnelers have been detected beneath Iron Peaks territory. He considers all non-Jade channelers a security threat."
      - archetype: Wandering Master
        name: Won Pyru
        disposition: 0
        location: jade_kingdoms
        notes: "An old man mending a fence outside a highland village. He moves slowly. His hands are calloused from work, not channeling. He is lying about everything."
    quests:
      "Cross the Jade highlands safely": "in_progress"
      "Deliver a sealed message to the Sky Temples": "not_started"
      "Investigate why the highland wells are failing": "not_started"
    lore:
      - "The Jade Kingdoms claim sovereignty over the Broken Nexus and all eight shards — a claim no other nation accepts."
      - "Highland villages pay tribute in grain and labor. Failure to pay means resettlement to the lowland quarries."
      - "Earth channeling is the only element taught in Jade academies. All others are classified as 'unstable arts.'"
      - "The Anhuanzhou Wall stretches across the northern frontier. Anhuanzhou's name is carved into every section."
    notes:
      - "The player arrives in the Jade Kingdoms with limited context — a traveler crossing through."
      - "First encounters establish the Jade Reclamation's bureaucratic control and the quiet desperation of highland villages."
      - "Won Pyru appears as background — an unremarkable old farmer who happens to be nearby when things go wrong."
    narrative_log:
      - speaker: narrator
        text: >-
          The highland road climbs through terraced fields where jade-veined
          stone breaks through dark soil like bone through skin. Below you,
          the Songnan Terrace rises from the river valley — monumental,
          permanent, carved from the earth it claims to command. Above you,
          the Anhuanzhou Wall traces the ridgeline, and you can see the
          garrison fires burning at every gate. You are walking through an
          empire that has written its name on the landscape itself. The
          villages between the terrace and the wall are small, quiet, and
          watching you pass with the careful attention of people who have
          learned that strangers bring either tax collectors or trouble.
    location: jade_kingdoms
    time_of_day: morning
    atmosphere: >-
      A vast highland landscape of terraced farmland and jade-veined
      stone, dominated by imperial architecture that dwarfs the human
      settlements between its monuments. The air smells of turned earth
      and woodsmoke. Everything is ordered, hierarchical, and watched.
    active_stakes: "Cross the highlands without drawing Jade Reclamation attention. Something is wrong with the water."
    points_of_interest:
      - name: The Songnan Terrace
        description: >-
          Monumental stone platforms rising tier upon tier from jade-veined
          cliffs, each level connected by carved stairways wide enough for
          a mounted column. Water channels cut into the cliff face catch
          morning light and run jade-green. At the summit, the Imperial
          Terrace spreads beneath banners that hang motionless in the still
          highland air — not because there is no wind, but because the
          earth channelers will it. Petitioners queue in long silent lines
          along the lower terraces, their shadows stretching down the cliff
          face like dark brushstrokes on pale stone.
        type: political
      - name: The Anhuanzhou Wall
        description: >-
          A great border fortification that follows the ridgeline like a
          scar across the northern sky. Grey granite blocks fitted without
          mortar, each section bearing Anhuanzhou's name in characters tall
          as a man, worn smooth by fourteen centuries of wind but still
          legible — still claiming. Garrison fires glow at every watchtower
          through the evening mist, and the wall hums with deep elemental
          resonance that makes your teeth ache if you stand too close. On
          clear days you can see both the Jade highlands behind and the
          dark granite ranges of the Iron Peaks beyond, separated by this
          single unbroken line of imperial stone.
        type: obstacle
      - name: Bao Shen's Village
        description: >-
          A cluster of stone-and-thatch houses built into a highland
          terrace, where irrigation channels should run clear but instead
          carry water the color of rust. Drying racks stand empty in the
          courtyard. An old woman beats grain on a flat stone while
          children stack rocks into miniature walls, playing empire. The
          village well — once the deepest in the highlands — produces
          a thin trickle of silted water that tastes of sulfur and
          something else, something that was not there last season. Jade
          banners hang from every doorpost, not from loyalty but from
          the knowledge that houses without banners are assessed first.
        type: social
      - name: The Shou Pass Road
        description: >-
          A mountain road that climbs through switchbacks carved into
          living rock, each turn revealing a wider view of the highland
          valleys below. Prayer stones mark the path — not Jade imperial
          markers but older things, worn smooth, their carved characters
          in a script no academy teaches. Mist pools in the valleys like
          grey ink in the hollows of a stone palette. At the highest
          point, before the road descends toward the Sky Temples, you can
          see the faint shimmer of the Broken Nexus on the eastern
          horizon — a column of light that is not light, pulsing with
          a rhythm that almost sounds like breathing.
        type: environmental
      - name: Won Pyru's Fence
        description: >-
          A low stone wall at the edge of a highland field where an old
          man works in the late afternoon light. His tools are simple —
          a mallet, a chisel, a bucket of clay mortar. He fits stones
          together with the unhurried precision of someone who has done
          this ten thousand times, humming a melody that shifts keys in
          ways that should not be possible for a single voice. The field
          behind him is the only one in the village where the crops
          still grow green. He does not look up when you pass. He does
          not need to.
        type: hidden
    tropes:
      - id: the_master_who_walks
        name: The Master Who Walks
        progress: 0.05
        status: background
        notes: "Won Pyru is present but unremarkable — an old farmer with calloused hands. Only a channeler who pays very close attention would notice that the earth around him is unusually stable."
      - id: the_bureaucracy_of_ruin
        name: The Bureaucracy of Ruin
        progress: 0.1
        status: active
        notes: "The highland wells are failing. Bao Shen suspects sabotage but has no proof. Assessors will arrive within weeks."
      - id: the_convergence_mistranslated
        name: The Convergence Mistranslated
        progress: 0.05
        status: background
        notes: "A village elder mentions the Avatar prophecy in passing — 'they say one person will channel all elements and fix everything. Convenient story for those who want to control the one.'"
      - id: the_puppeteers_threads
        name: The Puppeteer's Threads
        progress: 0.05
        status: background
        notes: "The player's arrival in the highlands was not accidental. A sealed letter they carry mentions a name they do not recognize: Po."

  - id: early
    label: "The Highlands Burn Slowly"
    session_range: [6, 12]
    character:
      name: ""
      level: 3
      gold: 80
      items:
        - name: Highland walking staff
          description: "Ironwood, worn smooth. Won Pyru shaped it for you without being asked."
        - name: Bao Shen's rider token
          description: "A jade disc stamped with her village seal. Her riders will carry your messages."
        - name: Jade assessment notice
          description: "Found nailed to a village gate. The resettlement schedule, in bureaucratic detail."
        - name: Fragment of Old River Tongue text
          description: "Torn from a scroll in a collapsed shrine. The characters are unfamiliar."
      relationships:
        - name: Won Pyru
          role: reluctant teacher
          disposition: 20
          notes: "He saved your life with a technique that used three elements simultaneously. His cover is blown in the highlands. He is angry about it."
        - name: Bao Shen
          role: resistance leader
          disposition: 25
          notes: "You restored her village's water. She has committed her rider network to warning the other villages."
        - name: Pingzhou Anhai
          role: Jade Reclamation intelligence
          disposition: -15
          notes: "He knows your name now. He knows you are interfering with the assessment schedule. He is patient."
        - name: Zhang
          role: deserter from the Saffron Reaches garrison
          disposition: 15
          notes: "Left his post because he saw the Saffron soldiers escorting Jade assessors. Eighteen years old. Absolutely certain he did the right thing."
        - name: Dhya of the Eternal Cloud
          role: Accord Reborn leader
          disposition: 5
          notes: "Sent an envoy to the highlands. Interested in reports of multi-element channeling. Her interest feels like acquisition."
      progression:
        primary_affinity: null
        affinity_scores: {}
        milestones_earned:
          - "Restored a highland village's water source"
          - "Witnessed Won Pyru channel three elements simultaneously"
          - "Found a fragment of the original Old River Tongue prophecy"
    npcs:
      - archetype: Wandering Master
        name: Won Pyru
        disposition: 20
        location: jade_kingdoms
        notes: "No longer hiding. Teaching the party between village defense missions. Every lesson is a crisis solved. His channeling signature has been reported to the Jade Reclamation."
      - archetype: Village Elder
        name: Bao Shen
        disposition: 25
        location: jade_kingdoms
        notes: "Coordinating twenty highland villages through her rider network. The resistance is forming around her organizational skill."
      - archetype: Imperial Agent
        name: Pingzhou Anhai
        disposition: -15
        location: jade_kingdoms
        notes: "Has accelerated the assessment timeline because of the party's interference. Dispatching earth channeler-enforcers."
      - archetype: Young Soldier
        name: Zhang
        disposition: 15
        location: jade_kingdoms
        notes: "Former Saffron Reaches garrison soldier. Deserted when he saw Saffron troops escorting Jade assessors. Follows Won Pyru with fierce, unquestioning loyalty."
      - archetype: Faction Envoy
        name: Karma of the Singing Cloud
        disposition: 5
        location: sky_temples
        notes: "Dhya's advisor, sent to investigate reports of multi-element channeling in the highlands. Scholarly, cautious, reporting everything back."
      - archetype: Saboteur
        name: Jade Reclamation saboteur
        disposition: -20
        location: jade_kingdoms
        notes: "Operating ahead of the assessors — poisoning wells, triggering rockslides, manufacturing the 'natural disasters' that justify resettlement."
    quests:
      "Cross the Jade highlands safely": "completed"
      "Investigate why the highland wells are failing": "completed"
      "Warn the remaining highland villages before assessors arrive": "in_progress"
      "Find the saboteur poisoning the wells": "in_progress"
      "Deliver the sealed message to the Sky Temples": "not_started"
      "Learn what the Old River Tongue fragment says": "not_started"
    lore:
      - "Won Pyru is a multi-element channeler — an art thought extinct since the Shattering."
      - "The highland well failures are deliberate sabotage, not natural disaster. The Jade Reclamation is manufacturing the conditions for resettlement."
      - "The Saffron Reaches are providing escorts for Jade assessors — their spiritual neutrality is a mask for complicity."
      - "The Avatar prophecy taught in every academy is a mistranslation. The original Old River Tongue text says something different."
      - "Grand Master Po assembled the party — each member was sent to a specific place with specific instructions."
    notes:
      - "The highlands become the classroom and the battlefield simultaneously."
      - "Won Pyru teaches through crisis — every village defense is a multi-element lesson."
      - "Zhang's arc begins: a soldier who left because the word 'evil' was not too strong."
      - "The Accord Reborn's interest in the party is not altruistic — they want to control multi-element channeling."
    narrative_log:
      - speaker: narrator
        text: >-
          The old man channels water from deep stone, pulls wind through
          a sealed mineshaft, and ignites the damp timber of a collapsed
          bridge — three elements in three breaths, each one impossible
          according to everything the academies teach. He does not explain.
          He does not lecture. He walks to the next village and expects
          you to keep up. Behind you, the village well runs clear for the
          first time in months. Ahead, smoke rises from a farmstead that
          was not burning yesterday. The assessors are not waiting for
          the schedule anymore.
      - speaker: narrator
        text: >-
          Zhang stands at the edge of the village clearing, his ochre
          garrison cloak folded and placed on a stone like something
          sacred he is choosing to leave behind. He is eighteen. He does
          not look afraid. He looks clear.
    location: jade_kingdoms
    time_of_day: afternoon
    atmosphere: >-
      The careful imperial order of the Jade highlands is breaking under
      its own weight. Smoke rises from villages that should be peaceful.
      Assessment notices appear nailed to gates. Earth channeler patrols
      move along the highland roads with the purposeful stride of people
      following a timetable. Between the monuments, the small places are
      fighting to exist.
    active_stakes: >-
      Twenty villages. Three weeks. The assessors are coming and the
      saboteur is working ahead of them. Won Pyru is teaching, but
      every lesson makes the party more visible. The Jade Reclamation
      knows something is happening in the highlands.
    points_of_interest:
      - name: The Poisoned Well
        description: >-
          A village well cut deep into jade-veined limestone, its stone
          rim worn smooth by generations of rope and bucket. The water
          that surfaces now carries an iridescent sheen — not natural
          mineral content but something introduced, something that makes
          the surrounding garden plots wilt and turn the soil a dead
          grey. Iron filings and channeled earth-toxin, mixed with
          precision by someone who knows exactly how long a village can
          survive on stored rainwater. The bucket sits overturned beside
          the well, and the children have been told not to play near it.
          A Jade assessment notice is nailed to the well post,
          classifying the water source as "naturally compromised."
        type: conspiracy
      - name: The Highland Rider Post
        description: >-
          A flat-topped boulder at the intersection of three mountain
          trails, scarred with carved route markers in a local script
          older than the empire. Bao Shen's riders change horses here —
          compact highland ponies with thick coats and sure feet, tied
          to iron rings hammered into the stone. Message pouches hang
          from a weathered crossbar. On clear mornings, you can see
          signal fires from four villages simultaneously, and the riders
          depart before dawn carrying warnings written in a code the
          assessors have not yet broken. The wind carries the smell of
          horse sweat and pine resin and urgency.
        type: resistance
      - name: The Collapsed Shrine
        description: >-
          Half-buried in a highland rockslide — too precise, too
          targeted to be natural — the remains of a wayshrine built in
          a style that predates the Jade Kingdoms by centuries. Carved
          stone panels show eight elements converging in a spiral pattern,
          and the inscription is in Old River Tongue — a script the
          academies do not teach because its translations contradict the
          prophecy they prefer. Scroll fragments litter the rubble,
          their ink faded but legible where the stone sheltered them
          from rain. Someone buried this shrine deliberately. Someone
          else is digging it out.
        type: discovery
      - name: Won Pyru's Teaching Ground
        description: >-
          A bare circle of packed earth on a highland plateau where the
          wind comes from four directions at once. Won Pyru does not
          call it a training ground — he calls it the place where you
          fix the irrigation. But the irrigation requires pulling water
          from stone, directing wind through a channel cut, and warming
          frozen ground, and by the time you have done all three you
          have channeled three elements in sequence without a lecture,
          without theory, without knowing it was supposed to be
          impossible. The plateau overlooks the valley where smoke
          rises from the next village on the assessors' list. The
          lesson and the mission are the same thing.
        type: training
      - name: The Assessment Road
        description: >-
          A Jade imperial road built wide enough for supply wagons and
          marching columns, cutting through the highlands like a wound
          that refuses to heal. Fresh wheel ruts mark the passage of
          the assessors' carts — heavy with surveying equipment,
          resettlement forms, and the jade-sealed writs that give
          bureaucrats the authority to unmake a village with a stamp.
          Imperial distance markers stand at precise intervals, each
          one carved with Anhuanzhou's character and the distance to
          the Songnan Terrace. The road is immaculate. The villages
          it passes through are not.
        type: threat
      - name: Zhang's Garrison Cloak
        description: >-
          A folded square of ochre-dyed wool placed on a flat stone
          at the edge of a village clearing — the garrison cloak of
          a Saffron Reaches border soldier, regulation-cut, still
          bearing the unit badge of the Kṛṣṇa Mandala perimeter guard.
          Zhang left it here the morning he deserted, arranged with the
          precise care of a soldier who respects the uniform even as he
          rejects what it has been ordered to protect. Wildflowers have
          begun to grow through the folds. He has not moved it. He has
          not looked at it since.
        type: character
    tropes:
      - id: the_master_who_walks
        name: The Master Who Walks
        progress: 0.3
        status: active
        notes: "Won Pyru's multi-element channeling was witnessed. His cover is blown in the Jade highlands. Every faction now has reports of 'an old channeler using forbidden techniques.'"
      - id: the_bureaucracy_of_ruin
        name: The Bureaucracy of Ruin
        progress: 0.4
        status: active
        notes: "The saboteur's trail is found — deliberate rockslides, poisoned wells. The assessors arrive early because of the party's interference."
      - id: the_soldier_who_chose
        name: The Soldier Who Chose
        progress: 0.2
        status: active
        notes: "Zhang sees Saffron soldiers escorting Jade assessors. His former comrades serving the machine. He left. He is not going back."
      - id: the_convergence_mistranslated
        name: The Convergence Mistranslated
        progress: 0.2
        status: active
        notes: "The collapsed shrine fragment contradicts the academy translation. Won Pyru recognized the script. He said nothing — but his silence was loud."
      - id: the_highland_resistance
        name: The Highland Resistance
        progress: 0.2
        status: active
        notes: "Bao Shen's rider network delivers warnings. Some villages prepare. Others panic. The party must split up to reach them before the assessors."
      - id: the_puppeteers_threads
        name: The Puppeteer's Threads
        progress: 0.15
        status: background
        notes: "A seemingly random encounter — a stranded merchant, a collapsed bridge — turns out to have been arranged. Po's fingerprints."

  - id: mid
    label: "The Accord Fractures"
    session_range: [13, 25]
    character:
      name: ""
      level: 6
      gold: 300
      items:
        - name: Highland walking staff
          description: "Ironwood, reinforced with channeled earth. Won Pyru added something to it one night while you slept."
        - name: Bao Shen's rider seal
          description: "Full authority in her network. Her riders answer to you now."
        - name: The Old River Tongue scroll
          description: "Recovered from the collapsed shrine. The true prophecy — convergence, not avatar."
        - name: Zhang's garrison badge
          description: "He pressed it into your hand before the battle at Kwon Gate. 'Hold this. I need both hands free.'"
        - name: Accord Reborn passage token
          description: "Grants access to the Sky Temples. Dhya's price was a demonstration of multi-element channeling."
      relationships:
        - name: Won Pyru
          role: master and fugitive
          disposition: 30
          notes: "He is hunted by every faction. He stays because the teaching is not finished. He is afraid — not of them, but of what happens if the students are not ready."
        - name: Bao Shen
          role: highland resistance commander
          disposition: 30
          notes: "The resistance is real. Twenty villages stand together. Bao Shen leads them with the organizational precision of a general who has never held a sword."
        - name: Zhang
          role: soldier and student
          disposition: 25
          notes: "He fought someone wearing ochre. Not a villain — a soldier following orders. He won, but it cost him something he cannot name."
        - name: Dhya of the Eternal Cloud
          role: Accord Reborn leader
          disposition: -5
          notes: "She offered alliance. She meant acquisition. When the party refused her terms, her scholars began studying how to replicate multi-element channeling without the party's cooperation."
        - name: Songnan the Silent
          role: Jade Reclamation strategist
          disposition: -25
          notes: "The highland resistance has embarrassed the Reclamation. Songnan has dispatched channeler-enforcers. The bureaucracy has failed; force follows."
        - name: Mong of Iron Stronghold
          role: Sealed Gate commander
          disposition: 5
          notes: "The Iron Peaks have noticed the party's activities near the Anhuanzhou Wall. Mong sent Byeonjoo to observe. Not hostile — assessing."
        - name: Ananga of the Deep Atoll
          role: Drowned Covenant leader
          disposition: -10
          notes: "Any attempt to restore the Accord threatens the Drowned Covenant's power. Ananga has sworn to drown anyone who tries."
      progression:
        primary_affinity: null
        affinity_scores: {}
        milestones_earned:
          - "Restored a highland village's water source"
          - "Witnessed Won Pyru channel three elements simultaneously"
          - "Found the Old River Tongue prophecy"
          - "Led the defense of a village against Jade enforcers"
          - "Channeled two elements cooperatively with another party member"
          - "A spirit-tear shrank in response to multi-element channeling"
    npcs:
      - archetype: Wandering Master
        name: Won Pyru
        disposition: 30
        location: jade_kingdoms
        notes: "Hunted by the Jade Reclamation, studied by the Accord Reborn, feared by the Sealed Gate. Still teaching. Still fighting. Running out of places to hide."
      - archetype: Resistance Commander
        name: Bao Shen
        disposition: 30
        location: jade_kingdoms
        notes: "Commands the highland resistance. Twenty villages. Three weeks became three months. The assessors have not resettled a single village."
      - archetype: Young Soldier
        name: Zhang
        disposition: 25
        location: jade_kingdoms
        notes: "No longer just a deserter. A fighter. A channeler in training. His garrison training is the party's tactical edge."
      - archetype: Jade Strategist
        name: Songnan the Silent
        disposition: -25
        location: jade_kingdoms
        notes: "Has positioned garrisons along the Anhuanzhou Wall and the Shou Pass. The highland resistance is now a military problem."
      - archetype: Sky Temple Leader
        name: Dhya of the Eternal Cloud
        disposition: -5
        location: sky_temples
        notes: "Growing authoritarian. Believes air channeling must be the 'binding breath' of a new Accord — and that the party's multi-element work validates her claim to lead."
      - archetype: Iron Peaks Spymaster
        name: Byeonjoo of Steep Mine
        disposition: 5
        location: iron_peaks
        notes: "Sent by Mong to observe the highlands. Reports back through tunnels the Jade Reclamation has not yet found."
      - archetype: Monsoon Pact Commander
        name: Garuda Kreah
        disposition: 10
        location: monsoon_courts
        notes: "Sees the highland resistance as a useful distraction for the Jade Reclamation. Privately hopes to recruit the party to the southern confederation."
      - archetype: Drowned Covenant Leader
        name: Ananga of the Deep Atoll
        disposition: -10
        location: tide_reaches
        notes: "The spirit world responds to the party's channeling. This threatens the Covenant's monopoly on spirit-communion. Ananga considers them enemies."
    quests:
      "Warn the remaining highland villages": "completed"
      "Find the saboteur": "completed"
      "Defend the highland villages against channeler-enforcers": "in_progress"
      "Deliver the sealed message to the Sky Temples": "in_progress"
      "Translate the Old River Tongue scroll": "in_progress"
      "Decide whether to accept Dhya's alliance": "completed"
      "Investigate the spirit-tear that shrank near the highlands": "not_started"
      "Contact the Iron Peaks through Byeonjoo": "not_started"
    lore:
      - "The Convergence prophecy was deliberately mistranslated — 'one person' should read 'one purpose.' The academies know."
      - "Grand Master Po has been planning this for decades. Maps, letters, timelines — the scope of his design is staggering."
      - "The spirit world responds to multi-element cooperation. Where the party channels together, spirit-tears shrink."
      - "The Jade Reclamation's highland resettlement is preparation for something larger — they want the land for a second binding attempt."
      - "The Sealed Gate's borders are bleeding them dry. Jungnyasan of Frosted Hall leads a quiet internal opposition."
    notes:
      - "The story expands beyond the highlands. Every faction has taken notice."
      - "The player must navigate between factions that all want different things from multi-element channeling."
      - "Won Pyru's capture or incapacitation is approaching — the students must prepare to act alone."
      - "The elemental world is reacting. Spirit behavior near the party has changed."
    narrative_log:
      - speaker: narrator
        text: >-
          The spirit-tear above the highland pass — a wound in the sky
          that has bled alien light for fourteen centuries — shuddered
          when you channeled. Not wider. Smaller. The light dimmed for
          a moment and the wind carried something that was not sound but
          felt like recognition. Won Pyru watched from the ridge with
          an expression you have never seen on his face before: hope,
          and terror that the hope might be real.
    location: jade_kingdoms
    time_of_day: dusk
    atmosphere: >-
      The careful political order of the Shattered Accord is cracking
      under the weight of what the party represents. Factions that have
      not spoken in centuries are sending envoys. Spirit-tears are
      behaving unpredictably. The highlands smell of smoke and change.
      Every conversation has a subtext about control — who will direct
      the convergence, and whether it can be directed at all.
    active_stakes: >-
      The Jade Reclamation is escalating from bureaucracy to force.
      The Accord Reborn wants to own multi-element channeling. The
      Sealed Gate is deciding whether to open or seal tighter. The
      Drowned Covenant considers the party an existential threat.
      And the Broken Nexus pulsed — once — felt across all eight shards.
    points_of_interest:
      - name: Kwon Gate
        description: >-
          The Granite Cenotaph stands at the entrance to the Iron Peaks
          — a monolithic block of unworked granite taller than three men,
          carved only with Dojin's name and the words "betrayed by fire,
          unbroken by earth." The stone is unpolished, deliberately
          rough, as if the Iron Peaks refused to give even grief a
          beautiful surface. Every child in the mountains can recite the
          names of the fallen, and the base of the cenotaph is worn
          smooth where generations have pressed their foreheads against
          the stone. Beyond it, the sealed gate itself — channeled
          granite slabs thick as a house, fitted without gap or mortar,
          humming with earth resonance that says in every frequency:
          we are done trusting.
        type: political
      - name: Dignagālavā Monastery
        description: >-
          The monastery floats. Not metaphorically — the stone platforms
          are suspended above the mountain peaks by chains of solidified
          air that shimmer like heat haze and hum with a frequency that
          makes your ribs vibrate. Bridges of compressed wind connect
          the platforms, translucent and terrifying, swaying in currents
          that follow no natural pattern. Below, clouds fill the valleys
          like spilled milk. Above, the Sacred Spire — Tripita — pierces
          a sky so thin and blue it looks like lacquer. Lightning strikes
          the spire constantly, forking across its surface without
          leaving a mark, and the air channelers who meditate at its
          base wear their hair in wild white haloes of static charge.
          Dhya of the Eternal Cloud receives visitors in a chamber
          open on all four sides to the wind, where scrolls pin
          themselves to the walls without weights and speech carries
          farther than it should.
        type: political
      - name: The Highland Spirit-Tear
        description: >-
          A wound in the sky above the highland pass — not a hole but a
          seam where reality has come unstitched, leaking light that is
          not sunlight and casting shadows that point the wrong direction.
          The edges of the tear shimmer with elemental resonance —
          eight colors that have no names in any living language, cycling
          in a pattern that almost resolves into something recognizable
          before dissolving back into chaos. The ground beneath the tear
          is scarred with fourteen centuries of spirit-overflow: melted
          stone, flash-frozen soil, patches where gravity pulls sideways.
          Hostile spirits drift through like fish in a current, alien
          and furious. But when the party channeled together here, the
          tear flinched. It remembered something.
        type: supernatural
      - name: The Songnan Terrace War Chamber
        description: >-
          Deep beneath the Imperial Terrace, carved from living jade-veined
          stone, Songnan the Silent's war chamber glows with the pale
          green luminescence of earth channeling concentrated beyond
          anything the surface world produces. Maps of every shard are
          carved into the floor — not drawn but grown from the stone
          itself, updated in real time by deep-earth channelers who sense
          troop movements through vibration. Model armies of jade figurines
          stand on the map surfaces, each one resonating with the channeler
          it represents. The ceiling is low. The air is thick. Songnan
          stands at the center, his hands on the stone, and the entire
          mountain listens to him.
        type: military
    tropes:
      - id: the_master_who_walks
        name: The Master Who Walks
        progress: 0.6
        status: active
        notes: "Won Pyru channeled all elements simultaneously to save the party — an act visible for leagues. Every faction knows."
      - id: the_bureaucracy_of_ruin
        name: The Bureaucracy of Ruin
        progress: 0.7
        status: active
        notes: "The Authority dispatches channeler-enforcers. Paperwork has failed, force follows. The highland resettlement is revealed as preparation for something larger."
      - id: the_soldier_who_chose
        name: The Soldier Who Chose
        progress: 0.6
        status: active
        notes: "Zhang fought someone wearing ochre. He discovered the garrison knew about the sabotage. The institution he served was complicit."
      - id: the_convergence_mistranslated
        name: The Convergence Mistranslated
        progress: 0.5
        status: active
        notes: "The party has the Old River Tongue text. The academies' mistranslation was deliberate. Multiple factions are racing to control the truth."
      - id: the_highland_resistance
        name: The Highland Resistance
        progress: 0.6
        status: active
        notes: "Twenty villages stand together. The legal defense works against assessors but not against channeler-soldiers. The line between resistance and war blurs."
      - id: the_puppeteers_threads
        name: The Puppeteer's Threads
        progress: 0.5
        status: active
        notes: "Po's plan fails at a critical point — something he did not predict. A faction reveals they have been hunting Po for years."
      - id: the_elements_remember
        name: The Elements Remember
        progress: 0.4
        status: active
        notes: "Spirits approach with recognition, not hostility. A major spirit-tear near the highlands begins to shrink. Factions take notice."

  - id: veteran
    label: "The Accord Remembers"
    session_range: [26, 50]
    character:
      name: ""
      level: 10
      gold: 800
      items:
        - name: The Old River Tongue scroll (complete)
          description: "The full prophecy, assembled from fragments across three shards. 'All elements will find one purpose.'"
        - name: Won Pyru's channeling staff
          description: "He pressed it into your hands before they took him. It resonates with all eight elements."
        - name: Bao Shen's highland banner
          description: "The highland resistance flag. Twenty villages' marks woven into one cloth."
        - name: Zhang's officer's blade
          description: "He forged it himself in the Ember Isles, tempering it with fire channeling he learned from an enemy."
        - name: Po's final letter
          description: "Unsealed when the Nexus pulsed. 'The convergence requires willing participants. You are my proof that they exist.'"
      relationships:
        - name: Won Pyru
          role: captured master
          disposition: 35
          notes: "Taken by the Jade Reclamation. Held beneath the Songnan Terrace. His capture was deliberate — he let them take him. The students must act without him."
        - name: Grand Master Po
          role: the architect
          disposition: 15
          notes: "You have met Po. He is not what you imagined. He is old, and tired, and everything he has done for thirty years comes down to whether you choose to walk into the Broken Nexus."
        - name: Bao Shen
          role: highland commander and councilor
          disposition: 35
          notes: "The highland resistance has become something larger than survival. Bao Shen leads its council."
        - name: Zhang
          role: resistance commander
          disposition: 30
          notes: "Offered command. Accepted. The difference between fighting evil and building something better."
        - name: Mong of Iron Stronghold
          role: reluctant ally
          disposition: 15
          notes: "The Sealed Gate opened — one gate, Kwon, for the first time in three centuries. Jungnyasan convinced Mong. It is not trust. It is survival."
      progression:
        primary_affinity: null
        affinity_scores: {}
        milestones_earned:
          - "All previous milestones"
          - "Defended the highland council against Jade channeler-enforcers"
          - "Channeled three elements cooperatively"
          - "Caused a spirit-tear to close permanently through multi-element harmony"
          - "Met Grand Master Po"
          - "The Broken Nexus pulsed in response to the party's channeling"
    npcs:
      - archetype: Captured Master
        name: Won Pyru
        disposition: 35
        location: jade_kingdoms
        notes: "Imprisoned beneath the Songnan Terrace. The Jade Reclamation is attempting to extract multi-element techniques. Won Pyru endures. His silence is a weapon."
      - archetype: The Architect
        name: Grand Master Po
        disposition: 15
        location: broken_nexus
        notes: "Waiting at the edge of the Nexus Scar. His endgame requires the party to choose freely — control would ruin it."
      - archetype: Highland Commander
        name: Bao Shen
        disposition: 35
        location: jade_kingdoms
        notes: "Leads a coalition that now includes highland villages, Iron Peaks observers, and Monsoon Pact sympathizers."
      - archetype: Resistance Commander
        name: Zhang
        disposition: 30
        location: jade_kingdoms
        notes: "Commands the resistance's military arm. His Saffron training and multi-element channeling make him formidable."
      - archetype: Jade Strategist
        name: Songnan the Silent
        disposition: -30
        location: jade_kingdoms
        notes: "Preparing a second binding attempt at the Broken Nexus. Won Pyru's captured knowledge is the key."
      - archetype: Iron Peaks Commander
        name: Mong of Iron Stronghold
        disposition: 15
        location: iron_peaks
        notes: "Opened Kwon Gate. Committed Iron Peaks earth channelers to the convergence effort. The grudge against the Ember Isles remains — but survival outweighs resentment."
      - archetype: Monsoon Pact Leader
        name: Garuda Kreah
        disposition: 15
        location: monsoon_courts
        notes: "The southern confederation is real. Kreah commits storm and ocean channelers to the convergence — but his ambitions extend beyond healing the Accord."
      - archetype: Drowned Covenant Leader
        name: Ananga of the Deep Atoll
        disposition: -20
        location: tide_reaches
        notes: "The Drowned Covenant will fight the convergence with everything they have. The deep-ocean spirits are their power, and healing the Accord would put those spirits back to sleep."
    quests:
      "Defend the highland villages": "completed"
      "Translate the Old River Tongue scroll": "completed"
      "Rescue Won Pyru from the Songnan Terrace": "in_progress"
      "Assemble channelers from all eight elements": "in_progress"
      "Reach the Broken Nexus": "in_progress"
      "Decide whether to attempt the convergence": "not_started"
      "Stop Songnan's second binding attempt": "not_started"
    lore:
      - "The convergence requires channelers from all eight elements working in willing cooperation. No single person can do it."
      - "Songnan plans to repeat Anhuanzhou's binding — but with Won Pyru's multi-element knowledge, he believes he can succeed where Anhuanzhou failed."
      - "The Broken Nexus is alive. Not sentient, but reactive. It remembers the Accord and it remembers the Shattering."
      - "The deep-ocean spirits were not always hostile. Before the Shattering, they communed peacefully. Taamila's pact warped them."
      - "Grand Master Po was present at the last attempt to restore the Accord — forty years ago. It failed. Everyone else died. He has spent the decades since preparing for this attempt."
    notes:
      - "The endgame converges at the Broken Nexus."
      - "Every faction has a reason to be at the Nexus — binding, convergence, prevention, or destruction."
      - "The party must decide: trust Po's design, or forge their own path."
      - "The elements themselves are participants. The world is keeping score."
    narrative_log:
      - speaker: narrator
        text: >-
          The Broken Nexus screams. Not with sound — with resonance,
          eight elements crying out in frequencies that shake the ground
          and split the sky and make every channeler on every shard feel
          it in their bones. The glass-smooth scar at the world's center
          — three leagues of fused stone where the Accord Eternal died
          — is pulsing with light that has no color and casts shadows
          in directions that do not exist. Songnan's army approaches
          from the south. The Drowned Covenant's fleet rises from
          the east. And at the edge of the scar, an old man you have
          never met stands with his hands at his sides, waiting for you
          to arrive, because everything he has done for thirty years
          comes down to the next hour.
    location: broken_nexus
    time_of_day: dawn
    atmosphere: >-
      The world is converging. Not metaphorically — the eight shards
      are drifting closer, pulled by elemental resonance that has not
      been felt in fourteen centuries. Spirit-tears are widening and
      closing unpredictably. The sky above the Broken Nexus is a
      maelstrom of elemental light. Every faction, every grudge, every
      legend is arriving at the same point at the same time. The air
      tastes of ozone and possibility and the metallic tang of
      something very old waking up.
    active_stakes: >-
      Songnan will attempt a second binding. The Drowned Covenant will
      try to prevent any restoration. The Accord Reborn wants to control
      the convergence. And Po's design requires the party to choose
      freely — to walk into the Broken Nexus and attempt something
      that killed everyone who tried it last time.
    points_of_interest:
      - name: Kṣatavāri
        description: >-
          The Nexus Scar — three leagues of glass-smooth fused stone,
          perfectly flat, perfectly empty, reflecting a sky that does not
          match the one above it. The surface is warm beneath your feet
          and vibrates with a frequency that climbs through your skeleton
          into your skull. Eight radiating cracks spread from the center
          like the spokes of a shattered wheel, each one humming with a
          different elemental tone — fire at the southern crack, water
          at the northern, earth and air and four others that have no
          names because no one has stood here long enough to catalogue
          them and survived. Spirits circle above like carrion birds,
          drawn by the wound but unable to land. At the exact center,
          where all eight cracks converge, the stone is not glass but
          something else — something that absorbs light and returns it
          changed, and if you press your ear to it, you can hear eight
          voices singing a harmony that was interrupted fourteen
          centuries ago and never resolved.
        type: climax
      - name: The Saṃdhāna Rifts
        description: >-
          Eight wounds in the world radiating outward from the Nexus
          Scar, each one a canyon of impossible physics where the rules
          of elemental behavior break down and recombine. The fire-rift
          burns with cold flames that freeze what they touch. The
          water-rift pours upward in columns of singing liquid that
          evaporates into mist and reforms endlessly. Between the rifts,
          the land shimmers like a heat-mirage, and objects placed on
          the ground drift sideways or sink or float without cause.
          Soldiers from three armies have camped along the rift edges,
          and the light from the tears paints their faces in colors
          that make them look like spirits themselves — alien, uncertain,
          afraid of the ground they are fighting to control.
        type: supernatural
      - name: Hyeong Ridge (burning)
        description: >-
          Three centuries and the mountain still burns. The twisted iron
          spires of Hyeong Ridge glow like embers against the night sky,
          their surfaces still warm from Tsuka's conflagration, fire-spirits
          nesting in every crevice like coals in a forge that will never
          cool. The screaming vents along the western face wail with
          voices that the Iron Peaks say belong to Dojin's rearguard,
          trapped in the moment of their burning — and the sound carries
          for leagues, a keening that makes channelers of every element
          dizzy and sick. The three collapsed mines are dark mouths in
          the mountainside, exhaling toxic air and the faint orange
          glow of spirits that have made the depths their permanent
          territory. The Victory Frieze at Yuragasasasu — visible
          across the strait — shows this moment as triumph. The stone
          beneath your feet tells a different story.
        type: environmental
      - name: Qalanolei (submerged)
        description: >-
          On calm days, when the deep-ocean spirits are still, you can
          see it — twenty fathoms down, the coral-crusted towers of
          the Tide Reaches' drowned capital, their ceremonial platforms
          still standing in perfect rows as if waiting for a council
          that ended six centuries ago. The great navigation stones —
          carved with star-charts for voyages no one makes anymore —
          are visible as dark rectangles beneath the luminous blue-green
          water. Fish swim through throne rooms. Kelp grows from
          observation decks. And sometimes, in the deep quiet between
          waves, you can hear singing — not human, not spirit, something
          older, something that remembers what this place was before
          Taamila fed it to the deep. Tiruana's Pillar rises from the
          shallows nearby, its carved names of lost islands slowly
          being consumed by salt and coral — the sea reclaiming even
          the memory.
        type: supernatural
