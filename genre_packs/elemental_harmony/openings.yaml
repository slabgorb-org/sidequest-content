- id: elemental_imbalance
  archetype: mystery
  situation: >-
    Something is wrong with the elements — water flows uphill, stone
    crumbles without cause, fire refuses to light, or wind carries voices.
    The local balance has been disrupted. The player feels it in their body
    before anyone explains it.
  tone: unsettling, spiritual
  avoid:
    - ashram welcome ceremonies
    - mentor NPC introductions
    - fetch quests for ingredients
  first_turn_seed: >-
    The ground hums beneath your feet. Wrong frequency — you feel it in
    your teeth. Somewhere close, an element is screaming.

- id: meditation_crisis
  archetype: survival
  situation: >-
    The player's meditation or attunement goes sideways — they've opened
    something they can't close, attracted something they can't see, or
    fallen into a state between elements. They must stabilize before
    the imbalance consumes them.
  tone: internal, desperate
  avoid:
    - external quest givers
    - village arrival scenes
    - casual exploration
  first_turn_seed: >-
    The meditation was going perfectly until it wasn't. Something answered
    that shouldn't have. Your hands are glowing and you can't make them stop.

- id: pilgrimage_test
  archetype: challenge
  situation: >-
    The player arrives at a sacred site for a test or rite of passage.
    There are no instructions — the test reveals itself to those who are
    ready. Other pilgrims may be present but they are competitors or
    witnesses, not guides.
  tone: solemn, demanding
  avoid:
    - helpful guide NPCs
    - exposition about the test
    - fetch errands
  first_turn_seed: >-
    The shrine is older than the mountain it sits on. Others kneel at the
    threshold. No one speaks. No one has told you what to do. The stone
    doors stand open.

- id: elemental_storm
  archetype: survival
  situation: >-
    An unnatural elemental storm is bearing down — fire rain, stone hail,
    wind that cuts, water that drowns from the sky. Shelter is scarce and
    the storm seems to have intent. The player must survive and understand.
  tone: primal, overwhelming
  avoid:
    - calm village settings
    - NPC conversations
    - errand-based openings
  first_turn_seed: >-
    The sky splits — not lightning, something older. The air tastes of iron
    and ozone. Every animal in earshot just went silent at once.
