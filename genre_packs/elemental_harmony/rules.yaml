tone: sincere-adventurous
lethality: low
magic_level: high

stat_generation: point_buy
point_buy_budget: 30

ability_score_names:
  - Strength
  - Agility
  - Endurance
  - Insight
  - Spirit
  - Harmony

allowed_classes:
  - Channeler
  - Martial Artist
  - Spirit Medium
  - Scholar
  - Wanderer
  - Guardian

allowed_races:
  - Ember Isles
  - Jade Kingdoms
  - Tide Reaches
  - Sky Temples
  - Monsoon Courts
  - Iron Peaks
  - Lotus Provinces
  - Spirit-Touched
  - Mixed Heritage

default_class: Wanderer
default_race: Jade Kingdoms
race_label: Origin
class_label: Discipline


# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Diplomatic Council"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Appeal to Harmony"
        kind: strike
        base: 2
        stat_check: Harmony
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        stat_check: Spirit
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "A display of elemental power. Intimidation through strength."
      # concede_point: strategic retreat to reveal opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: Harmony
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: Spirit
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player bows and departs. The matter is unresolved."
    mood: tension
  - type: combat
    label: Martial Exchange
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [strike, attack, fight, kill, slay, swing, shoot, hit, stab]
    on_intent_mismatch: reprompt
    category: combat
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093 (was 12 / mod +1).
    opponent_default_stats:
      Strength: 10
      Agility: 10
      Endurance: 10
    # Momentum as "flow of the exchange" — who currently holds harmony.
    # Beats push the flow one way or the other. Damage lives on character
    # state; momentum tracks narrative command of the fight.
    player_metric:
      name: momentum
      starting: 0
      threshold: 7
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 7
    beats:
      - id: strike
        label: Strike
        kind: strike
        base: 2
        stat_check: Strength
        effect: "Target takes damage this round"
        narrator_hint: A flowing combination — describe the elemental energy behind the blow.
      - id: guard
        label: Guard Stance
        kind: brace
        base: 1
        stat_check: Endurance
        effect: "Reduce incoming damage, channel harmony back into stance"
        narrator_hint: Weight sinks. Breath steadies. The element answers.
      - id: elemental_burst
        label: Elemental Burst
        kind: strike
        base: 4
        deltas:
          crit_fail:
            own: -2
        stat_check: Strength
        risk: "Spirit drain — lose 2 momentum and harmony on failure"
        effect: "Unleash elemental force on the target"
        narrator_hint: Channel raw elemental force. The air shimmers.
      - id: yield
        label: Yield
        kind: push
        stat_check: Agility
        consequence: "Combat ends — honor preserved through retreat"
        narrator_hint: A bow, a step backward, a parting gesture. The exchange ends.
    mood: combat
  - type: chase
    label: Pursuit
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [chase, pursue, flee, run, escape, follow]
    on_intent_mismatch: reprompt
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: dash
        label: Dash
        kind: push
        base: 2
        stat_check: Agility
        narrator_hint: Fleet feet across terraced fields or temple rooftops.
      - id: leap
        label: Elemental Leap
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Insight
        risk: "Misjudge the landing — lose 2 separation"
      # blend: use surrounding element to mask movement — angle (misdirection tag)
      - id: blend
        label: Blend with Element
        kind: angle
        target_tag: "Elemental Concealment"
        stat_check: Insight
        effect: "Use surrounding element to mask movement"
      - id: vanish
        label: Vanish
        kind: push
        stat_check: Agility
        consequence: "Chase ends — dissolved into mist, earth, or shadow"
    mood: tension
