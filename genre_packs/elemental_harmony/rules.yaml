tone: sincere-adventurous
lethality: low
magic_level: high

stat_generation: standard_array
# WWN SRD standard array, assigned in ability-score declaration order (ADR-142
# Step 2B). The WWN chargen tight-modifier curve makes 14 a +1 prime and 7 a
# -1 dump; replaces the flat point-buy spread.
standard_array: [14, 12, 11, 10, 9, 7]

ability_score_names:
  - Strength
  - Agility
  - Endurance
  - Insight
  - Spirit
  - Harmony

ruleset: wwn
wwn:
  attribute_map:
    STRENGTH: Strength
    DEXTERITY: Agility
    CONSTITUTION: Endurance
    INTELLIGENCE: Insight
    WISDOM: Spirit
    CHARISMA: Harmony
  system_strain:
    max_source: CONSTITUTION
    rest_recovery_per_night: 1
    first_aid_cost: 1
  trauma:
    default_trauma_target: 6
    mortal_injury_rounds: 6
    major_injury_save: physical
  magic:
    effort_base: 1
    killing_blow_divisor: 2
    day_reclaim_requires_comfort: true
    default_spell_save: mental

allowed_classes:
  - Channeler
  - Martial Artist
  - Spirit Medium
  - Scholar
  - Wanderer
  - Guardian

allowed_races:
  - Ember Isles
  - Jade Kingdoms
  - Tide Reaches
  - Sky Temples
  - Monsoon Courts
  - Iron Peaks
  - Lotus Provinces
  - Spirit-Touched
  - Mixed Heritage

default_class: Wanderer
default_race: Jade Kingdoms
race_label: Origin
class_label: Discipline


# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Diplomatic Council"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Appeal to Harmony"
        kind: strike
        base: 2
        stat_check: Harmony
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        stat_check: Spirit
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "A display of elemental power. Intimidation through strength."
      # concede_point: strategic retreat to reveal opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: Harmony
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: Spirit
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player bows and departs. The matter is unresolved."
    mood: tension
  - type: combat
    label: Martial Exchange
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [strike, attack, fight, kill, slay, swing, shoot, hit, stab]
    on_intent_mismatch: reprompt
    category: combat
    # WWN personal combat: attack-vs-AC + hp_depletion on the ablative HpPool.
    # Trauma/Mortal Injury layer on via the wwn ruleset module.
    win_condition: hp_depletion
    opponent_default_stats:
      # ALL SIX ability scores must be authored so the WWN defender-save path
      # can resolve any prepared spell's save. cinder_lance/tide_lash use the
      # evasion save (DEXTERITY→Agility, INTELLIGENCE→Insight); the mental and
      # physical saves reach Spirit/Harmony and Strength/Endurance. The SWN
      # module fails loud on a missing save attribute (no neutral-10 fallback),
      # so an incomplete block KeyErrors the first time a spell targets the mook.
      Strength: 10
      Agility: 10
      Endurance: 10
      Insight: 10
      Spirit: 10
      Harmony: 10
      # Reserved combat-seed keys (not ability scores) — seed the runtime
      # CreatureCore for hp_depletion. hp = HP pool; armor_class = ascending AC
      # the attack rolls against; dexterity = initiative (1d8+DEX).
      # Wuxia mook: AC 12 (unarmored martial artist), HP 8, killable in 2-3 hits.
      hp: 8
      armor_class: 12
      dexterity: 11
    # Opponent reprisal damage. The strike beat resolves damage from the ACTOR's
    # inventory — which the seeded WWN mook has none of — so without this the enemy
    # hits but deals 0 HP and the player never takes damage (playtest #16, the EH
    # burning_peace toothless-Other finding; same class as space_opera 67-10, now
    # surfaced at instantiation by the encounter.opponent_toothless span / ADR-139
    # Invariant 3). 1d6 = a trained martial strike (~3 hits to drop a 10-HP PC),
    # matching the wuxia mook's threat. Read only on the opponent's turn, so it
    # never caps the player's own weapon.
    opponent_damage: {dice: "1d6", bonus: 0}
    # No native beats: under the WWN binding the sealed initiative engine
    # (wn_round.py) owns the combat action set — attack / move / item-use /
    # cast — so this def authors zero beats. The native beat/edge/momentum
    # scaffolding is *removed* from a Without-Number combat path, not
    # balanced against it (ADR-143 / ADR-139 Inv-3; SOUL "Bind the Ruleset,
    # Don't Balance It"). Do not re-add a beats list here.
    mood: combat
  - type: chase
    label: Pursuit
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [chase, pursue, flee, run, escape, follow]
    on_intent_mismatch: reprompt
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: dash
        label: Dash
        kind: push
        base: 2
        stat_check: Agility
        narrator_hint: Fleet feet across terraced fields or temple rooftops.
      - id: leap
        label: Elemental Leap
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Insight
        risk: "Misjudge the landing — lose 2 separation"
      # blend: use surrounding element to mask movement — angle (misdirection tag)
      - id: blend
        label: Blend with Element
        kind: angle
        target_tag: "Elemental Concealment"
        stat_check: Insight
        effect: "Use surrounding element to mask movement"
      - id: vanish
        label: Vanish
        kind: push
        stat_check: Agility
        consequence: "Chase ends — dissolved into mist, earth, or shadow"
    mood: tension
