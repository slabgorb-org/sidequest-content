tone: sincere-adventurous
lethality: low
magic_level: high

stat_generation: point_buy
point_buy_budget: 30

ability_score_names:
  - Strength
  - Agility
  - Endurance
  - Insight
  - Spirit
  - Harmony

allowed_classes:
  - Channeler
  - Martial Artist
  - Spirit Medium
  - Scholar
  - Wanderer
  - Guardian

allowed_races:
  - Ember Isles
  - Jade Kingdoms
  - Tide Reaches
  - Sky Temples
  - Monsoon Courts
  - Iron Peaks
  - Lotus Provinces
  - Spirit-Touched
  - Mixed Heritage

default_class: Wanderer
default_race: Jade Kingdoms
default_hp: 8
race_label: Origin
class_label: Discipline

class_hp_bases:
  Channeler: 8
  Martial Artist: 10
  Spirit Medium: 6
  Scholar: 6
  Wanderer: 8
  Guardian: 12

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Diplomatic Council"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Appeal to Harmony"
        metric_delta: 2
        stat_check: Harmony
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: Spirit
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "A display of elemental power. Intimidation through strength."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: Harmony
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: Spirit
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player bows and departs. The matter is unresolved."
    mood: tension
