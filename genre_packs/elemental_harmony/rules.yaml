tone: sincere-adventurous
lethality: low
magic_level: high

stat_generation: point_buy
point_buy_budget: 30

ability_score_names:
  - Strength
  - Agility
  - Endurance
  - Insight
  - Spirit
  - Harmony

allowed_classes:
  - Channeler
  - Martial Artist
  - Spirit Medium
  - Scholar
  - Wanderer
  - Guardian

allowed_races:
  - Ember Isles
  - Jade Kingdoms
  - Tide Reaches
  - Sky Temples
  - Monsoon Courts
  - Iron Peaks
  - Lotus Provinces
  - Spirit-Touched
  - Mixed Heritage

default_class: Wanderer
default_race: Jade Kingdoms
default_hp: 8
race_label: Origin
class_label: Discipline

class_hp_bases:
  Channeler: 8
  Martial Artist: 10
  Spirit Medium: 6
  Scholar: 6
  Wanderer: 8
  Guardian: 12

confrontations:
- type: combat
  label: Martial Exchange
  category: combat
  metric:
    name: hp
    direction: descending
    starting: 0
    threshold_low: 0
  beats:
  - id: strike
    label: Strike
    metric_delta: -8
    stat_check: Strength
    narrator_hint: A flowing combination — describe the elemental energy behind the blow.
  - id: guard
    label: Guard Stance
    metric_delta: 0
    stat_check: Endurance
    effect: "Reduce incoming damage, channel harmony"
  - id: elemental_burst
    label: Elemental Burst
    metric_delta: -12
    stat_check: Strength
    risk: "Spirit drain — lose harmony on failure"
    narrator_hint: Channel raw elemental force. The air shimmers.
  - id: yield
    label: Yield
    metric_delta: 0
    stat_check: Agility
    resolution: true
    consequence: "Combat ends — honor preserved through retreat"
  mood: combat
- type: chase
  label: Pursuit
  category: movement
  metric:
    name: separation
    direction: ascending
    starting: 3
    threshold_high: 10
    threshold_low: 0
  beats:
  - id: dash
    label: Dash
    metric_delta: 2
    stat_check: Agility
    narrator_hint: Fleet feet across terraced fields or temple rooftops.
  - id: leap
    label: Elemental Leap
    metric_delta: 3
    stat_check: Insight
    risk: "Misjudge the landing — lose 2 separation"
  - id: blend
    label: Blend with Element
    metric_delta: 1
    stat_check: Insight
    effect: "Use surrounding element to mask movement"
  - id: vanish
    label: Vanish
    metric_delta: 0
    stat_check: Agility
    resolution: true
    consequence: "Chase ends — dissolved into mist, earth, or shadow"
  mood: tension
