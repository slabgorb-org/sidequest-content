currency:
  name: Mon
  abbreviation: M
  description: >-
    Hammered copper and silver coins stamped with elemental sigils.
    Trade in the interior still runs on barter — rice, silk, forged
    steel — but the coastal ports and temple towns reckon in Mon.

item_catalog:
  - id: jian_steel
    name: Steel Jian
    description: A straight double-edged sword balanced for both thrust and cut.
    category: weapon
    value: 30
    weight: 1.5
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed, martial]
    lore: The jian is the scholar's sword — precision over brute force.
    narrative_weight: 0.2

  - id: dao_broad
    name: Broad Dao
    description: A heavy single-edged sabre made for sweeping cuts.
    category: weapon
    value: 25
    weight: 2.0
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed, martial]
    lore: Soldiers carry dao. Bandits carry dao. Everyone carries dao.
    narrative_weight: 0.2

  - id: staff_ironwood
    name: Ironwood Staff
    description: A six-foot staff of dense ironwood, dark as charcoal and heavy as intent.
    category: weapon
    value: 10
    weight: 2.5
    rarity: common
    power_level: 1
    tags: [melee, blunt, two-handed, focus]
    lore: The staff is the first weapon and the last — the one you practice with when all others are lost.
    narrative_weight: 0.2

  - id: war_fan
    name: Iron War Fan
    description: A folding fan with sharpened steel ribs, concealed elegance and open violence.
    category: weapon
    value: 40
    weight: 0.5
    rarity: uncommon
    power_level: 2
    tags: [melee, blade, one-handed, concealable]
    lore: Favoured by courtiers who attend meetings they may not leave alive.
    narrative_weight: 0.4

  - id: throwing_knives
    name: Throwing Knives (set of 6)
    description: Balanced steel blades, each wrapped in silk cord at the grip.
    category: weapon
    value: 20
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [ranged, thrown, blade]
    lore: Silent and recoverable, if you know where they land.
    narrative_weight: 0.1

  - id: spirit_bell
    name: Spirit Bell
    description: A small bronze bell engraved with calligraphy that hums faintly near spiritual disturbances.
    category: tool
    value: 50
    weight: 0.2
    rarity: uncommon
    power_level: 2
    tags: [focus, spirit, divination]
    lore: Monks carry them to find the restless dead. The bell finds them whether you want it to or not.
    narrative_weight: 0.5

  - id: incense_pouch
    name: Meditation Incense (pouch)
    description: A pouch of sandalwood and ghost-cedar incense that steadies the mind.
    category: consumable
    value: 8
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [focus, meditation, calming]
    lore: A stick burns for an hour. An hour is enough to find your center, or lose it completely.
    narrative_weight: 0.1

  - id: herbal_compress
    name: Herbal Compress
    description: A cloth bundle of medicinal herbs that reduces swelling and draws out infection.
    category: consumable
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [healing, herbal]
    lore: Every village herbalist prepares these differently. They all work, more or less.
    narrative_weight: 0.1

  - id: silk_rope
    name: Silk Rope (30 feet)
    description: Fine-spun silk rope, stronger than hemp and half the weight.
    category: tool
    value: 15
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [utility, climbing]
    lore: Expensive for rope, cheap for survival.
    narrative_weight: 0.0

  - id: calligraphy_set
    name: Calligraphy Set
    description: Brush, ink stone, and a sheaf of rice paper in a lacquered travel case.
    category: tool
    value: 20
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [focus, knowledge, craft]
    lore: For writing letters, drawing maps, composing poetry, and — in the right hands — binding spirits.
    narrative_weight: 0.3

  - id: travel_tea_set
    name: Travel Tea Set
    description: A compact ceramic tea set with a small iron kettle, wrapped in quilted cloth.
    category: tool
    value: 12
    weight: 1.0
    rarity: common
    power_level: 0
    tags: [social, comfort, ritual]
    lore: Sharing tea is diplomacy. Refusing tea is a declaration.
    narrative_weight: 0.2

  - id: jade_seal
    name: Jade Seal
    description: A carved jade stamp bearing a family or temple crest, used to authenticate documents.
    category: treasure
    value: 80
    weight: 0.1
    rarity: rare
    power_level: 3
    tags: [social, authority, valuable]
    lore: A seal can open doors that swords cannot. It can also forge documents that start wars.
    narrative_weight: 0.7

  - id: spirit_ward_paper
    name: Spirit Ward (paper talisman)
    description: A yellow paper strip inscribed with protective calligraphy in cinnabar ink.
    category: consumable
    value: 10
    weight: 0.0
    rarity: common
    power_level: 1
    tags: [spirit, protection, consumable]
    lore: Stick it on a door, a coffin, or a forehead. The dead respect the calligraphy, if not the calligrapher.
    narrative_weight: 0.3

