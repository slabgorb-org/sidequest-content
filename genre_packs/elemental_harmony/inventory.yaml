# elemental_harmony — genre-tier WWN baseline equipment catalog (ADR-145, story 114-4)
#
# This item_catalog is the Worlds Without Number SRD §3.0.0 equipment chapter
# (Armor §3.3, Weapons §3.4, Adventuring Gear §3.2), extracted VERBATIM by the
# 114-3 extraction tool (wwn_equip_extract@114-3). The mechanical envelope —
# damage dice, Shock, Armor Class, cost, encumbrance, range — is the SRD's own,
# carried unchanged and provenance-stamped (mode=verbatim, srd=wwn,
# license=wn-free, srd_ref). Sourced from the Worlds Without Number SRD under its
# free-use terms; this is factual sourcing only — no endorsement is implied.
#
# Placement (ADR-145 D3): the genre baseline is a shared, non-droppable catalog
# every elemental_harmony world inherits. Worlds union their own bespoke/reskinned
# gear over it by item id (mechanics inherit+lock; presentation reskins freely).
# currency / starting_equipment / starting_gold stay world-owned (world.yaml /
# world inventory.yaml), so they are intentionally NOT declared here.
#
# Costs are the SRD's printed numbers; WWN's base currency is the silver piece.
# Sub-silver gear (Candle, Torch, Firewood, Arrows — printed in copper) carries
# its printed integer in `value`; the cp/sp unit distinction is not represented
# in the integer `value` field (a known schema limitation, flagged 114-4).

