# Seed tropes for elemental_harmony — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the campaign demands.
#
# World-agnostic by design (ADR-140): genre grammar only — discipline and
# its price, masters and lineages, the close spirit world and its opinions,
# balance as a physical fact. No specific dynasty, sect name, or world
# geography; those belong to the worlds.

- id: the_form_is_being_taught_wrong
  name: The Form Is Being Taught Wrong
  description: >-
    Somewhere nearby, students are drilling a form the party knows —
    and one transition in it is wrong. Not sloppy: precisely,
    consistently, deliberately wrong, in a way that will injure
    anyone who channels through it at full strength. The instructor
    teaching it is respected. The error is recent.
  flavor_tags: [training, lineage, sabotage, duty]
  lifespan_turns: 7
  delivery_hints:
    - The wrongness is invisible at practice speed; only channeling at intensity exposes it
    - The instructor learned the correction from a visiting master whose name opens doors
    - One senior student has already been hurt and is concealing the injury out of loyalty
  narrative_hint: >-
    The corrupted form is sabotage moving through trust. Let
    correcting it publicly cost the instructor face and tracing it
    upstream find who profits from a generation of crippled
    channelers — and why the visiting master agreed to carry it.

- id: a_spirit_holds_the_crossing
  name: A Spirit Holds the Crossing
  description: >-
    A bridge, ford, pass, or gate is closed — not by weather or war,
    but by a spirit that has planted itself there and refuses
    passage. It is not malevolent. It is offended, or grieving, or
    waiting for something specific, and travelers are piling up on
    both sides with theories and dwindling patience.
  flavor_tags: [spirit, passage, grievance, mediation]
  lifespan_turns: 7
  delivery_hints:
    - The spirit's grievance is legible to anyone who looks at what changed near the crossing recently
    - Offerings are accumulating; the spirit ignores all of them, which is itself a clue about what it wants
    - Someone among the stranded travelers is the actual cause and knows it
  narrative_hint: >-
    The blocked crossing is a mediation Bang — force is possible and
    will be remembered by every spirit in the region. Let the
    grievance be just, the guilty traveler sympathetic, and the
    resolution set the party's reputation in the spirit world.

- id: the_masters_letter_of_introduction
  name: The Letter of Introduction Outlives Its Author
  description: >-
    The party carries, or is handed, a letter of introduction from a
    master — patronage, a request for hospitality, a debt called in.
    The complication arrives with it: the master is dead, or
    disgraced, or has defected to a rival school, and the letter's
    value swings wildly depending on who reads it and what news has
    reached them.
  flavor_tags: [lineage, patronage, news, standing]
  lifespan_turns: 8
  delivery_hints:
    - The first recipient honors it lavishly; they haven't heard yet
    - The second recipient has heard a version of events that makes presenting the letter dangerous
    - The letter contains a private mark or phrase that means something beyond the introduction itself
  narrative_hint: >-
    The letter is lineage made portable — let the news race the
    party from host to host, and let the private mark be the real
    payload: the master knew what was coming and chose these
    bearers for a reason.

- id: the_element_misbehaves_locally
  name: The Element Is Wrong Here
  description: >-
    In this valley, street, or stretch of coast, one element has
    stopped behaving — fire burns cold-colored, water flows a
    degree uphill, stones ring when stepped on, wind moves against
    the weather. Channelers feel it like a stone in the shoe.
    Locals have adjusted with unsettling speed and don't want it
    discussed.
  flavor_tags: [imbalance, locale, secret, spirits]
  lifespan_turns: 8
  delivery_hints:
    - Channeling the affected element here works — differently, and the difference is tempting
    - The adjustment began on a date the locals all know and none will say
    - Something is being fed, housed, or hidden at the center of the effect, and the local arrangement depends on it
  narrative_hint: >-
    The local wrongness is balance bent by a bargain. Let the
    tempting difference hook any channeler who experiments, and let
    the locals' silence be earned — the arrangement protects them
    from something worse, until somebody starts asking questions.

- id: the_challenge_match_with_hidden_stakes
  name: The Friendly Match Has a Second Wager
  description: >-
    A school, teahouse circle, or traveling fighter proposes a
    friendly match — forms only, first touch, an exhibition. The
    invitation is genuine and the courtesy real. But money, face, or
    something stranger is riding on the outcome among the spectators,
    and one side of that wager cannot afford to lose.
  flavor_tags: [duel, wager, face, ritual]
  lifespan_turns: 6
  delivery_hints:
    - The opponent fights a shade below their evident skill, managing the bout toward a particular shape
    - One spectator watches the crowd instead of the match
    - Winning cleanly, losing cleanly, and a draw all pay out to different interested parties
  narrative_hint: >-
    The match is a small system with the party inside it. Let the
    hidden wager surface mid-bout, and let how the player fights —
    not whether they win — decide which faction decides they're
    useful.

- id: the_student_who_outgrew_the_teaching
  name: The Student Has Outgrown the Teaching
  description: >-
    A young channeler — talented, disciplined, dutiful — has hit the
    ceiling of what their teacher can give, and both of them know
    it, and neither will say it. The student's practice is curdling
    into frustration that leaks into their channeling. Frustrated
    power, in this genre, attracts attention: rival schools, shortcut
    sellers, and spirits.
  flavor_tags: [training, succession, temptation, duty]
  lifespan_turns: 8
  delivery_hints:
    - The teacher has begun assigning busywork and the student has begun noticing
    - A recruiter — for a school, a cause, or something less formal — has already made gentle contact
    - The student's leaked frustration has had one small, frightening, hushed-up consequence
  narrative_hint: >-
    The stuck student is a fork in someone else's road. Let the
    party's example, advice, or sponsorship tip them — and let the
    teacher's limitation be honorable, which is what makes the
    silence between them so heavy.

- id: the_offering_was_interrupted
  name: The Offering Was Interrupted a Generation Ago
  description: >-
    A rite that used to be performed here — seasonal, ancestral,
    quietly load-bearing — was interrupted years ago and never
    resumed. The reason was good: war, plague, shame. The bill has
    been accruing without anyone reading the ledger, and small
    strangenesses have started arriving like first notices.
  flavor_tags: [rite, ancestors, debt, spirits]
  lifespan_turns: 8
  delivery_hints:
    - The strangenesses escalate in a pattern an elder could read if anyone asked them
    - The rite's last performer left instructions, incomplete, in a place that made sense then
    - Resuming it requires something the community no longer has — a skill, an object, a bloodline — or a substitute offered in good faith
  narrative_hint: >-
    The lapsed rite is the spirit world's patience running out
    politely. Let the party broker the resumption, supply the
    substitute, or stand in the gap themselves — and let "in good
    faith" be the clause everything turns on.

- id: two_schools_one_patron
  name: Two Schools, One Patron
  description: >-
    Two rival schools — of channeling, of craft, of doctrine — have
    been feuding respectably for years. The party learns what
    neither school knows: both are funded by the same patron, who
    adjusts the feud's temperature like a stove. Lately the patron
    has been turning it up.
  flavor_tags: [factions, patronage, intrigue, balance]
  lifespan_turns: 7
  delivery_hints:
    - The funding trail hides in plain sight — the same fixer delivers both schools' stipends
    - The feud's recent escalations all serve some third interest neither school holds
    - One school's master suspects, and has begun testing the loyalty of everyone around them
  narrative_hint: >-
    The fed feud is imbalance manufactured for profit. Let exposing
    it threaten both schools' honor as much as the patron — nobody
    thanks the bearer of this news — and let the patron's actual
    goal be visible in what the escalation is distracting from.

- id: the_relic_wants_to_go_home
  name: The Relic Is Trying to Go Home
  description: >-
    An object in the party's keeping — won, bought, entrusted — has
    begun expressing a preference. It is heavier when carried one
    direction, lighter the other. It turns up oriented the same way
    every morning. Something in it remembers where it belongs, and
    the pull is getting less subtle.
  flavor_tags: [relic, spirits, journey, duty]
  lifespan_turns: 8
  delivery_hints:
    - A monk, elder, or spirit-touched child identifies the behavior on sight and goes formal
    - The direction of the pull crosses a border, a feud, or a place the party has reasons to avoid
    - Someone else is looking for the object, navigating by the same pull from the other end
  narrative_hint: >-
    The homesick relic is a quest that carries itself — let the
    party choose between delivery, sale, and resistance, and let
    the rival seeker arrive mid-decision. What waits at home should
    reward the journey's cost with story, not just treasure.

- id: the_breath_before_the_wave
  name: The Animals Left First
  description: >-
    The birds went quiet yesterday. The dogs won't settle. The
    shrine's bell rang once, unrung. Every sign the old people know
    says something large is coming — a storm, a tremor, a tide, a
    spirit passage — and the signs disagree only on when. The
    authorities, such as they are, have crops, schedules, and
    festivals they would rather not move.
  flavor_tags: [omen, nature, community, urgency]
  lifespan_turns: 6
  delivery_hints:
    - One elder is quietly packing; their reasoning, asked for, is specific and checkable
    - The signs cluster around one place — the thing is coming THERE, whatever it is
    - Acting early is cheap and looks foolish; acting late is neither
  narrative_hint: >-
    The omen seed runs on the gap between knowing and convincing.
    Let the party spend social capital to move people, or position
    themselves to act when it lands — and let what comes be survivable
    in proportion to what was heeded.

- id: the_debt_of_a_meal
  name: The Debt of a Meal
  description: >-
    Hospitality was given — a meal, a roof, a healing — by someone
    poor, freely, at real cost to themselves. Genre law is exact
    about this: such debts weigh more than gold. Now the giver is in
    trouble of a kind they will not mention, and the party knows
    only because they happened to see the signs on their way out.
  flavor_tags: [hospitality, debt, honor, community]
  lifespan_turns: 7
  delivery_hints:
    - The trouble has an author — a creditor, a landlord, a relative — who is acting within their rights
    - The giver would be ashamed to be helped and must not learn who arranged it
    - The trouble's paper trail runs upward to someone the party will meet again
  narrative_hint: >-
    The meal-debt is the genre's conscience mechanism. Let repaying
    it require subtlety rather than force — the rights-holder can't
    just be beaten — and let the upward paper trail seed a future
    antagonist who first appears as a name on a lien.

- id: the_wandering_judge
  name: The Wandering Judge Is in the District
  description: >-
    A circuit authority — imperial censor, abbot-inspector, itinerant
    magistrate — is moving through the region, hearing grievances
    and settling them with unappealable finality. Everyone with a
    secret is rescheduling their lives around the visit. The party
    has, or carries, or IS one of the matters that could be brought
    before them.
  flavor_tags: [authority, judgment, secrets, timing]
  lifespan_turns: 7
  delivery_hints:
    - The judge's reputation is for accuracy, not mercy — and reputation, here, is evidence
    - Petitioners are queuing already; the queue's composition is a map of the district's guilt
    - Someone offers the party a price to bring a matter forward — or to keep one quiet
  narrative_hint: >-
    The judge is a deadline with jurisprudence. Let the party use
    the visit — to settle a grievance, expose an enemy, or legitimize
    a claim — and let the judge be exactly as good as advertised,
    which is the problem for everyone whose case has a flaw.

- id: the_spirit_owes_the_family
  name: The Spirit Owes the Family
  description: >-
    A household spirit, place-guardian, or ancestral presence owes a
    debt to a mortal line — an old rescue, an offering kept up
    through famine, a promise witnessed and binding. The last member
    of that line is dying, or leaving, or has just learned the debt
    exists and has no idea what to ask for. Spirit debts unclaimed
    at the line's end go somewhere. Several parties know where.
  flavor_tags: [spirits, inheritance, debt, bargain]
  lifespan_turns: 8
  delivery_hints:
    - The spirit is scrupulous and increasingly anxious; it WANTS the debt discharged correctly
    - What can be asked is bounded by old rules everyone half-remembers differently
    - A broker — monk, matchmaker, or something stranger — has approached the heir about assigning the claim
  narrative_hint: >-
    The unclaimed debt is an inheritance dispute with a supernatural
    creditor who has opinions. Let the heir's choice be the Bang,
    the half-remembered rules be negotiable by scholarship, and the
    broker's client be the thread to pull.

- id: the_armistice_anniversary
  name: The Armistice Is Older Than Its Reasons
  description: >-
    A truce holds here — between villages, clans, schools, or a
    community and something in the hills — renewed each year by a
    ritual exchange nobody enjoys and nobody dares skip. This year,
    one side's token has gone missing days before the exchange, and
    the side that lost it is preparing to lie about it.
  flavor_tags: [truce, ritual, theft, brink]
  lifespan_turns: 6
  delivery_hints:
    - The token is specific and unfakeable to anyone who handles it — the lie will survive a glance, not an inspection
    - The theft required knowledge only an insider, or the other side, could have
    - The original quarrel the truce settled is remembered in two incompatible versions
  narrative_hint: >-
    The missing token is a fuse burning toward the exchange date.
    Let recovering it tour the truce's true history, and let the
    thief's motive be the reveal: someone wants the old quarrel
    back, and it matters enormously which version of it they
    believe.
