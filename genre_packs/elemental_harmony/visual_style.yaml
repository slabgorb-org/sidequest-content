# Visual style configuration for elemental harmony genre pack
#
# Controls how Flux image generation renders scenes for this genre.
# Elemental harmony visual identity: bold ukiyo-e woodblock prints
# in the tradition of Kuniyoshi, Hokusai, and Yoshitoshi. The look
# that irezumi tattoo art emulates — heavy black outlines enclosing
# flat saturated color fields, dynamic swirling compositions with
# wind bars and wave patterns, dramatic contrast. Palette is the
# classic woodblock printing palette: deep indigo, vermillion red,
# teal green, gold ochre, warm skin tones against bold black line.
# Composition is theatrical and muscular — figures in dramatic poses,
# serpentine creatures coiling through the frame, stylized clouds
# and water filling negative space with pattern rather than emptiness.

# ── Core Style ────────────────────────────────────────────────

positive_suffix: >-
  ukiyo-e woodblock print, bold black outlines, flat saturated color
  fills, traditional Japanese woodcut in the style of Kuniyoshi and
  Hokusai, dramatic dynamic composition with swirling motion,
  deep indigo and vermillion and teal green palette, stylized clouds
  and wave patterns filling the frame, visible woodgrain texture in
  color blocks, figures in powerful dramatic poses

negative_prompt: >-
  photorealistic, photograph, 3d render, western medieval fantasy,
  plate armor, gothic, cyberpunk, neon, anime cel-shading, cartoon,
  airbrushed, digital painting, smooth gradients, watercolor wash,
  sumi-e, ink wash, soft edges, pastel, desaturated, minimalist,
  negative space, sparse composition

preferred_model: flux

base_seed: 42

# ── Location Tag Overrides ────────────────────────────────────

visual_tag_overrides:
  temple: >-
    mountain monastery in bold ukiyo-e woodblock style, curved tile
    roofs with heavy black outline and indigo fill, swirling incense
    smoke rendered as stylized cloud patterns, vermillion columns
    with gold ornamental detail, prayer flags as flat color banners
    against dramatic patterned sky
  shrine: >-
    torii gate in bold vermillion woodblock print, heavy black
    outlines on weathered stone, sacred shimenawa rope as thick
    dynamic line, dense bamboo grove with bold parallel strokes
    and teal green fill, offerings in saturated color against
    patterned ground
  forest: >-
    ancient forest in Hokusai landscape style, massive twisted
    trees with bold black bark outlines and layered teal green
    canopy, dramatic shafts of light as gold streaks through
    dense foliage, coiling roots and vines filling the frame
    with organic pattern, swirling mist as stylized cloud bands
  city: >-
    tiered mountain city in classic ukiyo-e perspective, bold
    pagoda rooftops in indigo and vermillion, rows of colored
    lanterns as repeating pattern, crowded streets with dynamic
    figures in flowing robes, arched bridges with heavy black
    outline over swirling water patterns
  village: >-
    farming village in Hiroshige landscape style, thatched roofs
    with bold texture strokes, terraced rice paddies as bands of
    saturated green, figures in conical hats with dynamic poses,
    distant mountains as layered silhouettes in graduating indigo
  mountain: >-
    dramatic peak in Hokusai style with bold angular rock faces,
    swirling cloud patterns filling the sky, tiny figures on a
    carved stairway for scale, prayer flags as vermillion streaks
    against deep indigo sky, wind rendered as dynamic sweeping
    lines across the composition
  river: >-
    river scene with Hokusai wave-style water patterns, bold
    swirling current with white foam crests outlined in black,
    traditional boats with saturated color sails, willow branches
    as dynamic sweeping lines, stone bridge with heavy architectural
    outline and ornamental detail
  crater: >-
    ancient impact crater with dramatic radiating rock formations
    in bold black outline, elemental energy as swirling colored
    patterns rising from deep fissures — vermillion fire, teal
    earth force — scorched ground with heavy texture, pilgrimage
    markers as bold vermillion dots
  tower: >-
    tall pagoda in bold vertical woodblock composition, each floor
    outlined in heavy black with elemental color fills —
    vermillion fire, indigo water, teal green earth, gold wind —
    swirling clouds wrapping the structure, dramatic sky pattern
  ruins: >-
    overgrown ruins with bold crumbling outlines, thick vine
    patterns coiling through broken walls in teal green, shattered
    courtyard with swirling dust patterns, faded murals rendered
    as ghost images beneath bold new growth, dramatic composition
  battlefield: >-
    scarred plain in high-contrast woodblock style, glass craters
    with sharp radiating fracture lines, frozen wave formations
    as bold Hokusai-style curves, upthrust stone pillars with
    heavy black outline, dramatic swirling sky patterns in indigo
    and vermillion suggesting elemental aftermath
  market: >-
    bustling bazaar in lively Kuniyoshi crowd scene style, bold
    figures in dynamic poses, colored silk canopies in saturated
    vermillion and gold, dense pattern of stalls and wares filling
    the frame, calligraphy banners with bold black text, tea house
    with geometric screen patterns
  cave: >-
    crystal cavern with dramatic black cave walls and bold geode
    formations outlined in heavy black with teal and indigo color
    fills, underground pool with swirling water pattern, ancient
    wall carvings as bold relief outlines, luminous crystals as
    gold and vermillion accent points
  outpost: >-
    fortified waystation with bold wooden palisade outlines, watch
    fires as dramatic vermillion bursts, supply wagons and hardy
    ponies in dynamic Kuniyoshi animal style, mountain pass with
    swirling wind patterns as bold sweeping lines, indigo sky
    with stylized cloud bands
  monument: >-
    massive stone obelisk in dramatic vertical composition with
    heavy black outline, four faces bearing elemental symbols in
    bold woodblock color — vermillion, indigo, teal, gold —
    offerings at base rendered as detailed still life pattern,
    swirling elemental energy surrounding the monument

