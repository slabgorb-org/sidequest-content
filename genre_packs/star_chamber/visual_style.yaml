portrait_style: >-
  Oil painting in the Northern Renaissance and early Italian Renaissance style.
  Dramatic chiaroscuro lighting — faces emerging from deep shadow, lit by
  candlelight or a single high window. Palette of parchment cream, wax-seal
  crimson, dark wood brown, tarnished gold, and ecclesiastical purple.
  Backgrounds suggest institutional interiors: stone walls, wooden panels,
  iron fixtures, leaded glass. Clothing is period-appropriate: clerical
  vestments, wool and linen, merchant's fur-trimmed robes, rough-spun
  peasant cloth. No idealization — faces show age, worry, cunning, or
  fervor. The style of Antonello da Messina meets Holbein: precise,
  psychologically penetrating, slightly unsettling.

landscape_style: >-
  Architectural views in the style of 15th-century woodcut maps and
  early Renaissance cityscapes. Warm sepia and umber tones on aged
  parchment. Strong vertical lines — bell towers, fortress walls,
  cathedral spires. Interiors show vaulted stone, candlelight, heavy
  wooden furniture, iron locks. Exteriors show narrow streets, market
  squares, river crossings. Weather is overcast — grey skies, rain on
  cobblestones, fog in cloisters. Smoke from chimneys or bonfires is
  always present somewhere in the frame.

color_palette:
