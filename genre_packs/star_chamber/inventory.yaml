categories:
  - name: Documents
    description: "Paper is the most dangerous material in Star Chamber."
    items:
      - name: Banned Text
        description: "A book, pamphlet, or manuscript forbidden by the tribunal. Possession is evidence."
        rarity: uncommon
        suspicion_if_found: 3
        tags: [contraband, evidence]
      - name: Unsigned Letter
        description: "A letter without a name. Could be warning, accusation, or instruction."
        rarity: common
        tags: [intelligence, evidence]
      - name: Forged Papers
        description: "Travel documents, letters of introduction, or identity papers that aren't real."
        rarity: rare
        suspicion_if_found: 2
        tags: [escape, identity]
      - name: Tribunal Records
        description: "Copies of testimony, accusation lists, or court proceedings. Knowledge is leverage."
        rarity: rare
        tags: [intelligence, leverage]
      - name: Pamphlet
        description: "A printed broadside — political, theological, or satirical. The printing press is the most dangerous weapon in this world."
        rarity: uncommon
        suspicion_if_found: 2
        tags: [contraband, propaganda]

  - name: Religious Items
    description: "Faith is both shield and evidence, depending on whose faith."
    items:
      - name: Rosary
        description: "Unremarkable in a Catholic city. Remarkable in a Protestant one. Context is everything."
        rarity: common
        tags: [faith, identity]
      - name: Heretical Scripture
        description: "A Bible in the vernacular, a Lutheran text, a Talmud — whatever the local tribunal has banned."
        rarity: rare
        suspicion_if_found: 4
        tags: [contraband, faith, evidence]
      - name: Relic
        description: "A bone, a cloth, a phial of something dark. Genuine or fraudulent, it carries weight."
        rarity: rare
        tags: [faith, occult, leverage]
      - name: Breviary
        description: "A priest's prayer book. The annotations in the margins are more interesting than the text."
        rarity: common
        tags: [clergy, identity]

  - name: Tools of the Trade
    description: "What you carry says who you are — and who you might be accused of being."
    items:
      - name: Herbs and Tinctures
        description: "Medicine or witchcraft? The tribunal decides."
        rarity: common
        suspicion_if_found: 1
        tags: [herbalist, evidence, healing]
      - name: Cipher Key
        description: "A system for encoding messages. Possession implies you have something to hide."
        rarity: uncommon
        suspicion_if_found: 2
        tags: [espionage, intelligence]
      - name: Seal and Wax
        description: "For official documents. Whose seal it is determines whether this helps or damns you."
        rarity: uncommon
        tags: [authority, forgery]
      - name: Printing Press Block
        description: "A single carved woodblock for a single page. Harmless out of context. Deadly in context."
        rarity: rare
        suspicion_if_found: 4
        tags: [contraband, underground]

  - name: Currency and Leverage
    description: "Money talks. But in Star Chamber, what it says can be used against you."
    items:
      - name: Gold Coins
        description: "Universal currency. Too many raises questions about where they came from."
        rarity: common
        tags: [currency, bribery]
      - name: Letter of Credit
        description: "A banker's promise. Traceable, which is either an advantage or a disaster."
        rarity: uncommon
        tags: [currency, intelligence]
      - name: Blackmail Material
        description: "Evidence of someone else's sin. The most valuable and dangerous item in the game."
        rarity: rare
        tags: [leverage, intelligence, evidence]
      - name: Signed Confession
        description: "Someone else's confession — possibly coerced, possibly genuine. A weapon and a liability."
        rarity: rare
        tags: [evidence, leverage]
