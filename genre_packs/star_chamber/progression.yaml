level_cap: 5

levels:
  - level: 1
    name: "The Unnamed"
    description: "Nobody knows you. Nobody suspects you. Anonymity is your only shield."
    hp_bonus: 0
    feature: "Start with base stats. Suspicion begins at 0."

  - level: 2
    name: "Person of Interest"
    description: "Someone has noticed you. Your name is in a ledger somewhere."
    hp_bonus: 2
    feature: "Unlock interrogation encounters. Can actively seek witnesses."

  - level: 3
    name: "The Named"
    description: "The tribunal knows your name. Allies seek you out — and so do informants."
    hp_bonus: 2
    feature: "Unlock cross-examination beat. Faction reputation effects intensify."

  - level: 4
    name: "The Accused"
    description: "Charges are formal. The trial date approaches. Every action is weighed."
    hp_bonus: 3
    feature: "Unlock full tribunal encounter. 'Invoke authority' beat available."

  - level: 5
    name: "The Condemned or The Acquitted"
    description: "The tribunal has spoken. What happens now is the epilogue."
    hp_bonus: 3
    feature: "Post-trial narrative. Legacy determined by choices."

xp_sources:
  - action: "Survive an interrogation without raising suspicion"
    xp: 50
  - action: "Identify an informant"
    xp: 75
  - action: "Successfully cross-examine a witness"
    xp: 100
  - action: "Obtain counter-testimony from an ally"
    xp: 50
  - action: "Smuggle a banned item past the patrols"
    xp: 25
  - action: "Attend the bonfire without incident"
    xp: 25
  - action: "Build faction reputation to high"
    xp: 100
  - action: "Survive the tribunal"
    xp: 200
