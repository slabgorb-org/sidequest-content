name: Star Chamber
version: "1.0.0"
description: >-
  Somewhere, in a room you'll never see, very serious men are making very
  serious decisions based on evidence that wouldn't survive a barroom argument.
  And they have the authority to kill you for it. Secret tribunals, compelled
  confession, institutional paranoia, and the crime of wrong belief — from
  Salem to the Vatican, from Tudor England to Calvin's Geneva. The accusation
  is the conviction. The trial is a formality. Don't laugh. They don't think
  it's funny.
min_sidequest_version: "0.1.0"
refine_hooks: false

# --- Creative DNA (reference for all subsequent steps) ---

inspirations:
  - name: "Dr. Strangelove (Kubrick)"
    element: "Institutional madness played straight. The system works perfectly — that's the horror."
  - name: "The Name of the Rose (Eco)"
    element: "Monastery as locked room. Monks killing over a banned book. Theology as murder motive."
  - name: "The Crucible (Miller)"
    element: "Salem as McCarthyism. The allegory IS the point. Neighbor denouncing neighbor."
  - name: "A Man for All Seasons (Bolt)"
    element: "Thomas More in the Star Chamber. Silence as the only defense. The law as a trap."
  - name: "Wolf Hall (Mantel)"
    element: "Cromwell working the levers. Everyone's guilty of something — who gets charged first."
  - name: "Catch-22 (Heller)"
    element: "Bureaucratic nightmare. The rules exist to destroy you, and following them is how they get you."
  - name: "Monty Python's Spanish Inquisition"
    element: "The tribunal as farce. Accusations that make no sense, delivered with total conviction."
  - name: "Blackadder"
    element: "History as farce, power as incompetence, the little guy navigating idiots with authority."

era_range: "1400s-1790s"

core_vibe: >-
  The institution says what God wants. You disagree. That makes you dangerous.
  Or maybe you don't disagree at all — but someone told the tribunal you do,
  and their word is evidence. The question is never whether you're guilty. The
  question is whether they've decided you are.

emotional_tone:
  - institutional dread
  - absurdist horror
  - defiant conscience
  - gallows humor

differentiation: >-
  No monsters, no starships, no drawn swords — the antagonist is a room full of
  men with paperwork. Star Chamber is the only genre where the climax is a
  conversation: you sit in a chair, answer questions, and everything you did in
  the entire game determines whether you walk out. The engine tracks suspicion
  as an involuntary resource and testimony as structured evidence. Combat exists
  but is never the point — getting into a fight means you've already lost.
  The satire dial is the signature axis: the same mechanics produce both
  "A Man for All Seasons" and "Nobody expects the Spanish Inquisition" depending
  on where you set it. The occult dial determines whether the heresy is real.
