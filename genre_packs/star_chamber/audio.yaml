mood_tracks:
  tribunal:
    - path: audio/music/tribunal.ogg
      title: "Judgment Day"
      bpm: 60
  interrogation:
    - path: audio/music/interrogation.ogg
      title: "Questions in the Dark"
      bpm: 70
  investigation:
    - path: audio/music/investigation.ogg
      title: "Gathering Clues"
      bpm: 80
  escape:
    - path: audio/music/escape.ogg
      title: "Flight"
      bpm: 120
  tension:
    - path: audio/music/tension.ogg
      title: "Suspicion Rising"
      bpm: 95
  calm:
    - path: audio/music/calm.ogg
      title: "Quiet Moment"
      bpm: 55
  defeat:
    - path: audio/music/defeat.ogg
      title: "Condemned"
      bpm: 40

sfx_library:
  gavel:
    - audio/sfx/gavel.ogg
  chains:
    - audio/sfx/chains.ogg
  torch:
    - audio/sfx/torch.ogg
  footsteps:
    - audio/sfx/footsteps.ogg
    - audio/sfx/footsteps_2.ogg
  door:
    - audio/sfx/door_lock.ogg
    - audio/sfx/door_open.ogg
  whispers:
    - audio/sfx/whispers.ogg
  quill:
    - audio/sfx/quill_scratch.ogg
  page_turn:
    - audio/sfx/page_turn.ogg

creature_voice_presets:
  tribunal_judge:
    creature_type: tribunal_judge
    description: "Formal, authoritative voice of institutional power"
    pitch: 0.9
    rate: 0.85
    effects:
      - type: reverb
        params:
          room_size: 0.6
  nervous_witness:
    creature_type: nervous_witness
    description: "Uncertain, trembling voice of fear"
    pitch: 1.1
    rate: 1.05
    effects:
      - type: reverb
        params:
          room_size: 0.4
  inquisitor:
    creature_type: inquisitor
    description: "Cold, measured voice of authority"
    pitch: 0.8
    rate: 0.8
    effects:
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 2000

mixer:
  music_volume: 0.35
  sfx_volume: 0.6
  voice_volume: 1.0
  duck_music_for_voice: true
  duck_amount_db: -10.0
  crossfade_default_ms: 2000
