# Genre-level historical timeline — anchor points the narrator can reference.
# World-specific history lives in the world directory.

timeline:
  - year: 1231
    event: "Pope Gregory IX establishes the Medieval Inquisition"
    significance: "Institutional persecution becomes systematic. The apparatus is built."

  - year: 1478
    event: "Pope Sixtus IV authorizes the Spanish Inquisition"
    significance: "The most organized tribunal in history begins. Torquemada appointed 1483."

  - year: 1487
    event: "Malleus Maleficarum published"
    significance: "The witch-hunter's manual. Provides theological and procedural framework for witch trials across Europe."

  - year: 1494
    event: "Medici expelled from Florence; Savonarola rises"
    significance: "A friar takes a city through moral authority alone. Theocratic republic begins."

  - year: 1497
    event: "Bonfire of the Vanities, Florence"
    significance: "Thousands of art objects burned in the piazza. The revolution consumes beauty."

  - year: 1498
    event: "Savonarola executed"
    significance: "Hanged and burned on the same piazza. The institution wins. The Medici return."

  - year: 1517
    event: "Luther posts 95 Theses"
    significance: "The Reformation begins. The printing press makes ideas uncontainable."

  - year: 1521
    event: "Diet of Worms — Luther refuses to recant"
    significance: "'Here I stand.' The most famous refusal in Western history."

  - year: 1534
    event: "Münster Rebellion — Anabaptist commune"
    significance: "Radicals seize a city and establish a theocracy. Besieged, destroyed. The revolution eating itself."

  - year: 1535
    event: "Thomas More executed"
    significance: "The Lord Chancellor destroyed by the Star Chamber he once served."

  - year: 1542
    event: "Roman Inquisition established"
    significance: "The Counter-Reformation's judicial arm. Galileo will face it in 1633."

  - year: 1559
    event: "Index of Forbidden Books published"
    significance: "The Vatican's official censorship list. Will be maintained until 1966."

  - year: 1600
    event: "Giordano Bruno burned at the stake"
    significance: "Philosopher and cosmologist. Refused to recant. The Inquisition's most famous victim."

  - year: 1633
    event: "Galileo's trial"
    significance: "Forced to recant heliocentrism. 'And yet it moves' — possibly apocryphal, certainly true in spirit."

  - year: 1641
    event: "Star Chamber abolished"
    significance: "The Long Parliament destroys the court. Its name lives on as metaphor."

  - year: 1692
    event: "Salem witch trials"
    significance: "200 accused, 20 executed in colonial Massachusetts. Spectral evidence accepted as proof."

  - year: 1693
    event: "Salem trials end; Governor Phips dissolves the court"
    significance: "The Governor's wife was accused. The court was dissolved the next day."

themes_across_eras:
  - "The accusation is always easier than the defense"
  - "Institutions survive the people who built them and the people they destroy"
  - "Recantation is more valuable to the system than execution"
  - "The printing press changed everything — ideas became uncontainable"
  - "Every moral panic follows the same arc: accusation, escalation, collapse, regret"
