# Star Chamber uses real-world historical names appropriate to each world.
# Genre-level cultures are broad categories; worlds refine with local names.

- name: Clergy
  description: "Priests, monks, friars, bishops, abbots — the institutional church. Addressed by title, known by order."
  slots:
    given_name:
      word_list: [Thomas, Francis, Benedict, Ignatius, Jerome, Ambrose, Clement, Sebastian, Dominic, Augustine, Catherine, Teresa, Hildegard, Clare, Brigid, Scholastica]
    family_name:
      word_list: [of Assisi, of Aquinas, of Canterbury, of Padua, of the Cross, of Avila]
    title:
      word_list: [Father, Brother, Sister, Prior, Abbot, Abbess, Bishop, Canon, Friar, Deacon, Reverend Mother]
    place_noun:
      word_list: [Abbey, Priory, Chapel, Cathedral, Cloister, Rectory, Scriptorium, Chapter House, Refectory, Cell]
    adjective:
      word_list: [Holy, Blessed, Sacred, Grey, Black, White, Old, Hidden, Silent, Burning]
  person_patterns:
    - "{title} {given_name}"
    - "{title} {given_name} {family_name}"
    - "{given_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{given_name}'s {place_noun}"
    - "The {place_noun} of {given_name}"

- name: Magistrate Class
  description: "Judges, notaries, clerks, lawyers — the legal apparatus of the tribunal. Paper is their weapon."
  slots:
    given_name:
      word_list: [Heinrich, Giovanni, Tomas, Pierre, Edmund, Willem, Konrad, Philippe, Matteo, Lorenzo, Hans, Bernardo]
    family_name:
      word_list: [Kramer, Torquemada, Sprenger, Morone, Carafa, Ghislieri, Valdez, Cranmer, Gardiner, Bonner]
    title:
      word_list: [Judge, Magistrate, Notary, Clerk, Assessor, Chancellor, Advocate, Proctor, Commissioner]
    place_noun:
      word_list: [Court, Chamber, Hall, Office, Archive, Registry, Prison, Tower, Gate, Tribunal]
    adjective:
      word_list: [High, Lower, Inner, Outer, Star, Secret, Royal, Episcopal, Grand, Ecclesiastical]
  person_patterns:
    - "{title} {family_name}"
    - "{title} {given_name} {family_name}"
    - "{family_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{family_name}'s {place_noun}"
    - "The {place_noun}"

- name: Townspeople
  description: "Bakers, coopers, weavers, midwives — ordinary people caught in institutional machinery."
  slots:
    given_name:
      word_list: [Martha, Agnes, Hans, Grete, Piero, Lucia, Willem, Margery, Tomas, Bess, Jakob, Anna, Katrin, Henryk, Rosa, Matteo]
    family_name:
      word_list: [Muller, Bauer, Weber, Schmidt, Fischer, Brewer, Cooper, Thatcher, Baker, Wright, Dyer, Weaver, Tanner, Mason, Carter]
    title:
      word_list: [Goodman, Goodwife, Widow, Master, Mistress]
    place_noun:
      word_list: [Market, Square, Well, Bridge, Gate, Lane, Alley, Wharf, Bakery, Workshop, Tavern, Yard]
    adjective:
      word_list: [Lower, Upper, Old, New, Broad, Narrow, Dark, Crooked, Mill, Church]
  person_patterns:
    - "{given_name} {family_name}"
    - "{title} {family_name}"
    - "{given_name} the {family_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {family_name}'s {place_noun}"
    - "{adjective} {place_noun} {place_noun}"

- name: Gentry
  description: "Landowners, patrons, nobles — people with property worth seizing, which makes them targets and powers both."
  slots:
    given_name:
      word_list: [Lorenzo, Giovanni, Heinrich, Edmund, Isabella, Lucrezia, Margaret, Philippe, Cosimo, Bianca, Ferdinand, Eleonora, Alfonso, Beatrice, Charles, Anne]
    family_name:
      word_list: [de Medici, von Hapsburg, Borgia, Tudor, Valois, Sforza, d'Este, Gonzaga, Orsini, Colonna, Farnese, della Rovere]
    title:
      word_list: [Lord, Lady, Count, Countess, Duke, Duchess, Baron, Baroness, Signore, Signora, Don, Dona]
    place_noun:
      word_list: [Palace, Villa, Estate, Tower, Castle, Manor, Fortress, Gardens, Palazzo, Loggia]
    adjective:
      word_list: [Grand, Old, Golden, Iron, Marble, Crimson, Fallen, Hidden, Ruined, Ancestral]
  person_patterns:
    - "{title} {given_name} {family_name}"
    - "{given_name} {family_name}"
    - "The {title} {family_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{family_name} {place_noun}"
    - "Palazzo {family_name}"

- name: The Underground
  description: "Printers, smugglers, hidden congregations — people who move banned ideas. Known by alias, not name."
  slots:
    given_name:
      word_list: [The Printer, The Scribe, The Messenger, The Bookbinder, The Apothecary, The Widow, The Ferryman, The Lamplighter, The Blind Man, The Pilgrim]
    family_name:
      word_list: [of the Red Door, of the Bridge, of the Mill, of the Quay, of the North Road, of the Ash Tree]
    title:
      word_list: []
    place_noun:
      word_list: [Cellar, Attic, Press, Vault, Tunnel, Safe House, Back Room, Crypt, Warehouse, Boat]
    adjective:
      word_list: [Hidden, False, Borrowed, Unnamed, Shuttered, Underground, Locked, Forgotten, Abandoned, Secret]
  person_patterns:
    - "{given_name}"
    - "{given_name} {family_name}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "The {place_noun} {family_name}"
