# Voice presets for Star Chamber TTS.
# These map archetype roles to Kokoro voice parameters.

presets:
  - id: inquisitor
    description: "Measured, deliberate, the voice of someone who has already decided and is going through the form."
    kokoro_voice: bf_emma
    speed: 0.85
    pitch_shift: -2
    tags: [clergy, magistrate, authority]

  - id: friar
    description: "Fervent, rising in intensity, the cadence of a sermon — even in conversation."
    kokoro_voice: bm_george
    speed: 0.95
    pitch_shift: 0
    tags: [clergy, reformer, true_believer]

  - id: merchant
    description: "Brisk, practical, assessing everything in terms of cost. Warmth is calculated."
    kokoro_voice: bm_lewis
    speed: 1.05
    pitch_shift: 0
    tags: [merchant, gentry, opportunist]

  - id: witness
    description: "Halting, uncertain, the voice of someone choosing each word knowing it could be evidence."
    kokoro_voice: bf_emma
    speed: 0.80
    pitch_shift: 1
    tags: [townsperson, reluctant_witness]

  - id: accused
    description: "Strained, defensive, oscillating between composed argument and raw fear."
    kokoro_voice: af_sarah
    speed: 0.90
    pitch_shift: 0
    tags: [accused, heretic]

  - id: child_informant
    description: "Clear, earnest, unnervingly certain. A child's voice delivering an adult's judgment."
    kokoro_voice: af_sarah
    speed: 1.10
    pitch_shift: 4
    tags: [informant, piagnoni]

  - id: underground
    description: "Quiet, quick, the voice of someone who checks the door before speaking."
    kokoro_voice: am_adam
    speed: 1.00
    pitch_shift: -1
    tags: [underground, reformer, smuggler]

  - id: noble
    description: "Unhurried, accustomed to being heard. Every sentence assumes you are listening."
    kokoro_voice: bm_george
    speed: 0.85
    pitch_shift: -1
    tags: [gentry, establishment, authority]
