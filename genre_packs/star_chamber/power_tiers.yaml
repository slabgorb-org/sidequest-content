tiers:
  - level_range: [1, 2]
    label: "Nobody"
    player: >-
      You are invisible to the institution. No name in any ledger, no standing,
      no property, no connections worth investigating. The safest and most
      powerless position.
    npc: >-
      A servant, beggar, or transient. Ignored by people of consequence.
      Cannot formally accuse; their word carries minimal weight.

  - level_range: [3, 4]
    label: "Known"
    player: >-
      You have a name, a trade, a place in the community. You could be found
      if the tribunal wanted to. Your neighbors would recognize you. Visible
      enough to function, visible enough to be vulnerable.
    npc: >-
      An ordinary townsperson or minor tradesperson. Testimony against someone
      carries standard weight. Can be summoned, but not pursued aggressively.

  - level_range: [5, 6]
    label: "Connected"
    player: >-
      You know people worth knowing. Your name opens some doors and closes
      others. A letter of introduction from you means something. An accusation
      would be noticed — which is both protection and target.
    npc: >-
      A merchant, minor clergy, or local notable. Their accusation requires
      genuine evidence. Can request audiences with officials. Faction
      reputation effects are stronger.

  - level_range: [7, 8]
    label: "Person of Consequence"
    player: >-
      Your accusation or acquittal would be political news. Judges consider
      the implications before acting. You have allies in the institution
      — or enemies powerful enough to care.
    npc: >-
      Gentry, senior clergy, or wealthy merchant. Their word carries weight.
      Can compel testimony from lower-tier NPCs. Accusations against them
      require institutional backing.

  - level_range: [9, 10]
    label: "The Institution Itself"
    player: >-
      You ARE the system. Judge, bishop, governor, inquisitor-general. You can
      accuse, try, condemn. The only people who can stop you are others at this
      tier. The horror is what the system requires of you.
