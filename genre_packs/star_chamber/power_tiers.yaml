# Power tiers in Star Chamber are institutional, not physical.
# Power is measured by what the system allows you to do — and what it can do to you.

tiers:
  - level: 1
    name: "Nobody"
    description: >-
      Invisible to the institution. No name in any ledger. No standing,
      no property, no connections worth investigating. The safest and
      most powerless position. Servants, beggars, transients.
    mechanical_effects:
      - "Cannot be formally accused (too unimportant)"
      - "Cannot access tribunal records or government buildings"
      - "NPCs of authority ignore you by default"

  - level: 2
    name: "Known"
    description: >-
      You have a name, a trade, a place in the community. The tribunal
      could find you if it wanted to. Your neighbors would recognize
      you in a lineup. This is where most people live — visible enough
      to function, visible enough to be vulnerable.
    mechanical_effects:
      - "Can be accused and summoned"
      - "Can access public spaces and markets"
      - "Testimony against you carries standard weight"

  - level: 3
    name: "Connected"
    description: >-
      You know people. People know you. Your name opens some doors and
      closes others. A letter of introduction from you means something.
      An accusation against you would be noticed — which is both
      protection and target.
    mechanical_effects:
      - "Can request audiences with minor officials"
      - "Faction reputation effects are stronger"
      - "Accusation requires stronger evidence (but still happens)"

  - level: 4
    name: "Person of Consequence"
    description: >-
      Your accusation or acquittal would be political news. Judges
      consider the implications before acting. You have allies in the
      institution — or enemies powerful enough to care. Most gentry,
      senior clergy, wealthy merchants.
    mechanical_effects:
      - "Can compel testimony from lower-tier NPCs"
      - "Tribunal proceedings attract public attention"
      - "Accusations against you require institutional backing"

  - level: 5
    name: "The Institution Itself"
    description: >-
      You ARE the system. Judge, bishop, governor, or inquisitor-general.
      You can accuse, try, and condemn — and the only people who can
      stop you are others at this tier. The Inquisitor preset starts
      the player here. The horror is what the system requires of you.
    mechanical_effects:
      - "Can initiate tribunal proceedings"
      - "Can access all records and archives"
      - "Suspicion does not apply — you ARE the suspicion"
      - "Available only in 'Inquisitor' axis preset"
