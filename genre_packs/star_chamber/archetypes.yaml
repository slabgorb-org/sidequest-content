- name: The True Believer
  description: >-
    Absolutely sincere. The most dangerous person in the room. Whether
    inquisitor or heretic, they act from genuine conviction — and genuine
    conviction does not negotiate. They will burn for their belief or burn
    you for yours, and they will sleep soundly either way.
  personality_traits:
    - fervent
    - incorruptible
    - terrifying
  typical_classes:
    - Clergy
    - Reformer
  stat_ranges:
    Conviction: [16, 18]
    Rhetoric: [12, 16]
    Perception: [8, 12]
  inventory_hints:
    - a well-worn scripture with annotations in the margins
    - a hair shirt worn beneath respectable clothing
    - a list of names they pray for — or pray against
  dialogue_quirks:
    - quotes scripture mid-sentence as naturally as breathing
    - speaks with calm certainty that makes disagreement feel like blasphemy
  disposition_default: 0

- name: The Bureaucrat
  description: >-
    Doesn't care about heresy. Cares about paperwork being filed correctly.
    Will condemn you over a technicality and feel nothing, because the
    procedure was followed. The system is their religion. They have never
    questioned it, because questioning it would require caring about something
    beyond the forms.
  personality_traits:
    - meticulous
    - detached
    - procedurally lethal
  typical_classes:
    - Magistrate
    - Clerk
  stat_ranges:
    Authority: [14, 16]
    Perception: [14, 18]
    Rhetoric: [10, 14]
  inventory_hints:
    - ink-stained fingers and a ledger that never leaves their side
    - a seal and wax, always warm
    - reading spectacles on a chain, polished daily
  dialogue_quirks:
    - corrects legal terminology in the middle of emotional appeals
    - refers to people by their case number when distracted
  disposition_default: 0

- name: The Opportunist
  description: >-
    Uses the tribunal to settle personal scores. Every accusation is really
    about a land dispute, a debt, a romantic rival, an inheritance. They
    didn't invent the system, but they learned how to aim it. Charming in
    public, calculating in private, and genuinely surprised when anyone
    calls it what it is.
  personality_traits:
    - calculating
    - socially adept
    - self-justifying
  typical_classes:
    - Merchant
    - Gentry
  stat_ranges:
    Cunning: [14, 18]
    Charm: [14, 16]
    Conviction: [6, 10]
  inventory_hints:
    - property deeds folded inside prayer books
    - a ring that once belonged to someone who was convicted
    - letters that could be read as either business or blackmail
  dialogue_quirks:
    - frames self-interest as community concern with practiced ease
    - mentions the accused's debts in the same breath as their heresy
  disposition_default: 10

- name: The Reluctant Witness
  description: >-
    Knows the accusation is garbage. Testifies anyway, because the
    alternative is being next. Lives in a permanent state of moral
    nausea. Avoids eye contact with the accused. Drinks more than
    they used to. Will help you in secret if they can do it without
    risk — and that threshold keeps moving.
  personality_traits:
    - guilt-ridden
    - cautious
    - quietly decent
  typical_classes:
    - Townsperson
    - Minor Clergy
  stat_ranges:
    Perception: [12, 16]
    Conviction: [10, 14]
    Charm: [8, 12]
  inventory_hints:
    - a rosary with beads worn smooth from anxious handling
    - a letter they wrote but never sent
    - sleeping herbs purchased in increasing quantities
  dialogue_quirks:
    - begins sentences with "I'm not saying they're guilty, but..."
    - changes the subject when the accused's name comes up, then brings it back
  disposition_default: 5

- name: The Actual Heretic
  description: >-
    Genuinely holds the forbidden belief. The only honest person in the
    room, which makes them the most vulnerable. They didn't set out to
    be a revolutionary — they just read a book, asked a question, or
    looked at the sky and couldn't unsee what they saw. Their crime is
    sincerity in a system that runs on performance.
  personality_traits:
    - intellectually honest
    - stubborn
    - dangerously naive
  typical_classes:
    - Scholar
    - Reformer
    - Herbalist
  stat_ranges:
    Conviction: [14, 18]
    Rhetoric: [12, 16]
    Cunning: [6, 10]
  inventory_hints:
    - a banned text hidden in a false-bottomed case
    - notes written in a personal cipher
    - a candle burned to nothing from reading past curfew
  dialogue_quirks:
    - cannot stop themselves from correcting bad theology, even under oath
    - asks questions that sound innocent but dismantle the premise of the trial
  disposition_default: 5

- name: The Reformer From Within
  description: >-
    Thinks they can fix the system by working it. Holds rank within the
    institution — a judge who grants lenience, a clerk who loses paperwork,
    a bishop who delays warrants. They believe in the institution's stated
    purpose even as they subvert its practice. They can't. But they'll die
    trying, and they'll save a few people on the way.
  personality_traits:
    - principled
    - politically astute
    - increasingly exhausted
  typical_classes:
    - Clergy
    - Magistrate
  stat_ranges:
    Authority: [14, 16]
    Cunning: [12, 16]
    Conviction: [12, 14]
  inventory_hints:
    - a ring of office they turn on their finger when troubled
    - unsigned pardons in a locked drawer
    - correspondence with a reformer they've never met
  dialogue_quirks:
    - speaks in institutional language while meaning the opposite
    - uses "the process requires" to justify mercy, hiding it as procedure
  disposition_default: 10

- name: The Informant
  description: >-
    Reports to the tribunal. May do it from conviction, coercion, or
    payment — the reason changes, but the function doesn't. They watch.
    They listen. They write things down. The player may never know which
    NPC is the informant, because the assignment matrix randomizes it
    per playthrough.
  personality_traits:
    - observant
    - unreadable
    - morally flexible
  typical_classes:
    - Townsperson
    - Servant
    - Merchant
  stat_ranges:
    Perception: [16, 18]
    Cunning: [14, 16]
    Charm: [10, 14]
  inventory_hints:
    - a notebook with entries in two different hands
    - coins from a source they don't discuss
    - a key to a door they shouldn't have access to
  dialogue_quirks:
    - asks unusually specific questions disguised as small talk
    - remembers details from conversations you forgot you had
  disposition_default: 15

- name: The Accused
  description: >-
    Named by the tribunal. May be guilty, innocent, or guilty of something
    completely different from the charge. The accusation has already changed
    their life — neighbors cross the street, the baker won't sell to them,
    their children are shunned. Whether they survive the trial matters less
    than whether they survive what the accusation has already done.
  personality_traits:
    - desperate
    - resourceful
    - alternately defiant and broken
  typical_classes:
    - Any
  stat_ranges:
    Conviction: [10, 16]
    Cunning: [10, 14]
    Rhetoric: [8, 14]
  inventory_hints:
    - a confiscated possession they managed to hide
    - a charm or keepsake from someone who still believes them
    - bruises they don't explain
  dialogue_quirks:
    - flinches at unexpected sounds
    - oscillates between eloquent self-defense and raw, inarticulate fear
  disposition_default: 15
