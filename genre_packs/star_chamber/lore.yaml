world_name: ""
history: >-
  Star Chamber is rooted in the historical injustices of ecclesiastical
  and secular courts: the Star Chamber of Tudor England, the Spanish
  Inquisition, the witch trials of Salem, and the moral machinery of
  totalitarian authority. The game does not recreate any single era or
  institution, but rather explores the psychology of persecution as a system
  — how ordinary people with ordinary motives become architects of suffering.

geography: ""

cosmology: >-
  In Star Chamber, the supernatural is whatever serves authority. If the
  tribunal claims you trafficked with demons, then in the tribunal's eyes,
  demons are real. Reality bends to institutional narrative. The accused
  can protest the truth of their innocence, but truth is no match for
  testimony, confession, and the appearance of order. What matters is not
  what happened, but what can be proven to have happened. And proof is
  whatever the tribunal says it is.

factions:
  - name: The Tribunal
    summary: "Secret judicial body with absolute power to convict, torture, and execute"
    description: >-
      An unseen judicial body that determines guilt. Operates in secret,
      relies on testimony and evidence gathered by informants. Has absolute
      power to convict, torture, and execute. May be merciful or merciless
      depending on the evidence presented.
    disposition: neutral

  - name: The Informant Network
    summary: "Hidden tribunal informants reporting on player associations with unknown identities"
    description: >-
      NPCs connected to the tribunal, reporting on player actions and
      associations. The player does not know their identities. The only
      defense is discretion.
    disposition: hostile

  - name: The Underground
    summary: "Secret heretic and dissident network requiring absolute discretion to join"
    description: >-
      Heretics, refugees, and dissidents who operate in secrecy. May
      become allies if trust is built, but trust requires absolute
      discretion.
    disposition: cautious
