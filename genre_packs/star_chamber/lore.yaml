- category: institutions
  entries:
    - name: The Star Chamber
      description: >-
        An English privy council court that operated from the 15th century
        until its abolition in 1641. Sessions held in a room at Westminster
        Palace with stars painted on the ceiling. No jury. No appeal. Could
        compel testimony under oath, impose fines, imprisonment, and
        mutilation. Became synonymous with arbitrary, secretive, and
        oppressive justice. Its name survives as a metaphor for any tribunal
        that judges in secret.
    - name: The Inquisition
      description: >-
        A family of institutions within the Catholic Church charged with
        combating heresy. The Medieval Inquisition (1184), the Spanish
        Inquisition (1478), the Portuguese Inquisition (1536), and the
        Roman Inquisition (1542) operated with varying degrees of
        independence from secular authority. Common features: secret
        testimony, compelled confession, the principle that accusation
        requires investigation regardless of evidence quality.
    - name: The Consistory
      description: >-
        Calvin's Geneva (1541-1564) operated a Consistory — a church court
        that enforced moral discipline. Offenses included dancing, card
        playing, naming children after saints, laughing during a sermon,
        and singing secular songs. Punishments ranged from public penance
        to excommunication to execution. The Consistory was technically
        advisory; the secular Council imposed sentences. In practice, the
        distinction was academic.
    - name: Courts of Oyer and Terminer
      description: >-
        Special courts commissioned to "hear and determine" specific cases.
        The Salem witch trials (1692) were conducted by a Court of Oyer
        and Terminer established by Governor Phips. The court accepted
        spectral evidence — testimony that the accused's spirit appeared
        to the witness in dreams or visions. When the Governor's wife was
        accused, he dissolved the court.

- category: concepts
  entries:
    - name: Spectral Evidence
      description: >-
        Testimony that the accused's spirit or specter appeared to the
        witness, usually to torment them. Accepted as evidence in Salem
        and some European witch trials. The accused could not refute it —
        they had no control over what their specter allegedly did. The
        theological debate over spectral evidence was genuine: could the
        Devil use an innocent person's specter without their consent?
    - name: Auto-da-fé
      description: >-
        "Act of faith." A public ritual of the Spanish and Portuguese
        Inquisitions where sentences were announced and penances performed.
        The actual execution (burning) was carried out by secular
        authorities — the Church's hands stayed technically clean. The
        spectacle served as deterrent, entertainment, and proof of
        institutional power.
    - name: Recantation
      description: >-
        Public withdrawal of a heretical belief. The institution preferred
        recantation to execution — a living recanter proved the system
        worked; a martyr could inspire others. Galileo recanted.
        Savonarola did not. The choice defined them more than whatever
        they believed.
    - name: The Index of Forbidden Books
      description: >-
        The Vatican's official list of publications Catholics were
        forbidden to read. Maintained from 1559 to 1966. Included works
        by Galileo, Copernicus, Kepler, Descartes, Voltaire, Dumas,
        Hugo, and Sartre. A book's appearance on the Index reliably
        increased its sales.

- category: historical_figures
  entries:
    - name: Girolamo Savonarola
      description: >-
        Dominican friar who effectively ruled Florence from 1494 to 1498
        through sheer moral authority. Organized the Bonfire of the
        Vanities, defied Pope Alexander VI, and established a theocratic
        republic. Excommunicated, arrested, tortured, hanged, and burned
        on the Piazza della Signoria. His followers collected his ashes
        from the Arno as relics.
    - name: Tomás de Torquemada
      description: >-
        First Grand Inquisitor of Spain (1483-1498). Established the
        procedural framework of the Spanish Inquisition. Responsible for
        an estimated 2,000 executions. A Dominican, like Savonarola.
        His name became the universal shorthand for institutional
        persecution.
    - name: Thomas More
      description: >-
        Lord Chancellor of England (1529-1532). Refused to acknowledge
        Henry VIII's supremacy over the Church. Tried in the actual Star
        Chamber. Executed for treason. Canonized as a saint. His trial
        is the archetypal "conscience vs. institution" drama — a man of
        the law destroyed by the law he served.
    - name: Martin Luther
      description: >-
        Augustinian friar who posted 95 theses against indulgences in
        Wittenberg (1517). Excommunicated. Summoned to the Diet of Worms.
        Refused to recant: "Here I stand. I can do no other." Protected
        by Frederick the Wise. The printing press made his ideas
        uncontainable. The Reformation followed.
