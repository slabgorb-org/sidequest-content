world_name: Pyre of Vanities
starting_region: piazza_della_signoria
map_style: "Renaissance Florence bird's-eye view in the style of a 1490s woodcut map, warm sepia ink on aged parchment, the Arno curving through the center, Brunelleschi's dome dominating the skyline, hand-lettered Italian place names"
map_resolution: [1024, 1024]

regions:
  piazza_della_signoria:
    name: Piazza della Signoria
    summary: "Political heart of Florence where bonfires burn and the pyre is being built"
    description: >-
      The political heart of Florence. The Palazzo della Signoria looms at
      the south end — crenellated, severe, the seat of the Republic. The
      Loggia dei Lanzi shelters classical statues that Savonarola's
      followers eye with suspicion. The piazza is where the bonfires burn,
      where crowds gather for sermons and executions, where the boy
      brigades muster at dawn. A raised wooden platform for the pyre is
      being constructed. Workers hammer by torchlight.
    origin: origins
    adjacent: [uffizi_quarter, mercato_vecchio, cathedral_quarter, ponte_vecchio_quarter]

  cathedral_quarter:
    name: The Cathedral Quarter
    summary: "Brunelleschi's dome over streets Piagnoni boy patrols own after dark"
    description: >-
      The Duomo — Brunelleschi's impossible dome — presides over a maze
      of narrow streets. Santa Maria del Fiore is where the city prays.
      San Marco, Savonarola's Dominican monastery, is three streets north.
      The Baptistery doors gleam. The bell tower calls. Between the
      cathedral and San Marco, the streets belong to the Piagnoni after
      dark — boy patrols with torches, checking faces.
    adjacent: [piazza_della_signoria, san_marco, artisan_quarter]

  san_marco:
    name: San Marco Monastery
    summary: "Savonarola's fortress-priory, entry requires trust or a very good lie"
    description: >-
      Savonarola's fortress. A Dominican priory with Fra Angelico frescoes
      in every cell — which Savonarola has not burned, because they depict
      scripture, not vanity. The library holds texts the friar considers
      holy. His cell is spare: a desk, a crucifix, a bed he barely uses.
      The chapter house is where the inner circle meets. Entry requires
      trust or a very good lie.
    adjacent: [cathedral_quarter]

  mercato_vecchio:
    name: Mercato Vecchio (Old Market)
    summary: "Commercial heart where rumors spread faster than plague and broadsides change daily"
    description: >-
      The commercial heart — stalls selling cloth, spices, meat, and
      information. The market is where rumors propagate faster than plague.
      Savonarola's moral laws have closed the gambling houses and brothels
      that backed onto the market, but the merchants remain, and merchants
      talk. A broadside nailed to the fountain column changes every morning.
      The Compagnacci drink at a tavern on the south side and dare anyone
      to report them.
    adjacent: [piazza_della_signoria, artisan_quarter, oltrarno]

  artisan_quarter:
    name: The Artisan Quarter
    summary: "Artists hiding masterworks in false bottoms and bricked walls from the pyre"
    description: >-
      Workshops of painters, sculptors, goldsmiths, and woodworkers. Some
      have surrendered work to the bonfire. Others have hidden it — rolled
      canvases in false-bottomed chests, statues bricked into walls, books
      in sealed clay jars. Botticelli's workshop is here, its shutters
      closed. The smell of turpentine and linseed oil lingers in streets
      that used to ring with hammers and now whisper.
    adjacent: [cathedral_quarter, mercato_vecchio, oltrarno]

  ponte_vecchio_quarter:
    name: Ponte Vecchio & the Banks
    summary: "Gold bridge and shuttered Medici bank holding secrets worth killing for"
    description: >-
      The old bridge, lined with goldsmiths and jewelers. The Medici
      bank — shuttered since the family's exile — looms on the north
      bank. The Arno flows beneath, brown and fast in winter. The bridge
      is the crossing point between the city proper and the Oltrarno.
      Banking records in the shuttered Medici offices contain secrets
      that multiple factions would kill to possess or destroy.
    adjacent: [piazza_della_signoria, oltrarno]

  oltrarno:
    name: The Oltrarno
    summary: "South-bank refuge for Arrabbiati, hidden presses, and the Vatican's agent"
    description: >-
      South of the Arno — artisan workshops, the Pitti Palace (empty,
      the Medici gone), and the churches of Santo Spirito and Santa Maria
      del Carmine with their Masaccio frescoes. The Oltrarno is where the
      Arrabbiati feel safest — far enough from San Marco to breathe,
      close enough to the river to flee if the Piagnoni come in force.
      Hidden printing presses operate in two cellars. The Vatican's agent
      keeps a room above a leather-worker's shop.
    adjacent: [ponte_vecchio_quarter, mercato_vecchio, artisan_quarter]

  uffizi_quarter:
    name: The Government Offices
    summary: "Republican archive of every accusation and confession under Savonarola's law"
    description: >-
      The Uffizi — administrative offices of the Republic — extend south
      from the Palazzo della Signoria in a long corridor. Here the notaries
      record accusations, the clerks file testimony, and the machinery of
      Savonarola's moral law grinds on in neat handwriting. The archive
      holds every accusation, every confession, every property seized. A
      clerk with access to these records is the most dangerous ally in
      Florence.
    adjacent: [piazza_della_signoria]
