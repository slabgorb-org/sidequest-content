world_name: "Pyre of Vanities"

history: >-
  The City sits at the intersection of two faiths — the Old Universalism and
  the New Piety. For generations they coexisted, tension held in check by custom
  and commerce. Then came the Synod of Judgment. A council of bishops declared
  the old ways corrupting influences. Art was deemed vanity. Music was deemed
  seduction. Learning outside the prescribed texts was deemed heresy. The Bonfire
  of the Vanities followed — masterpieces consumed to purify the soul. Now the
  City exists in a state of performative piety, where every painting might be
  evidence, every book might be treason, and silence is the only safe speech.

geography: >-
  The City is built on seven hills, each devoted to a faction. The Cathedral sits
  at the center, overlooking the Market Square where the Bonfire burns. Narrow
  streets connect the quarters. The River marks the edge of the City — crossing
  it is death. Underground passages and hidden chapels exist for those willing to
  risk their souls.

cosmology: >-
  The supernatural exists at the City's edges and in whispered doubt. The tribunal
  claims to serve order and righteousness, but order is a cage. The supernatural
  is whatever escapes the cage — miracles the tribunal did not authorize, visions
  that contradict doctrine, healings that cannot be explained through piety alone.
  At high occult, strange things are real. At low occult, they are delusions used
  to condemn the innocent.

factions:
  - name: The Tribunal
    summary: "The governing council that determines heresy"
    description: >-
      The governing council that determines heresy. Meets in secret. Operates on
      testimony, rumor, and the accumulated suspicion of informants. Absolute power.
    disposition: neutral

  - name: The Cathedral
    summary: "Official religion"
    description: >-
      Official religion. Bishops who authorized the Synod. Believe in purification
      through fire. Have connections to the tribunal but are not its servants.
    disposition: hostile

  - name: The Underground
    summary: "Hidden network preserving art, texts, and knowledge"
    description: >-
      Hidden network preserving art, texts, and knowledge. Heretical. Dangerous.
      Offer salvation only if the player is truly committed.
    disposition: cautious

  - name: The Market
    summary: "Merchants and traders who traffic in goods, information, and favors"
    description: >-
      Merchants and traders who traffic in goods, information, and favors. Officially
      pious, actually pragmatic. Will work with anyone if the price is right.
    disposition: neutral

  - name: The Remnant
    summary: "Followers of the old ways who hide in plain sight"
    description: >-
      Followers of the old ways who hide in plain sight. Families passing down
      forbidden knowledge generation to generation. Suspicious of newcomers.
    disposition: cautious
