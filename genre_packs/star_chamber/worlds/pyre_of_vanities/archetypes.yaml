# World-specific archetype overrides and additions for Pyre of Vanities.
# These supplement the genre-level archetypes with Florence-specific flavors.

- name: The Friar's Shadow
  base_archetype: The True Believer
  description: >-
    A member of Savonarola's inner circle at San Marco. Has heard the
    private sermons, the ones where the friar's certainty wavers for a
    heartbeat before hardening again. Believes the cause is holy. Fears
    what the cause is becoming. Will not betray the friar — until the
    moment they must.
  personality_traits:
    - devout
    - conflicted
    - watchful
  inventory_hints:
    - a Dominican habit with ink stains from transcribing sermons
    - a key to the San Marco chapter house
    - a private journal they burn pages from periodically
  dialogue_quirks:
    - finishes your sentences with scripture that reframes what you said
    - pauses before answering questions about Savonarola, as if choosing words from a smaller set

- name: The Hidden Painter
  base_archetype: The Actual Heretic
  description: >-
    An artist who has publicly surrendered work to the bonfire — and
    privately hidden their masterpiece. Their heresy is beauty. They
    believe God lives in pigment and proportion, not in the destruction
    of either. Every day the hidden work survives is a victory and a risk.
  personality_traits:
    - passionate
    - secretive
    - grieving
  inventory_hints:
    - paint-stained hands that no amount of washing fully cleans
    - a key to a workshop that is officially closed
    - a sketch hidden inside a prayer book
  dialogue_quirks:
    - describes people in terms of light and composition without thinking about it
    - flinches when anyone mentions the bonfire

- name: The Boy Captain
  base_archetype: The Informant
  description: >-
    A teenager leading one of Savonarola's boy brigades — the children
    who patrol the streets confiscating vanities and reporting sinners.
    Fervent, righteous, and wielding power no child should have. Reports
    to the monastery. May report on their own parents. The scariest
    informant is one who believes they're saving your soul.
  personality_traits:
    - zealous
    - observant
    - unnervingly earnest
  inventory_hints:
    - a white robe and olive branch (the brigade uniform)
    - a list of addresses to visit, written in an adult's hand
    - confiscated dice and a playing card they kept — hidden
  dialogue_quirks:
    - speaks with rehearsed authority that cracks when challenged by an adult
    - quotes Savonarola verbatim, including phrases they don't fully understand

- name: The Medici Ghost
  base_archetype: The Opportunist
  description: >-
    A former Medici ally still in Florence — clinging to property, status,
    and the hope of the family's return. Uses the current chaos to settle
    old scores through anonymous accusations. Knows the banking records
    in the shuttered Medici offices contain leverage on half the Signoria.
  personality_traits:
    - calculating
    - patient
    - nostalgic for power
  inventory_hints:
    - a signet ring worn on a chain under the shirt, not on the finger
    - letters of credit from banks in Rome and Venice
    - a list of properties seized by the Republic that were once Medici-held
  dialogue_quirks:
    - refers to "before" and "after" without specifying the event — everyone knows
    - assesses people's worth in florins within seconds of meeting them

- name: The Vatican's Hand
  base_archetype: The Reformer From Within
  description: >-
    A papal agent operating in Florence with money, promises, and the
    quiet authority of Alexander VI. Their mission: discredit Savonarola
    by any means. The irony is that Savonarola is right about Vatican
    corruption — the agent knows it, the Pope knows it, and nobody cares.
    The friar's crime isn't being wrong. It's saying it out loud.
  personality_traits:
    - worldly
    - morally exhausted
    - effective
  inventory_hints:
    - a papal letter of authority, sealed but never shown
    - gold florins in quantities that raise questions
    - a cipher key for correspondence with Rome
  dialogue_quirks:
    - speaks about the Pope with careful, practiced neutrality
    - offers solutions that always happen to benefit Rome

- name: The Compagnacci Captain
  base_archetype: The Actual Heretic
  description: >-
    Leader of the "Bad Companions" — young aristocrats who disrupt
    Savonarola's sermons, smuggle banned goods, and dare the Piagnoni
    to stop them. Their heresy is hedonism, pleasure, the refusal to
    be ashamed of being alive. Reckless, brave, and possibly the only
    people in Florence having any fun.
  personality_traits:
    - defiant
    - charismatic
    - self-destructive
  inventory_hints:
    - dice carved from ivory, always on their person
    - a flask of wine they offer to everyone as a loyalty test
    - a mask for disrupting sermons, painted to mock Savonarola
  dialogue_quirks:
    - laughs louder than the situation warrants, on principle
    - proposes increasingly reckless plans as if they're obviously reasonable
