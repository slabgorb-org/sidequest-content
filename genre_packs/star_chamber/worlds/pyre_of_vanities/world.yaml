name: Pyre of Vanities
description: >-
  Florence, 1497. The most beautiful city in the world is burning its own art.
  Fra Girolamo Savonarola — a Dominican friar with the face of a famine and
  the voice of a prophet — has seized the Florentine Republic from the Medici
  through sheer moral force. His boy brigades patrol the streets confiscating
  mirrors, cosmetics, dice, and paintings. Botticelli has thrown his own
  canvases on the bonfire. The Pope has excommunicated Savonarola, but the
  friar preaches anyway, calling Rome a whore and the Vatican an abomination.
  The city holds its breath. In less than a year, Savonarola himself will burn
  on the same piazza where the vanities burned. But nobody knows that yet.

axis_snapshot:
  occult: 0.2
  satire: 0.3
  scope: 0.6

starting_location: piazza_della_signoria
starting_time: "Morning, Carnival season, February 1497"

premise: >-
  The Bonfire of the Vanities is days away. Savonarola's Piagnoni — the
  "weepers" — are going door to door collecting objects of sin: mirrors,
  playing cards, wigs, perfume, manuscripts of Ovid, nude paintings, musical
  instruments. The collection is voluntary. The consequences of refusal are
  not. The player arrives in Florence at the hinge point — the friar's power
  is at its peak, the Medici are in exile, the Pope is threatening interdict,
  and the Arrabbiati (the "angry ones," the anti-Savonarola faction) are
  plotting in the shadows. Every faction wants something from you. The only
  question is what you're willing to burn to survive.

mood: >-
  Renaissance Florence in winter — grey skies over terracotta roofs, the Arno
  running high and brown, breath visible in the cloisters. The city is
  gorgeous and afraid. Masterpieces hang in churches next to sermons
  condemning them. A Botticelli Madonna watches from one wall while a
  broadside demanding the destruction of pagan art is nailed to the next.
  The streets smell of incense, woodsmoke, and the particular tension of
  people who are performing piety while counting the days until the
  performance ends — or doesn't. Bells ring constantly. Some of them are
  for prayer. Some of them are warnings.

themes:
  - "Beauty and faith should not be enemies — but someone made them enemies, and now you have to choose"
  - "The revolution that liberates becomes the revolution that consumes"
  - "Children reporting on their parents is the canary in every moral panic"
  - "Sincerity is more dangerous than cynicism — a true believer with power is an earthquake"
  - "The same piazza that burns the art will burn the friar — the institution always wins"

historical_anchors:
  - event: "Bonfire of the Vanities"
    date: "February 7, 1497"
    description: >-
      Savonarola's followers collect and burn thousands of objects deemed
      sinful — mirrors, cosmetics, art, books, musical instruments — in a
      massive pyre on the Piazza della Signoria. Botticelli reportedly
      contributes his own paintings. The bonfire replaces Carnival.
  - event: "Excommunication of Savonarola"
    date: "June 1497"
    description: >-
      Pope Alexander VI excommunicates Savonarola. The friar ignores it
      and continues preaching, calling the Pope illegitimate. This is
      the beginning of the end.
  - event: "Trial by Fire challenge"
    date: "April 1498"
    description: >-
      A Franciscan friar challenges Savonarola to an ordeal by fire —
      walk through flames to prove God's favor. The event is arranged,
      crowds gather, and then it rains. The anticlimax destroys
      Savonarola's credibility overnight.
  - event: "Execution of Savonarola"
    date: "May 23, 1498"
    description: >-
      Savonarola is arrested, tortured, hanged, and burned on the
      Piazza della Signoria — the same spot where the vanities burned.
      His ashes are thrown into the Arno to prevent relic collection.

key_factions:
  - id: piagnoni
    name: The Piagnoni (Weepers)
    description: >-
      Savonarola's followers. True believers, boy brigades, reformed
      prostitutes, repentant merchants who burned their own ledgers.
      They believe Florence is a New Jerusalem. Their sincerity is
      genuine and terrifying.
    maps_to_reputation: tribunal

  - id: arrabbiati
    name: The Arrabbiati (Angry Ones)
    description: >-
      The anti-Savonarola faction. Former Medici allies, wealthy merchants,
      people who liked their mirrors and their Ovid. They plot the friar's
      downfall but lack a leader and lack nerve.
    maps_to_reputation: establishment

  - id: compagnacci
    name: The Compagnacci (Bad Companions)
    description: >-
      Young aristocrats who actively disrupt Savonarola's sermons, start
      fights with the Piagnoni, and smuggle banned goods. Reckless, brave,
      and not entirely wrong. The underground's militant wing.
    maps_to_reputation: underground

  - id: vatican
    name: The Vatican
    description: >-
      Pope Alexander VI (a Borgia) wants Savonarola silenced — not because
      the friar is wrong about Vatican corruption, but because saying it
      aloud is intolerable. Papal agents operate in Florence with money,
      threats, and promises.
    maps_to_reputation: reformers

  - id: signoria
    name: The Signoria (City Government)
    description: >-
      Florence's elected council. Currently dominated by Piagnoni
      sympathizers, but the wind is shifting. They enforce Savonarola's
      moral laws while calculating how long his popularity will last.
    maps_to_reputation: common_folk
