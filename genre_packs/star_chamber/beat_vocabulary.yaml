obstacles:
  - name: "City Watch Patrol"
    description: "A patrol of armed guards blocks the street ahead, checking papers and questioning pedestrians."
    stat_check: "CUNNING"
    failure_penalty: "Caught and detained; suspicion increases by 2"
    tags:
      - urban
      - guards
      - authority

  - name: "Marketplace Crowd"
    description: "A busy market with merchants, customers, and informants watching for suspicious activity."
    stat_check: "CHARM"
    failure_penalty: "Noticed by an informant; marked for suspicion"
    tags:
      - social
      - crowded
      - danger

  - name: "Barricaded Street"
    description: "A street blocked by rubble, carts, or construction — slowing passage and making you visible."
    stat_check: "PERCEPTION"
    failure_penalty: "Forced into a slower route; guards overtake"
    tags:
      - environment
      - delay
      - navigation

  - name: "Informant Conversation"
    description: "An NPC you know is having a conversation with a suspicious figure — possibly reporting to the tribunal."
    stat_check: "PERCEPTION"
    failure_penalty: "Identified in their testimony"
    tags:
      - social
      - danger
      - information

  - name: "Church Bell"
    description: "The cathedral bells ring — summoning the faithful to prayer and drawing attention to the streets."
    stat_check: "CONVICTION"
    failure_penalty: "Crowds gather; harder to move unnoticed"
    tags:
      - urban
      - event
      - religious

  - name: "Burning Pyre"
    description: "A bonfire in the square — heretics or forbidden materials being destroyed. Authorities are present."
    stat_check: "AUTHORITY"
    failure_penalty: "Caught in the crowd; possible recognition"
    tags:
      - authority
      - danger
      - public

  - name: "Dark Alley"
    description: "A shortcut through a narrow, lightless passage — quick but risky."
    stat_check: "CUNNING"
    failure_penalty: "Ambushed or robbed; attracts unwanted attention"
    tags:
      - stealth
      - danger
      - shortcut

  - name: "Noble Procession"
    description: "A procession of dignitaries and soldiers moving through the streets — clearing the way with authority."
    stat_check: "CHARM"
    failure_penalty: "Drawn into the crowd; recognized"
    tags:
      - social
      - authority
      - crowded
