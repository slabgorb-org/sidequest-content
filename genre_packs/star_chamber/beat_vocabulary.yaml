# Beat vocabulary for the Star Chamber narrator.
# These are narrative micro-patterns the trope engine can inject.

interrogation_beats:
  - id: uncomfortable_silence
    description: "A pause that stretches. The interrogator says nothing. The silence does the work."
    tension_delta: 0.05
  - id: specific_detail
    description: "The interrogator mentions a detail — a date, a name, a location — that the player hasn't volunteered. Someone talked."
    tension_delta: 0.10
  - id: false_sympathy
    description: "The interrogator softens. Offers water. Mentions understanding. This is a technique, not kindness."
    tension_delta: 0.03
  - id: document_produced
    description: "A paper is placed on the table. The interrogator watches the player's face, not the paper."
    tension_delta: 0.08
  - id: witness_brought_in
    description: "A door opens. Someone the player knows is led in. They don't make eye contact."
    tension_delta: 0.12

tribunal_beats:
  - id: charges_read
    description: "The formal charges, in legal Latin or the local equivalent. The language makes atrocity sound procedural."
    tension_delta: 0.08
  - id: witness_contradiction
    description: "Two witnesses say different things. The judges notice. The player can exploit this — or it can be exploited against them."
    tension_delta: 0.06
  - id: judges_confer
    description: "The judges whisper to each other. The player cannot hear what they say. The wait is the punishment."
    tension_delta: 0.07
  - id: crowd_reaction
    description: "A murmur from the gallery — sympathy, contempt, or the sharp intake of breath that means something just changed."
    tension_delta: 0.05
  - id: final_question
    description: "The chief judge asks one question. It is simple. The answer is everything."
    tension_delta: 0.15

social_beats:
  - id: cold_shoulder
    description: "Someone who was friendly last week looks through you. No explanation. No confrontation. Just absence."
    tension_delta: 0.03
  - id: whisper_stops
    description: "You enter a room. A conversation ends. Smiles appear. Too late and too wide."
    tension_delta: 0.04
  - id: loyalty_test
    description: "An NPC asks your opinion on the tribunal. There is no safe answer. The question itself is the test."
    tension_delta: 0.06
  - id: anonymous_warning
    description: "A note under the door. No name. Two words: 'They know.'"
    tension_delta: 0.08
  - id: public_piety
    description: "You must perform belief in public. Kneel, pray, donate, or denounce — the audience is watching."
    tension_delta: 0.05
