- id: class_selection
  title: "Choose Your Class"
  narration: >-
    Your standing before the tribunal depends on what you were before you were accused.
    Scholar, Clergy, Magistrate, Merchant, Reformer, or Herbalist — each carries its own
    dangers and advantages. The tribunal has already decided who you are. Now you must
    decide whether to fight that verdict or accept it and plan escape.
  choices:
    - label: Scholar
      description: "A student of dangerous texts. Your crime is curiosity."
      mechanical_effects:
        stat_mods:
          Rhetoric: 2
        starting_inventory:
          - "A book that shouldn't exist in this city"
    - label: Clergy
      description: "A person of the cloth, caught between institution and conscience."
      mechanical_effects:
        stat_mods:
          Authority: 2
        starting_inventory:
          - "A breviary with notes in the margins"
    - label: Magistrate
      description: "An officer of the court. You know how the machine works — from inside."
      mechanical_effects:
        stat_mods:
          Authority: 2
        starting_inventory:
          - "A seal that opens government archives"
    - label: Merchant
      description: "Money is power, and power makes you a target."
      mechanical_effects:
        stat_mods:
          Charm: 2
        starting_inventory:
          - "A ledger with dangerous entries"
    - label: Reformer
      description: "You believe the institution can be fixed. This makes you dangerous."
      mechanical_effects:
        stat_mods:
          Conviction: 2
        starting_inventory:
          - "A pamphlet you wrote under a false name"
    - label: Herbalist
      description: "Healer, midwife, apothecary. The line between medicine and witchcraft is blurred."
      mechanical_effects:
        stat_mods:
          Perception: 2
        starting_inventory:
          - "A bundle of herbs with dual uses"

- id: race_selection
  title: "Choose Your Origin"
  narration: >-
    Where you stand in the social order affects how the tribunal sees you.
    Are you Gentry with standing to lose? A Townsperson, visible yet unremarkable?
    Minor Clergy with inside knowledge? A Servant, invisible until named?
    Or a Foreign outsider, automatically suspect?
  choices:
    - label: Gentry
      description: "Property, name, and standing. All can be seized."
      mechanical_effects:
        stat_mods:
          Authority: 1
        starting_inventory:
          - "Proof of land ownership"
    - label: Townsperson
      description: "The backbone of the community. Anonymous until named."
      mechanical_effects:
        stat_mods: {}
        starting_inventory: []
    - label: Minor Clergy
      description: "Low rank in the church. Close enough to see the machinery."
      mechanical_effects:
        stat_mods:
          Conviction: 1
        starting_inventory:
          - "A prayer book with margin notes"
    - label: Servant
      description: "Invisible. Which means you see everything."
      mechanical_effects:
        stat_mods:
          Cunning: 1
        starting_inventory: []
    - label: Foreign
      description: "An outsider. Suspicion is default."
      mechanical_effects:
        stat_mods:
          Perception: 1
        starting_inventory: []

- id: stat_allocation
  title: "Allocate Your Convictions"
  narration: >-
    You have 27 points to distribute among your core stats: Conviction, Rhetoric,
    Cunning, Perception, Authority, and Charm. No stat can exceed 18 or fall below 3.
    These numbers won't save you — but they determine how you fail.
  choices: []
  allows_freeform: true

- id: confirmation
  title: "Accept This Identity"
  narration: >-
    You stand in the chamber. The tribunal waits. The evidence against you is mounting.
    Confess? Fight? Appeal? Flee? That choice comes when the tribunal convenes.
    For now, you are who you are.
  choices:
    - label: "Begin the trial"
      description: "Face what comes"
      mechanical_effects:
        stat_mods: {}
        starting_inventory: []
