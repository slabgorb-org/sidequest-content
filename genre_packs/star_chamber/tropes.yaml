- id: the_accusation
  name: The Accusation
  description: >-
    Someone has been named. The charge may be heresy, witchcraft, sedition,
    or blasphemy — the word matters less than the fact that it's been spoken
    aloud in front of people who write things down. From this moment, the
    accused's life is divided into before and after.
  category: political
  triggers:
    - a neighbor reports suspicious behavior
    - a sermon singles someone out without naming them
    - anonymous testimony reaches the tribunal
  narrative_hints:
    - a knock at the door that comes too early in the morning
    - a name read from a list in the town square
    - a friend who suddenly cannot meet your eyes
  tension_level: 0.4
  resolution_hints:
    - find who made the accusation and why
    - gather counter-testimony from allies
    - flee before the summons arrives
    - prepare a defense for the tribunal
  tags: [tribunal, testimony, suspicion]
  escalation:
    - at: 0.2
      event: >-
        Rumors. Nothing official — but the wrong kind of silence follows
        you through the market. Someone you've known for years asks a
        question they already know the answer to.
      npcs_involved: [The Informant, The Reluctant Witness]
      stakes: Your name is in someone's mouth. You don't know whose.
    - at: 0.4
      event: >-
        The accusation is recorded. A clerk writes your name in a ledger.
        The tribunal has not acted yet, but the machinery has engaged.
        Your standing drops. People are polite in a new, careful way.
      npcs_involved: [The Bureaucrat]
      stakes: The institution has noticed you. Withdrawal is still possible.
    - at: 0.6
      event: >-
        Witnesses are called. People you trusted are asked questions
        about your habits, your words, your associations. Some refuse
        to answer. Some don't.
      npcs_involved: [The Reluctant Witness, The Opportunist]
      stakes: The case is being built. Your past is being rewritten as evidence.
    - at: 0.8
      event: >-
        A summons. Your presence is required before the tribunal.
        The date is set. The charges are read — formal, specific, and
        not entirely wrong, which is the worst part.
      npcs_involved: [The Bureaucrat, The True Believer]
      stakes: The trial is coming. Time to prepare a defense or disappear.
    - at: 1.0
      event: >-
        The tribunal convenes. You are seated. The judges are arranged
        above you. The first witness is called. Everything you have
        done in this world has led to this room.
      npcs_involved: [All tribunal NPCs]
      stakes: Condemnation or acquittal. There is no middle ground.
  passive_progression:
    rate_per_turn: 0.005
    rate_per_day: 0.015
    accelerators:
      - suspicious actions observed
      - informant reports
      - association with known dissidents
      - possession of banned materials
    decelerators:
      - public displays of orthodoxy
      - avoiding known dissidents
      - building tribunal faction reputation
    accelerator_bonus: 0.05
    decelerator_penalty: 0.03

- id: the_informant_among_us
  name: The Informant Among Us
  description: >-
    Someone in the player's circle reports to the tribunal. They may do
    it from conviction, coercion, or coin — but the function is the same.
    They watch, they listen, and what they learn becomes testimony. The
    player may never discover who it is.
  category: mystery
  triggers:
    - the tribunal seems to know something only a friend would know
    - an NPC asks unusually specific questions
    - testimony references a private conversation
  narrative_hints:
    - a detail from a private meeting appears in the charges
    - an NPC who was present at a sensitive moment suddenly avoids you
    - a pattern — every time you confide in someone, the tribunal acts
  tension_level: 0.4
  resolution_hints:
    - feed different information to different NPCs and see which reaches the tribunal
    - observe who asks probing questions versus who avoids the topic
    - confront a suspect and watch their reaction
    - accept that you may never know and act accordingly
  tags: [espionage, trust, paranoia]
  escalation:
    - at: 0.2
      event: >-
        A coincidence. The tribunal mentions something you only discussed
        with one person. Could be nothing. Could be everything.
      npcs_involved: [The Informant]
      stakes: Trust is in question. The circle may be compromised.
    - at: 0.4
      event: >-
        A second coincidence is not a coincidence. The tribunal's questions
        track your movements too precisely. Someone is talking.
      npcs_involved: [The Informant]
      stakes: The leak is confirmed. Identity unknown.
    - at: 0.6
      event: >-
        You test the circle — different stories to different people.
        One of them reaches the tribunal. The list of suspects narrows.
      npcs_involved: [The Informant, The Reluctant Witness]
      stakes: You know the shape of the betrayal. Not yet the face.
    - at: 0.8
      event: >-
        Confrontation — or the decision not to confront. The informant
        may be someone you need, someone you care about, or someone
        who will deny everything convincingly.
      npcs_involved: [The Informant]
      stakes: Knowledge vs. action. Knowing changes everything; acting costs more.
    - at: 1.0
      event: >-
        The informant is revealed — by their own testimony at the tribunal,
        by a slip, or by your investigation. The betrayal is personal
        regardless of their reasons.
      npcs_involved: [The Informant]
      stakes: Trust is broken. What you do about it defines your character.
  passive_progression:
    rate_per_turn: 0.003
    rate_per_day: 0.01
    accelerators:
      - sharing sensitive information with NPCs
      - taking suspicious actions in the presence of others
    decelerators:
      - acting alone
      - speaking only in trusted locations
    accelerator_bonus: 0.04
    decelerator_penalty: 0.02

- id: the_burning
  name: The Burning
  description: >-
    Books, art, relics, bodies — the tribunal destroys what it fears.
    A bonfire in the public square. The community is invited to watch.
    Attendance is noted. Absence is suspicious.
  category: spectacle
  triggers:
    - the tribunal announces a public purification
    - confiscated materials are gathered in the square
    - an execution date is set
  narrative_hints:
    - smoke visible from across the city
    - a pile of confiscated books growing outside the courthouse
    - children collecting kindling with an enthusiasm that makes adults quiet
  tension_level: 0.6
  resolution_hints:
    - attend and perform expected grief or approval
    - rescue something from the pyre before it's lit
    - use the spectacle as cover for another action
    - refuse to attend and accept the consequences
  tags: [spectacle, conformity, defiance]
  escalation:
    - at: 0.2
      event: >-
        The announcement. The tribunal has ordered a public act of
        purification. The date is set. The square is being prepared.
      npcs_involved: [The True Believer, The Bureaucrat]
      stakes: A public test of loyalty approaches.
    - at: 0.5
      event: >-
        Confiscation begins. Homes are searched. Certain items — books,
        paintings, instruments, herbs — are gathered. Resistance is
        noted. Compliance is expected.
      npcs_involved: [The Bureaucrat, The Informant]
      stakes: Private possessions become public evidence.
    - at: 0.8
      event: >-
        The pyre is built. The crowd gathers. The tribunal presides.
        Your presence — and your expression — are being watched.
      npcs_involved: [The True Believer, The Informant]
      stakes: Conformity or conscience. The crowd sees both.
    - at: 1.0
      event: >-
        The fire. What burns cannot be unburned. What's saved is hidden
        at great risk. What the player chooses to do in this moment —
        watch, weep, hide something in their coat, or speak — defines
        the rest of the story.
      npcs_involved: [All present NPCs]
      stakes: Irrevocable. Art, knowledge, or a person is gone.
  passive_progression:
    rate_per_turn: 0.008
    rate_per_day: 0.02
    accelerators:
      - tribunal asserting authority
      - new accusations
      - confiscation of materials
    decelerators:
      - public compliance
      - tribunal distracted by other matters
    accelerator_bonus: 0.05
    decelerator_penalty: 0.02

- id: the_recantation
  name: The Recantation
  description: >-
    The accused is offered a choice: deny everything you believe and
    live, or hold to your conviction and die. The institution doesn't
    want martyrs — it wants submission. A public recantation is worth
    more than an execution because it proves the system works.
  category: moral
  triggers:
    - the tribunal offers clemency in exchange for a statement
    - an ally urges the accused to "just say the words"
    - the player faces the same choice
  narrative_hints:
    - a prepared statement placed in front of the accused with a quill
    - a priest offering "guidance" on what to say
    - the crowd watching to see if conviction breaks
  tension_level: 0.7
  resolution_hints:
    - recant and live with the knowledge
    - refuse and face the consequence
    - recant publicly and continue in secret
    - find a third option — words that satisfy the tribunal without betraying belief
  tags: [moral, conviction, survival]
  escalation:
    - at: 0.3
      event: >-
        The offer is made privately. A sympathetic judge, a worried
        friend, a pragmatic lawyer — someone suggests that a simple
        statement would make this all go away.
      npcs_involved: [The Reformer From Within]
      stakes: Survival is possible. The price is your integrity.
    - at: 0.6
      event: >-
        The offer is formalized. A document is prepared. The words are
        chosen for you. All you have to do is sign. The alternative
        is made clear without being spoken aloud.
      npcs_involved: [The Bureaucrat, The True Believer]
      stakes: The document is a lie. Signing it is survival. Not signing it is everything else.
    - at: 1.0
      event: >-
        The moment. Public or private, the accused must speak. The
        words come or they don't. The crowd, the judges, the player —
        everyone holds their breath.
      npcs_involved: [All tribunal NPCs]
      stakes: Identity. What you say in this room is who you are.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.03
    accelerators:
      - tribunal pressure increasing
      - evidence mounting
      - allies urging pragmatism
    decelerators:
      - defiant actions
      - allies reinforcing conviction
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03
