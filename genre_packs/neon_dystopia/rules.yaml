stat_generation: point_buy
point_buy_budget: 27
magic_level: none

ability_score_names:
  - Body
  - Reflex
  - Tech
  - Net
  - Cool
  - Edge

allowed_classes:
  - Netrunner
  - Solo
  - Fixer
  - Tech
  - Nomad
  - Face
  - Ghost

allowed_races:
  - Corporate
  - Street
  - Nomad Clan
  - Synthetic
  - Augmented
  - SINless

hp_formula: "class_base + (body_mod * level)"

stat_display_fields:
  - hp
  - max_hp
  - armor

class_hp_bases:
  Netrunner: 6
  Solo: 12
  Fixer: 8
  Tech: 8
  Nomad: 10
  Face: 6
  Ghost: 8

default_class: Solo
default_race: Street
race_label: Background
class_label: Role
default_hp: 12
default_ac: 10
default_location: "A coffin hotel in the lower levels of the megacity"
default_time_of_day: night

custom_rules:
  lethality: moderate
  injury_system: temporary
  rest_variant: standard
  encumbrance: none
  humanity_tracker: >-
    Every piece of cyberware installed costs Humanity. Start at 100.
    Minor implants cost 5-10. Major chrome costs 15-25. Full limb
    replacement costs 30. At 50 Humanity, NPCs notice something off
    about you — you move wrong, your eyes don't track naturally. At
    25, you're more machine than meat and social interactions suffer
    mechanical penalties. At 0, cyberpsychosis — the character becomes
    an NPC. Humanity can be restored slowly through genuine human
    connection, but the chrome doesn't come out easy.
  street_cred: >-
    Reputation on the street. Starts at 0, grows through completed
    jobs, displayed competence, and word of mouth. High Street Cred
    opens doors — fixers offer better jobs, gangs respect you, corps
    fear you. Negative Street Cred means nobody will work with you.
    Different factions track your rep independently.
  net_combat: >-
    Cyberspace encounters are narrative, not technical. When a
    Netrunner jacks in, describe the virtual architecture as
    physical space — ice walls, data streams, guardian programs
    as creatures. Net combat uses Net stat instead of Body/Reflex.
    Never ask players to solve technical puzzles — the character
    is the expert, not the player.

resources:
  - name: humanity
    label: Humanity
    min: 0.0
    max: 100.0
    starting: 100.0
    voluntary: false
    decay_per_turn: 0.0
    thresholds:
      - at: 50.0
        event_id: humanity_cold
        narrator_hint: "Your chrome is showing. NPCs notice the emotional detachment."
      - at: 25.0
        event_id: humanity_critical
        narrator_hint: "More machine than human. People recoil instinctively."
      - at: 0.0
        event_id: humanity_lost
        narrator_hint: "No trace of humanity remains. You are a machine wearing skin."

encounter_base_tension:
  random: 0.10
  ambush: 0.30
  boss: 0.40
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Corporate Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Make Your Case"
        metric_delta: 2
        stat_check: Cool
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: Edge
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: Cool
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: Cool
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player jacks out of the conversation. No deal."
    mood: tension
  - type: net_combat
    label: "Net Combat"
    category: combat
    metric:
      name: trace
      direction: ascending
      starting: 0
      threshold_high: 10
    beats:
      - id: breach
        label: "Breach Node"
        metric_delta: 2
        stat_check: Net
        effect: "crack open the next layer of ICE"
        narrator_hint: "Describe the virtual architecture crumbling as the runner punches through."
      - id: bypass_ice
        label: "Bypass ICE"
        metric_delta: 3
        stat_check: Net
        risk: "trace spike — trace jumps by 2 on failure"
        narrator_hint: "Elegant or brute-force, the runner slips past intrusion countermeasures."
      - id: spoof
        label: "Spoof Identity"
        metric_delta: 1
        stat_check: Tech
        effect: "reset trace by 1"
        narrator_hint: "Mask your signal. Buy time before the hounds find you."
      - id: jack_out
        label: "Jack Out"
        metric_delta: 0
        stat_check: Reflex
        resolution: true
        consequence: "escape the net — lose any data not yet extracted"
        narrator_hint: "Yank the cable. Reality slams back. Did you get what you came for?"
    secondary_stats:
      - name: programs
        source_stat: Net
        spendable: false
      - name: firewall
        source_stat: Tech
        spendable: false
    mood: tension

  - type: combat
    label: Street Combat
    category: combat
    # Momentum-based. Real HP lives on character state. The netrun
    # beat is the genre-distinct move: hack and shoot at the same time.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: shoot
        label: Shoot
        metric_delta: 2
        stat_check: Body
        effect: "Target takes damage this round"
        narrator_hint: Muzzle flash in neon rain. Describe the chrome and the concrete.
      - id: take_cover
        label: Take Cover
        metric_delta: 1
        stat_check: Reflex
        effect: "Reduce incoming damage behind urban debris"
        narrator_hint: Dumpster, concrete pillar, burned-out car — the city is cover.
      - id: netrun
        label: Netrun Strike
        metric_delta: 4
        stat_check: Net
        risk: "ICE counterattack — lose 2 momentum and take neural damage on failure"
        effect: "Cripple target's implants or nearby environment"
        narrator_hint: Jack in mid-firefight. Fry their implants from cyberspace.
      - id: disengage
        label: Disengage
        metric_delta: 0
        stat_check: Cool
        resolution: true
        consequence: "Combat ends — vanish into the crowd or the net"
        narrator_hint: Drop the weapon, pull your hood up, slip between bodies.
    mood: combat
  - type: chase
    label: Urban Pursuit
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: sprint
        label: Sprint
        metric_delta: 2
        stat_check: Cool
        narrator_hint: Weave through market stalls, dodge between crawling traffic.
      - id: hack_path
        label: Hack Environment
        metric_delta: 3
        stat_check: Tech
        risk: "System lockout — lose 2 separation"
        narrator_hint: Slam a door shut remotely, reroute an elevator, kill the lights.
      - id: crowd_blend
        label: Crowd Blend
        metric_delta: 1
        stat_check: Tech
        effect: "Disappear into the press of bodies"
      - id: go_dark
        label: Go Dark
        metric_delta: 0
        stat_check: Cool
        resolution: true
        consequence: "Chase ends — off the grid"
    mood: tension

