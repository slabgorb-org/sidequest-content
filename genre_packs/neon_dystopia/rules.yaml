stat_generation: point_buy
point_buy_budget: 27
magic_level: none

ability_score_names:
  - Brawn
  - Reflex
  - Body
  - Tech
  - Instinct
  - Cool

ruleset: cwn
cwn:
  attribute_map:
    STRENGTH: Brawn
    DEXTERITY: Reflex
    CONSTITUTION: Body
    INTELLIGENCE: Tech
    WISDOM: Instinct
    CHARISMA: Cool
  system_strain:
    max_source: CONSTITUTION
    rest_recovery_per_night: 1
    first_aid_cost: 1
  trauma:
    default_trauma_target: 6
    mortal_injury_rounds: 6
    major_injury_save: physical
  hacking:
    default_tier: office
    security_tiers:
      home: 7
      office: 9
      facility: 11
      black_site: 12

allowed_classes:
  - Netrunner
  - Solo
  - Fixer
  - Tech
  - Nomad
  - Face
  - Ghost

allowed_races:
  - Corporate
  - Street
  - Nomad Clan
  - Synthetic
  - Augmented
  - SINless


stat_display_fields:
  - hp
  - max_hp
  - armor


default_class: Solo
default_race: Street
race_label: Background
class_label: Role
default_location: "A coffin hotel in the lower levels of the megacity"
default_time_of_day: night

custom_rules:
  lethality: moderate
  injury_system: temporary
  rest_variant: standard
  encumbrance: none
  system_strain: >-
    Cyberware has a bodily cost: System Strain (capped by the Body attribute,
    starts at 0). Installing chrome adds PERMANENT strain; activating cyber,
    using combat drugs, or applying first aid adds TEMPORARY strain. Call the
    adjust_system_strain tool — kind "permanent" on install, "temporary" on
    activation/drugs, "first_aid" when patching wounds, "rest" for a night's
    recovery. An action that would push strain over max simply fails (no
    benefit, no install). A night's rest removes 1 strain down to the permanent
    floor. Never narrate strain you did not record with the tool.
  combat_lethality: >-
    CWN combat is fast and deadly. Attacks roll to-hit vs the target's Armor
    Class; on a hit the weapon's damage ablates HP after armor soak. Lethal
    weapons also roll Trauma — a Traumatic Hit multiplies damage (a shotgun or
    monoblade can gib a mook). At 0 HP a character takes a Mortal Injury: they
    die within 6 rounds unless someone stabilizes them (a Heal check vs 8 +
    rounds elapsed) — call the stabilize_mortal_injury tool. If a Traumatic Hit
    landed in the fight, a downed character also risks a Major Injury (a Physical
    save; on failure, a permanent table result — lost eye, severed limb, worse).
    Never narrate a kill, a Trauma multiplier, or an injury you did not let the
    engine roll. The dice and the tools are the truth; your prose dramatizes them.
  street_cred: >-
    Reputation on the street. Starts at 0, grows through completed
    jobs, displayed competence, and word of mouth. High Street Cred
    opens doors — fixers offer better jobs, gangs respect you, corps
    fear you. Negative Street Cred means nobody will work with you.
    Different factions track your rep independently.
  net_run: >-
    Cyberspace is a CWN net run: a dial confrontation, not a technical puzzle.
    When a runner jacks in, name a security tier (home/office/facility/
    black_site) — the engine sets the Program-check DC (7/9/11/12). Describe
    the virtual architecture as physical space — ICE walls, data streams,
    guardian programs as creatures. Each verb (Run Program, Spoof, Move Nodes,
    Jack Out) is a 2d6 + Program + Tech check vs that DC; the network fights
    back by raising the alert. Never narrate a breach the dice did not earn —
    the character is the expert, not the player.

encounter_base_tension:
  random: 0.10
  ambush: 0.30
  boss: 0.40
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
# Migrated 2026-05-23 to dual-track-momentum schema (player_metric +
# opponent_metric, beat kind/base/deltas) per
# docs/superpowers/specs/completed/2026-04-25-dual-track-momentum-design.md.
confrontations:
  - type: negotiation
    label: "Corporate Negotiation"
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Make Your Case"
        kind: strike
        base: 2
        stat_check: Cool
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Cool
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      # concede_point: strategic retreat that reveals opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: Cool
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: Cool
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player jacks out of the conversation. No deal."
    mood: tension
  - type: net_run
    label: "Net Run"
    category: hacking
    # CWN cyberspace as a dial confrontation. player_metric = objective
    # progress (data extracted); opponent_metric = network alert/trace.
    # Alert reaching threshold = CWN "Alert the Network x2" — the run is lost.
    # Each beat resolves as 2d6 + Program(combat_skill) + INT(Tech) vs the
    # security-tier DC; the cwn ruleset module fires cwn.hacking.security_check.
    player_metric:
      name: data
      starting: 0
      threshold: 10
    opponent_metric:
      name: alert
      starting: 0
      threshold: 10
    beats:
      - id: run_program
        label: "Run Program"
        kind: strike
        base: 2
        combat_skill: 1
        stat_check: Tech
        deltas:
          crit_fail:
            own: -1
            opponent: 2
        effect: "execute an offensive program — advance toward the objective"
        risk: "a botched call spikes the network alert"
        narrator_hint: "Describe the program tearing through the data architecture; failure trips an alarm."
      - id: spoof
        label: "Spoof / Unlock Barrier"
        kind: brace
        base: 1
        combat_skill: 1
        stat_check: Tech
        effect: "mask your signal or open a barrier — drop the network alert"
        narrator_hint: "Throw the trace off the scent. Buy room to breathe before the ICE closes in."
      - id: move_nodes
        label: "Move Nodes"
        kind: push
        base: 2
        combat_skill: 1
        stat_check: Tech
        effect: "push deeper toward extraction"
        narrator_hint: "The runner traverses the lattice, closer to the prize."
      - id: jack_out
        label: "Jack Out"
        kind: push
        stat_check: Tech
        consequence: "exit the run — keep extracted data, end the confrontation"
        narrator_hint: "Yank the cable. Reality slams back. Did you get what you came for?"
    mood: tension

  - type: combat
    label: Street Combat
    intent_verbs: [shoot, fire, attack, fight, stab, slash, gun, kill]
    on_intent_mismatch: reprompt
    category: combat
    # CWN personal combat: attack-vs-AC + hp_depletion on the ablative HpPool.
    # Trauma/Shock/Mortal/Major Injury layer on via the cwn ruleset module.
    resolution_mode: beat_selection
    win_condition: hp_depletion
    opponent_default_stats:
      Brawn: 10
      Reflex: 10
      Body: 10
      Instinct: 10
      # Reserved combat-seed keys (not ability scores) — seed the runtime
      # CreatureCore for hp_depletion. hp = HP pool; armor_class = ascending AC
      # the attack rolls against; dexterity = SWN 1d8+DEX initiative.
      # Street mook: AC 13 (armored jacket), HP 8, drops in ~2-3 solid hits.
      hp: 8
      armor_class: 13
      dexterity: 11
    beats:
      - id: shoot
        label: Shoot
        kind: strike
        base: 2
        stat_check: Reflex
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Target takes weapon damage"
        narrator_hint: Muzzle flash in neon rain. Chrome and concrete.
      - id: melee
        label: Blade Work
        kind: strike
        base: 2
        stat_check: Brawn
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "Close-quarters strike; a miss with a Shock weapon still chips"
        narrator_hint: Monowire and mantis blades. Up close it's wet work.
      - id: take_cover
        label: Take Cover
        kind: brace
        base: 1
        stat_check: Reflex
        effect: "Reduce incoming damage behind urban debris"
        narrator_hint: Dumpster, concrete pillar, burned-out car — the city is cover.
      - id: disengage
        label: Disengage
        kind: push
        stat_check: Cool
        consequence: "Combat ends — vanish into the crowd or the net"
        narrator_hint: Drop the weapon, pull your hood up, slip between bodies.
    mood: combat
  - type: chase
    label: Urban Pursuit
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 10
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 10
    beats:
      - id: sprint
        label: Sprint
        kind: push
        base: 2
        stat_check: Cool
        narrator_hint: Weave through market stalls, dodge between crawling traffic.
      - id: hack_path
        label: Hack Environment
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Tech
        risk: "System lockout — lose 2 separation"
        narrator_hint: Slam a door shut remotely, reroute an elevator, kill the lights.
      # crowd_blend: vanish into the press of bodies — angle, sets concealment tag
      - id: crowd_blend
        label: Crowd Blend
        kind: angle
        target_tag: "Lost in the Crowd"
        stat_check: Tech
        effect: "Disappear into the press of bodies"
      - id: go_dark
        label: Go Dark
        kind: push
        stat_check: Cool
        consequence: "Chase ends — off the grid"
    mood: tension

