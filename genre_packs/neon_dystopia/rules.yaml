stat_generation: point_buy
point_buy_budget: 27
magic_level: none

ability_score_names:
  - Brawn
  - Reflex
  - Body
  - Tech
  - Instinct
  - Cool

ruleset: cwn
cwn:
  attribute_map:
    STRENGTH: Brawn
    DEXTERITY: Reflex
    CONSTITUTION: Body
    INTELLIGENCE: Tech
    WISDOM: Instinct
    CHARISMA: Cool
  system_strain:
    max_source: CONSTITUTION
    rest_recovery_per_night: 1
    first_aid_cost: 1

allowed_classes:
  - Netrunner
  - Solo
  - Fixer
  - Tech
  - Nomad
  - Face
  - Ghost

allowed_races:
  - Corporate
  - Street
  - Nomad Clan
  - Synthetic
  - Augmented
  - SINless


stat_display_fields:
  - hp
  - max_hp
  - armor


default_class: Solo
default_race: Street
race_label: Background
class_label: Role
default_location: "A coffin hotel in the lower levels of the megacity"
default_time_of_day: night

custom_rules:
  lethality: moderate
  injury_system: temporary
  rest_variant: standard
  encumbrance: none
  system_strain: >-
    Cyberware has a bodily cost: System Strain (capped by the Body attribute,
    starts at 0). Installing chrome adds PERMANENT strain; activating cyber,
    using combat drugs, or applying first aid adds TEMPORARY strain. Call the
    adjust_system_strain tool — kind "permanent" on install, "temporary" on
    activation/drugs, "first_aid" when patching wounds, "rest" for a night's
    recovery. An action that would push strain over max simply fails (no
    benefit, no install). A night's rest removes 1 strain down to the permanent
    floor. Never narrate strain you did not record with the tool.
  street_cred: >-
    Reputation on the street. Starts at 0, grows through completed
    jobs, displayed competence, and word of mouth. High Street Cred
    opens doors — fixers offer better jobs, gangs respect you, corps
    fear you. Negative Street Cred means nobody will work with you.
    Different factions track your rep independently.
  net_combat: >-
    Cyberspace encounters are narrative, not technical. When a
    Netrunner jacks in, describe the virtual architecture as
    physical space — ice walls, data streams, guardian programs
    as creatures. Net combat uses Net stat instead of Body/Reflex.
    Never ask players to solve technical puzzles — the character
    is the expert, not the player.

encounter_base_tension:
  random: 0.10
  ambush: 0.30
  boss: 0.40
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
# Migrated 2026-05-23 to dual-track-momentum schema (player_metric +
# opponent_metric, beat kind/base/deltas) per
# docs/superpowers/specs/completed/2026-04-25-dual-track-momentum-design.md.
confrontations:
  - type: negotiation
    label: "Corporate Negotiation"
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Make Your Case"
        kind: strike
        base: 2
        stat_check: Cool
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Cool
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      # concede_point: strategic retreat that reveals opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: Cool
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: Cool
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player jacks out of the conversation. No deal."
    mood: tension
  - type: net_combat
    label: "Net Combat"
    category: combat
    # Player extracts; the system traces. First side to threshold wins.
    player_metric:
      name: extraction
      starting: 0
      threshold: 10
    opponent_metric:
      name: trace
      starting: 0
      threshold: 10
    beats:
      - id: breach
        label: "Breach Node"
        kind: strike
        base: 2
        stat_check: Tech
        effect: "crack open the next layer of ICE"
        narrator_hint: "Describe the virtual architecture crumbling as the runner punches through."
      - id: bypass_ice
        label: "Bypass ICE"
        kind: strike
        base: 3
        deltas:
          crit_fail:
            own: -2
            opponent: 2
        stat_check: Tech
        risk: "trace spike — trace jumps by 2 on failure"
        narrator_hint: "Elegant or brute-force, the runner slips past intrusion countermeasures."
      # spoof: throw the trace off — brace reduces opponent dial
      - id: spoof
        label: "Spoof Identity"
        kind: brace
        base: 1
        stat_check: Tech
        effect: "reset trace by 1"
        narrator_hint: "Mask your signal. Buy time before the hounds find you."
      - id: jack_out
        label: "Jack Out"
        kind: push
        stat_check: Reflex
        consequence: "escape the net — lose any data not yet extracted"
        narrator_hint: "Yank the cable. Reality slams back. Did you get what you came for?"
    secondary_stats:
      - name: programs
        source_stat: Tech
        spendable: false
      - name: firewall
        source_stat: Tech
        spendable: false
    mood: tension

  - type: combat
    label: Street Combat
    category: combat
    # Momentum-based. Real HP lives on character state. The netrun
    # beat is the genre-distinct move: hack and shoot at the same time.
    player_metric:
      name: momentum
      starting: 0
      threshold: 10
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 10
    beats:
      - id: shoot
        label: Shoot
        kind: strike
        base: 2
        stat_check: Body
        effect: "Target takes damage this round"
        narrator_hint: Muzzle flash in neon rain. Describe the chrome and the concrete.
      - id: take_cover
        label: Take Cover
        kind: brace
        base: 1
        stat_check: Reflex
        effect: "Reduce incoming damage behind urban debris"
        narrator_hint: Dumpster, concrete pillar, burned-out car — the city is cover.
      - id: netrun
        label: Netrun Strike
        kind: strike
        base: 4
        deltas:
          crit_fail:
            own: -2
        stat_check: Tech
        risk: "ICE counterattack — lose 2 momentum and take neural damage on failure"
        effect: "Cripple target's implants or nearby environment"
        narrator_hint: Jack in mid-firefight. Fry their implants from cyberspace.
      - id: disengage
        label: Disengage
        kind: push
        stat_check: Cool
        consequence: "Combat ends — vanish into the crowd or the net"
        narrator_hint: Drop the weapon, pull your hood up, slip between bodies.
    mood: combat
  - type: chase
    label: Urban Pursuit
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 10
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 10
    beats:
      - id: sprint
        label: Sprint
        kind: push
        base: 2
        stat_check: Cool
        narrator_hint: Weave through market stalls, dodge between crawling traffic.
      - id: hack_path
        label: Hack Environment
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: Tech
        risk: "System lockout — lose 2 separation"
        narrator_hint: Slam a door shut remotely, reroute an elevator, kill the lights.
      # crowd_blend: vanish into the press of bodies — angle, sets concealment tag
      - id: crowd_blend
        label: Crowd Blend
        kind: angle
        target_tag: "Lost in the Crowd"
        stat_check: Tech
        effect: "Disappear into the press of bodies"
      - id: go_dark
        label: Go Dark
        kind: push
        stat_check: Cool
        consequence: "Chase ends — off the grid"
    mood: tension

