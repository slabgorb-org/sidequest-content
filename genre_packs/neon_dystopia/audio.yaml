sfx_library:
  gunshot:
    - audio/sfx/gunshot.ogg
  cyberblade:
    - audio/sfx/cyberblade.ogg
  hack_breach:
    - audio/sfx/hack_breach.ogg
  neon_hum:
    - audio/sfx/neon_hum.ogg
  rain:
    - audio/sfx/rain.ogg
  crowd_murmur:
    - audio/sfx/crowd_murmur.ogg
  vehicle_engine:
    - audio/sfx/vehicle_engine.ogg
  door_hydraulic:
    - audio/sfx/door_hydraulic.ogg
  comm_ring:
    - audio/sfx/comm_ring.ogg
  chrome_deploy:
    - audio/sfx/chrome_deploy.ogg

mixer:
  music_volume: 0.4
  sfx_volume: 0.7
  crossfade_default_ms: 3000

ai_generation:
  enabled: true
  model: musicgen_small
  max_generation_time_s: 15
  cache_generated: true

themes:
  - name: exploration
    mood: exploration
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/exploration_full.ogg
      - type: ambient
        path: audio/music/exploration_ambient.ogg
      - type: overture
        path: audio/music/exploration_overture.ogg
      - type: resolution
        path: audio/music/exploration_resolution.ogg
