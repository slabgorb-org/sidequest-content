# neon_dystopia — genre-tier CWN baseline equipment catalog (ADR-145, story 114-5)
#
# This item_catalog is the Cities Without Number SRD §3.0.0 equipment chapter
# (Armor §3.3, Weapons §3.4, Mission Gear §3.1, Cyberware §3.6.7), extracted
# VERBATIM by the 114-5 extraction tool (cwn_equip_extract@114-5). The mechanical
# envelope — damage dice, Shock, Armor Class, cost, encumbrance, magazine/range,
# and CWN's net-new cyberware extra system_strain — is the SRD's own, carried
# unchanged and provenance-stamped (mode=verbatim, srd=cwn, license=wn-free,
# srd_ref). CWN is part of the Without Number line, reproduced verbatim under its
# free-use terms; factual sourcing only, no endorsement implied.
#
# Placement (ADR-140 / ADR-145 D3): the genre baseline is a shared, non-droppable
# catalog every neon_dystopia world inherits. Worlds union their own bespoke gear
# over it by item id (mechanics inherit+lock; presentation reskins freely). A
# world override that re-stats a locked verbatim mechanical field (system_strain,
# damage, armor_class, value, …) raises VerbatimFieldLockError at load.
#
# system_strain is a verbatim FLOAT (Keith's ruling 2026-06-14): CWN prices common
# chrome at fractional strain (Cybereyes/Cyberears/Skillplug Jack I/Cranial Jack =
# 0.25; Viper Sting/Skillplug Jack II/Cyberlimb = 0.5). An int would truncate
# 0.25→0 and make the iconic chrome "free" — the exact fidelity lie this epic
# exists to prevent. Location (Body/Head/Skin/Sensory/Nerve/Limb) and Concealment
# (Obvious/Sight/Touch/Medical) grades ride in tags; the Effect text is the
# description.
#
# Costs are the SRD's printed street prices in credits (eddies); $K/$M normalized
# to plain integers. Encumbrance markers normalized (~/* /- handled per the SRD's
# convention). Known verbatim gaps the WN-family schema does not capture (all
# non-blocking, sourced — never invented): the Rifle's +2 flat damage bonus
# (ranged parser holds the die 1d10 only), weapon Trauma Die / Trauma Rating,
# armor Damage Soak and the dual Ranged/Melee AC split (armor_class below is the
# SRD Ranged AC), and the Dermal Armor Trauma-Target modifier (CatalogItem has no
# trauma-target field — flagged 114-5).
#
# Bespoke section: a small set of genre-iconic items the CWN gear table does not
# contain (the smart-targeting pistol, the monomolecular katana, mantis blades,
# the netrunner's cyberdeck, optical camo, the plot-device data chip). These are
# mode=bespoke, license=na — honestly NOT SRD-verbatim, freely re-stattable.

currency:
  name: eddies
  denominations:
    - chips
    - creds
    - stacks

