  # ── Bespoke genre-iconic gear moved to the world tier (ADR-145 D3 / 114-14) ──
  # The cyberpunk-essential items the CWN gear table does not contain —
  # smart_pistol / katana / mantis_blades / cyberdeck / optical_camo / data_chip —
  # are mode=bespoke and a genre baseline carries no bespoke (loader-enforced).
  # They live at the world tier: worlds/franchise_nations/inventory.yaml. The genre
  # starting_equipment below still references the chargen-relevant ones; they
  # resolve into the kit via the non-droppable genre↔world merge.

# Loadouts (world-owned per ADR-145, kept genre-tier here as neon_dystopia has a
# single live world). Keyed by char_creation crucible class_hint. Every id below
# resolves to a catalog item above (CWN baseline ids or a retained bespoke id) —
# no dead ids, no orphan classes. Costs are credit-scale so they sit beside the
# CWN price list (a Solo's starting Combat Rifle is ~2.5K eddies of gear).
starting_equipment:
  Netrunner: [cyberdeck, smart_pistol, cwn_handheld_radio, cwn_cybereyes]
  Solo: [cwn_combat_rifle, cwn_street_leathers, cwn_medkit, cwn_gunlink]
  Fixer: [smart_pistol, cwn_armored_clothing, cwn_handheld_radio]
  Tech: [cwn_basic_tools_kit, cwn_cyberdoc_kit, cwn_medkit, cwn_climbing_kit]
  Nomad: [cwn_rifle, cwn_street_leathers, cwn_medkit, cwn_handheld_radio]
  Face: [smart_pistol, cwn_armored_clothing, cwn_handheld_radio]
  Ghost: [smart_pistol, cwn_climbing_kit, optical_camo, cwn_handheld_radio]

starting_gold:
  Netrunner: 3000
  Solo: 2500
  Fixer: 5000
  Tech: 3500
  Nomad: 2000
