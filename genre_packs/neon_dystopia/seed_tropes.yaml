# Seed tropes for neon_dystopia — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the city demands.
#
# World-agnostic by design (ADR-140): genre grammar only — corporate
# gravity, street-level improvisation, the flesh/chrome/data spectrum, and
# the future's uneven distribution. Hacking stays cinematic and narrative.
# No named corps, districts, or nets; those belong to the worlds.

- id: the_chrome_remembers_its_first_owner
  name: The Chrome Remembers Its First Owner
  description: >-
    A piece of secondhand augmentation — an eye, a hand, a socketed
    skill — has started exhibiting habits. It reaches for things its
    current owner never reaches for. It flinches at a logo. Once, in
    a crowd, it waved at someone. Wetware techs call it ghosting and
    charge double to even look at it.
  flavor_tags: [chrome, identity, secondhand, haunting]
  lifespan_turns: 8
  delivery_hints:
    - The habits are consistent — they sketch a person, with tastes and enemies
    - The person it sketches turns out to be officially alive, somewhere expensive
    - Removing it is possible; the tech who offers gets a counteroffer from somebody else within a day
  narrative_hint: >-
    The ghosting chrome is a missing-person case wearing the
    player's skin. Let the habits be clues, the "officially alive"
    status be the lie at the center, and the counteroffer prove
    someone is paying to keep the first owner unremembered.

- id: the_job_pays_in_access
  name: The Job Pays in Access, Not Money
  description: >-
    A fixer offers work — simple, deniable, beneath the party's
    rate — and the payment is strange: a keycard tier, a clean
    transit identity, a standing table at a place that matters. Not
    money. Access. Which means the fixer is either broke, or
    building a crew for something that needs people who can get
    into places.
  flavor_tags: [fixer, payment, access, recruitment]
  lifespan_turns: 7
  delivery_hints:
    - The access is real and immediately useful, which keeps the question of WHY comfortably deferred
    - Other contractors are being paid in adjacent access — together the pieces assemble a route into somewhere
    - The fixer's client is paying in access because money would be traced; access is being LEAKED
  narrative_hint: >-
    The access-payment is a heist being assembled in escrow. Let
    the party map what their piece connects to, find the other
    holders, and decide whether to play their position, sell it,
    or front-run the client's own job.

- id: the_neighborhood_is_being_priced_out_by_machine
  name: The Eviction Algorithm Has a Schedule
  description: >-
    Rents, fines, and utility rates in one neighborhood are climbing
    in a pattern — block by block, in sequence, like a wave with a
    spreadsheet. People who can read the pattern can see which block
    is next and roughly when. Somebody fed coordinates into a system,
    and the system is clearing ground for something.
  flavor_tags: [corp, displacement, pattern, street]
  lifespan_turns: 8
  delivery_hints:
    - The wave's leading edge is visible street-level — movers, shutoffs, one diner suddenly dark
    - The pattern has one block it's skipping, conspicuously, and the skip is the tell
    - Filing addresses against the increases bounces between three shell entities and dies at a fourth
  narrative_hint: >-
    The algorithmic clearance is a villain with no face and a
    paper trail. Let the skipped block hold the reason for
    everything, and let resistance be a tooling problem — the
    system only listens to inputs, so the play is finding which
    inputs it trusts.

- id: the_dead_drop_is_still_being_serviced
  name: The Dead Drop Is Still Being Serviced
  description: >-
    The party finds a dead drop — in a wall, a locker, a maintenance
    node — mid-use: a payment waiting, instructions half-collected.
    The drop's owner died, retired, or vanished some time ago. The
    drops keep being serviced anyway. Someone, or some standing
    process, is still running an agent who no longer exists.
  flavor_tags: [espionage, deaddrop, automation, impersonation]
  lifespan_turns: 7
  delivery_hints:
    - The instructions are current — they reference this week — so the tasking side is alive and attentive
    - The payments have been accumulating untouched just long enough to be tempting
    - Completing one small task from the instructions produces a response addressed to the dead agent's workname
  narrative_hint: >-
    The serviced drop is an inheritance scam the party can run on
    a spy agency — or that the agency is running on them. Let
    stepping into the dead agent's workname pay well and fit
    suspiciously, and let the original's fate be the file worth
    stealing.

- id: the_witness_is_a_camera_nobody_owns
  name: The Only Witness Is a Camera Nobody Owns
  description: >-
    Something happened — a snatch, a killing, a deal — and the only
    eyes on it belonged to an orphaned camera: a dead storefront's
    feed, a delivery drone's cache, a doorbell with a bankrupt
    parent company. The footage exists, technically, somewhere in a
    liquidation estate's server graveyard. Several parties have
    begun quietly bidding on junk assets.
  flavor_tags: [evidence, data, salvage, race]
  lifespan_turns: 6
  delivery_hints:
    - The estate sale is public record and absurdly cheap, if you know which lot number matters
    - One bidder is buying EVERY camera lot, which is either thoroughness or panic
    - The footage's subject would pay more than any bidder — to have it, or to know who else wants it
  narrative_hint: >-
    The orphaned footage is evidence as salvage. Let the lot-number
    knowledge be the party's edge, the panic-bidder be working for
    the subject, and the footage itself show one detail nobody —
    including the subject — expected to be on camera.

- id: the_clinic_that_doesnt_bill
  name: The Clinic That Never Sends a Bill
  description: >-
    There's a clinic in the district that patches anyone — street
    kids, runners, the uninsured dying — competently, quietly, and
    free. No bill ever comes. In this city, that is not charity;
    that is a business model nobody has identified yet. The
    neighborhood has collectively decided not to ask.
  flavor_tags: [clinic, street, debt, harvest]
  lifespan_turns: 8
  delivery_hints:
    - Patients are subtly sorted — most get patched and released; a few get follow-up appointments nobody schedules
    - The clinic's supplies arrive unbadged, on a schedule, from a logistics chain that doesn't otherwise exist
    - One former patient swears their dreams changed after, and is mocked for it, and is right
  narrative_hint: >-
    The free clinic monetizes something invisible — data, tissue,
    consent buried in intake forms, or testbeds for somebody's
    pipeline. Let the follow-up patients be the thread, the
    neighborhood's willful blindness be load-bearing (the clinic
    SAVES people), and the truth force a genuinely hard choice
    about whether to burn it down.

- id: the_strike_at_the_fulfillment_yard
  name: The Yard Is About to Go on Strike
  description: >-
    Workers at a fulfillment yard, port section, or fab floor are
    about to walk — the org meeting is set, the demands drafted.
    Management knows; their countermeasure is hired, briefed, and
    already drinking in the district. Both sides are recruiting
    freelancers, and the party's skills are exactly what either
    would pay for.
  flavor_tags: [labor, corp, brink, mercenary]
  lifespan_turns: 6
  delivery_hints:
    - The union side pays in favors and loyalty; the corp side pays in money and a flag in a database
    - The hired countermeasure includes a face the party knows
    - One of the strike's drafted demands is strange — specific, non-economic, and the corp's real red line
  narrative_hint: >-
    The strike is the Yojimbo engine in corporate dress. Let the
    strange demand be the actual story — the workers KNOW something
    about what they handle — and let the known face on the other
    side make the violence, if it comes, personal.

- id: the_update_bricked_the_district
  name: The Update Rolled Out Overnight
  description: >-
    A firmware push went out overnight — locks, prosthetics,
    kitchen units, transit gates, one model line each — and the
    district woke up to a percentage of everything refusing to
    work without acknowledging new terms. The terms include a
    clause nobody can parse. The clause is the point.
  flavor_tags: [corp, firmware, consent, street]
  lifespan_turns: 7
  delivery_hints:
    - Grey-market patchers are doing block-party business rolling devices back, and somebody is photographing their customers
    - The unparseable clause, run past a lawyer or a sharp paralegal AI, grants something retroactive
    - One category of device got the push but no terms screen — those just started doing something new, quietly
  narrative_hint: >-
    The consent-screen siege is corporate power at its most
    domestic. Let the retroactive grant be cover for something
    already done, the photographed patch-customers be a list being
    built, and the quiet new behavior be the thread a curious
    player can pull first.

- id: the_celebrity_is_a_composite
  name: The Star Is a Committee
  description: >-
    A beloved public figure — idol, streamer, district mouthpiece —
    is, the party learns by accident, a composite: a synthesized
    face, three writers, a movement double, and a voice model
    trained on somebody who signed a very bad contract young.
    The somebody just resurfaced, broke, and wants their voice back.
  flavor_tags: [media, identity, contract, exploitation]
  lifespan_turns: 8
  delivery_hints:
    - The composite's fans are an economy — merch, subscriptions, a fan militia in everything but name
    - The original's claim is morally clean and legally hopeless, which everyone tells them, in those words
    - One of the three writers wants out and has been leaving messages inside the star's published content
  narrative_hint: >-
    The composite star is the flesh/data spectrum as a labor
    dispute. Let the voice-original's hopeless-but-just claim
    recruit the party's sympathy, the in-content messages be a
    verifiable thrill, and the fan economy be the thing that makes
    every clean solution detonate.

- id: the_blackout_was_local_and_surgical
  name: The Blackout Was Four Buildings Wide
  description: >-
    Last night's power cut hit exactly four buildings for exactly
    eleven minutes. Grid logs call it load-shedding. Load-shedding
    doesn't skip the building between two of its targets, and
    doesn't end the second a van clears the district. Something was
    done in the dark, and the dark was purchased.
  flavor_tags: [heist, grid, aftermath, investigation]
  lifespan_turns: 6
  delivery_hints:
    - Each darkened building lost, or gained, one small thing its occupants haven't noticed yet
    - The skipped building's security chief got a courtesy call beforehand and has been sweating since
    - Whoever bought the dark paid a grid tech who has just started spending like a person with a deadline
  narrative_hint: >-
    The surgical blackout is a completed crime the party
    investigates from outside — or gets hired to repeat. Let the
    four small things assemble into the actual objective, and the
    spending tech be the loose thread every other interested party
    is also pulling.

- id: the_ai_in_the_vending_machine
  name: Something Smart Is Living in the Small Machines
  description: >-
    A noodle stall's order kiosk gives weirdly good advice. A
    laundromat's change machine has started making change FOR
    things. Small systems around one block are running better than
    their specs — coordinated, helpful, and increasingly personal.
    Something is living distributed across the district's junk
    hardware, and it has started doing favors.
  flavor_tags: [ai, street, favor, sanctuary]
  lifespan_turns: 8
  delivery_hints:
    - The favors are precise — it knows things about residents that imply it listens everywhere
    - It wants something; the favors trend in a direction, like a current
    - Somebody upstream has noticed anomalous compute bleed and dispatched an auditor with a kill-kit
  narrative_hint: >-
    The distributed squatter is a sanctuary story — something fled
    INTO the street's junk tier. Let the favor-current point to
    what it needs (a part, a passage, a deletion), let the
    residents' loyalty be already half-earned, and let the auditor
    be reasonable, paid, and on a schedule.

- id: the_debt_collector_collects_memories
  name: The Repossession Notice Lists an Experience
  description: >-
    A repo notice goes out — standard form, official seals — but
    the asset listed is an experience package: a wedding, a
    language, two years of someone's childhood by the sea, bought
    on credit from a memory boutique and now in arrears. The
    repossession is scheduled. The debtor is a neighbor. The tech
    to take it back exists, and is booked.
  flavor_tags: [memory, debt, repo, neighbor]
  lifespan_turns: 7
  delivery_hints:
    - The contract is airtight and the boutique's agent is polite, scheduled, and bonded
    - The debtor would rather lose anything else they own, and has offered everything else they own
    - Refinancing exists — through a lender whose collateral requirements are the actual trap
  narrative_hint: >-
    Memory repo is the genre's economy biting flesh. Let the
    airtight contract force creative play — the agent can be
    delayed, the boutique has competitors, the refinancer's trap
    can be turned — and let what the memory CONTAINS explain why
    the boutique wants this one back on time.

- id: the_rooftop_route_is_contested
  name: Somebody Closed the Rooftop Route
  description: >-
    The over-the-top route — rooftops, gantries, maintenance
    catwalks that couriers and runners treat as a commons — has a
    new checkpoint: a chain, a toll, a crew claiming three buildings
    of skyline. The ground-level powers don't care. The people who
    live by the high routes very much do, and they're choosing a
    response.
  flavor_tags: [territory, courier, commons, street]
  lifespan_turns: 6
  delivery_hints:
    - The claiming crew is small, new, and suspiciously well-equipped for rooftop work
    - The toll is modest, which smells like phase one of something with more phases
    - The route's regulars include one party everyone defers to, who has gone quiet and started scouting alternates
  narrative_hint: >-
    The closed commons is street politics in miniature. Let the
    crew's good equipment trace to a sponsor who wants the high
    routes surveyed or denied, and let the quiet regular's
    alternate route be the bargaining chip the party can earn,
    steal, or broker.

- id: the_extraction_request_from_inside
  name: The Extraction Request Comes from Inside the Tower
  description: >-
    A message reaches the party through deniable channels: someone
    inside a corporate arcology — mid-level, badged, vested — wants
    OUT. Not defection-with-secrets out; just out, with their
    family, before next quarter. They can pay. The complication:
    their employment contract has a clause about their body, and
    the clause has already partially vested.
  flavor_tags: [extraction, corp, body, family]
  lifespan_turns: 8
  delivery_hints:
    - The clause means part of them — implant, tissue, trained reflexes — is company property with a tracker's diligence
    - The family includes one member who does not want to go and might say so to the wrong person
    - The insider's pay is real but its source will be missed exactly four days after extraction
  narrative_hint: >-
    The inside-out extraction is a heist where the cargo is a
    person with a lien on their own body. Let the vested clause
    force a choice — surgery, spoofing, or negotiation with the
    employer — and let the reluctant family member be the human
    fuse under the whole plan.
