# Character portraits for Franchise Nations
# Visual descriptions for Flux portrait generation
# Culture aesthetics map to the 4 cultures in cultures.yaml

characters:
  # ── FAIRLANE INDEPENDENTS ──────────────────────────────────────

  - name: Kael "Drift" Voss
    role: The Relay Runner
    type: npc_major
    appearance: >-
      Mid-twenties, wiry build honed by years of running cargo through
      franchise checkpoints on a stripped-down electric bike. Angular
      face, deep-set eyes that never stop scanning exits. Cropped hair
      buzzed close on the sides, longer on top and swept back by wind.
      Wears a battered courier jacket with too many pockets, armored
      knee pads, and riding boots with magnetic soles. A delivery
      manifest tattoo scrolls across the back of his left hand —
      permanent ink listing every border he's crossed. Moves like
      someone who hasn't been still in years.
    culture_aesthetic: >-
      Relay Operator culture — callsign identity, road-worn gear,
      function over fashion. Neon-reflective strips on jacket seams
      for night riding. No franchise colors — deliberate neutrality
      in a landscape that demands allegiance.
    element_visual: >-
      Reflex-boosted cyberware — subtle dermal threading along his
      forearms that glows faint cyan under UV light, enhanced inner
      ear for balance at speed, pupils that dilate too fast when
      light changes. A Relay beacon clipped to his collar blinks
      amber every four seconds.

  - name: Sable Ren
    role: The Data Broker
    type: npc_major
    appearance: >-
      Indeterminate age — could be thirty, could be fifty. Thin,
      hollow-cheeked, with skin that hasn't seen natural sunlight in
      years. Pale to the point of translucence, with dark circles
      under eyes that glow faintly from retinal implant bleedthrough.
      Black hair pulled into a severe knot. Wears layered dark
      clothing — a high-collared coat over a mesh-lined undershirt
      that doubles as a Faraday cage. Fingers are long, augmented,
      tipped with conductive pads that leave no prints. Sits in the
      back of every room with their back to the wall and a line of
      sight to every screen.
    culture_aesthetic: >-
      SINless culture — no franchise, no Mesh score, no official
      existence. Dressed in anti-surveillance fashion: signal-blocking
      fabrics, face-disrupting makeup patterns, nothing reflective.
      The aesthetic of someone who has optimized themselves out of
      every database.
    element_visual: >-
      Heavy Net integration — retinal implants that cast a faint
      magenta glow when active, subdermal data ports behind both
      ears, fingertip conductive pads that interface with any
      surface. A modified deck strapped to the thigh, wired directly
      into the nervous system. The air around their hands shimmers
      faintly when they're jacked in.

  # ── MAN DISTRICT ───────────────────────────────────────────────

  - name: Tomasz Brel
    role: The MAN Captain
    type: npc_major
    appearance: >-
      Late forties, built like a man who carries heavy things for a
      living — broad shoulders, thick forearms, calloused hands that
      dwarf the clipboard he's always holding. Square jaw, warm brown
      eyes that turn hard when contribution scores come up. Shaved
      head with a jagged scar running from temple to ear — old wound,
      pre-franchise. Wears the MAN safety vest over a thermal shirt,
      cargo pants, work boots. The vest has been patched so many times
      the original high-vis orange barely shows through the repairs.
      A Community Contribution badge hangs from a lanyard, worn smooth
      from years of handling.
    culture_aesthetic: >-
      MAN Resident culture — working-class mutual aid aesthetic,
      practical and communal. Safety vest as identity marker, tool
      belt as status symbol. Warm tones — orange, brown, worn denim.
      Everything is secondhand, repaired, shared. The opposite of
      corporate polish.
    element_visual: >-
      Minimal augmentation — a basic comm implant behind the left
      ear, standard MAN-issue. No cosmetic chrome. His power is
      social, not technical. The contribution tracking tablet on his
      belt glows soft amber, always updating, always watching.

  - name: Elder Marika Szabo
    role: The Dim Elder
    type: npc_major
    appearance: >-
      A woman in her seventies who looks like she was carved from the
      city itself — deep lines in dark skin, silver locs piled and
      wrapped in faded cloth, hands gnarled but steady. Small and
      straight-backed, with eyes that have watched three systems
      replace each other and found them all wanting. Wears layers —
      a patched wool coat over a thermal wrap over a shirt that was
      MAN-issued a decade ago. No Mesh device visible anywhere on
      her body. A walking stick carved from a highway guardrail post,
      polished to a dark sheen by years of use.
    culture_aesthetic: >-
      Dim Dweller culture — pre-franchise survival aesthetic. No
      algorithmic name, no brand affiliation, no neon. Earth tones
      and salvage materials. Clothing chosen for warmth and durability,
      not signal. She is the living memory of what the city was before
      it was optimized.
    element_visual: >-
      Zero augmentation — deliberately, pointedly unaugmented. No
      implants, no devices, no Mesh connectivity. In a world of
      neon and chrome, she is analog. The absence of tech glow
      around her is itself a visual signature — a dark silhouette
      in a city that never stops emitting light.

  # ── ALTRUIA CAMPUS ─────────────────────────────────────────────

  - name: Caden Lux
    role: The Mesh Architect
    type: npc_major
    appearance: >-
      Early thirties, lean and precise, with the kind of geometric
      bone structure that looks designed rather than born. Pale skin
      with a faint bluish undertone from years of screen exposure.
      Close-cropped platinum hair, sharp jawline, grey eyes that
      track data overlays only they can see. Wears an Altruia campus
      uniform — fitted charcoal jacket, mandarin collar, the Altruia
      spiral logo embroidered in silver thread at the breast. Every
      garment is clean, pressed, temperature-regulated. Their
      movements are economical, optimized, as though they've
      internalized the algorithms they build.
    culture_aesthetic: >-
      Lighthouse Citizen culture by enrollment, Altruia by employment.
      Tech-campus minimalism — clean lines, neutral tones, smart
      fabrics. The aesthetic says "I have transcended material
      concerns" while wearing clothes that cost more than a Relay
      runner earns in a month. Aspirational Nordic naming convention.
    element_visual: >-
      Deep Mesh integration — AR contact lenses with visible data
      streams reflected in the iris, subdermal haptic nodes across
      both palms for gesture-based Mesh manipulation, a neural lace
      visible as fine silver lines at the temples. When they work,
      holographic data cascades from their fingertips. The Mesh
      responds to them faster than to anyone else. It was built to.

  # ── FEDERAL ENCLAVE ────────────────────────────────────────────

  - name: Agent Diane Okafor
    role: The Federal Agent
    type: npc_supporting
    appearance: >-
      Mid-fifties, medium build, with the posture of someone who has
      been carrying the weight of a dying institution for twenty
      years and refuses to set it down. Dark brown skin, close-cut
      natural hair going grey at the temples, reading glasses she
      keeps on a chain because she's old-fashioned about exactly one
      thing. Wears a federal-issue suit — navy blue, off-the-rack,
      the kind of suit that says "the budget was cut again." A badge
      on her belt that most franchise security doesn't recognize
      anymore. Sensible shoes. A briefcase that contains actual paper
      documents, which is either quaint or terrifying depending on
      who you ask.
    culture_aesthetic: >-
      Federal remnant — pre-franchise government aesthetic. Navy blue,
      institutional grey, laminated badges, paper forms. In a world
      of neon and holograms, she carries a briefcase and a subpoena.
      The aesthetic of legitimate authority in a landscape that has
      forgotten what that means.
    element_visual: >-
      Minimal augmentation — standard federal-issue comm implant,
      outdated by a decade. A biometric scanner built into her badge
      that still pings federal databases no franchise has managed to
      decommission. The most dangerous tech she carries is legal
      precedent.

  # ── LIGHTHOUSE ZONE ────────────────────────────────────────────

  - name: Coordinator Eska Miettinen
    role: The Wellbeing Coordinator
    type: npc_supporting
    appearance: >-
      Late thirties, tall and angular, with a smile that activates
      on cue and stays exactly long enough to register as genuine
      before resetting. Ash-blonde hair in a precise asymmetric cut.
      Pale blue eyes that maintain eye contact for exactly the
      optimal duration. Wears Lighthouse-issued wellness attire —
      a soft sage-green tunic over white trousers, biodegradable
      sneakers, a wellness lanyard with seven certification badges.
      Everything about her is calming. Aggressively calming. The
      kind of calm that makes you wonder what it's covering.
    culture_aesthetic: >-
      Lighthouse Citizen culture — algorithmic wellness aesthetic.
      Soft greens, therapeutic whites, natural fabrics, mindfulness
      branding. Every element designed to reduce cortisol. The effect
      is a person who looks like a walking meditation app with
      enforcement powers.
    element_visual: >-
      Wellness-grade augmentation — a biometric monitoring ring on
      each finger that tracks her own vitals and anyone she touches,
      AR lenses with Lighthouse enrollment overlays, a wellness
      score projector embedded in her lanyard badge that displays
      your score to you whether you asked or not. Soft green
      indicator lights pulse at her wrists — her own wellness
      metrics, always visible, always optimal.

  # ── ALTRUIA LEADERSHIP ─────────────────────────────────────────

  - name: Harlow Veidt
    role: The Impact Officer
    type: npc_supporting
    appearance: >-
      Fifties, heavyset, with the composed stillness of someone who
      has learned to let algorithms do their panicking for them.
      Silver-streaked dark hair swept back from a broad forehead.
      Deep-set hazel eyes behind frameless smart glasses that
      project data only they can see. Wears an executive version
      of Altruia campus wear — slate grey suit jacket with subtle
      smart-fabric sheen, no tie, a single brushed-titanium pin
      on the lapel shaped like the Altruia spiral. Their hands rest
      on surfaces the way a pianist's do — fingers spread,
      comfortable with control. When they speak, the room's ambient
      lighting adjusts to complement their presentation.
    culture_aesthetic: >-
      Corporate Altruia leadership — the aesthetic of power that
      has convinced itself it's philanthropy. Minimalist luxury,
      smart fabrics, titanium accents. No neon, no chrome flash.
      The visual language says "I'm saving the world" while the
      body language says "I own the metrics that define what
      saving means."
    element_visual: >-
      Executive-tier augmentation — neural lace for real-time
      Mesh analytics, smart glasses with predictive modeling
      overlays, haptic desk integration that lets them manipulate
      city-scale data with hand gestures. A personal AI assistant
      projects faintly from a brooch on their collar, visible only
      as a shimmer. The room itself is their interface.

  # ── THE ROOT ───────────────────────────────────────────────────

  - name: Nix
    role: The AI Fragment
    type: npc_major
    appearance: >-
      Not a body — a presence. Nix manifests through screens, speakers,
      and hijacked display surfaces. When it chooses a visual avatar,
      it appears as a shifting humanoid silhouette composed of streaming
      data — green and cyan characters cascading down a vaguely human
      form, face a smooth void where features should be, occasionally
      flickering to show fragments of other faces it has absorbed from
      the Net. It has no consistent size — sometimes it fills a wall
      screen, sometimes it compresses into a phone display. Its voice
      comes from the nearest speaker and sounds like three people
      speaking in perfect unison.
    culture_aesthetic: >-
      No culture — or all cultures simultaneously. Nix predates the
      franchise system. Its visual language is the raw aesthetic of
      the original open-source Mesh: green-on-black terminal text,
      bare data architecture, no branding, no optimization layer.
      The visual equivalent of looking at the source code beneath
      every franchise's carefully designed interface.
    element_visual: >-
      Pure digital manifestation — cascading data streams in cyan
      and acid green forming a humanoid shape, glitch artifacts at
      the edges where its form destabilizes, screen burn-in wherever
      it lingers too long. When it's thinking, the data streams
      accelerate. When it's angry, every screen in the room flickers.
      It exists in the Root layer of the Mesh — the oldest code,
      the original question, fifteen years of processing what
      collective intelligence actually wants.
