characters:
  - name: Kael "Drift" Voss
    role: The Relay Runner
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult man in his mid-twenties, wiry and
      lean, angular face, deep-set alert eyes glancing to one side,
      cropped hair buzzed close on the sides and longer on top swept
      back. Wearing a battered courier jacket with many pockets and
      thin neon-reflective strips along the collar seams, a high zip
      pulled to the throat, scuffed fingerless gloves resting at the
      shoulder. A line of small permanent ink marks bands across the
      back of his left hand. Brow slightly furrowed, mouth set.
    culture_aesthetic: >-
      Road-worn courier look, function over fashion, deliberately
      neutral colors with no franchise branding, deep charcoal and
      worn olive fabric, a single amber indicator light blinking at
      the jacket collar.
    element_visual: >-
      Faint cyan dermal threading glowing along the throat and jaw,
      pupils a touch too wide, a soft amber pinpoint light at the
      collar. Simple dark neon-smeared background in shallow focus.
      Fully clothed, modest outfit, correct human anatomy, natural
      hands and fingers, non-sexualized depiction. No text, no
      caption, no logos, no lettering, no watermark.

  - name: Sable Ren
    role: The Data Broker
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult of indeterminate age, thin and
      hollow-cheeked, very pale near-translucent skin, dark circles
      under the eyes which glow faint magenta from within, black hair
      pulled into a severe tight knot, a level guarded gaze straight
      to camera. Wearing layered dark clothing, a high stiff collar
      buttoned to the chin over a fine charcoal mesh undershirt, long
      slim fingers with smooth conductive fingertip pads folded at the
      chest. Expression flat and watchful.
    culture_aesthetic: >-
      Anti-surveillance look, matte signal-blocking black fabric,
      nothing reflective, faint geometric face-disrupting makeup
      patterns across one cheek, the deliberate non-style of someone
      erased from every database.
    element_visual: >-
      Retinal implants casting a faint magenta inner glow in both
      eyes, small dark data ports behind each ear, a soft shimmer in
      the air near the hands. Simple dark neon-smeared background in
      shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Tomasz Brel
    role: The MAN Captain
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult man in his late forties, broad
      shoulders and thick neck, square jaw, warm brown eyes, shaved
      head with a jagged old scar running from temple to ear, weathered
      face. Wearing a patched and faded high-visibility work vest over
      a heavy thermal shirt, the orange dulled and repaired with
      mismatched fabric, a blank lanyard hanging at the chest, big
      calloused hands. Steady, friendly expression with a hint of
      hardness at the brow.
    culture_aesthetic: >-
      Working-class mutual-aid look, practical and communal, warm
      tones of dull orange, brown and worn denim, everything
      secondhand and repaired, the opposite of corporate polish.
    element_visual: >-
      A small basic comm implant behind the left ear, no cosmetic
      chrome, a soft amber indicator light on a plain device clipped
      at the chest. Simple dark neon-smeared background in shallow
      focus. Fully clothed, modest outfit, correct human anatomy,
      natural hands and fingers, non-sexualized depiction. No text,
      no caption, no logos, no lettering, no watermark.

  - name: Elder Marika Szabo
    role: The Dim Elder
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult woman in her seventies, deep lines
      in dark skin, silver locs piled high and wrapped in faded cloth,
      small and straight-backed, sharp steady eyes meeting the camera.
      Wearing layered worn clothing, a patched wool coat over a thermal
      wrap over a plain shirt, no visible devices anywhere, gnarled but
      steady hands folded at the chest. Calm, knowing, weathered
      expression.
    culture_aesthetic: >-
      Pre-franchise survival look, no branding, no neon, earth tones
      and salvage fabric chosen for warmth and durability, the living
      memory of the city before it was optimized.
    element_visual: >-
      Pointedly unaugmented, no implants and no device glow anywhere
      on her, a dark untouched silhouette against the neon. Simple dark
      neon-smeared background in shallow focus. Fully clothed, modest
      outfit, correct human anatomy, natural hands and fingers,
      non-sexualized depiction. No text, no caption, no logos, no
      lettering, no watermark.

  - name: Caden Lux
    role: The Mesh Architect
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult person in their early thirties,
      lean with sharp geometric bone structure, pale skin with a faint
      bluish undertone, close-cropped platinum hair, sharp jawline,
      cool grey eyes with faint glowing data reflections in the irises.
      Wearing a fitted charcoal jacket with a high mandarin collar and
      a single small abstract silver-thread emblem at the breast,
      crisp and clean. Composed, precise, faintly aloof expression.
    culture_aesthetic: >-
      Tech-campus minimalism, clean lines, neutral charcoal and silver
      tones, smart fabrics with a subtle sheen, expensive restraint.
    element_visual: >-
      AR contact lenses with faint data streams reflected in the iris,
      fine silver neural-lace lines at the temples, a faint holographic
      shimmer near the collar. Simple dark neon-smeared background in
      shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Agent Diane Okafor
    role: The Federal Agent
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult woman in her mid-fifties, medium
      build, upright tired posture, dark brown skin, close-cut natural
      hair going grey at the temples, reading glasses on a thin chain
      around her neck. Wearing a plain off-the-rack navy-blue suit
      jacket over a pale shirt, a small dull metal badge clipped at the
      lapel with no readable markings. Steady, weary, determined
      expression.
    culture_aesthetic: >-
      Pre-franchise institutional look, navy blue and institutional
      grey, plain and unfashionable, legitimate authority in a world
      that has forgotten what that means.
    element_visual: >-
      A small outdated comm implant behind the ear, a plain badge with
      a faint blue scanner glow at the lapel. Simple dark neon-smeared
      background in shallow focus. Fully clothed, modest outfit,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction. No text, no caption, no logos, no lettering, no
      watermark.

  - name: Coordinator Eska Miettinen
    role: The Wellbeing Coordinator
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult woman in her late thirties, tall
      and angular, ash-blonde hair in a precise asymmetric cut, pale
      blue eyes, a poised measured smile held a beat too long. Wearing
      a soft sage-green tunic with a high neat collar, a plain blank
      lanyard at the chest, everything smooth and calming. Expression
      serene and controlled, faintly unreadable behind the smile.
    culture_aesthetic: >-
      Algorithmic wellness look, soft greens and therapeutic whites,
      natural fabrics, calm minimalist mindfulness branding stripped
      of any text.
    element_visual: >-
      A slim biometric ring on each finger, AR lenses with a faint
      enrollment overlay shimmer in the eyes, soft green indicator
      lights pulsing at the wrists. Simple dark neon-smeared background
      in shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Harlow Veidt
    role: The Impact Officer
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult person in their fifties, heavyset
      with composed stillness, silver-streaked dark hair swept back
      from a broad forehead, deep-set hazel eyes behind frameless smart
      glasses. Wearing an executive slate-grey suit jacket with a subtle
      smart-fabric sheen, no tie, an open collar, a single small brushed-
      titanium lapel pin shaped as an abstract spiral. Calm, controlled,
      faintly amused expression, hands resting spread at the chest.
    culture_aesthetic: >-
      Corporate leadership look, minimalist luxury, smart fabrics and
      titanium accents, no neon flash, slate grey restraint that reads
      as quiet power.
    element_visual: >-
      Fine neural-lace lines at the temples, smart glasses with a faint
      data shimmer in the lenses, a soft pinpoint shimmer of light at
      the collar brooch. Simple dark neon-smeared background in shallow
      focus. Fully clothed, modest outfit, correct human anatomy,
      natural hands and fingers, non-sexualized depiction. No text, no
      caption, no logos, no lettering, no watermark.

  - name: Nix
    role: The AI Fragment
    type: npc_major
    appearance: >-
      Chest-up bust of an abstract humanoid silhouette made entirely of
      streaming light, no real body, the head and shoulders formed from
      cascading vertical streams of glowing acid-green and cyan glyph-
      shapes against deep black, the face a smooth featureless void where
      features should be, edges dissolving into glitch artifacts and
      scan-line fragments. The shape reads as a person only in outline.
      Abstract indecipherable characters, no legible text, no readable
      code, only luminous abstract glyph-streams and unfocused strokes
      of light.
    culture_aesthetic: >-
      Raw open-source terminal aesthetic, acid-green-on-black data
      streams, bare geometric data architecture, no branding, no
      optimization layer, the look of source code beneath every polished
      interface, all characters abstract and unreadable.
    element_visual: >-
      Cascading acid-green and cyan data streams forming the humanoid
      shape, glitch artifacts and screen-burn shimmer at the edges, a
      faint pulse rippling through the streams. Deep black background.
      Abstract indecipherable characters, no legible text, no readable
      code, no caption, no logos, no lettering, no watermark.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER-PICKER PORTRAITS
  # Face options offered at character creation. type: player_picker.
  # Covers all four world cultures, M/F balanced, varied archetypes.
  # Physical-only appearance (head-and-shoulders, montage-safe);
  # backdrop comes from backdrop_poi (all resolve in r2_manifest.json).
  # Appended per the seaboard_of_saints pilot.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Relay Operator ────────────────────────────────────

  - id: picker_relay_operator_runner_m01
    name: picker relay operator runner m01
    role: The Relay Runner
    type: player_picker
    culture: relay_operator
    archetype: The Relay Runner
    sex: male
    backdrop_poi: the_fairlanes_rest_stop
    appearance: >-
      Man, late twenties, lean and wiry. Sharp angular face, weathered
      olive skin, a faded scar nicking one eyebrow. Hair buzzed at the
      sides, longer on top and swept back, gone slightly grey at the
      temples too early. Quick dark eyes that scan and never settle. A
      strip of faint cyan dermal threading runs along the jaw. High
      zipped courier collar at the throat, no franchise branding.

  - id: picker_relay_operator_runner_f01
    name: picker relay operator runner f01
    role: The Relay Runner
    type: player_picker
    culture: relay_operator
    archetype: The Relay Runner
    sex: female
    backdrop_poi: the_fairlanes_rest_stop
    appearance: >-
      Woman, early thirties, compact and athletic. Broad cheekbones, brown
      skin, a small chrome jack-port set behind one ear. Black hair shaved
      to stubble on one side, the rest braided tight and pinned up off the
      neck. Alert amber-brown eyes, a quick wry half-smile. Battered stand-
      up jacket collar zipped to the chin, a thin amber indicator light
      blinking at the seam.

  - id: picker_relay_operator_broker_m01
    name: picker relay operator broker m01
    role: The Data Broker
    type: player_picker
    culture: relay_operator
    archetype: The Data Broker
    sex: male
    backdrop_poi: the_undernet
    appearance: >-
      Man, indeterminate age, thin and hollow-cheeked. Pale near-grey skin,
      dark circles under eyes that glow faint magenta from within. Black
      hair slicked flat, a receding hairline, smooth conductive pads at the
      fingertips visible where one hand rests folded at the chest. Flat,
      watchful, unreadable expression. High stiff matte-black collar
      buttoned to the chin over a fine charcoal mesh undershirt.

  - id: picker_relay_operator_broker_f01
    name: picker relay operator broker f01
    role: The Data Broker
    type: player_picker
    culture: relay_operator
    archetype: The Data Broker
    sex: female
    backdrop_poi: the_undernet
    appearance: >-
      Woman, forties, sharp and severe. Narrow pale face, high forehead,
      silver-white hair drawn into a tight low knot. Cold grey eyes with a
      faint reflective sheen of an ocular implant, a thin line of glyph-
      light flickering across the left iris. A single hairline data-tattoo
      curls behind one ear. Mouth pressed flat. Layered dark high-collared
      coat fastened to the throat.

  # ── Picker · MAN Resident ──────────────────────────────────────

  - id: picker_man_resident_captain_m01
    name: picker man resident captain m01
    role: The MAN Captain
    type: player_picker
    culture: man_resident
    archetype: The MAN Captain
    sex: male
    backdrop_poi: the_community_kitchen
    appearance: >-
      Man, fifties, broad and solid. Warm round face, deep brown skin,
      laugh lines worn deep around tired kind eyes. Close-cropped grey
      hair and a short grey beard. A genuine, slightly weary smile that
      asks something of you even as it welcomes you. High-visibility yellow
      safety-vest collar over a worn flannel, worn with unmistakable pride
      at the shoulders.

  - id: picker_man_resident_captain_f01
    name: picker man resident captain f01
    role: The MAN Captain
    type: player_picker
    culture: man_resident
    archetype: The MAN Captain
    sex: female
    backdrop_poi: the_community_kitchen
    appearance: >-
      Woman, late forties, sturdy and warm. Open friendly face, tan
      freckled skin, smile lines bracketing a mouth that knows everyone's
      name. Greying chestnut hair pulled back in a loose practical bun,
      flyaways at the temple. Bright attentive hazel eyes that miss
      nothing. Yellow safety-vest collar over a knit jumper, a clipboard
      strap crossing one shoulder.

  - id: picker_man_resident_federal_m01
    name: picker man resident federal m01
    role: The Federal Agent
    type: player_picker
    culture: man_resident
    archetype: The Federal Agent
    sex: male
    backdrop_poi: the_federal_building
    appearance: >-
      Man, late forties, tired and stubborn. Square jaw, sallow lined skin,
      dark stubble going grey. Short regulation haircut grown slightly out
      of standard. Hooded brown eyes carrying the weight of a dead
      institution, a flat unimpressed set to the mouth. Cheap rumpled
      collared shirt and a loosened dark tie, a worn lanyard badge resting
      against the chest.

  - id: picker_man_resident_federal_f01
    name: picker man resident federal f01
    role: The Federal Agent
    type: player_picker
    culture: man_resident
    archetype: The Federal Agent
    sex: female
    backdrop_poi: the_federal_building
    appearance: >-
      Woman, fifties, severe and unyielding. Long pale face, sharp cheek-
      bones, grey-streaked dark hair scraped into a tight bun. Pale blue
      eyes that wait a beat before they judge, a thin straight nose, lips
      pressed to a hard line. A faded scar along one jaw. Buttoned dark
      collared blazer, a tarnished federal pin at the lapel.

  # ── Picker · Lighthouse Citizen ────────────────────────────────

  - id: picker_lighthouse_citizen_wellbeing_m01
    name: picker lighthouse citizen wellbeing m01
    role: The Wellbeing Coordinator
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Wellbeing Coordinator
    sex: male
    backdrop_poi: the_summit
    appearance: >-
      Man, mid-thirties, smooth and groomed. Even symmetrical face,
      flawless pale skin with a faint cosmetic glow, pale Nordic colouring.
      Blond hair styled neat and effortless. Calm pale-blue eyes and a warm
      practiced smile that never quite reaches them. A slim wellness-badge
      device clipped at the collar, glowing soft green. Clean pastel-teal
      collared tunic buttoned to the throat.

  - id: picker_lighthouse_citizen_wellbeing_f01
    name: picker lighthouse citizen wellbeing f01
    role: The Wellbeing Coordinator
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Wellbeing Coordinator
    sex: female
    backdrop_poi: the_summit
    appearance: >-
      Woman, early thirties, poised and luminous. Heart-shaped face, dewy
      pale skin, soft-focus cosmetic perfection. Ash-blonde hair in a sleek
      low ponytail without a strand out of place. Bright serene eyes and a
      relentlessly positive smile held to protocol. A wellness-badge with a
      glowing live score display at the collar. Pastel-white high-necked
      tunic, immaculate.

  - id: picker_lighthouse_citizen_impact_m01
    name: picker lighthouse citizen impact m01
    role: The Impact Officer
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Impact Officer
    sex: male
    backdrop_poi: the_summit
    appearance: >-
      Man, forties, controlled and faintly amused. Lean intelligent face,
      cool fair skin, neat short dark hair greying cleanly at the temples.
      Fine neural-lace lines trace the temples, smart glasses with a faint
      data shimmer in the lenses. Steady measuring eyes. Executive slate-
      grey collared jacket with a subtle smart-fabric sheen, open at the
      throat, a small brushed-titanium spiral lapel pin.

  - id: picker_lighthouse_citizen_impact_f01
    name: picker lighthouse citizen impact f01
    role: The Impact Officer
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Impact Officer
    sex: female
    backdrop_poi: the_federal_building
    appearance: >-
      Woman, late thirties, precise and unhurried. Angular composed face,
      warm brown skin, dark hair in a sharp asymmetric bob. A faint hairline
      of neural-lace at one temple, slim data-glasses with a soft shimmer.
      Dark eyes that pause to read you before they answer. Minimalist slate-
      grey collared blazer, smart-fabric sheen, a single titanium stud at
      the lapel.

  - id: picker_lighthouse_citizen_architect_m01
    name: picker lighthouse citizen architect m01
    role: The Mesh Architect
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Mesh Architect
    sex: male
    backdrop_poi: the_root
    appearance: >-
      Man, late twenties, pale and physically neglected. Gaunt face, sallow
      bloodless skin, dark hollows under wide unfocused eyes. Unkempt dark
      hair, days of patchy stubble. A top-tier Mesh interface port hardwired
      at the base of the skull, faint cyan light leaking from it. A blink-
      slow, far-away expression. A nutrient IV line taped along the neck,
      collar of a rumpled dark tee.

  - id: picker_lighthouse_citizen_architect_f01
    name: picker lighthouse citizen architect f01
    role: The Mesh Architect
    type: player_picker
    culture: lighthouse_citizen
    archetype: The Mesh Architect
    sex: female
    backdrop_poi: the_root
    appearance: >-
      Woman, early thirties, thin and luminous-pale. Sharp delicate face,
      translucent skin with visible veins at the temple, eyes ringed with
      fatigue and glowing faint acid-green from within. Fine dark hair
      shaved at one side around a hardwired neural interface, the rest
      hanging loose and unwashed. A distracted, listening expression.
      Collar of a worn hooded top, a thin IV line at the throat.

  # ── Picker · Dim Dweller ───────────────────────────────────────

  - id: picker_dim_dweller_elder_m01
    name: picker dim dweller elder m01
    role: The Dim Elder
    type: player_picker
    culture: dim_dweller
    archetype: The Dim Elder
    sex: male
    backdrop_poi: the_edge
    appearance: >-
      Man, sixties, weathered and unbowed. Deeply lined face, dark sun-
      cured skin, a short grizzled grey beard. Close-cropped white hair
      under a worn knit cap. No implants, no badge, no Mesh-glow — only
      sharp dark eyes that have seen the rezoning and remember. A quiet,
      measured, deliberate expression. Collar of a patched layered coat,
      a battered analog radio strap across one shoulder.

  - id: picker_dim_dweller_elder_f01
    name: picker dim dweller elder f01
    role: The Dim Elder
    type: player_picker
    culture: dim_dweller
    archetype: The Dim Elder
    sex: female
    backdrop_poi: the_edge
    appearance: >-
      Woman, late fifties, resilient and watchful. Broad weathered face,
      brown skin creased deep around the eyes, a faded burn scar along one
      cheek. Iron-grey hair in long thin braids wrapped back from the
      brow. No franchise marks of any kind. Steady dark eyes that distrust
      anything with a clipboard. Collar of a heavy hand-mended shawl,
      mismatched scavenged buttons at the throat.

  - id: picker_dim_dweller_fixer_m01
    name: picker dim dweller fixer m01
    role: The Data Broker
    type: player_picker
    culture: dim_dweller
    archetype: The Data Broker
    sex: male
    backdrop_poi: the_fixers_bar
    appearance: >-
      Man, thirties, lean and feral-sharp. Narrow face, ash-pale skin
      under grime, a crooked nose set badly once and never reset. Greasy
      dark hair tied back, one ear notched. A jury-rigged salvage implant
      bolted crudely at the temple, mismatched and sparking faint orange.
      A sly sizing-up grin. Collar of a scavenged armored jacket, frayed
      wiring looping at the shoulder.

  - id: picker_dim_dweller_fixer_f01
    name: picker dim dweller fixer f01
    role: The Data Broker
    type: player_picker
    culture: dim_dweller
    archetype: The Data Broker
    sex: female
    backdrop_poi: the_fixers_bar
    appearance: >-
      Woman, late twenties, hard-eyed and quick. Lean face, olive skin
      smudged with engine-grease, a thin white scar through one lip.
      Dark hair in a rough undercut, the long side dyed faded violet at
      the tips. Mismatched eyes, one natural brown, one a scavenged
      amber-lit optical implant. A guarded, calculating look. Collar of
      a patched leather jacket, salvaged circuit-bead necklace at the
      throat.
