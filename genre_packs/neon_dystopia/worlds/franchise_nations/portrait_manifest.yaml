characters:
  - name: Kael "Drift" Voss
    role: The Relay Runner
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult man in his mid-twenties, wiry and
      lean, angular face, deep-set alert eyes glancing to one side,
      cropped hair buzzed close on the sides and longer on top swept
      back. Wearing a battered courier jacket with many pockets and
      thin neon-reflective strips along the collar seams, a high zip
      pulled to the throat, scuffed fingerless gloves resting at the
      shoulder. A line of small permanent ink marks bands across the
      back of his left hand. Brow slightly furrowed, mouth set.
    culture_aesthetic: >-
      Road-worn courier look, function over fashion, deliberately
      neutral colors with no franchise branding, deep charcoal and
      worn olive fabric, a single amber indicator light blinking at
      the jacket collar.
    element_visual: >-
      Faint cyan dermal threading glowing along the throat and jaw,
      pupils a touch too wide, a soft amber pinpoint light at the
      collar. Simple dark neon-smeared background in shallow focus.
      Fully clothed, modest outfit, correct human anatomy, natural
      hands and fingers, non-sexualized depiction. No text, no
      caption, no logos, no lettering, no watermark.

  - name: Sable Ren
    role: The Data Broker
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult of indeterminate age, thin and
      hollow-cheeked, very pale near-translucent skin, dark circles
      under the eyes which glow faint magenta from within, black hair
      pulled into a severe tight knot, a level guarded gaze straight
      to camera. Wearing layered dark clothing, a high stiff collar
      buttoned to the chin over a fine charcoal mesh undershirt, long
      slim fingers with smooth conductive fingertip pads folded at the
      chest. Expression flat and watchful.
    culture_aesthetic: >-
      Anti-surveillance look, matte signal-blocking black fabric,
      nothing reflective, faint geometric face-disrupting makeup
      patterns across one cheek, the deliberate non-style of someone
      erased from every database.
    element_visual: >-
      Retinal implants casting a faint magenta inner glow in both
      eyes, small dark data ports behind each ear, a soft shimmer in
      the air near the hands. Simple dark neon-smeared background in
      shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Tomasz Brel
    role: The MAN Captain
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult man in his late forties, broad
      shoulders and thick neck, square jaw, warm brown eyes, shaved
      head with a jagged old scar running from temple to ear, weathered
      face. Wearing a patched and faded high-visibility work vest over
      a heavy thermal shirt, the orange dulled and repaired with
      mismatched fabric, a blank lanyard hanging at the chest, big
      calloused hands. Steady, friendly expression with a hint of
      hardness at the brow.
    culture_aesthetic: >-
      Working-class mutual-aid look, practical and communal, warm
      tones of dull orange, brown and worn denim, everything
      secondhand and repaired, the opposite of corporate polish.
    element_visual: >-
      A small basic comm implant behind the left ear, no cosmetic
      chrome, a soft amber indicator light on a plain device clipped
      at the chest. Simple dark neon-smeared background in shallow
      focus. Fully clothed, modest outfit, correct human anatomy,
      natural hands and fingers, non-sexualized depiction. No text,
      no caption, no logos, no lettering, no watermark.

  - name: Elder Marika Szabo
    role: The Dim Elder
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult woman in her seventies, deep lines
      in dark skin, silver locs piled high and wrapped in faded cloth,
      small and straight-backed, sharp steady eyes meeting the camera.
      Wearing layered worn clothing, a patched wool coat over a thermal
      wrap over a plain shirt, no visible devices anywhere, gnarled but
      steady hands folded at the chest. Calm, knowing, weathered
      expression.
    culture_aesthetic: >-
      Pre-franchise survival look, no branding, no neon, earth tones
      and salvage fabric chosen for warmth and durability, the living
      memory of the city before it was optimized.
    element_visual: >-
      Pointedly unaugmented, no implants and no device glow anywhere
      on her, a dark untouched silhouette against the neon. Simple dark
      neon-smeared background in shallow focus. Fully clothed, modest
      outfit, correct human anatomy, natural hands and fingers,
      non-sexualized depiction. No text, no caption, no logos, no
      lettering, no watermark.

  - name: Caden Lux
    role: The Mesh Architect
    type: npc_major
    appearance: >-
      Chest-up portrait of an adult person in their early thirties,
      lean with sharp geometric bone structure, pale skin with a faint
      bluish undertone, close-cropped platinum hair, sharp jawline,
      cool grey eyes with faint glowing data reflections in the irises.
      Wearing a fitted charcoal jacket with a high mandarin collar and
      a single small abstract silver-thread emblem at the breast,
      crisp and clean. Composed, precise, faintly aloof expression.
    culture_aesthetic: >-
      Tech-campus minimalism, clean lines, neutral charcoal and silver
      tones, smart fabrics with a subtle sheen, expensive restraint.
    element_visual: >-
      AR contact lenses with faint data streams reflected in the iris,
      fine silver neural-lace lines at the temples, a faint holographic
      shimmer near the collar. Simple dark neon-smeared background in
      shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Agent Diane Okafor
    role: The Federal Agent
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult woman in her mid-fifties, medium
      build, upright tired posture, dark brown skin, close-cut natural
      hair going grey at the temples, reading glasses on a thin chain
      around her neck. Wearing a plain off-the-rack navy-blue suit
      jacket over a pale shirt, a small dull metal badge clipped at the
      lapel with no readable markings. Steady, weary, determined
      expression.
    culture_aesthetic: >-
      Pre-franchise institutional look, navy blue and institutional
      grey, plain and unfashionable, legitimate authority in a world
      that has forgotten what that means.
    element_visual: >-
      A small outdated comm implant behind the ear, a plain badge with
      a faint blue scanner glow at the lapel. Simple dark neon-smeared
      background in shallow focus. Fully clothed, modest outfit,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction. No text, no caption, no logos, no lettering, no
      watermark.

  - name: Coordinator Eska Miettinen
    role: The Wellbeing Coordinator
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult woman in her late thirties, tall
      and angular, ash-blonde hair in a precise asymmetric cut, pale
      blue eyes, a poised measured smile held a beat too long. Wearing
      a soft sage-green tunic with a high neat collar, a plain blank
      lanyard at the chest, everything smooth and calming. Expression
      serene and controlled, faintly unreadable behind the smile.
    culture_aesthetic: >-
      Algorithmic wellness look, soft greens and therapeutic whites,
      natural fabrics, calm minimalist mindfulness branding stripped
      of any text.
    element_visual: >-
      A slim biometric ring on each finger, AR lenses with a faint
      enrollment overlay shimmer in the eyes, soft green indicator
      lights pulsing at the wrists. Simple dark neon-smeared background
      in shallow focus. Fully clothed, modest outfit, correct human
      anatomy, natural hands and fingers, non-sexualized depiction.
      No text, no caption, no logos, no lettering, no watermark.

  - name: Harlow Veidt
    role: The Impact Officer
    type: npc_supporting
    appearance: >-
      Chest-up portrait of an adult person in their fifties, heavyset
      with composed stillness, silver-streaked dark hair swept back
      from a broad forehead, deep-set hazel eyes behind frameless smart
      glasses. Wearing an executive slate-grey suit jacket with a subtle
      smart-fabric sheen, no tie, an open collar, a single small brushed-
      titanium lapel pin shaped as an abstract spiral. Calm, controlled,
      faintly amused expression, hands resting spread at the chest.
    culture_aesthetic: >-
      Corporate leadership look, minimalist luxury, smart fabrics and
      titanium accents, no neon flash, slate grey restraint that reads
      as quiet power.
    element_visual: >-
      Fine neural-lace lines at the temples, smart glasses with a faint
      data shimmer in the lenses, a soft pinpoint shimmer of light at
      the collar brooch. Simple dark neon-smeared background in shallow
      focus. Fully clothed, modest outfit, correct human anatomy,
      natural hands and fingers, non-sexualized depiction. No text, no
      caption, no logos, no lettering, no watermark.

  - name: Nix
    role: The AI Fragment
    type: npc_major
    appearance: >-
      Chest-up bust of an abstract humanoid silhouette made entirely of
      streaming light, no real body, the head and shoulders formed from
      cascading vertical streams of glowing acid-green and cyan glyph-
      shapes against deep black, the face a smooth featureless void where
      features should be, edges dissolving into glitch artifacts and
      scan-line fragments. The shape reads as a person only in outline.
      Abstract indecipherable characters, no legible text, no readable
      code, only luminous abstract glyph-streams and unfocused strokes
      of light.
    culture_aesthetic: >-
      Raw open-source terminal aesthetic, acid-green-on-black data
      streams, bare geometric data architecture, no branding, no
      optimization layer, the look of source code beneath every polished
      interface, all characters abstract and unreadable.
    element_visual: >-
      Cascading acid-green and cyan data streams forming the humanoid
      shape, glitch artifacts and screen-burn shimmer at the edges, a
      faint pulse rippling through the streams. Deep black background.
      Abstract indecipherable characters, no legible text, no readable
      code, no caption, no logos, no lettering, no watermark.
