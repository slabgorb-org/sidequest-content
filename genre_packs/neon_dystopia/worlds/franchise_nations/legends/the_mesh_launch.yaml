name: The Mesh Launch
era: 15 years ago
summary: Altruia launched the Mesh — not as virtual reality but as a "shared decision-making
  substrate for humanity's collective intelligence." The pitch deck was beautiful.
  The implementation was total. Within two years, the Mesh was the infrastructure
  of everything — reputation scores, franchise citizenship, climate control, transit
  routing, calorie tracking. You don't jack into the Mesh. You can't jack out. It's
  not a place. It's the air. Altruia's Chief Impact Officer called it "the nervous
  system of human flourishing." The nervous system knows where you sleep.
cultural_impact: The Mesh created a new class divide — those with high-bandwidth access
  and premium reputation scores, and those in the Dim where the signal drops. Your
  Mesh score is your identity. Your physical appearance is a legacy attribute. The
  Mesh is the most equitable system ever designed, by every metric it tracks. The
  metrics it doesn't track are, by definition, not important.
affected_cultures:
- Lighthouse Citizen
- Relay Operator
- Dim Dweller
faction_grudges:
- from: The Dim
  to: Altruia
  reason: Dim dwellers have no Mesh access. They're invisible to the reputation economy.
    Altruia categorizes them as "pre-enrolled potential citizens," which sounds like
    hope and feels like erasure.
monuments:
- Altruia's first server farm (now a campus with a meditation garden and a gift shop)
terrain_scars:
- type: digital
  region: the_undernet
  name: The Root
  description: The original Mesh code — written by open-source contributors who believed
    in collective intelligence. Altruia acquired it, optimized it, and buried the
    attribution. The Root is still running beneath Altruia's layers. Still accessible
    if you know where to look. Still doing something nobody authorized.
