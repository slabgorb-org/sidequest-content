name: The Wellbeing Incident
era: 8 years ago
summary: A Lighthouse Collective Wellbeing Coordinator conducted an "involuntary wellness
  intervention" on a Relay operator passing through Lighthouse territory. The operator's
  biometric scan indicated elevated cortisol and suboptimal sleep patterns. The Coordinator
  detained them for a mandatory 72-hour rest cycle. The operator's undelivered packages
  triggered a cascade of missed deadlines across six franchise territories. MAN's
  food distribution was disrupted. The Federal Enclave's mail was late (later than
  usual). The incident led to the Franchise Border Accords — the closest thing to
  international law, establishing courier immunity and transit rights that most franchises
  honor. Lighthouse apologized with a wellness gift basket and a pamphlet titled "The
  Neuroscience of Forgiveness."
cultural_impact: Everyone is wary of Lighthouse territory now. The Border Accords
  are the only rules all franchises follow, because the alternative is Lighthouse
  detaining people for insufficient flourishing. Relay operators wear cortisol-masking
  patches when passing through Lighthouse zones. The patches are sold by Lighthouse.
affected_cultures:
- Relay Operator
- Lighthouse Citizen
faction_grudges:
- from: Relay
  to: Lighthouse Collective
  reason: The detained operator was one of theirs. The missed deliveries cost Relay's
    collective reputation. Lighthouse's apology pamphlet made it worse.
- from: MAN
  to: Lighthouse Collective
  reason: The food distribution disruption meant 400 families missed a meal. MAN's
    block captains do not forget missed meals.
monuments:
- The Border Accords memorial plaque (at a Fairlanes rest stop, next to the vending
  machines)
terrain_scars:
- type: political
  region: lighthouse_zone
  name: The Wellness Center
  description: The facility where the operator was detained. Still operational. Still
    offering involuntary wellness interventions. The architecture is very calming.
