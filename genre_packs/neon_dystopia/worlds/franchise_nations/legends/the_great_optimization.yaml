name: The Great Optimization
era: 20 years ago
summary: The Effective Philanthropy Coalition published its white paper. Congress
  didn't fall — it was outperformed. The EPA lost to GreenLedger. The postal service
  lost to Relay. The military was absorbed by Sentinel Systems. The last act of Congress
  was the Franchise Sovereignty Act, which legalized what had already happened. The
  President signed it with a pen sponsored by Altruia. The ceremony had a 94% approval
  rating. The 6% who disapproved were enrolled in a Civic Satisfaction Program.
cultural_impact: Nobody trusts institutions because there aren't any. Citizenship
  is a subscription. Patriotism is a Net Promoter Score. The older generation remembers
  voting. The younger generation thinks "voting" is the thing you do on Altruia's
  Governance Review Platform, where the Constitution has 2.3 stars.
affected_cultures:
- Lighthouse Citizen
- Franchise Employee
faction_grudges:
- from: Franchise Federals
  to: Altruia
  reason: Altruia's white paper was the intellectual foundation for dismantling federal
    governance. The Federals consider this treason dressed as philanthropy. Altruia
    considers the Federals a low-performing legacy system.
- from: The Dim
  to: Lighthouse Collective
  reason: Lighthouse's "optimal population distribution" models were the basis for
    rezoning that pushed millions into the Dim. The models were technically correct.
    The people were not consulted.
monuments:
- The last functioning post office (a tourist attraction in the Federal Enclave)
- The Franchise Sovereignty Act, framed in Altruia's lobby with a satisfaction survey
  QR code
terrain_scars:
- type: political
  region: federal_enclave
  name: The Flag That Still Flies
  description: A full-size American flag on a hundred-foot pole. The last one the
    government maintains. Altruia's drones occasionally fly banner ads past it. The
    banner ads are for the Alignment Church.
