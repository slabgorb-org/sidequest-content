name: The Dim Expansion
era: 3 years ago
summary: Lighthouse Collective's "optimal population distribution" algorithm recommended
  consolidating franchise territories for efficiency. The rezoning pushed 200,000
  people out of franchise coverage into the gaps between territories — the Dim. Lighthouse
  published a report showing that the rezoning improved aggregate wellbeing scores
  by 3.2%. The report did not include the 200,000 people who no longer had wellbeing
  scores. They didn't have Mesh access anymore. They didn't count. A Relay operator
  who'd grown up in one of the rezoned neighborhoods started running supplies into
  the Dim. Others followed. It's not organized. It's not sustainable. It's the only
  thing happening.
cultural_impact: The Dim went from a few dead zones to a significant population. Dim
  dwellers developed their own barter economy, oral traditions, and a deep distrust
  of anyone carrying a clipboard. Some franchises see them as a labor reserve. Some
  see them as a threat. Lighthouse sees them as a data gap that will be resolved in
  the next optimization cycle.
affected_cultures:
- Dim Dweller
- Relay Operator
faction_grudges:
- from: The Dim
  to: Lighthouse Collective
  reason: They were rezoned out of existence by an algorithm. The algorithm was peer-reviewed.
monuments:
- The Dim Market (the largest barter market in the former United States, no Mesh required)
terrain_scars:
- type: humanitarian
  region: the_dim
  name: The Edge
  description: The border where franchise territory ends and the Dim begins. No gate.
    No wall. Just a place where the Mesh signal drops and the streetlights stop working.
    On the franchise side, the lawns are perfect. On the Dim side, someone has spray-
    painted "THEY OPTIMIZED US OUT" on a concrete wall.
