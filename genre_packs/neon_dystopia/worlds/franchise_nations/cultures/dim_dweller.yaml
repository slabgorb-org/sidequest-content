name: Dim Dweller
summary: People living in the unmonitored gaps
description: People living in the unmonitored gaps. No franchise affiliation, no Mesh
  score, no algorithmic name assignment. Just names — passed down, chosen, borrowed,
  or stolen. The last people on the continent who introduce themselves without a title.
slots:
  given_name:
    names_file: franchise_polyglot_given.txt
  family_name:
    names_file: franchise_polyglot_family.txt
  title:
    word_list:
    - Elder
    - Doc
    - Chief
    - Sister
    - Brother
    - Old
    - Boss
  place_noun:
    word_list:
    - camp
    - squat
    - shelter
    - market
    - yard
    - pit
    - hollow
  adjective:
    word_list:
    - old
    - dark
    - lost
    - free
    - dead
    - last
    - quiet
person_patterns:
- '{given_name} {family_name}'
- '{title} {given_name}'
place_patterns:
- The {adjective} {place_noun}
- '{given_name}''s {place_noun}'
