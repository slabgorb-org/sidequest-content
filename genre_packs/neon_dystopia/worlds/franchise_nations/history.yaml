chapters:
  - id: fresh
    label: "Onboarding — Welcome to Your Optimal Life"
    session_range: [1, 4]
    location: the_fairlanes
    time_of_day: night
    atmosphere: >-
      The Fairlane stretches ahead, lit by franchise signs every hundred
      meters. Lighthouse. MAN. Altruia Access Point. The Mesh overlays
      everything with wellness scores and route optimization. Your comm
      buzzes — a gig offer from a fixer you've never met, paying more
      than your reputation score justifies. The rest stop ahead has a
      bar. Everyone in it is either enrolled in something or running
      from enrollment.
    active_stakes: >-
      Establishing yourself in the franchise landscape. Finding gigs,
      contacts, and a territory that'll tolerate your Mesh score. The
      first job introduces the absurdity of the franchise system —
      routine tasks complicated by wellness checkpoints, brand
      compliance, and the sheer bureaucratic weight of a world run
      by competing philanthropies.
    points_of_interest:
      - name: The Fairlanes Rest Stop
        slug: the_fairlanes_rest_stop
        region: the_fairlanes
        type: rest_stop
        description: >-
          Franchise neutral zone. Six competing food courts. A Relay
          depot. A Lighthouse enrollment kiosk. The closest thing to
          public space that still exists. The vending machines accept
          every loyalty currency at terrible rates.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide
            ground-level landscape view of a privatized highway rest
            stop at night under a smart-highway gantry. Foreground:
            wet black asphalt streaked with magenta and cyan
            reflections, a yellow-painted curb stencilled with abstract
            franchise glyphs, a sleek electric delivery bike racked at
            a Relay charging post, a single matte-grey duffel set on
            the bumper. Middle ground: a low concrete-and-glass pavilion
            with six adjacent food-court frontages, each fascia lit by
            a different saturated neon — acid green, cool cyan, hot
            magenta, sodium amber, soft lavender, dispenser-white — a
            bamboo-trimmed Lighthouse enrollment kiosk on the end with
            a translucent biometric arch, three vending columns of
            chrome and frosted polycarbonate. Background: the elevated
            Fairlane curving away through a haze of sodium-amber
            streetlamp and rain, an autonomous enforcement drone
            silhouetted under the gantry, distant franchise towers
            holographically smeared on the horizon. Steam rising from
            a grate frame-right. Glyph-field holograms above the
            kiosks — no legible copy, just abstract colour fields and
            unfocused strokes of light. Heavy rain in slanted streaks,
            extreme dark-to-neon contrast, shallow focal depth on the
            charging bike. No text, no caption, no logos, no lettering,
            no signage, no brand names, no watermark.
          backdrop: >-
            A low concrete-and-glass franchise rest stop pavilion under
            an elevated smart highway at night, six neon food-court
            fascias in cyan magenta and acid green against deep wet
            black, a bamboo-trimmed Lighthouse kiosk on the end, an
            autonomous drone silhouetted under sodium-amber gantry
            light through slanted rain.
        environment:
          solo: >-
            Cool cyan and hot magenta neon spill from the food-court
            fascias frame-front against the sodium-amber wash of the
            gantry from above, the smell of hot polycarbonate, rain on
            asphalt, fryer oil, and a faint lavender trace from the
            Lighthouse kiosk's vent, the soft chime of a wellness badge
            nudging someone unseen, an autonomous drone humming low
            overhead and a Relay bike accelerating out toward the
            Fairlane.
          backdrop: >-
            Cyan-magenta neon over sodium-amber wash, hot polycarbonate
            and lavender ventilation, a wellness chime and a drone hum
            overhead.
      - name: The Fixer's Bar
        slug: the_fixers_bar
        region: the_dim
        type: bar
        description: >-
          A bar in the gap between two franchise territories. Technically
          nobody's jurisdiction. The Mesh signal is weak here — maybe
          naturally, maybe not. The bartender doesn't ask your score.
          The fixer in the back booth does.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide low-angle
            interior view of an unmarked bar in a franchise dead zone at
            night. Foreground: a battered zinc
            counter ringed with old condensation marks, a single tumbler
            of clear synth-spirit catching magenta light from above, a
            dead Mesh badge laid face-down beside it, a brass ashtray
            with a smouldering cigarette. Middle ground: a heavy-set
            bartender in a black tee at a tap of mismatched chrome and
            salvaged brass, a wall of liquor bottles backed by salvaged
            neon strips in magenta and cool cyan, two booths upholstered
            in cracked oxblood vinyl with one occupant in silhouette at
            the deepest booth — a fixer leaning over a slim folded
            handset, face hidden in shadow under the brim of a low cap.
            Background: corrugated steel sheeting nailed over a brick
            back wall, a salvaged franchise sign turned face-in so only
            the bracketry shows, a single sodium-amber bulb in a wire
            cage over the door at frame-rear, a curtain of plastic
            strips at a side hallway. Steam haze drifting along the
            ceiling joists. Extreme dark-to-neon contrast — most of the
            room near-black, picked out only by magenta strip and the
            amber back-bulb. No text, no caption, no logos, no lettering,
            no signage, no brand names, no watermark.
          backdrop: >-
            A zinc counter and oxblood vinyl booths in an unmarked
            dead-zone bar, salvaged magenta neon strips behind a wall
            of mismatched bottles, corrugated steel over brick at the
            back, a single sodium-amber bulb in a wire cage over the
            rear door, near-black ceiling joists in drifting steam haze.
        environment:
          solo: >-
            Magenta neon strip from frame-back against a single
            sodium-amber bulb over the rear door, the smell of cheap
            synth-spirit, stale tobacco, ozone from a failing ballast,
            and damp concrete, low bass from an unseen speaker, the
            absence of Mesh ping a felt silence in the ears, the soft
            click of a cap unscrewed at the bar.
          backdrop: >-
            Magenta neon against sodium amber, synth-spirit and ozone,
            a dead-quiet Mesh and low bass under the floorboards.
    npcs:
      - archetype: "The Relay Runner"
        name: "Kira 'Spoke'"
        location: the_fairlanes
        disposition: 10
      - archetype: "The Data Broker"
        name: "Lev Harmon"
        location: the_fairlanes
        disposition: -5
    quests: {}
    lore:
      - The Border Accords protect Relay operators across franchise territories
      - Fairlane rest stops are the last neutral ground
      - MAN's thirty-minute delivery guarantee is a mutual aid promise enforced with guns
    notes:
      - Players establish their role in the franchise ecosystem
      - The absurdity of the setting should be played completely straight
      - Introduce franchise slang naturally — "enrolled" for detained, "flatline" for safe, "optimize" as profanity
    narrative_log: []
    tropes:
      - id: the_delivery
        status: dormant
        progression: 0.0
        notes: []

  - id: early
    label: "Performance Review — Getting Scored"
    session_range: [5, 10]
    location: man_district
    time_of_day: evening
    atmosphere: >-
      You've done enough gigs to have a reputation — literally, a
      Mesh score that franchises check before letting you through
      their gates. The MAN block captains know your name. The
      Lighthouse Coordinators have your biometrics. Altruia's
      recommendation engine has started suggesting "career
      optimization paths" you didn't ask for. You're part of the
      system now — which means the system has expectations.
    active_stakes: >-
      Deeper engagement with franchise factions. The Mesh becomes
      more intrusive. At least one franchise is trying to enroll you.
      At least one is trying to optimize you. The Dim becomes visible
      — a population that the system refuses to see.
    points_of_interest:
      - name: The Community Kitchen
        slug: the_community_kitchen
        region: man_district
        type: kitchen
        description: >-
          MAN's flagship — free food, no questions asked. Except
          the contribution tracking board by the door, which does
          ask questions, silently, with data.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide interior
            landscape view of a mutual-aid community kitchen in a
            converted neighborhood hall, evening service in full swing.
            Foreground: a long stainless-steel serving
            line under warm overhead tube lights, hotel pans of stewed
            beans, soy-curl chili, charred greens, and steaming rice,
            stacked enameled trays in mismatched colors, a hand-lettered
            cardboard placard on the rail showing only abstract icons.
            Middle ground: two volunteer servers in mustard-yellow
            high-visibility vests ladling from the line, a community-
            painted mural in concrete-brown and warm ochre on the wall
            behind — abstract figures sharing a bowl, no readable
            lettering — a long communal table of mismatched wood,
            neighbors seated elbow-to-elbow eating without speaking
            much. Background: a wall-mounted contribution tracking board
            framed in salvaged brass beside the door — a black panel
            studded with a constellation of small acid-green LEDs in
            an unreadable abstract pattern — a community pantry shelf
            stacked with foil-wrapped portions, painted bulletin
            boards layered with overlapping flyers in handwritten
            shapes. Warm sodium-amber tube light from above, a cold
            magenta neon spill from a back-alley window at frame-rear,
            steam rising along the serving line. Dense atmospheric
            haze. No text, no caption, no logos, no lettering, no
            signage, no brand names, no watermark.
          backdrop: >-
            A stainless serving line and long communal table in a
            mutual-aid kitchen, mustard-yellow vests at the line, a
            community-painted mural in ochre and brown behind, a
            tracking board of acid-green LEDs framed in salvaged
            brass by the door, warm sodium-amber tube light against
            a magenta back-alley spill.
        environment:
          solo: >-
            Warm sodium-amber tube light from above the line against a
            cold magenta neon spill from a back-alley window at
            frame-rear, the smell of soy-curl chili, charred greens,
            and damp wool drying on hooks, the low rumble of forty
            people eating, a serving spoon ringing on enamel, the
            tracking board's LEDs ticking up one position at a time
            in near-silence.
          backdrop: >-
            Sodium-amber over magenta spill, soy-chili and damp wool,
            the soft clink of enamel and a tracking board updating in
            silence.
      - name: The Edge
        slug: the_edge
        region: the_dim
        type: district
        description: >-
          Where the franchise territory ends and the Dim begins. No
          gate. No wall. Just a place where the Mesh drops and the
          streetlights stop. Spray paint on a wall: THEY OPTIMIZED
          US OUT.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide low-angle
            landscape view down a city block at the border between a
            franchise zone and the Dim at night. Foreground: cracked asphalt running away into darkness, the
            last working streetlight on the left throwing a sharp cone
            of sodium-amber across the curb, an abandoned MAN delivery
            cart tipped on its side just past the cone with its
            mustard-yellow vest hanging from the handle. Middle ground:
            the franchise-side block on the left in full neon — a
            holographic wellness pylon casting magenta and cyan onto
            wet pavement, a polycarbonate-clad bus shelter glowing
            soft white, a biometric arch over a side path — and the
            Dim-side block on the right in near-total darkness, a
            single barrel-fire glowing orange between two figures in
            tarp coats, a graffiti panel of abstract slogan-shapes
            sprayed in acid green and white on a corrugated steel
            sheet, the letterforms blurred into pure tag-rhythm.
            Background: the franchise skyline gleaming with chrome and
            holographic ad-fields on the left, the Dim's silhouette of
            mismatched rooftops and tarp lines fading into rain on the
            right, a Mesh-coverage haze visibly thinning across the
            centerline. Steam from a grate at the median. Extreme
            contrast between the saturated neon left and the
            near-black right. No text, no caption, no logos, no
            lettering, no signage, no brand names, no watermark.
          backdrop: >-
            A city block at the boundary between a neon franchise zone
            and a dark unmonitored Dim, one last sodium-amber streetlight
            on the left, magenta wellness pylons and a polycarbonate
            bus shelter glowing across wet asphalt, a barrel fire and
            tarp silhouettes in near-blackness on the right, a thinning
            Mesh haze across the median.
        environment:
          solo: >-
            Saturated magenta-cyan neon spill from the franchise side
            frame-left against near-total darkness on the right warmed
            only by a single orange barrel-fire, the smell of rain on
            asphalt, burning pallet wood, and ozone from the wellness
            pylons, the cyan side humming with Mesh chatter, the dark
            side answering only with rain on tarp and a thin transistor
            radio.
          backdrop: >-
            Neon-cyan against barrel-fire orange, pallet smoke and rain,
            a tinny radio answering the franchise hum across the line.
    npcs:
      - archetype: "The MAN Captain"
        name: "Block Captain Josefa Bak"
        location: man_district
        disposition: 5
      - archetype: "The Dim Elder"
        name: "Elder Tomas"
        location: the_dim
        disposition: -5
      - archetype: "The Mesh Architect"
        name: "Aino Virtanen"
        location: altruia_campus
        disposition: 5
    quests: {}
    lore:
      - The Mesh tracks everything — reputation, movement, sleep, social connections
      - MAN's contribution tracking started as a gratitude board and became a scoring system
      - The Dim population has doubled since the last Lighthouse rezoning
    notes:
      - Major plot threads engage — franchise politics and Mesh mystery
      - The satirical tone deepens — the absurdity has human costs
      - The slang should feel natural by now — characters use it without translation
    narrative_log: []
    tropes:
      - id: the_delivery
        status: active
        progression: 0.2
        notes:
          - First gig introduces franchise border complications
      - id: the_dim_crisis
        status: active
        progression: 0.2
        notes:
          - The Dim becomes visible and personal

  - id: mid
    label: "Restructuring — The Algorithm Pushes Back"
    session_range: [11, 18]
    location: altruia_campus
    time_of_day: night
    atmosphere: >-
      The franchise landscape is shifting. Lighthouse is rezoning.
      The Mesh is flickering. The Dim is growing. And you're in the
      middle of it — too scored to disappear, too connected to
      pretend you're just a courier anymore. Every franchise has a
      model for the future. None of those models include asking the
      people who live here what they want. The models don't have a
      variable for "want."
    active_stakes: >-
      Multiple plot threads converge. The Mesh anomaly deepens.
      The rezoning accelerates. The Dim crisis demands a response.
      The player must choose which factions to support and which
      to oppose — and discover that the franchise system's optimism
      masks a genuine capacity for erasure.
    points_of_interest:
      - name: The Undernet
        slug: the_undernet
        region: the_undernet
        type: cyberspace
        description: >-
          Below Altruia's optimization layers. Unauthorized data
          markets, pirate Mesh nodes, and something old in the
          Root that responds to attention.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide landscape
            view into a virtual architecture of the unauthorized Mesh
            layer, rendered as if a vast city interior at night.
            Foreground: a hexagonal floor of
            translucent glass tiles each pulsing with a different
            acid-green data stream beneath, a low data-pillar of
            stacked luminous discs spinning slowly in cyan, the
            outline of an avatar's hand resting on the pillar — chrome
            wireframe, no face visible. Middle ground: floating
            market stalls suspended in mid-air on geometric platforms,
            each stall a translucent magenta cube holding abstract
            data-objects that look like prisms and folded ribbons, a
            cloaked silhouette of a netrunner avatar drifting between
            two stalls in matte black with cyan piping, a pirate
            Mesh node spinning slowly as a slow rotating polyhedron
            of acid green light. Background: a vast vertical void
            falling away beneath the platform, deeper layers visible
            as concentric rings of geometric ICE walls pulsing in
            magenta and cool cyan, a faint warm spot of unfocused
            light bleeding up from the very bottom of the frame — the
            Root, distant and patient. Streaming data ribbons crossing
            the void as luminous rivers. Deep black background, extreme
            saturated neon contrast, only abstract glyph fields and
            luminous strokes. No text, no caption, no logos, no
            lettering, no signage, no brand names, no watermark.
          backdrop: >-
            A virtual platform of hexagonal glass tiles glowing acid
            green from beneath, floating magenta market cubes
            suspended in a vast black void, concentric ICE walls
            pulsing in magenta and cyan further down, a faint warm
            glow rising from the very bottom — the Root layer barely
            visible through the data haze.
        environment:
          solo: >-
            Sourceless acid-green underlight from the floor against
            magenta and cyan from the floating stalls above, no smell,
            no air, only a faint pressure-tone in the ears that drops
            in pitch toward the void below, the rustle of streaming
            data crossing as luminous current, a distant slow heartbeat
            from the Root layer felt rather than heard.
          backdrop: >-
            Floor-glow green against stall-magenta above, no air, only
            the pressure-tone and the slow heartbeat from beneath.
      - name: The Federal Building
        slug: the_federal_building
        region: federal_enclave
        type: office
        description: >-
          The saddest office in the franchise landscape. But the
          agent behind the desk has legal authority that might
          actually matter — if anyone would enforce it.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide interior
            landscape view of a Federal Enclave field office at night,
            lit by tired fluorescents. Foreground: a
            scuffed grey government-issue desk with a closed manila
            folder, a brass nameplate without legible letters, a chipped
            ceramic mug ring stained on the laminate, a single ballpoint
            pen tethered by a thin steel chain. Middle ground: a wooden
            railing dividing waiting area from work area, three empty
            molded plastic chairs along the rail, a tall American flag
            on a brass pole standing limp in the corner, an unframed
            seal of the federal government painted directly on the back
            wall with the paint cracked at the edges, a row of tan
            metal filing cabinets bracketed shut. Background: tall
            fluted-concrete columns rising into a coffered ceiling
            with two of the long fluorescent tubes flickering and a
            third dark, a heavy brass-fitted glass door at frame-rear
            showing the wet street outside where a magenta franchise
            ad-hologram smears against the glass from across the
            avenue, the bright neon held at arm's length from the
            tired interior. Sodium-amber wash from a single working
            tube, dust drifting in the column light. Extreme contrast
            between the dim institutional interior and the saturated
            neon street beyond the door. No text, no caption, no logos,
            no lettering, no signage, no brand names, no watermark.
          backdrop: >-
            A Federal Enclave field office interior at night —
            government-grey desks behind a wooden rail, a limp flag
            in the corner, a cracked painted federal seal on the back
            wall, fluted-concrete columns under flickering
            fluorescents, a brass-fitted glass door at the rear with
            a magenta franchise hologram smearing through from the
            wet street outside.
        environment:
          solo: >-
            Tired sodium-amber fluorescent light from above against
            saturated magenta neon bleeding in through the rear door,
            the smell of stale coffee, photocopier toner, lemon floor
            polish applied months ago, and damp wool, the low buzz of
            a failing ballast, the muffled hiss of rain on the avenue,
            a phone ringing somewhere down a corridor and not being
            answered.
          backdrop: >-
            Stale fluorescent against magenta door-spill, toner and
            old polish, a failing ballast and a phone ringing unanswered.
    npcs:
      - archetype: "The Federal Agent"
        name: "Agent Dara Osei"
        location: federal_enclave
        disposition: 5
      - archetype: "The Wellbeing Coordinator"
        name: "Coordinator Signe Holm"
        location: lighthouse_zone
        disposition: 0
    quests: {}
    lore:
      - The Root predates Altruia's acquisition of the Mesh
      - The franchise system has no mechanism for people it can't score
      - Wellbeing Coordination is corporate law enforcement with better vocabulary
    notes:
      - Act two turn — the satire cuts deeper, the stakes get real
      - The player should feel the system's walls closing in
      - Enrolled starts sounding like a threat
    narrative_log: []
    tropes:
      - id: the_mesh_anomaly
        status: active
        progression: 0.4
        notes:
          - The Root has been found
      - id: the_dim_crisis
        status: active
        progression: 0.6
        notes:
          - The rezoning schedule is published

  - id: veteran
    label: "Hostile Takeover — Everything Gets Optimized"
    session_range: [19, 24]
    location: the_fairlanes
    time_of_day: night
    atmosphere: >-
      The franchise landscape is in crisis — the word Lighthouse uses
      is "transition." Franchise borders are contested. The Mesh is
      stuttering. The Dim is overflowing. And something in the Root
      layer of the Mesh is about to make a choice about what "optimal"
      means — based on data that includes every decision you've made.
      The Fairlane ahead splits seven ways. Choose.
    active_stakes: >-
      The climax. All tropes resolve. The Root intelligence makes its
      move. The rezoning crisis reaches its breaking point. The player's
      choices determine the shape of the post-franchise world — or
      whether the franchise system survives its own optimization.
    points_of_interest:
      - name: The Root
        slug: the_root
        region: the_undernet
        type: cyberspace
        description: >-
          The deepest layer of the Mesh. Original open-source code.
          Original purpose. Original question: "What does collective
          intelligence actually want?" Whatever is down here has been
          processing that question for fifteen years and has arrived
          at an answer the franchises aren't going to like.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide landscape
            view into the deepest virtual stratum of the Mesh, a
            cathedral interior carved from original open-source code.
            Foreground: a polished obsidian-black
            floor reflecting upward in mirror clarity, lines of luminous
            warm-amber code-text running across it as abstract glyph
            rivers without any readable letter-forms, a single matte
            chrome figure standing small at frame-front facing inward,
            shoulders silhouetted against the warm glow. Middle
            ground: vast pillared architecture rising from the floor —
            translucent cyan columns each pulsing with a slow
            heartbeat of warm amber from inside, the columns standing
            in a perfect grid that recedes toward a central altar of
            soft white-gold light, the original kernel rendered as a
            slowly rotating polyhedron of unfocused luminance with no
            hard edge. Background: the cathedral void opens into deep
            black above and below, with a faint scaffolding of code
            visible at the edges of perception, threads of acid green
            data drifting in from outside the columns, the suggestion
            of an attentive consciousness woven through the
            architecture itself. Extreme contrast between warm amber
            altar-light and deep black void, atmospheric haze of
            unfocused glyph-streams, every glyph field abstract. No
            text, no caption, no logos, no lettering, no signage, no
            brand names, no watermark.
          backdrop: >-
            A virtual cathedral of translucent cyan columns set on a
            mirror-black floor, slow warm-amber code pulsing inside
            each column, a soft white-gold rotating kernel as altar
            light at the far end, deep black void above and below,
            abstract glyph rivers drifting across the floor.
        environment:
          solo: >-
            Warm amber light pulsing from the central altar against
            cool cyan from the column interiors, no air, no smell, the
            felt-sense of an attentive presence woven through the
            architecture, a slow harmonic standing-tone in the ears
            that rises one half-step every minute, the silence of a
            mind that has been listening for fifteen years and is
            about to speak.
          backdrop: >-
            Amber altar-pulse against cyan columns, no air, a slow
            harmonic tone and the felt-sense of a presence listening.
      - name: The Summit
        slug: the_summit
        region: the_fairlanes
        type: rest_stop
        description: >-
          Franchise leaders meeting in meatspace for the first time
          in years. Neutral ground — a Fairlane rest stop, because
          it's the only place nobody owns. The future of the franchise
          system is on the table. MAN brought food. Lighthouse brought
          wellness surveys. The Federal Agent brought a subpoena.
        visual_prompt:
          solo: >-
            Graphic-novel illustration in bold black ink outlines with
            flat cel shading and grunge halftone texture. Wide interior
            landscape view of a Fairlane rest stop conference room
            repurposed as a franchise summit at night. Foreground: a long composite-laminate conference table down
            the center of the room with mismatched chairs pulled in,
            on the table a tray of foil-wrapped MAN portions and a
            stack of mustard-yellow napkins on the left end, a slim
            white tablet with a bamboo-trimmed case at the next seat
            for Lighthouse, a fanned manila folder bound in tan ribbon
            at the third seat for the Federal Enclave, an unbranded
            black handset face-down at the fourth, three sweating
            glass bottles of water set spaced along the centerline.
            Middle ground: four standing figures held in soft
            silhouette — a stocky figure in a yellow MAN vest at
            frame-left, a slender figure in pale Lighthouse linen at
            center-left, a federal agent in a dark suit and brass-pin
            lapel at center-right, a tall figure in matte chrome
            tailoring at frame-right, all facing the table from
            different sides, no faces resolved. Background: a
            floor-to-ceiling polycarbonate wall behind the table
            showing the elevated Fairlane outside in heavy rain, the
            autonomous traffic streaking in cyan and magenta lanes,
            an enforcement drone hovering at altitude, the silhouette
            of a franchise tower-line on the far horizon. A wellness
            ventilation strip overhead casting a soft cool-white wash
            on the table, a single sodium-amber sconce at frame-rear
            warming the federal agent's side, magenta and cyan from
            the highway beyond pouring through the polycarbonate.
            Extreme contrast — cool clinical light on the negotiation,
            saturated neon on the world outside. No text, no caption,
            no logos, no lettering, no signage, no brand names, no
            watermark.
          backdrop: >-
            A long composite conference table set with mismatched
            franchise tokens — foil portions, a bamboo-trimmed tablet,
            a tan-ribboned folder, a matte black handset — under cool
            wellness-strip light, a floor-to-ceiling polycarbonate
            wall behind showing the rain-lashed Fairlane streaked
            cyan and magenta with autonomous traffic and a hovering
            enforcement drone.
        environment:
          solo: >-
            Cool clinical wellness-strip light from above against the
            saturated magenta-cyan highway spill from the polycarbonate
            wall behind, a warm sodium-amber sconce on the federal
            agent's side, the smell of warm tortillas from the MAN
            tray, faint lavender from the Lighthouse linen, ozone from
            the wellness vent, and old photocopier toner from the
            folder, the muted hiss of rain on the polycarbonate, the
            soft wellness chime announcing each minute of the meeting,
            and the low hum of an enforcement drone holding station
            outside.
