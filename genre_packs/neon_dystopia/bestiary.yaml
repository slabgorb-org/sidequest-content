# Neon Dystopia — pack bestiary (story 90-1)
#
# SRD-aligned combat stat blocks for the cwn ruleset module. Encountergen
# samples these for the Monster Manual encounters pool (free-play reachable
# hostiles); narrative layers (OCEAN, visual prompt) are composed at
# generation time. Stats are faithful to the Cities Without Number SRD 1.0
# (Sine Nomine Publishing) foe blocks — level == HD, printed HP, ascending
# ranged AC (melee AC noted in description where it differs), morale on the
# 2d12 ladder. Armor soak and cyberware ride in `abilities` as color.
#
# Genre tier rules (ADR-120): names here are genre-generic — no named
# world franchises, corps, or POIs. World-specific hostiles belong in
# worlds/<slug>/ overrides.
entries:
