genre_key: neon_dystopia
default_reversibility: reversible_with_cost
verdicts_on_zero_edge:
  pc: dying
  npc: dead
soul_md_constraint: "genre_truth:meat_is_replaceable_but_costs"
must_narrate: "The runner is down — bleeding out on chrome, neural feedback frying the wetware, lungs full of arcology smog. Survival is possible but the cost is named on the table: chrome installed by a back-alley ripperdoc costs Humanity; a corporate medbay extraction costs a future favor or a debt to the franchise that pulled you out; a Lighthouse retrieval costs your wellness score and a re-onboarding contract. The cost lands the same turn the rescue does."
must_not_narrate: "instant survival; a medvac arriving out of nowhere without a payer; the bill quietly forgotten next session; an NPC paying the cost on the player's behalf without first asking; the rescue erasing the chrome / favor / debt that paid for it"
