stat_generation: point_buy
point_buy_budget: 27
magic_level: medium

allowed_classes:
  - Fighter
  - Ranger
  - Rogue
  - Cleric
  - Druid
  - Bard
  - Barbarian
  - Monk
  - Wizard
  - Warlock
  - Sorcerer
  - Paladin

allowed_races:
  - Human
  - Dwarf
  - Elf
  - Halfling

banned_spells:
  - Wish
  - Meteor Swarm
  - Power Word Kill
  - Gate
  - Teleport
  - Plane Shift
  - True Resurrection
  - Raise Dead
  - Time Stop
  - Simulacrum
  - Clone
  - Miracle
  - True Polymorph

custom_rules:
  rest_variant: gritty_realism
  encumbrance: variant
  injuries: lingering
  ledger_tracking: required
  pact_cost_attribution: required
  death_saves: hard
  spell_components: strict
  long_rest_minimum_days: "3"

default_class: Fighter
default_race: Human
default_location: "An antechamber of a house that is ending, where the old ledgers are kept"
default_time_of_day: dusk

ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

# ── Edge / Composure ──────────────────────────────────────────
# Replaces HP. Edge is the deflection currency — your footing,
# your nerve, your read on the room. When it's gone, the next
# thing that happens is the thing that was always going to happen.
edge_config:
  # Per-class base Edge capacity. Heavy_metal classes sort by
  # *how much pressure their training accustomed them to*, not
  # by hit-die size. The Fighter has carried a shield through
  # a winter siege; the Wizard has read in a room where the
  # candles kept blowing out; both took *damage*, just different
  # damage.
  base_max_by_class:
    Fighter:   6   # the doomed-prince baseline
    Barbarian: 7   # nothing to lose, everything to spend
    Paladin:   6   # oath as armour
    Ranger:    5   # the long quiet of the road
    Monk:      6   # one breath, then the next
    Cleric:    5   # the litany as anchor
    Druid:     5   # something else holds you up
    Bard:      5   # composure is the trade
    Rogue:     5   # the half-second nobody else has
    Warlock:   4   # the thing that watches you is not steady
    Wizard:    4   # the room is too loud for the work
    Sorcerer:  4   # the gift is also the wound

  # Default recovery. Heavy_metal is gritty: Edge refills between
  # confrontations, but only if the practitioner *had a moment*.
  # If the next confrontation begins before the breath is taken,
  # the player carries whatever they have.
  recovery_defaults:
    on_resolution: full       # full refill at confrontation close
    on_long_rest: full        # always full at long rest
    between_back_to_back: 0   # zero refill if no breath was taken

  # The composure-break threshold. When Edge hits zero, this
  # narrator_hint goes into the LoreStore as a high-priority
  # KnownFact. The narrator is *required* to honour it on the
  # next exchange — the prose at zero-Edge is not freelance.
  thresholds:
    - at: 1
      event_id: edge_strained
      narrator_hint: |
        The character is one exchange from breaking. Their breath
        is wrong; their stance has shortened by half a foot. The
        opponent has noticed. Describe the loss of bearing — the
        glance toward the exit, the grip that re-seats itself one
        beat too late.
      direction: crossing_down
    - at: 0
      event_id: composure_break
      narrator_hint: |
        The ledger turns. Whatever was being deflected now lands.
        The narrator must carry the genuine consequence on the
        next exchange — a wound that does not close, a yield that
        is heard, a name spoken that cannot be unspoken, a death
        that the room makes room for. This is not the time for
        deflection prose. The price is paid in this beat.
      direction: crossing_down

  # Display fields for the character sheet. The UI reads this
  # list declaratively — composure_state is derived by the
  # frontend from current/max ratio (Fresh / Strained / Cracked /
  # Broken).
  display_fields:
    - edge
    - max_edge
    - composure_state

encounter_base_tension:
  random: 0.20
  ambush: 0.40
  boss: 0.50
  final: 0.65

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Cold Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 4
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: argue
        label: "Argue the Ledger"
        metric_delta: 2
        stat_check: INT
        effect: "opponent concedes a line-item"
        narrator_hint: "The player cites a specific clause, a remembered precedent, an older debt. This is not a persuasive speech — it is a reading from the book."
      - id: press_obligation
        label: "Press an Obligation"
        metric_delta: 3
        stat_check: CHA
        risk: "reputation -1 if the claim does not land; the other side may remember the overreach"
        effect: "opponent is visibly compelled to answer"
        narrator_hint: "The player names a debt the other party cannot politely ignore. The room changes temperature."
      - id: yield
        label: "Yield a Point"
        metric_delta: -1
        stat_check: WIS
        effect: "opponent disposition +5; a fragment of their real position becomes visible"
        narrator_hint: "The player gives ground by design — a small loss to buy a truer look at the opponent's real situation."
      - id: withdraw
        label: "Withdraw"
        metric_delta: 0
        stat_check: WIS
        resolution: true
        consequence: "talks end; the matter remains open, and is remembered by both sides"
        narrator_hint: "The player stands, makes a formal closing gesture, and exits. Heavy Metal negotiations rarely die well; they are left half-buried."
    mood: tension

  - type: combat
    label: Blade-work
    category: combat
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: strike
        label: Strike
        metric_delta: 2
        stat_check: STR
        effect: "Target takes damage this round"
        narrator_hint: "Describe the blow with specificity — which grip, which angle, what gave way. Heavy Metal combat is not choreography; it is plumbing."
      - id: brace
        label: Brace
        metric_delta: 1
        stat_check: CON
        effect: "Reduce incoming damage this round"
        narrator_hint: "The character sets their weight, takes the impact, pays for it later."
      - id: committed_blow
        label: "Committed Blow"
        metric_delta: 4
        stat_check: STR
        risk: "Overcommits — lose 3 momentum and take a counter on failure"
        effect: "Target takes heavy damage"
        narrator_hint: "An all-in swing; the character is not planning a follow-up. Describe the violence as expensive — to the one making it, as well as the one receiving it."
      - id: break_contact
        label: "Break Contact"
        metric_delta: 0
        stat_check: DEX
        resolution: true
        consequence: "Combat ends — the character withdraws, or the enemy lets them go"
        narrator_hint: "Disengagement is a mercy in Heavy Metal. Describe it as such."
    mood: combat

  - type: chase
    label: Pursuit
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: run
        label: Run
        metric_delta: 2
        stat_check: DEX
        narrator_hint: "Flat-out running through cobbled streets, colonnades, or thorny underbrush. The character's breath becomes part of the description."
      - id: read_the_ground
        label: "Read the Ground"
        metric_delta: 1
        stat_check: WIS
        effect: "Use terrain — arches, ledgers, pilgrim-paths — to gain distance"
        narrator_hint: "The character notices something about the architecture or the road that the pursuer does not. The advantage is always specific."
      - id: cut_through
        label: "Cut Through"
        metric_delta: 3
        stat_check: WIS
        risk: "Blind turn — lose 2 separation on failure, and possibly end up somewhere unwanted"
        narrator_hint: "Duck through a confessional-alley, vault a temple-rail, cut across a tithing-yard. The character is betting on a shortcut they only half-know."
      - id: vanish
        label: Vanish
        metric_delta: 0
        stat_check: DEX
        resolution: true
        consequence: "Chase ends — the quarry is gone; the pursuer is left with the feeling of having lost something more than the quarry"
        narrator_hint: "The character disappears into the crowd, the shadow, the ritual. Describe the pursuer's stillness in the moment after the loss."
    mood: tension

  - type: pact_working
    label: "Working the Rite"
    category: social
    # A sorcerer, priest, or laborer executes a pact-working under
    # time pressure. Metric is rite_progress ascending to completion.
    # Failure does not cancel the debt — it multiplies it.
    metric:
      name: rite_progress
      direction: ascending
      starting: 0
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: invoke
        label: "Invoke the Terms"
        metric_delta: 2
        stat_check: INT
        effect: "The rite advances one step; the working's terms are laid down"
        narrator_hint: "The practitioner names the debt, the creditor, and the price. The ritual formally opens. The air, if one is paying attention, becomes measurable."
      - id: commit_cost
        label: "Commit the Cost"
        metric_delta: 3
        stat_check: CON
        risk: "The cost can be mis-paid — if the check fails, the rite advances but the debt is assigned to a wrong account; consequences may ripple for days or weeks"
        effect: "The working draws forward; the caster feels the withdrawal"
        narrator_hint: "Describe the commitment in concrete terms — an hour of life, a memory, a name, a year. Whatever is spent, it leaves."
      - id: steady_the_rite
        label: "Steady the Rite"
        metric_delta: 1
        stat_check: WIS
        effect: "The rite stabilises; interference is held at bay"
        narrator_hint: "The practitioner holds the working's shape against whatever is pressing back against it. This is the work of mastery, done quietly."
      - id: force_completion
        label: "Force Completion"
        metric_delta: 4
        stat_check: CHA
        risk: "If the check fails, the rite collapses — the debt is still owed, and is now owed with a penalty that is never small"
        effect: "The rite lurches to its end"
        narrator_hint: "The practitioner stops pretending the rite is easy. Force is applied. Whatever happens next will be legible to anyone nearby with the sensitivity to feel it."
      - id: close_the_book
        label: "Close the Book"
        metric_delta: 0
        stat_check: WIS
        resolution: true
        consequence: "The rite is complete — or is formally broken off with a lesser consequence than forcing it would carry"
        narrator_hint: "The practitioner closes the working deliberately — successful or not. The room feels it. The ledger either balances, or does not, and everyone in the room knows which."
    mood: ritual

  - type: debt_collection
    label: "The Collector at the Door"
    category: social
    # A creditor arrives to collect. The player attempts to negotiate,
    # defer, reassign, or refuse. The metric is composure; falling to
    # zero means the debt collects at full price, on the terms the
    # creditor prefers.
    metric:
      name: composure
      direction: bidirectional
      starting: 6
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: acknowledge
        label: "Acknowledge the Debt"
        metric_delta: 1
        stat_check: WIS
        effect: "The collector gives the player a moment; the scene does not accelerate"
        narrator_hint: "The player meets the collector's eye. No bluster. Heavy Metal rewards the quiet acknowledgement of an old bill."
      - id: reassign
        label: "Reassign the Account"
        metric_delta: 3
        stat_check: INT
        risk: "If the check fails, the collector takes the reassignment as insult; composure -3 and the terms get worse"
        effect: "A successful reassignment shifts the debt to another party — a faction, a dead ancestor's estate, a rival house"
        narrator_hint: "The player cites a clause, a precedent, a marriage, an older pact — anything that lets the account move. The collector may agree, or may not. Either way, something has been said that cannot be unsaid."
      - id: defer
        label: "Petition for Deferral"
        metric_delta: 2
        stat_check: CHA
        effect: "The debt is delayed — but the interest compounds"
        narrator_hint: "The player asks for time. The collector considers. The answer is never really no, but the price of time is never really small."
      - id: refuse
        label: "Refuse the Collector"
        metric_delta: -2
        stat_check: STR
        risk: "Refusing opens the scene to violence, ritual consequence, or both"
        effect: "The collector is, for the moment, held off"
        narrator_hint: "The player plants their feet and says no. The room changes. Describe what the collector does next with the precision that it deserves."
      - id: pay_in_full
        label: "Pay in Full"
        metric_delta: 0
        stat_check: CON
        resolution: true
        consequence: "The debt is paid, in the coin the collector prefers. The price is specific, visible, and permanent."
        narrator_hint: "Describe the withdrawal concretely — years, memory, a name, a relationship, a piece of the body. The ledger closes. The player leaves the scene changed."
    mood: ritual
