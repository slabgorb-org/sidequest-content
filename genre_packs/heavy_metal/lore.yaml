world_name: The Long Reckoning

history: |
  Before the current age, there were at least three great civilizations, and each struck its own bargain with the metaphysical weather of the world. The earliest of them — the ones whose stonework still lies in the deepest strata — invented the practice of feeding gods. They were meticulous, patient, and successful, and what they fed is no longer remembered by anyone still breathing. The pacts they made are still running. The creditors are still waiting.

  After the First Feeders came the Unfed. They learned the practice, adopted its apparatus, and failed at it. Their feeding broke — no one alive knows whether the priests grew lazy, the offerings ran short, or the gods simply grew too hungry to be satisfied. The Unfed collapsed in the middle of a sentence, leaving their temples half-built and their tallies still open. The hungry things in their ruins are hungry because of what that civilization failed to do. They are less patient than the First Feeders. A well-timed offering from the current age can, in principle, still close one of those old accounts.

  Third, and most disturbing, were the Refusers. They discovered the feeding economy and deliberately tried to break it. They built apparatuses that were neither pact nor sacrifice — engines, libraries, and stranger things — intended to produce some other metaphysics entirely. It is not known whether they succeeded, because they are gone. Their ruins are structurally different from the others. They are not temples.

  The current age stands on all three strata. Every shovel-cut is archaeology. Every ruin is a paused contract. And beneath all of it, the feeding economy still runs. The gods of the current age are fed by tithe and pilgrimage and grievance and confession, through bureaucracies that work — actually work, reliably, mechanically, verifiably — as long as the ledgers balance. When the ledgers stop balancing, the gods take their meals elsewhere. They are always somewhere. They are always eating something. The question for any given year is only: what, and at whose expense.

  Every empire in the current age is ending, and every empire's ending is related in some way to its failure to keep up with its account. The Reckoning of the title is this: the long, slow arrival of bills that were postponed.

cosmology: >-
  Magic in The Long Reckoning is never studied and cast. It is
  bargained for, inherited, or paid for — always paid for — in blood,
  soul, years, names, flesh, or memory. Every working is a withdrawal
  from a ledger, and every ledger has an account-holder. The central
  fact of the metaphysical economy is that obligation propagates at
  five scales: individual pacts (one soul, one bargain), communal
  rituals (a village, a guild, a quarter, feeding a shared debt),
  covenant-peoples (a whole population whose biology is a continuing
  contract), the divine apparatus (the organized feeding of gods
  through working religious bureaucracies), and the stratified
  prehistory (the un-closed pacts of the older civilizations, still
  live in the bedrock). A single act of magic can debit any or all of
  these scales, and the mechanical reality is that the caster does not
  always know where the bill is being sent. Gods, in this world, are
  real, specific, and hungry. Churches that work are feeding
  operations. Failure to feed has predictable consequences, none of
  them good. Sorcerers who outlive their own patrons are the luckiest
  people in the world. Everyone else is usually paying.

geography: >-
  The physical geography of The Long Reckoning varies by world, but
  the metaphysical geography is a constant. Every landscape has three
  superimposed layers: the current-age surface with its cities,
  courts, and laborers; the buried stratigraphy of the older
  civilizations (first-feeders, unfed, refusers) lying beneath or
  threaded through the rock; and the invisible cartography of the
  feeding economy, where tithes and offerings flow along routes that
  do not always follow roads. A shrine in one city may be feeding a
  god whose altar sits two continents away. A pilgrimage made in one
  country may be credited to an account opened in another. Knowing
  the real shape of the feeding map is valuable, dangerous, and
  sometimes directly lethal.

factions:
  - name: The Keepers of the Hour
    summary: "Organized priesthood of the hour-eating god; feeds it on offered years of life"
    description: >-
      The Keepers administer the feeding of a god that eats time. Its
      worshippers come to the temple and offer hours of a life — a
      year, an afternoon, a specific memory of an afternoon — and the
      god consumes them in a small, quiet rite. Keepers age strangely.
      Some look younger than their daughters. Some look older than
      their mothers. In exchange, the god grants precise, reliable
      workings of foreshortened or elongated time — a doomed
      battlefield that lasts a minute but occupies an afternoon, or
      the reverse. When the god goes hungry, the Keepers feel it
      first, in the bones of their hands. When the god goes genuinely
      starved, hours begin to disappear from the surrounding streets,
      and no one can quite remember what happened between dawn and
      noon.
    disposition: wary

  - name: The House of Surrendered Names
    summary: "Cult of the name-eating god; initiates give up a word they will never speak again"
    description: >-
      The Silent Patron eats names. Initiates surrender a word — a
      true name, a childhood nickname, the name of a person they
      loved, or simply a common noun they will agree to never utter
      again — and the god takes it. In exchange, the cultist gains
      power over things that are named, and the ability to speak with
      unusual authority on things that are not. The House is quiet,
      quiet in the way rooms are quiet after a door has been softly
      closed. Its priests communicate partly in pointing. When the god
      starves, the surrendered names come back into the initiates'
      mouths uninvited, at dangerous moments, in rooms where those
      names should never have been spoken aloud.
    disposition: neutral

  - name: The Confessors
    summary: "Secret-eating cult; sacraments are confession, absolution is metabolism"
    description: >-
      The Confessor is a god of secrets. It eats them. Its
      confessional is not a metaphor — a secret told into it is a
      secret that is actually, mechanically, eaten and digested. The
      worshipper is relieved of the burden. The priest records the
      transaction. The ledger balances. In exchange, Confessor priests
      can make other people's secrets fall out of their mouths — at
      opportune times, during interrogations, on battlefields. A
      starving Confessor begins to pull secrets out of whoever is
      nearest. In any city where a Confessor temple is under-fed,
      strangers begin to confess private truths in the street, and
      the magistrates have to invent new laws to cope.
    disposition: wary

  - name: The Path-Eaters
    summary: "Pilgrimage cult that feeds a walking god on the distances pilgrims walk"
    description: >-
      The Path-Eater does not sit in a temple. It walks. Its feeding
      is pilgrimage — steps taken, distances covered, miles paid in
      blisters and long silences. A pilgrim who reaches a Path-Eater
      shrine has fed the god the walking itself; the shrine is just
      the register. Path-Eater priests are always road-worn, and
      often older than they should be. A starving Path-Eater begins
      to walk on its own, through places its pilgrims have never
      been. Its footsteps are heard in cities where no one is. The
      road gets longer than it was when you set out.
    disposition: cautious

  - name: The Grievance-Keepers
    summary: "Feed a god of settled accounts on acknowledged wrongs laid at the altar"
    description: >-
      The Grievance-Ledger eats wrongs — acknowledged, specific,
      witnessed wrongs, brought forward by the wronged and laid at
      the altar. Feeding is a formal rite of grievance: the harm is
      named, the perpetrator is named, the debt is acknowledged, and
      the god takes the whole of it. In exchange, Grievance priests
      can enforce settlements that were formerly the work of courts
      and armies. A starving Grievance-Ledger begins to tally wrongs
      that were supposed to have been forgiven. Old quarrels rise in
      the town again, rewritten as if they had never been settled.
      Marriages dissolve. Peace treaties curdle. The god is only
      recovering its unpaid meals.
    disposition: hostile

  - name: The Drowse
    summary: "Dream-eating god; offerings are formal sleep-rituals in consecrated chambers"
    description: >-
      The Drowse eats dreams. Its offerings are made in long, formal
      sleep-rituals, in consecrated chambers where the worshipper
      sleeps under the priests' watch and their dreams are taken
      whole. Dreamers wake up emptied, and grateful for it. In
      exchange, the Drowse grants true-sighted dreams to the waking,
      and foreknowledge in the form of sleep that simply takes a
      person away from a decision they were about to make. A
      starving Drowse means a city that cannot sleep. Insomnia
      becomes civic. And in the waking hours, some people begin to
      dream anyway, with their eyes wide open, in the middle of
      crowds.
    disposition: cautious

  - name: The First-Feeder Strata
    summary: "The oldest buried civilization — meticulous, patient, and still being fed by no one"
    description: >-
      The First Feeders invented the practice. What they fed is no
      longer remembered, and the pacts they made are still waiting.
      Their ruins lie deepest, are quietest, and contain the most
      patient things. First-Feeder sites are dangerous in an
      understated way: the hungry things in them do not rush. They
      have waited this long; they can wait longer. Disturbing a
      First-Feeder site is rarely fatal in the same moment, but it
      starts a clock that the current age has no good way to stop.
    disposition: hostile

  - name: The Unfed Strata
    summary: "Collapsed mid-practice — their accounts stayed open and their gods stayed hungry"
    description: >-
      The Unfed adopted the feeding apparatus and failed to sustain
      it. Their ruins are exposed, unfinished, frankly ragged. The
      hungry things in them are, notably, still hungry — they are
      hungry because of a failure that happened long before the
      current age, and they are less patient than the First Feeders
      precisely because they have been missing meals for longer. An
      offering made in an Unfed ruin can, in principle, close one of
      their ancient tallies. Some cults of the current age quietly
      specialize in this kind of deep-debt restitution, on the
      theory that a closed account is one less thing waiting to
      come due.
    disposition: neutral

  - name: The Refuser Strata
    summary: "Built engines to escape the feeding economy; outcome unknown"
    description: >-
      The Refusers discovered the feeding economy and tried to break
      it. Their apparatuses — engines, libraries, and stranger
      things — appear to have been attempts at an alternative
      metaphysics. Whether the attempt worked is not known, because
      the Refusers are gone. Their ruins are structurally unlike any
      other stratum, and the things within them are not hungry in
      any legible sense. Some researchers argue that Refuser sites
      are the single most valuable archaeology in the world. Others
      argue that the reason the Refusers vanished is exactly the
      reason their sites should never be opened. Both positions are
      currently losing people to the same ruins.
    disposition: cautious
