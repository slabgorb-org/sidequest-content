positive_suffix: >-
  baroque ink and wash illustration in the tradition of Gustave Doré
  and Ian Miller, deep chiaroscuro with visible cross-hatching and
  stippled halftone, restrained palette of iron-red and tarnished brass
  on bone and void-black, oil-lamp flame and furnace-glow on cold stone,
  a single late-baroque industrial-civic city in visible decline,
  five-quarter register of Kragmoor guild halls and forges, Perault
  terraced houses with faded lacquer, Astran temple precincts with
  abstract feeding-sigils, Orvinnic Kin Lanes with mineral-washed
  risers, and Thessil herder waystations of felted coat and dry-stone
  cairn, an exposed Refuser stratum dig site at the city's edge,
  low-key matte surfaces. No text, no caption, no title, no writing,
  no legible script, no inscription, no signature, no watermark, no
  border, no frame.

preferred_model: dev
