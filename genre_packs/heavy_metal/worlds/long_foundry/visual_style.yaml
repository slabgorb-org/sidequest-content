# Long Foundry — World-Specific Visual Style
#
# Overrides genre defaults for Long Foundry — a single ~400-year-old
# baroque industrial-civic centre in late decline, sitting atop a
# First-Feeder bedrock layer with an exposed Refuser stratum dig
# site at the city's outskirts. Five cultures occupy distinct
# architectural registers: Kragmoor guild thaumaturgy (workshops,
# guildhalls, the Long Span), Perault declining aristocracy (terraced
# houses, the Ascending Way, faded lacquer), Astran liturgical
# bureaucracy (three temples, the precinct, the terrace stair),
# Orvinnic biology-as-pact (the Kin Lanes — mineral-washed risers,
# faintly iridescent covenant-kin skin), Thessil stratum-remnant
# herders (the Old Track, the Waystation, the Counting Stones).
# Pack-level heavy_metal visual_style.yaml carries the medium
# (Doré / Ian Miller / Rembrandt ink-and-wash, iron-red +
# tarnished-brass + bone + void-black, global no-legible-text ban);
# this file adds the city's era + materials + lighting register.

positive_suffix: >-
  a single late-baroque industrial-civic city standing four centuries
  on First-Feeder bedrock, in visible decline — flaking plaster on
  guild façades, fading lacquer on terrace doors, mended slate at the
  hems of high gables, tarnished brass guild plaques, embroidered
  banner-hems pulling. Architecture by quarter: Kragmoor guild halls
  with heavy worktables and reagent jars racked in order, a furnace's
  red light cast on guild-mark plaques; Perault terraced houses
  ascending the Way with shutters drawn and callers' books nearly
  empty; Astran temple precincts with lamps chained in pairs, altars
  carved in abstract calendar-wheel and feeding-sigils, tally-stones
  in geometric array; Orvinnic Kin Lanes with mineral-washed step-risers
  and elder covenant-kin moving softly between low arches; Thessil
  herder waystations of felted-coat dress, dry-stone cairns laid
  asymmetric, irregular pupils caught in lamplight. The Stratum Camp
  at the city's edge — canvas tents, oil-lanterns burning lower than
  they should, pale crystalline-bone Refuser artifacts on felt pads.
  Light is pre-dawn blue, overcast pearl, dusk amber failing into blue,
  lamplit interiors. Noon sun is absent. Magic is residue, not
  spectacle — residue-salts on stone floors, sigil-carvings worn
  smooth, candles guttering at a working just concluded.

# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All constraints
# live in positive_suffix (and the pack-level global suffix). See
# PROMPTING_Z_IMAGE.md.
negative_prompt: ""

preferred_model: dev
