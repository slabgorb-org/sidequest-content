name: Thessil
summary: Stratum remnant — descendants of a buried civilization still paying its contract
description: A diminished people descended from one of the civilizations older than
  history. Their ancestors signed something that is still in the bedrock, and the
  Thessil live on the slow edge of that older debt. They speak a language no one else
  understands properly, use names with more syllables than courtesy permits, and seem
  to know things about certain ruins that no one has told them.
