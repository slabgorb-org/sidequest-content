cultural_impact: The formal two-century arrangement between the three feeding cults
  of the temple precinct and the Coil and Brand Guild is commemorated by a joint procession
  on the first morning of spring, in which representatives of both bodies walk the
  length of the Long Span and exchange formal tokens at its midpoint. The procession
  has been held every year without interruption for one hundred and ninety-eight years.
  The city treats it as a weather-prediction — a successful procession means the year's
  accounts will be met.
era: two centuries ago
faction_grudges: []
lost_arts: []
monuments:
- The Midpoint Stone — a low marker set into the center of the Long Span, bearing
  the overlaid sigils of the three cults and the Coil and Brand's guild mark. Touched
  by every party to the annual procession.
name: The Founding of the Temple Arrangement
summary: After thirty years of patient diplomacy, the three feeding cults of the temple
  precinct — the Keepers of the Hour, the Silent Patron's House, and the Grievance-Keepers
  — formalised their arrangement with the Coil and Brand Guild, establishing the flow
  of tithe and refined tally that has kept the Long Foundry stable ever since. The
  document that records the arrangement is kept in a specific locked chamber of the
  central tally-hall and is reviewed formally on the anniversary of its signing.
