affected_cultures:
- Kragmoor
- Perault
cultural_impact: The Kragmoor guilds formally commemorate the Dissolution of the Founding
  Guild each year on the last day of the working calendar, with a small closed rite
  in the Coil and Brand hall. The Perault houses privately do not commemorate it,
  and pretend not to know what the rite is for. Both parties agree, without ever discussing
  it, that the founding guild left specific materials in the bedrock of the foundries
  that the current guild would prefer not to inventory.
era: two hundred years ago
faction_grudges:
- from: Kragmoor
  reason: The Coil and Brand inherited the foundries without inheriting the founding
    guild's ledgers. The missing books are a standing unresolved item on every Coil
    and Brand senior session agenda, as they have been for two centuries.
  to: The Founding Guild
lost_arts:
- The specific working technique the founding guild used to render First-Feeder residues
  into refined tally. The current guild uses a less efficient method and quietly assumes
  the older method existed and was lost.
monuments:
- The Founders' Stone — a plain stone set into the wall of the Coil and Brand guild
  hall, bearing no inscription. Every apprentice is shown it on their first day. No
  one explains what it commemorates.
name: The Dissolution of the Founding Guild
summary: Two hundred years ago, the senior members of the guild that founded the Long
  Foundry departed the city over the course of approximately three weeks, taking their
  books with them and leaving their working apprentices in possession of the foundries,
  the arrangements, and an unanswered question. The apprentices went on to found the
  Coil and Brand. The departed senior members have never been traced. Their ledgers
  have never been found. The reason for their departure is not known by any current
  party, and the silence around it is one of the city's more carefully maintained
  silences.
terrain_scars:
- description: A section of bedrock beneath the oldest foundry where the working residues
    collect in unusual patterns. Apprentices are told not to sweep this area, and
    to report any observations about it directly to a senior sorcerer. The senior
    sorcerers do not discuss the observations openly.
  name: The Founders' Footprint
  region: forge_quarter
  type: anomaly
