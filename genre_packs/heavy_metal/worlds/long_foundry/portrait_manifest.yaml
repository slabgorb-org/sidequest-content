    type: player_picker
    culture: perault
    archetype: Inheritor with an Inconvenient Debt
    sex: female
    backdrop_poi: the_varant_terrace
    appearance: >-
      Woman, early thirties. Fine-boned aristocratic face beginning to
      hollow at the cheeks, pale olive skin gone sallow. Dark hair
      pinned back severe under a single tarnished silver clasp. Grey
      eyes, watchful, set deep beneath a high forehead. A closed,
      careful mouth that has learned to give nothing away.

  - id: picker_perault_inheritor_m01
    name: picker perault inheritor m01
    role: Inheritor with an Inconvenient Debt
    type: player_picker
    culture: perault
    archetype: Inheritor with an Inconvenient Debt
    sex: male
    backdrop_poi: the_terrace_stair
    appearance: >-
      Man, late twenties. Long pale melodic-boned face, waning-house
      pallor, dark auburn hair waved back from a high brow. Heavy-lidded
      hazel eyes carrying an inherited weariness, a thin straight nose,
      a soft uncertain mouth. Clean-shaven, finely made, faintly haunted.

  - id: picker_perault_collector_m01
    name: picker perault collector m01
    role: The Collector at the Door
    type: player_picker
    culture: perault
    archetype: The Collector at the Door
    sex: male
    backdrop_poi: the_silent_patrons_house
    appearance: >-
      Man, indeterminate middle age. Narrow placeless face, long
      straight nose, sandy hair oiled flat and receding at the temples.
      Small pale blue eyes that do not blink on the expected beat, thin
      lips set in a neutral line just short of a smile. Correct, still,
      buttoned to the throat.

