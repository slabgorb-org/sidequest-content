# Character portraits for The Long Foundry (heavy_metal genre)
#
# Style inherited from genre visual_style.yaml: baroque ink-and-wash
# illustration, deep chiaroscuro, iron-red / tarnished-brass / bone /
# void-black palette, engraving-like crosshatching, candlelight on
# cold stone. Do NOT restate the style here -- the daemon injects
# positive_suffix at render time.
#
# Seven archetype NPCs representing the five cultural quarters of the
# Long Foundry: Perault (French-inflected declining nobility),
# Kragmoor (Germanic guild thaumaturgy), Astran (temple feeding-cult
# bureaucracy), Orvinnic (covenant-bound laborer kin), and Thessil
# (herder/stratum remnant). Each portrait is a canonical identity
# artifact -- clothing, props, and physical details rendered here are
# diamonds the player will carry forward.
#
# Z-Image name rule: Z-Image Turbo paints proper nouns as captions.
# Avoid proper nouns in appearance and element_visual fields.

characters:
  - name: Lucienne of House Mornault
    role: Inheritor with an Inconvenient Debt -- Perault house scion travelling under an assumed name, carrying a covenant they did not sign
    type: npc_major
    appearance: >-
      A human woman in her early thirties with sharp, fine-boned
      features beginning to hollow at the cheeks. Pale olive skin
      gone sallow from too many months indoors. Dark hair pulled back
      severely and pinned with a single tarnished silver clasp. Grey
      eyes, watchful, set deep under a high forehead that catches
      side-light. She wears a well-cut travelling coat of dark
      blue-grey wool over a linen blouse with covered buttons,
      the coat's tailoring unmistakably aristocratic but its cuffs
      deliberately turned to hide the embroidery beneath. A signet
      ring on a cord inside her collar, not on her hand. A small
      leather-bound notebook visible in her coat's inner breast
      pocket, its spine cracked from frequent reference. One hand
      rests near her belt where a plain iron short-sword hangs in
      a scabbard worn smooth by travel.
    culture_aesthetic: >-
      Declining-house dress stripped of its ornament -- the cut says
      old money, the missing embroidery says the money left first.
      Everything she wears is designed to pass as a minor
      functionary's travelling kit until someone looks at the
      tailoring.
    element_visual: >-
      The tarnished silver hair-clasp, the signet ring on a cord
      hidden at the collar, the deliberately turned cuffs, the
      cracked-spine notebook in the breast pocket.

  - name: Stolz Hammerbrand
    role: Grey Thaumaturge -- Kragmoor guild sorcerer who hires their working out by the day, tradesman not mystic
    type: npc_major
    appearance: >-
      A stocky dwarven man in his middle years with a broad flat
      face, deep-set amber eyes, and a short iron-grey beard trimmed
      square at the jaw. His skin is ruddy and pocked at the
      temples from long exposure to forge-residue. Thick hands with
      permanently stained fingertips -- the left hand blued with
      copper salts, the right yellowed with sulphur residue, the
      nails kept short and clean despite the discoloration. He wears
      a heavy leather apron over a collarless linen work-shirt and
      dark wool trousers, the apron scarred with small burns and
      reagent stains in a dozen colours. A guild-mark token of dark
      bronze hangs on a cord at his sternum. A small leather ledger
      is tucked under his left arm. A canvas pouch of reagents,
      each dose wrapped in waxed paper, hangs from his belt beside
      a plain iron-handled pen-knife.
    culture_aesthetic: >-
      Guild working-dress -- everything functional, nothing
      ornamental, the apron and stained hands marking the specific
      trade before a word is spoken. The guild-mark token is the
      only concession to rank.
    element_visual: >-
      The two-toned stained hands, the guild-mark token on a cord,
      the reagent pouch of waxed-paper doses, the leather ledger
      under the arm.

  - name: Corben Writ
    role: The Collector at the Door -- itinerant debt collector, patient, precise, quietly implacable
    type: npc_major
    appearance: >-
      A lean halfling man of indeterminate middle age, no taller
      than a child but carrying himself with the measured stillness
      of someone who has never needed to hurry. Sandy brown hair
      receding at the temples, combed flat and oiled. A narrow face
      with a long straight nose, thin lips set in a neutral line
      that is not quite a smile, and small pale blue eyes that do
      not blink at the expected intervals. He wears a correctly
      cut dark brown wool coat buttoned to the throat over a
      starched cream shirt, the coat fitted precisely to his small
      frame with no excess cloth. A sealed writ in a leather
      document-case is visible under his left arm, the case's brass
      clasp stamped by three separate authorities. His right hand
      rests in his coat pocket. A stamped ledger of stiff cardboard
      covers hangs from a brass chain at his belt. His boots are
      polished to a dull shine and show no road-dust despite
      obvious long travel.
    culture_aesthetic: >-
      Professional dress that belongs to no quarter and no culture
      -- deliberately placeless, deliberately correct, the coat of
      someone whose authority is the paperwork, not the person.
    element_visual: >-
      The sealed document-case under the arm with its triple-
      stamped clasp, the chain-hung ledger at the belt, the
      polished dust-free boots, the unblinking pale eyes.

  - name: Prefect Isola Hours-of-the-Hour
    role: Feed-keeper -- Astran priest who administers the feeding rites of the eldest temple, clerk not mystic
    type: npc_major
    appearance: >-
      A tall human woman in her late fifties with a long oval face,
      prominent cheekbones, and deep lines bracketing her mouth. Her
      skin is pale and translucent at the temples where thin blue
      veins show. Iron-grey hair drawn back under a close-fitting
      white linen coif. She wears cold-white liturgical vestments
      -- a high-collared cope of heavy unbleached linen falling to
      her ankles, a narrow pale stole with fine geometric pattern-
      work woven along its length in thread only slightly darker
      than the cloth. Her hands are clasped before her at waist
      height, the fingers long and dry, a brass tally-ring on the
      left index finger marked with twelve notches. A carved wooden
      token hangs from a cord at her right wrist, its purpose
      unreadable from its shape. A tally-stick of dark polished
      wood is tucked into the stole's fold at her chest.
    culture_aesthetic: >-
      Astran liturgical formal -- the cope and stole are the uniform
      of a working priesthood, not a ceremonial one. The geometric
      pattern-work marks her specific rite-rank. The palette is
      deliberately cold and clean against the genre's warm iron
      tones.
    element_visual: >-
      The cold-white cope and patterned stole, the clasped hands
      with the brass tally-ring, the carved wooden token at the
      wrist, the tally-stick tucked at the chest.

  - name: Torve-Kuollin
    role: Flesh-ledger Laborer -- Orvinnic covenant worker whose body carries visible marks of an inherited pact
    type: npc_major
    appearance: >-
      A broad-shouldered human man in his early forties with a wide
      calm face, heavy brow, and dark brown eyes set close together.
      His skin is weathered tan with a faint iridescent sheen at the
      jaw and temples -- not paint, not illness, a quality of the
      skin itself, as if trace metals have settled into the deeper
      layers. Short dark hair cropped close, going grey at the
      sides. The covenant-marks are visible on his forearms where
      his sleeves are rolled: thin raised lines of pale scar-tissue
      in precise geometric rows, an accounting rather than a wound,
      the spacing too regular and the angles too exact for injury.
      He wears a heavy undyed linen work-shirt and dark canvas
      trousers, a leather tool-belt carrying a mason's cold chisel
      and a flat-headed hammer. A string of worn wooden counting-
      beads is wound twice around his left wrist. A small charm of
      twisted copper wire and knotted cord -- a kin-token -- hangs
      inside his collar.
    culture_aesthetic: >-
      Orvinnic working dress -- deliberately plain, the body itself
      carrying the only marks that matter. The counting-beads and
      kin-token are covenant-kin identifiers, not ornament.
    element_visual: >-
      The iridescent sheen at jaw and temples, the geometric
      covenant-marks on the forearms, the mason's chisel and hammer,
      the counting-beads wound at the left wrist.

  - name: Erso the Furthest-Gone
    role: Pilgrim on the Long Path -- Path-Eater devotee, road-worn, strangely old, walks with a steady unforced rhythm
    type: npc_major
    appearance: >-
      A gaunt human man who looks seventy but moves like fifty, with
      a deeply lined face weathered to the colour of old leather.
      White hair thin and cropped short, the scalp visible and
      sun-darkened beneath. Deep-set grey-green eyes with an
      untroubled steadiness. A long vertical crease between the
      brows as if from decades of looking at a point slightly
      further than the visible horizon. He wears a heavy road-worn
      coat of coarse brown wool, patched at the elbows and hem with
      mismatched cloth from a dozen different stopping-places, the
      collar high and turned against the wind. A round wooden
      pilgrim-token on a leather cord at his throat, stamped with
      an abstract route-sigil worn almost smooth by years of
      thumbing. His boots are resoled in three visible layers, the
      uppers cracked but oiled. A small wooden offering-bowl is
      tucked into his belt, stained dark by use. A walking staff
      of ash-wood, taller than he is, iron-shod and polished where
      his hand grips it.
    culture_aesthetic: >-
      Path-Eater pilgrim dress -- everything worn, everything
      mended, nothing replaced that can be repaired. The coat is
      a walking archive of the road. The pilgrim-token is the only
      formal identifier.
    element_visual: >-
      The patched brown pilgrim-coat, the worn wooden pilgrim-token
      at the throat, the triple-resoled boots, the ash walking
      staff polished at the grip.

  - name: Anesa Vardic
    role: Refuser Scholar -- academic studying the buried stratum ruins, erudite and privately dreading what she has found
    type: npc_major
    appearance: >-
      A slender elven woman who appears to be in her forties by
      human reckoning, with a narrow face, high sharp cheekbones,
      and ears tapering to fine points half-hidden by dark auburn
      hair worn loose and uncombed to her shoulders. Her skin is
      olive-pale, marked under the eyes by the particular
      darkening that comes from sustained reading by poor light.
      She wears a grey researcher's coat of heavy cotton over a
      linen shirt, the coat's pockets distended by notebooks and
      a brass caliper. A waist-chained notebook hangs at her left
      hip, its leather cover rubbed bare at the corners, the
      chain fine brass and long enough to write in without
      unhooking. Her right hand holds a stick of graphite wrapped
      in paper. A roll of inscription-rubbings is tucked under her
      arm in a waxed-canvas tube. At her belt, a small unnamed
      object of pale fluted material, bone-coloured but not bone,
      in a shape that resists casual description.
    culture_aesthetic: >-
      Thessil-descended academic dress -- practical field clothing
      worn past its working life, the grey coat a marker of the
      excavation rather than any university. The unnamed object is
      the one thing she carries that is not a tool.
    element_visual: >-
      The waist-chained notebook at the hip, the waxed-canvas tube
      of inscription-rubbings, the dark circles under the eyes,
      the pale unnamed object at the belt.
