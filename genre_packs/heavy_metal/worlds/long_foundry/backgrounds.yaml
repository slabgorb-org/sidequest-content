# The Long Foundry — WWN Backgrounds, world tier (SRD §1.3)
#
# These 5 ids EXACTLY match the `background:` values in long_foundry's
# genre-tier char_creation.yaml `origins` scene. World-tier replaces
# genre-tier for all long_foundry sessions.
#
# Long Foundry register: guild thaumaturgy as a trade, Perault covenant-debt,
# Astran feeding cults and their arithmetic, Orvinnic labor-kin survival,
# Stratum scholars and the unsettling dig east of the span.
# All skill names must be in heavy_metal/skills.yaml.

- id: Inheritor
  display_name: Inheritor
  description: >-
    Your family carries a covenant one of your ancestors signed with one
    of the six cults or one of the feeding entities that preceded them.
    The bill for it has begun to come due in your lifetime. You did not
    agree to this. The pact does not care. You know what you owe in the
    rough, the way a person knows a debt without having read the contract —
    because the contract reads you, not the other way around.
  free_skill: Know
  quick_skills:
    - Know
    - Connect

- id: Guildborn
  display_name: Guildborn
  description: >-
    You grew up in the guild households of the forge quarter — the Coil
    and Brand's working precinct, where the smell of hot iron and residue
    was the smell of home and every adult knew which month the rates-book
    changed. Magic in your childhood was a guild trade, licensed and
    scheduled, with a rate and a margin and a consequence for going
    off-book. The scars are where they're supposed to be.
  free_skill: Craft
  quick_skills:
    - Craft
    - Work

- id: Covenant-Kin
  display_name: Covenant-Kin
  description: >-
    Your bloodline carries a pact in the body — one of the Orvinnic
    labor-kin households whose compact with the founding guild is written
    into their physiology, not their paperwork. You have always known
    your body is an accounting. You have two names: the one the guild
    uses and the one your household uses when the guild is not listening.
  free_skill: Survive
  quick_skills:
    - Survive
    - Exert

- id: Temple-Reared
  display_name: Temple-Reared
  description: >-
    You were raised in one of the three feeding cult temples — the
    Keepers of the Hour, the Silent Patron's House, or the
    Grievance-Keepers — in the liturgical cold of a precinct where
    every hour of work was a precisely measured payment and the rites
    were also the receipts. The arithmetic of worship is second nature.
    You can still recite the feeding schedule from memory.
  free_skill: Pray
  quick_skills:
    - Pray
    - Administer

- id: Stratum-Born
  display_name: Stratum-Born
  description: >-
    Your family are descendants of the culture whose ruins underlie the
    Long Foundry's bedrock — a civilization older than the current age,
    whose residues are the reason the forges work as well as they do.
    Your elders know things about the eastern dig site that they have
    not told the Coil and Brand Guild. They have not told you why they
    have not told the guild.
  free_skill: Know
  quick_skills:
    - Know
    - Sneak
