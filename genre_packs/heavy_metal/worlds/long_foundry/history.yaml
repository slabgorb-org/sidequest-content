        environment:
          solo: >-
            Warm oil-lamp light from the corner standards at the
            landing meeting cool blue dusk above, the smell of
            dressed stone and the faint sweetness of incense
            carried up from the precinct below, the measured
            three-beat tread of a clergy procession and a single
            soft Hour-bell completing its toll behind them.
          backdrop: >-
            Warm corner lamplight, dressed stone and faint incense,
            the soft measured procession-tread.
      - name: The Coil and Brand Back Rooms
        slug: the_coil_and_brand_back_rooms
        region: forge_quarter
        type: chamber
        description: >-
          A series of warded chambers at the rear of the guild
          hall where the guild's senior council holds its
          unminuted sessions. Reached through a door that is not
          a door. Reached more reliably with an invitation.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of a warded
            council chamber at the rear of a Kragmoor guild hall.
            Foreground: a long oak council-table dressed in unworked
            black wool, twelve heavy chairs set evenly around it
            with the foremost three pulled back as if recently
            vacated, a row of brass tally-stones lined up on the
            wool in front of each seat, an open ledger lying
