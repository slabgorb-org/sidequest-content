# The Long Foundry — World History & DM Prep
#
# Source of truth for chapter structure + points_of_interest.
# Feeds: POI image generator, narrator campaign-maturity prompts.

world_name: The Long Foundry

overview: >-
  A city four hundred years in the working, built on bedrock from an
  older age, kept stable by a formal arrangement between its
  thaumaturgic guild and the three feeding cults that maintain
  temples in its central precinct. The high quarter holds the
  declining Perault houses. The forge quarter holds the working
  guild and the Orvinnic labor-kin households that make the guild's
  work survivable. The eastern hills hold an excavation that has
  recently begun to worry everyone. Every empire is ending. Every
  account is a little overdue. The city is still working, for now,
  and still magnificent.

eras:
  - name: The Guild That Founded
    period: four centuries ago
    summary: >-
      A thaumaturgic guild whose name is no longer spoken in formal
      settings established the first foundries on the span of the
      Graslo, on bedrock that turned out to contain residues from a
      First-Feeder site. The guild prospered for two hundred years
      and then, in a manner that no current account fully explains,
      dissolved. The foundries it built remained in working order.
      Several of the senior guild-scribes went quietly to other
      cities and their books were apparently never recovered.

  - name: The Coil and Brand Succession
    period: two centuries ago
    summary: >-
      The Coil and Brand Guild was founded by senior workshop
      apprentices from the older guild, and took over the foundries
      without ever fully explaining what had happened to their
      predecessors. They stabilised the working practice, formalised
      the rates-book, and began the tradition of publishing every
      month's ledger as a public courtesy. The city's civic
      thaumaturgy has run under Coil and Brand supervision ever
      since, with remarkably few disputes.

  - name: The Ascent of the High Seats
    period: three centuries ago
    summary: >-
      The Perault houses of the high quarter, displaced from older
      seats by the long cascade of covenants coming due across the
      current age, began to relocate to the Long Foundry in
      significant numbers. The high quarter's terraces were built
      out within two generations, and by the end of the century the
      city's political life was being conducted primarily in the
      Perault council chambers rather than the Coil and Brand guild
      hall. The arrangement has since quietly inverted back.

  - name: The Astran Arrival
    period: two centuries ago
    summary: >-
      The three feeding cults — Keepers of the Hour, Silent Patron's
      House, and Grievance-Keepers — negotiated their formal
      presence in the temple precinct over a thirty-year period of
      patient diplomacy. The arrangement they struck with the Coil
      and Brand and the High Seats is the formal basis of the city's
      continuing stability, and is the document most often referred
      to when anyone asks how the Long Foundry is still standing
      when so many of its age-peers are not.

  - name: The Quiet Century
    period: one to two centuries ago
    summary: >-
      A long period during which very little happened that anyone
      wished to record in detail. The foundries ran. The temples
      were fed. The houses declined in an orderly manner. A small
      number of covenants came due and were met. The Kin Lanes
      established their stable households at the lower edge of the
      forge quarter and became, quietly, indispensable.

  - name: The Present Year
    period: now
    summary: >-
      The Long Foundry is still working and still beautiful. The
      Coil and Brand's ledgers remain balanced. The temples are
      current on their offerings. The High Seats are operating on
      borrowed time, which is a normal condition for them. The
      only unusual development is the excavation in the eastern
      hills, which began five years ago, was producing artifacts
      two years ago, and has been producing progressively more
      anxious correspondence for the past twelve months.

# ─────────────────────────────────────────────────────────────────────
# CAMPAIGN STRUCTURE
# Three tiers: city-jobs → the quiet crack → the dig in the hills.
# ─────────────────────────────────────────────────────────────────────

chapters:
  # ───────────────────────────────────────────────────────────────────
  # EARLY (Sessions 1-5): Small work, honest rates
  # ───────────────────────────────────────────────────────────────────
  - id: early
    label: "The Rates-Book"
    session_range: [1, 5]
    location: "The forge quarter and the Long Span"
    atmosphere: >-
      Smoke braided with the residue of the day's thaumaturgy, thin
      and sweet over the Graslo. The Coil and Brand's rates-book is
      posted fresh at the guild hall each dawn. The Kin Lanes smell
      faintly of warm iron and clean linen. River Warden whistles
      carry from the span in three tones — all clear, attention,
      stand aside. The temple precinct across the river is
      preternaturally quiet, and the air above it has measurable
      weight.
    active_stakes: >-
      The Coil and Brand has posted a small-run of outsider
      commissions: a misfiled tally to retrieve from a tavern, a
      Thessil complaint to hear out at the Kin Lanes, a letter to
      carry to a feed-keeper who prefers not to leave her temple.
      None of the jobs look like anything. Most of them are. One
      of them is the first loose thread of the next two chapters,
      and the guild will not tell you which.
    character:
      archetype: Grey Thaumaturge
      name: ""
      culture: Kragmoor working-class or Orvinnic covenant-kin
      level: 2
      hp: 18
      max_hp: 18
      ac: 12
      backstory: >-
        Arrived in the Long Foundry with a small commission, a
        smaller purse, and a letter of introduction to a junior
        scribe at the Coil and Brand. Keeps honest books and a
        longer memory than the job formally requires. Is starting
        to understand that in this city every favor is recorded
        and every silence is a balance.
      personality: >-
        Formal, careful, slow to spend a word twice. Believes that
        the proper unit of thaumaturgic practice is the audit
        trail.
      items:
        - travelling_cloak_grey
        - brass_pen_nib_set
        - calfskin_ledger_half_full
        - warded_letter_sealed
        - guild_lodgings_chit
        - {catalog: ritual_knife_plain, name: "Accountant's Edge", lore: "Inherited from a grandmother who used it to draw circles, not blood."}
      gold: 12
      affinities:
        Forge: {tier: 1, progress: 3}
        Ledger: {tier: 1, progress: 5}
        Rite: {tier: 0, progress: 2}
        Covenant: {tier: 0, progress: 1}
        Strata: {tier: 0, progress: 0}
    npcs:
      - archetype: Grey Thaumaturge
        name: Senior Scribe Halvard Coil
        location: Coil and Brand guild hall, the rates-book desk
        disposition: 20
        personality: >-
          Thirty years at the desk. Keeps his cuffs clean through
          any ledger work. Speaks to outsiders as equals until they
          prove they aren't.
      - archetype: Feed-keeper
        name: Prefect Isola Hours-of-the-Hour
        location: Temple precinct, Keepers of the Hour tally-hall
        disposition: 10
        personality: >-
          Senior feed-keeper. Hands always clasped in front of her,
          never behind. Speaks in the formal register and has for
          so long it is no longer a register.
      - archetype: River Warden
        name: Warden-Captain Vos Graslo
        location: The Long Span, north-bank guardhouse
        disposition: 15
        personality: >-
          A Warden since before most Wardens. Hears everything that
          passes the city and remembers all of it. Owes no one and
          is owed by almost everyone.
      - archetype: Kin Elder
        name: Matriarch Enna of the Lower Lanes
        location: Kin Lanes, the elder-house at the river's edge
        disposition: 25
        personality: >-
          Orvinnic elder. Physiologically entangled with the foundry
          residues; her skin is faintly iridescent in the right
          light. Speaks for the Kin Lanes when the Kin Lanes choose
          to speak, which is rarely.
    points_of_interest:
      - name: The Coil and Brand Guild Hall
        slug: coil_and_brand_guild_hall
        region: forge_quarter
        type: guild_hall
        description: >-
          The senior working guild's hall at the head of the Long
          Span. A wide publication wall at the entrance displays the
          current rates-book and the previous month's ledger, both
          maintained in a scribe-hand so regular it is nearly
          printing. The back rooms are warded. The front rooms are
          not. The difference is the whole shape of the city.
        visual_prompt:
          solo: >-
            Wide ground-level landscape view of a Kragmoor guild
            hall facade at the head of a great stone span. Foreground:
            a wide publication wall of slate-dark stone set under a
            colonnaded portico, the rates-book and a ledger pinned
            open under hinged glass on a sloped iron-bracketed
            reading-shelf, the surface marks regular and abstract,
            two brass tally-boxes bolted to the stone beneath. Middle
            ground: heavy iron-banded oak doors standing slightly
            ajar with a guild-mark plaque of dark bronze above the
            lintel — a coil through a brand-iron — and behind the
            doors a flagged entrance hall lit by oil-lamps in iron
            sconces, a clerk visible at a side-desk. Background: the
            buttressed mass of the guild hall rising in coal-soot
            stone with narrow shuttered windows, the river span
            curving away to the south through morning mist. Overcast
            grey dawn, no sun, smoke smudging the upper facade.
          backdrop: >-
            The slate-dark facade of a Kragmoor guild hall at the head
            of a great stone span, a colonnaded publication wall
            beneath iron-banded doors, narrow shuttered windows above,
            dawn mist along the river.
        environment:
          solo: >-
            Flat grey dawn light from frame-left, the sweet thin
            smell of foundry-smoke threaded with sealing wax and
            damp slate, a measured iron clanking from the foundries
            uphill and the distant call of a River Warden's whistle
            on three tones from the span.
          backdrop: >-
            Flat dawn light, foundry-smoke and damp stone, the muffled
            iron rhythm of the morning shift.
      - name: The Kin Lanes
        slug: the_kin_lanes
        region: forge_quarter
        type: district
        description: >-
          A district of narrow stepped streets between the foundries
          and the river, where the Orvinnic labor-kin households
          keep quiet, orderly courts. The air carries a faint iron
          sweetness; the walls are washed with a mineral solution
          every dawn; the children play a counting game whose rules
          have not changed in a hundred and fifty years.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view down a narrow stepped
            street between tall stone tenements at the river's edge.
            Foreground: worn slate steps descending toward the
            Graslo, the riser-stones still wet from a dawn washing
            in pale mineral solution that has dried in faint bluish
            efflorescence at the joints, a copper pail set
            inverted on a doorstep, three small chalked counting-marks
            on the wall in a hand a century-and-a-half regular.
            Middle ground: timber-shuttered windows above stout iron-
            studded doors, lintels of iron-flecked stone, a single
            Orvinnic elder seated on a stoop with hands folded in
            her lap, her skin faintly iridescent in the slant light.
            Background: the bulk of a Kragmoor foundry rising
            beyond the rooftops, its chimney braided with thin sweet
            smoke. Pre-dawn blue-grey light, oil-lamps still lit in
            wall-niches.
          backdrop: >-
            A narrow stepped street of dark tenement stone descending
            toward a slow river, mineral-washed risers, iron-shuttered
            windows above, a foundry chimney rising in the middle
            distance under pre-dawn blue.
        environment:
          solo: >-
            Cool blue light from frame-front mixed with the warm
            spill of a single oil-lamp in a niche, the faint iron
            sweetness of foundry-residue on damp stone, the smell of
            clean linen drying somewhere unseen, and a children's
            counting-rhyme in low voices carrying from the next
            stair down.
          backdrop: >-
            Cool blue dawn, iron-sweet damp, the muffled rhythm of a
            counting-game carried on still air.
      - name: The Long Span
        slug: the_long_span
        region: forge_quarter
        type: bridge
        description: >-
          The great stone arch that has carried the central axis of
          the Long Foundry for longer than any current ledger
          records. Three carts wide, lit at night by brass lanterns
          maintained by the River Wardens, and watched from both
          banks at all hours. The stone itself has been replaced
          twice. The span has not.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of a great single-arch
            stone bridge crossing a slow grey river at dusk.
            Foreground: the rough cart-worn flagstones of the
            span's deck, the centerline marked by an offering-stone
            of dark basalt carved with the four overlaid sigils of
            three cults and a guild — abstract, not legible —
            polished smooth by generations of touching hands, a
            brass lantern in an iron bracket lit and trembling on a
            tall standard beside it. Middle ground: the parapet
            stones each different in colour where the masonry has
            been twice replaced, a River Warden in a blue-grey
            liturgical coat leaning against the railing with a tin
            whistle on a cord, two carts crossing in opposite
            directions. Background: the temple precinct rising on
            the south bank in raised terraces of pale stone, the
            forge quarter's chimneys smoking on the north, the
            Graslo reflecting last warm light beneath. Dusk amber
            settling into blue.
          backdrop: >-
            A great single-arch stone bridge across a slow grey river
            at dusk, brass lanterns lit on iron standards, a temple
            precinct rising on the far bank, foundry smoke trailing on
            the near.
        environment:
          solo: >-
            Warm amber lantern-light from frame-right meeting cool
            blue dusk from the river, the wet-stone smell of the
            Graslo and the iron tang of the span's railings, the
            three-tone whistle of a River Warden passing the
            all-clear and the soft creak of cart-wheels on stone.
          backdrop: >-
            Mixed dusk amber and river-blue, wet stone and lantern
            oil, the slow rhythm of evening traffic.
      - name: The Temple Precinct (Threshold)
        slug: temple_precinct_threshold
        region: temple_precinct
        type: precinct
        description: >-
          The raised southern terrace where the three feeding cults
          hold their temples. Outsiders enter only through a single
          north-facing gate and only during the formal visiting
          window after the morning tally. The air inside the
          precinct weighs visibly on the back of the tongue. No one
          raises their voice here. No one has ever needed to.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of a raised terrace
            precinct seen through the open arch of a north-facing
            gate. Foreground: a single broad gate-arch of pale
            limestone set into the precinct's outer wall, its
            keystone carved with three nested sigils abstracted past
            legibility, an Astran feed-keeper in a cold-white liturgical
            cope and pale stole standing just inside the arch with
            her hands clasped before her, a small offering-bowl of
            tarnished brass set on a low pedestal beside her.
            Middle ground: paved processional stone leading inward
            and slightly up, its surface so smooth it does not
            echo, three iron oil-lamp standards in a receding line
            with flames burning quiet and unmoving, a single Astran
            scribe seated at a low scribing-desk noting arrivals
            in a waist-chained ledger. Background: the dim silhouettes
            of three temples in pale stone rising in a half-circle
            beyond, their facades carved with restrained ornament,
            incense smoke caught in shafts of high pale window-light.
            Overcast morning, the air visibly heavy.
          backdrop: >-
            A pale limestone gate-arch opening onto a raised terrace
            precinct, three temple silhouettes beyond in soft pale
            stone, iron lamp-standards burning still flames under an
            overcast morning sky.
        environment:
          solo: >-
            Pale grey overcast light from the high windows beyond
            the arch, the close mineral smell of consecrated stone
            and the faint smoke of cold incense, an unnatural hush
            in which the only sound is the soft scratch of a
            scribe's pen and the distant single toll of an Hour-bell.
          backdrop: >-
            Pale grey light, cold incense and dressed stone, the
            preternatural hush of the precinct.
      - name: The Western Gate
        slug: the_western_gate
        region: forge_quarter
        type: gate
        description: >-
          A working gate in the old city wall at the western edge
          of the forge quarter, opening onto the Path-Eater pilgrim
          road. Supervised by the River Wardens and usually open in
          daylight. The first mile of road beyond it is loud with
          pilgrims. The second mile is quieter. The third mile does
          not speak at all unless spoken to.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of an old working
            city-gate set in a stretch of buttressed wall, opening
            outward onto a rutted pilgrim road. Foreground: a small
            River Warden's guard-shack in mortared stone beside the
            archway, a brass lantern hung from an iron hook by the
            door, a worn waymarker stone at the threshold carved
            with a single pilgrim-token sigil rubbed smooth by
            generations of hands, a Warden in blue-grey coat leaning
            on a halberd's haft. Middle ground: the gate-arch itself
            of dark dressed stone with the iron-banded leaves of
            its doors folded back and bolted to the wall, two
            pilgrims in road-worn brown coats and broad hats
            passing through inward with bundles on their backs, the
            ruts of the road descending past them. Background: the
            pilgrim road curving away west between low stone walls
            and thinning farmland, a half-mile waystation shrine
            visible as a small lantern-flame in the morning mist.
            Overcast morning, low pearl-grey light.
          backdrop: >-
            An old stone gate-arch set in a buttressed city wall,
            iron-banded doors folded back, a rutted pilgrim road
            descending west into morning mist, a small Warden's
            guard-shack at the threshold.
        environment:
          solo: >-
            Pearl-grey morning light from frame-front, the smell of
            wet stone and road-dust and the cold lamp-oil of the
            guard-shack, the soft tramp of pilgrim boots on packed
            earth and the distant single tap of a Warden's whistle
            answering itself from further down the wall.
          backdrop: >-
            Pearl-grey light, wet stone and road-dust, the slow tramp
            of pilgrims passing the gate.
      - name: The Ascending Way
        slug: the_ascending_way
        region: high_quarter
        type: road
        description: >-
          A paved street climbing from the river span through the
          temple precinct and up into the lower terraces of the
          high quarter. The stones are older than most of the
          houses on it. The house-guards nod to outsiders in guild
          grey and do not nod to anyone else.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of a paved processional
            street climbing a southern slope between old stone
            houses at dusk. Foreground: large flagstones worn into
            shallow centre-grooves by generations of foot-traffic,
            a low retaining wall to the left in pale tarnished stone
            topped with a wrought-iron rail of fading lacquer, an
            iron lamp-bracket set into the wall holding a single
            oil-lamp newly lit. Middle ground: a Perault house-guard
            in muted indigo livery and a black braided coat standing
            at the foot of a stair to a private courtyard, his hand
            resting on the pommel of an ornate but unworn rapier,
            two pedestrians in guild-grey passing him with formal
            nods returned. Background: the terraces rising in
            receding tiers of old stone facades, narrow shuttered
            windows, ornate plaster cornices flaking at their edges,
            a slow drift of foundry-smoke from far below catching
            the last warm light. Dusk amber failing into blue.
          backdrop: >-
            A paved processional street climbing a southern slope at
            dusk, old stone terraces rising in tiers, an iron lamp-
            bracket lit on a retaining wall, drifting foundry-smoke
            catching last warm light below.
        environment:
          solo: >-
            Last amber dusk-light from frame-low-right meeting cool
            blue rising shadow from above, the smell of cool
            tarnished stone and the faint sourness of unwashed
            plaster, the muffled tramp of a house-guard's boots and
            a far-down bell ringing once for a death in a family.
          backdrop: >-
            Dusk amber failing to blue, cool stone and old plaster,
            the single tolling of a death-bell carried up the slope.
    tropes:
      - id: the_three_cult_arrangement_cracks
        status: dormant
        progression: 0.05
        notes:
          - "A prefect of the Silent Patron's House was seen leaving the Keepers' temple wearing an expression."
      - id: the_stratum_camp_goes_silent
        status: dormant
        progression: 0.03
        notes:
          - "A courier returned from the camp ordered two drinks at the Kin Lanes and did not speak to anyone."

  # ───────────────────────────────────────────────────────────────────
  # MID (Sessions 6-15): The arrangement develops a crack
  # ───────────────────────────────────────────────────────────────────
  - id: mid
    label: "A Crack in the Arrangement"
    session_range: [6, 15]
    location: "The temple precinct and the high quarter"
    atmosphere: >-
      The rates-book is posted on time, but the second entry is a
      correction the scribes won't discuss. The Grievance-Keepers
      are rationing a small miraculous output in the Kin Lanes and
      blaming "seasonal adjustment." A Perault house in the high
      quarter has stopped receiving callers without explanation,
      and the Ascending Way is quieter than it should be for this
      week of the month. The Coil and Brand has called three
      emergency sessions in a month, none of them minuted.
    active_stakes: >-
      A calendar dispute between the Keepers of the Hour and the
      Silent Patron's House over the apportionment of the annual
      refined-tally offering is no longer private. A senior
      feed-keeper has spoken to an outsider — which is to say,
      asked for help without asking. The High Seats are trying to
      intervene, which is usually how the High Seats make things
      worse. The River Wardens know more than they are saying.
    character:
      level: 5
      hp: 36
      max_hp: 36
      ac: 14
      milestones_earned:
        - "triumph:Carried a warded document across the temple precinct and delivered it whole"
        - "connection:Matriarch Enna now speaks to you without clearing her throat first"
        - "discovery:Read a ledger entry that was supposed to have been struck through"
        - "covenant:Accepted a small formal obligation from a High Seat"
    npcs:
      - archetype: Feed-keeper
        name: Prefect Isola Hours-of-the-Hour
        location: Temple precinct, Keepers of the Hour tally-hall
        disposition: 25
        personality: >-
          Has begun to close her door for certain visitors. Has not
          begun to close it for you.
      - archetype: Feed-keeper
        name: Under-Prefect Dannic of the Silent Patron
        location: Temple precinct, Silent Patron's House
        disposition: -5
        personality: >-
          Younger, ambitious, certain the Keepers have been over-
          served for a century and willing to say so at the wrong
          council. Brilliant at arithmetic. Clumsy at everything
          else.
      - archetype: High Seat
        name: Lady Mireille of House Varant
        location: High quarter, the Varant terrace
        disposition: 5
        personality: >-
          Head of a declining house that has not yet admitted the
          decline. Receives callers in a withdrawing room that has
          not been repainted in a generation. Keeps her covenants
          meticulously and her staff in poverty.
    points_of_interest:
      - name: The Keepers of the Hour Temple
        slug: keepers_of_the_hour_temple
        region: temple_precinct
        type: temple
        description: >-
          The eldest of the three temples in the precinct, its
          facade carved with nested calendar-wheels that turn at
          dawn and dusk without visible mechanism. The tally-hall
          inside holds the master register of the city's offerings,
          kept in a bound volume so heavy it requires two scribes
          to open. Prefect Isola presides. The door closes on its
          own when an arbitration is being held.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of the interior tally-hall
            of an Astran feeding-temple. Foreground: a long oak
            tally-table polished by centuries of forearm-traffic,
            the master register lying open across its centre — a
            bound volume so heavy two leather scribe-pads support
            its spine, its pages marked in abstract entry-strokes
            rather than legible script, a brass quill-stand and a
            row of iron tally-stones aligned beside it. Middle
            ground: Prefect Isola in cold-white liturgical robes
            and a pale stole standing with her hands clasped before
            her, two junior scribes seated either side of the
            register, the heavy iron-banded door of the hall
            standing slightly open beyond them. Background: the
            inner wall of the temple in pale dressed limestone
            carved with nested calendar-wheels turning at the corners,
            oil-lamps chained in pairs from the high vaulted ceiling,
            incense smoke caught in a single shaft of pale window-
            light high above. Dim devotional interior, mostly lamp-glow.
          backdrop: >-
            The interior of an Astran tally-hall in pale dressed
            limestone, calendar-wheel carvings on the inner walls,
            oil-lamps chained in pairs from a vaulted ceiling, the
            master register open on a long oak table.
        environment:
          solo: >-
            Warm oil-lamp light from the chained pair above frame-
            centre meeting a single shaft of pale window-light from
            high above, the dry-paper smell of old vellum and cold
            incense, a soft regular ticking that has no visible
            source and the muffled single toll of the Hour-bell
            marking the third interval.
          backdrop: >-
            Warm chained lamplight, vellum and incense, the regular
            ticking of an unseen Hour-mechanism.
      - name: The Silent Patron's House
        slug: the_silent_patrons_house
        region: temple_precinct
        type: temple
        description: >-
          The most politically connected of the three temples, its
          approach paved in a stone that does not echo. The entrance
          hall is hung with the silk records of every formal
          arrangement the cult has entered since its founding, each
          embroidered in threads that shift color if the terms are
          violated. The threads have recently begun to darken.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of the entrance hall
            of a temple to a name-eating cult. Foreground: a long
            paved approach in dark non-echoing stone leading toward
            the temple's open doors, a low offering-pedestal of
            tarnished brass set to one side bearing a single sealed
            envelope, the floor reflecting nothing. Middle ground:
            the entrance hall itself rising into the temple's
            interior — both walls hung with vertical silk records
            in long banners, each silk embroidered in coloured
            threads now darkening unevenly along one upper row,
            the lower rows still bright, hung from polished brass
            rods spanning the full height of the hall. A name-keeper
            in soft dove-grey vestments stands halfway along the
            row, hand raised toward but not touching one banner.
            Background: a private silence-room visible through a
            far archway, its threshold curtained in unbleached
            linen, a single oil-lamp's soft glow within. Dim
            devotional interior, lamp-lit, the air itself unmoved.
          backdrop: >-
            The dim entrance hall of a temple in non-echoing stone,
            long silk-record banners hung from brass rods darkening
            unevenly along one row, a curtained silence-room visible
            through a distant archway.
        environment:
          solo: >-
            Soft oil-lamp glow from low brass standards along both
            walls, the cool faint smell of clean linen and dressed
            stone, an absence of echo so complete the air seems
            held, the only sound the soundless drift of a banner
            in a draft that does not exist.
          backdrop: >-
            Soft lamp-glow, clean linen and cool stone, the
            preternatural absence of echo.
      - name: The Grievance-Keepers' Temple
        slug: the_grievance_keepers_temple
        region: temple_precinct
        type: temple
        description: >-
          The least well-funded of the three temples, and
          consequently the most anxious. Its interior courtyard
          holds a ledger-tree — a living specimen trained to grow
          in the shape of the temple's unresolved claims. The tree
          is visibly healthier this season than it has been in
          years, which is not a compliment.
        visual_prompt:
          solo: >-
            Wide ground-level landscape view of the interior
            courtyard of a small underfunded temple. Foreground:
            cracked flagstones with weeds at the joints, a small
            stack of un-collected complaint-scrolls in a pewter
            tray on a low stone pedestal, an iron lamp-stand with
            a single guttering tallow candle in a tin holder
            beside it. Middle ground: the ledger-tree itself — a
            living blackthorn trained against an iron espalier-
            frame into the asymmetric shape of an unresolved
            claim-ledger, its branches heavy with new dark leaves
            and fresh blackthorn fruit this season, the espalier-
            frame's iron rusted but the growth thick on it. A
            grievance-eater in worn fawn-grey vestments stands at
