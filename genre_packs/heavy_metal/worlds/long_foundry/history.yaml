  # ───────────────────────────────────────────────────────────────────
  # VETERAN (Sessions 16+): The dig in the hills
  # ───────────────────────────────────────────────────────────────────
  - id: veteran
    label: "What the Scholars Learned"
    session_range: [16, 99]
    location: "The Old Herding Track and the Stratum Camp"
    atmosphere: >-
      The week out of the city is long and quiet and each day
      quieter than the last. The Thessil waystation is half-empty.
      The track beyond it is not hostile, exactly, but the ground
      is no longer cooperating — slopes that should be an hour's
      climb take two, waymarkers appear in places nobody
      remembers setting them, and the wind on the high ridges
      sounds briefly, once per evening, like a name being read
      from a list. At the camp, the scholars are still working.
      That is the problem.
    active_stakes: >-
      The Coil and Brand has posted a private commission: travel
      to the camp, carry a specific document back, and bring a
      written assessment of whether the camp should be formally
      closed. The reward is better than the work looks. The
      temples are watching. The High Seats are offering — for
      the first time in a generation — to underwrite a second
      party with house gold. Something at the camp has begun
      affecting visitors in a way no courier has been willing to
      describe in writing.
    character:
      level: 9
      hp: 62
      max_hp: 62
      ac: 16
      milestones_earned:
        - "covenant:Named in a formal arrangement between a cult and a High Seat"
        - "discovery:Read a stratum layer nobody has read for six centuries"
        - "betrayal:Watched a cult representative deliver a ruling they knew to be wrong"
        - "connection:Accepted the Matriarch's mineral cup"
        - "revelation:Learned what the older guild did not survive learning"
    npcs:
      - archetype: Refuser Scholar
        name: Scholar-Chief Anesa Vardic
        location: The Stratum Camp, main tent
        disposition: 0
        personality: >-
          Head of the excavation. Composed, careful, and visibly
          aware of a thing that she is not yet willing to name to
          an outside party. Her correspondence to the city has
          been drafted, over the last year, in a hand that grows
          steadier the more it says nothing.
      - archetype: Refuser Scholar
        name: Cataloguer Pel Vornis
        location: The Stratum Camp, artifact tent
        disposition: 10
        personality: >-
          Junior scholar. Still cares about the work in the way
          one cares about work when one has not yet understood
          what the work is. The only person at the camp who will
          show a visitor the stratum directly.
      - archetype: Thessil Herder
        name: Herd-Mother Kelu of the Northern Slopes
        location: The Thessil Waystation, mid-route
        disposition: 20
        personality: >-
          Fourth-generation Thessil. Runs the waystation as
          courtesy and warning. Will trade news, shelter, and a
          particular kind of tea that is supposed to help with
          the ridge-wind. Believes the courtesy is in the
          warning, not the tea.
    points_of_interest:
      - name: The Old Herding Track
        slug: the_old_herding_track
        region: stratum_hills
        type: road
        description: >-
          A thin track climbing from the north bank into the
          eastern hills, following routes laid down by Thessil
          herders generations ago. A week's walk in good weather.
          Every quarter-mile is marked by a small cairn, and
          lately several cairns have appeared that the Thessil
          say they did not place and cannot be persuaded to
          remove.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of a thin herder's track
            climbing across rolling hill-country. Foreground: a
            single hand-laid Thessil cairn of seven flat stones
            stacked beside the track, the topmost stone marked
            with a single Thessil notation in a hand that predates
            ledgers, a thin film of pale dust on the cairn's
            shoulder undisturbed by recent feet. Middle ground:
            the track itself a thin scar of compacted earth
            curving between tussocks of dry hill-grass and low
            wind-bent thorn, a second cairn visible thirty paces
            on but built differently from the first — eleven
            stones, stacked without the Thessil's measured
            asymmetry, the top stone unmarked. Background: the
            land rising in receding folded ridges toward the
            stratum hills, a single Thessil herder in a long
            felted coat visible as a small figure descending a
            distant slope. Overcast late afternoon, the light
            high and flat.
          backdrop: >-
            A thin herder's track climbing across folded hill-country
            under flat overcast light, dry tussock-grass and low
            thorn, two Thessil cairns marking the verge at uneven
            intervals.
        environment:
          solo: >-
            Flat pale overcast light from a high featureless sky,
            the cold dry smell of hill-grass and wind-broken thorn,
            a low wind across the track audible as a long
            shouldering breath and, once per long minute, a sound
            like a name being read from a list on the higher
            ridge.
          backdrop: >-
            Flat overcast, cold grass and broken thorn, the long
            shoulder of an unsettled wind.
      - name: The Thessil Waystation
        slug: the_thessil_waystation
        region: stratum_hills
        type: waystation
        description: >-
          A stone-walled herder's waystation at the halfway point
          of the Old Herding Track, maintained by the Thessil for
          the courtesy of travellers they do not necessarily
          approve of. A low fire, a wooden bench, and a cup of
          mineral tea for anyone who asks. The roof is reinforced
          against a wind that, locally, has begun to carry words.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of a low stone-walled
            herder's waystation at a ridge-bend. Foreground: a
            wooden bench worn pale by weather set against the
            outer wall of dry-stacked flat stones, a hand-fired
            clay cup on the bench beside a brass kettle in a
            covered niche, the cup containing a measured pour of
            pale mineral tea. Middle ground: the waystation
            itself, a single low rectangular structure with a
            steeply pitched roof reinforced by heavy cross-beams
            cut from older mountain timber and pinned with iron
            bolts at every joint, the open doorway showing a small
            interior with a banked turf fire on a flagged hearth
            and an iron tripod over it. Herd-Mother Kelu stands
            inside the doorway, an older Thessil woman in a long
            felted coat with stem-name embroidery at the collar
            and unusual irregular-shaped pupils caught in the
            firelight. Background: the high stratum hills rising
            beyond, the Old Herding Track curving up out of frame.
            Overcast late afternoon, the sky low and grey.
          backdrop: >-
            A low stone-walled herder's waystation with a heavily
            cross-beamed pitched roof at a ridge-bend, a worn
            wooden bench against the outer wall, the stratum hills
            rising beyond under overcast sky.
        environment:
          solo: >-
            Cool grey overcast from frame-front meeting the warm
            spill of a banked turf fire through the open doorway,
            the smell of burnt turf and mineral tea and felted
            wool, a steady low wind against the reinforced roof
            and, once, a faint syllable in the wind that does not
            belong to any local language.
          backdrop: >-
            Cool grey light, burnt turf and mineral tea, a steady
            wind against a roof reinforced against words.
      - name: The Stratum Camp (Outer)
        slug: the_stratum_camp_outer
        region: stratum_hills
        type: camp
        description: >-
          The outer ring of the Refuser-site excavation: tents
          arranged in a half-circle around a central fire pit
          that is kept burning at all hours. Ropes strung between
          tent poles carry notation-flags whose shorthand would
          take a scholar a season to read. Everything in the
          outer ring is normal. The wrongness begins at the
          rope-line.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of a small academic
            field camp in a high-valley clearing. Foreground: a
            central fire pit ringed with flat field-stones, the
            fire kept low and steady, a battered iron kettle
            chained over it on a tripod, three folding camp-stools
            arranged around with one occupied by a scholar in a
            grey researcher's coat writing in a waist-chained
            notebook. Middle ground: six waxed-canvas tents
            arranged in a half-circle facing the fire, their
            ridge-ropes strung between poles and hung with small
            notation-flags of folded grey linen, each flag marked
            in abstract shorthand strokes. Two scholars stand
            near the central tent in conversation, their hands
            clasped behind their backs. Background: a thin rope-
            line of taut hemp marks the edge of the camp half-
            way to a darker stand of timber where the rising
            ground turns toward the dig site, the trees beyond
            unnaturally still. Overcast late afternoon, the light
            beginning to fail.
          backdrop: >-
            A small academic field camp of six waxed-canvas tents
            ringing a low central fire pit, notation-flags strung
            between tent-poles, a taut rope-line at the camp's
            edge with a darker stand of timber rising beyond.
        environment:
          solo: >-
            Cool overcast light from frame-front meeting the warm
            steady glow of the central fire, the smell of waxed
            canvas and turf-smoke and the faintly sour mineral
            note of recent residue-handling, a low constant
            scholarly murmur and an absolute silence from the
            timber beyond the rope-line.
          backdrop: >-
            Cool overcast with central fire-glow, canvas and
            turf-smoke, the silence beyond the rope.
      - name: The Artifact Tent
        slug: the_artifact_tent
        region: stratum_hills
        type: chamber
        description: >-
          The cataloguer's tent, lit by brass lanterns burning at
          half the oil a brass lantern usually takes. The
          artifacts are arranged on felt pads in the order they
          came out of the stratum. The most recent pad is empty.
          Pel Vornis can tell you, if you ask kindly, what was
          on it yesterday.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of the interior of
            a cataloguer's research tent. Foreground: a long
            scholar's bench of unstained pine running the length
            of the tent, covered in seven dark felt pads arranged
            in sequence — the first six bearing Refuser-site
            artifacts of pale fluted bone-coloured material in
            unfamiliar non-symmetric shapes, the seventh pad bare
            and slightly darker where something rested on it.
            Two brass lanterns set on iron hooks at frame-left
            burn with flames smaller than their oil-supply
            warrants. Middle ground: the cataloguer Pel Vornis
            seated on a folding stool at the bench, a junior
            scholar in a grey coat with a waist-chained notebook
            open across one knee, a pen-nib held above the page
            unmoving. Background: the inner canvas of the tent
            in waxed grey-brown, ridge-rope visible above with
            a single small notation-flag pinned to it, the open
            tent-flap at the rear admitting a thin strip of cool
            outdoor light. Dim canvas interior, lantern-lit.
          backdrop: >-
            The waxed-canvas interior of a cataloguer's research
            tent, a long pine bench covered with seven dark felt
            artifact-pads, two brass lanterns on iron hooks
            burning lower than they should.
        environment:
          solo: >-
            Subdued warm lantern-light from frame-left meeting a
            thin cool draft from the open rear flap, the dry
            smell of unfamiliar pale mineral and waxed canvas
            and old notebook-leather, an unnatural quality to
            the silence in which the lantern-flames make no
            sound and even the pen-nib does not scratch.
          backdrop: >-
            Subdued lantern-glow with cool draft, pale mineral
            and waxed canvas, an unnaturally complete silence.
      - name: The Open Face of the Stratum
        slug: the_open_face_of_the_stratum
        region: stratum_hills
        type: dig_site
        description: >-
          The excavation face itself: a vertical cut into the
          hillside where the Refuser layer has been exposed in
          two meter-wide steps. The stratum reads, to anyone with
          the training, like a ledger kept by something that had
          good reasons to stop keeping ledgers. The deeper steps
          are the worst. The deepest step is not a step.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of an excavated stratum-
            face cut into the side of a hill. Foreground: the
            uppermost cut step in pale crumbled earth, a single
            iron pickaxe leaning against the riser, three scholar's
            chalk-marks (abstract, non-legible) drawn along the
            cut edge to mark a band of interest. Middle ground:
            the stratum descending in two-metre-wide steps cut
            cleanly into older and progressively darker bedded
            stone, each riser a different layer of the deep past
            — pale grey, then iron-red, then a curious near-black
            band striated with thin pale lines that do not follow
            the geology. A single Refuser scholar in a grey coat
            stands on the second step holding a brass lantern
            unlit, facing downward. Background: the deepest visible
            cut at the bottom of frame — a vertical face of
            absolute black where the stratum reads less as rock
            than as edge, the surrounding earth pulled back from
            it as if reluctant. Late afternoon, the high sky's
            cool grey light not quite reaching the lowest face.
          backdrop: >-
            A stratum-face cut into a hillside in two-metre steps,
            pale grey above iron-red above a near-black band, the
            lowest visible cut a vertical face of absolute black
            under cool grey afternoon light.
        environment:
          solo: >-
            Cool late afternoon light from a high featureless sky
            from frame-above, the dry mineral smell of pale earth
            and the colder smell of something below that resembles
            wet metal, a wind that the upper steps register and
            the lower steps do not, and a silence at the deepest
            face deeper than the silence above it.
          backdrop: >-
            Cool grey light failing into the cut, dry pale earth
            above and cold wet-metal smell below, a wind that
            does not reach the lowest step.
      - name: The Counting Stones
        slug: the_counting_stones
        region: stratum_hills
        type: landmark
        description: >-
          A ring of seven upright stones half a mile above the
          camp on the ridge-line, each one marked with a single
          notation in a hand that predates the Thessil by several
          centuries. The scholars have not yet formally catalogued
          them because they cannot agree on how many there are.
          The Thessil do not go near them and will not explain.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of a ring of upright
            standing stones on an open ridge-line. Foreground:
            three rough monoliths of weathered dark stone set
            close together at the near edge of the ring, each
            taller than a man, each bearing a single notation
            mark carved deep at chest-height in a hand older
            than any local language (abstract, geometric, non-
            legible). The earth at their bases is bare in a
            patch where neither grass nor moss grow. Middle
            ground: four more uprights spaced unevenly across
            the centre of the ridge, their relative positions
            not quite forming a clean ring — possibly six, or
            possibly eight, the eye unable to settle. A thin
            ground-mist clings to the bases of all the stones
            though not to the grass between them. Background:
            the ridge falling away to either side into the
            wider stratum hills, the camp's small fire-glow
            visible as a distant point half a mile below in
            the failing light. Dusk, the western sky a flat
            bone-pale wash.
          backdrop: >-
            A ring of weathered dark standing stones on an open
            ridge-line at dusk, the count unclear, thin ground-mist
            clinging only to the stones' bases, the camp's fire a
            distant point in the valley below.
        environment:
          solo: >-
            Cool bone-pale dusk light from the western sky, the
            cold smell of bare un-grassed earth and the absence
            of any other smell at all, a windless quiet at the
            ring's centre that is not the same quiet as the
            wind-carrying ridges to either side, and the steady
            silence of stones that have been counted often and
            never twice the same.
          backdrop: >-
