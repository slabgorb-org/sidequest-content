          backdrop: >-
            The cracked-flag courtyard of a small temple under
            overcast sky, a blackthorn ledger-tree trained against
            a rusted iron espalier at the centre, weathered
            limestone walls with flaking plaster cornices.
        environment:
          solo: >-
            Pearl-grey overcast light from directly overhead, the
            warm dry smell of dust and the cold green smell of
            new blackthorn growth, the soft single drip of
            yesterday's rain from a corner of the frame and the
            distant city's foundry-hammer rhythm carried over the
            precinct wall.
          backdrop: >-
            Pearl overcast, dust and new blackthorn, the muffled
            foundry-hammer beyond the wall.
      - name: The Varant Terrace
        slug: the_varant_terrace
        region: high_quarter
        type: estate
        description: >-
          The formal seat of House Varant, halfway up the southern
          slope. A walled garden, a narrow bell-tower that rings
          only for deaths in the family, and a withdrawing room
          where every ledger in the house is kept under a glass
          dome that has not been opened in a year. The callers'
          book by the front door is nearly empty.
        visual_prompt:
          solo: >-
            Wide three-quarter landscape view of the front facade
            of a declining Perault house on a southern slope at
            dusk. Foreground: a wrought-iron gate of fading black
            lacquer set in a low garden wall of pale dressed stone,
            the gate standing closed but unlocked, a small brass
            callers'-box mounted on its post with a leather-bound
            book inside visible through a glass pane — the book
            nearly closed, only one or two entries on the topmost
            page in abstract pen-strokes. The walled garden visible
            beyond shows trimmed boxwood gone slightly leggy and a
            single statue of a kept ancestor on a moss-streaked
            pedestal. Middle ground: the house facade itself in
            tarnished pale stone, two stories with tall narrow
            shuttered windows, the front door of oiled walnut with
            a tarnished brass knocker, embroidered hems of a curtain
            pulling from the inside of a downstairs window. A
            narrow bell-tower rises to the left, a single iron bell
            visible in its open belfry, silent. Background: the
            terraced rooftops of the high quarter receding behind
            the house, the river far below catching the last
            warm light. Dusk amber failing to blue.
          backdrop: >-
            The front facade of a declining stone house on a southern
            slope at dusk, wrought-iron gate fading to grey, a walled
            garden visible beyond, a narrow bell-tower rising silent
            against the dusk sky.
        environment:
          solo: >-
            Last warm dusk-light from frame-low-right meeting cool
            rising shadow over the upper facade, the dry cool smell
            of tarnished stone and unopened lavender, the absolute
            quiet of a house no longer receiving callers and the
            faint creak of a shutter loose in an upstairs window.
          backdrop: >-
            Dusk amber to blue, cool stone and old lavender, the
            absolute hush of a house no longer answering.
      - name: The Terrace Stair
        slug: the_terrace_stair
        region: high_quarter
        type: road
        description: >-
          The broad stone stair rising directly from the temple
          precinct into the lower streets of the high quarter.
          Used for formal processions from the cults to the
          houses, and — less formally — by anyone who wants to
          move between the precincts without crossing the Long
          Span in public view.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view looking up a broad
            ceremonial stair of pale dressed stone climbing from
            the temple precinct into the lower terraces of the
            high quarter. Foreground: shallow risers worn into
            shallow centre-grooves, a wide processional landing
            at the base with a low offering-stone of dark basalt
            in its centre carved with the abstract sigil of an
            Astran procession, two iron lamp-standards at either
