            chamber's stone walls panelled in dark waxed oak,
            three guttering tallow candles in a wrought-iron
            standard providing the only light, the far corners
            in deep ink shadow. Dim interior, candle-lit.
          backdrop: >-
            A warded council chamber in dark waxed oak panelling,
            a long oak table dressed in black wool with twelve
            chairs, iron-banded doors with shallow sigil-carvings,
            a wrought-iron candle-standard providing the only light.
        environment:
          solo: >-
            Warm candle-light from frame-front-right with deep ink
            shadow in the far corners, the close dry smell of
            beeswax and salt-residue and old waxed oak, an absolute
            absence of street-sound and the soft regular drip of
            tallow into a brass catch-tray.
          backdrop: >-
            Warm candle-light with ink-shadow, beeswax and salt-
            residue, the close hush of a warded room.
      - name: The Pilgrim Road (Second Mile)
        slug: the_pilgrim_road_second_mile
        region: pilgrim_road
        type: road
        description: >-
          The stretch of the Path-Eater pilgrim road beyond the
          busy first mile, where waystation shrines sit at half-
          mile intervals and the quiet begins to sink into the
          landscape. Pilgrims note, recently, that this stretch
          feels longer than it was. They comment on this to each
          other and not to anyone else.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view down a rutted pilgrim
            road in the elegiac hour. Foreground: twin parallel
            cart-ruts pressed deep into pale earth, a single
            waymarker stone at the verge carved with the
            pilgrim-token sigil of the Path-Eater cult — abstract,
            worn nearly smooth — and a small cairn of stacked
            offering-pebbles built against its base by passing
            devotees. A single hooded Path-Eater pilgrim walks
            away from frame with a road-worn brown coat and a
            wooden token on a cord at the neck, their stride long
            and patient. Middle ground: a half-mile waystation
            shrine of mortared stone with an iron lamp-bracket
            holding an unlit oil-lamp, the shrine's open niche
            empty save for a small wooden offering-bowl, the
            road continuing past it between low dry-stone walls.
            Background: the road receding into low rolling
            farmland under a high pale sky, the next waystation
            visible as a distant pale dot too far for the
            half-mile it should be. Late afternoon, the light
            failing to cool blue.
          backdrop: >-
            A rutted pilgrim road descending into low rolling
            farmland between dry-stone walls, a waymarker carved
            with a worn cult sigil, a half-mile waystation shrine
            in mortared stone with an iron lamp-bracket.
        environment:
          solo: >-
            Cool late afternoon light from frame-front meeting a
            lower silver glow on the road's surface ahead, the
            smell of dry earth and cold lamp-oil and crushed
            roadside herbs, a windless silence in which only the
            pilgrim's tread is audible and a single distant
            footfall behind seems too far placed for its arrival
            time.
          backdrop: >-
            Cool failing light, dry earth and lamp-oil, the windless
            silence of a road longer than it was.
