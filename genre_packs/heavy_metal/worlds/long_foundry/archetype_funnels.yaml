funnels:

  # ── Coil and Brand Guild — Forge-Quarter Workers ────────────────────────────
  - name: Coil and Brand Sorcerer
    absorbs:
      - [magician, control]
      - [magician, dps]
    faction: The Coil and Brand Guild
    lore: >-
      The working thaumaturgists of the Long Foundry's dominant guild are not
      scholars or courtiers — they are shift-workers who clock in, draw their
      residue-ration, and produce. Every working involves a signed cost-sheet
      filed with the guild hall before the first incantation, and the ledger
      is audited monthly. A Coil and Brand Sorcerer who exceeds their cost
      quotient without prior approval learns quickly why the rates-book is
      posted publicly.
    cultural_status: respected as essential, viewed with low-grade anxiety by non-guild neighbors
    disposition_toward:
      The Three Feeding Cults: cautiously cooperative
      The High Seats: professionally indifferent
      The Stratum Camp: nervous

  - name: Span-Warden
    absorbs:
      - [hero, tank]
      - [hero, dps]
      - [ruler, tank]
    faction: The Coil and Brand Guild
    lore: >-
      The guild maintains a small corps of sworn defenders whose mandate is
      the security of the foundry floors and the great span that carries the
      city's central axis. Span-Wardens are selected from journeyman-grade
      guild workers who demonstrated judgment under residue conditions that
      would have broken a lesser constitution. They hold the bridge with a
      specific legal authority that predates any Perault claim and they know
      it — they carry a copy of the original charter in a waterproof sleeve.
    cultural_status: legally formidable, personally modest, respected by the Kin Lanes
    disposition_toward:
      The River Wardens: collegial
      The High Seats: technically deferential, practically independent

  - name: Tally-Runner
    absorbs:
      - [everyman, jack_of_all_trades]
      - [everyman, support]
      - [hero, jack_of_all_trades]
    faction: The Coil and Brand Guild
    lore: >-
      Every guild operation runs on tally-sheets — cost records, residue
      measurements, covenant-balances — and someone has to carry them between
      the forge floors, the guild hall, and the temple precinct three times a
      day. Tally-Runners know the city's internal geography better than any
      cartographer, have a working relationship with nearly every gatekeeper
      and temple clerk in the central district, and are entirely unassuming
      to anyone who has not yet needed a favor quickly. They are paid to move
      fast and ask no questions; most of them have accumulated extensive answers
      despite the policy.
    cultural_status: invisible to the powerful, invaluable to everyone else
    disposition_toward:
      The River Wardens: friendly
      The Three Feeding Cults: routine contact, no personal allegiance

  # ── The Three Feeding Cults — Temple Precinct ──────────────────────────────
  - name: Ledger-Priest
    absorbs:
      - [sage, control]
      - [sage, support]
      - [ruler, support]
    faction: The Three Feeding Cults
    lore: >-
      The feeding cults do not want ecstatics. They want accountants. A
      Ledger-Priest administers a specific tier of the city's tally-covenant
      — verifying that the guild's monthly output matches the agreed feeding
      share, certifying the annual tally-offering, and drafting the formal
      correspondence that keeps three gods adequately nourished and none of
      them surprised. The Keepers of the Hour hold the eldest temple; the
      Silent Patron's House holds the most political influence; the
      Grievance-Keepers train their Ledger-Priests to be specifically
      meticulous because they cannot afford any variance in the arrangement.
    cultural_status: prestigious within the temple precinct, seen as useful bureaucrats outside it
    disposition_toward:
      The Coil and Brand Guild: formally cooperative, privately watchful
      The High Seats: patient creditors
      The Stratum Camp: professionally alarmed

  - name: Flesh-Warden
    absorbs:
      - [caregiver, healer]
      - [caregiver, support]
      - [sage, healer]
    faction: The Three Feeding Cults
    lore: >-
      The feeding-temple infirmary is not a charity — it is a budget line.
      The cults discovered early that keeping the city's laboring population
      functional costs less than replacing them, and the Flesh-Wardens are
      the professional healers who execute that calculus. They are trained
      in wound-craft, residue-poisoning, and the specific physiological
      presentations of a covenant approaching default. They are warm enough
      to do their work well and precise enough not to confuse compassion
      with an unlimited account. The Orvinnic kin-elders trust them
      completely, which is the most rigorous endorsement the city offers.
    cultural_status: trusted in the Kin Lanes and foundry quarters; respected in the temple precinct
    disposition_toward:
      The Kin Lanes Covenant: genuinely allied
      The High Seats: professional service relationship, no illusions

  - name: Silent Patron's Interpreter
    absorbs:
      - [lover, support]
      - [lover, healer]
    faction: The Three Feeding Cults
    lore: >-
      The Silent Patron's House is the most politically connected of the
      three cults, and it cultivates that connection through a specific class
      of temple functionary — the Interpreter, who attends the high courts
      not as a priest but as a reader of emotional weather. An Interpreter
      names what is owed between people with an accuracy that makes even
      Perault covenant-lawyers shift in their chairs. The nominal function
      is pastoral care and mediation. The actual function is intelligence
      gathering for a god who prefers to know about default before it happens.
    cultural_status: welcome in any court, trusted by none of them
    disposition_toward:
      The High Seats: attentive and apparently sympathetic
      The Coil and Brand Guild: warmly neutral

  # ── The High Seats — Perault High Quarter ──────────────────────────────────
  - name: Covenant-Heir
    absorbs:
      - [ruler, dps]
      - [innocent, healer]
    faction: The High Seats
    lore: >-
      Most of the Perault houses are in quiet arrears. Occasionally one of
      them produces a child who was not educated in the fine art of not
      looking at the ledger. A Covenant-Heir is a young Perault who has read
      the actual books, understands what the family owes and to whom, and has
      decided to do something about it — an impulse that the house's older
      members experience as both necessary and deeply embarrassing. They
      arrive in the world politically connected and legally well-armed, with
      a sharp sense of obligation that the more comfortable members of the
      high quarter wish they would moderate.
    cultural_status: admired by debtors, unsettling to creditors, viewed as naive by the guild
    disposition_toward:
      The Three Feeding Cults: anxious
      The Coil and Brand Guild: seeking alliance

  - name: House Remembrancer
    absorbs:
      - [artist, control]
      - [artist, support]
    faction: The High Seats
    lore: >-
      The dying Perault courts retain a tradition of keeping a household
      scholar whose function is to maintain the family's official history —
      which is to say, the version of the family's history that makes the
      covenants look like dignified choices rather than compounding errors.
      A Remembrancer shapes narrative as deftly as any politician, has read
      every letter in the house archive, and understands that the past is
      a live political instrument. The best of them are genuinely mournful
      about what they are documenting. The job requires that specific
      combination of honesty and tact.
    cultural_status: prestigious within the high quarter, invisible to the forge district
    disposition_toward:
      The Three Feeding Cults: careful
      The Stratum Camp: intellectually fascinated, institutionally alarmed

  # ── The Kin Lanes Covenant — Orvinnic Labor-Kin ────────────────────────────
  - name: Residue-Kin
    absorbs:
      - [outlaw, stealth]
      - [jester, stealth]
      - [explorer, stealth]
    faction: The Kin Lanes Covenant
    lore: >-
      The Orvinnic labor-kin who work the foundry floors move through the
      residue-zones that would disorient or sicken anyone else. The
      Residue-Kin are those who discovered, usually early and by accident,
      that this same tolerance extends to moving through parts of the city
      no one else comfortably occupies — the lower sub-spans, the active
      residue-sump drainage channels, the passages beneath the temple
      precinct that the Astran clergy do not formally acknowledge. They
      carry messages, retrieve objects, and occasionally disappear people
      who have agreed in advance to be disappeared, all without disturbing
      the tally-ledgers that the city runs on.
    cultural_status: known to exist, officially unremarkable, quietly indispensable
    disposition_toward:
      The Coil and Brand Guild: contractual
      The Three Feeding Cults: wary of the Grievance-Keepers specifically

  - name: Kin-Elder's Voice
    absorbs:
      - [outlaw, dps]
      - [jester, dps]
    faction: The Kin Lanes Covenant
    lore: >-
      The Kin Lanes have no formal military capacity and want none —
      the covenant that binds them makes open violence a complicated
      proposition. What they have instead are individuals whose job is to
      handle situations that the elders cannot address through the normal
      channels of negotiation without revealing how much the covenant's
      terms constrain them. A Kin-Elder's Voice operates at the edge of
      official sanction, solves the specific problems that official sanction
      cannot reach, and answers to the elders rather than the guild. The
      dark humor is a professional survival mechanism; this is not easy work.
    cultural_status: known in the Kin Lanes, notional to the wider city
    disposition_toward:
      The High Seats: transactional
      The River Wardens: working alliance

  # ── The Stratum Camp — Refuser Scholars ────────────────────────────────────
  - name: Stratum Scholar
    absorbs:
      - [explorer, jack_of_all_trades]
      - [outlaw, control]
    faction: The Stratum Camp
    lore: >-
      The Refuser-specialists at the eastern dig combine field archaeology
      with a specific theoretical heresy: that the older strata contain
      evidence of covenants that were successfully refused, and that this
      evidence is actionable. The Stratum Camp's scholars are methodical,
      patient, and operating entirely outside the formal guild framework.
      Some of them are controlling the information they send back to the
      city with increasing deliberateness, which the Coil and Brand calls
      a research protocol and the feeding-temple clergy calls something
      considerably less polite.
    cultural_status: legitimate scholars in nominal standing, practically outside guild oversight
    disposition_toward:
      The Coil and Brand Guild: formally cooperative, increasingly selective
      The Three Feeding Cults: professionally cautious

  - name: Deep-Reader
    absorbs:
      - [sage, healer]
      - [innocent, healer]
    faction: The Stratum Camp
    lore: >-
      Not every scholar at the dig is there to dispute cosmological theory.
      The Deep-Readers are the camp's practical specialists — trained in
      both stratum physiology and the specific wound-patterns that appear
      when someone makes contact with a Refuser artifact without proper
      preparation. They arrived as healers and have become, without quite
      deciding to, the keepers of the camp's most sensitive information:
      what the artifacts do to people who touch them, and how long recovery
      takes, and whether recovery is always what happens. The Refuser
      question is no longer purely academic for them.
    cultural_status: essential to the camp, unknown to the city
    disposition_toward:
      The Three Feeding Cults: deeply suspicious of the Grievance-Keepers
      The Kin Lanes Covenant: quiet sympathy

  # ── The River Wardens — Span and Barge Traffic ─────────────────────────────
  - name: Warden-at-the-Lock
    absorbs:
      - [outlaw, stealth]
      - [explorer, stealth]
      - [jester, stealth]
    faction: The River Wardens
    lore: >-
      The River Wardens are understaffed, underfunded, and positioned at
      every chokepoint where information moves through the Long Foundry.
      A Warden-at-the-Lock is the individual who manages one of the old
      span-gates or river-lock stations, nominally checking cargo manifests
      and collecting the minor transit fees that fund perhaps a third of
      the Wardens' actual operating budget. In practice they have developed
      a detailed intelligence picture of every shipment, passenger, and
      overheard conversation that has passed their station in the last five
      years, and they keep this picture in their head because the formal
      records office has been understaffed since before they started.
    cultural_status: officially minor, practically well-informed and discreet
    disposition_toward:
      The Coil and Brand Guild: cooperative
      The Three Feeding Cults: politely opaque

  # ── The Path-Eater Road — Unaffiliated Travelers ───────────────────────────
  - name: Road-Debt Carrier
    absorbs:
      - [everyman, support]
      - [lover, support]
    faction: null
    lore: >-
      The Path-Eater pilgrim-road connects the Long Foundry to the next major
      feeding temple three days downstream, and the people who move along it
      are a mix of genuine pilgrims, Astran clergy on circuit, and ordinary
      travelers making the most of a maintained road. The Road-Debt Carriers
      are the unaffiliated support workers who have learned that a maintained
      road means a reliable income: menders, porters, innkeepers, letter-runners,
      and the occasional mediator who knows the pilgrimage customs well enough
      to smooth the inevitable frictions. They carry no covenant of their own
      and carefully keep it that way.
    cultural_status: welcome at every waystation, unremarkable everywhere else
    disposition_toward:
      The Three Feeding Cults: deferential in the specific way of those who know better
      The Coil and Brand Guild: no formal relationship

  - name: Name-Erased
    absorbs:
      - [outlaw, stealth]
    faction: null
    lore: >-
      Some covenants are inherited and some are sold and some are entered
      into without full understanding, and occasionally the person who holds
      a particularly burdensome one discovers that the most practical
      resolution is to no longer formally exist. The Name-Erased are those
      who have successfully vacated their place in the city's accounting —
      technically still present, moving through the foundry-quarter and the
      lower span in the gaps between official rosters. The Orvinnic kin-elders
      do not comment on how many of the Name-Erased are former Perault
      inheritors who decided to stop being heirs. The Coil and Brand Guild
      does not ask.
    cultural_status: legally nonexistent, practically present, tolerated where useful
    disposition_toward:
      The High Seats: former membership, no affection
      The River Wardens: working relationship built on mutual discretion
