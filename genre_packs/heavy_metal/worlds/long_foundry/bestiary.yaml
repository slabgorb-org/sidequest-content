    description: >-
      A founder of one of the Perault lines, or an early Astran high priest,
      embalmed to outlast the city it built and throned in a sealed crypt with
      its heart sealed in a far jar so the body could be unmade and still return.
      The dig east of the span and the temples' lapsing arrangement are, between
      them, waking such things faster than anyone wants to admit.

