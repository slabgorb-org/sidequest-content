  # ════════════════════════════════════════════════════════════════════
  #  SRD UNDEAD + FIENDS → WWN EXPANSION (40 entries)  — added 2026-06-25
  # ════════════════════════════════════════════════════════════════════
  #  The full SRD 5.1 monster roster (corpus/monsters.yaml, 316 rows) was gated
  #  to this world via world_register.yaml and converted to WWN/OSR stat lines
  #  on the SAME ladder as the hand-authored roster above. Two-gate provenance
  #  (bestiary-curation-recipe.md, story 158-23). SIBLING world to evropi —
  #  identical GATE-1 algebra, parallel reskin philosophy, foundry vocabulary.
  #
  #  GATE 1 — world_register genre-truth (deterministic, tools/bestiary_curator):
  #    allow_types = [Undead, Fiend] ONLY. KEPT 41, DROPPED 275 — every Dragon,
  #    Beast, Monstrosity, Fey, Celestial, Elemental, Plant, Giant, Aberration,
  #    Ooze, Construct, Humanoid, and Swarm culled by type. The world's
  #    constructs/horrors/humanoids stay HAND-AUTHORED above; the auto-expansion
  #    is the city's dead and the bargained-for, never a high-fantasy menagerie.
  #  GATE 2 — tone curation (HUMAN pass, "blood-priced, never comic, never
  #    cute"): within Undead + Fiend there were NO tone-breakers to cull. DEDUP
  #    hand-drop (1): SRD "Zombie" (already live above as the hand-authored
  #    "Risen Corpse"). 41 − 1 = 40 shipped. (NB: SRD "Shadow" and "Ghoul" are
  #    KEPT here — unlike sibling evropi, the Long Foundry has no hand-authored
  #    equivalent of either, so the dedup set legitimately differs per world.)
  #  RESKIN (26): demons → the SLAGHELL, what a botched Kragmoor blood-working
  #    boils up; devils → the AUDITORS of the Astran feeding-ledgers, come to
  #    collect a blood-tithe (23 fiends; sibling-parallel to evropi's "Crimson
  #    God" / "Reckoner"). The world's hand-authored roster has NO native fiends,
  #    so this expansion is the pact dimension that set most needs. Other undead
  #    keep legible SRD names, recast for the foundry in prose. THREE undead
  #    onomastic reskins (GATE-2), where the SRD name imported a creature the
  #    gate refuses or that has no place in a foundry-city: "Minotaur Skeleton" →
  #    "Stratum Horn-Brute" (→ the Refuser-stratum dig), "Ogre Zombie" → "Risen
  #    Hauler-Brute" (Giant-name → the Thessil haulers), "Warhorse Skeleton" →
  #    "Towpath Dray-Dead" (cavalry → the iron-river barge tow-horses).
  #  MARQUEE (Diamonds-and-Coal, ADR-014): Lich, Mummy Lord, Vampire, and the
  #    apex Slaghell/Auditor — Six-Blade Slaghell (Marilith), Sovereign of the
  #    Slaghell (Balor), Archcreditor (Pit Fiend), The Lacquered Liar (Rakshasa).
  #  CONVERSION: WWN ladder, level by CR-band (deep-cap L8-10: Lich CR21→L9,
  #    Pit Fiend CR20→L9, Balor CR19→L9, Marilith CR16→L9, Mummy Lord CR15→L9,
  #    Vampire/Rakshasa/Nalfeshnee CR13→L8); hp/save/attack_bonus ladder-exact
  #    (never hand-balanced). AC + morale archetype-tuned by hand, identical to
  #    sibling evropi for each shared SRD chassis. Cunning self-preservers
  #    (Vampire/Lich/Mummy Lord) drop to morale 11 — they withdraw rather than break.
  #  LEAN-TIER CONVENTION: no Z-Image plates rendered for these yet; the medium
  #    is set once in visual_style.positive_suffix, never per-entry.
  # ════════════════════════════════════════════════════════════════════

  # ── UNDEAD — the city's common dead ──────────────────────────────────
  # ── LOW BAND (1-2) ───────────────────────────────────────────────────

  - id: skeleton
    name: Skeleton
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d6"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 15
    role: common risen labour of the foundry-dead
    tags: [undead, low]
    abilities:
      - "Fearless — never checks morale"
    description: >-
      A foundry hand or a paupers'-pit corpse boiled clean and set walking by
      stray thaumaturgic residue, still gripping the tongs or the pike it died
      holding. Where the Kragmoor working settles thickest, the dead do not
      always wait to be raised on purpose.

  - id: shadow
    name: Shadow
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d4"
    move: "fly 40 ft."
    morale: 12
    skill: 1
    save: 15
    role: residue-cast shade of an unmade life
    tags: [undead, low, incorporeal]
    abilities:
      - "Incorporeal — pours along walls and under doors; mundane steel finds nothing to bite"
      - "Strength-drain — a cold touch saps the muscle from a living limb"
      - "Flees true daylight; holds in any cellar, crypt, or shuttered hall"
    description: >-
      The flattened dark a person leaves when a working goes wrong over them —
      the residue takes the warmth and the shape both, and what is left clings
      in the under-vaults of a Perault house or the span's pier-shadows. It
      hates the warm without remembering it was ever warm itself.

  - id: towpath_dray_dead
    name: Towpath Dray-Dead
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d6"
    move: "60 ft."
    morale: 12
    skill: 1
    save: 15
    role: dead tow-horse of the iron-river barge-lines
    tags: [undead, low]
    abilities:
      - "Fearless — never checks morale"
      - "Trampling charge — a galloping strike can knock a struck target prone"
    description: >-
      A barge tow-horse worked to death on the iron-river towpath and raised by
      the residue that settles in the wet stable-mud, still in the verdigrised
      brass of its harness and still leaning into a tow-line that rotted off
      years ago. It hauls its phantom barge up the towpath every night, and it
      tramples whatever stands between it and the wharf it remembers.

  - id: ghoul
    name: Ghoul
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 14
    role: corpse-eater of the slaughter-yards and paupers' pits
    tags: [undead, low, predator]
    abilities:
      - "Paralysing claws — a raked victim saves or seizes up rigid for several rounds"
      - "Feeds before it reasons — breaks off a fight to gorge on the fallen"
    description: >-
      A thing that died hungry in the foundry slums and came back hungrier,
      crawling up out of the paupers' pits and the slaughter-yard middens by
      the river. It hunts the night-shift and the unhoused, and it eats what
      its claws leave too stiff to crawl away.

  - id: specter
    name: Specter
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "fly 50 ft."
    morale: 12
    skill: 1
    save: 14
    role: cold incorporeal dead of a residue-haunted vault
    tags: [undead, low, incorporeal]
    abilities:
      - "Incorporeal — drifts through pier-stone and panelling; only fire, silver, or witched steel bites it"
      - "Life-chill — a passing touch saps warmth and strength from the living"
    description: >-
      The undirected dead of someone the residue took quietly — a clerk slumped
      over a feeding-ledger, a foundryman the slag-fumes finished. It keeps no
      grievance and no office, only the cold, hanging in the pier-vaults under
      the span where the day never reaches.

