    description: >-
      A debtor a high-quarter vampire kept on instead of letting the Astran
      ledger close the account — drained almost to death and raised half-made, so
      the half-life is the unpaid balance walking around. Leashed to its maker's
      blood, it works the night lanes bringing the warm back to a Perault cellar,
      and it heals from anything that is not fire or the iron river's current.

  - id: wraith
