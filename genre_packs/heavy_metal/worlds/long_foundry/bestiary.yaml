      - "Draining kiss — a willing touch saps years of life and bleeds away the will to resist"
      - "Unmasked, it flees — invisible, ethereal, gone the moment its game is seen for what it is"
    description: >-
      A fiend that takes a lien against longing — it arrives wearing the face you
      most wanted to see, and the bargain it offers always sounds like relief.
      Each kiss takes a measure of life and a larger measure of judgement. It
      rules nothing by force, and does not need to, until it is recognised — and
      then it is simply gone, with the lien still owing.

