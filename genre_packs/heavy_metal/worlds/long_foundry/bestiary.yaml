      A patriarch of a high-quarter house who paid a Kragmoor working — or a far
      worse creditor — for an end to dying, and got exactly that. It keeps its
      court of charmed servants and spawn, holds a lacquered coffin no steward
      will name, and runs the slow politics of the high quarter as a game it can
      lose only by being found.

