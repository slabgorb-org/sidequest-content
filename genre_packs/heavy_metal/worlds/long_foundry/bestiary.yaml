    description: >-
      A great rotted vulture-thing the Slaghell vents when a working has spoiled
      past saving — it bursts from the crucible-smoke screaming, fouls the air
      with carrion-spores, and tears at whatever its screech has left too stunned
      to flee the workshop. A guild hall is sometimes sealed rather than cleared
      of one.

  - id: bargainer_slaghell
