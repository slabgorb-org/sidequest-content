      The small contractual fiend an Auditor sends ahead to read a household's
      debts — invisible in the rafters, counting the plate, learning the names,
      noting which doors the family thinks are secret. It avoids what killing it
      can; its work is the tally, and the tally is what comes to collect.

  # ── MID BAND ─────────────────────────────────────────────────────────

