      - "Steps through dream — slips into the half-real to escape or to reach a sleeper across the city"
      - "Arrears-bargain — offers ease from the haunting at a price written in years"
    description: >-
      A crone-fiend who works the debts the Astran ledgers find too small to
      send an Auditor for — a year here, a night's sleep there. She rides a
      sleeper she has marked until they will sign anything for one whole night,
      and the price is always more than it sounded. She keeps her own ledger,
      and the temple pretends not to know whose names are in it.

