      - "Hurls fire — flings a gout of flame at a target out of reach"
    description: >-
      An Auditor clad head to foot in its own iron barbs, sent when a feeding-
      ledger's collection turns to open violence and the letter permits it. It
      would rather you came to it; closing with a Barbed Auditor costs blood for
      every yard, and it throws fire to make sure you have to come anyway.

  - id: arrears_hag
