    description: >-
      The dead of a death too unjust to settle — a foundryman scalded in a
      cost-cutting, a Perault wife quietly disposed of, a debtor whose account
      the temple closed by hand. It cannot leave the room or the lacquered chest
      that holds it, and it cannot rest while the wrong that made it stands.

