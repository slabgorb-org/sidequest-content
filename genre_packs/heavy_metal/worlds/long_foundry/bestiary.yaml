      - "Mid-fight bargain — offers, in earnest, to grant a heart's desire for flesh, a name, or a year; it always means it, and the granting is always a trap"
    description: >-
      A towering four-armed Slaghell, dog-headed, two arms ending in pincers that
      take a man in half — and yet the danger is the offer. It will pause a
      killing to grant your dearest wish, exactly and ruinously as worded. Half
      the Kragmoor guild's worst pacts began as a Bargainer's granted wish that
      went the only way these ever go.

  - id: rot_slaghell
    name: Rot Slaghell
    level: 7
    hp: 32
    armor_class: 15
    attack_bonus: 7
    damage: "1d10"
    move: "30 ft., swim 30 ft."
    morale: 10
    skill: 2
    save: 12
    role: toad-shaped Slaghell of pure corruption
    tags: [fiend, mid, demon]
    abilities:
      - "Two attacks — bite and raking claws each round"
      - "Stench of rot — those who fight close to it save each round or fight sickened and slowed"
    description: >-
      A bloated toad-shaped Slaghell that reeks the instant it boils up, vented
      where a blood-working has gone to pure decay. The stench alone empties a
      foundry floor; what it does with its claws while the crew is retching is
      almost beside the point. One rose once in the river-sludge under the span
      and the span's lowest arch has been walled off ever since.

  - id: bone_auditor
    name: Bone Auditor
    level: 7
    hp: 32
    armor_class: 16
    attack_bonus: 7
    damage: "1d10"
    move: "40 ft."
    morale: 11
    skill: 2
    save: 12
    role: gaunt high-devil that audits a debtor to death
    tags: [fiend, mid, devil]
    abilities:
      - "Hooked sting — a tail-stab carries a poison that wracks and weakens over the fight"
      - "Cold discipline — utterly fearless; pursues a marked account without haste and without stopping"
    description: >-
      A tall, fleshless, unhurried Auditor sent for the accounts that matter — it
      does not gloat and does not give up a name once the ledger has assigned it.
      It walks the city debtor to debtor, patient as compound interest, and when
      it finds the right door the sting does the slow arithmetic of what is owed.

  - id: chain_auditor
    name: Chain Auditor
    level: 7
    hp: 32
    armor_class: 16
    attack_bonus: 7
    damage: "1d8+2"
    move: "30 ft."
    morale: 11
    skill: 2
    save: 12
    role: warden-devil wreathed in living chain
    tags: [fiend, mid, devil]
    abilities:
      - "Living chains — barbed lengths lash from its body to rend and to drag; makes two chain attacks a round"
      - "Bind — a chain that hits may seize a victim fast until it is cut or the devil falls"
    description: >-
      A flayed shape inside a cage of its own animate chains, the gaoler the
      Auditors send when a feeding-ledger specifies the debtor be brought in
      alive. The chains reach further than iron should and drag harder than iron
      can, and a Kragmoor sorcerer who summons one had best be very sure whose
      name the warrant carries.

  # ── DEEP BAND ────────────────────────────────────────────────────────

  - id: glutton_slaghell
    name: Glutton Slaghell
    level: 8
    hp: 36
    armor_class: 16
    attack_bonus: 8
    damage: "2d6"
    move: "20 ft., fly 30 ft."
    morale: 10
    skill: 3
    save: 11
    role: vast boar-shaped Slaghell of appetite
    tags: [fiend, deep, demon]
    abilities:
      - "Aura of dread — once a scene, all who behold its bulk save or stand witless and reeling for a round"
      - "Gorging bite — swallows what it fells; a devoured foe is gone unless cut free fast"
    description: >-
      A mountain of a boar-and-ape Slaghell, the greatest hunger a spoiled working
      can vent, called up by a pact that promised it a feast and has come due. Its
      presence alone unmoors the mind; it eats while you stand stunned, and what
      it eats is gone. There is seldom a body left for the Astran ledgers to close.

  - id: foreclosure_fury
    name: Foreclosure-Fury
    level: 8
    hp: 36
    armor_class: 16
    attack_bonus: 8
    damage: "2d6"
    move: "30 ft., fly 60 ft."
    morale: 11
    skill: 3
    save: 11
    role: winged Auditor loosed on a defaulted life
    tags: [fiend, deep, devil]
    abilities:
      - "Marked account — fixes on the defaulter it was sent for and always knows where they are"
      - "Rope of entanglement — a flung cord binds its quarry fast at range"
      - "Flight — strikes from the air and climbs out of reach between blows"
    description: >-
      A beautiful, terrible winged Auditor loosed when a life pledged against a
      debt finally defaults — not summoned by the temple, but by the foreclosure
      itself, which the Astran ledgers hold sacred. It binds the defaulter with a
      flung cord and steps over bystanders unless they make themselves collateral.
      More than one Perault fall has ended with one of these at a high window.

  - id: horned_auditor
    name: Horned Auditor
    level: 8
    hp: 36
    armor_class: 17
    attack_bonus: 8
    damage: "2d6+1"
    move: "20 ft., fly 50 ft."
    morale: 11
    skill: 3
    save: 11
    role: great winged enforcer with a lashing tail
    tags: [fiend, deep, devil]
    abilities:
      - "Fork and tail — strikes with a great fork and a flaming tail-lash each round"
      - "Hurls fire — looses a bolt of flame at a distant target"
      - "Flight — fights from above, descending only to finish"
    description: >-
      A red-scaled, bat-winged high Auditor, the enforcer a feeding-ledger invokes
      when the price is a quarter's worth of blood. It circles a burning district
      on leathery wings, hurling fire, descending with fork and lashing tail only
      to collect the principals by name. The bargaining is over before it is
      called; this is the part that was always coming.

