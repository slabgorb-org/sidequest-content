    description: >-
      A Kragmoor guild-master who worked the last and greatest blood-price — paid
      its own death into a hidden vessel and kept its shifts forever. It remembers
      every pact the guild ever brokered and means to outlast every party to them,
      walled up in a guild sub-vault or the deep dig, guarding the one jar that is
      the only thing in the city that can end it.

  # ── FIENDS — the bargained-for: Slaghell + Auditors ──────────────────
  # ── LOW BAND ─────────────────────────────────────────────────────────

