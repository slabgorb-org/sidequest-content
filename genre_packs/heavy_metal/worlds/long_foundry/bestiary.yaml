    description: >-
      What a death of pure hatred leaves when a specter is too small to hold it —
      a foreman who locked his crew in a burning works to save a contract, a
      debtor the Astran ledger flayed by instalment, risen as a coalesced dark
      that keeps the grudge and nothing else. It does not haunt one room; it goes
      where the warm are, and it leaves a colder dark behind it.

  # ── DEEP BAND (8-9) — the great dead ─────────────────────────────────

