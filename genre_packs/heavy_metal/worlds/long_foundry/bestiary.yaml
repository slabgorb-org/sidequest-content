      The risen frame of one of the great horned beasts the Refuser stratum
      kept, hauled up whole by the scholars digging east of the span and walking
      again before the first night was out. Bone the breadth of a roof-beam, it
      lowers its skull and charges down the dig-cuts it was unearthed from, into
      the lamplit galleries the scholars should have left sealed.

