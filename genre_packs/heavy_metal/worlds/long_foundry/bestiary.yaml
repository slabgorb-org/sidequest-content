      A small, spiteful thing of the Slaghell a Kragmoor apprentice draws out of
      the crucible in a first binding — registered with the guild, taxed by the
      year, listed against the sorcerer's name like any other tool. It carries,
      spies, and whispers, despises its master, and serves to the letter anyway,
      because the only alternative is the long fall back down to whatever lent it
      up. When a guildsman dies owing, the guild repossesses the familiar first.

  - id: tally_imp
