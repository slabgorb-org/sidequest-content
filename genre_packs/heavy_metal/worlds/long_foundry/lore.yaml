world_name: The Long Foundry

history: |
  The Long Foundry has stood for four hundred years, though the span it is built around is older than any current record. The first foundries were raised by a thaumaturgic guild whose name no one now uses in polite conversation; they built their workshops on the bedrock of an older stratum, and for two centuries the city prospered on the specific combination of good iron ore, a strong slow river, and the convenient availability of certain residues that only exist above a First-Feeder site. The guild that founded the city is gone. The foundries remain, and the residues do too.

  Three centuries ago the Perault houses of the high quarter established their seats above the forges — ostensibly to patronize the guild, more honestly to quietly tap the minor workings that were easiest to afford in a place with so much raw thaumaturgic infrastructure. Their courts have since declined in the particular Perault way, accumulating covenants faster than they can service them, and most of the high quarter's great houses are now more famous for the silences in their ledgers than for the rooms in their halls.

  The Astran temples came last, two generations after the houses, and are the reason the Long Foundry is still working. The feeding cults established themselves in the central precinct and built the formal apparatus that routes a share of the foundry's output — metal, residue, and, once a year, a specific small offering of refined tally — into the accounts of three of the six known cults. This arrangement is why the city is more stable than most of its age-peers. It is also why a great deal of the city's quiet anxiety centers on whether the arrangement will hold through the next decade.

  The real change has come in the last five years. The hills east of the span, which were previously known only to Thessil farmers and the occasional stratum scholar, have begun producing artifacts from a layer that nobody quite expected to find. A small group of Refuser-scholars now keeps a permanent camp at the largest dig site. The guild is nervous. The temples are nervous. The city is not yet nervous, but it is beginning to ask why the scholars are no longer coming home on time.

factions:
  - name: The Coil and Brand Guild
    summary: "The dominant thaumaturgy guild of the Long Foundry — runs the forges, publishes the rates, and keeps the ledgers"
    description: >-
      The senior working guild of the city, responsible for the
      majority of civic thaumaturgy. The Coil and Brand is large,
      conservative, and deeply interested in the stability of the
      arrangement with the Astran temples. Their guild hall stands at
      the head of the span, and their rates-book is posted publicly
      every month. They are cautiously friendly to outsiders with
      honest commissions and deeply unfriendly to anyone who
      destabilises the foundry's residue economy.
    disposition: wary

  - name: The Three Feeding Cults
    summary: "The Keepers of the Hour, the Silent Patron's House, and the Grievance-Keepers all hold temples in the central precinct"
    description: >-
      Three of the six genre-level feeding cults maintain working
      temples within the Long Foundry's central precinct. Each has a
      formal arrangement with the Coil and Brand Guild that routes a
      share of the city's output into their accounts. The Keepers of
      the Hour administer the eldest of the three temples. The
      Silent Patron's House is the most politically connected. The
      Grievance-Keepers are the least well-funded and, consequently,
      the most anxious.
    disposition: neutral

  - name: The High Seats
    summary: "The declining Perault noble houses of the high quarter"
    description: >-
      Perhaps sixteen old houses still keep their doors formally open
      in the high quarter, though several are operating entirely on
      the pretence of their older standing. Most are in quiet
      arrears. They hold formal precedence in the city council
      meetings but exercise very little actual power, and their
      principal political function is to absorb a share of the
      city's old covenants as the last inheritors of lines that have
      run out of other options. Some of the heads of houses know
      this. Some do not want to know.
    disposition: cautious

  - name: The Kin Lanes Covenant
    summary: "An Orvinnic laborer community whose biology is visibly engaged in the city's workings"
    description: >-
      The Kin Lanes are a district at the lower edge of the forges
      where the Orvinnic labor-kin keep their households. The
      covenant that binds the Kin Lanes is specifically tied to the
      city's foundry work — the laborers' physiology responds to
      the residues in useful ways that non-kin laborers would find
      lethal. The Kin Lanes are not mistreated, exactly; they are
      essential, and the city knows it. They keep quiet, generous
      households, and their elders speak with authority in any
      conversation about the foundry's long-term health.
    disposition: neutral

  - name: The Stratum Camp
    summary: "A Refuser-specialist dig site in the eastern hills that is no longer reporting back on schedule"
    description: >-
      Five years ago, a small academic collective opened an
      excavation in the hills east of the span. Two years ago, the
      artifacts began to come back with the scholars. One year ago,
      the scholars stopped coming back with the artifacts. The
      camp is still there, still staffed, still sending its rations
      requests to the city, but the tone of the correspondence has
      been changing. The Coil and Brand is paying for the rations.
      The Astran temples are watching. No one has yet gone out
      there with authority to demand answers.
    disposition: cautious

  - name: The River Wardens
    summary: "A small body responsible for the safety of the span and the river traffic it carries"
    description: >-
      A minor civic authority that predates the current foundry
      arrangements, nominally responsible for keeping the river
      span safe and the barge-traffic moving. Badly understaffed,
      underfunded, and unusually well-informed — the River Wardens
      hear everything that passes along the river, which is to say
      most of everything that passes the city at all.
    disposition: friendly

cosmology: >-
  The cosmology of the Long Foundry is the genre's — the five scales
  of pact, the six-deity feeding economy, the three buried strata.
  What is specific to the city is the unusual density of the
  overlap: the foundries are built on First-Feeder bedrock, the
  houses are maintained by accumulating Perault covenants, the
  temples are actively feeding three of the six gods, and the
  stratum camp in the eastern hills has recently begun to disturb
  what is almost certainly a Refuser site. All five of the
  metaphysical scales are live in this city at the same time. The
  city is a coincidence, and an increasingly fragile one.

geography: >-
  The Long Foundry sits on both banks of the Graslo River at its
  oldest span, a stone arch bridge that has been widened and
  extended twice and now carries the central axis of the city. The
  working foundries line the northern bank. The Astran temple
  precinct sits on a raised terrace at the centre of the southern
  bank. The Perault high quarter rises above the temples on the
  southern slope. The Kin Lanes cluster at the lower edge of the
  foundries, where the residues collect. East of the city, the
  Graslo valley opens into low hills — farmland on the southern
  slopes, Thessil herders on the northern ones, and the stratum
  camp now a week's walk into the eastern uplands. West of the
  city, the river slows into a series of old locks maintained by
  the River Wardens, and the Path-Eater pilgrim-road runs roughly
  parallel to the river all the way to the next major feeding
  temple, three days' walk downstream.
