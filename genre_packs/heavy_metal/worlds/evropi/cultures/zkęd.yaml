name: Zkęd
summary: Slavic authoritarian humans of Zkędzała — secret-police state, lost-heir
  cult, slave traders
description: Light-skinned humans with dark hair and eyes. The men wear braided beards
  threaded with small metal beads; the women braid matching beads into their hair,
  so a Zkęd crowd makes a faint rattling sound when it moves. They dress in somber
  cold-weather clothing for the mountain borderlands and the Egzami forest interior.
  They are ruled hereditarily by a Waz — currently Isku the Eighth, old and sharp
  of tongue, with three sons positioning for the succession. Beneath the Waz sits
  the Wazdia, the secret police whose motto is "mind before heart," and beneath the
  Wazdia sits the Daggereyes, the contract killers the Wazdia disavows in public.
  The Zkęd are a downtrodden people ruling an even more downtrodden people — they
  enslave the Waterfolk and the Pakook`rook and ship them to the Pę slave markets
  drugged on reniksnad.
