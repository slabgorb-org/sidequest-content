name: Kobold
chargen: false
summary: 'LORE ONLY — Tismenni servant caste, all dead save one: Rux, the only kobold
  anyone alive has ever seen'
description: A small reptilian servant-people kept by the Tismenni dragonkin during
  the Golden Age. The kobolds were extremely loyal, deeply chauvinistic about Tismenni
  cultural superiority, and died with their masters in the Cataclysm — with exactly
  one known exception. The only living kobold the current age has ever met is Rux,
  who was found by a party of adventurers in -4 SR (recent years) inside a globe of
  Tismenni preservation-amber in a buried stratum chamber. Rux has a short muzzle,
  a long tail he keeps carefully out of doorways, scaled skin the colour of old brass,
  and is — constantly, wearily, across every civilised region he has travelled — mistaken
  for a dog. He speaks a Tismenni dialect no scholar has ever recorded alive, addresses
  Tismenni texts the way Zkęd villagers address icons, and does not appreciate being
  patted on the head. . Scholars disagree on whether kobolds were a distinct species
  or a domesticated branch of the Tismenni themselves. No sample population survives
  to settle the question. Rux will not submit to measurement and regards the question
  as beneath comment.
