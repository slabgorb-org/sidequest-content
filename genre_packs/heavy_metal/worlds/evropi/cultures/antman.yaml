name: Antman
summary: Chitinous hive-people of the Deep Hollows beneath the Zbóźny mountains; communicate
  in pheromone, rarely surface
description: An insectoid humanoid people the surface of Evrópí mostly knows as rumour
  — tall-jointed, chitin-plated, four-limbed (two arms, two legs, the vestigial wing-plates
  at the shoulder no longer bearing weight), with mandibled jaws and compound eyes
  that do not track human gestures the way a human would expect. The antmen live in
  the Deep Hollows far below the Ingurdios mine-works in the Zbóźny range — a lattice
  of pressure-warm caverns and tunnels the Ingurdios miners sometimes hear scratching
  through the deep walls and do not investigate. Antman civilisation predates most
  of what the surface peoples call history; scholars who have read the Tismenni archives
  carefully note a handful of references to "the below-kind" whom even the dragonkin
  did not presume to enslave. . Antmen communicate primarily through scent. Their
  spoken language, when they use one, is a clattering throat-speech of clicks and
  hard stops that carries what pheromone-speech cannot. What a human culture conveys
  through singing, oration, or music, an antman culture conveys through a layered
  signature of airborne chemistry — and an antman Scent-Bearer (the closest surface
  equivalent is the role of a bard) can inspire, taunt, bewilder, mourn, or command
  an audience by releasing the appropriate composition. Humans in the same room register
  the effect as a sudden shift of mood whose cause they cannot identify. Trained humans
  — Vaermm book-checkers especially, who learn to notice mental interference — sometimes
  smell an antman Scent-Bearer working before they see them. . The antmen have surfaced
  only rarely and only for reasons that concern them. They do not petition, do not
  negotiate under surface terms, and do not respond to coercion because the hive they
  carry their pheromone-loyalty toward is usually three miles straight down. The surface
  considers them a half-myth; the antmen consider the surface a weather event.
