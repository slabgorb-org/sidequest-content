name: Mistos
summary: Elf-supremacist military junta — beauty-eugenics, red-and-black silks, puppet
  states, conscription
description: 'Elves with fine light hair and pale skin who dress in red and black
  dyed silks and leather. They are convinced they are the master race, and the conviction
  is grounded — in their own reasoning — on their objectively superior beauty. The
  logic closes on itself: a Mistos born with any blemish, even a wen or a winestain
  birthmark, is by definition no longer Mistos, and is banished to the Ingurdios mines
  or worse. The culture is ruled by the military; every able-bodied adult serves,
  and the General of Mistos is also the ruler of Mistos. They conquer their neighbours
  and hold them as puppet-states, installing local rulers that take their orders from
  the General. They share a language family (Trosse) with the Jambiendo, but centuries
  of divergence have given Mistos speech a harsh military accent — short, clipped,
  front-loaded with hard consonants — that no Jambiendo would confuse with their own.
  Neither people remembers how the split happened. Neither wants to.'
