name: Sestayty
summary: Infernal-marked human remnant of the fallen Empire of Sest — hunted by Mistos
  and Wazdia alike, tolerated only in Saletaja, every one of them carrying a pact-mark
  that cannot be hidden forever.
description: >-
  When the Tismenni comet drowned the old world, a human empire rose fast into
  the power vacuum it left — the Empire of Sest — and rose that fast because its
  founders bought their ascent from infernal things, in pacts that left a
  permanent mark on the bloodline. Some say the Sestayty did not merely profit
  from the Cataclysm but caused it; the Sestayty are eager to blame that rumour
  on their enemies. The empire is long gone. The marks are not. A Sestayty is
  human to look at until the sign shows — a cinder that will not cool behind one
  eye, a brand of script no living scholar can read rising under the skin of the
  forearm, a scatter of salt-white scarring that was not there yesterday. The
  Mistos hunt them as an impurity; the Wazdia hunt them as an unfiled variable;
  most of the continent hunts them out of the old fear of what their grandfathers
  bought. Only Saletaja, the elective kingdom, gives them a measure of welcome —
  it is rumoured one of that realm's most influential nobles carries Sest blood
  himself. They live in the shadows, pass for Zkęd where they can, and pay, every
  one of them, an inheritance of interest on a debt none of them signed.
