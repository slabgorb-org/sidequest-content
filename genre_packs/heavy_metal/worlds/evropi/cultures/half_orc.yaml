name: Half-Orc
summary: Rare mixed-blood folk, most often found in mine-labour populations or mercenary
  bands; no coherent culture of their own in Evrópí
description: 'Half-orcs in Evrópí are rare and scattered. Full-blooded orcs — large,
  green-grey, tusked, and temperamentally pragmatic — live chiefly far to the north
  of the continent in clan- holdings the southern empires do not map accurately. Half-
  orcs born on the continent proper come from incidents of slaving, migration, and
  the occasional northern mercenary who settled and started a family that lasted.
  They have no unified culture. What they do have, disproportionately, is first-generation
  familiarity with the Mistos slave-caravans and the Ingurdios mines — any non-Mistos
  body strong enough to swing a pick is valuable to the junta, and half-orcs have
  the shoulders for it. . A half-orc in the current age is usually found attached
  to whichever human culture raised them (Zkęd dress, Aldkin speech, Mistos quarter-mark)
  with a visible layer of orcish physiology on top — tusks filed or not depending
  on local taste, skin in the grey-green range, hands of a size that does not pass
  for human at any distance. Mercenary work suits them because most standing armies
  on the continent will not have them and private contractors do not inquire carefully.
  The few half-orcs who have escaped the Zbóźny mines are a specific sub-category:
  they tend to travel in pairs (they came out with someone), they tend not to go back,
  and they tend to have grievances that require specific people to be present to resolve.'
