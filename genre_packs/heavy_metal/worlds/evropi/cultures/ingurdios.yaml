name: Ingurdios
chargen: false
summary: LORE ONLY — subjugated people of the Mistos; native language canonically
  dead, preserved only in Tismenni scholarly tomes
description: The people the Mistos conquered long enough ago that no living Ingurdios
  remembers their original culture. Their native language is dead, banned on pain
  of death, preserved only in fragments inside ancient Tismenni scholarly texts —
  the lingua franca of the old dead empire, which is the only archive the Mistos did
  not know how to burn. The Ingurdios speak accented Trosse now, the language of their
  tormentors, and are forced to labour in the Mistos mines in the Zbóźny Mountains.
  The older Ingurdios tell stories of a once vibrant and rich culture, and of a messiah
  who will come to the mines and speak the old language aloud for the first time in
  generations. The messianic stories are not officially forbidden by the Mistos. The
  General considers them harmless. The Ingurdios who believe them know this means
  the General is wrong about something.
