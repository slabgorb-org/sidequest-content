name: Tismenni
chargen: false
summary: LORE ONLY — dragonkin ancient empire, destroyed by the Cataclysm ~12,000
  years ago; language survives as scholarly lingua franca
description: 'The ancient civilisation of Evrópí, whose golden age ran from roughly
  -12940 to -12010 and whose empire was drowned at -11540 when a comet struck the
  ocean and sent a tsunami across the continent. The Tismenni were a dragonkin people
  — not the serpent-wyrms of nursery stories, but a scholarly reptilian race whose
  skulls hinged differently from human skulls and whose long lives made the Golden
  Age feel, to them, not especially long. Most extant Tismenni portraiture was defaced
  in the Dark Age by survivors who did not wish to remember the shape of their own
  former masters; the few remaining carvings show narrow jaws, pupils that would not
  contract in sunlight, and a posture that the Mistos later exaggerated into propaganda.
  The Tismenni themselves are dead. Their language — Tismenni — survives as a scholarly
  and wizardly lingua franca, the written form used by intellectuals, archivists,
  and mages across every surviving culture. It is unknown whether any who can truly
  call themselves Tismenni still exist in the world. . The Tismenni kept a servant
  caste — the Kobolds — a smaller reptilian people chauvinistically devoted to Tismenni
  order. When the empire drowned, the kobolds drowned with it; no living kobold has
  been seen on the continent since the Cataclysm, with exactly one documented exception
  (see: "The Kobold in the Amber" in legends.yaml). Ruins of the empire dot the continent:
  half-buried roads, sundials on hills no one remembers building, and the occasional
  basin where the tsunami left a permanent scar. The Land of Dust — the afterlife
  realm bordered by the Chalky Cliffs — is, according to scholars who read Tismenni,
  unusually thin in the places the comet struck.'
