name: Waterfolk
summary: Marsh-halfling people of the Hvoru salt marshes — eel-herders, crane-riders,
  enslaved by Zkęd
description: Small marsh people who live in stilt-huts raised above the Hvoru salt
  marshes, cultivate domesticated eels in the estuaries below, and ride domesticated
  cranes across the open water. Their clothing is eel-skin — tanned like leather and
  beaten translucent, then stitched into garments with a texture other races prize
  and pay badly for. They carry short tridents for fish, eel, and the occasional frog.
  Their language, Zypič, belongs to the Zkęd language family, which is either a cruelty
  of history or a clue to a shared ancestry neither side wants to acknowledge. The
  Waterfolk are at war with the Pakook`rook. Both sides are enslaved by the same Zkęd
  masters. The Wazdia profits from both.
