name: Gnome
summary: Small-folk with mine-tunnel heritage; many now bound to Mistos mine-work,
  some few escaped and walking the surface with whoever they came out with
description: 'Gnomes in Evrópí are small people — two-thirds human height, broad-fingered,
  long-lived in the small way — whose ancestors are held by most scholars to have
  been the original population of the sub-surface tunnels of the Zbóźny, before the
  Ingurdios settled the hill-country above and before the Mistos conquered the whole
  system. Those ancestors mostly died out, assimilated, or were driven deeper; the
  living gnome population of the current age is diminished, scattered, and disproportionately
  captive — the Mistos prize gnome miners because their hands fit tunnel-seams a human
  can''t reach. . A gnome who has come out of the mines is a particular kind of person:
  quiet where their captors were loud, careful about promising anything to anyone
  after years of promising everything to survive, and stubbornly attached to whichever
  fellow escapee dragged them out. Free gnomes who were never taken are rare and keep
  rarer company. The surface cultures have no firm opinion about gnomes as a people
  because they have not met enough of them to form one.'
