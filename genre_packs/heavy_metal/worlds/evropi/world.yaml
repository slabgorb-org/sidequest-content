name: Evrópí
slug: evropi
cover_poi: upre
description: >-
  A continent of three authoritarian systems and the free peoples
  living in the gaps between them. The Zkęd secret-police state of
  Zkędzała enslaves its marsh neighbours and hunts its own lost heir.
  The Mistos elf-supremacist junta marches southward from their
  red-and-black silk uniforms, exiling their own children for the
  crime of a birthmark. The Vaermm copy out the Book of Aest at
  coming-of-age, and everything not mandatory is forbidden. The
  steppe Aldkin ride their black Anta horses under the Herdsman's
  patient watch; the Jambiendo sail gull-ships from the Sabulous
  Islands with holds full of spice; the Bladtrablo forge metal at
  volcanic vents beneath the Řeknu ocean; and twelve thousand years
  ago a comet drowned the Tismenni empire, leaving a scholarly
  lingua franca and a Land of Dust the dead still speak from.
  The crowns count themselves as the continent. The steppes, the
  islands, and the volcanic dark count differently — and older
  things, twelve thousand years patient, are beginning to stir again.

tagline: "Three crowns, three ways to fall."

