world_name: Evrópí

# Legends of Evrópí — the stories every culture knows in some form,
# usually with different endings. Drawn from Keith's 2010 campaign
# material and preserved with the original names where possible.

legends:
  - id: the_mutallamus
    name: The Mutallamus
    culture: Zkęd
    period: "year t34115 of the old calendar; Zony 3 Kbelsk"
    summary: >-
      The betrayal and deposition of Waz Zamzau of Zkędzała by his
      cousin Pętu na Renwaz, engineered through the seduction of
      Zamzau's young wife Auteny. The founding trauma of modern
      Zkęd politics and the origin of the Widząn Zamzau rebel cult.
    description: >-
      In the year t34115 of the old Zkęd calendar, Zamzau was the
      new-crowned Waz of Zkędzała, one month into his reign. His
      wife Auteny was young and beautiful. His cousin Pętu na
      Renwaz — son of Zamzau's father's brother Soku — seduced
      Auteny and convinced her to deliver the throne to him. She
      betrayed Zamzau to Pętu's men; Pętu deposed and killed
      Zamzau in the event now called the Mutallamus. Pętu then
      betrayed Auteny in turn, throwing her into the dungeons
      beneath Malach and eventually having her flogged to death.
      The one thing every version of the legend agrees on is
      that Zamzau, before his death, forgave his wife's
      infidelity and treachery — such, the songs say, was the
      goodness of his heart and his love for his young bride.
      Pętu na Renwaz founded the city of Pę (originally named
      Pętu, shortened over the centuries, some say to avoid the
      Usurper's name) and moved the capital there. The Zkęd
      throne has not been held by Zamzau's direct bloodline
      since. The Widząn Zamzau holds that it should be, and is
      searching for the Zygwa — the lost heir.
    notable_figures: [Zamzau, Auteny, "Pętu na Renwaz"]
    related_tropes: [the_zygwa_sought]

  - id: the_cataclysm
    name: The Cataclysm
    culture: all
    period: "-11540"
    summary: >-
      The comet that struck the ocean and drowned the Tismenni
      empire in a single week, ending the Golden Age and
      beginning the Dark Age.
    description: >-
      Twelve thousand years ago, a large comet struck the ocean
      beyond the Řeknu. The impact sent a wall of water across
      the continent that destroyed the low coastal cities of
      the Tismenni empire within a single day and the high
      cities by the end of the week. The Chalky Cliffs were cut
      sharper by the tsunami, which is why some scholars read
      them as the boundary of the Land of Dust — the barrier
      between the living and the drowned. The empire of the
      Tismenni did not survive the waters or the famines that
      followed. What survived was the language, carried by a
      handful of survivors into the highlands and preserved in
      oral then written form by every subsequent culture that
      wanted to read old books. Every living people on Evrópí
      remembers the Cataclysm in their own oral tradition,
      under their own name. The Aldkin call it the Drowning-
      Year. The Zkęd call it the Great Breaking. The Vaermm
      do not have a name for it, because the Book of Aest does
      not permit historical speculation beyond the Book itself,
      and the Cataclysm happened before the Book.
    notable_figures: []
    related_tropes: [the_dust_speaks]

  - id: the_book_of_aest_compilation
    name: The Compilation of the Book of Aest
    culture: Vaermm
    period: "~-10900, early Dark Age"
    summary: >-
      The death of Aest and the compilation of her teachings into
      the scripture that would govern every aspect of Vaermm life
      for the next ten thousand years.
    description: >-
      Aest was a Vaermm teacher in the early Dark Age, when the
      survivors of the Cataclysm were still scattered through the
      foothills and the eastern scrublands, and the old Tismenni
      certainties had crumbled. She taught a rigid belief system
      she called "right-thinking" — a prescribed pattern of
      thoughts, learned from tradition, so consistent that
      original thought became impossible, and with it (Aest
      argued) crime, deviance, and every other anti-social
      behaviour. The Vaermm who followed her teaching found it
      comforting in a world that had just lost its underpinnings,
      and after her death compiled her sayings, teachings, and
      anecdotes into the Book of Aest. The Vaermm social system
      became entirely dependant on the Book's tenets. "All
      behavior that is not mandatory is forbidden in Vaermm
      society" is the canonical summary. Magic use, invention,
      and original art were severely stifled as side effects.
      Every Vaermm has copied out their own Book of Aest at
      coming-of-age for ten thousand years without amendment.
      The compilation has, in Vaermm thought, no beginning — the
      Book was always the Book, even when it was still being
      remembered.
    notable_figures: [Aest]
    related_tropes: [the_book_tightens]

  - id: the_not
    name: The Not (the forgotten oppressor)
    culture: all
    period: "~-200 to 0"
    summary: >-
      The polity the year-zero rebellion overthrew. Its name was
      not preserved by the rebels, and the forgetting has been
      doctrine for three thousand years.
    description: >-
      Toward the end of the Second Rising, one polity rose to
      continental dominance and became oppressive in ways no
      surviving history describes. The rebellion against this
      polity succeeded in the year now counted as 0, and the
      rebels — or the generation that followed them — chose not
      to preserve the name of their oppressor. The histories
      call the polity only "the Not," which some scholars have
      taken as a linguistic joke (the "not-a-name") and others
      as a pointed refusal (we do not say who they were). Three
      millennia later, the forgetting has become a pact kept by
      every culture on the continent. To name the Not publicly
      is an act of historical hygiene that the scholarly
      consensus treats as taboo and the Wazdia treats as
      sedition. The Tismenni dead, it is said, still remember
      the name, and will give it to any living scholar who asks
      correctly. The Tismenni dead are also said not to give it
      lightly, and the scholars who have asked are, by scholarly
      tradition, the ones who have never published again.
    notable_figures: []
    related_tropes: [the_dust_speaks]

  - id: the_anta_horse
    name: The First Anta
    culture: Aldkin
    period: "early Second Rising"
    summary: >-
      The legend of how the Aldkin first bred the coal-black
      Anta horse with its glossy coat and stiff cropped mane.
    description: >-
      In the early Second Rising, the Aldkin clans were
      ordinary riders of ordinary horses until a Mäinkin rider
      named Nöyd-the-Wind-Reader found a black foal in a
      thunderstorm on the Klas, the only surviving foal of a
      mare struck by lightning, and raised it to be the first
      Anta. The foal grew into a coal-black stallion with a
      glossy coat that reflected no colour but the sky, a
      stiff mane cropped short for the first time by the
      lightning itself, and twice the speed and endurance of
      any horse the Aldkin had ever bred. Nöyd called the
      stallion Anta, which in Aldkin means simply "horse" —
      because once you have seen a true Anta, every other
      horse is no longer a horse in the same way. Every Anta
      alive descends from that first stallion. The Mäinkin
      clan became the richest because they kept the
      bloodline longest.
    notable_figures: ["Nöyd-the-Wind-Reader"]
    related_tropes: []

  - id: the_last_jambiendo_bladtrablo_peace
    name: The Last Peace of the Cousins
    culture: "Jambiendo and Bladtrablo"
    period: "long ago"
    summary: >-
      The last time the seafaring Jambiendo and the undersea
      Bladtrablo were not at war. No one alive remembers when
      exactly this was.
    description: >-
      The Jambiendo and the Bladtrablo are cousin peoples —
      elvish, sea-bound, sharing a distant ancestry neither
      side wants to discuss. They are blood enemies now, and
      have been for so long that no living captain or vent-
      smith remembers the reason. The legend, told in
      different forms on both sides, holds that the last peace
      between the two peoples was an agreement so total and
      so amicable that its ending required a betrayal of
      monstrous specificity — the details of which each side
      now blames the other for. The peace ended with a
      gift exchanged and misunderstood; the gift is still held
      on one side of the water, and its counterpart is missing
      from the other. If the two gifts were ever brought
      together, the legend says, the feud would end. Neither
      side is looking. Both sides suspect the other of
      keeping their half hidden somewhere difficult.
    notable_figures: []
    related_tropes: []

  - id: the_mistos_general_origin
    name: The First General
    culture: Mistos
    period: "early Second Rising"
    summary: >-
      The coalescing of the Mistos into a military junta under
      their first General. An internal legend, not shared with
      outsiders; the Mistos do not publish their origin story.
    description: >-
      The Mistos do not publicly tell outsiders how they came to
      be. Their internal legend, known only to Mistos who have
      risen high in the Host, holds that the first General was
      a Mistos woman of the early Second Rising who proved she
      was the most beautiful Mistos alive by challenging every
      rival to a formal appearance-duel — a ritual the Mistos
      still practise in miniature at every officer promotion.
      Having won, she was by definition the fittest to rule,
      and the Mistos — whose entire ideology is that beauty
      equals fitness equals authority — had no way to argue.
      The first General conquered the other Mistos clans
      through the same logic, and every subsequent General has
      been the "most beautiful living Mistos" as certified by a
      ritual that is never questioned publicly. The Mistos
      Jambiendo-separation — the event in which the two elven
      peoples split into cousin-races — is explained in
      Mistos internal teaching as a choice: the first General's
      ancestors chose discipline over the Jambiendo choice of
      drift. The Jambiendo version, to the extent they
      speculate at all, is that the separation was an accident
      of migration neither side bothered to reverse.
    notable_figures: ["the first General"]
    related_tropes: [the_mistos_tide]
