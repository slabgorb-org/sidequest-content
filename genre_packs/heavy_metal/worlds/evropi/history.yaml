          backdrop: >-
            A long stone table running the length of a tall
            dressed-stone hall, a tall carved reading-stand at one
            end with a chained master book, a semicircle of grey-
            robed figures seated on plain stone benches around it,
            warm oil-lamp pools along the side walls.
        environment:
          solo: >-
            Warm steady oil-lamp light from frame-left and
            frame-right with thin cold light dropping from
            high window-slits, the smell of beeswax, lamp-soot and
            old vellum hanging in the still air, the absolute hush
            of a room where breathing has been adjusted to be
            quiet, the small dry shuffle of a single robe.
          backdrop: >-
            Warm steady lamp-light, beeswax and vellum, the held
            breath of corrected silence.
      - name: The Shaft-Descent
        slug: the_shaft_descent
        region: ingurdios_mines
        type: entrance
        description: >-
          The main entry to the Ingurdios mines — a stone-
          reinforced shaft descending into the Zbóźny at a
          forty-five-degree angle, guarded at the top by a
          Mistos Warden's post and below by a century of
          Ingurdios memory. A cage-lift runs on Mistos
          machinery; the stairs run on Ingurdios backs.
        visual_prompt:
          solo: >-
            Wide landscape view of the mouth of a great forced-
            labour mine cut into a mountain face. Foreground: a
            broad packed-earth and gravel approach scarred with
            wheel-ruts and chain-drag marks, a Mistos warden's
            guard-post of dressed stone on the right with a
            red-and-black banner hanging straight in still air, a
            single Mistos officer in immaculate red-and-black
            uniform with mirror-polished black boots standing at
            ease. Middle ground: the shaft entry itself, a heavy
            stone-reinforced framed opening descending at a
            forty-five-degree angle into the mountain, twin tracks
            of iron rail vanishing into dark, a great timber cage-
            lift hung on chains over the shaft, a parallel
            descending stairway worn smooth and dark by use beside
            the rails, two thin chained Ingurdios figures with
            picks waiting at the cage-door under guard. Background:
            the southern face of the Zbóźny rising behind the
            entry in raw grey rock, a fall-line of mine-tailings
            spreading down the slope. Overcast midday, cold flat
            light.
          backdrop: >-
            A heavy stone-reinforced shaft-mouth descending at a
            steep angle into a mountain face with twin iron rails
            and a timber cage-lift hung on chains, a Mistos
            warden's stone guard-post and a red-and-black banner
            to one side, raw grey Zbóźny rock rising behind.
        environment:
          solo: >-
            Cold flat overcast light from a high featureless sky,
            the metallic acid tang of mine-air and machine-oil
            rising from the shaft, the harsh ammonia of the
            tailings-slope underfoot, the slow rhythmic creak of
            the cage-lift chains and a far-off muffled drum-rhythm
            of pick-work resonating up out of the rock.
          backdrop: >-
            Cold mine-mouth light, machine-oil and acid air, the
            rhythmic groan of cage-chains.
      - name: The Deep Shaft
        slug: ingurdios_deep_shaft
        region: ingurdios_mines
        type: underground
        description: >-
          The deepest functional shaft in the Ingurdios mines,
          where the messianic underground maintains its
          watch. Warm from earth-heat, loud with the rhythm of
          Ingurdios pick-work that doubles as coded
          communication, and — for anyone who understands the
          pattern — full of a readiness that has been
          accumulating for generations.
        visual_prompt:
          solo: >-
            Wide underground landscape view of the deepest active
            shaft of a slave-worked mine. Foreground: a rough
            stone-cut floor strewn with broken ore-fragments and
            black coal-dust, a single low-set oil-lamp in an iron
            cage casting a small bright pool, a long-hafted pick
            leaning against the wall with its iron head polished
            bright at the point. Middle ground: the great roughly-
            arched shaft chamber, its walls worked in irregular
            terraces where seams have been chased, a thin
            squad of Ingurdios miners in grey rags and shoulder-
            chains spaced along the wall striking the rock in a
            measured shared rhythm, one older worker pausing with
            his head tilted listening, a low timber bench with a
            water-jug and a single wooden bowl. Background: the
            shaft continuing into a fading dark with two distant
            small lamp-points marking other working faces. Lamp-lit
            only, the rest of the chamber falling into deep shadow.
          backdrop: >-
            A great roughly-arched underground chamber with walls
            worked in irregular terraces, a single low oil-lamp in
            an iron cage casting a small pool of light, the shaft
            continuing into a fading dark with two distant
            lamp-points beyond.
        environment:
          solo: >-
            A single low oil-lamp's warm pool from frame-front
            with the chamber falling to deep shadow beyond, the
            close warm earth-heat of a deep shaft, the iron and
            mineral smell of crushed rock and old sweat, a
            measured collective pick-rhythm that does not quite
            match the rhythm of mere work — every fourth strike
            falls slightly heavier than the others.
          backdrop: >-
            Low lamp-pool in deep shadow, warm earth-heat and iron
            tang, the patient irregular rhythm of work that is
            also signal.
      - name: The Malach Ruins
        slug: the_malach_ruins
        region: malach_river_port
        type: ruin
        description: >-
          The half-buried Tismenni ruins under the modern city
          of Malach — the old tax office sits in what used to be
          Zkęd na Iśvar's throne-hall, which in turn sits on a
          Tismenni administrative basilica whose inscriptions
          are legible if a scholar knows how to read them. The
          Land of Dust is thin here this season. Scholars
          reading the inscriptions late at night hear voices.
        visual_prompt:
          solo: >-
            Wide landscape view of a half-buried ancient ruin
            beneath a modern city's working tax office. Foreground:
            a stone-cut descending stair worn smooth at the centre
            of each tread, a single old oil-lamp on an iron ring
            at the wall, dust caught in its light. Middle ground:
            an exposed older floor of geometric mosaic in three
            faded colours, parts visible beneath broken modern
            paving slabs lifted aside, a fallen Tismenni column
            drum on its side carved with calibrated rings of
            abstract characters, a single freelance scholar in
            travelling robes stooped over a sheet of parchment at
            a folding stool. Background: deeper into the chamber,
            a Tismenni basilica's surviving apse-arch rises out
            of the rubble, its walls carved with continuous strips
            of older inscription, the older stonework distinctly
            larger-grained than the modern build around it.
            Lantern and lamp only, the rest in cool shadow.
          backdrop: >-
            A half-buried older mosaic floor beneath broken modern
            paving with a fallen carved column drum on its side,
            an apse-arch rising out of the rubble in the dimmer
            background, its walls carved with continuous strips of
            older inscription.
        environment:
          solo: >-
            Warm pooled lamp-light at the foreground and cool
            deep-stone gloom beyond, the dry mineral smell of
            ancient excavated dust mixed with the closer wax-smell
            of the working lamp, an unnatural stillness even given
            the depth, the small dry sound of a quill on parchment
            and — under it — the faint impression of speech without
            anyone speaking.
          backdrop: >-
            Warm lamp-pool in deep dust-cool shadow, the dry
            mineral hush of an exposed older time.
      - name: The Mistos Puppet-Seat of Smrtvámi-na-Ziej
        slug: puppet_seat_smrtvami
        region: puppet_seats
        type: puppet_capital
        description: >-
          A former Zkęd buffer-village, now a Mistos puppet-
          seat — the old Zkęd coat of arms still hangs in the
          council hall but with a small red-and-black Mistos
          banner superimposed. The puppet Gabra is a Zkęd
          collaborator whose accent has been practicing Trosse.
          The Warden stands in the corner with one hand on a
          parade sword.
        visual_prompt:
          solo: >-
            Wide landscape view of the interior of a council-hall
            in a former Zkęd village now under Mistos
            administration. Foreground: a long oak audience-table
            of dark waxed timber set with three pewter cups and a
            single open ledger, a heavy carved chair of state at
            its head pushed slightly back. Middle ground: the
            puppet Gabra of the village — a Zkęd man in faded
            somber wool and a recently re-trimmed beard — standing
            uncomfortably at the table head, his hand resting on
            the ledger; behind him on the wall the old village
            coat of arms still hangs in carved relief but with a
            small fresh red-and-black banner of stretched silk
            pinned down its centre, the pins driven straight
            through the older painted shield. Background: a
            single Mistos warden in immaculate red-and-black
            uniform standing motionless in the corner with one
            gloved hand resting on a parade sword's hilt, narrow
            shuttered windows admitting thin grey light, two iron
            stand-lamps casting pooled warm pools across worn
            flagstones. Day, mostly lamp-lit, the windows offering
            only cold supplemental light.
          backdrop: >-
            A council-hall interior with a long oak audience-table
            and a carved chair of state at its head, an old
            village coat of arms on the back wall with a fresh
            red-and-black banner of silk pinned across its centre,
            two iron stand-lamps in the room corners.
        environment:
          solo: >-
            Warm pooled lamp-light from two iron stands set
            against the cold grey window-light, the dry waxed-oak
            and beeswax smell of an old council-room mixing with
            the newer sharp scent of dyed Mistos silk, a deliberate
            slow tick of a wall-clock and the perfect immobility
            of the warden in the corner setting the room's tempo.
          backdrop: >-
            Warm lamp-pool against cold window-light, waxed oak and
            dyed silk, a deliberate slow ticking quiet.
