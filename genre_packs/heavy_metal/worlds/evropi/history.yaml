            Background: dry scrubland and bare grey rock slopes
            rising behind the hold, the Zbóźny foothills falling
            away to one side, low pale sky. Mid-morning, cold
            clear light, no wind.
          backdrop: >-
            A compact ring of low stone-and-mortar buildings
            around a larger central hall with tall narrow windows
            and a slate roof, dry foothill scrubland and bare grey
            rock rising behind, a single uncarved-looking waymarker
            stone at the path's edge.
        environment:
          solo: >-
            Cold clear morning light from a low sun out of frame,
            the dry herb-and-stone smell of the scrubland mixing
            with the faint ink-and-old-paper scent escaping the
            shutter-windows, no wind at all, an ambient silence so
            complete that the soft tread of robed feet on
            flagstones is the loudest sound for half a mile.
          backdrop: >-
            Cold clear stillness, ink and dry stone, the
            unsettling absence of casual sound.
      - name: The Book-Checking Hall
        slug: the_book_checking_hall
        region: vaermm_reaches
        type: chamber
        description: >-
          The inner hall of a Vaermm hold where coming-of-age
          Books are read aloud for error-checking. A long stone
          table, a master Book on a carved reading-stand, and
          a semicircle of Checkers in grey robes. The ceremony
