  # ───────────────────────────────────────────────────────────────────
  # VETERAN (Sessions 21+): Every empire is ending
  # ───────────────────────────────────────────────────────────────────
  - id: veteran
    label: "Every Empire Is Ending"
    session_range: [21, 99]
    location: "Across the continent — Wazan, the Mistos heartland, the Vaermm holds, the Sabulous Islands, the Land of Dust"
    atmosphere: >-
      The party has become known to all three authoritarian
      systems and half of the free peoples. Waz Isku VIII is
      on his deathbed. The Mistos General has personally taken
      the field, riding north in a parade of red-and-black silk
      and flawless steel. The Vaermm Book of Aest has, for the
      first time in the scripture's memory, developed an
      intentional error — which a Book-Checker has not caught,
      or has and has not reported. The Ingurdios underground is
      ready. The Widząn Zamzau has found what it believes is
      the Zygwa. The Tismenni dead are speaking clearly enough
      at the drowned ampitheatres that Jambiendo gull-ship
      captains report hearing them on calm nights from the
      Řeknu.
    active_stakes: >-
      One of the three authoritarian systems is going to fall
      this chapter. Possibly two. The party's choices determine
      which, and in what order, and what replaces it. The Zygwa
      candidate is real, forged, or accidentally correct — the
      party knows which, and the Widząn does not. The Mistos
      General intends to take Wazan before the summer. The
      Vaermm intentional-error has been planted inside an
      apprentice's coming-of-age ceremony and the error is a
      single word that will propagate across every new Book
      copied after it. The dead Tismenni are asking for
      something. The Land of Dust is asking for payment.
    character:
      level: 14
      hp: 98
      max_hp: 98
      ac: 19
      milestones_earned:
        - "covenant:Named in a Wujasjav ledger as a covenant-bearer"
        - "discovery:Read an entire Tismenni tome that no living scholar has read in two centuries"
        - "revelation:Learned who the Not were — and why the forgetting is policy"
        - "connection:Become something the Herdsman recognises (or the 999 Crimson Gods remember)"
        - "betrayal:Chose which empire ends first"
    npcs:
      - name: The Mistos General
        role: Ruler and commander of Mistos
        location: The parade road, moving north
        disposition: -20
        description: >-
          The General of Mistos is a woman in middle age whose
          name outsiders are not given until they are inside the
          Host. She is objectively the most beautiful Mistos
          alive — the Host's metric is formal, and the General
          is always the winner — and she believes this is why
          she rules. She is not wrong within the Mistos
          framework. Her command presence is a closed
          syllogism walking.
      - name: Waz Isku VIII (on his deathbed)
        role: Dying king of Zkędzała
        location: The king's chamber, Wazan
        disposition: 10
        description: >-
          The old Waz, confined to his chamber and attended by
          his three sons in a tableau that reads, from any
          doorway, as a slow assassination by inheritance.
          Sharp of tongue to the end. Asks the party, if they
          reach him, to do one specific thing that will
          determine whether the Widząn or the Wazdia wins
          Zkędzała.
      - name: The Intentional Error
        role: Vaermm apprentice who corrupted a Book
        location: A Vaermm hold, in an apprenticeship she will not finish
        disposition: 15
        description: >-
          A young Vaermm, not yet named to the Checkers, who
          has — in her coming-of-age copy — introduced a single
          intentional error: a word that changes the meaning of
          one of the Book's opening tenets from "those among the
          right-thinking" to something the original text forbade.
          The error was not caught. She does not yet know what
          will happen when other apprentices copy from her book.
      - name: The Herdsman
        role: Patient Aldkin god of gathering and separation
        location: Everywhere the Njörkte speak his name
        disposition: 0
        description: >-
          The Herdsman is not an NPC in the usual sense but a
          presence — a patient weather and a pastoral judgement.
          He is neither the party's friend nor their enemy. He
          gathers and separates, and if the party stands at a
          separation-point in this chapter, the Herdsman will
          be present for the choice.
    points_of_interest:
      - name: The King's Chamber, Wazan
        slug: kings_chamber_wazan
        region: wazan_capital
        type: chamber
        description: >-
          A high-ceilinged stone room in the Zkęd capital with
          a single narrow window overlooking the Egzami, the
          Waz's bed at its centre, and a permanent rotation of
          Wazdia watchers at the door. Isku VIII is visibly
          dying. The Wazdia believes it already knows who wins
          the succession.
        visual_prompt:
          solo: >-
            Wide interior landscape view of a Zkęd king's death-
            chamber high in his capital. Foreground: an ornate
            tall canopied bed of dark carved oak with heavy
            tarnished-brass posts and a faded crimson coverlet,
            the dying old Waz propped on three pillows in a fine
            but worn night-robe with his thin braided beard laid
            across his chest, a small side-table with a closed
            book and a single guttering tallow candle. Middle
            ground: three Zkęd sons standing carefully spaced at
            the bed's foot in formal dark mourning silks with
            small house-sigils on the collar, none quite looking
            at one another, a long-handled brass bell on a
            wall-cord beside the bed. Background: a single tall
            narrow window in the cold stone wall admitting a
            distant view of dark forest, a permanent rotation of
            two armoured Wazdia watchers visible standing in the
            doorway with hands at their sides, heavy embroidered
            wall-hangings flaking at the hems. Late afternoon,
            cold thin daylight from the window, deep shadow at
            the bed-head where the candle is the only warmth.
          backdrop: >-
            A high stone-walled chamber dominated by an ornate
            tall canopied bed of dark carved oak with tarnished-
            brass posts and a faded crimson coverlet, a single
            tall narrow window admitting thin distant daylight,
            heavy embroidered wall-hangings flaking at the hems.
        environment:
          solo: >-
            Cold thin late-afternoon light from frame-left and a
            single guttering tallow candle from the bed-side,
            the close sickbed smell of camphor and dust mixing
            with the deeper stone-cold of the chamber, the slow
            unmistakable shallow breathing of a dying man, the
            faintest creak of polished armour from the watchers
            in the doorway.
          backdrop: >-
            Cold high-window light and one guttering candle,
            camphor and stone, the held quiet of a deathwatch.
      - name: The Mistos Parade Road
        slug: the_mistos_parade_road
        region: puppet_seats
        type: military_road
        description: >-
          The war-road the Mistos General is riding north on —
          wide, well-drained, marked at every mile by a stone
          stele bearing the Host's red-and-black sigil. The
          Host is moving at parade-pace, which for Mistos is a
          terrifying twenty miles a day in perfect formation.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a Mistos military
            war-road at parade-pace under cold high sky. Foreground:
            a single stone mile-stele at the verge of the road
            carved at its top with a stylised red-and-black sigil,
            the carving freshly cut, a fall of horse-droppings
            and trodden grass on the road-shoulder beside it.
            Middle ground: the war-road itself running straight
            and slightly raised on its own causeway, immaculate
            drainage ditches on both sides, columns of Mistos
            soldiery marching in perfect formation along its
            length — pale-haired fine-featured elves in red-and-
            black tunics and polished black breastplates, shoulder
            to shoulder, every step matched, three mounted
            officers in flawless silks at the column's head.
            Background: the road continuing arrow-straight to the
            horizon between low cleared fields and distant villages
            where columns of smoke rise from chimney-rows, the
            northern sky bruising toward dusk. Late afternoon,
            low directional sun raking long shadows from the
            column.
          backdrop: >-
            A straight raised war-road on its own causeway running
            arrow-straight to the horizon between immaculate
            drainage ditches, a single stone mile-stele at the
            verge carved with a stylised red-and-black sigil at
            its top, low cleared fields on both sides.
        environment:
          solo: >-
            Low directional dusk-sun from frame-left raking long
            shadows from the marching column, the warm dust and
            cold polished-steel smell of a moving army, the heavy
            measured thump of synchronised boots and a single
            officer's clipped command-cadence riding above it, no
            voice from the ranks themselves.
          backdrop: >-
            Low raking light, dust and polished steel, the heavy
            synchronised cadence of an army on the move.
      - name: The Drowned Ampitheatre
        slug: the_drowned_ampitheatre
        region: reknu_coast
        type: ruin
        description: >-
          A Tismenni ampitheatre half-submerged off the Řeknu
          coast, visible only at low tide and only from the air
          of a gull-ship. The stone benches descend into clear
          water. Jambiendo captains report hearing Tismenni
          speech here on calm nights. Scholars who have visited
          at low tide report that the acoustics of the
          half-drowned bowl carry voices that nobody has
          spoken.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a half-drowned ancient
            ampitheatre seen from the deck of a passing trade ship
            at low tide. Foreground: dark gull-ship rigging
            crossing the corner of the frame, a single iron-banded
            railing wet with spray. Middle ground: the ampitheatre
            itself, a half-submerged bowl of pale cut stone
            benches descending in concentric tiers into clear
            grey-green water, the surface so still the lower
            benches are visible meters down, the central stage-
            floor entirely beneath the surface but its outline
            traceable, three carved column-bases standing where
            colonnades once ringed the structure, no living figure
            in or near the ruin. Background: the open Řeknu ocean
            beyond stretching to a flat horizon under low
            occluded cloud, a single distant headland with a
            ruined watchtower visible far to the right. Low tide
            at calm dusk, the water glass-still, the light from
            above the cloud diffused and silver.
          backdrop: >-
            A half-submerged bowl of pale cut stone benches
            descending in concentric tiers into glass-still
            grey-green water with the lower benches visible meters
            down, three carved column-bases standing in the
            shallows, the open ocean beyond.
        environment:
          solo: >-
            Silver diffused dusk-light from a low occluded cloud
            ceiling, the cold salt smell of the open ocean and the
            mineral-stone tang of the exposed older masonry, a
            quality of acoustic stillness across the bowl that
            feels engineered, the small slap of swell against
            stone and — under it on the calm air — a faint
            articulated murmur that may or may not be voices.
          backdrop: >-
            Silver dusk-light on glass-still water, cold salt and
            mineral stone, a stillness that carries voices that
            were never spoken.
      - name: The Apprentice's Book
        slug: the_apprentices_book
        region: vaermm_reaches
        type: artifact
        description: >-
          The hand-copied Book of Aest containing the intentional
          error, sitting open on a reading-stand in a Vaermm
          apprentice scriptorium. The error is on the second
          folio. No Checker has yet noticed. Every apprentice
          copying from this Book will copy the error forward,
          and their Books will be checked against this one, and
          the error will propagate.
        visual_prompt:
          solo: >-
            Wide interior landscape view of a Vaermm apprentice
            scriptorium centred on a single book of catastrophic
            consequence. Foreground: a tall narrow reading-stand
            of dark wood at the room's centre with a single open
            hand-bound book on its slope, the pages of cream
            vellum filled with column after column of abstract
            character-marks in dark ink, the book opened to the
            second folio, an empty stool drawn up to the stand
            with a single grey-robed apprentice's discarded
            quill resting across its top. Middle ground: a low
            wooden shelf along one wall holding three more bound
            books and a row of bottled inks, a small slate
            offering-stone beside a guttering oil-lamp, the
            light catching dust drifting from the stand. Background:
            walls of cold pale plaster between dark beams, two
            high narrow window-slits letting in cold midmorning
            light, a single closed timber door, no other figure
            in the room. Cold lit, lamp-pool warm only at the
            stand itself.
          backdrop: >-
            A tall narrow reading-stand of dark wood with a single
            open hand-bound book on its slope, a small slate
            offering-stone beside a guttering oil-lamp on a low
            wooden shelf along the wall, cold pale plaster between
            dark beams, two high narrow window-slits letting in
            thin light.
        environment:
          solo: >-
            Thin cold midmorning light from the high window-slits
            with a small warm pool of oil-lamp glow at the stand,
            the dry sharp smell of fresh ink and the cured-vellum
            scent of new pages, an absolute and complete silence
            apart from the small almost-inaudible sound of the
            lamp's flame moving, the impression that the room is
            waiting.
          backdrop: >-
            Thin cold high-window light over warm lamp-pool, dry
            ink and new vellum, a waiting and complete silence.
      - name: The Widząn Safehouse
        slug: the_widzan_safehouse
        region: wazan_capital
        type: hideout
        description: >-
          A Widząn Zamzau safehouse hidden within the walls of
          Wazan itself — a back room behind a cooper's shop,
          reached through a back alley the Wazdia has somehow
          never mapped. The Zygwa candidate is here under
          guard. The Widząn believes this is the lost heir. The
          party may know better.
        visual_prompt:
          solo: >-
            Wide interior landscape view of a hidden back-room
            safehouse behind a working cooper's shop. Foreground:
            a heavy plain wooden door slightly ajar from a back
            alley with three iron locks set in column, a single
            barrel rolled aside revealing the hidden threshold, a
            small lit candle in a tin holder on the floor by the
            door. Middle ground: the safehouse room itself, low
            and stone-walled, a plain wooden chair drawn beside a
            small table laid with a clay pitcher and two pewter
            cups, a narrow truckle bed against the far wall with
            a thin grey blanket folded back, a single figure of
            indeterminate age in plain Zkęd travelling clothes
            seated at the chair with hands folded, head slightly
            bowed. Background: two armed Widząn guards in
            commoner dress with concealed knives at the belt
            standing carefully against the walls at angles
            covering both threshold and seated figure, a low
            beam ceiling crossed with cooper's tools left from
            the shop above, no window. Lamp-light only, deep
            shadow in the corners.
          backdrop: >-
            A low stone-walled back-room behind a slightly ajar
            heavy plain door with three iron locks, a single
            wooden chair beside a small table with a clay pitcher
            and two pewter cups, a narrow truckle bed against
            the far wall, lamp-pooled in deep corner shadow.
        environment:
          solo: >-
            Warm pooled candle and oil-lamp light from frame-
            front with the corners falling to complete shadow,
            the wet-oak and tar smell of the cooperage above
            seeping faintly through the ceiling-beams, the close
            still air of a room that has not opened a window in
            weeks, a careful watchful silence broken only by the
            small wet drip of something from a barrel in the
            shop above.
          backdrop: >-
            Warm small lamp-pool in corner darkness, wet oak and
            tar from above, the careful airless watchful silence.
      - name: The Land of Dust's Chalky Cliffs
        slug: the_chalky_cliffs
        region: reknu_coast
        type: otherworld
        description: >-
          The seaward edge of the Land of Dust — a boundary of
          white cliffs where the afterlife meets the Řeknu. A
          living traveller who reaches the cliffs can hear the
          dead. The Tismenni dead are closest to the border
          here. Whatever they have been asking for has been
          getting clearer. Answering is the last chapter's
          final scene.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a great white seacliff
            where an afterlife realm meets a working ocean.
            Foreground: a worn turf clifftop edge with a single
            ancient mooring-ring of corroded green iron set into
            the rock, a small fall of loose chalk pebbles, no
            railing, no path. Middle ground: the cliff itself, a
            sheer fall of bone-pale chalk and white limestone
            dropping hundreds of feet to a narrow rocky shoreline,
            the upper face streaked with darker mineral
            inclusions arranged in patterns too regular to be
            wholly geological, a thin band of pale mist clinging
