        visual_prompt:
          solo: >-
            Wide interior landscape view of a Vaermm Book-checking
            hall. Foreground: the polished end of a long stone
            table running away from the viewer down the centre of
            the hall, a single hand-bound book of cracked dark
            leather open on its first folio with abstract pale
            character-marks across the page. Middle ground: a
