  # ───────────────────────────────────────────────────────────────────
  # MID (Sessions 13-20): The three authoritarian systems converge
  # ───────────────────────────────────────────────────────────────────
  - id: mid
    label: "The Weight of the Book"
    session_range: [13, 20]
    location: "The Zbóźny foothills, the Vaermm Reaches, and the Ingurdios mines"
    atmosphere: >-
      Each of the three authoritarian systems has now noticed the
      party, and each has responded in its own characteristic
      way. The Zkęd sent a Daggereye; the Mistos sent a letter
      of introduction with the implicit suggestion that the
      party could rise high in the Host; the Vaermm sent an
      elder with a hand-copied Book of Aest and the suggestion
      that the party would benefit from its correction. Mountain
      air, woodsmoke, and the specific silence of Vaermm holds
      at dusk. Something in the Land of Dust has begun to thin
      the boundary at the Tismenni ruins near Malach — dreaming
      scholars are hearing old empire-speech.
    active_stakes: >-
      The second atmospheric processor of the Mistos war-effort
      is fully online. The Ingurdios mines are producing beyond
      quota, and the messianic underground has named a figure
      the Wardens haven't yet investigated. The Vaermm Book-
      Checkers have begun a new policy of "reviewing" foreign
      travellers' speech patterns and offering "corrections"
      that are difficult to refuse without violence. The Widząn
      Zamzau has found a fragmentary genealogy that points to
      a surviving Zamzau descendant, and someone in the Wazdia
      has intercepted the same fragment.
    character:
      level: 9
      hp: 62
      max_hp: 62
      ac: 16
      milestones_earned:
        - "discovery:Read an Ingurdios prayer in the old tongue, accidentally, to its bearer's amazement"
        - "covenant:Accepted a small favour from the Wujasjav — payable later, in years"
        - "betrayal:Named, finally, to the Wazdia's formal surveillance list"
        - "connection:Became known to the Book of Aest as a case file"
    npcs:
      - name: Tenth-Reader Getenafthten
        role: Vaermm Book-Checker
        location: A stone hold in the Vaermm Reaches
        disposition: -5
        description: >-
          A senior Vaermm Book-Checker in the austere grey robes
          of her rank. Speaks in the minimum number of syllables.
          Carries a master Book of Aest and a reading-lens
          ground from quartz. She has been assigned to the
          party's "correction" and will present them with a
          hand-copied Book as a gift, the refusal of which is a
          formal offence against right-thinking.
      - name: Warden Vragul-Krvstan
        role: Mistos Warden of the Ingurdios mines
        location: The Mistos puppet-seat near the Shaft-Descent
        disposition: -15
        description: >-
          A Mistos officer of the Host assigned to watch the
          Ingurdios mines. Flawless features, red-and-black
          uniform, polite in the specific Mistos way that
          precedes violence. Offers the party letters of
          introduction into Mistos service — not as recruitment,
          but as field intelligence: letters that will be
          remembered if the party enters the heartland.
      - name: The Nameless Ingurdios
        role: Messianic figure in the mines
        location: Deep shaft, Ingurdios mines
        disposition: 5
        description: >-
          An old Ingurdios mine-worker whose name in the old
          tongue has been rediscovered from a smuggled
          Tismenni fragment. Does not yet speak the old
          language aloud — the underground is waiting for the
          right moment. Has a specific, patient look that
          Ingurdios underground members recognise and that
          the Mistos Wardens have not yet learned to read.
      - name: Scholar Malikka of Pę
        role: Independent Tismenni scholar
        location: Upper rooms of the Wujasjav guildhall
        disposition: 15
        description: >-
          A freelance Tismenni scholar who works adjacent to the
          Wujasjav for protection and pay. She has been reading
          a new fragment about the Land of Dust's thinning at
          Malach, and she has begun hearing the dead empire's
          voices in her dreams. She needs help she cannot ask
          for publicly.
    points_of_interest:
      - name: The Southern Pass Watchfort
        slug: southern_pass_watchfort
        region: zboznny_foothills
        type: fort
        description: >-
          The northernmost Zkęd watchfort on the Zbóźny pass
          route — a stone blockhouse with a permanent garrison
          of sixteen demoralised Zkęd regulars under a
          lieutenant who hasn't been paid in three months. The
          fort looks south into the contested foothills and
          tries not to see the Puppet Seats already installed
          in former Zkęd villages.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of an isolated Zkęd
            mountain watchfort on a ridge above contested
            foothills. Foreground: a thin worn switchback track
            climbing the last yards to the fort gate, a single
            broken cart-wheel discarded on the slope, a small
            stone boundary-cairn with a faded Zkęd sigil. Middle
            ground: the watchfort itself, a square blockhouse of
            cold dressed stone with steep slate roof, two narrow
            arrow-slits per face, an iron-banded gate hanging
            slightly off-true, a small attached stables-shed with
            missing roof-slates patched in scrap board, two
            demoralised Zkęd soldiers in unbraided beards and
            patched mail leaning at the gate. Background: the
            Zbóźny foothills falling away to the south, a thread
            of red-and-black banner visible on a distant lower
            ridge, snow-capped peaks beyond. Cold pre-dawn,
            blue-grey light, no shadow yet.
          backdrop: >-
            A square stone blockhouse with steep slate roof and
            narrow arrow-slits sitting alone on a high ridge above
            falling foothills, a single iron-banded gate hanging
            slightly off-true, distant snow-capped peaks rising
            beyond.
        environment:
          solo: >-
            Cold blue-grey pre-dawn light from a high pale sky,
            the iron-and-stone chill of unheated mountain air, the
            faint sour smell of unwashed wool and old porridge
            from the guard-room, the distant clank of a single bell
            on a goat somewhere on the slopes below, no other
            sound in the morning.
          backdrop: >-
            Cold pre-dawn light, mountain-stone chill, the lonely
            clank of a far goat-bell.
      - name: The Vaermm Hold of Uteininnk
        slug: vaermm_hold_of_uteininnk
        region: vaermm_reaches
        type: settlement
        description: >-
          A stone Vaermm hold high in the foothills east of
          Zkędzała, centered on a Book-checking hall and
          surrounded by a ring of apprentice scriptoria. The
          ambient volume of the settlement is so low that a
          visitor can hear their own heartbeat. Business is
          conducted in formal phrases; deviation is corrected.
        visual_prompt:
          solo: >-
            Wide landscape view of a small Vaermm stone hold high
            in dry foothills. Foreground: a worn flagstone path
            leading toward the hold, a single un-translated
            waymarker stone of pale rock incised with a single
            blank-character mark, no welcome-sign and no greeter.
            Middle ground: a compact ring of low stone-and-mortar
            buildings around a single larger central hall with
            tall narrow windows and a slate roof, smaller
            apprentice scriptoria with shutter-windows propped
            half open showing reading-stands within, three short
            stocky Vaermm figures in austere grey robes moving in
