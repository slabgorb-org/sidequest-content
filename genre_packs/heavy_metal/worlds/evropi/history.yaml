# Evrópí — World History & DM Prep
#
# Source: Keith's 2010 4e campaign in ~/Projects/campaign_archive/
# Game system ignored; worldbuilding preserved.
#
# Eras are direct ports from history.org, lightly filled in where the
# source trailed off. The four chapters are new — they map Evrópí's
# three-authoritarian-systems spine onto a session-maturity arc.

world_name: Evrópí

overview: >-
  Three authoritarian systems and seven free-ish peoples living in
  the gaps between them, on a continent twelve thousand years past
  its last great empire. The Zkęd state grinds its slaves in the Pę
  markets while its secret police hunts the descendants of a
  legendary betrayed king. The Mistos junta marches its red-and-
  black silks north out of the Zbóźny mines, installing puppet
  governments and banishing its own children for birthmarks. The
  Vaermm copy out the Book of Aest at coming-of-age and make
  anything not mandatory forbidden. The Aldkin ride their black
  Anta horses across the Klas under the Herdsman's patient weather.
  The Jambiendo sail gull-ships and trade spice. The Bladtrablo
  forge metal at volcanic vents beneath the sea. The dead Tismenni
  still occasionally speak from the Land of Dust. Every crown
  presses on a different bruise, and the bruises are beginning to
  meet.

eras:
  - name: Before History
    period: "before -13780"
    summary: >-
      No surviving records. The Tismenni scholars who tried to
      look earlier found only half-buried stonework older than
      their own language and ruins that did not fit their known
      cosmology. The Herdsman, worshipped by the steppe tribes
      even in the Tismenni era, is older than any ledger anyone
      still reads.

  - name: The Tismenni Rising
    period: "-13780 to -12940"
    summary: >-
      The Tismenni civilisation coalesces out of the lowland
      river valleys. Their cities rise along the coastline and
      the great river basins. Their scholars codify the first
      language that will still be readable twelve thousand years
      later. Their engineers build the sundials whose forgotten
      gnomons now crown the Hill of Time in Pę.

  - name: The Tismenni Golden Age
    period: "-12940 to -12010"
    summary: >-
      The empire at its height. Tismenni roads cross the
      continent; Tismenni learning is the common heritage of
      every port city; the drowned ampitheatres now visible only
      from gull-ship decks are full of living voices. Scholars
      later looking back across the Cataclysm report that the
      Golden Age was, from its own perspective, ordinary —
      "ordinary" in the way golden ages always are to the people
      living inside them. The Ingurdios original culture, whose
      fragments survive in Tismenni tomes, was part of the
      world of this period.

  - name: The Cataclysm
    period: "-11540"
    summary: >-
      A comet struck the ocean. A tsunami swept across the
      continent's low cities. The Tismenni empire drowned in
      a single week. The Chalky Cliffs — the white seaward
      edge of the Land of Dust, by some scholarly accounts —
      were cut sharper that week. Nothing survived the wave
      intact; what survived the wave was drowned again by the
      famines and plagues that followed. The Cataclysm is
      Evrópí's one shared historical trauma, remembered in
      every culture's oral history under its own name.

  - name: The Dark Age
    period: "-11540 to -10280"
    summary: >-
      Twelve hundred and sixty years of scavenging, forgetting,
      and finding each other in the highlands. The ancestors of
      every current Evrópí people lived through this period,
      usually poorly. The Vaermm Book of Aest is first
      compiled during this era — the oral tradition crystallises
      into scripture roughly six hundred years in. The Aldkin
      steppe tribes first follow their herds onto the Klas
      during this period. The Cataclysm's physical scars begin
      to heal; its cultural scars do not.

  - name: The Second Rising
    period: "-1280 to 0"
    summary: >-
      New civilisations coalesce. The Zkęd found Malach under
      Zkęd na Iśvar and begin the slow consolidation of the
      Egzami forest interior. The Mistos coalesce around their
      first General and begin their first wars of beauty-
      eugenic expansion. The Vaermm establish their first
      formal Book-checking halls. The Jambiendo and the
      Bladtrablo, already long-lived, divide along a cousin-
      feud that begins in this era and has never since
      stopped. The Flock spreads across the Zkęd and outward.
      The 999 Crimson Gods acquire their first ninety-nine
      worshipper-cults.

  - name: The Not and the Rebellion
    period: "~-200 to 0"
    summary: >-
      Toward the end of the Second Rising, one polity —
      remembered only as "the Not" — becomes dominant and
      oppressive in ways the later histories refuse to describe
      in detail. The rebellion against the Not begins on what
      is now year 0 of the current era. The rebels who succeed
      chose not to preserve the Not's name, and three millennia
      later the forgetting has become doctrine. Whatever the
      Not were, they are no longer, and the silence is a
      shared pact.

  - name: The Current Era
    period: "0 to now (~3500+)"
    summary: >-
      Three millennia of overlapping dynastic quarrels,
      continental wars, slow expansions, and slow collapses.
      The Zkęd Waz line runs from Zkęd na Iśvar through Pętu
      na Renwaz (the Usurper, who deposed Zamzau in the
      Mutallamus) through the modern kings to Waz Isku VIII,
      old and sharp-tongued, currently on the throne. The
      Mistos General line has never been publicly chronicled.
      The Vaermm Book of Aest has been copied out in its
      current form for uncounted generations without
      amendment. The Present Year: Isku's three sons position
      for his succession while the Mistos march northward
      and the Book tightens. The Widząn Zamzau is making its
      largest push in a generation to find the lost heir
      (Zygwa). Something in the Land of Dust has begun to
      stir. Every empire is ending. The world is counting
      down to which ending happens first. Also in the present
      year: Rux, the only living kobold anyone has ever seen,
      is somewhere on the continent, walking between stratum
      sites and being mistaken for a dog. No one is quite sure
      what to do about him. He is not asking for anything.
      Also: an antman Scent-Bearer has been seen on the surface
      near the Zbóźny foothills — tall, chitin-plated, giving
      his name in Trosse as Hant. The antmen do not ordinarily
      surface. No one has yet asked him why he has. And
      Prot'Thokk — the half-orc mercenary who walked out of
      the Zbóźny mines two years ago with the gnome Cheeney
      at his side — is still working the frontier, still
      refusing Mistos contracts, and still never quite in
      the same tavern two nights running.

# ─────────────────────────────────────────────────────────────────────
# CAMPAIGN STRUCTURE — Four chapters mapped to the three-authoritarianisms spine.
# ─────────────────────────────────────────────────────────────────────

chapters:
  # ───────────────────────────────────────────────────────────────────
  # FRESH (Sessions 1-5): Local problems in the forest frontier
  # ───────────────────────────────────────────────────────────────────
  - id: fresh
    label: "The Outlaws of Egzami"
    session_range: [1, 5]
    location: "Upre and the Waznoty road on the edge of the Egzami forest"
    atmosphere: >-
      Smoke from the zami-wood fires, cold mornings, wolf-howls
      on the forest edge after dusk. The people of Upre speak
      softly when Wazdia informers might be nearby — which is
      always, though no one says so. Travellers on the Waznoty
      road check their right hands at every mile-marker and
      keep a hand near a knife. The Daggereyes come and go from
      the forest like wolves themselves, and the Gabra Ebbe is
      paying gold for each right hand returned with the mark.
    active_stakes: >-
      Outlaws on the Waznoty have made merchant runs uneconomic
      and Upre's grain prices are climbing. Ebbe is hiring
      hireblades directly — an unusual move for a Gabra — because
      the local militia cannot hold the road. The Daggereyes are
      led by a shadowy figure with knife-tattoos between the
      eyebrows, and rumours put Srárný Fyzioloniązka herself in
      the deep forest for the first time in a year.
    character:
      archetype: "Zkęd commoner OR foreign hireblade"
      name: ""
      culture: "Zkęd, Aldkin, Jambiendo, or Vaermm traveller"
      level: 2
      hp: 18
      max_hp: 18
      ac: 12
      backstory: >-
        Arrived in Upre with a short letter of introduction or
        no letter at all, looking for honest work in the only
        town that's currently hiring. Owes at least one person
        in another town a favour that will come due later in the
        campaign. Not yet on any Wazdia informer list. Small
        coin-purse, small ambitions, open to opportunity.
      items:
        - leather_armour_patched
        - iron_knife
        - hemp_rope
        - bedroll_thin
        - traveller_cloak
        - letter_of_introduction_to_ebbe
      gold: 5
    npcs:
      - name: Ebbe
        role: Gabra of Upre
        location: Upre town hall
        disposition: 15
        description: >-
          The local Zkęd ruler of Upre — a Gabra (regional title
          below the noble rank) ruling a frontier town on the
          Gabra's nerve and a small militia budget. Practical,
          sharp-eyed, quietly frightened of the Daggereyes and
          unwilling to admit it. Pays gold per right-hand-with-
          the-mark because she has run out of legal options.
      - name: Gan son of Gan
        role: Tracker and former Scout of the Green
        location: His hidden hut 500 yards southeast of Upre
        disposition: 5
        description: >-
          Local tracker and trapper, about fifty, pock-scarred
          from the Black Pox he caught the same year his wife
          Daliann died of it. Wears a hood that keeps his face
          in shadow. Speaks in monosyllables. A former Scout of
          the Green who broke his celibacy oath for Daliann; the
          Green took her in return. Dry-witted if pressed, and
          informed about the forest beyond what a non-Scout
          could learn.
      - name: Górzymi
        role: Local Wazdia representative
        location: Upre back rooms
        disposition: -10
        description: >-
          The local Wazdia informer, who believes no one knows
          they are the local Wazdia informer. Everyone knows.
          Górzymi keeps the cover carefully — running a small
          grain-brokerage — and reports to Wazan monthly on any
          travellers worth marking.
      - name: Ognei Antslayer
        role: Village lad, odd-jobber
        location: Upre and the surrounding fields
        disposition: 20
        description: >-
          Dim-witted local boy who tells everyone the story of
          how he killed a "gigantic ant thing" outside the town
          one evening before curfew. Pudgy, callused, cheerful.
          Works odd jobs for Fletta, Gan, and anyone else who
          pays. The gigantic ant thing was real; Ognei doesn't
          know how important this will become.
      - name: Srárný Fyzioloniązka
        role: Leader of the Daggereyes
        location: Somewhere in the Deep Egzami, moving
        disposition: -20
        description: >-
          Zkęd woman in middle age with a scarred face and a
          crimson eye-patch over her left eye. Touchy about
          leading a band of male brigands — a +2 reaction bonus
          toward women, -1 toward men, and a reputation for
          interpreting thoughtless remarks as mortal insult.
          Wears chainmail and carries the Eye, a jade-guarded
          dagger with a wickedly curved blade. Takes most of her
          orders from the Wazdia through drop-letters.
    points_of_interest:
      - name: Upre
        slug: upre
        region: egzami_frontier
        type: settlement
        description: >-
          A small Zkęd town at the edge of the Egzami forest,
          ruled by the Gabra Ebbe. Log-and-stone buildings around
          a central square with a stone well, a single modest
          tavern, and Ebbe's town hall at one end. The grain
          silos are nearly empty this season because the
          Daggereyes have strangled the Waznoty road. The
          militia consists of six old men and a dog.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a small Zkęd frontier
            town at the edge of a dark forest. Foreground: a rutted
            mud track entering through a crude timber palisade, a
            rough-cut stone well at centre with an iron-banded
            bucket, an empty grain-sled tilted against its rim.
            Middle ground: low log-and-stone buildings around a
            packed-earth square, steep mossed-shake roofs, narrow
            shuttered windows, a slumped town hall of dressed
            stone at one end with the Gabra's iron-grey banner
            limp on its pole, six elderly militia in patched mail
            standing by the door with a thin grey dog at their
            feet, a single tavern with smoke rising from a low
            chimney. Background: the zami forest closing in on
            three sides like a wall, the canopy dark even at
            midday. Overcast late afternoon, no shadows, woodsmoke
            haze low over the rooftops.
          backdrop: >-
            A clutch of log-and-stone buildings around a packed-earth
            square with a stone well at the centre, a slumped town
            hall at one end, the dark zami forest closing in behind
            the rooftops under an overcast sky.
        environment:
          solo: >-
            Flat overcast light from a high featureless sky, the
            sour woodsmoke of green zami logs hanging in the
            square, the iron tang of the well's wet bucket, the
            far-off cawing of forest crows and a distant axe-blow
            in measured rhythm from beyond the palisade.
          backdrop: >-
            Flat overcast light, green-wood smoke, the hush of a
            frontier square watched by the forest.
      - name: The Waznoty Road
        slug: the_waznoty_road
        region: egzami_frontier
        type: road
        description: >-
          The main Zkęd road leading from the Egzami frontier
          townships into the interior forest. Rutted cart-track
          flanked by zami trees. Every half-mile is marked by a
          weathered wooden stake carved with a guild sigil.
          Within the last year, several of the stakes have been
          re-carved with the Daggereyes' knife-mark over the
          original sigil.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view down a deeply rutted
            cart-track curving into a dark zami forest. Foreground:
            twin parallel wheel-ruts pressed deep into wet brown
            earth, a single waymarker stake of weathered black wood
            leaning slightly off-vertical, its original guild sigil
            half-erased and overcut with a fresh crude knife-mark
            blade-stroked into the grain. Middle ground: the track
            narrowing between two dense walls of zami trees with
            arrowhead leaves and pest-resistant black bark, a
            broken handcart abandoned on the verge with one wheel
            collapsed. Background: the track vanishing into
            forest-dusk gloom, the canopy meeting overhead and
            cutting the sky to a thin grey ribbon. Late afternoon,
            light failing under the leaves.
          backdrop: >-
            A deeply rutted cart-track curving away between two dense
            walls of dark zami trees, a leaning waymarker stake at
            the verge, the canopy closing the sky to a thin grey
            ribbon overhead.
        environment:
          solo: >-
            Cold green forest-light from frame-front, the wet-leaf
            smell of zami mulch underfoot, no birdsong at all, the
            slow creak of branches in a wind too high to feel at
            ground level, a single far-off raven-call placed too
            deliberately to be coincidence.
          backdrop: >-
            Cold green forest-light, wet-leaf damp, a watchful
            silence under the canopy.
      - name: Gan's Hut
        slug: gans_hut
        region: egzami_frontier
        type: hideout
        description: >-
          A camouflaged trapper's hut made of mud, leaves, and
          branches, hidden 500 yards southeast of Upre. The
          interior is unexpectedly tidy — Gan keeps the pelts
          cured, the firewood stacked, and the knives sharpened.
          He trades a handful of squirrel, raccoon, and beaver
          pelts through Upre each week.
        visual_prompt:
          solo: >-
            Wide ground-level landscape view of a camouflaged
            trapper's hut nestled between zami trunks at a
            forest's inner edge. Foreground: a fall of dead leaves
            and broken ferns over a pelt-stretched drying-frame, a
            small split-log chopping block with a hand-axe driven
            into it, three squirrel pelts pegged to a low rope.
            Middle ground: the hut itself, a low dome of mud,
            packed leaves, and lashed branches almost
            indistinguishable from the forest floor at any
            distance, a single hide-flap doorway tied back to
            reveal a glow of banked firelight, neatly stacked
            firewood under a leaf-thatched lean-to. Background:
            the dark interior forest receding between black trunks,
            no sky visible. Pre-dusk, the failing daylight blue-grey
            between the trees.
          backdrop: >-
            A low dome of mud, packed leaves, and lashed branches
            tucked against a dark zami trunk, a hide-flap doorway
            ringed in faint firelight, stacked firewood under a
            leaf-thatched lean-to alongside.
        environment:
          solo: >-
            Blue-grey forest dusk from above the canopy, the
            cured-pelt and woodsmoke smell of an interior banked
            for the night, the wet-loam tang of leaf-mulch, no
            birdsong, the small clear sound of a knife being honed
            in long even strokes from within the hut.
          backdrop: >-
            Blue-grey forest dusk, banked-fire warmth, the slow
            steady rhythm of a blade being honed.
      - name: The Daggereyes' Forest Camp
        slug: daggereyes_camp
        region: egzami_deep
        type: hideout
        description: >-
          The current base of the Daggereyes — moved every few
          weeks, currently in a clearing around a fire-scarred
          stump deep in the zami trees. Srárný sleeps on a cot
          of furs and keeps the Eye beneath her pillow. Stolen
          goods are sorted by category along the clearing's
          edge, awaiting disposal through Wazdia channels.
        visual_prompt:
          solo: >-
            Wide landscape view of a brigand camp in a small forest
            clearing deep in the zami trees. Foreground: a great
            blackened tree-stump at the clearing's centre, its top
            charred concave from continuous fires, a low cooking-
            ring of stones around its base with a single iron pot
            on a chain-tripod and the embers still red. Middle
            ground: a fur-piled cot under an oilcloth lean-to to
            one side with a sheathed jade-guarded dagger laid
            carefully on the pillow, stolen cargo sorted in
            disciplined heaps along the clearing's edge — bolts of
            cloth, small grain-sacks, a rack of merchant knives,
            an iron-banded strongbox forced open. Background: dark
            zami trunks crowding the clearing on all sides, the
            canopy black overhead. Late dusk, the fire's red glow
            the only light, deep shadow in the surrounding trees.
          backdrop: >-
            A small forest clearing centred on a blackened
            tree-stump with a low cooking-ring around it, a
            fur-piled cot under an oilcloth lean-to to one side,
            stolen cargo heaped at the edges, the dark zami trunks
            crowding close on all sides.
        environment:
          solo: >-
            Low red firelight rising from the stump-ring, the iron
            smell of wet blade-edges and old smoke, the resinous
            tang of zami-wood embers, a low murmur of male voices
            from out of frame in the surrounding dark, the
            occasional clink of a sharpening stone against steel.
          backdrop: >-
            Low red firelight, wet iron and resin smoke, the murmur
            of unseen voices in the surrounding dark.
      - name: The Egzami Tree-line
        slug: egzami_tree_line
        region: egzami_frontier
        type: frontier
        description: >-
          The sharp edge of the Egzami where the zami trees
          give way to cleared fields and distant pasture. Upre
          sits just outside the tree-line; Gan's hut sits just
          inside. The tree-line is where most encounters with
          the forest-interior happen — the place where a
          traveller decides whether they are still in
          civilisation or not. The answer is almost always "no
          longer."
        visual_prompt:
          solo: >-
            Wide landscape view along the abrupt boundary where a
            dark forest ends and cleared frontier farmland begins.
            Foreground: stubble of a recently scythed field of
            uděl grain on the cleared side, a single split-rail
            fence line running along the tree-edge, a Zkęd
            boundary-stone of dressed grey rock with a worn carved
            sigil. Middle ground: the zami forest rising in a
            single dense wall of black-barked trunks and
            arrowhead-leaf canopy, the demarcation so sharp it
            could have been cut with a blade, three dark gaps
            where trails enter and disappear within a few yards.
            Background: distant pasture sloping away to the
            horizon on the cleared side, a thread of smoke
            betraying a farmstead, low grey ridgelines beyond.
            Overcast morning, no warmth in the light.
          backdrop: >-
            A sharp boundary between cleared frontier field and a
            dense wall of dark zami forest, a single split-rail
            fence and a worn Zkęd boundary-stone marking the line,
            distant pasture sloping away on the cleared side.
        environment:
          solo: >-
            Flat grey morning light from a featureless overcast,
            the chaff-and-mulch smell of cut grain on one side and
            the cold leaf-damp of the forest interior on the other,
            a measurable temperature drop at the tree-line itself,
            the distant lowing of a single cow from a farmstead
            out of frame.
          backdrop: >-
            Flat grey morning light, the meeting of cold forest-
            damp and dry chaff, a distant cow lowing.
      - name: The Spillway Tavern
        slug: the_spillway_tavern_upre
        region: egzami_frontier
        type: tavern
        description: >-
          Upre's only tavern. A low-ceilinged room with a
          plank bar and six stools, run by a woman named
          Fletta who buys her ale from a Wazan brewer and her
          gossip from whoever's passing through. Quiet
          conversations happen at the table nearest the fire,
          where the door's creak can be heard first.
        visual_prompt:
          solo: >-
            Wide interior landscape view of a low-ceilinged Zkęd
            frontier tavern. Foreground: a worn plank floor with
            scattered straw and a single overturned wooden cup, a
            small square table closest to a stone hearth set with
            two pewter mugs and a half-eaten heel of dark rye. Middle
            ground: a rough plank bar running the long wall with
            six tall stools, three small tallow candles in iron
            holders along its length, a wall-rack of clay flagons
            and tarnished pewter behind, an open low doorway to a
            back room. Background: a single small window of bottle-
            glass set deep in the log wall, a banked iron-grate
            fire throwing red light onto the dark beam ceiling,
            shadows pooling thick in the corners. Evening, the only
            light from hearth and candles.
          backdrop: >-
            A low-ceilinged tavern room with a long plank bar and
            six stools, a small square table by the hearth, three
            tallow candles in iron holders along the bar, a banked
            grate fire throwing red light into a beam-ceilinged
            dark.
        environment:
          solo: >-
            Warm hearth-light from frame-right and the guttering
            yellow of three tallow candles along the bar, the sour
            smell of imported Wazan ale and the resinous burn of
            zami-wood in the grate, a constant low ambient creak
            of settling beams, the deliberate hush at the
            hearth-table where any newcomer's tread on the
            threshold will be heard first.
          backdrop: >-
            Warm hearth and tallow light, sour ale and zami smoke,
            the hush of a room listening for the door.
    tropes:
      - id: the_wazdia_eyes
        status: dormant
        progression: 0.05
        notes:
          - "Górzymi is watching the party at Ebbe's request, not the Wazdia's — yet."
      - id: the_zygwa_sought
        status: dormant
        progression: 0.00
      - id: the_mistos_tide
        status: dormant
        progression: 0.00
      - id: the_book_tightens
        status: dormant
        progression: 0.00
      - id: the_dust_speaks
        status: dormant
        progression: 0.00
      - id: the_slave_markets_break
        status: dormant
        progression: 0.00

  # ───────────────────────────────────────────────────────────────────
  # EARLY (Sessions 6-12): The wider world comes into view
  # ───────────────────────────────────────────────────────────────────
  - id: early
    label: "Three Crowns Tighten"
    session_range: [6, 12]
    location: "Across the Egzami, the Klas, and into Pę"
    atmosphere: >-
      The party has opened the forest and found the continent.
      The Epäässä Townhill is a revelation — violence punishable
      by death, outsiders walking freely, the Herdsman's weather
      cold and clean above the Klas. Gull-ships from the
      Sabulous Islands call at Pę with holds full of spice and
      stories, and the Wujasjav mage guild charges extortionately
      for any working and collects the cost in years. And
      underneath every conversation in Wazan there is the
      quieter conversation — who is really Isku VIII's heir, and
      which of his three sons will emerge alive from the
      succession.
    active_stakes: >-
      Waz Isku VIII is visibly weakening. Ndiziały's Wazdia
      grip is tightening on the countryside. Mistos raiders have
      taken a second buffer-village in the Zbóźny foothills. A
      Jambiendo captain has docked at Pę with a message the
      Wujasjav wants intercepted. A Vaermm Book-Checker has
      passed through Upre on his way to the Reaches and stopped
      to watch the party's inn-room for an hour without entering
      or speaking. The Widząn Zamzau makes first formal contact.
    character:
      level: 5
      hp: 36
      max_hp: 36
      ac: 14
      milestones_earned:
        - "triumph:Delivered at least one Daggereye hand to Ebbe"
        - "connection:Earned the guarded respect of an Aldkin Njörkte at Epäässä"
        - "discovery:Read a Wazdia-coded letter (without the Ring)"
        - "survival:Crossed the Jälv without Wazdia papers"
    npcs:
      - name: Strasso e'Ezechassaisertando
        role: Jambiendo gull-ship captain
        location: Pę harbour, the Frutos
        disposition: 10
        description: >-
          A Jambiendo captain in middle age, happiest on the
          quarterdeck of his gull-ship the Frutos. Dark-skinned,
          gold and silver bell-hoops in his ears, dresses in
          light tralbotura despite Pę's chill. Will sell passage
          east for the right price and the wrong favour. Carries
          news the Wujasjav wants.
      - name: Njörkte Bädd Hanga-of-the-Mäinkin
        role: Divine oracle of the Aldkin
        location: Epäässä, under the ancestor-spirit circle
        disposition: 15
        description: >-
          A senior Njörkte of the richest Aldkin clan, already
          visibly aged from the prophecies she has paid for.
          Gives her prophecies for the price of a year of life
          each. Has prophesied, recently, that the Zbóźny will
          speak the dead Ingurdios language aloud within the
          decade — a statement she refuses to explain.
      - name: Ndiziały Zblášzed
        role: Youngest son of Waz Isku VIII; secret controller of the Wazdia
        location: Wazan court by day, Wazdia back rooms by night
        disposition: -15
        description: >-
          The youngest of the Waz's three sons and the most
          dangerous. Publicly the quietest, privately the one
          whose hand is at the Wazdia's collar. Twin brothers
          Zisku and Kisku are the public heirs; Ndiziały is the
          one everyone should be worrying about.
      - name: Widząn Recruiter (unnamed)
        role: First Widząn contact
        location: A back room in Wazan, reached through the Spillway's back door
        disposition: 10
        description: >-
          A Widząn at the "Lwowar gra na`Halla" rank — Seeker of
          the Heir. Approaches the party with a small task
          disguised as a courier job. If the task is completed,
          a formal invitation follows. The Widząn do not
          normally admit non-Zkęd, but they are desperate this
          season.
    points_of_interest:
      - name: Epäässä (the Townhill)
        slug: epaassa_townhill
        region: epaassa_townhill
        type: settlement
        description: >-
          The Aldkin peace-ground — a low settlement of stone
          and turf raised on an ancient hill above the Klas.
          Trading stalls ring the outer circle, the Njörkte
          council-fire burns in the centre, and every weapon
          visible on the Townhill is carried by a traveller
          who has not yet been told the rule. The rule is
          enforced by everyone. The Herdsman's weather is
          reliably mild here, which the Njörkte take as
          endorsement.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of an Aldkin neutral
            peace-ground rising from open steppe-grass. Foreground:
            broad packed-earth approach with a ring of low stone
            ancestor-cairns set at intervals, no fence and no
            guarded gate. Middle ground: a low settlement of
            stone-and-turf round-houses laid in concentric circles
            on a flattened hilltop, trading stalls of stretched
            black Anta-hide along the outer ring, a great
            council-fire of cut steppe-wood burning low in a
            central stone bowl with three figures in fur-shouldered
            Njörkte robes seated around it, no weapon visible on
            any waist. Background: the Klas grassland rolling away
            to the horizon under a wide pale sky, a thin column of
            herd-dust on a far ridge. Late afternoon, low warm
            directional sun, long shadows reaching east across the
            grass.
          backdrop: >-
            A low hilltop settlement of concentric stone-and-turf
            round-houses with hide trading stalls along the outer
            ring, a great council-fire burning in a central stone
            bowl, the Klas grassland rolling away to a wide pale
            horizon.
        environment:
          solo: >-
            Low directional steppe-sun from frame-right, the dry
            sweet smell of cured grass and Anta-leather mingling
            with the woodsmoke of the council-fire, a constant
            light steady wind moving the grass in waves, the
            distant high call of a steppe-hawk and the closer
            small clack of bone trade-tokens being counted.
          backdrop: >-
            Low warm steppe-sun, dry grass and Anta-hide, the
            steady wind across an open horizon.
      - name: The Klas Horse-Market
        slug: the_klas_horse_market
        region: klas_steppes
        type: market
        description: >-
          The informal horse-trading ground just outside the
          Epäässä peace-boundary, where Aldkin clans sell and
          buy Anta mounts. An Anta is worth fifty percent more
          than a normal horse, and the price is negotiated in
          Jabber or Aldkin with a lot of ritual spitting. No
          weapons are drawn here, but there is always a
          Njörkte watching from the hillside.
        visual_prompt:
          solo: >-
            Wide landscape view of an open-air horse-market on the
            grass just outside an Aldkin peace-boundary. Foreground:
            a long line of glossy black Anta horses standing
            tethered to a single rope strung between two driven
            stakes, each with stiff cropped ruff-mane, dust pooling
            around their hooves where the grass has been worn
            through. Middle ground: two small clusters of Aldkin
            traders in fur-shouldered coats facing each other in
            haggling pairs, the ritual gesture caught mid-motion,
            saddle-blankets and woven bridles laid out on the
            ground between them, a small pile of trade-silver on
            a folded cloth. Background: the low turf curve of the
            Townhill rising on the right with a single robed
            Njörkte figure standing on the slope watching, the
            open Klas grass stretching away on the left under a
            pale sky. Mid-morning, even cool light.
          backdrop: >-
            A line of glossy black Anta horses tethered along a
            single rope on worn grass with bridles and saddle-
            blankets laid out at their feet, the low curve of the
            Townhill rising in the distance with a single robed
            watcher on its slope.
        environment:
          solo: >-
            Cool even morning light from a wide pale sky, the warm
            horse-musk and trampled-grass smell mingling with cold
            iron from harness fittings, the wet snorts and stamps
            of the tethered Anta, a steady murmur of bargaining in
            three languages and the periodic loud ritual spit that
            marks the close of a deal.
          backdrop: >-
            Cool morning light, horse-musk and harness iron, the
            murmur of bargaining and the sudden ritual spit.
      - name: Wazan (the capital)
        slug: wazan_capital
        region: wazan_capital
        type: city
        description: >-
          The Zkęd capital built by Waze Lody during a dynastic
          crisis centuries ago, centered on Waz Isku VIII's
          court and the Wazdia's nerve-centre. Walls of cold
          stone, braided-iron gates at every district, and the
          sound of the Wazdia's coded drum-signals moving
          through the city at night. The noble houses
          (Zblášzed, Zężebyloz, Uzlůemar, Smrtvámi) keep town-
          seats inside the walls.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a walled Zkęd capital
            in cold dusk. Foreground: a rutted approach road
            descending past a great braided-iron gate set into a
            curtain wall of dark dressed stone, two armoured Zkęd
            sentries in somber wool and bead-braided beards
            standing impassive in the gate's pooled lamplight, a
            single iron lantern on a long chain swinging slightly.
            Middle ground: the city beyond the wall — narrow
            twisting cobbled streets between tall slate-roofed
            town-houses of cold grey stone, their windows lit one
            by one as evening comes on, four noble town-seats with
            steep gabled fronts and small flag-poles bearing faded
            family banners, a central square with a low stone
            block at its centre. Background: a high keep at the
            city's far end with narrow lit windows and a darker
            wing of the Wazdia offices beside it, ridge-lines
            beyond. Last cold dusk-light, sky bruised grey-purple.
          backdrop: >-
            A walled city of cold dressed stone behind a great
            braided-iron gate, narrow slate-roofed town-houses
            climbing the slope, a high keep with narrow lit
            windows at the far end against a bruised dusk sky.
        environment:
          solo: >-
            Cold purple-grey dusk light fading from above the
            walls, the iron-and-soot smell of street lanterns just
            kindled, the muffled clink of armoured boots on
            cobblestone and the slow rattle of bead-braided beards
            on Zkęd patrols, somewhere in the distance the dull
            low signal-drum of the Wazdia carrying through the
            stone.
          backdrop: >-
            Cold dusk fading, lantern-soot and iron, the muffled
            tread of armoured patrols and a far drum-signal.
      - name: Pę (the slave city)
        slug: pe_port
        region: pe_port
        type: city
        description: >-
          Zkędzała's great ocean port — three overlapping
          districts: Těgent the Hill of Time with its forgotten
          sundial, Věodność Celazmatko with its noble estates
          and their Waterfolk/Pakook`rook slave-labour, and
          Zypičkyvaj the tumbledown port leaning out over the
          Jälv. The slave market is open daily. The Wujasjav
          guildhall is in the shipping district. Gull-ships
          call at the harbour continuously.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a great Zkęd ocean port
            seen from the hill above. Foreground: a paved overlook
            with a low stone parapet and an ancient bronze gnomon
            mounted on a worn carved disc at its centre, the
            shadow falling true along the pavement. Middle ground:
            the city descending in three tiers — civic district of
            tall narrow stone halls with pillared porticos at the
            top, walled noble estates with formal gardens and
            lashing-posts in the middle, and a tumbledown port
            district of cantilevered timber tenements leaning out
            over the wide grey river at the bottom. Background: a
            forest of gull-ship masts crowding the harbour, a
            larger square stone guildhall set back from the docks,
            two slave-galleys made fast at a long pier, the ocean
            horizon flat and grey beyond. Overcast late morning,
            light cold and even.
          backdrop: >-
            A great port city descending in three tiers from a
            sundial-crowned hill to a forest of gull-ship masts
            along a wide grey river-mouth, walled noble estates
            and cantilevered timber tenements between, a flat grey
            ocean horizon beyond.
        environment:
          solo: >-
            Cold even overcast light from a high featureless sky,
            the sharp brine and tar smell of the working harbour
            mingling with woodsmoke from the lower district, a
            constant low background of gull-cries and the slow
            creak of ship-rigging in the wind, the distant rhythmic
            crack of a slave-driver's signal-clap rising from the
            galleys.
          backdrop: >-
            Cold overcast harbour light, brine and tar and
            woodsmoke, gull-cries over a working port.
      - name: The Zypičkyvaj Shantytown
        slug: zypickyvaj
        region: pe_port
        type: district
        description: >-
          The port district of Pę — a tumbledown shantytown of
          cantilevered houses leaning out over the Jälv in
          defiance of gravity, rebuilt continuously as
          extensions are added and previous extensions fall in.
          A larger percentage of free Pakook`rook and Waterfolk
          live here than anywhere else in the city. Knife-work
          and throat-sac songs in equal measure after dark.
        visual_prompt:
          solo: >-
            Wide low-angle landscape view of a tumbledown port
            shantytown leaning out over a wide grey river. Foreground:
            a slick of wet plank duckboards over black mud at the
            water's edge, a discarded eel-skin glove and a coil of
            tarred rope, a small lit lantern on a leaning post.
            Middle ground: a chaos of cantilevered timber tenements
            stacked four and five storeys high, each extension
            propped on the one below by raw timber struts and
            iron pins, the whole leaning visibly out over the
            water in defiance of gravity, narrow alley-mouths
            between, two short frog-humanoid figures in lily-pad
            collars moving along a rope-bridge between upper
            stories. Background: more leaning structures receding
            into mist along the riverbank, the masts of moored
            gull-ships visible past the last roofline. Late dusk,
            failing grey light, lanterns kindling one by one.
          backdrop: >-
            A leaning chaos of cantilevered timber tenements
            stacked storey on propped storey above a wide grey
            river, narrow alley-mouths between them, lanterns
            kindling at dusk, the masts of gull-ships visible in
            the receding mist.
        environment:
          solo: >-
            Failing grey dusk light from the river, the brackish
            river-mud and eel-smoke smell rising from the mooring-
            duckboards, the close human-and-frog crowding tang of
            an unwashed waterfront, a low pulse of Pakook`rook
            throat-sac song from an upper window mixing with the
            sharp wet snap of cordage drying.
          backdrop: >-
            Failing dusk light, river-mud and eel-smoke, the low
            pulse of throat-sac song from above.
      - name: The Wujasjav Guildhall
        slug: the_wujasjav_guildhall
        region: pe_port
        type: guild_hall
        description: >-
          The mage guild of Zkędzała, based in Pę. Stone-walled
          and older than most of the buildings around it. The
          Wujadru masters keep offices on the upper floors and
          interview prospective clients through a slotted
          window, refusing to discuss pricing before the
          working is named. All workings are covenants; all
          covenants cost blood, years, or names.
        visual_prompt:
          solo: >-
            Wide landscape view of a stone mage-guildhall in a busy
            port district. Foreground: a paved approach of wet
            black flagstones, an iron-bound entry door of dark
            timber set deep beneath a stone lintel carved with
            geometric reagent-sigils, a single slotted interview-
            window beside the door at chest height. Middle ground:
            the hall itself, a heavy four-storey block of older
            dressed stone set back from neighbouring buildings on
            both sides, narrow tall windows in unequal rows on the
            upper floors with two lit by candle-glow against the
            grey afternoon, a small stone offering-niche at the
            corner of the wall with three tallow candles burning
            low, a fitted iron downspout terminating in a
            stone-cut runnel. Background: the tilted timber roofs
            of the surrounding port district, a thin column of
            chimney-smoke from a hidden inner courtyard, low grey
            cloud above. Overcast afternoon, rain just past.
          backdrop: >-
            A heavy four-storey block of older dressed stone set
            back among newer port-district buildings, narrow tall
            windows in unequal rows with two lit by candle-glow,
            an iron-bound door beneath a sigil-carved lintel, a
            stone offering-niche of three burning tallow candles
            at the corner.
        environment:
          solo: >-
            Flat grey afternoon light from a heavy overcast, the
            wet-stone smell of recent rain underlaid by the
            metallic reagent-tang from somewhere inside the building,
            the close hush of a street where people are walking
            slightly faster than they need to, a single small bell
            audible from a long way off.
          backdrop: >-
            Flat grey post-rain light, wet stone and reagent-iron,
            the deliberate hush of a guarded threshold.
      - name: The Hill of Time
        slug: the_hill_of_time
        region: pe_port
        type: landmark
        description: >-
          A 250-foot hill at the centre of Pę crowned by an
          enormous Tismenni sundial and gnomon, placed there by
          the drowned empire and maintained without modification
          by every successor. The sundial still tells accurate
          local time. No current Zkęd knows how it was placed or
          why it sits on this specific hill. The Návajíaim
          mayor's mansion and the Sięcej council houses cluster
          at the hill's base, in the civic district of Těgent.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of an ancient sundial-
            hill rising above a port city's civic district.
            Foreground: a worn paved approach path winding up the
            grassy slope, a low stone retaining wall, three small
            offering-bowls of old brass set on a flagstone at a
            switchback turn. Middle ground: the hill's flat
            summit, a single great bronze gnomon rising from a
            massive carved stone dial-disc cracked across one
            quadrant and patched with later iron clamps, the
            shadow falling true across worn calibration-marks, no
            human figures present. Background: at the hill's base
            the civic district of pillared stone halls and the
            tall narrow gabled façade of a mayor's mansion, the
            wider port beyond receding to the grey ocean, low
            cloud above the harbour. Late afternoon, the light
            already slanting long across the dial.
          backdrop: >-
            A flat hill-summit crowned by a great bronze gnomon
            rising from a carved and iron-patched stone dial-disc,
            its shadow falling true, a port city's pillared civic
            district visible at the hill's base below.
        environment:
          solo: >-
            Late afternoon light slanting across the dial from
            frame-right, the dry warm smell of sun-baked grass and
            old bronze patinated green at the joints, the steady
            wind off the ocean carrying the far gull-cries of the
            harbour, the small ringing of a distant civic bell
            sounding the hour the dial confirms.
          backdrop: >-
            Long late light, sun-warm bronze and dry grass, a
            distant bell confirming the hour.
