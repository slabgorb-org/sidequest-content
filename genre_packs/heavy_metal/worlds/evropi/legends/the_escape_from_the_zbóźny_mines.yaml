id: the_escape_from_the_zbozny_mines
name: The Escape from the Zbóźny Mines
culture: all (recent, still being told)
period: ~-2 SR (within living memory)
summary: The escape of the half-orc mercenary Prot'Thokk and the gnome he refused
  to leave behind from a Mistos-run shaft in the Ingurdios mines — a rare documented
  mine-escape and a story the Mistos are at pains not to let circulate.
details: Prot'Thokk was taken off a mercenary contract somewhere west of the Zbóźny
  foothills by a Mistos slaving-party that assumed, not incorrectly, that a half-orc
  alone on the frontier was worth more below ground than above it. He was chained
  into a shaft called the Third Cut, in the Ingurdios mines beneath the Zbóźny range,
  and worked alongside Ingurdios miners and a thin scatter of non- Ingurdios captives
  — mostly gnomes, whose hands the Mistos wanted for the narrowest seams. . He was
  in the Third Cut for an amount of time he will not specify to anyone who asks. What
  he does say is that on the morning he left, he went back down one level to collect
  a gnome — smaller, quieter, and slower than Prot'Thokk, and twice as marked by the
  work — whom he had been quietly feeding extra bread for long enough that the Mistos
  overseers had not yet noticed the arithmetic. The gnome's name, as near as anyone
  who has drunk with the two of them has been able to write it down, is Cheeney. The
  two of them came up through a back-seam that had been condemned after a rockfall
  the previous winter, and a Mistos quarter-officer who disagreed with their transit
  did not survive the disagreement. . They came out of the Zbóźny foothills into Zkęd
  territory, where a half-orc escapee is not a priority of the local Gabras, and have
  been working the frontier ever since — Prot'Thokk on mercenary contracts that are
  not too particular about paperwork, and the gnome as whatever the contract requires
  (sapper, small-tunnel specialist, quiet watcher, occasional shield). Neither of
  them goes back toward the Zbóźny, and neither of them answers questions about exactly
  who else they left behind. The Mistos have a standing price on Prot'Thokk's head.
  It is not very large, because advertising the escape would publicise that the escape
  happened.
notable_figures:
- Prot'Thokk
- Cheeney (the gnome who came up with him)
