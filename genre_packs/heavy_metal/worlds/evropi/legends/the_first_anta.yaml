id: the_anta_horse
name: The First Anta
culture: Aldkin
period: early Second Rising
summary: The legend of how the Aldkin first bred the coal-black Anta horse with its
  glossy coat and stiff cropped mane.
details: In the early Second Rising, the Aldkin clans were ordinary riders of ordinary
  horses until a Mäinkin rider named Nöyd-the-Wind-Reader found a black foal in a
  thunderstorm on the Klas, the only surviving foal of a mare struck by lightning,
  and raised it to be the first Anta. The foal grew into a coal-black stallion with
  a glossy coat that reflected no colour but the sky, a stiff mane cropped short for
  the first time by the lightning itself, and twice the speed and endurance of any
  horse the Aldkin had ever bred. Nöyd called the stallion Anta, which in Aldkin means
  simply "horse" — because once you have seen a true Anta, every other horse is no
  longer a horse in the same way. Every Anta alive descends from that first stallion.
  The Mäinkin clan became the richest because they kept the bloodline longest.
notable_figures:
- Nöyd-the-Wind-Reader
