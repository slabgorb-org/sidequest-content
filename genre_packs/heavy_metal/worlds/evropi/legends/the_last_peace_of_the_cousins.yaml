id: the_last_jambiendo_bladtrablo_peace
name: The Last Peace of the Cousins
culture: Jambiendo and Bladtrablo
period: long ago
summary: The last time the seafaring Jambiendo and the undersea Bladtrablo were not
  at war. No one alive remembers when exactly this was.
details: The Jambiendo and the Bladtrablo are cousin peoples — elvish, sea-bound,
  sharing a distant ancestry neither side wants to discuss. They are blood enemies
  now, and have been for so long that no living captain or vent- smith remembers the
  reason. The legend, told in different forms on both sides, holds that the last peace
  between the two peoples was an agreement so total and so amicable that its ending
  required a betrayal of monstrous specificity — the details of which each side now
  blames the other for. The peace ended with a gift exchanged and misunderstood; the
  gift is still held on one side of the water, and its counterpart is missing from
  the other. If the two gifts were ever brought together, the legend says, the feud
  would end. Neither side is looking. Both sides suspect the other of keeping their
  half hidden somewhere difficult.
