id: the_cataclysm
name: The Cataclysm
culture: all
period: '-11540'
summary: The comet that struck the ocean and drowned the Tismenni empire in a single
  week, ending the Golden Age and beginning the Dark Age.
details: Twelve thousand years ago, a large comet struck the ocean beyond the Řeknu.
  The impact sent a wall of water across the continent that destroyed the low coastal
  cities of the Tismenni empire within a single day and the high cities by the end
  of the week. The Chalky Cliffs were cut sharper by the tsunami, which is why some
  scholars read them as the boundary of the Land of Dust — the barrier between the
  living and the drowned. The empire of the Tismenni did not survive the waters or
  the famines that followed. What survived was the language, carried by a handful
  of survivors into the highlands and preserved in oral then written form by every
  subsequent culture that wanted to read old books. Every living people on Evrópí
  remembers the Cataclysm in their own oral tradition, under their own name. The Aldkin
  call it the Drowning- Year. The Zkęd call it the Great Breaking. The Vaermm do not
  have a name for it, because the Book of Aest does not permit historical speculation
  beyond the Book itself, and the Cataclysm happened before the Book.
