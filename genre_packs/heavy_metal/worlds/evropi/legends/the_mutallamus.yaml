id: the_mutallamus
name: The Mutallamus
culture: Zkęd
period: year t34115 of the old calendar; Zony 3 Kbelsk
summary: The betrayal and deposition of Waz Zamzau of Zkędzała by his cousin Pętu
  na Renwaz, engineered through the seduction of Zamzau's young wife Auteny. The founding
  trauma of modern Zkęd politics and the origin of the Widząn Zamzau rebel cult.
details: In the year t34115 of the old Zkęd calendar, Zamzau was the new-crowned Waz
  of Zkędzała, one month into his reign. His wife Auteny was young and beautiful.
  His cousin Pętu na Renwaz — son of Zamzau's father's brother Soku — seduced Auteny
  and convinced her to deliver the throne to him. She betrayed Zamzau to Pętu's men;
  Pętu deposed and killed Zamzau in the event now called the Mutallamus. Pętu then
  betrayed Auteny in turn, throwing her into the dungeons beneath Malach and eventually
  having her flogged to death. The one thing every version of the legend agrees on
  is that Zamzau, before his death, forgave his wife's infidelity and treachery —
  such, the songs say, was the goodness of his heart and his love for his young bride.
  Pętu na Renwaz founded the city of Pę (originally named Pętu, shortened over the
  centuries, some say to avoid the Usurper's name) and moved the capital there. The
  Zkęd throne has not been held by Zamzau's direct bloodline since. The Widząn Zamzau
  holds that it should be, and is searching for the Zygwa — the lost heir.
notable_figures:
- Zamzau
- Auteny
- Pętu na Renwaz
