id: the_not
name: The Not (the forgotten oppressor)
culture: all
period: ~-200 to 0
summary: The polity the year-zero rebellion overthrew. Its name was not preserved
  by the rebels, and the forgetting has been doctrine for three thousand years.
details: Toward the end of the Second Rising, one polity rose to continental dominance
  and became oppressive in ways no surviving history describes. The rebellion against
  this polity succeeded in the year now counted as 0, and the rebels — or the generation
  that followed them — chose not to preserve the name of their oppressor. The histories
  call the polity only "the Not," which some scholars have taken as a linguistic joke
  (the "not-a-name") and others as a pointed refusal (we do not say who they were).
  Three millennia later, the forgetting has become a pact kept by every culture on
  the continent. To name the Not publicly is an act of historical hygiene that the
  scholarly consensus treats as taboo and the Wazdia treats as sedition. The Tismenni
  dead, it is said, still remember the name, and will give it to any living scholar
  who asks correctly. The Tismenni dead are also said not to give it lightly, and
  the scholars who have asked are, by scholarly tradition, the ones who have never
  published again.
