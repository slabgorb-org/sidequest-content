id: the_kobold_in_the_amber
name: The Kobold in the Amber
culture: all (recent, still spreading)
period: -4 SR (within living memory)
summary: The discovery of Rux — a kobold of the dragonkin Tismenni servant caste —
  preserved in a globe of Tismenni amber magic in a buried stratum chamber, and the
  unresolved question of what to do about him now that he is awake.
details: A small party of adventurers, whose names the story does not bother to preserve,
  entered a buried Tismenni chamber somewhere under the Zbóźny foothills and found,
  in a side-alcove that had been sealed since before the Cataclysm, a globe of the
  pale-gold preservation-amber the Tismenni used on things they intended to outlast
  history. Inside the globe was a creature roughly the size of a mid-sized dog, scaled,
  short-muzzled, long-tailed, and entirely unknown to any living scholar. The party
  brought the globe out of the ruin without breaking it, which was the first of their
  good decisions. They took it to a Vaermm book-checker named Njurel who recognised
  the creature only from an illumination in a Tismenni scholarly text she was not
  supposed to own. Njurel confirmed the creature was a kobold — a servant caste of
  the Tismenni dragonkin, all of whom had been assumed dead for twelve thousand years.
  The party thawed him, carefully, by a method Njurel is not telling anyone. He woke
  up. He was extremely polite. He introduced himself, in a Tismenni dialect Njurel
  could mostly follow, as Rux. . Rux learnt Trosse in eleven weeks, took no master,
  and declined every scholarly invitation issued to him. He travels now — on foot,
  mostly, with an occasional leg up from merchants who pity the "dog" — between the
  surviving strata-sites of Evrópí, examining what the survivors left behind and commenting,
  when pressed, on how the current age has arranged the furniture. He does not appreciate
  being patted on the head. He does not appreciate being fed kitchen scraps. He has,
  on several occasions, had to correct the Wazdia about his species, which is not
  a conversation the Wazdia enjoys having. . Scholars have been trying to find another
  amber globe for three years. Rux, on the rare occasions he comments on the matter,
  suggests they stop. Whether the remaining Tismenni strata contain other preserved
  kobolds — or other preserved Tismenni — is, in the worlds of the current age, the
  most consequential unanswered question no one wants to answer aloud.
notable_figures:
- Rux
- Njurel the Book-Checker
