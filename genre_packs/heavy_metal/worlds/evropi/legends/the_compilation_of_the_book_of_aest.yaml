id: the_book_of_aest_compilation
name: The Compilation of the Book of Aest
culture: Vaermm
period: ~-10900, early Dark Age
summary: The death of Aest and the compilation of her teachings into the scripture
  that would govern every aspect of Vaermm life for the next ten thousand years.
details: Aest was a Vaermm teacher in the early Dark Age, when the survivors of the
  Cataclysm were still scattered through the foothills and the eastern scrublands,
  and the old Tismenni certainties had crumbled. She taught a rigid belief system
  she called "right-thinking" — a prescribed pattern of thoughts, learned from tradition,
  so consistent that original thought became impossible, and with it (Aest argued)
  crime, deviance, and every other anti-social behaviour. The Vaermm who followed
  her teaching found it comforting in a world that had just lost its underpinnings,
  and after her death compiled her sayings, teachings, and anecdotes into the Book
  of Aest. The Vaermm social system became entirely dependant on the Book's tenets.
  "All behavior that is not mandatory is forbidden in Vaermm society" is the canonical
  summary. Magic use, invention, and original art were severely stifled as side effects.
  Every Vaermm has copied out their own Book of Aest at coming-of-age for ten thousand
  years without amendment. The compilation has, in Vaermm thought, no beginning —
  the Book was always the Book, even when it was still being remembered.
notable_figures:
- Aest
