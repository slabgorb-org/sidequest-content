id: the_mistos_general_origin
name: The First General
culture: Mistos
period: early Second Rising
summary: The coalescing of the Mistos into a military junta under their first General.
  An internal legend, not shared with outsiders; the Mistos do not publish their origin
  story.
details: 'The Mistos do not publicly tell outsiders how they came to be. Their internal
  legend, known only to Mistos who have risen high in the Host, holds that the first
  General was a Mistos woman of the early Second Rising who proved she was the most
  beautiful Mistos alive by challenging every rival to a formal appearance-duel —
  a ritual the Mistos still practise in miniature at every officer promotion. Having
  won, she was by definition the fittest to rule, and the Mistos — whose entire ideology
  is that beauty equals fitness equals authority — had no way to argue. The first
  General conquered the other Mistos clans through the same logic, and every subsequent
  General has been the "most beautiful living Mistos" as certified by a ritual that
  is never questioned publicly. The Mistos Jambiendo-separation — the event in which
  the two elven peoples split into cousin-races — is explained in Mistos internal
  teaching as a choice: the first General''s ancestors chose discipline over the Jambiendo
  choice of drift. The Jambiendo version, to the extent they speculate at all, is
  that the separation was an accident of migration neither side bothered to reverse.'
notable_figures:
- the first General
