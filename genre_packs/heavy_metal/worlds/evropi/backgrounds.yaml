# Evrópí — WWN Backgrounds, world tier (SRD §1.3)
#
# These 9 ids EXACTLY match the `background:` values authored in
# char_creation.yaml's `origins` scene. Do not rename them.
# Resolution: world-tier replaces genre-tier entirely for evropi sessions.
#
# Culture register: Zkęd settlement and ledger politics, Aldkin steppe
# honor, Waterfolk/Pakook`rook marsh survival, Mistos exile paranoia,
# Vaermm liturgical precision, Jambiendo/Bladtrablo sea-feuds, Tismenni
# scholar lineage, Sest-Marked infernal inheritance, Rare-Kin catch-all.
#
# All skill names must be in skills.yaml (heavy_metal/skills.yaml).

- id: Zkęd-Frontier
  display_name: Zkęd, Frontier Township
  description: >-
    You grew up in the Zkęd settlements or the Egzami forest rim —
    a land where no room is ever entirely private and you learned which
    weeks to stay out of the lower hall and which weeks the Wazdia are
    watching somewhere else. Metal bead-work in your hair, a working
    knowledge of the tithe schedule, and a deeply practical understanding
    of when to be invisible.
  free_skill: Connect
  quick_skills:
    - Connect
    - Sneak

- id: Aldkin-Rider
  display_name: Aldkin, Klas Steppes
  description: >-
    Raised on the Klas steppes under the Herdsman's long care, riding
    an Anta horse before you could walk unaided, you know the rules
    of Epäässä — the hill where the Aldkin keep their peace and where
    the shedding of blood is answered with the shedding of the blood
    of the one who shed it. You left for reasons you do not yet have
    to explain.
  free_skill: Ride
  quick_skills:
    - Ride
    - Survive

- id: Marsh-Kin
  display_name: Waterfolk or Pakook`rook, Marshes
  description: >-
    Salt Waterfolk of the Hvoru or freshwater Pakook`rook of the deeper
    swamps — two peoples the Zkęd enslave interchangeably and ship
    drugged on reniksnad to the Pę markets. You are free and carrying
    your own name because you walked out of something you should not
    have walked out of, and you are still walking.
  free_skill: Survive
  quick_skills:
    - Survive
    - Sneak

- id: Mistos-Exile
  display_name: Mistos, in Exile or Hiding
  description: >-
    Born Mistos — the tall elf-supremacist junta that marches southward
    in red-and-black silk — and not with them now. Perhaps you were born
    with the wrong birthmark; perhaps you read one book too many in
    the Puppet-Seat; perhaps you simply disagreed aloud. The General
    has a standing instruction about Mistos who leave. You know it
    without being told.
  free_skill: Sneak
  quick_skills:
    - Sneak
    - Convince

- id: Vaermm-Scribe
  display_name: Vaermm, of the Scrublands
  description: >-
    You copied out your own Book of Aest at coming-of-age, as every
    Vaermm must — ten thousand pages, no error permitted. Perhaps you
    did not stop at your own Book. You know that everything not mandatory
    is forbidden, and you know this has shaped you in ways no one raised
    outside the Book can understand.
  free_skill: Know
  quick_skills:
    - Know
    - Pray

- id: Sea-Bound
  display_name: Jambiendo or Bladtrablo, of the Sea
  description: >-
    Elvish and sea-bound — Jambiendo of the spice-trading gull-ships or
    Bladtrablo of the volcanic vents beneath the Řeknu — on the mainland
    for a reason no one who asks will hear aloud. The feud between your
    two peoples is older than anyone alive remembers why. You maintain
    it anyway.
  free_skill: Sail
  quick_skills:
    - Sail
    - Trade

- id: Tismenni-Descended
  display_name: Tismenni-Descended Scholar
  description: >-
    Your family line — you believe — threads back through the drowned
    empire, twelve thousand years old and mostly dead save for the
    language your grandmother taught you in whispers. Whether true or
    comforting family legend is a question you have been careful not
    to resolve. You read Tismenni well enough to get into trouble
    in libraries.
  free_skill: Know
  quick_skills:
    - Know
    - Connect

- id: Sest-Marked
  display_name: Sestayty, of the Infernal-Marked Remnant
  description: >-
    Your blood runs back to the fallen Empire of Sest, that rose too
    fast out of the Cataclysm on pacts with infernal things — and you
    carry the mark those pacts left: a cinder that will not cool, a
    brand of unreadable script under the skin, a scatter of salt-white
    scarring. The Mistos would sterilize you for it. You keep your
    sleeves down.
  free_skill: Magic
  quick_skills:
    - Magic
    - Sneak

- id: Rare-Kin
  display_name: Rare Kin, Unlisted Peoples
  description: >-
    You are not from any of the continent's standing peoples — or at least
    not obviously. The Wazdia informer turned the ledger to a blank column
    at the back and asked you to describe yourself by your own word for
    what you are. They have written stranger things. The book will hold it.
  free_skill: Survive
  quick_skills:
    - Survive
    - Connect
