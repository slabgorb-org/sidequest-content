# Seed tropes for heavy_metal/evropi — world-tier deck (Epic 94: genre is the
# rulebook only; flavor lives in the world). Short-arc narrative hooks dealt at
# session start and on engagement/lull draws, expiring after lifespan_turns and
# lingering as ghosts for later callback (ADR-018, ADR-128). Seeds are baited
# hooks (ADR-014 diamonds-and-coal) — deliberately vague; the narrator threads
# an engaged seed into whatever the Egzami frontier demands.
#
# Without this file evropi drew from an empty deck and the lull-escalation
# engine declined `none_available` on every quiet turn — which left the narrator
# inventing crowds of NPCs to fill watched, silent scenes (the bug this fixes).
#
# Pitched to evropi's named idioms, NOT grimdark-fantasy cliche. heavy_metal's
# identity is PACTS, DECAY, and BLOOD-PRICED MAGIC, and this world names the
# currencies exactly: the Wujasjav covenant that costs blood, years, or a name;
# the 999 Crimson Gods who take a face and a name and come to collect when the
# term lapses; reniksnad, the Pę slave-drug whose withdrawal kills inside a week;
# the Vaermm Book of Aest, where a single mistranscribed word costs a year of
# adult life; the Njörkte who pays for every prophecy in years off his own span;
# the Scout of the Green whose bond breaks if he loves, in tragic and specific
# ways; the Mistos Ministry that ends a bloodline on the sight of a birthmark;
# the Tismenni dead in the Land of Dust who want the Name of the Not spoken back
# into the world. Each seed names a mechanism and a price. Register is the world
# tone: watchful, cold, paperwork-dread on the Zkęd side; older and patient
# underneath. Axes: hope 0.45, tech 0.35, weirdness 0.55 — decay is the baseline,
# not the climax. Keep the kindness possible and the cost real; let nothing here
# resolve cheaply.

- id: evropi_the_term_lapses
  name: A Crimson God Has Come to Collect
  description: >-
    Someone nearby bargained with one of the 999 Crimson Gods — a private
    arrangement, a fiery visage on a household shelf, a favour granted years
    ago against a name to be paid on a term now lapsed. The god has not
    forgotten the date. The debtor has been packing in the night, paying
    others to sleep in his bed, and praying to a different god entirely, none
    of which will matter when the visage comes through the wall to take the
    name it was promised.
  flavor_tags: [pact, debt, demonic, decay]
  lifespan_turns: 6
  delivery_hints:
    - A man pays the party, in coin he plainly cannot spare, simply to sit up with him through one particular night
    - Every idol on his household shelf has been turned to face the wall except one fiery little face he will not touch
    - He cannot say his own name aloud anymore — it catches, and his mouth shapes a different word, and he weeps at that
  narrative_hint: >-
    A monkey's-paw seed (SOUL: the bargain granted literally and collected
    ruinously). Let the favour the debtor once won still be visibly working in
    his life — the saved child, the cured wife — so the price is not abstract.
    Don't let the party argue the god out of its term; a Crimson God's only
    negotiation is a worse bargain offered to whoever interrupts the collection.

- id: evropi_a_year_off_the_span
  name: A Prophecy Bought at the Teller's Own Cost
  description: >-
    A teller-of-things here pays for every truth in years off their own life —
    a Njörkte of the Klas, a hedge-seer, a Wujasjav adept who reads by
    covenant — and someone has paid them to read the party's road, or the
    party's death, or the name of an enemy. The teller has aged visibly doing
    it. What they saw was worth a year of the little life they had left, and
    they are deciding whether to say it.
  flavor_tags: [prophecy, sacrifice, omen, fate]
  lifespan_turns: 7
  delivery_hints:
    - An old teller looks decades older between one meeting and the next, and is short of breath in a way that was not there before
    - Someone with money has commissioned a reading of the party and is waiting, out of sight, for what it returns
    - The teller will not give the prophecy for free and will not say why the price falls on them and not the asker
  narrative_hint: >-
    Make the cost legible (SOUL: every mechanical truth has a named price the
    table can see). The prophecy should be real and usable, not flavour — and
    the teller's visible aging is the bill. Let the party choose whether to
    spend a stranger's remaining months on knowing their own future.

- id: evropi_one_dose_from_dead
  name: A Slave a Week From the Withdrawal
  description: >-
    Someone has come off reniksnad — the Pę slave-drug the Wazdia taxes and
    doles out to keep the Waterfolk and Pakook`rook tractable — and the
    withdrawal kills inside a week of the last dose. They are shaking, lucid in
    cruel intervals, and the only supply on the frontier runs through the
    Wazdia or the Daggereyes. To save them is to buy from the people who own
    them, or to find the one Wujasjav who can ease a withdrawal nobody walks
    away from clean.
  flavor_tags: [bondage, addiction, decay, peril]
  lifespan_turns: 5
  delivery_hints:
    - A runaway is hiding in a grain-loft, dry-mouthed and counting days on their fingers, and will not say from how many
    - The only reniksnad on the frontier is in a Wazdia-taxed lockbox, and asking after it puts a name in a ledger
    - In a clear hour the addict begs the party not to buy it — and then in the next hour begs them to
  narrative_hint: >-
    No clean exit (SOUL: graceful degradation — every road out costs). Let the
    clock be real: a week, named, ticking. Saving the addict should entangle
    the party with the Wazdia supply or the Daggereyes, and the addict's lucid
    refusal of the cure is the ache the seed turns on.

- id: evropi_the_word_that_costs_a_year
  name: A Vaermm Book With One Word Wrong
  description: >-
    A Vaermm has copied out their Book of Aest for the coming-of-age rite, and
    a single word is mistranscribed — a missing clause, a misplaced comma, one
    syllable that shifts a tenet into something the Book forbids. The error
    costs them a year of adult life, delayed until the copy is corrected, and
    the Book-Checkers read for hours and are almost never wrong. The copyist
    knows the error is there. They are deciding whether anyone else has to.
  flavor_tags: [scripture, totalitarian, error, dread]
  lifespan_turns: 6
  delivery_hints:
    - A young Vaermm guards a hand-copied book as though it were alive, and will not let the party near the open page
    - They ask, with terrible casualness, whether a person can read Vaermm script — and then withdraw the question
    - A Book-Checker has been seen on the foothill road, fast-reading, impassive, working toward this hold
  narrative_hint: >-
    The horror is the closed system, logical and cold (SOUL: the world's rules
    are real and bind the player, not just the NPC). Don't let the party erase
    the error with a clever trick; the Checkers exist precisely to catch it.
    Let the copyist's year, and whether the error was an accident, be the
    thread the party can pull.

- id: evropi_the_birthmark_seen
  name: An Inspector Who Ends Bloodlines on Sight
  description: >-
    A child here has a winestain, a wen, a mark that under Mistos racial law
    makes them less than Mistos — and the Ministry of Racial Improvement does
    not err, because in a closed system being wrong is itself a flaw. An
    inspector is travelling the road with the authority to sterilise the child,
    banish them into the Nombios, and banish the parents after a second flawed
    birth. The family is choosing, this week, between the inspector's blindness
    bought with money they do not have and a run for the gaps between the crowns.
  flavor_tags: [eugenic, exile, authoritarian, family]
  lifespan_turns: 6
  delivery_hints:
    - A Mistos family on the road keeps one child always hooded, always turned away, always asleep when strangers pass
    - A man in red-and-black silk asks polite, exact questions about every child in the township and writes the answers down
    - The parents quietly price the cost of an inspector's blindness, and it is more than they have, and they say so to no one
  narrative_hint: >-
    The cruelty is bureaucratic, not snarling (SOUL: the world's logic is the
    villain, and it is mostly sound on its own terms). Let the inspector be
    courteous and correct. The party cannot argue the law; they can only hide
    the mark, buy the blindness, or run the family — and each road makes a
    Nombios or a fugitive of someone.

- id: evropi_the_oath_he_broke
  name: A Scout Who Loved, and the Green Withdrawing
  description: >-
    A Scout of the Green broke their celibacy oath for love, and the Green's
    protection is leaving them in the specific, tragic ways the order warns of —
    a tracker who can no longer read the forest that raised him, a beast that
    will not shy from him, a wound that does not close in the wet. Gan son of
    Gan walked this road before them, left the order to marry Daliann, and
    buried her of the Black Pox within the year. This one has not buried anyone
    yet. They are still hoping the price can be refused.
  flavor_tags: [bond, love, druidic, tragedy]
  lifespan_turns: 7
  delivery_hints:
    - A former Scout's woodcraft fails at exactly the moment it should not, and they flinch as if struck by the failure
    - The forest treats them as a stranger now — birds that should hush do not, paths that should open close over
    - They speak of someone they love as if the loving were a wound they cannot stop themselves reopening
  narrative_hint: >-
    The price is named and the love is real (SOUL: consequence follows the
    choice, and the choice was worth making anyway). Don't let the party broker
    the oath back; the Green does not renegotiate. Let Gan's story stand as the
    forecast, and let the party choose whether to stand with the lover through
    the withdrawing or talk them toward the order's cold safety.

- id: evropi_the_name_the_dead_want
  name: The Drowned Dead Want a Name Spoken Back
  description: >-
    At a Tismenni ruin where the Land of Dust runs thin, the drowned empire's
    dead are speaking to the sleeping and, lately, the waking — asking for one
    specific thing in a tongue twelve thousand years dead. They want the name
    of the Not, the oppressor the rebels chose to forget so completely the
    forgetting became law, spoken aloud by a living person in a particular
    place. The dead will give the name in exchange for the speaking. They do
    not say what the name will do once it is back in the world.
  flavor_tags: [tismenni, undead, forbidden, slow-burn]
  lifespan_turns: 8
  delivery_hints:
    - Someone wakes with a Tismenni phrase on their lips they never learned, and it is a little clearer each morning
    - A dog barks at an empty corner of an old ruin for a whole afternoon, and will not be coaxed away from it
    - Dead syllables appear on a fogged window at dawn, already fading, spelling a word in a script no living people write
  narrative_hint: >-
    A slow uncanny bargain (SOUL: knowledge offered at a price the party can't
    yet price). Let the dead be patient, not hostile — the menace is the trade,
    not a fight. The name is real and load-bearing for the continent's history;
    let the party feel the weight of speaking a thing three millennia of policy
    worked to bury, without knowing the consequence until after.

- id: evropi_the_ring_in_wrong_hands
  name: A Wazdian Ring That Cannot Be Given Back
  description: >-
    A Wazdian Ring of Commission — a special agent's seal-ring, immune to
    divination, the key to the secret police's cipher-writing — has fallen into
    hands it does not belong in. Whoever holds it can decode the Wazdia's drop-
    letters and seal documents in the kingdom's authority, and the Wazdia will
    stop at nothing to recover it. The current holder cannot sell it, cannot
    wear it safely, and cannot give it back without confessing how they got it.
    It is worth a fortune and it is a death sentence on a chain.
  flavor_tags: [surveillance, contraband, political, peril]
  lifespan_turns: 5
  delivery_hints:
    - Someone is trying very hard to get rid of a heavy seal-ring and cannot find a single buyer who will touch it
    - A Wazdia field agent is asking the township, politely, whether anyone has come into unusual jewellery lately
    - The ring decodes a drop-letter the holder was never meant to read, and now they know something that will be missed
  narrative_hint: >-
    The MacGuffin is a liability, not a prize (SOUL: the world reacts; nothing
    is free loot). Let the ring's power be real and usable — it genuinely
    decodes Wazdia cipher — and let every use put a name in a ledger. The
    Wazdia's pursuit is the cost; the holder's secret of how they got it is the
    second one.

- id: evropi_the_indenture_comes_due
  name: A Covenant With the Guild Itself
  description: >-
    A Wujasjav apprentice is partway through the seven-year indenture that is
    also a personal covenant with the mage-guild — and the covenant is coming
    due in a way the apprentice did not understand when they signed it in blood
    at sixteen. The guild at Pę does not release an indenture; it collects. The
    apprentice has fled, or is about to, carrying a half-finished working that
    will demand its blood or years or name whether or not they finish it,
    because a covenant left open costs more than one closed.
  flavor_tags: [pact, guild, magic, indenture]
  lifespan_turns: 6
  delivery_hints:
    - A young person flinches at the name of the Pę guild and changes which road they are travelling when it comes up
    - They carry an unfinished working — a half-drawn covenant — that aches at them visibly, like a debt with a due date
    - A Wujadru master has sent word ahead, courteous and patient, that the guild would like its apprentice to come home
  narrative_hint: >-
    The bargain was made by a child who could not price it (SOUL: covenants
    bind, and the binding is the point). Don't let the party void the indenture
    with cleverness; the guild's covenants are stronger than a clever plan. Let
    the half-finished working be a real mechanical liability the party can help
    close or help carry, each at a price the apprentice names.

- id: evropi_the_quiet_killing_that_held
  name: A Killing That Would Not Take
  description: >-
    One of the Kingdom of Zkędzała's quiet killings did not hold. A claimant,
    or a witness to one, was run down by the Wazdia and the Daggereyes and
    buried in the Egzami — and has risen, the weight of its wounds crushing it
    slowly, with one name it means to reach before the body fails for good. It
    hunts the hunters and does not lose the trail. The Wazdia has noticed a
    file that should be closed is moving again, and has assigned someone to
    close it a second time.
  flavor_tags: [vengeance, undead, surveillance, decay]
  lifespan_turns: 6
  delivery_hints:
    - A grave in the Egzami has opened from the inside, and the boot-prints leading away are dragging on one side
    - A Daggereye who did a particular killing has been found dead with a single deliberate wound and a look of being known
    - Someone the Wazdia is sure they buried is being reported, calmly, by frightened travellers on the Waznoty road
  narrative_hint: >-
    The dead carry an unfinished obligation, not mindless hunger (SOUL:
    consequence outlives the crime). Let the revenant be reachable — it has one
    name, one purpose — and let the Wazdia's interest in re-closing the file
    drag the party into the original killing's secret. Whether to help it reach
    the name or lay it to rest is the seed's real question.

- id: evropi_the_inn_already_opened
  name: A Letter That Arrived Already Read
  description: >-
    A letter the party or someone near them sent has arrived at its destination
    already opened and resealed — the Wazdia's quiet courtesy, the secret police
    reading the frontier's post one drop-courier at a time. The reseal is good
    but not perfect; the wax is a shade off, the fold reversed. Whatever was in
    the letter, the Wazdia has it now, and the sender is left to wonder which
    line in it was the one that put a name in a ledger this morning.
  flavor_tags: [surveillance, paperwork, intrigue, dread]
  lifespan_turns: 5
  delivery_hints:
    - The wax seal on a delivered letter is a shade off-colour, and the fold runs the wrong way against the crease
    - The recipient mentions, puzzled, a phrase from the letter that the sender is certain they never wrote
    - A grain-courier who carries the frontier post has a second satchel he does not open in front of anyone
  narrative_hint: >-
    The dread is bureaucratic and total (SOUL: the world is watching, and the
    watching has weight). Let the party not know exactly what the Wazdia
    learned — the menace is the uncertainty. Tie the read letter to whatever the
    party is hiding, and let the resealed wax be the small, cold proof that the
    frontier keeps no secrets it has not chosen to keep.
