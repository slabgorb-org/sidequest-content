funnels:

  # ── Wazdia Enforcers & Loyalists ───────────────────────────────────────────
  - name: Wazdian Blade
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Wazdia
    lore: >-
      The Wazdia's field agents do not merely gather information — the best of
      them are the sword that follows the quill. A Wazdian Blade carries the
      wickedly curved single-edged dagger in its silver-chased scabbard not as
      ornament but as the last instrument of "mind before heart." They are drawn
      from the sons and daughters of loyal Zkęd families whose debts to the state
      are deep enough that service is the only coin left. The weight of what they
      hold — and who they protect — presses on every waking hour.
    cultural_status: feared in every village, deferentially treated in Pę, invisible in foreign ports
    disposition_toward:
      The Widząn Zamzau: hunting
      The Daggereyes: controlling
      The Wujasjav: wary alliance

  - name: Daggereye Enforcer
    absorbs:
      - [hero, dps]
      - [ruler, dps]
      - [hero, jack_of_all_trades]
    faction: The Daggereyes
    lore: >-
      Srárný Fyzioloniązka's lieutenants are not hired for subtlety. They bear
      the dagger tattoo between their brows and operate out of the Egzami forest
      with the confidence of people who know the Wazdia will clean up the bodies.
      Their work is highway robbery when assassination contracts are slow and
      assassination when they are not. What distinguishes the Enforcer from a
      common brigand is the hierarchy: Srárný demands proof of seriousness,
      and proof costs a life. After that, the tattoo is permanent, and so is
      the arrangement.
    cultural_status: hated by common folk, useful to the Wazdia, tolerated on the road
    disposition_toward:
      The Wazdia: contractor
      The Widząn Zamzau: hostile
      The Scouts of the Green: territorial

  # ── Widząn Zamzau — The Hidden Heir's Network ──────────────────────────────
  - name: Lwowar gra na`Halla
    absorbs:
      - [outlaw, stealth]
      - [jester, stealth]
      - [explorer, stealth]
    faction: The Widząn Zamzau
    lore: >-
      "Seeker of the Heir" is the second rank of the Widząn Zamzau, and it is
      the rank that does the actual searching — traveling under false pretenses,
      cultivating contacts in the Wazdia's shadow, listening at the margins of
      courts and market stalls for any whisper of the bloodline. The ones who
      survive are those who can hold two faces simultaneously: the traveling
      merchant, the itinerant bard, the census-mapper who never quite finishes
      his maps. The Wazdia hunts every one of them. Being found means the
      oubliette under Pę's east wall.
    cultural_status: unknown by design; known to the Wazdia only by cover identities
    disposition_toward:
      The Wazdia: hunted
      The Daggereyes: evasive
      The Widząn Zamzau: fiercely loyal

  - name: Lazłowyr gra Zygwa
    absorbs:
      - [outlaw, dps]
      - [jester, dps]
    faction: The Widząn Zamzau
    lore: >-
      The highest rank a Widząn can earn before the heir is found: Protector of
      the True King. These are fighters, usually, or former Daggereyes who turned
      and were accepted into the Widząn after proving the turn was real. They do
      not seek the heir — they guard what has already been found, or stand between
      the Wazdia and the Seekers when the net draws close. Their humor is the
      particular dark variety of people who have priced their own lives and found
      the exchange rate acceptable.
    cultural_status: deeply secret, whispered of in Widząn circles as the last line
    disposition_toward:
      The Wazdia: at war
      The Daggereyes: contemptuous
      The Widząn Zamzau: bone-loyal

  # ── Wujasjav — The Covenant Mages ─────────────────────────────────────────
  - name: Wujadru
    absorbs:
      - [magician, control]
      - [magician, dps]
      - [outlaw, control]
    faction: The Wujasjav
    lore: >-
      A master of the Wujasjav mage guild in Pę has already paid. Every working
      they know is a covenant, and every covenant has a line in the ledger —
      blood, years, names. A Wujadru's pact-marks are rarely all visible; the
      ones on the inside of the left wrist, below the sleeve, are the ones they
      do not discuss. The guild is tolerated by the Wazdia because it is useful
      and taxed heavily, and the Wujadru tolerate the Wazdia for the same reason.
      Apprentices serve a seven-year indenture that is simultaneously a personal
      covenant with the guild; leaving early costs something the terms do not
      specify in advance.
    cultural_status: respected and feared in Zkędzała, distrusted everywhere else
    disposition_toward:
      The Wazdia: taxed compliance
      The Widząn Zamzau: officially ignorant
      The Book-Checkers: mutual professional wariness

  # ── Scouts of the Green — Forest Wardens ──────────────────────────────────
  - name: Scout of the Green
    absorbs:
      - [explorer, jack_of_all_trades]
      - [caregiver, healer]
      - [sage, healer]
      - [innocent, healer]
    faction: The Scouts of the Green
    lore: >-
      The celibate druidic order patrols every forest and swamp on the continent
      that the three empires have not yet paved over or burned. The price of the
      nature-bond is childlessness, and the price of breaking it is tragedy timed
      by the Green with a precision that feels personal — because it is. Gan son
      of Gan, who patrols the edges of the Egzami near Upre, left the order to
      marry Daliann and watched her die of the Black Pox within a year. He still
      tracks. He does not speak of the Green. The ones who keep their oath tend
      wounds with plant-knowledge earned over decades and a patience that looks,
      from the outside, like serenity and is, from the inside, a sustained act
      of will.
    cultural_status: respected as neutral in most regions, resented by Mistos garrisons
    disposition_toward:
      The Wazdia: tense neutrality
      The Daggereyes: openly hostile when paths cross
      The Gull-Captains' Compact: cordial along coastal routes

  # ── The Aldkin — Steppe Riders & Herdsman's Clerics ───────────────────────
  - name: Njörkte
    absorbs:
      - [sage, control]
      - [sage, support]
      - [ruler, support]
    faction: The Council of the Njörkte
    lore: >-
      A Njörkte of the Aldkin does not command — command implies hierarchy, and
      the Aldkin resist hierarchy with a depth that reads, to empire-raised eyes,
      like stubbornness. A Njörkte speaks. The clan listens or it does not. Each
      prophecy costs years; the oldest Njörkte on the Klas Steppes is, without
      exception, the one with the shortest life remaining. They adjudicate
      inter-clan disputes at the Epäässä Townhill where even drawing a weapon
      is an insult to the ancestors, and they tell the tribes when to move
      to the summer or winter pastures. Their authority is total in the sense
      that the weather is total — pervasive, unwritten, and not subject to appeal.
    cultural_status: supreme within Aldkin clans; regarded with respectful caution by foreign travelers
    disposition_toward:
      The Wazdia: wary refusal to enter Zkędzała
      The General's Host: closed border, no engagement
      The Gull-Captains' Compact: trade contacts at the Jälv river mouth

  - name: Anta Rider
    absorbs:
      - [hero, tank]  # absorbed jointly with Wazdian Blade; this is the steppe variant
      - [caregiver, support]
      - [lover, support]
      - [everyman, support]
    faction: null
    lore: >-
      The Anta is a black horse with a glossy coat and a stiff cropped ruff-mane,
      worth fifty percent more than any horse the empires breed, twice as fast,
      twice as enduring. An Aldkin who rides one is not simply mounted — they are
      announced. The Anta Rider who moves between clans as courier, mediator, or
      simply as someone whose horse means the message arrived intact is the
      connective tissue of the steppe. The Rider who tends their clan's sick or
      carries news of a death to a family three days' ride away occupies a role
      that has no single title and no less than a dozen quiet kinds of authority.
    cultural_status: respected across Aldkin clans; noticed and envied by Zkęd cavalry
    disposition_toward:
      The Council of the Njörkte: deferential
      The Wazdia: avoiding

  # ── Jambiendo — Spice Sailors & Gull-Ship Merchants ───────────────────────
  - name: Gull-Captain
    absorbs:
      - [ruler, support]  # absorbed jointly with Njörkte; this is the Compact variant
      - [artist, control]
      - [lover, healer]
    faction: The Gull-Captains' Compact
    lore: >-
      A Jambiendo Gull-Captain is part merchant, part diplomat, part judge of
      character. Their authority in the Compact is informal — the Jambiendo have
      no formal government — but a senior captain's word at Rything Island during
      Fevre shapes route agreements and pricing for the year ahead. The song-duels
      that resolve Compact disputes are not theater; they are binding, and a
      captain who cannot sing persuasively hires a J`rook bard who can. The gold
      and silver hoops in their long ears carry small bells that ring through the
      rigging; when a Gull-Captain's bells go still, the crew reads the silence
      as an instrument.
    cultural_status: welcomed in every port on the Řeknu; held at arm's length by the Bladtrablo
    disposition_toward:
      The Bladtrablo: ancient feud, ritual hostility
      The Wazdia: paying the tax, keeping the cargo quiet
      The Scouts of the Green: cooperative on coastal forest routes

  - name: J`rook Bard
    absorbs:
      - [artist, support]
      - [jester, stealth]  # absorbed jointly with Lwowar; this is the open-air variant
      - [lover, support]
    faction: null
    lore: >-
      The J`rook bards are Pakook`rook who have mastered the knotsong — the
      written Hrooukpookrook syllabary tied in reeds on sticks, sung by inflating
      the throat-sac until the voice splits into two harmonising streams. They are
      brought specifically to Rything Island each Fevre to judge song-duels for
      the Gull-Captains' Compact, which means they are the only Pakook`rook who
      travel freely in Jambiendo waters without risk of Zkęd enslavement. A J`rook
      bard operating on the mainland exists in a legal grey area — technically a
      runaway slave by Zkęd law, practically untouchable because every court
      and noble house wants the entertainment. The theatre of being harmless is
      its own armor.
    cultural_status: celebrated performer; technically enslaved property under Zkęd law; diplomatically invisible
    disposition_toward:
      The Wazdia: maintaining elaborate harmlessness
      The Gull-Captains' Compact: contracted neutrals
      The Widząn Zamzau: occasional careful allies

  # ── Vaermm — Book-Keepers & Right-Thinkers ────────────────────────────────
  - name: Book-Checker
    absorbs:
      - [sage, control]  # absorbed jointly with Njörkte; this is the Vaermm variant
      - [everyman, jack_of_all_trades]
    faction: The Book-Checkers
    lore: >-
      The Vaermm institution of the Book-Checker is the closest thing to
      intellectual authority their society produces, which is to say it is an
      authority explicitly designed to reproduce, not originate. A Checker can
      read the Book of Aest at full speed with an error rate close enough to
      zero that the margin is measured in once-per-decade mistakes. They are
      impassive, fast, and self-correcting — a Checker who passes an error pays
      with a year's suspension from duty. The system is, within its own logic,
      perfect. The character who holds this role outside Vaermm territory is
      someone whose capacity for forensic precision has found no scripture to
      apply it to, and whose right-thinking has begun to ask questions.
    cultural_status: absolute authority among the Vaermm; strange and suspect to outsiders
    disposition_toward:
      The Wujadru: mutual professional wariness
      The Scouts of the Green: theologically hostile
      The Widząn Zamzau: uncomprehending

  # ── Dustlands Scholars — Tismenni Ruins & Dead Voices ─────────────────────
  - name: Dustlands Reader
    absorbs:
      - [sage, healer]
      - [outlaw, control]  # absorbed jointly with Wujadru; this is the unaffiliated variant
      - [everyman, jack_of_all_trades]  # absorbed jointly with Book-Checker; this is the itinerant variant
    faction: null
    lore: >-
      The Land of Dust is the afterlife plane — bordered by the Chalky Cliffs,
      accessible in the thin places where the Tismenni comet drowned the world
      twelve thousand years ago. In those thin places, scholars who know how to
      listen can still hear the dead of the drowned empire. A Dustlands Reader
      has learned Tismenni not merely as a scholarly lingua franca but as a
      tool for that listening — and what the dead say about the debts they
      carried down with them has a peculiar utility for the living, both in the
      medical sense (the Tismenni recorded pharmacopoeia in obsessive detail)
      and in the political sense (they also recorded everything they knew about
      the peoples who owed them and why). Unaffiliated by necessity: the Wujasjav
      wants their knowledge, the Wazdia wants to tax it, and the Vaermm consider
      it original thought, which is forbidden.
    cultural_status: eccentric at best, dangerous at worst; sought quietly by every faction that needs old information
    disposition_toward:
      The Wujasjav: negotiated independence
      The Wazdia: careful invisibility
      The Book-Checkers: theologically incompatible

  # ── Bladtrablo — Undersea Smiths & Seaturtle Cavalry ──────────────────────
  - name: Vent-Forge Smith
    absorbs:
      - [everyman, support]
      - [caregiver, support]
      - [innocent, healer]
    faction: null
    lore: >-
      The Bladtrablo forge steel at volcanic vents beneath the Řeknu ocean,
      in basalt-and-coral cities their nobility traverse on domesticated
      seaturtles with hand-worked saddles. A Vent-Forge Smith is not a warrior;
      they are the person who keeps the city alive — mending gill-membranes dried
      by too long above water with careful seawater irrigation, maintaining the
      tools that feed and defend, training the young in the rhythm of the vent-heat
      that cycles like a heartbeat through the deep. The feud with the Jambiendo
      is old enough that no one remembers its origin. The Smith remembers the
      faces of the people the raids took. That is a different kind of memory.
    cultural_status: essential and invisible in Bladtrablo cities; unknown above the waterline
    disposition_toward:
      The Jambiendo: blood feud, low-grade permanent hostility
      The Gull-Captains' Compact: refuses engagement
      The Scouts of the Green: indifferent; land politics are not their politics

  # ── The Ingurdios Underground ───────────────────────────────────────────────
  - name: Last Ingurdios
    absorbs:
      - [innocent, healer]  # absorbed jointly with Vent-Forge; this is the mine variant
      - [lover, healer]
      - [artist, support]  # absorbed jointly with J`rook Bard; this is the underground variant
    faction: The Last Ingurdios
    lore: >-
      In the Mistos mines of the Zbóźny Mountains, among the subjugated people
      whose language was banned before living memory, a story circulates: a
      messiah will come to the mines and speak the old Ingurdios language aloud
      for the first time in generations, and when the words are spoken, the
      mountain will remember them. The only surviving fragments of that language
      exist in Tismenni scholarly tomes the Wujasjav holds in Pę. The General
      considers the belief harmless. The Ingurdios who believe it know this
      is the General's mistake. Those who keep the old songs alive in the dark —
      hummed without words, because the words are contraband — are doing something
      the General's closed logic has no category for.
    cultural_status: invisible to the General's Host by design; the only folk in Evrópí the Wazdia has no file on
    disposition_toward:
      The General's Host: patient, patient hatred
      The Last Ingurdios: self-sustaining underground
      The Dustlands Readers: the only outsiders they trust with the fragments
