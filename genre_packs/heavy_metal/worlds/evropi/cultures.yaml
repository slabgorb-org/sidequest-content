# Evrópí — World Cultures
#
# Eight playable cultures + two lore-only cultures (Ingurdios, Tismenni).
# All naming is routed through world-local conlang corpora, located at
# heavy_metal/corpus/evropi_{slug}.txt — converted from Keith's 2010
# constructed-language CSVs. The Markov chain walks these corpora to
# generate names that sound like the people they come from.
#
# Mistos and Jambiendo share a single corpus (evropi_jambiendo.txt)
# with different lookback and accent patterns — the two peoples are
# the same language family split by ideology and accent. The canonical
# in-world explanation is that no one knows how they were separated.

- name: Zkęd
  summary: "Slavic authoritarian humans of Zkędzała — secret-police state, lost-heir cult, slave traders"
  description: >-
    Light-skinned humans with dark hair and eyes. The men wear braided
    beards threaded with small metal beads; the women braid matching
    beads into their hair, so a Zkęd crowd makes a faint rattling sound
    when it moves. They dress in somber cold-weather clothing for the
    mountain borderlands and the Egzami forest interior. They are ruled
    hereditarily by a Waz — currently Isku the Eighth, old and sharp
    of tongue, with three sons positioning for the succession. Beneath
    the Waz sits the Wazdia, the secret police whose motto is "mind
    before heart," and beneath the Wazdia sits the Daggereyes, the
    contract killers the Wazdia disavows in public. The Zkęd are a
    downtrodden people ruling an even more downtrodden people — they
    enslave the Waterfolk and the Pakook`rook and ship them to the
    Pę slave markets drugged on reniksnad.
  slots:
    given_name:
      corpora:
        - corpus: evropi_zked.txt
          weight: 1.0
      lookback: 3
    family_name:
      corpora:
        - corpus: evropi_zked.txt
          weight: 1.0
      lookback: 3
    noble_house:
      word_list: [Zblášzed, Zężebyloz, Uzlůemar, Smrtvámi]
    commoner_name:
      word_list: [Które, Smutně, Smrte, Ztam, Snadz, Woleste]
    place_noun:
      word_list: [hold, seat, court, keep, mark, gate, watch, ford, lodge, dworek]
    adjective:
      word_list: [somber, braided, binding, heavy, cold, dark, wazdian, hushed, bound, old]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name} na {family_name}"
    - "{given_name} {commoner_name}"
    - "{given_name} of House {noble_house}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "{family_name} {place_noun}"
    - "The {adjective} {place_noun} of {noble_house}"

- name: Waterfolk
  summary: "Marsh-halfling people of the Hvoru salt marshes — eel-herders, crane-riders, enslaved by Zkęd"
  description: >-
    Small marsh people who live in stilt-huts raised above the Hvoru
    salt marshes, cultivate domesticated eels in the estuaries below,
    and ride domesticated cranes across the open water. Their clothing
    is eel-skin — tanned like leather and beaten translucent, then
    stitched into garments with a texture other races prize and pay
    badly for. They carry short tridents for fish, eel, and the
    occasional frog. Their language, Zypič, belongs to the Zkęd
    language family, which is either a cruelty of history or a clue to
    a shared ancestry neither side wants to acknowledge. The Waterfolk
    are at war with the Pakook`rook. Both sides are enslaved by the
    same Zkęd masters. The Wazdia profits from both.
  slots:
    given_name:
      corpora:
        - corpus: evropi_zypic.txt
          weight: 1.0
      lookback: 3
    family_name:
      corpora:
        - corpus: evropi_zypic.txt
          weight: 1.0
      lookback: 3
    place_noun:
      word_list: [stilt, reed, bank, mouth, shallow, eelhold, roost, float, channel, wade]
    adjective:
      word_list: [salt, damp, hushed, translucent, slow, tidal, brackish, patient, folded]
  person_patterns:
    - "{given_name}"
    - "{given_name} of the {place_noun}"
    - "{given_name} {family_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {place_noun} of {family_name}"

- name: Pakook`rook
  summary: "Frog-humanoid knotsong bards — throat-sac singers, swamp dwellers, enslaved by Zkęd, at war with Waterfolk"
  description: >-
    Frog-humanoid people who live in the swamps south of the Egzami,
    equally at home above and below the waterline. They wear lily-pad
    collars and clothing woven from beaten rushes, and carry long
    tridents they use to pole-vault across muddy stretches. Their
    most famous artform is the knotsong — a written form called
    Hrooukpookrook, a syllabary of tied-off reeds bound to a stick,
    each knot a word. A trained J`rook bard inflates his throat-sac
    until he can exhale through two voices at once, harmonising with
    himself in the peculiar croaking cadence of the Pakook language.
    The Zkęd call them Pako or froggies, enslave them, and ship them
    drugged on reniksnad to the Pę slave markets. The Pakook`rook are
    at war with the Waterfolk; neither side remembers who started it,
    but the Wazdia makes sure both sides continue it.
  slots:
    given_name:
      corpora:
        - corpus: evropi_pakook.txt
          weight: 1.0
      lookback: 4
    family_name:
      corpora:
        - corpus: evropi_pakook.txt
          weight: 1.0
      lookback: 4
    place_noun:
      word_list: [pond, hollow, reedbed, croak, pool, rise, lilypad, knotgrove, shallow]
    adjective:
      word_list: [croaking, lilypad, knotted, deep-voiced, stilled, pondbound, echoed]
  person_patterns:
    - "{given_name}"
    - "{given_name}`{family_name}"
    - "{given_name} the {adjective}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {place_noun} of {family_name}"

- name: Jambiendo
  summary: "Seafaring elves of the Sabulous Islands — gull-ship traders, tralbotura-silk wearers, spice merchants"
  description: >-
    Dark-skinned seafaring elves with long pointed ears, which they
    decorate with hoops of gold and silver carrying tiny bells that
    jingle as they work the rigging of their gull-ships. They wear
    delicate, light-coloured clothing woven from tralbotura — a
    seaweed native to the Sabulous Islands, beaten by the elders on
    resonant logs and spun into cloth that catches the wind. Their
    diet is fish, breadfruit (ipesat`il), sea salt from secret
    beaches, and a dozen spices that grow only on their islands.
    They are master sailors who visit every port on the Řeknu and
    return home with holds full of stories. They are mortal rivals
    of the Bladtrablo, an elvish cousin-race that lives beneath the
    waves, and — unknown to most landsfolk — they share their language
    family (Trosse) with the Mistos junta, though the accents have
    drifted so far that neither side likes to admit the connection.
    No one knows how the two peoples were separated. The Jambiendo
    do not speculate publicly and the Mistos do not speculate at all.
  slots:
    given_name:
      corpora:
        - corpus: evropi_jambiendo.txt
          weight: 1.0
      lookback: 3
    family_name:
      corpora:
        - corpus: evropi_jambiendo.txt
          weight: 1.0
      lookback: 3
    place_noun:
      word_list: [bay, quay, reef, wharf, beach, cove, tide, wind, sail, spice, gull]
    adjective:
      word_list: [tralboturan, silver, bell-rung, salted, far-roamed, spicewind, sunlit, singing]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name} e'{family_name}"
    - "{given_name} c'{family_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {place_noun} of {family_name}"

- name: Mistos
  summary: "Elf-supremacist military junta — beauty-eugenics, red-and-black silks, puppet states, conscription"
  description: >-
    Elves with fine light hair and pale skin who dress in red and
    black dyed silks and leather. They are convinced they are the
    master race, and the conviction is grounded — in their own
    reasoning — on their objectively superior beauty. The logic
    closes on itself: a Mistos born with any blemish, even a wen or
    a winestain birthmark, is by definition no longer Mistos, and is
    banished to the Ingurdios mines or worse. The culture is ruled
    by the military; every able-bodied adult serves, and the General
    of Mistos is also the ruler of Mistos. They conquer their
    neighbours and hold them as puppet-states, installing local
    rulers that take their orders from the General. They share a
    language family (Trosse) with the Jambiendo, but centuries of
    divergence have given Mistos speech a harsh military accent —
    short, clipped, front-loaded with hard consonants — that no
    Jambiendo would confuse with their own. Neither people remembers
    how the split happened. Neither wants to.
  slots:
    given_name:
      corpora:
        - corpus: evropi_jambiendo.txt
          weight: 1.0
      lookback: 4  # harder, clipped output versus Jambiendo's softer lookback 3
    family_name:
      corpora:
        - corpus: evropi_jambiendo.txt
          weight: 1.0
      lookback: 4
    accent_prefix:
      word_list: [Kr, St, Gr, Vr, Ts, Sk, Sp, Dr]
    rank_title:
      word_list: [General, Marshal, Captain, Lieutenant, Standard-Bearer, Inquisitor, Warden, Field-Corrector]
    place_noun:
      word_list: [barracks, parade, mine, puppet-seat, garrison, field, march, camp]
    adjective:
      word_list: [red, black, silk, iron, mirror-bright, flawless, inspected, conscripted, sealed]
  person_patterns:
    - "{accent_prefix}{given_name} {family_name}"
    - "{rank_title} {given_name} {family_name}"
    - "{given_name} the {adjective}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {rank_title}'s {place_noun}"

- name: Bladtrablo
  summary: "Aquatic undersea elves — seaturtle cavalry, volcanic-vent forges, blood enemies of Jambiendo"
  description: >-
    Aquatic elves with fair skin and white hair, living in undersea
    cities of coral and basalt around the volcanic vents of the
    Řeknu deep. They breathe through small gill-membranes on their
    necks in salt, brackish, or fresh water, but prefer salt; out
    of water for too long, the membranes dry and their gill-breathing
    fails, a condition they can delay by sluicing buckets of seawater
    through their mouths and out their gills, uncomfortably. Their
    nobility ride domesticated seaturtles through coral cities with
    hand-worked saddles, and their metallurgists forge steel at the
    volcanic vents, making them the best undersea smiths in the
    known world. They are blood enemies of the Jambiendo — a feud
    so old no one remembers its origin, kept alive by periodic raids,
    abductions, and the occasional gull-ship sinking. They are the
    most alien of Evrópí's peoples to land politics, and the most
    indifferent to its authoritarian tides.
  slots:
    given_name:
      corpora:
        - corpus: evropi_bladio.txt
          weight: 1.0
      lookback: 3
    family_name:
      corpora:
        - corpus: evropi_bladio.txt
          weight: 1.0
      lookback: 3
    place_noun:
      word_list: [vent, reef, cavern, spire, current, shoal, trench, coral, bladewarm]
    adjective:
      word_list: [deep, salt-lit, coral, vent-warmed, pearled, silent, surging, old-tide]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name}-of-the-{place_noun}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {place_noun} of {family_name}"

- name: Aldkin
  summary: "Steppe-nomad humans of the Klas — herders of Anta horses, worshippers of the Herdsman, Njörkte clerics"
  description: >-
    The pastoral humans of the Klas Steppes, west of the river Jälv.
    They are not one tribe but dozens — clans ranging from a few
    dozen to several thousand — following their herds across endless
    grasslands under the Herdsman's watch. Their signature animal is
    the Anta, a proud black horse with a glossy coat and a stiff
    cropped ruff-mane; an Anta is worth fifty percent more than an
    ordinary horse, twice as fast, and twice as enduring. The Aldkin
    have one permanent structure in all the steppes: the Epäässä,
    the Townhill, where all tribes are welcome and violence is
    punishable by death — even drawing a weapon is an insult to the
    ancestor spirits. The Epäässä is a trading ground, a neutral
    peace-ground, and the only place in the Klas an outsider is
    strictly protected. The Aldkin are led, loosely, by their clerics
    — the Njörkte, who tell the tribes when to move pastures and
    speak with the Herdsman's authority. The Mäinkin clan is the
    richest; the Päänkin are the poorest; the Törkin are famously
    predictable in their summer and winter pastures.
  slots:
    given_name:
      corpora:
        - corpus: evropi_aldkin.txt
          weight: 1.0
      lookback: 3
    family_name:
      corpora:
        - corpus: evropi_aldkin.txt
          weight: 1.0
      lookback: 3
    clan_name:
      word_list: [Mäinkin, Päänkin, Törkin, Jälvskin, Epäkin, Oerkin, Björnkin, Nöydkin]
    njorkte_rank:
      word_list: [Njörkte, "Njörkte Bädd", "Njörkte Nachen", Nachen, Ohja]
    place_noun:
      word_list: [steppe, pasture, ford, camp, hearth, hill, wind, stand, drift, vårn]
    adjective:
      word_list: [broad, silent, far-riding, grass-lit, wind-worn, patient, steady, open]
  person_patterns:
    - "{given_name} of the {clan_name}"
    - "{given_name} {njorkte_rank}"
    - "{given_name} {family_name}, {clan_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "{clan_name} {place_noun}"

- name: Vaermm
  summary: "Scripture-totalitarian stocky humanoids — Book of Aest, 'right-thinking', all non-mandatory behaviour forbidden"
  description: >-
    Short, stocky humanoids who live in the marginal lands between
    the other peoples of Evrópí — dry foothills, rocky scrubland,
    the places no one else wants. Their society is ruled by the
    Book of Aest, a scripture whose central doctrine is right-
    thinking: Aest taught that if a person's thoughts always follow
    a prescribed traditional pattern, there is no need for ethics,
    because original thought has been made unthinkable, and with it,
    crime and deviance. Every Vaermm copies out their own Book of
    Aest at coming-of-age. The book is checked for errors in a
    ceremony lasting hours, and any error delays the ceremony by a
    year and costs another copy. The side-effect of right-thinking
    is near-total stagnation of invention, magic, and art — the
    Vaermm are magic-poor not by genre-mechanics but by scripture.
    The Book's opening tenet: "There are two kinds of interactions,
    those among the right-thinking, and those between the right-
    thinking and the enemies of the right-thinking. These are
    different in their nature."
  slots:
    given_name:
      corpora:
        - corpus: evropi_dwarf.txt
          weight: 1.0
      lookback: 4
    family_name:
      corpora:
        - corpus: evropi_dwarf.txt
          weight: 1.0
      lookback: 4
    book_rank:
      word_list: [Copyist, Checker, Tenth-Reader, Mandatory, Right-Thinking, Unerred, Kept]
    place_noun:
      word_list: [hold, book-house, scriptorium, reach, tenet, margin, scribe-hall, correction]
    adjective:
      word_list: [right-thinking, un-erred, mandatory, scripted, checked, kept, silent, stoic]
  person_patterns:
    - "{given_name} {family_name}, {book_rank}"
    - "{given_name} {book_rank} of the {place_noun}"
    - "{given_name}, {book_rank}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "The {book_rank}'s {place_noun}"

# ─────────────────────────────────────────────────────────────────────
# Lore-only cultures — NOT chargen options.
# Appear as NPCs, historical references, lore entries, but players
# cannot select these at character creation.
# ─────────────────────────────────────────────────────────────────────

- name: Ingurdios
  chargen: false
  summary: "LORE ONLY — subjugated people of the Mistos; native language canonically dead, preserved only in Tismenni scholarly tomes"
  description: >-
    The people the Mistos conquered long enough ago that no living
    Ingurdios remembers their original culture. Their native language
    is dead, banned on pain of death, preserved only in fragments
    inside ancient Tismenni scholarly texts — the lingua franca of
    the old dead empire, which is the only archive the Mistos did
    not know how to burn. The Ingurdios speak accented Trosse now,
    the language of their tormentors, and are forced to labour in
    the Mistos mines in the Zbóźny Mountains. The older Ingurdios
    tell stories of a once vibrant and rich culture, and of a
    messiah who will come to the mines and speak the old language
    aloud for the first time in generations. The messianic stories
    are not officially forbidden by the Mistos. The General considers
    them harmless. The Ingurdios who believe them know this means
    the General is wrong about something.
  slots:
    given_name_current:
      corpora:
        - corpus: evropi_jambiendo.txt  # assimilated Trosse; softer than Mistos
          weight: 1.0
      lookback: 3
    given_name_old:
      corpora:
        - corpus: evropi_tismenni.txt  # preserved only in scholarly Tismenni tomes
          weight: 1.0
      lookback: 4
  person_patterns:
    - "{given_name_current}"
    - "{given_name_current} (born {given_name_old})"
  place_patterns: []

- name: Tismenni
  chargen: false
  summary: "LORE ONLY — dead ancient empire, destroyed by the Cataclysm ~12,000 years ago; language survives as scholarly lingua franca"
  description: >-
    The ancient civilisation of Evrópí, whose golden age ran from
    roughly -12940 to -12010 and whose empire was drowned at -11540
    when a comet struck the ocean and sent a tsunami across the
    continent. The Tismenni themselves are dead. Their language —
    Tismenni — survives as a scholarly and wizardly lingua franca,
    the written form used by intellectuals, archivists, and mages
    across every surviving culture. It is unknown whether any who
    can truly call themselves Tismenni still exist in the world.
    Ruins of the empire dot the continent: half-buried roads,
    sundials on hills no one remembers building, and the occasional
    basin where the tsunami left a permanent scar. The Land of Dust
    — the afterlife realm bordered by the Chalky Cliffs — is,
    according to scholars who read Tismenni, unusually thin in the
    places the comet struck.
  slots:
    given_name:
      corpora:
        - corpus: evropi_tismenni.txt
          weight: 1.0
      lookback: 4
  person_patterns:
    - "{given_name}"
  place_patterns: []
