# Evrópí — world bestiary (evropi_bestiary)
#
# World-tier override on the heavy_metal pack bestiary. SRD-aligned combat
# stat blocks for the wwn ruleset module; encountergen samples these (alongside
# the genre-tier pool) for the Monster Manual encounters of a continent where
# three authoritarian crowns press on a world twelve thousand years past its
# last great empire. Narrative layers (OCEAN, visual prompt) are composed at
# generation time. Stats follow the Worlds Without Number SRD 1.0 (Sine Nomine
# Publishing) generic stat lines — level == HD, hp == average (4.5/HD),
# ascending AC, morale on the 2d12 ladder, physical save 15 - floor(level/2).
#
# World tier (ADR-120): these hostiles are specific to Evrópí — the
# forehead-tattooed Daggereyes, the Wazdia secret police, the beauty-eugenic
# Mistos Host, the Wujasjav covenant-mages, the fiery 999 Crimson Gods, the
# dead of the drowned Tismenni empire stirring in the Land of Dust. Genre-
# generic foes (conscripts, grave-knights, foundry constructs) stay in the
# pack bestiary.yaml; this file overrides only the world-flavored roster.
#
# Some stat blocks reskinned from "Those Outside the Walls" (Alex Dworman), CC-BY-NC-SA 4.0.
entries:
  - id: reniksnad_madded_slave
    name: Reniksnad-Madded Slave
    level: 1
    hp: 5
    armor_class: 11
    attack_bonus: 1
    damage: "1d4"
    move: "40 ft."
    morale: 12
    skill: 0
    save: 15
    role: withdrawal-crazed Pę bondsman
    tags: [human, frenzied]
    abilities:
      - "Beyond fear — never checks morale once the shaking starts"
      - "Attacks anything between itself and the next dose"
    description: >-
      A Waterfolk or Pakook`rook slave of the Pę markets, days past
      their last reniksnad and a week from the death the withdrawal
      brings. The Wazdia taxes the supply; this one fell off the
      ledger and will tear through anything between it and the stall.
  - id: daggereye_brigand
    name: Daggereye Brigand
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d6"
    move: "30 ft."
    morale: 8
    skill: 1
    save: 15
    role: forehead-tattooed Egzami outlaw
    tags: [human, bandit]
    description: >-
      A deserter or thief of Srárný's band, the dagger-mark tattooed
      between the eyebrows, working the Waznoty road for the Gabra
      Ebbe's bounty-price on his own kind. Robs when the Wazdia's
      kill-contracts are light, and is not above either.
  - id: wazdia_informer
    name: Wazdia Informer
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d4+1"
    move: "30 ft."
    morale: 6
    skill: 2
    save: 15
    role: secret-police snitch under a tradesman's cover
    tags: [human, spy]
    abilities:
      - "Marks the party — files a ledger entry that follows them to the next town"
    description: >-
      One of the Wazdia's thousands of informers, a grain-broker or
      ostler who believes nobody knows what they are. Everybody knows.
      A poor fighter who will run for a Wazan drop-letter the moment
      a blade is drawn — and the letter is the real danger.
  - id: wazdia_field_agent
    name: Wazdia Field Agent
    level: 2
    hp: 9
    armor_class: 14
    attack_bonus: 3
    damage: "1d6+1"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 14
    role: secret-police killer with a Wazdian Dagger
    tags: [human, agent]
    abilities:
      - "Wazdian Dagger — the curved silver-chased blade strikes for a clean opening cut"
      - "Mind before Heart — immune to fear and intimidation"
    description: >-
      A field agent of the Kingdom of Zkędzała's secret police, the
      Zkędzała arms on his scabbard, the curved red-and-white blade
      loose in its silver chasing. He commissions the Daggereyes'
      contract killings and disavows them, and he does the close
      work himself when the kill must be deniable.
  - id: hvoru_reed_stalker
    name: Hvoru Reed-Stalker
    level: 2
    hp: 9
    armor_class: 13
    attack_bonus: 3
    damage: "1d8"
    move: "20 ft., swim 40 ft."
    morale: 7
    skill: 1
    save: 14
    role: ambush predator of the salt marshes
    tags: [beast]
    abilities:
      - "Lies submerged in the brackish channels and strikes from cover"
      - "Drags a seized victim under to drown it"
    description: >-
      A long flat-bodied marsh-hunter of the Hvoru salt fens between
      the Egzami and the southern swamps, hide the colour of dead
      reed. The enslaved Waterfolk who poach its waters know it by
      the silence — the channel goes quiet, and then it does not.
  - id: daggereye_knife_captain
    name: Daggereye Knife-Captain
    level: 3
    hp: 14
    armor_class: 15
    attack_bonus: 4
    damage: "1d6+2"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 14
    role: lieutenant of Srárný's brigand band
    tags: [human, bandit, elite]
    abilities:
      - "Commands the lesser Daggereyes — they hold morale while the captain stands"
      - "Twin curved knives — makes two attacks per round"
    description: >-
      A proven killer who has done his assassination and impressed
      Srárný Fyzioloniązka herself, the forehead-mark cut deeper than
      a common brigand's. He runs the deep-forest camps when she is
      moving, sorts the stolen cargo for Wazdia disposal, and takes
      drop-letter orders in her name.
  - id: mistos_host_soldier
    name: Mistos Host Soldier
    level: 3
    hp: 14
    armor_class: 16
    attack_bonus: 4
    damage: "1d8+1"
    move: "30 ft."
    morale: 11
    skill: 2
    save: 14
    role: beauty-eugenic conscript of the General's Host
    tags: [elf, soldier]
    abilities:
      - "Closed logic — morale holds where any sane army would break"
      - "Fights in parade formation; flanked Host soldiers fight back-to-back"
    description: >-
      A pale-haired Mistos in red-and-black silk over black leather,
      bred and selected for flawless form, marching north from the
      Zbóźny under a will that is absolute and a reasoning that is
      closed. They fight for beauty of movement over battlefield
      sense, and they are terrifying anyway.
  - id: tismenni_dust_echo
    name: Tismenni Dust-Echo
    level: 4
    hp: 18
    armor_class: 13
    attack_bonus: 4
    damage: "1d8"
    move: "fly 30 ft."
    morale: 12
    skill: 2
    save: 13
    role: half-formed shade leaked from the Land of Dust
    tags: [undead, spirit]
    abilities:
      - "Bound to the thin places — fearless, never checks morale"
      - "Whispers in dead Tismenni; a target who answers in the tongue saves or is shaken"
    description: >-
      A grey half-shape of the drowned empire's dead, leaked through
      a thin patch of the Land of Dust at a Tismenni ruin. It does
      not know it has died twelve thousand years ago. It speaks the
      dead scholar-tongue at anyone who comes near, and is most
      dangerous to the one who understands it.
  - id: wujasjav_covenant_adept
    name: Wujasjav Covenant-Adept
    level: 4
    hp: 18
    armor_class: 13
    attack_bonus: 4
    damage: "1d6"
    move: "30 ft."
    morale: 8
    skill: 3
    save: 13
    role: covenant-thaumaturge of the Pę mage guild
    tags: [human, mage]
    abilities:
      - "Covenant-working — pays blood, a year, or a name to loose a searing or binding effect"
      - "Reniksnad reagent — can wreath a working in addictive smoke that saps a victim's will"
    description: >-
      A guild thaumaturge of the Wujasjav at Pę, every working a
      covenant that costs blood, years, or names. The guild is taxed
      heavily and tolerated because it is useful; an adept sent into
      the field has already paid for whatever he is about to do, and
      means to make it worth the price.
  - id: mistos_warden
    name: Mistos Warden
    level: 5
    hp: 23
    armor_class: 17
    attack_bonus: 6
    damage: "1d8+3"
    move: "30 ft."
    morale: 11
    skill: 3
    save: 13
    role: Host officer over a puppet seat or mine
    tags: [elf, officer, elite]
    abilities:
      - "Polite before violence — a parade-perfect strike opens with deadly precision"
      - "Instrumentalises — does not fight a strange enemy he can use; flees to report instead"
    description: >-
      A flawless-featured officer of the General's Host set to watch
      a Puppet Seat or the Ingurdios mines, courteous in the specific
      Mistos way that precedes a killing. He offers letters of
      introduction rather than orders, and remembers exactly who
      refuses them.
  - id: crimson_god_visage
    name: Crimson God's Visage
    level: 5
    hp: 23
    armor_class: 15
    attack_bonus: 6
    damage: "1d10+1"
    move: "30 ft., fly 30 ft."
    morale: 10
    skill: 2
    save: 13
    role: fiery demonic manifestation of a named Crimson God
    tags: [demon, horror]
    abilities:
      - "Wreathed in fire — a struck attacker takes burning damage in return"
      - "Bargain — offers a favour mid-fight in exchange for flesh, name, or blood"
    description: >-
      The summoned visage of one of the 999 Crimson Gods, a unique
      fiery demonic face called up by a private bargain gone past its
      term. Each is its own arrangement; this one has come to collect
      the name it was promised, and will offer a worse bargain to
      anyone who interrupts the collection.
  - id: drowned_tismenni_revenant
    name: Drowned Tismenni Revenant
    level: 6
    hp: 27
    armor_class: 15
    attack_bonus: 7
    damage: "1d10+2"
    move: "30 ft., swim 30 ft."
    morale: 12
    skill: 2
    save: 12
    role: dragonkin dead risen from the Cataclysm's wave
    tags: [undead, dragonkin, elite]
    abilities:
      - "Fearless — never checks morale"
      - "Differently-hinged jaw — a seizing bite holds and rends a grappled foe"
    description: >-
      A risen dragonkin of the drowned empire, skull hinged in the
      old Tismenni way, salt-rimed and twelve thousand years patient.
      It walks up out of the half-submerged ampitheatres and the
      flooded low cities when the Land of Dust thins, still wearing
      the harness of an office no living tongue can name.
  - id: feral_hollows_drone
    name: Feral Hollows Drone
    level: 6
    hp: 27
    armor_class: 14
    attack_bonus: 7
    damage: "1d8+2"
    move: "40 ft., climb 30 ft."
    morale: 10
    skill: 1
    save: 12
    role: severed antman worker run mad without a court
    tags: [insectoid, swarm-caste]
    abilities:
      - "Two chitin scythes — makes two attacks per round"
      - "Cut from the pheromone-court, it follows the last command it was given, forever"
    description: >-
      A chitin-plated worker-drone of the Deep Hollows beneath the
      Ingurdios mines, severed from its hive's pheromone-court by the
      Mistos digging too deep. Without the court's scent it has no
      mind left but the last order — and it will carry that order out
      against anything that moves, until the chitin fails.
  - id: tismenni_sentinel
    name: Stirring Tismenni Sentinel
    level: 8
    hp: 36
    armor_class: 16
    attack_bonus: 10
    damage: "2d6+3"
    move: "40 ft."
    morale: 11
    skill: 3
    save: 11
    role: dragonkin war-construct waking after the Cataclysm
    tags: [dragonkin, apex, ancient]
    abilities:
      - "Two attacks per round — twelve thousand years has not dulled the drill"
      - "Commands the lesser dead — Dust-Echoes and revenants nearby hold and obey"
    description: >-
      A great dragonkin sentinel of the golden-age empire, set to a
      watch the comet ended and only now, twelve thousand years
      later, beginning to stir. It does not know the empire drowned.
      It knows its post, its orders, and the kobold servant-caste it
      still expects to attend it — and it is waking for the first
      time as the crowns above it begin to fall.
  - id: sabulous_reef_raider
    name: Sabulous Reef-Raider
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d6"
    move: "20 ft., swim 40 ft."
    morale: 7
    skill: 1
    save: 15
    role: gilled coral-raider of the shallow Řeknu reefs
    tags: [aquatic, raider]
    abilities:
      - "Breathes water — fights from the surf and drags spoils under the waves"
      - "Coral spear strikes from below the waterline before a target sees it"
    description: >-
      A gilled near-human of the reef-shoals off the Sabulous Islands,
      scaled the colour of bleached coral, hauling itself onto the
      Jambiendo spice-piers at low tide to take whatever the gull-ships
      left unguarded. They raid in tide-timed packs and are gone with
      the water, leaving only wet prints and an empty hold.
  - id: egzami_clinging_dark
    name: Egzami Clinging Dark
    level: 1
    hp: 5
    armor_class: 11
    attack_bonus: 1
    damage: "1d4"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 15
    role: living shadow lurking in a Tismenni ruin's dark
    tags: [undead, spirit]
    abilities:
      - "Fearless — never checks morale, but flees any bright flame or lamplit room"
      - "Draining touch — a chilled hand saps the warmth and will from the living"
    description: >-
      The flattened imprint of someone the Land of Dust unmade, left
      clinging in the lightless undercrofts of a drowned-empire ruin
      in the Egzami forest. It hates the warm and the living without
      memory of having been either. Torchlight holds it at the
      threshold; true day destroys it, so it never leaves the dark.
  - id: drowned_ledge_screamer
    name: Drowned-Ledge Screamer
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d4+1"
    move: "20 ft., fly 40 ft."
    morale: 5
    skill: 1
    save: 15
    role: winged song-lurer of the Řeknu sea-cliffs
    tags: [beast, flying]
    abilities:
      - "Drowning-song — its keening lures listeners toward the cliff-edge; resist or approach"
      - "Cowardly — flees the moment a lured victim turns out to be armed and unfooled"
    description: >-
      A winged thing of the sea-cliffs above the Řeknu, mistaken at a
      distance for a gull-ship's lost figure waving for rescue. Its
      song carries over the surf and pulls sailors off the ledges onto
      the rocks below. The Jambiendo seal their ears with wax on the
      cliff routes and bury what the tide gives back.
  - id: barrow_ghoul_of_the_dust
    name: Barrow-Ghoul of the Dust
    level: 2
    hp: 9
    armor_class: 12
    attack_bonus: 3
    damage: "1d6+1"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 14
    role: corpse-eating dead of a Tismenni grave-shaft
    tags: [undead, predator]
    abilities:
      - "Paralysing claws — a raked victim saves or seizes up for several rounds"
      - "Hunger before reason — breaks off to devour a fallen foe unless driven on"
    description: >-
      A grey-fingered eater of the dead that crawls up from the
      grave-shafts of the drowned empire when the Land of Dust thins.
      It was a person twelve thousand years ago; now it is appetite and
      black-clawed patience. The Aldkin who cross the old barrow-fields
      ride hard past the sunken stones and do not stop for the fallen.
  - id: aldkin_winter_hunger
    name: Aldkin Winter-Hunger
    level: 3
    hp: 14
    armor_class: 13
    attack_bonus: 4
    damage: "1d8+1"
    move: "40 ft."
    morale: 10
    skill: 1
    save: 14
    role: starved cold-spirit of the deep steppe winter
    tags: [spirit, beast, cold]
    abilities:
      - "Coreless cold — radiates a killing chill that numbs and slows the living near it"
      - "Never sated — pursues the warm and the breathing across any distance, tireless"
    description: >-
      The thing the Aldkin name only in the dead of winter, when a
      snowed-in camp eats its last horse and then looks at one another.
      It is the hunger that walked off the white steppe and never came
      back as a person — gaunt, frost-rimed, and faster than any rider.
      The Herdsman is said to keep it from the herds; no one has asked
      him to keep it from the people.
  - id: tismenni_grave_chanter
    name: Tismenni Grave-Chanter
    level: 3
    hp: 14
    armor_class: 13
    attack_bonus: 4
    damage: "1d6+1"
    move: "30 ft."
    morale: 12
    skill: 2
    save: 14
    role: dead priest-eater that raises the other barrow-dead
    tags: [undead, predator, elite]
    abilities:
      - "Paralysing claws — a raked victim saves or seizes up for several rounds"
      - "Cold liturgy — chants the dead scholar-tongue to rouse 1d4 lesser barrow-ghouls"
    description: >-
      A barrow-ghoul that kept its wits and its old office, still
      wearing the rotted vestments of a Tismenni death-rite. It speaks
      the dead scholar-tongue and chants the lesser dead up out of the
      shaft to feed beside it. Where one walks, the grave-field is never
      as empty as it looks, and the chanting carries a long way in dust.
  - id: hunted_heir_revenant
    name: Revenant of the Hunted Heir
    level: 3
    hp: 14
    armor_class: 12
    attack_bonus: 4
    damage: "1d6+1"
    move: "30 ft."
    morale: 12
    skill: 1
    save: 14
    role: vengeance-driven dead with one unfinished killing
    tags: [undead, vengeance]
    abilities:
      - "Marked quarry — fixes on one foe, always knows where they are until it falls"
      - "Will not stay down — when dropped, saves or rises once more on the next breath"
    description: >-
      One of the Kingdom of Zkędzała's quiet killings that would not
      take. A lost claimant, or a witness to one, run down by the
      Wazdia and the Daggereyes and buried in the Egzami — risen now,
      the weight of its wounds crushing it slowly, with one name it
      means to reach before the body fails for good. It hunts the
      hunters, and it does not lose the trail.
  - id: sabulous_scaled_predator
    name: Sabulous Scaled Predator
    level: 4
    hp: 18
    armor_class: 16
    attack_bonus: 6
    damage: "1d8+1"
    move: "30 ft."
    morale: 10
    skill: 2
    save: 13
    role: cold-blooded reef-island ambusher and slave-taker
    tags: [aquatic, predator, raider]
    abilities:
      - "Mud-still — lies motionless in shallows or foliage, near-invisible until it strikes"
      - "Pragmatic, not cruel — spares a captive who proves useful; cooks the rest"
    description: >-
      A scaled near-human apex of the inner Sabulous lagoons, bone-
      armoured and perpetually hungry, hunting the Jambiendo spice-
      crews who put in for fresh water. It takes the strong as bearers
      and the weak as meat, and it bargains in broken trade-tongue with
      anyone who shows they are worth more alive — which is the only
      mercy the lagoon offers.
  - id: zkedzala_bound_hag
    name: Zkędzała-Bound Hag
    level: 5
    hp: 23
    armor_class: 14
    attack_bonus: 6
    damage: "1d8"
    move: "30 ft."
    morale: 9
    skill: 3
    save: 13
    role: crown-bound witch trading curses to the secret police
    tags: [human, witch, elite]
    abilities:
      - "Evil eye — lays a wasting curse at range; the cursed bleed and weaken over days"
      - "Dream-haunt — denies a sleeping victim any rest, leaving them hollow by morning"
    description: >-
      A witch who paid one of the Crimson Gods for power and now pays
      the Kingdom of Zkędzała in curses to keep her hut off the Wazdia
      ledger. She marks the people the secret police cannot reach by
      blade — the curse follows them home, and no one can prove a thing.
      She finds the arrangement whimsical, and is dangerous to deprive
      of her amusements.
  - id: bladtrablo_vent_merrow
    name: Bladtrablo Vent-Merrow
    level: 6
    hp: 27
    armor_class: 14
    attack_bonus: 7
    damage: "1d8+1"
    move: "swim 40 ft."
    morale: 9
    skill: 1
    save: 12
    role: deep ogre-thing of the volcanic vent-forges
    tags: [aquatic, brute, deep]
    abilities:
      - "Harpoon-and-haul — a thrown line drags a grappled victim into the crushing dark"
      - "Pressure-blind — fights without sight by the tremor of movement in the water"
    description: >-
      A vast, blind, ogre-jawed thing that haunts the black water
      around the Bladtrablo vent-forges, drawn to the heat and the ring
      of hammers far below the Řeknu. The undersea smiths fend it off
      with vent-fire and noise; when a forge falls quiet, it comes in
      through the dark to take whatever stopped working — and whoever.
  - id: tismenni_grave_captain
    name: Tismenni Grave-Captain
    level: 6
    hp: 27
    armor_class: 16
    attack_bonus: 7
    damage: "1d10+1"
    move: "30 ft."
    morale: 11
    skill: 2
    save: 12
    role: spectral officer of the drowned empire's war-dead
    tags: [undead, spirit, officer, elite]
    abilities:
      - "Mundane steel slides through it — only blessed or witched weapons bite the spirit"
      - "Muster the fallen — calls up to 1d4 spectral rank-and-file from nearby grave-dust"
    description: >-
      The lingering officer-shade of a Tismenni cohort that died in the
      comet's wave and never stood down. Gleaming, proud, and almost
      alive, it holds a watch-line in a flooded low city no living tongue
      can name, and it musters its drowned soldiers out of the silt to
      hold it. It does not know the war is twelve thousand years lost,
      and it will take a great deal of convincing.
  - id: steppe_manticore
    name: Steppe Manticore
    level: 7
    hp: 32
    armor_class: 15
    attack_bonus: 8
    damage: "1d8+2"
    move: "30 ft., fly 50 ft."
    morale: 9
    skill: 1
    save: 12
    role: barb-tailed flying apex of the high Aldkin steppe
    tags: [beast, apex, flying]
    abilities:
      - "Tail-volley — looses a flight of poisoned barbs at range before it closes"
      - "Strafing dive — strikes from the air and is climbing away before a reply lands"
    description: >-
      A lion-bodied horror with a near-human face and a tail that
      throws iron barbs, ruling the high passes the Aldkin must cross to
      reach the summer grass. It barbs the riders from a distance, takes
      a horse on the dive, and is back in the wind before the bows are
      strung. The Aldkin do not hunt it; they pay it a horse and pray it
      finds that enough.
