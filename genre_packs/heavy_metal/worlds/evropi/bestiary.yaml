      hold it — a coalesced darkness in the shape of a hooded absence, drifting
      the sunken halls of a drowned-empire ruin or a crown's forgotten oubliette.
      It does not haunt one room as a ghost does; it goes where the warm are, and
      it leaves a colder dark behind it.

  # ── DEEP BAND (8-9) — the great dead and the apex bargained ──────────

