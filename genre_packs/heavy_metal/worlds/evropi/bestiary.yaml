    description: >-
      The bones of one of the great horned haulers the Mistos worked to death in
      the Ingurdios mines, risen where they dug past the Deep Hollows and woke
      what should have stayed asleep. Bone the breadth of a pit-prop, the heavy
      skull's horns yellowed and intact, it charges down the lightless drifts on
      the last order the overseers ever gave it.

  - id: mummy
    name: Mummy
    level: 3
    hp: 14
