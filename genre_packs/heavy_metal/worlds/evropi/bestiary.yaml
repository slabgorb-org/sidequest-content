    tags: [undead, mid]
    abilities:
      - "Knits its wounds shut between blows unless burned or struck in running water"
      - "Bite-drain — a fastened bite draws blood and strength both"
    description: >-
      A debtor a crown-vampire kept instead of settling its own account with a
      Crimson God — drained almost to death and raised half-made, so the
      half-life is itself the unpaid covenant walking around. Bound to the blood
      that remade it, it hunts on a leash it cannot feel, brings the warm back to
      its master, and heals from anything that is not fire or the river.

  - id: wraith
    name: Wraith
    level: 5
