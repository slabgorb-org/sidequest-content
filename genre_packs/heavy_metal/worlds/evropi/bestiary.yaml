      - "Charm — a held gaze bends the will of one who meets it; the charmed will not strike it"
      - "Life-drain bite; regenerates each round it is not burning or in running water"
    description: >-
      A noble of one of the three crowns, or a Wujasjav adept, who paid a
      Crimson God for an end to dying and got exactly that and no more. It keeps
      a court of charmed thralls and spawn, holds a coffin no servant will name,
      and treats the centuries as a long and tiresome game it cannot lose by
      dying — only by being found.

  - id: mummy_lord
    name: Mummy Lord
    level: 9
