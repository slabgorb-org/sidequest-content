      - "Crushing slam — a single blow of the dead fists fells a lesser man outright"
    description: >-
      One of the big steppe brutes the Aldkin drive off their herds, dead and
      raised and slower for it — a head taller than a man, grey flesh split over
      grey bone. It feels nothing and stops for nothing, and a Wujasjav adept
      will set one at a door and walk away certain it will still be there in a
      year.

  - id: ghost
    name: Ghost
    level: 4
