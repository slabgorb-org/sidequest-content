      - "Hurls fire — flings a gout of flame at a target out of reach"
    description: >-
      A Reckoner clad head to foot in its own iron barbs, sent when a covenant
      turns to violence and the letter permits it. It would rather you came to
      it; closing with a Barbed Reckoner costs blood for every yard, and it
      throws fire to make sure you have to.

  - id: dream_creditor
    name: Dream-Creditor
    level: 5
    hp: 22
    armor_class: 15
    attack_bonus: 5
    damage: "1d6+1"
    move: "30 ft."
    morale: 9
    skill: 2
    save: 13
