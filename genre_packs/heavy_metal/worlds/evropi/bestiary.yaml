      - "Withering gaze — meeting its eyes ages a victim cruelly unless they look away in time"
      - "Bound — cannot leave the place or thing that holds it; destroy the anchor to lay it"
    description: >-
      The dead of a killing too unjust to settle — a witness the Wazdia
      silenced, a Mistos exile left for the cold, a Zkędzała succession-killing
      dressed up as an accident. It cannot leave the room or the road or the ring
      that holds it, and it cannot rest while the wrong that made it stands unanswered.

  - id: vampire_spawn
    name: Vampire Spawn
    level: 5
    hp: 22
    armor_class: 15
    attack_bonus: 5
    damage: "1d8+1"
    move: "30 ft."
    morale: 12
    skill: 2
    save: 13
