    tags: [fiend, mid, demon]
    abilities:
      - "Spore-reek — releases a cloud of carrion-spores that nauseates and weakens the living near it"
      - "Maddening screech — once a scene, a shriek that leaves those who hear it reeling and unable to act"
    description: >-
      A great rotted vulture-thing, one of the lesser hungers a Crimson God
      sends when the bargain it was owed has spoiled. It screams down out of a
      red sky over the barrow-fields, fouls the air with carrion-spores, and
      tears at what its screech has left too stunned to run.

