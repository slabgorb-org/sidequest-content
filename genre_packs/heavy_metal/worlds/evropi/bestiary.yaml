    tags: [fiend, mid, demon]
    abilities:
      - "Flaming hooves — its stride scorches; a struck target takes burning damage"
      - "Smoke-stride — once a scene, it steps into smoke and reappears elsewhere, rider and all"
    description: >-
      An Aldkin Anta horse a Crimson God took in payment and gave back wrong —
      black still, but maned in flame and breathing grave-smoke, the mount it
