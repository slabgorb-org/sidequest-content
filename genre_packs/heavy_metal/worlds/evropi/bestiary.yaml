    tags: [fiend, mid, demon, shapechanger]
    abilities:
      - "Wears a wanted face — takes the shape the mark most longs for"
      - "Draining kiss — a willing touch saps years of life and bleeds away the will to resist"
      - "Unmasked, it flees — invisible, ethereal, gone the moment its game is seen for what it is"
    description: >-
      A fiend that trades in longing — it comes wearing the face you most wanted
      to see, and the covenant it offers always sounds like mercy. Each kiss
      takes a measure of life and a larger measure of judgement. It rules nothing
      by force; it does not need to, until the moment it is recognised, and then
      it is simply gone.

  - id: barbed_reckoner
