    tags: [fiend, mid]
    abilities:
      - "Haunts sleep — rides a chosen sleeper night after night, leaving them hollow and unrested by morning"
      - "Steps through dream — slips into the half-real to escape or to reach a sleeper miles off"
      - "Soul-bargain — offers ease from the haunting at a price written in years"
    description: >-
      A crone-fiend who deals in the debts the Crimson Gods find too small to
      bother with — a year here, a night's rest there. She haunts a sleeper she
      has marked until they will sign anything for one whole night, and the price
      is always the same and always more than it sounded. She and the Zkędzała-
      Bound Hag have an arrangement; neither will say what it costs.

