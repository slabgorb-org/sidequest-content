      - "Paralysing touch — a bare-handed strike saves or locks the body rigid"
      - "Withering working — looses a searing or draining covenant-effect at range each round"
    description: >-
      A Wujasjav adept, or a Tismenni scholar-king, who made the last covenant —
      paid its own death into a hidden vessel and went on working. It remembers
      every bargain it ever brokered and means to outlast every party to them,
      patient past sanity in a tower or a sunken library, guarding the one jar
      that is the only thing in the world that can end it.

  # ── FIENDS — the bargained-for: Crimson Gods + Reckoners ─────────────
  # ── LOW BAND ─────────────────────────────────────────────────────────

