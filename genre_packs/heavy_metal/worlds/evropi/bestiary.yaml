      - "Rot-curse — its touch lays a wasting that no mundane care will heal"
      - "Channels dread — once a scene, all who behold it save or flee its presence"
    description: >-
      A Tismenni high priest or archon embalmed to outlast the comet, throned in
      a flooded sanctum no living tongue can name, its heart sealed in a far jar
      so the body could be unmade and still return. It is waking now, as the
      crowns above the drowned empire begin to fall, and it does not yet know
      twelve thousand years have passed — only that its rites have lapsed.

  - id: lich
    name: Lich
    level: 9
