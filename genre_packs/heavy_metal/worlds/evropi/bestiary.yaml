    attack_bonus: 3
    damage: "1d8"
    move: "20 ft."
    morale: 12
    skill: 1
    save: 14
    role: embalmed drowned-empire dead, woken angry
    tags: [undead, mid]
    abilities:
      - "Fearless — never checks morale"
      - "Rot-curse — a struck victim saves or takes a wasting curse that will not close or heal"
    description: >-
      A Tismenni dead preserved against the Cataclysm in the old embalming
      rites, dry as river-silt and twice as patient. It wakes when its rest is
      broken — a Mistos excavation, a Jambiendo grave-robber — and the wound it
      lays does not bleed and does not close, only spreads.

  - id: will_o_wisp
