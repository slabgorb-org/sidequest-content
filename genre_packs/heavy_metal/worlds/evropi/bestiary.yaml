    description: >-
      A dead of rank that kept its will past the grave — a Tismenni officer, a
      crown noble buried with his arms, a barrow-king of a line no one living
      remembers. It rules the lesser dead of its shaft and raises every fresh
      corpse it kills to swell the cold company it commands.

  - id: risen_steppe_brute
    name: Risen Steppe-Brute
    level: 3
    hp: 14
    armor_class: 11
    attack_bonus: 3
    damage: "2d6"
    move: "30 ft."
    morale: 12
