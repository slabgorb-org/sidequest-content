      - "Stinger — a barbed tail-stab carries a creeping poison"
      - "Coward — flees the instant a fight turns against it"
    description: >-
      The small contractual fiend a Reckoner sends ahead to read a household's
      debts — invisible in the rafters, counting the silver, learning the names.
      It does no killing it can avoid; its work is the tally, and the tally is
      what the greater Reckoner comes to collect.

