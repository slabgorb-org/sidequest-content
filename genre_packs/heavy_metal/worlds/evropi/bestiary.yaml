    move: "fly 50 ft."
    morale: 12
    skill: 1
    save: 14
    role: malevolent marsh-light of the Hvoru fens
    tags: [undead, mid, incorporeal]
    abilities:
      - "Lure-light — drifts ahead as a lantern or a rescue-lamp, leading the lost into the deep channels"
      - "Winks out — snuffs its glow and goes near-impossible to strike, then shocks the floundering"
    description: >-
      Not a beast but a Wujasjav working that drowned with its caster in the
      Hvoru fens and never went out — a covenant's loose end, burning cold over
      the salt channels and hungry the way the unpaid are hungry. It leads the
      trusting off the safe reed-paths into the sucking dark, snuffs its glow,
      and waits for the drowning to tire. The enslaved Waterfolk who work the
      fens will not follow a light that does not call a name.

  - id: wight
