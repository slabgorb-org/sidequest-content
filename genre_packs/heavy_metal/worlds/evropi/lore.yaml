world_name: Evrópí

cosmology: >-
  Evrópí's religious landscape is polytheistic, fragmentary, and
  older than any of its current empires. There is no single feeding
  cult, no Astran ledger-priesthood, no First-Feeder bedrock beneath
  the soil. The gods of Evrópí are paid for in a dozen different
  currencies — offerings of burnt food at a personal idol, years of
  life at a Njörkte's hand, a broken celibacy oath that brings the
  Black Pox home to your wife, a flawless copy of a scripture whose
  single error costs you a year of your life, a bargain with a fiery
  demonic visage from the 999 Crimson Gods that takes your name in
  exchange for a favour. The Flock — the most popular religious
  framework — holds that worshippers are under the care of a
  benevolent shepherd-deity called the Herdsman, but that each
  worshipper also maintains their own personalised minor god, bought
  or commissioned from a marketplace stall and kept on a household
  shelf with small offerings. The Herdsman himself is a deity of
  gathering and of separating the good from the bad — a pastoral
  god whose cost is the weight the officiating Njörkte carries when
  they perform the separation. The Green is a nature-religion whose
  celibate druidic order, the Scouts of the Green, patrols the
  forests and swamps and pays for their nature-bond in childlessness.
  The 999 Crimson Gods are a pantheon of individually-unique fiery
  deities with demonic visages; each bargain with a named Crimson
  God costs flesh, name, or blood, and each god is a private
  arrangement. The Book of Aest is not a god at all — it is a
  scripture, but the Vaermm treat it as the whole theological
  apparatus and the cost it exacts is the proscription of every
  thought that is not mandatory. Beneath all of these sits the Land
  of Dust — the Dustlands, a plane-of-shadows afterlife bordered by
  the Chalky Cliffs, where souls go after they die and where, in
  certain thin places, the dead of the Tismenni empire can still
  be heard if a scholar knows how to listen.

history: >-
  Evrópí's history is counted in thirteen-thousand-year spans. The
  first civilisation — the Tismenni — rose around -13780, reached a
  golden age from -12940 to -12010, and was destroyed at -11540 when
  a comet struck the ocean and sent a tsunami across the continent
  that drowned the empire's low cities, poisoned its water tables,
  and broke every working institution it had ever built. What
  followed was the Dark Age, twelve hundred and sixty years of
  scavenging and forgetting, during which the survivors — the
  ancestors of every current people in Evrópí — found each other in
  the highlands and the steppes and slowly rebuilt. The Second
  Rising began around -1280, when the Zkęd coalesced in the Egzami
  forest, the Mistos consolidated around their first General, and
  the Vaermm copied out their first Book of Aest. Year 0 marks the
  rebellion against the oppressive regime the histories call only
  "the Not" — they had other names once, the histories imply, but
  the rebels chose to forget them, and three millennia later the
  forgetting has become policy. The current era dates from that
  rebellion. In Zkędzała it is the era of Waz Isku VIII, old and
  sharp-tongued, whose three sons — the twins Zisku and Kisku and
  the youngest Ndiziały — position for the throne while the Wazdia,
  which Ndiziały quietly controls, tightens its grip on the
  countryside. The Mistos General is pressing north from the
  Zbóźny Mountains into former Zkęd buffer-states. The Vaermm are
  circulating fresh Books through their foothill holds. And in the
  deep places — the Tismenni ruins, the thin patches of the Land
  of Dust, the undersea vents where the Bladtrablo forge — older
  things are beginning to stir for the first time in twelve thousand
  years. Every empire is ending. The world is counting down to
  which ending happens first.

geography: >-
  Evrópí is a broad temperate continent. At its western edge the
  Klas Steppes stretch from the northern cold down to the river
  Jälv — open grasslands where the Aldkin ride their Anta horses
  between summer and winter pastures under the Herdsman's weather.
  The Jälv runs deep and cold out of the north and widens as it
  moves south, draining eventually into the Řeknu ocean at the
  Zkędzała port of Pę. East of the Jälv the land rises into the
  Egzami forest — the dense, dark interior of Zkędzała, named for
  the zami tree whose arrowhead leaves and pest-resistant wood are
  the kingdom's chief export. The southern border of Zkędzała is
  the Zbóźny mountain range, beyond which lie the Mistos heartland
  and the mine-warrens of the Ingurdios. South-east of the Egzami,
  the Hvoru salt marshes and the deeper freshwater swamps host
  the Waterfolk and the Pakook`rook respectively — two marsh-people
  at war with each other, both enslaved by the Zkęd. Further south
  still, the Vaermm keep to their marginal scrublands between the
  empires, never quite inside any of them. At the eastern edge of
  the continent, the Sabulous Islands rise from the Řeknu — an
  archipelago of spice-bearing tropical islands home to the
  Jambiendo and their gull-ships, and beneath the Řeknu around
  those islands the Bladtrablo keep their undersea cities around
  the volcanic vents. Scattered across every region are the ruins
  of the Tismenni — collapsed roads, broken sundials on unnamed
  hills, cisterns too large for any currently-living people to
  have built, and the occasional half-drowned ampitheatre still
  visible from the air of a gull-ship on a clear day.

factions:
  # ──────────────────────────────────────────────────────────────
  # The Zkęd authoritarian system
  # ──────────────────────────────────────────────────────────────
  - name: The Wazdia
    disposition: hostile
    summary: "Zkęd secret police and slave-trade operators. Motto: 'Śmieszczę zgiem Zych' — Mind before Heart."
    description: >-
      The secret police of the Kingdom of Zkędzała. They employ
      thousands of informers, hundreds of agents, and dozens of
      special agents, as well as controlling other groups
      indirectly — notably the Daggereyes assassins, whose contract
      killings they commission and publicly disavow. The Wazdia
      motto is "Mind before Heart"; their symbol is the Zkędzała
      coat of arms with the motto on a banner. They are currently,
      quietly, controlled by Ndiziały, the youngest of Waz Isku
      VIII's sons. Their agents carry Wazdian Daggers — wickedly
      curved single-edged blades in silver-chased scabbards — and
      their special agents additionally carry Wazdian Rings of
      Commission, seal-rings that grant immunity to divination and
      the ability to decode Wazdian cipher-writing.

  - name: The Daggereyes
    disposition: hostile
    summary: "Wazdia-controlled assassins and bandits led by Srárný Fyzioloniązka; mark of knife-tattoos on the forehead"
    description: >-
      A group of outlaws, deserters, thieves, and raiders operating
      on and in the Egzami forest in Zkędzała. They are easily
      distinguished by tattoos of daggers on their foreheads,
      between the eyebrows. The leader is Srárný Fyzioloniązka, a
      scarred woman who wears a crimson eye-patch over her left eye
      and takes most of her orders from the Wazdia. The Daggereyes
      make most of their money from Wazdia contract killings, but
      are not above mere highway robbery when assassinations are
      light. They can sometimes be hired for freelance work if the
      money is right — murder-for-hire and collections jobs only.
      A prospective member must perform an assassination to prove
      they are serious and impress Srárný herself.

  - name: The Widząn Zamzau
    disposition: cautious
    summary: "Secret rebel cult seeking the lost heir of Zamzau, the rightful Waz deposed in the event known as Mutallamus"
    description: >-
      Also known simply as the Widząn. A secret society whose
      members believe that the rightful Waz of Zkędzała is a
      descendant of Zamzau — the king deposed and killed in the
      event known as Mutallamus, when his wife Auteny betrayed him
      to her lover Pętu na Renwaz. Some Widząn ascribe almost
      messianic powers to the hidden heir, who they call Zygwa —
      "the true king." The goal of the Widząn is first to find the
      heir, then lead a rebellion that ends with Zygwa on the
      throne. Members are ranked by their service to the search:
      Widząn (follower), Lwowar gra na`Halla (Seeker of the Heir),
      Lazłowyr gra na`Halla (Protector of the Heir), Lazłowyr gra
      Zygwa (Protector of the True King). Membership is largely
      hereditary; newcomers are slow to trust unless they marry
      in. The Widząn are actively hunted by the Wazdia, who
      consider the entire cult high treason. Outside Zkęd are
      almost never admitted.

  - name: The Wujasjav
    disposition: neutral
    summary: "Zkęd mage guild based in Pę — practitioners of high-cost covenant thaumaturgy"
    description: >-
      The mage guild of the Kingdom of Zkędzała, based in the
      ocean port of Pę. The Wujasjav practise high-cost thaumaturgy
      — every working is a covenant with something, and every
      covenant costs blood, years, or names. The guild is tolerated
      by the Wazdia because it is useful and taxed heavily. Its
      masters, called Wujadru, keep to themselves and rarely
      involve themselves in court politics. They train apprentices
      under a seven-year indenture that doubles as a personal
      covenant with the guild itself.

  # ──────────────────────────────────────────────────────────────
  # The Mistos authoritarian system
  # ──────────────────────────────────────────────────────────────
  - name: The General's Host
    disposition: hostile
    summary: "The standing military of Mistos — beauty-eugenic conscript army in red-and-black silks"
    description: >-
      The military of Mistos, which is to say the government of
      Mistos, which is to say Mistos itself — the three are the
      same institution under different names. The General is the
      ruler and the commander and the theological authority. Every
      able-bodied Mistos male and female serves in the Host;
      retirement is not a meaningful concept. Their uniform is
      red and black silk over black leather, tailored to display
      the wearer's physical perfection — and any Mistos who can no
      longer display perfection, for any reason from birthmark to
      battle-scar to age, is quietly banished. They fight in
      parade-ground formations that prioritise beauty of movement
      over battlefield effectiveness, and they are terrifying
      anyway, because their logic is closed and their will is
      absolute.

  - name: The Puppet Seats
    disposition: hostile
    summary: "Mistos-installed puppet governments in conquered neighbour-states"
    description: >-
      Mistos does not annex territory. It conquers neighbours,
      installs a local ruler who takes orders from the General,
      and withdraws most of the occupying Host — leaving a Warden
      and a small garrison to ensure the puppet remains puppet.
      There are currently several Puppet Seats in former Zkęd
      buffer-states along the southern Zbóźny foothills, which
      Waz Isku VIII refuses to publicly acknowledge.

  - name: The Last Ingurdios
    disposition: cautious
    summary: "Ingurdios messianic underground — waiting for a messiah who will speak the old language aloud in the mines"
    description: >-
      The religious/rebel underground among the Ingurdios, the
      subjugated people forced to labour in the Mistos mines of
      the Zbóźny Mountains. They believe a messiah will come to
      the mines and speak the dead Ingurdios language aloud for
      the first time in generations, and that when the words are
      spoken the mountain will remember them. The Mistos consider
      the belief harmless and do not forbid it. The Ingurdios who
      believe it know this is the General's mistake. The only
      surviving fragments of the old language are in ancient
      Tismenni scholarly tomes, guarded by the Wujasjav and a
      handful of independent scholars.

  # ──────────────────────────────────────────────────────────────
  # The Vaermm authoritarian system
  # ──────────────────────────────────────────────────────────────
  - name: The Book-Checkers
    disposition: wary
    summary: "The Vaermm clerisy who verify coming-of-age Book copies for errors in ceremonies lasting hours"
    description: >-
      The Vaermm institution responsible for checking coming-of-age
      Book of Aest copies against the master scripture. Every
      Vaermm copies out their own Book as part of the coming-of-
      age rite; the copy is then read aloud before a circle of
      Book-Checkers in a ceremony that lasts for hours, and any
      error — a missing clause, a misplaced comma, a single word
      mistranscribed — results in a year's delay and another
      attempt. The Checkers are fast readers, impassive, and
      almost always correct. A Checker who misses an error that
      is later discovered is themselves delayed a year from
      Checker duties. The system is self-correcting in the way
      only a closed totalitarian system can be.

  # ──────────────────────────────────────────────────────────────
  # The free peoples
  # ──────────────────────────────────────────────────────────────
  - name: The Council of the Njörkte
    disposition: neutral
    summary: "Loose council of Aldkin clerics, led by the eldest Njörkte, who speak to the Mjöndenheill on behalf of the tribes"
    description: >-
      The Njörkte are the clerics of the Aldkin, responsible for
      telling the tribes when to move pastures, acting as judges
      in inter-clan disputes, and interpreting the will of the
      Herdsman. They are not a hierarchy — the Aldkin resist
      hierarchy — but they hold loose council at Epäässä, and the
      eldest Njörkte acts as spokesman to the Mjöndenheill, the
      council of clan-heads. A Njörkte pays for every prophecy in
      years, and the oldest Njörkte in the Klas is, without
      exception, the one with the shortest remaining life.

  - name: The Gull-Captains' Compact
    disposition: friendly
    summary: "Jambiendo trading compact coordinating spice, salt, and tralbotura routes across the Řeknu"
    description: >-
      Not a formal government — the Jambiendo don't have one — but
      a working agreement among the senior gull-ship captains of
      the Sabulous Islands to share route information, coordinate
      pricing at foreign ports, and keep the Bladtrablo feud from
      interfering with trade. The Compact meets on Rything Island
      once a year during Fevre (the eleventh month) and resolves
      its disputes through song-duels judged by J`rook bards
      brought specifically for the purpose.

  - name: The Scouts of the Green
    disposition: cautious
    summary: "Celibate druidic order devoted to the Green; patrols forests and swamps; breaks oaths only for love"
    description: >-
      An ancient celibate druidic order whose members patrol the
      forests and swamps of Evrópí in service to the Green — the
      nature-religion whose priesthood is the Scouts' order. The
      celibacy is the price of the bond; a Scout who breaks their
      oath for love loses the Green's protection in specific,
      usually tragic, ways. Gan son of Gan, a known tracker near
      Upre, is a former Scout who left the order to marry a young
      woman named Daliann, who died of the Black Pox within a year.
      Gan still tracks, but not for the Green.

notable_items:
  - name: Wazdian Dagger
    description: >-
      The standard sidearm of Wazdia field agents. A wickedly
      curved single-edged blade, red shading to white on the
      cutting edge, in a silver-chased matching scabbard. The
      pommel and scabbard bear the Zkędzała coat of arms in
      intricate interlocking patterns.

  - name: Wazdian Quill
    description: >-
      A minor magic item carried by Wazdia agents. The user
      writes their secret message, and the quill magically
      rewrites it as an innocuous letter — usually a request for
      supplies or a routine report. The paper the code rests on
      radiates faint magic, dispellable with some difficulty.

  - name: Wazdian Ring of Commission
    description: >-
      Carried by Wazdia special agents. A large seal-ring bearing
      the Zkędzała coat of arms in reverse relief with the Wazdia
      motto. The wearer is immune to divination. Taking off the
      ring and peering through its hole at a Wazdian-coded
      document decodes the message. The seal is also used to
      create wax seals on important documents. If a Ring of
      Commission falls into non-agent hands, the Wazdia will stop
      at nothing to recover it.

  - name: The Book of Aest
    description: >-
      The Vaermm scripture, copied out by every Vaermm at coming-
      of-age in a ceremony that takes a full year from preparation
      through error-checking. Contains the teachings of Aest on
      right-thinking. Its central tenets proscribe original
      thought in any form. An error-free Book is a Vaermm's most
      prized possession; a flawed copy is, technically, a
      disqualification from adult life until the correction is made.

notable_plants_and_drugs:
  - name: reniksnad
    description: >-
      A highly addictive stimulant plant drug found in the Kingdom
      of Zkędzała, fed to Waterfolk and Pakook`rook slaves in Pę
      to keep them tractable. Withdrawal kills the addict within a
      week of the last dose. The Wazdia maintains the supply and
      taxes it heavily; the Wujasjav uses it occasionally in
      covenant-magic workings.

  - name: zami
    description: >-
      The tree from which the Egzami forest takes its name. Large
      arrowhead leaves and dense dark wood — strong, light,
      durable, pest-resistant. Zami wood is Zkędzała's chief export
      to the Jambiendo and Pakook`rook and is traded as currency
      in some northern markets.

  - name: uděl
    description: >-
      A highly nutritious cereal grain first domesticated by the
      Zkęd. Grows very well in Zkędzała's temperate forests and
      river valleys. The staple starch of the kingdom.

  - name: ipesat`il
    description: >-
      A nutritious breadfruit endemic to the Sabulous Islands.
      Staple food of the Jambiendo, alongside fish and sea salt.

  - name: tralbotura
    description: >-
      A seaweed endemic to the Sabulous Islands. Beaten by Jambiendo
      elders on resonant logs into fibres that are woven into the
      light cloth the Jambiendo favour. The beaches of the islands
      echo with the sound of pounding logs during the harvest.

notable_languages:
  - name: Jabber
    speakers: "mixed, everywhere"
    literacy: "low"
    description: >-
      The trade tongue — a mix of several language families with
      interchangeable dialects. Most non-Jambiendo, non-Tismenni
      speakers of more than one language can manage Jabber enough
      to haggle, if not to be polite.

  - name: Tismenni
    speakers: "scholars, wizards, archivists"
    literacy: "high among speakers"
    description: >-
      The dead language of the drowned empire. Not spoken by any
      living people in daily use, but taught to scholars and
      mages as the lingua franca of the intellectual world. The
      only surviving fragments of the Ingurdios original language
      exist in Tismenni scholarly tomes.

  - name: Trosse
    speakers: "Jambiendo, Mistos"
    literacy: "varies"
    description: >-
      The language family shared by the Jambiendo and the Mistos.
      Centuries of divergence have given the Mistos variant a
      harsh, clipped military accent that no Jambiendo would
      confuse with their own soft trade-dialect. No one knows how
      the two peoples were separated. Neither publicly speculates.

  - name: Zkęd
    speakers: "Zkęd, Wazdia, slave-owners"
    literacy: "high among nobility, low among commoners"
    description: >-
      The authoritarian language of Zkędzała. The Zkęd language
      family also contains Zypič, spoken by the Waterfolk in the
      Hvoru marshes — a fact the Zkęd do not acknowledge publicly
      but which scholars of language have noted for centuries.

  - name: Pakook
    speakers: "Pakook`rook, and Vaermm traders"
    literacy: "~25%"
    description: >-
      The croaking language of the swamp-dwelling Pakook`rook,
      written in knotsongs (Hrooukpookrook) — a syllabary of
      knotted reeds tied to thin sticks. A J`rook bard can sing
      a knotsong by harmonising with himself through an inflated
      throat-sac.

  - name: Aldkin
    speakers: "Aldkin tribes"
    literacy: "~20%"
    description: >-
      The language of the steppe nomads. Inflected, melodic, full
      of weather-words and horse-words. The Njörkte maintain an
      oral-tradition glossary that scholars occasionally try, and
      fail, to fully transcribe.
