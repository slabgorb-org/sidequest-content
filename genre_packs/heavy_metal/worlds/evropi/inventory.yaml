# Evrópí world inventory — Third Cut escape loot
#
# The party's starting kit is looted Mistos Host equipment from the Third Cut
# overseer detachment in the Ingurdios mines. Every piece is red-and-black
# silk over black leather, tailored to a body none of them have. Trosse script
# on the blades. Dye-over-dye on the cloaks. A recognizable kit in the wrong
# light — the Mistos do not love seeing their own livery on the road.
#
# Currency: the heavy_metal mark / silver / copper. Declared here at the world
# tier (epic 94 genre/world boundary — the world owns the catalog; the deleted
# genre-tier inventory.yaml can no longer supply it).
currency:
  name: mark
  denominations:
    - copper
    - silver
    - mark

item_catalog:

  # ──────────────────────────────────────────────────────────────
  # Weapons — Mistos Host issue, Trosse-inscribed, parade-beautiful
  # ──────────────────────────────────────────────────────────────

  - id: mistos_officer_longsword
    name: Quarter-Officer's Hand-and-a-Half Sword
    description: >-
      A Mistos Host officer's longsword, silver-wire grip, blood-groove
      engraved in Trosse: "Discipline over the hollow." The blade is
      beauty-cut and unmistakably Mistos to anyone who has seen a Host
      parade. Balanced for an elven forearm; adequate in a half-orc fist.
    category: weapon
    value: 140
    weight: 2.2
    rarity: uncommon
    power_level: 3
    tags: [melee, blade, one-handed, mistos_livery, recognizable]
    lore: Quarter-officer's sidearm from the Third Cut overseer detachment. The officer did not survive the disagreement.
    narrative_weight: 0.65

  - id: mistos_short_sword
    name: Mistos Short Sword
    description: >-
      Standard Host issue. Jambiendo-stamped blade (Mistos officers trade
      these east through cousin-smugglers), black-lacquered sheath, Trosse
      maker's mark on the tang.
    category: weapon
    value: 40
    weight: 1.6
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed, mistos_livery]
    lore: The working short sword of a Mistos overseer. Given out by the shaft, returned by the shaft.
    narrative_weight: 0.35

  - id: mistos_throwing_daggers
    name: Mistos Officer's Throwing Daggers
    description: >-
      A matched set of three, officer-cadre issue. Balanced for Mistos
      parade-drill, Trosse script on each tang.
    category: weapon
    value: 45
    weight: 0.6
    rarity: common
    power_level: 2
    tags: [thrown, blade, mistos_livery, set]
    lore: Officer-cadre throwing work. Taught as a promotion-ritual skill; every Mistos quarter-officer can place three in a man-shaped target at twenty paces.
    narrative_weight: 0.35

  - id: mistos_travel_sword_short
    name: Mistos Travel Sword
    description: >-
      A Host traveller's blade, lighter than the standard short sword,
      worn under a cloak. The holder of this one does not hold it correctly.
    category: weapon
    value: 30
    weight: 1.2
    rarity: common
    power_level: 1
    tags: [melee, blade, one-handed, mistos_livery]
    lore: Issued to Host attachés and ceremonial couriers who were never expected to use them.
    narrative_weight: 0.3

  # ──────────────────────────────────────────────────────────────
  # Armour — red-and-black livery, fitted wrong
  # ──────────────────────────────────────────────────────────────

  - id: mistos_officer_chain_shirt
    name: Quarter-Officer's Chain Shirt
    description: >-
      Mistos chain shirt, red-and-black silk surcoat over the rings.
      Tailored to an elven torso — rides high on half-orc shoulders and
      pulls at the neck. The surcoat has been re-dyed once, unevenly.
    category: armor
    value: 90
    weight: 11.0
    rarity: uncommon
    power_level: 3
    tags: [medium-armor, torso, mistos_livery, recognizable]
    lore: Officer-cadre armour from the Third Cut. The previous wearer is in a shallow grave five hundred feet underground.
    narrative_weight: 0.55

  - id: mistos_overseer_leathers
    name: Mistos Overseer's Leathers
    description: >-
      Black-leather mine-overseer's kit, reinforced at the shoulders and
      forearms. Cut for a smaller Jambiendo-framed body; sits correctly
      on almost no one.
    category: armor
    value: 25
    weight: 5.0
    rarity: common
    power_level: 1
    tags: [light-armor, torso, mistos_livery]
    lore: The working armour of a Mistos pit-overseer. Dyed-black kidskin, parade-grade stitching where it shows, honest leather where it doesn't.
    narrative_weight: 0.3

  - id: mistos_light_harness
    name: Mistos Light Leather Harness
    description: >-
      A thin harness of black-dyed kidskin, pulled off a smaller guard.
      Straps across a kobold's chest like tack on a large dog.
    category: armor
    value: 12
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [light-armor, torso, mistos_livery, undersized]
    lore: Issued to Mistos shaft-runners — the smaller, faster overseers who move between levels.
    narrative_weight: 0.25

  - id: mistos_parade_shield
    name: Mistos Parade Shield
    description: >-
      A round shield, lacquered brilliant red, with the General's
      black sun-mark painted at the boss. Heavy by parade standards,
      light by battle standards. Unmistakable at fifty paces.
    category: armor
    value: 35
    weight: 4.0
    rarity: common
    power_level: 2
    tags: [shield, mistos_livery, recognizable]
    lore: Host ceremonial issue. Beauty first, function second — the Mistos philosophy in lacquer.
    narrative_weight: 0.4

  # ──────────────────────────────────────────────────────────────
  # Cloaks, boots, accoutrements
  # ──────────────────────────────────────────────────────────────

  - id: dyed_mistos_cloak
    name: Over-Dyed Mistos Cloak
    description: >-
      A Host travel-cloak re-dyed in the cheap Zkęd black that doesn't
      quite take over the Mistos red. In direct sun the original colour
      shows through at the hem and cuffs.
    category: tool
    value: 6
    weight: 2.0
    rarity: common
    power_level: 0
    tags: [clothing, mistos_livery, recognizable]
    lore: Someone tried to make this cloak into civilian clothes. The dye-work is honest work — that's the problem.
    narrative_weight: 0.3

  - id: mistos_officer_cowl
    name: Deep Hooded Officer's Cowl
    description: >-
      A full officer's dress-cowl, meant to frame the face during
      night parade. Pulled low, it conceals mandibles, antennae, or
      anything else the wearer prefers the world not to see.
    category: tool
    value: 10
    weight: 1.0
    rarity: common
    power_level: 0
    tags: [clothing, mistos_livery, concealment]
    lore: The Mistos officer-cowl is designed to make a face look the same as every other face at a torchlit review.
    narrative_weight: 0.35

  - id: mistos_iron_boots
    name: Iron-Shod Marching Boots
    description: >-
      Black marching boots, steel at the toe and heel, half a size
      tight on the current wearer. The Mistos do not issue boots that
      do not fit; these were made for someone else.
    category: tool
    value: 15
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [clothing, mistos_livery]
    lore: Quarter-officer's boots. The Host requires a specific tread on a specific cadence.
    narrative_weight: 0.25

  # ──────────────────────────────────────────────────────────────
  # Overseer kit — tools of the shaft
  # ──────────────────────────────────────────────────────────────

  - id: mistos_manacle_keyring
    name: Overseer's Manacle Keyring
    description: >-
      Five iron keys on a heavy ring, Mistos overseer issue. They open
      every manacle in the Third Cut. Probably others. Someone will
      want these back.
    category: tool
    value: 20
    weight: 0.8
    rarity: uncommon
    power_level: 0
    tags: [tool, mistos_livery, key, loaded]
    lore: Standard five-key ring — shaft irons, wrist irons, ankle chains, storeroom, overseer's own cell-door.
    narrative_weight: 0.55

  - id: mistos_dark_lantern
    name: Overseer's Dark-Lantern
    description: >-
      A half-shutter iron lantern built for creeping shaft corridors.
      Closes to a pinhole, opens to flood a corridor. Smells faintly
      of mine-oil.
    category: tool
    value: 14
    weight: 1.5
    rarity: common
    power_level: 0
    tags: [tool, light, mistos_livery]
    lore: The dark-lantern is older than the Mistos and older than Evrópí. Every mining culture reinvents it.
    narrative_weight: 0.3

  - id: mistos_lockpicks
    name: Overseer's Lockpicks
    description: >-
      A set of six iron picks in a folded leather roll, Mistos overseer
      issue. Three of the six are missing. The set was never whole.
    category: tool
    value: 18
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [tool, mistos_livery, incomplete]
    lore: Overseers are issued picks because miners drop keys. The picks are taken more seriously than the keys.
    narrative_weight: 0.3

  - id: mistos_shaft_roster_third_cut
    name: Third Cut Shaft-Roster
    description: >-
      A black-bound Mistos tally-book listing every name chained in
      the Third Cut. Trosse script, clerical hand, quarter-officer's
      countersign. Unread by the party. Every name is present.
    category: tool
    value: 5
    weight: 0.5
    rarity: rare
    power_level: 0
    tags: [document, mistos_livery, loaded, evidence]
    lore: The Mistos keep meticulous shaft-rosters. A missing roster is how an escape becomes a public escape.
    narrative_weight: 0.7

  - id: mistos_quartermaster_journal
    name: Quartermaster's Field-Journal
    description: >-
      A ruled Host field-journal, most pages blank, a dozen filled
      with Mistos supply notations. The current owner has begun
      inscribing over them in a script no one on this continent reads.
    category: tool
    value: 4
    weight: 0.4
    rarity: common
    power_level: 0
    tags: [document, mistos_livery, scribe]
    lore: Host quartermasters issue these by the case. The Mistos audit paper.
    narrative_weight: 0.4

  - id: mistos_inkhorn
    name: Mistos Scribe-Inkhorn
    description: >-
      A Mistos scribe's turned-horn inkwell, capped in brass, half
      dry. Standard Host issue for clerical and overseer work.
    category: tool
    value: 3
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [tool, scribe, mistos_livery]
    lore: The ink itself is Mistos-blended — oak-gall and lampblack, a formula the Host will not share.
    narrative_weight: 0.2

  - id: mistos_sighting_lens
    name: Officer's Sighting-Lens
    description: >-
      A ground-glass lens in a brass collar, meant for reading
      horizon-signals at parade distance. Repurposed here as a
      reading-glass by a gnome with increasingly dim eyes.
    category: tool
    value: 22
    weight: 0.3
    rarity: uncommon
    power_level: 0
    tags: [tool, mistos_livery]
    lore: Mistos officers use these to read signal-flags across formation distances.
    narrative_weight: 0.4

  # ──────────────────────────────────────────────────────────────
  # Sapper tools — Cheeney's trade, split across the party
  # ──────────────────────────────────────────────────────────────

  - id: sapper_picks
    name: Cheeney's Sapper Picks
    description: >-
      A canvas roll of sapper's tools — two narrow picks, a hammer,
      chisels, a pair of iron wedges. Gnomish handles, wrapped in
      leather. Cheeney's personal set, partly recovered.
    category: tool
    value: 30
    weight: 3.5
    rarity: uncommon
    power_level: 0
    tags: [tool, sapper, gnomish]
    lore: A sapper's picks are chosen, not issued. Cheeney carried these into the Third Cut and brought most of them out.
    narrative_weight: 0.5

  - id: sapper_fuse_cord
    name: Coil of Sapper-Fuse Cord
    description: >-
      Tar-soaked hemp cord, burns at a measured rate, used for
      timing controlled collapses. Enough for three small charges
      or one dramatic one.
    category: consumable
    value: 10
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [consumable, sapper]
    lore: Gnomish sappers measure fuse by heartbeat; Cheeney can walk a fuse to within a span.
    narrative_weight: 0.3

  - id: blackfire_powder_paper
    name: Paper of Blackfire Powder
    description: >-
      A folded oiled-paper packet of coarse blackfire powder, enough
      for one loud evening. Not quite gunpowder. Smells faintly of
      sulphur and something mineral.
    category: consumable
    value: 25
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [consumable, sapper, volatile]
    lore: Blackfire powder is the older cousin of gunpowder — unreliable, loud, and sufficient for the work a sapper does with it.
    narrative_weight: 0.4

  - id: climbing_line
    name: Climbing Line and Pitons
    description: >-
      A fifty-foot coil of tarred hempen line and a set of six iron
      pitons. Sapper's kit, used for vertical shaft work.
    category: tool
    value: 12
    weight: 2.5
    rarity: common
    power_level: 0
    tags: [tool, sapper]
    lore: The line was Cheeney's. He pulled it down on his way out of the back-seam.
    narrative_weight: 0.25

  # ──────────────────────────────────────────────────────────────
  # Personal / character-specific
  # ──────────────────────────────────────────────────────────────

  - id: pheromone_composition_kit
    name: Pheromone Composition Kit
    description: >-
      A small brass case of stoppered resin-flasks, each a single
      scent-note. Hant carries it under his chitin plates; it
      survived the Third Cut because no Mistos overseer recognised
      it as anything.
    category: tool
    value: 80
    weight: 0.8
    rarity: rare
    power_level: 2
    tags: [tool, antman, concealed, personal]
    lore: The pheromone-courts of the Deep Hollows teach composition as a chemistry. A bard of Hant's station carries a full first-chair kit.
    narrative_weight: 0.75

  - id: mistos_ceremonial_reed_pipe
    name: Host Ceremonial Reed-Pipe
    description: >-
      A black-lacquered reed-pipe from the Mistos Host music-corps,
      meant for parade cadence. Rebored by its current holder to
      carry scent-notes instead of melody.
    category: tool
    value: 20
    weight: 0.3
    rarity: uncommon
    power_level: 0
    tags: [tool, instrument, mistos_livery, modified]
    lore: The Host music-corps plays standing formations through their reed-pipes. No Mistos would recognise what Hant has made of this one.
    narrative_weight: 0.5

  - id: spellbook_tismenni_iii
    name: "Spellbook: Tismenni Corpus Vol. III"
    description: >-
      A thick leather-bound spellbook whose spine reads "Tismenni
      Corpus Vol. III" in an alphabet Pumblestone assures everyone
      he can read. The binding is too fresh by approximately twelve
      thousand years for the title to be accurate.
    category: tool
    value: 200
    weight: 3.0
    rarity: rare
    power_level: 3
    tags: [spellbook, tismenni, pumblestone, mystery]
    lore: Pumblestone is a forgetful sage. The book is something. What it is, precisely, he will confidently misremember.
    narrative_weight: 0.8

  - id: zboźny_pine_staff
    name: Zbóźny Pine Walking Staff
    description: >-
      A walking staff cut from a Zbóźny pine during the escape. Still
      smells of the mountain. Cheeney shaped the grip.
    category: weapon
    value: 5
    weight: 1.4
    rarity: common
    power_level: 1
    tags: [melee, blunt, two-handed, focus]
    lore: Cut at dawn, above the Third Cut, from a tree older than the current quarter-officer.
    narrative_weight: 0.4

  - id: strata_map_tismenni
    name: Tismenni Strata Map
    description: >-
      A Tismenni-era map of a strata site in the Zbóźny foothills.
      Copied from an older copy of an older copy. The markings are
      geological, the legend is in a dead alphabet.
    category: tool
    value: 60
    weight: 0.2
    rarity: rare
    power_level: 0
    tags: [document, map, tismenni]
    lore: The Tismenni surveyed the mountains twelve thousand years ago. Their maps are still occasionally useful, and occasionally lethal.
    narrative_weight: 0.65

  - id: strata_map_mistos_prospector
    name: Mistos Prospector's Survey
    description: >-
      A Mistos prospector's strata survey of the same region as the
      Tismenni map. They disagree about the location of the site by
      roughly a day's walk. One of them is wrong.
    category: tool
    value: 40
    weight: 0.2
    rarity: uncommon
    power_level: 0
    tags: [document, map, mistos_livery]
    lore: Mistos prospectors are competent. Their disagreement with the Tismenni map is therefore interesting.
    narrative_weight: 0.65

# ──────────────────────────────────────────────────────────────────
# Starting kits — Third Cut escape loot, distributed by class
# ──────────────────────────────────────────────────────────────────
# All evropi parties wear looted Mistos Host kit. The engine wires starting
# loadouts class-first (inventory.yaml::starting_equipment[class]), the same
# shape every other heavy_metal world uses (long_foundry, barsoom), so the kit
# is keyed by the seven WWN classes rather than by named PC. Item ids reference
# item_catalog above; weapons/armor are auto-handled by the loadout wiring.
#
# Provenance — the original per-PC escape kits these class kits descend from
# (kept for the table's own reference; the named PCs map onto the class kits):
#   Prot'Thokk  (quarter-officer)  -> Warrior
#   Rux         (shaft-runner)     -> Expert
#   Hant        (composer/face)    -> Mentalist
#   Pumblestone (sage)             -> Necromancer / Elementalist

starting_equipment:
  Warrior:
    - mistos_officer_chain_shirt
    - mistos_officer_longsword
    - mistos_parade_shield
    - mistos_manacle_keyring
    - dyed_mistos_cloak
    - mistos_iron_boots
    - sapper_picks
  Expert:
    - mistos_short_sword
    - mistos_throwing_daggers
    - mistos_light_harness
    - mistos_dark_lantern
    - mistos_lockpicks
    - dyed_mistos_cloak
    - climbing_line
  Mentalist:
    - mistos_travel_sword_short
    - mistos_officer_cowl
    - dyed_mistos_cloak
    - mistos_ceremonial_reed_pipe
    - pheromone_composition_kit
    - mistos_quartermaster_journal
  Necromancer:
    - zboźny_pine_staff
    - mistos_overseer_leathers
    - dyed_mistos_cloak
    - spellbook_tismenni_iii
    - mistos_sighting_lens
    - mistos_inkhorn
    - strata_map_tismenni
  Elementalist:
    - zboźny_pine_staff
    - mistos_overseer_leathers
    - dyed_mistos_cloak
    - spellbook_tismenni_iii
    - mistos_sighting_lens
    - strata_map_mistos_prospector
  Pact-born:
    - mistos_short_sword
    - mistos_overseer_leathers
    - dyed_mistos_cloak
    - spellbook_tismenni_iii
    - blackfire_powder_paper
  Super-scientist:
    - mistos_travel_sword_short
    - mistos_light_harness
    - dyed_mistos_cloak
    - sapper_picks
    - sapper_fuse_cord
    - mistos_sighting_lens
    - strata_map_mistos_prospector

starting_gold:
  Warrior: 45
  Expert: 40
  Mentalist: 35
  Necromancer: 60
  Elementalist: 50
  Pact-born: 45
  Super-scientist: 40

# ──────────────────────────────────────────────────────────────────
# Retcon note
# ──────────────────────────────────────────────────────────────────
# A party-level known_fact previously read:
#   "We fenced the silver in the slave-port of Pę — quietly, through a
#    Jambiendo captain who asked no questions — and outfitted ourselves
#    as adventurers."
#
# The kit above supersedes "outfitted ourselves as adventurers." The
# rewritten fact reads:
#   "We fenced the silver in the slave-port of Pę — quietly, through a
#    Jambiendo captain who asked no questions — and bought coin, cloaks,
#    and boots. The rest of our kit came out of the Third Cut."
