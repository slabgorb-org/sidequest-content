# Evrópí — World-Specific Visual Style
#
# Overrides genre defaults for the Evrópí setting — a continent of late
# baroque decline, three competing authoritarianisms (Mistos red-and-black
# junta silks, Vaermm grey book-checking monasticism, Zkęd secret-police
# austerity), an Egzami forest frontier, and Ingurdios chain-and-rag mining
# shafts cutting down into Tismenni dragonkin strata. Pack-level
# heavy_metal visual_style.yaml carries the medium (Doré / Ian Miller /
# Rembrandt ink-and-wash, iron-red + tarnished-brass + bone + void-black,
# global no-legible-text ban); this file adds the era + biome + lighting
# the medium renders.
#
# Per the dust_and_lead pattern: positive_suffix is era + biome + light
# only. Specific locations (Upre, the Waznoty Road, the Deep Shaft,
# Smrtvámi-na-Ziej) live in per-POI visual_prompt fields, not here.

positive_suffix: >-
  late-baroque Central-European continent in visible decline, Polish-Slavic
  and Hungarian-Romanian architectural inheritance — onion-domed cupolas
  weathered grey, narrow shuttered windows, stuccoed facades cracked at the
  lintels, slate and tile roofs, ornamental ironwork pitted with rust.
  Mixed terrain across the world: dense zami-pine frontier forest in the
  Egzami; cold mountain shafts and Ingurdios pit-yards; stratum ruins
  exposed by recent excavation; tithe-bridges over slow rivers; rutted
  pilgrim-roads between waymarkers. Costume by faction: Mistos red-and-black
  silks with junta cord, Vaermm grey woolen robes with right-thinking
  hush, Zkęd black tabard austerity, Egzami undyed homespun with
  blackthorn cudgels. Light is overcast pearl, low pre-dawn blue, dusk
  amber failing into blue, narrow window-admitted grey, candlelight or
  oil-lamp warmth on cold stone. Noon sun is absent from this continent.

# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All constraints
# live in positive_suffix (and the pack-level global suffix). See
# PROMPTING_Z_IMAGE.md.
negative_prompt: ""

preferred_model: dev
