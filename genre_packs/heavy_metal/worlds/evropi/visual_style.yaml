positive_suffix: >-
  baroque ink and wash illustration in the tradition of Gustave Doré
  and Ian Miller, deep chiaroscuro with visible cross-hatching and
  stippled halftone, restrained palette of iron-red and tarnished brass
  on bone and void-black, candlelight on cold stone, late-baroque
  Central-European register — Polish-Slavic and Hungarian-Romanian
  architecture in visible decline, faction costume by quarter of Mistos
  red-and-black silks, Vaermm grey wool, Zkęd black tabard, and Egzami
  undyed homespun, zami-pine frontier forest receding into mountain
  shaft country, low-key matte surfaces. No text, no caption, no title,
  no writing, no legible script, no inscription, no signature, no
  watermark, no border, no frame.

preferred_model: dev
