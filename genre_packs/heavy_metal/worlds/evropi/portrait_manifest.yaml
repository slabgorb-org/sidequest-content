  # ═══════════════════════════════════════════════════════════════
  # COMPANION CREATURES — animal familiars (the player's pet at the
  # table). type: companion_creature. Reusable across worlds; these
  # five are rendered in evropi's own discipline — the candlelit
  # companions of pact-bound magicians, one raking edge of warm light
  # catching fur and feather against velvety shadow. Render personality
  # through POSE and EXPRESSION only; no impression words; each stays
  # recognizably its own species (the goat is a goat, not a demon).
  # ═══════════════════════════════════════════════════════════════

  - id: companion_cat
    name: Cat
    role: A pact-magician's lap-familiar that considers itself the senior partner
    type: companion_creature
    appearance: >-
      Full figure of a slender shorthaired cat seated bolt upright on cold
      flagstone, forelegs straight and close together, the chin lifted so the
      narrow muzzle tips back and the half-lidded eyes regard the viewer down
      the length of the nose. Ears set straight up, whiskers fanned and
      immaculate. The short coat lies flat and unruffled, modelled in fine
      crosshatched tonal gradation along the flank where one edge of light grazes
      it. The long tail is wrapped once around the forepaws, the very tip curled
      with deliberate precision. The far side of the body falls away into deep
      shadow. A still, composed, seated pose. No human clothing.
    culture_aesthetic: >-
      One raking edge of candlelight catching the groomed flank and lifted chin
      against velvety black, the curled tail-tip the single point of poise.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_owl
    name: Owl
    role: A scholar's owl-familiar that corrects the grimoire over its keeper's shoulder
    type: companion_creature
    appearance: >-
      Full figure of a plump round-bodied owl perched on a worn stone ledge, the
      head lowered and tilted so the large round eyes peer down over the hooked
      beak, the brow-feathers drawn up into two arched tufts. The barred breast
      and tightly folded wings are fastidiously neat, each feather laid in place
      and rendered in fine stippled tonal modelling. One taloned foot is lifted a
      little off the perch, claws half-spread as if paused mid-correction. A
      single raking light catches the brow and the curve of the breast; the
      backward half of the bird sinks into gloom. A stiff, scrutinising,
      head-tilted pose. No human clothing.
    culture_aesthetic: >-
      Candlelight on the barred breast and two raised brow-tufts against cold
      stone and deep shadow, the lifted talon held in arrested mid-point.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_raven
    name: Raven
    role: A blood-priced bargainer's raven that hoards small bright secrets
    type: companion_creature
    appearance: >-
      Full figure of a large glossy raven perched low with the shoulders hunched
      close, the head cocked down to one side, the bright round eye thrown in a
      sidelong glint toward the viewer, the heavy beak slightly parted. A small
      bright bead is gripped in the beak tip, a second tiny shiny object pinned
      beneath one clenched claw. The sleek black plumage is tight and modelled in
      hard crosshatched sheen where one edge of light slides across it, the
      throat hackles ruffled forward. The rest of the bird is near-solid void.
      A low, conspiratorial, hunched perched pose. No human clothing.
    culture_aesthetic: >-
      A single hard glint of light on the sidelong eye and the hoarded bead,
      the glossy black hunched low against deeper black.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_toad
    name: Toad
    role: A cellar-witch's toad-familiar that waits, unbothered, on a fat moth
    type: companion_creature
    appearance: >-
      Full figure of a squat broad-bodied toad sitting low and flat on damp
