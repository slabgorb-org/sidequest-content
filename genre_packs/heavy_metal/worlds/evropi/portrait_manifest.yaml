  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS — 2026-07 modest top-up (+5)
  # Every other heavy_metal world grew this pass; evropi (already the
  # pack's high-water mark at 32 faces) gets a small, purposeful
  # top-up rather than a floor-fill of all 15 cultures. Five cultures
  # go from 2 -> 3 with a genuinely NEW role/demographic each (not a
  # near-duplicate of their existing pair). No new archetypes.
  #
  # Deliberately NOT touched, with reasons: mistos / antman /
  # pakook`rook (their two-different-archetypes-one-sex-each pattern
  # may be intentional narrative design — left for Keith, see
  # task-5-report.md). Also NOT touched: ingurdios / kobold / tismenni
  # — all three are marked `chargen: false` (LORE ONLY) in their own
  # culture.yaml, meaning they must not be offered as playable
  # cultures at all. Their existing player_picker entries already
  # contradict that flag (a pre-existing gap, not introduced here);
  # adding more faces to a lore-only culture would deepen the
  # contradiction.
  #
  # This is NOT an exhaustive list of every culture left alone.
  # gnome, bladtrablo, waterfolk, and zkęd sit at the same
  # 2-face/1M1F/single-archetype shape (zkęd already at 4) as the five
  # topped up below and were simply not selected for this modest
  # ~5-face pass -- no chargen or design flag applies to them, they
  # are equally valid candidates for a future top-up.
  # ═══════════════════════════════════════════════════════════════

