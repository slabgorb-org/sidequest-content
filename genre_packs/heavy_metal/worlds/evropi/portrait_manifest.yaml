# Character portraits for Evrópí (heavy_metal genre)
#
# Style inherited from genre visual_style.yaml: baroque ink-and-wash
# illustration, deep chiaroscuro, iron-red / tarnished-brass / bone /
# void-black palette, engraving-like crosshatching, candlelight on
# cold stone. Do NOT restate the style here — the daemon injects
# positive_suffix at render time.
#
# This party of four (rux, hant, prot_thokk, pumblestone_sweedlewit)
# just escaped the Mistos-run Ingurdios mines of the Zbóźny, fenced
# silver in Pę, outfitted as mid-tier adventurers, and arrived in
# Upre. They should read as a unit: mid-tier gear, no flashy
# enchantment, the worn patina of people who recently came up out
# of a mine. Species variety is extreme; equipment register is
# consistent.

characters:
  - name: Rux
    role: Kobold rogue, recently escaped Ingurdios mine slave
    type: pc
    appearance: >-
      A small wiry kobold in his prime, emphatically reptilian — a
      scaled lizard person, rust-brown pebbled hide across snout,
      limbs, and tail, slit yellow eyes, a narrow toothy snout of
      small sharp teeth, short horns, tattered ear-frills, clawed
      three-fingered hands. Clearly not a mammal, clearly not
      furred. The joke: surface-folk with no reference for kobolds
      keep filing him as a very ugly dog because dog is the nearest
      category they have, and he wears the misclassification with a
      knowing smirk at one corner of his mouth. On his head, worn
      with quiet pride, a scarlet silk Mistos officer's cap in the
      junta's red-and-black military cut — clearly looted, clearly
      out of place on a small lizard person. Cut-down leather
      jerkin sized for a child and fitted to his frame, a dark
      hood (thrown back behind the hat), a belt of small tools and
      lockpicks, a single short blade at the hip. Mine-pale under
      the scales at the joints. Hands clever and ink-stained — a
      kobold who reads. Expression: he knows more than he is
      telling.
    culture_aesthetic: >-
      Adventurer-kit bought in Pę with fenced Ingurdios silver —
      serviceable, unbranded, mid-tier leather and iron. Nothing
      flashy. The gear of somebody who does not want to be looked at
      twice.

  - name: Hant
    role: Antman bard of the pheromone-courts of the Deep Hollows
    type: pc
    appearance: >-
      An upright antman — thri-kreen body plan — with rust-pink
      chitinous carapace shading to deeper crimson at the joints.
      Four lower limbs braced in a composed tripod stance, two
      upper arms held in front of the thorax. A segmented abdomen
      behind. Narrow chitin-plated head with long sweeping
      antennae, compound eyes, delicate mandibles folded closed in
      a contemplative set. Artist not warrior: no spear, no
      fighting stance. Cradles a small lidded ritual vessel — a
      pheromone-composer's censer — in the upper hands, the lower
      arms at rest. A single sash of dark woven fibre across the
      thorax, bone-and-brass fittings. The poise of a composer
      mid-phrase.
    culture_aesthetic: >-
      Deep-Hollow court formal restraint — almost no ornament, one
      sash, one censer. The chitin itself is the finery. Mid-tier
      adventurer additions (a travel-cloak folded at the side,
      practical pouches) sit awkwardly but functionally against the
      ceremonial register.

  - name: Prot Thokk
    role: Half-orc half-elf fighter, the party's tank
    type: pc
    appearance: >-
      A bruiser of rare mixed blood — half-orc and half-elf both.
      Green-grey skin, lower tusks jutting from a strong jaw, but
      the bone structure is finer than a full half-orc: high sharp
      cheekbones, a narrow nose, distinctly pointed ears. Hair
      cropped short and standing in sharp dark spikes, gelled
      upright, punk-spiked — not wild, not braided, not long. No
      full beard; a clean-shaven jaw or at most short stubble.
      Broad-shouldered and thick-armed, but wearing only a plain
      rough-hide leather jerkin, laced up the front, over a coarse
      undyed linen shirt; leather wristwraps; a simple wide belt
      with improvised fittings; rough trousers and worn boots. No
      metal armor, no plate, no chainmail, no pauldrons, no
      breastplate, no gorget, no fur mantle, no cape — leather and
      linen only, poor man's kit, what a freed mine-slave can
      afford. A heavy cleaver-bladed axe at his hip, notched from
      use, iron head plain. Scarred forearms from mine-work.
      Stance grounded and watchful. Expression: steady, protective.
    culture_aesthetic: >-
      Pę back-channel freed-man kit — nothing he owns is nice. The
      outfit is plain leather and rough linen, no heraldry, no
      shine, no ornament. Power comes from the body, not the
      equipment. Looks more like a sailor-brawler or dockside
      enforcer than a knight or paladin.

  - name: Pumblestone Sweedlewit
    role: Gnome wizard-sage out of the Free City of Kwikh
    type: pc
    appearance: >-
      A bog-standard gnome sage — waist-high, soft-bellied, a long
      white beard forked and slightly ink-stained, bushy white
      eyebrows, a pointed felt hat pushed back on a bald pate. Wears
      layered scholar's robes of muted madder-brown and ash-grey,
      a leather book-satchel bulging with loose notes, a gnarled
      walking-staff taller than he is, spectacles pushed up on his
      forehead and a second pair forgotten on a cord round his
      neck. Rings on three fingers, none matching. The distracted
      benevolent expression of a man who has just remembered
      something important and is trying to remember what it was.
    culture_aesthetic: >-
      Kwikh refugee-scholar dress — gnome academic tradition
      carried out of the Ingurdios mines a generation ago. Robes
      patched where the dye has gone. The staff is working kit,
      not ornament.

  # ---------------------------------------------------------------------------
  # Named Living-World NPC cast (npcs.yaml). type: npc.
  # ---------------------------------------------------------------------------

  - name: Srárný Fyzioloniązka
    role: Zkęd warlord of the Daggereye contract-killers
    type: npc
    appearance: >-
      A hard, handsome Zkęd woman in middle years, light-skinned,
      dark-eyed, her black hair drawn back in two heavy braids
      threaded with small metal beads that catch the light when she
      turns her head. A lean, weathered face, jaw set, the proud
      tilt of a leader who watches every face in the room for the
      slight she expects. Dressed for the road and the cold: a dark
      fitted leather coat over a black tabard, a fur-lined collar,
      stout boots, fingerless gloves. Across her body the marks of
      command — a wide belt hung with throwing-knives. In one hand,
      held easy and low, the Eye: a long curved dagger with a
      carved jade cross-guard, the one rich thing she owns. Her
      stance is coiled, weight forward, ready to take offense.
    culture_aesthetic: >-
      Zkęd cold-weather kit gone to a killer's purpose — somber
      blacks and dark leather, every piece serviceable, the jade
      dagger-guard the single point of wealth on an otherwise
      battle-worn band-leader.

  - name: Ebbe
    role: Zkęd Gabra (town-ruler) of frontier Upre
    type: npc
    appearance: >-
      A broad-shouldered Zkęd woman past her prime, light-skinned,
      with greying dark hair braided close to the skull and
      threaded with the small metal beads of her people. A square,
      tired, shrewd face, deep lines at the mouth, eyes that have
      been totting up a town's books too long. She wears the heavy
      somber clothing of a frontier official — a long dark wool
      coat with a chain of office at the collar, a fur-edged
      mantle against the mountain cold, a ring of iron keys at her
      belt. One hand rests on a worn ledger; the other is a fist on
      her hip. The posture of a hard-pressed ruler holding a place
      together by main will.
    culture_aesthetic: >-
      Zkęd town-authority dress — somber wool and fur, a plain
      chain of office rather than jewels, the keys and ledger of a
      ruler who governs by accounting, not by show.

  - name: Górzymi
    role: Zkęd Wazdia secret-police handler in Upre
    type: npc
    appearance: >-
      A forgettable Zkęd man of middle years in a tradesman's
      drab — light-skinned, dark-haired, his beard short and
      neatly braided with a single bead, the kind of face a crowd
      slides off. He is dressed deliberately plainly: a brown wool
      coat over a grey tunic, ink-stained cuffs, a leather
      document-satchel under one arm. His hands are soft, a
      clerk's hands; his eyes are not — flat, watchful, taking a
      quiet inventory of everything in front of him. Stands a
      half-step back from notice, weight even, head slightly
      tilted as though listening to a conversation he is not part
      of.
    culture_aesthetic: >-
      Zkęd tradesman's cover over a secret policeman — deliberately
      unremarkable browns and greys, no ornament at all, the
      document-satchel the only tell of a man who runs a town from
      the margins.

  - name: Gan, son of Gan
    role: Zkęd ex-Scout ranger, trapper and guide
    type: npc
    appearance: >-
      A weathered Zkęd man of about fifty, lean and rangy from
      hard outdoor years, light skin gone leathery and deeply
      pitted across cheeks and brow from an old bout of pox. Dark
      hair shot with grey, drawn back; a short grizzled beard
      braided in the Zkęd way with one dull bead. Deep-set
      grieving eyes under a heavy hood. Dressed in a patched
      forest-green and brown trapper's coat of furs and oiled
      hide, hood up, a coil of snare-wire and a brace of pelts at
      his belt, a long hunting knife and a short bow. Stands wary
      and still, half-turned away, the closed posture of a man who
      wants to be left alone.
    culture_aesthetic: >-
      Zkęd frontier-trapper kit — furs, oiled hide, forest browns
      and greens worn for camouflage and warmth, everything mended,
      nothing bought new; a broken Scout's woodcraft showing in how
      the gear is rigged.

  - name: Ognei Antslayer
    role: Zkęd village odd-job lad
    type: npc
    appearance: >-
      A pudgy, round-faced young Zkęd man, light-skinned,
      gap-toothed, with a wispy half-grown dark beard he is too
      young to braid properly and a mop of unkempt black hair. A
      dim, eager, open expression — mouth half-open mid-story, eyes
      bright with the importance of what he is about to tell you.
      Dressed in a townsman's cheap somber homespun, a too-tight
      jerkin, a patched cloak, mud on his boots and forearms from
      hauling. Over one shoulder he hefts a notched wood-axe far
      too plain for a hero, holding it like a trophy. Stands with
      the proud chest-out posture of a boy certain he is, secretly,
      a great slayer.
    culture_aesthetic: >-
      Zkęd village commoner dress — the cheapest somber homespun,
      a borrowed-looking jerkin, an ordinary working axe carried
      as though it were a legend's weapon.

  - name: Isku the Eighth
    role: Ancient Zkęd king of Zkędzała
    type: npc
    appearance: >-
      An immensely old Zkęd king, gaunt and skeletal but bolt
      upright on a high carved throne, light skin drawn paper-thin
      over sharp bones, sunken dark eyes still glittering with
      malice and wit. A long thin white beard braided into several
      strands, each weighted with a small gold bead. A sharp,
      mocking mouth caught mid-retort. He wears the full somber
      regalia of the Zkęd crown — a heavy black-and-iron-grey
      robe of state, a fur-collared mantle, a dark thorned circlet
      of old metal, rings loose on wasted fingers gripping the
      arms of the throne. Frail in body, utterly unyielding in
      bearing — a man who has outlived everyone who wished him
      gone.
    culture_aesthetic: >-
      Zkęd royal regalia at its grimmest — heavy black and iron
      robes, fur, an old dark crown of thorned metal, gold beads
      in a king's braids; ancient wealth gone cold and severe
      rather than bright.

  - name: Gribarook
    role: Pakook`rook J`rook knotsong bard
    type: npc
    appearance: >-
      A frog-folk bard — an upright amphibian person with smooth
      mottled green-and-amber skin, wide golden eyes set high on a
      broad head, a wide froggish mouth, long-fingered webbed
      hands. His great throat-sac is inflated taut and round in
      mid-song, a translucent balloon of skin beneath his jaw
      catching the light. He wears a broad collar of overlapping
      lily-pads and a vest woven from beaten rushes, mournful and
      worn. Slung across his body, bandolier-fashion, are several
      knotsong sticks — straight reeds hung with rows of tied-off
      knotted reed-cords, his people's whole memory in a
      tactile syllabary. One webbed hand rests on the knots; his
      eyes are half-closed in grief and music.
    culture_aesthetic: >-
      Pakook`rook bardic dress — lily-pad collar, rush-woven
      garments in swamp greens and browns, the knotted-reed
      song-sticks worn like sacred instruments; a people's library
      carried on one frog's back.

  - name: Jireek
    role: Pakook`rook trident-bearing war-mother
    type: npc
    appearance: >-
      A powerful frog-folk war-mother — a broad, heavy-limbed
      amphibian woman with dark olive-and-bronze mottled skin,
      battle-scuffed, wide unblinking golden eyes, a grim set to
      her wide mouth. A hard collar of layered lily-pads and
      rush-armour bound tight across a deep chest, woven reed
      guards on her forearms. She grips a long fighting trident
      upright, its three barbed prongs notched from use, butt
      planted like a standard. Webbed feet set wide, weight low and
      braced, the planted stance of a leader who has held a clan's
      defensive line through too many raids. Fierce, embattled,
      watchful.
    culture_aesthetic: >-
      Pakook`rook war-leader kit — rush-and-lilypad armour bound
      for battle rather than ceremony, a heavy barbed trident, swamp
      colors gone dark and hard-used; nothing ornamental, all of it
      tested.

  - name: Lassy the Frogger
    role: Zkęd tadpole-poacher and slaver
    type: npc
    appearance: >-
      A lean, furtive Zkęd man, light-skinned, sallow, with lank
      greasy dark hair and a thin straggling beard pinched into one
      mean little braid. A narrow, sly, patient face, eyes
      flicking sideways, a greedy half-smile he can't quite
      suppress. Dressed in a poacher's drab somber oilskins
      streaked with pond-mud and slime, hip-waders, a wide belt
      hung with nets and a cluster of small lidded barrels. In one
      hand a long fine-meshed dip-net dripping water; over his
      shoulder a coil of cord. Crouched low and quiet, the hunched
      posture of a man used to working where he should not be
      seen.
    culture_aesthetic: >-
      Zkęd poacher's drab — mud-streaked oilskins and waders in
      somber swamp browns, netting and barrels for stolen
      tadpole-cargo; the cheap furtive kit of a man who profits off
      the slave road.

  - name: Glang u Mäinkin empi Gaml
    role: Aldkin Mannar steppe barbarian
    type: npc
    appearance: >-
      A short, wiry Aldkin steppe-nomad — light-skinned, dark-eyed,
      with ruddy-dark hair hacked by his own blade into a rough
      uneven mullet. A blunt, wild, weatherbeaten face, dust of the
      grasslands on his skin. He wears no armor at all by tribal
      custom — only black-dyed animal-skin leathers, a sleeveless
      hide jerkin baring corded arms, fur-trimmed boots, a wide
      studded belt. A massive two-handed zweihander is strapped
      diagonally across his back, hilt rising above one shoulder,
      the blade nearly as tall as he is. Beside him stands a proud
      glossy black steppe horse with a stiff cropped ruff-mane; one
      of his hands rests on the horse's neck and his head is half
      turned toward it, as though listening to its counsel.
    culture_aesthetic: >-
      Aldkin Mannar dress — armourless black-dyed steppe leathers
      and furs worn by custom and pride, the oversized zweihander
      the only metal he carries, the black Anta horse as much
      companion as mount.

  - name: Kvi u Törkin empa Kvi
    role: Aldkin Guardian of the Green
    type: npc
    appearance: >-
      A short, lean Aldkin steppe-woman gone half-wild, light skin
      darkened and wind-worn, dark eyes serene and fey. Her black
      hair is grown into long ropey dreadlocks braided through with
      living brambles, nettles, and seed-heads in repeating
      patterns, twigs and small leaves caught in it. She wears worn
      animal-skin leathers in faded grass-greens and earth-browns,
      no armor, draped with woven plant-fibre cords and bound green
      shoots. She is mounted bareback on a proud black steppe mare,
      sitting it as though horse and rider were one creature. Calm,
      untamed, weighing the viewer the way the wilderness itself
      might. A staff of unworked living wood across her lap.
    culture_aesthetic: >-
      Aldkin Green-Guardian dress — armourless faded steppe
      leathers overgrown with living brambles, nettles, and woven
      plant cord, the wild itself worn as ornament; bareback on a
      black Anta mare.

  - name: Ndiziały Zblášzed
    role: Zkęd prince, secret head of the Wazdia
    type: npc
    appearance: >-
      A poised, handsome Zkęd man in early middle age, light-skinned,
      dark-haired, his black hair and short beard immaculately
      braided with fine silver beads. A composed, intelligent,
      faintly amused face, level dark eyes that give nothing away;
      the controlled stillness of a man who is always the most
      dangerous person in a room and never the loudest. He wears
      rich but restrained somber finery befitting a king's third
      son — a long dark high-collared coat of fine black wool with
      muted iron-red embroidery, a single heavy signet ring, a
      narrow chain of dark metal. Hands folded, unhurried. Behind
      the urbane courtesy, a watchful, patient ruthlessness.
    culture_aesthetic: >-
      Zkęd high-noble dress in its most controlled register — fine
      black wool, muted iron-red thread, silver beads in the
      braids, one signet ring; wealth deployed as discretion by a
      prince who rules from behind the curtain.

  - name: Almen Pestrosolo Vrabolli
    role: Mistos spy in disguise as Trabulo merchant "Roba Juanto"
    type: npc
    appearance: >-
      A tall, slender man carrying himself as a florid Trabulo
      merchant-captain — though the fine bones, the too-pale fine
      hair, and the pointed ear-tips beneath show the elf he truly
      is. His skin is artificially darkened to a warm zille-berry
      brown to hide it. A broad confident smile, charming and
      false; a single old duelling scar runs clean from his left
      eye down across the cheek to his upper lip, which he wears as
      though proud of it. He is dressed in extravagant
      merchant-captain garb: a black brocade vest over a white
      shirt with full poet sleeves, billowing white pantaloons, a
      wide scarlet sash, a broad plumed hat, rings on his fingers.
      One hand spread in mid-flourish of some elaborate tale.
      Theatrical, smiling, and utterly untrustworthy.
    culture_aesthetic: >-
      A Trabulo merchant-captain costume worn as deep-cover
      disguise — flamboyant white pantaloons, scarlet sash, black
      vest, plumed hat, all of it loud and showy; the Mistos
      red-and-black silk register peeks through only in the scarlet
      and black he can't quite help choosing.
