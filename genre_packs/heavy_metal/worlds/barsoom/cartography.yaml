world_name: Barsoom
starting_region: helium
navigation_mode: region

map_style: >-
  Hand-painted antique planetary chart on aged ochre parchment — a
  dry dead world of cracked sea-bottoms in pale yellow-green moss,
  scarlet city-glyphs ringed by canal lines ruled dead straight
  across the desert, the great drained ocean basins shaded in faded
  umber, a compass rose with two small moons in the corner, sword-and
  -airship marginalia. Sun-baked palette, no green seas. Style
  reference: heroic sword-and-planet endpaper maps.
map_resolution: [1280, 1024]

regions:
  helium:
    name: Helium
    summary: "The twin scarlet tower-cities of the red empire — honor, fliers, and the long-sword"
    description: >-
      Greater and Lesser Helium, two cities of soaring scarlet and
      crimson towers a few miles apart on the high desert, joined by
      a ruled canal and by the navy of fliers that is the empire's
      pride. This is the most civilized power of the red world —
      jealous of its honor, generous to a guest who keeps the code,
      lethal to one who breaks it. Its workshops cut radium and its
      academies still read the old science, but a Heliumetic settles
      a quarrel with a blade. Beyond the cultivated canal-belt the
      ochre desert begins at once.
    terrain: red_city
    adjacent: [korad_dead_sea_bottom, zodanga]
    tags: [civilized, red_martian, honor-bound]

  korad_dead_sea_bottom:
    name: The Dead Sea Bottom of Korad
    summary: "Cracked ochre sea-floor and a marble dead city — green hordes, raiders, ruins"
    description: >-
      A vast plain of dried sea-floor, cracked ochre clay furred with
      pale yellow moss, running to low red hills under a thin clear
      sky. At its heart stand the toppled marble colonnades and broken
      dome of Korad, one of the thousands of dead cities the vanished
      ocean left behind. The green hordes camp in the ruins between
      their wars, riding their eight-legged war-mounts across the
      bottom; a lone traveller out here is prey, salvage, or sport.
      The air is thin and the light is hard.
    terrain: dead_sea_bottom
    adjacent: [helium, zodanga]
    tags: [frontier, green_martian, ruins, dangerous]

  zodanga:
    name: Zodanga
    summary: "The walled City of Assassins — Helium's great rival, brilliant, martial, and treacherous"
    description: >-
      The greatest of the rival red cities, ringed by a vast encircling
      wall against the green hordes that besiege it. Where Helium prizes
      honor, Zodanga keeps a guild of assassins and buys its victories;
      the two empires have warred and schemed for generations over
      canal-water and the marriages of their royal houses. Its towers are
      darker and harder than Helium's, its court colder, its fliers built
      for war. A brilliant, dangerous power that respects only strength.
    terrain: red_city
    adjacent: [helium, korad_dead_sea_bottom]
    tags: [civilized, red_martian, martial, treacherous]

  # ---------------------------------------------------------------------------
  # The South (Story 89-2). The death-pilgrimage country at the mouth of the
  # River Iss: the Therns' Valley Dor walled by the Otz Mountains and the
  # Golden Cliffs, the Lost Sea of Korus within it, and beneath everything the
  # buried sea of Omean where the First Born keep their fleets. The South is
  # reached down the River Iss — a one-way pilgrimage from which, by the
  # cult's design, none return. It does NOT border the red/green core by land;
  # the only road in is the river, and the only roads out are secret.
  # ---------------------------------------------------------------------------
  valley_dor:
    name: The Valley Dor
    summary: "The false heaven at the mouth of the River Iss — a beautiful walled valley that is a charnel-trap"
    description: >-
      Where the River Iss empties at last, between the Otz Mountains and
      the Golden Cliffs, lies the Valley Dor: a warm, flowering valley of
      crimson sward and golden moss around the still Lost Sea of Korus,
      the loveliest country on a dying world. It is also a slaughter-pen.
      The aged and the despairing of all Barsoom voyage down the Iss
      believing they come to paradise; here the white Therns harvest them,
      and the plant-men and the great white apes of the valley devour
      those the Therns do not take. Nothing about it is what the faith
      promised, and no pilgrim who learns the truth is permitted to carry
      it back up the river.
    terrain: cursed_paradise
    adjacent: [otz_mountains, omean]
    tags: [southern, thern, death-cult, dangerous, hidden]

  otz_mountains:
    name: The Otz Mountains and the Golden Cliffs
    summary: "The ring-wall of the south pole — sheer golden cliffs and honeycombed peaks that hide the Thern temples"
    description: >-
      A great circular range girdling the southern pole and walling in the
      Valley Dor, its outer face the sheer Golden Cliffs — a mile of
      gold-veined stone rising straight from the dead sea-bottom, riddled
      with the cliff-side temples and treasure-vaults of the Holy Therns.
      Within the honeycombed rock the Therns keep their gardens, their
      slaves, and the secret ways down to the buried sea. To scale the
      Golden Cliffs uninvited is death; to be found inside them, worse.
    terrain: golden_cliffs
    adjacent: [valley_dor, omean]
    tags: [southern, thern, mountains, hidden, dangerous]

  omean:
    name: Omean, the Buried Sea
    summary: "A sunless ocean in a vast cavern beneath the south pole — the lair and harbor of the First Born"
    description: >-
      Far below the Valley Dor, in a cavern so vast its rock sky is lost in
      dark, lies Omean: a black, sunless sea lit only by a buried radium
      sun, where the First Born keep the fleets of their black corsairs. A
      single concealed shaft rises from its waters to the surface, and
      through it the black pirates climb in their fliers to raid the Therns
      and the world above by night. Here too, on the Isle of the temple,
      sits the goddess Issus, served and fed by the men who think
      themselves gods. There is no way down to Omean a stranger is meant to
      find, and no way up Issus means to allow.
    terrain: buried_sea
    adjacent: [valley_dor, otz_mountains]
    tags: [southern, first_born, cavern, dangerous, hidden]
