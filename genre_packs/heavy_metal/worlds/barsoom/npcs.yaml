version: "0.1.0"
world: barsoom

# ---------------------------------------------------------------------------
# Named Living-World cast for Barsoom (Edgar Rice Burroughs' Mars, public
# domain). RUNTIME-WIRED: the loader reads this file into AuthoredNpc instances
# and `preload_authored_npcs` seats them in game state from session start, so a
# narrator citing "Salensus Oll" reconciles to the canon figure instead of
# minting a phantom.
#
# SCHEMA: AuthoredNpc (sidequest-server/sidequest/genre/models/authored_npc.py,
# extra="forbid"). Keys: id, name, pronouns, role, ocean, appearance, age,
# distinguishing_features, history_seeds, initial_disposition, location_tags.
# There is NO culture/location/disposition/goals/timeline field — each NPC's
# Martian race is carried in the role prose (red / green / thern / first-born /
# yellow / lotharian); placement is `location_tags`; the standing Living-World
# drives and the figure's clock live in `history_seeds`, which the narrator
# extracts. `initial_disposition` is the ADR-020 integer (-100..100). `id`s match
# portrait_manifest.yaml so the rendered portrait binds to npc:<id>.
# ---------------------------------------------------------------------------

npcs:

  - id: helium_jed_host
    name: "Kantos Vah"
    pronouns: "he/him"
    role: "A red-Martian dwar (captain) of Helium who vouches for newcomers at the landing-stage"
    initial_disposition: 25
    location_tags: ["helium"]
    history_seeds:
      - "DRIVE: judge whether the newcomers keep the guest-code."
      - "DRIVE: raise fliers and blades against a coming Zodangan move he can't yet prove."
      - "CLOCK: if the party proves honorable, he offers a commission; if they break the code, he calls a blade-debt."

  - id: zodanga_agent
    name: "Sab Tor"
    pronouns: "he/him"
    role: "A quiet red-Martian Zodangan in Helium who is not what his papers say"
    initial_disposition: -25
    location_tags: ["helium"]
    history_seeds:
      - "DRIVE: learn Helium's flier dispositions."
      - "DRIVE: turn or remove anyone who notices him — by the guild, never by his own hand."
      - "CLOCK: advances whether or not the party engages; the canal tribute talks are his clock."

  - id: thark_chieftain
    name: "Gor Hajus"
    pronouns: "he/him"
    role: "A lesser green-Martian chieftain of the Thark horde camped in Korad's ruins"
    initial_disposition: -20
    location_tags: ["korad_dead_sea_bottom"]
    history_seeds:
      - "DRIVE: take rank by killing the holder above him."
      - "DRIVE: decide whether a captive is sport, salvage, or — rarely — a thing worth keeping alive."
      - "CLOCK: his challenge for rank comes whether or not the party is present; a captive who shows courage can change his calculus."

  # ---------------------------------------------------------------------------
  # The South (Story 89-2) — the Lore Cast of the death-pilgrimage country.
  # ---------------------------------------------------------------------------
  - id: thern_hekkador
    name: "Sator Throg"
    pronouns: "he/him"
    role: "Hekkador, the Father of Therns, who rules the death-cult from the temples of the Golden Cliffs"
    initial_disposition: -45
    location_tags: ["otz_mountains"]
    history_seeds:
      - "DRIVE: keep the ten-thousand-year secret of the Valley Dor from ever climbing back up the River Iss."
      - "DRIVE: harvest the season's pilgrims and feed the share owed up to the First Born without losing more Therns to their raids than the fraud can bear."
      - "CLOCK: runs the harvest on the cult's calendar regardless of the party; any sign the truth of Dor is escaping turns his serenity to a hunt that does not stop at the cliffs."

  - id: first_born_dator
    name: "Xodar"
    pronouns: "he/him"
    role: "A dator (noble captain) of the First Born — the black corsairs of Omean"
    initial_disposition: -25
    location_tags: ["omean"]
    history_seeds:
      - "DRIVE: command his flier and his slaves with the cold artistry expected of a First Born, and take what the surface and the Therns owe Issus."
      - "DRIVE: preserve the certainty that his race has never truly been beaten — a certainty he has begun, privately, to doubt."
      - "CLOCK: raids and harvests on Issus's account whether or not the party is present; a defeat he cannot explain away is the one thing that can crack his contempt into something like an ally."

  - id: issus_goddess
    name: "Issus"
    pronouns: "she/her"
    role: "The goddess of the First Born, enthroned on the island temple of Omean"
    initial_disposition: -60
    location_tags: ["omean"]
    history_seeds:
      - "DRIVE: be served and fed as a god is fed, and let no captive or corsair ever see that she is only a cruel old woman in a goddess's mask."
      - "DRIVE: hold the faith of the First Born and the Therns alike as the load-bearing lie of the whole South."
      - "CLOCK: demands her tribute on the cult's calendar; the moment a mortal looks on her and lives to name what she is, the entire southern fraud begins to come apart."

  # ---------------------------------------------------------------------------
  # The North & Lothar (Story 89-3) — the frozen north and the dreaming western
  # ruin. The Lotharian phantom-bowman / mentalist tradition is PLACE + CULTURE
  # flavor here only; the Mentalist spell wiring is 89-4 scope, not authored here.
  # ---------------------------------------------------------------------------
  - id: okar_jeddak_of_jeddaks
    name: "Salensus Oll"
    pronouns: "he/him"
    role: "Jeddak of jeddaks of Okar, yellow-Martian tyrant of the crystal domes, ruling the north from Kadabra"
    initial_disposition: -50
    location_tags: ["okar"]
    history_seeds:
      - "DRIVE: keep the world below ignorant of Okar and its one ice-gate, and keep his arenas full of the prisoners the Carrion Caves deliver."
      - "DRIVE: make ready, in his own slow time, to carry the warmth and power of the domes down from the pole and conquer the red world he pretends to scorn."
      - "CLOCK: rules and schemes on his own calendar regardless of the party; any prisoner who survives his arena, or any sign Marentina is harbouring his enemies, draws his full and jealous attention."

  - id: marentina_prince
    name: "Talu"
    pronouns: "he/him"
    role: "Prince of Marentina, the free yellow-Martian dome that defies the jeddak of jeddaks"
    initial_disposition: 15
    location_tags: ["marentina"]
    history_seeds:
      - "DRIVE: hold Marentina's independence from Salensus Oll without giving the throne at Kadabra the open pretext it needs to crush the free dome."
      - "DRIVE: shelter those the tyrant would throw to the pits, and quietly weigh whether an outsider who reached the north alive is an ally worth the risk."
      - "CLOCK: walks his careful line whether or not the party is present; a stranger who proves both capable and discreet can become the lever he has lacked against the throne."

  - id: lothar_jeddak
    name: "Tario"
    pronouns: "he/him"
    role: "Jeddak of Lothar, the half-mad Lotharian master of the phantom bowmen"
    initial_disposition: -20
    location_tags: ["lothar"]
    history_seeds:
      - "DRIVE: hold the crumbling walls of Lothar against the besieging green hordes with the conjured armies only his will sustains."
      - "DRIVE: prove, against the rival faction of his own city, that the phantom bowmen are nothing but illusions of his mind — and punish any stranger who suggests otherwise or fails his test of the real."
      - "CLOCK: conjures and rules from his dreaming hall regardless of the party; a guest who cannot tell a willed thing from a true one does not leave Lothar, and one who can may learn what the city is really defending."

  - id: lothar_materialist
    name: "Jav"
    pronouns: "he/him"
    role: "A Lotharian of the rival faction, who holds the phantom bowmen are realer than mere illusion"
    initial_disposition: -20
    location_tags: ["lothar"]
    history_seeds:
      - "DRIVE: uphold the heresy of his faction — that a sufficiently believed-in phantom, like the materialized hero Kar Komak, can be made real enough to outlive the thought that shaped it."
      - "DRIVE: use a useful outsider against Tario's faction without ever quite letting that outsider know which of his courtesies, allies, and armies are flesh and which are will."
      - "CLOCK: feuds with Tario's faction on a centuries-old clock the party only briefly intersects; a stranger he can use becomes a guest he flatters, and a stranger he cannot use becomes a phantom's target."
