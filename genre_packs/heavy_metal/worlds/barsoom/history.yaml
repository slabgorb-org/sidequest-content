world_name: Barsoom

overview: >-
  A world in its long ending. An age ago Barsoom had green seas, a
  blue sky, and a white-skinned seafaring people; the oceans drained,
  the sky thinned, and the survivors changed — into the copper red
  men of the tower-cities, the green giants of the dead bottoms, and
  stranger remnants at the poles and in hidden places. The cities of
  the vanished age stand empty as marble ruins in the moss. The living
  world breathes on one failing Atmosphere Plant and the water of two
  poles carried by ruled canals. Honor, the long-sword, and the flier
  hold what is left.

eras:
  - name: The Green-Sea Age
    period: "ages past"
    summary: >-
      Barsoom bears oceans, a blue sky, and a white seafaring people
      whose cities ring the seas. Their science is high; their art
      survives only as the marble bones of dead cities.

  - name: The Draining
    period: "the long drying"
    summary: >-
      The oceans recede over centuries into the deep basins and then
      to nothing. The seafaring cities are left stranded miles inland
      on drying sea-floor. Civilization all but dies; the survivors
      scatter and begin to change.

  - name: The Age of the Red and the Green
    period: "now"
    summary: >-
      The copper red men raise the scarlet tower-cities along the new
      canal-lines and rebuild a science enough to fly. The green
      hordes take the dead bottoms and the ruins. The Atmosphere Plant
      is built to hold the thinning air — and is never matched again.
      This is the world the players walk: dying, brilliant, and at war.

chapters:
  - id: fresh
    label: "Stranger on the Sea-Bottom"
    session_range: [1, 5]
    location: "The dead sea bottom of Korad and the landing-stages of Greater Helium"
    atmosphere: >-
      Thin hard sunlight on cracked ochre clay, the cold of a planet
      with too little air, the wrong-colored sky, and always the sense
      of enormous distance — dead cities on every horizon, two small
      moons crossing fast at night, a green camp's cookfires in the
      ruins.
    active_stakes: >-
      A newcomer must survive first contact with the green hordes or
      the jealous courts of Helium; the canal-tribute talks with
      Zodanga are going wrong, a flier is overdue, and Helium is
      quietly looking for blades it does not already owe.
    character:
      archetype: "Earthman stranger OR red-Martian of Helium OR green outcast"
      name: ""
      culture: "Red Martian, Green Martian, or Earthman"
    npcs:
      - name: "Kantos Vah"
        slug: helium_jed_host
        role: "Heliumetic dwar at the landing-stage"
        location: "Greater Helium"
        disposition: 5
        description: >-
          A captain of Helium who weighs newcomers by the code and may
          offer a commission — or call a blade-debt.
    points_of_interest:
      - name: The Dead Sea Bottom of Korad
        slug: dead_sea_bottom_of_korad
        region: korad_dead_sea_bottom
        type: ruin
        description: >-
          A vast plain of cracked ochre sea-floor furred with pale moss,
          running to low red hills. At its heart stand the toppled marble
          colonnades and broken dome of Korad, a dead city of the vanished
          age, now a camp-ground of the green hordes between their wars.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Roy Krenkel, lush painterly brushwork. Wide
            low-angle landscape. Foreground: a cracked ochre plain of dried
            sea-floor scattered with pale yellow moss and bone-white
            stones, a lone armored warrior in crimson-and-brass leather
            harness standing with a long-sword. Middle ground: the ruins
            of an ancient marble city — toppled colonnades and a broken
            dome half-drowned in ochre moss. Background: low red hills
            under a vast clear sky shading rose to violet, a wan small sun
            low on the horizon, two faint small moons. Hard raking light,
            long shadows, high contrast, thin dry air. Vast, romantic,
            melancholy. No text, no caption, no labels, no signature, no
            watermark, no frame.
          backdrop: >-
            cracked ochre sea-bottom and toppled marble ruins under a
            rose-violet sky, a wan low sun, long hard shadows.

      - name: The Greater Helium Landing-Stage
        slug: greater_helium_landing_stage
        region: helium
        type: settlement
        description: >-
          The high mooring-stage beneath the great scarlet tower of
          Greater Helium, where the fliers dock and the city's business
          arrives and departs. Ruled canal-water shines below; the twin
          city stands a few miles off across the desert.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Michael Whelan, lush painterly brushwork. Wide
            view. Foreground: a high stone mooring-stage with an ornate
            airship moored at it, carved serpent prow, brass fittings and
            worn leather rigging, a figure in crimson-and-brass leather
            harness on the deck. Middle ground: soaring scarlet and crimson
            towers and jeweled domes of a tower-city, ruled canal-water
            shining below. Background: the ochre desert and a second
            tower-city far off under a rose-violet sky, a wan low sun. Hard
            light, long shadows, thin clear air. No text, no caption, no
            labels, no signature, no watermark, no frame.
          backdrop: >-
            scarlet towers and jeweled domes above a ruled canal, an
            ornate flier moored, ochre desert and rose-violet sky beyond.

      - name: The Thark Camp Among the Ruins
        slug: thark_camp_korad
        region: korad_dead_sea_bottom
        type: settlement
        description: >-
          A horde of the green men camped in the toppled marble streets of
          Korad: olive-green giants fifteen feet tall and four-armed, their
          eight-legged thoats picketed among broken colonnades, a great
          tusked zitidar hauling a war-cart, and the communal incubator
          walled away on the bottom beyond. Cookfires burn in dead palaces;
          a captive red Martian is held for ransom or for sport.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Roy Krenkel, lush painterly brushwork. Wide
            low-angle view. Foreground: a towering fifteen-foot olive-green
            four-armed warrior with ivory tusks and a worn metal-and-leather
            harness, gripping a long radium-rifle and a long-sword, standing
            beside a picketed eight-legged thoat. Middle ground: an
            encampment of green giants among the toppled marble colonnades of
            a dead city, a huge tusked elephantine zitidar hauling a cart,
            spears and banners, drifting cookfire smoke. Background: cracked
            ochre sea-bottom and low red hills under a rose-violet sky, a wan
            low sun, two faint small moons. Hard raking light, long shadows,
            thin dry air. Savage, vast, romantic. No text, no caption, no
            labels, no signature, no watermark, no frame.
          backdrop: >-
            green four-armed giants and eight-legged thoats camped among
            toppled marble ruins on an ochre sea-bottom, rose-violet sky.

      - name: The Court of Greater Helium
        slug: court_of_greater_helium
        region: helium
        type: palace
        description: >-
          The great audience hall beneath the scarlet tower, where the
          jeddak of Helium holds court. Carved crimson stone and beaten gold
          rise into radium-lit shadow; copper-skinned nobles in jeweled
          harness keep the code along the floor; the royal house sits the
          dais. Here commissions are granted, blade-debts called, and the
          shifting politics of the red empires turn.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Michael Whelan, lush painterly brushwork. Grand
            interior. Foreground: copper-red-skinned Martian nobles in ornate
            jeweled leather harness and silk — a regal red-skinned woman in
            gold and a warrior resting a hand on a long-sword. Middle ground:
            a soaring throne-dais of carved crimson stone and beaten gold, a
            seated jeddak in royal regalia, tall fluted columns. Background:
            high arched windows of a scarlet tower-city, radium lamps casting
            a warm glow, hanging banners. Rich regal palette of crimson,
            gold, and bronze, warm dramatic light, deep shadow. No text, no
            caption, no labels, no signature, no watermark, no frame.
          backdrop: >-
            a throne hall of crimson stone and gold, red-skinned nobles in
            jeweled harness, radium light, scarlet-tower windows beyond.

      - name: The Sea-Bottom Under the Hurtling Moons
        slug: dead_sea_bottom_by_moonlight
        region: korad_dead_sea_bottom
        type: landmark
        description: >-
          The open dead sea-bottom at night, when the two moons race the
          sky and lay double shadows across the moss. A lone rider crosses
          the cold ochre plain on a thoat, a dead city low and silver on the
          far horizon; the air is thin and bitter and the silence enormous.
          This is the face of Barsoom between its wars.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Roy Krenkel, lush painterly brushwork. Nocturne,
            wide low-angle landscape. Foreground: a lone armored warrior in
            crimson-and-brass leather harness riding an eight-legged thoat
            across a vast moss-furred ochre sea-bottom, long double shadows
            cast across the cracked clay. Middle ground: the silver
            silhouette of a ruined marble dead city low on the horizon.
            Background: a deep indigo-violet night sky with two small bright
            moons — one large and near, one far — hurtling low; cold luminous
            moonlight. Lonely, vast, romantic, hushed. No text, no caption,
            no labels, no signature, no watermark, no frame.
          backdrop: >-
            a lone rider on an eight-legged thoat crossing a moonlit ochre
            sea-bottom, two hurtling moons in an indigo sky, a silver dead
            city on the horizon.

      - name: The Atmosphere Plant
        slug: atmosphere_plant
        region: korad_dead_sea_bottom
        type: landmark
        description: >-
          A single colossal windowless edifice of ochre masonry standing
          alone on the empty sea-bottom, miles around and the only one of
          its kind on Barsoom. Within, hidden machinery pumps the breathable
          ray that holds the thinning air against the dying of the world.
          Its one great door answers only to a secret mind-spoken lock; let
          the plant fail and all Barsoom suffocates. The most important — and
          most quietly guarded — structure on the planet.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Roy Krenkel, lush painterly brushwork. Wide
            low-angle landscape emphasizing immense scale. Foreground: a tiny
            lone armored figure in crimson-and-brass leather harness standing
            before a single vast sealed door at the base of a colossal
            windowless edifice of ochre and umber masonry, ringed by squat
            vents and slender exhaust-towers. Middle ground: the sheer
            monolithic wall of the structure rising out of an empty cracked
            ochre sea-bottom. Background: flat dead plain to a far horizon
            under a rose-violet sky, a wan low sun, two faint small moons.
            Hard raking light, long shadows, thin dry air. Monumental,
            isolate, awe-struck. No text, no caption, no labels, no
            signature, no watermark, no frame.
          backdrop: >-
            a colossal windowless ochre edifice with vents and towers alone
            on an empty cracked sea-bottom, tiny figure at a vast sealed
            door, rose-violet sky.

      - name: Zodanga, the City of Assassins
        slug: zodanga_city
        region: zodanga
        type: city
        description: >-
          The great walled rival of Helium, ringed by an enormous encircling
          rampart against the green hordes that besiege it. Its towers stand
          darker and harder than Helium's jeweled scarlet, its war-fliers
          patrol above, and its famed guild of assassins does in shadow what
          its armies cannot do in the field. A brilliant, martial, faithless
          power — and the hinge of the canal-tribute quarrel now going wrong.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Michael Whelan, lush painterly brushwork. Wide
            view. Foreground: a high massive rampart wall of dark red stone
            with armored sentries in deep-red harness and a watchfire. Middle
            ground: a vast walled red city of hard angular towers, darker and
            colder than a jeweled capital, sheathed in shadow, war-fliers
            with serpent prows patrolling above. Background: ochre desert
            ringing the wall and a rose-violet sky, a wan low sun, two faint
            small moons. Ominous, martial, grand; a harsh crimson-and-umber
            palette, dramatic low light, deep shadow. No text, no caption, no
            labels, no signature, no watermark, no frame.
          backdrop: >-
            a vast walled city of dark-red angular towers behind an enormous
            rampart, war-fliers above, ochre desert and rose-violet sky.

      - name: The Ruled Canals
        slug: ruled_canals
        region: helium
        type: landmark
        description: >-
          The lifelines of the dying world: dead-straight canals carrying
          meltwater from the two poles across thousands of miles of desert,
          bordered by ruled belts of cultivated crimson sward and ochre
          tilth — the only green left on Barsoom. Pumping-stations mark the
          line at intervals; to cut a canal or seize a station is to choke a
          city, which is why the canal-tribute talks decide more than any
          battle.
        visual_prompt:
          solo: >-
            heroic sword-and-planet oil painting in the tradition of Frank
            Frazetta and Roy Krenkel, lush painterly brushwork. Wide
            high-angle landscape. Foreground: a band of cultivated farmland
            in deep crimson and ochre sward beside a broad canal of still
            shining water, a squat domed pumping-station of pale stone, a
            small figure on the towpath. Middle ground: the canal running
            dead-straight as a ruled line to the far horizon, dividing the
            living belt from the bare ochre desert beyond. Background: distant
            scarlet city-towers small on the skyline under a rose-violet sky,
            a wan low sun, two faint small moons. Hard clear light, long
            shadows, vast geometric calm. No text, no caption, no labels, no
            signature, no watermark, no frame.
          backdrop: >-
            a dead-straight canal of shining water ruled across ochre desert,
            bordered by crimson farmland, a pumping-station, distant scarlet
            towers, rose-violet sky.
    tropes: []
