      wig a fraction too perfect over the face it cannot quite make young.
      Cold pale eyes, a serene merciless mouth, a jeweled cult-circlet at
      the brow. Pale-gold-and-white priestly harness, fully covered. Certain.

  - id: picker_thern_apostate_f01
    name: picker thern apostate f01
    role: Thern Apostate
    type: player_picker
    culture: thern
    archetype: Thern Apostate
    sex: female
    backdrop_poi: river_iss
    appearance: >-
      Thern woman, ageless. White marble-pale skin, hairless beneath a
      flowing golden-blond wig and a thin priest's circlet. Pale grey eyes
      carrying a secret doubt, a controlled mouth held a half-beat too
      carefully, the strain of devotion gone hollow. Pale-gold temple
      harness still worn as a disguise, fully covered. Outwardly serene.

  - id: picker_thern_holy_thern_f01
    name: picker thern holy thern f01
    role: Holy Thern
    type: player_picker
    culture: thern
    archetype: Holy Thern
    sex: female
    backdrop_poi: valley_dor
    appearance: >-
      Thern woman, ageless. White skin pale as bone, hairless beneath a
      perfect flowing golden-blond wig, a jeweled circlet of the priesthood
      at the brow. Pale cold eyes, a condescending serene smile, the calm
      of one trained certain of her own divinity. Rich pale-gold-and-white
      priestly harness, fully covered. Beautiful and pitiless.

  # ── Picker · First Born ────────────────────────────────────────

  - id: picker_first_born_corsair_m01
    name: picker first born corsair m01
    role: First Born Corsair
    type: player_picker
    culture: first_born
    archetype: First Born Corsair
    sex: male
    backdrop_poi: omean
