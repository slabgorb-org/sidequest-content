    appearance: >-
      Lotharian woman, ageless — or perhaps a phantom willed lovely and
      laughing into the evening halls. Ancient white skin, fine pale
      features, long red-auburn hair, uncanny luminous eyes both courteous
      and remote. A wistful half-real smile. Archaic pale leather and
      antique gold finery of a vanished seafaring age, fully covered.

  # ═══════════════════════════════════════════════════════════════
  # COMPANION CREATURES (5)
  # Reusable animal-companion templates — the player's pet at the
  # table (live `toto` companion_creature precedent). Earth species,
  # recognizable as themselves, rendered in barsoom's dying-Mars
  # discipline: lean dust-dry coats, ochre ground, harness leather,
  # hard thin-air light. STYLE LIVES ONLY IN THE SUFFIX — appearance
  # describes the animal's body, pose, and expression only; the
  # personality reads through stance and gaze, never an impression word.
  # ═══════════════════════════════════════════════════════════════

  - id: companion_cat
    name: Cat
    role: A house-cat kept lean on a dying world, sovereign of any dust it sits in
    type: companion_creature
    appearance: >-
      A short-haired cat sitting bolt upright on a sun-warmed bone-white
      stone, forelegs straight and close together, chest squared to the
      viewer. The chin is lifted so the head tilts slightly back, eyes
      narrowed to superior half-moons under smooth brows. The dust-dry coat
      lies immaculate, every hair flat. The long tail is curled around the
      forepaws in one precise loop, the tip set down with deliberate
      exactness. A thin worn leather collar-strap rides the neck. Ears
      upright, whiskers level. The pose of an animal that has decided it is
      being admired.
    culture_aesthetic: >-
      Lean desert house-cat on cracked ochre stone, a single thin
      harness-strap; dust-dry fur in hard low sun.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_owl
    name: Owl
    role: A perched owl that has plainly counted the stars and found your sum wanting
    type: companion_creature
    appearance: >-
      A round-bodied owl gripping a bleached branch, leaning forward and
      peering down its hooked beak at the viewer. The head is cocked to one
      side in close scrutiny, the pale facial disc tilted, the brow-feathers
      drawn up into two raised tufted ridges over wide fixed eyes. One
      feathered talon is lifted clear of the perch, a single claw extended
      as if pausing mid-point to correct an error. The barred dust-toned
      plumage sits neat and orderly, every feather combed flat. A slim
      leather jess loops one leg. Wings folded, body upright.
    culture_aesthetic: >-
      Barred desert owl on a sun-bleached branch, a thin leather leg-jess;
      pale moss-and-ochre ground in thin-air light.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_raven
    name: Raven
    role: A raven that keeps small bright secrets and the only joke at a funeral
    type: companion_creature
    appearance: >-
      A glossy black raven hunched low on a cracked ochre ledge, shoulders
      drawn up in a tight stoop, head cocked far to one side. One eye is
      turned sidelong to the viewer, a hard catchlight in it. In the heavy
      beak is gripped a bead of polished metal. The free claw is curled over
      a second tiny glint pinned beneath it. The
      dust-dulled feathers throw an oily sheen along the back and wing. A
      frayed thread of leather snags one leg. The bird leans inward,
      guarding its hoard.
    culture_aesthetic: >-
      Black raven on a cracked dead-sea-bottom ledge guarding a bright bead;
      oil-sheen feathers under hard ochre light.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_toad
    name: Toad
    role: A toad of vast patience and one ambition, which is the next beetle
    type: companion_creature
    appearance: >-
      A large squat toad settled low and flat on warm cracked ochre ground,
      belly to the stone, four stubby legs folded close so the body is one
      broad heavy mound. The wide mouth is shut in a long level line, the
      eyes half-lidded over their bulge, the gaze fixed. The dust-dry skin
      is coarse and warty, dulled to the colour of the sea-bottom,
      throat-pouch slack. It does not lean or turn, still as a weathered
      rock. A hand-span away crawls a small dark beetle, toward which the
      eyes are angled.
    culture_aesthetic: >-
      Broad desert toad pressed to cracked ochre flat, a single beetle
      nearby; warty dust-toned skin in hard low light.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.

  - id: companion_goat
    name: Goat
    role: A goat that has eaten the map and will not be told where to stand
    type: companion_creature
    appearance: >-
      A lean desert goat braced four-square on cracked ochre ground, head
      lowered and swung forward so the two ridged horns tip toward the
      viewer. The forelegs are planted wide and stiff, the body squared,
      hindquarters down as if rooted against a pull. The jaw works sideways
      in a slow chew, a frayed strap-end caught in the teeth. The dust-dry
      coat is short and rough over a hard frame, a stub of worn leather
      harness at the neck. The flat amber eyes hold slot pupils, fixed ahead
      in a defiant stare.
    culture_aesthetic: >-
      Lean ochre-dust goat braced on cracked sea-bottom stone, a worn
      neck-harness; short rough coat, slot-pupilled glare in hard sun.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame.
