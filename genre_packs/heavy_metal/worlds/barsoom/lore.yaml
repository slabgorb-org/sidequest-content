world_name: Barsoom

geography: >-
  The oceans of Barsoom drained an age ago. What remains is a desert
  of cracked ochre sea-bottoms furred with pale moss, falling away
  into the deep umber basins where the seas once stood, and dotted
  with the thousands of marble dead cities the water left stranded.
  The living red cities cluster along ruled canals that carry water
  from the two polar ice-caps across the dead world; outside the
  narrow cultivated canal-belt the desert begins at once. Two small
  moons cross the sky each night, swift and close. The whole planet
  breathes only because one great Atmosphere Plant still turns, far
  out on the desert — a single windowless pile of metal and masonry
  that no one alive can match or rebuild. It is the overdue ledger
  of the world: when it fails, everything that breathes will stop.

cosmology: >-
  There is little true sorcery on Barsoom; its marvels are old
  science and the trained mind. Every Martian reads the surface
  thought of another unless they have learned to shield, and a
  practised telepath can hide their own surface while reading yours —
  so deceit is a craft and privacy is a discipline. Fliers ride a
  repulsion-ray that buoys them against the thin air; radium pistols
  fire shells that explode in sunlight and lie inert in the dark.
  Older and stranger powers are rumored at the poles and in hidden
  places, but in the red world a quarrel is still settled by the
  long-sword, and honor outranks every machine.

factions:
  - name: Helium
    summary: "The first city of the red world — fliers, honor, and the long-sword."
    description: >-
      The twin scarlet tower-cities of Greater and Lesser Helium, the
      most civilized power of the red world: jealous of its honor,
      generous to a guest who keeps the code, lethal to one who breaks
      it. Helium means to hold its canal-belt, out-fly its rival
      Zodanga, and keep the guest-code inviolate. The PCs' likely home
      or host.
    disposition: honorable-proud
  - name: Zodanga
    summary: "Helium's jealous rival — the city of the unspoken assassins' guild."
    description: >-
      A red tower-city that settles a quarrel with a hired blade in the
      dark and denies, always, that its assassins' guild exists.
      Zodanga works to undercut Helium, expand the canal tribute in its
      own favor, and place its quiet agents where Helium cannot see
      them.
    disposition: smiling-treacherous
  - name: The Green Hordes
    summary: "Thark and Warhoon — four-armed giants of the dead sea bottoms."
    description: >-
      Fifteen-foot, four-armed, tusked nomads who own no cities and
      camp in the marble ruins between their endless wars — Thark
      against Warhoon, green against every red city. Rank is taken by
      killing the holder; they raid the canal-belt and hold the dead
      bottoms by the war-mount and the radium rifle.
    disposition: cruel-martial

rumored:
  - "Pilgrims who grow old voyage down the River Iss to a southern paradise from which none return. (The truth of the Valley Dor is a southern matter.)"
  - "Bearded yellow men are said to live behind the ice at the north pole, in cities under glass. (A northern matter.)"
  - "An ancient white people in a hidden city are said to conjure armies out of nothing but their minds. (Lothar — a matter for those who reach it.)"
