# Barsoom — bestiary-curation SOURCE corpus (recipe Stage 0).
#
# The source is the SETTING ITSELF, not the D&D SRD. These are Edgar Rice
# Burroughs' Barsoomian fauna and fighting-races (John Carter of Mars, public
# domain in the US), authored onto the SRD row shape with a plausible 5e
# `type` (the GATE-1 allow/deny key in world_register.yaml) and a `cr` (the
# WWN stat-ladder key — see the bestiary-curation recipe CR->level table).
#
# Provenance of the CR choices: each row's CR is the band that lands the
# creature on its setting-true WWN level (the deep, deadly green hordes and
# the polar apt sit high; the sea-bottom vermin sit low). The numbers that
# come OUT of the ladder (hp / save / attack_bonus / skill) are derived, never
# hand-balanced (SOUL: "Bind the Ruleset, Don't Balance It"). Prose
# (description / abilities / damage / move / role) is authored in bestiary.yaml.
#
# `source` notes the ERB novel the creature first appears in. Every row is
# drawn from a pre-1930 Barsoom novel and is public domain in the US:
#   A Princess of Mars (1912), The Gods of Mars (1913), The Warlord of Mars
#   (1914), Thuvia, Maid of Mars (1916), The Chessmen of Mars (1922).
# Creatures that debut in still-copyrighted later titles are deliberately
# EXCLUDED — e.g. the hormads of Morbus (Synthetic Men of Mars, 1939) are
# left out despite fitting the heavy_metal decay tone, to keep the whole
# roster rights-free like the rest of the world's content.

