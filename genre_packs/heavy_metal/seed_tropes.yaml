# Seed tropes for heavy_metal — short-arc narrative hooks dealt at session
# start from a per-pack deck (ADR-018, ADR-128). Dealt without replacement;
# each seed expires after its lifespan_turns and lingers as a ghost for later
# callback. Seeds are baited hooks (ADR-014 diamonds-and-coal) — vague on
# purpose; the narrator retroactively threads engaged seeds into whatever
# the campaign demands.
#
# World-agnostic by design (ADR-140): these must land equally in a collapsing
# baroque court, a guild foundry, or a dying red planet's arena cities. Genre
# grammar only — pacts, prices, decay, inherited obligation, and magic that
# is never free. Every empire is ending. Every spell costs.

- id: a_collector_for_someone_elses_pact
  name: A Collector for Someone Else's Pact
  description: >-
    A collector arrives — patient, formal, carrying terms — for a debt
    a player character did not incur. The pact was sworn by kin, by a
    predecessor, by whoever held their title or their name before them.
    The terms are explicit. Inheritance, the collector explains, is
    indivisible: the honors and the debts arrive together.
  flavor_tags: [pact, inheritance, debt, collector]
  lifespan_turns: 8
  delivery_hints:
    - The collector is courteous and in no hurry; the debt has waited decades and can wait weeks
    - Proof of the pact exists and is genuine; the signature is unmistakably familiar
    - There is a provision for transfer of the debt — to anyone willing to accept it knowingly
  narrative_hint: >-
    The debt is a window into what an ancestor bought and why. Let the
    original bargain have been worth it — that's the horror — and let
    the transfer provision tempt the desperate or the loyal.

- id: the_heirloom_is_a_lien
  name: The Heirloom Is Collateral
  description: >-
    Something the party carries or treasures — a blade, a signet, a
    name — turns out to be pledged: collateral against an old working,
    marked in a register that predates living memory. The holder of the
    lien has begun, quietly, to call in their portfolio.
  flavor_tags: [inheritance, collateral, possession, reckoning]
  lifespan_turns: 7
  delivery_hints:
    - The mark of the pledge is visible once someone points it out; it was always there
    - Others holding liened items have already received their summons; their fates vary instructively
    - The lien can be redeemed — the register names the price, and the price has been accruing
  narrative_hint: >-
    The item's history is the hook — every hand it passed through knew,
    or didn't, and the chain of custody is a chain of complicity. Let
    redemption cost something the original pledger never imagined.

- id: a_dying_title_seeks_a_neck
  name: A Dying Title Seeks a Neck to Settle On
  description: >-
    Someone great is dying — a magistrate, a guild prince, a blooded
    matriarch — and their title must pass. The lawful heirs are dead,
    disqualified, or worse. The dying power's gaze has settled on a
    player character: adoption, investiture, elevation. The title is
    real. So is everything stitched to it.
  flavor_tags: [succession, title, temptation, decay]
  lifespan_turns: 8
  delivery_hints:
    - The offer is made before witnesses, making refusal a public act with public consequences
    - Those disqualified from inheriting are still alive, still nearby, and still interested
    - The title's obligations are recited only after the third glass of wine, in declining order of pleasantness
  narrative_hint: >-
    The title is a haunted house with a crown on it. Let acceptance
    reshape how the world treats the character, and let the
    disinherited come courting — some with knives, one with the truth
    about why the line was broken.

- id: the_healing_already_rendered
  name: The Cure Came First; the Price Comes Now
  description: >-
    Someone in the party's circle — perhaps in the party — was healed,
    saved, or restored some time ago, in extremity, when no one asked
    what it cost. The practitioner has returned. The work was excellent.
    The invoice is itemized.
  flavor_tags: [pact, healing, price, flesh]
  lifespan_turns: 6
  delivery_hints:
    - The practitioner does not threaten; they merely present the account and wait
    - The price is paid in kind, not coin — service, years, blood, or something with a name only practitioners use
    - Refusal does not anger them; they note it in the register and the working begins, gently, to reverse
  narrative_hint: >-
    The reversal clock is the pressure — let the saved life start
    coming due in increments. The practitioner is not cruel; they are
    owed, and the genre is on their side. Negotiation is possible.
    Charity is not.

- id: the_guild_mark_in_the_wrong_place
  name: A Guild Mark Where No Guild Reaches
  description: >-
    A craft-mark, scar-sigil, or maker's brand that belongs to a known
    guild appears somewhere it has no right to be — on contraband, on a
    corpse, on the underside of something official. Either the guild's
    writ runs further than anyone admits, or someone is forging marks
    that are answered for in flesh.
  flavor_tags: [guild, forgery, craft, conspiracy]
  lifespan_turns: 7
  delivery_hints:
    - A guild member who sees the mark goes pale and refuses to discuss it indoors
    - The mark is perfect, which is itself information — apprentice work it is not
    - "The guild offers a quiet commission to whoever found it: learn nothing further, and be paid well for it"
  narrative_hint: >-
    The mark is a thread into how craft, power, and body-price
    interlock here. Let the guild's payment-for-ignorance be genuine —
    and let pulling the thread anyway reveal which side of the forgery
    the guild is actually on.

- id: the_working_requires_a_volunteer
  name: The Working Requires a Volunteer
  description: >-
    Something the party needs — a gate opened, a sickness lifted, a
    truth compelled — can be done. The practitioner is willing. The
    materials are at hand. The working requires only what such workings
    always require: a portion, freely given, from someone present.
    Compulsion curdles it. It must be volunteered.
  flavor_tags: [sacrifice, price, magic, consent]
  lifespan_turns: 6
  delivery_hints:
    - The portion is named precisely — years, a memory, a sense, a capacity — and the loss is permanent
    - The practitioner has seen too many volunteers to be moved by heroics; they explain the price twice, flatly
    - An NPC quietly offers to be the one, for reasons that will matter later
  narrative_hint: >-
    The volunteer requirement is the genre's altar — cost scaling with
    drama. Let the party argue about who pays, let the NPC's offer
    carry hidden motive, and make the loss visible in play afterward.
    Nothing buys weight like a price actually paid.

- id: the_usurper_governs_well
  name: The Usurper Is the Better Ruler
  description: >-
    A throne, chair, or charter seat was taken — recently, irregularly,
    perhaps bloodily. The party holds, or encounters, some claim of the
    old line: a token, a witness, an oath. The complication is plain to
    anyone who looks: the usurper governs well, and the rightful heir
    is the reason things rotted in the first place.
  flavor_tags: [succession, legitimacy, decay, dilemma]
  lifespan_turns: 8
  delivery_hints:
    - The roads are safer than they were; people say so carefully, glancing sideways
    - The rightful claimant's partisans are sincere, wronged, and wrong about what restoration would bring
    - The usurper knows about the claim the party holds and sends neither assassins nor bribes — an invitation instead
  narrative_hint: >-
    Legitimacy versus competence is the Bang; there is no clean side.
    Let the usurper's invitation be honest, let the old line's wrong
    be real, and let whatever the party does with their claim decide
    which kind of ending this corner of the empire gets.

- id: the_corpse_still_owes
  name: The Corpse Still Owes
  description: >-
    A dead man's obligations did not die with him. A burial is halted,
    a body held, a grave opened — because the deceased owed something
    that custom, contract, or pact says must be settled before the
    earth will have him. The party knew him, found him, or owes him,
    which by local reckoning makes it their problem.
  flavor_tags: [death, debt, custom, unquiet]
  lifespan_turns: 6
  delivery_hints:
    - The creditor's claim is documented and the officiant refuses to proceed until it's discharged
    - The dead man's effects hint he was assembling the payment when he died — most of it
    - Something about the held body suggests the deceased has opinions about the delay
  narrative_hint: >-
    The unsettled debt is a door into the dead man's last season —
    what he owed, to whom, and what he was willing to do about it. Let
    settling it cost the party something and earn them what he knew.

- id: the_oath_had_witnesses
  name: The Oath Had Witnesses
  description: >-
    Words said in extremity — a promise, a curse, a vow shouted over
    steel — turn out to have been heard. Not just by people: by
    whatever in this world attends to oaths. Something has begun
    arranging circumstances so the words can be kept. It does not
    care that nobody meant them.
  flavor_tags: [oath, consequence, magic, binding]
  lifespan_turns: 8
  delivery_hints:
    - Coincidence begins bending toward the oath's fulfillment — doors open that should be barred
    - A practitioner recognizes the signs and asks, with professional interest, what exactly was said and in whose hearing
    - Release exists; oath-breaking is a known transaction with a known price schedule
  narrative_hint: >-
    The oath is a contract the world is enforcing. Let fulfillment
    approach whether the players steer toward it or away — and let
    the formal release cost more than keeping the promise would have.

- id: the_relic_everyone_pretends_is_still_there
  name: The Relic Everyone Pretends Is Still There
  description: >-
    A holy thing, founding charter, or warded vessel — the object some
    institution's authority rests on — is gone, and the institution
    knows, and the institution is pretending otherwise. The party
    learns the truth in the worst way: by being in a position to
    prove it.
  flavor_tags: [relic, institution, secret, decay]
  lifespan_turns: 7
  delivery_hints:
    - The pretense is elaborate and expensive; significant people are exhausted maintaining it
    - Whoever took the relic has not used it, which frightens the institution more than ransom would
    - The party's silence is bid for within a day of their learning — generously, then desperately
  narrative_hint: >-
    The hollow institution is the empire's decay in miniature. Let the
    party choose between propping up a necessary lie and collapsing it
    — and let the relic's actual location open the next arc.

- id: a_challenge_delivered_by_proxy
  name: The Challenge Arrives by Proxy
  description: >-
    A formal challenge — duel, trial, contest of craft or blood — is
    delivered to a player character by a second. The challenger is
    someone they have never met. The grievance is real, inherited, or
    mistaken, but the form has been satisfied, and in this world the
    form is what matters. Refusal has a price schedule too.
  flavor_tags: [duel, honor, ritual, mistaken]
  lifespan_turns: 6
  delivery_hints:
    - The second explains the terms with the weariness of a professional who has done this many times
    - The grievance, examined, attaches to the character's name, title, or deeds — not necessarily their person
    - Champions are permitted; so is settlement; both are read as confessions of something
  narrative_hint: >-
    The duel is a social machine with the character inside it. Let
    every exit — fight, settle, delegate, flee — write something
    permanent into their reputation, and let the challenger turn out
    to deserve better than the quarrel they inherited.

- id: the_wedding_is_a_treaty
  name: The Wedding Is a Treaty with Witnesses
  description: >-
    A marriage is imminent — between houses, guilds, or powers — and it
    is structurally a peace treaty. The party is inside it: guests,
    guards, kin, or couriers of something the ceremony requires.
    Factions on both sides preferred the war, and a wedding is a
    wonderfully crowded place.
  flavor_tags: [intrigue, ceremony, peace, sabotage]
  lifespan_turns: 7
  delivery_hints:
    - The couple's own feelings are the least consulted element and one of them knows something the treaty-makers don't
    - Small wrongnesses accumulate — a substituted servant, a gift withdrawn, a guest list error nobody admits to
    - Whoever is working against the wedding believes, perhaps correctly, that the peace is a trap
  narrative_hint: >-
    The ceremony is a Bang with a timetable. Let the sabotage have a
    sympathetic author, let the peace have a hidden cost that
    justifies them, and let the party's intervention — either way —
    decide what the next decade of this region looks like.

- id: the_priest_buys_memories
  name: Someone Is Buying Memories
  description: >-
    A practitioner, confessor, or broker is paying — well — for
    memories, taken whole and gone forever from the seller. The
    destitute are selling. The trade is legal, or at least licensed.
    Someone the party knows has sold something they cannot now be
    told they sold.
  flavor_tags: [memory, trade, price, exploitation]
  lifespan_turns: 8
  delivery_hints:
    - The sellers are paid fairly and many insist they got the better end; it is hard to argue with someone missing the counter-argument
    - The buyer is selective — specific memories, specific witnesses, as if assembling something
    - The friend's missing memory has an edge to it; whatever bordered it no longer makes sense to them
  narrative_hint: >-
    The trade is the genre's economy at its purest — power paid in
    person-hood. Let the buyer's purpose be an assembly, not appetite:
    the memories fit together into testimony of something someone
    needs witnessed out of existence.

- id: the_lights_are_going_out_upstream
  name: The Lights Are Going Out Upstream
  description: >-
    Something fundamental is failing, region by region — a river
    thinning, wards lapsing, a forge-flame dimming, lamps that have
    burned for a century going dark in order. The failure is moving in
    a direction. The direction has a source. Authorities insist it is
    a maintenance matter.
  flavor_tags: [decay, omen, infrastructure, ending]
  lifespan_turns: 8
  delivery_hints:
    - Tradespeople noticed before anyone official and their guild has quietly begun relocating
    - The failure's pace is steady enough to chart; someone has, and the chart points somewhere specific
    - What keeps the thing alight was paid for, long ago, on terms that had an expiry nobody recorded
  narrative_hint: >-
    The dimming is the empire's ending made visible and local. Let it
    be the background pressure that other seeds play out against, and
    let its cause be a price that has finished being paid — renewable,
    if someone new is willing to pay it.
