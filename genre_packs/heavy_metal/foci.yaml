# Heavy Metal — WWN Foci, genre tier (SRD §1.5)
#
# Genre-tier foci — used when the world does not supply its own foci.yaml.
# The pack's register is debt, cost, and the body as ledger. These foci
# reflect what the old houses and dying cities make of their people.
# World-tier foci.yaml files (e.g. evropi, long_foundry) replace this set
# for those sessions.
#
# Skill names must be in skills.yaml. Level-0 = trained-at-0; level-1 = level-1.

- id: debt-carrier
  display_name: Debt Carrier
  description: >-
    You were raised on an obligation older than yourself and learned early
    to function with weight on your shoulders. Not the weight of guilt —
    the weight of accounting. You know what you owe, you know the ledger
    will be called, and you have arranged your life around the day it is.
  levels:
    - skills:
        Lead: 1
      abilities:
        - name: Weight of Account
          genre_description: >-
            Those who carry inherited debts learn to carry other things as
            well — responsibility, information, the trust of people who
            need someone who understands obligation. You are that person.
          mechanical_effect: >-
            Once per session, you may invoke your personal debt to compel
            a moment of honesty from someone who shares that kind of
            burden — a fellow inheritor, a pact-holder, anyone whose word
            is their bond by necessity. On a successful Lead check
            (difficulty 10), they answer one direct question truthfully,
            even if it costs them.
          involuntary: false

- id: guild-scar
  display_name: Guild Scar
  description: >-
    The guild marks its members in ways that outlast the membership. You
    learned your craft in a house where the work was the paying and the
    paying was the work, and you carry the knowledge in your hands even
    now that the guild no longer owns them.
  levels:
    - skills:
        Craft: 1
      abilities:
        - name: Working Knowledge
          genre_description: >-
            You can look at a construction — a lock mechanism, a ruined
            gate, an unfamiliar engine of war — and understand it at the
            level of craft. Not magic: mechanics. You know how the thing
            was made and therefore how it can be unmade.
          mechanical_effect: >-
            When examining a crafted object or constructed barrier, you
            may make a Craft check (difficulty 10) to identify its
            structural weakness, bypass method, or original function.
            Success grants a +2 bonus to the next action taken against or
            with that object.
          involuntary: false

- id: pact-senses
  display_name: Pact Senses
  description: >-
    Living beside a covenant — whether signed by you or your bloodline —
    has tuned your perceptions to the presence of the uncanny. You do not
    always understand what you sense, but you have learned to trust it.
  levels:
    - skills:
        Notice: 1
      abilities:
        - name: Thinning
          genre_description: >-
            Where pacts have been struck and covenants maintained, the
            air is different. You can feel it — a kind of pressure behind
            the ears, a change in the quality of the cold. Most people
            can't; you can.
          mechanical_effect: >-
            Once per scene, you may make a Notice check (difficulty 10)
            to sense whether a magical working, active covenant, or
            inhabited pact-entity is present within thirty feet. Success
            gives you its approximate direction and rough intensity —
            not its nature.
          involuntary: false

- id: rite-keeper
  display_name: Rite Keeper
  description: >-
    You were raised in the liturgical precision of a house where every
    act of worship was also an act of payment. You know the rites that
    hold creditors at bay — not perfectly, and not forever, but well
    enough to matter.
  levels:
    - skills:
        Pray: 1
      abilities:
        - name: Propitiatory Form
          genre_description: >-
            You know the forms that acknowledge a debt without surrendering
            to it — the lesser rites that satisfy a creditor's need for
            acknowledgment without paying the full bill. In the short term,
            this is very useful.
          mechanical_effect: >-
            Once per session, you may perform a brief rite (one round) to
            delay the adverse effects of a pact obligation or hostile
            supernatural covenant by one full scene. This does not cancel
            the cost — it moves it.
          involuntary: false

- id: road-weathered
  display_name: Road Weathered
  description: >-
    You have traveled through the old strata of this world — past the ruins
    of predecessors, the collapsed corridors of older covenants, the places
    where the topsoil rings hollow underfoot and the frost comes up in
    a perfect square at dawn, marking a sealed chamber's roof. You stopped
    camping on those squares years ago, and you have learned to read what
    the predecessors left.
  levels:
    - skills:
        Survive: 1
      abilities:
        - name: Ruin Memory
          genre_description: >-
            You've passed enough abandoned structures to know the difference
            between a ruin that fell and one that was sealed. The sealed
            ones are more dangerous and more interesting, and you have
            learned to tell them apart at a glance.
          mechanical_effect: >-
            When entering a ruin, abandoned building, or sealed structure,
            you may make a Survive check (difficulty 10) to determine
            whether it was abandoned voluntarily or sealed against entry,
            and approximately how long ago. On a success, you also learn
            one architectural detail that may be mechanically relevant
            (an exit, a collapse risk, a defensible position).
          involuntary: false
