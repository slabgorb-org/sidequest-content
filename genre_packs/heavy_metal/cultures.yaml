# Heavy Metal — Genre tier (NO NAMED CULTURES)
#
# Per the layered content model (docs/superpowers/specs/2026-04-17-layered-content-model-design.md),
# named cultures belong at the WORLD tier, not here. Genre may only hold
# abstract structures (axes, constraints, patterns), never named instances.
#
# Previous content (Perault, Kragmoor, Orvinnic, Astran, Thessil) was
# Long Foundry-specific and has been relocated to
# worlds/long_foundry/cultures.yaml where it originates. Each world ships
# its own culture roster.
#
# Full Phase 2 migration (cultures-as-directories under
# worlds/<world>/cultures/<culture>/) remains outstanding. This is the
# interim fix that stops Long Foundry cultures from leaking into Evrópí
# and every other heavy_metal world.

