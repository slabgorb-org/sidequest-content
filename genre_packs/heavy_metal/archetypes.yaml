# Heavy Metal — Genre tier (NO NAMED ARCHETYPES)
#
# Per the layered content model (docs/superpowers/specs/2026-04-17-layered-content-model-design.md),
# named archetypes with world-specific flavor (references to named cultures,
# named factions, named POIs) belong at the WORLD tier.
#
# Previous content (Inheritor with an Inconvenient Debt, Grey Thaumaturge,
# The Collector at the Door, Feed-keeper, Flesh-ledger Laborer, Pilgrim
# on the Long Path, Refuser Scholar) all reference Long Foundry's named
# cultures (Perault, Kragmoor, Astran, Orvinnic, Thessil) and have been
# relocated to worlds/long_foundry/archetypes.yaml.
#
# Full Phase 2 migration is outstanding; this is the interim fix that
# stops Long Foundry archetypes from leaking into Evrópí and other
# heavy_metal worlds at chargen time.

