# Heavy Metal — WWN Backgrounds, genre tier (SRD §1.3)
#
# These are the GENRE-TIER backgrounds — used for worlds that do NOT ship
# their own world-tier backgrounds.yaml (currently: barsoom). Worlds with
# hand-authored culture origins (evropi, long_foundry) ship world-tier
# backgrounds.yaml that REPLACE this file entirely for their sessions.
#
# The genre framing is the scribe-and-ledger antechamber: old houses, pacts,
# debts inherited and signed. The five backgrounds here map to the genre
# char_creation.yaml's `origins` scene choices.
#
# All skill names must be in skills.yaml.

- id: Inheritor
  display_name: Inheritor
  description: >-
    Your family signed a feeding covenant generations back — the common
    form, where a house pledges a tithe of years against a debt it could
    not otherwise pay, and the creditor draws those years down the
    bloodline a little at a time. It shows in your people: the eldest
    child of each generation goes grey by thirty and the family keeps a
    private calendar nobody outside the house is shown. You have spent
    your life knowing the calendar exists and being told you are too
    young yet to read it.
  free_skill: Know
  quick_skills:
    - Know
    - Connect

- id: Guildborn
  display_name: Guildborn
  description: >-
    You came from one of the guild cities, raised on a street that smelled of
    hot metal and the residue of workings done in daylight. Magic was a trade,
    not a mystery, and the trade left scars that were meant to be left.
  free_skill: Craft
  quick_skills:
    - Craft
    - Work

- id: Covenant-Kin
  display_name: Covenant-Kin
  description: >-
    Your people carry their pact in the body itself — a physiology that is a
    continuing contract, a bloodline that is a ledger in flesh. You have known
    since childhood that your body is an accounting. Perhaps you have always
    had two names.
  free_skill: Survive
  quick_skills:
    - Survive
    - Notice

- id: Temple-Reared
  display_name: Temple-Reared
  description: >-
    You were raised among clergy in the liturgical cold of a house where every
    hour had its precise observance and the duties owed upward were, in the
    most literal sense, paid. The rites you learned as a child you can still
    perform in the dark.
  free_skill: Pray
  quick_skills:
    - Pray
    - Lead

- id: Stratum-Born
  display_name: Stratum-Born
  description: >-
    Your line descends from the Refusers — the people of the stratum
    beneath the current age, who built the sealed engines and then,
    rather than feed them, walled them shut and walked away. Your elders
    still teach the old grammar of locks: which ward-marks mean "do not
    open," which mean "opened once, never again." They have always
    refused to tell you what the engine under the family's home district
    was for, only that your grandfather re-sealed it the year you were
    born and has not spoken of it since.
  free_skill: Know
  quick_skills:
    - Know
    - Sneak
