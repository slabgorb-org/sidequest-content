- id: a_god_grows_hungry
  name: A God Grows Hungry
  description: >-
    One of the six feeding cults is falling behind on its offerings.
    The god is beginning to take meals without the formal observances.
    Symptoms appear first in the neighborhood of the temple, then in
    widening concentric rings, then in the city at large. Unchecked,
    the starvation becomes civic and then becomes everyone's problem.
  category: revelation
  triggers:
    - visit to a feeding temple
    - report of missing hours, missing names, confessed secrets, or other diet-specific anomalies
    - conversation with a feed-keeper
  narrative_hints:
    - a stranger in the street confesses something privately true, involuntarily
    - a guild member notices they have lost an hour of the morning
    - temple bells rung at wrong intervals for no discernible reason
  tension_level: 0.75
  resolution_hints:
    - deliver the specific offering the god requires to close the immediate deficit
    - negotiate a substitute offering with the feed-keepers
    - expose the administrative failure that led to the deficit and force a correction
  tags: [divine, feeding, escalating]
  escalation:
    - at: 0.2
      event: >-
        The party encounters a feed-keeper outside their temple, visibly
        anxious, consulting their tally-book against the candles. They
        will speak obliquely of the month's offerings not quite meeting
        the projection.
      npcs_involved: [Feed-keeper]
      stakes: The deficit is still quiet. It can be quietly corrected.
    - at: 0.4
      event: >-
        A neighborhood adjacent to the temple suffers the specific
        symptom of this god's hunger — hours going missing, names
        surrendered returning to mouths, secrets falling out of private
        conversation into public air. People are frightened but not yet
        desperate.
      npcs_involved: [Feed-keeper]
      stakes: The symptom has escaped the temple. The correction is harder.
    - at: 0.6
      event: >-
        The feed-keepers post a public plea for additional offerings.
        Pilgrims refuse to pass through the affected quarter. The temple's
        prefect convenes an emergency rite-council.
      npcs_involved: [Feed-keeper]
      stakes: The cult's reputation is now publicly at stake alongside the feeding itself.
    - at: 0.8
      event: >-
        The god begins to take its meals at long range — the symptom
        spreads to neighborhoods that have never made offerings, and to
        people who have never worshipped this deity. Panic is setting in.
      npcs_involved: [Feed-keeper]
      stakes: The cult may be forced to intervene, which will require a public cost.
    - at: 1.0
      event: >-
        The god is fully unfed and acting on its own. The symptom becomes
        civic; the city's routine life is audibly affected. Other cults
        begin to worry openly about overflow. The party is now in a world
        that has visibly changed.
      npcs_involved: [Feed-keeper]
      stakes: The city may never go back to exactly what it was. Something permanent has been lost.
  passive_progression:
    rate_per_turn: 0.008
    rate_per_day: 0.02
    accelerators:
      - hunger
      - offering
      - tithe
      - feeding
      - missing
      - forgotten
    decelerators:
      - offer
      - tithe paid
      - vigil
      - pilgrimage
      - confession
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03

- id: the_collectors_long_walk
  name: The Collector's Long Walk
  description: >-
    A Collector has been dispatched to collect an old debt owed by the
    player, a member of their party, or someone close to one of them.
    The Collector is not hurrying. They are walking. They will arrive.
    Their approach is quiet, formal, and unstoppable; the question is
    only how far the debt has been renegotiated by the time they
    arrive at the door.
  category: conflict
  triggers:
    - mention of an old family debt
    - receipt of a formal summons
    - dream of an unfamiliar face in a formal collar
  narrative_hints:
    - a stranger in correct dress seen on the road behind the party
    - small formal notes left at doorways
    - a scribe in a passing town confirms the entry of a named account
  tension_level: 0.8
  resolution_hints:
    - pay the debt in full in the coin the Collector prefers
    - negotiate a reassignment of the account to a third party
    - petition a higher authority for a formal deferral
    - refuse — but understand the consequence of refusal
  tags: [personal, debt, inevitable]
  escalation:
    - at: 0.2
      event: >-
        A minor scribe in a passing town mentions, entirely by accident,
        that an account matching the party's has recently been cross-
        referenced in the books. They do not know by whom.
      npcs_involved: []
      stakes: The party now knows something is in motion, but not who or why.
    - at: 0.4
      event: >-
        A first formal note arrives — a small card with a correct
        salutation, left where the party is staying, announcing that a
        specific named account will be visited "in due course" by an
        unnamed specialist.
      npcs_involved: []
      stakes: The arrival is now imminent and polite. Negotiation is still possible.
    - at: 0.6
      event: >-
        A second note arrives, more formal, with a seal the party does
        not recognize but which any scholar would. It names the creditor
        without naming them, and specifies a general window of several
        days.
      npcs_involved: [The Collector at the Door]
      stakes: The approach is named. The Collector is on the road; the window narrows.
    - at: 0.8
      event: >-
        A Collector is seen — briefly, at a distance, in the appropriate
        coat — in a town the party is moving through. They do not
        approach. They are walking at the same pace as they always walk.
      npcs_involved: [The Collector at the Door]
      stakes: Physical proximity. The conversation is coming.
    - at: 1.0
      event: >-
        The Collector arrives at the door of whichever place the party
        has made their current residence. They present their papers. The
        formal opening of a debt-collection confrontation begins.
      npcs_involved: [The Collector at the Door]
      stakes: The account is about to close, and the terms of the closing are about to be negotiated.
  passive_progression:
    rate_per_turn: 0.005
    rate_per_day: 0.03
    accelerators:
      - debt
      - collector
      - ledger
      - summons
      - account
    decelerators:
      - payment
      - negotiate
      - petition
      - reassign
      - defer
    accelerator_bonus: 0.04
    decelerator_penalty: 0.04

- id: the_ruin_begins_to_wake
  name: The Ruin Begins to Wake
  description: >-
    Something in one of the buried strata — a First-Feeder site, an
    Unfed temple, or, most dangerous, a Refuser engine — has been
    disturbed and is beginning to stir. The Thessil notice first; the
    disturbance is audible in the old languages before it is visible
    to anyone else. The waking is not inherently hostile, but the
    strata do not contain anything that is indifferent to the current
    age.
  category: revelation
  triggers:
    - visit to a stratum site
    - discovery of an older artifact
    - conversation with a Thessil elder
  narrative_hints:
    - a Thessil stops mid-conversation to listen to nothing
    - small objects in the area of the ruin begin to behave oddly
    - a Refuser scholar in a nearby town becomes secretive
  tension_level: 0.85
  resolution_hints:
    - re-seal the site using the stratum-appropriate observance
    - complete the interrupted pact the ruin is half-executing
    - deliberately escort the waking thing out of the site, knowing what that costs
  tags: [archaeological, ancient, mystery]
  escalation:
    - at: 0.2
      event: >-
        A Thessil traveler the party meets mentions, without pressing
        the point, that the local ruin has begun to "breathe again" in
        the manner their elders warned them about. They decline to
        elaborate.
      npcs_involved: [Refuser Scholar]
      stakes: The disturbance is still confined to the ruin. Easy to ignore, for the moment.
    - at: 0.5
      event: >-
        The nearest settlement reports a string of small uncanny
        incidents — objects moving between locked rooms, old names
        turning up in recent documents, dreams that feel remembered
        rather than dreamt. The stratum scholar is now actively
        researching.
      npcs_involved: [Refuser Scholar]
      stakes: The disturbance has stopped being contained. Investigation is now necessary.
    - at: 0.75
      event: >-
        The surface of the ruin physically shifts — a slab cracks, a
        stairwell previously hidden is now visible, a door that should
        not have been a door stands slightly ajar. Creatures appropriate
        to the stratum begin to be seen at the edges of the site.
      npcs_involved: [Refuser Scholar]
      stakes: The disturbance is physical. Closing it now will require actual labor.
    - at: 1.0
      event: >-
        The ruin is fully awake. What wakes from it is specific to the
        stratum (patient and meticulous for First-Feeder, hungry and
        ragged for Unfed, structurally different and legible in a way
        no one knows how to read for Refuser). The party is now
        running the last session in which the ruin was ever only a ruin.
      npcs_involved: [Refuser Scholar]
      stakes: Whatever wakes is now active in the current age.
  passive_progression:
    rate_per_turn: 0.006
    rate_per_day: 0.025
    accelerators:
      - ruin
      - stratum
      - excavate
      - dig
      - ancient
      - old
    decelerators:
      - seal
      - close
      - rite
      - observance
      - ward
    accelerator_bonus: 0.05
    decelerator_penalty: 0.02

- id: the_house_is_ending
  name: The House Is Ending
  description: >-
    One of the old Perault houses has reached the edge of final
    collapse. The covenants signed by their ancestors are all coming
    due at once — creditors who have waited for generations have
    compared notes and chosen this year. The house cannot pay all of
    them. Some of their heirs will try to save the line. Some will try
    to disappear. Some will try to take as many of the creditors with
    them as they can.
  category: conflict
  triggers:
    - encounter with a Perault inheritor
    - invitation to a formal gathering at a declining house
    - mention of an old family covenant
  narrative_hints:
    - the house's servants are fewer than they were last season
    - the family sigil is still displayed but the lower entries have been retired
    - a Collector has been seen near the house more than once
  tension_level: 0.7
  resolution_hints:
    - help the house reassign enough covenants to survive in diminished form
    - guide one of the heirs to a clean disappearance
    - stand with the family as the final accounts close, and share in the closing
  tags: [noble, debt, tragic]
  escalation:
    - at: 0.25
      event: >-
        An inheritor the party has met asks, quietly, about the
        reputation of specific Collectors. They are not asking
        theoretically.
      npcs_involved: [Inheritor with an Inconvenient Debt]
      stakes: The house knows what is coming. They are trying to plan.
    - at: 0.5
      event: >-
        A minor covenant of the house is called due. The family meets
        it, barely. A servant is dismissed. A silver is sold. The
        diminishment is now publicly visible.
      npcs_involved: [Inheritor with an Inconvenient Debt]
      stakes: The family's resources are visibly shrinking.
    - at: 0.75
      event: >-
        A major covenant is called due that the house cannot meet. A
        formal assembly is convened in the great hall; the creditors
        attend in person; the family speaks in sequence to propose
        terms. The party may be present.
      npcs_involved: [Inheritor with an Inconvenient Debt, The Collector at the Door]
      stakes: The house is formally renegotiating its existence.
    - at: 1.0
      event: >-
        The house's accounts are all called simultaneously. The final
        gathering is less a negotiation than a last dinner. What
        happens in the great hall on the last night is something the
        party will be asked to bear witness to, and will remember.
      npcs_involved: [Inheritor with an Inconvenient Debt, The Collector at the Door]
      stakes: The line ends. Something specific is lost from the current age.
  passive_progression:
    rate_per_turn: 0.005
    rate_per_day: 0.018
    accelerators:
      - house
      - covenant
      - heir
      - ancestry
      - creditor
    decelerators:
      - pay
      - negotiate
      - reassign
      - petition
      - shelter
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03

- id: the_guild_quarter_strikes
  name: The Guild Quarter Strikes
  description: >-
    The Kragmoor thaumaturges in a particular city have declared a
    guild stoppage. The cost of their workings has compounded against
    them — the residues are accumulating, the private ledgers are
    grim, and they refuse to take further work until the rates are
    corrected. Without civic thaumaturgy, the city begins to
    experience the gentle ongoing failure of everything that quietly
    relies on small workings to keep functioning.
  category: conflict
  triggers:
    - visit to a guild quarter
    - conversation with a Grey Thaumaturge
    - notice of a failed civic working
  narrative_hints:
    - the guild hall is closed and guarded, with a formal notice posted
    - small civic lamps go out earlier than they should
    - water from the wrought wells is flat and metal-less
  tension_level: 0.55
  resolution_hints:
    - broker a renegotiation between the guild and the city council
    - quietly fund the specific remedy the guild is demanding
    - encourage the guild to break its own strike and deal with the consequences later
  tags: [guild, labor, civic]
  escalation:
    - at: 0.25
      event: >-
        The guild posts a formal notice. The notice is polite. The
        notice is also immovable.
      npcs_involved: [Grey Thaumaturge]
      stakes: Civic life is about to be affected in small but specific ways.
    - at: 0.5
      event: >-
        Small civic workings begin to fail — heating-stones cool, the
        wrought wells run inconvenient, the street-lamps sputter. The
        city notices. The city council calls an emergency session.
      npcs_involved: [Grey Thaumaturge]
      stakes: The failure is visible. Pressure mounts on both sides.
    - at: 0.75
      event: >-
        A civic authority attempts to compel the guild by other means —
        temple pressure, a call for strike-breakers, a formal threat.
        The guild responds by publishing the private ledgers.
      npcs_involved: [Grey Thaumaturge]
      stakes: The conflict is now fully public and cannot be quietly settled.
    - at: 1.0
      event: >-
        The city is effectively thaumaturgy-less. The consequences are
        both small and grinding — a thousand minor failures of things
        that were never visible while they worked. The party is now in
        a city that has begun to grieve its own conveniences.
      npcs_involved: [Grey Thaumaturge]
      stakes: The city's daily life has changed character. Something must give.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.015
    accelerators:
      - guild
      - rate
      - residue
      - working
      - cost
    decelerators:
      - negotiate
      - pay
      - settle
      - arbitration
    accelerator_bonus: 0.04
    decelerator_penalty: 0.04

- id: the_path_eater_walks_alone
  name: The Path-Eater Walks Alone
  description: >-
    The feeding of the Path-Eater has fallen off — pilgrims are fewer
    this year, the routes are longer than they should be, and the god
    has begun to walk on its own. Footsteps are heard in cities where
    no one is. Roads close without warning. Pilgrims arrive at
    destinations they had not set out for. The starvation is quiet
    and grave and potentially very bad.
  category: revelation
  triggers:
    - travel on a named pilgrim-route
    - encounter with a Pilgrim on the Long Path
    - unexplained footsteps in an empty room
  narrative_hints:
    - a road the party has walked before is suddenly a day longer
    - a pilgrim arrives in a town they had not meant to visit
    - the party hears measured bootfalls in a corridor that is empty
  tension_level: 0.65
  resolution_hints:
    - complete a significant pilgrimage and register it with the cult
    - fund a group of pilgrims to take the most-needed routes
    - intercede with a feed-keeper of a sister cult for emergency substitution
  tags: [divine, pilgrimage, uncanny]
  escalation:
    - at: 0.25
      event: >-
        A Pilgrim on the Long Path the party meets remarks that the
        road has been long this season, in a tone that carries more
        meaning than the sentence itself.
      npcs_involved: [Pilgrim on the Long Path]
      stakes: The starvation is known among the initiated. The party has heard it; now they know, too.
    - at: 0.5
      event: >-
        A road the party has walked before takes noticeably longer
        than it should. The sun sets earlier than seems possible; the
        rest-station appears where they remembered it was, but further
        away.
      npcs_involved: [Pilgrim on the Long Path]
      stakes: The uncanny has entered the party's direct experience.
    - at: 0.75
      event: >-
        In a town where the party is staying, at an hour when the
        corridor of the inn should be empty, they hear measured
        footsteps passing their door. The footsteps do not stop, and
        do not return.
      npcs_involved: []
      stakes: The god is taking its meals by hand. It is close enough to be heard.
    - at: 1.0
      event: >-
        Pilgrims begin arriving in towns that were not on their
        routes. Roads close behind them, visibly, as they pass. The
        Path-Eater cult is now formally requesting emergency
        sacrifice. The god is still walking.
      npcs_involved: [Pilgrim on the Long Path, Feed-keeper]
      stakes: The geography of the current age is quietly re-negotiating itself.
  passive_progression:
    rate_per_turn: 0.007
    rate_per_day: 0.02
    accelerators:
      - road
      - pilgrim
      - walk
      - distance
      - journey
    decelerators:
      - pilgrimage
      - offering
      - rest-station
      - guide
    accelerator_bonus: 0.04
    decelerator_penalty: 0.03
