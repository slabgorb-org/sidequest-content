name: Heavy Metal
version: "0.1.0"
description: >-
  A baroque fantasy where magic is never studied and cast — it is
  bargained for, inherited, or paid for in blood, soul, and flesh.
  Doomed princes plot in collapsing courts, pact-born sorcerers burn
  years for a single working, and guild-laborers carry their craft as
  scars upon the body. Every empire is ending. Every spell costs. A
  genre of baroque, grotesque, and decaying wonder, where the line
  between thaumaturgy and ruin is thin.
min_sidequest_version: "0.1.0"
refine_hooks: false
extensions:
  - beat_vocabulary
  - archetype_constraints
  - openings
  - achievements
