# Heavy Metal — Genre-tier opening hooks
#
# Per the layered content model, only cross-world generic hooks belong
# at the genre tier. Named-culture hooks (Perault, Thessil, Refuser-
# scholar, etc.) have been relocated to worlds/long_foundry/openings.yaml.
# Evrópí-native hooks live at worlds/evropi/openings.yaml.
#
# The genre-tier list is the fallback the loader uses when a world
# ships no openings.yaml of its own.

- id: the_feed_is_short
  archetype: challenge
  situation: >-
    A feed-keeper of one of the six cults has summoned the player
    privately, in an hour when no one should be calling on a
    stranger. The cult's tally is short this month. The keeper is
    not supposed to be asking for help from outside the clergy. They
    are asking anyway. Whatever is being asked, the answer cannot be
    simple refusal — the god will notice either way.
  tone: hushed, desperate
  avoid:
    - formal temple scenes
    - holy quest assignments
    - paladin-style heroism hooks
  first_turn_seed: >-
    A tally-keeper of a cult you are not part of approaches you in
    the street at an hour when the temples are meant to be at vigil.
    They ask you to come inside for a moment. In their private
    chamber they open a ledger you should not be shown. The column
    at the bottom is short by an amount that does not seem large,
    and they look at you as if the shortness were a matter of
    hours, or lives.
