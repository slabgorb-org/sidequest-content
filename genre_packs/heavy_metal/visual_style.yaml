# Visual style configuration for heavy_metal genre pack
#
# Controls how Flux / Z-Image image generation renders scenes for this genre.
# Heavy Metal visual identity: ink and wash illustration with baroque ornate
# detail, deep chiaroscuro shadow, visible cross-hatching in the darker
# values, and a restrained palette of iron-red, tarnished brass, bone, and
# void-black. Candlelight and lamp-flame on cold stone; architectural
# specificity over empty dramatic vista. The mood is baroque engraving
# brought forward into illustration — not modern digital painting.
#
# Style anchors: Gustave Doré (chiaroscuro engraving), Ian Miller (baroque
# grotesque linework), Rembrandt (candlelit interiors). Evrópí-specific:
# Polish/Slavic baroque architecture, Mistos red-and-black junta silks,
# Vaermm book-checking monasticism, Zkęd secret-police austerity.

# ── Core Style ────────────────────────────────────────────────

positive_suffix: >-
  baroque ink and wash illustration in the tradition of Gustave Doré and
  Ian Miller, deep chiaroscuro shadow with visible cross-hatching and
  stippled halftone, restrained palette of iron-red and tarnished brass
  on bone and void-black, candlelight or oil-lamp flame on cold stone,
  architectural ornament with devotional marginalia, textile and metalwork
  rendered with engraving-like specificity, low-key lighting, matte
  surfaces, the specific small residues of a working just concluded,
  period-appropriate baroque wardrobe only. Fake stylized lettering on
  ledger pages, sigil-carvings, and tally-stones is allowed as in-world
  texture. No cartouche, no title plate, no artist signature, no printer's
  mark, no museum label, no border inscription, no watermark, no frame.

# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All constraints
# live in positive_suffix. See PROMPTING_Z_IMAGE.md.
negative_prompt: ""

preferred_model: dev

base_seed: 127

# ── Location Tag Overrides ────────────────────────────────────

visual_tag_overrides:
  antechamber: >-
    a cold narrow antechamber with a single scribe's table, three
    tallow candles guttering in a brass holder, a ledger bound in
    cracked leather lying open, walls lined with older books,
    baroque wood panelling darkened by decades of incense smoke,
    ink and wash with heavy shadow in the corners

  great_hall: >-
    the great hall of a declining house — tall narrow windows
    admitting grey light, long table set for fewer diners than the
    hall was built to hold, tarnished silver, a formal portrait
    high on one wall of an ancestor no one now living remembers,
    ornate plasterwork flaking at the edges

  temple: >-
    the nave of a working feeding-temple — tall dim space with
    oil-lamps chained in pairs, an altar carved with the specific
    sigils of a single cult, votive offerings arranged in geometric
    array, a tally-stone showing the month's observances, incense
    smoke caught in shafts of high window-light

  forge_quarter: >-
    a Kragmoor guild workshop mid-working — heavy worktables,
    reagent jars racked in order, a furnace's red light casting
    long shadows, a guild-mark plaque on the wall, residue-salts
    crusted on stone floor, the specific visual evidence of daily
    thaumaturgic labor

  colonnade: >-
    a long colonnade of a temple precinct at dusk, pillars in a
    receding line, lamps in iron brackets at intervals, rain-wet
    consecrated stone reflecting warm flame, a processional of
    priests in the middle distance, baroque engraving-like
    crosshatching in the shadow

  confessional_alley: >-
    a narrow sacred alley between the doors of a Confessor-shrine,
    impossibly quiet, a single lamp glowing in a wall niche, the
    stone worn smooth by generations, the sense of unspoken
    secrets hanging in the dim air

  ruin: >-
    a buried stratum ruin exposed by recent excavation — older
    stonework beneath modern paving, strange geometric carvings
    that do not match any living language, a single lantern's
    light catching dust in the old air, a sense of enormous
    patience rather than hostility

  stratum_passage: >-
    a deep passage into one of the older strata — hand-cut stone
    of unknown age, inscriptions in a forgotten script, a thin
    film of pale dust on the floor, a single oil lamp's light
    receding into darkness, the ceiling rising higher than it
    has any practical reason to

  ledger_hall: >-
    a formal ledger-hall of a guild or temple — long oak tables
    at which scribes work in silence, racks of bound books
    climbing the walls, a central clerestory admitting pale
    light, the smell (implied visually) of ink and old paper

  tally_yard: >-
    an Astran temple's offering-yard — a paved courtyard with a
    large central tally-stone, pilgrims bringing small offerings
    in measured order, a feed-keeper marking entries in a
    waist-chained book, dawn or dusk light

  pilgrim_road: >-
    a pilgrim-road at morning — a rutted way between stone
    waymarkers, walking figures in pilgrim-coats, a small
    waystation with a lamp, morning mist thinning over the
    ground, the road itself visibly older than anything else in
    the frame

  market: >-
    a guild-quarter market under overcast sky — covered stalls
    with hand-lettered signs, residue-salts and reagent jars
    displayed openly, a thaumaturge's tokens hanging in the
    open air, cobblestones wet with rain, baroque ornament on
    even the temporary booths

  court: >-
    the private audience chamber of an old house — a single
    chair of state raised by three steps, a long row of
    waiting figures in the muted colors of declining houses,
    a small clerk recording everything, lamps in tall iron
    stands casting pooled warm light into deep shadow

  crypt: >-
    the vault of one of the declining houses — stone shelves
    holding family coffers and ancestral documents, the
    smell of dust and old parchment, a single oil-lamp
    trembling in the still air, carved family sigils in the
    arched ceiling

  bridge: >-
    a tithe-bridge across a slow river at dusk — a small
    offering-stone at the centre, a bridge-keeper in liturgical
    dress, pilgrims passing in either direction, the water
    beneath reflecting the last warm light of the day

  road: >-
    an old road between settlements in the elegiac hour — ruts
    worn into the ground by generations, a single waymarker
    carved with sigils, distant smoke from a farmstead, the
    road itself visibly older than the people walking on it

  vigil_chamber: >-
    a sleep-ritual chamber of the Drowse cult — low cots
    arranged in formal rows, braziers burning consecrated
    oils, priests in vigil-dress watching, the specific
    hush of a room in which people are offering their dreams
