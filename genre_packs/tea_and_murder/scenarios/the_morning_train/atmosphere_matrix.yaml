# Atmosphere variants for "The Man Off the Morning Train".
# npc_mood_overrides key on scenario NPC id (see npcs.yaml).

variants:
  - id: long_gold_afternoon
    weather: "The long warm gold of a Highland autumn afternoon — heather and bracken, peat smoke, rain promised by evening"
    setting_status: "village_at_ease"
    mood_baseline: "Cosy warmth with one wrong note sounding faintly beneath it"
    concurrent_event: null
    npc_mood_overrides:
      suspect_donald: "outwardly steady at the still, the hands a shade too busy"
      witness_dr_ross: "quietly immovable — the one person who will not soften the truth"

  - id: rain_by_evening
    weather: "The promised rain arrived — the river dark and quick over the stones, the inn fire going, windows running"
    setting_status: "doors_shut_against_the_wet"
    mood_baseline: "Drawn-in and watchful — the village folded around its fires, talking low"
    concurrent_event: "The county inspector wires that he will come up on the morning train"
    npc_mood_overrides:
      suspect_iain: "courteous and remote, changing the subject with practiced ease"
      suspect_annabel: "perfectly composed, one hand resting on the furniture"
      suspect_hugo: "talking too much and laughing at the wrong moments"

  - id: the_gloaming_fog
    weather: "Dense fog off the river at the gloaming, the bridge a grey suggestion, sound carrying strangely"
    setting_status: "the_glen_gone_quiet"
    mood_baseline: "Hushed and close — the hour the figure was seen on the hill path"
    concurrent_event: "Old Tam comes down from the hill with something he will say only to the constable"
    npc_mood_overrides:
      witness_tam: "taciturn, answering a beat late, measuring the asker"
      suspect_buchan: "sharp behind the counter civility, watching the castle's post"
      witness_macrae: "unhurried, notebook out, asking the same question a third time"
