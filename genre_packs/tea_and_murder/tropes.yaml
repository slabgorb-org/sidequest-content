- id: a_body_is_discovered
  name: A Body Is Discovered
  description: >-
    The mystery's inciting incident. A body — discovered by the gardener,
    found at the writing desk, fallen in the burn beside the bridge,
    slumped over a half-written letter. Never in forensic detail. The
    village's quiet morning becomes Wednesday's news by lunchtime, and
    by Friday someone has been arrested who could not have done it.
  category: mystery
  triggers:
    - a recurring NPC discovers something unusual
    - an outsider has been missing for too long
    - a strange smell or a closed door or an unanswered letter
  narrative_hints:
    - the gardener's hand shaking as he taps on the kitchen door
    - the doctor's bag left on the kitchen table because he has been called somewhere
    - the constable's bicycle propped against the wrong wall
  tension_level: 0.5
  resolution_hints:
    - identify the victim and their last hours
    - establish who was where
    - separate the lies told from habit from the lies told from fear
    - the sleuth solves it before the county CID arrives
  tags: [mystery, inciting, body]
  escalation:
    - at: 0.2
      event: >-
        The body is found. The doctor is summoned. The constable is on
        his bicycle. The village is told in fragments before the morning
        is out.
      npcs_involved: [The Country Doctor, The Constable]
      stakes: A death has occurred. The village must absorb the fact.
    - at: 0.4
      event: >-
        The first round of questions has been asked. Several people have
        already lied — most from habit rather than guilt. The sleuth must
        sort which lies matter.
      npcs_involved: [The Constable, The Postmistress]
      stakes: Information is forming. Most of it is wrong.
    - at: 0.6
      event: >-
        A theory is taking hold in the village that is comfortable but
        incorrect. Someone — an outsider, a tradesman, a passing
        labourer — has been mentally arrested. The sleuth knows it
        isn't him.
      npcs_involved: [The Constable, The Tea-Room Proprietress]
      stakes: An innocent man is the village's preferred culprit. Time is now a factor.
    - at: 0.8
      event: >-
        The county CID has been telephoned and a man is coming up on the
        afternoon train. He will arrest the wrong person quickly and
        efficiently if the sleuth has not solved it first.
      npcs_involved: [The Constable]
      stakes: The window for a quiet, correct solution is closing.
    - at: 1.0
      event: >-
        The pieces click. The sleuth gathers the relevant parties in a
        drawing room or the inn's snug, and the truth comes out — not
        in a shout but in a quiet explanation that has the killer
        nodding before the sentence ends.
      npcs_involved: [The Country Doctor, The Constable, The Village Minister]
      stakes: The mystery resolves. The village absorbs the truth and begins, slowly, to recover.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.04
    accelerators:
      - questioning
      - examining the scene
      - new evidence
      - confession partial
    decelerators:
      - red herring believed
      - the sleuth distracted
      - an alibi accepted too quickly
    accelerator_bonus: 0.05
    decelerator_penalty: 0.03

- id: the_visitor_with_business
  name: The Visitor with Business
  description: >-
    An outsider arrives by the morning train and books the back room
    above the inn. They have business in the village they are willing
    to discuss but never quite specify. Either they have come because
    something is going to happen, or something is going to happen
    because they have come. The classic Christie / Father Brown
    catalyst.
  category: catalyst
  triggers:
    - a stranger arrives at the railway halt
    - a calling card with a London or Edinburgh address
    - luggage tagged for a destination further on
  narrative_hints:
    - the publican observes that the new guest asked about old families
    - the postmistress recognises a name on a forwarded letter
    - the rector notices the visitor in the back pew on a Wednesday
  tension_level: 0.4
  resolution_hints:
    - the visitor's business is benign and they leave on Tuesday
    - the visitor is the catalyst for a long-buried truth surfacing
    - the visitor is a victim by Thursday
    - the visitor is the killer
  tags: [outsider, catalyst, arrival]
  escalation:
    - at: 0.2
      event: >-
        The visitor checks in at the inn. First impressions form —
        polished, evasive, a way of asking questions that doesn't
        sound like asking. The publican notices.
      npcs_involved: [The Publican, The Visiting Stranger]
      stakes: A new variable is in the village.
    - at: 0.4
      event: >-
        The visitor calls on someone — at the Big House, at the
        manse, at the surgery. The household concerned does not
        explain the visit afterwards.
      npcs_involved: [The Visiting Stranger]
      stakes: There is a connection no one wants to discuss.
    - at: 0.6
      event: >-
        The visitor is observed in a place they had no obvious
        reason to be — the kirkyard at dusk, the back of the
        distillery yard, the path above the burn.
      npcs_involved: [The Visiting Stranger, The Gillie]
      stakes: The visitor's business has a shape the village does not yet see.
    - at: 0.8
      event: >-
        Something happens that the visitor's presence has clearly
        catalysed — a quarrel, a withdrawal of money, a sudden
        departure of a different household member, a letter burned.
      npcs_involved: [The Visiting Stranger, The Laird]
      stakes: The visitor has set something in motion.
    - at: 1.0
      event: >-
        The visitor's business is fully revealed — by their
        departure, by their death, or by the truth they came to
        deliver. The village's equilibrium will need a season to
        recover.
      npcs_involved: [The Visiting Stranger, The Village Minister]
      stakes: A buried fact surfaces. Either the village adjusts or someone leaves.
  passive_progression:
    rate_per_turn: 0.005
    rate_per_day: 0.02
    accelerators:
      - the visitor makes a call
      - the visitor is observed
      - a letter arrives for the visitor
      - the visitor asks a specific question
    decelerators:
      - the visitor stays at the inn quietly
      - no one mentions the visitor
    accelerator_bonus: 0.04
    decelerator_penalty: 0.02

- id: the_will_reading
  name: The Will Reading
  description: >-
    A death in a prominent family, a solicitor on the morning train,
    relatives arriving who haven't visited in years. The terms of the
    will surprise everyone except possibly one person. The killing,
    if there is one, traces back to a clause hidden in plain sight.
  category: conflict
  triggers:
    - a death in a landed family
    - a solicitor arriving unannounced
    - a previously unknown beneficiary appearing
  narrative_hints:
    - the family gathering with strained civility
    - the solicitor's bag of papers tied with green tape
    - a clause that contradicts what everyone assumed
  tension_level: 0.5
  resolution_hints:
    - the legitimate beneficiary is proven
    - the hidden clause is the motive
    - a forgery is exposed
    - a settlement is reached over sherry
  tags: [inheritance, family, legal, will]
  escalation:
    - at: 0.2
      event: >-
        The solicitor arrives. Relatives gather. The terms of the
        will are not what anyone expected. Someone has been
        favoured; someone has been cut out.
      npcs_involved: [The Country Solicitor, The Laird's Heir]
      stakes: A fortune is in play. Expectations have been upended.
    - at: 0.4
      event: >-
        A second document surfaces — a codicil, a prior will, a
        letter of intent. Its authenticity is disputed politely
        and viciously.
      npcs_involved: [The Country Solicitor, The Laird's Heir, The Industrialist]
      stakes: The legal claim is contested. Lawyers are retained.
    - at: 0.6
      event: >-
        A claimant appears — a relative, a long-lost cousin, a
        natural child. Their identity changes the legal picture
        entirely. Proving it is everything.
      npcs_involved: [The Country Solicitor, The Visiting Stranger]
      stakes: Identity itself is the question. The inheritance hangs on proof.
    - at: 0.8
      event: >-
        Evidence is stolen, destroyed, or hidden. Someone is
        willing to commit crimes to control the outcome.
      npcs_involved: [The Country Solicitor, The Constable]
      stakes: The dispute has moved beyond the courtroom.
    - at: 1.0
      event: >-
        The truth is laid out — in the drawing room, with the
        solicitor at his bag, the family gathered, the sleuth
        explaining quietly what the will actually says and what
        was done to obscure it.
      npcs_involved: [The Country Solicitor, The Laird's Heir]
      stakes: A fortune and a family's identity are decided.
  passive_progression:
    rate_per_turn: 0.004
    rate_per_day: 0.015
    accelerators:
      - document found
      - relative arriving
      - solicitor consulted
      - family meeting
    decelerators:
      - settlement offered
      - delay
      - distraction
    accelerator_bonus: 0.03
    decelerator_penalty: 0.02

- id: the_letter_from_abroad
  name: The Letter from Abroad
  description: >-
    A letter arrives at the post office bearing a foreign stamp — India,
    the Cape, Canada, Hong Kong — and changes someone's morning. The
    recipient burns it, hides it, or carries it in their coat for a
    week. The contents will surface eventually, either by deduction or
    by the killer's hand.
  category: catalyst
  triggers:
    - the postmistress notes an unusual stamp
    - a household receives correspondence it did not expect
    - a relative known to be abroad is mentioned at tea
  narrative_hints:
    - a letter received and not discussed
    - a sudden withdrawal of funds at the bank
    - a household member booking a journey to the county town
  tension_level: 0.3
  resolution_hints:
    - the letter's contents are deduced from the recipient's actions
    - the writer arrives in person on a later train
    - the letter is found and read
    - the recipient confides
  tags: [letter, foreign, secret, past]
  escalation:
    - at: 0.2
      event: >-
        The postmistress mentions the foreign letter at tea — not
        as gossip, just an observation. Someone present knows
        more than they say.
      npcs_involved: [The Postmistress]
      stakes: A communication has arrived that no one was expecting.
    - at: 0.4
      event: >-
        The recipient's behaviour changes — a missed church,
        a cancelled visit, a journey suddenly necessary. Other
        villagers notice.
      npcs_involved: [The Postmistress, The Village Minister]
      stakes: The letter has done something. The shape of it is not yet visible.
    - at: 0.6
      event: >-
        A second letter arrives, or a telegram. The recipient
        is now visibly under pressure.
      npcs_involved: [The Postmistress]
      stakes: A correspondence is pursuing the recipient. They are running out of time to respond.
    - at: 0.8
      event: >-
        Someone — the writer, an agent, a creditor — arrives in
        person. The conversation between them and the recipient
        happens behind a closed door.
      npcs_involved: [The Visiting Stranger]
      stakes: The matter has come north in person. It cannot be ignored.
    - at: 1.0
      event: >-
        The letter's truth surfaces. Either the recipient confides,
        the letter is found, or the writer's death makes the
        contents the village's business.
      npcs_involved: [The Visiting Stranger, The Country Solicitor]
      stakes: A buried past is now in the open. The village will adjust slowly.
  passive_progression:
    rate_per_turn: 0.003
    rate_per_day: 0.01
    accelerators:
      - further correspondence
      - the recipient observed
      - the writer arrives
      - a financial movement
    decelerators:
      - the recipient stays at home
      - the letter is hidden
    accelerator_bonus: 0.03
    decelerator_penalty: 0.02

- id: the_village_fixture
  name: The Village Fixture
  description: >-
    The cricket match against Cullenmore, the shinty fixture, the
    parish flower show, the harvest fête, the laird's Twelfth shoot,
    the New Year ceilidh. The village's recurring social calendar.
    Half the year revolves around these dates, and any of them can
    become the locus of a mystery — the body found in the marquee,
    the will-reading interrupted by the cricket score.
  category: gathering
  triggers:
    - a fixture date approaching
    - guests arriving for the gathering
    - the village mobilising for hospitality
  narrative_hints:
    - bunting going up in the village hall
    - a marquee being raised on the cricket ground
    - extra trains laid on for the Saturday
  tension_level: 0.3
  resolution_hints:
    - the fixture proceeds, the mystery is solved between innings
    - the fixture is postponed by the death
    - the fixture is the scene where the killer is revealed
    - the fixture is when the missing person is finally found
  tags: [village, social, gathering, fixture]
  escalation:
    - at: 0.2
      event: >-
        The fixture is announced. The village begins preparations.
        Old rivalries surface — the cricket team's selection, the
        flower show's hanging committee, the seating at the
        ceilidh.
      npcs_involved: [The Publican, The Tea-Room Proprietress]
      stakes: The village's social temperature is rising in the cosy way.
    - at: 0.4
      event: >-
        Guests begin to arrive — relatives, the laird's London
        friends, the Cullenmore eleven. The inn is full. The
        manse has someone in the spare room.
      npcs_involved: [The Publican, The Laird]
      stakes: Outsiders are present in unusual numbers.
    - at: 0.6
      event: >-
        Tensions become visible at a public preparation event —
        a tea, a rehearsal, a practice match. Old grudges air
        themselves in a way that is not quite civilised.
      npcs_involved: [The Tea-Room Proprietress, The Gossip]
      stakes: Something is going to happen at the fixture itself.
    - at: 0.8
      event: >-
        The fixture is underway. The crowd is largest of the
        year. The body, the disappearance, or the confrontation
        happens against the backdrop.
      npcs_involved: [The Country Doctor, The Constable]
      stakes: A public mystery in front of the entire village.
    - at: 1.0
      event: >-
        The fixture concludes — the cricket finished, the flower
        prizes given, the dancing wound down. The mystery is
        resolved in the calmer aftermath, often at the inn with
        a sherry and a quiet word.
      npcs_involved: [The Publican, The Village Minister, The Constable]
      stakes: The village absorbs the year's incident.
  passive_progression:
    rate_per_turn: 0.006
    rate_per_day: 0.025
    accelerators:
      - preparation underway
      - guests arriving
      - public tension
      - the fixture itself
    decelerators:
      - the fixture postponed
      - quiet preparation
    accelerator_bonus: 0.04
    decelerator_penalty: 0.02

- id: the_vicars_surprising_past
  name: The Vicar's Surprising Past
  description: >-
    The minister or rector — or the doctor, or the schoolmistress, or
    any apparently settled clerical figure — turns out to have a
    history. Not necessarily a guilty one. A regimental commission,
    a lost engagement, a younger brother who died abroad, a sister
    who married badly. The past arrives in the form of a visitor or a
    letter and reframes everything the village thought it knew.
  category: revelation
  triggers:
    - a visitor recognises the clergyman from another life
    - a letter from an old address
    - an old comrade or relative arrives unannounced
  narrative_hints:
    - the village's most familiar face is suddenly being treated unfamiliarly
    - a name spoken at tea that the clergyman would prefer not heard
    - a photograph mentioned that no one in the village has seen
  tension_level: 0.4
  resolution_hints:
    - the past is reconciled openly, the village adjusts
    - the past contained a debt that must be paid quietly
    - the past was someone else's, taken on out of kindness
    - the past becomes the motive in a separate killing
  tags: [past, identity, clergy, revelation]
  escalation:
    - at: 0.2
      event: >-
        The clergyman is observed reacting to a name, a stamp,
        a stranger. Not visibly — only in the way the
        observant might notice.
      npcs_involved: [The Village Minister, The Rector]
      stakes: A past is being concealed quietly.
    - at: 0.4
      event: >-
        The past begins to surface in fragments — a name
        mentioned, a photograph in a locket, a visitor in the
        back pew.
      npcs_involved: [The Postmistress, The Village Minister]
      stakes: The village starts to wonder.
    - at: 0.6
      event: >-
        Someone connected to the past arrives. The clergyman's
        position in the village becomes briefly unstable.
      npcs_involved: [The Village Minister, The Visiting Stranger]
      stakes: The clergyman's standing is on the line.
    - at: 0.8
      event: >-
        An incident — public or private — forces the past into
        the open. Either the clergyman speaks of it or someone
        else does it for them.
      npcs_involved: [The Village Minister, The Visiting Stranger, The Constable]
      stakes: The truth is becoming the village's business whether the clergyman wills it or not.
    - at: 1.0
      event: >-
        The past is reconciled — usually by the village's
        kindness rather than its judgement. The clergyman is
        restored, or steps quietly back, depending on the
        nature of the past.
      npcs_involved: [The Village Minister, The Publican]
      stakes: A history is acknowledged. The village absorbs and adjusts.
  passive_progression:
    rate_per_turn: 0.003
    rate_per_day: 0.012
    accelerators:
      - the past mentioned
      - a connected visitor
      - a letter from the past
    decelerators:
      - the clergyman acts normally
      - the village's loyalty closes around
    accelerator_bonus: 0.03
    decelerator_penalty: 0.02
