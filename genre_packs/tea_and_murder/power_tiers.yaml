# Power Tiers — tea_and_murder
# Per-class visual descriptions at each level range.
# max_level: 8 (compressed)
# Power here is social standing, reputation, and influence — not combat gear.
#
# Classes from rules.yaml:
#   Governess, Detective, Society, Doctor, Industrialist, Explorer, Clergyman

Governess:
  - level_range: [1, 2]
    label: new arrival
    player: >-
      plain travelling dress in dark grey, a bonnet that has seen better
      seasons, a single trunk of belongings, a letter of recommendation
      clutched with careful dignity, eyes that miss nothing and a
      posture that refuses to apologise for existing
    npc: >-
      a young woman in a worn but respectable dress, standing in the
      entrance hall with quiet composure, dismissed by the family and
      noticed by no one except the children
  - level_range: [3, 4]
    label: established
    player: >-
      a better dress — still modest but well-fitted, clearly chosen with
      care, a book always to hand, the children's trust visible in how
      they seek her out, the master's notice visible in how he avoids
      her eye, a presence that the household has learned to account for
    npc: >-
      a governess whose influence extends beyond the schoolroom, consulted
      on household matters, trusted with family confidence, occupying
      the uncomfortable space between servant and equal
  - level_range: [5, 6]
    label: indispensable
    player: >-
      quiet authority in every movement, a wardrobe that reflects
      growing position — good fabric, modest cut, a cameo brooch that
      was a gift, the household defers to her judgement on matters far
      beyond education, her opinion sought on questions of character
      and propriety
    npc: >-
      a woman whose presence steadies the household, whose departure
      would leave a gap no salary could fill, who knows every secret
      in the house and has earned the right to keep them
  - level_range: [7, 8]
    label: mistress of the house
    player: >-
      transformation complete — silk where there was cotton, authority
      where there was deference, a ring on the hand that once held
      only chalk, the drawing room now hers to command, and the quiet
      knowledge that she earned every inch of the journey from the
      servants' entrance to the front door
    npc: >-
      a former governess who married above her station, or who built
      an independent life of such distinction that station ceased to
      matter, commanding respect through character alone

Detective:
  - level_range: [1, 2]
    label: inquiry agent
    player: >-
      respectable but unremarkable coat and hat, a notebook with more
      questions than answers, a magnifying glass still bright with
      newness, lodgings in an unfashionable street, the habit of
      looking at things a beat too long
    npc: >-
      a constable or aspiring investigator, earnest and methodical,
      learning the city's rhythms, taken seriously by no one yet
  - level_range: [3, 4]
    label: private investigator
    player: >-
      a decent suit of clothes, a magnifying glass worn smooth at the
      grip, a reputation that opens certain doors — not the front
      ones, not yet — contacts in the police, the morgue, and at
      least one pub where criminals drink
    npc: >-
      an investigator with solved cases and a growing name, consulted
      by solicitors and occasionally by Scotland Yard, known in the
      right wrong places
  - level_range: [5, 6]
    label: consulting detective
    player: >-
      good rooms, good clothes, the confidence of someone who has been
      right enough times to trust their own eye, a network of contacts
      from the gutter to the gentlemen's clubs, the police bring cases
      to you now — the difficult ones, the embarrassing ones
    npc: >-
      a detective whose name appears in the better newspapers, invited
      to give evidence at inquests, feared by the guilty and sought by
      the desperate
  - level_range: [7, 8]
    label: legendary
    player: >-
      the finest rooms in London, a name that makes witnesses cooperative
      and criminals nervous, a reputation that precedes you into every
      room, clients from the peerage and the palace, the certain
      knowledge that no secret is safe from you
    npc: >-
      a detective of national reputation whose methods are studied and
      whose cases are published, consulted by governments, feared by
      anyone with something to hide

Society:
  - level_range: [1, 2]
    label: debutante
    player: >-
      a new wardrobe that cost more than it should have, a dance card
      with anxious gaps, a chaperone with opinions, the desperate
      brightness of someone performing confidence, gloves that are
      pulled on and off with nervous energy
    npc: >-
      a young person newly presented, navigating their first season
      with visible effort, watched by their mother and the gossips
  - level_range: [3, 4]
    label: established
    player: >-
      the wardrobe has settled into genuine taste, invitations arrive
      reliably, opinions are sought on matters of fashion and match-
      making, a few genuine friends and a clear sense of who the
      enemies are, the smile has become effortless
    npc: >-
      a member of society with an established position, neither rising
      nor falling, invited because they are expected, their absence
      would be noted but not mourned
  - level_range: [5, 6]
    label: influential
    player: >-
      clothes that set rather than follow fashion, a house that people
      wish to be invited to, influence that extends beyond the drawing
      room into politics and patronage, a word from you can make or
      break a season, the gossip columns watch you
    npc: >-
      a social power whose guest list is a map of influence, whose
      approval is courted and whose displeasure can close doors across
      the county
  - level_range: [7, 8]
    label: queen of society
    player: >-
      the undisputed centre of social gravity, dressed in a way that
      others will imitate next season, a word that can create reputations
      or destroy them, invitations to your events are currency, the
      peerage seeks your counsel and the press seeks your opinion
    npc: >-
      a figure of such social dominance that their displeasure is feared
      more than the law, whose drawing room is the true seat of power
      in the county

Doctor:
  - level_range: [1, 2]
    label: assistant
    player: >-
      a medical bag that still smells new, a coat rubbed thin at the
      elbows from night calls, lodgings above the surgery, the
      earnestness of someone who chose this work for the right reasons
      and is learning what it costs
    npc: >-
      a young physician finding their feet, treating the poor because
      the rich won't trust them yet, learning the parish by its ailments
  - level_range: [3, 4]
    label: general practitioner
    player: >-
      a good medical bag with brass clasps worn smooth, a practice
      that crosses enough social lines to know everything about everyone,
      trusted enough for house calls, a steady hand and a growing
      store of secrets that patients assume are forgotten
    npc: >-
      the parish doctor, known by every family, trusted with bodies
      and inevitably with truths, overworked and underpaid by the poor
  - level_range: [5, 6]
    label: physician
    player: >-
      a Harley Street address or its county equivalent, patients from
      the gentry who pay well and expect discretion, a reputation for
      competence that has become influence, consulted on matters well
      beyond medicine
    npc: >-
      a physician whose opinion carries weight in drawing rooms and
      courtrooms, whose discretion is a bankable asset
  - level_range: [7, 8]
    label: eminent
    player: >-
      published, respected, consulted by the great and feared by the
      guilty, a medical reputation that functions as social armour,
      the power to certify sanity or insanity — which in this era
      is the power to imprison or free
    npc: >-
      a doctor of national standing whose testimony decides legal
      cases and whose word on a person's health is beyond question

Industrialist:
  - level_range: [1, 2]
    label: foreman
    player: >-
      good sturdy clothes that smell of the factory, callused hands
      not yet softened by success, a head full of numbers and a
      determination that the gentry can taste from across the room,
      new money that hasn't learned to be quiet yet
    npc: >-
      a mill overseer or small workshop owner, building from nothing,
      respected by workers, ignored by society
  - level_range: [3, 4]
    label: manufacturer
    player: >-
      better clothes — the fabric is good even if the cut lacks
      breeding, a factory that employs a hundred souls, a house in
      the right part of the wrong town, the beginning of an uneasy
      relationship with county society
    npc: >-
      a mill owner with growing wealth and ambition, donating to the
      right charities, seeking introductions they haven't earned
  - level_range: [5, 6]
    label: captain of industry
    player: >-
      fine clothes, fine house, a fortune that commands respect even
      from those who despise its source, political influence through
      the power of employment, a seat on boards and committees, the
      accent still betrays the origin but the money no longer cares
    npc: >-
      an industrialist whose decisions affect thousands, whose charity
      builds hospitals and whose vote sways elections
  - level_range: [7, 8]
    label: titan
    player: >-
      wealth that rivals the old families, a mansion that dwarfs their
      manors, political power that aristocrats must reckon with, the
      architect of a new England where money trumps breeding — and
      the private knowledge that breeding is the one thing money
      cannot buy
    npc: >-
      a figure of national economic importance, feared by competitors,
      courted by politicians, the embodiment of the age

Explorer:
  - level_range: [1, 2]
    label: traveller
    player: >-
      sun-darkened skin in an English drawing room, a trunk full of
      things that provoke questions, stories that make the vicar
      uncomfortable, an inability to sit still, the slight wildness
      of someone who has been too long away from polite society
    npc: >-
      a returned traveller, restless and out of place, with stories
      nobody quite believes and manners slightly off
  - level_range: [3, 4]
    label: adventurer
    player: >-
      a wardrobe that mixes English respectability with foreign
      practicality, contacts on three continents, a journal full of
      sketches and observations, invited to dinner because they're
      entertaining, never quite trusted because they've seen too much
    npc: >-
      an explorer with published accounts and a reputation for daring,
      sought for geographical societies and dinner parties alike
  - level_range: [5, 6]
    label: renowned explorer
    player: >-
      a name that appears in newspapers and lecture halls, artefacts
      displayed in the British Museum, contacts in embassies and
      trading posts, the authority of someone who has been where others
      only read about, scars that tell better stories than words
    npc: >-
      a famous explorer whose lectures fill halls, whose maps have
      changed knowledge, whose opinion on foreign affairs is sought
      by the government
  - level_range: [7, 8]
    label: legendary
    player: >-
      a figure of national fame, a household name, the embodiment of
      British enterprise and daring, honours and medals and a deep
      private exhaustion, the knowledge that the most dangerous thing
      they ever navigated was not the jungle but the drawing room
    npc: >-
      an explorer of historical stature whose achievements define an
      era, whose legacy is both celebrated and questioned

Clergyman:
  - level_range: [1, 2]
    label: curate
    player: >-
      a black coat wearing thin at the cuffs, a Bible with pressed
      flowers marking the sermons that worked, a cottage that is
      cold in winter, the earnest desire to do good in a parish that
      mostly wants to be left alone
    npc: >-
      a junior clergyman, idealistic and overworked, learning that
      pastoral care is mostly listening to complaints about neighbours
  - level_range: [3, 4]
    label: vicar
    player: >-
      a better living, a warmer vicarage, a congregation that trusts
      you with their secrets, the baptism and burial registers that
      contain every family's truth, a quiet influence that extends
      beyond the parish boundary
    npc: >-
      the parish vicar, known and consulted, present at every birth
      marriage and death, keeper of the community's moral ledger
  - level_range: [5, 6]
    label: rector
    player: >-
      a substantial living, a voice in county affairs, the ear of the
      bishop and the trust of the magistrate, sermons that are quoted
      beyond the parish, the moral authority to challenge even the
      squire when conscience demands it
    npc: >-
      a senior clergyman whose opinion shapes the moral landscape of
      the district, respected across classes, feared by those with
      guilty consciences
  - level_range: [7, 8]
    label: dean
    player: >-
      a cathedral appointment or equivalent eminence, national moral
      authority, published sermons and charitable works of lasting
      consequence, the power to comfort and to condemn, the knowledge
      that every confession you've heard has made the world both
      smaller and sadder
    npc: >-
      a churchman of national standing whose words carry the weight
      of institution and personal integrity combined
