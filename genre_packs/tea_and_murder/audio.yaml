mood_tracks:
  exploration:
    # Chopin Nocturnes — dreamy, atmospheric, the sound of walking through a great house
    - path: audio/classical_pd/Chopin - Nocturne Op.9 No.2 in E-flat major.ogg
      title: "Nocturne Op.9 No.2"
      bpm: 60
    - path: audio/classical_pd/Chopin - Nocturne Op.15 No.1 in F major.ogg
      title: "Nocturne Op.15 No.1"
      bpm: 55
    - path: audio/classical_pd/Chopin - Nocturne Op.27 No.2 in D-flat major.ogg
      title: "Nocturne Op.27 No.2"
      bpm: 55
    - path: audio/classical_pd/Chopin - Nocturne Op.55 No.2 in E-flat major.ogg
      title: "Nocturne Op.55 No.2"
      bpm: 60
    - path: audio/classical_pd/Chopin - Nocturne Op.62 No.2 in E major.ogg
      title: "Nocturne Op.62 No.2"
      bpm: 55
    # Highland-coded ACE-Step additions (Tea & Murder / glenross register)
    # Pre-1926 PD reference: Hamish MacCunn — Land of the Mountain and the Flood (1887)
    - path: audio/music/highland_overture.ogg
      title: "Highland Overture"
      bpm: 90
    # Pastoral walking music — MacCunn pastoral idiom
    - path: audio/music/glen_walk.ogg
      title: "Glen Walk"
      bpm: 75

  tension:
    # Dark Chopin Preludes — minor key, ominous, the locked door at the end of the corridor
    - path: audio/classical_pd/Chopin - Prelude Op.28 No.6 in B minor.ogg
      title: "Prelude No.6 in B minor"
      bpm: 50
    - path: audio/classical_pd/Chopin - Prelude Op.28 No.14 in E-flat minor.ogg
      title: "Prelude No.14 in E-flat minor"
      bpm: 90
    - path: audio/classical_pd/Chopin - Prelude Op.28 No.15 Raindrop.ogg
      title: "Raindrop Prelude"
      bpm: 60
    # Pre-1926 PD reference: Mendelssohn — Hebrides Overture (Fingal's Cave, 1830)
    - path: audio/music/sea_cliffs.ogg
      title: "Sea Cliffs"
      bpm: 70

  combat:
    # Dramatic Chopin — when the confrontation turns physical
    - path: audio/classical_pd/Chopin - Polonaise Op.53 Heroic.ogg
      title: "Heroic Polonaise"
      bpm: 110
    - path: audio/classical_pd/Chopin - Ballade No.1 Op.23.ogg
      title: "Ballade No.1"
      bpm: 100
    - path: audio/classical_pd/Chopin - Fantasie Impromptu Op.66.ogg
      title: "Fantasie Impromptu"
      bpm: 140

  rest:
    # Gentle, settling — the fire burns low, the house is quiet
    - path: audio/classical_pd/Chopin - Nocturne Op.9 No.1 in B-flat minor.ogg
      title: "Nocturne Op.9 No.1"
      bpm: 55
    - path: audio/classical_pd/Chopin - Waltz Op.69 No.1 in A-flat major.ogg
      title: "Waltz Op.69 No.1"
      bpm: 65
    - path: audio/classical_pd/Chopin - Prelude Op.28 No.7 in A major.ogg
      title: "Prelude No.7 in A major"
      bpm: 70
    - path: audio/classical_pd/Schumann - Traumerei.ogg
      title: "Träumerei"
      bpm: 55
    # Pre-1926 PD reference: Marjory Kennedy-Fraser — Songs of the Hebrides (1909/1917), instrumental arr.
    - path: audio/music/hearth_air.ogg
      title: "Hearth Air"
      bpm: 60
    # Pre-1926 PD reference: traditional Skye Boat Song, lilting 6/8 arrangement
    - path: audio/music/boat_song.ogg
      title: "Boat Song"
      bpm: 80

  # tavern alias — maps to parlour/drawing room music
  tavern: &parlour_tracks
    # Strauss waltzes — the drawing room, the ball, polite society at play
    - path: audio/classical_pd/Strauss - Blue_Danube.ogg
      title: "The Blue Danube"
      bpm: 140
    - path: audio/classical_pd/Strauss - Tales_From_Vienna_Woods.ogg
      title: "Tales from the Vienna Woods"
      bpm: 130
    - path: audio/classical_pd/Strauss - Voices_Of_Spring.ogg
      title: "Voices of Spring"
      bpm: 145
    - path: audio/classical_pd/Strauss - Emperor_Waltz.ogg
      title: "Emperor Waltz"
      bpm: 135
    - path: audio/classical_pd/Strauss - Roses_From_The_South.ogg
      title: "Roses from the South"
      bpm: 130
    # Chopin waltzes — lighter, more intimate
    - path: audio/classical_pd/Chopin - Waltz Op.64 No.1 Minute Waltz.ogg
      title: "Minute Waltz"
      bpm: 140
    - path: audio/classical_pd/Chopin - Grande Valse Brillante Op.18.ogg
      title: "Grande Valse Brillante"
      bpm: 130
    - path: audio/classical_pd/Chopin - Waltz Op.34 No.3 in F major.ogg
      title: "Waltz in F major"
      bpm: 125
    # Pre-1926 PD reference: Burns song-air set for parlour piano (instrumental, no voice)
    - path: audio/music/parlour_air.ogg
      title: "Parlour Air"
      bpm: 85

  parlour: *parlour_tracks

  romance:
    # Emotionally rich — the conversation in the garden, the letter that should not have been sent
    - path: audio/classical_pd/Chopin - Ballade No.3 Op.47.ogg
      title: "Ballade No.3"
      bpm: 65
    - path: audio/classical_pd/Chopin - Nocturne Op.48 No.1 in C minor.ogg
      title: "Nocturne Op.48 No.1"
      bpm: 55
    - path: audio/classical_pd/Chopin - Waltz Op.69 No.2 in B minor.ogg
      title: "Waltz in B minor"
      bpm: 70
    - path: audio/classical_pd/Chopin - Waltz Op.64 No.2 in C-sharp minor.ogg
      title: "Waltz in C-sharp minor"
      bpm: 75

  gothic:
    # Dark, unsettling — the moors at night, the sound from the locked room
    - path: audio/classical_pd/Saint-Saens - Danse Macabre.ogg
      title: "Danse Macabre"
      bpm: 75
    - path: audio/classical_pd/Grieg - In the Hall of the Mountain King.ogg
      title: "In the Hall of the Mountain King"
      bpm: 80
    - path: audio/classical_pd/Chopin - Prelude Op.28 No.24 in D minor.ogg
      title: "Prelude No.24 in D minor"
      bpm: 90
    - path: audio/classical_pd/Chopin - Nocturne B.108 in C minor.ogg
      title: "Nocturne in C minor"
      bpm: 55
    - path: audio/classical_pd/Chopin - Fantasy Op.49 in F minor.ogg
      title: "Fantasy in F minor"
      bpm: 65

# Genre-specific mood keywords — triggers mood detection for non-standard moods
mood_keywords:
  parlour:
    - parlour
    - drawing room
    - ballroom
    - dance
    - waltz
    - piano
    - music room
    - entertainment
    - social
    - party
    - soiree
    - reception
  romance:
    - love
    - heart
    - passion
    - kiss
    - embrace
    - letter
    - garden
    - moonlight
    - confession
    - desire
    - longing
    - intimate
  gothic:
    - ghost
    - haunt
    - curse
    - locked
    - attic
    - cellar
    - moor
    - storm
    - midnight
    - shadow
    - dread
    - crypt
    - séance
    - spirit
    - supernatural

sfx_library:
  bell_pull:
    - audio/sfx/bell_pull.ogg
  door_creak:
    - audio/sfx/heavy_door.ogg
  clock_strike:
    - audio/sfx/mantel_clock.ogg
  carriage:
    - audio/sfx/carriage_arrival.ogg
  thunder:
    - audio/sfx/distant_thunder.ogg
  rain:
    - audio/sfx/rain.ogg
  footsteps:
    - audio/sfx/footsteps_stone.ogg
  fire_crackle:
    - audio/sfx/fire_crackle.ogg

mixer:
  music_volume: 0.4
  sfx_volume: 0.7
  crossfade_default_ms: 3000

ai_generation:
  enabled: false
