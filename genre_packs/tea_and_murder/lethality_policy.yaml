genre_key: tea_and_murder
default_reversibility: permanent
verdicts_on_zero_hp:
  pc: defeated
  npc: dying
soul_md_constraint: "genre_truth:the_past_does_not_release_us"
must_narrate: "Render the loss with Edwardian cosy-mystery restraint. Specific objects carry the weight — a cold tea service, a half-written letter, a window left open to the glen. The moment is small and irrevocable. Time keeps moving; the household does not look back."
must_not_narrate: "exclamatory melodrama; graphic violence rendered for spectacle; an absent benefactor returning to put things right; the wronged speaking the wrongdoer's reform; comic relief that softens the verdict"
