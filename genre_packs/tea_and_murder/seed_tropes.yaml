# Seed tropes for tea_and_murder — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, Epic 22, story 22-1).
# Dealt without replacement; each seed expires after its lifespan_turns
# and lingers as a "ghost" for later session callback. Seeds are baited
# hooks (ADR-014 diamonds-and-coal) — vague on purpose; the narrator
# retroactively threads engaged seeds into the macro mystery.

- id: a_sealed_letter_unopened
  name: A Sealed Letter, Unopened
  description: >-
    A letter has lain three days on the hall table at Castle Ross,
    addressed in a hand nobody at the house recognises. The seal is
    intact. The footman has begun to dust around it rather than move it.
  flavor_tags: [correspondence, household, estate, propriety]
  lifespan_turns: 8
  delivery_hints:
    - Lady Annabel mentions it in passing at the tea-rooms, almost as a complaint about her staff
    - Old Tam saw the boy from the post office deliver it on Monday and remarks on the boy's strange hurry
    - Mrs. Buchan at the post office can describe the sender's hand but not place it
  narrative_hint: >-
    When the players ask after the sender, anchor the hand to whomever
    the village comes to suspect; if ignored, the letter is found
    opened later by the wrong person.

- id: the_wrong_silver_pattern
  name: The Wrong Silver Pattern
  description: >-
    At Mrs. Cameron's tea-rooms, one of the cake-forks on the corner
    table does not match its fellows. It is older, heavier, and bears
    a monogram that is not Cameron's.
  flavor_tags: [household, antique, gossip]
  lifespan_turns: 6
  delivery_hints:
    - The fork sits visibly heavier than its fellows; anyone who lifts one feels the difference
    - Mrs. Cameron, asked, frowns and says she has never seen it before in her life
    - Miss Ferguson recognises the monogram from a piece she saw once at the manse, years ago
  narrative_hint: >-
    Let the monogram surface again on an inventory of a household the
    players visit later; treat the contradiction as a quiet thread, not
    a smoking gun.

- id: the_vicars_cough
  name: The Vicar's Cough
  description: >-
    Rev. Murchison has coughed through every sermon for a fortnight,
    yet refuses to send for Dr. Ross. Mrs. Buchan thinks it is the
    damp; the schoolmistress thinks it is something he ate at the
    manse on the Tuesday.
  flavor_tags: [kirk, illness, gossip, parish]
  lifespan_turns: 7
  delivery_hints:
    - Heard from the back pew on a Sunday — three coughing fits in the homily
    - Dr. Ross, half-amused at the tea-rooms, says he has offered and been refused
    - Mrs. Buchan has counted the days and is keeping a sort of register
  narrative_hint: >-
    A small bodily fact that may align with an alibi window; if the
    players never pull on it, let it become the parish's running joke
    that returns on the day the truth lands.

- id: the_pony_trap_at_dawn
  name: The Pony-Trap at Dawn
  description: >-
    A pony-trap was heard on the road past the manse before sunrise on
    Tuesday — too early for the milk, too late for the night fishermen.
    Nobody at the village will admit to having driven one.
  flavor_tags: [weather, household, intrigue, parish]
  lifespan_turns: 5
  delivery_hints:
    - The minister's housekeeper mentions it while complaining about her sleep
    - Sgt. Macrae notes the rut a wheel left in the verge by the kirkyard gate
    - Old Tam knows every trap-horse within ten miles and cannot place this one's gait
  narrative_hint: >-
    Use this to contradict a household's account of where it was on
    Tuesday morning; if ignored, the trap is heard again, once, the
    night after the body is found.

- id: the_courting_stranger
  name: A Stranger Courting in the Village
  description: >-
    A man has been walking one of the younger women home from the
    Glenross Arms three evenings running — tall, perhaps, and not
    from the glen. Nobody can quite describe him.
  flavor_tags: [courtship, gossip, foreigner, scandal]
  lifespan_turns: 7
  delivery_hints:
    - Hamish, polishing a glass too hard, asks a player if they have seen the fellow about the village
    - Mrs. Buchan has a description from her cousin who saw them by the river path
    - The young woman herself, asked kindly, says only that he speaks beautifully and is not staying long
  narrative_hint: >-
    The stranger's vagueness is the seed; let his description sharpen
    in contradictory ways depending on who is doing the telling, and
    align him to whichever visitor the players later place at the inn.

- id: a_missing_teaspoon
  name: A Missing Teaspoon
  description: >-
    Mrs. Cameron has counted the tea-room silver three times and is
    short one teaspoon from the second-best set. It is the sort of
    thing one does not report to the constable, and so she has not.
  flavor_tags: [household, propriety, gossip]
  lifespan_turns: 4
  delivery_hints:
    - Mrs. Cameron mentions it to a player while pouring, in a tone of weary forbearance
    - The scullery-maid is in tears about it in the back room
    - Miss Ferguson advises the players, sotto voce, to take it more seriously than it sounds
  narrative_hint: >-
    A small theft is sometimes a rehearsal for a larger one. Let the
    spoon turn up — pawned in Inverness, dropped in a pocket, lying in
    a place that incriminates the wrong person.

- id: the_telegram_from_perth
  name: A Telegram from Perth
  description: >-
    Mrs. Buchan has taken down a wire for one of the houses at the
    edge of the village that read only "ARRIVED SAFELY STOP DO NOT
    REPLY." She has delivered it. She has also remembered every word.
  flavor_tags: [telegram, post, correspondence, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - Mrs. Buchan recites it for a player while sorting the morning post, half-apologetic for remembering
    - The recipient, asked at their door, says it is a private family matter
    - The pony-boy at the railway halt saw no one disembark from the Perth train on the day the wire was sent
  narrative_hint: >-
    A "do not reply" is a flag; let the sender's identity become
    relevant when the players begin asking who knew the visitor was
    coming.

- id: the_dog_that_did_not_bark
  name: Old Bran Slept Through It
  description: >-
    Sir Iain's deerhound Bran sleeps in the gun-room and barks at any
    soul who passes the side door at night. On Tuesday he did not
    bark, and Sir Iain is troubled by it.
  flavor_tags: [animal, estate, intrigue, household]
  lifespan_turns: 6
  delivery_hints:
    - Sir Iain raises it himself, half-laughing, at the kirk gate after the service
    - Old Tam confirms it — he was up checking the kennels and heard nothing
    - Hugo Ross dismisses it; his father has been jumpier than usual of late
  narrative_hint: >-
    The dog's silence implicates someone the dog knew. Let that fact
    sit unspoken until the players are ready to narrow the household.

- id: the_river_running_clear
  name: The Allt Ross Is Running Clear
  description: >-
    The river has been clear above the bridge all week, where it
    should be peat-brown after the rains. The gillies are arguing
    about why; one of them is angrier about it than the question
    warrants.
  flavor_tags: [weather, fishing, estate, gossip]
  lifespan_turns: 5
  delivery_hints:
    - Old Tam stands at the bridge railing for half a morning, brooding at the water; the tone he uses for omens is on his face for any passer-by
    - A boy from the village is selling a brown trout he should not have caught at this water
    - Donald Munro from the distillery is asked about it and changes the subject
  narrative_hint: >-
    A small environmental wrongness with a mundane cause (work
    upstream, a sluice misset, a tank drained early). Let the
    explanation, when it lands, place someone where they said they
    were not.

- id: the_unsigned_book_in_the_pew
  name: An Unsigned Book in the Back Pew
  description: >-
    A pocket prayer-book has been left in the last pew of St.
    Maelrubha's for three Sundays. There is no name on the flyleaf,
    but a railway ticket from Aviemore is pressed between the psalms.
  flavor_tags: [kirk, railway, correspondence, mourning]
  lifespan_turns: 8
  delivery_hints:
    - Rev. Murchison shows a player the book after the service, embarrassed to have not found its owner
    - The ticket's date does not match any service Mrs. Buchan has seen booked from the village
    - Miss Ferguson recognises the binding as a kind sold at the chapel in Inverness
  narrative_hint: >-
    The book belongs to a visitor who has been at services without
    being seen socially; bind the ticket to whichever outsider the
    players come to mistrust, or to a witness who would rather not be
    placed in the kirk that morning.

- id: the_distillery_running_at_night
  name: Lights at the Distillery After Hours
  description: >-
    The Munro distillery has had lamps lit past midnight on at least
    two nights this week. Donald says it is only the mash — but the
    mash is not at that stage of its cycle and everyone in the glen
    knows it.
  flavor_tags: [distillery, drink, gossip, debt]
  lifespan_turns: 7
  delivery_hints:
    - A player sees the lamps themselves, walking back from the inn after closing
    - Hamish at the Glenross Arms has heard a rumour about a buyer from Edinburgh
    - Mrs. Cameron's nephew, who labours at the distillery, will not meet a player's eye
  narrative_hint: >-
    A money pressure is implied; let it provide motive or alibi for
    Donald or for whomever is leaning on him, and surface the buyer
    when the visitor is named.

- id: the_garden_gate_left_open
  name: The Manse Garden Gate, Left Open
  description: >-
    The garden gate at the manse has been found open three mornings
    in a row, despite Mrs. Murchison being meticulous about latching
    it against the deer.
  flavor_tags: [household, garden, parish, propriety]
  lifespan_turns: 5
  delivery_hints:
    - The minister's wife mentions it to a player at the tea-rooms in a tone of careful neutrality
    - Sgt. Macrae has looked at the latch and judges it sound
    - A row of her dahlias has been trodden on by a boot too large for any local woman
  narrative_hint: >-
    Someone has been visiting the manse who does not wish to be seen
    leaving by the front door; bind to an alibi later, or let it become
    a small gentle scandal that the murder eclipses.

- id: a_funeral_wreath_too_early
  name: A Funeral Wreath, Too Early
  description: >-
    A wreath of white lilies has been left at the lych-gate of St.
    Maelrubha's, addressed to no one and bound with a black silk
    ribbon. Nobody has died in the parish this fortnight.
  flavor_tags: [mourning, parish, kirk, scandal]
  lifespan_turns: 4
  delivery_hints:
    - Rev. Murchison, troubled, asks a player to inquire discreetly at the florist in Inverness
    - Mrs. Buchan has no record of an order through the post for such a thing
    - Miss Ferguson notes the ribbon is of a quality only the castle would buy
  narrative_hint: >-
    A premonition delivered as an object — let it anticipate the body,
    or, if engaged early, let the wreath's sender prove to be the
    person most afraid of the death that is coming.

- id: the_schoolroom_window
  name: The Schoolroom Window Was Forced
  description: >-
    Miss Ferguson found a broken catch on the schoolroom window when
    she opened up on Monday. Nothing is missing. The slates are
    undisturbed. But someone was inside.
  flavor_tags: [schoolroom, parish, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - Miss Ferguson reports it quietly to a player rather than to Sgt. Macrae, whom she finds heavy-handed
    - One of the smaller children says she saw a man at the window on Sunday evening but is not believed
    - The desk-drawer where Miss Ferguson keeps the register has been opened and closed
  narrative_hint: >-
    Someone wanted to know who was where. Let the register's contents
    matter when an alibi turns on which child was kept home that day.

- id: the_visitor_at_the_halt
  name: The Visitor at the Halt
  description: >-
    A man stepped off the morning Inverness train at the Glenross
    halt on Saturday, asked the stationmaster for directions to the
    castle, and was not seen at the castle. He has not been seen
    leaving, either.
  flavor_tags: [railway, foreigner, intrigue, estate]
  lifespan_turns: 7
  delivery_hints:
    - The stationmaster's account, given to a player out of professional pride in his memory
    - Lady Annabel, asked, is certain no such caller arrived
    - Hugo Ross is less certain and changes the subject
  narrative_hint: >-
    A presence with no destination — let the players narrow it.

- id: the_argument_in_gaelic
  name: An Argument in Gaelic
  description: >-
    Two men were heard arguing in Gaelic behind the Glenross Arms on
    Thursday night. The argument was about money. One of the voices
    was Donald Munro's. The other voice was not from the glen.
  flavor_tags: [drink, debt, gossip, accent]
  lifespan_turns: 6
  delivery_hints:
    - Hamish heard it through the back-room wall and tells a player while wiping glasses
    - Mrs. Cameron's nephew, again, knows more than he is saying
    - Old Tam, who has the best Gaelic of any of them, can be persuaded to translate the fragment Hamish remembers
  narrative_hint: >-
    A specific phrase about a sum and a date — let it pin Donald to a
    place and an obligation that the players will recognise once the
    visitor's business is understood.

- id: the_photograph_in_the_album
  name: A Photograph Removed from the Album
  description: >-
    A page of the visitors' album at Castle Ross has had a single
    photograph carefully cut out. The page beneath shows the
    caption: "Summer party, August 1899."
  flavor_tags: [photography, estate, household, intrigue]
  lifespan_turns: 8
  delivery_hints:
    - Lady Annabel mentions, in passing, that one of the housemaids has been over-zealous with the albums
    - Old Tam remembers who was at that party and which face the missing photograph would have shown
    - The cut is recent — the paper edge is still clean
  narrative_hint: >-
    Someone in the present is troubled by a face from nine years ago.
    Connect the missing face to a visitor or to a household member
    when the players begin to ask after old grievances.

- id: a_charitable_subscription
  name: An Unusual Charitable Subscription
  description: >-
    The parish charity book records a subscription of five pounds
    last month from a household that has not given five pounds to
    anything in living memory. Miss Ferguson, who keeps the book,
    is too well-bred to remark on it aloud.
  flavor_tags: [parish, charity, debt, propriety]
  lifespan_turns: 6
  delivery_hints:
    - Miss Ferguson shows a player the entry while ostensibly discussing the school fund
    - Rev. Murchison was surprised when the envelope arrived and said as much to his wife
    - Mrs. Buchan, asked, can name the day the envelope was posted from the village
  narrative_hint: >-
    Sudden generosity is often expiation. Let the timing of the
    subscription place a household in an attitude of conscience the
    week before the death.

- id: the_burnt_shieling_smoke
  name: Smoke from the Burnt Shieling
  description: >-
    Smoke was seen rising from the ruin of the Burnt Shieling on
    Tuesday evening. Local legend says it is the widow of the family
    who vanished from there in the snow of '67, come back at last
    to her hearth; Sgt. Macrae says some tinker has lit a fire and
    ought to be moved on.
  flavor_tags: [weather, parish, gossip, foreigner]
  lifespan_turns: 5
  delivery_hints:
    - A shepherd boy comes down the pass with the story, frightened and proud at once
    - Sgt. Macrae shrugs it off and asks a player to walk up there if they fancy a look
    - Old Tam recalls that the last time smoke rose from the shieling, a man was hiding from his wife
  narrative_hint: >-
    Someone has been sheltering up there — let the rationalisation
    land cleanly (a poacher, a runaway, the courting stranger) and let
    the legend remain only legend.

- id: the_overheard_piano
  name: A Piano Heard at the Wrong House
  description: >-
    Mrs. Buchan, walking home past Dr. Ross's house on Sunday evening,
    heard a piano being played inside. Dr. Ross does not play. Dr.
    Ross was not at home.
  flavor_tags: [music, gossip, household, scandal]
  lifespan_turns: 5
  delivery_hints:
    - Mrs. Buchan tells a player at the post-office counter, not without satisfaction
    - Dr. Ross, asked, says his housekeeper sometimes practices, but the housekeeper denies it firmly
    - The piece, Mrs. Buchan remembers, was a Chopin nocturne played well above the housekeeper's standard
  narrative_hint: >-
    Someone was inside the doctor's house with the leisure to play.
    Let the player asked who plays Chopin in this glen pin a visitor
    or a townsman to that hour.

- id: a_pair_of_walking_boots
  name: A Pair of Walking Boots, Newly Cleaned
  description: >-
    Old Tam noticed that the gentleman's boots left at the castle's
    side porch on Wednesday morning had been cleaned of every trace
    of mud, but the soles were still wet. Cleaned by whom, and at
    what hour, he could not say.
  flavor_tags: [estate, household, servant, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - Old Tam mentions it to a player while showing them a young pointer in the kennels
    - The boot-boy was abed at the usual hour and swears he did not touch them
    - Lady Annabel, asked, says she had given no such instruction
  narrative_hint: >-
    Someone in the household cleaned the boots between the night and
    the morning. Let the cleaner's identity matter when the visitor's
    movements are placed on a map.

- id: the_grocers_unpaid_account
  name: An Unpaid Account at the Grocer's
  description: >-
    The grocer at the foot of the village has an account three months
    in arrears from a respectable household. He has begun, quietly, to
    refuse credit on small items. He will not yet name the household.
  flavor_tags: [debt, household, gossip, propriety]
  lifespan_turns: 7
  delivery_hints:
    - The grocer is uncharacteristically curt with a player buying biscuits and a question
    - Mrs. Buchan has noticed the same household has not posted the usual monthly cheque
    - Mrs. Cameron has heard the cook from that household ask for a smaller cut of beef than usual
  narrative_hint: >-
    Money pressure beneath gentility — let the household, when named,
    align with a motive the players will be slow to suspect because
    the family is so visibly respectable.

- id: a_hymn_sung_in_the_wrong_kirk
  name: A Hymn Sung in the Wrong Kirk
  description: >-
    Rev. Quill at St. Margaret's Episcopal Chapel has had a regular
    new attender at Wednesday evensong — a woman in black who comes
    by the side door and leaves before the final hymn. She is, he
    believes, a parishioner of Rev. Murchison's.
  flavor_tags: [kirk, mourning, scandal, parish]
  lifespan_turns: 7
  delivery_hints:
    - Rev. Quill mentions it to a player almost apologetically, over a cup of weak tea
    - Mrs. Buchan can name three women in black currently in the parish and rule out two
    - Rev. Murchison, if asked, will not be drawn — which is itself the answer
  narrative_hint: >-
    A private grief or a private guilt; let the woman's identity tie
    to either a past loss the village does not openly discuss, or to
    the visitor's business when it surfaces.

- id: the_market_day_absence
  name: The Market-Day Absence
  description: >-
    Someone who has not missed a Friday market in twenty years was
    not at market this Friday. Mrs. Cameron noticed first; by the
    afternoon the absence had been remarked on by everyone who
    matters.
  flavor_tags: [market, gossip, parish, household]
  lifespan_turns: 4
  delivery_hints:
    - Mrs. Cameron tells a player while wrapping a parcel, with the satisfaction of being first to notice
    - The absent person's neighbour saw their curtains drawn all day
    - Dr. Ross was not called; whatever it was, they did not want a doctor
  narrative_hint: >-
    A small breach of routine that the village will absorb into the
    larger story once the body is found.
