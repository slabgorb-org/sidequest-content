# Seed tropes for tea_and_murder — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the mystery demands.
#
# World-agnostic by design (ADR-140): genre grammar only — the cosy
# village register, respectable surfaces over private arrangements,
# amateur sleuthing with a day job, and stakes that are social before
# they are mortal. World decks (e.g. glenross) layer local costume on
# top; these stay village-shaped but unplaced.

- id: the_new_arrival_rents_the_big_house
  name: The New Tenant at the Big House
  description: >-
    The big house — empty, leased, or lately inherited — has a new
    occupant: polite, well-dressed, vague about their last address.
    They pay tradespeople promptly and in cash, decline every
    invitation with charming regret, and have had the locks changed
    by a man from town rather than the village ironmonger. The
    village has, of course, noticed everything.
  flavor_tags: [newcomer, village, secrets, observation]
  lifespan_turns: 8
  delivery_hints:
    - Their post arrives re-addressed in a second hand, from somewhere they've never mentioned
    - One villager is certain they've seen the newcomer before and cannot place where — it nags at them audibly
    - The declined invitations have one exception, accepted instantly, and the choice is odd
  narrative_hint: >-
    The newcomer is a locked box on the green. Let the village's
    surveillance be comic and accurate in equal measure, the
    misplaced recognition resolve into something printed —
    a newspaper, an inquest report, a playbill — and the single
    accepted invitation reveal what they actually came here for.

- id: the_will_has_a_curious_condition
  name: The Will Has a Curious Condition
  description: >-
    A respectable estate has been read, and the will is sound but
    strange: a bequest hinging on a condition — residence kept,
    a name taken, a grave tended, a person never spoken to again.
    The solicitor declines to explain; the family declines to
    comply quietly; and the condition, examined closely, implies
    the deceased knew something about somebody.
  flavor_tags: [inheritance, family, condition, solicitor]
  lifespan_turns: 8
  delivery_hints:
    - The condition is precise in a way that only makes sense as an answer to something unspoken
    - One beneficiary finds the condition trivially easy, which surprises everyone including them
    - The solicitor's file holds a sealed letter, to be opened only if the condition is contested
  narrative_hint: >-
    The conditional will is a confession in trust law. Let the
    sealed letter be the bait everyone circles, the easy
    beneficiary's surprise be genuine and significant, and the
    deceased's knowledge — when it surfaces — re-sort the family's
    politics rather than merely shaming one member.

- id: the_committee_vote_was_rigged
  name: The Flower Committee Vote Was Rigged
  description: >-
    Something small was decided — a committee chair, a fete
    contract, which firm repairs the church roof — and the vote
    was got at. The margin was two; the irregularity is provable
    by anyone who compares the minutes to the membership book;
    and the prize, on inspection, is worth far more to ONE
    person than its size suggests.
  flavor_tags: [village, committee, fraud, smallstakes]
  lifespan_turns: 6
  delivery_hints:
    - Two of the recorded votes belong to members who can be shown to have been elsewhere
    - The minute-taker's handwriting wavers at exactly one entry
    - The prize's disproportionate value to the winner only appears when you ask what it gives them access to
  narrative_hint: >-
    The rigged trifle is the genre's iceberg — petty procedure
    over a real motive. Let the access (a building, a ledger, a
    schedule, a key) be the actual object, and let exposing the
    fraud threaten someone's standing enough to make the next
    move desperate.

- id: the_doctors_locum_asks_questions
  name: The Locum Asks the Strangest Questions
  description: >-
    A locum, relief postman, visiting curate, or temporary
    schoolmistress has come to cover a village post — competent,
    pleasant, and asking questions a temporary appointment has no
    need to ask. Old questions. Who lived where, who married whom,
    what became of a family that left before the war. They write
    nothing down, which is itself a kind of training.
  flavor_tags: [visitor, questions, past, impersonation]
  lifespan_turns: 7
  delivery_hints:
    - The questions, mapped, all border one event the village half-remembers and fully avoids
    - Their professional competence is real, but one routine task of the role is done oddly, learner-fashion
    - They post no letters and receive none, but walk to where the telephone kiosk is private, twice a week
  narrative_hint: >-
    The asking visitor is an investigation already in progress —
    insurance, inheritance, kin of the wronged, or something with
    a warrant card it isn't showing. Let the party's sleuth
    instincts collide with theirs, and the avoided event be a
    cold case the village settled out of court with its
    conscience.

- id: the_anonymous_kindness
  name: The Anonymous Benefactor Strikes Again
  description: >-
    Money has been arriving — quietly, precisely, where it is most
    needed: a paid grocer's account, a settled doctor's bill,
    school fees found in an envelope. The amounts are exact, which
    means the benefactor knows the debts exactly, which means they
    have access to private information no kindly stranger should
    have. Gratitude is curdling into unease.
  flavor_tags: [charity, secrets, access, unease]
  lifespan_turns: 7
  delivery_hints:
    - The beneficiaries have one connection between them that none of them will volunteer
    - The envelopes' details — paper, hand, postmark — are deliberately varied, which took effort
    - One intended kindness went astray, and its correction revealed the benefactor watches closely
  narrative_hint: >-
    The exact charity is guilt with a chequebook. Let the
    beneficiaries' hidden connection name the original wrong, the
    benefactor be paying down something specific on a schedule
    (an anniversary approaches), and the unease be right: the
    final payment in the series is not money.

- id: the_grave_tended_by_no_one
  name: The Well-Tended Grave Nobody Tends
  description: >-
    A grave in the churchyard — modest stone, a name nobody living
    remembers well — is always tended. Fresh flowers in season,
    moss cleared, the lettering kept legible. No villager does it;
    the sexton has watched for years and never caught anyone. This
    week, for the first time in memory, the flowers are dead and
    the grave untended. Something, somewhere, has changed.
  flavor_tags: [grave, devotion, absence, past]
  lifespan_turns: 8
  delivery_hints:
    - The tending happened at impossible hours, before the earliest riser and after the latest
    - The name on the stone connects, through parish records, to a story with one loose end
    - The stopped tending coincides with another small absence — somebody's routine, elsewhere, has also broken
  narrative_hint: >-
    The untended grave is a death announced by silence — the
    tender has died, fallen ill, or been prevented, and finding
    them means solving who they were to the stone's occupant.
    Let the parish-record loose end be a quiet scandal in its
    day, and the tender's identity recast a living villager's
    whole biography.

- id: the_shopkeeper_extends_no_more_credit
  name: The Shop Has Stopped the Credit
  description: >-
    The village shop has, without announcement, stopped extending
    credit — to everyone, even the gentry, even the vicarage. The
    shopkeeper apologizes warmly and rings the till like a closing
    door. Shops do this when they're owed too much, or when they're
    leaving, or when somebody has frightened them about money.
    The shopkeeper does not look like a person owed too much.
  flavor_tags: [village, money, fear, economy]
  lifespan_turns: 6
  delivery_hints:
    - The ledger of who owed what, glimpsed, has one account struck through entirely rather than carried
    - A traveling man in a good coat visited the shop after hours, twice, and bought nothing
    - The shopkeeper has begun keeping the day's takings somewhere other than the bank
  narrative_hint: >-
    The stopped credit is fear moving through the till. Let the
    struck-through account name the pressure's source, the
    after-hours visitor be collection of a debt that isn't
    grocery money, and the avoided bank suggest the shopkeeper
    knows something about an institution everyone else still
    trusts.

- id: the_photograph_in_the_jumble
  name: The Photograph in the Jumble Sale Lot
  description: >-
    Among the donated jumble — a box of books, a biscuit tin of
    oddments from a cleared attic — is a photograph that should
    not exist: two people together who, by the village's settled
    history, never met; a building intact after the date it burned;
    a face at a gathering its owner always claimed to have missed.
    The donor of the box is vague about which house it came from.
  flavor_tags: [photograph, history, evidence, jumble]
  lifespan_turns: 7
  delivery_hints:
    - The photograph is professionally taken; somewhere there was a negative, and possibly an order book
    - One person, shown it casually, reacts a half-second before composing themselves
    - The donor's vagueness is genuine — boxes were mixed — which makes the provenance a puzzle of its own
  narrative_hint: >-
    The impossible photograph is documentary evidence loose in a
    church hall. Let the settled history it contradicts be
    load-bearing for somebody's marriage, inheritance, or alibi,
    and the photographer's order book — if it survives — be the
    thread that turns one anomaly into a sequence.

- id: the_dog_adopts_the_wrong_house
  name: The Dog Has Adopted the Wrong House
  description: >-
    A well-kept dog — collar, manners, somebody's pride — has
    taken to sitting outside a house it has no connection to,
    daily, with the patience of an appointment. Its owner retrieves
    it, embarrassed; it returns. Dogs follow food, kindness, or
    habit, and the house in question offers it none of the three.
    Whatever the dog is waiting for, it has good reason to expect.
  flavor_tags: [animal, habit, evidence, gentle]
  lifespan_turns: 6
  delivery_hints:
    - The dog's vigil matches a time of day, not just a place — it expects something at four o'clock
    - The dog's late master, or former household, connects to the house through an arrangement nobody admits to
    - Offered the chance, the dog leads — not into the house, but to a place behind it
  narrative_hint: >-
    The dog is an honest witness with no testimony, only habit.
    Let the four-o'clock expectation reconstruct a routine
    somebody had reasons to hide — a delivery, a meeting, a
    kindness — and the place behind the house hold what the
    routine left there.

- id: the_choir_voice_that_returned
  name: A Voice Came Back to the Choir
  description: >-
    The church choir has regained a voice — somebody who sang in
    it years ago, left abruptly, and has slipped back into the
    second row as if no time had passed. They sing beautifully and
    answer warmly and say nothing at all about the years between.
    The vicar is delighted. The organist, who remembers WHY they
    left, has begun making mistakes.
  flavor_tags: [return, village, past, tension]
  lifespan_turns: 7
  delivery_hints:
    - The organist's mistakes cluster at one hymn, never otherwise in their repertoire by accident
    - The returned singer's departure coincided, to the month, with something else the village dates by
    - Somebody has begun attending services who never did before, sitting where the second row is visible
  narrative_hint: >-
    The returned voice is the past taking a seat in the present.
    Let the organist's hymn be a date in disguise, the watcher in
    the pews have arrived FOR the singer, and the years between
    contain the thing — debt, sentence, marriage, vow — that
    decides whether this homecoming ends in tea or testimony.

- id: the_two_invitations
  name: Two Invitations for the Same Afternoon
  description: >-
    Two village powers — hostesses, patrons, the kind of people
    whose invitations are instructions — have called events for
    the same afternoon. Everyone of consequence is invited to
    both. The clash is not an accident; the village can feel it.
    Attendance has become a census of loyalty, and the party,
    being newer or neutral, is being courted by both camps with
    increasing directness.
  flavor_tags: [society, rivalry, loyalty, occasion]
  lifespan_turns: 6
  delivery_hints:
    - The stated occasions are innocuous; the real agenda of at least one gathering requires particular people OUT of the other
    - A go-between is carrying messages between the camps and editing them
    - One invitee needs desperately to be at both, for a reason unrelated to either hostess
  narrative_hint: >-
    The duelling invitations are a social mechanism with a hidden
    payload — let one gathering be cover for something that needs
    witnesses elsewhere, the editing go-between be playing their
    own game, and the desperate double-attendee's predicament be
    the human door into the whole machinery.

- id: the_bell_rope_was_moved
  name: Somebody Has Been in the Church Tower
  description: >-
    Small things in the church are subtly displaced — the bell
    rope re-tied with a different knot, the tower door's dust
    disturbed, a hassock in the ringing chamber that belongs in
    the nave. Nothing is missing. The tower sees half the village:
    the green, the lane, three back gardens, and the road in. The
    church is never locked. Somebody has been using the view.
  flavor_tags: [church, watcher, vantage, quiet]
  lifespan_turns: 6
  delivery_hints:
    - The watcher's timing, reconstructed from the verger's habits, matches particular comings and goings on the road
    - A cigarette end or sweet wrapper in the chamber is a brand sold locally — narrowing, not naming
    - From the tower, exactly one window in the village can be seen INTO, and its curtains have lately been kept drawn
  narrative_hint: >-
    The borrowed vantage is surveillance in a cassock's shadow.
    Let the watched window's drawn curtains prove the subject
    knows, the timing pattern reveal whether the watcher guards,
    covets, or documents — and the party's own visits to the
    tower be visible, of course, to anyone else who thinks to
    look up.

- id: the_recipe_that_isnt_shared
  name: The Recipe She Takes to Every Funeral
  description: >-
    There is a dish — a cake, a preserve, a cordial — that one
    villager brings to every funeral, wake, and sickbed, famous
    and faintly ceremonial. The recipe is refused to everyone,
    pleasantly, absolutely. This week somebody replicated it,
    exactly, at a gathering the maker did not attend — and the
    maker, tasting it, went white and left without her coat.
  flavor_tags: [recipe, secret, village, signal]
  lifespan_turns: 7
  delivery_hints:
    - The recipe's secrecy was never about cookery — it encodes a provenance, a household, a time and place
    - The replicator got it from a written source, which means a document survived that shouldn't have
    - The maker's first act after recovering is to visit someone she has not called on in years
  narrative_hint: >-
    The replicated recipe is a message only one person could
    fully read — proof that a supposedly closed past has an open
    door. Let the written source be part of a larger cache
    (letters, a diary, a household book), and the maker's
    long-avoided visit identify the only other person who knows
    what the recipe meant.

- id: the_train_that_stopped_between_stations
  name: The Train Stopped Where It Never Stops
  description: >-
    The evening train halted on the embankment outside the village
    — signals, the company says — for eleven minutes. Passengers
    saw nothing; villagers saw the train. But the hedger working
    the far field saw a figure descend from the last carriage,
    cross two fields with a bag, and not arrive anywhere the
    village can account for. Nobody new has appeared. The bag has.
  flavor_tags: [arrival, mystery, railway, concealment]
  lifespan_turns: 7
  delivery_hints:
    - The signals story is checkable and half-true — there WAS a delay, arranged by a request somebody paid for
    - The bag turns up empty in a ditch, and what shape its contents left in the lining is suggestive
    - Someone in the village has begun buying food for an appetite their household doesn't explain
  narrative_hint: >-
    The unarrived passenger is a guest the village doesn't know
    it's hosting. Let the extra groceries point to the harborer,
    the paid delay point to planning and money, and the question
    of WHY someone needed to arrive unseen — flight, return, or
    reconnaissance — be the mystery's hinge. The genre wants the
    answer domestic, not exotic.
