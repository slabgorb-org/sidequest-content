obstacles:
  - name: Locked door
    description: A study, a drawer, a desk — locked when it should not be, or with a key no one admits to holding
    stat_check: Cunning
    failure_penalty: Discovery — someone in the household knows you tried
    tags: [house, access, secret]

  - name: The post office queue
    description: Five other villagers ahead of you and an urgent question for the postmistress
    stat_check: Humour
    failure_penalty: The information you wanted is now everyone's; the postmistress is too distracted to confide
    tags: [social, information, public]

  - name: The Sunday tea
    description: A social obligation — refuse and you are heartless, attend and you must endure the parish gossip before the sleuth can ask the one question that matters
    stat_check: Humour
    failure_penalty: Standing slip with the village; the question must wait until Wednesday
    tags: [social, obligation, information]

  - name: Mourning call
    description: A formal visit to the bereaved — propriety requires it, the sleuth knows the household is the place to ask the question, and both facts must be honoured at once
    stat_check: Humour
    failure_penalty: Reputation damage from callousness or from asking the wrong question
    tags: [social, obligation, information]

  - name: Drawing-room enquiry
    description: Polite questions that are not polite at all — the laird, the rector, the visiting solicitor each wants to know exactly what you know, and how
    stat_check: Nerve
    failure_penalty: A confidence leaks, or a secret is closer to exposure
    tags: [social, verbal, pressure]

  - name: The cricket pavilion crowd
    description: Half the parish in a small space; the one person you need to speak to is the one person who must not see you cross the pitch
    stat_check: Pride
    failure_penalty: The wrong eyes meet yours, Standing -1
    tags: [social, crowd, public]

  - name: The Long Pass after dark
    description: A walk between hamlets in failing light; the wind in the heather, the way sound carries in the glen, the awareness of company you did not expect
    stat_check: Nerve
    failure_penalty: Lost; or worse, found
    tags: [rural, night, physical]

  - name: Muddy lane
    description: Rain-soaked country track — your boots will suffer and so will your dignity at the manse you arrive at
    stat_check: Nerve
    failure_penalty: Appearance ruined; the household receives you in the back kitchen instead of the parlour
    tags: [rural, weather, physical]

  - name: The discreet servant
    description: A member of the household staff who has been instructed to remember you were never there
    stat_check: Cunning
    failure_penalty: Movements reported; the master knows you have called
    tags: [house, surveillance, social]

  - name: The wireless message
    description: A telegram that must be sent without the postmistress reading the contents, or composed in a code that cannot be cracked between Glenross and Inverness
    stat_check: Cunning
    failure_penalty: The contents are common village knowledge by sundown
    tags: [communication, information, precision]

  - name: The bicycle pursuit
    description: A figure ahead on the lane, a bicycle propped against the inn wall, three miles of unmade road and a hill at the end
    stat_check: Nerve
    failure_penalty: Lost the trail, or thrown into the verge by a careless ditch
    tags: [chase, rural, physical]

  - name: The motor-car
    description: Glenross has perhaps three motor-cars in the parish; pursuing or escaping one is the sort of incident villagers remember
    stat_check: Nerve
    failure_penalty: Mechanical trouble, a missed turning, a witness who will not stop telling the story for a fortnight
    tags: [chase, modern, conspicuous]

  - name: The train timetable
    description: Two trains a day to Inverness; the next one is in forty minutes and someone is on it who must not leave the parish
    stat_check: Cunning
    failure_penalty: The train departs with the person — and the question — aboard
    tags: [travel, time-pressure, urgency]

  - name: Difficult correspondence
    description: A letter that must be written with perfect precision — one wrong word and the recipient knows you suspect them
    stat_check: Cunning
    failure_penalty: Misunderstanding, offence given, or intention revealed
    tags: [communication, social, precision]

  - name: The kirk session
    description: A meeting of the parish elders — questions about morals and money and who has been seen where, asked with the full weight of the kirk behind them
    stat_check: Pride
    failure_penalty: A formal censure; Standing slip in the parish for a season
    tags: [social, formal, public]

  - name: The laird's lawn party
    description: The summer fixture at the Big House; the right conversation happens between the second tea and the first wasp; the wrong conversation lives on for years
    stat_check: Pride
    failure_penalty: An invitation is not extended the following summer
    tags: [social, formal, public]

