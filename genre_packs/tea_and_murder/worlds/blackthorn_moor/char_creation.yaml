- id: confirmation
  title: Settling In
  narration: |
    The landlord nods slowly, as though placing the last piece of you on the
    shelf where you belong.

    "You'll be wanting a room, then, I expect. The back bedroom looks over the
    moor — better than the front, the carriages come past at six on their way
    up to the Hall. Supper is at the half-hour." He picks up the cloth again.

    "And {name}? Welcome to Blackthorn. They'll have you up the lane for tea
    before the week's out — though up at the Hall, mind, the tea has gone
    cold lately."

    {name} — fresh case, steady eye, the watchful air of a {class} sleuth
    lately come up from a {race} household — follows the landlord's gesture
    toward the stairs.
  choices: []
  allows_freeform: false
