# Seed tropes for tea_and_murder / blackthorn_moor — short-arc narrative
# hooks dealt at session start from this WORLD's deck, and on lull/engagement
# draws (ADR-018, ADR-128, Epic 22). Per Epic 94, genre is the rulebook only:
# all flavour — the moor, the mills, the Hall, the cast, the West Riding idiom —
# lives here at world tier, read FIRST and never inherited from the pack.
#
# Dealt without replacement; each seed expires after its lifespan_turns and
# lingers as a "ghost" for later session callback. Seeds are baited hooks
# (ADR-014 diamonds-and-coal) — vague on purpose; the narrator retroactively
# threads engaged seeds into the macro mystery (the death of Sir Edmund, the
# unread will, the ward Rose). Register: mid-Victorian West Riding Yorkshire,
# c. 1860s — menace under good manners, the murder a puzzle and not a slasher,
# tea and propriety throughout. The player is the outsider who notices.

- id: blackthorn_moor_the_right_of_way_chained
  name: The Footpath Across the Moor, Chained Shut
  description: >-
    The old packhorse path that crosses Blackthorn land from Thornkirk to the
    ridge has been chained and posted against trespass for the first time in
    living memory. The chain went up the week Sir Edmund died. Nobody at the
    Hall will say on whose order.
  flavor_tags: [estate, moor, village, propriety, grievance]
  lifespan_turns: 7
  delivery_hints:
    - Mr. Firth at the Blackthorn Arms mentions it sourly, having walked it himself for forty years
    - A mill family is turned back at the new post on a Sunday and the eldest son does not take it quietly
    - Mrs. Poole, asked, says only that the estate's boundaries are the estate's concern and closes the subject
  narrative_hint: >-
    A small act of enclosure that reveals who is now giving orders at the Hall
    before the will is read. Per ADR-014, let the chain's authoriser stay vague;
    bind it later to whoever is consolidating control of the estate, and let the
    grievance it stirs in Millbridge supply a motive the player is slow to weigh.

- id: blackthorn_moor_the_flooded_peat_cutting
  name: The Flooded Peat-Cutting
  description: >-
    The old peat-cutting below the ridge, dry these ten years, has stood brimful
    of black water since the autumn rains. The estate hands give it a wide berth
    now. One of them will not say why, and the others have stopped asking him.
  flavor_tags: [moor, weather, estate, dread, labour]
  lifespan_turns: 6
  delivery_hints:
    - A turf-cutter at the Blackthorn Arms grows quiet when the cutting is named and finishes his ale too fast
    - The water sits unnaturally still and dark; anyone walking the ridge path passes within sight of it
    - The estate sheepdog will not go down to the water's edge and whines on the bank
  narrative_hint: >-
    A still pool the village has decided to fear. Keep the cause mundane and
    human-scaled per the world's no-ghosts mood — a thing weighted and sunk, a
    boundary moved, a man who fell. Let the explanation, when it lands, place
    someone where they swore they were not, or give up what was meant to stay down.

- id: blackthorn_moor_the_returning_prodigal
  name: A Face at the Station That Was Not Expected
  description: >-
    A man stepped off the afternoon train at Thornkirk, asked Mr. Gregson the
    way to the Hall by its old name — the name it had before the mills — and
    walked up the moor road in the rain. Mr. Gregson is certain he has seen the
    face before, years ago, and cannot put a name to it.
  flavor_tags: [railway, stranger, estate, intrigue, past]
  lifespan_turns: 8
  delivery_hints:
    - Mr. Gregson gives the account out of professional pride in his memory for every face that passes the platform
    - The visitor knew the Hall by a name no one has used since Sir Edmund's father built the first mill
    - Lady Catherine, asked whether the family expects a caller, goes very still before she answers no
  narrative_hint: >-
    A presence from the estate's buried past, arriving just as the will comes
    due. Per ADR-014 hold the name vague; sharpen the face in contradictory
    tellings, then bind it to whichever old grievance or unaccounted claimant the
    household most needs kept quiet. SOUL: the narrator owes the player a real
    surprise, not a stock long-lost-heir.

- id: blackthorn_moor_the_disputed_codicil
  name: A Page Torn From the Estate Ledger
  description: >-
    A leaf has been cut cleanly from the back of the estate's rent-ledger, the
    one Mr. Graves has been working through in the converted guest room. The
    stub remains. The cut is recent — the paper edge is still bright.
  flavor_tags: [estate, document, will, intrigue, household]
  lifespan_turns: 8
  delivery_hints:
    - Mr. Graves notices the stub, polishes his spectacles a long moment, and says nothing of it to the household
    - The torn page covered the quarter in which Sir Edmund altered some arrangement six weeks before he died
    - A housemaid recalls dusting the case open one morning when it ought to have been locked
  narrative_hint: >-
    A removed record that matters more for its absence than its content. Let the
    missing page bind to the will's secret — the changed clause, the named heir —
    and surface only obliquely, through who had access to the case and who feared
    what it held. Treat the contradiction as a quiet thread, not a smoking gun.

- id: blackthorn_moor_the_poaching_feud
  name: A Snare on the Home-Farm Side of the Wall
  description: >-
    A wire snare has been set inside the estate wall, on ground no Millbridge man
    would dare work — and set by a hand that knew the keeper's rounds to the
    minute. The keeper found it sprung and empty, and he has told the Hall less
    than he has told the Blackthorn Arms.
  flavor_tags: [estate, moor, grievance, village, intrigue]
  lifespan_turns: 5
  delivery_hints:
    - The gamekeeper shows a player the snare-wire over a pint, prouder of spotting it than worried by it
    - The set was timed to a gap in the rounds that only someone of the estate would know
    - A mill family long at feud with the Hall over a son transported for poaching is named, and named again
  narrative_hint: >-
    An old class grudge given fresh wire. The snare's real interest is the
    insider's knowledge it required; let it narrow not to a hungry villager but to
    someone with the run of the estate, and let the feud supply a loud suspect the
    truth will quietly clear.

- id: blackthorn_moor_the_seance_at_millbridge
  name: A Table-Rapping the Vicar Will Not Bless
  description: >-
    A medium down from Leeds has been holding sittings in a Millbridge parlour,
    and the talk is that a grieving household has paid for a private one. The
    Reverend Mr. Lancaster has preached against it twice and will not say which
    household, which everyone takes for an answer.
  flavor_tags: [village, mourning, kirk, scandal, grief]
  lifespan_turns: 7
  delivery_hints:
    - Mr. Firth relays it with relish, the vicar's discomfort being half the entertainment
    - The medium asked particular questions about the Hall before the private sitting was arranged
    - Rev. Lancaster, pressed, will only say the dead are God's and not a stranger's to summon, and changes the subject
  narrative_hint: >-
    Grief turned to spectacle, and a household paying to ask the dead what the
    living will not. Keep it mundane — a fraud working a bereaved purse — but let
    the questions the medium was fed reveal what someone at the Hall most wants
    answered about the night Sir Edmund died.

- id: blackthorn_moor_the_bog_gives_up_a_boot
  name: The Moor Gives Up an Old Boot
  description: >-
    A turf-cutter's spade turned up a man's boot on the high moor, the leather
    tanned black and whole, with the small bones of a foot still laced inside it.
    The talk in the snug is of the labourer who went off to America in the bad
    winter of '52 and was never heard from again.
  flavor_tags: [moor, past, village, dread, mill]
  lifespan_turns: 6
  delivery_hints:
    - The find is brought down to the Blackthorn Arms wrapped in sacking and looked at by half the village
    - The winter named is the same winter as the mill fire that ruined a Millbridge family
    - Rev. Lancaster, shown it, turns the parish registers to a page he then declines to read aloud
  narrative_hint: >-
    The moor keeping its dead and surrendering one at an inconvenient hour. Bind
    the boot to the old mill-fire grievance and the family it broke; let it be a
    cold case that throws a long shadow on the warm one, and let the registers
    name the gap the village has politely forgotten.

- id: blackthorn_moor_the_locket_left_open
  name: The Locket Left Open on the Landing
  description: >-
    Lady Catherine's gold mourning locket — the one she touches without knowing
    she does — was found open and dropped on the gallery landing, the painted
    miniature inside it scratched clean across the face. She has not asked after
    it, which is itself remarked upon.
  flavor_tags: [household, estate, mourning, intrigue, propriety]
  lifespan_turns: 7
  delivery_hints:
    - A housemaid found it on the boards below the gallery and gave it to Mrs. Poole, who pocketed it without a word
    - The miniature was defaced deliberately, scored across, not merely worn
    - Lady Catherine, who never lets the locket from her throat, has worn it every day since except this one
  narrative_hint: >-
    A precious thing damaged on purpose and not reclaimed. Let the scratched face
    matter — whose likeness was scored out, and by whom — and bind it to the
    gallery from which the child Rose saw something the night Sir Edmund died.
    SOUL: trust the player to read an object; do not over-explain it.

- id: blackthorn_moor_the_governess_two_candles
  name: Two Candles Burned in the Schoolroom
  description: >-
    Miss Fairfax keeps the schoolroom accounts to the stub, the household being
    careful with tallow. Yet two candles were burned down the night Sir Edmund
    died, in a room with one child long asleep, and the morning's reckoning was
    quietly adjusted to hide it.
  flavor_tags: [household, governess, intrigue, propriety, witness]
  lifespan_turns: 8
  delivery_hints:
    - Mrs. Poole, who checks the tallow against the book, found the figures altered and the alteration neat
    - The schoolroom is the room above the study, and its window looks down on the side door
    - Miss Fairfax, asked about that night, says she slept soundly, and her ink-stained finger taps once on her knee
  narrative_hint: >-
    A witness who was awake and has chosen, so far, to stay unseen. The wasted
    tallow places someone at a window above the study at the wrong hour; let it
    become the player's lever on Miss Fairfax's trust, and let what she saw arrive
    only when she is treated as a person and not a fixture.

- id: blackthorn_moor_the_brandy_decanter
  name: The Decanter Filled to the Same Line
  description: >-
    The brandy on Sir Edmund's study desk stood untouched the night he died — a
    full glass, never raised. But the decanter behind it, Mrs. Poole's pantry-book
    insists, was a measure lower in the morning than the poured glass could
    account for. Someone in that room drank, and it was not the dead man.
  flavor_tags: [household, estate, intrigue, evidence, witness]
  lifespan_turns: 6
  delivery_hints:
    - Mrs. Poole keeps the cellar to the half-inch and her book and the decanter do not agree
    - Dr. Ashworth, asked about the untouched glass, retreats at once into his professional judgement
    - A second glass was washed and returned to the tray before the doctor was ever called
  narrative_hint: >-
    A companion in the study at the hour of death, tidied away by morning. Bind
    the missing measure to whoever Mrs. Poole did or did not see on the stairs;
    let it pressure the doctor's signed certificate, and let the washed second
    glass be the detail the household's coordinated story cannot quite cover.

- id: blackthorn_moor_the_dismissed_foreman
  name: The Foreman Who Was Not Dismissed Quietly
  description: >-
    The foreman Sir Edmund turned off at the Low Mill in the spring has been seen
    on the Thornkirk road three evenings running, walking up toward the Hall at an
    hour when no honest errand takes a Millbridge man that way. He has told the
    snug he is owed, and means to collect.
  flavor_tags: [mill, grievance, village, intrigue, debt]
  lifespan_turns: 5
  delivery_hints:
    - Mr. Firth has heard the man say, in drink, that the Hall owes him more than wages
    - The evenings he was seen on the road include the night before the anonymous letter went south to London
    - The foreman keeps a notebook of grievances against the mill that he will show to anyone who buys the next round
  narrative_hint: >-
    A wronged working man with a loud claim and a convenient hatred. Per ADR-014
    let him sit as the village's obvious suspect; his real value is the notebook
    and what Sir Edmund did to earn a page in it. Bind the timing to the London
    letter, then let the truth pass over him to someone wearing better manners.

- id: blackthorn_moor_the_grenville_silver
  name: A Piece of Grenville Silver in a Millbridge Window
  description: >-
    A monogrammed silver snuff-box bearing the Grenville crest — Lady Catherine's
    family arms — has appeared in the window of a Millbridge pawnbroker, priced
    for a quick sale. No Grenville thing has any business leaving the Hall, and
    Lady Catherine's composure does not extend to the subject.
  flavor_tags: [estate, antique, debt, household, scandal]
  lifespan_turns: 7
  delivery_hints:
    - The pawnbroker can describe the hand that brought it in but not place the man among the gentry
    - The crest is Grenville, not Blackthorn, which narrows whose keeping it left
    - Captain Hale turns the conversation hard the moment the pawnbroker's window is mentioned
  narrative_hint: >-
    Family silver quietly bleeding out of the Hall to cover a debt no one admits.
    Bind the snuff-box to whoever in the house is short of money before the will
    is read; let the Grenville crest, not the Blackthorn one, point the player at
    a motive dressed in mourning and good breeding.
