# Household Staff — visual identity tokens for Blackthorn Hall's
# below-stairs servants (housekeeper, butler, footmen, maids, cook,
# the governess where she dresses to the staff register). Mid-Victorian
# English service dress, c. 1860s. Used as the ART_SENSIBILITY.CULTURE
# composer layer. Kept terse: the genre and world style layers already
# carry impressionist oil/palette/light; this layer adds only what is
# culturally specific. Z-Image discipline: no proper nouns.

visual_tokens: >-
  Mid-Victorian English service dress c. 1860s, plain and dark. Maids in
  high-necked dark stuff gowns under crisp white aprons and frilled
  caps, hair pinned severely back; the housekeeper in unrelieved black
  bombazine with a chatelaine of keys at the waist; the butler and
  footmen in dark tailcoats, white gloves, stiff collars. Faces scrubbed
  and composed, bearing upright and discreet, eyes that have learned to
  see everything and show nothing.
