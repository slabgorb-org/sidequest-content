# Mill Folk — visual identity tokens for the Millbridge cotton trade:
# the mill manager and foremen, the spinners and weavers, the high-
# street tradesmen of the valley town. Mid-Victorian Industrial North
# register, c. 1860s West Riding. Used as the ART_SENSIBILITY.CULTURE
# composer layer. Kept terse: the genre and world style layers already
# carry impressionist oil/palette/light; this layer adds only what is
# culturally specific. Z-Image discipline: no proper nouns.

visual_tokens: >-
  Mid-Victorian Industrial North working dress c. 1860s West Riding.
  Spinners and weavers in plain fustian and clogs, women in printed
  cotton dresses, aprons and woollen shawls crossed at the breast, hair
  bound up under a headscarf or a plain bonnet; foremen and the mill
  manager a degree above in dark serge sack-coats, waistcoats with a
  watch-chain, a hard bowler. Faces pale and soot-marked, hands
  work-roughened, a brisk plain-spoken bearing. Coal grime on collars,
  cotton lint on cuffs.
