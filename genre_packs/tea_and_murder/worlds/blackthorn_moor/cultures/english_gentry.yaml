# English Gentry — visual identity tokens for the Blackthorn and
# Grenville county set (Lady Blackthorn, Captain Hale, Rose the ward,
# visiting county families, the solicitor when he dines upstairs).
# Mid-Victorian English country-house register, c. 1860s Yorkshire.
# Used as the ART_SENSIBILITY.CULTURE composer layer. Kept terse: the
# genre and world style layers already carry impressionist oil/palette/
# light; this layer adds only what is culturally specific. Z-Image
# discipline: no proper nouns.

visual_tokens: >-
  Mid-Victorian English county-gentry dress c. 1860s, tailored and
  restrained, the household in mourning. Frock coats, dark silk
  waistcoats and high stocks or knotted cravats for men, wide
  full-skirted day dresses over crinolines with fitted bodices and
  lace collars for women, jet mourning brooches and a fine gold
  locket, hair in a centre parting drawn low over the ears. Smooth
  pale complexions, composed and unhurried bearing, the studied
  dignity of people watched by the county.
