# Blackthorn Moor — inventory CATALOG (world override).
#
# Doctrine (genre/world boundary): the GENRE rulebook owns mechanics; the
# WORLD owns the catalog. This file ADAPTS the genre catalog
# (tea_and_murder/inventory.yaml) to one specific setting: a remote Yorkshire
# moorland estate, c. 1860s West Riding, on the eve of a will-reading after a
# death that may have been murder. Schema/keys copied EXACTLY from the genre
# file (strict Pydantic, extra fields forbidden).
#
# Setting-specific items reflect the things a guest or investigator would
# carry or find at Blackthorn Hall: moorland weather gear, will-and-estate
# documents, the anonymous letter that started it all, and the small objects
# the suspect cast carries (Lady Catherine's locket, Mr. Graves's document
# case, Dr. Ashworth's bag).
#
# Currency and starting_gold are unchanged from the genre (pounds, mid-
# Victorian English economy) — they are rulebook-adjacent and the callings
# match this world's char_creation.yaml exactly.

currency:
  name: pounds
  denominations:
    - pennies
    - shillings
    - pounds

item_catalog:
  # === SHARED SOCIAL / VICTORIAN ESSENTIALS (carried over from genre) ===
  - id: calling_cards
    name: Calling Cards
    description: Engraved on good stock — leaving one is a social act, withholding one is a weapon.
    category: social
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: At the Hall you are no one until your card is on Mrs. Poole's salver.
    narrative_weight: 0.1

  - id: mourning_locket
    name: Mourning Locket
    description: Black enamel and a lock of hair. Grief made portable and socially acceptable.
    category: accessory
    value: 5
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [personal, emotional, social]
    lore: The whole Hall is in mourning black. Lady Catherine's gold locket is the one nobody can see inside.
    narrative_weight: 0.3

  - id: laudanum_bottle
    name: Laudanum
    description: Opium in alcohol — the Victorian answer to everything from toothache to heartbreak.
    category: consumable
    value: 2
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [medical, sedative, social]
    lore: A house in mourning gets through a deal of it. Nobody says how much.
    narrative_weight: 0.3

  - id: letter_of_introduction
    name: Letter of Introduction
    description: A door-opener — someone of standing vouches for your character and breeding.
    category: social
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [social, access, one-use]
    lore: The right name from London gets you past Mrs. Poole. The wrong one gets you the back door.
    narrative_weight: 0.4

  - id: silk_handkerchief
    name: Silk Handkerchief
    description: Monogrammed, scented, and a silent declaration of breeding. Also useful for evidence.
    category: accessory
    value: 2
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, personal, evidence]
    lore: A dropped handkerchief in the study has started more questions than the anonymous letter did.
    narrative_weight: 0.2

  - id: smelling_salts
    name: Smelling Salts
    description: Ammonia in a crystal vial. Revives the fainted, steadies the shaken.
    category: consumable
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [medical, social, recovery]
    lore: Every lady's reticule at the Hall carries one. So does Dr. Ashworth's bag.
    narrative_weight: 0.1

  - id: pocket_watch_silver
    name: Silver Pocket Watch
    description: A hunter-cased silver pocket watch on a fob chain. Engraved inside with a date and a set of initials.
    category: accessory
    value: 12
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [accessory, identity, heirloom]
    lore: The time matters here. Sir Edmund died between eleven and midnight, and everyone is sure of where they were.
    narrative_weight: 0.3

  # === MOORLAND / REMOTE-ESTATE GEAR (world-specific) ===
  - id: oilskin_coat
    name: Oilskin Coat
    description: A long waxed-canvas coat, stiffened by wear and weather. Smells faintly of paraffin. Keeps the moorland rain out.
    category: outerwear
    value: 8
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [outdoor, practical]
    lore: Sir Edmund walked the moors alone in weather that kept everyone else indoors. This is what he wore.
    narrative_weight: 0.3

  - id: storm_lantern
    name: Storm Lantern
    description: A tin-and-glass paraffin lantern with a wire guard, made to stay lit in wind that snuffs a candle. The light a body carries across the Hall's dark passages after the lamps are out.
    category: tool
    value: 4
    weight: 1.2
    rarity: common
    power_level: 1
    tags: [outdoor, light, practical]
    lore: When the weather closes in the Hall might as well be on an island, and the only honest light is the one you carry.
    narrative_weight: 0.2

  - id: ordnance_map
    name: Ordnance Survey Map
    description: A folded, linen-backed survey sheet of the moor and dale — Thornkirk, Millbridge, the Hall, and every footpath, beck, and bog between them.
    category: tool
    value: 3
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [navigation, investigation, outdoor]
    lore: The footpaths cross the moor where the carriages cannot. Who could have walked it unseen, and when, is written here in contour lines.
    narrative_weight: 0.4

  - id: stout_walking_boots
    name: Stout Walking Boots
    description: Nailed, dubbined leather boots built for peat and heather. The clay of the moor cakes the welts and dries a particular reddish brown.
    category: outerwear
    value: 5
    weight: 1.5
    rarity: common
    power_level: 0
    tags: [outdoor, practical, evidence]
    lore: The mud of the high moor is not the mud of the dale. The boots by the study door carried the wrong colour.
    narrative_weight: 0.4

  - id: railway_timetable
    name: Railway Timetable
    description: A printed Bradshaw for the Leeds branch line — three trains a day to Thornkirk Station, the last at six, every arrival and departure to the minute.
    category: document
    value: 1
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [investigation, travel, social]
    lore: The 4.15 was three minutes late that day, on account of the points at Calderbank. The timetable does not lie, even when the passengers do.
    narrative_weight: 0.4

  # === WILL, ESTATE & EVIDENCE (the heart of the mystery) ===
  - id: anonymous_letter
    name: The Anonymous Letter
    description: A single unsigned sheet, posted from London in a careful disguised hand, suggesting the death at the Hall was not what the certificate says.
    category: document
    value: 0
    weight: 0.1
    rarity: rare
    power_level: 3
    tags: [document, evidence, secret]
    lore: It came from someone in this house. That, more than what it says, is what frightens Lady Catherine.
    narrative_weight: 0.9

  - id: death_certificate
    name: Death Certificate
    description: A folded official form in Dr. Ashworth's hand — "heart failure" — signed and dated the morning after Sir Edmund died, and regretted a little more with every day since.
    category: document
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [document, evidence, medical, legal]
    lore: He saw something at the bedside that did not fit, and signed anyway. The signature is the doctor's confession waiting to be read.
    narrative_weight: 0.7

  - id: sealed_will
    name: The Sealed Will
    description: A folded testament under wax and red tape, kept in the solicitor's document case. Sir Edmund changed it six weeks before he died, and only Mr. Graves knows in whose favour.
    category: document
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal, secret]
    lore: The stakes are enormous and the contents unknown. Everyone under this roof has a reason to fear the seal being broken.
    narrative_weight: 0.9

  - id: document_case
    name: Solicitor's Document Case
    description: A brass-clasped leather case Mr. Graves carries from room to room and never leaves unattended; the key rides on his watch chain.
    category: tool
    value: 18
    weight: 2.5
    rarity: uncommon
    power_level: 2
    tags: [access, legal, professional, signature]
    lore: It holds the will, and instructions from Sir Edmund that predate the death. The case does not open to questions.
    narrative_weight: 0.6

  - id: family_bible
    name: Family Bible
    description: The Blackthorn record — births, deaths, marriages, in two hundred years of inked hands. The truth that cannot be forged.
    category: document
    value: 0
    weight: 2.0
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal]
    lore: A child's birth recorded — or pointedly not recorded — settles a question of parentage that may be the centre of the whole matter.
    narrative_weight: 0.8

  - id: parish_register
    name: Parish Register
    description: St. Michael's bound register of christenings and burials, kept by Rev. Lancaster, the parish's memory in his own scholarly hand.
    category: document
    value: 0
    weight: 2.5
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal]
    lore: He christened Rose. What he wrote, and what he was asked to leave out, is a confidence he can scarcely live with.
    narrative_weight: 0.7

  - id: ledger_book
    name: Mill Ledger
    description: A heavy clothbound ledger with marbled endpapers and double-entry columns — the true position of the three Blackthorn mills in Mr. Blackwood's careful hand.
    category: document
    value: 3
    weight: 1.5
    rarity: common
    power_level: 1
    tags: [finance, signature, business, evidence]
    lore: A debt called in and a payment made six weeks before the death point somewhere awkward. The columns add up; the lives behind them do not.
    narrative_weight: 0.5

  - id: study_key
    name: Study Key
    description: A heavy iron key to Sir Edmund's study — the room he locked at night, where the fire was burning and the brandy stood untouched on the desk.
    category: tool
    value: 0
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [access, evidence, family]
    lore: Who holds the spare key to a room a man locked against his own household is a question worth the asking.
    narrative_weight: 0.6

  - id: skeleton_key
    name: Skeleton Key
    description: Opens most standard locks in old houses. Possession is difficult to explain innocently.
    category: tool
    value: 10
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [access, stealth, criminal]
    lore: Mrs. Poole's chatelaine opens every door in the Hall by right. Anyone else's key has some explaining to do.
    narrative_weight: 0.4

  - id: brandy_decanter
    name: Brandy Decanter
    description: A cut-crystal decanter and the single glass poured the night Sir Edmund died — and left untouched on the study desk, which no one has been able to explain.
    category: consumable
    value: 6
    weight: 1.5
    rarity: uncommon
    power_level: 1
    tags: [social, evidence, vice]
    lore: A man does not pour himself a brandy and leave it. The colour of the dregs is a thing a careful doctor would notice.
    narrative_weight: 0.6

  # === DOCTOR'S KIT (carried over from genre) ===
  - id: gladstone_bag
    name: Gladstone Bag
    description: A black leather portmanteau with brass clasps and a hinged spine. The doctor's working bag — opens flat across a table, every instrument in its loop.
    category: tool
    value: 20
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [medical, access, professional, signature]
    lore: Dr. Ashworth's bag is never far from his hand, and it opens every door at the Hall. People do not ask what's inside.
    narrative_weight: 0.3

  - id: stethoscope
    name: Stethoscope
    description: Two rubber tubes, an ebonite chestpiece, the new binaural pattern from the medical journals. Hangs around the neck like a sign of office.
    category: tool
    value: 6
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [medical, diagnostic, signature]
    lore: The instrument that lets a doctor hear what the patient will not say.
    narrative_weight: 0.3

  - id: clinical_thermometer
    name: Clinical Thermometer
    description: A six-inch glass tube with a mercury bulb and a kink that holds the reading. Cased in a leather sleeve.
    category: tool
    value: 4
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [medical, diagnostic]
    lore: Six minutes under the tongue. The fever does not lie.
    narrative_weight: 0.2

  - id: iodine_tincture
    name: Tincture of Iodine
    description: A dark brown bottle with a stopper. Stings when applied, but cleans a wound that would otherwise turn.
    category: consumable
    value: 2
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [medical, antiseptic]
    lore: Modern medicine in a small bottle. Lister would approve.
    narrative_weight: 0.1

  - id: bandages_linen
    name: Linen Bandages
    description: A roll of clean white linen, boiled and folded. Enough to dress an arm or wrap a head.
    category: consumable
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [medical, dressing]
    lore: The first thing a doctor unrolls and the last thing he packs away.
    narrative_weight: 0.1

  - id: poison_test_kit
    name: Reinsch Test Kit
    description: A folding case of copper foil, a spirit lamp, and a few stoppered reagent bottles — the country doctor's means of testing a residue for arsenic without sending it to the city.
    category: tool
    value: 14
    weight: 1.0
    rarity: rare
    power_level: 3
    tags: [medical, investigation, professional, evidence]
    lore: A bright stain on the copper, and "heart failure" becomes a very different word. Dr. Ashworth owns one and has not, lately, dared to use it.
    narrative_weight: 0.7

  # === ECCLESIASTICAL KIT (carried over from genre) ===
  - id: prayer_book
    name: Book of Common Prayer
    description: Cloth-bound, ribbon-marked, signed inside the cover by the giver. The Church of England rite Rev. Lancaster reads at every grave in the churchyard.
    category: document
    value: 3
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [devotional, clergy]
    lore: He read it over Sir Edmund a fortnight before the player arrived. Some people read it. Some carry it. The difference shows.
    narrative_weight: 0.2

  - id: breviary
    name: Breviary
    description: A small leather-bound book of daily offices, worn smooth at the corners. The Anglican sort, English-printed.
    category: document
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [devotional, signature, clergy]
    lore: The vicar's daily office. Read on the train, at the bedside, between funerals.
    narrative_weight: 0.3

  - id: sermon_notebook
    name: Sermon Notebook
    description: A clothbound notebook, half-filled with Sunday outlines in a hand that becomes neater toward the back. Marginalia in pencil.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [clergy, writing]
    lore: A clergyman's working drafts. Some pages are crossed out savagely.
    narrative_weight: 0.2

  - id: communion_kit
    name: Portable Communion Kit
    description: A small mahogany case fitted with a pewter chalice, a screw-top paten, and a glass vial for wine. For house-calls and the dying.
    category: tool
    value: 12
    weight: 1.0
    rarity: uncommon
    power_level: 2
    tags: [clergy, signature, ritual]
    lore: Carried to bedsides where the parishioner cannot reach the parish church.
    narrative_weight: 0.4

  # === DETECTIVE / CONSTABLE KIT (carried over from genre) ===
  - id: magnifying_glass
    name: Magnifying Glass
    description: Brass and crystal. The detective's instrument — makes the invisible visible.
    category: tool
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [investigation, observation, professional]
    lore: The difference between looking and seeing.
    narrative_weight: 0.2

  - id: notebook_leather
    name: Pocket Notebook
    description: A small black leather notebook with a pencil loop. Lined paper, an elastic closure, the corners softened by a year in a coat pocket.
    category: document
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [writing, investigation]
    lore: Everything anyone has ever said in your presence, set down before it could be denied.
    narrative_weight: 0.2

  - id: fountain_pen
    name: Fountain Pen
    description: A black hard-rubber pen with a gold nib, refilled from a glass bottle. Leaks in the heat. Indispensable.
    category: tool
    value: 6
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [writing]
    lore: An honest record needs an honest pen. The pencil can be erased.
    narrative_weight: 0.1

  - id: whistle_brass
    name: Brass Police Whistle
    description: A two-tone Acme Thunderer on a chain. The shriek carries half a mile across the moor.
    category: tool
    value: 2
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [signal, constabulary, signature]
    lore: One long, two short — the constabulary's old code. Help arriving, a mile across the heather.
    narrative_weight: 0.2

  # === GOVERNESS / SCHOOLMISTRESS KIT (carried over from genre) ===
  - id: chalkboard_slate
    name: Slate and Chalk
    description: A schoolroom slate in a wooden frame, with a length of chalk in a silk wrap. Wipes clean with a damp cloth.
    category: tool
    value: 1
    weight: 0.8
    rarity: common
    power_level: 0
    tags: [teaching, signature]
    lore: Rose's slate, in Miss Fairfax's schoolroom above the study. A child draws what a child has seen.
    narrative_weight: 0.3

  - id: school_primer
    name: First Reader
    description: A small cloth-bound primer — the village school's standard text, dog-eared at the easier pages.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [teaching]
    lore: The book every child in the parish has cried over at some point.
    narrative_weight: 0.1

  # === EXPLORER / RETIRED OFFICER KIT (carried over from genre) ===
  - id: field_compass
    name: Field Compass
    description: A brass-cased prismatic compass in a worn leather pouch. The card still settles true.
    category: tool
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [navigation, signature, military]
    lore: Carried across two continents and back. Knows north better than its owner does — useful when the moor mist comes down.
    narrative_weight: 0.3

  - id: regimental_decorations
    name: Service Decorations
    description: A small ribbon bar in a velvet case — campaign medals, a clasp for India, another for the Cape. Worn on dress occasions, kept in a drawer otherwise.
    category: accessory
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 0
    tags: [military, social, identity]
    lore: The ribbon says where you were. The medal says what you did. The clasp says who else didn't come back.
    narrative_weight: 0.5

  - id: service_revolver
    name: Service Revolver
    description: A six-shot Webley in a leather flap-holster, oiled and kept. Heavier than a pocket pistol, far less subtle.
    category: weapon
    value: 30
    weight: 2.0
    rarity: uncommon
    power_level: 3
    tags: [ranged, firearm, military, signature]
    lore: The officer's sidearm, carried home from a place no one wants to talk about, and not surrendered since.
    narrative_weight: 0.6

  # === GENTRY / SOCIETY KIT ===
  - id: walking_stick
    name: Walking Stick
    description: Respectable accessory — and in a pinch, a weapon no one can object to your carrying.
    category: weapon
    value: 3
    weight: 1.0
    rarity: common
    power_level: 1
    tags: [melee, concealed, social, gentleman]
    lore: Every gentleman at the Hall carries one. The sword-cane variant costs considerably more.
    narrative_weight: 0.1

  - id: derringer
    name: Derringer
    description: Two shots and small enough to hide in a reticule or waistcoat. A last resort.
    category: weapon
    value: 15
    weight: 0.3
    rarity: uncommon
    power_level: 2
    tags: [ranged, firearm, concealed, one-handed]
    lore: Not a gentleman's weapon, which is exactly why it travels well to a house full of strangers.
    narrative_weight: 0.5

  - id: hip_flask
    name: Silver Hip Flask
    description: A pewter-and-silver flask, engraved with initials that may or may not be your own. Holds a respectable measure of whisky.
    category: consumable
    value: 4
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [social, vice]
    lore: Carried for the cold of the moor. Used for the conversation in the snug that should have been easier than it was.
    narrative_weight: 0.2

  - id: signet_ring
    name: Signet Ring
    description: A gold signet on the little finger, the family crest cut into the face — pressed into wax, it speaks with the family's authority.
    category: accessory
    value: 20
    weight: 0.1
    rarity: uncommon
    power_level: 1
    tags: [accessory, identity, family, social]
    lore: Captain Hale turns his restlessly when he is calculating. The seal on a letter is only as honest as the hand that holds the ring.
    narrative_weight: 0.4

starting_gold:
  # Pounds-denominated (matches currency block) and unchanged from the genre.
  # Calling names match this world's char_creation.yaml class_hints exactly,
  # so every chargen path arrives with pockets that can engage a low-level
  # social gate — a coach fare from the station, a round in the snug, a small
  # gratuity to a servant who knows something.
  Doctor: 30
  Clergyman: 15
  Detective: 12
  Society: 80
  Governess: 8
  Explorer: 25
  Industrialist: 120
