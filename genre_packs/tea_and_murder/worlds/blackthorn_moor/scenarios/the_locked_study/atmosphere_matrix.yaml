# Atmosphere variants for "The Locked Study".
# npc_mood_overrides key on scenario NPC id (see npcs.yaml).

variants:
  - id: low_gold_afternoon
    weather: "Low gold autumn light across brown-and-purple moor, the heather dying, the wind finding every gap in every window — rain by evening, as ever"
    setting_status: "house_in_careful_mourning"
    mood_baseline: "Composed grief with one wrong note sounding faintly beneath the courtesy"
    concurrent_event: null
    npc_mood_overrides:
      suspect_catherine: "perfectly composed, dry-eyed, one hand finding the locket and letting it go"
      suspect_ashworth: "grey and tired, declining the second glass and then taking it, not quite meeting an eye"

  - id: rain_off_the_moor
    weather: "The promised rain arrived off the moor, drumming the study's bay window, the fires lit in every room and none of them warming it"
    setting_status: "doors_shut_against_the_wet"
    mood_baseline: "Drawn-in and watchful — the household folded around its hearths, talking low, the reading one day nearer"
    concurrent_event: "Word comes that the county coroner has been wired about the London letter and may reopen the death"
    npc_mood_overrides:
      suspect_hale: "expansive by the fire, laughing a half-beat too soon, turning the signet ring faster than the talk warrants"
      suspect_poole: "upright and unvarying, the keys at her waist, her account smooth as a stone too long in a stream"
      suspect_graves: "dry, hedged, polishing his spectacles, the document case never once leaving his side"

  - id: the_moor_fog
    weather: "Dense fog rolling off the moor at dusk, the moor gate a grey suggestion, the standing stones gone, sound carrying strangely up to the Hall"
    setting_status: "the_house_gone_quiet_and_close"
    mood_baseline: "Hushed and close — the hour the study fire was built up, the kind of dark a second key was made for"
    concurrent_event: "Rose is found out of her bed on the gallery again, and Miss Fairfax takes her up without a word"
    npc_mood_overrides:
      witness_rose: "literal and unguarded, answering a beat late, watching to see whether the grown-up is a real one"
      suspect_fairfax: "very still, watchful, placing herself between the child and every question"
      witness_lancaster: "burdened and allusive, circling the vestry with scripture, longing to be asked the one right thing"
