# Character portraits for Blackthorn Moor
#
# Z-Image authoring per sidequest-content/PROMPTING_Z_IMAGE.md.
# Wardrobe phrased positively — Z-Image renders negations as additions
# ("no necktie" produces a necktie). Proper nouns avoided in prose —
# Z-Image renders them as image text. Genre positive_suffix carries the
# medium and the trailing safety clause; per-character text is descriptive.

characters:
  - name: Lady Blackthorn
    role: The Widow
    type: npc_major
    appearance: >-
      A striking adult woman in her mid-forties, fully clothed in deep
      mourning. Sharp cheekbones, pale grey eyes, dark hair streaked
      with silver swept up in a severe chignon. Black silk gown with a
      high collar, jet drop earrings, a small cameo brooch at the
      throat. Posture upright and composed, hands folded at the waist.
      A faint flush at the temples. Indoor candlelit setting, oil-
      painting chiaroscuro.
    culture_aesthetic: >-
      English Gentry, old money. Mid-1860s Parisian haute couture cut,
      family jewels rather than new pieces. Restrained, expensive,
      severe.

  - name: Captain Hale
    role: The Heir Presumptive
    type: npc_major
    appearance: >-
      A handsome adult man in his early thirties, sun-darkened
      complexion, restless hazel eyes, dark hair slightly too long, a
      heavy cavalry moustache. Fully clothed in a brown tweed Norfolk
      jacket and breeches, high wing-collar shirt with a loosely
      knotted silk cravat at the throat, polished riding boots. Stands
      with a faintly military bearing in a country-house drawing
      room. Indoor warm lamplight, oil-painting chiaroscuro.
    culture_aesthetic: >-
      1860s Anglo-Indian colonial returned — brown tweed Norfolk
      jacket, breeches, high wing collar with silk cravat, heavy
      cavalry moustache, sun-darkened skin from years abroad.

  - name: Mrs. Poole
    role: The Housekeeper
    type: npc_major
    appearance: >-
      A solid adult woman in her late fifties, fully clothed. Iron-
      grey hair pulled tight beneath a starched white linen cap. Sharp
      dark eyes, a face composed and unreadable. Severe black wool
      bombazine dress with a high collar and long sleeves, a ring of
      brass keys at her waist on a black ribbon. Strong capable
      hands. Stands with absolute authority in a below-stairs setting,
      copper pots and a bell board behind her, oil-painting
      chiaroscuro.
    culture_aesthetic: >-
      Servant Class at the highest rank — black bombazine dress as
      well-tailored as a mistress's mourning, crisp starched cap and
      apron, brass keys on a ribbon. Authority through propriety.

  - name: Miss Fairfax
    role: The Governess
    type: npc_major
    appearance: >-
      An adult young woman of twenty-four, fully clothed. Dark
      auburn hair pinned simply, watchful brown eyes, a slight furrow
      between the brows. Plain grey wool day dress with a high
      collar and long sleeves, modest white linen cuffs, a single
      small locket at the throat. Small hands faintly stained with
      ink. Quiet composed posture. Indoor afternoon light through a
      tall window, oil-painting chiaroscuro.
    culture_aesthetic: >-
      Clergy-background governess of the 1860s — plain grey wool
      day dress, high collar, simple pinned hair, a single small
      locket. Modesty by deliberate choice.

  - name: Mr. Graves
    role: The Solicitor
    type: npc_major
    appearance: >-
      A thin adult man of fifty, fully clothed. Clean-shaven, grey
      at the temples, pale blue eyes, a face like a closed ledger.
      Black frock coat with silk lapels over a grey waistcoat, high
      wing-collar shirt with a black silk cravat, dark trousers.
      Pince-nez on a gold chain hanging at the lapel. Long precise
      fingers resting on a leather document case with brass clasps.
      Indoor lamp-lit setting, oil-painting chiaroscuro.
    culture_aesthetic: >-
      1860s London Professional — black frock coat with silk lapels,
      grey waistcoat, high wing collar with silk cravat, pince-nez
      on a gold chain. Mid-Victorian solicitor's dress.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS (18)
  # Pre-generated sample faces for the chargen portrait chooser. Each
  # entry carries a `backdrop_poi` naming a real rendered POI slug from
  # this world's R2 assets; the daemon's portrait-in-location preset
  # plants the subject inside that POI behind a long telephoto lens.
  #
  # DISCIPLINE: `appearance` is PHYSICAL face/upper-body ONLY — no POI
  # scene prose (a second wide-scene description triggers the Z-Image
  # split montage). Period-true mid-Victorian c.1860s West Riding,
  # cosy-mystery register; period dress described only at the collar.
  # `culture` = culture filename stem; `archetype` = real world Calling
  # (classes.yaml display_name). 9M / 9F across all three cultures
  # (6 pickers per culture).
  #
  # NOTE on period: the world's cultures/ and visual_style.yaml fix the
  # setting as Mid-Victorian Yorkshire c.1860s, NOT Edwardian. These
  # pickers follow the authored world content, not the pack's
  # cosy-Edwardian framing.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · English Gentry ────────────────────────────────────

  - id: picker_english_gentry_society_f01
    name: picker english gentry society f01
    role: Society Lady
    type: player_picker
    culture: english_gentry
    archetype: Society
    sex: female
    backdrop_poi: the_drawing_room
    appearance: >-
      Woman, late twenties. Fine oval county face, fair smooth skin, a
      cool grey-blue gaze that has been watched by the parish all her
      life. Chestnut hair in a centre parting drawn low and smooth over
      the ears, a fine gold locket and a jet brooch at a high lace
      collar. A composed, unhurried mouth.

  - id: picker_english_gentry_society_m01
    name: picker english gentry society m01
    role: County Gentleman
    type: player_picker
    culture: english_gentry
    archetype: Society
    sex: male
    backdrop_poi: the_drawing_room
    appearance: >-
      Man, forties. Long well-bred face, clean-shaven but for trim
      side-whiskers down the cheeks, pale even complexion, steady
      hazel eyes under level brows. Dark hair brushed back from a high
      forehead. A dark silk waistcoat and a high knotted cravat at the
      stock. The studied dignity of old money.

  - id: picker_english_gentry_explorer_m01
    name: picker english gentry explorer m01
    role: Returned Colonial Officer
    type: player_picker
    culture: english_gentry
    archetype: Explorer
    sex: male
    backdrop_poi: the_moor_gate
    appearance: >-
      Man, early forties. Sun-darkened weather-cured face, restless
      grey eyes, a heavy cavalry moustache going iron at the edges.
      Dark hair worn a shade too long over the collar. A brown tweed
      lapel and a loosely knotted silk neckcloth at the throat. A
      faintly military set to the jaw, watchful and unstill.

  - id: picker_english_gentry_explorer_f01
    name: picker english gentry explorer f01
    role: Lady Traveller
    type: player_picker
    culture: english_gentry
    archetype: Explorer
    sex: female
    backdrop_poi: the_moor_gate
    appearance: >-
      Woman, thirties. Tanned weather-freckled face uncommon in a
      lady, frank dark eyes, a strong straight nose. Dark hair pinned
      practically back rather than dressed, loose at the temples from
      the wind. A high-collared travelling bodice and a plain jet stud
      at the throat. An open, undaunted look.

  - id: picker_english_gentry_doctor_m01
    name: picker english gentry doctor m01
    role: Country Doctor
    type: player_picker
    culture: english_gentry
    archetype: Doctor
    sex: male
    backdrop_poi: the_study
    appearance: >-
      Man, fifties. Lined conscientious face, grey at the temples,
      kind tired eyes deep-set behind small wire spectacles.
      Clean-shaven jaw, a slightly stooped neck. A dark frock-coat
      lapel over a grey waistcoat and a high wing collar with a black
      cravat. The careworn gravity of a man who signs certificates.

  - id: picker_english_gentry_clergyman_f01
    name: picker english gentry clergyman f01
    role: Vicar's Daughter
    type: player_picker
    culture: english_gentry
    archetype: Clergyman
    sex: female
    backdrop_poi: the_church_vestry
    appearance: >-
      Woman, mid-twenties. Pale earnest face, a slight furrow of worry
      between fair brows, clear grey eyes. Light brown hair parted in
      the centre and drawn smoothly back. A plain high-necked bodice
      with a small white collar and a single thin gold cross at the
      throat. Quiet, principled, watchful.

  # ── Picker · Household Staff ────────────────────────────────────

  - id: picker_household_staff_governess_f01
    name: picker household staff governess f01
    role: The Governess
    type: player_picker
    culture: household_staff
    archetype: Governess
    sex: female
    backdrop_poi: the_servants_hall
    appearance: >-
      Woman, twenty-four. Composed watchful face, auburn hair pinned
      simply and severely back, brown eyes that read hands before
      faces. A plain grey high-collared day bodice with modest white
      linen cuffs and a small locket at the throat. Ink faint at one
      fingertip. The careful poise of someone neither family nor staff.

  - id: picker_household_staff_governess_f03
    name: picker household staff governess f03
    role: The Nursery Governess
    type: player_picker
    culture: household_staff
    archetype: Governess
    sex: female
    backdrop_poi: the_drawing_room
    appearance: >-
      Young woman, late twenties. Lean scholarly face, pale from indoor
      hours, light brown hair pinned plainly back, mild short-sighted
      eyes behind small spectacles. A thin patient mouth. A plain dark
      high-necked bodice and a stiff narrow collar without ornament.
      The discreet, faintly anxious bearing of an educated dependent.

  - id: picker_household_staff_detective_m01
    name: picker household staff detective m01
    role: The Butler
    type: player_picker
    culture: household_staff
    archetype: Detective
    sex: male
    backdrop_poi: the_servants_hall
    appearance: >-
      Man, late fifties. Smooth impassive face scrubbed and composed,
      iron-grey hair flat to the skull, clean-shaven, pale eyes that
      have learned to see everything and show nothing. An upright neck,
      a dark tailcoat collar and a stiff white wing collar above it.
      Authority worn as perfect, unreadable discretion.

  - id: picker_household_staff_governess_f02
    name: picker household staff governess f02
    role: The Housemaid
    type: player_picker
    culture: household_staff
    archetype: Governess
    sex: female
    backdrop_poi: the_servants_hall
    appearance: >-
      Young woman, early twenties. Fresh scrubbed face, a scatter of
      freckles, quick observant blue eyes she keeps lowered. Brown hair
      pinned severely back beneath a crisp frilled white cap, a
      high-necked dark stuff bodice under the white edge of an apron
      bib. A discreet, watchful stillness about the mouth.

  - id: picker_household_staff_society_f01
    name: picker household staff society f01
    role: The Housekeeper
    type: player_picker
    culture: household_staff
    archetype: Society
    sex: female
    backdrop_poi: the_drawing_room
    appearance: >-
      Woman, late fifties. Solid composed unreadable face, sharp dark
      eyes, iron-grey hair pulled tight beneath a starched white linen
      cap. A high-collared black bombazine bodice as well-cut as a
      mistress's mourning, a fine chain at the throat. The absolute
      quiet authority of thirty years below stairs.

  - id: picker_household_staff_clergyman_m01
    name: picker household staff clergyman m01
    role: The Verger
    type: player_picker
    culture: household_staff
    archetype: Clergyman
    sex: male
    backdrop_poi: the_church_vestry
    appearance: >-
      Man, sixties. Weathered humble face, a fringe of white whisker
      under the jaw, pouched kindly eyes, bald crown ringed with grey.
      Clean upper lip. A plain dark coat buttoned high and a soft low
      collar. The patient, deferential bearing of a man who has tended
      one parish church his whole life.

  # ── Picker · Mill Folk ──────────────────────────────────────────

  - id: picker_mill_folk_industrialist_m01
    name: picker mill folk industrialist m01
    role: The Mill Owner
    type: player_picker
    culture: mill_folk
    archetype: Industrialist
    sex: male
    backdrop_poi: the_mill_office
    appearance: >-
      Man, fifties. Broad self-made face, heavy jaw, shrewd pale eyes
      that price a stranger in a glance. Dark hair greying at the
      sides, mutton-chop whiskers, a clean upper lip. A dark serge
      sack-coat lapel over a watch-chained waistcoat, a hard plain
      collar. Brisk, plain-spoken, faintly defiant of the old county.

  - id: picker_mill_folk_industrialist_f01
    name: picker mill folk industrialist f01
    role: The Mill Mistress
    type: player_picker
    culture: mill_folk
    archetype: Industrialist
    sex: female
    backdrop_poi: the_mill_office
    appearance: >-
      Woman, forties. Strong plain handsome face, ruddy from the
      valley air, direct grey eyes, a firm set mouth. Brown hair drawn
      back smooth under a plain dark bonnet brim. A good dark
      printed-cotton high-necked bodice, a watch on a chain at the
      breast. The brisk capable bearing of new money that runs itself.

  - id: picker_mill_folk_detective_m01
    name: picker mill folk detective m01
    role: Village Constable
    type: player_picker
    culture: mill_folk
    archetype: Detective
    sex: male
    backdrop_poi: the_blackthorn_arms
    appearance: >-
      Man, late thirties. Square dependable face, soot-pale skin,
      level brown eyes slow to give anything away, a short clipped
      moustache. Dark hair cropped close. A dark serge tunic collar
      buttoned to the throat. The methodical, unhurried look of a man
      who knows which lies are habitual and which are new.

  - id: picker_mill_folk_society_f01
    name: picker mill folk society f01
    role: The Postmistress
    type: player_picker
    culture: mill_folk
    archetype: Society
    sex: female
    backdrop_poi: the_blackthorn_arms
    appearance: >-
      Woman, fifties. Sharp tidy birdlike face, quick knowing eyes
      behind small steel spectacles, a thin attentive mouth. Greying
      brown hair pinned neat under a plain cap. A high-collared dark
      stuff bodice with a small brooch at the throat. The alert,
      all-seeing poise of someone every letter passes through.

  - id: picker_mill_folk_doctor_m01
    name: picker mill folk doctor m01
    role: Veterinary Surgeon
    type: player_picker
    culture: mill_folk
    archetype: Doctor
    sex: male
    backdrop_poi: the_moor_gate
    appearance: >-
      Man, forties. Broad ruddy outdoor face, wind-chapped, frank blue
      eyes, sandy hair and a short practical beard. Big capable
      weather-roughened look about the jaw. A heavy tweed lapel over a
      flannel collar and a plain neckcloth. The unfussed, plain-handed
      bearing of a man who works in every byre on the moor.

  - id: picker_mill_folk_clergyman_m01
    name: picker mill folk clergyman m01
    role: Chapel Minister
    type: player_picker
    culture: mill_folk
    archetype: Clergyman
    sex: male
    backdrop_poi: the_church_vestry
    appearance: >-
      Man, fifties. Plain earnest soot-pale face, deep lines of
      conscience, dark steady eyes, clean-shaven. Thinning dark hair
      combed flat. A plain black Nonconformist coat buttoned high with
      a low soft collar, no ornament at all. The attentive, patient,
      harder-than-he-looks composure of a chapel man.
