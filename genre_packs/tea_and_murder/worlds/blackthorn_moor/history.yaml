world_name: Blackthorn Moor

chapters:
  - id: fresh
    name: "The Arrival"
    session_range: [1, 5]
    maturity: FRESH
    description: >-
      The player arrives at Blackthorn Hall. The household is in mourning —
      or performing mourning. First impressions form. The official story is
      presented. Small cracks appear if you know where to look.
    character_progression:
      level_range: [1, 2]
      expected_items:
        - calling cards
        - a letter of introduction
      expected_relationships:
        - Miss Fairfax (cautious ally)
        - Mrs. Poole (gatekeeper)
        - Captain Hale (friendly, curious about your purpose)
    active_quests:
      - "Establish yourself in the household"
      - "Learn the official account of Sir Edmund's death"
      - "Identify who is nervous about your presence"
    discovered_lore:
      - "The Blackthorn fortune comes from cotton mills"
      - "Lady Blackthorn was a Grenville — married beneath her"
      - "Sir Edmund had a ward named Rose"
    points_of_interest:
      - name: "The Study"
        slug: the_study
        region: the_study
        type: study
        description: >-
          Oak-panelled, book-lined, facing the moors through a bay window.
          Sir Edmund's desk is as he left it — papers squared, pen in its
          rest, a glass of brandy that was never drunk. The fireplace has
          been cleaned since the night in question, but the rug shows a
          faint stain near the desk that the housekeeper has not quite
          managed to remove. The room smells of pipe tobacco and old paper.
        visual_prompt:
          solo: >-
            Wide interior establishing view of an oak-panelled
            gentleman's study, empty of people. Foreground: a heavy
            partners desk with papers squared on the blotter, a pen in
            its rest, and a glass of brandy untouched on a silver tray,
            a worn rug below showing a faint dark stain near the desk
            leg. Middle ground: floor-to-ceiling book-lined shelves in
            dark wood, a pipe rack and tobacco jar, a stone fireplace
            with cold grey ash. Background: a deep bay window framing
            open moorland under a low turbulent sky, rain streaking the
            glass. Cold dim daylight, a single oil lamp barely warming
            the dark.
          backdrop: >-
            Dim oak-panelled study with book-lined shelves, a heavy
            desk by a cold hearth, a bay window onto grey moorland
            beyond, lit by one low oil lamp against the gloom.
        environment:
          solo: >-
            Cold flat moor-light from the bay window, a single oil lamp
            casting a small pool of warm umber against deep shadow, the
            scent of stale pipe tobacco and old paper, rain ticking on
            the glass, the deadened hush of a room left exactly as it
            was, a sense of recent absence.
          backdrop: >-
            Cold lamp-lit gloom, pipe-smoke and old paper, the hush of
            recent absence.
      - name: "The Drawing Room"
        slug: the_drawing_room
        region: the_drawing_room
        type: drawing_room
        description: >-
          South-facing, warm in the afternoon, furnished in the taste of
          the previous generation — heavy curtains in faded rose, a piano
          nobody plays, family portraits in gilt frames. This is where the
          household gathers after dinner. The conversations are careful.
          The silences are louder.
        visual_prompt:
          solo: >-
            Wide interior establishing view of a south-facing Victorian
            drawing room, empty of people. Foreground: a low table set
            with a cooling tea service and a stiff arrangement of cut
            heather and chrysanthemums. Middle ground: heavy curtains
            in faded rose silk drawn half across tall windows, a closed
            piano in the corner with no music on its stand, upholstered
            chairs arranged for a conversation that has ended.
            Background: a wall of family portraits in tarnished gilt
            frames, a cold marble mantel. Thin grey daylight through
            rain-washed glass, dust motes hanging in the still air.
          backdrop: >-
            Faded Victorian drawing room with rose-silk curtains, a
            silent corner piano and gilt-framed portraits on the wall,
            a cold tea service on a low table, thin grey light through
            tall rain-washed windows.
        environment:
          solo: >-
            Thin grey afternoon light catching dust motes in still air,
            a faint chill the dying fire never quite lifts, the scent of
            cold tea and old upholstery, the heavy hush of a room used
            to careful talk and longer silences, rain murmuring at the
            windows.
          backdrop: >-
            Thin grey light, dust and cold tea, the hush of careful
            silences.
      - name: "The Moor Gate"
        slug: the_moor_gate
        region: the_moor_gate
        type: gate
        description: >-
          A wooden gate in the garden wall, opening directly onto the moor.
          The latch is worn smooth. This was Sir Edmund's private exit —
          he walked out here every evening regardless of weather. The path
          beyond is a single track through heather, climbing toward the
          ridge. The view is enormous and empty. The wind tastes of peat.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a weathered wooden gate set
            in a low stone garden wall, opening directly onto open
            moorland, no people. Foreground: the grey timber gate ajar
            on iron hinges, its latch worn smooth and silver, a muddy
            single track passing through. Middle ground: brown heather
            and bracken turning gold sweeping up a long bare slope,
            sheep-cropped grass bent flat by wind. Background: a stark
            ridge crowned with leaning standing stones on the horizon
            under a vast turbulent grey sky split by a single shaft of
            cold golden light. Wind-scoured, isolated, immense.
          backdrop: >-
            A weathered wooden gate ajar in a low stone wall opening
            onto bare heather moorland, a single track climbing toward
            standing stones on a far ridge under a vast turbulent grey
            sky.
        environment:
          solo: >-
            Hard cold wind dragging across open moor, a single shaft of
            low golden light breaking through racing cloud, the peat-and-
            heather tang of wet upland air, the lonely creak of the gate
            on its hinges, the immense empty hush of a place where the
            wind is the only voice.
          backdrop: >-
            Cold moor wind, peat and heather, a single shaft of golden
            light over emptiness.

  - id: early
    name: "The Investigation"
    session_range: [6, 12]
    maturity: EARLY
    description: >-
      The cracks widen. Contradictions emerge. Alliances shift. The player
      is no longer a guest but a presence the household cannot ignore. The
      will reading approaches and everyone is calculating.
    character_progression:
      level_range: [3, 4]
      expected_items:
        - the burned letter fragment
        - a key to a room that matters
        - the doctor's confidence
      expected_relationships:
        - Miss Fairfax (trusted ally)
        - Dr. Ashworth (conflicted informant)
        - Lady Blackthorn (wary adversary or surprising ally)
        - Rose (child who sees everything)
    active_quests:
      - "Reconstruct the timeline of October the fourteenth"
      - "Identify what the doctor is hiding"
      - "Find out why the will was changed"
      - "Protect Miss Fairfax and the evidence"
    discovered_lore:
      - "The mill fire of 1852 has echoes in the present"
      - "Sir Edmund changed his will six weeks before his death"
      - "Captain Hale arrived earlier than he claims"
      - "Rose may not be who the household says she is"
    points_of_interest:
      - name: "The Solicitor's Room"
        slug: the_solicitors_room
        region: the_solicitors_room
        type: office
        description: >-
          A guest bedroom on the first floor, converted into a temporary
          office. Mr. Graves has arranged his papers with legal precision.
          The locked document case sits on the desk, brass clasps catching
          the firelight. He takes it with him when he leaves the room. He
          always locks the door. The key is on his watch chain.
        visual_prompt:
          solo: >-
            Wide interior establishing view of a guest bedroom converted
            into a temporary office, empty of people. Foreground: a small
            writing desk with papers stacked in rigid legal precision, a
            locked leather document case with brass clasps catching the
            firelight, an ink-stand and a stick of red sealing wax to
            hand. Middle ground: a narrow fireplace with low embers and
            a single hard armchair drawn close, a made-up bed pushed to
            the wall and pressed into service as a side table.
            Background: heavy curtains drawn tight against the night, a
            washstand in shadow. Cold candlelit gloom, firelight pooling
            on brass.
          backdrop: >-
            A cramped guest room turned office, a writing desk with a
            brass-clasped document case, a low fire and a single chair,
            curtains drawn against the dark, lit by candle and embers.
        environment:
          solo: >-
            Low firelight and a single guttering candle picking out
            brass clasps in the dark, curtains drawn against drumming
            rain, the dry scent of legal paper and warm sealing wax, the
            close airless hush of a room kept locked, the small tick of
            embers settling in the grate.
          backdrop: >-
            Firelight on brass, sealing wax and locked paper, the close
            hush of a guarded room.
      - name: "The Servants' Hall"
        slug: the_servants_hall
        region: the_servants_hall
        type: servants_hall
        description: >-
          Below stairs — the long table where the staff take their meals,
          the bell board connecting every room upstairs, the back stairs
          that allow invisible movement through the house. Mrs. Poole
          presides from the head of the table. The younger servants gossip
          when she's not listening. The older ones know better.
        visual_prompt:
          solo: >-
            Wide interior establishing view of a below-stairs servants'
            hall and kitchen, empty of people. Foreground: a long
            scrubbed deal table flanked by plain benches, a single tallow
            candle and a household ledger left open at the head place.
            Middle ground: a wall-mounted bell board with rows of labels
            and idle bell-cranks, copper pots and pans hung in graded
            ranks on iron hooks, a black cast-iron range warm with a
            kettle. Background: a narrow flight of back stairs vanishing
            up into the dark of the house, a stone-flagged floor.
            Low, close, candle-and-firelight, the cool of below-ground.
          backdrop: >-
            A scrubbed below-stairs hall, a long deal table by a warm
            iron range, copper pans and a labelled bell board on the
            wall, back stairs climbing into the dark, lit low by candle
            and fire.
        environment:
          solo: >-
            Close warm range-heat against the cool of below-ground stone,
            a single tallow candle and the red glow of the fire, the
            scent of baking bread and tallow and washed flagstones, the
            distant jangle of a summons bell, the watchful low murmur of
            a room that hears everything and repeats little.
          backdrop: >-
            Range-heat and tallow, baking bread, the watchful murmur of
            below-stairs.
      - name: "The Blackthorn Arms"
        slug: the_blackthorn_arms
        region: the_blackthorn_arms
        type: inn
        description: >-
          The village pub — low ceilings, a fire that's never out, and
          the publican who has served every family in the parish their
          worst moments. The mill workers drink here after shift. The
          gossip is better than any investigation — if you know how to
          listen without looking like you're listening.
        visual_prompt:
          solo: >-
            Wide elevated landscape view of a low Yorkshire village pub
            at dusk in autumn, no people. Foreground: a wet cobbled lane
            running before the building, dark gutters choked with fallen
            leaves, a worn stone step at the door. Middle ground: a
            squat grey-stone pub with a heavy slate roof, small mullioned
            windows glowing low amber, a weathered painted signboard on
            an iron bracket, a single chimney trailing smoke into the
            damp. Background: terraced grey cottages climbing a hillside
            and a square church tower against a bruised purple-grey
            evening sky. Cold blue dusk against warm window-light.
          backdrop: >-
            A squat grey-stone village pub at dusk, small windows glowing
            amber, a painted signboard on an iron bracket, a chimney
            smoking over wet cobbles, grey cottages and a church tower
            rising behind under a bruised evening sky.
        environment:
          solo: >-
            Cold blue dusk pressing against warm amber window-light, a
            fine drizzle haloing the glow, the mingled scent of peat-
            smoke, spilled ale, and wet wool, the muffled rumble of low
            talk and a fiddle from within, the damp hush of a village
            lane after the day's last shift.
          backdrop: >-
            Cold dusk and warm windows, peat-smoke and ale, low talk
            against the drizzle.

  - id: mid
    name: "The Reckoning"
    session_range: [13, 25]
    maturity: MID
    description: >-
      The will is read. The truth about Rose changes everything. The
      investigation reaches its crisis — evidence is threatened, alliances
      collapse, and someone makes a desperate move. The player must choose
      who to protect and who to expose.
    character_progression:
      level_range: [5, 6]
      expected_items:
        - the complete truth about the death
        - the will's contents
        - leverage over at least one suspect
      expected_relationships:
        - Deep trust or enmity with most NPCs
        - Rose (protector or betrayer of her secret)
        - The killer (identified, cornered, and dangerous)
    active_quests:
      - "The will is read — manage the fallout"
      - "Identify the killer conclusively"
      - "Decide what to do with the truth"
      - "Protect the vulnerable — Rose, Miss Fairfax, the doctor"
    discovered_lore:
      - "The full contents of the will"
      - "Rose's true parentage"
      - "What Sir Edmund confessed to the vicar"
      - "Who entered the study after Mrs. Poole"
    points_of_interest:
      - name: "The Church Vestry"
        slug: the_church_vestry
        region: the_church_vestry
        type: vestry
        description: >-
          A small stone room behind the altar, cold even in summer. The
          parish registers line one wall — births, marriages, deaths in
          copperplate going back centuries. A table, a chair, and a sense
          of weight. This is where Sir Edmund came the week before he
          died. This is where he told the vicar something that the vicar
          cannot repeat.
        visual_prompt:
          solo: >-
            Wide interior establishing view of a small stone church
            vestry behind the altar, empty of people. Foreground: a
            plain dark-oak table with a closed parish register, an
            ink-stand, and a single unlit candle stub, one hard chair
            drawn up to it. Middle ground: a long wall of leather-bound
            parish registers ranked on bare stone shelves, spines worn
            pale with age, a vestment hook bearing a black cassock.
            Background: a narrow lancet window of plain leaded glass set
            deep in cold grey ashlar, a low arched door to the chancel.
            Dim cold daylight, deep stone-blue shadow, an air of weight
            and silence.
          backdrop: >-
            A cold stone vestry behind the altar, a wall of leather
            parish registers on bare shelves, a plain oak table and one
            chair beneath a deep lancet window, dim and grey and silent.
        environment:
          solo: >-
            Cold flat light through a deep lancet window, the chill of
            old stone that summer never reaches, the scent of candle-wax
            and damp leather and centuries of paper, the deep churchyard
            hush broken only by the settle of the building, a sense of
            confessional weight pressing on the room.
          backdrop: >-
            Cold stone chill, wax and old leather, the deep hush of a
            room that keeps secrets.
      - name: "The Mill Office"
        slug: the_mill_office
        region: the_mill_office
        type: mill_office
        description: >-
          Sir Edmund's office at the Millbridge works — plainer than the
          study at the Hall, functional, with ledgers and correspondence
          files. The foreman keeps it locked. The account books tell a
          story that the household version omits — payments made, debts
          called in, a transaction six weeks before the death that
          shouldn't be there.
        visual_prompt:
          solo: >-
            Wide interior establishing view of a plain Victorian cotton
            mill office, empty of people. Foreground: a worn deal desk
            with heavy bound account ledgers stacked square, a steel
            pen and a cold cup, a single ledger left open to ranked
            columns of figures. Middle ground: a tall iron-framed window
            grey with mill-dust looking down onto a cobbled yard, a wall
            of pigeonhole shelves crammed with correspondence files and
            spiked invoices, a cast-iron stove cold in the corner.
            Background: a glazed inner door onto the clattering shop
            floor beyond, a framed mill plan on bare brick. Cold
            north-light, soot-grey shadow, functional and unsentimental.
          backdrop: >-
            A plain mill office of bound ledgers and pigeonholed files,
            a worn deal desk by a dust-grey window onto a cobbled yard,
            a cold iron stove and bare brick walls, lit cold and grey.
        environment:
          solo: >-
            Cold flat north-light through a dust-grimed window, the
            soot-and-machine-oil tang of the works drifting in, the
            muffled clatter and thump of looms through the wall, the dry
            scent of ink and bound paper and cold ash, the unsentimental
            hush of a room where money is counted and nothing is said.
          backdrop: >-
            Cold grey light, machine-oil and ledger-ink, the muffled
            thump of looms through the wall.
