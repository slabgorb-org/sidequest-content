# Blackthorn Moor — world bestiary
#
# World-tier override on the tea_and_murder pack. This is a cosy British
# murder-mystery: genre = rulebook, world owns the cast, and the cast is
# human. There are NO monsters. By doctrine this bestiary is intentionally
# MOSTLY EMPTY — only the handful of mundane West Riding Yorkshire creatures
# that could plausibly matter on a moor estate: a startled farm animal, a
# moorland snake, a working dog, vermin. All are real, low-level (0-1)
# animals; none is an "encounter" so much as a hazard or an atmosphere.
#
# Stat lines follow the SRD generic form used pack-wide. Mundane animals sit
# at the floor of the ladder (level 1), hp == average (4.5/HD), ascending AC,
# morale on the 2d12 ladder. Body discovery and harm in this genre stay off-stage and tidy;
# these creatures exist for texture and the rare "the bull is in the field"
# obstacle, not for bloodshed.
entries:
  - id: moor_adder
    name: Moorland Adder
    level: 1
    hp: 2
    armor_class: 12
    attack_bonus: 0
    damage: "1d2"
    move: "10 ft."
    morale: 4
    skill: 0
    save: 16
    role: venomous moorland snake
    tags: [beast, vermin]
    abilities:
      - "Venomous bite — a struck victim sickens; a country doctor and a quiet week, not a coffin"
      - "Shy — flees a heavy footfall and only strikes when trodden on or cornered"
    description: >-
      Britain's only venomous snake, a zigzag-backed adder basking on a warm
      stone among the dying heather. It wants nothing to do with anyone and
      slides away from a boot — but a hand reaching blind into the bracken,
      or a foot set wrong on the ridge path, can earn a strike worth a fright
      and a fortnight abed.
  - id: estate_sheepdog
    name: Estate Sheepdog
    level: 1
    hp: 4
    armor_class: 12
    attack_bonus: 1
    damage: "1d4"
    move: "40 ft."
    morale: 8
    skill: 1
    save: 15
    role: working farm and yard dog
    tags: [beast, dog]
    abilities:
      - "Guards the yard — raises a din at any stranger near the outbuildings after dark"
    description: >-
      A lean black-and-white collie off the home farm, bred to the whistle and
      the moor. Friendly to the household and wary of outsiders, it knows every
      path on the estate and every face that belongs on it — and it will not
      stop barking at the one that doesn't.
  - id: agitated_farm_bull
    name: Agitated Farm Bull
    level: 1
    hp: 6
    armor_class: 11
    attack_bonus: 2
    damage: "1d8"
    move: "40 ft."
    morale: 7
    skill: 0
    save: 15
    role: bad-tempered pasture bull
    tags: [beast, livestock]
    abilities:
      - "Charge — an open run at an intruder bowls them over and tramples"
    description: >-
      A short-tempered shorthorn bull penned in the home-farm pasture, all
      muscle and suspicion. No villain, only an obstacle with horns: the field
      between the Hall and the village is his, and a stranger crossing it in a
      hurry will learn that the long way round the wall was always the wiser one.
  - id: barn_rat
    name: Barn Rat
    level: 1
    hp: 1
    armor_class: 11
    attack_bonus: 0
    damage: "1d2"
    move: "20 ft."
    morale: 5
    skill: 0
    save: 16
    role: outbuilding vermin
    tags: [beast, vermin]
    abilities:
      - "Skulks — lives in the granary, the cellar, and the disused wing nobody airs"
    description: >-
      A brown rat fattening in the granary and the back stairs, the kind every
      old house keeps and no housekeeper admits to. Harmless on its own and
      gone in a flash of grey, it is worth a scream from a maid and a note for
      the noticing eye: things move in the rooms the family no longer uses.
