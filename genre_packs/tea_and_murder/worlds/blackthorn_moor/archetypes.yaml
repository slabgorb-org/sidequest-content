# World-specific NPCs — extends genre archetypes
# These are the suspects, witnesses, and allies of Blackthorn Moor

- name: Lady Blackthorn
  named_individual: true
  description: >-
    The widow. Composed to the point of unnervingness. Manages the household
    with flawless efficiency and has not been seen to weep. The county admires
    her dignity. The servants wonder what it costs. She was a Grenville before
    she was a Blackthorn, and she has never let anyone forget it.
  personality_traits:
    - composed
    - proud
    - strategically gracious
  typical_classes:
    - Society
  typical_races:
    - Gentry
  stat_ranges:
    Pride: [16, 18]
    Nerve: [14, 16]
    Cunning: [14, 16]
  inventory_hints:
    - a ring of household keys she never relinquishes
    - mourning jet at her throat
    - a letter she keeps in her writing desk, locked
  dialogue_quirks:
    - redirects uncomfortable questions with impeccable hospitality — "More tea?"
    - refers to Sir Edmund in the past tense with practiced ease
  disposition_default: 0
  secret: "The marriage was a transaction, not a love match. She has been planning her freedom for years."

- name: Captain Hale
  named_individual: true
  description: >-
    Sir Edmund's nephew, recently returned from India. Handsome, charming,
    and badly in debt — the kind of debt that follows you from Calcutta to
    Yorkshire. He needs the inheritance and he needs it soon. His warmth is
    genuine but his desperation is growing.
  personality_traits:
    - charming
    - restless
    - increasingly desperate
  typical_classes:
    - Explorer
  typical_races:
    - Colonial
  stat_ranges:
    Humour: [14, 16]
    Passion: [14, 16]
    Nerve: [12, 14]
  inventory_hints:
    - a military service revolver he shouldn't still have
    - letters from creditors, unopened
    - a signet ring he pawned and redeemed twice
  dialogue_quirks:
    - laughs a beat too late, as though performing ease
    - uses Hindi words without noticing, then corrects himself
  disposition_default: 15
  secret: "He arrived at the Hall two days before he claims. He was in the house the night Edmund died."

- name: Mr. Graves
  named_individual: true
  description: >-
    The solicitor from Leeds. Precise, unreadable, and in possession of a
    locked document case that he will not let out of his sight. He has
    served the Blackthorn family for fifteen years and knows where every
    number leads. His loyalty is to the law, not to the family — and
    the law has surprises.
  personality_traits:
    - meticulous
    - discreet
    - quietly unyielding
  typical_classes:
    - Detective
  typical_races:
    - Trade
  stat_ranges:
    Cunning: [16, 18]
    Nerve: [14, 16]
    Pride: [12, 14]
  inventory_hints:
    - a locked leather document case
    - a pocket watch checked with habitual frequency
    - spectacles he removes when he wants to look directly at someone
  dialogue_quirks:
    - pauses before answering any question, as though weighing admissibility
    - says "I am not at liberty to discuss that" with the finality of a locked door
  disposition_default: -5
  secret: "Sir Edmund changed his will six weeks before his death. The new will is in the case."

- name: Dr. Ashworth
  named_individual: true
  description: >-
    The local doctor. Trusted by the entire parish, overworked, and carrying
    the weight of a signature he now doubts. He signed the death certificate
    at midnight by candlelight, after Lady Blackthorn told him Edmund had
    complained of chest pains that evening. He did not perform a thorough
    examination. He has been sleeping badly since.
  personality_traits:
    - conscientious
    - troubled
    - quietly brave
  typical_classes:
    - Doctor
  typical_races:
    - Trade
  stat_ranges:
    Cunning: [14, 16]
    Angst: [14, 16]
    Nerve: [12, 14]
  inventory_hints:
    - a medical bag with brass clasps
    - laudanum he prescribes for others and has started taking himself
    - the death certificate, a copy folded in his breast pocket
  dialogue_quirks:
    - rubs his hands as though washing them when the conversation turns to the death
    - begins sentences with "In my professional opinion" when he is least certain
  disposition_default: 10
  secret: "The symptoms don't match heart failure. They match poisoning."

- name: Mrs. Poole
  named_individual: true
  description: >-
    Housekeeper for thirty years. Runs the household with absolute authority.
    Was devoted to Sir Edmund in a way that went beyond professional duty.
    She was the last person known to have seen him alive — she brought his
    evening brandy to the study at ten o'clock.
  personality_traits:
    - devoted
    - territorial
    - observant
  typical_classes:
    - Governess
  typical_races:
    - Servant
  stat_ranges:
    Nerve: [16, 18]
    Pride: [14, 16]
    Cunning: [12, 14]
  inventory_hints:
    - a ring of keys second only to Lady Blackthorn's
    - a household ledger with entries in copperplate
    - Sir Edmund's favourite brandy glass, which she has not washed
  dialogue_quirks:
    - refers to "the master" in present tense, then catches herself
    - controls access to rooms and information with equal firmness
  disposition_default: -10
  secret: "She was not the last person to see Sir Edmund alive. She saw someone else enter the study after her."

- name: Miss Fairfax
  named_individual: true
  description: >-
    Governess to Rose, Sir Edmund's ward. Educated, composed, and occupying
    the impossible position between family and staff. She has been at the
    Hall for two years — long enough to see everything, short enough to
    still be shocked by it. The children trust her. The household underestimates
    her.
  personality_traits:
    - watchful
    - principled
    - quietly fierce
  typical_classes:
    - Governess
  typical_races:
    - Clergy
  stat_ranges:
    Cunning: [14, 16]
    Nerve: [14, 16]
    Pride: [12, 14]
  inventory_hints:
    - a journal she keeps locked in her room
    - a letter of recommendation that may not survive this visit
    - a pressed flower from the moor, bookmarking something in a novel
  dialogue_quirks:
    - answers questions about the household with careful precision, omitting exactly one detail
    - watches people's hands rather than their faces
  disposition_default: 5
  secret: "She found a half-burned letter in the study fireplace the morning after Sir Edmund's death. She has kept it."

- name: Reverend Stanbury
  named_individual: true
  description: >-
    The village vicar. Kind, earnest, and tormented by something he cannot
    share. Sir Edmund visited him the week before his death — not for
    Sunday service but for a private conversation in the vestry that lasted
    two hours. The vicar has been composing and destroying sermons ever since.
  personality_traits:
    - compassionate
    - tormented
    - duty-bound
  typical_classes:
    - Clergyman
  typical_races:
    - Clergy
  stat_ranges:
    Angst: [14, 16]
    Nerve: [12, 14]
    Humour: [10, 12]
  inventory_hints:
    - a Bible with a marker at a passage about confession
    - a sermon he has rewritten seven times
    - a key to the church vestry where the parish records are kept
  dialogue_quirks:
    - trails off mid-sentence when approaching the thing he cannot say
    - quotes scripture when cornered, not as deflection but as genuine plea
  disposition_default: 15
  secret: "Sir Edmund confessed something to him. The seal of confession prevents him from speaking. It is destroying him."

- name: Rose Blackthorn
  named_individual: true
  description: >-
    Sir Edmund's ward. Fourteen years old, sharp as a pin, and grieving
    in a way that the adults around her have failed to notice because they
    are too busy managing their own performances. She loved Sir Edmund
    without reservation. She knows the house better than anyone alive.
  personality_traits:
    - grief-stricken
    - perceptive
    - stubbornly honest
  typical_classes:
    - Society
  typical_races:
    - Gentry
  stat_ranges:
    Cunning: [14, 16]
    Passion: [14, 16]
    Humour: [12, 14]
  inventory_hints:
    - a locket containing a miniature of Sir Edmund
    - a collection of pressed wildflowers from the moor
    - a diary written in a simple cipher she invented
  dialogue_quirks:
    - asks direct questions that adults find uncomfortable
    - goes silent and still when she's figured something out, like a cat before it pounces
  disposition_default: 5
  secret: "She is not a distant cousin's orphan. She is Sir Edmund's daughter. She doesn't know this. The will does."
