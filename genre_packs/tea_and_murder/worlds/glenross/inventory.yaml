# Glenross — world inventory catalog
#
# Per the genre/world boundary (ADR-120): the genre owns the rulebook,
# the world owns the catalog. This file adapts the tea_and_murder genre
# inventory baseline to the specific setting of Glenross — a working
# Highland village in Edwardian Scotland, c. 1908.
#
# Setting shifts from the genre baseline (high-Victorian, Edinburgh-
# inflected) to the Edwardian afternoon of empire in a working glen:
#   - Mourning-locket / laudanum gothic register softened toward the
#     0.05 gothic dial — items are practical, not macabre.
#   - Doctor's, clergy, constable, and schoolmistress kits retained and
#     localised; the genre's Industrialist kit becomes the Distillery kit.
#   - Highland-specific additions: dram glass and tasting set, gillie's
#     stalking kit, peat and the distillery's craft objects, the bicycle
#     clip and motoring veil of the 1908 village, the kirk-session and
#     post-office instruments of the village's two courts.
#
# Currency matches the genre block (pounds/shillings/pennies). Schema
# follows the genre inventory.yaml exactly (strict Pydantic, extra
# fields forbidden).

currency:
  name: pounds
  denominations:
    - pennies
    - shillings
    - pounds

item_catalog:
  - id: calling_cards
    name: Calling Cards
    description: Engraved on good stock — leaving one is a social act, withholding one is a weapon.
    category: social
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: In a glen this size your card on the salver at Castle Ross is half a day's gossip in itself.
    narrative_weight: 0.1

  - id: letter_of_introduction
    name: Letter of Introduction
    description: A door-opener — someone of standing vouches for your character and breeding.
    category: social
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [social, access, one-use]
    lore: A line from the laird or the minister opens any door in the parish. A line from a stranger opens none.
    narrative_weight: 0.4

  - id: laudanum_bottle
    name: Laudanum
    description: Opium in alcohol — the country answer to a toothache, a sleepless night, or a grief that will not settle.
    category: consumable
    value: 2
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [medical, sedative]
    lore: Dr. Ross dispenses it carefully and watches who comes back for more.
    narrative_weight: 0.3

  - id: walking_stick
    name: Walking Stick
    description: A hill-walker's blackthorn — respectable accessory, and in a pinch a weapon no one can object to your carrying.
    category: weapon
    value: 3
    weight: 1.0
    rarity: common
    power_level: 1
    tags: [melee, concealed, outdoor]
    lore: Every man who walks the glen carries one. The cromach with the carved ram's-horn head is the gillie's badge of office.
    narrative_weight: 0.1

  - id: derringer
    name: Derringer
    description: Two shots and small enough to hide in a reticule or waistcoat. A last resort, and an unaccountable thing to carry in a village.
    category: weapon
    value: 15
    weight: 0.3
    rarity: rare
    power_level: 2
    tags: [ranged, firearm, concealed, one-handed]
    lore: A pocket pistol in the glen begs the question of who you expected to meet on the single road in.
    narrative_weight: 0.6

  - id: gladstone_bag
    name: Gladstone Bag
    description: A black leather portmanteau with brass clasps and a hinged spine. The doctor's working bag — opens flat across a kitchen table, every instrument in its loop.
    category: tool
    value: 20
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [medical, access, professional, signature]
    lore: When Dr. Ross's bag comes through a door at an odd hour, the household stops asking questions and starts answering them.
    narrative_weight: 0.3

  - id: magnifying_glass
    name: Magnifying Glass
    description: Brass and crystal. The noticing eye's instrument — makes the invisible visible.
    category: tool
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [investigation, observation, professional]
    lore: The difference between looking and seeing — which is the whole of the village's idea of a sleuth.
    narrative_weight: 0.2

  - id: parish_register
    name: Parish Register
    description: The kirk's record of births, deaths, and marriages, bound in worn calf and kept locked in the vestry. The truth that cannot be forged.
    category: document
    value: 0
    weight: 2.5
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal]
    lore: Three generations of the glen are written in the minister's hand. The one book in the parish that tells no lies — usually kept locked.
    narrative_weight: 0.7

  - id: skeleton_key
    name: Skeleton Key
    description: Opens most standard locks in old houses. Possession is difficult to explain innocently.
    category: tool
    value: 10
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [access, stealth, criminal]
    lore: Mrs. Trefusis the housekeeper has one for Castle Ross. Anyone else holding it has some explaining to do.
    narrative_weight: 0.4

  - id: smelling_salts
    name: Smelling Salts
    description: Ammonia in a crystal vial. Revives the fainted, steadies the shaken.
    category: consumable
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [medical, social, recovery]
    lore: A staple of the tea rooms' counter drawer; Mrs. Cameron has revived more than one customer who heard the news before the tea arrived.
    narrative_weight: 0.1

  - id: silk_handkerchief
    name: Silk Handkerchief
    description: Monogrammed and a silent declaration of breeding. Also useful for evidence.
    category: accessory
    value: 2
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, personal, evidence]
    lore: A dropped handkerchief by the bridge has started more stories in this glen than any weapon.
    narrative_weight: 0.2

  # === DOCTOR'S KIT ===
  - id: stethoscope
    name: Stethoscope
    description: Two rubber tubes, an ebonite chestpiece, the new binaural pattern from the medical journals. Hangs around the neck like a sign of office.
    category: tool
    value: 6
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [medical, diagnostic, signature]
    lore: The instrument that lets a doctor hear what the patient will not say.
    narrative_weight: 0.3

  - id: clinical_thermometer
    name: Clinical Thermometer
    description: A six-inch glass tube with a mercury bulb and a kink that holds the reading. Cased in a leather sleeve.
    category: tool
    value: 4
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [medical, diagnostic]
    lore: Six minutes under the tongue. The fever does not lie.
    narrative_weight: 0.2

  - id: quinine_bottle
    name: Quinine
    description: A small brown bottle of quinine sulphate — for fevers and the lingering complaints of anyone who has served in a hot country.
    category: consumable
    value: 3
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [medical, apothecary]
    lore: Every household with a colonial past keeps a bottle on the mantelpiece. The Colonel keeps three.
    narrative_weight: 0.2

  - id: iodine_tincture
    name: Tincture of Iodine
    description: A dark brown bottle with a stopper. Stings when applied, but cleans a wound that would otherwise turn.
    category: consumable
    value: 2
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [medical, antiseptic]
    lore: Modern medicine in a small bottle. Lister would approve.
    narrative_weight: 0.1

  - id: bandages_linen
    name: Linen Bandages
    description: A roll of clean white linen, boiled and folded. Enough to dress an arm or wrap a head.
    category: consumable
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [medical, dressing]
    lore: The first thing a doctor unrolls and the last thing she packs away.
    narrative_weight: 0.1

  # === ECCLESIASTICAL KIT ===
  - id: breviary
    name: Breviary
    description: A small leather-bound book of daily offices, worn smooth at the corners. The Episcopal sort — Anglican Communion, English-printed.
    category: document
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [devotional, signature, clergy]
    lore: Rev. Quill reaches for his the way other men reach for a watch — on the train, at the bedside, between funerals.
    narrative_weight: 0.3

  - id: prayer_book
    name: Book of Common Prayer
    description: Cloth-bound, ribbon-marked, signed inside the cover by the giver. Church of Scotland kirk or Episcopal chapel — opens differently to each.
    category: document
    value: 3
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [devotional, clergy]
    lore: Some people read it. Some carry it. In Glenross the difference between kirk and chapel shows in which one you hold.
    narrative_weight: 0.2

  - id: sermon_notebook
    name: Sermon Notebook
    description: A clothbound notebook, half-filled with Sunday outlines in a hand that becomes neater toward the back. Marginalia in pencil.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [clergy, writing]
    lore: A minister's working drafts. Some pages are crossed out savagely; Sunday twice and Wednesday evening leave their marks.
    narrative_weight: 0.2

  - id: minister_notebook
    name: Minister's Notebook
    description: A small black-leather notebook carried in the inside pocket, listing the parish's troubles by surname. Never shown to anyone.
    category: document
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 2
    tags: [clergy, investigation, evidence, signature]
    lore: Rev. Murchison believes writing a name down means he must remember to pray for the person. The book is his conscience, and the parish's secret architecture.
    narrative_weight: 0.5

  - id: communion_kit
    name: Portable Communion Kit
    description: A small mahogany case fitted with a pewter chalice, a screw-top paten, and a glass vial for wine. For house-calls and the dying.
    category: tool
    value: 12
    weight: 1.0
    rarity: uncommon
    power_level: 2
    tags: [clergy, signature, ritual]
    lore: Carried up the glen to bedsides where the parishioner cannot reach the kirk.
    narrative_weight: 0.4

  # === DETECTIVE / CONSTABLE KIT ===
  - id: whistle_brass
    name: Brass Police Whistle
    description: A two-tone Acme Thunderer on a chain. The shriek carries half a mile across the glen.
    category: tool
    value: 2
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [signal, constabulary, signature]
    lore: One long, two short — the county constabulary's old code. Sgt. MacRae has blown it perhaps four times in nineteen years.
    narrative_weight: 0.2

  - id: bicycle_clip
    name: Bicycle Clip
    description: A sprung steel clip worn on the right ankle to keep the trouser-cuff clear of the chain. Worn even when off the bicycle, out of habit.
    category: accessory
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [constabulary, practical, signature]
    lore: The constable wears his on the right ankle at all times. So does the doctor, the postmistress, and the rector — the bicycle is how the glen gets about.
    narrative_weight: 0.2

  - id: notebook_leather
    name: Pocket Notebook
    description: A regulation black leather notebook with an elastic strap and a pencil loop. The corners softened by years in a serge coat pocket.
    category: document
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [writing, investigation]
    lore: Everything anyone has ever said in your presence, set down in the same handwriting since 1885, before it could be denied.
    narrative_weight: 0.2

  - id: fountain_pen
    name: Fountain Pen
    description: A black hard-rubber pen with a gold nib, refilled from a glass bottle. Leaks in the heat. Indispensable.
    category: tool
    value: 6
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [writing]
    lore: An honest record needs an honest pen. The pencil can be erased; the constable trusts neither.
    narrative_weight: 0.1

  # === SCHOOLMISTRESS KIT ===
  - id: chalkboard_slate
    name: Slate and Chalk
    description: A schoolroom slate in a wooden frame, with a length of chalk in a silk wrap. Wipes clean with a damp cloth.
    category: tool
    value: 1
    weight: 0.8
    rarity: common
    power_level: 0
    tags: [teaching, signature]
    lore: The parish school in a satchel. Every adult in the village under forty has written sums on one of Miss Ferguson's slates.
    narrative_weight: 0.2

  - id: school_primer
    name: First Reader
    description: A small cloth-bound primer — the parish school's standard text, dog-eared at the easier pages.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [teaching]
    lore: The book every child in the glen has cried over at some point.
    narrative_weight: 0.1

  - id: barley_sugar_tin
    name: Tin of Barley Sugar
    description: A small dented tin of twisted barley sugar, kept in a cardigan pocket against emergencies — the children's and one's own.
    category: consumable
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [social, teaching, comfort]
    lore: A frightened child or a shaken witness will say more across a barley sugar than across a stern question. Miss Ferguson knows this.
    narrative_weight: 0.2

  - id: suffrage_pamphlet
    name: WSPU Pamphlet
    description: A folded Women's Social and Political Union pamphlet, read carefully and not advertised in the village.
    category: document
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 1
    tags: [social, writing, discreet]
    lore: The suffrage cause is gathering in the cities and arriving in the glen via the schoolmistress's reading. Kept where the kirk session will not see it.
    narrative_weight: 0.3

  # === EXPLORER / RETIRED OFFICER KIT ===
  - id: field_compass
    name: Field Compass
    description: A brass-cased prismatic compass in a worn leather pouch. The card still settles true.
    category: tool
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [navigation, signature, military]
    lore: Carried across the veldt and back. Knows north better than its owner does, and the Long Pass better than the map.
    narrative_weight: 0.3

  - id: regimental_decorations
    name: Service Decorations
    description: A small ribbon bar in a velvet case — campaign medals, a clasp for South Africa. Worn for the Twelfth and Remembrance Sunday, kept in a drawer otherwise.
    category: accessory
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 0
    tags: [military, social, identity]
    lore: The ribbon says where you were. The medal says what you did. The three names on the kirk-porch war memorial say who else didn't come back.
    narrative_weight: 0.5

  - id: service_revolver
    name: Service Revolver
    description: A six-shot Webley in a leather flap-holster, oiled and kept. Heavier than the derringer, far less subtle.
    category: weapon
    value: 30
    weight: 2.0
    rarity: uncommon
    power_level: 3
    tags: [ranged, firearm, military, signature]
    lore: The officer's sidearm, carried home from the Cape and not surrendered since. In Glenross it lives in a cottage drawer and troubles the housekeeper.
    narrative_weight: 0.6

  # === DISTILLERY KIT ===
  - id: tasting_glass
    name: Tasting Glass
    description: A small tulip-shaped nosing glass kept in a velvet pouch in the inside pocket. Brought out unselfconsciously whenever a question turns on whisky.
    category: tool
    value: 5
    weight: 0.2
    rarity: uncommon
    power_level: 1
    tags: [distillery, signature, craft]
    lore: Donald Munro can tell a whisky's year and warehouse by the nose alone. The glass is how he proves it to the doubtful.
    narrative_weight: 0.3

  - id: warehouse_ledger
    name: Warehouse Ledger
    description: A heavy clothbound ledger with marbled endpapers, casks recorded by year, warehouse, and bond in a careful hand.
    category: document
    value: 3
    weight: 1.5
    rarity: common
    power_level: 1
    tags: [finance, signature, business, distillery]
    lore: The book that says which cask belongs to whom and which has been promised to a London merchant. The columns add up; the family behind them does not always.
    narrative_weight: 0.3

  - id: peat_spade
    name: Peat Spade
    description: A long-bladed Highland tairsgear for cutting peat from the moss, the edge kept bright. Smells of the bog it works.
    category: tool
    value: 4
    weight: 2.5
    rarity: common
    power_level: 1
    tags: [distillery, outdoor, craft, rural]
    lore: The peat reek in the whisky begins here, on the moss above the distillery. A man's peat bank is as much his as his pew.
    narrative_weight: 0.2

  - id: hip_flask
    name: Silver Hip Flask
    description: A pewter-and-silver flask, engraved with initials that may or may not be your own. Holds a respectable measure of the local malt.
    category: consumable
    value: 4
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [social, vice]
    lore: Carried for the cold on the hill. Used for the conversation that should have been easier than it was.
    narrative_weight: 0.2

  # === GILLIE / ESTATE KIT ===
  - id: stalking_glass
    name: Stalking Telescope
    description: A brass-and-leather draw telescope, four draws, the lens scratched but true. Reads the hill at a mile and the lane at a furlong.
    category: tool
    value: 9
    weight: 0.6
    rarity: uncommon
    power_level: 1
    tags: [observation, outdoor, signature, estate]
    lore: Old Tam has counted every deer on the Ross with it for forty years. It also reads who walks the upper glen, and when.
    narrative_weight: 0.3

  - id: gillie_pocketknife
    name: Pocketknife
    description: A bone-handled clasp knife older than its owner's father, carried on a leather thong inside the breast pocket, the blade honed thin by decades.
    category: tool
    value: 2
    weight: 0.2
    rarity: uncommon
    power_level: 1
    tags: [tool, outdoor, estate, heirloom]
    lore: A gillie's knife dresses a stag, cuts a sandwich, and trims a snare. The constable has learned to notice whose knife was where.
    narrative_weight: 0.3

  - id: oilskin_coat
    name: Oilskin Coat
    description: A long waxed-canvas coat, stiffened by wear and weather. Smells faintly of paraffin. Keeps the Highland rain out.
    category: outerwear
    value: 8
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [outdoor, practical]
    lore: The garment that says you have walked the back lanes in November and intend to walk them again before the rain comes on at evening.
    narrative_weight: 0.2

  # === POST OFFICE / TEA ROOMS — THE VILLAGE'S TWO COURTS ===
  - id: telegraph_forms
    name: Telegraph Forms
    description: A pad of buff Post Office telegraph forms and a copy-book carbon, every wire that enters or leaves the glen recorded in the postmistress's hand.
    category: document
    value: 0
    weight: 0.3
    rarity: uncommon
    power_level: 2
    tags: [communication, investigation, evidence, signature]
    lore: Mrs. Buchan does not open letters — a moral absolute — but every telegram passes through her, and a foreign postmark is an event in her morning.
    narrative_weight: 0.4

  - id: gossip_notebook
    name: Tea-Room Notebook
    description: A small black notebook kept hidden behind the flour tin above the bread oven — the day's customers listed by name and order, with who spoke to whom.
    category: document
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 2
    tags: [social, investigation, evidence, gossip]
    lore: The village's true gazetteer. The constable would dearly like to see it. He has never asked, and Mrs. Cameron has never offered.
    narrative_weight: 0.5

  # === SHARED EDWARDIAN ESSENTIALS ===
  - id: visiting_cards
    name: Visiting Cards
    description: A small leather case of engraved cards. Left at the door of a house one has called upon — folded corners carry their own meaning.
    category: document
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: The card on the salver outranks the visit itself in the houses that keep a salver — which in this glen is two.
    narrative_weight: 0.2

  - id: pocket_watch_silver
    name: Silver Pocket Watch
    description: A hunter-cased silver pocket watch on a fob chain. Engraved inside with a date and a set of initials.
    category: accessory
    value: 12
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [accessory, identity, heirloom]
    lore: A respectable man carries the time and his father's name on the same chain. The doctor, modern, wears a wristwatch and is judged for it.
    narrative_weight: 0.3

  - id: motoring_veil
    name: Motoring Veil and Goggles
    description: A long gauze veil and a pair of brass-rimmed goggles for the open motor-car. The village's youngest affectation, three motor-cars in the parish.
    category: accessory
    value: 6
    weight: 0.4
    rarity: uncommon
    power_level: 0
    tags: [social, modern, practical]
    lore: Hugo Ross wears his to drive the Riley to Inverness, and his father pretends not to notice. The glen has opinions about all three motor-cars.
    narrative_weight: 0.2

starting_gold:
  # Pounds-denominated (matches currency block). Tuned so every calling
  # can engage low-level social gates — a coach fare, a telegram, a round
  # at the inn, a small contribution to the coal fund — without arriving
  # at chargen-end with empty pockets. Mapped to the genre callings; the
  # Distiller takes the Industrialist's purse, the Gillie the modest one.
  Doctor: 30
  Clergyman: 15
  Detective: 12
  Society: 80
  Governess: 8
  Explorer: 25
  Industrialist: 120
