      establishment: the_railway_halt
      services: ["tickets", "freight", "two_trains_per_day", "telegrams_relayed_through_post_office"]
      note: "Named in cartography.yaml; not yet a full NPC entry."

  medical:
    - role: "Country general practitioner"
      role_holder: dr_ross
      coverage: "Glenross parish + visiting calls to Cullenmore when needed"
      hours: "Mon-Wed-Fri, ten to noon and four to six"
