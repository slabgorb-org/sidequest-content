# ────────────────────────────────────────────────────────────────────
# Social strata
# ────────────────────────────────────────────────────────────────────
# Class is load-bearing in Edwardian Scotland but the village is small
# enough to see through it. The narrator uses these layers to set
# register: who calls whom by what, who waits for whom to sit first,
# who is owed a deferential nod at the post office.

social_strata:

  - layer: landed_gentry
    rank: 1
    description: >-
      The Ross family at Castle Ross. Apex of the parish, courteously
      distant from village life. The laird and lady sit in their pew at
      the front of the kirk on Sundays (though the family worships
      mostly at the chapel) and host the parish fete in the meadow each
      August.
    exemplars: [sir_iain_ross, lady_annabel_ross, hugo_ross]
    forms_of_address:
      from_village: '"Sir Iain", "her ladyship", "the laird", "the young master"'
      from_peer_gentry: "first names"
      from_older_gaelic_crofters: '"the laird"'
    village_attitude: >-
      Cordial-but-distant. The Big House and the village have a working
      truce a hundred and sixty years old. Hugo is "the village's
      affectionate joke and its future" and is liked for playing
      cricket and shinty alongside the village against Cullenmore.

  - layer: professional_class
    rank: 2
    description: >-
      The minister, the rector, the doctor, the schoolmistress, the
      postmistress, the distiller. The warm centre of the recurring
      cast. The village's working professionals — what the village
      means when it says "the professions".
    exemplars: [rev_murchison, rev_quill, dr_ross, miss_ferguson, mrs_buchan, donald_munro]
    forms_of_address:
      from_village: '"Mr. Murchison", "Reverend Quill", "Doctor", "Miss Ferguson", "Mrs. Buchan", "Mr. Munro"'
      among_themselves: "surnames, with sherry"
    village_attitude: >-
      Familiar warmth. These are the doors the village knocks on with
      its troubles. The kettle is always on at the manse, the surgery,
      the post office, the tea rooms.

  - layer: constabulary_and_law
    rank: 2
    description: >-
      The parish constable. Between professional and yeoman in standing;
      treated by the village with the gravity earned over nineteen years.
    exemplars: [sgt_macrae]
    forms_of_address:
      from_village: '"Mr. MacRae" or "the sergeant"'
    village_attitude: >-
      Trusted absolutely on village matters; treated with quiet
      deference on parish matters. Has a firm rule against arresting a
      man in his own home; the village respects this without saying so.

  - layer: artisans_and_shopkeepers
    rank: 3
    description: >-
      The publican, the tea-room proprietress, the smith-farrier, the
      stationmaster, the distillery foreman. The trades that keep the
      village running day to day.
    exemplars: [hamish_sinclair, mrs_cameron, donald_buchan, albert_macgregor]
    forms_of_address:
      from_village: '"Hamish", "Mrs. Cameron", "Donald" (Buchan), "the stationmaster"'
      between_intimates: "first names"
      in_public: "surnames"
    village_attitude: >-
      Friendly familiarity. The publican's view of a visitor lasts
      twenty years; the tea-room's notebook above the bread oven is the
      village's true gazetteer.

  - layer: castle_household
    rank: 4
    description: >-
      The Castle's indoor and outdoor staff. Respected for service and
      addressed by post.
    exemplars: [old_tam, calum_cattanach, mrs_trefusis, mrs_cattanach, mrs_drummond]
    forms_of_address:
      from_village: '"Old Tam", "Mrs. Trefusis", "the cook", "the gillie"'
      from_laird: '"Tam", surname for senior staff, first names for maids'
    village_attitude: >-
      The estate's people are the village's people; most are kin to
      named cast through some thread of marriage or christening (the
      constable's wife is Old Tam's niece; the Castle cook is her
      mother's sister).

  - layer: crofters_and_tenant_farmers
    rank: 5
    description: >-
      The parish's largest single class. A dozen tenant crofts on the
      laird's home farm, smallholders along the glen, sheep families
      who have farmed the same shieling for four generations.
    exemplars: []   # unnamed; the parish's body
    forms_of_address:
      from_village: "surname and first name interchangeably; older crofters often have Gaelic by-names"
      from_gentry: '"surname" or "the McRae", "the Cattanach"'
    village_attitude: >-
      The village's stock. The minister knows every household by the
      surname on the kirk session roll; the schoolmistress has taught
      every adult under forty. Most older crofters retain Gaelic at
      home; the village proper speaks Scots-inflected English.

  - layer: farm_servants_and_labourers
    rank: 6
    description: >-
      Hired hands on the home farm, casual labour at the distillery,
      road-menders, peat-cutters, railway gangs on the line.
    exemplars: []
    forms_of_address:
      from_village: "recognised by face and family; named in narration only when they speak"
    village_attitude: >-
      The unnamed body of the parish. The narrator should reach for
      "a road-mender", "the railway gang", "the McGregor lad up from
      Cullenmore" rather than invent specific names unless the player
      asks.

