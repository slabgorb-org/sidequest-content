# Glenross Demographics
#
# Settlement profile, population structure, and social register for the
# Highland parish of Glenross, c. 1908. This file is the narrator's
# grounding reference for who lives in the parish, what work they do,
# how they rank socially, and what daily rhythms the village runs on.
#
# Authored alongside:
#   - world.yaml        — axis snapshot, scope sentence, themes
#   - cartography.yaml  — the 14 named regions of the village & glen
#   - npcs.yaml         — the 12-strong warm cast (never the victim)
#   - lore.yaml         — economy, religion, transport, period texture
#
# Schema: pending — Story 24-1 will formalise the shape across all
# world-grounding files; until then this YAML is authored in the shape
# I'd want the schema to enforce. Per ADR-059 (Monster Manual pattern),
# this content is injected into narrator prompt zones (story 24-6).

version: "0.1.0"
world: glenross
genre_pack: tea_and_murder

# ────────────────────────────────────────────────────────────────────
# Parish overview
# ────────────────────────────────────────────────────────────────────

parish:
  name: Glenross
  type: highland_parish
  era: edwardian
  year: 1908
  region: "the western Highlands, a fictional glen running east-west"
  scope: >-
    Large enough to support a minister, a doctor, a school, a post
    office, one inn — small enough that everyone knows everyone's
    business by sundown.
  total_population: 412
  village_centre_population: 148
  outlying_parish_population: 264
  households_approx: 96
  recurring_cast_count: 12
  axis_alignment:
    cosy: 0.75
    puzzle: 0.7
    gossip: 0.7
    gothic: 0.05

# ────────────────────────────────────────────────────────────────────
# Settlements
# ────────────────────────────────────────────────────────────────────
# The village proper, plus the off-map neighbours the parish names.
# All in-village geography is enumerated in cartography.yaml; this is
# the parish-level outline.

settlements:
  - id: glenross_village
    name: Glenross
    type: highland_village
    population: 148
    wealth: modest
    character: >-
      A working Highland village in the long warm afternoon of empire.
      Stone cottages and slate roofs gathered around a three-arch bridge
      over the river Allt Ross; the kirk on its mound at the geographic
      centre after the bridge; Castle Ross on the rise above, visible
      from almost anywhere; the distillery downwind to the west; the
      single railway halt at the southern edge.
    economic_role: >-
      The parish's professional and commercial centre. Hosts the kirk,
      the chapel, the school, the surgery, the post office, the tea
      rooms, the smithy, the inn, and the railway halt. The Munro
      distillery sits west along the burn.
    cartography_regions: 14
    season_pulse:
      visiting_season: "August through October — sportsmen, the Twelfth, the parish fete"
      working_year: "November through July — the village by itself, which is when most mysteries happen"

  - id: castle_ross_estate
    name: Castle Ross and its policies
    type: estate
    population: 23
    wealth: comfortable_but_pressed
    character: >-
      Late-Georgian house with an 1870s Highland baronial restoration —
      turret, crow-stepped gables, porte-cochère, walled gardens, the
      rose garden on the south side, the home farm and a dozen tenant
      crofts on the policies. Twelve rooms in use during the season,
      four otherwise.
    economic_role: >-
      The parish's largest single employer (indoor and outdoor staff,
      gillies, gardeners). Rents from the home farm and the crofts;
      salmon beats in season; the laird quietly under financial pressure
      against London expenses.
    cartography_regions: 1

  - id: cullenmore_neighbour
    name: Cullenmore
    type: off_map_market_village
    distance_miles: 7
    rail_connection: true
    role: >-
      The nearest market village south down the line. Source of the
      cricket eleven and shinty fifteen Glenross plays. Visitors come
      up by train; shopping the village can't supply (mended boots,
      dressmaking, books, a wider butcher) goes down by train.
    note: "Not playable. Referenced as a rumour-and-supply elsewhere."

  - id: inverness_north
    name: Inverness
    type: off_map_county_town
    distance_miles: 28
    rail_connection: true
    role: >-
      The afternoon train down. The county constabulary HQ, the county
      CID inspector who comes up on occasion, the Edinburgh solicitor's
      onward link, the wider shops, the hospital, the assize court.
      Twenty-eight miles by rail.
    note: "Not playable."

# ────────────────────────────────────────────────────────────────────
# Districts (cartography clusters)
# ────────────────────────────────────────────────────────────────────
# Groupings of the 14 named cartography regions. These are how the
# village's residents speak about where things are, not arbitrary zones.

districts:
  - id: village_centre
    name: "the village centre"
    character: >-
      The crossroads at the bridge, the inn on one side, the post office
      and tea rooms across, the kirk and chapel on the mound to the
      north-east, the surgery and manse along the lane. Most of the
      village's daytime life happens within five minutes' walk of here.
    regions:
      - the_glenross_arms
      - the_post_office
      - the_tea_rooms
      - the_kirk_of_st_maelrubha
      - the_manse
      - st_margarets_chapel
      - the_school
      - the_surgery
      - the_bridge

  - id: railway_quarter
    name: "the railway halt and approach"
    character: >-
      A single platform at the southern edge of the village, the
      stile from the schoolyard, the lane up to the bridge. The
      morning train arrives at 9.40, the afternoon at 4.15 — the
      village's two daily appointments with the world outside.
    regions:
      - the_railway_halt

  - id: distillery_quarter
    name: "the distillery and burn-side"
    character: >-
      West of the bridge along the Allt Ross. Two pagoda kilns smoking
      faintly all year and in earnest from August. The bonded warehouse
      number one is the oldest in the parish. The village's outward
      face when London asks where the whisky comes from.
    regions:
      - the_distillery

  - id: castle_policies
    name: "Castle Ross and its grounds"
    character: >-
      The rise above the bridge, the long drive up from the lodge
      gates, the walled gardens, the rose garden, the gun-room beside
      the stables, the home farm to the west. The cricket and shinty
      ground east of the kirk is leased from the laird's meadow.
    regions:
      - castle_ross
      - the_cricket_ground

  - id: upper_glen
    name: "the upper glen and the Long Pass"
    character: >-
      North out of the village, climbing gently for two miles to the
      pass, then the track to the high shielings, the deer forest, and
      the next parish a day's walk on. The burnt shieling and the high
      cairn are the local landmarks. Body discoveries and chase scenes
      happen here, as does the village's summer-evening view.
    regions:
      - the_long_pass

