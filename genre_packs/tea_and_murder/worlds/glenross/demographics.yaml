      role_holder: miss_ferguson
      pupils_total: 30
      pupil_age_range: "7 to 14"
      establishment: the_school
      note: "Single-room schoolhouse; the schoolmistress's cottage is attached."

  communications:
    - role: "Postmistress and telegraph operator"
      role_holder: mrs_buchan
      establishment: the_post_office
      services: ["royal_mail", "telegraph", "parcels", "marconi_messages", "village_notice_board"]
      utilities: ["village_telephone_line_2_of_2"]

  hospitality_and_trade:
    - role: "Publican"
      role_holder: hamish_sinclair
      establishment: the_glenross_arms
      rooms_for_let: 3
      household: "Hamish, his wife Kirsty (kitchen and the three rooms upstairs), the dog Caley"

    - role: "Tea-room proprietress"
      role_holder: mrs_cameron
      establishment: the_tea_rooms
      tables: 3
      schedule:
        seed_cake: "Mondays"
        shortbread: "Thursdays"

    - role: "Smith and farrier"
      role_holder: donald_buchan
      establishment: "the smithy (behind the post office)"
      household: "Husband of the postmistress; does the heavy sorting and the carrying for the post office as well as the smithy work."

  industry:
    - name: "Munro Distillery"
      proprietor_npc: donald_munro
      establishment: the_distillery
      employees_approx: 12
      production_scale: small
      output_notes:
        - "Two copper stills (Caelidh and Brigid), sixty years old."
        - "Three bonded warehouses; warehouse number one holds the longest-aged casks."
        - "Current vintage well-spoken-of in Edinburgh."
        - "A London merchant ordered three casks in spring 1908 — largest single order in the distillery's history."
      generations: 3
      founded: "1820s, on a licence the laird's grandfather granted"

  household_employment:
    castle_ross:
      indoor:
        - role: "Housekeeper"
          role_holder: mrs_trefusis
        - role: "Cook"
          role_holder: mrs_cattanach
        - role: "Upstairs maids"
          count: 3
        - role: "Kitchen maids"
          count: 2
        - role: "Chauffeur"
          count: 1
      outdoor:
        - role: "Head gillie"
          role_holder: old_tam
        - role: "Under-gillie"
          role_holder: calum_cattanach
          note: "Old Tam's grand-nephew; eventual successor."
        - role: "Gardener"
          count: 1
        - role: "Under-gardener"
          count: 1
      total_approx: 13

    the_manse:
      - role: "Housekeeper"
        role_holder: mrs_drummond
        note: "Came up from Edinburgh after the minister's wife's death five years ago; stayed."

  utilities_and_period_texture:
    telephones_in_parish: 2
    telephone_locations: [the_surgery, the_post_office]
    private_telephone_lines: [castle_ross]
    electric_lighting: "Castle Ross has a private plant; the village runs on gaslight and oil."
    motor_cars_in_parish: 3
