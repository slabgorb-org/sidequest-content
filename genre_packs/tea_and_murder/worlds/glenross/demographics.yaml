# ────────────────────────────────────────────────────────────────────
# Narrator grounding phrases
# ────────────────────────────────────────────────────────────────────
# Short, evocative lines the narrator can drop directly into prose.
# These are the lines that distinguish "a Highland village" from
# "Glenross specifically". Each phrase is a baited hook (ADR-014) the
# narrator can re-cast when needed.

narrator_grounding_phrases:

  scale_and_shape:
    - "Large enough to support a minister, a doctor, a school, a post office, one inn — small enough that everyone knows everyone's business by sundown."
    - "A parish of four hundred souls; thirty children at the school; forty in the chapel pews on a full Sunday; two hundred in the kirk."
    - "One inn, one school, one surgery, one post office, one smithy, one distillery — and two churches that politely do not overlap."
    - "Two trains a day. Two telephones. Three motor-cars in the parish."
    - "A dozen tenant crofts and a Big House; a distillery downwind by design."

  social_register:
    - "The village's recurring cast you will come to love."
    - "The kirk session and the post office are its courts."
    - "Standing and gossip are the village's currency."
    - "Class is still load-bearing in Edwardian Scotland but the village is small enough to see through it."
    - "The minister, the rector, the doctor, the schoolmistress, the postmistress, and the distiller — the village's working professionals."
    - "Castle Ross above, cottages below, kirk between."

  daily_rhythm:
    - "Surgery hours Mon-Wed-Fri, ten to noon and four to six."
    - "The kettle is always on at the manse, the surgery, the post office, the tea rooms — and Mrs. Cameron will judge your sugar habits in silence but won't bring it up."
    - "Seed cake on Mondays, shortbread on Thursdays."
    - "The morning train up from the south, the afternoon down from Inverness — anything new arrives or departs from that platform."
    - "Bells: quarter past and quarter to at the school; Sundays, funerals, fires, and the New Year at the kirk."

  who_calls_whom:
    - 'The laird is "Sir Iain" to the village, "the laird" to the older Gaelic crofters, "Iain" only to the rector when no one else is present.'
    - 'The professionals are addressed by surname and title — "Mr. Murchison", "Doctor", "Miss Ferguson", "Mrs. Buchan".'
    - 'The tradespeople are first names with intimates, surnames in public — "Hamish" behind the bar, "Mr. Sinclair" in the post office.'
    - 'The household staff are addressed by post — "the cook", "the gillie", "the housekeeper" — or by surname.'
    - 'The crofters and labourers are recognised by face and family; named in narration only when they speak.'

  outsider_signals:
    - "A face the publican does not know is a story by tea."
    - "A foreign stamp at the post office is an event in Mrs. Buchan's morning and an observation by tea."
    - "Hurry, performance, and treating the village as a backdrop earn courteous distance and no candour."
    - "Patience, observation, and the willingness to wait out a story earn the warmth of the standing cast."
    - "The village will defend a long-resident against an outsider's accusation almost reflexively."

  season_and_weather:
    - "The Highland light: heather and bracken in autumn, the river dark and quick over the stones beneath the bridge, peat smoke from the cottages."
    - "Visiting season runs August through October — sportsmen, the Twelfth, the parish fete."
    - "The rest of the year is the village by itself, which is when most mysteries happen."
    - "The inn fire is going from October to April."
    - "The distillery smokes faintly all year and in earnest from August."

# ────────────────────────────────────────────────────────────────────
# Naming conventions
# ────────────────────────────────────────────────────────────────────

naming_conventions:

  prevalent_surnames:
    # In rough order of frequency in the parish; cross-references in npcs.yaml.
    - Ross         # the laird's family and many tenants who took the name
    - MacRae       # constable's family; long-resident
    - Munro        # distiller's family
    - Buchan       # postmistress and smith
    - Cattanach    # gillie family; Castle cook's family
    - Cameron      # tea-room family
    - Murchison    # minister's family
    - Sinclair     # publican's family
    - Ferguson     # schoolmistress's family
    - MacGregor    # stationmaster; publican's wife's maiden name
    - Drummond     # manse housekeeper's family
    - Forbes       # Lady Annabel's family (off-glen)
    - Macpherson   # Rev. Quill's maternal line (off-glen)
    - Trefusis     # Castle housekeeper (English origin)

  gaelic_at_home:
    description: >-
      The older generation in the upper glen and the gillie families
      retain Gaelic at home. The village proper speaks Scots-inflected
      English by 1908. The school taught in English only for a
      generation; the younger residents understand Gaelic phrases but
      do not speak them. Old Tam thinks in Gaelic and translates as
      he speaks.
    exemplars: [old_tam]

  honorifics:
    apex:
      - "Sir / Lady (the laird and Lady Annabel)"
    professional:
      - "Doctor (Dr. Ross)"
      - "Reverend (the minister and the rector)"
      - "Mister / Mrs. / Miss"
    civic:
      - "Sergeant (Sgt. MacRae)"
    by_post:
      - "the publican, the postmistress, the schoolmistress, the gillie, the cook, the stationmaster"

