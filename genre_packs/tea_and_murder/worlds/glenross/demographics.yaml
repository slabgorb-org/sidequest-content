# Glenross Demographics
#
# Settlement profiles and population structure for the Highland village.
# Glenross is "large enough to support a minister, a doctor, a school,
# a post office, one inn — small enough that everyone knows everyone's
# business by sundown." Population figures and service counts ground the
# narrator's descriptions in concrete plausibility.
#
# Schema: docs/schemas/world-grounding/demographics.schema.json
# ADR-059: Monster Manual pattern (YAML content → narrator prompt zone)

settlements:
  - name: Glenross
    type: highland_village
    population: 412
    wealth: modest
    profile:
      clergy: 1
      taverns: 1
      inns: 1
      shops:
        general_merchant: 1
        apothecary: 1
        tea_room: 1
        butcher: 1
        grocer: 1
      guilds:
        - kirk_session
        - village_council
      institutions:
        school: 1
        post_office: 1
        surgery: 1
        distillery: 1
    notes: >-
      A railway hub village in Edwardian Scotland (c. 1908). The social order runs
      from Castle Ross (laird's household) through the professional class (minister,
      doctor, schoolmistress, postmaster), shopkeepers and tradespeople, to farm servants.
      The kirk session and post office serve as informal courts; the inn and kirk kitchen
      are social gathering points. The distillery is the village's economic anchor.
      Two trains a day to Inverness; single road in and out.
