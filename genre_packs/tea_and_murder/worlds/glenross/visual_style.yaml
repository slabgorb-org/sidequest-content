positive_suffix: >-
  Edwardian-era watercolour painting on heavy paper, visible paper-grain
  texture, soft pigment bleed at edges, fine drawn line beneath the
  colour, in the painterly lineage of Helen Allingham and Sutton Palmer.
  Highland register: a warm-cream and honey-gold base with heather-purple
  and bracken-russet accents and slate-grey as supporting tone, the single
  warm honey-gold note saved not spent. Light is golden-afternoon
  directional, warm rather than cool, shadows pooling warm umber.
  Atmosphere pastoral, never gothic, with soft distance and gentle bleed
  at horizons. No text, no caption, no title, no writing, no label, no
  signature, no watermark, no border, no frame.

