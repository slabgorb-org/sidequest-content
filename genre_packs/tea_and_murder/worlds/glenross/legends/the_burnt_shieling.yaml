name: The Burnt Shieling
summary: On the Long Pass, a ruined cottage of unmortared stone, gable half-standing,
  the rest fallen in. Local story has it that the family who lived there in the 1860s
  vanished on a winter night when the snow came on early; the shieling was burnt the
  following spring by the laird's grieving servants, or by the family's enemies, depending
  on who is telling the story. Children dare each other to spend the night there in
  summer. They never quite manage it.
era: fifty years ago; burnt 1862-63
details: Village folklore exaggerates real history. A real shieling, a real fire.
  The family did leave the glen abruptly in 1862, but the local register has them
  down to Glasgow rather than disappeared. The fire was lit by the laird's factor
  to prevent squatters and to mark the end of the lease.
