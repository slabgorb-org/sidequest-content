name: The Stag at Dawn on the Ross
summary: A white stag is sometimes seen on the high slopes of the high peak at first
  light. The gillies will not stalk him by long- standing agreement; he is the laird's
  family's emblem, the Ross stag, and to shoot him would be considered the unluckiest
  thing a man could do in this glen.
era: in the village's living memory and beyond
details: Real biological phenomenon (leucism in a deer), treated as legend by tradition.
  Reported every decade or so. The current laird saw one in 1898 and ordered the gillies
  to give him passage; the village took this as the right decision.
