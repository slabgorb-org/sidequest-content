name: The Green Lady of Castle Ross
summary: A figure in a green dress sometimes seen on the upper gallery of the great
  house by visiting guests, never by the family. The explanation in the village is
  the dampness of the gallery wall causing the silver oxide of the old wallpaper to
  phosphoresce in moonlight. The explanation in the household is the wall-paper. The
  visitors keep seeing her, all the same.
era: first sighted in the 1750s; reported in fragments since
details: Rationalist explanation always wins at Glenross's default gothic axis. The
  visiting houseguest of the third laird who first reported her was the first recorded
  sighting, in 1755. Reported in fragments by visiting parties about every decade.
  Disappears entirely whenever investigated.
