name: The Curse on the Heirs of Castle Ross
summary: Each generation of the laird's family is said to lose a child young — illness,
  accident, the sea. The family records show this is in fact what has happened, although
  the family records do not refer to a curse. A sociologist would put it down to the
  mortality rates of a small landed family in the eighteenth and nineteenth centuries.
era: two hundred years
details: Pattern recognition over statistical inevitability. A real pattern of family
  loss, named "curse" by village storytellers. The current laird's elder brother died
  as a child of rheumatic fever; this is treated by the village as another expression
  of the same long shadow. The current heir is, in this register, the family's hostage
  to fortune.
