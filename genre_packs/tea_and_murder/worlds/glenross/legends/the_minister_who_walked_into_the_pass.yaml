name: The Minister Who Walked into the Pass
summary: Generations ago a minister at the kirk — never specifically named in the
  village's telling — is said to have walked out into the Long Pass on a winter evening
  and never come back. The bell of the kirk rang itself once in the night. He was
  found in the spring at the high cairn, sitting upright, frozen, his hat in his hand.
  Nobody knows what he was doing.
era: uncertain — at least a century ago
details: Composite of two real events — a parish minister who died of exposure in
  1797 and a separate sexton who rang the bell during a fever — recombined by the
  village's storytelling into a single mystery. The village's memory has a habit of
  compression.
