name: The Silver in the Burn
summary: Children's story — a chest of silver coin was thrown into the river during
  the '45 to keep it from the redcoats, and the burn still flashes silver in certain
  pools after a heavy rain. Every generation of village children has gone looking
  for it and every generation has come back wet, cold, and with nothing more than
  river-stones.
era: since 1746
details: Almost certainly nothing, but the story is so reliably told that the cataloguers
  of Highland folklore have written it up. A village myth served at the level of warmth
  rather than plausibility.
