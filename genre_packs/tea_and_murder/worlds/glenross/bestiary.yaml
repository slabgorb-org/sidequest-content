# Glenross — world bestiary
#
# World-tier override on the tea_and_murder pack. This is a cosy Edwardian
# Highland murder-mystery: genre = rulebook, world owns the cast, and the
# cast is human. There are NO monsters. By doctrine this bestiary is
# intentionally MOSTLY EMPTY — only the handful of mundane Highland-glen
# creatures that could plausibly matter on an estate: an adder on the brae,
# Highland cattle in the road, a gillie's deerhound, a startled stag, vermin.
# All are real, low-level (0-1) animals.
#
# Note the world's cosy_constraints: animals are never harmed in this genre.
# These entries exist for atmosphere and the occasional "the beast is in the
# way" obstacle — a stag crossing the railway line, a shaggy cow blocking the
# single road, a deerhound that knows a stranger's scent — not for bloodshed.
#
# Stat lines follow the SRD generic form used pack-wide. Mundane animals sit
# at the floor of the ladder (level 1), hp == average (4.5/HD), ascending AC,
# morale on the 2d12 ladder.
entries:
  # --- epic-157 zone-tagging: every item below carries factions: ["*"] (world-
  #     global). This world is zoned (cartography regions declare controlled_by),
  #     so the strict load validator (story 157-7) requires a non-empty factions
  #     list on each pooled item. "*" = eligible in every zone, behavior-identical
  #     to untagged. To actually zone-scope an item, swap ["*"] for the controlled_by
  #     faction slug(s) it belongs to (see worlds/gulliver for worked examples).
  - id: brae_adder
    factions: ["*"]
    name: Brae Adder
    level: 1
    hp: 2
    armor_class: 12
    attack_bonus: 0
    damage: "1d2"
    move: "10 ft."
    morale: 4
    skill: 0
    save: 16
    role: venomous Highland snake
    tags: [beast, vermin]
    abilities:
      - "Venomous bite — a struck victim sickens; a fright and a week abed, not a death"
      - "Shy — slides off the warm stone at a footfall and strikes only when trodden on"
    description: >-
      Scotland's only venomous snake, an adder coiled on a sun-warm rock among
      the bracken of the brae. It asks nothing but to be left alone and pours
      away into the heather at any heavy step — but a hand into the wrong tussock
      or a careless foot on the hill path can earn a strike and a doctor's call.
  - id: highland_cow
    factions: ["*"]
    name: Highland Cow
    level: 1
    hp: 6
    armor_class: 11
    attack_bonus: 1
    damage: "1d6"
    move: "30 ft."
    morale: 6
    skill: 0
    save: 15
    role: shaggy hill cattle in the road
    tags: [beast, livestock]
    abilities:
      - "Immovable — a beast standing in the single-track road simply will not be hurried"
    description: >-
      A long-horned, russet-shaggy hill cow of the home farm, placid to the
      point of obstruction. No menace, only an Edwardian traffic jam: a knot of
      them standing four-square in the single-track road will hold up the
      laird's Riley, the doctor's car, and a sleuth in a hurry alike, and not a
      whit of hurry will move them before they choose.
  - id: gillies_deerhound
    factions: ["*"]
    name: Gillie's Deerhound
    level: 1
    hp: 5
    armor_class: 12
    attack_bonus: 1
    damage: "1d6"
    move: "50 ft."
    morale: 8
    skill: 1
    save: 15
    role: estate gillie's working hound
    tags: [beast, dog]
    abilities:
      - "Knows the glen — runs the deer beats and marks every scent that does not belong"
    description: >-
      A great rough-coated grey deerhound from the laird's kennels, gentle with
      the household and grave with strangers. It pads the hill at the gillie's
      heel, knows every face that belongs in the glen, and turns its long head
      toward the one that does not — a silent, watchful note for the noticing eye.
  - id: startled_red_stag
    factions: ["*"]
    name: Startled Red Stag
    level: 1
    hp: 6
    armor_class: 12
    attack_bonus: 2
    damage: "1d8"
    move: "60 ft."
    morale: 5
    skill: 0
    save: 15
    role: wild deer of the high ground
    tags: [beast]
    abilities:
      - "Bolts — a frightened stag crashes blind through fence, bracken, and railway line alike"
    description: >-
      A red stag down off the high shielings in the rut, antlered and wary,
      belonging wholly to the hill and not at all to people. No quarry and no
      threat unless cornered — but one bursting across the road at dusk or
      across the railway halt before the Inverness train is a heart-stopping
      moment and, now and then, the wrong note a mystery turns on.
  - id: distillery_rat
    factions: ["*"]
    name: Distillery Rat
    level: 1
    hp: 1
    armor_class: 11
    attack_bonus: 0
    damage: "1d2"
    move: "20 ft."
    morale: 5
    skill: 0
    save: 16
    role: warehouse and cellar vermin
    tags: [beast, vermin]
    abilities:
      - "Skulks — lives among the bonded warehouse, the byre, and the inn's back cellar"
    description: >-
      A brown rat grown bold in the warmth of the Munro distillery's bonded
      warehouse and the inn's cellar, the kind every working building keeps and
      no proprietor admits to. Harmless and gone in a flick of grey tail, it is
      worth a maid's start and a note for the careful eye: something is moving
      in the storeroom that should be locked.
