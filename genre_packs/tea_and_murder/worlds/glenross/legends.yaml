# Glenross has the legends a Highland glen has — old stories, some
# half-true. None are load-bearing for mysteries; they exist as
# colour, as the kind of thing one might hear at the inn on a wet
# afternoon. None are real in the rationalist register that
# Glenross runs at by default (gothic axis 0.05).

- name: The Green Lady of Castle Ross
  summary: >-
    A figure in a green dress sometimes seen on the upper gallery of
    the great house by visiting guests, never by the family. The
    explanation in the village is the dampness of the gallery wall
    causing the silver oxide of the old wallpaper to phosphoresce in
    moonlight. The explanation in the household is the wall-paper.
    The visitors keep seeing her, all the same.
  era: "first sighted in the 1750s; reported in fragments since"
  details: >-
    Rationalist explanation always wins at Glenross's default gothic
    axis. The visiting houseguest of the third laird who first
    reported her was the first recorded sighting, in 1755. Reported
    in fragments by visiting parties about every decade. Disappears
    entirely whenever investigated.

- name: The Burnt Shieling
  summary: >-
    On the Long Pass, a ruined cottage of unmortared stone, gable
    half-standing, the rest fallen in. Local story has it that the
    family who lived there in the 1860s vanished on a winter night
    when the snow came on early; the shieling was burnt the
    following spring by the laird's grieving servants, or by the
    family's enemies, depending on who is telling the story.
    Children dare each other to spend the night there in summer.
    They never quite manage it.
  era: "fifty years ago; burnt 1862-63"
  details: >-
    Village folklore exaggerates real history. A real shieling, a
    real fire. The family did leave the glen abruptly in 1862, but
    the local register has them down to Glasgow rather than
    disappeared. The fire was lit by the laird's factor to prevent
    squatters and to mark the end of the lease.

- name: The Stag at Dawn on the Ross
  summary: >-
    A white stag is sometimes seen on the high slopes of the high
    peak at first light. The gillies will not stalk him by long-
    standing agreement; he is the laird's family's emblem, the
    Ross stag, and to shoot him would be considered the unluckiest
    thing a man could do in this glen.
  era: "in the village's living memory and beyond"
  details: >-
    Real biological phenomenon (leucism in a deer), treated as
    legend by tradition. Reported every decade or so. The current
    laird saw one in 1898 and ordered the gillies to give him
    passage; the village took this as the right decision.

- name: The Silver in the Burn
  summary: >-
    Children's story — a chest of silver coin was thrown into the
    river during the '45 to keep it from the redcoats, and the burn
    still flashes silver in certain pools after a heavy rain. Every
    generation of village children has gone looking for it and every
    generation has come back wet, cold, and with nothing more than
    river-stones.
  era: "since 1746"
  details: >-
    Almost certainly nothing, but the story is so reliably told
    that the cataloguers of Highland folklore have written it up.
    A village myth served at the level of warmth rather than
    plausibility.

- name: The Curse on the Heirs of Castle Ross
  summary: >-
    Each generation of the laird's family is said to lose a child
    young — illness, accident, the sea. The family records show
    this is in fact what has happened, although the family records
    do not refer to a curse. A sociologist would put it down to the
    mortality rates of a small landed family in the eighteenth and
    nineteenth centuries.
  era: "two hundred years"
  details: >-
    Pattern recognition over statistical inevitability. A real
    pattern of family loss, named "curse" by village storytellers.
    The current laird's elder brother died as a child of rheumatic
    fever; this is treated by the village as another expression of
    the same long shadow. The current heir is, in this register,
    the family's hostage to fortune.

- name: The Minister Who Walked into the Pass
  summary: >-
    Generations ago a minister at the kirk — never specifically
    named in the village's telling — is said to have walked out into
    the Long Pass on a winter evening and never come back. The bell
    of the kirk rang itself once in the night. He was found in the
    spring at the high cairn, sitting upright, frozen, his hat in
    his hand. Nobody knows what he was doing.
  era: "uncertain — at least a century ago"
  details: >-
    Composite of two real events — a parish minister who died of
    exposure in 1797 and a separate sexton who rang the bell during
    a fever — recombined by the village's storytelling into a
    single mystery. The village's memory has a habit of
    compression.
