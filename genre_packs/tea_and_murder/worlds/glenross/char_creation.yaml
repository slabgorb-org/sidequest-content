- id: confirmation
  title: Settling In
  narration: |
    The publican nods slowly, as though placing the last piece of you on
    the shelf where you belong.

    "You'll be wanting a room, then, I expect. The back bedroom looks
    over the burn — better than the front, the carriages come past at
    six. Supper is at the half-hour." He picks up the cloth again.

    "And {name}? Welcome to the village. They'll have you up the lane
    for tea before the week's out."

    {name} — fresh suitcase, steady eye, the watchful air of a {class}
    sleuth lately come up from a {race} household — follows the publican's
    gesture toward the stairs.
  choices: []
  allows_freeform: false
