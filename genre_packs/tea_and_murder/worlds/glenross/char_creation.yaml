- id: origins
  title: How Do You Come to the Village?
  narration: |
    The bar of the village inn is half a foot of polished oak that has been
    polished by hands going back to your great-grandmother's time. The fire
    is going. The rain has just eased off. The publican has set down a mug
    in front of you without asking — strong tea, the kind that gets you
    through to supper.

    He wipes his hands on the cloth tucked into his belt. He has the way
    village publicans have of looking at strangers — friendly, unhurried,
    taking your measure for the next ten years.

    "Settling in, then. You'll be wanting your supper before long." He
    folds the cloth. "Where do your people come from?"
  loading_text: "The publican sets a second mug down and listens..."
  choices:
    - label: Old Family Hereabouts
      description: >-
        Your name belongs to this place. Your grandfather is in the
        kirkyard and your aunt is in the second pew. You may have been
        away — school, the regiment, the city — but the village knew you
        as a child and treats you, more or less, as one of its own.
      mechanical_effects:
        race_hint: Gentry
        background: Local
    - label: The Manse or the Surgery
      description: >-
        You were born into a respectable household — the doctor's, the
        minister's, the country solicitor's. Educated, not landed.
        Comfortable rather than wealthy. You learned early that
        professional courtesy opens doors that money cannot.
      mechanical_effects:
        race_hint: Clergy
        background: Professional
    - label: Trade or Distillery
      description: >-
        Your family built something — a mill, a shop, a distillery,
        a chandlery on the coast. The money is recent and was earned.
        The old families are polite to your face and gossip behind it.
        You do not entirely mind.
      mechanical_effects:
        race_hint: Trade
        background: New Money
    - label: The Village Itself
      description: >-
        You are of the place in the truest sense — a crofter, a
        farmhand, a shopkeeper, a railwayman's daughter. You know
        every footpath and which farms hold a grudge. The squire
        nods to you in the lane.
      mechanical_effects:
        race_hint: Servant
        background: Village
    - label: From Down South
      description: >-
        Edinburgh, Manchester, London — you were educated south of the
        line and have come north to work, to recover, or to settle.
        The village is patient with your manners. You are learning
        to be patient with the village.
      mechanical_effects:
        race_hint: Bohemian
        background: Returner
    - label: From Away
      description: >-
        India, the Cape, Canada, the Caribbean — you have lived in
        places these neighbours can barely imagine. You came back
        with stories, a slight tan, and a habit of standing at
        windows that troubles the housekeeper.
      mechanical_effects:
        race_hint: Colonial
        background: Returned
  allows_freeform: true

- id: vocation
  title: What Do You Do for a Living?
  narration: |
    The publican refills your mug without being asked. The fire pops. A
    dog has settled itself across your feet without consulting you on
    the matter.

    "Working folk, then." He says it as observation, not question.
    "There's plenty of work in a village if you've a trade for it. What's
    yours?"
  loading_text: "The publican nods slowly, as though placing you..."
  choices:
    - label: Country Doctor
      description: >-
        Surgery hours posted on the door, house calls across the glen,
        a black bag with brass clasps and a telephone (one of two in
        the village). You enter any household at any hour without
        being asked twice. You have seen everyone in their dressing-
        gown and know what their hands look like when they are lying.
      mechanical_effects:
        class_hint: Doctor
        personality_trait: observant
    - label: Parish Minister
      description: >-
        The manse, the parish register, Sunday twice and Wednesday
        evening, weddings and funerals and the awkward bit in between.
        Church of Scotland by default. You sit with the dying, the
        bereaved, and the merely guilty. People tell you things they
        will tell no one else.
      mechanical_effects:
        class_hint: Clergyman
        personality_trait: discreet
    - label: Episcopal Rector
      description: >-
        The small chapel for the recusant families and the laird's
        household when they're in residence. Scottish Episcopal —
        Anglican Communion, small congregation, an outsider's
        eye in your own parish. The Father-Brown sort of clergyman:
        attentive, patient, harder to fool than you look.
      mechanical_effects:
        class_hint: Clergyman
        personality_trait: perceptive
    - label: Postmistress
      description: >-
        The post office, the telegraph, the parcel counter. Every
        letter that enters or leaves the village passes through your
        hands. You know who writes to whom, in what frequency, and
        from where. You see the village's correspondence as a single
        long conversation about which you are the only complete witness.
      mechanical_effects:
        class_hint: Society
        personality_trait: attentive
    - label: Schoolmistress
      description: >-
        The village school, thirty children, the slate and the bell.
        You have taught every adult under forty. You know which
        marriages are going well by what the children draw at break.
        The children tell you things they will not tell their parents.
      mechanical_effects:
        class_hint: Governess
        personality_trait: principled
    - label: Country Veterinary Surgeon
      description: >-
        Large-animal practice across every farm and sporting estate
        in the glen. You see the back kitchen of every household and
        the inside of every byre. You know whose horses are kept
        well and whose are not, and what that says about the rest
        of the household.
      mechanical_effects:
        class_hint: Doctor
        personality_trait: pragmatic
    - label: Village Constable
      description: >-
        The county constabulary, one sergeant, one bicycle. Official
        authority that is utterly dependent on village cooperation.
        You know which lies are habitual and which are new. You can
        tell from a man's coat whether his Sunday was where he said
        it was.
      mechanical_effects:
        class_hint: Detective
        personality_trait: methodical
    - label: Retired Colonial Officer
      description: >-
        Half-pay, a cottage you are still painting, three months in the
        glen and already restless. India or the Cape or the West
        Indies — you came back with a bad leg, several decorations,
        and an inability to ignore a stranger who does not move like
        a civilian.
      mechanical_effects:
        class_hint: Explorer
        personality_trait: watchful
  allows_freeform: true

- id: eye
  title: What Do You Always Notice?
  narration: |
    The publican is wiping a glass slowly, the way a man does when he is
    listening to something he wants to remember. The fire has settled. The
    dog has begun to snore.

    "Folk in a village," he says, conversational, to the glass rather than
    to you. "They all see different things. The doctor sees hands. The
    minister sees faces. The schoolmistress sees the children of folk who
    haven't said a word." He sets the glass down. "What about you. What
    do you always notice?"
  loading_text: "The publican is no longer wiping the glass..."
  choices:
    - label: What's Out of Place
      description: >-
        The stain on the glove. The chair drawn up to a desk it doesn't
        belong at. The umbrella by the door that doesn't match anyone
        in the house. You see what doesn't fit, and once you've seen
        it you can't stop seeing it.
      mechanical_effects:
        personality_trait: observant
    - label: What Isn't Said
      description: >-
        The pause before the answer. The subject changed too smoothly.
        The condolence offered to the wrong person. You read silence
        the way other people read newspapers.
      mechanical_effects:
        personality_trait: perceptive
    - label: The Children
      description: >-
        Children watch everything and tell most of it to whoever asks
        nicely. A child's sudden fear of a particular adult is a fact
        worth its weight. A child's sudden knowledge of a word they
        shouldn't have is a clue.
      mechanical_effects:
        personality_trait: patient
    - label: The Money
      description: >-
        Sudden frugality. Sudden flush. A new hat on a wife whose
        husband is meant to be in debt. A pew rebuilt by a family
        that swore they had nothing. You follow the money because
        the money has never lied to you yet.
      mechanical_effects:
        personality_trait: shrewd
    - label: The Room Before the People
      description: >-
        You take a room in before you take its occupants in. What's
        on the mantel. Which book is half-read. Whether the windows
        have been opened today. By the time you greet your host you
        already know more than they intend.
      mechanical_effects:
        personality_trait: attentive
    - label: I Won't Let It Go
      description: >-
        It isn't that you notice more than other people. It's that
        you don't stop noticing. Once something has caught your
        attention you will return to it until it gives way, however
        long that takes, however gentle you have to be.
      mechanical_effects:
        personality_trait: tenacious
  allows_freeform: true

- id: drive
  title: What Really Brought You Here?
  narration: |
    The publican has stopped pretending to work. The fire has burned low and
    the dog has gone quiet against your feet. He sets both his hands flat on
    the oak and looks at you the way the kirk looks at a latecomer — not
    unkind, but not fooled.

    "A body doesn't come up the glen for the weather," he says. "There's
    always a reason under the reason. I'll not press you on it — but you'll
    carry it about whether you tell me or no, and it'll be at every door you
    knock on while you're with us. So. What is it that's really brought you
    to Glenross?"
  loading_text: "The publican sets both hands flat on the oak..."
  choices:
    - label: A Death They Called an Accident
      description: >-
        Someone went off the cliff path, or under the ice, or quietly to
        sleep and never woke — and the fatal-accident inquiry was satisfied.
        You are not. You have come the length of the country because you
        cannot let a verdict stand that you know in your bones is a lie.
      mechanical_effects:
        relationship: the_unquiet_dead
        goals: prove_it_was_murder
        emotional_state: quietly resolute
        jungian_hint: hero
    - label: A Name You Mean to Clear
      description: >-
        Someone you care for was blamed — for the theft, the scandal, the
        death — and the village has settled comfortably on its verdict. You
        have come to unsettle it. You will not leave until the right name is
        spoken in the right doorways.
      mechanical_effects:
        relationship: the_wrongly_blamed
        goals: clear_an_innocent_name
        emotional_state: stubbornly loyal
        jungian_hint: caregiver
    - label: A Promise Made at a Deathbed
      description: >-
        You held a hand as it went cold and you swore something — to find
        someone, to right something, to carry a message you don't fully
        understand. The promise brought you here. You mean to keep it
        whatever it costs.
      mechanical_effects:
        relationship: the_one_who_died
        goals: keep_a_deathbed_promise
        emotional_state: burdened by duty
        jungian_hint: everyman
    - label: Someone Who Came Here and Vanished
      description: >-
        A letter that stopped arriving. A relative, a friend, a client who
        travelled north and was never heard from again. The trail goes cold
        at the edge of this parish. You have come to find where it leads —
        and to whom.
      mechanical_effects:
        relationship: the_missing
        goals: find_the_vanished
        emotional_state: anxiously searching
        jungian_hint: explorer
    - label: A Letter That Should Not Exist
      description: >-
        Something reached your hands that was never meant to — a confession,
        a threat, a name in an old hand. You could have burned it. Instead
        you came to learn what it means, and the knowing has already begun
        to be dangerous.
      mechanical_effects:
        relationship: the_unknown_writer
        goals: uncover_a_buried_secret
        emotional_state: warily curious
        jungian_hint: sage
    - label: A Reckoning of Your Own
      description: >-
        You have business here that is older than this week — a wrong done
        to you, or by you, that the years never settled. You told yourself
        you'd let it lie. You were lying. You have come back to have it
        out, one way or the other.
      mechanical_effects:
        relationship: the_old_wrong
        goals: settle_an_old_score
        emotional_state: privately driven
        jungian_hint: rebel
  allows_freeform: true

- id: fate_aspects
  title: "Now, Who Are You Really?"
  narration: |
    The publican sets down his cloth and looks at you properly for the first time,
    the way a village looks at a newcomer — kindly, and missing nothing. "You'll
    forgive an old man his curiosity," he says, "but we get few enough faces up here
    that I like to have the measure of them. Not your name, mind. The other thing —
    the way folk would sum you up in a breath, before they'd decided whether to
    trust you with the good china."

    He draws two glasses and fills neither.

    "And we've all a weakness, haven't we. The flaw that follows a body about. The
    thing that'll get you into bother in a place as quiet as this — and quiet
    places, I find, have the most bother of all, once you scratch them. Tell me that
    as well. And whatever else you'd have the village know."
  loading_text: "The publican looks at you properly..."
  mechanical_effects:
    fate_chargen_step: aspects
  choices: []
  allows_freeform: false

- id: fate_pyramid
  title: "And What Are You Good At?"
  narration: |
    "It's a small place," the publican says, "but don't let the smallness fool you.
    A village will ask more of a person than a city ever does, for there's nobody
    else to hand the awkward business to. So tell me true — what are you actually
    good at, when the talking's done and something wants doing?"

    He produces a stub of pencil and the back of a brewer's docket. "Set it in
    order, now, and set it honest. The one thing you're a marvel at. A few you're
    sound at. The rest you'll muddle through, the way we all do. The folk who reckon
    they're grand at everything are generally the ones found wanting at the worst
    possible moment — and up here, the worst possible moment does come round."
  loading_text: "The publican licks the pencil..."
  mechanical_effects:
    fate_chargen_step: pyramid
  choices: []
  allows_freeform: false

- id: fate_stunts
  title: "Have You a Trick to You?"
  narration: |
    "One last thing, and then I'll let you to your supper." The publican leans on
    the bar, his voice dropping, friendly as ever and somehow no longer quite so
    simple. "Everyone clever has a trick. Not a pistol — we don't go in for that
    sort of thing here, or we say we don't. A *knack*. The thing you do that the
    other party never sees until it's done and dusted."

    He nods at you, almost approving. "Choose what you'll carry into our little
    troubles. But choose modestly. In a place this small, every clever turn you
    lean on is one the village remembers — and a village, sir, has a very long
    memory, and settles all its accounts at the church door."
  loading_text: "The publican waits, no longer quite so simple..."
  mechanical_effects:
    fate_chargen_step: stunts
  choices: []
  allows_freeform: false

- id: the_satchel
  title: What You Brought
  narration: |
    The publican pauses, glancing down at the satchel by your stool.

    "Country folk travel light," he says, with a small approving nod.
    "But you'll have come with the things of your trade. The pockets
    of a calling carry their own ledger."

    He sets a fresh mug on the bar and lets you settle the bag at
    your feet — the working contents of a {class}'s working life.
  loading_text: "The publican glances at your satchel..."
  choices: []
  allows_freeform: false
