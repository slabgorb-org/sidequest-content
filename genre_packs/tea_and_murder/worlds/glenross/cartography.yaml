  the_tea_rooms:
    name: Mrs. Cameron's Tea Rooms
    summary: "Three round tables, a counter, china that does not match"
    description: >-
      A small parlour off the lane with three round tables in starched
      linen, a counter, a kitchen behind a half-door, and a window of
      mismatched panes. Mrs. Cameron runs it, her cook bakes seed cake
      on Mondays and shortbread on Thursdays, and the geraniums in the
      window are her late mother's. The village's daytime social life
      happens here — the parish committee, the lift to the schoolhouse,
      the unofficial reckoning of who has been seen with whom.
    terrain: building
    controlled_by: mrs_cameron
    adjacent:
