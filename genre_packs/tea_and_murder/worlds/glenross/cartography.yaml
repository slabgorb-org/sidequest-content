  the_surgery:
    name: The Surgery
    summary: "Dr. Ross's consulting room, dispensary, and waiting bench"
    description: >-
      A converted cottage opposite the inn, painted cream, with surgery
      hours posted on the door (Mon-Wed-Fri, ten to noon and four to six).
      The waiting room is the front parlour with a bench along the wall
      and a small shelf of well-worn books. The consulting room is
      behind, with the examining couch and the dispensary cabinet. Dr.
      Eilidh Ross lives upstairs. One of the village's two telephones is
      mounted on the surgery wall.
