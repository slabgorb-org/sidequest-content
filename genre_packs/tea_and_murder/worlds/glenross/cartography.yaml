map_resolution: null
map_style: >-
  A handpainted parish map in the style of an Ordnance Survey reissue
  c. 1905 — village centre rendered in fine ink, the river Allt Ross in
  pale blue, the kirkyard and the Big House labelled in copperplate, the
  surrounding glen in soft watercolour wash of heather purple and bracken
  ochre. Tea-coloured paper. The cartographer was the schoolmistress's
  brother on a winter visit.
navigation_mode: region
starting_region: the_glenross_arms
world_name: Glenross

regions:
  the_glenross_arms:
    name: The Glenross Arms
    summary: "The village inn, the fire going, the publican wiping the bar"
    description: >-
      A two-storey stone building at the village crossroads with a slate
      roof, three small dormer windows above and a swinging sign painted
      with the Ross arms. Bar through the door on the right, parlour on
      the left, three rooms upstairs with sloping floors and a view of
      the burn from the back bedroom. Hamish Sinclair keeps it, his dog
      Caley sleeps in front of the fire, and the snug at the end of the
      bar is where the village's quieter conversations happen.
    terrain: building
    controlled_by: hamish_sinclair
    adjacent:
      - the_post_office
      - the_kirk_of_st_maelrubha
      - the_bridge
      - the_surgery
    landmarks:
      - the bar with its slate of regulars' tabs
      - the snug at the end with its private fire
      - the upstairs landing with three numbered doors
      - the stable yard behind, used for visiting traps
    entities:
