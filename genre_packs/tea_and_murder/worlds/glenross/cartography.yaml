  the_distillery:
    name: The Munro Distillery
    summary: "Three generations of Munros, a working still, peat-smoke in November"
    description: >-
      The distillery sits west of the bridge along the burn, downwind by
      design. A long stone building with two pagoda-roofed kilns, a
      mash house, the still room, three bonded warehouses, and a small
      office where Donald Munro keeps the books and the visitors. The
      copper stills are sixty years old. The current vintage is
      well-spoken-of in Edinburgh; a London merchant ordered three
      casks last spring. The distillery is the village's outward face.
    terrain: building
    controlled_by: donald_munro
    adjacent:
      - the_bridge
      - castle_ross
    landmarks:
      - the two pagoda kilns
      - the bonded warehouse (number one — the longest aged)
      - the still room with the two copper stills (Caelidh and Brigid)
      - the distiller's office with the tasting cabinet
    entities:
      - id: pagoda_kilns
        label: the two pagoda kilns
        tier: real_object
        binding:
          kind: location_feature
          ref: distillery_pagoda_kilns
        affordances:
          - inspect
      - id: bonded_warehouse
        label: the bonded warehouse
        tier: real_object
        binding:
          kind: location_feature
          ref: distillery_warehouse
        affordances:
          - enter
          - inspect_casks
      - id: still_room
        label: the still room
        tier: real_object
        binding:
          kind: location_feature
          ref: distillery_still_room
        affordances:
