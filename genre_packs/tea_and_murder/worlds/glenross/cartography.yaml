  the_bridge:
    name: The Bridge over the Allt Ross
    summary: "The single stone bridge at the centre of the village"
    description: >-
      A handsome stone bridge of three arches across the river Allt Ross
      at the village centre. The drove road crossed here a hundred years
      before the railway arrived; the road now turns east-west at the
      bridge to the Pass and to the coast respectively. The river runs
      dark and fast over the stones beneath; in autumn the leaves
      collect against the upstream side of the central arch and the
      gillie clears them once a week.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_glenross_arms
      - the_post_office
      - the_railway_halt
      - the_distillery
      - the_long_pass
    landmarks:
      - the three stone arches
      - the central span (the place where the village stops to look at the river)
      - the upstream side where the leaves collect
      - the milestone at the south end (Inverness 28, Cullenmore 7)
    entities:
