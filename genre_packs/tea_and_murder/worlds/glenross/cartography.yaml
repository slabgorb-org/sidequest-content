  the_manse:
    name: The Manse
    summary: "Rev. Murchison's house — beekeeper, rose-grower, listener"
    description: >-
      A handsome stone house beside the kirkyard, two storeys, slate
      roof, sash windows with the curtains never quite drawn. Andrew
      Murchison lives here alone since his wife's death five years ago,
      kept in order by his housekeeper Mrs. Drummond. The walled garden
      behind has six hives, a bench, and roses that take the autumn
      sunlight beautifully. The minister's study at the front looks
      onto the lane.
    terrain: building
    controlled_by: andrew_murchison
    adjacent:
