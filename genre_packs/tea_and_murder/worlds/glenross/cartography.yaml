  st_margarets_chapel:
    name: St. Margaret's Chapel
    summary: "Scottish Episcopal — Rev. Quill's small congregation"
    description: >-
      A small chapel of Aberdeenshire granite, a single nave, a vestry,
      and a porch with a noticeboard listing services in a copperplate
      hand. Rev. Alistair Quill has been rector here twelve years and
      lives in the cottage behind, which has a study smelling of beeswax
      and ink and a kitchen that needs more light than it gets. The
      congregation of forty includes the Ross family of Castle Ross and
      a scattering of recusant farmers from the upper glen.
    terrain: building
    controlled_by: alistair_quill
    adjacent:
