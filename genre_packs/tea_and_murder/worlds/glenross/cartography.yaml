  the_kirk_of_st_maelrubha:
    name: The Kirk of St. Maelrubha
    summary: "The parish kirk on its mound, with the long kirkyard sloping to the burn"
    description: >-
      A Norman-Scoto-medieval parish kirk on a low mound at the village
      centre, restored in the 1850s with the laird's father's money.
      Square bell-tower, a long nave, oak pews dark with three centuries
      of polish, the laird's family pew at the front and the village's
      working pews behind. The kirkyard slopes down to the burn,
      gravestones leaning, moss bright in the rain. The Murchisons,
      Munros, Buchans, Ferguson, and MacRaes are all in here somewhere.
    terrain: building
    controlled_by: kirk_session
    adjacent:
      - the_manse
      - the_surgery
      - st_margarets_chapel
      - the_cricket_ground
      - the_glenross_arms
    landmarks:
      - the bell-tower (the bell is rung for funerals, Sundays, fires, and the New Year)
      - the laird's pew at the front
      - the war memorial in the porch (South Africa, three names)
      - the kirkyard slope down to the burn
    entities:
      - id: bell_tower
        label: the bell-tower
        tier: real_object
        binding:
          kind: location_feature
          ref: kirk_bell_tower
        affordances:
