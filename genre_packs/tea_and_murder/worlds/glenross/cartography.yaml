  the_long_pass:
    name: The Long Pass
    summary: "The drove road north up the glen toward the shielings"
    description: >-
      The Long Pass is the road north out of the village, climbing
      gently for two miles before it narrows into a pass between the
      Ross of Glenross to the east and the lower Ben Eilidh to the
      west. Beyond the pass the road becomes a track, the track
      becomes a path, and the path leads to the high shielings, the
      deer forest, and eventually — if you keep going for a day —
      another parish. The Pass is where chase scenes and body
      discoveries happen; it is also where the village walks of a
      summer evening for the view.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_bridge
      - castle_ross
    landmarks:
      - the high cairn at the head of the pass (built by a previous laird's wife)
      - the burnt shieling (a ruin, late 1860s, the cause is folklore now)
      - the view of the glen back south, on a clear day
      - the path that branches east to the Ross summit
    entities:
      - id: high_cairn
        label: the high cairn at the head of the pass
        tier: real_object
        binding:
          kind: location_feature
          ref: long_pass_high_cairn
        affordances:
          - inspect
          - shelter_behind
      - id: burnt_shieling
