  the_railway_halt:
    name: Glenross Halt
    summary: "A single platform, two trains a day, Stationmaster MacGregor"
    description: >-
      A single platform of dressed stone with a wooden waiting room, a
      ticket window, a stationmaster's office, a small goods siding for
      whisky barrels, and a kettle in the office that is always on.
      Albert MacGregor is stationmaster, has been for twenty years, and
      knows by face every regular passenger and every regular freight.
      Two trains a day — the morning up from the south, the afternoon
      down from Inverness. Anything happening in the village that
      involves the world arrives or departs from this platform.
    terrain: building
    controlled_by: albert_macgregor
    adjacent:
      - the_school
      - the_bridge
    landmarks:
      - the stationmaster's office (kettle always on)
      - the goods siding for the distillery
      - the ticket window
      - the wooden bench under the awning
