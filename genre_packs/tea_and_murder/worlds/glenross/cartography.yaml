  the_cricket_ground:
    name: The Cricket and Shinty Ground
    summary: "The village's social fixture meadow — both codes, friendly rivalries"
    description: >-
      A long flat meadow east of the kirk, leased from the laird and
      kept by the village. Cricket through the summer, shinty in
      autumn, the parish fete in late August. The pavilion at the
      north end is the village's only structure of pure leisure — a
      wooden, lime-washed, slate-roofed clubhouse with a verandah and
      two changing rooms. The visiting Cullenmore eleven and shinty
      fifteen come up by train; the rivalry is older than the railway.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_kirk_of_st_maelrubha
      - castle_ross
    landmarks:
      - the pavilion at the north end
      - the cricket square at the centre
