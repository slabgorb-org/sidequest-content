  castle_ross:
    name: Castle Ross
    summary: "The laird's house on the rise — Highland baronial, late additions"
    description: >-
      A late-Georgian house with a Highland baronial restoration of the
      1870s — turret, crow-stepped gables, a porte-cochère added in 1888
      for the visiting Royal stalking party that never quite happened.
      Twenty bedrooms, fourteen of them in use during the season. Walled
      gardens on the south side, the river below, the parkland and home
      farm to the west. Sir Iain and Lady Annabel keep it; their son
      Hugo is here for the autumn. The household is the village's largest
      single employer.
    terrain: building
    controlled_by: ross_family
    adjacent:
      - the_distillery
      - the_long_pass
      - the_cricket_ground
    landmarks:
      - the porte-cochère and the main door
      - the library on the south side (the laird's room)
      - the rose garden (the gardener's domain — and the place where bodies are sometimes found)
      - the gun-room beside the stables
      - the long drive down to the lodge gates
