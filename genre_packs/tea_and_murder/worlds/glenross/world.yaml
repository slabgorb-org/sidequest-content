name: Glenross
slug: glenross
cover_poi: the_glenross_arms
description: >-
  A fictional Highland village in Edwardian Scotland, c. 1908 — post-Victorian,
  pre-Great-War, the long warm afternoon of empire. No swords, no séances by
  default, no fist-fights in the kirk yard. The currency is standing, gossip,
  observation, and a steady noticing eye. Stone cottages and slate roofs;
  the river Allt Ross threads through the glen; the kirk sits on its mound,
  Castle Ross on the rise above the burn, the distillery smoking faintly all
  year and in earnest from August. Single road in, single railway halt out,
  two trains a day to Inverness. Large enough to support a minister, a doctor,
  a school, a post office, one inn — small enough that everyone knows
  everyone's business by sundown. The village's recurring cast you will come
  to love; the mystery's victims will arrive on the morning train.

axis_snapshot:
  cosy: 0.75
  puzzle: 0.7
  gossip: 0.7
  gothic: 0.05

starting_location: the_glenross_arms
starting_time: "late afternoon, autumn"

premise: >-
  Glenross is a working Highland village in the Edwardian afternoon
  of empire. The railway came thirty years ago and the village
  rearranged itself around it; the Big House has settled into a
  cordial-but-distant arrangement with the village it owns; the
  distillery is making a name for itself in Edinburgh and London;
  the parish school is full. Each session is one mystery — a body
  found in the rose garden, a visitor with business he won't quite
  specify, a will that surprises everyone, a letter from abroad
  that changes a household's morning. The sleuth has a day job and
  a noticing eye; the village has time for a sherry afterwards.

mood: >-
  The Highland light. Heather and bracken in autumn, the river dark
  and quick over the stones beneath the bridge, peat smoke from the
  cottages, the long warm gold of an afternoon that means rain by
  evening. The inn fire is going from October to April. The kettle
  is always on at the manse, the surgery, the post office, the tea
  rooms, and Mrs. Cameron will judge your sugar habits in silence
  but won't bring it up.

themes:
  - "The village is the warm centre and the mystery is the wrong note that surfaces against it"
  - "Class still matters in Edwardian Scotland but the village is small enough that everyone knows everyone"
  - "The puzzle is always fair — the answer is on the page before it is named"
  - "Standing and gossip are the village's currency; the kirk session and the post office are its courts"

chapter_arc: episodic

# Each session is one mystery, resolved cleanly. The village's standing
# cast carries continuity across sessions (the new curate joins, Hugo
# Ross drifts toward Dr. Ross, the schoolmistress takes in her invalid
# sister) but the *mystery* is per-session. There is no "veteran" tier
# — the warmth is the point.
