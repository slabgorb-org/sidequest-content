# Glenross — Portrait Manifest
#
# Z-Image authoring per sidequest-content/PROMPTING_Z_IMAGE.md.
# The genre and world visual_style.yaml positive_suffix already carry
# style / palette / light / safety. Entries here describe the SUBJECT
# only — who the person is, what they wear, expression, simple
# background. No proper nouns in appearance fields (Z-Image renders
# them as text). Role / location names are abstracted to visual
# archetypes ("a Highland parish minister", not "Andrew Murchison").
#
# Costume clauses are written positively (no "never wears X"). One or
# two named colours per entry produce a hand-tinted feel against the
# watercolour suffix; the rest stay tonal.

characters:
  # ── CLERGY ─────────────────────────────────────────────────────

  - name: Reverend Andrew Murchison
    role: Church of Scotland parish minister
    type: npc_major
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult man in his early sixties, fully
      clothed, modest country dress. A long mild face, deep-set grey
      eyes, silver hair receding above the temples and kept short. Wearing
      a dark wool clerical suit with a black single-breasted waistcoat,
      a plain white linen collar and bands at the throat, and a tweed
      jacket folded over one arm. One hand resting in a trouser pocket,
      the other holding a small black-leather notebook with a finger
      keeping his place. Calm, attentive expression, looking slightly
      past the viewer the way a habitual listener looks past a speaker.
      Plain pale-cream background, no border, no frame. Adult human
      anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian Scottish parish-minister register, sober and unadorned,
      tonal warm-grey and quiet-cream, the dignity of plain cloth.

  - name: Reverend Alistair Quill
    role: Scottish Episcopal rector
    type: npc_major
    culture: english_gentry
    appearance: >-
      Half-length portrait of an adult man in his mid-forties, slight
      of build, fully clothed, modest. A mild forgettable face, brown
      hair receding at the temples, clear grey eyes wearing wire-rimmed
      pince-nez. Wearing a long black cassock over a Roman collar, a
      small breviary held in both hands at chest height, the left
      little finger slightly crooked. Faint apologetic smile, attentive
      eyes. The figure stands at three-quarter angle to the camera.
      A small dark-honey accent at the bookmark ribbon hanging from
      the breviary. Plain cream background, no border. Adult human
      anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Anglican Communion small-parish clerical register, English-
      educated, restrained and a little austere in costume against a
      warm cream watercolour ground.

  # ── PROFESSIONS ────────────────────────────────────────────────

  - name: Dr. Eilidh Ross
    role: Country general practitioner
    type: npc_major
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult woman in her early thirties of
      medium height and steady carriage, fully clothed, modest. Dark
      auburn hair pinned back in a practical low twist, direct grey
      eyes. Wearing a tailored Edwardian navy walking suit with a high-
      collared white blouse and a small dark cravat, a small leather
      wristwatch on the left wrist, a doctor's pocket-watch chain
      across the waistcoat. One hand resting on the back of a
      writing chair, the other holding a leather-bound notebook.
      Composed, slightly cocked-head expression, the look of someone
      about to ask a careful question. Plain warm-cream background.
      Adult human anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian professional woman's register, sober navy and white
      against warm cream, the early-twentieth-century woman doctor's
      composure carried plainly.

  - name: Mrs. Catriona Buchan
    role: Village postmistress
    type: npc_major
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult woman in her late fifties,
      small, neat, fully clothed, modest. Iron-grey hair in a tight
      bun, sharp clear features, wire-rimmed spectacles slipped down
      the nose. Wearing a starched white high-collared blouse with a
      small dark brooch at the throat, a dark wool skirt, a navy
      cardigan over the blouse. A pencil tucked above the right ear.
      Hands resting one on the other in front of her, the right
      forefinger ink-stained. Attentive, alert expression, the look
      of someone reading a postmark while pretending not to. Plain
      cream background. Adult human anatomy, natural hands, non-
      sexualised depiction.
    culture_aesthetic: >-
      Edwardian Scottish village postmistress register, neat starched
      white and dark wool, the iconography of practical authority.

  - name: Miss Margaret Ferguson
    role: Village schoolmistress
    type: npc_major
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult woman in her late forties of
      upright bearing, fully clothed, modest. Dark brown hair gone
      iron-grey at the temples, worn in a chignon, wire spectacles
      lifted onto the crown of the head. A long dark walking skirt,
      a high-collared white blouse with a small mother-of-pearl
      brooch at the throat, a soft heather-grey cardigan around the
      shoulders. Faint chalk dust on the cuffs and the inside of
      the right sleeve. The right hand resting lightly on a closed
      schoolbook with a worn green cover. Composed, patient
      expression, slightly arch. Plain cream background. Adult
      human anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian Scottish schoolmistress register, dark wool and
      starched white, the heather-grey cardigan as the day's only
      softness.

  - name: Hamish Sinclair
    role: Village publican
    type: npc_major
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult man in his early fifties of
      broad-shouldered comfortable middle figure, fully clothed,
      modest. Red-brown hair gone sandy-grey, a moustache trimmed
      short, clear blue eyes. Wearing a brown wool waistcoat over a
      collarless white shirt with the sleeves rolled to the elbow,
      a dark linen apron tied loosely at the hip. A polishing cloth
      tucked in the waistband. One hand resting on his hip, the
      other holding a glass cloth folded twice. Genial, unhurried
      expression, the slight smile of a man who has met a lot of
      strangers. Plain warm-cream background. Adult human anatomy,
      natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Highland village publican register, warm brown wool and white
      linen, the comfortable physical authority of a man behind his
      own bar without the bar in the frame.

  # ── CASTLE ROSS ────────────────────────────────────────────────

  - name: Sir Iain Ross of Glenross
    role: Laird of a Highland estate
    type: npc_major
    culture: english_gentry
    appearance: >-
      Half-length portrait of an adult man in his early fifties of
      upright military bearing, fully clothed, modest. Dark hair
      silvering at the temples, a clipped dark moustache, hooded
      steady blue eyes. Wearing a tweed three-piece in muted heather-
      grey and brown check, a starched white shirt with a small
      dark four-in-hand tie, a heavy gold signet ring on the right
      hand. The left hand resting on a polished walking stick, the
      right at his side. Distant courteous expression, the carriage
      of a man on full attention since he inherited a responsibility
      he was not raised for. Plain warm-cream background. Adult
      human anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian Highland laird register, muted heather tweed and
      gold-signet-and-walking-stick, the carriage of a regimental
      officer carrying an estate.

  - name: Lady Annabel Ross
    role: Mistress of a Highland country house
    type: npc_major
    culture: english_gentry
    appearance: >-
      Half-length portrait of an adult woman in her late forties of
      slight stature and composure, fully clothed, modest. Fair hair
      fading to silver, low chignon, pale grey eyes that hold the
      viewer without blinking. Wearing an Edwardian afternoon dress
      in dove-grey silk with cream lace at the cuffs and high
      collar, a single string of small pearls at the throat, a
      small honey-gold cameo at the brooch. One hand resting on
      the back of a low chair to steady herself, the other folded
      in her lap. Warm composed expression, faintly amused. A
      faint silvery line above the right eyebrow, an old riding
      scar. Plain warm-cream background. Adult human anatomy,
      natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian country gentlewoman register, dove-grey silk and
      cream lace, the pearls and the cameo doing the work the
      jewellery box would have done in her mother's day.

  - name: Hugo Ross
    role: A laird's son and heir
    type: npc_major
    culture: english_gentry
    appearance: >-
      Half-length portrait of an adult man of twenty-six, tall, lean,
      fully clothed, modest. Dark hair, pale clear grey eyes
      inherited from his mother, a thin line of a scar on the upper
      lip from a school injury. Wearing a Cambridge-tailored tweed
      jacket in muted heather and brown with a single-button waistcoat,
      a white shirt with a soft turndown collar and a striped club
      tie in muted blue-and-honey, brogues. One hand in a trouser
      pocket, the other holding a cricket bat with a chip in the
      toe at his side. Distractible bright expression, the slight
      laugh of someone who has laughed at the wrong moment in serious
      conversations and is about to do it again. Plain warm-cream
      background. Adult human anatomy, natural hands, non-sexualised
      depiction.
    culture_aesthetic: >-
      Edwardian young-gentleman register, Cambridge tweed and club
      tie, the cricket bat doing visible work that the cricket bat
      is doing serious emotional work in the painting.

  # ── VILLAGE ────────────────────────────────────────────────────

  - name: Sergeant Findlay MacRae
    role: Village constable
    type: npc_supporting
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult man in his late forties, heavy-
      set, fully clothed, modest. Grey hair clipped short, sandy
      moustache, deep-set hazel eyes. Wearing the dark-blue serge of
      the Edwardian Scottish county constabulary, brass buttons
      polished, sergeant's stripes at the upper arm, the high collar
      buttoned, the cap held in the left hand at his side. A
      regulation notebook with elastic strap and a stub of pencil
      tucked into the right breast pocket. A bicycle clip on the
      right ankle visible at the lower edge of the frame. Patient,
      unhurried expression, the slight watchfulness of a man who
      asks the same question three times in three weeks. Plain
      warm-cream background. Adult human anatomy, natural hands,
      non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian Scottish village constable register, dark-blue serge
      and brass buttons, the bicycle clip and the notebook doing all
      the iconographic work.

  - name: Mrs. Janet Cameron
    role: Tea-room proprietress
    type: npc_supporting
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult woman in her early sixties of
      comfortable figure and warm authority, fully clothed, modest.
      Iron-grey hair under a small white lace cap, bright dark eyes.
      Wearing a dark-blue afternoon dress with a starched white
      pinafore embroidered along the bib in fine dark thread, a
      slim gold wedding ring on a chain at the throat. The hands
      folded in front, slightly flour-dusted. Hospitable warm
      expression with the faint sharpness of a woman who is also
      taking your measure. Plain warm-cream background. Adult
      human anatomy, natural hands, non-sexualised depiction.
    culture_aesthetic: >-
      Edwardian Scottish tea-room proprietress register, dark blue
      and starched white, the embroidered pinafore the only personal
      ornament.

  - name: Donald Munro
    role: Highland distillery proprietor
    type: npc_supporting
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult man in his mid-fifties of
      compact build and considered composure, fully clothed, modest.
      Dark hair gone iron-grey, a beard kept short and square, grey
      eyes. Wearing a working tweed three-piece in malt-and-peat
      brown and grey, a soft turndown collar with a plain dark
      four-in-hand tie, a velvet-pouched tasting glass kept in the
      breast pocket. One hand at his belt where an old pocketknife
      on a leather thong is just visible. Meticulous, attentive
      expression. The right cuff faintly malted at the edge. Plain
      warm-cream background. Adult human anatomy, natural hands,
      non-sexualised depiction.
    culture_aesthetic: >-
      Highland distiller register, malted-brown tweed and dark four-
      in-hand, the working pocketknife and the tasting glass doing
      the iconographic work.

  # ── PERIPHERAL / ROTATING ──────────────────────────────────────

  - name: Old Tam Cattanach
    role: Head gillie
    type: npc_supporting
    culture: highland_scots
    appearance: >-
      Half-length portrait of an adult man of indeterminate elderly
      age, spare and slightly stooped, weathered to the colour of
      autumn heather, fully clothed, modest. Iron-grey hair under a
      worn dark tweed cap, pale blue eyes. Wearing a tweed jacket in
      the same heather-and-bracken colours as the hill, a woollen
      waistcoat over a collarless shirt, a leather thong at the
      throat from which a small old pocketknife is visible. Brogues
      that have been resoled many times. Hands clasped in front of
      him, weathered and unhurried. Taciturn watchful expression,
      a beat slower to attend than most people would have been.
      Plain warm-cream background. Adult human anatomy, natural
      hands, non-sexualised depiction.
    culture_aesthetic: >-
      Highland head-gillie register, heather tweed and brogues, the
      tweed cap doing iconographic work it has done for thirty
      years.
