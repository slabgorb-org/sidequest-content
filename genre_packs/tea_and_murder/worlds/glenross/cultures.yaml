# Glenross uses the genre's six cultures, mapped to local families.
# The village is overwhelmingly Highland Scots, with a thin top layer
# of English Gentry (the Ross family) and London Professional (the
# rector, the doctor when she trained in Edinburgh, the visiting
# solicitor). The Industrial North and Colonial cultures arrive
# only via visitors and returners.

# Highland Scots — the village's bedrock:
#   The Munros (distillers), Buchans (post office), Fergusons (school),
#   MacRaes (constable), Murchisons (manse), Sinclairs (publican),
#   Cattanachs (gillies), the tenant crofters, the home farm.
#
# English Gentry — a thin top layer:
#   The Ross family of Castle Ross — though three generations in the
#   glen, they remain socially gentry by register.
#   Visiting London party during the season.
#
# London Professional — the educated incomers:
#   Rev. Alistair Quill (Scottish Episcopal, English-trained).
#   Dr. Eilidh Ross's Edinburgh medical school register.
#   The county solicitor on his Wednesday visits.
#
# Servant Class — below stairs at Castle Ross:
#   The household staff are mostly local Highland Scots but socially
#   classified as Servant when in service.
#
# Industrial North — visitors only:
#   The London whisky merchant who comes up for the harvest.
#   The occasional Mancunian engineer for the railway works.
#
# Colonial — the returners:
#   The Retired Colonel (when he is in residence).
#   Visiting cousins back from India for a season.

# No new cultures needed — the genre's six cultures plus the
# Highland Scots culture (added at genre-tier in this rebrand)
# cover the village.
