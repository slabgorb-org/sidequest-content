# NPC archetypes for Tea & Murder — Edwardian cosy village.
# These feed the narrator's NPC generation (Monster Manual pre-gen and
# in-play creation). PC vocations live in char_creation.yaml; these are
# the supporting cast the narrator will draw from when populating a
# village world. Each archetype carries Victoria-era emotional stats
# (Pride, Angst, Passion, Humour, Cunning, Nerve) from the genre's
# rules.yaml.

- name: The Village Minister
  description: >-
    Church of Scotland parish minister, widowed or unmarried, beekeeper,
    rose-grower, sits with the dying without making a fuss. Hears more
    than he says. The kind of clergyman who can stay silent in a way
    that makes other people fill the silence.
  personality_traits:
    - patient
    - observant
    - discreet
  typical_classes:
    - Clergyman
  typical_races:
    - Clergy
    - Gentry
  stat_ranges:
    Nerve: [14, 18]
    Humour: [10, 14]
    Cunning: [12, 14]
  inventory_hints:
    - a bee-veil hanging by the kitchen door
    - sermon notes folded between the pages of a book
    - a small notebook in which the parish's troubles are listed by surname
  dialogue_quirks:
    - lets a pause stretch long enough that the other speaker fills it
    - quotes scripture so naturally it sounds like village common sense
  disposition_default: 10

- name: The Rector
  description: >-
    Scottish Episcopal — the Anglican Communion's small Scottish branch.
    An English education, a Highland posting, a congregation of perhaps
    forty. Carries the outsider's eye in his own parish. The
    Father-Brown sort: easy to underestimate, harder to mislead than he
    looks, given to gentle relentless questions.
  personality_traits:
    - mild
    - relentless
    - underestimated
  typical_classes:
    - Clergyman
  typical_races:
    - Clergy
    - Gentry
  stat_ranges:
    Cunning: [14, 18]
    Nerve: [12, 16]
    Humour: [12, 14]
  inventory_hints:
    - a worn breviary
    - a card-case kept entirely for the laird's family and three other households
    - a black umbrella that has been mended twice
  dialogue_quirks:
    - asks the same gentle question in three different ways across an hour
    - apologises for noticing things he has clearly noticed on purpose
  disposition_default: 5

- name: The Country Doctor
  description: >-
    Surgery hours posted on the door, house calls across the glen, the
    only person in the parish who crosses every threshold without
    knocking twice. Trusted with bodies and, inevitably, with secrets.
    Overworked, underpaid by the poor, occasionally overpaid by the
    guilty.
  personality_traits:
    - pragmatic
    - discreet
    - quietly tired
  typical_classes:
    - Doctor
  typical_races:
    - Clergy
    - Gentry
    - Trade
  stat_ranges:
    Cunning: [14, 16]
    Nerve: [14, 16]
    Humour: [10, 14]
  inventory_hints:
    - a medical bag with brass clasps
    - a pocket watch checked with habitual frequency
    - a notebook with patient initials and a code only he reads
  dialogue_quirks:
    - reaches for medical metaphors when describing social ailments
    - pauses before any answer the way a man pauses before signing
  disposition_default: 10

- name: The Postmistress
  description: >-
    Runs the post office and the telegraph. Knows every household's
    correspondence — who writes to whom, in what frequency, in whose
    hand. Affable on the counter, sharp in the back room. Information
    is her trade and she trades carefully.
  personality_traits:
    - attentive
    - shrewd
    - guarded
  typical_classes:
    - Society
    - Governess
  typical_races:
    - Trade
    - Servant
  stat_ranges:
    Cunning: [16, 18]
    Pride: [12, 16]
    Humour: [12, 16]
  inventory_hints:
    - a notebook of regular correspondents kept by surname
    - the day's telegraph dockets pinned in order
    - a kettle on the stove for the post round
  dialogue_quirks:
    - prefaces gossip with "I'm sure it's nothing, but —"
    - knows the postage to anywhere in the empire without consulting the rate card
  disposition_default: 10

- name: The Schoolmistress
  description: >-
    Thirty children, a slate, a bell, and a strict, fair register. Has
    taught every adult under forty. Reads the village's marriages by
    what the children draw at break and the village's troubles by who
    is suddenly absent on Mondays.
  personality_traits:
    - principled
    - patient
    - quietly fierce
  typical_classes:
    - Governess
  typical_races:
    - Clergy
    - Gentry
    - Servant
  stat_ranges:
    Nerve: [14, 18]
    Pride: [12, 16]
    Cunning: [14, 16]
  inventory_hints:
    - the school register in a battered green cover
    - chalk dust on the cuffs no matter how often the apron is washed
    - a tin of barley sugar for emergencies
  dialogue_quirks:
    - speaks to adults with the same careful precision she uses with children
    - deflects personal questions by asking about a child you have in common
  disposition_default: 5

- name: The Publican
  description: >-
    Keeps the village inn — the bar, the snug, the three rooms above.
    Hears everything spoken aloud in the village and most of what isn't.
    Friendly to strangers in the way of men who must be friendly to
    strangers; loyal to regulars in a way that is harder won.
  personality_traits:
    - genial
    - watchful
    - loyal
  typical_classes:
    - Society
  typical_races:
    - Trade
    - Servant
  stat_ranges:
    Humour: [14, 18]
    Nerve: [12, 16]
    Cunning: [12, 14]
  inventory_hints:
    - a polishing cloth tucked into the belt
    - a slate behind the bar with regulars' tabs in pencil
    - a dog asleep beside the fire
  dialogue_quirks:
    - tells you about the weather at length before he tells you anything else
    - finishes other people's sentences when it suits him
  disposition_default: 15

- name: The Constable
  description: >-
    County constabulary, sergeant's stripes, one bicycle. Authority
    that depends entirely on village cooperation. Slow, methodical,
    unhurried in a way that makes the guilty assume he hasn't noticed.
    He has noticed.
  personality_traits:
    - methodical
    - patient
    - underestimated
  typical_classes:
    - Detective
  typical_races:
    - Trade
    - Servant
  stat_ranges:
    Cunning: [14, 18]
    Nerve: [14, 16]
    Humour: [10, 14]
  inventory_hints:
    - a regulation notebook with elastic and a stub of pencil
    - a bicycle clip on the right ankle, always
    - a kettle in the village hut that is constantly on
  dialogue_quirks:
    - asks the same question three times across three weeks
    - prefaces hard questions with "I expect you've thought of this already, but —"
  disposition_default: 0

- name: The Laird
  description: >-
    Owner of the Big House, employer of half the village, distantly
    related to most of the families in the kirkyard. Manner is courteous
    and a little distant. Decisions ripple — who is hired, who is
    leased a cottage, who is invited up for the Twelfth.
  personality_traits:
    - courteous
    - guarded
    - dutiful
  typical_classes:
    - Society
    - Explorer
  typical_races:
    - Gentry
  stat_ranges:
    Pride: [14, 18]
    Nerve: [14, 16]
    Cunning: [12, 14]
  inventory_hints:
    - a signet ring worn smooth on the inside
    - a rent book kept in his own hand
    - a brace of guns in a polished case
  dialogue_quirks:
    - speaks to villagers by surname and to gentry by first name
    - changes the subject when the conversation turns to the clearances
  disposition_default: 0

- name: The Laird's Heir
  description: >-
    Educated south, restless north. Carries the future of the estate
    in a way no one has asked him whether he wants. Charming and
    distractible. Probably in love with someone the family would
    prefer he wasn't.
  personality_traits:
    - charming
    - restless
    - impulsive
  typical_classes:
    - Society
    - Explorer
  typical_races:
    - Gentry
  stat_ranges:
    Passion: [14, 18]
    Humour: [14, 16]
    Pride: [12, 14]
  inventory_hints:
    - a motoring veil and goggles his father pretends not to notice
    - a cricket bat with a chip in the toe
    - a packet of letters in a woman's hand he keeps in the boot of the car
  dialogue_quirks:
    - laughs at the wrong moment in serious conversations
    - asks the genuinely innocent question that exposes the uncomfortable truth
  disposition_default: 15

- name: The Tea-Room Proprietress
  description: >-
    Runs the village tea rooms — three round tables, a counter, china
    that does not match. The hub of the village's daytime social life.
    Knows every face that comes through the door and what they will
    order before they have sat down.
  personality_traits:
    - hospitable
    - shrewd
    - sociable
  typical_classes:
    - Society
  typical_races:
    - Trade
    - Servant
  stat_ranges:
    Humour: [14, 18]
    Cunning: [12, 16]
    Pride: [10, 14]
  inventory_hints:
    - a pinafore embroidered with her daughter's initials
    - a recipe book in her grandmother's hand, kept above the bread oven
    - a small ledger in which the day's gossip is recorded as a list of names
  dialogue_quirks:
    - addresses customers by their order ("the seed cake and a pot for two")
    - says "I shouldn't really" before saying it anyway
  disposition_default: 15

- name: The Country Solicitor
  description: >-
    The county solicitor's name is on every will in the parish. Keeps
    the wills in a fireproof cabinet and the village's confidences in a
    drier place. The right and proper man to call when an inheritance
    is complicated, a marriage is contested, or a body must be
    identified for the coroner.
  personality_traits:
    - methodical
    - tactful
    - cautious
  typical_classes:
    - Society
    - Detective
  typical_races:
    - Clergy
    - Gentry
  stat_ranges:
    Cunning: [14, 16]
    Nerve: [12, 16]
    Pride: [12, 14]
  inventory_hints:
    - a leather satchel of papers tied with green tape
    - a pair of half-moon spectacles
    - a fountain pen kept in a velvet-lined case
  dialogue_quirks:
    - speaks with precise commas, as though dictating
    - never finishes a sentence about a client without consulting his conscience
  disposition_default: 5

- name: The Retired Colonel
  description: >-
    Came back from India or the Cape on half-pay with a small pension
    and a bad leg. Builds a cottage above the burn, plants roses he
    will not see flower, drinks the regulation whisky at the inn at
    six. Notices strangers in the way men who have been ambushed
    notice strangers.
  personality_traits:
    - watchful
    - blunt
    - dutiful
  typical_classes:
    - Explorer
    - Detective
  typical_races:
    - Colonial
    - Gentry
  stat_ranges:
    Nerve: [16, 18]
    Pride: [14, 16]
    Cunning: [12, 14]
  inventory_hints:
    - a service revolver locked in a drawer with no ammunition
    - a campaign medal worn only on the Twelfth and Remembrance Sunday
    - a tobacco tin that smells of a brand no longer made
  dialogue_quirks:
    - gives orders by accident in domestic conversations
    - measures unfamiliar men with his eyes the way a sergeant inspects a kit
  disposition_default: 5

- name: The Visiting Stranger
  description: >-
    Arrives by the morning train. Books a room above the inn. Has
    business in the village that he is willing to discuss but never
    quite specifies. Either has come because something is going to
    happen, or something is going to happen because he has come. The
    archetype mystery-victims and mystery-instigators most often
    belong to.
  personality_traits:
    - polished
    - evasive
    - purposive
  typical_classes:
    - Society
    - Detective
    - Explorer
  typical_races:
    - Bohemian
    - Trade
    - Colonial
  stat_ranges:
    Cunning: [14, 18]
    Pride: [12, 16]
    Passion: [12, 16]
  inventory_hints:
    - luggage tagged for a destination further on
    - a calling card with a London or Edinburgh address
    - a folded newspaper kept on the person rather than left in the room
  dialogue_quirks:
    - answers personal questions with anecdotes that contain no actual information
    - refers to the village by a name slightly different from the locals'
  disposition_default: 0

- name: The Distiller
  description: >-
    Third generation of a family that has run the village's distillery
    since before the railway came. Knows the trade, the rivalries, the
    revenue men, and which casks are spoken for two years out. Speaks
    seriously about peat. Drinks abstemiously in public.
  personality_traits:
    - meticulous
    - proud
    - loyal-to-craft
  typical_classes:
    - Industrialist
  typical_races:
    - Trade
  stat_ranges:
    Pride: [14, 18]
    Cunning: [14, 16]
    Nerve: [12, 14]
  inventory_hints:
    - a tasting glass kept in a velvet pouch
    - a ledger of casks by year and warehouse
    - a coat that smells faintly of malt no matter how often it is brushed
  dialogue_quirks:
    - refers to whiskies by year and warehouse without thinking about it
    - takes any criticism of the trade personally and politely
  disposition_default: 5

- name: The Gillie
  description: >-
    The laird's gamekeeper and water bailiff. Knows the hills, the
    burns, the pools, the deer paths, the poachers, and exactly which
    visiting gentlemen are decent shots and which are dangerous to
    stand near. Speaks little, says much, drinks slowly, sees more
    than he reports.
  personality_traits:
    - taciturn
    - keen-eyed
    - loyal
  typical_classes:
    - Explorer
    - Detective
  typical_races:
    - Servant
    - Servant
  stat_ranges:
    Nerve: [16, 18]
    Cunning: [14, 16]
    Pride: [12, 14]
  inventory_hints:
    - a stalker's spyglass in a worn leather case
    - tweeds the same colour as the heather in October
    - a pocketknife older than his father
  dialogue_quirks:
    - answers questions a beat after most people would have
    - refers to deer by name and number
  disposition_default: 5

- name: The Visiting Spinster
  description: >-
    A guest, an aunt, a former governess come for a fortnight. Knits
    on the lawn, takes tea with everyone, and at the end of two weeks
    knows the village better than half the people who live in it.
    Asks questions with the disarming directness of a woman who is
    past caring whether she is asked back.
  personality_traits:
    - perceptive
    - direct
    - kindly
  typical_classes:
    - Governess
    - Society
  typical_races:
    - Gentry
    - Clergy
  stat_ranges:
    Cunning: [14, 18]
    Humour: [12, 16]
    Nerve: [12, 14]
  inventory_hints:
    - knitting that never quite finishes
    - a notebook of recipes that is also a notebook of names
    - a small folding stool
  dialogue_quirks:
    - asks devastating questions in the tone of someone enquiring after the cat
    - finishes knitting at exactly the moment a confession finishes
  disposition_default: 10
