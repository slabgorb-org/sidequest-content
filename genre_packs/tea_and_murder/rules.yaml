# tea_and_murder — Fate Core binding (ADR-144 / story 114-10).
# Fate REPLACES the native d20-flavoured engine; conflicts route to the
# fate_conflict engine. Only the cosy-mystery flavor Fate does NOT own (Standing
# / Scandal social dials, the warm-cast and tea-cup doctrines, encounter tension,
# scene defaults, the gothic-dialed occult) is retained below.
ruleset: fate
magic_level: none
# DRAFT (2026-04-27): the `magic_level` flag is being retired. Architecture here
# is correct (gothic axis dials supernatural in/out per world); only the label
# is wrong. The accurate claim is `world_knowledge: gothic-dialed (denied →
# esoteric)` with intensity tied to axes.gothic. See ./magic.yaml for the
# napkin-shaped truth and docs/design/magic-taxonomy.md for the framework.

# Character-sheet vocabulary. Brontë register — "Race" / "Class" /
# "Personality" / "Backstory" are wrong for a drawing-room gothic where
# "Colonial" is an *origin* (a circumstance), not a species, and the
# Detective/Society/Clergyman roles are *callings*, not classes. The UI
# reads these labels through the "Your Character" preview; unspecified
# keys fall back to the engine defaults so adding a new key here is a
# safe additive change.
chargen_field_labels:
  race: Origin
  class: Calling
  personality: Bearing
  backstory: Past

fate:
  # The cosy-mystery skill ladder (121-3 design — Edwardian amateur sleuth).
  # One seeded starting spread for every PC for now (per-archetype allocation is
  # 121-7 territory). Combat is rare; the village sleuth lives on Investigate,
  # reading people (Empathy/Rapport/Notice), Will and Lore, with the rougher
  # skills (Physique/Athletics) at the bottom of the pyramid. A full Fate ladder,
  # one peak at 4, descending.
  skills:
    Investigate: 4
    Empathy: 3
    Notice: 3
    Rapport: 3
    Will: 2
    Lore: 2
    Contacts: 2
    Deceive: 1
    Provoke: 1
    Resources: 1
    Stealth: 1
    Burglary: 1
    Physique: 1
    Athletics: 1
  refresh: 3
  # Refresh-invariant knobs (114-10). SRD default 3/3. The signature kit below is
  # all aspect-/permission-gear (free), so a starting sleuth keeps refresh 3.
  base_refresh: 3
  free_stunts: 3
  # Shared signature gear compiled onto every sleuth's sheet at chargen (gear.yaml).
  gear:
    - amateur_notebook
    - good_china
    - victims_last_letter
    - respectable_standing
  default_high_concept: "Amateur Sleuth Whom No One Suspects"
  default_trouble: "I Simply Cannot Let a Question Lie Unanswered"
  # Story 126-24 (content gap-fill, 2026-06-20): narrative-chargen seed table.
  # Maps each crucible class_hint (worlds/<world>/char_creation.yaml — WORLD-tier
  # in this genre; glenross + blackthorn_moor share the same six callings) to a
  # COMPLETE legal pyramid (1 Great / 2 Good / 3 Fair / 4 Average, per the SRD
  # chargen_pyramid [1,2,3,4]@apex 4) + free-aspect seeds, so the friendly
  # narrative on-ramp presents a pre-ranked, pre-filled Fate sheet (editable
  # defaults — the player overrides any rating/aspect) instead of the blank
  # pyramid the seam read nothing for. Covers every crucible class_hint (No
  # Silent Fallbacks: no unseeded hint → no blank sheet). Allocations draw ONLY
  # from the 14-skill cosy ladder above (no Drive/Shoot/Fight/Crafts). Aspects
  # are locale-neutral (calling, not place) so they read true in both Edwardian
  # Highland glenross and mid-Victorian Yorkshire blackthorn_moor.
  chargen_seed_table:
    Doctor:
      pyramid: { Lore: 4, Investigate: 3, Empathy: 3, Notice: 2, Rapport: 2, Will: 2, Physique: 1, Contacts: 1, Resources: 1, Provoke: 1 }
      aspects:
        - "The Body Tells Me What the Family Won't"
        - "The Whole Parish Is My Patient — and My Suspect List"
    Clergyman:
      pyramid: { Empathy: 4, Rapport: 3, Will: 3, Investigate: 2, Lore: 2, Notice: 2, Contacts: 1, Deceive: 1, Provoke: 1, Resources: 1 }
      aspects:
        - "People Confess to Me What They'd Tell No One Else"
        - "I Cannot Unhear a Confession"
    Society:
      pyramid: { Contacts: 4, Notice: 3, Rapport: 3, Empathy: 2, Investigate: 2, Deceive: 2, Will: 1, Lore: 1, Provoke: 1, Resources: 1 }
      aspects:
        - "Every Letter in the Parish Passes Through My Hands"
        - "I Know Whose Business I Oughtn't"
    Governess:
      pyramid: { Notice: 4, Empathy: 3, Lore: 3, Will: 2, Investigate: 2, Rapport: 2, Contacts: 1, Deceive: 1, Provoke: 1, Resources: 1 }
      aspects:
        - "The Children Tell Me What Their Parents Daren't"
        - "I Will Not Pretend I Haven't Seen It"
    Detective:
      pyramid: { Investigate: 4, Notice: 3, Provoke: 3, Will: 2, Contacts: 2, Empathy: 2, Rapport: 1, Deceive: 1, Athletics: 1, Physique: 1 }
      aspects:
        - "One Sergeant, One Bicycle, and Every Lie in the Parish"
        - "The Law Here Runs on the Village's Goodwill"
    Explorer:
      pyramid: { Physique: 4, Notice: 3, Will: 3, Athletics: 2, Investigate: 2, Provoke: 2, Lore: 1, Contacts: 1, Empathy: 1, Rapport: 1 }
      aspects:
        - "Thirty Years' Service — I Know a Liar by His Boots"
        - "I Cannot Sit Still in a Quiet Village"
  stunts:
    - name: "A Quiet Word in the Right Ear"
      description: >-
        +2 to Contacts when you call on the village's web of gossip — the
        postmistress, the publican, the vicar's wife — to learn who was seen
        where, and with whom, and looking how.
    - name: "The Overlooked Detail"
      description: >-
        Once per scene, when you first take in a room, spend no action to create
        an advantage with Notice and invoke it for free — the chair drawn up
        wrong, the umbrella that matches no one, the cup with two saucers.
    - name: "Pour Another Cup"
      description: >-
        +2 to Empathy to create an advantage when you sit a frightened or
        grieving person down with a fresh pot of tea. People say more over china
        than they ever would across a desk.
    - name: "One Does Not Make a Scene"
      description: >-
        +2 to Will to defend against Provoke while propriety is being observed.
        You have weathered worse insults at worse dinners; you do not give the
        room the satisfaction of a flinch.


stat_display_fields:
  - hp
  - max_hp
  - standing


# Story 68-1: reskin the survivability (HP) pool for the social register. A
# cornered Edwardian sleuth loses Composure, not hit points — the ablative
# mechanic (ADR-114) is unchanged; only the player-facing label moves. Distinct
# from the `standing` resource below (social capital, a separate dial).
survivability_pool_label: Composure


# Playtest 2026-06-01 (blackthorn_moor shakedown): tea_and_murder has no combat.
# The survivability pool is Composure and every confrontation is `category:
# social`. The Monster Manual must NOT pre-generate or inject combat encounters
# — without this flag, encountergen falls back to humanoid "enemies" built from
# the social `allowed_classes` (Governess, Detective, Society…) and seeds
# drawing-room guests as hostile -20 combatants with Strike/Power-Strike
# abilities. See RulesConfig.combat_encounters.
combat_encounters: false


# Origins kept as Fate "Background" flavor (the cosy-mystery analogue to
# pulp_noir's allowed_races); under Fate these colour the high-concept, not a d20
# species. Callings (Governess/Detective/…) survive only as world-tier NpcArchetype
# cast now, so allowed_classes / default_class are dropped with the d20 engine.
allowed_races:
  - Gentry
  - Trade
  - Servant
  - Clergy
  - Bohemian
  - Colonial
race_label: Background
default_race: Gentry
default_location: "The bar of a village inn, the fire going, the rain just easing off"
default_time_of_day: late afternoon

custom_rules:
  lethality: low
  injury_system: none
  rest_variant: standard
  encumbrance: none

  standing_system: >-
    Standing tracks social position from 0 (ruined) to 5 (toast of the season).
    Actions that display virtue, breeding, accomplishment, or connection raise
    Standing. Scandal, impropriety, association with the wrong people, or public
    failure lower it. High Standing opens doors — invitations, introductions,
    favorable terms. Low Standing closes them — cut direct, whispered warnings,
    doors that no longer answer. Standing can change overnight. A single
    revelation at the wrong dinner party can undo years of careful cultivation.

  scandal_system: >-
    Reckless actions, discovered secrets, and social missteps generate Scandal.
    Scandal erodes Standing. Some NPCs trade in Scandal as currency — the
    gossip columnist, the blackmailer, the rival who smiles too sweetly.
    Scandal can be suppressed through influence, favors, or counter-scandal,
    but it never truly disappears. The Narrator tracks Scandal independently
    from Standing — a character can have high Standing AND mounting Scandal,
    living on borrowed time.

  the_occult: >-
    Controlled by the Gothic tone axis. At low: séances are parlor tricks,
    mesmerists are charlatans, ghost stories are for children. At high:
    mesmerism works, the house has a presence, the moors remember the dead,
    and some books should never have been opened. Even at maximum, the
    supernatural is dread and atmosphere, never a toolbox. No one casts
    spells. Things happen that cannot be explained, and the not-knowing
    is the point.

  propriety: >-
    Edwardian village society runs on rules that are never written down but
    everyone knows. Who speaks first, who sits where, what can be said in
    mixed company, what a glance means, what an uninvited visit implies.
    Breaking propriety is a weapon — sometimes deliberate, sometimes
    devastating by accident. The Narrator uses propriety as environmental
    hazard: the wrong word at the parish tea is as dangerous as evidence in
    a courtroom.

  mystery_as_puzzle: >-
    Each session is one mystery, resolved cleanly. The body is discovered
    in the first turn or two; the solution lands by turn ten or twelve.
    Clues are deliberately seeded; red herrings are deliberately placed.
    The narrator gives the player a fair chance — every fact the sleuth
    needs is on the page before the solution is named. The pleasure is in
    the click of the puzzle resolving, the moment the player sees what
    they have been looking at all along.

  the_warm_cast: >-
    The recurring named NPCs of the village — the vicar, the doctor, the
    postmistress, the schoolmistress, the publican, the laird's family,
    the constable, the rector, the tea-room proprietress, the distiller
    — are NEVER the victim. They evolve across sessions (the new curate
    joins the cast, the laird's son drifts toward romance with the
    doctor, the schoolmistress takes in her invalid sister) but they
    are not killed. Victims are visitors, awful relatives, blackmailers,
    distillery rivals, or villagers whose secret was about to surface —
    not the warm cast the player has grown to know.

  the_tea_cup_test: >-
    Body discovery happens off-stage or in tidy circumstances — slumped
    at the writing desk, fallen in the burn beside the bridge, found in
    the rose garden by the gardener. Never described in forensic detail.
    Forensic moments are named, not narrated ("the doctor's brief
    examination confirms what everyone hoped against"). Children, animals,
    and recurring NPCs are never harmed. Hard rule.

resources:
  - name: standing
    label: Standing
    min: 0.0
    max: 5.0
    starting: 3.0
    voluntary: false
    decay_per_turn: 0.0

encounter_base_tension:
  random: 0.05
  ambush: 0.15
  boss: 0.30
  final: 0.40

# ── Confrontations ──────────────────────────────────────────
# Dual-dial momentum schema (Phase 3): each confrontation has a
# player_metric and an opponent_metric, each with its own threshold.
# Beats declare a kind (strike / brace / angle / push), a base value,
# optional crit-fail penalties under deltas, and — for closing beats —
# a consequence. Resolution fires when either metric crosses its
# threshold or a push beat lands.
confrontations:
  - type: negotiation
    label: "Polite Negotiation"
    # Spec 2026-05-20 confrontation-intent-validator (cosy-genre: all warn)
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    # spec 2026-06-17 §3: a Polite Negotiation is a Fate Contest — both parties
    # roll 4dF + skill for leverage; the higher total scores a victory; first to 3
    # wins. The Other rolls from its seated FateSheet (no d20 opponent_default_stats,
    # no dial.compute_dc) — Fate owns its own confrontation now (ADR-144).
    resolution_mode: contest
    # The 0->3 victory tally (was the 0->7 leverage dial). opponent starts with a
    # 1-victory head-start on the tally (comes to the table already holding cards);
    # starting must be < threshold.
    player_metric:
      name: leverage
      starting: 0
      threshold: 3
    opponent_metric:
      name: leverage
      starting: 1
      threshold: 3
    # spec 2026-06-17 §2 (Westley major M1, ADR-144 REPLACE): a Fate Contest resolves
    # via the 4dF exchange engine, NOT the dial apply_beat path. These beats are now
    # DISPLAY-ONLY stubs (id + label + narrator_hint) — every dial-resolution field
    # (kind/base/stat_check/deltas/effect/risk/consequence/resolution) is stripped so
    # the narrator can never select an armed dial beat that would run the dial engine
    # in parallel to the Contest. They survive as ids so the world-tier classes.yaml
    # Abilities tab (encounter_beat_choices: persuade/threaten/... in glenross +
    # blackthorn_moor) still resolves id->label via views._resolve_class_moves.
    beats:
      - id: persuade
        label: "Appeal to Reason"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Veiled Threat"
        narrator_hint: "A polite suggestion with steel beneath. Propriety barely maintained."
      - id: concede_point
        label: "Concede a Point"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Take One's Leave"
        narrator_hint: "Player excuses themselves. The matter is dropped — for now."
    mood: tension
  - type: trial
    label: "Trial by Tribunal"
    # Spec 2026-05-20 confrontation-intent-validator (cosy-genre: all warn)
    intent_verbs: [testify, accuse, defend, argue, examine, object]
    on_intent_mismatch: warn
    category: social
    # spec 2026-06-17 §3: a Trial by Tribunal is a Fate Contest — both parties
    # roll 4dF + skill for conviction; the higher total scores a victory; first to
    # 3 wins. The Other rolls from its seated FateSheet (no d20 opponent_default_stats,
    # no dial.compute_dc) — Fate owns its own confrontation now (ADR-144).
    resolution_mode: contest
    # The 0->3 victory tally (was the 0->7 conviction dial). Both sides start at 0.
    player_metric:
      name: conviction
      starting: 0
      threshold: 3
    opponent_metric:
      name: conviction
      starting: 0
      threshold: 3
    # spec 2026-06-17 §2 (Westley major M1, ADR-144 REPLACE): contest resolves via the
    # 4dF exchange engine. Display-only beat stubs (id + label + narrator_hint) — dial
    # fields stripped; ids survive for the world-class Abilities tab (Detective/Doctor/
    # Industrialist reference cross_examine/present_argument/object).
    beats:
      - id: cross_examine
        label: "Cross-Examine"
        narrator_hint: "Pick apart the testimony. Find contradictions."
      - id: present_argument
        label: "Present Argument"
        narrator_hint: "Address the tribunal directly. Be persuasive."
      - id: object
        label: "Object"
        narrator_hint: "Challenge procedure or evidence. Must be substantive."
      - id: yield
        label: "Yield the Floor"
        narrator_hint: "Strategic silence. Let them overplay their hand."
      - id: withdraw_case
        label: "Withdraw the Case"
        narrator_hint: "Counsel withdraws. The tribunal is dismissed — no verdict pronounced."
    mood: tension
  - type: auction
    label: "The Auction"
    # Spec 2026-05-20 confrontation-intent-validator (cosy-genre: all warn)
    intent_verbs: [bid, raise, outbid, hammer, lot]
    on_intent_mismatch: warn
    category: social
    # free-for-all N-seat table — dual dials dropped (table_state drives resolution)
    resolution_mode: table_resolution
    win_condition: table_showdown
    table_game: auction
    max_decision_points: 3
    # NOTE: for table_resolution the engine dispatches on the beat `id` ONLY.
    # `kind`/`stat_check`/`base`/`target_tag` below are present solely to satisfy
    # the BeatDef schema — they are INERT for table resolution (the dial /
    # apply_beat path never runs for table types). Editing them does not change
    # table behavior; the table_game ("auction") drives the mechanics.
    beats:
      - id: raise_bid
        label: "Raise the Bid"
        kind: strike
        base: 1
        stat_check: CHA
        effect: "push the price higher — pressure opponents to fold"
        narrator_hint: "A discreet signal to the auctioneer. The bid climbs."
      - id: bluff
        label: "Bluff"
        kind: strike
        base: 2
        stat_check: CHA
        risk: "called out — lose credibility"
        narrator_hint: "Feign deeper pockets than you possess. Convince them you'll go higher."
      - id: read_room
        label: "Read the Room"
        kind: angle
        target_tag: "Tell"
        base: 1
        stat_check: WIS
        effect: "spot the bluffing or desperate bidder"
        narrator_hint: "Study the other bidders. Who is bluffing? Who is desperate?"
      - id: withdraw
        label: "Withdraw"
        kind: push
        base: 0
        stat_check: WIS
        consequence: "bow out gracefully — reputation intact, item lost"
        narrator_hint: "A subtle shake of the head. The bid is yours no longer."
    secondary_stats:
      - name: purse
        source_stat: Cunning
        spendable: true
    mood: tension
  - type: social_duel
    label: Duel of Wits
    # Spec 2026-05-20 confrontation-intent-validator (cosy-genre: all warn)
    intent_verbs: [insult, riposte, parry, slight, retort, snub]
    on_intent_mismatch: warn
    category: social
    # spec 2026-06-17 §3: a Duel of Wits is a Fate Contest — both duellists roll
    # 4dF + skill for barbs; the higher total scores a victory; first to 3 wins.
    # The Other rolls from its seated FateSheet (no d20 opponent_default_stats,
    # no dial.compute_dc) — Fate owns its own confrontation now (ADR-144).
    resolution_mode: contest
    # The 0->3 victory tally (was the 0->7 barbs_landed dial). Both sides start at 0.
    player_metric:
      name: barbs_landed
      starting: 0
      threshold: 3
    opponent_metric:
      name: barbs_landed
      starting: 0
      threshold: 3
    # spec 2026-06-17 §2 (Westley major M1, ADR-144 REPLACE): contest resolves via the
    # 4dF exchange engine. Display-only beat stubs (id + label + narrator_hint) — dial
    # fields stripped; ids survive for the world-class Abilities tab (Society references
    # riposte/appeal_propriety; many reference composure).
    beats:
      - id: riposte
        label: Verbal Riposte
        narrator_hint: A cutting remark, perfectly timed. The room goes quiet.
      - id: appeal_propriety
        label: Appeal to Propriety
        narrator_hint: "Invoke social convention to embarrass the opponent."
      - id: composure
        label: Maintain Composure
        narrator_hint: "Recover poise — resist the next barb."
      - id: concede
        label: Concede Gracefully
        narrator_hint: "Duel ends — withdraw with dignity intact."
    mood: mystery
  - type: scandal
    label: Scandal Eruption
    # Spec 2026-05-20 confrontation-intent-validator (cosy-genre: all warn)
    intent_verbs: [whisper, gossip, expose, slander, accuse, rumor]
    on_intent_mismatch: warn
    category: social
    # spec 2026-06-17 §3: a Scandal Eruption is a Fate Contest — the player races
    # to contain the scandal while the gossip's champion rolls 4dF + skill to
    # expose it; first to 3 victories wins. The Other rolls from its seated
    # FateSheet (no d20 opponent_default_stats, no dial.compute_dc) — Fate owns
    # its own confrontation now (ADR-144).
    resolution_mode: contest
    # The 0->3 victory tally (was the 0->7 dial). The gossip's head start is
    # preserved on the start line: exposure starts at 2 (< threshold 3), containment
    # at 0. The asymmetry moved from the finish line to the start line.
    player_metric:
      name: containment
      starting: 0
      threshold: 3
    opponent_metric:
      name: exposure
      starting: 2
      threshold: 3
    # spec 2026-06-17 §2 (Westley major M1, ADR-144 REPLACE): contest resolves via the
    # 4dF exchange engine. Display-only beat stubs (id + label + narrator_hint) — dial
    # fields stripped; ids survive for the world-class Abilities tab (Society references
    # deflect; Clergyman/Detective reference confide; many reference weather_it). The
    # gossip's authored head-start now lives ONLY on opponent_metric.starting (2),
    # seeded into ContestState.opponent_victories at seating (Westley major M2).
    beats:
      - id: deflect
        label: Deflect Rumour
        narrator_hint: Redirect attention — another scandal, a convenient distraction.
      - id: counter_accusation
        label: Counter-Accusation
        narrator_hint: "A bold reversal — turn the accusation back on the accuser."
      - id: confide
        label: Confide in Ally
        narrator_hint: "Gain an advocate who speaks on your behalf."
      - id: weather_it
        label: Weather the Storm
        narrator_hint: "Endure the scandal — let it pass without rising to the bait."
    mood: mystery

