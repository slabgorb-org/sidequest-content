# tea_and_murder — Fate gear (ADR-144 gear model, story 114-10).
#
# Fate has no equipment economy: gear is not a carried inventory, it is the
# signature kit each amateur sleuth walks into the village with, compiled into the
# FateSheet at chargen as aspects + a permission. All entries are aspect-/
# permission-gear (FREE — no refresh debit), so a starting sleuth keeps the SRD
# refresh of 3. The teapot and the notebook are story colour, not a damage table
# (lethality: low; combat_encounters: false; conflicts route to the Fate engine,
# never to HP).
- id: amateur_notebook
  name: A Well-Kept Notebook
  description: >-
    A small clothbound notebook, soft at the corners, with a pencil in the loop.
    Every overheard remark, every train time, every name the village would rather
    you forgot, set down in a neat hand before anyone could think to deny it.
  grants_aspects:
    - text: It's All Here in My Notebook
      kind: character

- id: good_china
  name: The Good Teapot and the Good China
  description: >-
    A respectable tea service kept for callers — the pot that pours straight, the
    cups with the gold rim, the plate of biscuits that appears unbidden. A grieving
    widow or a frightened maid will say more over a fresh cup than they ever would
    to a constable.
  grants_aspects:
    - text: Do Sit Down, I'll Put the Kettle On
      kind: character

- id: victims_last_letter
  name: The Victim's Last Letter
  description: >-
    A single folded sheet, the ink pressed hard in places, that came into your
    keeping by an accident no one has yet thought to question. Half a sentence in
    it makes no sense at all — which is precisely why you cannot leave it be.
  grants_aspects:
    - text: A Letter That Should Not Exist
      kind: character

- id: respectable_standing
  name: A Respectable Standing in the Village
  description: >-
    You are known here, and known to be harmless — the sort of person whose
    presence at a doorstep, a graveside, or a drawing-room raises no alarm at all.
    Doors open for tea that would be barred to an inspector, and tongues loosen
    that a warrant would only have stilled.
  grants_aspects:
    - text: No One Suspects the Pleasant One
      kind: permission
