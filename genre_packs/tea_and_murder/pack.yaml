name: Tea & Murder
version: "2.0.0"
description: >-
  Cosy Edwardian murder mystery in the BritBox register. A village you'd
  move to if it weren't quite so prone to corpses. Each session is one
  mystery — a body found in the rose garden, an unpleasant visitor who
  won't be missed, a will reading that goes sideways — solved before the
  kettle's gone twice. You play an amateur sleuth with a respectable day
  job: the country doctor, the village minister, the postmistress, the
  schoolmistress, the vet, the constable, the rector at the small chapel,
  or the retired colonel building a cottage on the hill. The body is
  always off-stage. The puzzle is always fair. Tea is always on.
lobby_blurb: "A cosy English-language murder mystery, c. 1908. You have a day job and a question. The body is in the rose garden."
recommended_players:
  min: 1
  max: 4
  sweet_spot: 2
min_sidequest_version: "0.1.0"
refine_hooks: false

# --- Creative DNA ---

inspirations:
  - name: "Father Brown (G.K. Chesterton, 1910-1935)"
    element: "Quiet clergyman; gentle, relentless attention to the shape of guilt"
  - name: "Agatha Christie (pre-war stories)"
    element: "Fair-play puzzles; country houses, village fetes, garden parties; victims who deserved it"
  - name: "All Creatures Great and Small (James Herriot)"
    element: "Rural professional life, warmth, the village as ensemble cast, occasional intrusion of mystery"
  - name: "Midsomer Murders"
    element: "Village ensemble structure, recurring cast, episodic mysteries, postmistress as oracle"
  - name: "Hamish Macbeth (M.C. Beaton / BBC)"
    element: "Highland village setting, slow attentive constable, weather as character"
  - name: "Cranford (Elizabeth Gaskell)"
    element: "Village as protagonist, gentle social comedy, the weight of small kindnesses"

era_range: "1901-1914"

core_vibe: >-
  Someone in the village is hiding something, and another person is now
  unfortunately dead because of it. By Tuesday tea you'll have it sorted,
  and Mrs. Cameron will bring out the seed cake.

emotional_tone:
  - warmth
  - dry wit
  - quiet observation
  - earned solace

differentiation: >-
  Cosy crime in the BritBox tradition. No gore, no horror, no on-screen
  forensics — the body is found in the rose garden by the gardener, the
  doctor's brief examination confirms what everyone hoped against, and
  the puzzle begins. Recurring NPCs are the warm centre; they are never
  the victims. Each session is one mystery, resolved cleanly — designed
  for episodic play with new or returning friends. Tonal axes default
  toward cosy and puzzle; gothic is reserved for the storm night and
  the empty drove road, not for the village in daylight.
extensions:
  - magic
  - beat_vocabulary
  # equipment_tables dropped (114-10 Fate migration): Fate has no equipment
  # economy, so the d20 class-kit → inventory.yaml chain is gone. Signature kit is
  # now compiled as gear aspects from rules.fate.gear (gear.yaml).
  - achievements
