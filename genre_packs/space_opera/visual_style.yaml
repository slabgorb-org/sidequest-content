positive_suffix: >-
  A far-future interstellar space opera scene drawn in Vienna Secession
  poster style, in the tradition of Alphonse Mucha and Koloman Moser.
  The subject is the primary content — sleek FTL starships with plasma-
  drive engines, holographic instrument panels, energy weapons, force-
  field shielding, zero-G gantries, anti-gravity lifts, mixed-species
  crews in futuristic flight gear — and the Vienna Secession treatment
  is applied as illustration technique: bold black contour lines with
  angular expressive figure work, flat color fields with rich jewel
  tones, visible ink line weight variation, dramatic figure poses, a
  palette of gold and deep teal and oxblood. Decorative geometric
  ornament is present but restrained — a border panel or mosaic accent,
  not a background that swallows the figure. Gold leaf and mosaic
  patterning used sparingly as accent only, never filling the frame.
  Absolutely no propeller aircraft, no biplanes, no 1930s rocket ships,
  no dieselpunk, no Buck Rogers or Flash Gordon retrofuturism, no
  period automobiles, no art-nouveau fantasy forest, no Klimt portrait
  of a woman in gold. Fake stylized lettering on ship consoles, station
  signage, and border cartouches is allowed as in-world texture. No
  artist signature, no printed title card, no museum label, no gallery
  credit, no watermark, no modern UI elements, no game HUD.

# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All constraints
# live in positive_suffix. See PROMPTING_Z_IMAGE.md.
negative_prompt: ""

preferred_model: dev

base_seed: 42

visual_tag_overrides:
  bridge: "ship bridge, holographic displays, viewport showing stars, warm amber instrument light"
  galley: "cramped ship kitchen, steel counter, mugs, warm overhead light"
  engine_room: "ship engine room, pipes and conduits, grease stains, pulsing drive core"
  cargo_bay: "cavernous cargo hold, crates and netting, industrial lighting"
  bunk: "narrow ship cabin, personal effects on shelf, viewport sliver of stars"
  station: "bustling space station concourse, mixed species crowd, neon signage"
  cantina: "dim station bar, mismatched furniture, haze, colored bottle light"
  docks: "industrial docking bay, ship hulls, fuel lines, dock workers"
  market: "rim world open market, dust and tarps, salvage and produce"
  planet_surface: "alien landscape, unfamiliar sky, distant settlement"
  void: "deep space, stars, distant nebula, absolute silence made visible"
  debris_field: "twisted metal wreckage drifting, sparks, damaged hulls"
  corridor: "narrow ship corridor, emergency lighting, cable runs along walls"
  medbay: "small ship medical bay, surgical light, instrument trays, clean surfaces"
