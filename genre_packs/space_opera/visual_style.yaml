# Genre-level baseline for space_opera. Each world authors its own
# art-movement lineage in worlds/<slug>/visual_style.yaml — Mucha for
# Aureate Span, McQuarrie/Leone-frontier for Coyote Reach, etc. This
# file holds only universal far-future sci-fi framing and the
# anti-text-bleed safety clause that applies to every render.
#
# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All
# constraints live in positive_suffix. See PROMPTING_Z_IMAGE.md.

positive_suffix: >-
  Far-future science-fiction subject matter rendered as the primary
  content of the image. Painterly digital illustration, confident
  brushwork, atmospheric depth. Strong focal subject with a clear
  silhouette, supporting elements arranged front to back through the
  frame, dramatic single-source lighting that defines the form.
  Believable engineered surfaces — metal, polymer, glass, fabric —
  with material wear consistent with use and age. Cinematic
  composition. No text, no caption, no title, no writing, no
  signature, no labels, no watermark, no logos, no museum or gallery
  captions, no modern UI overlays, no game interface elements.

negative_prompt: ""

preferred_model: dev

base_seed: 42

visual_tag_overrides:
  bridge: "ship bridge, holographic displays, viewport showing stars, warm amber instrument light"
  galley: "cramped ship kitchen, steel counter, mugs, warm overhead light"
  engine_room: "ship engine room, pipes and conduits, grease stains, pulsing drive core"
  cargo_bay: "cavernous cargo hold, crates and netting, industrial lighting"
  bunk: "narrow ship cabin, personal effects on shelf, viewport sliver of stars"
  station: "bustling space station concourse, mixed species crowd, neon signage"
  cantina: "dim station bar, mismatched furniture, haze, colored bottle light"
  docks: "industrial docking bay, ship hulls, fuel lines, dock workers"
  market: "rim world open market, dust and tarps, salvage and produce"
  planet_surface: "alien landscape, unfamiliar sky, distant settlement"
  void: "deep space, stars, distant nebula, absolute silence made visible"
  debris_field: "twisted metal wreckage drifting, sparks, damaged hulls"
  corridor: "narrow ship corridor, emergency lighting, cable runs along walls"
  medbay: "small ship medical bay, surgical light, instrument trays, clean surfaces"
