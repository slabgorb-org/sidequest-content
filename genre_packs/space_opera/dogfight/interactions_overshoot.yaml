# Dogfight Interaction Table — Overshoot starting state
#
# A 16-cell lookup keyed by (red_maneuver, blue_maneuver). Red is the
# OVERSHOOTER — carried too much speed, shot PAST blue, and is now out in
# front with the wrong energy state. Blue is the CONVERTER — reversing onto
# red's six to cash in the mistake. The hunter has become the hunted for a
# beat. Role-fixed and asymmetric: this table is authored from red's
# disadvantage, not from a neutral merge.
#
# RPS SHIFT FROM TAIL_CHASE:
#
#   In tail-chase the pursuer's advantage is positional. In overshoot the
#   advantage belongs to the ship BEHIND — and that ship is blue:
#   - straight (red)  = EXTEND — trade the fight for separation on raw speed
#   - straight (blue) = FOLLOW THROUGH — flat pursuit, keeps energy, concedes angle
#   - bank (red)      = BREAK BACK — turn into the reversal; the classic overshoot answer
#   - bank (blue)     = COMPLETE THE REVERSAL — swing onto red's six; the whole point
#   - loop (red)      = HIGH-G REVERSAL — expensive vertical re-engage
#   - loop (blue)     = DISPLACEMENT ROLL — trade speed for position, stay behind red
#   - kill_rotation (red)  = OVER-SHOULDER SNAP — desperate backward gunnery
#   - kill_rotation (blue) = GUNS ON THE RUNNER — shoot the target in front
#
# Blue owns this state: most of the gun solutions in the grid are Blue's.
# Red's real counters are conversions OUT of the state — break back into the
# weave (scissors), break across a flat follow (beam), or a clean extend that
# dissolves the fight. Red's only guns are desperate over-shoulder snaps, and
# every one of them is a mutual exposure. Running flat is a real option, but
# never a free one.

version: "0.1.0"
starting_state: overshoot
maneuvers_consumed: [straight, bank, loop, kill_rotation]

cells:

  # =========================================================================
  # Row 1 — Red (overshooter): straight — extend away on speed
  # =========================================================================

  - pair: [straight, straight]
    name: "Clean extend — the fight dissolves"
    shape: "extend vs flat follow — separation wins"
    red_view:
      target_bearing: "06"
      target_range: medium
      target_aspect: head_on
      closure: opening_fast
      gun_solution: false
    blue_view:
      target_bearing: "12"
      target_range: medium
      target_aspect: tail_on
      closure: opening_fast
      gun_solution: false
    narration_hint: >-
      Red firewalls the throttle and runs, spending the same excess speed
      that caused the overshoot. Blue levels out and watches the drive flare
      shrink — the reversal was built for a knife fight, not a stern chase,
      and Blue declines. Separation piles up by the second.
    tags: [dull]

  - pair: [straight, bank]
    name: "Reversal completes on the runner"
    shape: "extend vs completing bank — blue saddles up"
    red_view:
      target_bearing: "06"
      target_range: close
      target_aspect: head_on
      closure: opening
      gun_solution: false
    blue_view:
      target_bearing: "12"
      target_range: close
      target_aspect: tail_on
      closure: opening
      gun_solution: true
    narration_hint: >-
      Blue's reversal completes just as Red commits to raw speed. For one
      long breath Blue is saddled dead astern, pipper settling on Red's
      engine bell while the range unwinds. It's a fleeting solution — but
      it's a solution, and Red's mirrors are full of gun ports.
    tags: [lopsided]

  - pair: [straight, loop]
    name: "Displacement roll against a runner"
    shape: "extend vs displacement roll — angle for nothing"
    red_view:
      target_bearing: "06"
      target_range: medium
      target_aspect: quartering
      closure: opening
      gun_solution: false
    blue_view:
      target_bearing: "12"
      target_range: medium
      target_aspect: tail_on
      closure: opening
      gun_solution: false
    narration_hint: >-
      Blue barrel-rolls off Red's line, trading speed for an angle Red isn't
      there to give. The displacement roll is the right answer to a break —
      but Red isn't breaking, Red is leaving. Blue rolls out to find the
      target smaller and the closure gone.
    tags: [dull]

  - pair: [straight, kill_rotation]
    name: "Gunning the runner"
    shape: "extend vs snap shot — the price of running flat"
    red_view:
      target_bearing: "06"
      target_range: gun
      target_aspect: head_on
      closure: opening
      gun_solution: false
    blue_view:
      target_bearing: "12"
      target_range: gun
      target_aspect: tail_on
      closure: opening
      gun_solution: true
    narration_hint: >-
      Red runs flat, betting everything on the throttle. Blue doesn't chase —
      Blue steadies the nose and lets the range do the work while it's still
      inside the cone. The drive flare of a fleeing ship fills the pipper,
      and Blue fires. This is the price of running flat from a reversal.
    tags: [lopsided]

  # =========================================================================
  # Row 2 — Red (overshooter): bank — break back into blue
  # =========================================================================

