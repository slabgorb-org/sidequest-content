      reversal straight past the turn — Red flashes across Blue's canopy at
      ninety degrees. Two ships on perpendicular lines, neither with a nose
      to bear.
    next_state: beam
    tags: [calibrated]

  - pair: [bank, bank]
    name: "Break into the reversal — the weave begins"
    shape: "break back vs completing bank — scissors entry"
