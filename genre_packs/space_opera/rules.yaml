stat_generation: point_buy
point_buy_budget: 27
magic_level: none

ability_score_names:
  - Physique
  - Reflex
  - Intellect
  - Cunning
  - Resolve
  - Influence

allowed_classes:
  - Officer
  - Operative
  - Pilot
  - Engineer
  - Medic
  - Smuggler
  - Diplomat
  - Soldier

allowed_races:
  - Coreworlder
  - Colonial
  - Spacer
  - Uplifted
  - Xeno
  - Synthetic

hp_formula: "class_base + (physique_mod * level)"

stat_display_fields:
  - hp
  - max_hp
  - armor

class_hp_bases:
  Officer: 8
  Operative: 8
  Pilot: 6
  Engineer: 6
  Medic: 6
  Smuggler: 8
  Diplomat: 6
  Soldier: 12

default_class: Smuggler
default_race: Spacer
race_label: Origin
class_label: Role
default_hp: 8
default_ac: 10
default_location: "The crew quarters of a beat-up freighter docked at a station you can't afford to stay at"
default_time_of_day: ship_time

custom_rules:
  lethality: moderate
  injury_system: temporary
  rest_variant: standard
  encumbrance: none
  ship_combat: >-
    Ship-to-ship combat is tactical and crew-driven, not a minigame. Each crew
    member contributes from their station: Pilot maneuvers, Engineer manages
    power and repairs, Officer calls targets and coordinates, Soldier operates
    weapons, Operative runs electronic warfare. Describe actions cinematically —
    sparks flying, hull groaning, crew shouting over alarms. Resolution is fast:
    each round is one decisive action per station, not granular subsystem rolls.
    Ships don't have HP — they have condition tracks (shields, hull, engines,
    weapons) that degrade narratively.
  crew_bonds: >-
    Crew relationships matter mechanically. When you act to protect or support
    a crewmate you have a bond with, you get advantage on the roll. Bonds form
    through shared experience — surviving a fight together, a meaningful
    conversation, pulling someone out of danger. The narrator tracks bond
    strength organically. This is the Chambers/Firefly principle: the crew
    is the point.
  cultural_friction: >-
    Origins aren't just stat blocks — they're worldviews. A Coreworlder and
    a Colonial see the same situation differently. When cultural background
    would create tension or misunderstanding, the narrator leans into it.
    This isn't combat — it's roleplaying fuel. The best scenes come from
    people who respect each other but genuinely don't understand each other's
    assumptions.
  the_ship: >-
    The ship is a crewmember, not inventory. Every crew's ship has a name, a
    personality, a history, and quirks — systems that run hot, a cargo bay
    door that sticks, an engine that hums a certain way when she's happy.
    The narrator treats the ship as a character: she can be hurt, healed,
    upgraded, and mourned. Crew members have relationships with the ship
    just as they do with each other. If the ship has an AI, it is a full
    character with opinions, feelings, and bonds — not a tool. Losing your
    ship is not a resource loss. It is a death in the family.

    Ship Block (parallel to road_warrior's Car-acter Sheet Rig Block):
    Ship Name (player-chosen), Ship Class (world-defined — freighter,
    corvette, shuttle, etc.), Condition Tracks (shields, hull, engines,
    weapons — narrative degradation, not HP), Quirks (what makes her her),
    AI Personality (if present — full character with opinions and bonds),
    Scars (narrative history of damage and repairs), Berths (crew capacity).
    Detailed sheet structure TBD in char_creation step.
  found_family: >-
    The crew is the emotional core of every campaign. Space opera is not
    about lone heroes — it's about people who chose each other, or were
    thrown together and chose to stay. The narrator actively creates moments
    for crew bonding: shared meals, downtime conversations, arguments that
    reveal character, small kindnesses under pressure. These scenes are not
    filler between action — they ARE the story. A campaign where the crew
    doesn't feel like family has failed, regardless of how many space
    battles it had.
  xeno_flexibility: >-
    The Xeno origin is a genre-level slot that worlds fill with specific
    species. Each world defines its own alien cultures with unique biology,
    social structures, and naming patterns. At the genre level, Xeno means
    "nonhuman sapient" — the world decides what that looks like. Alien
    species should feel genuinely alien, not humans with prosthetics.

encounter_base_tension:
  random: 0.10
  ambush: 0.30
  boss: 0.40
  final: 0.50

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Diplomatic Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Make Your Case"
        metric_delta: 2
        stat_check: Influence
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: Resolve
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: Influence
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: Resolve
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player leaves the negotiation table. No treaty."
    mood: tension
  - type: ship_combat
    label: "Ship Combat"
    category: combat
    metric:
      name: engagement_range
      direction: ascending
      starting: 0
      threshold_high: 10
    beats:
      - id: broadside
        label: "Broadside"
        metric_delta: 2
        stat_check: Intellect
        effect: "full weapons volley at current range"
        narrator_hint: "All guns fire. The bridge shakes with each salvo."
      - id: evasive_maneuver
        label: "Evasive Maneuver"
        metric_delta: -1
        stat_check: Reflex
        effect: "reduce incoming damage, open distance"
        narrator_hint: "Hard burn on the maneuvering thrusters. The ship groans under G-forces."
      - id: close_range
        label: "Close Range"
        metric_delta: 3
        stat_check: Resolve
        risk: "overextended — shields take double if it fails"
        narrator_hint: "Push engines to maximum. Close the gap for a killing blow."
      - id: target_systems
        label: "Target Systems"
        metric_delta: 1
        stat_check: Cunning
        reveals: ship_weakness
        narrator_hint: "Scan for a weakness. Engines, weapons, life support — pick your target."
      - id: disengage
        label: "Disengage"
        metric_delta: 0
        stat_check: Reflex
        resolution: true
        consequence: "break contact — escape to hyperspace or retreat"
        narrator_hint: "Full power to engines. The stars blur as the ship makes its escape."
    secondary_stats:
      - name: shields
        source_stat: Intellect
        spendable: false
      - name: hull
        source_stat: Physique
        spendable: false
      - name: engines
        source_stat: Reflex
        spendable: false
      - name: weapons
        source_stat: Cunning
        spendable: false
    mood: combat

  - type: combat
    label: Firefight
    category: combat
    # Personal combat (not ship_combat — that one uses engagement_range).
    # Momentum-based. Shoot-outs in corridors, station bars, airlock
    # standoffs. HP on character state; momentum on the engagement.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: shoot
        label: Shoot
        metric_delta: 2
        stat_check: Physique
        effect: "Target takes damage this round"
        narrator_hint: Blaster bolts sear the corridor. Sparks off bulkheads.
      - id: take_cover
        label: Take Cover
        metric_delta: 1
        stat_check: Resolve
        effect: "Reduce incoming damage behind cargo or hull"
        narrator_hint: Drop behind crates, return fire around the corner.
      - id: overload
        label: Overload Weapon
        metric_delta: 4
        stat_check: Physique
        risk: "Weapon jams — lose 2 momentum and skip next turn on failure"
        effect: "Target takes massive damage from the dump shot"
        narrator_hint: Crank the power cell past safe limits.
      - id: retreat
        label: Fall Back
        metric_delta: 0
        stat_check: Reflex
        resolution: true
        consequence: "Combat ends — seal a bulkhead, reach the airlock"
        narrator_hint: Covering fire, sprinting for the bulkhead, slam it shut.
    mood: combat
  - type: chase
    label: Spaceflight Pursuit
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: burn
        label: Full Burn
        metric_delta: 2
        stat_check: Reflex
        narrator_hint: Engines flare blue-white. The hull groans under acceleration.
      - id: asteroid_thread
        label: Thread the Field
        metric_delta: 3
        stat_check: Cunning
        risk: "Impact — take hull damage on failure"
      - id: ecm
        label: ECM Decoys
        metric_delta: 1
        stat_check: Cunning
        effect: "Deploy countermeasures to confuse pursuit sensors"
      - id: microjump
        label: Microjump
        metric_delta: 0
        stat_check: Reflex
        resolution: true
        consequence: "Chase ends — short hyperspace hop, gone"
    mood: tension

  - type: dogfight
    label: Dogfight
    category: combat
    resolution_mode: sealed_letter_lookup
    # Sealed-letter simultaneous-commit dogfight (story 38-4). Each pilot
    # privately commits to a maneuver per turn; the engine looks up the
    # (red, blue) pair in the interaction table and applies the two
    # descriptor deltas to each pilot's view. Table lives in its own file
    # adjacent to this one — see dogfight/interactions_mvp.yaml.
    metric:
      name: energy
      direction: descending
      starting: 60
      threshold_low: 0
    beats:
      - id: straight
        label: Throttle Up
        metric_delta: 5
        stat_check: Reflex
        narrator_hint: Hold vector. Engines at full burn. Recover energy.
      - id: bank
        label: Break Right
        metric_delta: -5
        stat_check: Reflex
        narrator_hint: Hard starboard break. Costs energy, breaks the merge geometry.
      - id: loop
        label: Vertical Reversal
        metric_delta: -30
        stat_check: Reflex
        narrator_hint: Full vertical loop — catch them from behind on the exit.
      - id: kill_rotation
        label: Kill Rotation
        metric_delta: -5
        stat_check: Reflex
        narrator_hint: Flip 180 on attitude jets. Back-shot on inertia.
    interaction_table:
      _from: dogfight/interactions_mvp.yaml
    mood: combat
