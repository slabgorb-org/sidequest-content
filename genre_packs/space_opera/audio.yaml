# PURCHASED-FIRST audio (revamped 2026-06-14).
#
# WHY THE `themes:` BLOCK IS GONE: library_backend._resolve_music plays a mood's
# `themes` variations BEFORE it ever falls through to `mood_tracks`. That meant
# the ACE-Step set-1 leitmotifs shadowed the purchased catalog completely — the
# only purchased track that ever played was "3 Dark", and only because it had
# been slotted in as the exploration theme's `ambient` *variation*. We were
# hearing purchased variations of generated songs. Removing `themes:` makes
# `mood_tracks` the live source, so the purchased tracks lead.
#
# Source provenance: genre_packs/PURCHASED_AUDIO.md
#   - SciFi Atmosphere Loops Vol1 (WAV)  -> scifi_atmosphere_*, scifi_reactor_*, "3 Dark"
#   - TableTop "Ambient Environments"    -> streets_of_seattle_2072, black_ice, sabotage,
#                                           syndicate, angelic_voices, action_sequence, planet_x
# ACE a2a is retained ONLY where no purchased track fits the mood yet (rest,
# galley) — flagged below for future sourcing. The removed set-1 / themed-a2a
# OGGs are now orphaned in R2 (same disposition as the caverns tension_4 cut).
mood_tracks:
  exploration:
    - path: audio/music/scifi_atmosphere_full.ogg
      title: "Atmosphere — Full"
      bpm: 60
    - path: audio/music/set-1/exploration_ambient.ogg   # purchased "3 Dark" (SciFi Atmosphere Loops Vol1)
      title: "Atmosphere — Dark"
      bpm: 58
    - path: audio/music/streets_of_seattle_2072.ogg
      title: "Streets of Seattle 2072"
      bpm: 60
    - path: audio/music/angelic_voices.ogg
      title: "Angelic Voices"
      bpm: 70
  combat:
    - path: audio/music/black_ice.ogg
      title: "Black ICE"
      bpm: 95
    - path: audio/music/sabotage.ogg
      title: "Sabotage"
      bpm: 90
    - path: audio/music/action_sequence.ogg
      title: "Action Sequence"
      bpm: 120
  chase:
    # No purchased chase cue yet — reuse the energetic purchased combat tracks.
    # (Was set-1/chase_* ACE leitmotifs, lost with the themes block.)
    - path: audio/music/action_sequence.ogg
      title: "Action Sequence"
      bpm: 120
    - path: audio/music/black_ice.ogg
      title: "Black ICE"
      bpm: 95
  tension:
    - path: audio/music/scifi_atmosphere_pulse_texture.ogg
      title: "Atmosphere — Pulse and Texture"
      bpm: 70
    - path: audio/music/scifi_reactor_intense.ogg
      title: "Reactor — Intense"
      bpm: 75
  drift:
    - path: audio/music/scifi_atmosphere_texture.ogg
      title: "Atmosphere — Texture"
      bpm: 50
    - path: audio/music/scifi_reactor_movement.ogg
      title: "Reactor — Movement"
      bpm: 60
    - path: audio/music/syndicate.ogg
      title: "Syndicate"
      bpm: 55
  docking:
    - path: audio/music/scifi_reactor_full.ogg
      title: "Reactor — Full"
      bpm: 65
  void:
    - path: audio/music/scifi_reactor_dark.ogg
      title: "Reactor — Dark"
      bpm: 40
    - path: audio/music/planet_x.ogg
      title: "Planet X"
      bpm: 45

  # --- ACE a2a retained: no purchased track fits these moods yet. FLAGGED for
  #     sourcing (space-lounge / shipboard-quiet). Remove once real audio lands. ---
  rest:
    - path: audio/music/themed/rest/rest_music_box_lullaby.ogg
      title: "Music Box Lullaby"
      bpm: 60
    - path: audio/music/themed/rest/rest_acoustic_guitar_viewport.ogg
      title: "Acoustic Guitar Viewport"
      bpm: 65
  galley:
    - path: audio/music/themed/cantina/cantina_sitar_nebula.ogg
      title: "Sitar Nebula"
      bpm: 85
    - path: audio/music/themed/cantina/cantina_steel_drums_orbital.ogg
      title: "Steel Drums Orbital"
      bpm: 90
    - path: audio/music/themed/cantina/cantina_throat_singing_tavern.ogg
      title: "Throat Singing Tavern"
      bpm: 80

  # --- Coyote Star world overrides ---
  # World-specific moods for the frontier-western/voidborn/Tsveri blend.
  # Fired by world-aware narrator context, not by the genre defaults.
  coyote_frontier:
    - path: audio/music/themed/coyote_star/coyote_frontier_full.ogg
      title: "Mendes' Post"
      bpm: 80
  coyote_voidborn:
    - path: audio/music/themed/coyote_star/coyote_voidborn_full.ogg
      title: "Turning Hub Ceremony"
      bpm: 90
  coyote_tsveri:
    - path: audio/music/themed/coyote_star/coyote_tsveri_full.ogg
      title: "Deep Root Hum"
      bpm: 35
  coyote_governor:
    - path: audio/music/themed/coyote_star/coyote_governor_full.ogg
      title: "Vaskov Centrum"
      bpm: 65
  coyote_outer_dark:
    - path: audio/music/themed/coyote_star/coyote_outer_dark_full.ogg
      title: "The Long Hum"
      bpm: 30
  coyote_smuggler:
    - path: audio/music/themed/coyote_star/coyote_smuggler_full.ogg
      title: "Blind Corner Run"
      bpm: 95

sfx_library:
  blaster_fire:
    - audio/sfx/blaster_fire.ogg
  blaster_impact:
    - audio/sfx/blaster_impact.ogg
  ship_hum:
    - audio/sfx/ship_hum.ogg
  airlock_cycle:
    - audio/sfx/airlock_cycle.ogg
  hull_creak:
    - audio/sfx/hull_creak.ogg
  alarm_klaxon:
    - audio/sfx/alarm_klaxon.ogg
  decompression:
    - audio/sfx/decompression.ogg
  jump_drive:
    - audio/sfx/jump_drive.ogg
  comms_chatter:
    - audio/sfx/comms_chatter.ogg
  footsteps_metal:
    - audio/sfx/footsteps_metal.ogg
  door_hiss:
    - audio/sfx/door_hiss.ogg
  engine_failure:
    - audio/sfx/engine_failure.ogg
  docking_clamp:
    - audio/sfx/docking_clamp.ogg

mixer:
  music_volume: 0.35
  sfx_volume: 0.7
  crossfade_default_ms: 4000

# Library always resolves now (every mood has a track, else falls back to
# exploration), so musicgen never fires — effectively inert, kept for parity.
ai_generation:
  enabled: true
  model: musicgen_small
  max_generation_time_s: 15
  cache_generated: true
