# Broken Drift Runners — visual identity tokens for image generation
# Used as the ART_SENSIBILITY.CULTURE layer for Broken Drift-cultured
# characters. The signature is the absence of signatures — deliberately
# ungrouped, plausible-deniability working clothes. Their identity is
# identification refusal: every faction patch has been removed, every
# tell has been smoothed away. The ONE small personal mark is the
# captain's tell.

visual_tokens: >-
  Mismatched civilian layers in deep brown, charcoal black, and oxidized
  grey — colors that disappear in asteroid shadow. A battered flight
  jacket with every patch and faction insignia cleanly stripped away,
  leaving faint ghost outlines in the unfaded cloth. Cargo pants heavy
  with full pockets, boots resoled and resoled again. EVA suit panels
  patched in mixed unmarked plates when worn. Tool belt weighted toward
  cutting and breaching gear — a short pry bar, a cutter, a sealed kit.
  Pale spacer pallor, lean wiry build from low-g life, quick hands and
  a watching stillness. No clan tattoos, no jewelry, no rank — except
  one single deliberate personal mark each: a faded scarf, a worn
  charm, a thumb-band, a chipped pin from a prior life. The captain's
  tell. Everything else is unsigned.
