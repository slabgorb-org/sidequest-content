# Tsveri — visual identity tokens for image generation
# Used as the ART_SENSIBILITY.CULTURE layer for Tsveri-cultured characters
# and any scene featuring Tsveri presence. Composes on top of the
# space_opera genre suffix (Vienna Secession / Mucha framing) and the
# coyote_reach world suffix (frontier dust). The Tsveri should read at
# home in a Mucha poster — strong silhouette, flat color fields,
# patient verticality.

visual_tokens: >-
  Tall deliberate alien figure standing a head above any human in the
  frame, elongated proportions held with geological stillness. Silicon-
  laced integument that catches light like polished hematite, with
  subtle iridescent shifts in the flat color planes — cool slate grey
  at rest, warm amber across cheek and shoulder when engaged, deep
  basalt across the brow when wary. Smooth ridged crown in place of
  hair. Wide flat face with deep-set solid amber eyes and lateral
  respiration slits along the jaw. Four-fingered hands with mineral-
  dark nails, held with patient intention. A single woven mineral-
  fiber drape across one shoulder, embedded with small Deep Root stone
  fragments that emit a faint inner light. Strong vertical silhouette,
  unhurried posture, flat-color treatment.
