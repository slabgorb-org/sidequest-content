chapters:
  - id: fresh
    label: "New Drift"
    session_range: [1, 5]
    description: >-
      The players arrive in Coyote Reach through the jump point or
      are already here, scraping by on the margins. The system is
      tense but functional — the governor taxes, the miners grumble,
      the voidborn trade, and the Tsveri keep to themselves. The
      mining dispute over the Deep Root range is heating up but
      hasn't boiled over. Odd reports from the outer system are
      just bar talk. The players find work, make contacts, and
      learn who matters in a system where everyone knows everyone
      and nobody trusts anyone completely.
    events: []
    points_of_interest:
      - name: Vaskov Centrum
        slug: vaskov_centrum
        region: far_landing
        type: settlement
        description: >-
          The Hegemonic administrative compound on Far
          Landing: a prefab complex expanded and patched for
          two decades, sitting on a wind-scoured plateau above
          the alkaline flats. The governor's office is on the
          third floor. The flagpole is fibreglass. The
          holding cells are half-full on any normal day. The
          sunsets are brown.
        visual_prompt: >-
          Wide elevated landscape view of an austere far-future
          administrative compound on a wind-scoured high plateau.
          Foreground: a cluster of prefabricated polymer building
          blocks linked by enclosed walkways, a slender comms mast,
          a low watchtower. Middle ground: pale alkaline salt flats
          stretching to a low ridge. Background: brown dust haze on
          the horizon under a dim ochre sky. Late afternoon, low
          directional sun casting long hard shadows. Mood austere,
          bureaucratic, isolated.
      - name: Mendes' Post
        slug: mendes_post
        region: new_claim
        type: bar
        description: >-
          The Free Miners' Compact's unofficial parliament, on
          New Claim: a low-ceilinged bar built into the side
          of a refinery, lit by salvaged bulkhead lamps and
          warmed by the waste heat of the ore crushers next
          door. Signed ore-tags cover every wall. Mendes has
          been dead for fourteen years. Nobody has taken her
          name off the door.
        visual_prompt: >-
          Medium interior landscape of a low-ceilinged frontier
          miners' bar carved into the flank of a working refinery.
          Foreground: a battered communal counter with mismatched
          stools, layered metal ore-tags hanging in dense rows
          across the back wall. Middle ground: dim booths
          occupied by miners in stained coveralls. Background: an
          open archway revealing the red-orange glow of ore-crusher
          heat through a gantry doorway. Lighting from salvaged
          bulkhead lamps casting warm amber pools, deep shadow
          between. Mood smoky, communal, tired.
      - name: The Broken Drift (Main Belt)
        slug: the_broken_drift
        region: broken_drift
        type: asteroid_belt
        description: >-
          The central corridor of the asteroid belt: thousands
          of rocks ranging from gravel to small-moon size,
          riddled with mining claims and the occasional dead
          prospector shack still running on last year's
          batteries. Salvage scows work the drift at low
          thrust, reading stencil claim-numbers off the rock
          faces with hand-lamps.
        visual_prompt: >-
          Wide deep-space landscape of an asteroid mining corridor.
          Foreground: a long irregular asteroid drifting close, its
          rock face pitted and pocked, a small salvage-scow passing
          slowly with hand-lamps trained on the surface. Middle
          ground: dozens more asteroids in loose formation, varying
          from boulder to small-moon size. Background: distant
          asteroid silhouettes against a starfield, a pale nebular
          gradient of teal and oxblood across the dark void. Mood
          vast, lonely, industrial.
      - name: Turning Hub (Docking Crescent)
        slug: turning_hub_docking
        region: turning_hub
        type: station
        description: >-
          The outer docking crescent of Clan Moana-Teru's
          freeport: three station hulls welded together into
          a sprawling waypoint orbiting the gas giant Red
          Prospect. Customs inspectors work the queue with
          the unhurried patience of people who have decided
          what they are willing to notice. Ship repair bays
          flank the docking ring on both sides, and a voidborn
          deckhand sings while she welds.
        visual_prompt: >-
          Wide deep-space landscape of a sprawling free-port station
          composed of three large cylindrical hulls fused into a
          curved crescent shape. Foreground: an open repair berth
          with sparks from a welder, small mixed-species figures in
          flight gear at scale, gantry arms cradling a docked
          freighter. Middle ground: the curved length of the station
          ring with a queue of small craft awaiting docking.
          Background: the immense banded amber-and-rust globe of a
          gas giant filling half the frame. Mood busy, layered,
          lived-in.
      - name: The Grand Gate (Approach)
        slug: grand_gate_approach
        region: grand_gate
        type: jump_point
        description: >-
          The Hegemonic customs and traffic station at the
          system's only jump point, seen from the transit
          approach: a small grey installation against the
          deeper grey of empty space, lit by running lights
          and the occasional blue flash of a ship arriving.
          The sensor net has gaps. Every Runner in the system
          knows which ones.
        visual_prompt: >-
          Wide deep-space landscape from the perspective of an
          approaching ship. Foreground: a sleek angular hull edge
          in dark silhouette catching a thin rim-light. Middle
          ground: a small grey rectilinear customs station hanging
          in empty space, dotted with small running lights, with a
          brief blue energy flash radiating from its docking arm as
          another ship arrives. Background: pure deep void with a
          faint scatter of distant stars. Cold blue-grey lighting.
          Mood quiet, official, watchful.

  - id: early
    label: "Broken Compact"
    session_range: [6, 12]
    description: >-
      The mining dispute cracks open. Someone — a prospector, a
      corporate surveyor, a desperate claim-holder — pushes into
      Tsveri territory without authorization. The Tsveri response
      is measured but unmistakable, and suddenly the system's
      careful balance of mutual tolerance starts to slip. Governor
      Vaskov tries to mediate but has no leverage anyone respects.
      Clan Moana-Teru starts making contingency plans. The Broken
      Drift Runners smell opportunity. And the outer system readings
      get stronger — close enough now that ignoring them takes
      effort.
    events: []
    points_of_interest:
      - name: The Deep Root Range (Lowlands)
        slug: deep_root_lowlands
        region: deep_root_world
        type: alien_territory
        description: >-
          The temperate, empty lowlands beneath the Tsveri's
          sacred mountain range: rolling grassland unmarked
          by road or settlement, the kind of landscape that
          looks like a nature reserve and is in fact an
          absence the Tsveri chose to leave. The silence is
          deliberate. Geological surveys pick up the
          rare-earth signal clearly from here, and the
          Tsveri can hear the surveys.
        visual_prompt: >-
          Wide alien landscape under a pale dawn sky. Foreground:
          rolling unbroken grassland with native grasses bending
          in slow wind, no roads, no fences, no structures. Middle
          ground: a slow river curving through low folds of land,
          a single solitary tree-like alien plant at distance.
          Background: tall jagged sacred mountain peaks rising in
          deep teal silhouette across the horizon. Soft cool dawn
          lighting. Mood deliberate, hushed, sacred. Atmosphere of
          intentional emptiness.
      - name: The Contested Claim
        slug: the_contested_claim
        region: deep_root_world
        type: dig_site
        description: >-
          The unauthorised excavation pushed into Tsveri
          territory — a shallow scar on a foothill where the
          rare-earth reading spiked, torn open by hurried
          hauler-drills and then abandoned. A Tsveri marker
          stake, placed by something that walked here slowly,
          stands at the centre. The ground around the stake
          has not been disturbed, and cannot be disturbed
          now.
        visual_prompt: >-
          Medium landscape view of a fresh shallow excavation
          gouged into a grass-covered foothill. Foreground: torn
          red-brown soil, abandoned drill-hauler tracks cutting
          through wildflowers, a single tall carved stone marker
          stake of alien geometry at the centre of the disturbed
          ground, leaning slightly. Middle ground: untouched
          grassland fading back toward the slope's crest.
          Background: distant alien sacred mountain peaks in deep
          teal silhouette under an overcast sky. Mood
          transgressive, watched, charged with stillness.
      - name: Red Prospect (Scoop Zone)
        slug: red_prospect_scoop_zone
        region: red_prospect
        type: gas_giant
        description: >-
          The upper atmosphere of the gas giant Red Prospect,
          where Clan Moana-Teru's converted haulers skim
          hydrogen through rust-banded storm bands. The view
          from a scoop-run cockpit is ninety percent weather
          and ten percent sky, and every pilot carries a
          small charm that belonged to someone who did not
          come back.
        visual_prompt: >-
          Wide deep-atmosphere landscape inside the upper bands of
          a vast gas giant. Foreground: the underside of a
          converted bulk hauler with scoop ramps lowered, glowing
          intake plasma along its belly, trailing thin streamers of
          hydrogen vapour. Middle ground: roiling rust-banded storm
          clouds streaked with chains of distant lightning.
          Background: layered storm bands curving away to a
          planetary horizon, a pale distant moon. Dramatic
          underlighting from the plasma intake. Mood turbulent,
          dwarfing, exhilarating.
      - name: The Broken Drift Runners' Meet
        slug: broken_drift_runners_meet
        region: broken_drift
        type: hideout
        description: >-
          A cluster of mined-out asteroids the Runners use as
          a rolling meeting point, rotated every few weeks
          to stay off any patrol pattern. A hollowed rock
          with a pressurised bay, a sensor-shadow orbit, and
          the kind of hospitality that is entirely
          transactional. During the Broken Compact the Meet
          is at full capacity and the Runners are taking
          contracts they would not have taken a month ago.
        visual_prompt: >-
          Medium deep-space landscape of an outlaw rendezvous in
          a hollowed asteroid. Foreground: the open mouth of a
          pressurised docking bay carved into a large rock, two
          unmarked vessels berthed inside under warm amber bay
          lights, a small figure in flight gear standing at the
          threshold. Middle ground: a loose cluster of mined-out
          smaller asteroids forming a sensor-shadow ring.
          Background: deep void with a faint nebular oxblood
          haze. Mood clandestine, transactional, watchful.
      - name: Dark Reach (Listening Drift)
        slug: dark_reach_listening_drift
        region: last_drift
        type: anomaly
        description: >-
          A point in the outer system, past Red Prospect,
          where the persistent low-frequency signal is
          loudest. A handful of outer-system prospectors
          have dropped makeshift sensor buoys here. The
          readings are consistent: something is broadcasting,
          and the broadcast is not coming from any charted
          body. The Tsveri have nothing to say about this,
          and the nothing is pointed.
        visual_prompt: >-
          Wide deep-space landscape at the cold edge of a star
          system. Foreground: a small makeshift sensor buoy
          bristling with antennae and dish arrays drifting against
          the void, a faint indicator light blinking on its hull.
          Middle ground: a few more scattered buoys at distance,
          their lights faint pinpricks. Background: a vast empty
          starfield with a single pale circular region of subtle
          visual distortion that does not match the surrounding
          sky. Cold blue-grey lighting. Mood eerie, expectant,
          scientific.

  - id: mid
    label: "Grand Gate"
    session_range: [13, 20]
    description: >-
      Control of the jump point becomes the central question. With
      the mining dispute unresolved and outside interests starting
      to notice Coyote Reach's rare-earth deposits, whoever holds
      Grand Gate decides what comes in, what goes out, and who gets
      to stay. The Hegemony sends a second ship — or threatens to.
      The voidborn consider closing Turning Hub to pressure all
      sides. The Tsveri break their silence about the outer system,
      and what they say changes the stakes entirely. The players
      are no longer bystanders in a trade dispute. They're in the
      middle of a fight over what this system is and who it belongs
      to.
    events: []
    points_of_interest:
      - name: Grand Gate (Control Deck)
        slug: grand_gate_control_deck
        region: grand_gate
        type: jump_point
        description: >-
          The control deck of the jump-point station: a
          small windowless room walled in sensor repeaters
          and departure manifests, staffed by three tired
          Hegemonic officers and a warrant officer who has
          personally opened the gate to every ship in the
          last ten years. During the crisis the deck is
          full: voidborn observers, Compact delegates, and
          a second Hegemonic patrol captain whose orders
          arrived sealed.
        visual_prompt: >-
          Medium interior landscape of a small windowless command
          deck aboard a far-future jump-point station. Foreground:
          a curved console covered with banks of sensor repeater
          displays glowing teal and amber, a single senior officer
          seated at the central station. Middle ground: three
          additional uniformed officers at flanking consoles, a
          sealed orders cylinder resting on a side table.
          Background: bulkhead walls layered with embossed plaque
          panels stacked in tight rows. Cool overhead recessed
          lighting with warm screen glow on faces. Mood tense,
          overcrowded, official.
      - name: Turning Hub (Negotiation Bay)
        slug: turning_hub_negotiation_bay
        region: turning_hub
        type: station
        description: >-
          Clan Moana-Teru's neutral-ground meeting hall on
          the inner ring of Turning Hub: an open bay with
          benches cut from hull plate arranged in concentric
          arcs around a single low table. The clan elder
          presides by custom. The Tsveri delegation is
          present, for the first time in a generation, and
          the silence while they consider the table changes
          the air pressure in the room.
        visual_prompt: >-
          Medium interior landscape of a neutral-ground meeting
          hall aboard a free-port station. Foreground: a single
          low circular table cut from welded hull plate at the
          room's centre, surface bare. Middle ground: concentric
          arcing benches cut from the same hull plate, occupied by
          a mixed delegation — silhouetted alien figures of
          unfamiliar proportion, voidborn human elders in
          patterned robes, station clan members. Background: the
          curved bulkhead of a station inner ring with tall
          viewports showing distant stars and the upper limb of a
          gas giant. Soft cool overhead light. Mood ceremonial,
          weighted with silence.
      - name: The Deep Root Sacred Peaks
        slug: deep_root_sacred_peaks
        region: deep_root_world
        type: alien_sanctum
        description: >-
          The heart of the Tsveri range, where the rare-earth
          deposits sit directly beneath the oldest ceremonial
          sites. The peaks are heavily eroded and seismically
          quiet in a way geologists find suspicious. The
          Tsveri have walked these paths for millennia and
          their footprints have pressed small, consistent
          hollows into stone that should not be soft enough
          to hold them.
        visual_prompt: >-
          Wide alien landscape high in a sacred mountain range.
          Foreground: smooth weather-worn rock paths across a
          ridge, shallow rounded hollows pressed into the stone
          in a regular walking pattern, leading away from camera.
          Middle ground: heavily eroded peaks of pale grey-green
          stone, ceremonial standing stone arches at the ridge
          line. Background: deeper mountain ranges receding under
          a pale jewel-toned alien sky banded with high thin
          cloud. Soft directional dawn light, long shadows. Mood
          ancient, sacred, geologically wrong.
      - name: Last Drift (Outer Anomaly)
        slug: last_drift_outer_anomaly
        region: last_drift
        type: anomaly
        description: >-
          The source of the persistent low-frequency signal,
          now triangulated: a region of space past Last
          Drift where the navigational readings disagree
          with every chart. Ships approaching slow without
          throttle input. The background radiation runs
          cooler than the void around it. The Tsveri, when
          pressed, have given a name for it — not a
          translation, a name — and the name has four
          syllables.
        visual_prompt: >-
          Wide deep-space landscape at the far cold edge of a
          star system. Foreground: a small sleek starship in dark
          approach silhouette, drives idle, rim-lit by a faint
          violet glow. Middle ground: a faintly visible spherical
          region of space where the starfield bends and refracts
          subtly, edges shimmering with chromatic distortion.
          Background: pure void with cooler-than-natural shadow
          gradients, a sparse scatter of distant stars. Mood
          enigmatic, hushed, threshold-like.
      - name: The Vaskov Plateau Summit
        slug: vaskov_plateau_summit
        region: far_landing
        type: landmark
        description: >-
          The open plateau above Vaskov Centrum where the
          governor has called an unprecedented open
          council: Compact, clan, Tsveri delegation,
          Hegemony, and any Drift Runner willing to attend
          under safe-conduct. The benches are folding
          camp-chairs. The sky above the plateau is clear
          for the first time in a week and the brown
          sunset is visible from the back row.
        visual_prompt: >-
          Wide elevated landscape of an open windswept high
          plateau at sunset. Foreground: irregular rows of folding
          camp-chairs facing inward toward a low speaker's
          platform, scattered figures in varied attire — miners
          in coveralls, station elders in robes, a small alien
          delegation off to one side — seated and standing.
          Middle ground: the platform with a simple podium and a
          tall slender flagpole. Background: clear sky transitioning
          from deep teal at zenith to oxblood and amber at the
          horizon, the brown disk of the setting sun visible above
          the rim of the plateau. Mood civic, fragile, hopeful.
