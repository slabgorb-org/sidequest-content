chapters:
  - id: fresh
    label: "New Drift"
    session_range: [1, 5]
    description: >-
      The players arrive in Coyote Reach through the jump point or
      are already here, scraping by on the margins. The system is
      tense but functional — the governor taxes, the miners grumble,
      the voidborn trade, and the Tsveri keep to themselves. The
      mining dispute over the Deep Root range is heating up but
      hasn't boiled over. Odd reports from the outer system are
      just bar talk. The players find work, make contacts, and
      learn who matters in a system where everyone knows everyone
      and nobody trusts anyone completely.
    events: []
    points_of_interest:
      - name: Vaskov Centrum
        slug: vaskov_centrum
        region: far_landing
        type: settlement
        description: >-
          The Hegemonic administrative compound on Far
          Landing: a prefab complex expanded and patched for
          two decades, sitting on a wind-scoured plateau above
          the alkaline flats. The governor's office is on the
          third floor. The flagpole is fibreglass. The
          holding cells are half-full on any normal day. The
          sunsets are brown.
      - name: Mendes' Post
        slug: mendes_post
        region: new_claim
        type: bar
        description: >-
          The Free Miners' Compact's unofficial parliament, on
          New Claim: a low-ceilinged bar built into the side
          of a refinery, lit by salvaged bulkhead lamps and
          warmed by the waste heat of the ore crushers next
          door. Signed ore-tags cover every wall. Mendes has
          been dead for fourteen years. Nobody has taken her
          name off the door.
      - name: The Broken Drift (Main Belt)
        slug: the_broken_drift
        region: broken_drift
        type: asteroid_belt
        description: >-
          The central corridor of the asteroid belt: thousands
          of rocks ranging from gravel to small-moon size,
          riddled with mining claims and the occasional dead
          prospector shack still running on last year's
          batteries. Salvage scows work the drift at low
          thrust, reading stencil claim-numbers off the rock
          faces with hand-lamps.
      - name: Turning Hub (Docking Crescent)
        slug: turning_hub_docking
        region: turning_hub
        type: station
        description: >-
          The outer docking crescent of Clan Moana-Teru's
          freeport: three station hulls welded together into
          a sprawling waypoint orbiting the gas giant Red
          Prospect. Customs inspectors work the queue with
          the unhurried patience of people who have decided
          what they are willing to notice. Ship repair bays
          flank the docking ring on both sides, and a voidborn
          deckhand sings while she welds.
      - name: The Grand Gate (Approach)
        slug: grand_gate_approach
        region: grand_gate
        type: jump_point
        description: >-
          The Hegemonic customs and traffic station at the
          system's only jump point, seen from the transit
          approach: a small grey installation against the
          deeper grey of empty space, lit by running lights
          and the occasional blue flash of a ship arriving.
          The sensor net has gaps. Every Runner in the system
          knows which ones.

  - id: early
    label: "Broken Compact"
    session_range: [6, 12]
    description: >-
      The mining dispute cracks open. Someone — a prospector, a
      corporate surveyor, a desperate claim-holder — pushes into
      Tsveri territory without authorization. The Tsveri response
      is measured but unmistakable, and suddenly the system's
      careful balance of mutual tolerance starts to slip. Governor
      Vaskov tries to mediate but has no leverage anyone respects.
      Clan Moana-Teru starts making contingency plans. The Broken
      Drift Runners smell opportunity. And the outer system readings
      get stronger — close enough now that ignoring them takes
      effort.
    events: []
    points_of_interest:
      - name: The Deep Root Range (Lowlands)
        slug: deep_root_lowlands
        region: deep_root_world
        type: alien_territory
        description: >-
          The temperate, empty lowlands beneath the Tsveri's
          sacred mountain range: rolling grassland unmarked
          by road or settlement, the kind of landscape that
          looks like a nature reserve and is in fact an
          absence the Tsveri chose to leave. The silence is
          deliberate. Geological surveys pick up the
          rare-earth signal clearly from here, and the
          Tsveri can hear the surveys.
      - name: The Contested Claim
        slug: the_contested_claim
        region: deep_root_world
        type: dig_site
        description: >-
          The unauthorised excavation pushed into Tsveri
          territory — a shallow scar on a foothill where the
          rare-earth reading spiked, torn open by hurried
          hauler-drills and then abandoned. A Tsveri marker
          stake, placed by something that walked here slowly,
          stands at the centre. The ground around the stake
          has not been disturbed, and cannot be disturbed
          now.
      - name: Red Prospect (Scoop Zone)
        slug: red_prospect_scoop_zone
        region: red_prospect
        type: gas_giant
        description: >-
          The upper atmosphere of the gas giant Red Prospect,
          where Clan Moana-Teru's converted haulers skim
          hydrogen through rust-banded storm bands. The view
          from a scoop-run cockpit is ninety percent weather
          and ten percent sky, and every pilot carries a
          small charm that belonged to someone who did not
          come back.
      - name: The Broken Drift Runners' Meet
        slug: broken_drift_runners_meet
        region: broken_drift
        type: hideout
        description: >-
          A cluster of mined-out asteroids the Runners use as
          a rolling meeting point, rotated every few weeks
          to stay off any patrol pattern. A hollowed rock
          with a pressurised bay, a sensor-shadow orbit, and
          the kind of hospitality that is entirely
          transactional. During the Broken Compact the Meet
          is at full capacity and the Runners are taking
          contracts they would not have taken a month ago.
      - name: Dark Reach (Listening Drift)
        slug: dark_reach_listening_drift
        region: last_drift
        type: anomaly
        description: >-
          A point in the outer system, past Red Prospect,
          where the persistent low-frequency signal is
          loudest. A handful of outer-system prospectors
          have dropped makeshift sensor buoys here. The
          readings are consistent: something is broadcasting,
          and the broadcast is not coming from any charted
          body. The Tsveri have nothing to say about this,
          and the nothing is pointed.

  - id: mid
    label: "Grand Gate"
    session_range: [13, 20]
    description: >-
      Control of the jump point becomes the central question. With
      the mining dispute unresolved and outside interests starting
      to notice Coyote Reach's rare-earth deposits, whoever holds
      Grand Gate decides what comes in, what goes out, and who gets
      to stay. The Hegemony sends a second ship — or threatens to.
      The voidborn consider closing Turning Hub to pressure all
      sides. The Tsveri break their silence about the outer system,
      and what they say changes the stakes entirely. The players
      are no longer bystanders in a trade dispute. They're in the
      middle of a fight over what this system is and who it belongs
      to.
    events: []
    points_of_interest:
      - name: Grand Gate (Control Deck)
        slug: grand_gate_control_deck
        region: grand_gate
        type: jump_point
        description: >-
          The control deck of the jump-point station: a
          small windowless room walled in sensor repeaters
          and departure manifests, staffed by three tired
          Hegemonic officers and a warrant officer who has
          personally opened the gate to every ship in the
          last ten years. During the crisis the deck is
          full: voidborn observers, Compact delegates, and
          a second Hegemonic patrol captain whose orders
          arrived sealed.
      - name: Turning Hub (Negotiation Bay)
        slug: turning_hub_negotiation_bay
        region: turning_hub
        type: station
        description: >-
          Clan Moana-Teru's neutral-ground meeting hall on
          the inner ring of Turning Hub: an open bay with
          benches cut from hull plate arranged in concentric
          arcs around a single low table. The clan elder
          presides by custom. The Tsveri delegation is
          present, for the first time in a generation, and
          the silence while they consider the table changes
          the air pressure in the room.
      - name: The Deep Root Sacred Peaks
        slug: deep_root_sacred_peaks
        region: deep_root_world
        type: alien_sanctum
        description: >-
          The heart of the Tsveri range, where the rare-earth
          deposits sit directly beneath the oldest ceremonial
          sites. The peaks are heavily eroded and seismically
          quiet in a way geologists find suspicious. The
          Tsveri have walked these paths for millennia and
          their footprints have pressed small, consistent
          hollows into stone that should not be soft enough
          to hold them.
      - name: Last Drift (Outer Anomaly)
        slug: last_drift_outer_anomaly
        region: last_drift
        type: anomaly
        description: >-
          The source of the persistent low-frequency signal,
          now triangulated: a region of space past Last
          Drift where the navigational readings disagree
          with every chart. Ships approaching slow without
          throttle input. The background radiation runs
          cooler than the void around it. The Tsveri, when
          pressed, have given a name for it — not a
          translation, a name — and the name has four
          syllables.
      - name: The Vaskov Plateau Summit
        slug: vaskov_plateau_summit
        region: far_landing
        type: landmark
        description: >-
          The open plateau above Vaskov Centrum where the
          governor has called an unprecedented open
          council: Compact, clan, Tsveri delegation,
          Hegemony, and any Drift Runner willing to attend
          under safe-conduct. The benches are folding
          camp-chairs. The sky above the plateau is clear
          for the first time in a week and the brown
          sunset is visible from the back row.
