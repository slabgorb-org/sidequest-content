# Perseus Cloud cartography — regenerated from Jade & Sebastien's
# Sectors Without Number export (perseus_cloud.sector.json), 2026-05-28.
# 34 systems, adjacency from the export's route graph. Each region carries
# an `swn:` block (tech level / atmosphere / biosphere / population / world
# tags) preserved verbatim from the export for narrator + mechanical use.
# Faction control applied where vault/export attest it; null otherwise.
# Ceron (vault-only, no public routes) is appended off the export graph.
map_resolution: null
map_style: A Sectors Without Number hex chart of the Perseus Cloud, redrawn
  by hand after the GHE severed the galactic lanes — Praetorium-era engraving
  overwritten with Regency seals, Church vault-marks, and Yulan corporate
  stamps, the lost outbound lanes trailing off the chart's edge into blank
  parchment.
navigation_mode: region
# Player-map disclosure (sq-playtest 2026-06-07): a Regency sector chart is
# NOT common knowledge — vault systems and invitation-only havens state in
# their own lore that they're off the public map. Fog mode ships only
# discovered systems with lore; adjacent systems name-only; the rest stay
# off the wire until the party finds them.
discovery_mode: fog
starting_region: yula
world_name: Perseus Cloud

