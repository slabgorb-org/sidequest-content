      A sturdy adult woman in her fifties, square steady face, deep
      nasolabial lines, level mouth, dark heavy-lidded eyes that miss
      nothing. Grey-streaked hair pinned flat under a tech-cowl. Broad flat
      shoulders under a heavy high-collared dome-tech coat, reading as one
      dark slab. Her one accent: a single amber-gold gauge bezel at the
      collar, the only warm light on her.

