      A spare adult woman in her forties, narrow weathered face, hollow
      cheeks, pale grey-toned skin, the flat steady gaze of long graveyard
      shifts. Ash-brown hair scraped into a short practical knot. Lean
      shoulders under a buttoned-flat shield-tech smock with a high collar,
      a Dust-grade filter hung at her throat. Her one accent: a thin
      viridian status-stripe at the cuff and collar, the only saturated
      colour on her.

  - id: picker_thari_naval_officer_m02
    name: picker thari naval officer m02
    role: Thari Naval Officer
    type: player_picker
    culture: thari
    archetype: Thari Naval Officer
    sex: male
    backdrop_poi: regency_court_thar
    appearance: >-
      A young adult man, scarcely thirty, smooth pale aristocratic face,
      high cheekbones, a cool incurious mouth. Dark hair worn longer and
      swept back from a clean part, grey eyes carrying inherited certainty.
      Slim straight shoulders rising into the rigid standing collar of a
      cadet's greatcoat, the line tall and narrow. His one accent: a single
      crimson House cord knotted at the throat, the only saturated colour
      on him.

  - id: picker_thari_shield_tech_f02
    name: picker thari shield tech f02
    role: Lazzaro Shield-Tech
    type: player_picker
    culture: thari
    archetype: Lazzaro Shield-Tech
    sex: female
    backdrop_poi: coelitha_derelicts
