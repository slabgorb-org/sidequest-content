      A weathered adult man past fifty, broad lined face, heavy brow, a flat
      watchful calm in deep-set grey eyes. Close-cropped iron-grey hair and a
      short grey beard, light skin grey-toned and dust-dry. Thick neck and
      wide flat shoulders under a high-collared tech smock. A respirator strap
      sits looped at the throat. His one accent: a single sickly viridian
      indicator light at the collar, the only saturated colour on him.

  - id: picker_thari_shield_tech_f01
    name: picker thari shield tech f01
    role: Lazzaro Shield-Tech
    type: player_picker
    culture: thari
    archetype: Lazzaro Shield-Tech
    sex: female
    backdrop_poi: lazzaro_dust_settlements
