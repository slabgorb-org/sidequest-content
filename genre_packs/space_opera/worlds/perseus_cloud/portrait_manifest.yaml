# Character portraits for Perseus Cloud — Z-Image / Flux portrait generation
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  GM-DRAFT VISUAL CANON — PLACEHOLDER FOR JADE TO OVERRIDE             ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Perseus Cloud is Jade & Sebastien's imported sector. The Master Lore ║
# ║  vault was SILENT on every NPC's appearance, age, pronouns, and dress ║
# ║  (npcs.yaml carries [STUB for Jade] markers; world.yaml waives this   ║
# ║  file under incomplete_files). The import discipline is "transcribe,  ║
# ║  don't fabricate."                                                    ║
# ║                                                                       ║
# ║  THE appearance / culture_aesthetic BELOW IS NOT VAULT CANON. It is   ║
# ║  a GM-authored draft, commissioned by Keith (2026-06-06) so the world ║
# ║  has portraits to play with NOW. Every visual choice here — face,     ║
# ║  age, build, dress, accent colour — is invention extrapolated from    ║
# ║  faction + culture, NOT from anything Jade or Sebastien wrote.        ║
# ║                                                                       ║
# ║  JADE: overwrite any/all of this freely. Nothing here is load-bearing ║
# ║  on the affair "the Princess and the Poisoner" — I deliberately did   ║
# ║  NOT resolve which of Restra Velmont / the others is princess vs.     ║
# ║  poisoner, since that's plot canon, not visual canon. world.yaml's    ║
# ║  incomplete_files waiver STAYS until you ratify these — this file      ║
# ║  existing does not mean the canon is yours yet.                       ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Aesthetic (from visual_style.yaml): painterly sci-fi BOOK-COVER idiom,
# "emphasis on shape" — mid-century-modern silhouettes, muted atmospheric
# palette (desaturated slate / grey-blue / soft green) with ONE reserved
# saturated accent per figure as a focal pop. These entries carry SUBJECT
# only; the daemon's PromptComposer injects the style from visual_style.yaml.
# Descriptions are written shape-forward — strong readable silhouette, dress
# as bold geometric mass — so a softened, painterly render still reads.

characters:
  # ── CENTRAL — "The Princess and the Poisoner" ──────────────────────────

  # Vault id: aliya_dad. CANON: Admiral, Thari Navy; conservative, a
  # regressive cultural force on the Regency. Everything visual below is draft.
  - name: Aliya Dad
    role: Admiral of the Thari Navy
    type: npc_major
    culture: thari
    appearance: >-
      A broad, heavy-framed adult woman past sixty, weathered brown skin,
      deep nasolabial lines, square jaw, level downturned mouth,
      heavy-lidded dark eyes. Grey hair scraped flat into a tight low coil.
      A thick neck and wide flat shoulders. She stands rigidly upright,
      chin slightly lifted, hands clasped behind her back. Full-length
      standing portrait. Her coat falls straight from shoulder to floor in
      one unbroken vertical column, broad and flat-fronted, reading as a
      single tall dark slab of a figure.
    culture_aesthetic: >-
      Thari naval aristocracy — a floor-length stiff admiral's greatcoat in
      slate so dark it is nearly black, high standing collar, square
      shoulders, no buttons or medals showing. Her one reserved accent: a
      single oxblood-crimson sash crossing the chest from shoulder to hip,
      the only saturated colour on her.

  # Vault id: restra_velmont. CANON: central figure of "the Princess and
  # the Poisoner"; Thari-pattern name (House Velmont). Vault silent on which
  # side of the affair she stands. Draft below leaves that unresolved.
  - name: Restra Velmont
    role: Central figure — the Princess and the Poisoner
    type: npc_major
    culture: thari
    appearance: >-
      A poised young adult woman, pale fine-boned face, long throat, level
      grey eyes, a still closed mouth. Dark hair dressed high and smooth
      into a single sculptural sweep clear of the face. Slender, very
      upright posture, hands folded low at the waist. Full-length standing
      portrait. Her gown reads as a tall stemmed shape: a wide bell of skirt
      narrowing to a slim fitted bodice and high collar, the whole figure an
      elegant narrow vertical.
    culture_aesthetic: >-
      Thari high nobility — a floor-length matte gown of muted grey-green,
      hand-worked brocade with no sheen, high boned collar, long close
      sleeves. Her one reserved accent: a fine line of cold viridian-green
      piping at the collar and cuffs, the only saturated colour on her.
    element_visual: >-
      A small enamelled vial-shaped pendant on a thin chain at her throat,
      its bulb a faintly luminous green.

  # ── HOOK NPCs — bridged the Jailbreak to its Season-2 branches ─────────

  # Vault id: barial_fen. CANON: Church of Recreation contact; vault tag
  # "Hassam" (a system, not a feature). Draft below.
  - name: Barial Fen
    role: Church of Recreation contact
    type: npc_supporting
    appearance: >-
      A lean adult man of middle years, shaven skull, long narrow face,
      hollow cheeks, deep-set eyes under a strong brow, weathered light
      skin. Tall and very thin. He stands straight with his head slightly
      bowed, hands tucked into opposite sleeves. Full-length standing
      portrait. His robe falls in one straight unbroken line from collar to
      floor, a tall narrow vertical figure.
    culture_aesthetic: >-
      Church of Recreation monastic order — a plain coarse cassock in
      dust-grey and ash, deliberately poor, belted with rope, the cloth
      worn thin. His one reserved accent: a single small pretech device worn
      as a pendant icon at the chest, glowing a faint warm amber-gold, the
      only warm light on him.

  # Vault id: eritrea_velmar. CANON: name + branch (vault tag "Halgerd")
  # only — role and faction unrecorded. Thari-pattern name (House Velmar)
  # is the ONLY lean here; everything else is draft.
  - name: Eritrea Velmar
    role: Halgerd-system contact (faction unrecorded — GM draft)
    type: npc_supporting
    culture: thari
    appearance: >-
      A watchful adult woman of indeterminate middle age, sharp features,
      weathered light skin, dark hair cropped short. Lean and upright.
      Three-quarter standing pose, body turned away and head turned back
      over one shoulder toward the viewer, weight shifted to one foot as if
      mid-stride. Full-length standing portrait. Her layered coat falls open
      and asymmetric, swept to one side, giving a single off-balance
      diagonal shape.
    culture_aesthetic: >-
      A hard-used spacer's coat over practical layers, muted slate and
      grey-blue, scuffed and patched. Her one reserved accent: a small worn
      enamel token on a cord at the collar, faded crimson, half-tucked into
      the coat.

  # Vault id: felra_amberton. CANON: name + branch (vault tag "Victory")
  # only. Non-Thari name; no culture assigned rather than fabricate one.
  - name: Felra Amberton
    role: Victory-system contact (faction unrecorded — GM draft)
    type: npc_supporting
    appearance: >-
      A quick, sharp-eyed adult, compact build, close-curled dark hair, an
      easy half-smile, brown skin. Full-length standing portrait, leaning
      slightly forward with weight on the front foot, one hand raised
      open-palmed mid-gesture and the other loose at the side. Arms held
      away from the body in an open, animated stance.
    culture_aesthetic: >-
      A lane broker's layered traveller's clothes — soft desaturated green
      and grey, well-worn jacket over a light shirt, practical and
      unmatched. The one reserved accent: a single iridescent strip sewn
      along the collar, glinting a cool electric teal, the one bright thing
      on the outfit.

  # ══════════════════════════════════════════════════════════════════════
  # PLAYER-PICKER FACE OPTIONS — character-creation portraits
  # ══════════════════════════════════════════════════════════════════════
  # Head-and-shoulders face options offered at character creation, covering
  # the world's three cultures (thari / yulan / spacer) with M/F balance.
  # Mirrors the seaboard_of_saints pilot. Each entry carries a
  # `backdrop_poi` naming a real rendered POI slug (assets/poi/*.png on R2);
  # the daemon plants the head-and-shoulders subject against that backdrop.
  #
  # appearance is PHYSICAL ONLY — face and upper body, collar-level attire,
  # no background prose (backdrop comes from backdrop_poi). Written
  # shape-forward to match this world's painterly book-cover idiom: strong
  # readable silhouette, muted slate / grey-blue / soft-green palette, ONE
  # reserved saturated accent per figure. Montage-safe, single subject.
  # `culture` = culture filename stem; `archetype` = real archetype name
  # from this world's archetypes.yaml. 9M / 9F across the three cultures.
  # GM draft, same waiver as the canon block above — Jade may overwrite.
  # ══════════════════════════════════════════════════════════════════════

  # ── Picker · Thari ─────────────────────────────────────────────────────

  - id: picker_thari_naval_officer_m01
    name: picker thari naval officer m01
    role: Thari Naval Officer
    type: player_picker
    culture: thari
    archetype: Thari Naval Officer
    sex: male
    backdrop_poi: regency_court_thar
    appearance: >-
      A trim adult man in his forties, long pale fine-boned face, straight
      nose, a level mouth set in habitual correctness. Dark hair clipped
      short and combed flat, greying at the temples, grey eyes that grade
      you by station. Square shoulders carrying a high stiff naval collar
      that reads as a hard horizontal bar across the throat. His one accent:
      a thin oxblood-crimson piping at the collar edge, the only saturated
      colour on him.

  - id: picker_thari_naval_officer_f01
    name: picker thari naval officer f01
    role: Thari Naval Officer
    type: player_picker
    culture: thari
    archetype: Thari Naval Officer
    sex: female
    backdrop_poi: regency_court_thar
    appearance: >-
      A composed adult woman in her thirties, oval brown face, strong level
      brows, dark eyes steady and unhurried. Black hair drawn back severe
      into a tight flat coil clear of the face. Upright neck rising from the
      hard standing collar of a slate greatcoat, the silhouette a clean tall
      column from jaw to shoulder. Her one accent: a single crimson rank-sash
      crossing one shoulder, the only saturated colour on her.

  - id: picker_thari_shield_tech_m01
