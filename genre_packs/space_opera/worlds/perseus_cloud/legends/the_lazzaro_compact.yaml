name: The Lazzaro Compact
era: settlement
summary: >-
  In the thirty-first year after the GHE, the bubble shield over Settlement
  Four on Lazzaro failed for six hours during a corrupted Dust vent. Forty-three
  workers were in the field. Seventeen died. Fourteen of those came back. The
  settlement's three surviving medical staff — Renn Okada, a Church field
  deacon named Sura, and a Regency supply officer named Caer Mossbridge who
  was technically on Lazzaro to do inventory — spent four days in the one
  undamaged dome deciding what Lazarites were. The two positions were these:
  they were people, damaged but recoverable; or they were no longer people,
  and prolonging their condition without consent was cruelty. The Compact they
  agreed to is a procedural document, not a moral one. It specifies: any
  Lazarite able to communicate by any means within thirty days of rising shall
  receive care, Dust-purge if available, and a second assessment at ninety
  days. Any Lazarite unable to communicate at all shall be put down humanely,
  on the grounds that to do otherwise is not mercy. The document was signed
  by all present, filed with no governing authority, and adopted by every
  Dust settlement on Lazzaro within two years because it was the only thing
  that worked. The Regency has never formally recognized it. The Church has
  issued three different doctrinal positions on it in the intervening decades,
  none of which have changed what the settlements actually do. Renn Okada's
  name is on the original. Okada's descendants are still on Lazzaro.
cultural_impact: >-
  Among settlers, scrappers, and anyone who works near Lazarus-Dust
  extraction, "the Compact" has become shorthand for the hard agreement
  everyone made because the alternative was worse. It is cited by analogy
  in arguments entirely unrelated to the dead — crew contracts, faction
  negotiations, trade disputes where both sides have already lost something
  and are trying to decide what to do next. The phrase "compact conditions"
  means a situation where you are out of good options and are choosing the
  least bad one with full awareness of what you are choosing. Yulan scrappers
  use it differently from Spacer crews; both use it differently from anyone
  who actually works the Dust fields. But everyone knows what it means.
affected_cultures:
  - Yulan
  - Spacer
terrain_scars:
  - type: monument
    name: Settlement Four Common Hall
    region: lazzaro
    description: >-
      The oldest surviving structure in Settlement Four — low-ceilinged,
      dome-patched, the original bubble-shield material still visible in
      the north wall where a repair ran short of new paneling. The Compact
      document is behind glass on that wall, in Okada's handwriting with
      Sura's and Mossbridge's signatures beneath. The glass is not
      bulletproof. There are no guards. It has never been vandalized. New
      workers are not formally required to read it, but they do.
  - type: memorial
    name: The Thirty-Day Wall
    region: lazzaro
    description: >-
      A section of outer shield wall at Settlement Four, south face, covered
      in names painted in maintenance marking compound — the white industrial
      paint used for equipment labeling, chosen because it was what they had.
      A name for every Lazarite who was given the thirty days and did not
      communicate in time. Also a name for every one who did. The two lists
      are not distinguished. You cannot tell from the wall alone which
      outcome any given name reached. This was not an accident.
