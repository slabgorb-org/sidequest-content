name: The Coelitha Survey
era: early reconstruction
summary: >-
  Twenty-two years after the GHE, the Church of Recreation sent its first
  major expedition to Coelitha — the old Praetorium seat, buried under Dust
  and derelict hulls. The expedition manifest records thirty-two surveyors,
  twelve Shieldbreakers, and a Vault Assessor whose name appears in the
  Church's own register as "Redacted per the Convocation." Nineteen returned.
  Of the fourteen debriefings filed, nine are listed as "incomplete," three
  as "sealed," and two as "destroyed in transit." The Regency of Thar, which
  holds nominal sovereignty over Coelitha, formally petitioned for copies and
  received a document of four hundred pages, three hundred and eighty of which
  are blank. What is not disputed: two months after the expedition returned to
  Scrina, the Vaults gained a new wing. The door used to seal it was not the
  same type used elsewhere in the complex. It was manufactured before the GHE.
  The Vault Assessor whose name was redacted never filed another commission
  with the Church. Whether they are dead, renamed, or simply done is
  not recorded.
cultural_impact: >-
  Both the Regency and the Church cite the Coelitha Survey in arguments about
  institutional trust, and both use the same facts to reach opposite
  conclusions. The Regency invokes it to prove the Church operates outside any
  authority but its own. Church adherents invoke it to argue that any governing
  body — including the Regency — would suppress what was found given the
  chance. Neither position is wrong. The Survey is also used as a byword among
  working spacers and scrappers for official investigations that come back with
  more questions than they started with: "another Coelitha," meaning the
  answers are somewhere in that sealed wing and nobody's getting in.
affected_cultures:
  - Thari
  - Spacer
terrain_scars:
  - type: sealed_vault
    name: The Convocation Annex
    region: scrina
    description: >-
      The addition to the Scrina Vaults constructed in the two months after
      the expedition returned. Distinguished from the original vault
      construction by the door: a Praetorium-era sealed alloy hatch of a
      type not manufactured anywhere in the Cloud, salvaged from Coelitha and
      installed by Church engineers who reportedly refused to speculate about
      its original purpose. The rest of the wing uses standard post-GHE
      construction. Church doctrine holds that the Vault Assessor chose the
      door. Church doctrine does not explain why the Vault Assessor's name
      was subsequently redacted.
  - type: ruin
    name: The Debriefing House Foundation
    region: coelitha
    description: >-
      The stone foundation of a temporary structure built at the expedition's
      base camp in the Coelitha ruins — a single-room construction, quick
      work, raised for the debriefings and burned before the expedition
      departed. The surveyors put it to the fire themselves. No order to do
      so appears in any document. The foundation stones remain, and the
      surrounding debris has been cleared by Church expeditions since — not
      as an act of preservation, but because the area is a logistics staging
      point for current-era recovery operations. Nobody asks about the burned
      building. Everybody who works the Coelitha ruins knows which foundation
      it is.
