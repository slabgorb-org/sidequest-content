name: The Last Lane
era: the collapse
summary: >-
  The last successful outbound jump from the Perseus Cloud was made by a
  cargo pilot named Sera Vaino, eleven hours before the Great Hyperspace
  Explosion sealed the lanes. She was three days out from Glitter, hold
  full of refined Scrina components bound for a hub world whose name nobody
  in the Cloud remembers anymore. She made the jump. She got through. The
  ship she was meeting on the other side — the Kōura, registry YG-112,
  carrying replacement filtration parts for the Lazzaro bubble shields —
  was supposed to follow her out two days later. When Vaino tried to jump
  back to collect it, the lane was gone. The Kōura is still listed in the
  Port Authority register at Glitter as "awaiting transit clearance." Vaino
  spent the rest of her career flying the lanes the GHE left — shorter
  runs, inner systems, nothing that went anywhere new. She died on a supply
  run to Occum at the age of seventy-one. She never talked about it. The
  register entry is still open because nobody has the authority to close it
  and nobody has tried.
cultural_impact: >-
  Spacers maintain a tradition of checking the Port Authority's legacy
  register before a long run — not out of superstition, but out of the
  conviction that unfinished crossings should be noted. The Kōura's entry,
  filed in the Praetorium era's own notation, is still there. The ritual
  of checking it is called "reading the wall." New Spacers learn it as
  occupational habit; older ones will tell you it's the only honest account
  of what the GHE actually cost that anybody has bothered to maintain.
affected_cultures:
  - Spacer
terrain_scars:
  - type: monument
    name: The Kōura Berth
    region: yula
    description: >-
      The specific docking arm at Glitter where the Kōura was scheduled to
      berth — long since occupied by a hundred other ships, the original
      hardware replaced twice over. A brass plate marked with the Kōura's
      registry number and berth assignment is bolted to the support strut,
      put there by dock workers whose names are not recorded. Spacers touch
      it before long runs. They will tell you they don't know why they do it.
  - type: archive
    name: The Port Authority Legacy Register
    region: yula
    description: >-
      The Praetorium-era transit ledger maintained in the Port Authority's
      sub-basement at Glitter — analog, hand-updated, cross-referenced to
      the digital system but never fully superseded by it. The Kōura's
      entry takes up six lines: registry number, cargo manifest, expected
      berth, pilot of record, scheduled arrival window, status. The status
      field reads, in the original clerk's hand: awaiting transit clearance.
      There are eight other entries in the same register with the same
      status. The Kōura's is not the oldest.
