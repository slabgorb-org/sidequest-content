# Perseus Cloud — world maturity chapters (ADR-022).
#
# These chapters describe how the SECTOR reveals itself as a campaign
# matures — living-world texture, not Jade & Sebastien's specific plot.
# The Season 1 campaign chronology (The Jailbreak, The Princess and the
# Poisoner, the Haven Propaganda Crisis) is their canon and lives in
# CAMPAIGN_NOTES.md, flagged [STUB], rather than being fabricated here.
#
# points_of_interest double as location entities; each `region` must
# match a cartography.yaml region id.

chapters:
  - id: fresh
    label: "The Churnworld"
    session_range: [1, 5]
    description: >-
      The Cloud opens where the credits move: Yula. New arrivals learn
      the sector's first lesson in the neon canyons of New Kowloon — that
      after the Great Hyperspace Explosion sealed the lanes, the galaxy
      stopped being a destination and Dust, scrap, and pretech became the
      only currencies that matter. Early work is corporate-adjacent and
      grubby: a courier run for the Yulan Broadcast Company, a salvage
      contract into the scrap seas off Santa Abraham, a docking dispute
      on Glitter. The Regency is a distant feudal rumor; the Church of
      Recreation is a recruiting poster; the word "Praetorium" is
      something the old timers say with their hats off.
    events: []
    points_of_interest:
      - name: New Kowloon
        slug: new_kowloon
        region: yula
        type: city
        description: >-
          The largest and most developed city on Yula and the center of
          corporate power — a vertical city of neon lights, skyscrapers,
          and towering superblock constructions. Almost all the sector's
          major industrial manufacturers are officially headquartered
          here, in gleaming towers; the city's population rivals entire
          other planets. It was here that the Season 1 party delivered a
          block of Dust to the Church of Recreation, setting the dominos
          in motion.
        visual_prompt:
          solo: >-
            Wide establishing view of a dense vertical megacity at night
            in the rain. Foreground: the edge of a wet elevated walkway,
            bold dark tower silhouettes rising in stacked superblock
            tiers, a single tall spire anchoring the left. Middle ground:
            a deep canyon of skyscrapers receding into haze, scattered
            signage and window lights reading as restrained warm-amber
            and cyan accent glows against the muted grey-blue dark, an
            elevated transit line curving between buildings. Background:
            the upper towers dissolving into low rain-cloud, faint
            corporate-block shapes fading to atmosphere. Overcast wet
            night, soft reflected glow on slick surfaces, hazy depth.
      - name: Santa Abraham
        slug: santa_abraham
        region: yula
        type: slum
        description: >-
          Yula's ghetto, where the poor and wretched mount expeditions
          into the scrapyards to retrieve valuable materials. New Kowloon
          and the corpos are incentivized to keep Santa Abraham poor, so
          its inhabitants keep chasing a life of glory by finding a lucky
          pretech artifact in the junk seas. Most do not.
        visual_prompt:
          solo: >-
            Wide establishing view of a shantytown clinging to the edge of
            a vast scrapyard sea. Foreground: bold silhouettes of stacked
            salvage-shacks and improvised rigs built from cannibalized hull
            plating, a ragged figure or two dragging a sled toward the
            wreck-line. Middle ground: dunes of crushed machinery and dead
            ships stretching to the horizon, a single lifting-crane shape
            rising over the junk, a reserved warm-amber work-fire glow as
            the only saturated accent. Background: the cold distant towers
            of a corporate megacity faint on the skyline, unreachable, fading
            into grey haze. Flat overcast daylight, muted rust-and-slate
            palette, hazy depth, a worn and weary stillness.
      - name: Glitter
        slug: glitter
        region: yula
        type: orbital_city
        description: >-
          The massive orbital city circling Yula, with a significant
          permanent Spacer population. Cargo travels from New Kowloon up
          the Tether elevator and out from Glitter to trading partners
          across the sector. Culturally, Glitter is a bridge between
          Yula's cutthroat corporate politics and the rest of the Cloud.
        visual_prompt:
          solo: >-
            Wide establishing view of a great orbital ring-city hanging in
            space above a planet. Foreground: the bold curved silhouette of
            the station's outer ring and a cluster of geometric docking arms,
            a small cargo lighter drifting in to berth. Middle ground: the
            slender thread of a space-elevator tether dropping away from the
            ring toward the planet far below, freight pods strung along it,
            scattered window-lights reading as a reserved warm accent against
            the dark structure. Background: the muted blue-grey curve of the
            planet Yula filling the lower frame, its thin atmosphere catching
            faint light, the black of space and soft starfield above. Cool
            even light, desaturated steel-and-slate palette, hazy
            atmospheric depth, calm and vast.

  - id: early
    label: "Crown and Vault"
    session_range: [6, 12]
    description: >-
      The sector's two great institutions come into focus. The Regency
      of Thar reveals itself as a feudal order rebuilt from the rubble of
      the Praetorium — stone keeps, an old-blooded navy, and a regressive
      certainty that frustrates anyone who came up in Yula's churn. The
      Church of Recreation reveals its hunger: pretech is sacred, its
      recovery a holy work, and its militant expeditions will go where
      they please. Players who follow the work far enough start meeting
      the people who run these powers, and learn that "peace" in the
      Cloud means whichever faction is currently winning.
    events: []
    points_of_interest:
      - name: The Regency Court at Thar
        slug: regency_court_thar
        region: thar
        type: court
        description: >-
          The court of the Regency of Thar, seated among old stone keeps
          on a temperate world. Here the Regency's regressive cultural
          force is law, hierarchy is destiny, and the navy that patrols
          the inner worlds takes its orders. Admiral Aliya Dad is among
          the figures whose conservatism shapes the administration.
        visual_prompt:
          solo: >-
            Wide establishing view of a fortified stone court-keep on a
            temperate world. Foreground: the bold geometric silhouette of an
            austere stone gatehouse and curtain wall, banners hanging
            heavy and still, a formal processional stair climbing toward it.
            Middle ground: clustered keeps and towers of pale weathered
            stone laid out in strict hierarchical symmetry, a single warm-lit
            high window as a reserved accent, ranked figures small on the
            steps. Background: low green hills under a wide pale sky, and
            high above, the faint hard silhouettes of naval warships holding
            station in formation. Cool overcast daylight, muted stone-grey
            and soft-green palette, hazy depth, a heavy ceremonial stillness.
      - name: The Scrina Vaults
        slug: scrina_vaults
        region: scrina
        type: pretech_vault
        description: >-
          The pretech vaults of rain-soaked Scrina — the Church of
          Recreation's reserve of pre-GHE technology, and the reason it
          can arm expeditions across the sector. The vaults are
          guarded as relics and worked as armories.
        visual_prompt:
          solo: >-
            Wide establishing view of a rain-soaked vault complex carved into
            a dark hillside. Foreground: the bold silhouette of a massive
            circular blast-door set in wet stone, heavy and sealed, runoff
            sheeting down its face, two hooded guard-figures flanking it.
            Middle ground: a descending ramp slick with rain leading to the
            vault mouth, stacked relic-crates and a single processing rig,
            a reserved cyan-white glow leaking from the seam of the door as
            the only saturated accent. Background: low industrial sheds and
            a rain-grey sky over dripping crags, everything dissolving into
            wet haze. Diffuse stormlight, muted slate-and-charcoal palette,
            soft atmospheric edges, a watchful damp stillness.

  - id: mid
    label: "The Dust and the Drowned"
    session_range: [13, 20]
    description: >-
      The sector's older wounds open. On Lazzaro, the only world where
      Lazarus Dust can still be collected at medical grade, corruption
      seeps past the bubble shields and the recently dead do not always
      stay dead. On Coelitha, the buried Praetorium seat gives up its
      derelicts and its treasures in equal, lethal measure. On Occum, the
      drowned cities run an economy the Regency cannot fully see. Players
      who reach this tier are no longer doing courier work — they are
      arbitrating between powers, and discovering how much of the Cloud
      runs on Dust that was never meant to leave its factory.
    events: []
    points_of_interest:
      - name: The Lazzaro Dust Settlements
        slug: lazzaro_dust_settlements
        region: lazzaro
        type: industrial_settlement
        description: >-
          The bubble-shielded settlements that collect medical-grade
          Lazarus Dust from the planet's still-functional, partially
          uncorrupted factories. The shields are robust because they
          have to be: in large quantities, corrupted Lazarus Dust raises
          Lazarites from recently deceased tissue, and the dead of
          Lazzaro do not always rest.
        visual_prompt:
          solo: >-
            Wide establishing view of an industrial settlement under an
            enormous transparent dome-shield on a barren dust plain.
            Foreground: heavy sealed collection machinery and pipe-banks
            silhouetted against the dome wall, a sloping ramp of fine
            pale dust drifting against the base. Middle ground: low
            blocky factory structures and storage tanks inside the dome,
            a single processing tower, faint warm interior work-lights as
            a reserved accent. Background: beyond the curved dome glass,
            a hazy ochre-grey dust sky and the dim shapes of older
            collapsed structures half-buried in dunes. Diffuse flat
            daylight through dust haze, muted desaturated palette, an
            uneasy still atmosphere.
      - name: The Coelitha Derelicts
        slug: coelitha_derelicts
        region: coelitha
        type: ruin_field
        description: >-
          The Dust-drowned wreck-fields of Coelitha, the old Praetorium
          seat from before the Scream. Pretech treasures lie beneath the
          sands, guarded by Death, Derelicts, and the corrupting Dust
          that buried them. The Regency claims the world; nobody fully
          controls it.
        visual_prompt:
          solo: >-
            Wide desolate landscape of a dust-drowned ruin field at dusk.
            Foreground: the canted hull of a vast half-buried derelict
            ship rising from fine grey dust dunes, its bold broken
            silhouette dominating the frame, scattered wreckage in the
            sand. Middle ground: the skeletal remains of an ancient
            domed administrative complex, columns and arches eroded to
            stark shapes, a thin haze of drifting Dust catching the low
            light. Background: more derelict hulls as faint silhouettes
            on the horizon under a vast muted sky, a single pale sun low
            and dim. Desaturated grey-and-bone palette, soft atmospheric
            haze, one faint cold blue glow deep in the wreck as a
            reserved accent, profound stillness.
      - name: The Occum Bubble Cities
        slug: occum_bubble_cities
        region: occum
        type: undersea_city
        description: >-
          The underwater bubble cities of Occum, sheltered from an
          invasive acidic atmosphere and fed by a vast solar ecology.
          Reached by an amphibious orbit-to-submarine shuttle system,
          the cities are rich, populous, and culturally distinct from
          the stone-bound Regency that nominally rules them.
        visual_prompt:
          solo: >-
            Wide underwater view of a submerged city deep beneath an
            ocean surface. Foreground: clustered transparent spherical
            habitat domes rising from a dark seabed, linked by curved
            tube-corridors, faint interior light glowing through the
            glass. Middle ground: taller dome-towers and a long curved
            transit causeway, a small submersible drifting between them,
            suspended particulate hanging in the water. Background: the
            distant ocean surface far overhead catching pale filtered
            light, faint silhouettes of orbital-anchor cables descending
            into the deep, hazy water fading to dark. Soft volumetric
            god-rays from above, cool dim ambient light, a few warm
            window-glows as a reserved accent.

  - id: veteran
    label: "The Edge of the Cloud"
    session_range: [21, 99]
    description: >-
      At the sector's edge, the Cloud stops being merely post-apocalyptic
      and becomes strange. Terma drifts half-embedded in hyperspace, and
      the psychics and Shadows that gather there speak of the Great
      Hyperspace Explosion as if it were still happening. Ceron orbits a
      black hole beyond any public lane, selling immortality to the
      ultra-wealthy with Lazarus Dust and worse. Veteran players who come
      this far are no longer asking who controls the sector — they are
      asking what the GHE actually was, and whether the galaxy on the
      other side of the severed lanes is still there at all.
    events: []
    points_of_interest:
      - name: Terma, the Drifting World
        slug: terma_drifting_world
        region: terma
        type: anomaly
        description: >-
          A rogue planet half-embedded in Hyperspace, drifting through
          the south-western Cloud since before it was part of the sector.
          Its overexposure to GHE energies and ongoing Hyperspace
          fluctuations make Psychics and Shadows extraordinarily
          prominent — the closest thing the Cloud has to a place where
          the Explosion never stopped.
        visual_prompt:
          solo: >-
            Wide unsettling view of a rogue planet adrift in deep space,
            half-dissolving into hyperspace. Foreground: the dark curved
            limb of a starless rogue world, its surface broken into bold
            geometric shapes that fray at the edges into drifting
            fragments and long shadow-streaks. Middle ground: the
            boundary where solid terrain gives way to a rippling
            translucent distortion, faint figure-like Shadow silhouettes
            suspended in the warp, fractured reflections. Background: a
            void with no stars, a sickly aurora of cold violet light
            bleeding through the tear as a reserved accent, the suggestion
            of impossible depth. Muted desaturated palette, soft
            atmospheric haze, eerie dreamlike stillness, surreal.
      - name: Ceron Station
        slug: ceron_station
        region: ceron
        type: black_station
        description: >-
          A lawless station orbiting a black hole, reachable by no public
          lane and under no legal jurisdiction. Gambling, drug and organ
          trade, and experimental medicine — Lazarus-Dust revivification,
          immortality treatments — are all common among the ultra-wealthy
          and well connected who frequent it.
        visual_prompt:
          solo: >-
            Wide ominous view of a lone station silhouetted against a black
            hole. Foreground: the bold dark shape of a decadent ring-and-spire
            station, asymmetric and over-built, a single docked yacht clinging
            to its flank, warm-amber window-light bleeding from its lounges as
            a reserved accent. Middle ground: the station rim catching a thin
            hard edge of light, a faint disc of infalling matter curving
            behind it. Background: the great void-black sphere of the black
            hole, its accretion disk a muted bent ring of dim orange,
            gravitational lensing arcing the few stars into smeared curves
            around the dark. Cold directionless light, deeply muted palette
            with one reserved warm glow, soft atmospheric haze, a luxurious
            and predatory stillness.
