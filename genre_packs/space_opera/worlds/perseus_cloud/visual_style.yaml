# Perseus Cloud visual style — DRAFT for Jade to own.
#
# Direction (from Jade): "emphasis on shape," anchored on mid-century
# modern / Bauhaus SHAPE language, but rendered in a painterly,
# atmospheric science-fiction BOOK-COVER idiom (reference touchstone:
# the kind of muted-with-accent-pops cover painting where bold ship
# and station silhouettes read as shapes against hazy, desaturated
# space). Two refinements from the first pass:
#   - DROPPED "bright / high-chroma / vivid" — it veered comic-book.
#     Palette is now MUTED and atmospheric with one or two RESERVED
#     saturated accent colors as focal pops (the same reserved-accent
#     discipline coyote_star uses; see PROMPTING_Z_IMAGE.md).
#   - LOOSER: loose visible brushwork and soft atmospheric edges rather
#     than clean screen-print blocking.
# Shape stays the spine; the render is softened and watered down.
# Anchored on movements/idioms, not named artists, per the table's
# preference.
#
# Per PROMPTING_Z_IMAGE.md: positive_suffix carries STYLE/PALETTE/SHAPE
# vocabulary ONLY. No concrete scene nouns (those bleed onto every
# render — a head-and-shoulders portrait would get a churnworld skyline
# behind it). Concrete staging belongs in visual_tag_overrides or
# per-POI element_visual.

positive_suffix: >-
  Painterly science-fiction book-cover illustration with bold,
  simplified shape language — composition built from confident
  geometric forms and strong silhouettes, clear figure-ground
  separation, asymmetric balanced layout, generous negative space.
  Muted atmospheric palette of desaturated slate, grey-blue, and soft
  green, with one or two reserved saturated color accents used as focal
  pops and never filling the frame. Loose visible brushwork, soft
  atmospheric edges, hazy depth, gentle volumetric light, smooth
  painterly rendering favored over fine surface detail. Restrained
  mid-century-modern shape sensibility. No text, no caption, no title,
  no writing, no signature, no labels, no watermark, no border, no
  frame.

preferred_model: dev

base_seed: 42
