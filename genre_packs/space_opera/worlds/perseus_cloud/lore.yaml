world_name: Perseus Cloud
setting_anchor: >-
  A sector cut off from the galaxy by the Great Hyperspace Explosion.
  Five powers fight over the bones of the Persean Praetorium — for
  pretech, for Dust, for control. The jump lanes out are gone. Whatever
  the rest of human space became, the Perseus Cloud will never know.
history: >-
  The planets of the Perseus Cloud were once the Persean Praetorium —
  an administrative division of a far larger human civilization, with
  the Praetorium itself serving as a regional capital. In that age,
  exceedingly advanced Pretech was widely available and the Psychic
  disciplines flourished. Then came the Great Hyperspace Explosion —
  the GHE — and the lanes that bound the Cloud to the rest of the
  galaxy were severed. The Cloud was cut off. Most of the knowledge,
  governance, and continuity of Praetorium society was lost in the
  collapse that followed.

  Centuries on, the sector has reorganized around what survived. The
  Regency of Thar rebuilt a feudal order from the post-GHE ruins,
  governing from stone-built Thar and holding the old Praetorium seat
  of Coelitha, the Lazarus-Dust world of Lazzaro, and the ocean world
  of Occum. The Church of Recreation rose to recover what the GHE took:
  it seeks to restore the technological prowess of the Praetorium,
  hoarding pretech in vaults on Scrina and provisioning militant
  expeditions to recover artifacts from the dead worlds. On Yula, a
  churnworld that was once the Praetorium's interstellar junkyard, the
  corporations turned scrap into a hypercapitalist power. And out at
  the edges — the rogue world of Terma, half-embedded in hyperspace,
  where psychics and Shadows run thick; the lawless black-hole station
  of Ceron — the sector's older, stranger forces keep their own
  counsel.

  Five factions now battle for resources, peace, and control. Recent
  history turns on the Season 1 campaign: the delivery of a block of
  Dust to the Church of Recreation in New Kowloon set in motion the
  events that led to the Haven Propaganda Crisis. [STUB — the full
  campaign chronology is Jade & Sebastien's canon; see CAMPAIGN_NOTES.md.]
factions:
  # The five contesting powers named in the Perseus Cloud sector canon.
  - name: Regency of Thar
    summary: "The feudal post-GHE order that rebuilt from the ruins of the Praetorium"
    description: >-
      The feudal power that reconstituted human governance after the
      Great Hyperspace Explosion. The Regency rules from Thar — a
      temperate world of mostly old stone architecture, castles raised
      in the immediate post-GHE era — and holds the old Praetorium seat
      of Coelitha, the Lazarus-Dust world of Lazzaro, and the rich
      ocean world of Occum. Its navy and administration exert a strongly
      regressive cultural force; Admiral Aliya Dad is among the figures
      who embody that conservatism. [Vault canon thin beyond this — much
      of the Regency's internal politics is Jade's to author.]
    disposition: regressive
  - name: Church of Recreation
    summary: "Militant religious order seeking to recover the Praetorium's lost pretech"
    description: >-
      A major religious organization that seeks to recover the
      technological prowess of the Persean Praetorium. It maintains huge
      vaults of pretech on Scrina and provisions militant groups to
      expedition into the sector and recover additional artifacts from
      before the GHE. It also holds Regula and Zira. The Church's reach
      is defined by its appetite for the lost technology of the dead
      civilization it venerates.
    disposition: zealous
  - name: Southeastern Confederacy
    summary: "[STUB — Jade to author; no namesake world in the export]"
    description: >-
      [STUB — one of the five contesting powers of the Perseus Cloud. No
      namesake system appears in the SWN export, so even the seat is
      unknown to the import. Identity, holdings, and disposition are
      Jade's canon to author.]
    disposition: neutral
  - name: Nimian Authority
    summary: "Regional sea-power seated at the ocean world Nimia [doctrine STUB — Jade to author]"
    description: >-
      Seated at the ocean world Nimia. Per the SWN export, Nimia is a
      TL4 oceanic world of hundreds of millions tagged Regional Hegemon
      and Seagoing Cities — a regional sea-power and rising hegemon by
      its world profile. [STUB — the Authority's actual goals, reach,
      and disposition toward the other powers are Jade's canon to
      author; only the seat-world's export tags are imported here.]
    disposition: neutral
  - name: House Akkad
    summary: "Noble house seated at Akkad; seat-world tagged Cultural Power / Eugenic Cult [doctrine STUB]"
    description: >-
      Seated at the world Akkad. Per the SWN export, Akkad is a TL4
      world of hundreds of millions tagged Cultural Power, Eugenic Cult,
      and Sectarians — a profile strongly suggestive of a house defined
      by bloodline doctrine and cultural reach. [STUB — the House's
      actual goals, holdings, and disposition are Jade's canon to
      author; only the seat-world's export tags are imported here.]
    disposition: neutral
  # A distinct corporate power — ruler of the churnworld Yula, not one of
  # the five "faction" houses but a major force in sector affairs.
  - name: Yulan Governance Conglomerate
    summary: "The corporate conglomerate that rules the hypercapitalist churnworld of Yula"
    description: >-
      A united-nations of powerful corporate entities that governs Yula,
      essentially a corporate ruling class with its own funded security
      and defense force enforcing rules for the benefit of the corpos.
      The Conglomerate is headquartered in New Kowloon's neon towers and
      profits from the deliberate poverty of Santa Abraham, whose
      desperate scrappers it pushes into the junk seas in search of a
      lucky pretech find. The Yulan Broadcast Company moves Dust and
      information for it.
    disposition: mercantile
cosmology: >-
  The defining article of belief in the Perseus Cloud is the
  Praetorium — the lost golden age before the Great Hyperspace
  Explosion, when pretech was everywhere and the Cloud was bound to a
  galaxy it can no longer reach. The Church of Recreation makes that
  belief into doctrine: the Praetorium's technology was sacred, its
  loss a fall, and its recovery a holy work. Psychics, a Praetorium
  legacy discipline, persist and are warped by proximity to hyperspace,
  most intensely on Terma where Shadows gather. The Regency of Thar
  answers the collapse with order, hierarchy, and the regressive
  certainties of stone and bloodline. Yula answers it with profit.
  Below all of it runs Dust — the substance the dead civilization left
  behind, which heals, raises the dead, and corrupts, depending on the
  vein.
geography: >-
  The Perseus Cloud is a sector of human-settled systems, mapped in the
  vault as a Sectors Without Number sector. The Regency of Thar holds
  the populous inner worlds: stone-built Thar (its capital), the
  derelict-strewn old Praetorium seat of Coelitha, the bubble-shielded
  Lazarus-Dust world of Lazzaro, and the rich ocean world of Occum with
  its underwater bubble cities and orbital anchorages. The Church of
  Recreation holds the pretech-vault world of Scrina and the systems of
  Regula and Zira. Yula, an arid churnworld of scrap-lands and neon
  superblocks, anchors the sector's corporate power, with its great city
  New Kowloon, its slum Santa Abraham, the orbital city of Glitter, and
  the space-elevator hub of Tether. Out past the settled worlds lie the
  stranger places: Terma, a rogue planet drifting half-embedded in
  hyperspace where psychics and Shadows run thick, and Ceron, a secretive
  lawless station orbiting a black hole, reachable by no public lane.
