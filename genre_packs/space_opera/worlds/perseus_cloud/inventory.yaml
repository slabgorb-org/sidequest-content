# perseus_cloud — world-tier inventory override (ADR-145 D3, story 114-7)
#
# The shared SWN standard gear lives in the genre baseline
# (genre_packs/space_opera/inventory.yaml) and is inherited via the resolver's
# union-by-id merge. This file ships ONLY:
#   - currency / starting_equipment / starting_gold / philosophy (world-owned;
#     the resolver takes these from the world wholesale), and
#   - world-DISTINCT bespoke gear unique to the perseus_cloud nebula (no SWN SRD
#     analog → mode=bespoke, a world-tier privilege per ADR-145 D3).

currency:
  name: credits
  denominations:
    - credits
    - kilocredits

item_catalog:
  # --- perseus_cloud world-distinct gear (bespoke, world-tier) ---------------

  - id: ion_compass
    name: Ion Compass
    description: >-
      A navigation instrument that reads the cloud's ionized currents instead
      of stars — useless anywhere the murk thins, indispensable inside it.
    category: tool
    value: 350
    weight: 1.0
    rarity: uncommon
    power_level: 1
    tags: [nebula, navigation, sensor]
    lore: >-
      Charts lie inside the Cloud; the ion drift does not. A pilot who trusts
      one over the other lives. The order matters.
    narrative_weight: 0.3
    provenance:
      mode: bespoke
      license: na

  - id: driftrunner_charm
    name: Driftrunner's Charm
    description: >-
      A cloud-runner's luck token — a fused knot of charged glass that hums when
      the ion storms turn. Worthless to assayers, priceless to the superstitious.
    category: treasure
    value: 50
    weight: 0.0
    rarity: common
    power_level: 0
    tags: [nebula, charm, social]
    lore: >-
      Every driftrunner has one and every driftrunner swears it works. The ones
      who lost theirs aren't around to argue.
    narrative_weight: 0.2
    provenance:
      mode: bespoke
      license: na

