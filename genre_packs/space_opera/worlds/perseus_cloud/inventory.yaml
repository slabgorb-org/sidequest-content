starting_gold:
  Officer: 800
  Operative: 600
  Pilot: 550
  Engineer: 400
  Medic: 500
  Smuggler: 700
  Diplomat: 900
  Soldier: 300

philosophy:
  carry_limit: 0
  restricted_categories: []
  progression_gates: {}
  notes: >-
    Inventory is not the point of space opera. The ship carries the heavy
    stuff. Personal gear is what's on your belt and in your bunk. In the
    Cloud, the instrument that finds your way home is the only thing you never lend out.
