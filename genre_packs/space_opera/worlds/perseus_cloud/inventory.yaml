    - datapad
    - flight_suit
    - stim_pack
  Medic:
    - medkit_field
    - medpatch
    - medpatch
    - datapad
    - flight_suit
  Smuggler:
    - blaster_sidearm
    - vibroknife
    - datapad
    - flight_suit
    - driftrunner_charm
  Diplomat:
    - datapad
    - flight_suit
    - medpatch
  Soldier:
