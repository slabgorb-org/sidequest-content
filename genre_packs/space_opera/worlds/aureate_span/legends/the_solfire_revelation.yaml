name: The Solfire Revelation
era: twelve years ago
summary: A Vaal-Kesh chemist named Kelossa of the Quiet Drop synthesized Solfire —
  a compound that allows human neurology to perceive stellar radiation as structured
  sound. Users describe hearing Solenne as a vast, slow melody with harmonics that
  suggest intentionality. The drug was immediately banned, then unbanned, then restricted
  to licensed salons, then sold openly on the Underspine. Kelossa disappeared. The
  formula persists. The uncomfortable question Solfire raises is whether the Crystalline
  Choir's claim about the star singing is literally true, and humans just couldn't
  hear it until a Vaal-Kesh showed them how.
cultural_impact: 'Solfire split opinion on the Span: the Imperatrix sees it as art
  (hearing the star die is beautiful), the Observatory sees it as data (the patterns
  users describe match their suppressed stellar decay models), and the Cinder Collective
  sees it as proof that the star is actively dying and nobody in charge cares.'
affected_cultures:
- Vaal-Kesh
- Span Aristocracy
- Cinder Collective
terrain_scars:
- type: cultural
  name: Solfire Salons
  region: the_promenade
  description: Licensed establishments where patrons inhale Solfire vapor and listen
    to the star. The decor is sparse — reclining couches, dim lighting, viewport windows
    — because the experience is the point. Regulars develop a haunted look and a tendency
    to hum in frequencies they can't explain.
- type: underground
  name: Kelossa's Lab
  region: underspine
  description: The abandoned Vaal-Kesh laboratory where Solfire was first synthesized.
    Officially sealed by the Imperatrix's order. Actually a Cinder Collective meeting
    point. The walls still shimmer with residual compound, and people who spend too
    long inside report hearing the star through the station's hull.
