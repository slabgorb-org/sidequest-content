name: The Imperatrix's Wound
era: three centuries ago
summary: 'Imperatrix Celestine I — the dynasty''s founder — was an arena champion
  before she was a ruler. The story goes that she fought a Makhani champion called
  the Calcifier in the Corona Arena and lost. She should have died. Instead, the Calcifier
  spared her and demanded a time-debt: one favor, to be collected when the star required
  it. Celestine agreed, seized the throne through a coup the following week, and the
  Makhani have held that debt for three hundred years. The current Imperatrix, Celestine
  VII, inherited it. The Calcifier — who may or may not be the same individual — has
  never collected. The debt is the reason the Imperatrix treats the Makhani as equals.
  It''s also the reason she can''t order them to do anything, even when the tethers
  start behaving strangely.'
cultural_impact: The uncollected debt is the foundation of Makhani-human relations
  on the Span. Every Imperatrix inherits it. Every Imperatrix fears the day it comes
  due.
affected_cultures:
- Span Aristocracy
- Makhani
terrain_scars:
- type: memorial
  name: The First Arena
  region: corona_arena
  description: A section of the Corona Arena floor that has never been resurfaced
    — the original tiles from the fight between Celestine I and the Calcifier, still
    bearing scorch marks from whatever the Calcifier used as a weapon. Champions touch
    the tiles before combat for luck. The Makhani touch them for a different reason
    they won't explain.
