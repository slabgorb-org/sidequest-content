name: The First Song
era: pre-station
summary: The Crystalline Choir claims they didn't arrive at the Aureate Span. They
  were called. Before the station existed, before humans reached this system, the
  Choir heard a frequency emanating from Solenne — a harmonic pattern too complex
  to be natural, too sustained to be accidental. They followed it across three jump
  lanes and found a dying star that was singing. The Choir built the Resonance Quarter
  to answer that song. They've been in conversation with the star for two centuries.
  They won't say what it's telling them, except that it's not dying — it's composing.
cultural_impact: The Choir's claim that the star is alive and communicating shapes
  their refusal to support evacuation. To them, leaving would be walking out of a
  concert before the finale.
affected_cultures:
- Crystalline Choir
- Makhani
terrain_scars:
- type: anomaly
  name: The Singing Frequency
  region: resonance_quarter
  description: A persistent harmonic emanating from Solenne that only Crystalline
    Choir members can perceive directly. Human instruments detect it as a regular
    pulse in the star's magnetosphere, but the pattern is too complex for stellar
    physics to explain. The Choir says it has been accelerating for decades, approaching
    something they call "resolution."
- type: architectural
  name: The Unfinished Spire
  region: resonance_quarter
  description: A crystalline structure growing from the Resonance Quarter's highest
    point, visibly incomplete, that the Choir has been singing into existence for
    forty years. It doesn't match any known architectural purpose. The Choir calls
    it a "response" and says it will be finished when the star finishes its song.
