# aureate_span — world-tier inventory override (ADR-145 D3, story 114-7)
#
# The shared SWN standard gear lives in the genre baseline
# (genre_packs/space_opera/inventory.yaml) and is inherited via the resolver's
# union-by-id merge. This file ships ONLY:
#   - currency / starting_equipment / starting_gold / philosophy (world-owned;
#     the resolver takes these from the world wholesale), and
#   - world-DISTINCT bespoke gear unique to the corona megastation (no SWN SRD
#     analog → mode=bespoke, a world-tier privilege per ADR-145 D3).

currency:
  name: credits
  denominations:
    - credits
    - kilocredits

item_catalog:
  # --- aureate_span world-distinct gear (bespoke, world-tier) ----------------

  - id: mirrorsilk_mantle
    name: Mirrorsilk Mantle
    description: >-
      A heat-reflective ceremonial mantle of woven mirrorsilk, worn on the
      sun-side promenades where the corona's glare would blind the unshaded.
      Status symbol first, sunshade second.
    category: tool
    value: 250
    weight: 1.0
    rarity: uncommon
    power_level: 0
    tags: [station, ceremonial, heat-shield]
    lore: >-
      On the Span, the cut of your mantle says which house's light you stand in.
      The reflective weave is almost an afterthought.
    narrative_weight: 0.2
    provenance:
      mode: bespoke
      license: na

  - id: house_chit
    name: House Chit
    description: >-
      An engraved credit-token of one of the Span's baroque ruling houses —
      legal tender on the station and a calling card everywhere else.
    category: treasure
    value: 500
    weight: 0.0
    rarity: uncommon
    power_level: 0
    tags: [station, currency, social]
    lore: >-
      The chit is worth its face in credits. The crest stamped on it is worth
      considerably more, or considerably less, depending on whose door you show it at.
    narrative_weight: 0.4
    provenance:
      mode: bespoke
      license: na

starting_equipment:
  Officer:
    - blaster_sidearm
    - datapad
    - flight_suit
    - medpatch
    - mirrorsilk_mantle
  Operative:
    - blaster_sidearm
    - vibroknife
    - flight_suit
    - datapad
  Pilot:
    - blaster_sidearm
    - datapad
    - flight_suit
  Engineer:
    - multitool_engineer
    - datapad
    - flight_suit
    - stim_pack
  Medic:
    - medkit_field
    - medpatch
    - medpatch
    - datapad
    - flight_suit
  Smuggler:
    - blaster_sidearm
    - vibroknife
    - datapad
    - flight_suit
  Diplomat:
    - datapad
    - flight_suit
    - medpatch
    - house_chit
  Soldier:
    - blaster_rifle
    - tactical_vest
    - medpatch
    - stim_pack

starting_gold:
  Officer: 900
  Operative: 700
  Pilot: 600
  Engineer: 500
  Medic: 600
  Smuggler: 800
  Diplomat: 1000
  Soldier: 400

philosophy:
  carry_limit: 0
  restricted_categories: []
  progression_gates: {}
  notes: >-
    Inventory is not the point of space opera. The ship carries the heavy
    stuff. Personal gear is what's on your belt and in your bunk. On the Span,
    what you wear says more than what you carry.
