world_name: The Aureate Span
starting_region: the_promenade
map_style: >-
  Art nouveau cross-section of a ring station, gold filigree borders,
  regions as ornate chambers connected by sweeping corridors, the dying
  red star visible through viewport windows at every edge, hand-lettered
  district names in decorative script
regions:
  the_promenade:
    name: The Promenade
    summary: "Amber-lit main concourse under a dome, everyone performing under the Imperatrix's gaze"
    description: >-
      The Span's glittering main concourse — a three-kilometer boulevard
      under a transparent dome that looks directly into Solenne's corona.
      The light here is always warm amber, filtered through plasma shields
      that turn the dying star into a permanent sunset. Cafes, boutiques,
      dueling salons, and street performers compete for attention. The
      fashion is maximalist — feathered capes, chromatic bodypaint,
      living-fabric gowns that shift color with mood. Everyone here is
      performing, whether they admit it or not. The Imperatrix's
      observation balcony overlooks the central fountain, and she watches.
    adjacent:
      - corona_arena
      - the_palace_solaris
      - resonance_quarter
      - underspine
    tags: [social, spectacle, commerce]
  corona_arena:
    name: The Corona Arena
    summary: "Gladiatorial colosseum where combatants fight framed by solar flares"
    description: >-
      A gladiatorial colosseum built into the station's sun-facing hull,
      where the dome is a single curved viewport into Solenne's surface.
      Combatants fight against the backdrop of a star — solar flares
      punctuate killing blows, coronal loops frame dramatic speeches.
      Fights are theatrical as much as lethal; the Imperatrix judges
      style as heavily as victory. Champions become celebrities.
      Losers who die beautifully are mourned with genuine grief.
      The Arena also hosts opera, ballet, and the annual Festival
      of Luminance where the Imperatrix's court settles political
      disputes through sponsored combat.
    adjacent:
      - the_promenade
      - the_palace_solaris
      - tether_works
    tags: [combat, spectacle, arena]
  the_palace_solaris:
    name: The Palace Solaris
    summary: "Living crystal baroque palace where audiences are conducted as performances"
    description: >-
      The Imperatrix's seat of power — a baroque palace of living
      crystal and hammered gold that grows from the station's spine
      like a crown. Every surface refracts Solenne's light into
      prismatic displays that shift with the star's mood. The throne
      room is a concert hall; audiences with the Imperatrix are
      conducted as performances. The palace contains the Doctrine
      Archive (the Imperatrix's philosophical writings, enforced as
      law), the Radiance Court (where disputes are judged on aesthetic
      merit), and the private chambers where Celestine VII paints,
      composes, and plans the next spectacle. Heavily guarded by the
      Solarium Guard — elite soldiers in mirrored armor who fight
      with light-lances.
    adjacent:
      - the_promenade
      - corona_arena
      - the_observatory
    tags: [authority, palace, sacred]
  resonance_quarter:
    name: The Resonance Quarter
    summary: "Crystalline Choir district sung into existence, sound that shatters bone"
    description: >-
      The Crystalline Choir's territory — a district of impossible
      architecture that was sung into existence, not built. Walls
      curve in acoustic parabolas, floors resonate at frequencies that
      make human visitors feel either euphoric or nauseated depending
      on where they stand. The Choir communicates by singing, builds
      by singing, and fights by singing frequencies that shatter bone.
      Visitors are welcome but must wear harmonic dampeners or risk
      involuntary emotional states. The district's central structure,
      the Grand Resonator, is both a cathedral and a weapon — it
      maintains the station's structural integrity through continuous
      harmonic reinforcement.
    adjacent:
      - the_promenade
      - tether_works
      - makhani_nexus
    tags: [alien_territory, acoustic, sacred]
  underspine:
    name: The Underspine
    summary: "Industrial belly market selling everything the Promenade won't, resistance planning"
    description: >-
      The station's belly — industrial decks, recycling plants,
      atmosphere processors, and the vast markets where the Vaal-Kesh
      do their real business. The light here is blue-white fluorescent,
      a deliberate contrast to the golden glow above. The air smells
      of ozone, alien spice, and machine lubricant. The Underspine
      markets sell everything the Promenade won't: unregulated
      pharmaceuticals, bootleg weapons, forged identity chits,
      and passage off-station for people who need to leave quietly.
      The Cinder Collective operates here, planning in back rooms
      behind Vaal-Kesh chemical stalls.
    adjacent:
      - the_promenade
      - tether_works
      - makhani_nexus
      - docking_ring
    tags: [underground, commerce, resistance]
  tether_works:
    name: The Tether Works
    summary: "Makhani-maintained stellar tether anchors, the Span's sacred lifeline"
    description: >-
      The magnetic tether anchors that suspend the Span in Solenne's
      corona — massive industrial pylons that hum with contained
      stellar energy. The Makhani maintain these, and the heat here
      is brutal even through the shielding. Workers in reflective
      suits tend machinery that nobody else understands. The tethers
      are the station's lifeline; if they fail, the Span falls into
      the star. The Makhani treat the tethers as religious artifacts
      and the work as worship. Outsiders need Makhani escort to
      enter, and the Makhani decide who gets one.
    adjacent:
      - corona_arena
      - resonance_quarter
      - underspine
      - makhani_nexus
    tags: [industrial, alien_territory, critical_infrastructure]
  makhani_nexus:
    name: The Makhani Nexus
    summary: "Amber-resin insectoid hive district where trade is measured in time-debts"
    description: >-
      The hive-district of the Makhani — insectoid chambers built
      from a resinous secretion that hardens into amber-colored
      walls. The architecture is organic, labyrinthine, and sized
      for beings that range from human-scale workers to
      tunnel-diameter queens. The air is thick, warm, and sweet.
      Bioluminescent fungi line the corridors. The Makhani don't
      trade in currency — they trade in time-debts, promises of
      future labor measured in shifts. Their queen, the Calcifier,
      is the oldest living being on the station and the only entity
      the Imperatrix treats as an equal.
    adjacent:
      - resonance_quarter
      - underspine
      - tether_works
    tags: [alien_territory, hive, sacred]
  the_observatory:
    name: The Observatory
    summary: "Scholarly enclave tracking Solenne's decay while the Imperatrix classifies the data"
    description: >-
      A research station and stargazing lounge at the Span's zenith,
      directly above the Palace Solaris. Astronomers, stellar
      physicists, and mystics study Solenne's death through
      instruments and meditation. The Observatory is technically
      independent — a scholarly enclave with its own charter — but
      the Imperatrix funds it and controls what findings are published.
      The current chief astronomer has been trying to publish a paper
      about Solenne's accelerating decay for three years. It keeps
      getting classified. The lounge serves excellent cocktails and
      has the best view in the sector.
    adjacent:
      - the_palace_solaris
      - docking_ring
    tags: [research, neutral, observatory]
  docking_ring:
    name: The Docking Ring
    summary: "Outer crescent spaceport where ugly ships pay higher docking fees"
    description: >-
      The station's outer ring — a crescent of docking bays, customs
      checkpoints, and traveler hostels where ships from three jump
      lanes converge. The architecture transitions from the Span's
      gilded baroque to the functional steel of working spaceport.
      Smugglers, merchants, diplomats, and refugees share the same
      queues. The Customs Aesthetic — yes, that's its real name —
      evaluates arriving ships for visual merit and charges uglier
      vessels higher docking fees. This is not a joke. The
      Imperatrix's doctrine extends even to parking.
    adjacent:
      - underspine
      - the_observatory
    tags: [port, commerce, gateway]
