name: The Aureate Span
slug: aureate_span
draft: true
cover_poi: the_promenade
description: >-
  A baroque megastation built into the corona of a dying star, where the
  Imperatrix Celestine rules through opera, gladiatorial spectacle, and
  weaponized beauty. The Span is part pleasure palace, part trade nexus,
  part arena — a place where every surface is gilded, every conversation
  is a negotiation, and every sunset might be the star's last. Three
  alien cultures share the station with humanity, none of them trust each
  other, and all of them are dancing on the edge of a supernova.
