name: The Aureate Span
slug: aureate_span
draft: true
cover_poi: the_promenade
description: >-
  A baroque megastation built into the corona of a dying star, where the
  Imperatrix Celestine rules through opera, gladiatorial spectacle, and
  weaponized beauty. The Span is part pleasure palace, part trade nexus,
  part arena — a place where every surface is gilded, every conversation
  is a negotiation, and every sunset might be the star's last. Three
  alien cultures share the station with humanity, none of them trust each
  other, and all of them are dancing on the edge of a supernova.
axis_snapshot:
  # Camp-cosmic space opera (Métal Hurlant / Fifth Element / Barbarella),
  # NOT gritty survival. Highest swagger of the three space_opera worlds —
  # the deliberate separation from coyote_star (0.5) and perseus_cloud
  # (0.5), both grounded-gritty. Tone stays high: this is a romp with a
  # dying star for a backdrop, not a tragedy about one. Drama is real and
  # lethal (genre truth), but the register is opera and excess, never grim.
  scale: 0.7
  tone: 0.8
  swagger: 0.95
starting_location: the_promenade
starting_time: "evening"
extensions:
  - archetype_funnels
  - npcs
