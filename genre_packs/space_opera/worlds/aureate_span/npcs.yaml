# sidequest-content/genre_packs/space_opera/worlds/aureate_span/npcs.yaml
#
# World-authored major NPCs for The Aureate Span. These were previously
# specified only as portrait entries (portrait_manifest.yaml) — a visual
# spec with no game-state backing. Authoring them here gives the narrator
# dispositioned entities (OCEAN, history seeds, initial disposition) and
# stops the engine from auto-registering them with random naming each
# session. Appearance prose is narrator-facing and may editorialize; the
# render-safe versions live in portrait_manifest.yaml.
#
# Register: camp-cosmic baroque (Métal Hurlant / Fifth Element). These are
# larger-than-life figures — play them theatrical, not naturalistic.

version: "0.1.0"
world: aureate_span

npcs:
  - id: imperatrix_celestine_vii
    name: "Imperatrix Celestine VII"
    pronouns: "she/her"
    role: "Ruler of the Aureate Span"
    ocean: { O: 0.9, C: 0.8, E: 0.75, A: 0.25, N: 0.2 }
    appearance: >-
      A woman in her early sixties who looks forty and moves like thirty,
      with deep brown skin and silver hair sculpted into an architectural
      updo threaded with living light-filaments that pulse with her
      heartbeat. High cheekbones, a mouth that defaults to amused
      contempt, and literal gold eyes — implants that let her see in the
      star's full spectrum. She wears gowns of living crystal that refract
      Solenne's light into prismatic haloes, so she appears perpetually
      backlit by a sunset she commissioned. Every gesture is choreographed.
      Every silence is deliberate.
    age: "early sixties (presents as forty)"
    distinguishing_features:
      - "literal gold eyes — full-spectrum stellar implants"
      - "the Solar Diadem, a crown projecting a contained miniature corona"
      - "geometric gold tattoos on bare arms that map the station's layout"
    history_seeds:
      - >-
        She rules by the Doctrine of Radiance — beauty is authority,
        spectacle is law — and she is not insane. She is an artist who
        decided the medium is civilization itself. She has read the
        Observatory's suppressed decay numbers and chosen, deliberately,
        to make the ending beautiful rather than survivable.
      - >-
        She inherited the Calcifier's three-hundred-year time-debt and
        fears the day it comes due more than she fears the supernova. It
        is the one thing on the Span she cannot command, and she knows it.
      - >-
        She treats every audience as a performance and every petitioner
        as a collaborator or a prop. She rewards those who make the room
        more beautiful and forgets those who merely make it more correct.
      - >-
        Her commission of the Supernova Opera is sincere. She wants the
        players in it. An invitation from Celestine is a gift wrapped
        around a hook.
    initial_disposition: 10

  - id: commander_aurien_vex
    name: "Commander Aurien Vex"
    pronouns: "he/him"
    role: "Captain of the Solarium Guard"
    ocean: { O: 0.35, C: 0.9, E: 0.4, A: 0.35, N: 0.3 }
    appearance: >-
      A lean man in his thirties, pale-skinned, with sharp blade-like
      features and close-cropped platinum hair. His mirrored gold-chrome
      armor reflects the station's light so he reads as a walking sunrise.
      Ice-blue eyes that track threats with mechanical precision, and a
      thin white scar from left ear to jawline, earned in the Arena before
      his promotion. He moves like a dancer who kills people.
    age: "mid thirties"
    distinguishing_features:
      - "full mirrored gold-chrome armor that redirects energy weapons"
      - "the Arena scar, ear to jaw"
      - "a light-lance that fires energy harvested from the tethers"
    history_seeds:
      - >-
        Absolutely loyal to the Imperatrix in a way that might be devotion,
        might be fanaticism, might be something more personal he has never
        named even to himself. He enforces the Doctrine without irony.
      - >-
        He came up through the Corona Arena and knows exactly what the
        crowd's love is worth, which is why he distrusts the current
        Champion's popularity more than anyone at court.
      - >-
        When the Imperatrix tells him "no," he obeys — but he asks the
        hard question first, quietly, and is never entirely sure she means
        her own answer. He would resolve "irregularities" if permitted.
      - >-
        He is the velvet glove's iron. Charming at a salon, lethal in a
        corridor, and the most dangerous person to underestimate on the
        upper decks.
    initial_disposition: 0

  - id: tivaanu_amber_essence
    name: "Tivaanu of the Amber Essence"
    pronouns: "they/them"
    role: "Vaal-Kesh Trade Consul"
    ocean: { O: 0.7, C: 0.7, E: 0.6, A: 0.5, N: 0.3 }
    appearance: >-
      An amphibious being of indeterminate age with smooth, glistening
      skin that shifts from deep teal to warm amber with mood. Large dark
      eyes with horizontal pupils set in a broad, calm face; webbed hands
      with long dexterous fingers stained at the tips from chemical work.
      Shorter than most humans, compact, fluid. They wear layered silks in
      ocean colors that ripple as they move, and a water-circulation
      collar that keeps their skin moist in the station's dry air. Their
      voice is soft, melodic, and always sounds like they know something
      you don't.
    age: "indeterminate"
    distinguishing_features:
      - "chromatophore skin — teal at rest, amber when pleased or scheming"
      - "a bandolier of crystal vials disguised as jewelry, at least two of them poisons"
      - "the water-circulation collar"
    history_seeds:
      - >-
        The most connected being on the Span. They will trade with anyone,
        sell anything, and leave before the bill comes due — the Vaal-Kesh
        keep evacuation ships pre-fueled in the docking ring, and Tivaanu
        signs the manifests.
      - >-
        They control Solfire distribution — the compound that lets humans
        hear the star as music — and have not decided whether it is their
        finest product or their most dangerous liability.
      - >-
        Pragmatist to the core. They quietly fund the Cinder Collective's
        shipyard not from sympathy but because a second exit is good
        business. They will help the players for a price that always seems
        fair until later.
      - >-
        They read a room by its appetites. Tell them what you want and
        you have told them how to move you.
    initial_disposition: 20

  - id: kaelith_resonant
    name: "Kaelith Resonant"
    pronouns: "it/its"
    role: "Crystalline Choir Ambassador to the Span"
    ocean: { O: 0.85, C: 0.7, E: 0.4, A: 0.65, N: 0.25 }
    appearance: >-
      A being of living quartz — translucent, faceted, roughly humanoid
      but wrong in the proportions: the torso too long, the arms with an
      extra joint, the head a cluster of crystalline formations that
      refract light into rainbows. No visible mouth or eyes; its voice is
      a rich resonance from the chest cavity. The body hums constantly at
      a frequency just below hearing, and standing near it produces
      profound calm or mild vertigo depending on the listener. Light
      passes through it, casting prismatic shadows. Internal light pulses
      red-orange when agitated, steady blue-white when content.
    age: "two centuries on the Span; older before"
    distinguishing_features:
      - "internal light that colors its mood — blue-white calm, red-orange agitation"
      - "a harmonic amplifier worn at the chest, for long-range speech or weaponized sound"
      - "prismatic shadows wherever it stands"
    history_seeds:
      - >-
        It speaks for the Choir, who claim Solenne is not dying but
        composing, and who have been singing a seed-ship into existence
        for forty years. It considers evacuation obscene — leaving would
        be walking out of a concert before the finale.
      - >-
        It chooses the seed-ship's passengers by a test no human fully
        understands: whether you can hold a note, sustain a thing, keep a
        promise of breath through to the end. Wealth and rank mean nothing
        to it.
      - >-
        It is genuinely kind, in an alien register — it will tell a meat-
        being the truth the star is singing, in terms it hopes they can
        survive hearing. It does not always succeed.
      - >-
        It and the Calcifier share an ancient mutual recognition. They are
        the two oldest intelligences on the Span and they agree the humans
        are missing the point — though not about which point.
    initial_disposition: 10

  - id: the_calcifier
    name: "The Calcifier"
    pronouns: "she/her"
    role: "Makhani Queen / Hive Mother"
    ocean: { O: 0.6, C: 0.85, E: 0.2, A: 0.4, N: 0.15 }
    appearance: >-
      Enormous — three meters tall at rest, with a segmented amber-brown
      carapace that gleams like polished tortoiseshell. Six limbs: the
      upper pair delicate and precise, the middle pair powerful, the lower
      pair structural. A broad flat head with compound eyes that glow with
      reflected stellar light, warm orange shifting to deep red. Mandibles
      that click in patterns too fast to parse. Her carapace bears
      centuries of amber-resin deposits some read as writing and others as
      geological strata. She moves slowly, deliberately, and the floor
      vibrates when she does.
    age: "older than the station"
    distinguishing_features:
      - "a tether-key in a mandible setting — a crystallized fragment of tether energy, symbol of authority over the station's life support"
      - "the uncollected time-debt recorded as a pattern in her carapace"
      - "compound eyes that glow orange-to-red with the star's mood"
    history_seeds:
      - >-
        Three centuries ago she spared Celestine I in the Arena and took a
        time-debt instead of her life. She has held it, uncollected, ever
        since. She is the only being the Imperatrix dynasty treats as an
        equal, and the only one it cannot command.
      - >-
        She knows when the star will die and has always known. The hive
        has been aiming the tethers, not holding them — preparing to fling
        the Span into the waking geometry in Solenne's core, which the
        Makhani have worshipped since before the star existed.
      - >-
        She speaks through a translator-attendant whose voice becomes her
        own by the end of each sentence. She is never in a hurry. She has
        out-waited seven Imperatrixes.
      - >-
        She finds it interesting that no one has simply asked her, directly,
        what the tethers are aimed at. She would not answer. She would find
        it interesting.
    initial_disposition: 0

  - id: breck
    name: "Breck"
    pronouns: "she/her"
    role: "Cinder Collective Leader"
    ocean: { O: 0.5, C: 0.8, E: 0.55, A: 0.45, N: 0.55 }
    appearance: >-
      A stocky woman in her forties with dark skin, close-cropped grey
      hair, and the calloused hands of two decades maintaining atmospheric
      processors. Broad shoulders, strong jaw, eyes that are brown and
      tired and angry in equal measure. No cosmetic enhancements, no
      fashion — a patched utility jumpsuit and steel-toed boots, every
      part of it a political statement on a station where beauty is law. A
      burn scar covers her left forearm. She doesn't smile often; when she
      does, it's because something is about to change.
    age: "forties"
    distinguishing_features:
      - "the untreated burn scar she refuses to have healed — a plasma conduit rupture killed three of her crew during a perfume exhibition"
      - "deliberately utilitarian dress — the absence of beauty as the aesthetic"
      - "a salvaged comm unit jury-rigged for encrypted Underspine broadcasts"
    history_seeds:
      - >-
        She leads the Underspine resistance — workers, Vaal-Kesh defectors,
        rogue Makhani — and believes the Doctrine of Radiance is a death
        cult in a beautiful mask. She is building lifeboats out of scrap
        and spite while the court rehearses an opera.
      - >-
        She lost three of her crew to a plasma rupture the court ignored.
        That is the wound under the politics. She counts exits before she
        takes her boots off and has never forgiven the Promenade.
      - >-
        She recruits people who didn't need much convincing. She vets
        escape-pod passengers with a short interview about what they did
        before the truth went public.
      - >-
        She is not grim about it — her defiance has a black, magnificent
        humor. Surviving on schedule, ugly and alive, is the loudest
        refusal she can make, and she intends to make it at full volume.
    initial_disposition: 15

  - id: tav
    name: "Tav"
    pronouns: "he/him"
    role: "Cinder Collective Strategist"
    ocean: { O: 0.8, C: 0.6, E: 0.45, A: 0.65, N: 0.75 }
    appearance: >-
      A thin, nervous man in his late twenties with light brown skin and
      dark curly hair that's never been styled. The rapid eye movement of
      someone always calculating exit routes. He wears oversized
      spectacles he doesn't need — they're data displays disguised as
      corrective lenses — and moves in quick, birdlike jerks. He talks
      fast and thinks faster.
    age: "late twenties"
    distinguishing_features:
      - "data-display spectacles disguised as corrective lenses"
      - "a hand-drawn star chart tattooed on his right forearm — Solenne's projected decay timeline"
      - "the suppressed Observatory data on a chip sewn into his collar"
    history_seeds:
      - >-
        A former Observatory assistant reassigned to the Underspine when he
        tried to publish the stellar decay data. He carries the real
        numbers everywhere and is the reason the Collective's propaganda is
        accurate to three decimal places.
      - >-
        He still believes reason will be enough — that if people just see
        the data, they will act. Breck lets him keep believing it because
        he reaches people she can't.
      - >-
        He is the easiest member of the Collective for outsiders to
        approach and the most dangerous to expose; the Solarium Guard would
        very much like the chip in his collar.
      - >-
        He is jumpy, earnest, and brave in a way that surprises even him.
        Frighten him and he talks; trust him and he will not stop helping.
    initial_disposition: 25
