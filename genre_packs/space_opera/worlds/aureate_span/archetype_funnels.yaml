funnels:

  # ── Solarium Guard & Arena Champions ────────────────────────────────────────
  - name: Radiant Vanguard
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Imperatrix's Court
    lore: >-
      The Solarium Guard's elite front line — soldiers who have earned the
      right to wear mirrored armor and carry light-lances in the Imperatrix's
      name. A Radiant Vanguard is both bodyguard and living sculpture; Celestine
      VII selects them for aesthetic presence as much as combat record. To stand
      in her procession is to be art. They know this. Most of them have made
      peace with it.
    cultural_status: revered on the Promenade, treated as props by the court, feared in the Underspine
    disposition_toward:
      The Cinder Collective: hostile
      The Makhani Hive: wary
      Vaal-Kesh Trade Consortium: transactional

  - name: Corona Arena Champion
    absorbs:
      - [hero, dps]
      - [outlaw, dps]
    faction: The Imperatrix's Court
    lore: >-
      The Corona Arena's most watched gladiators — fighters whose names are
      sung in the opera house after their victories. Champions come from every
      faction and world: Vaal-Kesh enforcers, Makhani warriors fighting on
      individual contract, Cinder defectors who found a better exit. What unites
      them is the crowd's love and the Imperatrix's eye. To kill beautifully in
      the Arena is the fastest path to a Court title and the slowest path to dying
      in bed.
    cultural_status: beloved celebrities on the upper decks, cult figures in the Underspine
    disposition_toward:
      The Cinder Collective: complicated
      The Imperatrix's Court: bound

  # ── Scouts, Operatives & Fixers ─────────────────────────────────────────────
  - name: Jump Lane Runner
    absorbs:
      - [explorer, jack_of_all_trades]
      - [explorer, stealth]
      - [outlaw, jack_of_all_trades]
    faction: null
    lore: >-
      The Docking Ring attracts pilots and couriers who know all three jump
      lanes and charge accordingly for their silence. Jump Lane Runners move
      people, information, and goods that polite society pretends don't exist —
      Cinder Collective manifestos, suppressed Observatory data, pre-fueled
      Vaal-Kesh skiffs registered under six different transponder codes. No
      faction owns them, which means every faction uses them. Their neutrality
      is a professional courtesy, not a moral position.
    cultural_status: indispensable to every faction, trusted by none
    disposition_toward:
      Vaal-Kesh Trade Consortium: transactional
      The Cinder Collective: sympathetic

  - name: Underspine Operative
    absorbs:
      - [outlaw, stealth]
      - [magician, stealth]
    faction: The Cinder Collective
    lore: >-
      The Cinder Collective's covert arm — people who move through the
      maintenance shafts and unlit sections of the Underspine without appearing
      on any manifest. Some are former Solarium Guard who saw something in the
      lower decks they couldn't unsee. Others are Vaal-Kesh defectors whose
      chromatophore skin gives them an edge in dark corridors. Breck doesn't ask
      where they learned what they know. They don't ask why he started counting
      exits before he takes his boots off.
    cultural_status: wanted by the Solarium Guard, essential to the Collective
    disposition_toward:
      The Imperatrix's Court: hunted
      The Makhani Hive: cautious alignment

  - name: Court Intrigant
    absorbs:
      - [outlaw, control]
      - [ruler, control]
      - [lover, control]
    faction: The Imperatrix's Court
    lore: >-
      Every salon on the Promenade has at least one — a figure who trades in
      leverage, favorable introductions, and the careful management of who knows
      what. Court Intrigants operate entirely through aesthetic channels: the
      right word at an opera intermission, the seating arrangement at a formal
      dinner, the rumor dropped into the Imperatrix's ear like a gift. Under
      the Doctrine of Radiance, social manipulation isn't unseemly — it's
      considered an art form, and the best practitioners are celebrated for it.
    cultural_status: respected and watched, simultaneously the most and least trusted people in any room
    disposition_toward:
      Vaal-Kesh Trade Consortium: calculating
      The Cinder Collective: contemptuous

  # ── Support, Medical & Logistics ────────────────────────────────────────────
  - name: Vaal-Kesh Pharmacist
    absorbs:
      - [caregiver, healer]
      - [sage, healer]
      - [magician, healer]
    faction: Vaal-Kesh Trade Consortium
    lore: >-
      The Underspine's finest medics are Vaal-Kesh who crossed the line between
      trade and care — pharmacists who stock both Solfire (the compound that lets
      humans hear stellar radiation as music) and the blunt trauma patches the
      Arena hands out after a bad round. Their chromatophore skin flushes
      diagnostic colors they've learned to read in their patients' eyes. They
      will sell you the poison and the antidote, and they'll make sure you
      understand the difference before you leave.
    cultural_status: essential, operating across all social strata, scrupulously neutral
    disposition_toward:
      The Cinder Collective: quietly supportive
      The Imperatrix's Court: professionally neutral

  - name: Span Quartermaster
    absorbs:
      - [caregiver, support]
      - [ruler, support]
      - [everyman, support]
    faction: null
    lore: >-
      The Aureate Span runs on maintenance, resupply, and the thousand small
      decisions that keep magnetic tethers calibrated and oxygen recyclers
      cycling. Quartermasters exist in every faction: Makhani Keepers who
      track tether stress in resin-amber ledgers, Underspine supervisors who
      know which plasma conduits are three weeks from rupture, Consortium
      logistics officers who have memorized the docking rotation for three
      jump lanes. They are the reason the beautiful people above have anything
      to be beautiful about.
    cultural_status: invisible to the upper decks, absolutely essential to everyone
    disposition_toward:
      The Cinder Collective: sympathetic
      The Imperatrix's Court: resentful

  - name: Choir Harmonist
    absorbs:
      - [sage, support]
      - [magician, support]
    faction: The Crystalline Choir
    lore: >-
      Crystalline Choir members who have developed the ability to modulate their
      resonance for biological listeners — translating between silicon cosmology
      and the organic concerns of their station-mates. A Harmonist maintains the
      Grand Resonator's structural frequencies and also, quietly, listens to
      Solenne's song and translates what the star is saying into terms the meat-
      beings around them might survive hearing. They are diplomats. They are
      also the ones who know the Choir has no intention of leaving before
      the finale.
    cultural_status: alien and approachable in equal measure, sought out by those who need real answers
    disposition_toward:
      The Makhani Hive: resonant mutual respect
      The Cinder Collective: complicated sympathy

  # ── Scholars, Analysts & Strategists ────────────────────────────────────────
  - name: Observatory Analyst
    absorbs:
      - [sage, control]
      - [sage, stealth]
    faction: The Cinder Collective
    lore: >-
      The Observatory at the Span's zenith holds stellar decay data that the
      Imperatrix has officially suppressed — readings that put Solenne's death
      inside a human lifetime. Observatory Analysts are the scientists and
      technicians who copy the real numbers, smuggle them to the Cinder
      Collective, and maintain a second set of books under official ones. Working
      in plain sight of the dying star has given them a particular clarity about
      what the Doctrine of Radiance actually costs.
    cultural_status: officially respected, quietly watched by the Solarium Guard
    disposition_toward:
      The Imperatrix's Court: compliant on the surface
      The Cinder Collective: committed

  - name: Makhani Listener
    absorbs:
      - [sage, dps]
      - [explorer, dps]
    faction: The Makhani Hive
    lore: >-
      The caste within the Makhani Hive tasked with interpreting what Solenne
      is saying through stellar radiation, magnetic variance, and the vibration
      of the tethers they tend. A Listener who determines the hive's agenda is
      a Listener who has heard something in the star that justifies violence —
      and the Makhani's willingness to adjust the tethers toward something in
      the stellar core suggests the Listeners have been very persuasive lately.
      They are not combatants by preference. The clicking of their mandibles
      when calculations resolve badly is the closest they come to alarm.
    cultural_status: inscrutable and essential, afforded wide berth by all factions
    disposition_toward:
      The Crystalline Choir: ancient mutual recognition
      The Cinder Collective: indifferent

  # ── Social Operators & Artists ───────────────────────────────────────────────
  - name: Doctrine Artist
    absorbs:
      - [artist, support]
      - [artist, control]
      - [lover, support]
      - [lover, healer]
    faction: The Imperatrix's Court
    lore: >-
      Under the Doctrine of Radiance, art is not decoration — it is governance.
      Doctrine Artists are the Imperatrix's licensed creators: composers whose
      operas serve as court proceedings, architects whose installations encode
      edicts, performers whose recitals announce policy. Celestine VII attends
      every premiere. To be a Doctrine Artist is to be powerful, celebrated,
      and watched by someone who considers your output a function of the state.
      The ones who survive long enough get very good at saying dangerous things
      beautifully.
    cultural_status: celebrated in court, envied on the Promenade, invisible in the Underspine
    disposition_toward:
      The Cinder Collective: uneasy conscience
      Vaal-Kesh Trade Consortium: mutually useful

  - name: Solfire Dealer
    absorbs:
      - [artist, jack_of_all_trades]
      - [jester, jack_of_all_trades]
      - [jester, stealth]
    faction: Vaal-Kesh Trade Consortium
    lore: >-
      Solfire — the Vaal-Kesh compound that lets humans hear stellar radiation
      as music — is the Span's defining vice and its defining metaphor. Solfire
      Dealers are the distribution network: part chemist, part performer, part
      confessor for the things people say when they can hear Solenne dying in
      real time. Some of them are true believers who think the compound is
      communion. Others are just very good salespeople. The Jester variant is
      the one who has heard the star enough times to find it funny, and that
      should worry you.
    cultural_status: tolerated on every deck, officially disapproved of, practically essential to morale
    disposition_toward:
      The Imperatrix's Court: carefully licensed
      The Cinder Collective: occasionally bankrolling

  - name: Promenade Socialite
    absorbs:
      - [lover, stealth]
      - [everyman, stealth]
      - [everyman, dps]
    faction: The Imperatrix's Court
    lore: >-
      The Promenade runs the full circumference of the Span under a dome that
      looks directly into the star, and the socialites who work it are performing
      the most demanding long-game in the sector. A Promenade Socialite
      remembers every name, every slight, every debt — and operates with a
      cheerful visibility that functions as the perfect cover for a second
      set of activities the Solarium Guard would find interesting. The ones
      who have been doing it long enough have mastered the art of being
      overlooked in the most watched place on the station.
    cultural_status: fashionable, assumed harmless, occasionally catastrophically not
    disposition_toward:
      Vaal-Kesh Trade Consortium: friendly commerce
      The Cinder Collective: selective sympathy

  # ── Crew, Workers & Survivors ────────────────────────────────────────────────
  - name: Underlevel Crew
    absorbs:
      - [everyman, jack_of_all_trades]
      - [innocent, jack_of_all_trades]
      - [innocent, support]
    faction: The Cinder Collective
    lore: >-
      The Underspine's working population — the people who keep the Span
      running while the Promenade holds perfume exhibitions. Underlevel Crew
      know their section numbers better than their names, can fix a plasma
      conduit with three tools and a borrowed prayer, and have opinions about
      the Doctrine of Radiance that they express quietly, to people they trust,
      in the maintenance shafts where the Solarium Guard doesn't walk. Breck
      recruits from this pool. He mostly gets people who didn't need much
      convincing.
    cultural_status: invisible to the upper decks, quietly building something in the Underspine
    disposition_toward:
      The Imperatrix's Court: resentful compliance
      The Cinder Collective: gravitating toward

  - name: Docking Ring Freelancer
    absorbs:
      - [hero, jack_of_all_trades]
      - [hero, stealth]
      - [caregiver, stealth]
    faction: null
    lore: >-
      The Docking Ring at the Span's outer edge is where three jump lanes
      meet and nobody asks too many questions. Freelancers who work the Ring
      take work from any faction and learn early that the most dangerous thing
      on the station isn't the dying star — it's owing someone a favor when
      everyone has evacuation ships pre-fueled and is watching the exits.
      The Caregiver variant is the one who keeps coming back to help people
      who haven't figured out yet that they need to leave.
    cultural_status: useful and interchangeable in the eyes of the powerful, quietly essential
    disposition_toward:
      Vaal-Kesh Trade Consortium: regular clients
      The Cinder Collective: occasional contractors

  # ── Control Specialists & Tacticians ────────────────────────────────────────
  - name: Resonance Technician
    absorbs:
      - [magician, control]
      - [magician, dps]
      - [caregiver, control]
      - [explorer, control]
    faction: The Crystalline Choir
    lore: >-
      The Crystalline Choir's Grand Resonator is both cathedral and weapon,
      and the Resonance Technicians are the ones who know which settings it is
      currently configured for. They tune the station's structural frequencies,
      maintain the acoustic territories that form the Choir's political
      sovereignty, and occasionally demonstrate — with great regret and
      considerable precision — what happens to organic tissue inside a
      sustained subsonic resonance field. They consider this violence a form
      of music. That is not a metaphor.
    cultural_status: respected and feared, not fully understood by any biological faction
    disposition_toward:
      The Makhani Hive: aligned on the star's importance
      The Imperatrix's Court: tense coexistence

  - name: Tether Keeper
    absorbs:
      - [outlaw, support]
      - [explorer, dps]
      - [caregiver, dps]
    faction: The Makhani Hive
    lore: >-
      The Makhani who maintain the magnetic tethers that keep the Aureate Span
      from falling into Solenne's photosphere. To the upper decks, they are
      infrastructure. To the Makhani Hive, they are priests in continuous
      communion with the dying star. The Calcifier — their queen — holds an
      uncollected time-debt over the Imperatrix dynasty, and the Tether Keepers
      know what the tethers are currently aimed at. They find it interesting
      that nobody has asked them directly. They would not answer, but they
      would find it interesting.
    cultural_status: essential and unknowable, given wide berth by everyone who understands physics
    disposition_toward:
      The Crystalline Choir: ancient understanding
      The Cinder Collective: indifferent to their evacuation plans

  - name: Collective Propagandist
    absorbs:
      - [hero, control]
      - [jester, support]
      - [innocent, healer]
    faction: The Cinder Collective
    lore: >-
      Breck's Collective doesn't have a Doctrine of Radiance, but it has
      Propagandists — people who know how to make the suppressed Observatory
      data legible to someone who just pulled a double shift on the plasma
      conduit. They work in crude printed sheets, scratched wall markings in
      the Underspine, and the kind of dark humor that makes the truly terrible
      bearable. The Innocent variant is the one who still thinks reason will
      be enough. Breck lets them keep thinking that. They reach people he can't.
    cultural_status: wanted by the Solarium Guard, beloved in the Underspine
    disposition_toward:
      The Imperatrix's Court: openly opposed
      Vaal-Kesh Trade Consortium: occasionally funded by defectors
