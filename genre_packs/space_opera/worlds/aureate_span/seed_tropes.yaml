# Seed tropes for space_opera/aureate_span — world-tier deck (Epic 94: genre is
# the rulebook only; flavor lives in the world). Short-arc narrative hooks dealt
# at session start and on engagement/lull draws, expiring after lifespan_turns
# and lingering as ghosts for later callback (ADR-018, ADR-128). Seeds are baited
# hooks (ADR-014 diamonds-and-coal) — deliberately vague; the narrator threads an
# engaged seed into whatever the evening's intrigue demands.
#
# Without this file the Span drew from an empty deck, the lull engine declined
# `none_available` on every quiet turn, and the narrator invented crowds of
# courtiers to fill the silence. These seeds are the deck.
#
# Pitched to THIS world specifically: a baroque megastation suspended in the
# corona of a dying star, ruled by the Doctrine of Radiance (beauty is authority,
# spectacle is law). Register is camp-cosmic opera — Métal Hurlant / Fifth
# Element / Barbarella — high swagger (0.95), high tone (0.8): a romp with a
# supernova for a backdrop, lethal but never grim. Every seed leans on a named
# mechanism of the Span, NOT generic station intrigue: the radiation-shielding
# economy (Solfire, water-collars, tether-energy), titles earned by arena or art
# (Resplendent, Effulgent, Champion), the Vaal-Kesh chemistry monopoly, the
# Calcifier's uncollected time-debt, the Choir's sung architecture, the failing
# magnetic tethers, and the specific wards — Promenade, Underspine, Resonance
# Quarter, Docking Ring, the unresurfaced First Arena tiles. Keep it gilded,
# courtly, and vertiginous: everyone is dancing on the edge of a star.

- id: aureate_span_a_title_falls_vacant
  name: A Title Falls Vacant
  description: >-
    A courtier who held an earned title — Effulgent, Resplendent, some
    luminous honor won at salon or arena — has been quietly stripped of it,
    or died, or simply stopped being announced at the doors. On the Span a
    title is not birthright; it is standing, and standing now lies on the
    table like an unclaimed prize. The vultures are already rehearsing their
    grief.
  flavor_tags: [court, authority, status, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - A herald at the Promenade doors hesitates over a name, then announces the guest without their honorific, and the room notices
    - Two aesthetes argue, too sweetly, over who is best suited to be granted the vacancy by the Imperatrix's favor
    - The fallen courtier's salon stands with its lamps still lit and its door already being measured by a rival
  narrative_hint: >-
    On the Span, status is the only currency that outranks money. Let the
    players be courted as witnesses, allies, or claimants to the empty honor,
    and let the question of how the title fell — disgrace, murder, or mere
    unfashionability — be the bait (SOUL: surprise the player who assumes a
    vacancy is an accident).

- id: aureate_span_the_collar_runs_dry
  name: The Collar Runs Dry
  description: >-
    A Vaal-Kesh dignitary's water-circulation collar — the device that keeps
    amphibian skin from cracking in the Span's dry, gilded air — has failed,
    or been tampered with, in the middle of a function it could not leave. On
    a station where the chemistry guild keeps everyone medicated, the sight of
    a Vaal-Kesh going visibly dry in public is a scandal, a threat, and a
    message all at once.
  flavor_tags: [vaal_kesh, sabotage, scandal, intrigue]
  lifespan_turns: 5
  delivery_hints:
    - A Vaal-Kesh trader's skin has gone ashen-grey at the edges and they hold themselves very still, pretending nothing is wrong
    - An Underspine apothecary mutters that a collar does not simply fail — someone shorted the circulation cell
    - A rival consortium representative is conspicuously solicitous, offering a loaner collar with strings the players can almost see
  narrative_hint: >-
    The Vaal-Kesh monopoly cuts both ways: they medicate the Span and the
    Span can be used to dry them out. Let the players choose whether to rescue,
    exploit, or investigate, and let the tampered collar point back toward
    whoever wanted a guild member silenced or indebted.

- id: aureate_span_a_marriage_of_radiance
  name: A Marriage of Radiance
  description: >-
    An alliance is being negotiated the only way the court knows how — as a
    performance. Two houses, or a house and a faction, are to be joined in a
    public betrothal staged for aesthetic merit, the union dressed as devotion
    to the Doctrine. Everyone involved is smiling. At least one of them is
    being sold.
  flavor_tags: [court, alliance, romance, intrigue]
  lifespan_turns: 7
  delivery_hints:
    - A betrothal tableau is being rehearsed on the Promenade, the couple posed to refract the star's light at the most flattering angle
    - One of the intended is radiant in public and white-knuckled in the corridor, and asks a player a question they did not finish
    - The dowry under discussion is not coin but a share of something scarce — shielded berths, treatment supply, a guild contract
  narrative_hint: >-
    Marriage here is statecraft wearing opera costume. Let the players be
    confidants, go-betweens, or saboteurs, and let the real terms of the
    alliance — what scarce thing is changing hands beneath the beauty — be the
    seed that pays off later.

- id: aureate_span_a_solfire_vision
  name: Someone Saw the Star Look Back
  description: >-
    A Solfire user — the compound that lets humans hear stellar radiation as
    music — has come back from a dose insisting the star is not a melody but a
    face, and that it turned toward them. They are not raving in the ordinary
    way. They remembered something specific, and they are frightened of having
    remembered it. The Vaal-Kesh dealer has gone very quiet about the batch.
  flavor_tags: [solfire, uncanny, mystery, vaal_kesh]
  lifespan_turns: 6
  delivery_hints:
    - A pale-eyed reveller in a Promenade salon keeps describing a shape in the star's song and will not be talked out of it
    - The Vaal-Kesh dealer has pulled the lot from sale and is asking, too casually, who else dosed from it
    - A Makhani worker is found standing near the visionary, having said nothing, simply listening
  narrative_hint: >-
    Solfire is the Span's window onto the thing in the core — most who look
    through it can't say what they saw. Let the players treat the vision as
    intoxication or revelation, and let what the visionary describes hint at a
    truth the hive already knows (SOUL: agency — the players decide whether the
    star is worth listening to).

- id: aureate_span_a_debt_marker_on_the_old_tiles
  name: A Marker Left on the Old Tiles
  description: >-
    Someone has placed an object — a token, a pattern, a single still figure —
    on the unresurfaced tiles of the First Arena, the ones where the dynasty's
    founder lost the fight that built her throne. To an aristocrat it is a
    language; to a commoner it is litter. A debt is being invoked, or
    threatened, or merely remembered aloud, and the court has gone tense in a
    way no commoner can read.
  flavor_tags: [court, makhani, debt, omen]
  lifespan_turns: 6
  delivery_hints:
    - An aristocrat stops mid-laugh at the sight of the old tiles and steers their party pointedly away from them
    - A Makhani attendant stands motionless on the worn stone during a function, and the Imperatrix's people pretend not to see
    - An old courtier, half in their cups, explains to a player exactly which fight those tiles remember and goes pale doing it
  narrative_hint: >-
    The Calcifier's three-century time-debt is the one law older than the
    throne. Let the players read the marker as vandalism or summons, and let
    pulling on it draw them between a hive that never hurries and a dynasty
    that fears the day the favor comes due.

- id: aureate_span_a_span_that_groans
  name: The Deck That Groans at the Wrong Hour
  description: >-
    A section of the Span has begun to make a sound it should not — a low
    structural groan in the gold underfoot, on a deck the engineers swear is
    sound. The court calls it the star settling. The Underspine crews call it
    a tether under strain, or worse, the Choir borrowing the station's
    integrity for something of their own. Either way the floor is talking, and
    nobody fashionable will admit they hear it.
  flavor_tags: [decay, tether, peril, mystery]
  lifespan_turns: 5
  delivery_hints:
    - A wine glass walks itself off a Promenade table to a vibration no music accounts for, and the band plays louder
    - An Underspine engineer pulls a player aside to show a tether-strain readout the court has ordered unposted
    - The groan recurs precisely when the Resonance Quarter is loudest, and one frightened tech has started keeping the times
  narrative_hint: >-
    The Span is borrowed time made architecture. Let the players chase the
    groan to a failing tether, a settling star, or the Choir feeding the
    station's strength into their seed-ship — and let the court's refusal to
    hear it be its own quiet horror (SOUL: consequence — ignored, the deck
    does not stay quiet).

- id: aureate_span_a_berth_in_the_docking_ring
  name: A Pre-Fueled Berth, Quietly for Sale
  description: >-
    Word is moving, the way only the most dangerous word moves — softly — that
    a fueled and ready berth in the Docking Ring can be had, for the right
    price or the right favor. On a station the star is slowly killing, an exit
    is the one luxury the Doctrine of Radiance forbids anyone to want out loud.
    The seller is discreet. The buyers are desperate behind their smiles.
  flavor_tags: [vaal_kesh, scarcity, escape, intrigue]
  lifespan_turns: 7
  delivery_hints:
    - A perfectly composed aristocrat asks a player, with elaborate casualness, whether they happen to know any reliable pilots
    - A Vaal-Kesh broker quotes a price for a berth that is not in coin but in something the players would have to do
    - A Solarium Guard is loitering near the Docking Ring manifests, and everyone trading there has noticed and kept trading
  narrative_hint: >-
    Wanting to leave is heresy against the Doctrine; arranging to is treason
    and survival both. Let the players broker, buy, expose, or steal the berth,
    and let the price reveal who on the gilded decks has quietly stopped
    believing in the beautiful ending.

- id: aureate_span_an_audition_no_one_explained
  name: An Audition No One Explained
  description: >-
    A crystalline emissary of the Choir has approached someone — perhaps a
    player — and asked, with no preamble and no irony, whether they can hold a
    note. It was not small talk and it was not a metaphor anyone present could
    decode. The Choir is choosing for something, by a criterion that ignores
    rank and coin entirely, and being chosen is as unsettling as being passed
    over.
  flavor_tags: [crystalline_choir, uncanny, mystery, invitation]
  lifespan_turns: 6
  delivery_hints:
    - A faceted Choir-being studies a person in the Resonance Quarter and asks them to sustain a single tone, then simply waits
    - Someone who was tested cannot stop talking about the question; someone who failed it cannot say why they feel bereft
    - Visitors near the unfinished spire report rapture or vertigo, and the Choir notes which without explaining the difference
  narrative_hint: >-
    The Choir's seed-ship sells its passage in sustained breath, not gold. Let
    the players treat the audition as flattery, threat, or salvation, and let
    the alien register of the test — what it actually measures — stay a thing
    they can only learn by leaning in (SOUL: surprise the rank-conscious player
    with a door that money cannot open).

- id: aureate_span_a_conscription_dressed_as_honor
  name: An Invitation That Cannot Be Refused
  description: >-
    A gilded summons has gone out to a performer, an artisan, a beautiful
    nobody — a role in the Imperatrix's great commission, offered as the
    honor of a lifetime. To accept is to vanish into a production that does
    not seem to release its people. To decline is to insult the Doctrine of
    Radiance in front of a court that settles such insults in the arena. The
    invitee is trapped between flattery and disappearance.
  flavor_tags: [court, conscription, peril, opera]
  lifespan_turns: 7
  delivery_hints:
    - A radiant invitation arrives on living-crystal stock, and the recipient's hands shake holding a thing so beautiful
    - A previous honoree was last seen entering the Palace Solaris weeks ago and has not been announced at any door since
    - Commander Aurien Vex's people make sure, charmingly, that the invitation is understood to have only one acceptable answer
  narrative_hint: >-
    The Imperatrix's commission is sincere and that is the danger. Let the
    players help someone refuse, escape, or survive the honor — and let the
    machinery that makes a gift into a cage be the Doctrine doing exactly what
    it was built to do.

- id: aureate_span_the_underspine_goes_dark
  name: The Gold Light Turns Red Below
  description: >-
    On a stretch of the Underspine, someone has re-shaded the station's
    mandated golden light to a deep rebel red, and stenciled across three
    metres of bulkhead a number the court has spent a fortune suppressing —
    how long the star has left. The Solarium Guard wants it scrubbed before
    anyone fashionable wanders down to see. The crews who painted it want
    every deck to read it before it's gone.
  flavor_tags: [cinder_collective, rebellion, truth, peril]
  lifespan_turns: 6
  delivery_hints:
    - A maintenance corridor glows the wrong color, and a freshly painted decay-figure dries on the wall above a cooling stencil
    - A Cinder recruiter presses a player on what they actually did the last time the truth flickered across the Promenade screens
    - Solarium Guards are sealing the deck to scrub it, and an Underspine worker is deciding, openly, whether to let them
  narrative_hint: >-
    The Cinder Collective's revolt is not grim — it is the loudest, most
    defiant gesture on the Span: ordinary people refusing to die beautifully
    on schedule. Let the players carry the truth, scrub it, or expand it, and
    let the suppressed number be a fact they cannot un-know once it lands.

- id: aureate_span_a_perfume_with_a_message
  name: A Perfume That Says Too Much
  description: >-
    A Vaal-Kesh perfumer has released a scent into a salon that does something
    no scent should — it carries a meaning, a name, an accusation, legible only
    to those who know the guild's chemical grammar. Half the room is merely
    enchanted. The other half has gone rigid, because they can read it, and
    what it names is not something anyone was supposed to say in gilded air.
  flavor_tags: [vaal_kesh, intrigue, scandal, court]
  lifespan_turns: 5
  delivery_hints:
    - A new fragrance fills a Promenade salon and one impeccable guest abruptly excuses themselves, unable to keep their face
    - A Vaal-Kesh chemist will, for a consideration, teach a player to read the scent's hidden second meaning
    - The same perfume is offered as a gift to a specific courtier, and the giving of it is plainly a move in some longer game
  narrative_hint: >-
    The chemistry guild's monopoly is also a private language. Let the players
    decode, deliver, or weaponize the scented message, and let what it accuses
    — and who can read it — pull them into a quarrel the perfumed court is
    fighting in a register most of the room can't even smell.
