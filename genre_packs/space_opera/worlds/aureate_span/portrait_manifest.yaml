# Character portraits for The Aureate Span
# Visual descriptions for Flux portrait generation
# Aesthetic: baroque space opera, Heavy Metal / Fifth Element / Barbarella
# maximalist, golden light, theatrical excess, alien beauty

characters:
  # -- IMPERATRIX'S COURT --------------------------------------------------

  - name: Imperatrix Celestine VII
    role: Ruler of the Aureate Span
    type: npc_major
    appearance: >-
      A woman in her early sixties who looks forty and moves like thirty,
      with deep brown skin and silver hair sculpted into an architectural
      updo threaded with living light-filaments that pulse with her
      heartbeat. High cheekbones, a mouth that defaults to amused contempt,
      and eyes that are literally gold — cosmetic implants that let her
      see in the star's full spectrum. Tall, imperious, the posture of
      someone who has never entered a room without owning it. Every
      gesture is choreographed. Every silence is deliberate. She wears
      gowns of living crystal that refract Solenne's light into prismatic
      halos around her body, making her appear perpetually backlit by a
      sunset.
    culture_aesthetic: >-
      Peak Doctrine of Radiance — the ruler as living artwork. Flowing
      crystalline gown in shifting golds and crimsons, a solar diadem
      that projects a miniature corona, bare arms covered in geometric
      gold tattoos that map the station's layout.
    element_visual: >-
      The Solar Diadem — a crown that projects a halo of contained
      plasma, casting warm light on everything within three meters.
      A light-lance concealed in a jeweled bracelet. A small vial of
      Solfire on a chain at her throat.

  - name: Commander Aurien Vex
    role: Captain of the Solarium Guard
    type: npc_major
    appearance: >-
      A lean man in his thirties with pale skin, sharp features, and
      close-cropped platinum hair. Handsome in a blade-like way — all
      angles and economy, nothing soft. His mirrored armor reflects
      the station's golden light, making him look like a walking
      sunrise. Ice-blue eyes that track threats with mechanical
      precision. A thin white scar from left ear to jawline, earned
      in the Arena before his promotion. Moves like a dancer who kills
      people. Absolutely loyal to the Imperatrix in a way that might
      be devotion, might be fanaticism, might be something more
      personal.
    culture_aesthetic: >-
      Solarium Guard elite — full mirrored armor in polished gold-chrome,
      light-lance at the hip, rank insignia as prismatic crystals at
      the collar. The armor is ceremonial and functional; the mirror
      finish redirects energy weapons.
    element_visual: >-
      Light-lance — a weapon that fires concentrated stellar energy,
      harvested from the tethers. Mirrored half-helm with retractable
      visor. The Imperatrix's seal embossed on the breastplate.

  # -- VAAL-KESH -----------------------------------------------------------

  - name: Tivaanu of the Amber Essence
    role: Vaal-Kesh Trade Consul
    type: npc_major
    appearance: >-
      An amphibious being of indeterminate age with smooth, glistening
      skin that shifts from deep teal to warm amber depending on mood.
      Large, dark eyes with horizontal pupils set in a broad, flat face
      that reads as perpetually calm. Webbed hands with long, dexterous
      fingers stained at the tips from chemical work. Shorter than most
      humans, compact, with a fluid grace that suggests underwater
      origins. Wears layered silks in ocean colors — deep blue over
      sea-green over pearl white — that ripple when they move. Their
      voice is soft, melodic, and always sounds like they know something
      you don't.
    culture_aesthetic: >-
      Vaal-Kesh mercantile — layered translucent silks in aquatic tones,
      chemical vials on a bandolier disguised as jewelry, chromatophore
      skin visible at the collar and wrists.
    element_visual: >-
      Bandolier of crystal vials containing trade samples — perfumes,
      pigments, and at least two things that are technically poisons.
      A water-circulation collar that keeps their skin moist in the
      station's dry air.

  # -- CRYSTALLINE CHOIR ---------------------------------------------------

  - name: Kaelith Resonant
    role: Choir Ambassador to the Span
    type: npc_major
    appearance: >-
      A being made of what appears to be living quartz — translucent,
      faceted, roughly humanoid in shape but wrong in the proportions.
      The torso is too long, the arms have an extra joint, and the head
      is a cluster of crystalline formations that refract light into
      rainbows. No visible mouth or eyes; communication comes from
      vibrations in the chest cavity that humans perceive as a rich,
      resonant voice. The body hums constantly at a frequency just
      below human hearing, and standing close produces a sensation of
      profound calm or mild vertigo depending on the listener. Light
      passes through them, casting prismatic shadows.
    culture_aesthetic: >-
      Crystalline Choir — no clothing, no adornment. The body IS the
      aesthetic. Faceted crystal surfaces shift between transparent and
      opaque depending on emotional state. When agitated, internal
      light pulses red-orange. When content, a steady blue-white glow.
    element_visual: >-
      A harmonic amplifier — a resonating crystal worn at the center
      of the chest that focuses their voice for long-range communication
      or, in extremis, weaponized sonic attack.

  # -- MAKHANI -------------------------------------------------------------

  - name: The Calcifier
    role: Makhani Queen / Hive Mother
    type: npc_major
    appearance: >-
      Enormous — three meters tall in her resting configuration, with
      a segmented amber-brown carapace that gleams like polished
      tortoiseshell. Six limbs, the upper pair delicate and precise,
      the middle pair powerful, the lower pair structural. A broad,
      flat head with compound eyes that glow with reflected stellar
      light — warm orange, shifting to deep red. Mandibles that click
      and chitter in patterns too fast for humans to parse. The carapace
      bears centuries of accumulated amber-resin deposits that form
      patterns some humans read as writing and others read as geological
      strata. She moves slowly, deliberately, and the floor vibrates
      when she does. The oldest living thing on the station, and she
      carries that weight visibly.
    culture_aesthetic: >-
      Makhani royal — no clothing but the carapace is decorated with
      amber-resin inlays that record hive history. Bioluminescent
      fungi grow in the joints, casting warm light. Attendant workers
      maintain the deposits constantly.
    element_visual: >-
      A tether-key — a crystallized fragment of magnetic tether energy
      worn in a mandible setting, the symbol of authority over the
      station's life-support. The uncollected time-debt is recorded
      as a pattern in her carapace, visible to those who know how to
      read it.

  # -- CINDER COLLECTIVE ---------------------------------------------------

  - name: Breck
    role: Cinder Collective Leader
    type: npc_major
    appearance: >-
      A stocky woman in her forties with dark skin, close-cropped grey
      hair, and the calloused hands of someone who's spent two decades
      maintaining atmospheric processors. Broad shoulders, strong jaw,
      eyes that are brown and tired and angry in equal measure. No
      cosmetic enhancements, no fashion — she wears a patched utility
      jumpsuit and steel-toed boots, and every part of that is a
      political statement on a station where beauty is law. A burn
      scar covers her left forearm from a plasma conduit rupture that
      killed three of her crew while the Promenade was hosting a
      perfume exhibition. She doesn't smile often, but when she does
      it's because something is about to change.
    culture_aesthetic: >-
      Anti-Doctrine — deliberately utilitarian. Patched grey jumpsuit,
      tool belt, no ornamentation. The absence of beauty IS the
      aesthetic, and it unsettles the aristocracy more than any weapon.
    element_visual: >-
      A salvaged comm unit jury-rigged for encrypted Underspine
      broadcasts. A plasma cutter that doubles as a weapon. The burn
      scar she refuses to have treated.

  - name: Tav
    role: Cinder Collective Strategist
    type: npc_supporting
    appearance: >-
      A thin, nervous man in his late twenties with light brown skin,
      dark curly hair that's never been styled, and the rapid eye
      movement of someone who's always calculating exit routes. Former
      Observatory assistant who was reassigned to the Underspine when
      he tried to publish the stellar decay data. Wears oversized
      spectacles he doesn't need — they're data displays disguised as
      corrective lenses. Moves in quick, birdlike jerks. Talks fast,
      thinks faster, and carries the suppressed Observatory findings
      on a data chip sewn into his collar.
    culture_aesthetic: >-
      Observatory refugee — a threadbare lab coat over Underspine
      utility wear, data-display spectacles, ink-stained fingers
      from hand-copying classified research.
    element_visual: >-
      Oversized spectacles with hidden data displays. A hand-drawn
      star chart tattooed on his right forearm showing Solenne's
      projected decay timeline. The data chip in his collar.

  # ════════════════════════════════════════════════════════════════════
  # PLAYER-PICKER FACES — character-creation portrait pool.
  #
  # Faces a player chooses at chargen. Schema: PortraitManifestEntry —
  # `appearance` is terse (~50 tokens), describes ONE PERSON, face and
  # upper body only. No POI/scene prose in appearance (a second wide
  # description triggers the Z-Image split montage); the backdrop is
  # composed from `backdrop_poi`. Wardrobe is genre-true baroque space
  # opera — Doctrine of Radiance for aristocracy, anti-aesthetic for
  # Cinder. `culture` = culture filename stem; `archetype` = real
  # archetype name (world archetypes.yaml). Every backdrop_poi resolves
  # in r2_manifest.json. Render + R2 sync is a SEPARATE operator step.
  #
  # Allocation: 18 faces across all 5 cultures, sexes balanced (9M / 9F).
  #
  # 2026-07 variety top-up: +5 faces (12M / 11F), same 5 cultures and
  # world archetypes, new occupation labels (Doctrine Archive Sentry,
  # Docking Ring Stevedore, Resonance Cartographer, Amber Essence
  # Alchemist, Calcifier's Chronicler) and widened age/build range — no
  # near-dupes of the original 18. Nonhuman cultures keep this world's
  # established masculine-/feminine-coded `sex: male|female` convention
  # (not nonbinary), matching the existing set.
  # ════════════════════════════════════════════════════════════════════

