- name: The First Song
  era: "pre-station"
  summary: >-
    The Crystalline Choir claims they didn't arrive at the Aureate Span.
    They were called. Before the station existed, before humans reached
    this system, the Choir heard a frequency emanating from Solenne —
    a harmonic pattern too complex to be natural, too sustained to be
    accidental. They followed it across three jump lanes and found a
    dying star that was singing. The Choir built the Resonance Quarter
    to answer that song. They've been in conversation with the star for
    two centuries. They won't say what it's telling them, except that
    it's not dying — it's composing.
  cultural_impact: >-
    The Choir's claim that the star is alive and communicating shapes
    their refusal to support evacuation. To them, leaving would be
    walking out of a concert before the finale.
  affected_cultures: [Crystalline Choir, Makhani]
  terrain_scars:
    - type: anomaly
      name: The Singing Frequency
      region: resonance_quarter
      description: >-
        A persistent harmonic emanating from Solenne that only
        Crystalline Choir members can perceive directly. Human
        instruments detect it as a regular pulse in the star's
        magnetosphere, but the pattern is too complex for stellar
        physics to explain. The Choir says it has been accelerating
        for decades, approaching something they call "resolution."
    - type: architectural
      name: The Unfinished Spire
      region: resonance_quarter
      description: >-
        A crystalline structure growing from the Resonance Quarter's
        highest point, visibly incomplete, that the Choir has been
        singing into existence for forty years. It doesn't match any
        known architectural purpose. The Choir calls it a "response"
        and says it will be finished when the star finishes its song.

- name: The Imperatrix's Wound
  era: "three centuries ago"
  summary: >-
    Imperatrix Celestine I — the dynasty's founder — was an arena
    champion before she was a ruler. The story goes that she fought
    a Makhani champion called the Calcifier in the Corona Arena and
    lost. She should have died. Instead, the Calcifier spared her
    and demanded a time-debt: one favor, to be collected when the
    star required it. Celestine agreed, seized the throne through a
    coup the following week, and the Makhani have held that debt for
    three hundred years. The current Imperatrix, Celestine VII,
    inherited it. The Calcifier — who may or may not be the same
    individual — has never collected. The debt is the reason the
    Imperatrix treats the Makhani as equals. It's also the reason
    she can't order them to do anything, even when the tethers
    start behaving strangely.
  cultural_impact: >-
    The uncollected debt is the foundation of Makhani-human relations
    on the Span. Every Imperatrix inherits it. Every Imperatrix
    fears the day it comes due.
  affected_cultures: [Span Aristocracy, Makhani]
  terrain_scars:
    - type: memorial
      name: The First Arena
      region: corona_arena
      description: >-
        A section of the Corona Arena floor that has never been
        resurfaced — the original tiles from the fight between
        Celestine I and the Calcifier, still bearing scorch marks
        from whatever the Calcifier used as a weapon. Champions
        touch the tiles before combat for luck. The Makhani touch
        them for a different reason they won't explain.

- name: The Solfire Revelation
  era: "twelve years ago"
  summary: >-
    A Vaal-Kesh chemist named Kelossa of the Quiet Drop synthesized
    Solfire — a compound that allows human neurology to perceive
    stellar radiation as structured sound. Users describe hearing
    Solenne as a vast, slow melody with harmonics that suggest
    intentionality. The drug was immediately banned, then unbanned,
    then restricted to licensed salons, then sold openly on the
    Underspine. Kelossa disappeared. The formula persists. The
    uncomfortable question Solfire raises is whether the Crystalline
    Choir's claim about the star singing is literally true, and
    humans just couldn't hear it until a Vaal-Kesh showed them how.
  cultural_impact: >-
    Solfire split opinion on the Span: the Imperatrix sees it as
    art (hearing the star die is beautiful), the Observatory sees
    it as data (the patterns users describe match their suppressed
    stellar decay models), and the Cinder Collective sees it as
    proof that the star is actively dying and nobody in charge cares.
  affected_cultures: [Vaal-Kesh, Span Aristocracy, Cinder Collective]
  terrain_scars:
    - type: cultural
      name: Solfire Salons
      region: the_promenade
      description: >-
        Licensed establishments where patrons inhale Solfire vapor
        and listen to the star. The decor is sparse — reclining
        couches, dim lighting, viewport windows — because the
        experience is the point. Regulars develop a haunted look
        and a tendency to hum in frequencies they can't explain.
    - type: underground
      name: Kelossa's Lab
      region: underspine
      description: >-
        The abandoned Vaal-Kesh laboratory where Solfire was first
        synthesized. Officially sealed by the Imperatrix's order.
        Actually a Cinder Collective meeting point. The walls still
        shimmer with residual compound, and people who spend too
        long inside report hearing the star through the station's
        hull.
