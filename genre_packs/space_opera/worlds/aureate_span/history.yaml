chapters:
  - id: fresh
    label: "Arrival in Radiance"
    session_range: [1, 5]
    description: >-
      The players arrive at the Aureate Span — docking ring customs,
      the Aesthetic evaluation of their ship, first steps onto the
      Promenade under Solenne's eternal golden light. The station is
      dazzling and disorienting. The Imperatrix's Festival of Luminance
      is approaching, drawing visitors from across the sector. The
      players find work, make contacts, and learn the Span's rules:
      beauty is currency, spectacle is politics, and the star outside
      the windows is very pretty and very much dying. Early jobs are
      small — courier runs through the Underspine, escort duty on the
      Promenade, a favor for a Vaal-Kesh chemist. The Cinder Collective
      is a rumor. The Makhani are strange neighbors who hum in the walls.
      The Crystalline Choir's singing is beautiful until you realize
      it's load-bearing.
    events: []
    points_of_interest:
      - name: The Docking Ring
        slug: the_docking_ring
        visual_prompt:
          solo: >-
            Wide establishing view inside a vast curved spacecraft docking crescent in orbit.
            Foreground: riveted functional steel decking and a customs
            checkpoint of bare grey girders, magnetic clamps and fuel
            umbilicals coiled at a docking cradle. Middle ground: the architecture
            transforms inward — bare steel giving way to gilded baroque
            arches, dark-teal panelling inlaid with molten gold, mosaic
            floor unfurling in emerald and oxblood tessellation,
            ornamented columns rising between docking cradles where sleek
            opulent private starcruisers and a battered space freighter rest
            side by side, hulls clamped in armatures above the dry metal deck,
            thruster nacelles and landing struts visible. Background:
            the long crescent curves away through tiered bays into amber
            haze, a plasma-shielded transparent dome revealing the
            amber-red corona of a dying star beyond. Recessed amber
            sconces, warm coronal glow on gilt and steel, calm and
            prosperous, theatrical scale.
        region: docking_ring
        type: spaceport
        description: >-
          The Span's outer crescent of docking bays, customs
          checkpoints, and traveler hostels where ships from
          three jump lanes converge. The architecture shifts
          from functional steel at the edges to gilded baroque
          toward the interior. A Customs Aesthetic official
          evaluates each arriving ship for visual merit and
          charges uglier vessels higher docking fees. This is
          not a joke.
      - name: The Promenade
        slug: the_promenade
        visual_prompt:
          solo: >-
            Wide establishing view down an immense three-kilometre
            boulevard beneath a transparent dome. Foreground: a glittering
            mosaic floor in emerald, gold and oxblood, courtiers in
            towering feathered capes of amethyst and crimson strolling
            past lacquered cafe tables and dueling salons. Middle ground:
            a grand prismatic fountain throws rainbow spray catching the
            light; flanking rows of ornamented gilded columns and recessed
            amber sconces line opera stages and silk pavilions; high
            above, an opulent gold-railed observation balcony juts over
            the crowd. Background: the boulevard recedes for kilometres
            under the vast dome, which looks directly into the amber-red
            corona of a dying star — a permanent sunset filtered through
            plasma shields, saturated amber and molten gold flooding
            everything. Lavish, radiant, untroubled, larger-than-life.
        region: the_promenade
        type: concourse
        description: >-
          A three-kilometer boulevard under a transparent dome
          looking directly into Solenne's corona — warm amber
          light filtered through plasma shields into a
          permanent sunset. Cafes, dueling salons, street
          opera, feathered capes everywhere. A central fountain
          throws prismatic spray; above it, the Imperatrix's
          observation balcony, and she watches.
      - name: The Corona Arena Gate
        slug: corona_arena_gate
        visual_prompt:
          solo: >-
            Wide establishing view of a towering ceremonial gateway spoke.
            Foreground: a broad gilded approach ramp paved in jewel-toned
            mosaic, flanked by colossal ornamented columns and sweeping
            festival banners of crimson, amethyst and gold hanging in
            tiered rows. Middle ground: an immense triumphal arch crusted
            with baroque gold-leaf scrollwork and sunburst haloes frames
            the processional spoke leading inward; recessed amber sconces
            glow along dark-teal walls; a few caped figures stand small
            beneath the arch for scale. Background: beyond the gateway the
            corridor opens toward a vast plasma-painted dome where the
            amber-red corona of a dying star blazes overhead, the festival
            arena's curved upper galleries glimpsed faintly through the
            glow. Saturated amber and molten gold light, triumphant,
            opulent, theatrical grandeur.
        region: corona_arena
        type: arena
        description: >-
          The outer gate and standing floor of the gladiatorial
          colosseum built into the station's sun-facing hull.
          The dome is a single curved viewport into Solenne's
          surface. Solar flares punctuate the afternoon's
          lesser matches, and champions train by fighting
          their own shadows against the star.
      - name: The Underspine Markets (Outer)
        slug: underspine_markets_outer
        visual_prompt:
          solo: >-
            Wide establishing view inside the station's belly, a working
            market at the outer edge. Foreground: a cluttered chemical
            stall of glinting apothecary glassware, perfume vials and
            stacked carved cases of mineral pigments in emerald, oxblood
            and amethyst, hanging silk banners overhead. Middle ground: a
            crowded bazaar lane lined with lacquered booths and
            chromatophore-skinned alien traders, ribbons of ozone haze
            drifting under harsh blue-white fluorescent strips, gilded
            ornament beginning to creep up the older columns. Background:
            a second-story tier of shadowed shuttered windows looks down
            on the lane, watchful silhouettes within; the belly curves
            away into smoky teal gloom shot through with cold electric
            light. Saturated jewel tones against industrial glare, dense,
            alive, faintly conspiratorial.
        region: underspine
        type: market
        description: >-
          The edge of the station's belly: blue-white
          fluorescent light, the smell of ozone and alien
          spice, and the Vaal-Kesh chemical stalls where the
          unregulated business gets done. Courier runs into
          the Underspine start and end here. The Cinder
          Collective watches from second-story windows and
          does not acknowledge being watched.
      - name: The Resonance Quarter Threshold
        slug: resonance_quarter_threshold
        visual_prompt:
          solo: >-
            Wide establishing view of the outer wall of an alien
            sung-crystal district. Foreground: a small visitor threshold
            of pale grown stone, racks of slender harmonic dampener rings
            beside a resonant floor that ripples with faint color. Middle
            ground: enormous smooth acoustic parabolas and curved
            shell-like vaults of prismatic living crystal rise overhead —
            sung into existence rather than built, seamless and organic,
            shimmering amethyst, emerald and gold where coronal light
            refracts through them. Background: the curved crystalline
            forms recede into a luminous district interior, glowing from
            within, a plasma-shielded aperture revealing the amber-red
            corona of a dying star beyond, bathing the crystal in molten
            amber. Saturated iridescence, hushed, otherworldly, suffused
            with refracted light.
        region: resonance_quarter
        type: alien_district
        description: >-
          The outer wall of the Crystalline Choir's district —
          curved acoustic parabolas sung into existence, not
          built. A visitor centre distributes harmonic
          dampeners at the threshold and explains that the
          floors resonate differently depending on mood, and
          that walking through certain frequencies without
          dampeners can induce involuntary emotional states.
          They mean involuntary.

  - id: early
    label: "The Festival of Luminance"
    session_range: [6, 12]
    description: >-
      The Festival erupts — a week of gladiatorial games, operatic
      performances, and political maneuvering disguised as art
      criticism. The Imperatrix announces a Grand Championship in the
      Corona Arena with a prize that gets everyone's attention: a
      private audience and a single granted wish. Factions scramble to
      sponsor champions. The Vaal-Kesh push a new drug called Solfire
      that lets users perceive stellar radiation as music — it's
      addictive and revelatory and the Imperatrix hasn't decided
      whether to ban it or mandate it. The Cinder Collective makes
      its first public move: sabotaging a spectacle to broadcast a
      message about the star's accelerating decay. The Observatory's
      suppressed findings start leaking. Someone is arming the
      Underlevel. The Makhani go quiet — their tether-songs change
      pitch, and the Calcifier requests a private audience with the
      Imperatrix for the first time in decades.
    events: []
    points_of_interest:
      - name: The Corona Arena (Championship Floor)
        slug: corona_arena_championship
        visual_prompt:
          solo: >-
            Wide establishing view inside a colossal circular arena at
            festival peak. Foreground: the polished mosaic floor of the
            central ring, a golden processional spoke inlaid into the
            stone leading toward the centre, scattered with strewn petals.
            Middle ground: tiered galleries packed with opulent staging,
            towering banners of living iridescent fabric rippling along
            the rim, gilded baroque balustrades and ornamented columns
            ringing the bowl, and a raised golden box draped in oxblood at
            the north end. Background: an immense transparent
            plasma-shielded dome filling the upper frame, the seething
            amber-red surface of a dying star painted across it edge to
            edge, prismatic living-crystal fixtures refracting that light
            into shifting chords. Hyper-saturated molten-gold and crimson
            glow, coronal light flooding the ring, theatrical and
            ceremonial grandeur.
        region: corona_arena
        type: arena
        description: >-
          The arena at Festival pitch: banners of living
          fabric unfurled along the rim, the star's surface
          painted across the dome by precision plasma
          shielding, and the Imperatrix's golden box at the
          north end. A champion's grand procession enters on
          the spoke and circles to the centre; the crowd
          reads the procession as a sentence whose grammar
          is victory-or-beauty.
      - name: The Palace Solaris (Throne Concert Hall)
        slug: palace_solaris_throne_hall
        visual_prompt:
          solo: >-
            Wide establishing view of a vast throne hall run as a concert
            chamber. Foreground: a single marked petitioner's stone set
            into a deep mosaic floor of teal and gold, a clear place where
            one would stand alone. Middle ground: soaring walls of living
            crystal rising in faceted tiers, each facet refracting the
            star's light into moving prismatic chords of amethyst, emerald
            and rose that wash across the room; a tall gilded throne of
            grown crystal on a stepped dais, and a row of guards in
            mirrored armour standing along the west wall, reflecting the
            colored light. Background: ornamented gold-leaf columns over
            dark-teal panelling receding toward a domed apse, the
            amber-red corona glowing faintly beyond high crystalline
            windows. Saturated jewel-toned light scattering everywhere,
            opulent and resonant, ceremonial and electric.
        region: the_palace_solaris
        type: palace
        description: >-
          The Imperatrix Celestine VII's throne room, run as a
          concert hall. Living crystal walls refract Solenne's
          light into moving prismatic chords that change with
          the star's temperament. Audiences with the Imperatrix
          are performed, not held — the petitioner takes a
          position on the marked stone and the light renders
          their case as music. The Solarium Guard stand in
          mirrored armour along the west wall.
      - name: The Grand Resonator
        slug: the_grand_resonator
        visual_prompt:
          solo: >-
            Wide establishing view of a towering cathedral-like chamber
            that is also a machine. Foreground: a polished mosaic floor
            radiating in concentric gold rings toward a single suspended
            crystal core at the centre, fine bright filaments threading
            into it. Middle ground: immense fluted crystal pillars rising
            like organ pipes around the core, each one humming with
            visible standing-wave shimmer, gilded baroque arches and
            tiered galleries of sung-crystal lattice catching the light,
            with newer luminous strands woven freshly through the older
            structure. Background: a high vaulted dome of interlaced
            crystal ribs soaring overhead, the amber-red corona glowing
            through translucent panes far above, prismatic chords
            scattering across every surface. Hyper-saturated emerald, gold
            and rose light, a deep resonant sustained glow, sacred and
            immense and faintly trembling.
        region: resonance_quarter
        type: alien_landmark
        description: >-
          The central structure of the Crystalline Choir's
          quarter: a cathedral and a weapon, both at once. A
          single sustained chord at the centre of the chamber
          is what holds the station's structural integrity in
          place. During the Festival, the Choir has begun
          threading new notes through the chord — small,
          precise, and none of them answered by any other
          instrument on the Span.
      - name: The Makhani Nexus
        slug: the_makhani_nexus
        visual_prompt:
          solo: >-
            Wide establishing view down a labyrinthine hive corridor built
            from hardened resin. Foreground: a warm amber-resin tunnel
            mouth, its translucent walls swirling with honeyed gold and
            deep oxblood, ribbed and organic, with clusters of
            bioluminescent fungi glowing teal and violet along the lower
            edges. Middle ground: branching passages of varying diameter —
            some worker-narrow, some vast and queen-wide — their resin
            walls lit from within, gilded baroque ornament fused into the
            secreted curves, hanging combs and dripping amber stalactites.
            Background: a great rounded chamber deep in the hive where the
            corridors converge, glowing molten gold from concealed light,
            a haze of warm sweet vapour softening the depth.
            Hyper-saturated amber and crimson glow shot through with cool
            bioluminescent accents, intimate and humming, opulent and
            alive.
        region: makhani_nexus
        type: hive
        description: >-
          The hive-district of the Makhani: chambers built from
          resinous secretion hardened into amber walls,
          labyrinthine passages sized for everything from
          worker-scale to tunnel-diameter queens. The air is
          warm and sweet, and bioluminescent fungi thread
          the corridors. The Calcifier — the ancient queen —
          is spoken of as oldest living thing on the station.
      - name: The Tether Works
        slug: the_tether_works
        visual_prompt:
          solo: >-
            Wide establishing view of a brutal industrial cavern at the
            station's anchoring edge. Foreground: a reflective shielded
            gantry of scarred steel and gold-trimmed plating,
            heat-shimmer rising off the metal. Middle ground: colossal magnetic
            tether pylons rising in parallel ranks, sheathed in baroque
            gilded casings and ringed with glowing coils, arcs of
            contained stellar energy crackling white-gold between them;
            small carved shrines and offerings of amber resin pressed
            against their bases. Background: the pylons converging toward
            a vast open aperture where the seething amber-red corona of
            the dying star pours in, its surface filling the upper frame
            in churning crimson and molten gold, blistering light flooding
            through plasma shielding. Hyper-saturated incandescent gold
            and oxblood glare, overwhelming heat-haze, reverent and
            dangerous and immense.
        region: tether_works
        type: infrastructure
        description: >-
          The magnetic tether anchors that suspend the Span in
          Solenne's corona — massive industrial pylons humming
          with contained stellar energy. The heat is brutal
          even through reflective shielding. The Makhani
          treat the tethers as religious artifacts and the
          work as worship, and their tether-songs have
          recently begun changing pitch in ways no one
          outside the hive understands.
      - name: The Observatory (Lounge and Telescope)
        slug: the_observatory
        visual_prompt:
          solo: >-
            Wide establishing view of an opulent zenith lounge crowning
            the station. Foreground: a curved lacquered bar of dark teal
            and gold set with prismatic glassware and jewel-colored
            cocktails, low plush seating arranged before the view. Middle
            ground: a soaring transparent domed ceiling, a great gilded
            telescope on a baroque mounting angled toward the stars,
            delicate brass and crystal instruments ringing the chamber,
            ornamented columns and a mosaic floor underfoot, a few
            cushioned meditation alcoves along the rim. Background:
            through the dome, the full sweep of the dying star — its
            amber-red corona bleeding into deep cosmic teal and amethyst,
            distant glittering stars scattered across the dark, a thin
            troubling flicker at the star's edge. Hyper-saturated gold,
            rose and violet glow, serene and lavish, quietly luminous
            beneath a vast cosmic ceiling.
        region: the_observatory
        type: research
        description: >-
          A research station and stargazing lounge at the
          Span's zenith, directly above the Palace Solaris.
          Astronomers, stellar physicists, and mystics study
          Solenne's death through instruments and meditation.
          The lounge serves excellent cocktails and has the
          best view in the sector. The chief astronomer's
          classified paper about Solenne's accelerating decay
          sits in three locked drawers around the building.

  - id: mid
    label: "The Doctrine Fractures"
    session_range: [13, 20]
    description: >-
      The suppressed truth becomes undeniable: Solenne's decay is
      accelerating, and the Span has decades, not centuries. The
      Imperatrix's response is pure Doctrine of Radiance — she
      commissions the greatest opera ever staged, to be performed
      as the star dies. The Cinder Collective calls it insanity and
      launches open revolt in the Underspine. The Vaal-Kesh seal
      their markets and prepare to evacuate. The Crystalline Choir's
      Grand Resonator begins emitting frequencies nobody has heard
      before — the Choir claims they're singing a new structure into
      existence, something that could survive the supernova. The
      Makhani reveal they've known the timeline all along and have
      been adjusting the tethers not to save the station but to aim
      it. The Imperatrix, the Calcifier, the Choir, and the Collective
      each have a plan. They're incompatible. The players are in
      the middle.
    events: []
    points_of_interest:
      - name: The Underspine (Barricades)
        slug: underspine_barricades
        visual_prompt:
          solo: >-
            Wide establishing view down a vast vaulted station artery in
            open revolt. Foreground: a towering barricade of salvaged hull
            plating and overturned market carts, lashed with crimson and
            gold cloth sashes, draped silk banners now torn and knotted as
            flags. Middle ground: rows of recessed fluorescent strips
            reshaded sullen blood-red by stretched fabric, casting
            everything in molten oxblood and amber glow, gilded baroque
            columns half stripped of their gold leaf where steel shows
            through, mosaic floor littered with spilled mineral pigments
            and shattered glassware. Background: a giant childlike scrawl
            three metres high sweeping across a far gilded wall, the deep
            teal corridor receding into red-lit haze. Hot, defiant,
            theatrical unrest, smoke catching the sullen light.
        region: underspine
        type: warzone
        description: >-
          The station's belly under open revolt. The Cinder
          Collective has thrown up barricades of salvaged
          hull plating and overturned market carts across
          the main arteries. The fluorescent light has been
          reshaded by cloth sashes to a sullen red. Graffiti
          quotes the Observatory's suppressed paper, verbatim,
          in a child's handwriting three metres high.
      - name: The Doctrine Archive
        slug: the_doctrine_archive
        visual_prompt:
          solo: >-
            Wide interior view of a vast circular clockwork library inside
            a gilded domed palace hall. Foreground: a polished mosaic
            floor with inlaid gold sunburst patterns, an ornate writing
            lectern angled toward the viewer stacked with quills and bound
            folios. Middle ground: tiers of curved bookshelves arranged in
            concentric rings, each ring mounted on exposed brass clockwork
            gears mid-rotation, shelves swivelling to present open
            volumes, amethyst and emerald spines, gold-leaf edging
            glinting. Background: a towering plasma-shielded dome looking
            into the amber-red corona of a dying star, coronal light
            pouring down across the rings. Warm molten-gold and oxblood
            light, theatrical, opulent, hushed and grandiose, dust motes
            drifting in coronal shafts.
        region: the_palace_solaris
        type: library
        description: >-
          The Imperatrix's philosophical writings, enforced as
          law, stored in a circular library where each shelf
          rotates on its own clockwork to present the passages
          relevant to the day's rulings. The Imperatrix is
          composing the libretto of her Supernova Opera here,
          in a hand so steady it is visibly the writing of
          someone who has decided.
      - name: The Calcifier's Chamber
        slug: the_calcifiers_chamber
        visual_prompt:
          solo: >-
            Wide intimate interior of a single rounded resinous dome, an
            ancient hive sanctum. Foreground: an amber-resin floor pooling
            like cooled honey, thick humming cords of living tether-line
            entering from the edges and snaking inward, faintly vibrating.
            Middle ground: the colossal pale shape of an ancient enthroned
            hive-queen at the centre, glowing with a soft internal light,
            surrounded by clustered bioluminescent fungi in gold, teal and
            amethyst dotting the curved resin walls. Background: the high
            domed ceiling of translucent amber resin glowing honey-warm
            from within, veined with deeper oxblood seams. Hushed, sacred,
            golden bioluminescent light, warm and womb-like, slow and
            reverent, motes of spores drifting.
        region: makhani_nexus
        type: hive_sanctum
        description: >-
          The innermost chamber of the Makhani Nexus, where
          the ancient queen holds her slow council. The room
          is a single resinous dome, honey-lit by bioluminescent
          fungi and the Calcifier's own faint internal glow.
          Tether-lines enter the chamber as physical cords,
          humming audibly. The queen speaks through a
          translator-attendant whose voice is her own by the
          end of each sentence.
      - name: The Choir's Seed-Chamber
        slug: the_choirs_seed_chamber
        visual_prompt:
          solo: >-
            Wide interior view of a newly-grown crystalline chamber at the
            heart of a sung-crystal quarter. Foreground: faceted crystal
            growths rising from a mirror-smooth floor, edges refracting
            the star's light into emerald, amethyst and gold shards across
            the ground. Middle ground: an enormous crystalline lattice
            structure, hollow at its centre, its translucent branches
            visibly extending and thickening, glowing from within with
            teal and gold resonance, surrounding facets ringing with
            caught light. Background: the curved sung-crystal walls of the
            quarter rising into a luminous vault, the amber-red corona of
            a dying star refracted through the lattice into a cathedral of
            coloured beams. Awed, alien, shimmering, saturated,
            theatrical, harmonic light pulsing through prismatic depth.
        region: resonance_quarter
        type: alien_construction
        description: >-
          A newly-sung chamber at the heart of the Resonance
          Quarter where the Crystalline Choir has begun
          assembling a thing they claim is not yet a ship:
          a crystalline lattice, hollow at the centre,
          growing visibly whenever the Grand Resonator hits
          a particular minor chord. Visitors without
          dampeners experience the chamber as either rapture
          or seizure; the Choir says both responses are
          correct.
      - name: The Docking Ring (Evacuation Queue)
        slug: docking_ring_evac_queue
        visual_prompt:
          solo: >-
            Wide establishing view of a jammed grand docking promenade at
            the moment of public panic. Foreground: a coiling
            kilometre-long queue snaking through ornate corridors, baroque
            finery in molten gold and oxblood pressed shoulder to shoulder
            with ragged smuggler garb, piled luggage, overflowing trunks
            and bundled silk. Middle ground: towering gilded docking
            arches and ornamented columns, idle customs gates flung open
            and unmanned, hanging banners, the dense crowd receding in
            tiers under amber sconces. Background: a vast plasma-shielded
            viewport filled with the amber-red corona of a dying star,
            docked ships silhouetted against the glow. Tense, opulent,
            theatrical desperation, hot amber and crimson light,
            glittering and crowded, anxious haze.
        region: docking_ring
        type: spaceport
        description: >-
          The Docking Ring at the moment the truth became
          public: a kilometre of queue coiled through every
          available corridor, baroque finery next to smuggler
          rags, diplomats next to refugees. The Customs
          Aesthetic stopped charging docking fees at noon and
          was last seen weeping in a side office without
          leaving.

  - id: veteran
    label: "The Last Performance"
    session_range: [21, 30]
    description: >-
      Solenne does not simply die. As the corona contracts, the thing
      the Makhani have been steering the whole station toward — a vast,
      patient geometry coiled in the stellar core, older than the star
      that grew up around it — begins to wake, and to answer the
      Choir's two-hundred-year song. The supernova is not a disaster.
      It is a curtain. And the entire Span, finally, understands that
      it has been the orchestra all along. The question was never
      whether you can get out — nobody gets out, and the Span has
      always known it. The question is what note you choose to end on.
      The Imperatrix throws open the Palace and conducts the greatest
      opera ever staged, the supernova for a finale and the whole
      station for a chorus, and she means it as the most beautiful act
      a civilization can perform. The Makhani begin the Communion —
      flinging the Span like a thrown coin into the waking thing in the
      core, certain it will catch them, with no intention of explaining
      what "caught" means. The Crystalline Choir's seed-ship, a
      cathedral of sound that has been singing itself together for
      forty years, prepares to leap on the shockwave and carry the
      finale somewhere the universe can still hear it. And the Cinder
      Collective, who never believed in any of it, throw the most
      magnificent middle finger in the sector — a ragged armada of
      welded escape pods punching out through a wall of dying starlight,
      survival itself as the ultimate act of defiant style. The players
      do not pick a lifeboat. They pick a meaning: the Imperatrix's
      perfect ending, the Makhani's cosmic gamble, the Choir's
      transcendence, or the Collective's beautiful refusal to play
      along. Every one of them is, in its own way, a way to be
      magnificent NOW. Choose the one you can sing.
    events: []
    points_of_interest:
      - name: The Throne Room Under the Dying Star
        slug: throne_room_dying_star
        visual_prompt:
          solo: >-
            Wide establishing view inside a colossal palace throne hall,
            the supernova breaking outside. Foreground: a sweeping gilded
            floor of inlaid mosaic fanning toward a raised dais, an empty
            conductor's lectern catching the light. Middle ground:
            towering living-crystal walls splitting the incoming glare
            into impossible new colors — prismatic violets, searing
            magentas, bottle-greens never seen before — banners of
            cloth-of-gold hanging between fluted baroque columns, ranked
            silhouettes of armored guards in mirrored formation.
            Background: a vast curved dome-viewport filled edge to edge
            with the seething amber-red surface of the dying star,
            churning gold and blood plasma. Blinding terminal coronal
            light floods the hall, molten and apocalyptic, every gilded
            surface ablaze, opera-house grandeur at the end of the world.
        region: the_palace_solaris
        type: palace
        description: >-
          The Palace Solaris's throne room as the supernova
          begins. Solenne's surface fills the dome-viewport
          from edge to edge. The living crystal walls refract
          the dying light into frequencies no one has seen
          before. The Imperatrix conducts her opera from the
          throne, the Solarium Guard in formation around her,
          and the audience present because leaving is no
          longer a gesture with meaning.
      - name: The Crystalline Seed-Ship
        slug: the_crystalline_seed_ship
        visual_prompt:
          solo: >-
            Wide upward establishing view of an immense crystalline vessel
            under construction inside a vaulted quarter. Foreground: a
            polished resonance floor scattered with tuning sigils, slender
            singers' platforms ringing an open shaft. Middle ground: a
            hollow translucent lattice the size of a cathedral, faceted
