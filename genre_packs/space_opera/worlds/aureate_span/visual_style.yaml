# Maximalist Art Nouveau (Mucha / Privat-Livemont) — painterly illustration,
# NOT comic. Comic refs (Métal Hurlant / Moebius / Druillet) and the "bold
# contour / flat cel" linework clause were removed 2026-05-29: they drove
# heavy black-ink cartoon cel. Target is painterly stained-glass illustration
# with luminous gradient shading and delicate line. Z-Image Turbo handles dense, saturated
# ornament that Flux flattened into restrained Klimt — so this suffix is
# deliberately unrestrained: ornament FILLS the frame, color is turned
# all the way up. Style/medium/palette vocabulary only (no concrete
# locations) so it doesn't bleed scenery into portraits. See
# PROMPTING_Z_IMAGE.md.
positive_suffix: >-
  Maximalist Art Nouveau illustration in the tradition of Alphonse Mucha
  and Privat-Livemont. Lavish ornament edge to edge —
  whiplash floral curves,
  interlaced filigree, mosaic and stained-glass panelling, sunburst
  haloes and arabesque borders that frame and crowd the subject. Soft
  painterly rendering, luminous gradient shading and rich tonal modeling,
  delicate fine linework kept subordinate to the painted form. Hyper-saturated jewel palette
  — molten gold, deep teal, oxblood, amethyst and emerald — lit by
  electric neon accents and warm amber coronal light. Gold-leaf used
  generously, gilding everything. Dramatic angular composition, theatrical
  larger-than-life staging, opulent and excessive mood, cosmic grandeur.
  No text, no caption, no title, no writing, no signature, no labels,
  no watermark, no museum or gallery captions, no modern UI overlays.

preferred_model: dev

base_seed: 42

visual_tag_overrides:
  bridge: "imperial flagship bridge, gilded baroque consoles, mirrored officer armor, viewport filled with the amber-red corona of a dying star"
  station: "vast gilded promenade under a transparent dome looking into the corona, ornamented columns, mosaic floor, courtiers in opulent dress"
  cantina: "Underspine lounge, low warm lantern light through perfumed haze, lacquered booths, Vaal-Kesh chromatophore patrons"
  market: "Underspine bazaar, hanging silk banners, apothecary glassware, perfume vials, mineral pigments stacked in carved cases"
  corridor: "ornamented station corridor, gold-leaf inlay along dark teal panels, recessed amber sconces, mosaic underfoot"
