# Aureate Span — World Visual Style
# Vienna Secession / Alphonse Mucha applied to a baroque megastation in
# the corona of a dying star. The Imperatrix Celestine's gilded court,
# opera-house grandeur, weaponized beauty. Mucha is the native visual
# language here — gold leaf, jewel tones, ornamental restraint, theatrical
# silhouette against the wall of amber-red light that is Solenne.
#
# WIRING: positive_suffix layers into ART_SENSIBILITY.WORLD on top of
# the genre-level neutral baseline. The genre file carries the universal
# anti-text-bleed safety clause; this file does not repeat it.
#
# Z-Image Turbo runs at guidance_scale=0 and ignores negative_prompt
# entirely (see sidequest-content/PROMPTING_Z_IMAGE.md).

positive_suffix: >-
  Vienna Secession poster illustration, in the tradition of Alphonse
  Mucha and Koloman Moser. Bold black contour linework with visible
  ink-line weight variation, flat color fields, jewel-tone palette of
  gold, deep teal, and oxblood. Dramatic angular composition with a
  clear focal subject and strong silhouette. Restrained geometric
  ornament along the outer edges, sparing gold-leaf accent used as
  highlight only and never filling the frame. Baroque megastation
  interiors of gilded vaults, mirrored armor, and opera-house
  proscenia; exteriors framed against the wall of amber-red corona
  light from a dying red giant filling the sun-facing viewports.
  The Imperatrix's court reads as theatrical tableau — every figure
  posed, every surface ornamented, every shadow placed.

negative_prompt: ""

preferred_model: dev

base_seed: 42

visual_tag_overrides:
  bridge: "imperial flagship bridge, gilded baroque consoles, mirrored officer armor, viewport filled with the amber-red corona of a dying star"
  station: "vast gilded promenade under a transparent dome looking into the corona, ornamented columns, mosaic floor, courtiers in opulent dress"
  cantina: "Underspine lounge, low warm lantern light through perfumed haze, lacquered booths, Vaal-Kesh chromatophore patrons"
  market: "Underspine bazaar, hanging silk banners, apothecary glassware, perfume vials, mineral pigments stacked in carved cases"
  corridor: "ornamented station corridor, gold-leaf inlay along dark teal panels, recessed amber sconces, mosaic underfoot"
