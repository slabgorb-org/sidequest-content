world_name: The Aureate Span
setting_anchor: >-
  A decadent megastation orbiting inside the corona of Solenne, a red
  giant star that's been dying for ten thousand years and still hasn't
  gotten around to it. The Aureate Span is the jewel of the sector —
  gorgeous, corrupt, and running out of time.
history: >-
  Solenne was a yellow dwarf once, unremarkable except for its position
  at the intersection of three jump lanes. When it began to swell into
  a red giant, the colonists on its inner worlds evacuated. The outer
  worlds held. A consortium of architects and mad visionaries saw
  opportunity in the dying light — they built the Aureate Span, a
  ring-station suspended in the star's upper corona by magnetic tethers
  and shielded by technology nobody fully understands anymore. The
  station was designed as a monument: a place where civilization could
  watch a star die in luxury.

  That was six hundred years ago. The Imperatrix dynasty seized control
  three centuries back, turning the Span from an art installation into
  a seat of power. The current ruler, Imperatrix Celestine VII, governs
  through a philosophy she calls the Doctrine of Radiance — the belief
  that beauty is authority, spectacle is law, and the dying star is
  proof that nothing lasts, so everything must be magnificent NOW.
  She enforces this through the Solarium Guard, gladiatorial games in
  the Corona Arena, and an opera house that doubles as a court of law.

  The Vaal-Kesh arrived two centuries ago — amphibious traders from a
  water world three jumps out, with chromatophore skin and a gift for
  chemistry that makes them the sector's premier poison-makers,
  perfumers, and pharmacists. They run the Underspine markets and
  control most recreational substances on the Span.

  The Crystalline Choir came next — silicon-based entities that
  communicate through harmonic resonance and literally sing their
  architecture into existence. They built the Resonance Quarter and
  provide the station's structural maintenance in exchange for
  acoustic territory — zones where only their frequencies are permitted.

  The Makhani are the oldest non-human presence, predating the station
  itself. Insectoid, hive-organized, and obsessed with the dying star,
  they maintain the magnetic tethers that keep the Span from falling
  into Solenne's photosphere. They worship the star. They may be the
  only ones who know when it will actually die. They're not telling.

  Beneath the gilded surface, the Span runs on exploitation. The
  Underlevel — the station's industrial guts — houses thousands of
  workers who maintain the systems the upper levels take for granted.
  A resistance movement called the Cinder Collective has been growing
  there, led by people who think the Imperatrix's obsession with
  beauty is a distraction from the fact that the star is genuinely
  dying and nobody has an evacuation plan.
factions:
  - name: The Imperatrix's Court
    summary: "Imperatrix Celestine VII rules the Aureate Span through the Doctrine of Radiance"
    description: >-
      Imperatrix Celestine VII rules the Aureate Span through the
      Doctrine of Radiance — the belief that beauty is authority and
      spectacle is governance. Her court is a performance; audiences
      are operas, disputes are settled by aesthetic merit, and the
      Solarium Guard enforces her will in mirrored armor with
      light-lances. She controls the Palace Solaris, the Corona Arena,
      and the Promenade. She knows the star is dying and has decided
      that the correct response is to make the death beautiful. She
      is not insane. She is an artist who has decided the medium is
      civilization itself.
    disposition: imperious
  - name: Vaal-Kesh Trade Consortium
    summary: "Amphibious traders with chromatophore skin and a gift for chemistry"
    description: >-
      Amphibious traders with chromatophore skin and a gift for
      chemistry. They control the Underspine markets and most
      recreational substances on the station, including Solfire — a
      compound that lets humans hear stellar radiation as music.
      Their trade consul, Tivaanu of the Amber Essence, is the
      most connected being on the station. The Vaal-Kesh are
      pragmatists: they will trade with anyone, sell anything, and
      leave before the bill comes due. They have evacuation ships
      pre-fueled in the docking ring.
    disposition: mercantile
  - name: The Crystalline Choir
    summary: "Silicon-based entities that communicate through harmonic resonance and sing their architecture into existence"
    description: >-
      Silicon-based entities that communicate through harmonic
      resonance and sing their architecture into existence. They
      built the Resonance Quarter and maintain the station's
      structural integrity through the Grand Resonator — which is
      both a cathedral and a weapon. They claim Solenne is not dying
      but composing, and they've been building an unfinished
      crystalline structure in response to the star's song for forty
      years. They will not evacuate. They consider leaving to be
      walking out of a concert before the finale.
    disposition: alien
  - name: The Makhani Hive
    summary: "Insectoid hive-beings who predate the station"
    description: >-
      Insectoid hive-beings who predate the station. They maintain
      the magnetic tethers that keep the Span from falling into the
      star, and they worship Solenne as a living entity. Their queen,
      the Calcifier, holds an uncollected time-debt over the
      Imperatrix dynasty — a favor owed since Celestine I lost an
      arena fight three centuries ago. The Makhani know when the star
      will die. They are adjusting the tethers not to save the station
      but to aim it at something in the star's core. They are not
      telling anyone what.
    disposition: inscrutable
  - name: The Cinder Collective
    summary: "An Underlevel resistance movement of human workers, Vaal-Kesh defectors, and rogue Makhani"
    description: >-
      An Underlevel resistance movement of human workers, Vaal-Kesh
      defectors, and rogue Makhani. Led by Breck, a maintenance
      foreman who lost three crew to a plasma conduit rupture while
      the Promenade hosted a perfume exhibition. The Collective
      believes the Imperatrix's Doctrine of Radiance is a death cult
      disguised as an art movement, and that the station needs an
      evacuation plan, not a final opera. They've been building crude
      escape pods in the Underspine and stockpiling the Observatory's
      suppressed stellar decay data.
    disposition: revolutionary
cosmology: >-
  The Doctrine of Radiance is the Span's state philosophy, not quite
  a religion but enforced like one. It holds that beauty is the only
  honest response to mortality — that since the star will die and take
  everything with it, the only meaningful act is to make the interim
  magnificent. The Imperatrix is its high priestess. The Crystalline
  Choir has its own cosmology: Solenne is composing, and the universe
  is an audience. The Makhani worship the star directly, tending the
  tethers as a form of prayer, and believe something waits inside the
  stellar core — something that predates the star and will survive its
  death. The Cinder Collective's cosmology is brutally simple: the star
  is dying, physics doesn't care about beauty, and anyone who isn't
  building a lifeboat is dancing on a grave. The Vaal-Kesh don't have
  a cosmology. They have an exit strategy.
geography: >-
  The Aureate Span is a ring-station suspended in the upper corona of
  Solenne, a red giant star at the intersection of three jump lanes.
  The station is enormous — three kilometers across at its widest,
  with the Promenade running the full circumference under a transparent
  dome that looks directly into the star. The Palace Solaris grows from
  the station's spine like a crown. The Corona Arena is built into the
  sun-facing hull. The Resonance Quarter, Makhani Nexus, and Tether
  Works occupy the station's structural core. The Underspine runs
  beneath everything — industrial decks, markets, and the machinery
  that keeps the upper levels alive. The Docking Ring curves along the
  station's outer edge, where ships from three jump lanes arrive. The
  Observatory sits at the zenith, looking up and away from the star.
  Solenne itself is the dominant feature: a wall of amber-red light
  that fills every viewport on the sun-facing side, beautiful and
  terrifying and always there.
