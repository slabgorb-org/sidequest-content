- id: origins
  title: Where Are You From?
  narration: |
    Before there's a ship's manifest with your name on it, before there's a
    door you walk through into the rest of your life — there's the place you
    came from. You can hear it in your own voice when you're tired. You can
    feel it in the way you carry your weight, the way you eye an exit, the
    way you sleep.

    Where did you start?
  loading_text: "The answer settles into place..."
  choices:
    - label: The Core
      description: >-
        Bright cities, polished schools, a life that ran on rails laid down
        before you were born. Every advantage was waiting. You walked away
        from all of them.
      mechanical_effects:
        race_hint: Coreworlder
        background: Core-educated
        jungian_hint: outlaw
    - label: The Frontier
      description: >-
        Hard ground, tight communities, a horizon that stayed empty no matter
        how long you watched it. You learned to fix what broke because the
        nearest help was three days out and didn't always come.
      mechanical_effects:
        race_hint: Colonial
        background: Frontier-raised
        jungian_hint: everyman
    - label: The Void
      description: >-
        You were born in transit — a station corridor, a ship's mid-deck, a
        habitat orbiting something nameless. Gravity is a place you visit.
        The black isn't hostile to you; it's home.
      mechanical_effects:
        race_hint: Spacer
        background: Void-born
        jungian_hint: explorer
    - label: A Made Place
      description: >-
        You weren't born — you were begun. Grown, woken, compiled, declared
        viable. Your earliest memory is fluorescent light and someone watching
        through a transparent panel to see how you'd react.
      mechanical_effects:
        race_hint: Uplifted
        background: Constructed
        jungian_hint: magician
  allows_freeform: true

- id: pronouns
  title: "Who Are You?"
  narration: >-
    Records exist. Manifests, rosters, registries — the places your name
    appears in someone else's filing system. How should yours read?
  allows_freeform: true
  choices:
    - label: "she/her"
      description: "She walks her own path."
      mechanical_effects:
        pronoun_hint: "she/her"
    - label: "he/him"
      description: "He forges his own way."
      mechanical_effects:
        pronoun_hint: "he/him"
    - label: "they/them"
      description: "They answer to no one's expectations."
      mechanical_effects:
        pronoun_hint: "they/them"

- id: crucible
  title: What Did You Do Before This?
  narration: |
    Whatever brought you to this point, you didn't arrive empty. You came
    with skills, with habits, with a particular way of moving through
    trouble. People notice that about you before they know your name.

    What did you do, before?
  choices:
    - label: I Gave Orders
      description: >-
        Military, command, the weight of other people's lives on your
        decisions. You know what it costs to be the one who says go.
      mechanical_effects:
        class_hint: Officer
        personality_trait: decisive
        jungian_hint: ruler
        rpg_role_hint: support
    - label: I Fixed Things
      description: >-
        Engines, systems, bodies — whatever was broken, you made it work
        again. Sometimes with the right parts. Usually without.
      mechanical_effects:
        class_hint: Engineer
        personality_trait: methodical
        jungian_hint: magician
        rpg_role_hint: support
    - label: I Flew
      description: >-
        Ships, fighters, shuttles, anything with a stick and a throttle.
        The space between stars is just distance. You eat distance.
      mechanical_effects:
        class_hint: Pilot
        personality_trait: restless
        jungian_hint: explorer
        rpg_role_hint: jack_of_all_trades
    - label: I Survived
      description: >-
        Ran cargo, ran scams, ran from things. You kept moving because
        standing still meant getting caught, and getting caught meant
        something worse than moving.
      mechanical_effects:
        class_hint: Smuggler
        personality_trait: adaptable
        jungian_hint: outlaw
        rpg_role_hint: stealth
    - label: I Talked
      description: >-
        Negotiated, translated, lied professionally. Words are tools and
        you know which ones open doors, which ones close them, and which
        ones are doors themselves.
      mechanical_effects:
        class_hint: Diplomat
        personality_trait: perceptive
        jungian_hint: sage
        rpg_role_hint: control
  allows_freeform: true

- id: drive
  title: Why Did You Leave?
  narration: |
    Nobody ends up out here because everything was fine where they started.
    Something pushed you out, or pulled you forward, or both. You may not
    have admitted it to yourself yet — but it's the engine you run on, and
    it's running right now.

    What was it?
  choices:
    - label: Someone I Lost
      description: >-
        They're gone, or missing, or waiting somewhere you can't reach yet.
        Everything since then has been motion — filling the shape of where
        they were.
      mechanical_effects:
        relationship: lost_beloved
        goals: find_what_was_lost
        emotional_state: quietly grieving
        jungian_hint: lover
    - label: A Debt
      description: >-
        Not money. Something worse. A promise you broke, a betrayal you
        can't undo, a life you owe. It follows you like engine noise —
        always there, even when you stop hearing it.
      mechanical_effects:
        relationship: creditor
        goals: settle_a_debt
        emotional_state: burdened
        jungian_hint: everyman
    - label: Nowhere Left
      description: >-
        The place you were is gone. Not metaphorically — gone. Burned,
        annexed, collapsed, quarantined. Forward is the only direction
        that exists.
      mechanical_effects:
        relationship: displaced_community
        goals: find_belonging
        emotional_state: determined
        jungian_hint: hero
    - label: Curiosity
      description: >-
        You wanted to see what was out there. That's it. No tragedy, no
        vendetta, no dark past. Just a need to know what's on the other
        side of the next jump point. Is that so strange?
      mechanical_effects:
        relationship: wanderlust
        goals: explore_the_unknown
        emotional_state: wide-eyed
        jungian_hint: explorer
  allows_freeform: true

- id: role
  title: What Do You Bring?
  narration: |
    Here's the hard truth about the way you live now: when things go
    sideways — and they will — the people around you are going to need
    something specific from you. Maybe it's competence. Maybe it's
    character. Maybe it's just being the person who doesn't run.

    What do you bring?
  choices:
    - label: Steady Hands
      description: >-
        When everything goes wrong, you get calm. Not brave — calm. The
        panic doesn't reach your hands. People notice that about you.
      mechanical_effects:
        personality_trait: steady
        jungian_hint: caregiver
    - label: A Sharp Mouth
      description: >-
        You talk fast, think faster, and people listen before they realize
        they've been convinced. It's not charm — it's velocity.
      mechanical_effects:
        personality_trait: quick-witted
        jungian_hint: jester
    - label: Loyalty
      description: >-
        Once you're in, you're in. You don't leave people behind, you
        don't sell people out, and that is not negotiable. It's cost you
        before. You'd pay it again.
      mechanical_effects:
        personality_trait: loyal
        jungian_hint: caregiver
    - label: The Wrong Kind of Luck
      description: >-
        Things happen around you. Interesting things. Unlikely things.
        The kind of things that make for great stories and terrible
        insurance premiums.
      mechanical_effects:
        personality_trait: trouble-magnet
        jungian_hint: innocent
  allows_freeform: true

- id: confirmation
  title: This Is Who You Are
  narration: |
    {name}. The {race} {class}.

    Whatever happens next — the people you meet, the places you go, the
    trouble you make or unmake — it's going to be your story. The shape
    of you is set. The rest is what you do with it.

    Begin.
  choices: []
  allows_freeform: false
