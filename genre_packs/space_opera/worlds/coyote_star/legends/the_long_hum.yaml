name: The Long Hum
era: ongoing
summary: Prospectors who push past Red Prospect into the outer system report a low-frequency
  signal — not a transmission, not a beacon, just a persistent vibration at the edge
  of sensor range. It doesn't repeat in any pattern anyone can identify. It doesn't
  respond to hails. It gets stronger the further out you go, which is backwards —
  signals weaken with distance from their source, and this one seems to have no source
  at all. Ship crews call it the Long Hum. Most people who've heard it describe it
  as unsettling in a way they can't articulate. The voidborn star-readers say it sounds
  like something breathing. The Tsveri will not discuss it.
cultural_impact: The Long Hum is a campfire story and a superstition. Voidborn crews
  won't transit the outer system without ritual. Some prospectors have made good money
  running claims out there specifically because most people won't go.
affected_cultures:
- Voidborn
- Tsveri
terrain_scars:
- type: anomaly
  name: The Hum Field
  region: last_drift
  description: Sensor readings in the outer system show a diffuse energy signature
    that doesn't correspond to any known stellar or planetary source. It occupies
    a volume of space roughly where a jump point should be, and it fluctuates in a
    rhythm that is not random but is not any recognizable pattern. Ships that spend
    too long in the area report navigational drift, clock desynchronization, and crew
    unease that manifests as a conviction that something very large is very close
    — despite instruments showing empty space in every direction.
