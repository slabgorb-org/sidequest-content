name: The Sealed Lane
era: pre-human
summary: 'Spacers and prospectors tell a story about why Coyote Star has only one
  jump point. Every other system in the local cluster has at least two — most have
  three or four. The accepted theory is simple astrophysics: the star''s mass and
  position just didn''t produce more than one stable wormhole. But the voidborn star-readers
  say the charts don''t support that. The gravitational signature suggests there should
  be a second jump point on the far side of the system, out past where Last Drift
  begins. It''s not there. The Tsveri, when asked, use a word that translates roughly
  as "closed" — not absent, not collapsed. Closed. As if someone shut it.'
cultural_impact: The Tsveri's refusal to explain shapes every interaction between
  them and human settlers. It is the silence at the center of coexistence.
affected_cultures:
- Tsveri
- Voidborn
terrain_scars:
- type: anomaly
  name: The Absent Gate
  region: last_drift
  description: The gravitational signature of a jump point that should exist but doesn't.
    Instruments detect the mass shadow but find nothing there — no wormhole throat,
    no transit corridor, just a region of space that bends light wrong and makes navigation
    computers return errors they weren't programmed to produce.
- type: geological
  name: The Structured Deposits
  region: deep_root_world
  description: The Deep Root mountains contain mineral formations that don't match
    any known geological process. The rare-earth deposits are arranged in patterns
    that geologists privately describe as "structured" — too regular for natural deposition,
    too vast for any known engineering.
