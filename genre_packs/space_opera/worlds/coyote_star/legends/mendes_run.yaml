name: Mendes' Run
era: founding
summary: The first human to jump into Coyote Star was a prospector named Cado Mendes,
  flying a converted cargo shuttle with a jury-rigged jump drive and more nerve than
  sense. He came through the jump point, found an uncharted system with a breathable
  world, and staked the first claim. The story goes that he landed on the habitable
  planet, drove a survey spike into the ground, and said "this'll do." The settlement
  that grew there is still called Far Landing. Mendes made three more runs before
  his jump drive failed on the return trip. His granddaughter Dura runs the Free Miners'
  Compact now, and she keeps his survey spike on her desk.
cultural_impact: Far Landing's identity as a place for people who want to disappear
  traces directly to Mendes. The settlement attracts the desperate and the determined
  in equal measure.
affected_cultures:
- Frontier
terrain_scars:
- type: monument
  name: Mendes' Spike
  region: far_landing
  description: Mendes' original survey spike still stands at the center of Far Landing's
    oldest district — a corroded metal rod driven into alkaline hardpan, surrounded
    by buildings that grew up around it like a town around a well. It's not a monument.
    Nobody put a plaque on it. It's just there, and everyone knows what it is.
