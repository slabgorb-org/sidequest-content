# Space Opera — pack bestiary (story 90-1)
#
# SRD-aligned combat stat blocks for the swn ruleset module. Encountergen
# samples these for the Monster Manual encounters pool (free-play reachable
# hostiles); narrative layers (OCEAN, visual prompt) are composed at
# generation time. Stats are faithful to Stars Without Number: Revised
# (Free Edition, Sine Nomine Publishing) NPC / robot / xenobestiary tables —
# level == HD, hp == average (4.5/HD), ascending AC, morale on the 2d12
# ladder.
#
# Genre tier rules (ADR-120): names here are genre-generic — no named
# world factions, systems, or POIs. World-specific hostiles belong in
# worlds/<slug>/ overrides.
entries:
