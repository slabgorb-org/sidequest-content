funnels:

  # ── Hegemonic Authority & Regulars ──────────────────────────────────────────
  - name: Vaskov Patrol
    absorbs:
      - [hero, tank]
      - [ruler, tank]
      - [ruler, support]
    faction: Vaskov Administration
    lore: >-
      Prefect Ilara Vaskov's patrol cruiser has one rotating crew complement
      and nowhere near enough personnel to enforce anything in a system this
      spread out. Vaskov Patrol officers develop two qualities fast: initiative
      and pragmatism. They hold checkpoints at Grand Gate and Vaskov Centrum,
      project authority they may not be able to back, and quietly learn which
      battles are worth the fuel. The uniform still means something — mostly
      that you have a chain of command nobody out here respects.
    cultural_status: official authority, tolerated at best, resented at worst
    disposition_toward:
      Free Miners' Compact: watchful
      Clan Moana-Teru: transactional
      Broken Drift Runners: adversarial
      The Tsveri: formally respectful

  - name: Hegemonic Assessor
    absorbs:
      - [ruler, dps]
      - [ruler, control]
      - [sage, control]
    faction: Vaskov Administration
    lore: >-
      When enforcement fails, paperwork tries. Hegemonic Assessors are the
      administrative officers who audit manifests, impose fines, and build
      the legal case structures that theoretically give Vaskov leverage over
      the system's factions. In practice they are investigators who work alone,
      navigate hostile witnesses, and occasionally find something that actually
      matters. The control variant is the one who knows how to use what they find.
    cultural_status: resented universally, occasionally feared
    disposition_toward:
      Free Miners' Compact: adversarial
      Broken Drift Runners: hunting
      Clan Moana-Teru: suspicious

  # ── Free Miners & Belt Operators ────────────────────────────────────────────
  - name: Compact Hand
    absorbs:
      - [hero, dps]
      - [hero, jack_of_all_trades]
      - [everyman, jack_of_all_trades]
      - [everyman, support]
    faction: Free Miners' Compact
    lore: >-
      The Free Miners' Compact doesn't have soldiers — it has hands. Compact
      Hands are the working crew of the belt: drillers, riggers, claim-jumper
      deterrents, and the generalists who keep a mining platform running when
      two people are injured and the relief ship is four days out. They elected
      Dura Mendes because she'd done the same work and didn't flinch. The hero
      variant is the one who makes the hard call when the methane breach happens.
    cultural_status: the backbone of the Reach, respected among themselves
    disposition_toward:
      Vaskov Administration: resentful
      Clan Moana-Teru: dependent
      The Tsveri: uneasy

  - name: Survey Runner
    absorbs:
      - [explorer, jack_of_all_trades]
      - [explorer, stealth]
      - [explorer, dps]
    faction: Free Miners' Compact
    lore: >-
      The Broken Drift asteroid belt is three days wide and only partially
      charted. Survey Runners are the prospectors pushing the unmapped edges,
      filing claims on anything that scans for ore, and quietly noting the
      things that don't scan like ore at all. The outer system anomalies have
      Survey Runners talking. The stealth variant is the one doing the same job
      but filing the claims under a name Dura Mendes doesn't know about.
    cultural_status: independent, essential to the Compact's expansion
    disposition_toward:
      Vaskov Administration: evasive
      The Tsveri: encroaching

  - name: Drift Enforcer
    absorbs:
      - [everyman, tank]
      - [everyman, dps]
      - [hero, stealth]
    faction: Free Miners' Compact
    lore: >-
      When a claim jumper moves on a Compact operation, the Compact sends a
      Drift Enforcer. They are not subtle. They are practical, accustomed to
      hard vacuum and harder conversations, and they carry the kind of
      documentation that makes legal proceedings complicated enough to be
      useful as deterrence. The stealth variant prefers arriving before
      the claim jumper knows they're coming.
    cultural_status: necessary, not celebrated
    disposition_toward:
      Broken Drift Runners: tense
      Vaskov Administration: defiant

  # ── Clan Moana-Teru & Station Voidborn ──────────────────────────────────────
  - name: Turning Hub Crew
    absorbs:
      - [everyman, stealth]
      - [outlaw, jack_of_all_trades]
      - [jester, jack_of_all_trades]
      - [jester, support]
    faction: Clan Moana-Teru
    lore: >-
      Turning Hub is a city in orbit. Its crew has run fuel and repair for
      forty years under a policy of ask-nothing, dock-anyone, and remember-everything.
      The voidborn who grew up on the Hub learned early that knowing which
      bays are occupied is worth more than any manifest. The jester variant
      is the dockhand who tells you where Bay Seven is while conducting three
      unrelated conversations and somehow never being where trouble started.
    cultural_status: indispensable neutrals, trusted by no one, needed by everyone
    disposition_toward:
      Vaskov Administration: cooperative enough
      Broken Drift Runners: mutually beneficial

  - name: Moana-Teru Elder Hand
    absorbs:
      - [caregiver, support]
      - [caregiver, healer]
      - [lover, healer]
      - [lover, support]
    faction: Clan Moana-Teru
    lore: >-
      Clan Moana-Teru's station culture runs on obligation and memory. Elder
      Hands are the clan's embedded support network: medics who know every
      crew member by injury history, counselors who handle the psychological
      weight of never landing on a planet, and the people who make sure the
      voidborn who've been aboard since childhood have something that functions
      like home. Rangi Moana-Teru consults them before he plays any faction
      against another.
    cultural_status: core to clan cohesion, invisible to outsiders
    disposition_toward:
      Free Miners' Compact: sympathetic
      Vaskov Administration: careful

  - name: Hub Intelligence Broker
    absorbs:
      - [magician, control]
      - [magician, support]
      - [sage, support]
      - [sage, healer]
    faction: Clan Moana-Teru
    lore: >-
      Every ship that docks at Turning Hub leaves data traces — flight logs,
      cargo manifests, crew biometrics, repair requests. Hub Intelligence
      Brokers are the ones who read those traces and turn them into leverage
      that Rangi Moana-Teru uses to keep the Reach in balance. The sage
      variant files it all and publishes nothing. The magician variant builds
      the systems that make the filing invisible.
    cultural_status: clan asset, existence officially unacknowledged
    disposition_toward:
      Vaskov Administration: informational advantage
      Broken Drift Runners: mutual non-disclosure

  # ── Broken Drift Runners & Smuggling Networks ────────────────────────────────
  - name: Drift Runner
    absorbs:
      - [outlaw, stealth]
      - [outlaw, dps]
      - [jester, stealth]
    faction: Broken Drift Runners
    lore: >-
      The Broken Drift Runners operate on the principle that a dead prospector
      claim is the best dead drop in the system. Drift Runners are the
      independent captains and couriers who move undeclared cargo through the
      belt using routes that don't appear on any Hegemonic chart. The jester
      variant is the one who gets boarded by a Vaskov patrol and talks
      their way clear by sheer audacity, leaving the inspector vaguely
      amused and somehow not looking at the hidden compartment.
    cultural_status: outlaw, useful to every faction, loyal to none
    disposition_toward:
      Vaskov Administration: adversarial
      Clan Moana-Teru: transactional
      Free Miners' Compact: allied of convenience

  - name: Manifest Ghost
    absorbs:
      - [outlaw, control]
      - [outlaw, support]
      - [magician, stealth]
      - [sage, stealth]
    faction: Broken Drift Runners
    lore: >-
      Cargo doesn't disappear from customs logs by accident — someone has to
      write the system that makes it look legal. Manifest Ghosts are the
      technical specialists of the Runners: forgers, system penetrators, and
      the people who understand Hegemonic bureaucracy well enough to weaponize
      its gaps. They rarely fly; they make flying possible. The sage variant
      knows every customs regulation. The magician variant builds the exploit
      while the sage is still reading the manual.
    cultural_status: invisible by design, prized by every faction that can find one
    disposition_toward:
      Vaskov Administration: predatory
      Grand Gate customs staff: adversarial

  # ── Tsveri & Deep Root ───────────────────────────────────────────────────────
  - name: Root-Listener
    absorbs:
      - [sage, dps]
      - [explorer, control]
      - [magician, dps]
      - [magician, healer]
    faction: The Tsveri
    lore: >-
      The Tsveri do not separate knowledge from defense. A Root-Listener is a
      practitioner of the Deep Root's old methods — whatever root-listening
      actually is — and in the current political climate they are also the
      Tsveri who meets with humans and makes clear, in subsonic registers that
      vibrate in your chest more than your ears, that the Deep Root is not
      negotiable. The dps framing is what happens when the meeting goes badly.
      The magician variant is the one humans can't quite explain afterward.
    cultural_status: ancient authority within Tsveri culture, unsettling to everyone else
    disposition_toward:
      Free Miners' Compact: formally opposed
      Vaskov Administration: patient contempt
      Clan Moana-Teru: cautiously respectful

  # ── Unaffiliated & Crossfaction ──────────────────────────────────────────────
  - name: Jump Point Watcher
    absorbs:
      - [hero, control]
      - [caregiver, control]
      - [caregiver, dps]
    faction: null
    lore: >-
      Grand Gate Station at the jump point is technically Hegemonic but
      practically everyone's problem. Jump Point Watchers are the mixed-affiliation
      personnel who staff it: Compact representatives, Moana-Teru liaisons,
      and the occasional Vaskov appointee. They monitor everything that comes
      through the single entry to the system, share selected information with
      their respective factions, and have developed a grim professional rapport
      with each other. The caregiver variant is the medic who patches whoever
      comes through in bad shape, no questions asked.
    cultural_status: neutral ground, functional if fragile
    disposition_toward:
      All factions: professionally maintained

  - name: Far Landing Fixer
    absorbs:
      - [caregiver, stealth]
      - [lover, stealth]
      - [lover, dps]
      - [lover, control]
    faction: null
    lore: >-
      Far Landing is a dry, wind-scoured planet town where the governor's writ
      ends at the edge of Vaskov Centrum's lights. Far Landing Fixers are the
      people who make the rest of the settlement work: the medic who doesn't
      ask how you got shot, the go-between who knows which Compact foreman is
      willing to deal, the person everyone calls when something quietly needs
      to stop being a problem. They operate on relationship capital and enforce
      nothing except the social contract of mutual survival.
    cultural_status: embedded community connective tissue, under no flag
    disposition_toward:
      Vaskov Administration: performatively compliant
      Free Miners' Compact: trusted
      Broken Drift Runners: known quantities

  - name: Void Mendicant
    absorbs:
      - [innocent, healer]
      - [innocent, support]
      - [innocent, jack_of_all_trades]
    faction: null
    lore: >-
      The Reach has a handful of people who arrived with no faction, no crew,
      and no clear purpose beyond helping wherever they land. Void Mendicants
      are what happens when someone genuinely naive survives long enough to
      become useful — they carry medical kits, they ask the questions no one
      else asks, and they have a talent for ending up in exactly the wrong
      place to witness exactly the wrong thing. Every faction has at least one
      they're monitoring and one they're quietly protecting.
    cultural_status: harmless until they're not, universally underestimated
    disposition_toward:
      All factions: open

  - name: System Drifter
    absorbs:
      - [jester, dps]
      - [jester, control]
      - [artist, jack_of_all_trades]
      - [artist, support]
      - [artist, control]
    faction: null
    lore: >-
      Not everyone in Coyote Star is running from something or toward something.
      System Drifters arrived in the Reach the way people do — through the one
      jump point, with plans that didn't survive first contact with the system.
      They stayed for reasons they stopped examining. Some of them document what
      they see: the Tsveri's color-shifting integument at sunset, the architecture
      of a Turning Hub corridor that's been repaired by seven different hands.
      Some of them cause trouble as performance. Some cause trouble for income.
      None of them are easy to categorize, which is the point.
    cultural_status: unremarkable until scrutinized
    disposition_toward:
      Vaskov Administration: below notice
