# coyote_star — world-tier inventory override (ADR-145 D3, story 114-7)
#
# The shared SWN standard gear lives in the genre baseline
# (genre_packs/space_opera/inventory.yaml) and is inherited via the resolver's
# union-by-id merge. This file ships ONLY:
#   - currency / starting_equipment / starting_gold / philosophy (world-owned;
#     the resolver takes these from the world wholesale), and
#   - world-DISTINCT bespoke gear unique to the coyote_star frontier (no SWN SRD
#     analog → mode=bespoke, a world-tier privilege per ADR-145 D3).

currency:
  name: credits
  denominations:
    - credits
    - kilocredits

item_catalog:
  # --- coyote_star world-distinct gear (bespoke, world-tier) -----------------

  - id: jump_key
    name: Jump Key
    description: Encrypted navigation data for a specific jump route. Worth more than the ship that carries it.
    category: treasure
    value: 5000
    weight: 0.1
    rarity: rare
    power_level: 3
    tags: [navigation, data, valuable]
    lore: Some routes aren't in the public charts. The people who mapped them are often dead.
    narrative_weight: 0.7
    provenance:
      mode: bespoke
      license: na

  - id: claim_beacon
    name: Claim Beacon
    description: >-
      A frontier mineral-claim transponder. Bolt it to a rock, broadcast your
      mark, and the rock is legally yours — until someone with a bigger gun
      disagrees.
    category: tool
    value: 300
    weight: 1.0
    rarity: uncommon
    power_level: 1
    tags: [frontier, claim, transponder]
    lore: >-
      Out past the buoys, a claim beacon is the only law there is. It holds up
      exactly as long as you can hold the ground around it.
    narrative_weight: 0.3
    provenance:
      mode: bespoke
      license: na

  - id: multifocal_laser
    name: "Multifocal Laser"
    description: Strike-fighter-mounted rotary laser array with adaptive focusing optics. Cycles through focal lengths to punch through hull plating.
    category: weapon
    # Bespoke SHIP weapon (no SWN personal-gear analog) — the player_weapon /
    # opponent_weapon of the `dogfight` confrontation in rules.yaml. Must resolve in
    # this world's catalog so dogfight_shot.py's weapon_lookup finds it with its
    # armor_piercing (AP 20) intact (ADR-145 D3: bespoke gear is a world-tier privilege).
    value: 8000
    weight: 40.0
    rarity: rare
    power_level: 3
    tags: [ranged, energy, vehicle-mounted, ship-weapon, armor-piercing]
    lore: Standard fitment on Hegemonic interceptors. The multifocal drum rotates three lens sets per burst — one will find the gap.
    narrative_weight: 0.3
    damage: {dice: "1d4", bonus: 0, armor_piercing: 20}
    provenance:
      mode: bespoke
      license: na

starting_equipment:
  Officer:
    - blaster_sidearm
    - datapad
    - flight_suit
    - medpatch
  Operative:
    - blaster_sidearm
    - vibroknife
    - flight_suit
    - datapad
  Pilot:
    - blaster_sidearm
    - datapad
    - flight_suit
    - claim_beacon
  Engineer:
    - multitool_engineer
    - datapad
    - flight_suit
    - stim_pack
  Medic:
    - medkit_field
    - medpatch
    - medpatch
    - datapad
    - flight_suit
  Smuggler:
    - blaster_sidearm
    - vibroknife
    - datapad
    - flight_suit
    - jump_key
  Diplomat:
    - datapad
    - flight_suit
    - medpatch
  Soldier:
    - blaster_rifle
    - tactical_vest
    - medpatch
    - stim_pack

starting_gold:
  Officer: 700
  Operative: 500
  Pilot: 400
  Engineer: 300
  Medic: 400
  Smuggler: 600
  Diplomat: 800
  Soldier: 250

philosophy:
  carry_limit: 0
  restricted_categories: []
  progression_gates: {}
  notes: >-
    Inventory is not the point of space opera. The ship carries the heavy
    stuff. Personal gear is what's on your belt and in your bunk. On the
    frontier, you carry what you can defend and bury the rest.
