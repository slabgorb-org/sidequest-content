map_resolution: null
map_style: Engraved brass orrery on dark vellum, inner planets and gas giant on
  concentric rings, moons on short arms, mining claims and Lagrange points stamped
  in steel, jump points struck-pin, outer system past Red Prospect drawn in chalk
  and pencil — a working chart that has been added to and erased a hundred times.
navigation_mode: region
starting_region: far_landing
world_name: Coyote Star

regions:
  far_landing:
    name: Far Landing
    summary: "The habitable inner world — settler ground and seat of Hegemonic authority"
    description: >-
      Dry, windy, breathable, ugly. The settlers came here first and never left.
      Hegemonic Prefect Ilara Vaskov governs from Vaskov Centrum, a low-rise
      administrative town that hugs the lee side of a mesa to keep the dust off
      its solar arrays. Outside the centrum, the planet is mining towns, dirt
      roads, and the occasional water cooperative. The orbital station Tethys
      Watch — Vaskov's aging patrol cruiser is parked there — circles overhead
      like a tired witness.
    terrain: atmospheric
    controlled_by: vaskov_administration
    adjacent:
      - deep_root
      - broken_drift
      - mendes_post
    landmarks:
      - Vaskov Centrum (Hegemonic governor's seat)
      - Tethys Watch (orbital cruiser perch)
      - the dust-roads
    rivers: []
    settlements: []

  deep_root:
    name: Deep Root
    summary: "The second world's mountain range — Tsveri sacred ground, no human claim"
    description: >-
      The cooler, wetter inner-system planet, dominated by a single mountain
      range the Tsveri call the Deep Root. The Tsveri have lived here for
      thousands of years; they are tall, slow-moving, silicon-laced, and
      profoundly uninterested in the Hegemony, the miners, or anyone else.
      They claim no territory but the Deep Root, and they have made it clear
      that the Deep Root is not negotiable. Recent rare-earth surveys have
      found deposits under sacred ground. The Tsveri have said no. The miners
      have not stopped asking.
    terrain: atmospheric
    controlled_by: tsveri
    adjacent:
      - far_landing
      - broken_drift
    landmarks:
      - the Singing Foothills
      - Kerel Eye (moon)
      - the Lower Kerel watch-station
    rivers: []
    settlements: []

  broken_drift:
    name: The Broken Drift
    summary: "The asteroid belt where most of the system's ore comes from"
    description: >-
      A wide, scattered arc of rocky claims between the inner worlds and the
      gas giant. The miners call it the Broken Drift because nothing in it
      stays put — orbits decay, claims drift, and a marker buoy you set
      yesterday will be a degree off by next week. The Free Miners' Compact
      operates here. So do the Broken Drift Runners, when no one official is
      looking. Dust, slow tumbling rocks, the click of a magnetic boot on
      pitted nickel-iron, and the long quiet of vacuum between outposts.
    terrain: vacuum
    controlled_by: free_miners_compact
    adjacent:
      - far_landing
      - deep_root
      - mendes_post
      - turning_hub
      - red_prospect
    landmarks:
      - Gravel Orchard (Far Landing L4 trojan field)
      - Dead Man's Drift (Far Landing L5 trojan field)
      - New Claim (recent strike, contested)
    rivers: []
    settlements: []

  mendes_post:
    name: Mendes' Post
    summary: "The Free Miners' outpost in the Broken Drift — Dura Mendes's seat"
    description: >-
      A welded-together habitat of three pressurized barge hulls, two cargo
      cans, and an aftermarket spin module that creaks audibly at watch-change.
      Mendes' Post is the closest thing the Free Miners' Compact has to a
      capital — not because it is impressive but because Dura Mendes runs
      Compact business out of the back office. The galley feeds anyone who
      pays. The bar feeds anyone who has news. The dock will hold your hull
      for a thirty-day if you sign for it. Inbound traffic from Grand Gate
      usually coasts here first to ask what's changed.
    terrain: vacuum
    controlled_by: free_miners_compact
    adjacent:
      - far_landing
      - broken_drift
      - turning_hub
    landmarks:
      - the Spin Module (dockside bar)
      - Dura Mendes's back office
      - the long-haul sleeve berths
    rivers: []
    settlements: []

  turning_hub:
    name: Turning Hub
    summary: "Clan Moana-Teru's voidborn freeport in orbit of Red Prospect"
    description: >-
      Three station hulls jumped through Grand Gate forty years ago and welded
      themselves into a freeport that now controls most of the fuel in the
      system. Turning Hub orbits the gas giant and skims its upper atmosphere
      for hydrogen at scheduled intervals; the rest of the time it is a market,
      a refit yard, and the only place in Coyote Star where the customs writ
      genuinely does not run. Clan Elder Rangi Moana-Teru plays every faction
      against the others and keeps the docks full while doing it.
    terrain: orbit
    controlled_by: clan_moana_teru
    adjacent:
      - broken_drift
      - mendes_post
      - red_prospect
      - grand_gate
    landmarks:
      - the Wharf-Ring (open market deck)
      - Clan Hall Moana-Teru
      - the Whitedrift fuel-scoop tether
    rivers: []
    settlements: []

  red_prospect:
    name: Red Prospect
    summary: "The gas giant — fuel skies, hydrogen scoops, brutal pressure"
    description: >-
      The outer-system anchor: a banded crimson-and-amber giant whose upper
      atmosphere is the system's hydrogen reservoir. Tankers from Turning Hub
      run scoop-paths along the cloud tops; bored Hegemonic patrol pilots take
      training runs against the gravity well. The interior is unsurvivable.
      Out past the cloud-tops the outer moons — Ember Moon, the Horn, Vael
      Thain — keep their own quiet councils, mostly voidborn, mostly tolerant,
      occasionally not.
    terrain: atmospheric
    controlled_by: clan_moana_teru
    adjacent:
      - broken_drift
      - turning_hub
      - last_drift
    landmarks:
      - the scoop-lanes
      - Ember Moon
      - the Horn (eccentric outer moon)
      - Vael Thain (voidborn quiet-station)
    rivers: []
    settlements: []

  grand_gate:
    name: Grand Gate
    summary: "The jump-point station — the only way in or out of the system"
    description: >-
      The customs station at Coyote Star's only mapped jump point, six and a
      half AU out from the star and effectively the entire foreign policy of
      the system. Vaskov's office staffs it. Vaskov's office cannot afford to
      staff it well. Outbound traffic queues for inspection; inbound traffic
      waits at the marker for clearance that, on busy weeks, never comes.
      Whoever holds Grand Gate holds everything, and the Hegemony technically
      holds it. Whoever the Hegemony holds it for is a more interesting
      question.
    terrain: jump_lane
    controlled_by: vaskov_administration
    adjacent:
      - turning_hub
      - last_drift
    landmarks:
      - the customs ring
      - the inspector's gallery
      - the jump-marker buoys
    rivers: []
    settlements: []

  last_drift:
    name: The Last Drift
    summary: "The outer haze beyond Red Prospect — dark, cold, supposedly empty"
    description: >-
      A thin halo of debris and dust ten AU out, beyond the gas giant and past
      where any honest claim has ever been worked. The chart calls it the Last
      Drift; the older voidborn songs call it something less polite. Recently,
      prospectors who drift this far have been reporting energy readings from
      bodies that should not be generating energy — a steady low pulse, a
      bearing that does not match any known transponder, a shape on the long
      sweep that comes back identical on the next pass. Nobody has filed a
      claim on it. Nobody has filed a claim against it either.
    terrain: vacuum
    controlled_by: null
    adjacent:
      - red_prospect
      - grand_gate
    landmarks:
      - the unaccounted bearing
      - the pencil-and-chalk arc
      - the absent gate (charted with a question mark)
    rivers: []
    settlements: []

routes:
  - name: The Centrum Lane
    description: >-
      The patrolled inner-system run between Far Landing and the second world.
      Hegemonic transponders are expected. Tsveri scrutiny is implicit.
    distance: medium
    danger: moderate
    terrain: vacuum
    from_id: far_landing
    to_id: deep_root

  - name: The Compact Run
    description: >-
      The standard miner traffic-lane from Far Landing out to the asteroid
      belt — the longest stretch most settlers will ever fly. Dust pings,
      micrometeor hits, and the steady creep of Compact buoy markers.
    distance: long
    danger: moderate
    terrain: vacuum
    from_id: far_landing
    to_id: broken_drift

  - name: The Mendes Coast
    description: >-
      The coast-burn from Far Landing out to Mendes' Post, fourteen hours give
      or take a Hegemonic delay. The Kestrel and ships like her run it on
      autopilot.
    distance: long
    danger: safe
    terrain: vacuum
    from_id: far_landing
    to_id: mendes_post

  - name: The Sacred Skirt
    description: >-
      The narrow corridor that miners use to pass Deep Root without crossing
      Tsveri sovereign airspace. Currently watched. Currently legal. The
      survey ships pretend not to look down.
    distance: medium
    danger: dangerous
    terrain: vacuum
    from_id: deep_root
    to_id: broken_drift

  - name: The Drift Threading
    description: >-
      Working passage between scattered claims in the Broken Drift and the
      Free Miners' welded-together post. Marked by transponder buoys that
      drift faster than the rocks do.
    distance: short
    danger: moderate
    terrain: vacuum
    from_id: broken_drift
    to_id: mendes_post

  - name: The Hub Approach
    description: >-
      The fuelled run from the asteroid belt out to Turning Hub. Voidborn
      controllers handle the approach; Compact pilots grumble about clan
      priority but pay the docking fee anyway.
    distance: long
    danger: moderate
    terrain: vacuum
    from_id: broken_drift
    to_id: turning_hub

  - name: The Skim Lane
    description: >-
      The scoop-tanker route between Turning Hub and Red Prospect's upper
      atmosphere. Voidborn-only by custom, not by law.
    distance: short
    danger: dangerous
    terrain: atmospheric
    from_id: turning_hub
    to_id: red_prospect

  - name: The Customs Approach
    description: >-
      The patrolled vector from Turning Hub out to Grand Gate. The only run
      where Hegemonic transponders are checked twice — once on departure,
      once on arrival.
    distance: long
    danger: moderate
    terrain: vacuum
    from_id: turning_hub
    to_id: grand_gate

  - name: The Mendes-to-Hub Quiet
    description: >-
      A miner-to-voidborn back channel between the Free Miners' post and
      Turning Hub, useful for moving cargo whose paperwork is, charitably,
      provisional.
    distance: long
    danger: dangerous
    terrain: vacuum
    from_id: mendes_post
    to_id: turning_hub

  - name: The Direct Belt Cross
    description: >-
      A long, lightly-marked slant across the Broken Drift toward Red
      Prospect's gravity well — saves a day, costs paint and sometimes
      hull. The Compact does not recommend it.
    distance: long
    danger: dangerous
    terrain: vacuum
    from_id: broken_drift
    to_id: red_prospect

  - name: The Pencil Arc
    description: >-
      The drifting trajectory from Red Prospect's far side out into the
      Last Drift. Marked on the chart in literal pencil. Most pilots who
      take it come back. Most.
    distance: long
    danger: dangerous
    terrain: vacuum
    from_id: red_prospect
    to_id: last_drift

  - name: The Gate Halo
    description: >-
      A thin patrol sweep that loops Grand Gate's customs ring out into the
      Last Drift's nearest bodies. Nominally to deter smuggling. In
      practice to give bored cruiser pilots somewhere to point the bow.
    distance: long
    danger: deadly
    terrain: vacuum
    from_id: grand_gate
    to_id: last_drift
