world_name: Coyote Star
starting_region: far_landing
navigation_mode: hierarchical
map_style: >-
  A working orrery on dark vellum. Inner planets and the gas giant
  ride engraved brass rings; moons hang from short arms; mining
  claims and Lagrange points are stamped in steel; jump points are
  marked with a struck pin. The outer system past Red Prospect is
  drawn in chalk and pencil, because the orrery's gear train doesn't
  predict that region cleanly. Every working copy in the system has
  the second-jump-point gap marked with a question, and most have
  the Tsveri places left blank — not erased, blank.

world_graph:
  nodes:
    # ---- Inner system ---------------------------------------------------
    - id: far_landing
      name: Far Landing
      description: >-
        The main habitable world and the system's largest population
        center. Dry plains, alkaline flats, and wind-scoured mesas
        surround a handful of settlements that grew up around the
        original colony drop site. Governor Vaskov administers from
        Vaskov Centrum, a prefab compound that's been expanded and
        patched for two decades. The air is breathable, the water
        needs filtering, and the sunsets are brown.
      kind: planet
      provenance: natural
      orbital_period: "one standard year"
      orbital_period_days: 365.0
      semi_major_axis_au: 1.00
      eccentricity: 0.02
      tags: [settlement, authority, frontier, habitable]

    - id: tethys_watch
      name: Tethys Watch
      description: >-
        Far Landing's only natural satellite — an irregular grey rock
        about thirty kilometers across, captured rather than coformed.
        The Hegemony bolted a relay station to the trailing face two
        decades ago and has been understaffing it ever since. Three
        antenna trees and a pressurized hut. The crew rotates every
        ninety days. Half of them go strange before their shift ends.
      kind: moon
      parent_body: far_landing
      provenance: hegemonic-issue
      orbital_period: "fifty days"
      orbital_period_days: 50.0
      parent_orbit_radius_km: 580000
      eccentricity: 0.05
      tags: [moon, surveillance, frontier]

    - id: deep_root_world
      name: Deep Root World
      description: >-
        The system's second habitable planet, cooler and wetter than
        Far Landing, dominated by the Deep Root mountain range where
        the Tsveri have lived for millennia. The lowlands are temperate
        and empty — the Tsveri don't use them, and the Hegemony hasn't
        authorized settlement. The mountains themselves are old,
        heavily eroded, and seismically quiet in a way geologists
        find suspicious. Recent surveys detected rare-earth deposits
        under the sacred peaks.
      kind: planet
      provenance: natural
      orbital_period: "thirteen standard months"
      orbital_period_days: 404.0
      semi_major_axis_au: 1.07
      eccentricity: 0.03
      tags: [alien_territory, sacred, disputed, habitable]

    - id: kerel_eye
      name: Kerel-Eye
      description: >-
        Deep Root World's larger moon, named in a Tsveri word that
        translates loosely as "the watching one." Visible from the
        Deep Root mountains as a milky disc with a single dark band.
        No human has set foot on it. The Tsveri do not discuss why,
        and the Hegemony has not pushed the question. Survey ships
        that enter close orbit report no anomalies and yet leave
        sooner than planned.
      kind: moon
      parent_body: deep_root_world
      provenance: natural
      orbital_period: "thirty-one days"
      orbital_period_days: 31.0
      parent_orbit_radius_km: 420000
      eccentricity: 0.04
      tags: [moon, sacred, alien_territory, unvisited]

    - id: lower_kerel
      name: Lower Kerel
      description: >-
        The smaller and inner of Deep Root World's two moons. A pitted
        rock without atmosphere or interest, except for one fact: the
        Hegemonic survey team that landed there in the second decade
        of contact filed a routine report and then went silent for
        forty hours. They walked back to the lander on their own. Their
        report after recovery was three sentences long. The Hegemony
        has not authorized a return visit.
      kind: moon
      parent_body: deep_root_world
      provenance: natural
      orbital_period: "nine days"
      orbital_period_days: 9.0
      parent_orbit_radius_km: 185000
      eccentricity: 0.01
      tags: [moon, mystery, restricted]

    - id: gravel_orchard
      name: The Gravel Orchard
      description: >-
        The stable Lagrange point trailing Far Landing in its orbit
        around the star — a slow-moving cloud of debris, derelicts,
        and prospector caches that have been accumulating in the
        gravity well for as long as anyone has been throwing things
        into space. Five large rocks anchor the cloud; locals call
        them the Big Five and have been arguing over their ownership
        for twenty years. The orchard moves at exactly Far Landing's
        pace, which means anything you leave there is still there.
      kind: lagrange
      lagrange_pair: [coyote, far_landing]
      lagrange_point: L4
      stability: stable
      provenance: natural
      orbital_period_days: 365.0
      semi_major_axis_au: 1.00
      tags: [lagrange, salvage, prospector_cache]

    - id: dead_man_l5
      name: Dead Man's Drift
      description: >-
        Far Landing's other stable Lagrange point, sixty degrees
        ahead of the planet on its orbital path. Less trafficked than
        the Gravel Orchard, and that suits its users. Claim disputes
        in Broken Drift have been settled here for over a decade —
        not by arbitration. Hegemonic patrols pass through quarterly
        and find nothing. The voidborn give the place a wide berth
        for reasons they decline to specify.
      kind: lagrange
      lagrange_pair: [coyote, far_landing]
      lagrange_point: L5
      stability: stable
      provenance: natural
      orbital_period_days: 365.0
      semi_major_axis_au: 1.00
      tags: [lagrange, lawless, body_count]

    # ---- Mid system: belt + gas giant ----------------------------------
    - id: broken_drift
      name: Broken Drift
      description: >-
        The asteroid belt between the inner worlds and the gas giant.
        Thousands of rocks ranging from gravel to small-moon size,
        riddled with mining claims, prospector shacks, dead equipment,
        and the occasional hull that drifted in from somewhere else.
        The Free Miners' Compact operates here, along with anyone
        willing to work a vacuum suit and a drill. Salvage is common.
        So are claim disputes. The belt is not a single place — it is
        a region of named zones and unnamed gravel.
      kind: belt
      provenance: natural
      semi_major_axis_au: 2.50
      inner_au: 2.20
      outer_au: 3.00
      orbital_period_days: 1442.0
      tags: [mining, salvage, lawless, zone_aggregate]

    - id: new_claim
      name: New Claim
      description: >-
        The largest mining moon, orbiting near the outer edge of the
        asteroid belt. The Compact maintains its main processing
        facility here — refineries, crew quarters, a bar called
        Mendes' Post that serves as the miners' unofficial parliament.
        Ore comes in from the belt, gets processed, and ships out
        through Turning Hub. The work is hard, the pay is irregular,
        and the Hegemonic tax collector visits quarterly.
      kind: dwarf_body
      provenance: natural
      orbital_period: "five standard years"
      orbital_period_days: 1826.0
      semi_major_axis_au: 2.92
      eccentricity: 0.08
      tags: [mining, industrial, frontier, habitable_with_dome]

    - id: red_prospect
      name: Red Prospect
      description: >-
        The system's gas giant — a rust-banded hydrogen world with
        violent upper-atmosphere storms and a deep gravity well. Clan
        Moana-Teru runs fuel-scooping operations in the upper
        atmosphere, skimming hydrogen with converted haulers. The work
        is dangerous and essential. Six moons orbit the giant; the
        voidborn consider all of them, and the giant itself, clan
        territory by custom if not by law.
      kind: gas_giant
      provenance: natural
      orbital_period: "twelve standard years"
      orbital_period_days: 4382.0
      semi_major_axis_au: 5.24
      eccentricity: 0.05
      tags: [gas_giant, fuel, voidborn]

    - id: turning_hub
      name: Turning Hub
      description: >-
        Clan Moana-Teru's freeport station, in close orbit around
        Red Prospect. Three connected station hulls that have been
        expanded, patched, and welded into a sprawling waypoint that
        serves as the system's neutral ground. Fuel scooping from the
        gas giant, ship repair, cargo exchange, and a docking ring
        where customs inspectors have learned not to look too closely.
        If you need something in Coyote Star, someone on Turning Hub
        can find it.
      kind: station
      parent_body: red_prospect
      provenance: voidborn-built
      orbital_period: "eighteen days around Red Prospect"
      orbital_period_days: 18.0
      parent_orbit_radius_km: 1955000
      eccentricity: 0.01
      tags: [station, trade, voidborn, neutral]

    - id: whitedrift
      name: Whitedrift
      description: >-
        The ice moon. A pale blue-white sphere of frozen water, a
        thin methane atmosphere, and a single equatorial scar where
        a long-ago impact opened the crust to the sub-surface ocean.
        The system's only reliable natural fresh-water source.
        Ownership is contested between the Vaskov Administration
        (which claims jurisdiction by treaty), Clan Moana-Teru
        (which has been mining ice here for forty years), and the
        Compact (which has the actual cutting equipment). Nobody is
        winning the argument and the ice keeps moving.
      kind: moon
      parent_body: red_prospect
      provenance: natural
      orbital_period: "twenty-two days"
      orbital_period_days: 22.0
      parent_orbit_radius_km: 2250000
      eccentricity: 0.02
      tags: [moon, water, contested, ice_mining]

    - id: ember_moon
      name: Ember
      description: >-
        Tidally heated, volcanically active, and constantly weeping
        sulfur. Ember's surface is a patchwork of black basalt and
        molten yellow flow lines that shift on a daily cycle. The
        Compact briefly tried mining its rare metals; the operation
        ran for eight months and lost forty-two miners. The moon is
        now worked only by the desperate, the suicidal, and the people
        who don't ask why anyone hires them. Suit failure rates here
        are quoted in their own units.
      kind: moon
      parent_body: red_prospect
      provenance: natural
      orbital_period: "seven days"
      orbital_period_days: 7.0
      parent_orbit_radius_km: 1055000
      eccentricity: 0.04
      tags: [moon, volcanic, lethal, mining]

    - id: the_horn
      name: The Horn
      description: >-
        A captured asteroid, not a coformed moon — Red Prospect pulled
        it in from the outer system at some point and never let it go.
        The orbit is eccentric, inclined, and crosses the orbits of
        three other moons; collision avoidance is a permanent
        navigational concern. The shape is jagged, the surface is
        cratered, and the interior holds a network of tunnels that
        somebody cut a long time before any human arrived. Broken
        Drift Runners use the tunnels. They do not discuss who cut them.
      kind: irregular_moon
      parent_body: red_prospect
      provenance: pre-collapse-relic
      orbital_period: "eccentric, mean fifty-three days"
      orbital_period_days: 53.0
      parent_orbit_radius_km: 4050000
      eccentricity: 0.42
      inclination_deg: 24.0
      tags: [moon, smuggler, ancient, captured]

    - id: dead_lash
      name: Dead Lash
      description: >-
        A barren grey moon with no atmosphere, no water, and no
        reason for anyone to be there — except that the Hegemony
        built a listening post on the leading hemisphere fifteen
        years ago, ran it for six, and abandoned it without
        explanation. The post is still standing. The orbital data
        feeds went silent the day the last shuttle left. Nobody has
        gone back to recover the equipment, which is unusual for a
        system this short on hardware.
      kind: moon
      parent_body: red_prospect
      provenance: hegemonic-issue
      orbital_period: "thirty-eight days"
      orbital_period_days: 38.0
      parent_orbit_radius_km: 3250000
      eccentricity: 0.03
      tags: [moon, abandoned, surveillance, restricted]

    - id: vael_thain
      name: Vael-Thain
      description: >-
        A small moon, smooth-surfaced and unremarkable from a
        distance, named in Tsveri. The Tsveri do not visit it. They
        also do not permit anyone else to visit it, and they have made
        this clear without ever explaining the reason. Hegemonic
        survey ships that approach within ten thousand kilometers
        receive a transmission in Tsveri that translates to a single
        word: away. So far every ship has complied.
      kind: moon
      parent_body: red_prospect
      provenance: natural
      orbital_period: "fourteen days"
      orbital_period_days: 14.0
      parent_orbit_radius_km: 1675000
      eccentricity: 0.02
      tags: [moon, sacred, alien_territory, forbidden]

    - id: compact_anchorage
      name: The Compact Anchorage
      description: >-
        The stable Lagrange point trailing Red Prospect along its
        orbit around the star. A vast, slow-drifting volume of space
        that holds its contents in place without effort, which is
        exactly what the voidborn want from a parking lot. Clan
        Moana-Teru keeps fuel barges, salvage hulks, and a few hulls
        the Hegemony has not been told about parked here. The Anchorage
        moves with Red Prospect, and so the freeport's slow business
        moves with it.
      kind: lagrange
      lagrange_pair: [coyote, red_prospect]
      lagrange_point: L4
      stability: stable
      provenance: natural
      orbital_period_days: 4382.0
      semi_major_axis_au: 5.24
      tags: [lagrange, voidborn, fuel_depot]

    - id: the_counter
      name: The Counter
      description: >-
        The Lagrange point on the far side of the star from Red
        Prospect — directly opposite the gas giant in its orbital
        path, permanently obscured by the star itself from any
        observer in the inner system. Unstable in the long term and
        useless as infrastructure. Mythologized by everyone. The
        Compact says nothing is there. The voidborn say that's the
        point. Ships that have transited The Counter sometimes report
        clock drift on return. Sometimes they do not return at all.
      kind: lagrange
      lagrange_pair: [coyote, red_prospect]
      lagrange_point: L3
      stability: unstable
      provenance: natural
      orbital_period_days: 4382.0
      semi_major_axis_au: 5.24
      tags: [lagrange, mythologized, blind_spot, mystery]

    # ---- Outer system --------------------------------------------------
    - id: grand_gate
      name: Grand Gate
      description: >-
        The customs and traffic control station at the system's only
        jump point. A Hegemonic installation staffed by a small crew
        that logs every ship entering or leaving Coyote Star. In
        theory, nothing moves through the jump point without
        authorization. In practice, the station is undermanned, the
        sensor net has gaps, and the Broken Drift Runners know every
        one of them. Whoever controls Grand Gate controls access to
        the entire system.
      kind: jump_point_station
      provenance: hegemonic-issue
      orbital_period_days: 6048.0
      semi_major_axis_au: 6.50
      eccentricity: 0.01
      tags: [jump_point, authority, strategic, choke_point]

    - id: last_drift
      name: Last Drift
      description: >-
        The outer system beyond Red Prospect — cold, dark, and
        officially empty. The orrery doesn't track this region
        cleanly; on every working copy, Last Drift is annotated in
        chalk or pencil. Prospectors who've pushed out this far
        report anomalous energy readings, navigational drift that
        doesn't match any known gravitational source, and a persistent
        low-frequency signal that no one has been able to triangulate.
        The Hegemony says it's sensor noise. The voidborn say it's
        nothing worth chasing. The Tsveri say nothing at all, which
        is the most unsettling response of the three.
      kind: outer_system_zone
      provenance: natural
      semi_major_axis_au: 10.00
      inner_au: 7.50
      outer_au: 15.00
      orbital_period_days: 11550.0
      tags: [outer_system, mystery, unexplored, anomalous]

  # ---- Top-level edges -------------------------------------------------
  edges:
    # Far Landing's local space
    - from: far_landing
      to: tethys_watch
      danger: 1
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The short hop from Far Landing surface to its single moon's
        relay station. Routine, well-charted, used mostly by Hegemonic
        crew rotations and the occasional contractor.
      route_kind: orbital_skim

    - from: far_landing
      to: deep_root_world
      danger: 1
      distance: 1
      terrain: vacuum
      relation: transit
      name: Inner Crossing
      description: >-
        The short hop between the two habitable worlds. Quick transit
        but politically sensitive — the Vaskov Administration
        technically requires a permit for civilian traffic to the
        Deep Root World, a rule that miners ignore routinely.
      seasonal: true
      route_kind: transit

    - from: far_landing
      to: gravel_orchard
      danger: 3
      distance: 2
      terrain: vacuum
      relation: transit
      description: >-
        The slow drift out to Far Landing's leading Lagrange point.
        Easy navigation, cheap fuel, and you'll meet whatever is hiding
        in the orchard at the other end.
      route_kind: transit

    - from: far_landing
      to: dead_man_l5
      danger: 5
      distance: 2
      terrain: vacuum
      relation: transit
      description: >-
        The trailing Lagrange transit. Hegemonic patrols mark this
        route on their charts but do not actually patrol it. People
        going to Dead Man's Drift generally do not advertise the trip.
      route_kind: smuggler_path

    - from: far_landing
      to: grand_gate
      danger: 1
      distance: 3
      terrain: vacuum
      relation: transit
      name: Vaskov Lane
      description: >-
        The main transit corridor from Far Landing to the jump point
        station. Hegemonic patrol route, well-charted, and the only
        path that customs officially recognizes for commercial traffic.
      route_kind: transit

    # Deep Root's local space
    - from: deep_root_world
      to: kerel_eye
      danger: 5
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The orbital approach to Kerel-Eye. Approaching is not
        interdicted, but every approach is observed, and every
        approaching ship eventually departs sooner than planned.
      route_kind: orbital_skim

    - from: deep_root_world
      to: lower_kerel
      danger: 3
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The short hop to Deep Root's inner moon. The lander wreck from
        the original Hegemonic survey is still there, on the trailing
        face. Nobody has been authorized to remove it.
      route_kind: orbital_skim

    # Inner-to-belt
    - from: far_landing
      to: broken_drift
      danger: 3
      distance: 2
      terrain: vacuum
      relation: transit
      description: >-
        The standard prospector run from inner space to the belt.
        Hauler traffic, customs interest at both ends, and a steady
        trickle of new pilots learning the meaning of asteroid density.
      route_kind: transit

    - from: gravel_orchard
      to: broken_drift
      danger: 3
      distance: 2
      terrain: vacuum
      relation: transit
      description: >-
        The drift route from Far Landing's L4 cloud to the working
        belt. Cheap on fuel, slow, and the salvage you find on the way
        is usually the kind that has owners.
      route_kind: smuggler_path

    # Belt internals & outer-belt
    - from: broken_drift
      to: new_claim
      danger: 3
      distance: 1
      terrain: vacuum
      relation: transit
      name: Drift Run
      description: >-
        The short hop from the belt proper to the mining moon.
        Prospectors and haulers make this run daily, threading through
        asteroid traffic with the casual familiarity of people who've
        done it a thousand times. New pilots find it terrifying.
      route_kind: transit

    - from: broken_drift
      to: turning_hub
      danger: 3
      distance: 2
      terrain: vacuum
      relation: transit
      name: Ore Run
      description: >-
        The hauler route from the asteroid belt to Turning Hub, where
        ore gets traded for fuel, parts, and credit. Heavy traffic,
        slow ships, and the occasional Broken Drift Runner using a
        bulk hauler as cover.
      route_kind: transit

    - from: new_claim
      to: turning_hub
      danger: 3
      distance: 1
      terrain: vacuum
      relation: transit
      description: >-
        The processed-ore lane between the Compact's main facility
        and Clan Moana-Teru's freeport. The miners' lifeline. The
        voidborn watch the timing of this run more carefully than they
        let on.
      route_kind: transit

    # Red Prospect's moon family — orbital relationships
    - from: red_prospect
      to: turning_hub
      danger: 1
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        Turning Hub's close orbit around the gas giant. The view from
        the public concourse looking down through the deck windows is
        the system's most photographed sight, mostly because it's the
        only one anyone bothers to photograph.
      route_kind: orbital_skim

    - from: red_prospect
      to: whitedrift
      danger: 3
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The orbital approach to the ice moon. Three flagged transponder
        positions mark Vaskov, Compact, and voidborn ice claims; none
        of the three flags agree on where the others end.
      route_kind: orbital_skim

    - from: red_prospect
      to: ember_moon
      danger: 7
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The orbital approach to Ember. Suit failure begins on
        approach, not on landing. Insurance does not cover this route.
      route_kind: orbital_skim

    - from: red_prospect
      to: the_horn
      danger: 5
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The Horn's orbital approach is unpredictable — its eccentric
        path means the transit window changes daily, and only voidborn
        navigators bother to keep it accurate.
      seasonal: true
      route_kind: orbital_skim

    - from: red_prospect
      to: dead_lash
      danger: 1
      distance: 1
      terrain: orbit
      relation: orbits
      description: >-
        The orbital approach to the abandoned listening post. Nothing
        active. Nothing answering hails. Most patrol ships skip this
        moon entirely.
      route_kind: orbital_skim

    - from: red_prospect
      to: vael_thain
      danger: 5
      distance: 1
      terrain: orbit
      relation: forbidden
      description: >-
        Approaching Vael-Thain results in a Tsveri transmission of a
        single word, in their language, that means away. Every ship
        that has so far complied has been fine. Nobody knows what
        happens to ships that do not.
      route_kind: orbital_skim

    - from: red_prospect
      to: compact_anchorage
      danger: 1
      distance: 2
      terrain: vacuum
      relation: transit
      description: >-
        The slow drift from Red Prospect orbit out to the trailing
        Lagrange point. Voidborn fuel barges run this route on a
        rotation nobody outside the clan understands.
      route_kind: orbital_skim

    # The Counter — far transit
    - from: red_prospect
      to: the_counter
      danger: 7
      distance: 3
      terrain: vacuum
      relation: transit
      description: >-
        The long way around the star to the opposing Lagrange point.
        Most ships that take this route do so to confirm The Counter
        is empty. Most of them confirm it. The remainder do not return
        with confirmations of any kind.
      route_kind: dark_route

    # Outer system
    - from: turning_hub
      to: grand_gate
      danger: 3
      distance: 3
      terrain: vacuum
      relation: transit
      name: Far Lane
      description: >-
        The long transit from Turning Hub to the jump point. Ships
        making the run carry fuel, processed ore, and whatever Clan
        Moana-Teru is exporting this quarter. The route passes through
        open space with no cover and no help if something goes wrong.
      route_kind: transit

    - from: red_prospect
      to: last_drift
      danger: 7
      distance: 3
      terrain: vacuum
      relation: transit
      name: Dark Reach
      description: >-
        The route into the outer system — not a charted lane so much
        as a heading. No nav beacons, no refueling, no rescue. The
        prospectors who go out this way do it on their own fuel and
        their own nerve. Some of them come back with strange data.
        Some of them don't come back.
      route_kind: dark_route

    # The jump
    - from: grand_gate
      to: far_landing
      danger: 1
      distance: 3
      terrain: vacuum
      relation: transit
      description: >-
        The return leg of Vaskov Lane. Same route, same patrols,
        same customs paperwork.
      route_kind: transit

# ---- Sub-graphs (interior of selected world_graph nodes) ---------------
sub_graphs:
  far_landing:
    nodes:
      - id: vaskov_centrum
        name: Vaskov Centrum
        description: >-
          The capital of Far Landing — a prefab Hegemonic compound
          surrounded by twenty years of patches, expansions, and
          unsanctioned construction. Governor Vaskov runs the
          administration from the original drop module. Customs,
          militia, and tax collection all share a single hallway. The
          building has the smell of a place that was meant to be
          temporary.
        kind: settlement
        tags: [authority, settlement]
      - id: mendes_spike_district
        name: Mendes' Spike District
        description: >-
          Far Landing's oldest district, grown up around Cado Mendes'
          original survey spike. The spike is still there, driven into
          alkaline hardpan at the center of the district, surrounded
          by buildings that grew up around it like a town around a
          well. Nobody put a plaque on it. Everybody knows what it is.
        kind: district
        tags: [historic, monument]
      - id: salt_flats_camp
        name: Salt Flats Camp
        description: >-
          A boom-town at the edge of the alkaline flats — outfitters,
          ship parts, a long row of bunkhouses, and three competing
          bars. Most prospectors heading for Broken Drift pass through
          here at least once. The water is filtered twice and still
          tastes wrong.
        kind: settlement
        tags: [trade, transient, frontier]
      - id: dome_seventeen
        name: Dome Seventeen
        description: >-
          An abandoned colonial dome on the far side of the alkaline
          flats. The original colony's seventeenth and last attempt at
          a sealed habitat. The dome cracked in the third year and was
          never re-pressurized. Locals avoid it without being able to
          say why. Children tell stories about it. The stories disagree
          on what happened.
        kind: ruin
        tags: [abandoned, mystery, frontier]
      - id: red_pass_settlement
        name: Red Pass
        description: >-
          A wind-scoured trading post in the mesas north of Vaskov
          Centrum. Permanent population around forty. Compact fuel
          depot, one general store, a chapel that nobody owns and
          everybody uses. The wind never stops. The brown sunsets are
          best viewed from here, on the right night, with the right
          person.
        kind: settlement
        tags: [trade, frontier, weather]
      - id: tsveri_consulate
        name: The Tsveri Consulate
        description: >-
          A small Tsveri delegation operates from a low building near
          the edge of Vaskov Centrum. Three Tsveri are usually present.
          They do not advertise their function, take no public meetings,
          and decline most invitations. Twice a year a Hegemonic
          official is permitted to visit. The conversations are not
          recorded.
        kind: diplomatic
        tags: [alien, formal, restricted]
    edges:
      - from: vaskov_centrum
        to: mendes_spike_district
        danger: 1
        distance: 1
        terrain: road
        description: >-
          A short walk through Far Landing's oldest streets. The
          official tour stops at the spike. The unofficial tour stops
          at three bars first.
      - from: vaskov_centrum
        to: salt_flats_camp
        danger: 1
        distance: 2
        terrain: wilderness
        description: >-
          The dust road out to the prospector boom-town. Two hours by
          rover, four by foot if the wind is wrong.
      - from: salt_flats_camp
        to: dome_seventeen
        danger: 5
        distance: 2
        terrain: wilderness
        description: >-
          A bad track across the flats to the cracked dome. People who
          go out here generally do not come back with the answers they
          went looking for.
      - from: vaskov_centrum
        to: red_pass_settlement
        danger: 3
        distance: 3
        terrain: wilderness
        description: >-
          The long climb up into the mesas. Dust, wind, and the
          occasional Compact fuel hauler.
      - from: vaskov_centrum
        to: tsveri_consulate
        danger: 1
        distance: 1
        terrain: road
        description: >-
          A short, polite walk to the consulate. Visitors are received
          on Tsveri terms, including the timing.

  deep_root_world:
    nodes:
      - id: lowland_camps
        name: The Lowland Camps
        description: >-
          Hegemonic survey camps in Deep Root's empty lowlands.
          Tightly controlled, restricted to credentialed personnel,
          and policed by a small Vaskov Administration garrison. The
          surveys focus on the rare-earth deposits under the sacred
          peaks. The findings are classified at a level that suggests
          somebody, somewhere, already knows what the answer will be.
        kind: camp
        tags: [authority, scientific, restricted]
      - id: the_storied_peak
        name: The Storied Peak
        description: >-
          The Tsveri's most significant sacred peak. The Tsveri name
          for it does not translate. Humans are not permitted on the
          mountain. The Hegemony has never tested this prohibition.
        kind: sacred
        tags: [sacred, alien, forbidden]
      - id: broken_lowland
        name: The Broken Lowland
        description: >-
          A wide, marshy basin in Deep Root's temperate zone — empty
          of Tsveri use and not authorized for human settlement. The
          marsh is full of native life that nobody has properly
          catalogued. The lowland exists outside the politics of the
          two species, which is why neither uses it.
        kind: wilderness
        tags: [natural, untouched]
      - id: pilgrim_path
        name: The Pilgrim Path
        description: >-
          A way that Tsveri travelers move through, between the
          mountains and unspecified destinations to the south. The
          path is not marked. The path is not paved. Tsveri using it
          do not greet humans they pass. Humans on the path are
          ignored, which is itself a message.
        kind: route
        tags: [alien, sacred, untouchable]
    edges:
      - from: lowland_camps
        to: the_storied_peak
        danger: 7
        distance: 3
        terrain: wilderness
        description: >-
          The climb from the survey camps toward the peak. Every
          credentialed party that has set foot on this slope has
          turned back before reaching the upper switchbacks. They do
          not log a reason.
      - from: lowland_camps
        to: broken_lowland
        danger: 3
        distance: 2
        terrain: water
        description: >-
          A boggy traverse from the camps into the marsh. Survey
          teams come here when their primary work is suspended, which
          is more often than they admit.
      - from: broken_lowland
        to: pilgrim_path
        danger: 3
        distance: 2
        terrain: wilderness
        description: >-
          The marsh meets the unmarked Tsveri road at a stand of
          black-trunked trees. The trees are older than human contact
          with this system.

  turning_hub:
    nodes:
      - id: welded_concourse
        name: The Welded Concourse
        description: >-
          Turning Hub's main public area, where the three station
          hulls meet at an irregular junction welded together over
          the years by whoever was on shift when the seal needed to
          hold. The deck is patched in nine different alloys. The
          view down through the floor windows is straight into Red
          Prospect's storms.
        kind: concourse
        tags: [public, voidborn, trade]
      - id: customs_ring
        name: The Customs Ring
        description: >-
          The docking ring where Hegemonic inspectors rotate through
          on quarterly assignments. Their offices are on the
          coreward side. Their inspection patterns are predictable.
          Their reports are filed on time. Nothing else about this
          ring runs the way the paperwork suggests.
        kind: dock
        tags: [authority, voidborn, smuggler]
      - id: hold_six
        name: Hold Six
        description: >-
          The unmarked back hold below the Welded Concourse. Nominally
          cargo storage. Functionally a meeting room for any
          conversation that can't be had on a deck with windows. Clan
          Moana-Teru maintains it. The Compact respects it. Hegemonic
          inspectors are not aware it exists.
        kind: hold
        tags: [voidborn, lawless, private]
    edges:
      - from: welded_concourse
        to: customs_ring
        danger: 1
        distance: 1
        terrain: road
        description: >-
          A short walk along the main spine corridor. Inspector posts
          are visible from a hundred meters out, and most traffic
          adjusts accordingly.
      - from: welded_concourse
        to: hold_six
        danger: 3
        distance: 1
        terrain: underground
        description: >-
          A service stairway that doesn't appear on the public deck
          plan. The route is known to those who need to know it.

  new_claim:
    nodes:
      - id: mendes_post
        name: Mendes' Post
        description: >-
          The bar on New Claim that the Compact's miners use as their
          unofficial parliament. Sheet-metal walls, scavenged seating,
          a counter built from an asteroid core sample. Dura Mendes —
          Cado's granddaughter — keeps an eye on the room from the
          end stool. No firearms, no Hegemonic uniforms, no bullshit.
        kind: bar
        tags: [compact, parliament, frontier]
      - id: compact_office
        name: The Compact Office
        description: >-
          The Free Miners' Compact maintains a single small office
          near the refinery. Dura Mendes holds court there on
          alternating shifts. Cado Mendes' original survey spike —
          the one in Vaskov Centrum is the second — sits on her desk.
        kind: office
        tags: [compact, authority]
      - id: refinery_floor
        name: The Refinery Floor
        description: >-
          New Claim's main ore-processing facility — three rolling
          mills, a smelter, a vacuum-rated cargo lift, and the
          constant low hum of the moon's mining operation in
          continuous shift work. The dust gets into everything.
        kind: industrial
        tags: [compact, industrial, work]
    edges:
      - from: mendes_post
        to: compact_office
        danger: 1
        distance: 1
        terrain: road
        description: >-
          A short walk through the crew quarters. Dura goes one way,
          everyone else goes the other.
      - from: compact_office
        to: refinery_floor
        danger: 1
        distance: 1
        terrain: road
        description: >-
          A pressurized corridor between the office and the working
          floor. The hum gets louder as you approach.

  broken_drift:
    nodes:
      - id: bone_yard
        name: The Bone Yard
        description: >-
          The graveyard zone of Broken Drift — a slow-drifting cluster
          of mining accidents, abandoned shacks, dead suit beacons,
          and at least one cargo hauler that lost its crew and is now
          orbiting in formation with their bodies. The Compact does
          not mine here. New prospectors are taken on a tour as part
          of orientation.
        kind: belt_zone
        tags: [graveyard, salvage, sobering]
      - id: hatchet_run
        name: Hatchet Run
        description: >-
          The most densely-mined zone in Broken Drift. Active claims
          packed close, traffic constant, claim disputes weekly. The
          Compact's largest concentration of working stakes. The most
          experienced miners work here. So do the most aggressive ones.
        kind: belt_zone
        tags: [mining, active, lucrative]
      - id: the_blind_corner
        name: The Blind Corner
        description: >-
          A region of Broken Drift where dense rock clustering creates
          a sensor shadow that nothing penetrates from outside. The
          Hegemonic patrol net has known about this gap for years and
          done nothing. The Drift Runners stash things here. So do
          other people. Nobody who works the corner asks questions
          about anyone else's stashes.
        kind: belt_zone
        tags: [smuggler, sensor_blind, lawless]
      - id: cado_rock
        name: Cado Rock
        description: >-
          The largest known asteroid in Broken Drift — eighteen
          kilometers across, irregular, and named after Cado Mendes
          by miners who appreciate the irony of giving the system's
          biggest rock to the man who claimed the smallest one first.
          The interior has been hollowed out by Compact mining over
          the years. Half of the rock is empty.
        kind: asteroid
        tags: [historic, mining, named]
      - id: hangar_three
        name: Hangar Three
        description: >-
          A failed station — an attempt by an early Compact faction
          to build a permanent processing facility in the belt itself.
          The structure snapped its asteroid tether in the eighth
          year and has been drifting in a slow, stable orbit through
          Broken Drift ever since. The interior is mostly intact and
          mostly empty. People who go inside leave faster than they
          went in.
        kind: wreck
        tags: [abandoned, structure, mystery]
    edges:
      - from: bone_yard
        to: hatchet_run
        danger: 3
        distance: 2
        terrain: vacuum
        description: >-
          The transit from the graveyard to the working face. New
          prospectors making this trip for the first time generally
          do not say much.
      - from: hatchet_run
        to: the_blind_corner
        danger: 5
        distance: 2
        terrain: vacuum
        description: >-
          The slip from active mining into the sensor shadow. People
          who make this trip with cargo do so for reasons they do not
          file with customs.
      - from: hatchet_run
        to: cado_rock
        danger: 3
        distance: 1
        terrain: vacuum
        description: >-
          A short hop to the big rock. The Compact runs a near-constant
          shuttle between active claims and Cado Rock's central
          processing.
      - from: bone_yard
        to: hangar_three
        danger: 5
        distance: 2
        terrain: vacuum
        description: >-
          A drifting transit toward the failed station. The wreck
          tumbles slowly. Approaches are timed to the rotation, which
          most pilots find unsettling.

  red_prospect:
    nodes:
      - id: the_storm_eye
        name: The Storm Eye
        description: >-
          Red Prospect's largest persistent atmospheric feature — a
          rotating storm system roughly the size of Far Landing,
          stable for at least the entire period of human observation.
          The eye is unusually quiet at the center, and the Clan's
          most experienced fuel-scoopers descend to within a hundred
          kilometers of it on their best runs.
        kind: atmospheric_feature
        tags: [storm, voidborn, named]
      - id: scoop_lane_alpha
        name: Scoop Lane Alpha
        description: >-
          The primary fuel-scooping descent path used by Clan
          Moana-Teru's converted haulers. A spiral approach that
          threads between two of Red Prospect's storm bands, drops
          into the upper atmosphere, scoops hydrogen, and rides the
          atmospheric jet back out. The path is taught by demonstration.
          Nobody has it written down.
        kind: route
        tags: [voidborn, fuel, scoop]
      - id: the_drowned_signal
        name: The Drowned Signal
        description: >-
          A point in Red Prospect's upper atmosphere where Clan
          star-readers have, over the years, detected a faint
          transmission rising on certain orbital geometries — too deep
          to reach with any current scoop technology, too coherent to
          dismiss as natural. The Clan does not discuss this with
          outsiders. The signal does not appear on any Hegemonic chart.
        kind: anomaly
        tags: [voidborn, ancient, signal, unreachable]
    edges:
      - from: the_storm_eye
        to: scoop_lane_alpha
        danger: 7
        distance: 1
        terrain: atmospheric
        description: >-
          The descent from the storm-eye approach to the working scoop
          path. Pilots who do this regularly stop talking about it.
      - from: scoop_lane_alpha
        to: the_drowned_signal
        danger: 7
        distance: 2
        terrain: atmospheric
        description: >-
          A deeper descent than any working hauler attempts. Star-readers
          run unmanned probes here. Most of the probes do not come back.

  last_drift:
    nodes:
      - id: the_absent_gate
        name: The Absent Gate
        description: >-
          The gravitational signature of a jump point that should
          exist but doesn't. Instruments detect the mass shadow but
          find nothing there — no wormhole throat, no transit corridor,
          just a region of space that bends light wrong and makes
          navigation computers return errors they weren't programmed
          to produce. The Tsveri use a word for this region that
          translates as closed. Not absent. Not collapsed. Closed.
        kind: anomaly
        tags: [jump_point, anomaly, sealed]
      - id: the_hum_field
        name: The Hum Field
        description: >-
          A diffuse energy signature in Last Drift that doesn't
          correspond to any known stellar or planetary source. It
          occupies a volume of space roughly where a jump point
          should be, and it fluctuates in a rhythm that is not random
          but is not any recognizable pattern. Ships that spend too
          long in the area report navigational drift, clock
          desynchronization, and a conviction that something very
          large is very close.
        kind: anomaly
        tags: [signal, anomaly, dread]
      - id: prospector_wake
        name: The Prospector Wake
        description: >-
          A long, thin debris trail in Last Drift — fragments of
          haulers, suit telemetry beacons that haven't transmitted
          in years, the occasional intact escape pod with no occupant.
          The trail is the cumulative wake of every Coyote Star
          prospector who pushed too far out and didn't come back. It
          extends in a straight line that does not match any known
          orbital mechanics.
        kind: debris_field
        tags: [graveyard, mystery, wake]
      - id: chalk_zone
        name: The Chalk Zone
        description: >-
          The volume of space that working orreries don't predict
          cleanly — a region where annotations are written by hand
          because the gear train cannot. The Chalk Zone shifts
          relative to the rest of the system in ways that nobody has
          successfully modeled. Everyone who has worked the outer
          system has their own pencil-marks for it. None of the
          pencil-marks agree.
        kind: zone
        tags: [outer_system, anomaly, unmapped]
    edges:
      - from: the_absent_gate
        to: the_hum_field
        danger: 7
        distance: 1
        terrain: vacuum
        description: >-
          A short, terrible transit between the two outer-system
          anomalies. Both are felt before they are observed.
      - from: the_hum_field
        to: prospector_wake
        danger: 7
        distance: 2
        terrain: vacuum
        description: >-
          The drift along the wake from the hum field outward. Sensor
          returns out here are unreliable, but the bodies are real.
      - from: chalk_zone
        to: the_absent_gate
        danger: 7
        distance: 2
        terrain: vacuum
        description: >-
          The transit from the unmapped region toward the closed gate.
          Navigation computers do not produce useful readings in this
          interval.
