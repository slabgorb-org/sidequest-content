# Coyote Star — World Visual Style
# Dust-blown frontier rim under one harsh yellow sun. Patched hulls,
# oxidized prefab, ore-haze, and the deep-time stillness of the Tsveri
# range cutting through human transience. Aesthetic lineage: 1970s
# painted sci-fi concept art (Ralph McQuarrie, John Berkey) crossed
# with Sergio Leone's spaghetti-western color grading — burnt sienna,
# alkaline white, deep shadow, lone figure against vastness.
#
# WIRING: positive_suffix layers into ART_SENSIBILITY.WORLD on top of
# the genre-level neutral baseline. The genre file carries the universal
# anti-text-bleed safety clause; this file does not repeat it.

positive_suffix: >-
  Painted sci-fi concept art in the lineage of Ralph McQuarrie and John
  Berkey crossed with Sergio Leone's spaghetti-western color grading.
  Visible brushwork, atmospheric perspective with soft edges in the deep
  distance, sharp foreground contrast. Strong directional key light, hard
  shadows pooling deep brown-black, ambient warmth pushed toward burnt
  sienna and pale ochre. Patched hulls and welded plating in oxidized
  rust-orange and weathered teal, hand-mended seams, ore-stain streaks,
  weathered primer showing through topcoat. Hegemonic admin presence
  reads as faded prefab polymer blocks and scuffed charcoal-and-silver
  signage long past first installation. Mining and salvage texture:
  refinery heat-shimmer, drifting wreckage with weather-bleached paint.
  Strong silhouette framing, a single warm accent of ember-amber or
  oxblood reserved for points of warmth and danger.

  No lanterns, no torches, no held flames; light sources are electrical
  or natural-celestial only. No literal dust clouds, no airborne
  particulate, no exposed cut rock walls in interior scenes.

