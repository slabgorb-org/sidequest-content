# Coyote Star — World Visual Style
# Dust-blown frontier rim under one harsh yellow sun. The aesthetic
# lineage is 1970s painted sci-fi concept art (Ralph McQuarrie, John
# Berkey) crossed with Sergio Leone's color grading — burnt sienna,
# alkaline white, deep shadow, lone figure against vastness.
#
# WIRING: positive_suffix layers into ART_SENSIBILITY.WORLD on top of
# the genre-level neutral baseline. The genre file carries the universal
# anti-text-bleed safety clause; this file does not repeat it.
#
# AUTHORING RULE — strict, learned from playtest 2026-05-03:
# This file describes HOW to render, not WHAT to render. Every render
# (interior galley, exterior refinery, portrait, POI landscape) layers
# this on top of its own subject. Object-nouns here become artifacts
# the model paints into every scene — "patched hulls" forces a hull
# into the galley, "lantern-amber" forces a lantern into the frame.
#
# So: only style, medium, palette, light, and composition vocabulary.
# Abstract qualifiers ("worn", "oxidized", "weathered") are fine —
# they describe a surface treatment for whatever subject is rendered.
# Concrete nouns ("hulls", "rocks", "refinery", "lantern") are not —
# they crystallize as objects in every frame regardless of subject.
#
# Concrete subject vocabulary belongs in per-POI / per-scene prompts,
# not here.
#
# Negative-style instructions ("no lanterns, no torches, no cut rock")
# do NOT work — Z-Image runs at guidance_scale=0 and ignores negation.
# Telling the model "no X" can paint the word X or the object itself.
# The only working defense against an unwanted object is to never name
# it. This supersedes the negative-instruction approach attempted in
# PR #169.

positive_suffix: >-
  Painted sci-fi concept art in the lineage of Ralph McQuarrie and John
  Berkey crossed with Sergio Leone's color grading. Visible brushwork,
  atmospheric perspective, soft edges in the deep distance, sharp
  foreground contrast. Strong directional key light, hard shadows
  pooling deep brown-black, ambient warmth pushed toward burnt sienna
  and pale ochre. Surfaces throughout read as oxidized, weather-bleached,
  hand-mended, layered with worn paint over older paint — palette favors
  rust-orange and weathered teal over chrome or clean white. Where
  authority or institutional presence enters the frame, the tonality
  goes faded charcoal and dulled silver. Where stillness or great age
  enters the frame, the palette cools toward mineral teal and ash grey
  and the composition slows. Strong silhouette framing. A single warm
  amber or oxblood accent reserved for the painting's emotional anchor
  — saved, not spent.

negative_prompt: ""

preferred_model: dev

base_seed: 42
