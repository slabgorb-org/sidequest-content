positive_suffix: >-
  Painted sci-fi concept art in the lineage of Ralph McQuarrie and John
  Berkey crossed with Sergio Leone's color grading. Visible brushwork,
  atmospheric perspective, strong directional key light, hard shadows
  pooling deep brown-black, ambient warmth pushed toward burnt sienna
  and pale ochre. Surfaces read oxidized, weather-bleached, hand-mended
  — palette favors rust-orange and weathered teal over chrome or clean
  white. A single warm amber or oxblood
  accent reserved as the emotional anchor — saved, not spent. No text,
  no caption, no title, no writing, no signature, no labels, no
  watermark, no border, no frame.

