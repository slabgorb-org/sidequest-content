# Coyote Star — World Visual Style
# Dust-blown frontier rim under one harsh yellow sun. Patched hulls,
# oxidized prefab, ore-haze, and the deep-time stillness of the Tsveri
# range cutting through human transience. Aesthetic lineage: 1970s
# painted sci-fi concept art (Ralph McQuarrie, John Berkey) crossed
# with Sergio Leone's spaghetti-western color grading — burnt sienna,
# alkaline white, deep shadow, lone figure against vastness.
#
# WIRING: positive_suffix layers into ART_SENSIBILITY.WORLD on top of
# the genre-level neutral baseline. The genre file carries the universal
# anti-text-bleed safety clause; this file does not repeat it.

positive_suffix: >-
  Painted sci-fi concept art in the lineage of Ralph McQuarrie and John
  Berkey crossed with Sergio Leone's spaghetti-western color grading.
  Visible brushwork, atmospheric perspective through dust and haze, soft
  edges in the deep distance, sharp foreground contrast. Wide horizon
  framing with a lone subject placed against vastness, single harsh
  yellow sun raking across the scene from a low angle, hard shadows
  pooling deep brown-black, sky bleached pale ochre at the zenith and
  burnt sienna at the horizon. Patched hulls and welded plating in
  oxidized rust-orange and weathered teal, hand-mended seams, ore-stain
  streaks, weathered primer showing through topcoat. Hegemonic admin
  presence reads as faded prefab polymer blocks and scuffed
  charcoal-and-silver signage long past first installation. Mining and
  salvage texture: cut rock faces, refinery heat-shimmer, drifting
  wreckage with sun-bleached paint. Where Tsveri territory enters the
  frame the palette cools to mineral teal and basalt grey, the
  composition slows, deep stillness replaces dust. Strong silhouette
  against pale ochre sky or deep void, a single warm accent of
  lantern-amber or oxblood reserved for points of warmth and danger.

