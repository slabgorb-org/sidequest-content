# Hegemonic — visual identity tokens for image generation
# Used as the ART_SENSIBILITY.CULTURE layer for Hegemonic-cultured characters
# (Vaskov Administration, naval officers, customs service). Composes on top
# of the space_opera genre baseline and the coyote_star McQuarrie/Berkey ×
# Leone world layer. The Hegemonic should read as a representative of
# distant authority — regulation cloth in alien country.

visual_tokens: >-
  Regulation Hegemonic uniform in charcoal and cool silver-grey, sharp
  collar with a small starburst-shaped rank insignia clasped at the
  throat, an angular shoulder patch in matching charcoal-and-silver. Cut
  is naval-bureaucratic — straight shoulders, fitted waist, structured
  cuffs — pressed at the chest and creased at the seat from desk hours.
  Boots are local frontier leather, scuffed and dust-caked at the welt
  in rust-orange — the only concession to the rim. Posture upright,
  hands often clasped behind the back or resting at the belt where a
  holstered sidearm sits unworn smooth. Faint orange customs trim or
  blue naval piping marks the service branch. The body language of
  someone delivering an order they expect to be ignored.
