# Voidborn / Clan Moana-Teru — visual identity tokens for image generation
# Used as the ART_SENSIBILITY.CULTURE layer for Voidborn-cultured
# characters, including both the established Moana-Teru clan tier and
# the spacer underclass. Same family of signatures, different wear-tier:
# clan members layered and embroidered, spacers scavenged and mismatched
# in the same base colors.

visual_tokens: >-
  Layered station-wear in deep ocean blue and turquoise, woven mat or
  sash at the waist with clan markings — wave forms and navigation-star
  shapes — stitched into collar and cuffs in reflective dark thread.
  Magnetic boot clips visible at the ankle, a slight habitual crouch
  and a free hand drifting near a handhold even on solid ground, the
  posture of a body raised in low gravity. Lean long-limbed build, dark
  brown skin with the ashen undertone of someone rarely under a real
  sun, hair worn long and floating slightly or shaved at the sides and
  braided tight for helmet seals. Tā moko-style clan tattooing in
  blue-black ink across forearm and cheek, shell or bone jewelry from
  an ocean none of them have ever seen. Spacer underclass wears the
  same blues and the same posture in scavenged mismatched panels with
  the embroidery faded and the jewelry gone.
