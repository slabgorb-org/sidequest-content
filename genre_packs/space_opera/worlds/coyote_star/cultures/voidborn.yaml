visual_tokens: >-
  Layered station-wear in deep ocean blue and turquoise, clan markings
  of wave forms and navigation-star shapes stitched at collar and cuff.
  Magnetic boot clips at the ankle, a habitual low-gravity crouch, lean
  long-limbed build, dark brown skin with an ashen sunless undertone,
  hair long or braided tight for helmet seals. Tā moko-style blue-black
  clan tattooing across forearm and cheek, shell or bone jewelry.
  Spacer underclass wears the same blues scavenged and faded.
