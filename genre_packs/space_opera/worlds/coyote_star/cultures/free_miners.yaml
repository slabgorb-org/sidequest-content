# Free Miners' Compact — visual identity tokens for image generation
# Used as the ART_SENSIBILITY.CULTURE layer for Free Miner-cultured
# characters. The frontier miners ARE the world's color signature —
# oxidized rust-orange and weathered teal, the same palette as the
# patched hulls in the world layer. They look like they belong here
# because they were here first.

visual_tokens: >-
  Patched environment suit worn open over a faded work shirt as daily
  clothing, panels in oxidized rust-orange and weathered teal hand-mended
  at the seams, ore-stain streaks down the sleeves and chest. Tool
  harness across the torso, deep utility pockets at the thigh, a heavy
  belt hung with claim tags and small markers on a carabiner that jingle
  when they move. Boots dust-caked to the ankle in alkaline white. Hair
  cropped short and practical, sun-darkened skin lined deep around the
  eyes from glare and partial-atmosphere wind, hands broad and
  calloused with ore dust permanent in the knuckle creases. Dense
  heavy-gravity build, planted stance, no insignia and no rank — the
  authority is in the wear.
