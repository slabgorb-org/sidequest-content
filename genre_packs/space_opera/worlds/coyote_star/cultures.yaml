- name: Tsveri
  summary: "The native alien species of Coyote Star"
  description: >-
    The native alien species of Coyote Star. Tall, deliberate beings
    with silicon-laced integument that shifts color with emotional state
    and a subsonic vocal range that registers as vibration in human
    chests. They measure time in geological spans and consider human
    urgency a mild cognitive deficiency. Their culture centers on the
    Deep Root — a mountain range they've tended for millennia — and
    a concept they call root-listening, which may be meditation,
    communication with something underground, or both. They are not
    hostile. They are patient in a way that makes patience feel like
    a threat.
  slots:
    given_name:
      corpora:
        - corpus: georgian.txt
          weight: 0.6
        - corpus: finnish.txt
          weight: 0.4
      lookback: 2
    clan_name:
      corpora:
        - corpus: georgian.txt
          weight: 0.5
        - corpus: finnish.txt
          weight: 0.5
      lookback: 2
    place_noun:
      word_list: [root, span, well, vault, crest, den, hush, fold]
    adjective:
      word_list: [old, deep, slow, vast, long, still, low, dark]
  person_patterns:
    - "{given_name}"
    - "{given_name} {clan_name}"
    - "{clan_name}-{given_name}"
  place_patterns:
    - "{clan_name} {place_noun}"
    - "{adjective} {place_noun}"
    - "{given_name}'s {place_noun}"

- name: Hegemonic
  summary: "Vaskov Administration officials and Hegemonic naval/customs personnel"
  description: >-
    The Hegemonic governor's office and its staff — a multicultural empire
    whose officer corps is Slavic-led but draws subjects from across the
    core worlds. Late-Soviet bureaucracy with a Byzantine veneer: charcoal
    uniforms, regulation chignons, ink-stained fingers, and the patient
    contempt of people who file quarterly reports nobody reads. Names
    skew Russian; surnames sometimes carry the trace of a colonized
    homeworld picked up two generations back.
  slots:
    given_name:
      corpora:
        - corpus: russian_given.txt
          weight: 3
        - corpus: english_given.txt
          weight: 1
      lookback: 3
    family_name:
      corpora:
        - corpus: russian_surnames.txt
          weight: 3
        - corpus: english_surnames.txt
          weight: 1
      lookback: 3
    place_noun:
      word_list: [centrum, prefecture, station, post, customs, registry, charter, mandate, accord, codex, bureau, garrison, depot, hold, watch]
    adjective:
      word_list: [imperial, hegemonic, sealed, charted, regulated, sovereign, bonded, certified, marshalled, garrisoned]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name} {family_name}"
    - "Prefect {given_name} {family_name}"
    - "Commander {given_name} {family_name}"
  place_patterns:
    - "{family_name} {place_noun}"
    - "{adjective} {place_noun}"
    - "{place_noun} of {family_name}"

- name: Free Miners
  summary: "Frontier prospectors and rock-pickers of the Free Miners' Compact"
  description: >-
    Pre-Hegemonic settlers who came for ore and stayed for spite. A loose
    cooperative of prospectors and ore-haulers who organize collectively
    against outside authority and fight each other ferociously over claim
    boundaries. Spanish-speaking frontier with English mixed in — the
    cultural shape of an Old West Tejano/Anglo blend transposed to vacuum
    and partial atmosphere. Authority comes from your name, your
    grandfather's survey spike, and the size of your crew.
  slots:
    given_name:
      corpora:
        - corpus: spanish.txt
          weight: 3
        - corpus: english_given.txt
          weight: 2
      lookback: 3
    family_name:
      corpora:
        - corpus: spanish.txt
          weight: 3
        - corpus: english_surnames.txt
          weight: 2
      lookback: 3
    place_noun:
      word_list: [post, claim, drift, strike, vein, dig, ridge, flat, gulch, run, hold, stake, lode, cut, shaft, pan, roost, grade]
    adjective:
      word_list: [broken, deep, lucky, dry, rich, salted, jumped, abandoned, contested, surveyed, marked, hardrock]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name} {family_name}"
    - "{given_name}"
    - "Old {given_name} {family_name}"
  place_patterns:
    - "{family_name} {place_noun}"
    - "{family_name}'s {place_noun}"
    - "{adjective} {place_noun}"

- name: Voidborn
  summary: "Clan Moana-Teru, voidborn freeport operators of Turning Hub"
  description: >-
    The voidborn — station-bred, low-gravity-built, polyglot, and
    culturally Polynesian by ancestry and aesthetic. Three station hulls
    jumped into Coyote Star forty years ago and built Turning Hub at
    the gas giant. Everyone in the clan shares the surname Moana-Teru —
    "the Bright Ocean" — taken when the three hulls' elders accepted
    that the void itself was now their sea. The clan IS the ocean;
    every voidborn is a wave. The name is *adopted*, not inherited:
    newborns are given it in a naming ceremony at one cycle of age,
    outsiders may be granted it ceremonially in extraordinary cases,
    and those who leave the clan (the "cut clan tattoos" Drift Runners
    in particular) lose the right to it and the tā moko marks together.
    Given names are Polynesian. They wear deep blues stitched with wave
    forms and navigation stars, carry shell jewelry from oceans none of
    them have ever seen, and play every faction against the others
    without ever being under any authority but the clan elders. To
    swear by Moana-Teru is to invoke the whole clan; nobody does it
    lightly.
  slots:
    given_name:
      corpora:
        - corpus: polynesian.txt
          weight: 1
      lookback: 2
    family_name:
      word_list: ["Moana-Teru"]
    place_noun:
      word_list: [deck, hub, ring, dock, vault, span, hatch, hold, bay, gantry, lock, way, hall, spine, gallery]
    adjective:
      word_list: [turning, low, slow, lit, drifting, anchored, spinning, dark, bright, longwise, clanward]
  person_patterns:
    - "{given_name} {family_name}"
    - "{given_name} {family_name}"
    - "{given_name} {family_name}"
    - "Elder {given_name} {family_name}"
  place_patterns:
    - "{family_name} {place_noun}"
    - "{adjective} {place_noun}"
    - "{place_noun} of {family_name}"

- name: Broken Drift Runners
  summary: "Smuggling confederation of independent captains operating from the asteroid belt"
  description: >-
    A loose smuggling network whose captains share routes and warnings
    but no flag. Loyal to none. Among themselves they go by handles —
    nicknames pinned on by a previous crew, a botched run, or a piece
    of gear they wouldn't put down. Some captains keep a government
    name in reserve for when they need to look legitimate at customs;
    most don't bother. Heterogeneous crews from every faction that
    spat them out — Hegemonic deserters, broke prospectors, voidborn
    who cut their clan tattoos, occasionally a Tsveri-influenced
    spacer who took an alien-sounding handle to make people nervous.
  slots:
    nickname:
      word_list:
        - Sparrow
        - Patch
        - Quiet
        - Greasewheel
        - Long-Knife
        - Hush
        - Slip
        - Wash
