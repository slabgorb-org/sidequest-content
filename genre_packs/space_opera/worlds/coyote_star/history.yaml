chapters:
- id: fresh
  label: New Drift
  session_range:
  - 1
  - 5
  description: "The players arrive in Coyote Star through the jump point or are already\
    \ here, scraping by on the margins. The system is tense but functional —\
    \ the governor taxes, the miners grumble, the voidborn trade, and the Tsveri keep\
    \ to themselves. The mining dispute over the Deep Root range is heating up but\
    \ hasn't boiled over. Odd reports from the outer system are just bar talk. The\
    \ players find work, make contacts, and learn who matters in a system where everyone\
    \ knows everyone and nobody trusts anyone completely."
  events: []
  points_of_interest:
  - name: Vaskov Centrum
    slug: vaskov_centrum
    region: far_landing
    type: settlement
    description: 'The Hegemonic administrative compound on Far Landing: a prefab complex
      expanded and patched for two decades, sitting on a wind-scoured plateau above
      the alkaline flats. The governor''s office is on the third floor. The flagpole
      is fibreglass. The holding cells are half-full on any normal day. The sunsets
      are brown.'
    visual_prompt:
      solo: 'Wide elevated landscape view of an austere far-future administrative
        compound on a wind-scoured high plateau. Foreground: a cluster of prefabricated
        polymer building blocks linked by enclosed walkways, a slender comms mast,
        a low watchtower. Middle ground: pale alkaline salt flats stretching to a
        low ridge. Background: brown dust haze on the horizon under a dim ochre sky.
        Late afternoon, low directional sun casting long hard shadows. Mood austere,
        bureaucratic, isolated.'
      backdrop: 'Distant prefab admin compound silhouetted on a wind-scoured plateau,
        slender comms mast and low watchtower against a dim ochre sky, brown dust
        haze along the horizon, pale alkaline flats fading into the far middle ground.'
    environment:
      solo: 'Late afternoon, low directional sun cutting in from frame-left, brown
        dust haze softening every distance, hard shadows on the alkaline flats, dry
        wind across an exposed plateau, the stillness of a place where a single
        voice carries half a kilometer.'
      backdrop: 'Ochre dust sky, low sun, dry wind, exposed.'
  - name: Mendes' Post
    slug: mendes_post
    region: new_claim
    type: bar
    description: 'The Free Miners'' Compact''s unofficial parliament, on New Claim:
      a low-ceilinged bar built into the side of a refinery, lit by salvaged bulkhead
      lamps and warmed by the waste heat of the ore crushers next door. Signed ore-tags
      cover every wall. Mendes has been dead for fourteen years. Nobody has taken
      her name off the door.'
    visual_prompt:
      solo: 'Medium interior landscape of a low-ceilinged frontier miners'' bar carved
        into the flank of a working refinery. Foreground: a battered communal counter
        with mismatched stools, layered metal ore-tags hanging in dense rows across
        the back wall. Middle ground: dim booths occupied by miners in stained coveralls.
        Background: an open archway revealing the red-orange glow of ore-crusher heat
        through a gantry doorway. Lighting from salvaged bulkhead lamps casting warm
        amber pools, deep shadow between. Mood smoky, communal, tired.'
      backdrop: 'Low-ceilinged miners'' bar interior in deep amber shadow, dense
        rows of small metal ore-tags layered across the back wall, a distant archway
        glowing red-orange from refinery heat beyond, salvaged bulkhead lamps as
        warm pools of light.'
    environment:
      solo: 'Warm amber pool-light from salvaged bulkhead lamps, deep ink-black
        shadow between, dry refinery heat seeping through the wall, low murmur of
        conversation under the steady thump of ore-crushers next door, smoke-tinted
        air.'
      backdrop: 'Amber lamp pools, refinery heat, low murmur, smoke.'
  - name: The Broken Drift (Main Belt)
    slug: the_broken_drift
    region: broken_drift
    type: asteroid_belt
    description: 'The central corridor of the asteroid belt: thousands of rocks ranging
      from gravel to small-moon size, riddled with mining claims and the occasional
      dead prospector shack still running on last year''s batteries. Salvage scows
      work the drift at low thrust, reading stencil claim-numbers off the rock faces
      with hand-lamps.'
    visual_prompt:
      solo: 'Wide deep-space landscape of an asteroid mining corridor. Foreground:
        a long irregular asteroid drifting close, its rock face pitted and pocked,
        a small salvage-scow passing slowly with hand-lamps trained on the surface.
        Middle ground: dozens more asteroids in loose formation, varying from boulder
        to small-moon size. Background: distant asteroid silhouettes against a starfield,
        a pale nebular gradient of teal and oxblood across the dark void. Mood vast,
        lonely, industrial.'
      backdrop: 'Distant asteroid silhouettes drifting in loose formation across
        deep void, pale nebular gradient of teal and oxblood washing the starfield
        behind them, a single small salvage-scow lamp blinking far off.'
    environment:
      solo: 'Cold void light, hard rim-shadow on every rock face, the soft teal-and-
        oxblood wash of distant nebula behind, the kind of vacuum quiet that turns
        the hum of a scow''s drive into the only sound in a kilometer.'
      backdrop: 'Cold void, nebular wash, distant lamps, vacuum quiet.'
  - name: Turning Hub (Docking Crescent)
    slug: turning_hub_docking
    region: turning_hub
    type: station
    description: 'The outer docking crescent of Clan Moana-Teru''s freeport: three
      station hulls welded together into a sprawling waypoint orbiting the gas giant
      Red Prospect. Customs inspectors work the queue with the unhurried patience
      of people who have decided what they are willing to notice. Ship repair bays
      flank the docking ring on both sides, and a voidborn deckhand sings while she
      welds.'
    visual_prompt:
      solo: 'Wide deep-space landscape of a sprawling free-port station composed of
        three large cylindrical hulls fused into a curved crescent shape. Foreground:
        an open repair berth with sparks from a welder, small mixed-species figures
        in flight gear at scale, gantry arms cradling a docked freighter. Middle ground:
        the curved length of the station ring with a queue of small craft awaiting
        docking. Background: the immense banded amber-and-rust globe of a gas giant
        filling half the frame. Mood busy, layered, lived-in.'
      backdrop: 'Three welded station hulls curving across the middle distance in
        crescent silhouette, the immense banded amber-and-rust globe of a gas giant
        filling the back of the frame, gantry arms and queued craft as small dark
        shapes against the planetary glow.'
    environment:
      solo: 'Warm planetary backwash from the gas giant filling the frame in amber
        and rust, sharp blue-white welder sparks punctuating the foreground, the
        constant low thrum of station spin and gantry motion, mixed lived-in haze.'
      backdrop: 'Amber planet-glow, distant gantry sparks, station hum.'
  - name: The Grand Gate (Approach)
    slug: grand_gate_approach
    region: grand_gate
    type: jump_point
    description: 'The Hegemonic customs and traffic station at the system''s only
      jump point, seen from the transit approach: a small grey installation against
      the deeper grey of empty space, lit by running lights and the occasional blue
      flash of a ship arriving. The sensor net has gaps. Every Runner in the system
      knows which ones.'
    visual_prompt:
      solo: 'Wide deep-space landscape from the perspective of an approaching ship.
        Foreground: a sleek angular hull edge in dark silhouette catching a thin rim-light.
        Middle ground: a small grey rectilinear customs station hanging in empty space,
        dotted with small running lights, with a brief blue energy flash radiating
        from its docking arm as another ship arrives. Background: pure deep void with
        a faint scatter of distant stars. Cold blue-grey lighting. Mood quiet, official,
        watchful.'
      backdrop: 'Small grey rectilinear customs station hanging in deep void, dotted
        with faint running lights, a brief cold-blue energy flash radiating from
        its docking arm, sparse distant starfield behind.'
    environment:
      solo: 'Cold blue-grey rim-light over a hard vacuum, the brief cobalt flash of
        an arriving ship pulsing across the foreground, distant pinpoint stars, the
        absolute hush of jump-point standby with the low watchful tension of every
        sensor-arc trained outward.'
      backdrop: 'Cold blue-grey, void, faint cobalt pulse, watchful hush.'
  tropes:
  # Pack-tier (genre-frame) tropes are present from arrival as the
  # background space-opera weather. They start dormant — the crew has
  # not yet generated pressure on any of them — and the activation
  # gate (PASS D in trope_tick.py) will promote them as keywords land.
  - id: hegemonic_tightening
    status: dormant
    progression: 0.05
    notes:
    - "Genre-frame echo of the system-specific crackdown — the Hegemony tightens everywhere, Coyote Star is one instance."
  - id: reputation_precedes
    status: dormant
    progression: 0.10
    notes:
    - "Mendes' Post regulars have started recognizing the hull. One jump in, one jump out — everyone notices everyone."
  - id: crew_fracture
    status: dormant
    progression: 0.05
  - id: ghost_ship
    status: dormant
    progression: 0.05
    notes:
    - "Outer-system signal is bar talk at Mendes' Post. Nobody believes it yet."
  # World-tier tropes — system-specific arcs.
  - id: hegemonic_crackdown
    status: dormant
    progression: 0.05
    notes:
    - "Vaskov taxes at the published rate. The patrol cruiser still mostly stays at Far Landing."
  - id: ore_rush
    status: dormant
    progression: 0.10
    notes:
    - "Deep Root mining dispute is bar talk and contested manifests, not yet ships at the rock."
  - id: deep_root_stirs
    status: dormant
    progression: 0.05
    notes:
    - "Outer-system readings are odd enough to log, normal enough to ignore. The Tsveri are quiet because the Tsveri are always quiet."
  - id: clan_pot
    status: active
    progression: 0.10
    notes:
    - "The crew's first dockings at Turning Hub put them at the long bench. The pot keeper notes attendance silently."
  - id: old_hull_remembers
    status: dormant
    progression: 0.05
    notes:
    - "Frontier hull, three captains' worth of patches. The ship has habits the crew has not yet noticed."
- id: early
  label: Broken Compact
  session_range:
  - 6
  - 12
  description: "The mining dispute cracks open. Someone — a prospector, a corporate\
    \ surveyor, a desperate claim-holder — pushes into Tsveri territory without\
    \ authorization. The Tsveri response is measured but unmistakable, and suddenly\
    \ the system's careful balance of mutual tolerance starts to slip. Governor Vaskov\
    \ tries to mediate but has no leverage anyone respects. Clan Moana-Teru starts\
    \ making contingency plans. The Broken Drift Runners smell opportunity. And the\
    \ outer system readings get stronger — close enough now that ignoring them\
    \ takes effort."
  events: []
  points_of_interest:
  - name: The Deep Root Range (Lowlands)
    slug: deep_root_lowlands
    region: deep_root_world
    type: alien_territory
    description: 'The temperate, empty lowlands beneath the Tsveri''s sacred mountain
      range: rolling grassland unmarked by road or settlement, the kind of landscape
      that looks like a nature reserve and is in fact an absence the Tsveri chose
      to leave. The silence is deliberate. Geological surveys pick up the rare-earth
      signal clearly from here, and the Tsveri can hear the surveys.'
    visual_prompt:
      solo: 'Wide alien landscape under a pale dawn sky. Foreground: rolling unbroken
        grassland with native grasses bending in slow wind, no roads, no fences, no
        structures. Middle ground: a slow river curving through low folds of land,
        a single solitary tree-like alien plant at distance. Background: tall jagged
        sacred mountain peaks rising in deep teal silhouette across the horizon. Soft
        cool dawn lighting. Mood deliberate, hushed, sacred. Atmosphere of intentional
        emptiness.'
      backdrop: 'Tall jagged sacred mountain peaks in deep teal silhouette across
        the horizon, rolling unbroken grassland sweeping toward them, a slow river
        curving through low folds of land, pale cool dawn sky behind.'
    environment:
      solo: 'Soft cool dawn light from a low pale sun, slow grass-bending wind, the
        deliberate hush of an unbroken landscape, distant mountain stillness, the
        kind of quiet that makes a survey ping feel like shouting in a temple.'
      backdrop: 'Pale dawn, slow wind, deliberate hush.'
  - name: The Contested Claim
    slug: the_contested_claim
    region: deep_root_world
    type: dig_site
    description: "The unauthorised excavation pushed into Tsveri territory —\
      \ a shallow scar on a foothill where the rare-earth reading spiked, torn open\
      \ by hurried hauler-drills and then abandoned. A Tsveri marker stake, placed\
      \ by something that walked here slowly, stands at the centre. The ground around\
      \ the stake has not been disturbed, and cannot be disturbed now."
    visual_prompt:
      solo: 'Medium landscape view of a fresh shallow excavation gouged into a grass-covered
        foothill. Foreground: torn red-brown soil, abandoned drill-hauler tracks cutting
        through wildflowers, a single tall carved stone marker stake of alien geometry
        at the centre of the disturbed ground, leaning slightly. Middle ground: untouched
        grassland fading back toward the slope''s crest. Background: distant alien
        sacred mountain peaks in deep teal silhouette under an overcast sky. Mood
        transgressive, watched, charged with stillness.'
      backdrop: 'Disturbed foothill scar with a single tall carved alien marker
        stake at its centre, untouched grassland fading up the slope behind it,
        distant sacred peaks in deep teal silhouette under a pale overcast sky.'
    environment:
      solo: 'Flat overcast light with no clear shadow direction, faint metallic
        scent of torn red-brown soil, no birdsong, no wind on the disturbed ground
        itself, the charged stillness of being watched from somewhere in the
        middle distance.'
      backdrop: 'Overcast flat light, charged stillness, watched.'
  - name: Red Prospect (Scoop Zone)
    slug: red_prospect_scoop_zone
    region: red_prospect
    type: gas_giant
    description: The upper atmosphere of the gas giant Red Prospect, where Clan Moana-Teru's
      converted haulers skim hydrogen through rust-banded storm bands. The view from
      a scoop-run cockpit is ninety percent weather and ten percent sky, and every
      pilot carries a small charm that belonged to someone who did not come back.
    visual_prompt:
      solo: 'Wide deep-atmosphere landscape inside the upper bands of a vast gas giant.
        Foreground: the underside of a converted bulk hauler with scoop ramps lowered,
        glowing intake plasma along its belly, trailing thin streamers of hydrogen
        vapour. Middle ground: roiling rust-banded storm clouds streaked with chains
        of distant lightning. Background: layered storm bands curving away to a planetary
        horizon, a pale distant moon. Dramatic underlighting from the plasma intake.
        Mood turbulent, dwarfing, exhilarating.'
      backdrop: 'Layered rust-banded storm clouds curving away into deep atmospheric
        distance, chains of distant lightning threading the bands, a pale small
        moon high in the upper frame, planetary horizon arcing across the back.'
    environment:
      solo: 'Dramatic violet-orange underlighting from plasma intake glow, roiling
        wind shear felt through the hull, distant lightning pulsing rhythmically
        across the storm bands, the dwarfing pressure of standing inside a planet''s
        weather.'
      backdrop: 'Rust-orange storm light, distant lightning, dwarfing scale.'
  - name: The Broken Drift Runners' Meet
    slug: broken_drift_runners_meet
    region: broken_drift
    type: hideout
    description: A cluster of mined-out asteroids the Runners use as a rolling meeting
      point, rotated every few weeks to stay off any patrol pattern. A hollowed rock
      with a pressurised bay, a sensor-shadow orbit, and the kind of hospitality that
      is entirely transactional. During the Broken Compact the Meet is at full capacity
      and the Runners are taking contracts they would not have taken a month ago.
    visual_prompt:
      solo: 'Medium deep-space landscape of an outlaw rendezvous in a hollowed asteroid.
        Foreground: the open mouth of a pressurised docking bay carved into a large
        rock, two unmarked vessels berthed inside under warm amber bay lights, a small
        figure in flight gear standing at the threshold. Middle ground: a loose cluster
        of mined-out smaller asteroids forming a sensor-shadow ring. Background: deep
        void with a faint nebular oxblood haze. Mood clandestine, transactional, watchful.'
      backdrop: 'Hollowed asteroid mouth glowing warm amber from interior bay
        lights, a loose cluster of smaller mined-out rocks forming a sensor-shadow
        ring around it, deep void behind with a faint nebular oxblood haze.'
    environment:
      solo: 'Warm amber bay-glow spilling from the asteroid mouth into hard vacuum,
        cold rim-shadow on every surrounding rock, a low oxblood nebular wash
        behind, the watchful quiet of a place that does not exist on any chart.'
      backdrop: 'Amber bay-glow, cold void, oxblood haze, off-chart quiet.'
  - name: Dark Reach (Listening Drift)
    slug: dark_reach_listening_drift
    region: last_drift
    type: anomaly
    description: 'A point in the outer system, past Red Prospect, where the persistent
      low-frequency signal is loudest. A handful of outer-system prospectors have
      dropped makeshift sensor buoys here. The readings are consistent: something
      is broadcasting, and the broadcast is not coming from any charted body. The
      Tsveri have nothing to say about this, and the nothing is pointed.'
    visual_prompt:
      solo: 'Wide deep-space landscape at the cold edge of a star system. Foreground:
        a small makeshift sensor buoy bristling with antennae and dish arrays drifting
        against the void, a faint indicator light blinking on its hull. Middle ground:
        a few more scattered buoys at distance, their lights faint pinpricks. Background:
        a vast empty starfield with a single pale circular region of subtle visual
        distortion that does not match the surrounding sky. Cold blue-grey lighting.
        Mood eerie, expectant, scientific.'
      backdrop: 'Vast empty starfield with a single pale circular region of subtle
        chromatic distortion that does not match the surrounding sky, scattered
        sensor-buoy indicator lights as faint pinpricks across the middle distance.'
    environment:
      solo: 'Cold blue-grey light from no clear source, distant indicator lights
        blinking out of phase with each other, the absolute hush of outer-system
        vacuum, the pressure of a region of sky that does not match its
        neighbours.'
      backdrop: 'Cold blue-grey, hush, sky that does not match.'
  tropes:
  # Pack-tier tropes mature alongside the system-specific arcs.
  - id: hegemonic_tightening
    status: active
    progression: 0.20
    notes:
    - "The Hegemony's frontier playbook is in motion across multiple systems. Vaskov is the local arm."
  - id: reputation_precedes
    status: active
    progression: 0.20
    notes:
    - "After the Contested Claim, every faction at Far Landing knows whose ship was where during the breach week."
  - id: crew_fracture
    status: dormant
    progression: 0.10
    notes:
    - "Mining-claim politics force the crew to take sides. The Compact contracts and the clan contracts no longer overlap."
  - id: ghost_ship
    status: dormant
    progression: 0.15
    notes:
    - "Listening Drift readings are stronger this month than last. The makeshift sensor buoys agree on a bearing nobody wants to fly."
  - id: ore_rush
    status: active
    progression: 0.40
    notes:
    - "The Contested Claim is filed. Three other prospectors say they were there first. The original is hiding at Turning Hub."
    - "Drift Runners are taking contracts they would not have taken a month ago."
  - id: deep_root_stirs
    status: active
    progression: 0.30
    notes:
    - "An unauthorised excavation pushed into Tsveri territory. The marker stake is in the ground. The Sealkeeper has been named in conversation."
  - id: hegemonic_crackdown
    status: active
    progression: 0.25
    notes:
    - "Vaskov tries to mediate the dispute and has no leverage anyone respects. He is asking, not telling, and everyone hears the difference."
  - id: clan_pot
    status: active
    progression: 0.25
    notes:
    - "Clan Moana-Teru is making contingency plans. The pot keeper has begun tracking which crews skip the long bench and how often."
  - id: silent_one
    status: dormant
    progression: 0.10
    notes:
    - "Outer-system signal readings are stronger this month than last. A crewmate who was on the Listening Drift run has been quiet on watch since."
  - id: old_hull_remembers
    status: active
    progression: 0.20
    notes:
    - "A previous captain's name surfaced at Mendes' Post. The hull's Tsveri silicon patches resonate when the conversation turns to the Deep Root."
- id: mid
  label: Grand Gate
  session_range:
  - 13
  - 20
  description: "Control of the jump point becomes the central question. With the mining\
    \ dispute unresolved and outside interests starting to notice Coyote Star's rare-earth\
    \ deposits, whoever holds Grand Gate decides what comes in, what goes out, and\
    \ who gets to stay. The Hegemony sends a second ship — or threatens to. The\
    \ voidborn consider closing Turning Hub to pressure all sides. The Tsveri break\
    \ their silence about the outer system, and what they say changes the stakes entirely.\
    \ The players are no longer bystanders in a trade dispute. They're in the middle\
    \ of a fight over what this system is and who it belongs to."
  events: []
  points_of_interest:
  - name: Grand Gate (Control Deck)
    slug: grand_gate_control_deck
    region: grand_gate
    type: jump_point
    description: 'The control deck of the jump-point station: a small windowless room
      walled in sensor repeaters and departure manifests, staffed by three tired Hegemonic
      officers and a warrant officer who has personally opened the gate to every ship
      in the last ten years. During the crisis the deck is full: voidborn observers,
      Compact delegates, and a second Hegemonic patrol captain whose orders arrived
      sealed.'
    visual_prompt:
      solo: 'Medium interior landscape of a small windowless command deck aboard a
        far-future jump-point station. Foreground: a curved console covered with banks
        of sensor repeater displays glowing teal and amber, a single senior officer
        seated at the central station. Middle ground: three additional uniformed officers
        at flanking consoles, a sealed orders cylinder resting on a side table. Background:
        bulkhead walls layered with embossed plaque panels stacked in tight rows.
        Cool overhead recessed lighting with warm screen glow on faces. Mood tense,
        overcrowded, official.'
      backdrop: 'Curved bulkhead walls layered with rows of embossed plaque panels,
        flanking consoles glowing teal and amber, cool overhead recessed lighting
        with warm screen-glow washing over the back of the deck.'
    environment:
      solo: 'Cool overhead recessed lighting with warm teal-and-amber screen glow
        underlit on faces, dry recycled air, the close-quarters tension of a
        windowless room with too many people in it, the steady hum of sensor
        repeaters.'
      backdrop: 'Cool recessed light, warm screen-glow, dry air, tense hum.'
  - name: Turning Hub (Negotiation Bay)
    slug: turning_hub_negotiation_bay
    region: turning_hub
    type: station
    description: 'Clan Moana-Teru''s neutral-ground meeting hall on the inner ring
      of Turning Hub: an open bay with benches cut from hull plate arranged in concentric
      arcs around a single low table. The clan elder presides by custom. The Tsveri
      delegation is present, for the first time in a generation, and the silence while
      they consider the table changes the air pressure in the room.'
    visual_prompt:
      solo: "Medium interior landscape of a neutral-ground meeting hall aboard a free-port\
        \ station. Foreground: a single low circular table cut from welded hull plate\
        \ at the room's centre, surface bare. Middle ground: concentric arcing benches\
        \ cut from the same hull plate, occupied by a mixed delegation — silhouetted\
        \ alien figures of unfamiliar proportion, voidborn human elders in patterned\
        \ robes, station clan members. Background: the curved bulkhead of a station\
        \ inner ring with tall viewports showing distant stars and the upper limb\
        \ of a gas giant. Soft cool overhead light. Mood ceremonial, weighted with\
        \ silence."
      backdrop: 'Curved station inner-ring bulkhead with tall viewports showing
        distant stars and the upper limb of a gas giant beyond, concentric arcing
        benches cut from welded hull plate sweeping back across the floor, soft
        cool overhead light.'
    environment:
      solo: 'Soft cool overhead light from concealed strips, the upper limb of a
        gas giant casting a faint amber wash across the bulkhead viewports, the
        ceremonial weight of unbroken silence, recycled station air gone still
        with attention.'
      backdrop: 'Cool overhead light, faint amber viewport wash, ceremonial silence.'
  - name: The Deep Root Sacred Peaks
    slug: deep_root_sacred_peaks
    region: deep_root_world
    type: alien_sanctum
    description: The heart of the Tsveri range, where the rare-earth deposits sit
      directly beneath the oldest ceremonial sites. The peaks are heavily eroded and
      seismically quiet in a way geologists find suspicious. The Tsveri have walked
      these paths for millennia and their footprints have pressed small, consistent
      hollows into stone that should not be soft enough to hold them.
    visual_prompt:
      solo: 'Wide alien landscape high in a sacred mountain range. Foreground: smooth
        weather-worn rock paths across a ridge, shallow rounded hollows pressed into
        the stone in a regular walking pattern, leading away from camera. Middle ground:
        heavily eroded peaks of pale grey-green stone, ceremonial standing stone arches
        at the ridge line. Background: deeper mountain ranges receding under a pale
        jewel-toned alien sky banded with high thin cloud. Soft directional dawn light,
        long shadows. Mood ancient, sacred, geologically wrong.'
      backdrop: 'Heavily eroded sacred peaks of pale grey-green stone with
        ceremonial standing stone arches along the ridge line, deeper mountain
        ranges receding behind under a pale jewel-toned sky banded with high
        thin cloud.'
    environment:
      solo: 'Soft directional dawn light from low across the range, long mineral
        shadows, thin cold mountain air, an unnatural seismic quiet, the geologic
        sense of standing in a place where time runs at a different rate.'
      backdrop: 'Cool dawn light, long shadows, unnatural quiet.'
  - name: Last Drift (Outer Anomaly)
    slug: last_drift_outer_anomaly
    region: last_drift
    type: anomaly
    description: "The source of the persistent low-frequency signal, now triangulated:\
      \ a region of space past Last Drift where the navigational readings disagree\
      \ with every chart. Ships approaching slow without throttle input. The background\
      \ radiation runs cooler than the void around it. The Tsveri, when pressed, have\
      \ given a name for it — not a translation, a name — and the name has\
      \ four syllables."
    visual_prompt:
      solo: 'Wide deep-space landscape at the far cold edge of a star system. Foreground:
        a small sleek starship in dark approach silhouette, drives idle, rim-lit by
        a faint violet glow. Middle ground: a faintly visible spherical region of
        space where the starfield bends and refracts subtly, edges shimmering with
        chromatic distortion. Background: pure void with cooler-than-natural shadow
        gradients, a sparse scatter of distant stars. Mood enigmatic, hushed, threshold-like.'
      backdrop: 'Faintly visible spherical region of space where the starfield bends
        and refracts, edges shimmering with subtle chromatic distortion, surrounding
        void cooler than natural with sparse distant stars and a faint violet rim
        glow at its perimeter.'
    environment:
      solo: 'Faint violet rim glow with no obvious source, ambient void colder than
        the surrounding sky, the hush of drives gone idle without command, the
        threshold pressure of standing at the edge of something that has noticed
        you back.'
      backdrop: 'Violet rim glow, colder void, threshold hush.'
  - name: The Vaskov Plateau Summit
    slug: vaskov_plateau_summit
    region: far_landing
    type: landmark
    description: 'The open plateau above Vaskov Centrum where the governor has called
      an unprecedented open council: Compact, clan, Tsveri delegation, Hegemony, and
      any Drift Runner willing to attend under safe-conduct. The benches are folding
      camp-chairs. The sky above the plateau is clear for the first time in a week
      and the brown sunset is visible from the back row.'
    visual_prompt:
      solo: "Wide elevated landscape of an open windswept high plateau at sunset.\
        \ Foreground: irregular rows of folding camp-chairs facing inward toward a\
