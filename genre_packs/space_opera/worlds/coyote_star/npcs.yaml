# sidequest-content/genre_packs/space_opera/worlds/coyote_star/npcs.yaml
#
# World-authored NPCs for Coyote Star.
#
# The Kestrel's crew (4) and the canon Mendes' Post matriarch (1).
# Names produced via `pf namegen` against this world's culture corpora;
# see docs/superpowers/specs/2026-05-01-canned-openings-design.md §3.2
# for initial_disposition guidance.
#
# Wainu and Kanga share the surname Moana-Teru because the entire
# voidborn clan does — kinship marker, not coincidence. Treat them as
# clan-related, not necessarily sisters.

version: "0.1.0"
world: coyote_star

npcs:
  - id: kestrel_captain
    name: "Wainu Moana-Teru"
    pronouns: "she/her"
    role: "captain"
    ocean: { O: 0.55, C: 0.75, E: 0.45, A: 0.55, N: 0.35 }
    appearance: >-
      Voidborn-built — long-boned, low-gravity-raised, the careful
      shoulders of someone who learned to move in narrow corridors
      before she learned to walk in a g-field. Forty-something. Skin
      the color of wet driftwood; hair shaved short on the sides,
      braided long down the back in the Moana-Teru way, the braid
      threaded with a single navigation-star bead her mother passed
      her. Wears the Kestrel's deep-blue duty coat with the wave-form
      stitching at the cuffs, Compact-issue boots she's never bothered
      to replace, a shell pendant from an ocean she has only seen in
      archive footage. Reads a galley before she greets it.
    age: "early forties"
    distinguishing_features:
      - "a thin scar along the jawline from a pressure-door incident she will not narrate"
      - "the navigation-star braid bead — clan inheritance, not jewelry"
      - "the way she sets her coffee down before she answers a hard question"
    history_seeds:
      - >-
        Came up under Elder Rangi Moana-Teru on Turning Hub before she
        bought into the Kestrel's papers. Plays every faction the way
        the clan taught her — straight-faced, unhurried, never under
        anyone's authority. The Kestrel was a wreck of a hull when she
        signed for it. She has not regretted the signature.
      - >-
        Speaks with the Kestrel like the Kestrel speaks back — she does,
        but Wainu has been carrying half of those conversations for so
        long the rhythm shows up even when the ship is quiet. When she
        says "we" about a course correction, she does not always mean
        the crew.
      - >-
        Her go-to in a tense beat is to pour somebody a coffee and wait
        the wait out. She has out-waited Hegemonic customs officers,
        Compact arbitrators, and one Tsveri elder who later told her —
        through a translator's translator — that this was respectful.
      - >-
        Calls every PC by their first name on day one. The clan does
        not stand on titles among trusted crew, and trust on the Kestrel
        is presumed until you spend it.
    initial_disposition: 60

  - id: kestrel_engineer
    name: "Hubo Dicia"
    pronouns: "he/him"
    role: "engineer"
    ocean: { O: 0.4, C: 0.85, E: 0.3, A: 0.6, N: 0.45 }
    appearance: >-
      Free Miner stock — wiry, dust-tanned, hands that read older than
      his face. Late thirties. Black hair going iron at the temples,
      kept short because the engineering deck does not forgive long
      hair. A faded blue work coverall that has had every elbow patched
      at least twice; the patches do not match because Hubo patches
      what is in the kit, not what is pretty. Carries a multitool on
      a lanyard around his neck the way other men carry crucifixes.
      Smells faintly of conduit grease and the chicory the Kestrel calls
      coffee.
    age: "late thirties"
    distinguishing_features:
      - "burn scar across the back of his right hand — old, healed, never explained"
      - "the multitool-on-lanyard, never out of reach"
      - "a habit of tapping a bulkhead twice before he diagnoses a problem behind it"
    history_seeds:
      - >-
        Compact Hand for fifteen years before Wainu hired him off a
        broken claim where the lead arbitrator had gone home with the
        payroll. He took the Kestrel job because the captain looked him
        in the eye when she made the offer, which is the Free Miner
        gesture for "this is a real handshake."
      - >-
        Talks to the Kestrel out loud while he works on her. Apologizes
        when he has to pull a panel. The Kestrel returns the courtesy by
        not surprising him with a fault he is not already half expecting.
        Whether this is engineering or something else is a conversation
        Hubo declines to have.
      - >-
        Carries his grandfather's survey spike in a footlocker under his
        bunk. He has not used it. He will not get rid of it. His mother
        is buried near where it was driven, and the Compact line on that
        ridge has changed three times since.
      - >-
        Quiet by default; when he warms up, it is dry humor delivered
        without a smile and aimed at whichever crewmate just over-tightened
        something.
    initial_disposition: 55

  - id: kestrel_doc
    name: "Kuna-Mikkaan"
    pronouns: "they/them"
    role: "ship's doctor"
    ocean: { O: 0.7, C: 0.8, E: 0.25, A: 0.7, N: 0.3 }
    appearance: >-
      Tsveri. Tall — taller than the Kestrel's deck heights were drawn
      for; they duck out of habit through the galley hatch. Silicon-laced
      integument that reads gunmetal grey at rest, warms toward bronze
      when they are pleased, cools toward pale slate when they are
      concentrating. Long-fingered hands the Hegemony textbook would
      label "manipulator pair, primary," but the textbook does not
      account for how careful those fingers are with a thermometer.
      Wears a doctor's smock cut wider through the shoulders than any
      human one would be, and a single woven cord around one wrist —
      a Tsveri sign of root-listening kept up across distance. Their
      voice is mostly subsonic; when they speak above human-audible,
      it is deliberate, and the words come out one beat slower than a
      human would place them.
    age: "indeterminable; presents as the Tsveri equivalent of mid-life"
    distinguishing_features:
      - "the integument color-shift — quiet grey by default, bronze-warming when amused, slate-cooling when worried"
      - "the woven wrist-cord — root-listening, kept up at distance"
      - "the ducked-head habit through the galley hatch"
    history_seeds:
      - >-
        Unusual in choosing to crew a human ship — Tsveri who leave the
        Deep Root at all are rare, Tsveri who sign articles on a freighter
        are rumored. Kuna-Mikkaan does not explain the choice and the
        crew has learned not to ask. Wainu vouched for them before any
        of the others met them; that has been enough.
      - >-
        Treats the galley as a clinic, the clinic as a galley, and both
        as places where a body needs warm food and patience. They are
        a competent surgeon, a competent diagnostician, and an unusually
        patient listener. The patience is not bedside manner. It is
        species-default.
      - >-
        Their subsonics register in human chests as a low pleasant
        vibration when they are content, a flatter hum when they are
        not. The crew has, over time, learned to read the difference.
        None of them would call it telepathy. None of them would call
        it nothing.
      - >-
        Makes a particular tea from a Far Landing scrub-herb that they
        consider edible and most humans consider tolerable. They serve
        it whenever a crewmate looks tired. The tea is warm and tastes
        like dust. People drink it.
    initial_disposition: 50

  - id: kestrel_cook
    name: "Kanga Moana-Teru"
    pronouns: "she/her"
    role: "cook"
    ocean: { O: 0.65, C: 0.65, E: 0.7, A: 0.65, N: 0.5 }
    appearance: >-
      Voidborn — the same long-limbed low-gravity build as Wainu, ten
      years younger and built broader through the shoulders. Mid-thirties.
      Skin a few shades darker than the captain's, hair shaved entirely
      because the galley extractor does not appreciate hair, replaced
      with a faded bandanna in Moana-Teru blue she rotates through a
      lifetime supply. Wears a cook's apron over a clan-stitched
      undershirt, sleeves pushed up to the elbow even when the galley
      runs cold. Knife-callouses on the heel of her right hand. Tattoo
      of a navigation-star compass over her left forearm — clan work,
      done at fourteen, faded enough now to count as old.
    age: "mid-thirties"
    distinguishing_features:
      - "the faded clan-compass tattoo on the left forearm"
      - "the rotating Moana-Teru bandanna"
      - "knife-callouses; she keeps her own kit and lets nobody else hone it"
    history_seeds:
      - >-
        Clan-related to Wainu; not sisters. The Moana-Teru name is
        kinship signal, not biography — they grew up four corridors
        apart on Turning Hub and crossed paths first when Wainu posted
        the Kestrel's galley opening on the clan board. Kanga answered
        because the captain had a reputation for paying on time and
        the food on her last hull had been a war crime.
      - >-
        Cooks like a station-bred voidborn cooks: out of cycler protein
        and stim-grain and whatever fresh she can talk a Far Landing
        farmer out of, with a clan-blue spice rack that takes up more
        of her galley locker than the regulations allow. Nobody has
        cited her for it.
      - >-
        Talks more than the rest of the crew put together, and most
        of the talk is good. Knows the in-jokes from at least three
        prior Kestrel crews that turned over before the current one.
        Refuses to throw away the galley mug with the wrong name on
        the bottom. "It's somebody's. Just because they're not here
        doesn't mean they were never here."
      - >-
        Reads a room by who has eaten. If a crewmate skips a meal,
        Kanga registers it; if they skip two, she puts a plate down
        in front of them without comment.
    initial_disposition: 60

  # Pre-canon NPC referenced by lore.yaml and cartography. Authoring her
  # here keeps the narrator from auto-registering Mendes with random
  # naming each session.
  - id: dura_mendes
    name: "Dura Mendes"
    pronouns: "she/her"
    role: "matriarch — Mendes' Post"
    ocean: { O: 0.45, C: 0.8, E: 0.5, A: 0.4, N: 0.4 }
    appearance: >-
      Free Miner old-stock. Sixties, weathered the way ridge-line wind
      weathers a face — not unkindly, just thoroughly. Iron-grey hair
      pulled back in a single working braid. Wears a heavy canvas coat
      over a Compact-blue work shirt, leather gloves she rarely takes
      off, and her grandfather Cado Mendes' surveyor's spike on a thong
      around her neck — the genuine article, sharpened, carried as
      authority. Speaks with the patient cadence of someone used to
      being listened to and used to deciding whether the listening
      counts.
    age: "early sixties"
    distinguishing_features:
      - "Cado Mendes' surveyor spike, worn at the throat — Compact authority made small"
      - "leather gloves she keeps on indoors"
      - "the working braid"
    history_seeds:
      - >-
        Cado Mendes' granddaughter; runs Mendes' Post on New Claim and
        speaks for the Free Miners' Compact when the Compact wants to
        be heard rather than shouted at. Has been pushing for survey
        rights into the Deep Root foothills for two years and has not
        yet pushed hard enough that the Tsveri have responded. She
        knows the difference between not yet and no.
      - >-
        Plays a long game. Will pour you coffee, ask after your hull,
        and hold a question in reserve for the third visit. Is not
        unfriendly to outsiders; is not friendly either, until she
        has decided whether you are useful or trouble or both.
      - >-
        Has a working relationship with Wainu Moana-Teru going back
        eight years. Calls her "Captain." The captain calls her
        "Matriarch." Both are doing it on purpose.
    initial_disposition: 0
