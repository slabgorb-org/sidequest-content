# Character portraits for Coyote Star
# Visual descriptions for Z-Image portrait generation
# Aesthetic: lived-in sci-fi, frontier colony, dramatic lighting

characters:
  # ── VASKOV ADMINISTRATION ──────────────────────────────────────

  - name: Prefect Ilara Vaskov
    role: Hegemonic Governor
    type: npc_major
    culture: hegemonic
    appearance: >-
      A woman in her late forties with sharp Slavic features softened by
      twenty years of frontier dust. Ash-blonde hair pulled back in a
      regulation chignon that's coming loose at the temples. Grey eyes
      that calculate before they sympathize. Lean build, straight-backed,
      the posture of someone raised military but worn down by bureaucracy.
      Her Hegemonic dress uniform is immaculate from the collar to the
      waist and creased from sitting at a desk below that. Ink stains on
      her right hand. The face of someone who writes more reports than
      orders.
    culture_aesthetic: >-
      Hegemonic core-world authority — crisp naval uniform in charcoal
      and silver, rank insignia at the collar, Hegemonic starburst patch
      on the shoulder. The uniform is regulation but the boots are local
      leather, a concession to the frontier she'd never admit to.

  - name: Commander Eske Tran
    role: Patrol Cruiser Captain
    type: npc_supporting
    culture: hegemonic
    appearance: >-
      A compact man in his fifties with deep brown skin, a shaved head,
      and the economy of movement that comes from thirty years on ship
      decks with low clearance. Broad shoulders, thick forearms, hands
      that rest at his sides like they're waiting for a railing to grab.
      His face is all angles — high cheekbones, narrow jaw, deep-set
      eyes that track movement before they track faces. A thin scar runs
      from his left ear to his jaw, old enough to be silver.
    culture_aesthetic: >-
      Hegemonic naval officer — dark blue shipboard uniform, magnetic
      boot clips visible at the ankles, zero-g harness webbing under
      the jacket. Everything functional, nothing decorative. A ship
      captain who lives on his ship.

  # ── FREE MINERS' COMPACT ───────────────────────────────────────

  - name: Dura Mendes
    role: Free Miners' Compact Leader
    type: npc_major
    culture: free_miners
    appearance: >-
      A broad-shouldered woman in her early fifties with sun-darkened
      brown skin, calloused hands the size of cargo clamps, and black
      hair shot through with grey, cut short and practical. Her face is
      weathered — deep lines around the mouth, crow's feet baked in by
      alkali wind. Strong jaw, prominent nose, dark eyes that hold yours
      a beat too long. She stands like someone used to heavy gravity and
      hard ground. Not tall, but dense — the build of someone who has
      spent decades hauling ore in partial atmosphere.
    culture_aesthetic: >-
      Frontier miner aristocracy — patched environment suit worn open
      over a faded work shirt, dust-caked boots, a belt hung with claim
      markers and a geological scanner. No insignia, no rank — her
      authority comes from her name and her grandfather's survey spike.

  # ── CLAN MOANA-TERU ────────────────────────────────────────────

  - name: Rangi Moana-Teru
    role: Clan Elder, Turning Hub
    type: npc_major
    culture: voidborn
    appearance: >-
      An old man, maybe seventy, maybe eighty — voidborn age differently
      and he's not telling. Deep brown skin with the ashen undertone of
      someone who hasn't stood under a real sun in decades. White hair
      worn long and loose, floating slightly in the station's imperfect
      gravity. A broad face, heavy-lidded eyes that look half-asleep and
      miss nothing, a wide mouth that defaults to an expression of mild
      amusement. Big hands, slow gestures, the deliberate movements of
      someone who learned to conserve energy in a place where everything
      is rationed.
    culture_aesthetic: >-
      Voidborn clan elder — layered station-wear in deep blues and
      blacks, woven with reflective thread that catches light like
      stars. Polynesian-influenced textile patterns — wave forms and
      navigation stars — stitched into the collar and cuffs. Shell and
      bone jewelry from a home-world ocean none of his generation has
      ever seen.

  - name: Hine Moana-Teru
    role: Turning Hub Dockmaster
    type: npc_supporting
    culture: voidborn
    appearance: >-
      A tall woman in her thirties with the lean, long-limbed build of
      someone born in low gravity. Dark brown skin, black hair shaved
      on the sides and braided tight on top to stay out of helmet seals.
      Quick dark eyes, a jaw set permanently forward, and a voice that
      carries across a docking bay without ever rising above conversational
      volume. Moves in the fluid, wall-pushing way of someone more
      comfortable in zero-g than under spin.
    culture_aesthetic: >-
      Voidborn working class — practical EVA-rated jumpsuit in clan
      blue, magnetic tool harness across the chest, clan pattern
      embroidered at the shoulders. Dock grease on her sleeves, fuel
      residue on her boots.

  # ── THE TSVERI ─────────────────────────────────────────────────

  - name: Tsukhari
    role: Tsveri Root-Speaker
    type: npc_major
    culture: tsveri
    appearance: >-
      Tall — a full head above the tallest human — with the slow,
      deliberate posture of a species that does not hurry. Silicon-laced
      integument that catches light like wet stone, shifting between
      slate grey and deep amber depending on mood. No hair — the head
      is smooth, ridged along the crown, with deep-set eyes that are
      solid dark amber with no visible pupil. The face is broad and
      flat, with a wide mouth and no visible nose — respiration happens
      through lateral slits along the jaw. Four-fingered hands, long
      and precise, with mineral-dark nails. Moves with the patience of
      something geological.
    culture_aesthetic: >-
      Tsveri elder — no clothing in the human sense. Wears a drape of
      woven mineral fiber across one shoulder, embedded with fragments
      of Deep Root stone that pulse faintly with a light that has no
      visible source. The drape is not decoration — it is the only
      marker of a root-speaker's role.

  # ── BROKEN DRIFT RUNNERS ───────────────────────────────────────

  - name: Lachesis Wren
    role: Broken Drift Coordinator
    type: npc_major
    culture: broken_drift
    appearance: >-
      A wiry woman of indeterminate age — could be thirty-five, could
      be fifty, the kind of face that anti-aging treatments and hard
      living have rendered timeless. Pale skin with a spacer's pallor,
      sharp cheekbones, thin lips, and grey-green eyes that never quite
      focus on you because they're watching the two people behind you.
      Short dark hair, choppy, cut with a knife and not recently. Lean
      build, quick hands, the coiled stillness of someone who can go
      from sitting to sprinting without a visible transition.
    culture_aesthetic: >-
      Spacer underclass — mismatched civilian clothes layered for
      utility, not warmth. A battered flight jacket with every patch
      and insignia removed, leaving ghost outlines. Cargo pants with
      too many pockets, all full. Boots that have been resoled twice.

  # ── GRAND GATE ─────────────────────────────────────────────────

  - name: Customs Inspector Osei
    role: Jump Point Customs Chief
    type: npc_supporting
    culture: hegemonic
    appearance: >-
      A heavyset man in his forties with deep black skin, a meticulously
      trimmed beard going grey at the chin, and the tired eyes of someone
      who has scanned ten thousand cargo manifests and believes none of
      them. Broad build running slightly to fat — station living and desk
      work. His hands are soft but his grip is firm when he takes your
      documents. Wears reading glasses he doesn't technically need,
      because looking over them at people is a more effective interrogation
      technique than anything they taught at the academy.
    culture_aesthetic: >-
      Hegemonic customs service — grey uniform with orange customs
      division trim, slightly rumpled. Badge of office on a lanyard.
      The uniform of a man who represents an authority everyone
      acknowledges and nobody respects.

  - name: Philip Espero
    role: Outer System Prospector
    type: npc_supporting
    culture: free_miners
    appearance: >-
      A young man in his late twenties with a lean, angular face —
      sun-darkened brown skin, wide Tejano-Anglo bones, dark eyes
      with the thousand-yard stare of someone who's spent too much
      time alone in the outer system. Black hair kept short under a
      battered prospector's cap, three days of stubble along the
      jaw. Rangy build, long arms, the fidgeting energy of someone
      who can't sit still in gravity. A nervous smile that comes
      too quickly and leaves too fast.
    culture_aesthetic: >-
      Frontier prospector — patched EVA suit worn as daily clothing,
      claim tags jingling on a carabiner at his hip, asteroid dust
      in every seam. The look of someone who lives out of a single-seat
      mining skiff and showers when he remembers.

  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS
  # Generic culture × archetype portraits players can choose from at
  # character creation. Not bound to any named NPC. Naming convention:
  # picker_<culture>_<role>_<sex><nn> — the middle token is a short
  # occupation/role slug, NOT the archetype (5-14 archetypes are shared
  # across dozens of roles). Slugs prefixed `picker_` so they sort
  # separately from NPC portraits in images/portraits/.
  # 2026-07 expansion: retrofitted the original 10 with id/archetype/sex
  # (previously carried only in the name/role text) and topped up every
  # culture to the floor (hegemonic, free_miners, voidborn, broken_drift,
  # tsveri all ≥4) so all 14 world+pack archetypes appear at least once.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Hegemonic ─────────────────────────────────────────
  #
  # NOTE: appearance is intentionally terse (~50 tokens). The daemon's
  # PromptComposer applies CASTING + GENRE + WORLD + CULTURE layers and
  # the World layer alone is ~226 tokens, so casting must stay tight.
  # `culture_aesthetic` is omitted because CharacterCatalog ignores it
  # for catalog-composed renders — wardrobe lives in cultures/<id>.yaml.

  - id: picker_hegemonic_officer_f01
    name: picker hegemonic officer f01
    role: Hegemonic Naval Lieutenant
    type: player_picker
    culture: hegemonic
    archetype: Company Officer
    sex: female
    backdrop_poi: vaskov_centrum
    appearance: >-
      Woman, early thirties. Sharp Slavic features, ash-blonde hair in
      a regulation chignon, pale grey eyes that take a beat to settle.
      Lean, straight-backed. Pale freckles across the nose, a thin scar
      bisecting the left eyebrow. Mouth held in the neutral academy line.

  - id: picker_hegemonic_customs_m01
    name: picker hegemonic customs m01
    role: Hegemonic Customs Inspector
    type: player_picker
    culture: hegemonic
    archetype: Gate Customs Officer
    sex: male
    backdrop_poi: grand_gate_control_deck
    appearance: >-
      Man in his late forties wearing a grey customs duty jacket with
      orange trim at the collar, a badge of office on a lanyard.
      Mixed-heritage face — Slavic bones under deep olive skin, dark
      squinting eyes. Black hair half-grey at the temples, neat
      salt-and-pepper beard. Reading glasses on a chain at his chest.
      A datapad tucked under one arm. Heavy-lidded, faintly amused.

  - id: picker_hegemonic_bartender_f01
    name: picker hegemonic bartender f01
    role: Station Bartender, Hegemonic Quarter
    type: player_picker
    culture: hegemonic
    archetype: Station Bartender
    sex: female
    backdrop_poi: vaskov_plateau_summit
    appearance: >-
      Woman, fifties. Deep black skin, silver-streaked locs in a tight
      crown, brown eyes politely curious. Square jaw, full mouth in a
      private smile. Strong hands, thin gold ring on the right index
      finger. Third-generation colonial.

  - id: picker_hegemonic_clerk_m01
    name: picker hegemonic clerk m01
    role: Vaskov Administrative Clerk
    type: player_picker
    culture: hegemonic
    archetype: Vaskov Clerk
    sex: male
    backdrop_poi: grand_gate_approach
    appearance: >-
      Man in his sixties, thinning grey hair combed flat, round wire-frame
      glasses low on his nose. Soft jowled face, small tired eyes, mouth
      downturned from decades of stamping forms. Charcoal clerk's tunic
      buttoned to the throat, ink-stained cuffs, a stamper clipped to his belt.

  # ── Picker · Free Miners ───────────────────────────────────────

  - id: picker_free_miners_prospector_f01
    name: picker free miners prospector f01
    role: Free Miners Prospector
    type: player_picker
    culture: free_miners
    archetype: Belt-Runner Prospector
    sex: female
    backdrop_poi: red_prospect_scoop_zone
    appearance: >-
      Woman, late twenties. Sun-darkened brown skin, wide Tejano-Anglo
      face, dark steady eyes. Black hair in a thick single braid, wisps
      escaping at the temples. Turquoise stud in one nostril, pale scar
      along the jaw. Calluses ringing each knuckle.

  - id: picker_free_miners_hauler_m01
    name: picker free miners hauler m01
    role: Free Miners Ore Hauler
    type: player_picker
    culture: free_miners
    archetype: Free Trader
    sex: male
    backdrop_poi: mendes_post
    appearance: >-
      Man, early forties. Weathered tan skin, heavy black moustache going
      grey, deep-set brown eyes under a wide brow. Black hair shot with
      silver, cut blunt at the ears. Thick neck, big square hands, old
      burn-scars on the forearms.

  - id: picker_free_miners_rig_mechanic_f01
    name: picker free miners rig mechanic f01
    role: Free Miners Rig Mechanic
    type: player_picker
    culture: free_miners
    archetype: Grease Monkey
    sex: female
    backdrop_poi: the_broken_drift
    appearance: >-
      Woman in her thirties, sun-browned face streaked with grease, thick
      dark brows, a smear of drill oil along one cheek. Cropped dark hair
      under a bandana, strong jaw set in concentration. Patched coveralls
      open at the collar, a wrench looped through her tool belt.

  - id: picker_free_miners_prospector_m01
    name: picker free miners prospector m01
    role: Free Miners Claim Prospector
    type: player_picker
    culture: free_miners
    archetype: Belt-Runner Prospector
    sex: male
    backdrop_poi: the_contested_claim
    appearance: >-
      Older man, sixties, deep sun-lines around pale eyes, grey stubbled
      jaw. Bald above a weathered brow, sunburned scalp under a battered
      cap. Broad heavy shoulders in an open work jacket, collar turned up,
      alkaline dust caked into every seam.

  # ── Picker · Voidborn ──────────────────────────────────────────

  - id: picker_voidborn_spacer_f01
    name: picker voidborn spacer f01
    role: Voidborn Free Trader
    type: player_picker
    culture: voidborn
    archetype: Free Trader
    sex: female
    backdrop_poi: turning_hub_docking
    appearance: >-
      Tall woman, late twenties, low-grav lean build. Dark brown skin,
      full mouth, black hair shaved on one side and tight-braided on
      the other in a crown of small knots. Deep-set almond eyes,
      unblinking calm. Small wave-form tattoo at one eye.

  - id: picker_voidborn_medic_m01
    name: picker voidborn medic m01
    role: Voidborn Ship's Doctor
    type: player_picker
    culture: voidborn
    archetype: Ship's Doctor
    sex: male
    backdrop_poi: turning_hub_negotiation_bay
    appearance: >-
      Older man with grey-streaked black hair worn long past the
      shoulders, salt-and-pepper beard, weathered face deeply lined
      around the eyes and mouth. Broad Polynesian features, crow's
      feet, laugh lines, the deep-set tired eyes of a fifty-year-old
      ship's doctor. Deep brown skin gone faintly ashen under station
      light. A medical satchel slung across the chest, reading glasses
      on a cord at his throat. A thin braid behind one ear with a
      silver bead.

  - id: picker_voidborn_fuel_broker_f01
    name: picker voidborn fuel broker f01
    role: Turning Hub Fuel Broker
    type: player_picker
    culture: voidborn
    archetype: Moana-Teru Fuel Broker
    sex: female
    backdrop_poi: turning_hub_docking
    appearance: >-
      Woman in her forties, broad calm face, dark brown skin with an
      ashen undertone, black hair braided close to the scalp in clan
      rows. Heavy-lidded appraising eyes, faint wave-form tattoo along
      one cheekbone. Deep-blue station-wear, navigation-star stitching
      at the collar.

  - id: picker_voidborn_dock_runner_m01
    name: picker voidborn dock runner m01
    role: Turning Hub Dock Runner
    type: player_picker
    culture: voidborn
    archetype: Dock Rat
    sex: male
    backdrop_poi: turning_hub_docking
    appearance: >-
      Wiry man in his twenties, low-gravity build, dark brown skin,
      quick darting eyes that map every exit before a face. Black hair
      shaved close at the sides, uneven growth on top. Patched clan-blue
      jacket loose at the shoulders, a smudge of dock grease on one sleeve.

  # ── Picker · Broken Drift ──────────────────────────────────────

  - id: picker_broken_drift_smuggler_m01
    name: picker broken drift smuggler m01
    role: Broken Drift Runner
    type: player_picker
    culture: broken_drift
    archetype: Jump-Point Runner
    sex: male
    backdrop_poi: the_broken_drift
    appearance: >-
      Man in his thirties wearing a plain dark canvas jacket over a
      worn shirt, blank shoulders and blank chest, scuffed leather at
      the collar. Pale spacer's skin, sharp angular features, grey-green
      eyes tracking past your shoulder. Dark hair short and uneven,
      three days of stubble. Thin scar from cheekbone to jaw. Single
      silver hoop in one ear.

  - id: picker_broken_drift_captain_f01
    name: picker broken drift captain f01
    role: Broken Drift Captain
    type: player_picker
    culture: broken_drift
    archetype: Burned Operative
    sex: female
    backdrop_poi: broken_drift_runners_meet
    appearance: >-
      Wiry woman, age-ambiguous — thirty-five or fifty. Pale spacer
      skin, thin scar through one eyebrow, sharp grey eyes amused and
      exhausted. Choppy chin-length dark hair, mismatched clip. Dark
      tattoo on the side of the neck, partially scarred over.

  - id: picker_broken_drift_runner_f01
    name: picker broken drift runner f01
    role: Broken Drift Courier
    type: player_picker
    culture: broken_drift
    archetype: Jump-Point Runner
    sex: female
    backdrop_poi: the_broken_drift
    appearance: >-
      Young woman, late twenties, pale spacer pallor, sharp narrow face,
      quick pale-green eyes that never settle. Dark hair cropped ragged
      at the jaw. Charcoal flight jacket with faded ghost-outlines where
      patches once sat, collar up, a single worn thumb-band — her only mark.

  - id: picker_broken_drift_fixer_nb01
    name: picker broken drift fixer nb01
    role: Broken Drift Fixer
    type: player_picker
    culture: broken_drift
    archetype: Burned Operative
    sex: nonbinary
    backdrop_poi: broken_drift_runners_meet
    appearance: >-
      Lean adult, indeterminate age, pale spacer skin, close-cropped
      grey-brown hair, a flat unreadable expression, watchful grey eyes.
      Mismatched dark civilian layers with every insignia stripped clean,
      collar high. A single chipped pin, unexplained, at the breast.

  # ── Picker · Tsveri ────────────────────────────────────────────

  - id: picker_tsveri_liaison_nb01
    name: picker tsveri liaison nb01
    role: Tsveri Outsider-Speaker
    type: player_picker
    culture: tsveri
    archetype: Tsveri Trade-Emissary
    sex: nonbinary
    backdrop_poi: deep_root_sacred_peaks
    appearance: >-
      A Tsveri, tall — a head above the tallest human. Silicon-laced
      integument shifting between slate grey at the shoulders and warm
      amber along the throat. Smooth ridged head, deep-set solid amber
      eyes with no pupil, wide flat mouth, no visible nose.
      Four-fingered hands loose at the sides.

  - id: picker_tsveri_interpreter_nb01
    name: picker tsveri interpreter nb01
    role: Tsveri Interpreter
    type: player_picker
    culture: tsveri
    archetype: Xeno Cultural Liaison
    sex: nonbinary
    backdrop_poi: deep_root_sacred_peaks
    appearance: >-
      A younger Tsveri, slighter build than most of its kind, silicon
      integument a cool pale slate. Smooth ridged head, wide flat face,
      deep-set solid amber eyes. Narrow four-fingered hands held open,
      a posture of practiced patience learned for human company.

  - id: picker_tsveri_emissary_nb01
    name: picker tsveri emissary nb01
    role: Tsveri Trade Emissary
    type: player_picker
    culture: tsveri
    archetype: Tsveri Trade-Emissary
    sex: nonbinary
    backdrop_poi: deep_root_lowlands
    appearance: >-
      A broad-built Tsveri, integument shifting warm amber across the
      shoulders. Smooth ridged crown, wide flat face, deep-set amber
      eyes catching the light. Four-fingered hands loose at its sides,
      a woven mineral-fiber drape crossing one shoulder, unhurried bearing.

  - id: picker_tsveri_elder_nb01
    name: picker tsveri elder nb01
    role: Tsveri Elder Liaison
    type: player_picker
    culture: tsveri
    archetype: Xeno Cultural Liaison
    sex: nonbinary
    backdrop_poi: deep_root_sacred_peaks
    appearance: >-
      An old Tsveri, integument gone dull basalt-grey with age, deep
      fissures across the ridged crown. Wide flat face settled into
      geological stillness, deep-set amber eyes half-lidded. Heavy
      four-fingered hands, a frayed mineral-fiber drape worn thin at
      one shoulder.
