# sidequest-content/genre_packs/space_opera/worlds/coyote_star/mp_opening.yaml
#
# Multiplayer opening for Coyote Star. Replaces the solo
# `char_creation.yaml:confirmation` step ("Far Landing, Morning") when
# `mode == multiplayer`.
#
# DESIGN INTENT (Keith, 2026-04-30):
#   "A multiplayer session should land in a Kestrel-style rig in a chill
#    setting." MP openings establish crew-as-crew (Firefly model), not
#    drop one PC into a turn-1 confrontation while the others ghost.
#
# STATUS: Draft — pending opening-selector precedence code (see pingpong
# `[DESIGN] Multiplayer sessions must open aboard the world's flagship
# rig`). File is parseable but the loader does not yet consume it.
#
# Companions:
#   - char_creation.yaml          (solo confirmation: "Far Landing, Morning")
#   - rigs.yaml                   (Kestrel chassis_instance)
#   - ../../openings.yaml         (genre archetypes — DO NOT fire on turn 1
#                                 in MP; reserve for turns 2+ as catalysts)

version: "0.1.0"
world: coyote_star
genre: space_opera

mp_openings:
  - id: kestrel_galley_jumprest
    name: "Galley, Jump-Rest"

    triggers:
      mode: multiplayer
      min_players: 2
      max_players: 6

    setting:
      rig: kestrel
      room: galley
      situation: >-
        Mid-jump-rest. Engines on minimum, the Kestrel coasting on
        momentum between markers — what Mendes' Post crews call "the
        long coffee." Inbound for Mendes' Post, fourteen hours give or
        take a Hegemonic delay. No emergency, no destination drama,
        no one shooting at anyone. This is the breathing-room
        opening — the crew exists, the rig exists, the void exists,
        and the players get to find their voices before anything pulls.

    tone:
      register: warm, lived-in, dry
      stakes: none on turn 1
      complication: defer to turn 2 or 3
      sensory_layers:
        smell: >-
          Recycled air, burnt-edge of "coffee" that is mostly chicory
          and stim-grain, faint reactor-warmth seeping through the deck.
        sound: >-
          Long quiet hum of a ship at coast, galley extractor fan
          ticking, somebody's mug hitting the table.
        touch: >-
          Deck-warm underfoot, the chill of an alkaline-glass porthole
          if a PC leans on it.
      avoid_at_all_costs:
        - any confrontation
        - any dice roll
        - any rig-emergency framing (no hull breach, no engine flare,
          no pursuit, no Hegemony hail)
        - genre archetypes from `space_opera/openings.yaml`
          (arena_trial, ship_crisis, diplomatic_incident, first_contact)
          — those are mid-session catalysts, not openers
        - moving the players around without their input
        - introducing an antagonist in dialogue range

    establishing_narration: |
      The Kestrel is mid-jump-rest, drifting on coast through the dark
      between markers. Engines on minimum. The hull's long quiet hum
      that voidborn crews call the breath of a ship that knows where
      it's going.

      The galley is warm. The extractor fan ticks once every few
      seconds — a cycle the Kestrel never bothered to recalibrate
      because, as she has explained more than once, "It is doing
      its job exactly enough."

      Mendes' Post in fourteen hours, give or take a Hegemonic delay.
      The coffee is what passes for coffee. Outside the porthole,
      void and stars and the faint indifferent gradient of a distant
      nebula in teal and oxblood.

    rig_voice_seeds:
      # Kestrel's voice register: dry_warm, OCEAN { O:0.6 C:0.7 E:0.4
      # A:0.5 N:0.5 }, name-form for trusted PCs is {first_name}.
      # Tics: theatrical sigh, "almost-but-legally-distinct from a
      # laugh," dry-as-bonemeal, drops-to-a-discreet-murmur.
      - context: first PC enters the galley
        line: |
          "{first_name}. The coffee is what passes for coffee. You'll
          want to be philosophical about it."
      - context: a PC has been on extended watch
        line: |
          *[a theatrical sigh, exactly long enough to register as
          judgement]* "Eight hours, {first_name}. I appreciate the
          consistency."
      - context: two PCs at the table, one says something dry
        line: |
          *[a sound almost-but-legally-distinct from a laugh, from no
          particular speaker grille]*
      - context: a PC asks position or ETA
        line: |
          "We are between things, in the way one is. Mendes' Post in
          fourteen, give or take a Hegemonic delay. Drink your coffee."
      - context: a PC asks the Kestrel something earnest
        line: |
          *[the register drops to a discreet murmur, addressed only
          to that PC's seat]* "Mm. Yes. I had noticed."

    per_pc_beats:
      # Triggered by chargen `drive` choice. Each beat is a low-key
      # textural moment that gives the PC something to react to
      # without forcing action. Use 0–1 per PC; not all PCs need a beat.
      - applies_to: { drive: "I Saw Something Out Past the Gas Giant" }
        beat: |
          Your datapad is open on the galley counter. The nav log from
          the run before last is still showing — the route you didn't
          tell anyone about. The screen times out on its own. You let it.

      - applies_to: { drive: "Someone Went Into the Drift" }
        beat: |
          A Compact loss-claim notice scrolls past on the galley feed,
          routine, unrelated. You read the name on it anyway. You
          always read the name.

      - applies_to: { drive: "A Debt That Followed Me Through the Gate" }
        beat: |
          A piece of mail in the Kestrel's relay queue, addressed to a
          name you don't use anymore. Not flagged urgent. Not nothing.

      - applies_to: { drive: "My Place Got Dissolved" }
        beat: |
          Through the porthole over the galley booth — the cloud-banded
          gas giant hangs indifferent in the middle distance, the kind
          of view you used to be able to see from your old window in
          a way that doesn't bear thinking about. You watch it for a
          minute longer than you mean to.

    soft_hook:
      kind: pull_not_push
      timing: surfaces during turn 1 if conversation lulls, otherwise
        wait for turn 2
      narration: |
        On the galley terminal, an inbound comm blinks once — slow,
        unhurried, the way the Kestrel queues things she hasn't
        decided are urgent.

        "Tagged for this ship," she says, after exactly the right
        beat of waiting. "From Mendes' Post. You can read it now,
        or finish your coffee. Both are valid."
      escalation_path:
        turn_2_or_3: >-
          The message names a job. The job has a wrinkle. The wrinkle
          pulls toward one PC's drive — the narrator picks whichever
          PC has the strongest hook hit on the per_pc_beats above, or
          rolls if it's a tie.
        do_not: >-
          Do not preview the wrinkle in the establishing scene. The
          opening is the breath; the wrinkle is the second beat.

    first_turn_invitation: |
      The Kestrel waits the way a ship waits. The coffee is what it is.
      Outside the porthole: void, stars, the long indifferent gradient
      of distant gas.

      What does each of you do?

    party_framing:
      already_a_crew: true
      bond_tier_default: trusted
      shared_history_seeds:
        - "muscle memory from at least three jumps' worth of patch kits"
        - "an in-joke about Vaskov customs that one of you started and
          none of you can remember whose fault it was"
        - "a galley mug that has a name written on the bottom that is
          not any of yours, that nobody throws away"
      narrator_guidance: >-
        These PCs already know each other. They have crewed the Kestrel
        long enough to have reflexes around each other. Treat them as
        established; do not re-introduce them to one another.
