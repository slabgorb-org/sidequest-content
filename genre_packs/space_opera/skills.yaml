# Space Opera — WWN/SWN Skill Catalog (WWN SRD §1.6)
#
# space_opera binds the swn ruleset, which shares Worlds Without Number's
# 21-skill list (the server's without_number.py core uses these canonical
# names for every WN-family pack — see heavy_metal/skills.yaml). The names
# are SRD-canonical; only the FLAVOR is space opera. The skill set does not
# change what a person can learn — only the register they learn it in:
#
#   Sail    — piloting starships, shuttles, and small craft through the black
#   Ride    — ground and atmosphere vehicles, walkers, mounts on frontier worlds
#   Work    — engineering labor: rigs, drives, life-support, hull repair
#   Craft   — fabrication, jury-rigging, pretech tinkering
#   Magic   — psionic disciplines (this pack's "magic" is psionics; see
#             disciplines_psionic.yaml). Kept for catalog completeness.
#   Pray    — devotion / ritual register (Church of the Cloud, station chapels)
#
# All background free_skill / quick_skills and focus level skills MUST be in
# this list (validator CG3, No Silent Fallbacks).
- Administer
- Connect
- Convince
- Craft
- Exert
- Heal
- Know
- Lead
- Magic
- Notice
- Perform
- Pray
- Punch
- Ride
- Sail
- Shoot
- Sneak
- Stab
- Survive
- Trade
- Work
