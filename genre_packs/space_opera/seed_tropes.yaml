# Seed tropes for space_opera — short-arc narrative hooks dealt at session
# start from a per-pack deck (ADR-018, ADR-128). Dealt without replacement;
# each seed expires after its lifespan_turns and lingers as a ghost for later
# callback. Seeds are baited hooks (ADR-014 diamonds-and-coal) — vague on
# purpose; the narrator retroactively threads engaged seeds into whatever
# the campaign demands of the crew.
#
# World-agnostic by design (ADR-140): these must land equally on a salvage
# rig, a spacer mezzanine, or a baroque corona megastation. Genre grammar
# only — crews, cargo, jurisdictions, distances, and the gap between what
# the manifest says and what is true.

- id: the_manifest_disagrees_with_the_hold
  name: The Manifest Disagrees with the Hold
  description: >-
    Cargo the crew is carrying, hauling, or standing next to does not
    match its papers — heavier, colder, one crate too many, or sealed
    with a fastener nobody on the docks uses anymore. Whoever signed
    the manifest signed it knowing.
  flavor_tags: [cargo, smuggling, complicity, jurisdiction]
  lifespan_turns: 8
  delivery_hints:
    - The discrepancy is small enough to ignore once, but it is noticed at the worst possible checkpoint
    - A dockhand or junior inspector clearly already knows and is waiting to see what the crew does
    - Opening the cargo answers one question and creates three obligations
  narrative_hint: >-
    The cargo is leverage in every direction — over the crew, by the
    crew, against the shipper. Let the question shift from "what is it"
    to "who is allowed to know we know."

- id: a_distress_call_with_one_wrong_detail
  name: A Distress Call with One Wrong Detail
  description: >-
    A distress signal, a casualty report, or a request for rescue
    arrives in correct form — codes valid, voice convincing — except
    for one detail that someone aboard knows cannot be true. The error
    is not sloppy. It is either a trap or a message.
  flavor_tags: [rescue, deception, signal, isolation]
  lifespan_turns: 6
  delivery_hints:
    - Answering is the law of the lanes and ignoring it will be remembered by other spacers
    - The wrong detail is only wrong to someone with specific history — to everyone else it reads clean
    - Whoever sent it knew exactly who would catch the error
  narrative_hint: >-
    The call is addressed to the crew whether they realize it or not.
    Let the wrong detail be the safest place to hide a warning, and let
    responding correctly require trusting the person who caught it.

- id: the_inspector_wants_something_other_than_compliance
  name: The Inspector Is Not Here About the Paperwork
  description: >-
    An inspection, customs sweep, or routine boarding finds the crew's
    papers entirely in order — and the official lingers anyway. What
    they actually want is off the record: a name, a small carriage job,
    a blind eye in the other direction. Refusal is legal. So is what
    happens to crews that refuse.
  flavor_tags: [authority, corruption, leverage, bargain]
  lifespan_turns: 7
  delivery_hints:
    - The request is phrased so it can be denied later by everyone involved
    - The official is visibly performing for someone else — a superior, a listener, a camera
    - Other crews in dock have clearly already made their arrangements
  narrative_hint: >-
    The ask is small and the precedent is enormous. Let the crew price
    what their compliance is worth, and let the official become either
    a standing asset or a patient enemy depending on the answer.

- id: someone_pays_too_much_for_passage
  name: A Passenger Who Pays Too Much
  description: >-
    Someone wants transport — discreet, no questions, modest distance —
    and offers several times the fair rate without negotiating. They
    carry almost nothing. They are polite, punctual, and wrong in a way
    nobody can name yet.
  flavor_tags: [passenger, secrets, pursuit, hospitality]
  lifespan_turns: 8
  delivery_hints:
    - The overpayment is the passenger pricing in a risk they have not disclosed
    - Somebody comes asking after them within days — courteous, well-funded, and not official
    - The passenger keeps to their cabin except once, somewhere they should not be
  narrative_hint: >-
    The fare buys the crew's silence but not their loyalty — let the
    passenger's pursuer make a better offer, and let the crew discover
    what the passenger is carrying in their head rather than their bag.

- id: the_same_job_was_sold_twice
  name: The Job Was Sold to Another Crew Too
  description: >-
    Mid-job — salvage claim, courier run, escort contract — the crew
    encounters another outfit holding paper for the same work. Both
    contracts are genuine. The broker who double-sold it is far away,
    and the other crew is exactly as committed, exactly as armed, and
    exactly as wronged as the players.
  flavor_tags: [rivals, contract, broker, standoff]
  lifespan_turns: 6
  delivery_hints:
    - The rival crew's version of the job has one detail the players' version omits
    - Splitting the take is possible but the contract pays only on exclusive delivery
    - The broker's double-sale was not greed; somebody paid them to put two crews in one place
  narrative_hint: >-
    The rivals are a mirror, not a monster. Let the real question be
    what the broker wanted from the collision, and let cooperation
    against the broker be the path neither contract permits.

- id: an_old_debt_docks_at_the_same_port
  name: An Old Debt Is in Port
  description: >-
    Someone from a crew member's past — a creditor, a betrayed partner,
    an old commander — is at the same station, berth, or anchorage. They
    have not noticed yet. They will. The debt is not necessarily money,
    and the interest has been compounding in memory.
  flavor_tags: [past, debt, reputation, reunion]
  lifespan_turns: 7
  delivery_hints:
    - A third party mentions the name first, conversationally, with no idea what it means
    - The debt-holder's circumstances have changed dramatically — for better or much worse
    - Leaving port early is possible and will be read, correctly, as flight
  narrative_hint: >-
    The debt is a door to who the crew member was before the ship. Let
    the reunion offer a clean settlement at an unclean price, and let
    the rest of the crew learn something the debtor never told them.

- id: the_dead_ship_answers
  name: The Dead Ship Answers
  description: >-
    A hulk, wreck, or long-silent station — known derelict, marked on
    every chart as cold — responds. A transponder wakes, a light cycles,
    a docking clamp releases as if expecting someone. Salvage law says
    it is anyone's. Whatever switched it on disagrees.
  flavor_tags: [derelict, salvage, mystery, signal]
  lifespan_turns: 6
  delivery_hints:
    - The response is specific to the crew's approach — it did not wake for the last three ships through
    - Something aboard has been maintained; the dust lies wrong
    - The registry says the ship was lost with a cargo that never appeared on any market
  narrative_hint: >-
    The wake-up is an invitation with an agenda. Let the derelict hold
    a survivor, a system still executing old orders, or a cache someone
    arranged to be found — and let claiming it make the crew visible
    to whoever else was waiting.

- id: the_bounty_matches_an_old_name
  name: The Bounty Notice Uses an Old Name
  description: >-
    A warrant, bounty, or detain-on-sight notice is circulating, and
    the name or face on it belongs to someone aboard — under an
    identity they shed years ago. The notice is recent. Someone, only
    now, decided that old name was worth money.
  flavor_tags: [identity, bounty, pursuit, trust]
  lifespan_turns: 8
  delivery_hints:
    - The reward is oddly precise — priced to tempt acquaintances, not professionals
    - The issuing party is not who the crew member would have guessed
    - One person outside the crew has already made the connection and not yet acted on it
  narrative_hint: >-
    The notice is a clock and a confession both — someone needs that
    old identity found NOW, which means something the crew member
    buried has resurfaced. Let the cheapest solution be the one the
    crew won't like.

- id: a_faction_asks_for_a_small_carriage
  name: A Small Favor for a Large Organization
  description: >-
    A power — house, syndicate, navy, church, combine — asks the crew
    to carry something trivial: a sealed letter, a minor functionary, a
    crate of nothing special. The pay is fair. The implications are not
    discussed. Saying yes makes the crew a courier of record in
    something they cannot see the shape of.
  flavor_tags: [faction, courier, complicity, patronage]
  lifespan_turns: 8
  delivery_hints:
    - The asking agent is mid-rank and visibly relieved when the crew accepts
    - A rival power notices the carriage almost immediately and asks polite questions
    - The trivial thing is trivial; the fact of WHO carried it is the payload
  narrative_hint: >-
    The crew is being enrolled, not hired — let the favor be the first
    move in making them a known quantity on somebody's board. The exit
    ramp is early refusal; every completed carriage raises the price
    of neutrality.

- id: the_part_that_only_one_person_sells
  name: The Part Only One Person Sells
  description: >-
    Something the ship needs — a component, a license renewal, a
    recalibration only one yard can certify — is available from exactly
    one source in reach, and that source knows it. The price is not
    outrageous. It is merely not money.
  flavor_tags: [scarcity, bargain, ship, monopoly]
  lifespan_turns: 6
  delivery_hints:
    - The monopolist is friendly and utterly immovable; the terms are the terms
    - A cheaper alternative exists and is illegal, unsafe, or owned by someone worse
    - What the monopolist wants done is small and tells the crew exactly what they're afraid of
  narrative_hint: >-
    The monopoly is a window into local power — whoever permits it to
    exist is the real seller. Let paying the price bind the crew into
    the port's politics, and let the unsafe alternative stay quietly
    available the whole time.

- id: the_comrade_on_the_wrong_side
  name: An Old Comrade in the Wrong Uniform
  description: >-
    Someone a crew member served with, survived something with, or owes
    their life to turns up on the opposing side of the current job —
    enforcing the blockade, guarding the target, collecting for the
    other party. They are not a villain. They are exactly where the
    crew member would be, two decisions differently.
  flavor_tags: [loyalty, war, past, opposition]
  lifespan_turns: 7
  delivery_hints:
    - Recognition is mutual and neither side's employer knows yet
    - The comrade offers a quiet professional courtesy that is also a test
    - Their presence means the opposition knows more about the crew than the job briefing implied
  narrative_hint: >-
    The comrade is genre-true opposition — competent, sympathetic, and
    paid. Let the old loyalty buy exactly one favor, and make the
    second ask cost one of them their standing.

- id: the_lockdown_lands_mid_errand
  name: The Lockdown Lands Mid-Errand
  description: >-
    A station section, port district, or traffic lane seals — security
    sweep, quarantine, an "incident" nobody official will name — with
    the crew inside, split, or due to depart within hours. The lockdown
    is real, but its timing serves somebody specific.
  flavor_tags: [lockdown, authority, timing, confinement]
  lifespan_turns: 5
  delivery_hints:
    - The cordon's boundaries are drawn strangely, enclosing one place that matters and someone who knows why
    - Officials enforce it with the bored thoroughness of people who weren't told the reason either
    - Somebody approaches the crew precisely because they're trapped — captive audiences make good recruits
  narrative_hint: >-
    Confinement is a pressure cooker, not a wall — let whoever
    engineered the lockdown be using it to move, hide, or find
    something while the port holds still. The crew's exit problem
    is somebody else's opportunity.

- id: the_coordinates_are_a_question
  name: Sealed Coordinates, Open Question
  description: >-
    The crew comes into possession of a destination — sealed orders, a
    dead spacer's nav core, coordinates traded as payment — that no
    chart explains. Whoever owned it before guarded it or died near it.
    Selling it is easy. Knowing what it points at is not.
  flavor_tags: [mystery, navigation, inheritance, temptation]
  lifespan_turns: 8
  delivery_hints:
    - A buyer materializes fast — too fast — offering generously and asking no questions
    - Partial verification is cheap; full verification means going there
    - Someone recognizes the format of the coordinates and goes quiet
  narrative_hint: >-
    The coordinates are a fork in the campaign: sell, follow, or sit
    on them while interested parties accumulate. Let each turn that
    passes raise both the price and the danger of holding.

- id: the_crew_is_being_recruited_one_by_one
  name: Somebody Is Recruiting the Crew One by One
  description: >-
    Quietly, separately, members of the crew are each approached with
    an offer — better pay, an old dream, a debt forgiven — by agents
    who do not mention they are also courting the others. The offers
    are real. The pattern is the point.
  flavor_tags: [loyalty, temptation, intrigue, crew]
  lifespan_turns: 7
  delivery_hints:
    - Each offer is precisely fitted to its target — somebody has done research
    - "The offers share a fingerprint: same phrasing, same intermediary, same conspicuous omission"
    - Nothing forbids the crew comparing notes except embarrassment
  narrative_hint: >-
    The recruiter wants the ship broken or the crew bought whole — let
    the players discover which by talking to each other, and let the
    first one to confess an offer set the tone for what the crew is.
