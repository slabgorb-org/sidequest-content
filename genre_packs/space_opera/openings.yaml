- id: arena_trial
  archetype: challenge
  situation: >-
    The player enters a public arena, tournament, or proving ground. They
    must demonstrate skill or cunning to earn passage, rank, or an audience
    with someone important. No one explains the rules — observe and adapt.
  tone: tense, spectacular
  avoid:
    - helpful NPC at a market stall
    - fetch quests
    - docking bay exposition
  first_turn_seed: >-
    The crowd noise hits you like a wall. The arena floor is already
    stained. Someone shoves you forward — it's your turn.

- id: diplomatic_incident
  archetype: mystery
  situation: >-
    The player arrives at a station or vessel during a crisis — an ambassador
    is missing, a treaty is collapsing, or two factions are moments from
    violence. The player is caught in the middle, not briefed on the situation.
  tone: political, urgent
  avoid:
    - casual station tour
    - shopping district introductions
    - simple delivery missions
  first_turn_seed: >-
    The docking clamps haven't finished cycling before the alarm hits.
    Emergency frequencies are screaming in three languages. Something
    has gone very wrong aboard this station.

- id: ship_crisis
  archetype: survival
  situation: >-
    The player's ship is damaged, drifting, or under attack. Systems are
    failing. The immediate problem is survival — patching the hull,
    restoring life support, or evading whoever did this.
  tone: claustrophobic, desperate
  avoid:
    - planet-side settlement arrival
    - NPC quest dispensers
    - leisurely exploration
  first_turn_seed: >-
    The hull breach alarm screams through smoke-filled corridors. Gravity
    is failing on deck three. Your ship is dying around you.

- id: first_contact
  archetype: arrival
  situation: >-
    The player encounters something genuinely unknown — an alien signal,
    an uncharted anomaly, or a species never catalogued. Wonder and danger
    exist in equal measure. No one has a briefing for this.
  tone: awe, tension
  avoid:
    - familiar space station tropes
    - helpful guide NPCs
    - routine missions
  first_turn_seed: >-
    The sensor array is showing something that shouldn't exist. The
    navigation computer has no match. Whatever it is, it knows you're here.
