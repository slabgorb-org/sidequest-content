stat_generation: roll_3d6_strict
point_buy_budget: 0
magic_level: none
# DRAFT (2026-04-27): the `magic_level` flag is being retired. It's misleading
# here — magic items are core gameplay; this pack's actual claim is "no caster
# classes" + `world_knowledge: folkloric`. See ./magic.yaml for the full
# napkin-shaped truth and docs/design/magic-taxonomy.md for the framework.

allowed_classes:
  - Fighter
  - Mage
  - Cleric
  - Thief
allowed_races:
  - Human

banned_spells: []


custom_rules:
  treasure_as_xp: "true"
  keeper_awareness: "true"
  resource_ticks: "true"
  extraction_phase: "true"
  encumbrance: "strict"
  injuries: "permanent"

default_class: Delver
default_race: Human
default_location: "The mouth of the dungeon"
default_time_of_day: dawn


ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

stat_display_fields:
  - hp
  - max_hp
  - ac
  - torches
  - rations
  - encumbrance
  - gold

encounter_base_tension:
  random: 0.15
  ambush: 0.40
  boss: 0.50
  final: 0.60

initiative_rules:
  combat:
    primary_stat: DEX
    description: "Reflexes and speed determine who strikes first"
  chase:
    primary_stat: DEX
    description: "Agility and footwork set the pace"
  social:
    primary_stat: CHA
    description: "Force of personality controls the conversation"
  exploration:
    primary_stat: WIS
    description: "Awareness determines who notices things first"

# ── Confrontations ──────────────────────────────────────────
# Forward-ported from main 5144b6c (story 28-10) — combat + chase
# ConfrontationDefs. Required by sidequest-api test
# `packs_without_confrontations_yaml_have_empty_vec`.
confrontations:
  - type: combat
    label: Dungeon Combat
    category: combat
    resolution_mode: opposed_check
    # Opponent stats calibrated to mod +0 per ADR-093 (was 12 / mod +1).
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
    player_metric:
      name: momentum
      starting: 0
      threshold: 7
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 7
    beats:
      - id: attack
        label: Attack
        kind: strike
        base: 2
        stat_check: STR
        effect: "Target takes damage this round"
        narrator_hint: Steel rings off stone. Torchlight flickers across the blow.
      - id: defend
        label: Defend
        kind: brace
        base: 1
        stat_check: CON
        effect: "Reduce incoming damage this round, brace against the push"
        narrator_hint: Shield raised, back to the wall, weight forward.
      - id: shield_bash
        label: Shield Bash
        kind: strike
        base: 4
        deltas:
          crit_fail:
            own: -2
        stat_check: STR
        class_filter: [Fighter, Cleric]
        effect: "Stun the target briefly, break their footing"
        risk: "Overcommitted — lose 2 momentum and take a counter on failure"
        narrator_hint: Slam forward in the narrow corridor — nowhere to dodge.
      - id: feint
        label: Feint
        kind: angle
        target_tag: "Off-Balance"
        stat_check: DEX
        class_filter: [Fighter, Thief]
        effect: "Set up a leverage tag the next attack can spend"
        narrator_hint: A bait — open the guard, draw the swing.
      - id: flee
        label: Flee
        kind: push
        base: 1
        stat_check: DEX
        consequence: "Combat ends — retreat deeper into the dungeon"
        narrator_hint: Break contact, torch sweeping behind you as you run.
      - id: cleave
        label: Cleave
        kind: strike
        base: 3
        stat_check: STR
        class_filter: [Fighter]
        effect: "Wide swing — opens up space against multiple foes"
        narrator_hint: "Two-handed sweep, momentum carrying through to the next stance."
      - id: parry
        label: Parry
        kind: brace
        base: 2
        stat_check: DEX
        class_filter: [Fighter]
        effect: "Trade momentum for a guarantee — turn the next blow aside"
        narrator_hint: "Steel meets steel, deflecting just enough."
      - id: backstab
        label: Backstab
        kind: strike
        base: 4
        stat_check: DEX
        target_tag: "Off-Balance"
        class_filter: [Thief]
        risk: "Requires Off-Balance setup — wasted swing without it"
        effect: "Out of the dark, blade between ribs"
        narrator_hint: "Shadow into the gap, blade going in where armor stops."
      - id: sneak
        label: Slip Behind
        kind: angle
        target_tag: "Off-Balance"
        stat_check: DEX
        class_filter: [Thief]
        effect: "Set up an Off-Balance tag the next backstab can spend"
        narrator_hint: "A step into the side passage, gone before the lantern catches."
      - id: cast_cantrip
        label: Cast Cantrip
        kind: strike
        base: 1
        stat_check: INT
        class_filter: [Mage]
        effect: "A small working — a glamour, a spark, a trick"
        narrator_hint: "A flick of the wrist, a syllable too brief to catch."
      - id: cast_spell
        label: Cast Spell
        kind: strike
        base: 4
        stat_check: INT
        class_filter: [Mage]
        risk: "Consumes a spell slot; without one, the verb does not exist"
        resource_deltas:
          spell_slots: -1.0
        effect: "The prepared spell unspools — page burns or memory empties"
        narrator_hint: "The morning's memorized syllables, spent in one pass."
      - id: turn_undead
        label: Turn Undead
        kind: push
        base: 3
        stat_check: WIS
        class_filter: [Cleric]
        effect: "Drives the dead off the field"
        narrator_hint: "Holy symbol raised; the unliving recoil from the will behind it."
      - id: pray
        label: Pray for Aid
        kind: brace
        base: 1
        stat_check: WIS
        class_filter: [Cleric]
        edge_delta: 1
        effect: "The saint listens, briefly — composure returns"
        narrator_hint: "A whispered name, an answered breath."
    morale:
      score: 8
      triggers: [first_blood, half_killed, intimidated, leader_killed]
      flee_consequence: chase
    mood: combat
  - type: chase
    label: Corridor Pursuit
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: sprint
        label: Sprint
        kind: push
        base: 2
        stat_check: DEX
        narrator_hint: Boots echo off stone as the quarry bolts down the passage.
      - id: duck_through
        label: Duck Through
        kind: angle
        target_tag: "Out of Sight"
        stat_check: INT
        narrator_hint: Squeeze through a side passage too narrow for pursuers.
      - id: barricade
        label: Barricade
        kind: brace
        base: 1
        stat_check: INT
        effect: "Topple debris to slow pursuit"
      - id: douse_torch
        label: Douse Torch
        kind: push
        base: 1
        stat_check: DEX
        consequence: "Chase ends in darkness — quarry vanishes"
    mood: tension
  - type: negotiation
    label: "Haggling at the Counter"
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 7
    opponent_metric:
      name: leverage
      starting: 3
      threshold: 7
    beats:
      - id: talk_up_the_haul
        label: "Talk Up the Haul"
        kind: strike
        base: 2
        stat_check: CHA
        effect: "merchant entertains the asking price — their eyebrow does the thing"
        narrator_hint: "The delver pitches the goods like a town crier."
      - id: swear_its_not_cursed
        label: "Swear It's Not Cursed"
        kind: strike
        base: 3
        deltas:
          crit_fail:
            own: -1
        stat_check: CHA
        risk: "if the bluff fails, merchant knocks 50% off the offer"
        effect: "merchant accepts the suspicious item — with a receipt, carefully worded"
        narrator_hint: "Running-joke territory. Lean all the way in."
      - id: plead_poverty
        label: "Plead Poverty"
        kind: angle
        target_tag: "Sympathetic"
        stat_check: WIS
        effect: "merchant softens — sets up a leverage tag for the closer"
        narrator_hint: "The delver goes for the sympathy play."
      - id: flash_the_coin
        label: "Flash the Coin"
        kind: brace
        base: 1
        stat_check: CHA
        effect: "merchant's disposition tightens — the real price slips out"
        narrator_hint: "A small concession now to read the shop properly."
      - id: walk_toward_the_door
        label: "Walk Toward the Door"
        kind: push
        base: 1
        stat_check: WIS
        consequence: "Negotiation ends — leave with the merchant's last offer"
    mood: comedic

# Per-class starting Edge (composure pool).
# Class strings match Character.char_class display values (set via class_hint
# in char_creation.yaml). Fighter has the deepest pool — trained to be hit.
# Mage and Thief share the lowest — glass-cannon and skirmisher respectively.
edge_config:
  base_max_by_class:
    Fighter: 4
    Cleric:  3
    Mage:    2
    Thief:   2

  recovery_defaults:
    on_resolution: full
    on_long_rest: full
    between_back_to_back: 0
