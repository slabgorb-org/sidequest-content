stat_generation: roll_3d6_strict
point_buy_budget: 0
magic_level: none

allowed_classes:
  - Delver
allowed_races:
  - Human

banned_spells: []

hp_formula: "8 + CON_modifier"

custom_rules:
  treasure_as_xp: "true"
  keeper_awareness: "true"
  resource_ticks: "true"
  extraction_phase: "true"
  encumbrance: "strict"
  injuries: "permanent"
  no_classes: "true"
  no_races: "true"
  no_spells: "true"

default_class: Delver
default_race: Human
default_hp: 8
default_ac: 10
default_location: "The mouth of the dungeon"
default_time_of_day: dawn

class_hp_bases:
  Delver: 8

ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

stat_display_fields:
  - hp
  - max_hp
  - ac
  - torches
  - rations
  - encumbrance
  - gold

encounter_base_tension:
  random: 0.15
  ambush: 0.40
  boss: 0.50
  final: 0.60

initiative_rules:
  combat:
    primary_stat: DEX
    description: "Reflexes and speed determine who strikes first"
  chase:
    primary_stat: DEX
    description: "Agility and footwork set the pace"
  social:
    primary_stat: CHA
    description: "Force of personality controls the conversation"
  exploration:
    primary_stat: WIS
    description: "Awareness determines who notices things first"

# ── Confrontations ──────────────────────────────────────────
# Forward-ported from main 5144b6c (story 28-10) — combat + chase
# ConfrontationDefs. Required by sidequest-api test
# `packs_without_confrontations_yaml_have_empty_vec`.
confrontations:
  - type: combat
    label: Dungeon Combat
    category: combat
    # Momentum-based encounter metric. `momentum` is a bidirectional
    # narrative dial: positive = party is winning, negative = party is
    # losing. Actual HP/damage lives on character state — this metric
    # tracks how the fight is *going*, not how much life is left.
    # Resolution triggers at either threshold.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: attack
        label: Attack
        metric_delta: 2
        stat_check: STR
        effect: "Target takes damage this round"
        narrator_hint: Steel rings off stone. Torchlight flickers across the blow.
      - id: defend
        label: Defend
        metric_delta: 1
        stat_check: CON
        effect: "Reduce incoming damage this round, brace against the push"
        narrator_hint: Shield raised, back to the wall, weight forward.
      - id: shield_bash
        label: Shield Bash
        metric_delta: 4
        stat_check: STR
        risk: "Overcommitted — lose 2 momentum and take a counter on failure"
        effect: "Stun the target briefly, break their footing"
        narrator_hint: Slam forward in the narrow corridor — nowhere to dodge.
      - id: flee
        label: Flee
        metric_delta: 0
        stat_check: DEX
        resolution: true
        risk: "Opportunity attack — take damage on failure"
        consequence: "Combat ends — retreat deeper into the dungeon"
        narrator_hint: Break contact, torch sweeping behind you as you run.
    mood: combat
  - type: chase
    label: Corridor Pursuit
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: sprint
        label: Sprint
        metric_delta: 2
        stat_check: DEX
        narrator_hint: Boots echo off stone as the quarry bolts down the passage.
      - id: duck_through
        label: Duck Through
        metric_delta: 3
        stat_check: INT
        risk: "Wrong turn — dead end, lose 2 separation"
        narrator_hint: Squeeze through a side passage too narrow for pursuers.
      - id: barricade
        label: Barricade
        metric_delta: 1
        stat_check: INT
        effect: "Topple debris to slow pursuit"
      - id: douse_torch
        label: Douse Torch
        metric_delta: 0
        stat_check: DEX
        resolution: true
        consequence: "Chase ends in darkness — quarry vanishes"
    mood: tension
  - type: negotiation
    label: "Haggling at the Counter"
    category: social
    # The canonical caverns_and_claudes scene: the party, mud-caked
    # and underfunded, on one side of a shop counter. The town
    # merchant — wary, greedy, or both — on the other. Haggling
    # over a price, unloading a suspicious find, pushing for a
    # better quest reward, or angling for the item on the top
    # shelf that the merchant swears isn't for sale.
    # `leverage` tracks who's running the table. Merchant starts
    # ahead: the delvers need the gold or the gear, the shopkeep
    # doesn't. Comedic register — stakes are low (a few silver)
    # but feel enormous to a level-1 party counting rations.
    metric:
      name: leverage
      direction: bidirectional
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: talk_up_the_haul
        label: "Talk Up the Haul"
        metric_delta: 2
        stat_check: CHA
        effect: "merchant entertains the asking price — their eyebrow does the thing"
        narrator_hint: "The delver pitches the goods like a town crier — this isn't a rusted dagger, it's a RELIC. The merchant has heard this exact speech seventeen times this week."
      - id: swear_its_not_cursed
        label: "Swear It's Not Cursed"
        metric_delta: 3
        stat_check: CHA
        risk: "if the bluff fails, merchant knocks 50% off the offer and mentions it to the guard"
        effect: "merchant accepts the suspicious item — with a receipt, carefully worded"
        narrator_hint: "Running-joke territory. 'Is this cursed?' 'No.' 'Are you SURE it's not cursed?' 'It is DEFINITELY not cursed.' Lean all the way in. Merchant is not convinced but the coin is right there."
      - id: plead_poverty
        label: "Plead Poverty"
        metric_delta: 2
        stat_check: WIS
        effect: "merchant softens — throws in a torch, a ration, or shaves a copper off the tally"
        narrator_hint: "The delver goes for the sympathy play — empty purse, long road, hungry dog back at camp. The merchant has seen this a thousand times and it still works about a third of the time."
      - id: flash_the_coin
        label: "Flash the Coin"
        metric_delta: -1
        stat_check: CHA
        effect: "merchant's disposition +5 and the real price — the one locals pay — slips out"
        narrator_hint: "The delver makes a show of it: tips a pouch, lets a gold piece ring on the counter, asks 'what does THAT get me.' A small concession now to read the shop properly."
      - id: walk_toward_the_door
        label: "Walk Toward the Door"
        metric_delta: 0
        stat_check: WIS
        resolution: true
        consequence: "haggle ends — either the merchant calls them back with a better number, or the deal is off and the party leaves empty-handed"
        narrator_hint: "The oldest trick at the counter. Delver turns, hand on the door, one beat, two beats. Either the merchant cracks — 'alright, alright, for you, three silver' — or the door closes behind the party and the moment is gone. The smart play when leverage has tipped the wrong way."
    mood: tension
