currency:
  # Primary unit is silver — Sünden is silver-denominated, and Sünden is
  # currently the only world in C&C. The narrator-prose, the Recruiter's
  # Post bonds ("two silver bond up front"), and Brecca's market dialogue
  # all speak in silver. Display label "N silver" matches the fiction;
  # the inventory-coin glance now agrees with what NPCs say. Playtest
  # 2026-05-07 fix (sq-playtest-pingpong UX/CONTENT bug).
  # If a future C&C world wants gold-denominated economies, this becomes
  # a per-world override on world.yaml — for now the genre + only world
  # agree on silver, so the override layer is unwarranted.
  name: silver
  denominations:
    - copper
    - silver
    - gold

item_catalog:
  # ════════════════════════════════════════════════════════════════════════
  # WWN SRD BASELINE (ADR-145, story 114-4) — extracted VERBATIM by
  # wwn_equip_extract@114-3 from the Worlds Without Number SRD §3.0.0 equipment
  # chapter. Mechanical envelope (damage/Shock/AC/cost/encumbrance/range) is the
  # SRD's own, provenance-stamped (mode=verbatim, srd=wwn, license=wn-free).
  # Sourced from the WWN SRD under its free-use terms — factual sourcing only,
  # no endorsement implied. Costs are the SRD's printed numbers (silver-base;
  # copper-priced gear carries its printed integer — cp/sp unit not represented
  # in the integer value field, flagged 114-4).
  #
  # VERBATIM SWEEP COMPLETE (story 120-1, epic 120): this genre baseline is now
  # 100% WWN-verbatim. The 31 legacy bespoke caverns items the 114-4 flag deferred
  # have been resolved:
  #   * 20 were pre-extraction DUPLICATES of gear already present here verbatim and
  #     were DELETED, their starting_equipment references repointed to the wwn_* id
  #     (torch→wwn_torch, dagger_iron→wwn_dagger, leather_armor→wwn_linothorax,
  #     chain_shirt→wwn_cuirass_and_greaves, shield_wood→wwn_small_shield, etc.).
  #     The 114-4 "would inject Shock" concern is resolved doctrine: caverns binds
  #     WWN, so WWN's Shock-bearing weapons ARE the rulebook (SOUL: Bind the
  #     Ruleset, Don't Balance It; ADR-143).
  #   * 11 had NO WWN SRD analog (dungeon-flavor + found-treasure: ten_foot_pole,
  #     chalk, helmet_iron, lockpicks, spellbook, holy_symbol, component_pouch,
  #     scroll_light, potion_healing[_greater], wand_spark) and MOVED to the world
  #     tier as mode=bespoke — worlds/beneath_sunden/inventory.yaml (ADR-140:
  #     flavor in the world; ADR-145 D3: bespoke is a world-tier privilege).
  # ════════════════════════════════════════════════════════════════════════
