currency:
  # Primary unit is silver — Sünden is silver-denominated, and Sünden is
  # currently the only world in C&C. The narrator-prose, the Recruiter's
  # Post bonds ("two silver bond up front"), and Brecca's market dialogue
  # all speak in silver. Display label "N silver" matches the fiction;
  # the inventory-coin glance now agrees with what NPCs say. Playtest
  # 2026-05-07 fix (sq-playtest-pingpong UX/CONTENT bug).
  # If a future C&C world wants gold-denominated economies, this becomes
  # a per-world override on world.yaml — for now the genre + only world
  # agree on silver, so the override layer is unwarranted.
  name: silver
  denominations:
    - copper
    - silver
    - gold

item_catalog:
  # === LIGHT SOURCES ===
  - id: torch
    name: Torch
    description: A pitch-soaked bundle of rags on a stick. Burns for about an hour.
    category: light
    value: 1
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [light, consumable, essential]
    lore: The most important item in any dungeon. When it goes out, you die in the dark.
    narrative_weight: 0.3
    resource_ticks: 6

  - id: lantern_oil
    name: Flask of Lantern Oil
    description: Enough oil to keep a lantern burning for two hours, or to make something flammable.
    category: light
    value: 5
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [light, consumable, fuel]
    lore: More reliable than a torch, but the lantern itself costs dear.
    narrative_weight: 0.1
    resource_ticks: 12

  - id: lantern
    name: Iron Lantern
    description: A hooded iron lantern with a shuttered aperture. Heavy but dependable.
    category: light
    value: 25
    weight: 2.0
    rarity: uncommon
    power_level: 0
    tags: [light, durable, equipment]
    lore: Keeps burning in a draft. Can be shuttered to hide the light. Worth its weight.
    narrative_weight: 0.2

  # === PROVISIONS ===
  - id: rations_day
    name: Day's Rations
    description: Hard bread, dried meat, a twist of salt. Enough to keep you moving.
    category: provisions
    value: 2
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [food, consumable, essential]
    lore: Not good. Not meant to be good. Meant to keep you alive long enough to find the gold.
    narrative_weight: 0.1

  - id: waterskin
    name: Waterskin
    description: Holds enough water for a day. Refillable at underground springs if you trust them.
    category: provisions
    value: 3
    weight: 1.0
    rarity: common
    power_level: 0
    tags: [water, consumable, essential]
    lore: The water in dungeons is often drinkable. Often.
    narrative_weight: 0.1

  # === EQUIPMENT ===
  - id: rope_hemp
    name: Hemp Rope (50 ft)
    description: Fifty feet of rough hemp rope. Essential for descents, bridges, and binding things.
    category: equipment
    value: 5
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [utility, essential, rope]
    lore: Ten feet of rope is the bare minimum. Fifty feet is comfort. A hundred is optimism.
    narrative_weight: 0.2

  - id: ten_foot_pole
    name: Ten-Foot Pole
    description: A wooden pole, ten feet long. For prodding things you do not wish to touch.
    category: equipment
    value: 1
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [utility, essential, probe]
    lore: The second most important item after the torch. Prod the floor. Prod the chest. Prod the corpse. If nothing happens, proceed.
    narrative_weight: 0.2

  - id: iron_spikes
    name: Iron Spikes (12)
    description: A dozen iron spikes and a small hammer. For jamming doors open or shut.
    category: equipment
    value: 3
    weight: 2.0
    rarity: common
    power_level: 0
    tags: [utility, door, consumable]
    lore: A spiked door stays where you put it. The dungeon hates that.
    narrative_weight: 0.1

  - id: chalk
    name: Chalk (bundle)
    description: A bundle of white chalk sticks for marking walls and mapping.
    category: equipment
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [utility, mapping, consumable]
    lore: Mark where you have been. The dungeon sometimes erases the marks.
    narrative_weight: 0.1

  - id: sack_large
    name: Large Sack
    description: A burlap sack large enough to hold a small fortune or a large problem.
    category: equipment
    value: 1
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [container, utility]
    lore: Holds 40 pounds of whatever you can stuff into it.
    narrative_weight: 0.0

  - id: crowbar
    name: Crowbar
    description: A bent iron bar for prying open things that were meant to stay closed.
    category: equipment
    value: 5
    weight: 2.0
    rarity: common
    power_level: 0
    tags: [utility, tool, breach]
    lore: Doors, lids, grates, and the occasional skull.
    narrative_weight: 0.1

  # === WEAPONS ===
  - id: dagger_iron
    name: Iron Dagger
    description: Short, simple, and better than nothing.
    category: weapon
    value: 5
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [melee, blade, one-handed, light]
    damage: {dice: "1d4"}
    lore: Everyone carries one. Not everyone uses it on purpose.
    narrative_weight: 0.1

  - id: sword_short
    name: Short Sword
    description: A chopping blade, good in tight corridors where a longsword would bind on the walls.
    category: weapon
    value: 15
    weight: 1.5
    rarity: common
    power_level: 2
    tags: [melee, blade, one-handed]
    damage: {dice: "1d6"}
    lore: The dungeon-goer's weapon of choice. Long enough to matter, short enough to swing.
    narrative_weight: 0.2

  - id: mace_iron
    name: Iron Mace
    description: A heavy iron head on a wooden shaft. Crushes what blades cannot cut.
    category: weapon
    value: 12
    weight: 3.0
    rarity: common
    power_level: 2
    tags: [melee, blunt, one-handed]
    damage: {dice: "1d6"}
    lore: Skeletons do not care about your sharp sword. They care about this.
    narrative_weight: 0.2

  - id: spear
    name: Spear
    description: Six feet of ash with an iron point. Reach matters in a corridor.
    category: weapon
    value: 8
    weight: 2.0
    rarity: common
    power_level: 2
    tags: [melee, polearm, two-handed, reach]
    damage: {dice: "1d6"}
    lore: Stab from behind the shield-carrier. The oldest tactic in the world.
    narrative_weight: 0.2

  - id: hand_axe
    name: Hand Axe
    description: A small axe suitable for chopping wood, doors, and whatever else needs chopping.
    category: weapon
    value: 8
    weight: 1.5
    rarity: common
    power_level: 1
    tags: [melee, blade, one-handed, thrown]
    damage: {dice: "1d6"}
    lore: Versatile. Can be thrown in desperation.
    narrative_weight: 0.1

  # === ARMOR ===
  - id: leather_armor
    name: Leather Armor
    description: Hardened leather shaped to cover the vitals. Light enough to run in.
    category: armor
    value: 20
    weight: 5.0
    rarity: common
    power_level: 1
    tags: [light-armor, torso]
    # WWN SRD armor table — Leather = AC 13 (ascending). Story 106-1: the engine
    # equips this at chargen and derives core.armor_class from it. Source: WWN
    # SRD, not invented (standing ruling 2026-06-13).
    armor_class: 13
    lore: Better than skin. Worse than mail. Affordable.
    narrative_weight: 0.1

  - id: chain_shirt
    name: Chain Shirt
    description: Interlocking iron rings. Noisy, heavy, effective.
    category: armor
    value: 75
    weight: 10.0
    rarity: uncommon
    power_level: 2
    tags: [medium-armor, torso, noisy]
    lore: Every step sounds like a bag of coins. The dungeon hears you coming.
    narrative_weight: 0.2

  - id: shield_wood
    name: Wooden Shield
    description: A round wooden shield banded with iron. Block, bash, or use as a makeshift stretcher.
    category: armor
    value: 10
    weight: 3.0
    rarity: common
    power_level: 1
    tags: [shield, one-handed]
    # WWN SRD armor table — Shield = AC 13 as a sole defence (and +1 when worn
    # WITH body armor; the kit rolls a single armor piece so the +1-combination
    # case does not arise here — see 106-1 Delivery Findings). Source: WWN SRD.
    armor_class: 13
    lore: Saves your life twice — once from a blade, once from the fall when you use it as a sled.
    narrative_weight: 0.2

  - id: helmet_iron
    name: Iron Helmet
    description: A simple iron pot helm. Protects the skull at the cost of peripheral vision.
    category: armor
    value: 15
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [head-armor]
    lore: The dungeon's favorite trick is things falling on your head. Wear the helmet.
    narrative_weight: 0.1

  # === MAGIC ITEMS (found treasure, not equipment) ===
  - id: scroll_light
    name: Scroll of Light
    description: A single-use scroll that floods a room with pale white light for ten minutes.
    category: magic
    value: 50
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [magic, consumable, light, scroll]
    lore: Written in a language that burns the page as you read it. One use. Make it count.
    narrative_weight: 0.4

  - id: potion_healing
    name: Potion of Mending
    description: A cloudy red liquid in a glass vial. Tastes like rust and closes wounds.
    category: magic
    value: 75
    weight: 0.2
    rarity: rare
    power_level: 2
    tags: [magic, consumable, healing, potion]
    lore: Does not heal cleanly. The scar tissue is thick and numb. But you are alive.
    narrative_weight: 0.4

  - id: wand_spark
    name: Wand of Sparks
    description: A charred bone wand with three charges. Each charge throws a fistful of fire.
    category: magic
    value: 150
    weight: 0.3
    rarity: rare
    power_level: 3
    tags: [magic, consumable, weapon, wand]
    lore: Three shots. Do not waste them on goblins.
    narrative_weight: 0.5

  # === CLASS-KIT ITEMS (added for classic-class chargen) ===

  - id: sword_long
    name: Long Sword
    description: A double-edged blade as long as a tall man's leg. Heavy enough to do work, light enough to carry all day.
    category: weapon
    value: 15
    weight: 4.0
    rarity: common
    power_level: 1
    tags: [weapon, melee, sword]
    damage: {dice: "1d8"}
    lore: The fighter's standard. Versatile and unromantic.
    narrative_weight: 0.3

  - id: staff_wood
    name: Wooden Staff
    description: A length of seasoned hardwood, taller than the wielder. A walking stick to anyone who isn't watching closely.
    category: weapon
    value: 5
    weight: 4.0
    rarity: common
    power_level: 0
    tags: [weapon, melee, two_handed, blunt]
    damage: {dice: "1d6"}
    lore: The mage's first weapon, and frequently the last.
    narrative_weight: 0.2

  - id: hammer_war
    name: War Hammer
    description: A heavy hammer with a wedge-shaped head, designed to crush plate and bone with equal disregard.
    category: weapon
    value: 25
    weight: 5.0
    rarity: common
    power_level: 1
    tags: [weapon, melee, blunt]
    damage: {dice: "1d10"}
    lore: The cleric's preference — blunt force makes for honest theology.
    narrative_weight: 0.3

  - id: spellbook
    name: Spellbook
    description: A leather-bound tome of incantations, half of which the owner can actually cast.
    category: utility
    value: 100
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [magic, focus, fragile]
    lore: Without the book, the mage is just a person with bad eyesight.
    narrative_weight: 0.6

  - id: component_pouch
    name: Component Pouch
    description: A leather pouch divided into a dozen small compartments, each holding the strange materials the spellbook demands — bat guano, sulfur, dried newt.
    category: utility
    value: 25
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [magic, container]
    lore: Half the cost of casting is the shopping list.
    narrative_weight: 0.3

  - id: holy_symbol
    name: Holy Symbol
    description: A worn metal token bearing the cleric's chosen sigil. Held forward when faith is needed in front of teeth.
    category: utility
    value: 25
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [magic, focus, divine]
    lore: The dungeon does not always recognize the symbol. It does not need to. The cleric does.
    narrative_weight: 0.4

  - id: lockpicks
    name: Set of Lockpicks
    description: Six slender steel picks rolled in oiled leather. Most of the trade is patience and pressure.
    category: utility
    value: 30
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [tool, thieves]
    lore: A locked door is a door that hasn't met the right professional.
    narrative_weight: 0.4

starting_equipment:
  Delver:
    - torch
    - torch
    - torch
    - rations_day
    - rations_day
    - waterskin
    - rope_hemp
    - ten_foot_pole
    - iron_spikes
    - chalk
    - dagger_iron

starting_gold:
  # Classic B/X tradition is 3d6 × 10 gp (avg ~105) per starting PC; the
  # chargen pipeline takes a flat int per class today, so these are
  # deterministic mid-band values. Tuned so every class can engage the
  # Sünden Recruiter's Post (two-silver-bond gate) at chargen-end —
  # patron-power-fantasy was unreachable with 0 gold (playtest 2026-05-06,
  # Carl-the-Cleric vs Brenna). Re-keyed for the WWN Callings (2026-06-12
  # port): Warrior carries the heavier starting kit, Expert and Mage lean
  # on cash for tools and recovered pages.
  Delver: 10
  Warrior: 60
  Expert: 75
  Mage: 80

philosophy:
  carry_limit: 30
  restricted_categories: []
  progression_gates: {}
