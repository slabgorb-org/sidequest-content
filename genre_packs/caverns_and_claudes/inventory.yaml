starting_equipment:
  # WWN-pure genre baseline kit (story 120-1): every id resolves to a
  # mode=verbatim WWN item in the catalog above. The dungeon-flavor items the
  # old kit carried (ten_foot_pole, chalk) have no WWN SRD analog and now live
  # at the world tier (worlds/beneath_sunden/inventory.yaml, mode=bespoke); the
  # beneath_sunden world kit re-adds them (world-replaces-genre, ADR-140).
  Delver:
    - wwn_torch
    - wwn_torch
    - wwn_torch
    - wwn_rations_one_week
    - wwn_waterskin_one_gallon
    - wwn_rope_50ft
    - wwn_iron_spikes_10
    - wwn_dagger

starting_gold:
  # Classic B/X tradition is 3d6 × 10 gp (avg ~105) per starting PC; the
  # chargen pipeline takes a flat int per class today, so these are
  # deterministic mid-band values. Tuned so every class can engage the
  # Sünden Recruiter's Post (two-silver-bond gate) at chargen-end —
  # patron-power-fantasy was unreachable with 0 gold (playtest 2026-05-06,
  # Carl-the-Cleric vs Brenna). Re-keyed for the WWN Callings (2026-06-12
  # port): Warrior carries the heavier starting kit, Expert and Mage lean
  # on cash for tools and recovered pages.
  Delver: 10
  Warrior: 60
  Expert: 75
  Mage: 80

philosophy:
  carry_limit: 30
  restricted_categories: []
  progression_gates: {}
