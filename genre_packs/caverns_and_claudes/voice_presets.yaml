# Voice presets for Caverns & Claudes
# Minimal — most NPCs are hirelings who die before their voice matters

narrator:
  model: en_US-lessac-high
  pitch: 1.0
  rate: 0.9
  effects:
    - type: reverb
      params:
        room_size: 0.35
    - type: compressor
      params:
        threshold_db: -20

characters:
  torchbearer:
    model: bf_emma
    pitch: 1.1
    rate: 1.1
    effects:
      - type: reverb
        params:
          room_size: 0.25
  porter:
    model: bm_george
    pitch: 0.9
    rate: 0.85
    effects:
      - type: reverb
        params:
          room_size: 0.25
  sellsword:
    model: bm_lewis
    pitch: 1.0
    rate: 1.0
    effects:
      - type: reverb
        params:
          room_size: 0.25
  fence:
    model: bm_daniel
    pitch: 1.0
    rate: 1.15
    effects:
      - type: reverb
        params:
          room_size: 0.15
  rumormonger:
    model: bm_george
    pitch: 1.0
    rate: 0.95
    effects:
      - type: reverb
        params:
          room_size: 0.3
  provisioner:
    model: bf_emma
    pitch: 1.0
    rate: 0.9
    effects:
      - type: compressor
        params:
          threshold_db: -18
  keeper:
    model: bm_lewis
    pitch: 0.75
    rate: 0.75
    effects:
      - type: reverb
        params:
          room_size: 0.7
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 800
