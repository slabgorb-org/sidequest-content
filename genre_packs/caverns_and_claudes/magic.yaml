# magic.yaml — caverns_and_claudes genre layer
#
# Migrated from DRAFT (2026-04-27) napkin shape to canonical loader
# schema (2026-04-30, playtest fix). Reference: docs/design/magic-
# taxonomy.md plus tests/magic/fixtures/space_opera_magic.yaml as the
# canonical-shape exemplar.
#
# True claim: magic items are core gameplay; there are no caster classes;
# world-knowledge is folkloric (commoners know wizards exist as legend).
# The wizards who made these items are gone; the items remember things
# the world has forgotten. Cursed items are the genre's signature trap.

genre: caverns_and_claudes

# Runtime sources the loader knows about. ``learned`` is intentionally
# excluded — it's gated_by world per the original draft and surfaces as
# narrator-only flavor (forbidden tomes, surviving wizard's notes), not
# as a player-build option. If a future world wants to enable learned
# magic for a single campaign, it can author it world-side.
allowed_sources: [item_based]

# Plugins permitted by the genre. ``item_legacy_v1`` covers scrolls,
# potions, wands, cursed swords, sealed reliquaries — every magic-item
# shape C&C ships with. ``learned_v1`` is omitted at the genre tier
# (see allowed_sources note) — narrator handles ritual-knowledge prose
# without needing a runtime plugin.
permitted_plugins: [item_legacy_v1]

intensity:
  default: 0.3

# Folkloric is the load-bearing C&C register: commoners know stories,
# the Delver knows scrolls work because they've seen them work, nobody
# studies. Worlds may dial up to ``mythic_lapsed`` for ruined-wizard-
# tower scenarios.
world_knowledge_default:
  primary: folkloric

hard_limits:
  - id: no_resurrection
    description: "Death is permanent. No resurrection magic — finding a 'true' resurrection scroll IS the campaign hook, never the answer."
  - id: no_true_creation
    description: "Magic does not create matter ex nihilo. Items conjure, transmute, or summon-from-elsewhere; nothing is made from nothing."
  - id: no_unlimited_high_evocation
    description: "Fire/lightning/blast effects exist but are bounded — wand charges, scroll one-shots, potion durations. No infinite blasters."
  - id: no_plane_shift
    description: "Player characters do not travel between planes. Things may bleed through; players cannot follow."
  - id: no_permanence_without_renewal
    description: "All magic decays or is consumable. Wands run out, scrolls burn, potions drain. Even reliquaries demand upkeep."

# Cost vocabulary for magic-item activation. ``components`` covers the
# physical price (ash, blood, the second-to-last torch); ``backlash``
# covers the consequence-of-use (cursed item awakens, attention drawn).
# These are item-channeled costs — there are no per-character bars in
# C&C (no caster classes, no innate magic), so cost_types feeds prompt
# context and item-level ledger bars rather than character bars.
cost_types: [components, backlash]

narrator_register: |
  Magic is found, not cast. Players don't learn spells — they identify scrolls,
  drink potions, and wield wands they don't fully understand. Every magical
  use is a choice to spend a finite resource. The wizards who made these
  items are gone; the items remember things the world has forgotten.
  Cursed items are the genre's signature trap — describe them as desirable
  until the bill arrives.

# === Design notes (not loader-consumed) ============================
#
# The following blocks document C&C's full magic taxonomy intent. The
# loader currently consumes the canonical fields above; these notes
# inform authoring of items, encounters, and future world-tier configs.
#
# visibility:
#   default: feared
#   permitted: [feared, dismissed]
#
# learned_source (gated_by world, narrative-only):
#   examples: [forbidden tomes, surviving wizard's notes]
#   plugin: learned_v1   # never registered runtime — narrator handles prose
#   narrator_note: |
#     Rare. Ritual knowledge that survives is incomplete and dangerous.
#     Cannot be a player-build option — only narrative.
#
# reliability:
#   default: deterministic    # the scroll fires; the potion works
#   note: but the item may be cursed, mislabeled, or backlash-tied
#
# counter:
#   - anti_magic_zone   (classic OSR feature)
#   - save_or_die       (direct attribute saves vs. magical effects)
#   - destroy_source    (break the wand, burn the scroll, shatter the orb)
#
# manifestation:
#   modes: [item_channeled]
#   domains: [physical, elemental, necromantic, illusory, transmutative]
#   domain_constraints:
#     necromantic: "communing only; no resurrection"
#
# player_options:
#   can_build_caster: false        # no chargen caster classes
#   can_build_item_user: true      # Delver acquires items in play
#   chargen_caster_classes: []
#   can_acquire_in_play: true      # finding magic items is core gameplay
