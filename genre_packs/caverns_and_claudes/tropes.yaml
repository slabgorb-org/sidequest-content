- id: the_keeper_stirs
  name: The Keeper Stirs
  description: >-
    The dungeon's intelligence responds to intrusion. As Keeper awareness
    rises, the dungeon becomes actively hostile — doors lock, traps reset,
    and the Keeper's voice echoes through the stone.
  category: tension
  triggers:
    - keeper awareness threshold reached
    - loud combat in the dungeon
    - breaking doors or barriers
    - removing treasure from guarded rooms
  narrative_hints:
    - a distant grinding sound, like stone teeth
    - torchlight flickers without a draft
    - the walls feel closer than they did a moment ago
  tension_level: 0.6
  resolution_hints:
    - reduce awareness through stealth and quiet movement
    - leave the dungeon and return when the Keeper settles
    - push deeper before the Keeper fully awakens
  tags: [keeper, dungeon, tension, escalation]
  escalation:
    - at: 0.2
      event: >-
        A sound reverberates through the corridors — not a collapse, but
        something deliberate. A door that was open is now closed. A passage
        that was clear now has footprints that were not there before.
      npcs_involved: []
      stakes: The dungeon is aware of intruders. Wandering monster frequency increases.
    - at: 0.4
      event: >-
        Words appear on a wall in a language that shifts as you read it.
        The Keeper speaks — a taunt, a warning, or a riddle. The temperature
        drops. Something in the dark ahead is waiting.
      npcs_involved: []
      stakes: Traps begin resetting. Previously cleared rooms may contain new hazards.
    - at: 0.6
      event: >-
        Doors throughout the dungeon slam shut and lock. The room the party
        is in begins to change — walls shift, exits rearrange. The Keeper
        is no longer observing. It is acting.
      npcs_involved: []
      stakes: Navigation becomes unreliable. The automapper may show paths that no longer exist.
    - at: 0.8
      event: >-
        The Keeper manifests directly — not as a creature, but as the dungeon
        itself turning hostile. The floor tilts. Torches are blown out by
        an impossible wind. The walls breathe.
      npcs_involved: []
      stakes: Resource drain accelerates. Every room transition costs double ticks.
    - at: 1.0
      event: >-
        The dungeon is fully awake and fully hostile. Every room is a trap.
        Every corridor is watched. The only option is extraction — immediate,
        desperate, and costly.
      npcs_involved: []
      stakes: Total hostility. The party must flee or die.
  passive_progression:
    rate_per_turn: 0.02
    rate_per_day: 0.0
    accelerators:
      - combat
      - breach
      - loud

- id: extraction_panic
  name: Extraction Panic
  description: >-
    The party has treasure and is heading for the exit. The dungeon knows.
    Rooms that were empty on the way in are occupied on the way out.
    The Keeper wants its gold back.
  category: conflict
  triggers:
    - party turns back toward exit with treasure
    - encumbrance is high
    - keeper awareness is elevated
  narrative_hints:
    - sounds of movement from rooms you already cleared
    - the route back seems longer than the route in
    - your torch gutters at the worst possible moment
  tension_level: 0.8
  resolution_hints:
    - drop treasure to move faster
    - find an alternate exit
    - fight through the restocked rooms
  tags: [extraction, treasure, tension, resource]
  escalation:
    - at: 0.3
      event: >-
        A room you cleared on the way in now has fresh occupants — creatures
        that were not here before, drawn by the scent of plunder or directed
        by the Keeper.
      npcs_involved: []
      stakes: Combat costs resources the party cannot afford to spend.
    - at: 0.6
      event: >-
        A passage collapses behind the party, forcing a detour through
        unexplored rooms. The detour costs torches and rations the party
        did not budget for.
      npcs_involved: []
      stakes: Resource emergency. The party may run out of light before reaching the exit.
    - at: 1.0
      event: >-
        The mouth of the dungeon is in sight but something stands between
        the party and daylight. A final guardian, a sealed door, or a
        chasm that was not there before. One last cost.
      npcs_involved: []
      stakes: All or nothing. The treasure makes it out or nobody does.
  passive_progression:
    rate_per_turn: 0.05
    rate_per_day: 0.0
    accelerators:
      - treasure
      - encumbered
      - slow

- id: hireling_mutiny
  name: Hireling Mutiny
  description: >-
    The hired help is losing faith. Morale breaks cascade from one
    hireling to the next until the torchbearer drops the torch and
    the porter drops the gold and everyone runs.
  category: betrayal
  triggers:
    - hireling casualty
    - rations depleted
    - torches running low
    - high keeper awareness
  narrative_hints:
    - the torchbearer's hands are shaking
    - the sellsword is counting exits, not enemies
    - the porter has shifted the sack to make it easier to drop
  tension_level: 0.5
  resolution_hints:
    - pay hazard bonuses to restore morale
    - reduce party risk by retreating
    - let the deserter go and press on shorthanded
  tags: [hireling, morale, resource, betrayal]
  escalation:
    - at: 0.3
      event: >-
        A hireling refuses an order — won't enter a room, won't carry a
        specific item, won't take point. Not desertion yet, but the cracks
        are showing.
      npcs_involved: []
      stakes: Party effectiveness reduced. Tasks go undone.
    - at: 0.6
      event: >-
        A hireling deserts. Drops their burden and bolts for the exit,
        taking their torch with them. The remaining hirelings watch in
        silence, calculating.
      npcs_involved: []
      stakes: Lost carrying capacity, lost light source, morale hit to remaining hirelings.
    - at: 1.0
      event: >-
        Full mutiny. The remaining hirelings refuse to continue and demand
        immediate extraction. If refused, they take what they can carry and
        leave — including, possibly, some of the party's treasure.
      npcs_involved: []
      stakes: The party is alone in the dark with too much gold and not enough hands.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.0
    accelerators:
      - casualty
      - hungry
      - dark
      - fear

- id: the_deeper_dark
  name: The Deeper Dark
  description: >-
    Descending to a new dungeon level. The air changes. The stone changes.
    The rules change. Whatever the Keeper is, it is more of it down here.
  category: discovery
  triggers:
    - descending stairs or chute to new level
    - finding a vertical connection
    - reaching a depth threshold
  narrative_hints:
    - the air is colder and smells of minerals you cannot name
    - the stonework changes — older, stranger, less human
    - sounds from above are swallowed completely
  tension_level: 0.7
  resolution_hints:
    - map the new level carefully before committing
    - establish a fallback point near the stairs
    - retreat to the surface to resupply before pressing deeper
  tags: [depth, discovery, escalation, keeper]
  escalation:
    - at: 0.5
      event: >-
        The new level operates under different rules. Resource ticks are
        faster. The Keeper's presence is stronger — awareness accumulates
        more quickly. The treasure is richer but the rooms are worse.
      npcs_involved: []
      stakes: The economy shifts. Greater risk, greater reward.
    - at: 1.0
      event: >-
        The deepest level. The Keeper is not a distant presence here — it
        is the walls, the floor, the air. Every room is a direct expression
        of the Keeper's obsession. The treasure here is extraordinary. So
        is the cost of reaching it.
      npcs_involved: []
      stakes: Maximum danger. The dungeon at its most hostile and its most rewarding.
  passive_progression:
    rate_per_turn: 0.0
    rate_per_day: 0.0
    accelerators:
      - descent
      - depth

- id: the_thing_that_followed_you_down
  name: The Thing That Followed You Down
  description: >-
    Something came down with you, or after you, and it is between you and
    the rope now. It does not hurry. It has the patience of a thing that
    knows the only way out is back past it.
  category: tension
  triggers:
    - descent from the surface or a shallower level
    - a set-piece reveals that something came down with the party
    - the party splits or a straggler falls behind
    - light fails at the rear of the column
  narrative_hints:
    - wet drag-marks in the dust that lead the way you came, then stop
    - the rearguard's torch keeps finding nothing, and keeps looking
    - a sound from behind that matches your pace exactly, then does not
  tension_level: 0.7
  resolution_hints:
    - turn and face it in light and numbers before it picks the ground
    - collapse the way behind you and accept there is no going back that way
    - give it the straggler it is pacing and live with having done so
  tags: [pursuit, surface, dark, tension, escalation]
  escalation:
    - at: 0.25
      event: >-
        The rear of the column finds sign that did not come from the party:
        a print half in a print, a smear still wet on stone the party passed
        dry. Nothing is there when the light turns. Nothing is ever there
        when the light turns.
      npcs_involved: []
      stakes: The party is being followed. The rearguard cannot be spared now.
    - at: 0.5
      event: >-
        It takes something at the edge of the light — a torch, a pack, a
        hireling who lagged one step too far. No struggle anyone sees. Just
        a gap in the column where someone was, and the dark closing it.
      npcs_involved: []
      stakes: A loss the party cannot replace this deep. The rope is now on the far side of it.
    - at: 1.0
      event: >-
        It stops pacing and waits in the only passage that goes up, in the
        place it chose, on the ground it chose. There is no route around
        that it has not already counted. It will be met, or the party will
        not surface.
      npcs_involved: []
      stakes: Confront it on its ground or do not leave the deep. There is no third door.
  passive_progression:
    rate_per_turn: 0.03
    rate_per_day: 0.0
    accelerators:
      - descent
      - dark
      - straggler
      - split

- id: the_keeper_notices_the_disturbance
  name: The Keeper Notices the Disturbance
  description: >-
    Not the slow, ambient waking of the whole deep — this is local, and it
    is about you specifically. Something registered what the party did here
    and has decided, with very little patience, to attend to it.
  category: tension
  triggers:
    - a sprung trap, forced floor, or broken seal in a guarded place
    - disturbing a marked grave, niche, or interred thing
    - loud work — digging, prying, breaking — in a still place
    - returning to a place the party already disturbed
  narrative_hints:
    - the dust the party raised has been smoothed flat again, recently
    - a thing left disturbed is found set right, and nothing did it
    - the next room is arranged as if it expected exactly this approach
  tension_level: 0.65
  resolution_hints:
    - leave the disturbed place and do not come back through it
    - move quiet and quick before the attention finishes orienting
    - meet what it sends here rather than carry it deeper
  tags: [keeper, attention, trap, tension, escalation]
  escalation:
    - at: 0.3
      event: >-
        What the party broke or sprung has been undone behind them —
        re-set, re-closed, re-laid, patiently and without witness. The
        message is not a threat. It is bookkeeping.
      npcs_involved: []
      stakes: The deep is correcting the party's work faster than the party can do it. Stealth is gone here.
    - at: 0.6
      event: >-
        The hazards in this place stop being incidental. A pit is where the
        party's own route would have put a foot. A fall of stone waits on
        the path back, not the path on. It is reading the party's habits.
      npcs_involved: []
      stakes: Traps now target the party's patterns specifically. Improvise the route or be where it expects.
    - at: 1.0
      event: >-
        The disturbed place commits to the party fully — every remaining
        seam, slab, and counterweight in it working at once, against these
        intruders, here, now, until the place is still again.
      npcs_involved: []
      stakes: The set-piece turns wholly hostile. Clear it or be cleared from it.
  passive_progression:
    rate_per_turn: 0.04
    rate_per_day: 0.0
    accelerators:
      - breach
      - loud
      - return
      - grave

- id: priest_demands_a_sacrifice
  name: The Priest Demands a Sacrifice
  description: >-
    The altar has been counting since long before the party arrived and it
    does not pause for deliberation. It does not want worship. It wants one
    of you, or one of what you carry that bleeds, and it has set a price
    that comes due whether or not the party agrees to pay it.
  category: conflict
  triggers:
    - entering a temple, altar, or offering-place that is kept ready
    - an altar or offering-place that is already counting
    - refusing, defiling, or trying to leave the offering unmade
    - a death or grievous wound near the altar
  narrative_hints:
    - the offering-channels are dry, scrubbed, and recently made ready
    - the count is somewhere being kept, and it is not slowing for you
    - the acolytes do not bar the way out; they do not need to
  tension_level: 0.8
  resolution_hints:
    - feed the altar what it asks and carry what that costs the party out
    - deny it and survive the two expansions it takes to collect regardless
    - destroy the altar before the count completes, if it can be destroyed
  tags: [sacrifice, temple, dilemma, countdown, escalation]
  escalation:
    - at: 0.34
      event: >-
        The demand is made plain — not in words the party needs translated,
        but in the way the place arranges itself toward the stone. One
        offering. The party has perhaps two expansions of deep before it is
        no longer asking.
      npcs_involved: []
      stakes: The choice is named. Deny-or-feed is now a clock, not a question.
    - at: 0.67
      event: >-
        Unfed, the temple stops waiting politely. Ways close that were open.
        What the party needs is on the far side of the altar. The price has
        not changed; only the cost of refusing it has.
      npcs_involved: []
      stakes: Refusal is now actively expensive. The altar collects in passage tolls until it collects in full.
    - at: 1.0
      event: >-
        The count completes. The altar takes its offering — the one the
        party chose, or the one it chooses for them, and it does not choose
        kindly. What is fed is not given back. What is denied is taken
        anyway, and remembered.
      npcs_involved: []
      stakes: Terminal. A sacrifice is made by the party or by the temple; either way the deep keeps it.
  passive_progression:
    rate_per_turn: 0.05
    rate_per_day: 0.0
    accelerators:
      - refusal
      - defile
      - bloodshed
      - delay

- id: the_resource_clock_you_can_see
  name: The Resource Clock You Can See
  description: >-
    The cruelty of this place is that it shows you the math. There is no
    shortcut and there never was; the only path is exactly as long as it is,
    and the light the party is burning to walk it is visibly, countably,
    running out faster than the path is.
  category: tension
  triggers:
    - committing to a route with no branch and no return budgeted
    - a place that makes the resource drain countable and legible
    - rationing the named resource (light, water, air, rope)
    - losing or spending a unit of that resource to a hazard
  narrative_hints:
    - tally-scratches on the wall climb into the hundreds, then stop unfinished
    - the party can count the torches left and count the turnings left
    - the two counts are not the same count, and everyone has done the sum
  tension_level: 0.8
  resolution_hints:
    - spend everything else to protect the one resource the clock measures
    - find the unlit way the maze hides rather than outlast the maze
    - accept a loss now to keep the clock from reaching zero in the dark
  tags: [resource, maze, light, attrition, escalation]
  escalation:
    - at: 0.3
      event: >-
        The path proves longer than it looked and does not branch. The
        party does the arithmetic without being asked: the resource will
        not reach the end at this rate. Everyone has now done it.
      npcs_involved: []
      stakes: The drain is legible and adverse. Rationing starts here or it starts too late.
    - at: 0.6
      event: >-
        Rationing fails the way rationing fails — not all at once, but in a
        skipped torch, a dry skin, a stretch walked darker than is safe to
        save what cannot be saved. The clock does not slow for thrift.
      npcs_involved: []
      stakes: Thrift is no longer enough. Only a different route or a hard loss changes the sum.
    - at: 1.0
      event: >-
        The resource reaches zero with path still ahead. The maze does not
        end because the light did. What happens here happens in the dark,
        on the party's hands, against the turnings, by feel and by count.
      npcs_involved: []
      stakes: Terminal attrition. Cross the rest blind and lessened, or do not cross it.
  passive_progression:
    rate_per_turn: 0.05
    rate_per_day: 0.0
    accelerators:
      - dark
      - lost
      - slow
      - waste
