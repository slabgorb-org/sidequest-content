name: "Caverns & Claudes"
version: "1.0.0"
description: >-
  Old-school dungeon crawling in the Moldvay/Cook tradition. The dungeon is
  the star — a hostile intelligence that wants you gone. Resource management,
  treasure extraction, high lethality. Player skill over character builds.
  You have a torch, ten feet of rope, and no backstory.
lobby_blurb: "Torchlight and dice. Classic dungeon delving where the map kills you and the treasure makes it worth it."
recommended_players:
  min: 2
  max: 6
  sweet_spot: 4
min_sidequest_version: "0.1.0"
refine_hooks: false
