# Caverns & Claudes — WWN Backgrounds (SRD §1.3)
#
# Pack tone: low-born delvers with working-class origins, grim humor,
# and the practical knowledge that the dungeon takes everyone equally.
# Nobody here grew up wanting to go underground. The backgrounds carry
# the specific texture of WHY they're down here.
#
# free_skill: the single skill from the background's experience.
# quick_skills: the two-skill quick pick for players who want to move fast.
# All skill names must be in skills.yaml.

- id: Rope-Puller
  display_name: Rope-Puller
  description: >-
    You've worked the winch end of a mine shaft, a well, or a siege engine — whoever
    held the rope held the weight of everyone below. You've also, at least once,
    been the person below who needed someone to hold it. You know which knots
    hold and which knots lie.
  free_skill: Exert
  quick_skills:
    - Exert
    - Notice

- id: Hedge-Barber
  display_name: Hedge Barber
  description: >-
    Tooth-pulling, wound-closing, setting bones back into place — all done without
    proper instruments in a tent or a barn. You learned medicine from necessity and
    taught yourself anatomy from consequences. A spear-wound by torchlight bleeds
    on the same schedule as a scythe-wound at harvest; you have closed both.
  free_skill: Heal
  quick_skills:
    - Heal
    - Know

- id: Cutpurse-Alumni
  display_name: Cutpurse Graduate
  description: >-
    You spent your formative years working a crowd — fairs, market days, executions —
    and what you learned was not picking pockets but the more general art of not being
    noticed at all. Getting caught once was educational. Getting caught twice was not
    an option you permitted yourself.
  free_skill: Sneak
  quick_skills:
    - Sneak
    - Notice

- id: Failed-Cleric
  display_name: Failed Cleric
  description: >-
    You studied at a temple long enough to learn the prayers, the herb-lore,
    and which of the congregation skimmed the plate. You did not make it to
    ordination — the reasons vary by telling — but the knowledge is still in
    your hands, and the dungeon's dead respond to the old words the same as
    any other dead.
  free_skill: Pray
  quick_skills:
    - Pray
    - Heal

- id: Guild-Dropout
  display_name: Guild Dropout
  description: >-
    Stonemason, carpenter, smith — you apprenticed long enough to learn
    the craft and left before you could be bound to the guild fees. You
    know how things are built, which is useful when you need to know how
    they can be broken, and how to get through a wall that wasn't meant to be gotten through.
  free_skill: Craft
  quick_skills:
    - Craft
    - Know

- id: Roadwarden-Washout
  display_name: Roadwarden Washout
  description: >-
    You carried a spear for three seasons on a road nobody cared about,
    watching for bandits who mostly didn't come and collecting tolls
    for a lord who mostly didn't pay. You learned to read terrain,
    stay awake through the third watch, and talk your way out of a
    confrontation before it became one.
  free_skill: Survive
  quick_skills:
    - Survive
    - Notice

- id: Ink-Stained
  display_name: Ink-Stained
  description: >-
    Scrivener, law-clerk, or schoolmaster's drudge — you spent years
    copying documents you weren't supposed to read and reading them anyway.
    What's in your head is a collage of contract law, dead languages,
    half-remembered histories, and the private correspondence of people
    who should have used better locks.
  free_skill: Know
  quick_skills:
    - Know
    - Convince

- id: Market-Crier
  display_name: Market Crier
  description: >-
    You sold things to people who didn't want to buy them. You know
    how to make a crowd listen, how to read a mark's reluctance, and
    how to close a transaction before the mark figures out what they've
    agreed to. You also know the price of everything, which is more
    useful in the dungeon than most people expect.
  free_skill: Trade
  quick_skills:
    - Trade
    - Convince
