# Seed tropes for caverns_and_claudes — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the delve demands.
#
# World-agnostic by design (ADR-140): genre grammar only — the dungeon as
# hostile intelligence, resource arithmetic, treasure with provenance, and
# the cold knowledge that the map is older than the truth. Player skill
# over character builds; the ten-foot pole is load-bearing.

- id: the_map_is_older_than_the_dungeon
  name: The Map Disagrees with the Walls
  description: >-
    The party's map — bought, copied, or taken off a corpse — is good.
    Too good. It matches the dungeon precisely until, at one junction,
    it shows a passage where there is now smooth, seamless stone. The
    map is not wrong. The dungeon has been edited.
  flavor_tags: [map, dungeon, mystery, architecture]
  lifespan_turns: 7
  delivery_hints:
    - The stonework at the missing passage is finer than anything else on the level
    - Scratched beside the junction, in a delver's shorthand, someone has written a warning or a date
    - Air still moves near the sealed place, faintly, carrying a smell from somewhere the map says is rooms away
  narrative_hint: >-
    Whatever sealed the passage had reasons and resources. Let the
    party choose between respecting the edit and undoing it — and let
    the map's previous owner have died of one of those choices.

- id: another_partys_chalk_marks
  name: Another Party's Chalk Marks
  description: >-
    Fresh chalk marks run along the walls — trail signs in a rival
    delving company's code: this way, danger, paid out, DO NOT. The
    marks are recent; the chalk dust still sits on the floor lip. The
    other party is in here somewhere, ahead or above or behind, and
    they marked one door in a way nobody marks anything good.
  flavor_tags: [rivals, delvers, signs, race]
  lifespan_turns: 6
  delivery_hints:
    - The code is half-readable — common signs every delver knows, plus private marks that aren't
    - The marks stop abruptly at a point where the dust shows the group's pace changed
    - One mark has been corrected — crossed out and re-drawn pointing the other way, in different chalk
  narrative_hint: >-
    The rival party is information, competition, and potential rescue
    in one. Let the corrected mark be the question: did they learn
    something, or did something that watched them learn to write?

- id: the_hireling_knows_the_level
  name: The Hireling Has Been Here Before
  description: >-
    One of the party's hirelings — torchbearer, porter, the quiet one
    hired off the tavern bench — navigates a junction before the map
    is consulted. They claim luck. They do it again. Whatever brought
    them down here before, they survived it, walked back out, and then
    signed on to return for porter's wages.
  flavor_tags: [hireling, secret, history, trust]
  lifespan_turns: 7
  delivery_hints:
    - They flinch at one door in particular and recommend, very casually, the longer way around
    - Their kit includes one item no porter carries and no porter could afford
    - Asked directly, they offer a version of the truth that explains the navigation but not the wages
  narrative_hint: >-
    The hireling came back for something — left behind, owed, or
    buried with somebody. Let their knowledge be a resource the party
    can spend, and their errand a complication that comes due at the
    worst depth.

- id: the_treasure_has_a_provenance
  name: The Treasure Is Somebody's Heirloom
  description: >-
    A find — a ring, a banner, a sword with a name on it — carries
    marks of ownership: a living house, a guild, a temple that still
    holds services. It is worth more sold honestly back to its owners.
    It is worth questions either way: how it got down here is a story
    somebody above ground has been lying about.
  flavor_tags: [treasure, provenance, surface, claim]
  lifespan_turns: 8
  delivery_hints:
    - The item's last recorded holder vanished in circumstances the owners describe carefully
    - A second mark, newer, has been added by someone trying to obscure the first
    - Fencing it quietly is possible; the fence's reaction to the marks is itself a clue
  narrative_hint: >-
    The provenance points up and out of the dungeon — let returning,
    selling, or keeping it each open a different surface-world thread,
    and let the obscuring mark mean a previous finder made one of
    those choices and regretted it.

- id: the_door_that_is_warm
  name: The Door Is Warm
  description: >-
    A door — iron-bound, sound, unremarkable on the map — is warm to
    the touch. Not hot. Warm, like something large breathing on the
    other side, or a forge banked low, or stone that remembers heat
    the way stone shouldn't. The hinges are on this side. The previous
    party oiled them.
  flavor_tags: [door, dread, resource, choice]
  lifespan_turns: 5
  delivery_hints:
    - Listening at it yields a sound with a rhythm — mechanical, animal, or liturgical, hard to say
    - The oil on the hinges is fresh enough to smell, and whoever oiled them did not go in — the dust says so
    - The warmth has a schedule; it is fainter now than an hour ago
  narrative_hint: >-
    The door is a resource question wearing a mystery — opening it now,
    later, or never are all defensible plays. Let the schedule matter:
    whatever warms it comes and goes, and the oiler knew the timetable.

- id: the_light_ahead_that_isnt_yours
  name: A Light Ahead That Isn't Yours
  description: >-
    Around a bend, through a grate, reflected on wet stone: light.
    Steady, not flickering — not a torch. Nothing on this level should
    be lit. Lights below mean inhabitants, and inhabitants who can
    keep a lamp burning have supply lines, politics, and opinions
    about visitors.
  flavor_tags: [inhabitants, light, depth, parley]
  lifespan_turns: 6
  delivery_hints:
    - The light's color is wrong for fire and right for something rarer
    - Near it, the dungeon is maintained — swept floor, patched mortar, a boot-scraper
    - There is a bell, a knocker, or a slot at eye level; whoever lives here receives callers
  narrative_hint: >-
    Civilization at depth inverts the delve — the party becomes the
    monster knocking. Let the inhabitants want something from above
    that delvers can supply, and let their hospitality have rules
    that are cheap to follow and lethal to break.

- id: the_count_is_off
  name: The Count Is Off
  description: >-
    Torches, rations, arrows, coin — something the party counted is
    short. Not catastrophically: one torch, one day's bread, a single
    bolt. The arithmetic of the delve runs on these numbers and the
    numbers moved on their own. Either someone in the party is
    skimming, or something down here takes a toll.
  flavor_tags: [resources, suspicion, toll, arithmetic]
  lifespan_turns: 6
  delivery_hints:
    - The shortfall repeats at intervals that suggest a pattern — camps, crossings, a particular kind of room
    - Something small is left in trade each time, worthless and deliberate
    - One hireling counts more often than the others now and says nothing
  narrative_hint: >-
    The toll-taker — party member, stowaway, or resident custom — is
    less important than what the trade-trinkets mean. Let them be
    tokens in a currency the dungeon's inhabitants honor, accumulating
    into safe passage or a summons.

- id: the_statue_was_recently_a_person
  name: The Statue Has Fresh Boots
  description: >-
    Among the level's stone figures — ornamental, ancient, weathered —
    one is wearing boots in this decade's style, with mud on them
    that hasn't fully dried. The face is a stranger's, caught
    mid-expression. The expression is useful information. So is the
    direction the figure was facing when it stopped.
  flavor_tags: [petrification, warning, evidence, dread]
  lifespan_turns: 6
  delivery_hints:
    - The figure's gear is intact and lootable, which previous passersby have clearly thought about and declined
    - The mid-expression is not terror; it is recognition, or bargaining, or relief
    - Drag marks suggest the figure was moved here, posed, after stopping
  narrative_hint: >-
    The fresh statue is the dungeon showing its work. Let the pose and
    placement be authored — something arranges its victims — and let
    the un-looted gear be the level's residents observing a protocol
    the party would do well to learn.

- id: the_shortcut_through_the_dark
  name: The Shortcut Is Real and Unlit
  description: >-
    There is a faster way down — a shaft, a flooded stair, a crawl
    the maps mark with an abbreviation nobody can expand. It would
    save a level's worth of walking and a day's worth of torches. It
    is utterly dark, tight enough to silence spellwork, and the
    delvers who recommend it all phrase their advice in the past
    tense.
  flavor_tags: [shortcut, dark, risk, depth]
  lifespan_turns: 7
  delivery_hints:
    - The arithmetic genuinely favors it; the party's resource count makes the long way expensive
    - Something uses the shortcut regularly — the polish on the stone says so — and is never seen on the main ways
    - Halfway markers exist, left by someone who measured it; the markers stop before halfway
  narrative_hint: >-
    The shortcut is the resource game distilled — pay in risk or pay
    in torches. If taken, make the darkness an environment, not a
    corridor: sound, touch, and the company of whatever polishes
    the stone.

- id: the_prisoner_of_the_level
  name: Something on This Level Is Caged
  description: >-
    Bars, a circle, a sealed cell with a feeding slot — this level
    keeps a prisoner, and the prisoner is alive, articulate, and
    aware of the party before the party is aware of it. It knows the
    level the way only an inmate can. It would like to discuss terms.
  flavor_tags: [prisoner, bargain, knowledge, release]
  lifespan_turns: 8
  delivery_hints:
    - The cell's construction is better than the level around it; somebody built this to last
    - The prisoner's information checks out on every small, verifiable point
    - Whoever feeds it does so on a schedule, and the schedule means they're due
  narrative_hint: >-
    The classic three-way: the prisoner's knowledge is real, the
    jailer had reasons, and the feeding schedule is a clock. Let
    every option — release, trade through the bars, wait for the
    jailer — be playable, and let the prisoner's smallest request
    be the one with teeth.

- id: the_treasure_already_divided
  name: The Hoard Has Already Been Split
  description: >-
    The party finds the treasure room — and finds it inventoried.
    Neat stacks, tally marks, a ledger stone, shares set out in
    equal piles. Someone divided this hoard, carefully and fairly,
    and then left every share where it sat. Whatever interrupted
    the division did not want the treasure.
  flavor_tags: [treasure, mystery, interruption, dread]
  lifespan_turns: 6
  delivery_hints:
    - The shares are fair to a fault — measured, weighed, one pile slightly different in composition
    - The ledger records names; one is crossed out with different pressure than the others
    - Whatever scattered the dividers left their tools, their packs, and in one case their boots
  narrative_hint: >-
    The divided hoard is a crime scene paying out in coin. Let taking
    the shares be safe and taking the DIFFERENT pile be the mistake,
    or the reverse — the dungeon's logic, readable from the ledger,
    decides. The crossed-out name is the survivor.

- id: the_vermin_are_organized
  name: The Vermin Are Behaving Strangely
  description: >-
    The level's small life — rats, beetles, blind cave things — moves
    with purpose. Single file. Carrying. All in one direction, on a
    schedule, like a supply line, because that is what it is. Something
    on this level has organized the vermin, and following the line
    leads to it.
  flavor_tags: [vermin, signs, hierarchy, tracking]
  lifespan_turns: 5
  delivery_hints:
    - What they carry is specific — one kind of fungus, one kind of shiny, fragments of one particular thing
    - The line detours around certain stones and doorways with obvious, learned caution
    - Interfering with a carrier brings no reprisal; interfering with the cargo does
  narrative_hint: >-
    The supply line is a dungeon-as-organism tell. Let the cargo
    reveal the organizer's nature and appetite before the party ever
    meets it, and let the vermin's learned detours be a free, honest
    map of the level's real dangers.

- id: the_echo_answers_late
  name: The Echo Comes Back Wrong
  description: >-
    In one stretch of the dungeon, echoes return a half-beat late —
    and then, increasingly, not quite identical. A dropped word added.
    A cough the party didn't make. The acoustics are either a freak of
    architecture or a thing that is learning, and it is getting better.
  flavor_tags: [sound, uncanny, mimicry, dread]
  lifespan_turns: 6
  delivery_hints:
    - The additions are recent party speech, rearranged — it has only what they've given it
    - Silence stops it; the hirelings figured that out first and have gone very quiet
    - At one point it returns a phrase in a voice the party knows that has never spoken down here
  narrative_hint: >-
    The mimic-echo trades on what the party says — let the known
    voice be the hook: it has heard that voice, which means that
    voice was here. Tracking the acoustics to their center finds
    what listens, and what's left of who it listened to.

- id: the_way_out_is_in_use
  name: The Way Back Is in Use
  description: >-
    Returning toward the surface, the party finds their own route
    occupied — fresh tracks crossing theirs, a camp in the room they
    cleared, rubble shifted off a passage they left blocked. Traffic
    runs both ways down here, and something has moved in behind them
    with the confidence of a thing that knows the exits.
  flavor_tags: [retreat, dungeon, pursuit, territory]
  lifespan_turns: 6
  delivery_hints:
    - The newcomers used the party's own clearances — pits bridged, doors spiked — gratefully and efficiently
    - Their camp suggests numbers, discipline, and an intention to stay
    - One of the party's chalked marks has been annotated in a hand that knows delver code
  narrative_hint: >-
    The occupied exit converts the dungeon's geography into a
    negotiation — fight through, talk through, or find a way around
    that the newcomers haven't claimed. Let the annotation prove
    they know who the party is, which is more than the party knows
    about them.
