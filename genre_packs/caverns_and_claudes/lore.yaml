# Caverns & Claudes — Genre Lore
# No cosmology, no creation myth. The dungeon is the world.

world_name: Caverns & Claudes
setting_anchor: "The dungeon is the world. You go down, you come back up, or you don't."
history: >-
  There is no history. There are dungeons, and there are the people who go into
  them. The towns exist to service the trade — provisioners, healers, fences,
  undertakers. Nobody records what happens below. The dungeons eat history the
  way they eat everything else.
geography: >-
  Dungeon country. Rolling hills pocked with entrances — some mapped, some not.
  Towns cluster around the most profitable holes. The wilderness between is
  unremarkable. Nobody cares about the surface. The real geography is vertical.

cosmology: >-
  Nobody knows why the dungeons exist. They were here before the towns,
  before the roads, before memory. They grow downward like roots into
  black soil. Some say they are alive. Some say they are hungry. The
  people who live near them call them by name and leave offerings at
  their mouths — not out of worship, but the way you might leave meat
  for a wolf to keep it from your door.

  The Keepers are the intelligences that dwell within. Whether they
  built the dungeons or the dungeons built them is a question no one
  has survived long enough to answer. Each Keeper shapes its domain
  in the image of its obsession — a Collector fills its halls with
  stolen things, a Glutton fills its tunnels with hunger. The dungeon
  is the Keeper's body. The traps are its immune system. The monsters
  are its blood cells.

  Treasure exists because the dungeons consume. Caravans vanish.
  Settlements are swallowed. The gold and goods of the surface world
  sink into the dark and accumulate in hoards that no Keeper values
  but none will relinquish. Extracting this wealth is the only trade
  that matters in dungeon country — and the only one with a pension
  plan measured in days rather than years.

themes:
  - "The dungeon is alive and hostile"
  - "Treasure is the only measure of progress"
  - "People are expendable, gold is not"
  - "Player skill determines survival, not character builds"
  - "The deeper you go, the more the dungeon wants you gone"
  - "Every torch that gutters is a countdown"

the_maw: >-
  Every dungeon has a Maw — the Keeper's lieutenant, a creature
  assembled from whatever the dungeon has consumed. It guards the
  deepest treasure. When destroyed, the Keeper grows a new one from
  fresh material. Each incarnation is different. The room is the same.
  The fight is never the same twice. This is the repeatable loop:
  kill the Maw, loot the hoard, extract, resupply, return.

genre_conventions:
  - "No backstory — the dungeon writes your story"
  - "No balanced encounters — some rooms are instant death, some are free"
  - "Combat is a cost, not a goal"
  - "Magic is found, not learned"
  - "Hirelings die — plan accordingly"
  - "The way out is harder than the way in"
