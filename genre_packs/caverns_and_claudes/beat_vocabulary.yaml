# Beat vocabulary — Caverns & Claudes
# Dungeon-specific obstacles and chase beats

obstacles:
  - name: Collapsed corridor
    description: A ceiling collapse has half-blocked the passage — squeeze through or dig
    stat_check: STR
    failure_penalty: Stuck, torch extinguished, 1 resource tick
    tags: [dungeon, rubble]

  - name: Pit trap
    description: The floor gives way — a ten-foot drop onto stone or spikes
    stat_check: DEX
    failure_penalty: Fall damage, separated from party
    tags: [dungeon, trap, keeper]

  - name: Locked door
    description: Iron-banded oak, locked from the other side
    stat_check: DEX
    failure_penalty: Noise alerts nearby creatures, Keeper awareness +1
    tags: [dungeon, door, lock]

  - name: Flooded chamber
    description: Chest-deep black water filling a room — wade or find another way
    stat_check: CON
    failure_penalty: Gear soaked, torches ruined, rations waterlogged
    tags: [dungeon, water, resource]

  - name: Narrow squeeze
    description: A passage too tight for armor — strip down or find another route
    stat_check: DEX
    failure_penalty: Stuck, vulnerable, encumbrance penalty
    tags: [dungeon, tight, movement]

  - name: Swinging blade trap
    description: Blades sweep across the corridor at irregular intervals
    stat_check: DEX
    failure_penalty: Slashing damage, hireling casualty
    tags: [dungeon, trap, keeper, lethal]

  - name: Crumbling stairs
    description: Stone steps that grind and shift underfoot
    stat_check: DEX
    failure_penalty: Fall to lower level, damage, separated
    tags: [dungeon, vertical, terrain]

  - name: Portcullis drop
    description: An iron grate slams down, splitting the party
    stat_check: STR
    failure_penalty: Party separated, retreat cut off
    tags: [dungeon, trap, keeper, separation]

  - name: Gas vent
    description: Foul air seeps from cracks in the stone — drowsy, nauseating
    stat_check: CON
    failure_penalty: Exhaustion, hallucinations, stat penalty
    tags: [dungeon, hazard, resource]

  - name: Mimic chest
    description: The treasure chest has teeth
    stat_check: WIS
    failure_penalty: Surprise attack, hand damage
    tags: [dungeon, creature, deception]

  - name: Keeper's puzzle door
    description: A door with a mechanical lock shaped by the Keeper's obsession
    stat_check: INT
    failure_penalty: Trap triggers, Keeper awareness +2, door remains sealed
    tags: [dungeon, puzzle, keeper]

  - name: Greased slope
    description: A slick stone ramp descending into darkness
    stat_check: DEX
    failure_penalty: Uncontrolled descent to lower level, equipment scattered
    tags: [dungeon, vertical, trap, one-way]

  - name: Cave-air poisoning
    description: The dungeon's deep air is thin and tainted — heads pound, vision tunnels, breath comes hard
    stat_check: CON
    failure_penalty: Exhaustion, headache penalty to all rolls, torch burns shorter
    tags: [dungeon, hazard, air, resource]

  - name: Forced march fatigue
    description: Too many corridors with no rest — knees buckle, hands shake on the haft, the next step costs more than the last
    stat_check: CON
    failure_penalty: Drop a carried item, edge loss, next encounter starts on the back foot
    tags: [dungeon, fatigue, resource, pacing]

  - name: Holding breath
    description: A submerged passage or fume-choked corridor — get across before the lungs give out
    stat_check: CON
    failure_penalty: Gasp, inhale water or gas, choking penalty, alert the keeper
    tags: [dungeon, water, air, lethal]

  - name: Cold soak
    description: Hours in clammy stone and standing water — the chill works inward until the body argues with every motion
    stat_check: CON
    failure_penalty: Stiffened limbs, shivering imposes penalty until warmed and dried
    tags: [dungeon, cold, water, resource]

  - name: Bad water dysentery
    description: The cistern looked clean. It wasn't. Cramps come on quick and brutal
    stat_check: CON
    failure_penalty: Rations spoiled in passing, day of weakness, lost edge until cleared
    tags: [dungeon, water, sickness, resource]
