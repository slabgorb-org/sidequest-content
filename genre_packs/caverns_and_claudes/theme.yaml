# Caverns & Claudes — UI Theme
# Graph paper and torchlight. Ink-heavy, claustrophobic.

colors:
  primary: "#D4A843"        # Torchlight amber
  secondary: "#4A3B2A"      # Dark leather brown
  background: "#1A1610"     # Near-black parchment
  surface: "#2A2318"        # Dark stone
  text: "#C4B89A"           # Aged parchment text
  text_dim: "#7A6F5E"       # Faded ink
  accent: "#8B2500"         # Dried blood red
  success: "#5A7A3A"        # Mossy green (rare — success is rare)
  warning: "#B8860B"        # Guttering flame
  danger: "#8B0000"         # Dark red
  grid: "#3A332A"           # Subtle graph paper lines

fonts:
  heading: "IM Fell English"
  body: "Courier Prime"
  ui: "IBM Plex Mono"

decorations:
  border_style: "crosshatch"
  card_style: "parchment_torn"
  divider: "ink_rule"

map:
  room_fill: "#2A2318"
  room_stroke: "#C4B89A"
  corridor_fill: "#1A1610"
  corridor_stroke: "#7A6F5E"
  door_icon: "#D4A843"
  fog_fill: "#0A0808"
  current_room: "#D4A843"
  explored_room: "#3A332A"
  grid_color: "#2A2318"
  grid_visible: true
