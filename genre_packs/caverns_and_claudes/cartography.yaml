# Caverns & Claudes — Cartography
# Surface town only at genre level. Dungeon room graphs are per-world.
# The town is a functional waystation, not an adventure location.

regions:
  - id: town_square
    name: The Square
    summary: "Rust-bucket well town where delvers hire, buy, drink, and go back underground"
    description: >-
      A muddy clearing ringed by low timber buildings. A well stands
      at the center, its bucket chain brown with rust. This is where
      you hire, buy, sell, and drink before going back underground.
    terrain: settlement
    tags: [town, hub]
    poi:
      - name: The Provisioner
        description: >-
          A narrow shop with barred windows and a reinforced door. Shelves
          of torches, rope, and rations. A tally wall behind the counter
          marks who came back and who did not.
        tags: [shop, essential]
      - name: The Tally Tavern
        description: >-
          The only tavern. Low ceiling, smoke-stained beams, and a bar
          made from a single slab of dungeon stone dragged up from below.
          The rumormonger holds court in the corner.
        tags: [tavern, rumors, hirelings]

  - id: the_fence
    name: The Back Room
    summary: "Secret below-stairs fence in a cipher ledger, no questions, no fair prices"
    description: >-
      Behind the tanner's shop, down a flight of steps that smell of
      lye and secrets. The fence operates here, buying whatever the
      dungeon-goers drag up from below. No questions asked. No fair
      prices given.
    terrain: settlement
    tags: [town, commerce, fence]
    poi:
      - name: The Fence's Table
        description: >-
          A table with scales, a loupe, and a ledger written in a cipher
          no one else can read. The fence sits behind it, sweating.
        tags: [trade, treasure]

  - id: the_mouth
    name: The Mouth
    summary: "Dungeon entrance where cold air breathes outward and the room graph begins"
    description: >-
      The entrance to the current dungeon. A crack in the hillside, or
      a stairway descending into shadow, or a door in the earth that
      should not be there. Cold air breathes outward. This is where
      the room graph begins.
    terrain: dungeon_entrance
    tags: [dungeon, transition]
    poi:
      - name: The Threshold
        description: >-
          The last point of daylight. Chalk marks on the stone where
          previous parties counted their torches before descending.
          Some marks are incomplete.
        tags: [dungeon, entrance]

routes:
  - from: town_square
    to: the_fence
    type: path
    description: A narrow alley behind the tanner's shop
  - from: the_fence
    to: town_square
    type: path
    description: Back through the alley to the square
  - from: town_square
    to: the_mouth
    type: road
    description: A rutted track leading to the hillside
  - from: the_mouth
    to: town_square
    type: road
    description: The track back to town — longer than you remember
