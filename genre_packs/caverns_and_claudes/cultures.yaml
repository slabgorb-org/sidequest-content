# Caverns & Claudes — Naming Cultures
# OSR naming: functional, medieval-ish, expendable.
# Dungeon names are kennings. Keeper names are titles.
# Hireling names are forgettable. Treasure is descriptive.

- name: Surface Folk
  description: "The ordinary people of towns and villages at the edges of dungeon country. Practical names, no pretension."
  slots:
    given_name:
      corpora:
        - corpus: surface_folk.txt
          weight: 1.0
      lookback: 2
    surname:
      word_list: [Baker, Blackhand, Ironjaw, Stonegate, Ashwell, Copperford, Saltbridge, Peatwall, Ditchford, Millhand, Plowman, Tanner, Forger, Thatcher, Welder]
    place_noun:
      word_list: [hollow, ford, crossing, downs, fens, reach, mire, dell, barrow, cairn]
    adjective:
      word_list: [grey, old, dark, high, fallen, quiet, lost, bitter, cold, muddy]
  person_patterns:
    - "{given_name} {surname}"
    - "{given_name} of the {adjective} {place_noun}"
  place_patterns:
    - "The {adjective} {place_noun}"
    - "{surname}'s {place_noun}"

- name: Keeper Titles
  description: "Dungeon Keepers are known by title, not name. The title reflects their obsession, their method, their madness."
  slots:
    given_name:
      word_list: [Molgrath, Veskri, Tharn, Ossua, Kreveld, Durmach, Silthen, Nekhra]
    title_noun:
      word_list: [Collector, Warden, Glutton, Architect, Mirror, Butcher, Librarian, Gardener, Clockmaker, Weaver]
    title_abstract:
      word_list: [Whispers, Bones, Silence, Echoes, Teeth, Doors, Shadows, Hunger, Glass, Rust]
    adjective:
      word_list: [Hollow, Patient, Gilded, Eyeless, Bloated, Crystalline, Weeping, Iron, Ravenous, Still]
  person_patterns:
    - "The {title_noun} of {title_abstract}"
    - "The {adjective} {title_noun}"
    - "{given_name} the {adjective}"
  place_patterns:
    - "The {adjective} {title_abstract}"

- name: Dungeon Kennings
  description: "Compound kennings in the Germanic tradition. The name should sound like a place you do not want to go."
  slots:
    given_name:
      word_list: [Grim, Maw, Torch, Bone, Rot, Wail, Dread, Gut, Fang, Gloom, Char, Rust, Blight, Scream, Bile]
    place_suffix:
      word_list: [hold, deep, maw, pit, crypt, hollow, well, throat, tomb, den, vault, barrow, chasm, root, gut]
    adjective:
      word_list: [Wailing, Eyeless, Drowned, Shattered, Starving, Frozen, Bleeding, Endless]
    place_noun:
      word_list: [Descent, Labyrinth, Oubliette, Ossuary, Gullet, Warren, Catacomb, Undercroft]
  person_patterns:
    - "{given_name}{place_suffix}"
  place_patterns:
    - "{given_name}{place_suffix}"
    - "The {adjective} {place_noun}"
