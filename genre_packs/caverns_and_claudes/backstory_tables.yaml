# Backstory tables — Caverns & Claudes
# Random one-liner backstories for disposable delvers.
# Template: "Former {trade}. {feature}. {reason}."
# The engine picks one from each table and composes.

template: "Former {trade}. {feature}. {reason}."

trade:
  - ratcatcher
  - gravedigger
  - turnip farmer
  - tallow chandler
  - debt collector's nephew
  - failed apothecary
  - pig butcher
  - ditch digger
  - unlicensed dentist
  - third-shift lamplighter
  - leatherworker's apprentice
  - mushroom seller
  - tinker
  - potboy at the Broken Crown
  - mule skinner
  - reed cutter
  - charcoal burner
  - nightsoil collector
  - fishmonger
  - rope braider
  - clerk to a bankrupt merchant
  - alehouse sweeper
  - tanner
  - wheelwright's widow
  - ratcatcher (promoted from rat)
  - failed monk
  - cobbler with ambitions
  - quarry laborer
  - hedge barber
  - tax collector (unpopular)

feature:
  - Missing three fingers on the left hand
  - Torch burns up both arms
  - One glass eye that doesn't match
  - Smells permanently of pickled herring
  - Teeth filed to points for reasons never explained
  - A scar from ear to chin, earned in a turnip dispute
  - Hands stained black from years of tanning
  - Walks with a pronounced limp, claims it's lucky
  - No eyebrows — lost them in a fire
  - A brand on the forearm from the debtor's court
  - Voice like gravel in a tin bucket
  - Tattoo of a pig on the neck, regretted
  - One ear noticeably larger than the other
  - Permanent squint from years underground
  - Hair gone white on one side only
  - Nose broken so many times it points sideways
  - Missing the tip of the tongue, speaks with a lisp
  - Knuckles like walnuts from too many fistfights
  - A nervous twitch in the right eye
  - Skin weathered to the color and texture of old saddle leather
  - Six fingers on the right hand
  - Smells faintly of sulfur at all times
  - A wheeze that echoes in corridors
  - Burn scar shaped like a key on the palm
  - Gap-toothed grin that unsettles children
  - Always cold, even in summer
  - An old dog bite on the calf that never healed right
  - Ink-stained fingers from a life of forged documents
  - A cough that started three winters ago and never left
  - Ears pierced with bent iron nails

reason:
  - "Delves because the alternative is debtor's prison"
  - "Heard there was gold down there and believed it"
  - "Lost a bet with someone who didn't survive to collect"
  - "Exiled from the village for stealing a goat"
  - "The landlord raised the rent again"
  - "Followed someone into the dark and they didn't come back"
  - "Told the tax collector to go to hell. He suggested the dungeon instead"
  - "No one in town would hire them after the incident"
  - "The dungeon took their brother. Wants the body back, or what's left"
  - "Owes money to people who break legs professionally"
  - "Convinced a wizard owes them money. The wizard is down there somewhere"
  - "Woke up at the dungeon mouth with no memory of the last three days"
  - "The priest said the dungeon would build character"
  - "Ran out of options about two villages back"
  - "A dying delver gave them a map. Probably fake"
  - "Cheaper than eating in town"
  - "Everyone they knew is dead or gone. Might as well"
  - "The recruiter was very persuasive and the ale was very strong"
  - "Claims to have seen gold light leaking from the hillside at dusk"
  - "The militia gave them a choice: the dungeon or the stockade"
  - "A fortune teller said they'd die underground. Wants to prove her wrong"
  - "Tired of being nobody. The dungeon makes everyone equal"
  - "Sold everything to buy a sword. Needs gold to buy everything back"
  - "Their mother delved. Their grandmother delved. It's the family business"
  - "Found a key in the river. It has to open something down there"
  - "Nowhere else to go"
  - "The gold fever. You get it or you don't"
  - "Looking for a specific door that a drunk described in great detail"
  - "Volunteered. Nobody knows why, including them"
  - "The church wouldn't take them. The army wouldn't take them. The dungeon takes everyone"
