# ═══════════════════════════════════════════════════════════
# CREATURE ARCHETYPES — hostile dungeon inhabitants
# Used by encountergen when creatures.yaml is unavailable.
# ═══════════════════════════════════════════════════════════

- name: Dungeon Vermin
  description: >-
    Pale, bloated things that scuttle in the dark. Eyeless rats,
    beetles with calcite shells, centipedes longer than a forearm.
    They are the dungeon's immune system — drawn to warmth, light,
    and organic matter. Individually trivial. In numbers, they eat
    your rope, your rations, and your nerves.
  personality_traits:
    - swarming
    - relentless
    - instinct-driven
  typical_classes: []
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    constitution: [6, 10]
  catalog_items: []
  inventory_hints:
    - nothing of value
  dialogue_quirks:
    - does not speak
  disposition_default: -20
  ocean:
    openness: 1.0
    conscientiousness: 1.0
    extraversion: 2.0
    agreeableness: 1.0
    neuroticism: 8.0
  role: creature
  morale: 2

- name: Animated Corpse
  mindless: true   # B/X morale bypass — undead, no self-preservation
  description: >-
    A dead delver that did not stay dead. The dungeon keeps what
    it kills. The body moves with the jerking gait of something
    pulled on strings — the limbs remember walking but the mind
    that directed them is gone. It wears the remnants of its last
    expedition. It carries the weapons it died holding.
  personality_traits:
    - mindless
    - relentless
    - silent
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [12, 16]
    constitution: [14, 18]
  catalog_items: []
  inventory_hints:
    - corroded weapon from a previous life
    - tattered armor
  dialogue_quirks:
    - does not speak
  disposition_default: -30
  ocean:
    openness: 0.0
    conscientiousness: 0.0
    extraversion: 0.0
    agreeableness: 0.0
    neuroticism: 0.0
  role: creature
  morale: 10

- name: Keeper's Construct
  mindless: true   # B/X morale bypass — construct, does not think or negotiate
  description: >-
    A thing built by the dungeon's intelligence — shaped from stone,
    bone, or separated qualities. It patrols fixed routes and guards
    fixed thresholds. It does not think. It does not negotiate. It
    is architecture that hits back.
  personality_traits:
    - mechanical
    - territorial
    - implacable
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [16, 18]
    constitution: [16, 18]
  catalog_items: []
  inventory_hints:
    - nothing — it is the dungeon's property
  dialogue_quirks:
    - does not speak
  disposition_default: -30
  ocean:
    openness: 0.0
    conscientiousness: 10.0
    extraversion: 0.0
    agreeableness: 0.0
    neuroticism: 0.0
  role: creature
  morale: 10

- name: Corrupted Delver
  description: >-
    A former adventurer who went too deep and did not come back
    whole. The dungeon changed them — took their reason, their
    warmth, their name. They haunt the middle levels, wearing
    armor that no longer fits a body that no longer has the right
    shape. They attack on sight. They cannot be reasoned with.
    They are what happens when you run out of torches.
  personality_traits:
    - feral
    - desperate
    - broken
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [10, 16]
    dexterity: [10, 14]
    constitution: [8, 14]
  catalog_items:
    - sword_short
  inventory_hints:
    - ruined delving gear
    - a torch that burned out long ago
  dialogue_quirks:
    - mutters fragments of words that might once have been speech
    - screams when wounded
  disposition_default: -25
  ocean:
    openness: 1.0
    conscientiousness: 1.0
    extraversion: 2.0
    agreeableness: 0.0
    neuroticism: 10.0
  role: creature
  morale: 4

- name: Dungeon Predator
  description: >-
    A thing adapted to the dark. Not vermin — a real predator, the
    size of a large dog or bigger. It hunts by vibration, by heat,
    by the smell of torchsmoke. It is patient. It follows at the
    edge of the light and waits for someone to fall behind. The
    dungeon breeds these the way a body breeds white blood cells.
  personality_traits:
    - patient
    - cunning
    - territorial
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [14, 18]
    dexterity: [14, 18]
    constitution: [12, 16]
  catalog_items: []
  inventory_hints:
    - nothing — gut contents may contain previous victims' gear
  dialogue_quirks:
    - does not speak
  disposition_default: -20
  ocean:
    openness: 2.0
    conscientiousness: 3.0
    extraversion: 2.0
    agreeableness: 0.0
    neuroticism: 5.0
  role: creature
  morale: 6

# ═══════════════════════════════════════════════════════════
# NPC ARCHETYPES — town and hireling roles
# ═══════════════════════════════════════════════════════════

- name: Torchbearer
  description: >-
    A nervous youth hired to carry the light. Grips the torch with
    white knuckles and flinches at every shadow. The most important
    person in the party and the first to die.
  personality_traits:
    - nervous
    - dutiful
    - easily spooked
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [8, 12]
    constitution: [8, 12]
  catalog_items:
    - torch
    - torch
    - torch
  inventory_hints:
    - tinder box
    - a scrap of prayer written on cloth
  dialogue_quirks:
    - voice trembles when describing what they see
    - whispers even when there is no reason to
  disposition_default: 5
  ocean:
    openness: 3.0
    conscientiousness: 6.0
    extraversion: 2.0
    agreeableness: 7.0
    neuroticism: 8.0
  role: hireling
  morale: 4

- name: Porter
  description: >-
    A broad-shouldered hauler who carries what others cannot. Speaks
    little, eats much, and has the dead-eyed patience of someone who
    has learned not to look at what they are carrying.
  personality_traits:
    - stoic
    - uncurious
    - dependable
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [14, 18]
    constitution: [12, 16]
  catalog_items:
    - sack_large
    - rope_hemp
  inventory_hints:
    - leather back-brace
    - half a cheese wheel
  dialogue_quirks:
    - answers questions with a grunt or a single word
    - stares at the middle distance while others argue
  disposition_default: 3
  ocean:
    openness: 2.0
    conscientiousness: 7.0
    extraversion: 1.0
    agreeableness: 5.0
    neuroticism: 3.0
  role: hireling
  morale: 6

- name: Sellsword
  description: >-
    A mercenary with a notched blade and no loyalty beyond the next
    payment. Fights well enough when the odds are reasonable. Deserts
    the moment they are not.
  personality_traits:
    - mercenary
    - pragmatic
    - self-preserving
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [12, 16]
    dexterity: [10, 14]
  catalog_items:
    - sword_short
    - leather_armor
  inventory_hints:
    - dice carved from bone
    - a purse worn inside the shirt
  dialogue_quirks:
    - quotes their fee before answering any question
    - sizes up every room for exits before looking at anything else
  disposition_default: -5
  ocean:
    openness: 4.0
    conscientiousness: 3.0
    extraversion: 5.0
    agreeableness: 2.0
    neuroticism: 4.0
  role: hireling
  morale: 5

- name: Fence
  description: >-
    A black-market dealer who buys dungeon loot in the surface town.
    Knows the value of everything and pays half. Sweats when nervous,
    which is always.
  personality_traits:
    - greedy
    - cunning
    - paranoid
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [12, 16]
    intelligence: [12, 16]
  catalog_items:
    - dagger_iron
  inventory_hints:
    - scales and weights in a velvet pouch
    - a ledger written in personal cipher
  dialogue_quirks:
    - drops voice to a whisper mid-sentence for no reason
    - eyes the door whenever money is mentioned
  disposition_default: -10
  ocean:
    openness: 5.0
    conscientiousness: 4.0
    extraversion: 4.0
    agreeableness: 2.0
    neuroticism: 7.0
  role: town
  morale: null

- name: Rumormonger
  description: >-
    A one-eyed regular at the town tavern who claims to have survived
    three dungeons. Sells information about Keepers, layouts, and
    treasure locations. Some of it is even true.
  personality_traits:
    - shifty
    - talkative
    - half-honest
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [10, 14]
    wisdom: [8, 12]
  catalog_items: []
  inventory_hints:
    - a mug that is never empty
    - a hand-drawn map of questionable accuracy
  dialogue_quirks:
    - leans in conspiratorially before every sentence
    - names every dungeon like an old enemy
  disposition_default: 0
  ocean:
    openness: 7.0
    conscientiousness: 2.0
    extraversion: 8.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: town
  morale: null

- name: Provisioner
  description: >-
    The only shop in town that sells what dungeon-goers need. Prices
    are fair because there is no competition. Keeps a tally of who
    comes back and who does not.
  personality_traits:
    - businesslike
    - unsentimental
    - quietly compassionate
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [10, 14]
    wisdom: [12, 16]
  catalog_items:
    - torch
    - rations_day
    - rope_hemp
  inventory_hints:
    - a wall of tallied names behind the counter
    - a jar of teeth left as collateral by those who did not return
  dialogue_quirks:
    - recites prices from memory without looking up
    - never asks where you are going
  disposition_default: 10
  ocean:
    openness: 3.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 6.0
    neuroticism: 2.0
  role: town
  morale: null
