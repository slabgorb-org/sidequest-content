# Character creation — Caverns & Claudes (WWN era)
# 4 scenes: calling → story → kit → mouth.
# Standard-array pack (rules.yaml stat_generation: standard_array) — no
# roll/arrange scenes; the builder seeds attributes from the WWN standard
# array [14,12,11,10,9,7] in ability-score declaration order, per the
# elemental_harmony / heavy_metal precedent (ADR-142 Step 2B). The B/X
# visible-3d6 scenes were retired in the 2026-06-12 WWN port.

- id: the_calling
  title: "What You'll Be Called"
  narration: |
    You sit at a scarred table in a lamplit room that smells of tallow and
    old sweat. Brecca Half-Hand — missing three fingers from her left hand,
    seven-delve veteran — opens the ledger and looks at you the way she
    looks at rope: checking for the flaw that will kill someone later.

    "Three trades go down the rope," she says. "Pick the one you'll die as.
    The dungeon doesn't care which. The records do."
  choices:
    - label: "Warrior"
      description: "Mail, a long blade, and the patience to be hit first."
      mechanical_effects:
        class_hint: Warrior
        rpg_role_hint: tank
        jungian_hint: hero
    - label: "Expert"
      description: "Lockpicks, leather, and a professional interest in being elsewhere."
      mechanical_effects:
        class_hint: Expert
        rpg_role_hint: stealth
        jungian_hint: explorer
    - label: "Mage"
      description: "Recovered pages, a steady hand, and a body that pays for every working."
      mechanical_effects:
        class_hint: Mage
        rpg_role_hint: control
        jungian_hint: magician
  allows_freeform: false

- id: the_trade
  title: "What You Did Before"
  narration: |
    Brecca sets the quill down and looks at you like she's pricing rope.
    "You didn't come from nowhere," she says. "Something put a set of
    hands on you before the dungeon did. What did those hands do?"

    She taps the ledger. The ledger has a column for this.
  loading_text: "Brecca makes a note in the margin."
  choices:
    - label: "Worked the winch end of something"
      description: "Mine shaft, well, or siege engine. You know load, and you know what happens when the load shifts."
      mechanical_effects:
        background: Rope-Puller
        focus_id: load-bearer
        skill_grants:
          Exert: 0
    - label: "Pulled teeth and set bones"
      description: "Hedge barber, wound-closer, the person the village sent for when there was no one better. You learned medicine from results."
      mechanical_effects:
        background: Hedge-Barber
        focus_id: dungeon-surgeon
        skill_grants:
          Heal: 0
    - label: "Worked a crowd before working a dungeon"
      description: "Three seasons picking pockets at market fairs. What you actually learned was not being noticed."
      mechanical_effects:
        background: Cutpurse-Alumni
        focus_id: crowd-mover
        skill_grants:
          Sneak: 0
    - label: "Left the temple before ordination"
      description: "You know the prayers and the herb-lore and which of the congregation skim the plate. The reasons for leaving vary by telling."
      mechanical_effects:
        background: Failed-Cleric
        focus_id: quick-tongue
        skill_grants:
          Pray: 0
    - label: "Walked away from a guild apprenticeship"
      description: "Long enough to learn the craft, short enough to avoid the fees. You know how things are built, which means you know how they come apart."
      mechanical_effects:
        background: Guild-Dropout
        focus_id: door-reader
        skill_grants:
          Craft: 0
    - label: "Carried a spear on a road nobody cared about"
      description: "Three seasons as a roadwarden, watching for bandits who mostly didn't come. What you learned was terrain and the third watch."
      mechanical_effects:
        background: Roadwarden-Washout
        focus_id: torch-discipline
        skill_grants:
          Survive: 0
  allows_freeform: false

- id: the_story
  title: "For The Tally"
  narration: |
    Brecca dips the quill and looks up. "For the tally," she says. "In case
    you don't come back."

    She wants three things: how to refer to you, what you did before, and
    what you look like. Or you can let her make something up.
  loading_text: "Brecca writes in the ledger..."
  choices: []
  allows_freeform: true
  mechanical_effects:
    identity_capture:
      pronouns_required: true
      background_optional: true
      description_optional: true
    background_autogen_source: backstory_tables

- id: the_kit
  title: "What You Have"
  narration: |
    Brecca reaches beneath the table and drops a canvas sack in front of you.
    It lands with a dull thud. "Standard kit," she says. "Sized to the trade.
    Some of it's useful. Some of it isn't. All of it's yours now."
  choices: []
  allows_freeform: false
  mechanical_effects:
    equipment_generation: class_kit

- id: the_mouth
  title: "The Dungeon Waits"
  narration: |
    Dawn. The mouth of the dungeon is a crack in the hillside, edged with
    moss and old tooth-marks in the stone. Cold air breathes outward, carrying
    the smell of wet rock and something older.

    Behind you, the town is already forgetting your name. Ahead, the dark
    waits with the patience of something that has swallowed better than you.
  choices: []
  allows_freeform: false
