# Character creation — Caverns & Claudes (classic-class era)
# 5 scenes: roll → class → pronouns → kit → dungeon mouth.
# Class qualification loop: scene 1 rerolls server-side until ≥1
# class qualifies. UI sees only the final stats. Class scene then
# offers only the qualifying classes as buttons.

- id: the_roll
  title: "3d6. In Order."
  narration: |
    You sit at a scarred table in a lamplit room that smells of tallow and old
    sweat. Brecca Half-Hand — missing three fingers from her left hand,
    seven-delve veteran — pushes six bone dice across the wood toward you.

    "Strength, Dexterity, Constitution, Intelligence, Wisdom, Charisma," she
    says, tapping the table once for each word. "Roll them in order. The bones
    don't care what you wanted to be — but if they hand you nothing useful, we
    throw them again."
  loading_text: "Brecca Half-Hand considers your numbers..."
  choices: []
  allows_freeform: false
  mechanical_effects:
    stat_generation: roll_3d6_strict
    class_qualification_loop: true

- id: the_calling
  title: "What You'll Be Called"
  narration: |
    Brecca looks at the bones, then at you. "These are the trades the bones
    will let you take. The dungeon doesn't care which one you pick. The
    records do."
  choices:
    - label: "Fighter"
      description: "Plate, polearm, and the patience to be hit first. (STR 9+)"
      mechanical_effects:
        class_hint: Fighter
        rpg_role_hint: tank
        jungian_hint: hero
    - label: "Mage"
      description: "Bookish, half-blind, and dangerous in the third round. (INT 9+)"
      mechanical_effects:
        class_hint: Mage
        rpg_role_hint: control
        jungian_hint: magician
    - label: "Cleric"
      description: "Holy symbol, war-mace, and a faith that is mostly working so far. (WIS 9+)"
      mechanical_effects:
        class_hint: Cleric
        rpg_role_hint: healer
        jungian_hint: caregiver
    - label: "Thief"
      description: "Lockpicks, leather, and a professional interest in being elsewhere. (DEX 9+)"
      mechanical_effects:
        class_hint: Thief
        rpg_role_hint: stealth
        jungian_hint: outlaw
  allows_freeform: false

- id: pronouns
  title: "Who Are You?"
  narration: >-
    Brecca looks you over once, recording something in a water-stained
    ledger. "For the tally," she says. "In case you don't come back."
  allows_freeform: true
  choices:
    - label: "she/her"
      description: "She."
      mechanical_effects:
        pronoun_hint: "she/her"
    - label: "he/him"
      description: "He."
      mechanical_effects:
        pronoun_hint: "he/him"
    - label: "they/them"
      description: "They."
      mechanical_effects:
        pronoun_hint: "they/them"

- id: the_kit
  title: "What You Have"
  narration: |
    Brecca reaches beneath the table and drops a canvas sack in front of you.
    It lands with a dull thud. "Standard kit," she says. "Sized to the trade.
    Some of it's useful. Some of it isn't. All of it's yours now."

    "You'll have time to read what you've got before you set out."
  choices: []
  allows_freeform: false
  mechanical_effects:
    equipment_generation: class_kit

- id: the_mouth
  title: "The Dungeon Waits"
  narration: |
    Dawn. The mouth of the dungeon is a crack in the hillside, edged with
    moss and old tooth-marks in the stone. Cold air breathes outward, carrying
    the smell of wet rock and something older.

    Behind you, the town is already forgetting your name. Ahead, the dark
    waits with the patience of something that has swallowed better than you.
  choices: []
  allows_freeform: false
