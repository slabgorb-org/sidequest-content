# Power Tiers — caverns_and_claudes
# No classes — tiers are based on gold extracted (treasure-as-XP)
# Visual progression reflects accumulated dungeon experience, not heroic growth

Delver:
  - level_range: [1, 3]
    label: fresh_meat
    player: >-
      ill-fitting leather scraps and a dented helmet that belonged to
      someone else, a single torch in one white-knuckled fist and a
      cheap weapon in the other, the wide eyes and clean face of someone
      who has never been underground
    npc: >-
      a nervous figure clutching a torch and a ten-foot pole, wearing
      whatever they could afford and nothing that fits properly, checking
      every shadow twice

  - level_range: [4, 6]
    label: seasoned
    player: >-
      practical gear in muted browns and greys, leather armor with
      hand-stitched repairs from dungeon damage, a reliable weapon
      showing honest wear, chalk-marked hands, ink-stained map case
      on the hip, the thousand-yard stare of someone who has lost
      hirelings
    npc: >-
      a quiet, alert figure in well-maintained dungeoneering gear,
      moves with economy and awareness, eyes go to exits and ceiling
      before anything else, hands never far from a weapon

  - level_range: [7, 10]
    label: old_hand
    player: >-
      equipment chosen for function with zero regard for appearance,
      layered armor pieces scavenged from a dozen dungeons, a weapon
      that has been resharpened so many times the blade profile has
      changed, rope burns on both palms, a calm that reads as either
      confidence or resignation
    npc: >-
      someone the tavern goes quiet for when they walk in, gear that
      tells a story in scars and repairs, moves through the town like
      they are mapping exits out of habit, speaks little, never
      startles
