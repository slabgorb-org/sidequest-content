# Caverns & Claudes — Classic Classes (B/X-flavored)
# Class influences starting Edge (via rules.yaml edge_config.base_max_by_class)
# and starting equipment kit (equipment_tables.yaml class_tables block).
# Future hooks (encounter beats, magic access) are reserved as empty slots.

- id: fighter
  display_name: Fighter
  rpg_role: tank
  jungian_default: hero
  prime_requisite: STR
  minimum_score: 9
  kit_table: fighter_kit
  flavor: >-
    Plate, polearm, and the patience to be hit first.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - shield_bash
    - cleave
    - parry
    - feint
  magic_access: null
  # B/X B26 saving-throw targets. Flat per Basic-set canon (no per-level
  # adjustment); Expert-set scaling is a future content pass.
  saving_throws:
    death_ray_or_poison: 12
    magic_wands: 13
    paralysis_or_stone: 14
    dragon_breath: 15
    rods_staves_spells: 16

- id: mage
  display_name: Mage
  rpg_role: control
  jungian_default: magician
  prime_requisite: INT
  minimum_score: 9
  kit_table: mage_kit
  flavor: >-
    Bookish, half-blind, and dangerous in the third round.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - cast_cantrip
    - cast_spell
  magic_access: innate_v1
  # Per story 47-10 (dual-plugin pivot 2026-05-09): magic_access stays
  # innate_v1 (player-facing surface). magic_config is the data-side
  # contract read by seed_learned_v1_state to populate known_spells,
  # prepared_spells, and per-level slot bars from arcane_l1.yaml.
  magic_config:
    tradition: arcane
    starting_known_spells: 2
    save_dc_stat: INT
    turn_undead: false
    # B/X canon Magic-User slot progression. Outer key: class level.
    # Inner key: spell level. Stringified per YAML 1.1 / JSON-safe.
    slots_by_class_level:
      "1": { "1": 1 }
      "2": { "1": 2 }
      "3": { "1": 2, "2": 1 }
      "4": { "1": 3, "2": 2 }
      "5": { "1": 3, "2": 2, "3": 1 }
      "6": { "1": 3, "2": 2, "3": 2 }
      "7": { "1": 4, "2": 3, "3": 2, "4": 1 }
      "8": { "1": 4, "2": 3, "3": 3, "4": 2 }
  saving_throws:
    death_ray_or_poison: 13
    magic_wands: 14
    paralysis_or_stone: 13
    dragon_breath: 16
    rods_staves_spells: 15

- id: cleric
  display_name: Cleric
  rpg_role: healer
  jungian_default: caregiver
  prime_requisite: WIS
  minimum_score: 9
  kit_table: cleric_kit
  flavor: >-
    Holy symbol, war-mace, and a faith that is mostly working so far.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - shield_bash
    - turn_undead
    - pray
  magic_access: innate_v1
  magic_config:
    tradition: divine
    starting_known_spells: 2
    save_dc_stat: WIS
    turn_undead: true
    # B/X canon Cleric slot progression. L1 Cleric has no spells; L2
    # is the first slot row.
    slots_by_class_level:
      "2": { "1": 1 }
      "3": { "1": 2 }
      "4": { "1": 2, "2": 1 }
      "5": { "1": 2, "2": 2 }
      "6": { "1": 2, "2": 2, "3": 1, "4": 1 }
      "7": { "1": 2, "2": 2, "3": 2, "4": 1, "5": 1 }
      "8": { "1": 3, "2": 3, "3": 2, "4": 2, "5": 1 }
  saving_throws:
    death_ray_or_poison: 11
    magic_wands: 12
    paralysis_or_stone: 14
    dragon_breath: 16
    rods_staves_spells: 15

- id: thief
  display_name: Thief
  rpg_role: stealth
  jungian_default: outlaw
  prime_requisite: DEX
  minimum_score: 9
  kit_table: thief_kit
  flavor: >-
    Lockpicks, leather, and a professional interest in being elsewhere.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - feint
    - backstab
    - sneak
  magic_access: null
  saving_throws:
    death_ray_or_poison: 13
    magic_wands: 14
    paralysis_or_stone: 13
    dragon_breath: 16
    rods_staves_spells: 15
