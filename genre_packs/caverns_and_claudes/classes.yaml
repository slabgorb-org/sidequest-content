# Caverns & Claudes — Classic Classes (B/X-flavored)
# Class influences starting Edge (via rules.yaml edge_config.base_max_by_class)
# and starting equipment kit (equipment_tables.yaml class_tables block).
# Future hooks (encounter beats, magic access) are reserved as empty slots.

- id: fighter
  display_name: Fighter
  rpg_role: tank
  jungian_default: hero
  prime_requisite: STR
  minimum_score: 9
  kit_table: fighter_kit
  flavor: >-
    Plate, polearm, and the patience to be hit first.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - shield_bash
    - cleave
    - parry
    - feint
    - taunt
  magic_access: null
  # B/X B26 saving-throw targets. Flat per Basic-set canon (no per-level
  # adjustment); Expert-set scaling is a future content pass.
  saving_throws:
    death_ray_or_poison: 12
    magic_wands: 13
    paralysis_or_stone: 14
    dragon_breath: 15
    rods_staves_spells: 16
  abilities:
    - name: "Taunt"
      genre_description: >-
        A half-step forward — close enough that the swing has to come at
        you. An insult landing somewhere it costs to ignore. The squishies
        are behind you now, and the thing in front has lost the option of
        choosing prettier prey. You are the meal. Eat it on the chin.
      mechanical_effect: >-
        Forces enemy attention onto the Fighter for the round; one ally
        attack per round reroutes to the Fighter; expires at end of round.
      involuntary: false

- id: mage
  display_name: Mage
  rpg_role: control
  jungian_default: magician
  prime_requisite: INT
  minimum_score: 9
  kit_table: mage_kit
  flavor: >-
    Bookish, half-blind, and dangerous in the third round.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - cast_cantrip
    - cast_spell
  magic_access: innate_v1
  # Per story 47-10 (dual-plugin pivot 2026-05-09): magic_access stays
  # innate_v1 (player-facing surface). magic_config is the data-side
  # contract read by seed_learned_v1_state to populate known_spells,
  # prepared_spells, and per-level slot bars from arcane_l1.yaml.
  magic_config:
    tradition: arcane
    # C&C deviation from B/X canon (canon = 2). Sünden Mages get the
    # Detect Magic / Read Magic / Sleep package as a guild-outsider's
    # working baseline — three workings give the L1 Mage one daily-cast
    # option even after Read Magic burns the morning slot. Worlds that
    # want strict B/X parity may override at the world layer (no
    # mechanism shipped yet — author here when a non-Sünden C&C world
    # lands).
    starting_known_spells: 3
    save_dc_stat: INT
    turn_undead: false
    # B/X canon Magic-User slot progression. Outer key: class level.
    # Inner key: spell level. Stringified per YAML 1.1 / JSON-safe.
    slots_by_class_level:
      "1": { "1": 1 }
      "2": { "1": 2 }
      "3": { "1": 2, "2": 1 }
      "4": { "1": 3, "2": 2 }
      "5": { "1": 3, "2": 2, "3": 1 }
      "6": { "1": 3, "2": 2, "3": 2 }
      "7": { "1": 4, "2": 3, "3": 2, "4": 1 }
      "8": { "1": 4, "2": 3, "3": 3, "4": 2 }
  saving_throws:
    death_ray_or_poison: 13
    magic_wands: 14
    paralysis_or_stone: 13
    dragon_breath: 16
    rods_staves_spells: 15

- id: cleric
  display_name: Cleric
  rpg_role: healer
  jungian_default: caregiver
  prime_requisite: WIS
  minimum_score: 9
  kit_table: cleric_kit
  flavor: >-
    Holy symbol, war-mace, and a faith that is mostly working so far.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - shield_bash
    - turn_undead
    - pray
  magic_access: innate_v1
  magic_config:
    tradition: divine
    starting_known_spells: 2
    save_dc_stat: WIS
    turn_undead: true
    # B/X canon Cleric slot progression. L1 Cleric has no spells; L2
    # is the first slot row.
    slots_by_class_level:
      "2": { "1": 1 }
      "3": { "1": 2 }
      "4": { "1": 2, "2": 1 }
      "5": { "1": 2, "2": 2 }
      "6": { "1": 2, "2": 2, "3": 1, "4": 1 }
      "7": { "1": 2, "2": 2, "3": 2, "4": 1, "5": 1 }
      "8": { "1": 3, "2": 3, "3": 2, "4": 2, "5": 1 }
  saving_throws:
    death_ray_or_poison: 11
    magic_wands: 12
    paralysis_or_stone: 14
    dragon_breath: 16
    rods_staves_spells: 15
  abilities:
    - name: "Turn Undead"
      genre_description: >-
        You lift the holy symbol — wood worn pale where the thumb has rested
        for a thousand prayers. The unliving feel it before they see it: a
        line drawn between the world that is theirs and the world that is
        no longer. Some break. Some do not. The intelligent ones already
        chose, long ago, and the symbol means nothing to them.
      mechanical_effect: >-
        2d6 vs target HD; loud (raises Keeper awareness); auto-fails on
        intelligent unliving who have made their alignment.
      involuntary: false

- id: thief
  display_name: Thief
  rpg_role: stealth
  jungian_default: outlaw
  prime_requisite: DEX
  minimum_score: 9
  kit_table: thief_kit
  flavor: >-
    Lockpicks, leather, and a professional interest in being elsewhere.
  encounter_beat_choices:
    - attack
    - defend
    - flee
    - feint
    - backstab
    - sneak
  magic_access: null
  saving_throws:
    death_ray_or_poison: 13
    magic_wands: 14
    paralysis_or_stone: 13
    dragon_breath: 16
    rods_staves_spells: 15
  abilities:
    - name: "Backstab"
      genre_description: >-
        You pick the moment the way a counterman picks the right coin
        from a handful — by feel, without looking. The gap between rib
        and rib. The gap between one breath and the next. Quiet, brief,
        complete. The kind of removal you wouldn't notice happened to
        someone else.
      mechanical_effect: >-
        Requires unaware target (sneak / feint setup or surprise round);
        damage multiplier per Edge math; one-shot ends combat against
        single weak unaware targets.
      involuntary: false
