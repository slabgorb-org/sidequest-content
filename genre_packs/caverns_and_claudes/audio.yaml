# Caverns & Claudes — Audio Configuration
# Silence is the default. Sound means danger.

mood_tracks:
  silence: []
  exploration:
    - path: audio/music/exploration.ogg
      title: "Stone Drone"
      bpm: 60
  tension:
    - path: audio/music/tension.ogg
      title: "Keeper Pulse"
      bpm: 70
  combat:
    - path: audio/music/combat.ogg
      title: "Iron and Stone"
      bpm: 140
  extraction:
    - path: audio/music/extraction.ogg
      title: "Run for Daylight"
      bpm: 160
  keeper_monologue:
    - path: audio/music/keeper_monologue.ogg
      title: "The Glutton Speaks"
      bpm: 40
  rest:
    - path: audio/music/rest.ogg
      title: "Campfire Underground"
      bpm: 50
  town:
    - path: audio/music/town.ogg
      title: "Gristwell Morning"
      bpm: 80

sfx_library:
  doors:
    - audio/sfx/door_open.ogg
    - audio/sfx/door_slam.ogg
  traps:
    - audio/sfx/trap_trigger.ogg
  torch:
    - audio/sfx/torch_sputter.ogg
    - audio/sfx/torch_out.ogg
  loot:
    - audio/sfx/coin_clink.ogg
  morale:
    - audio/sfx/morale_break.ogg
  keeper:
    - audio/sfx/keeper_rumble.ogg

creature_voice_presets:
  pale_rat:
    creature_type: pale_rat
    description: "High-pitched chittering, barely audible"
    pitch: 1.8
    rate: 1.4
    effects: []
  crawling_scavenger:
    creature_type: crawling_scavenger
    description: "Wet clicking mandibles, low hiss"
    pitch: 0.7
    rate: 0.8
    effects:
      - type: reverb
        params:
          room_size: 0.6
  the_maw:
    creature_type: the_maw
    description: "Deep rumbling growl from the walls themselves"
    pitch: 0.3
    rate: 0.5
    effects:
      - type: reverb
        params:
          room_size: 0.9
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 400.0

mixer:
  music_volume: 0.3
  sfx_volume: 0.7
  voice_volume: 1.0
  duck_music_for_voice: true
  duck_amount_db: -15.0
  crossfade_default_ms: 2000

themes:
  - name: exploration
    mood: exploration
    base_prompt: ""
    variations:
      - type: ambient
        path: audio/music/exploration.ogg
  - name: tension
    mood: tension
    base_prompt: ""
    variations:
      - type: tension_build
        path: audio/music/tension.ogg
  - name: combat
    mood: combat
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/combat.ogg
  - name: extraction
    mood: extraction
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/extraction.ogg
  - name: keeper
    mood: keeper_monologue
    base_prompt: ""
    variations:
      - type: ambient
        path: audio/music/keeper_monologue.ogg
  - name: town
    mood: town
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/town.ogg
