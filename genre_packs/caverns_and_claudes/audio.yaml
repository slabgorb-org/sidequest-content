# Caverns & Claudes — Audio Configuration
# Silence is the default. Sound means danger.

mood_tracks:
  exploration:
    - path: audio/music/exploration.ogg
      title: "Dripping Passage"
      bpm: 60
  tension:
    - path: audio/music/tension.ogg
      title: "Keeper Stirs"
      bpm: 50
  combat:
    - path: audio/music/combat.ogg
      title: "Steel on Stone"
      bpm: 130
  rest:
    - path: audio/music/rest.ogg
      title: "Campfire Underground"
      bpm: 55

sfx_library:
  door_open:
    - audio/sfx/door_open.ogg
  door_slam:
    - audio/sfx/door_slam.ogg
  trap_trigger:
    - audio/sfx/trap_trigger.ogg
  torch_sputter:
    - audio/sfx/torch_sputter.ogg
  torch_out:
    - audio/sfx/torch_out.ogg
  coin_clink:
    - audio/sfx/coin_clink.ogg
  morale_break:
    - audio/sfx/morale_break.ogg
  keeper_rumble:
    - audio/sfx/keeper_rumble.ogg

creature_voice_presets:
  keeper:
    creature_type: keeper
    description: "Deep subterranean rumble, stone grinding on stone"
    pitch: 0.4
    rate: 0.6
    effects:
      - type: reverb
        params:
          room_size: 0.9
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 800
  goblin:
    creature_type: goblin
    description: "High-pitched, chittering, echoing off walls"
    pitch: 1.4
    rate: 1.3
    effects:
      - type: reverb
        params:
          room_size: 0.5

mixer:
  music_volume: 0.06
  sfx_volume: 0.15
  voice_volume: 1.0
  duck_music_for_voice: true
  duck_amount_db: -12.0
  crossfade_default_ms: 3000

themes:
  - name: exploration
    mood: exploration
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/exploration.ogg
  - name: tension
    mood: tension
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/tension.ogg
  - name: combat
    mood: combat
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/combat.ogg
  - name: rest
    mood: rest
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/rest.ogg
