# Caverns & Claudes — Audio Configuration
# Silence is the default. Sound means danger.

mood_tracks:
  silence: []
  exploration:
    - path: audio/music/exploration.ogg
      title: "Stone Drone"
      bpm: 60
    - path: audio/music/exploration_3.ogg
      title: "Drip Echo"
      bpm: 55
    - path: audio/music/exploration_4.ogg
      title: "Passage Breath"
      bpm: 50
  tension:
    - path: audio/music/tension.ogg
      title: "Keeper Pulse"
      bpm: 70
    - path: audio/music/tension_3.ogg
      title: "Stone Grind"
      bpm: 65
    - path: audio/music/tension_4.ogg
      title: "Awareness Rising"
      bpm: 75
  combat:
    - path: audio/music/combat.ogg
      title: "Iron and Stone"
      bpm: 140
    - path: audio/music/combat_3.ogg
      title: "Tooth and Claw"
      bpm: 150
    - path: audio/music/combat_4.ogg
      title: "The Maw Hungers"
      bpm: 135
  extraction:
    - path: audio/music/extraction.ogg
      title: "Run for Daylight"
      bpm: 160
    - path: audio/music/extraction_3.ogg
      title: "Collapsing Behind"
      bpm: 155
    - path: audio/music/extraction_4.ogg
      title: "Daylight Ahead"
      bpm: 165
  keeper_monologue:
    - path: audio/music/keeper_monologue.ogg
      title: "The Glutton Speaks"
      bpm: 40
    - path: audio/music/keeper_monologue_3.ogg
      title: "Digestion"
      bpm: 35
  rest:
    - path: audio/music/rest.ogg
      title: "Campfire Underground"
      bpm: 50
    - path: audio/music/rest_3.ogg
      title: "Safe Room"
      bpm: 45
  town:
    - path: audio/music/town.ogg
      title: "Gristwell Morning"
      bpm: 80
    - path: audio/music/town_3.ogg
      title: "The Hiring Board"
      bpm: 75

sfx_library:
  doors:
    - audio/sfx/door_open.ogg
    - audio/sfx/door_slam.ogg
  traps:
    - audio/sfx/trap_trigger.ogg
  torch:
    - audio/sfx/torch_sputter.ogg
    - audio/sfx/torch_out.ogg
  loot:
    - audio/sfx/coin_clink.ogg
  morale:
    - audio/sfx/morale_break.ogg
  keeper:
    - audio/sfx/keeper_rumble.ogg

mixer:
  music_volume: 0.3
  sfx_volume: 0.7
  duck_amount_db: -15.0
  crossfade_default_ms: 2000

themes:
  - name: exploration
    mood: exploration
    base_prompt: ""
    variations:
      - type: ambient
        path: audio/music/exploration.ogg
      - type: sparse
        path: audio/music/exploration_3.ogg
      - type: ambient
        path: audio/music/exploration_4.ogg
  - name: tension
    mood: tension
    base_prompt: ""
    variations:
      - type: tension_build
        path: audio/music/tension.ogg
      - type: sparse
        path: audio/music/tension_3.ogg
      - type: full
        path: audio/music/tension_4.ogg
  - name: combat
    mood: combat
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/combat.ogg
      - type: full
        path: audio/music/combat_3.ogg
      - type: overture
        path: audio/music/combat_4.ogg
  - name: extraction
    mood: extraction
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/extraction.ogg
      - type: full
        path: audio/music/extraction_3.ogg
      - type: resolution
        path: audio/music/extraction_4.ogg
  - name: keeper
    mood: keeper_monologue
    base_prompt: ""
    variations:
      - type: ambient
        path: audio/music/keeper_monologue.ogg
      - type: sparse
        path: audio/music/keeper_monologue_3.ogg
  - name: rest
    mood: rest
    base_prompt: ""
    variations:
      - type: ambient
        path: audio/music/rest.ogg
      - type: sparse
        path: audio/music/rest_3.ogg
  - name: town
    mood: town
    base_prompt: ""
    variations:
      - type: full
        path: audio/music/town.ogg
      - type: ambient
        path: audio/music/town_3.ogg
