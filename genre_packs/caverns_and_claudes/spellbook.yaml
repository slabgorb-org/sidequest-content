# spellbook.yaml — caverns_and_claudes genre layer
#
# 2026-05-07: Authored after the B/X (Moldvay/Cook) pivot to caster
# classes. This file is the canonical L1 spell catalog for both
# Magic-User and Cleric. The narrator MUST treat this list as closed
# — if a player names a spell that isn't in this file, the spell does
# not exist in the world. No improvisation. No Silent Fallback
# (CLAUDE.md). If the spell isn't here, the page is blank.
#
# L1 only this pass. L2 and L3 catalogs are deferred to a follow-up
# content pass — at L1 chargen the caster surface is small (Magic-User:
# 1 slot/day; Cleric: 0 slots/day, casting begins at L2). Authoring L2+
# now would be stubbing.
#
# Worlds may add domain flavor on top of this catalog (see
# worlds/<world>/spellbook.yaml). Worlds may NOT add new spells.
#
# Reference: D&D Basic Set, Moldvay 1981 (Magic-User) / Cook 1981 (Cleric).

genre: caverns_and_claudes

# === Magic-User spell list ============================================
# Memorized from spellbook each morning; consumed on cast; refresh on rest.
# At L1 the Magic-User has 1 slot/day. Choose carefully.

magic_user:
  l1:
    - id: charm_person
      name: Charm Person
      range: "120 ft"
      duration: "until dispelled or save succeeds"
      save: "Spells (negates)"
      target: "1 person (humanoid, 4 HD or fewer)"
      effect: |
        Target regards the caster as a trusted friend. Will not attack
        the caster directly; will follow reasonable requests but
        resists suicidal or wildly out-of-character orders. Saving
        throw repeats each new day at advantage if the request grows
        unreasonable. Breaks if the caster attacks the target.
      narrator_hint: |
        Surface the social effect — the charmed NPC's tone shifts
        mid-sentence; companions notice. Do not narrate the target's
        thoughts; describe what they say and do.

    - id: detect_magic
      name: Detect Magic
      range: "60 ft"
      duration: "2 turns (20 minutes)"
      target: "self"
      effect: |
        Caster perceives the location of magical auras within range —
        items, ongoing effects, charmed creatures, magical traps.
        Reveals presence and rough strength, not nature or function.
      narrator_hint: |
        Auras read as cold/warm/loud/quiet impressions — the spell
        sees magic, not what magic does. A bag of three cursed coins
        looks like one bright spot; identifying which coin requires
        another working.

    - id: floating_disc
      name: Floating Disc
      range: "6 ft"
      duration: "6 turns (1 hour)"
      target: "self (disc travels with caster)"
      effect: |
        Creates a horizontal disc of force ~3 ft diameter, hovering at
        waist height. Carries up to 5,000 cn (~500 lbs). Follows the
        caster at walking pace within 6 ft; falls and dissipates if
        the caster moves out of range or duration expires.
      narrator_hint: |
        Invisible from above, faintly visible from below as a shimmer
        of disturbed air. Treasure stacked on it appears to float.
        Disappears mid-turn — anything on it falls.

    - id: hold_portal
      name: Hold Portal
      range: "10 ft"
      duration: "2d6 turns"
      target: "1 door, gate, shutter, or hatch"
      effect: |
        Holds the portal magically shut. A creature with Strength 18+
        or magical force may break it. Knock or successful Dispel
        Magic ends it.
      narrator_hint: |
        The door does not appear locked — it appears stuck. Pursuers
        will lose seconds testing the latch before they realize.

    - id: light
      name: Light
      range: "120 ft"
      duration: "6 turns + 1 turn per caster level"
      target: "1 object or 1 point in space"
      effect: |
        Object or point sheds bright light in a 30 ft radius. Cast on
        a creature's eyes (save vs Spells), the target is blinded for
        the duration.
      reverse:
        name: Darkness
        effect: |
          Object or point becomes a 30 ft globe of magical darkness.
          Normal vision and mundane light fail within. Cast on eyes,
          target is blinded.
      narrator_hint: |
        Light cast on a sword turns the wielder into a target. Light
        cast on a goblin's spear gives the goblins away. Players
        invent uses; let them.

    - id: magic_missile
      name: Magic Missile
      range: "150 ft"
      duration: "instantaneous"
      target: "1 creature in line of sight"
      effect: |
        A glowing dart of force strikes unerringly for 1d6+1 damage.
        No attack roll; no saving throw. At higher caster levels, more
        missiles per casting (1 additional missile per 5 levels above
        1st), distributable across targets.
      narrator_hint: |
        The missile bends around partial cover; only total cover
        blocks it. Describe the dart's flight — a ribbon of force,
        not a fireball. The damage is visceral, not pyrotechnic.

    - id: protection_from_evil
      name: Protection from Evil
      range: "self"
      duration: "12 turns (2 hours)"
      target: "self"
      effect: |
        +1 to all saving throws against magical attacks from evil
        creatures or sources. Evil enchanted/summoned creatures
        cannot make melee attacks against the caster (but may attack
        at range). Enchanted/summoned creatures take −1 to attack
        rolls against the caster.
      narrator_hint: |
        "Evil" in B/X means alignment-evil — undead, demons, summoned
        fiends, evil-aligned NPCs. Bandits are not "evil" by default.
        Surface the effect when it triggers, not pre-emptively.

    - id: read_languages
      name: Read Languages
      range: "self"
      duration: "2 turns (20 minutes)"
      target: "self"
      effect: |
        Caster can read any non-magical written language for the
        duration — treasure maps, foreign letters, dwarven runes,
        coded merchant ledgers. Does not grant the ability to speak
        or write the language.
      narrator_hint: |
        The text doesn't translate visibly — the caster simply
        understands as they read. Dropping the parchment ends the
        reading; picking it back up does not resume it.

    - id: read_magic
      name: Read Magic
      range: "self"
      duration: "1 turn (10 minutes), per item read"
      target: "self"
      effect: |
        Caster can decipher magical writings — scrolls, spellbook
        pages, runes on cursed items, sigils on locked tomes.
        Reading a scroll with this spell does NOT consume the scroll;
        scribing a deciphered spell into the caster's own spellbook
        is a separate downtime activity.
      narrator_hint: |
        Almost every Magic-User memorizes this every day. It is the
        gate to all other magical knowledge.

    - id: shield
      name: Shield
      range: "self"
      duration: "2 turns (20 minutes)"
      target: "self"
      effect: |
        Caster's effective AC becomes AC 2 against missile attacks
        and AC 4 against melee attacks (B/X descending AC; lower is
        better). Sets a floor — if existing AC is already better,
        Shield does not improve it further.
      narrator_hint: |
        Visible as a faint plane of shimmer in front of the caster,
        only when struck. A volley of arrows reveals it; otherwise
        invisible.

    - id: sleep
      name: Sleep
      range: "240 ft"
      duration: "4d4 turns"
      target: "creatures within a 20 ft radius"
      effect: |
        Affects up to 2d8 hit dice of creatures, smallest HD first.
        Each affected creature falls into magical slumber. No save.
        Creatures with 4+1 HD or more are unaffected. Sleeping
        creatures can be slain trivially.
      narrator_hint: |
        The most powerful Magic-User L1 spell. Goblins, kobolds,
        bandits drop in seconds. The party will execute them or take
        prisoners — surface the moral weight either way. Cannot
        target undead, constructs, or anything sleep-immune.

    - id: ventriloquism
      name: Ventriloquism
      range: "60 ft"
      duration: "2 turns (20 minutes)"
      target: "1 point within range"
      effect: |
        Caster's voice appears to issue from a point of their
        choosing — behind a door, from a statue, inside an empty
        barrel. Listeners save vs Spells to disbelieve only if they
        have a specific reason to suspect a trick.
      narrator_hint: |
        Excellent for distraction, intimidation through fake choirs
        of voices, and "the chest just spoke to me" trickery. Words
        must be spoken aloud by the caster — silent ventriloquism is
        not the spell.

# === Cleric spell list ================================================
# Prayed for at dawn; consumed on cast; refresh on rest. Cleric
# spellcasting begins at L2 in B/X — at L1 the Cleric has 0 slots and
# relies on the Holy Symbol (turn undead), kit weapons, and faith.
# These L1 entries are listed for L2+ play and for scroll/potion
# parity, NOT for L1 chargen casting.

cleric:
  l1:
    - id: cure_light_wounds
      name: Cure Light Wounds
      range: "touch"
      duration: "instantaneous"
      target: "1 creature touched"
      effect: |
        Restores 1d6+1 hit points. Cannot raise a creature above its
        natural maximum. Does not cure disease, undo paralysis, or
        re-attach limbs.
      reverse:
        name: Cause Light Wounds
        effect: |
          Touched creature takes 1d6+1 damage. Touch attack roll
          required; armor protects normally.
      narrator_hint: |
        Healing in B/X is rare and slow. Surface the visceral relief
        — gashes knit, bruising fades, the gasping evens out. The
        scar remains. Do not heal by description without spending
        the slot.

    - id: detect_evil
      name: Detect Evil
      range: "120 ft"
      duration: "6 turns (1 hour)"
      target: "self"
      effect: |
        Caster perceives evil intent in creatures, items, and
        locations within range. Reveals alignment-evil sources in
        line of sight or behind thin barriers. Does not reveal
        motive or specific danger — only the moral weight.
      narrator_hint: |
        "Evil" is alignment, not character — a desperate thief is
        not evil; a cultist who killed for power is. The perception
        is a felt heaviness in a direction, not a glowing outline.

    - id: detect_magic
      name: Detect Magic
      range: "30 ft"
      duration: "2 turns (20 minutes)"
      target: "self"
      effect: |
        As Magic-User Detect Magic, but shorter range — the cleric's
        gift is for evil and the divine, not the catalog of
        enchantments.
      narrator_hint: |
        Cleric Detect Magic feels different from the Magic-User
        version — more like prayer-confirmation than perception:
        "The god names this object as touched."

    - id: light
      name: Light
      range: "120 ft"
      duration: "12 turns (2 hours)"
      target: "1 object or point"
      effect: |
        As Magic-User Light, but lasts twice as long. The Cleric's
        Light is steadier — does not flicker, even underwater.
      reverse:
        name: Darkness
        effect: |
          As Magic-User reverse — but the darkness is described as
          divine, not sorcerous. Only the faithless mistake one for
          the other.
      narrator_hint: |
        Cleric Light is favored as a hands-free alternative to
        torches in dungeons. Cast on a holy symbol, it doubles as
        proof of office.

    - id: protection_from_evil
      name: Protection from Evil
      range: "self"
      duration: "12 turns (2 hours)"
      target: "self"
      effect: |
        As Magic-User Protection from Evil. The Cleric's version is
        keyed to faith — a faithless Cleric (broken vow) cannot
        cast until reconciled.
      narrator_hint: |
        Surface the prayer — the Cleric speaks the god's name aloud,
        and listening NPCs hear which god. In Sünden, this is how
        rite-house allegiance is revealed in the wild.

    - id: purify_food_and_water
      name: Purify Food and Water
      range: "10 ft"
      duration: "instantaneous"
      target: "rations for 12 people, or one waterskin equivalent"
      effect: |
        Removes natural poison, contamination, and rot. Does not
        affect magical poison or alchemical poisons.
      narrator_hint: |
        The dungeon poisons your water as a matter of course. This
        spell is unglamorous; it keeps the party alive past day
        three. The Cleric is paid for this in coin and silence.

    - id: remove_fear
      name: Remove Fear
      range: "30 ft"
      duration: "instantaneous"
      target: "1 creature"
      effect: |
        Target gets +1 saving throw vs magical fear effects, plus
        an immediate save against any current fear effect. If
        already afflicted, target rolls a saving throw at +1 to
        break the fear immediately.
      reverse:
        name: Cause Fear
        effect: |
          Target saves vs Spells or flees in panic for 1d4 turns,
          dropping anything not strapped on.
      narrator_hint: |
        Used most often after a Sleep spell wears off and the party
        is wading through skeletons. Cast on the gone-pale Fighter,
        not on the bleeding-out Mage.

    - id: resist_cold
      name: Resist Cold
      range: "30 ft"
      duration: "6 turns (1 hour)"
      target: "1 creature"
      effect: |
        Target gains +2 to saving throws vs cold effects. Cold-based
        damage is reduced by 1 per die. Does not protect against
        natural environmental cold (wear a cloak).
      narrator_hint: |
        Useful against frost-themed monsters and certain cursed
        items. In Sünden, the Confessional has used it to keep
        penitents alive through midwinter Wall-vigils.
