# Caverns & Claudes — Visual Style
# Crosshatched ink illustration, Russ Nicholson meets Dyson Logos

positive_suffix: >-
  crosshatched ink illustration, dungeon torchlight, old school RPG art,
  Russ Nicholson style, heavy black linework, stippled shadows, graph
  paper texture, 1981 fantasy module illustration
negative_prompt: >-
  photorealistic, 3D render, anime, cartoon, smooth shading, digital
  painting, bright colors, cheerful, modern, clean lines
preferred_model: flux
base_seed: 42
visual_tag_overrides:
  dungeon: "crosshatched stone corridor, single torch on wall, deep shadows, graph paper grid"
  cavern: "natural cave, stalactites, underground river reflection, torch held high"
  chamber: "large underground room, pillars, carved stone, treasure glint in darkness"
  tomb: "sarcophagus, dust motes in torchlight, hieroglyphs on walls, cobwebs"
  trap: "pressure plate, suspicious floor tiles, dart holes in wall, skeleton of previous victim"
  camp: "bedrolls on stone floor, small fire, supplies stacked against wall, guard watching darkness"
  surface: "dungeon entrance, overgrown ruins, forest clearing, daylight harsh after underground"
  monster: "creature emerging from darkness, eyes catching torchlight, heavy crosshatched shadow"
  treasure: "open chest, coins spilling, gemstones, magical glow, dust and cobwebs"
  door: "heavy wooden door, iron bands, keyhole, torch bracket beside it, scratch marks"
