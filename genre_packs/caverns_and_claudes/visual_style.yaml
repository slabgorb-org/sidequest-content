# Caverns & Claudes — Visual Style
# Crosshatched ink illustration, Russ Nicholson meets Dyson Logos

flux_prompt_suffix: >-
  crosshatched ink illustration, dungeon torchlight, old school RPG art,
  Russ Nicholson style, heavy black linework, stippled shadows, graph
  paper texture, 1981 fantasy module illustration

flux_negative_prompt: >-
  photorealistic, 3D render, anime, cartoon, smooth shading, digital
  painting, bright colors, cheerful, modern, clean lines

portrait_style: >-
  Ink portrait, crosshatched shading, torchlit from below, heavy shadows,
  medieval woodcut influence, grim expression, parchment background

poi_style: >-
  Ink illustration of a dungeon room, crosshatched stone walls, deep
  shadows, single torch source, claustrophobic perspective, wide angle
  looking into the room, graph paper border

color_palette:
  - "#D4A843"   # torchlight amber
  - "#1A1610"   # deep shadow
  - "#C4B89A"   # parchment
  - "#8B2500"   # dried blood
  - "#4A3B2A"   # leather
  - "#2A2318"   # dark stone

lighting: "single torch source, harsh shadows, rim lighting on figures"
atmosphere: "claustrophobic, dusty, damp stone, visible breath in cold air"
