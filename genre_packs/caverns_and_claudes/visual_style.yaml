# Caverns & Claudes — Visual Style
# Black and white pen & ink, Erol Otus meets David Trampier
# 1979 Monster Manual interior plate energy

positive_suffix: >-
  black and white pen and ink illustration in the style of Erol Otus and
  David Trampier, 1979 Advanced Dungeons and Dragons Monster Manual interior
  plate, heavy crosshatching, stippled shadows, bold black outlines, rough
  paper texture, visible ink strokes, no color, monochrome, high contrast
  black ink on white paper, surreal unsettling proportions

negative_prompt: >-
  photorealistic, 3D render, anime, cartoon, color, painted, watercolor,
  digital painting, smooth shading, airbrushed, glossy, saturated,
  chromatic, modern, clean lines, cute, chibi, text, watermark,
  modern clothing, contemporary fashion, jeans, jacket, t-shirt,
  glasses, wristwatch, photograph, portrait photography, lighting setup

preferred_model: dev

base_seed: 42

# ── LoRA (story 35-15) ────────────────────────────────────────
# Genre-specific Flux LoRA for Erol Otus / Trampier black and
# white pen-and-ink. LoRA config removed (playtest-2026-04-12):
# the .safetensors file was never trained/delivered (Epic 32 scope),
# causing noisy lora_file_not_found warnings on every render.
# positive_suffix is used automatically and produces excellent results.
# Re-add lora/lora_trigger when Epic 32 delivers the weights.

visual_tag_overrides:
  dungeon: >-
    claustrophobic stone corridor, heavy crosshatching on rough-hewn walls,
    single torch casting long shadows, dripping moisture, carved glyphs,
    flagstone floor with cracks, cobwebs in corners, oppressive low ceiling
  tavern: >-
    cramped underground tavern, barrel tables, tallow candles, smoke-stained
    beams, rough stone walls, miners and delvers hunched over drinks,
    flickering hearth, ale-stained wood
  cavern: >-
    vast natural cavern with stalactites, underground river, bioluminescent
    fungus on walls, distant echoes suggested by ink wash, rope bridges,
    mineral deposits catching torchlight
  mouth: >-
    gaping cave entrance like a maw, broken teeth of stalactites and
    stalagmites, muddy descent path, mining equipment abandoned at
    threshold, wind-carved rock formations, ominous darkness beyond
  keeper: >-
    organic living dungeon architecture, walls that appear to breathe,
    ribbed stone like a throat, glistening moisture, fleshy growths,
    bioluminescent veins in the rock, oppressive sentient malevolence
  town: >-
    frontier mining town perched above a sinkhole, timber buildings,
    rope lifts, lantern-lit muddy streets, picks and shovels leaning
    on walls, exhausted miners, overcast sky
