# Caverns & Claudes — Visual Style
# Black and white pen & ink, Erol Otus meets David Trampier
# 1979 Monster Manual interior plate energy

flux_prompt_suffix: >-
  black and white pen and ink illustration in the style of Erol Otus and
  David Trampier, 1979 Advanced Dungeons and Dragons Monster Manual interior
  plate, heavy crosshatching, stippled shadows, bold black outlines, rough
  paper texture, visible ink strokes, no color, monochrome, high contrast
  black ink on white paper, surreal unsettling proportions

flux_clip_suffix: >-
  black and white pen and ink illustration, Erol Otus, David Trampier,
  1979 TSR Monster Manual, crosshatched, stippled, monochrome, high
  contrast, old school RPG interior art

flux_negative_prompt: >-
  photorealistic, 3D render, anime, cartoon, color, painted, watercolor,
  digital painting, smooth shading, airbrushed, glossy, saturated,
  chromatic, modern, clean lines, cute, chibi, text, watermark

portrait_style: >-
  black and white pen and ink portrait in the style of Erol Otus and
  David Trampier, heavy crosshatching, stippled shadows, bold outlines,
  torchlit from below, monochrome, high contrast, rough paper texture,
  grim expression, 1979 TSR interior art

creature_style: >-
  black and white pen and ink illustration in the style of Erol Otus and
  David Trampier, 1979 Advanced Dungeons and Dragons Monster Manual interior
  plate, heavy crosshatching, stippled shadows, bold black outlines, rough
  paper texture, visible ink strokes, no color, monochrome, high contrast
  black ink on white paper, surreal unsettling proportions, single torch
  source casting long shadows

poi_style: >-
  black and white pen and ink illustration of a dungeon chamber in the
  style of Erol Otus and David Trampier, heavy crosshatching, stippled
  shadows, bold outlines, monochrome, high contrast, claustrophobic
  perspective, single torch source, rough paper texture, 1979 TSR
  module interior art

color_palette:
  - "#000000"   # pure black ink
  - "#1A1A1A"   # near-black shadow
  - "#3D3D3D"   # deep crosshatch
  - "#B0B0B0"   # light stipple
  - "#E8E8E8"   # paper highlight
  - "#FFFFFF"   # pure white paper

lighting: "single torch source, harsh shadows, rim lighting on figures"
atmosphere: "claustrophobic, dusty, damp stone, visible breath in cold air"
