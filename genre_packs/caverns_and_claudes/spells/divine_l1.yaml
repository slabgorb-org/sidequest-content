# Caverns & Claudes — Divine L1 spell catalog (Cleric list)
# Moldvay/Cook B/X canon, eight spells, C&C voice.
# Schema: see docs/superpowers/specs/2026-05-06-magic-system-caverns-and-claudes-implementation-design.md §2
#
# Divine register in Sünden is lay-monastic, not chapel-glorious. The
# Confraternity keeps the Three Rites — Confessional, Workhouse,
# Masquerade — and the Cleric's working tools are salt, plain bread,
# lamp-oil, votive wicks, and a clean cloth. No pantheon is named at
# the table; what answers the prayer is the discipline of the Rite,
# not a god with a face. Brother Hesh of the Confessional is the
# model of competence. The reverses exist because the same hand that
# mends can withhold; that is doctrine, not heresy.

version: "0.1.0"
genre: caverns_and_claudes
tradition: divine
level: 1

spells:
  - id: cure_light_wounds
    name: "Cure Light Wounds"
    level: 1
    tradition: divine
    range: touch
    target: single
    duration: instant
    save: { stat: null, effect: none }
    effect_template: "Restore 1d6+1 momentum to touched ally"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      A hand on the wound. A breath drawn together. The bleeding does not
      stop because the blood was lost; it stops because the body has been
      reminded what it is for. Whatever the cleric carries, they leave a
      little of it in the patient.
    hard_limits_check: [no_resurrection]
    domain: physical
    otel_attrs: [cast_intent, momentum_restored]
    reverse:
      id: cause_light_wounds
      effect_template: "Touch deals 1d6+1 momentum damage; opposed_check WIS to resist"
      narrator_register: |
        The cleric's hand lays on, but what passes through is the absence,
        not the presence. The thing they serve takes its share.
      domain: necromantic

  - id: detect_evil
    name: "Detect Evil"
    level: 1
    tradition: divine
    range: near
    target: self
    duration: turns:6
    save:
      stat: null
      effect: none
    effect_template: "Cleric perceives presence of evil intent within near range; reads creatures and objects with malign purpose, not mere wrongdoing or worldly crime"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      Not sin. Sünden has Sünden for sin, and the Workhouse books for
      crime. This reads intent — the cocked trap, the cup with the wrong
      thing in it, the deacon at the next table whose smile is a piece
      of work. Bandits in the alley do not light up; they want money.
      The thing in the lower Confessional that wants the Cleric's
      throat lights up like a lamp on a still night. Hunger that means
      harm. The Cleric learns to trust this and then, later, to mistrust
      what does not light up.
    hard_limits_check: []
    domain: divinatory
    otel_attrs: [cast_intent, sources_detected]

  - id: detect_magic
    name: "Detect Magic"
    level: 1
    tradition: divine
    range: close
    target: self
    duration: turns:2
    save:
      stat: null
      effect: none
    effect_template: "Cleric perceives magical auras within close range; reveals presence and rough strength, not nature or function"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      The Mage's version reads the work; the Cleric's reads the workman.
      What's on the altar cloth in Lampwick is not a sigil — it is a
      signature, and the Cleric feels who signed. Three votives in a row
      and one of them has been touched; the touched one feels heavier in
      the prayer than the other two. What the magic does is the Mage's
      problem. Whether the working has a back to it that watches you —
      that is what the Cleric is asking. The spell answers in weight,
      not in words.
    hard_limits_check: []
    domain: divinatory
    otel_attrs: [cast_intent, auras_detected]

  - id: light
    name: "Light"
    level: 1
    tradition: divine
    range: near
    target: object
    duration: turns:6
    save:
      stat: DEX
      effect: partial:"if cast on a creature's eyes, save DEX or be blinded for the duration"
    effect_template: "One object or point sheds bright light in a 30 ft radius; if cast on eyes, save DEX or blinded"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      Lamp-oil light without the lamp, and without the oil. The Cleric
      lays the working on a sword-hilt, a votive wick, a pebble pressed
      into a doorframe. The light is steady the way a Confessional
      candle is steady — not cheerful, not warm, but it does not gutter
      and it does not lie about what it shows. Cast in the eyes of
      something that should not be in Sünden after dark, and the world
      goes white for it, and the Cleric has earned the next ten seconds.
    hard_limits_check: []
    domain: physical
    otel_attrs: [cast_intent, target_kind, save_made]
    reverse:
      id: darkness
      effect_template: "One object or point quenches all light in a 30 ft radius; if cast on eyes, save DEX or blinded by sudden dark for the duration"
      narrator_register: |
        The Cleric withholds the lamp. The torch in the bandit's hand is
        still burning — anyone can see the flame — but the flame is
        teaching nothing. The room goes to ink. Where the working sits,
        the dark sits with it, and even Sünden's lampwrights cannot
        argue with a wick that has been told no.
      domain: physical

  - id: protection_from_evil
    name: "Protection from Evil"
    level: 1
    tradition: divine
    range: touch
    target: single
    duration: turns:12
    save:
      stat: null
      effect: none
    effect_template: "Touched ally gains +1 edge against magical attacks from evil-aligned sources; enchanted/summoned evil creatures cannot make melee attacks against the warded and take −1 to ranged attacks against them"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      A line of salt drawn on the breastbone with the thumb. A whispered
      pass of the Confessional formula — not a prayer for help, a notice
      of refusal. The bandits in the alley are unaffected; bandits are
      not what this is for. The thing wearing a priest's collar in the
      lower Confessional feels the line at arm's length and chooses
      another target, because the Cleric has made the warded not worth
      the trouble. The Confraternity teaches this spell first. There
      are reasons the Confraternity teaches this spell first.
    hard_limits_check: []
    domain: psychic
    otel_attrs: [cast_intent, ward_triggered]

  - id: purify_food_and_water
    name: "Purify Food and Water"
    level: 1
    tradition: divine
    range: close
    target: object
    duration: instant
    save:
      stat: null
      effect: none
    effect_template: "Cleanses up to one ration's worth of food and one waterskin's worth of drink of poison, rot, taint, and parasitic infestation; transmutes spoilage but does not create new sustenance"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      The Cleric breaks a piece of plain bread over the dish, drops the
      crumb in, and the spoilage goes out the way breath leaves a body.
      The water in the skin clears in one slow turn; the meat in the
      pot stops smelling like it was lying. This will not feed a hungry
      camp — there is no more food at the end than at the start — but
      the food at the end will not kill anyone. A Workhouse trick from
      back when Sünden ate worse than it does now. Brother Hesh casts
      it before every shared meal; he says the habit is the spell.
    hard_limits_check: []
    domain: alchemical
    otel_attrs: [cast_intent, rations_purified]

  - id: remove_fear
    name: "Remove Fear"
    level: 1
    tradition: divine
    range: touch
    target: single
    duration: instant
    save:
      stat: null
      effect: none
    effect_template: "Touched ally is cleared of one magical fear effect outright, or gains a re-roll at +4 against an active mundane fear, panic, or morale check; instantaneous"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      The Cleric takes the ally's wrist — not the hand, the wrist — and
      counts the pulse down to something a person can stand on. The
      fear does not leave because it was wrong; the fear leaves because
      the body has been given something to do other than carry it. The
      hireling who was about to bolt is suddenly available again. The
      apprentice who was screaming stops screaming, and looks at the
      Cleric, and remembers their name. One pass, one beat, one breath.
      It does not make the room less dangerous. It makes one more pair
      of hands useful in it.
    hard_limits_check: []
    domain: psychic
    otel_attrs: [cast_intent, target_kind]
    reverse:
      id: cause_fear
      effect_template: "Touched target makes WIS save or flees from caster for 1d4 rounds; magical fear, ends if line of sight is broken for one full round"
      narrator_register: |
        The Cleric takes the wrist and counts the pulse up. Whatever
        small steady thing a person stands on — the Cleric removes it,
        in one pass, and the target finds the floor uneven. The bandit
        runs. The cultist runs. They do not know why they ran until
        later, when they will not admit it. The Confraternity does not
        forbid this working. The Confraternity asks the Cleric to
        remember casting it.
      domain: psychic

  - id: resist_cold
    name: "Resist Cold"
    level: 1
    tradition: divine
    range: touch
    target: single
    duration: turns:6
    save:
      stat: null
      effect: none
    effect_template: "Touched ally ignores damage from natural cold (winter exposure, ice water, snowfall) for the duration; +2 edge on saves against magical cold; cold-based momentum damage suffered while warded is reduced by 1 per die"
    components: { verbal: true, somatic: true, material: null }
    backlash: null
    narrator_register: |
      A pinch of lamp-oil on the back of the neck and a word the Cleric
      does not translate for the laity. The cold goes around the warded
      the way water goes around a stone. Fingers stay warm enough to
      hold a torch, knuckles stay warm enough to hold a hilt. Wade the
      icewater channel under the Three Towns and come up still able to
      work. It does not make the dungeon less cold. It makes one body
      in the dungeon temporarily disinterested in the cold's argument.
    hard_limits_check: []
    domain: physical
    otel_attrs: [cast_intent, cold_mitigated]
