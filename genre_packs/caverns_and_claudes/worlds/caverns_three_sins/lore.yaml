world_name: "Hamlet of Sünden"
history: >-
  Before any of the three woke, this was ridge country — pale limestone
  spurs, two narrow river valleys, and a low ring of moors knotted
  together by goat tracks and old salt roads. Three towns held the
  corners of it. Ashgate mined silver out of the north ridge. Copperbridge
  collected tolls at the place two trade roads crossed a stone bridge
  over a copper-stained creek. Gristwell, smallest of the three, sold
  bread and rope to anyone passing through to somewhere worth going. The
  region had a name once. The records that bore it have been buried,
  burned, or forgotten by the people whose grandparents wrote them.

  The three woke within a single human generation. Nobody alive saw all
  three open. The miners at Ashgate broke into the upper chambers of
  what would become Grimvault and walked back out diminished. A merchant
  caravan east of Copperbridge vanished into a cave that became Horden,
  and afterwards the Spillfield began to glitter at dawn. The hillside
  above Gristwell split open one spring morning and took the village of
  Edgeholm whole. The three towns were the closest holdings to each
  mouth, and so the three towns became the staging grounds. Within a
  decade they were husks of what they had been. Their best people were
  underground.

  Sünden was founded in the second decade after the wakings, at the only
  point on the map equally inconvenient to all three towns and equally
  close to all three mouths. It was meant to be a coroner's hamlet — a
  place to lay out the dead, write their names, and send word back to
  whichever town they had come from. The Wall came first; the houses
  came after. Now Sünden is the only point at the regional center where
  anyone still lives by choice. The three approach hamlets are
  half-empty, kept open for the road and the smithy and the people too
  old or too stubborn to move. The delvers stage out of Sünden. The
  dead come back to Sünden. The Wall remembers them.

geography: >-
  Sünden sits on a saddle of high ground at the meeting of the three
  valleys, the only point from which all three dungeon mouths can be
  seen on a clear day. From the upper terraces of the hamlet you look
  north along the bleached ridgeline to the rectangular doorway of
  Grimvault; east across the moors to the ragged tear of Horden's mouth
  in the copper-stained ridge; south down the slope to the sixty-foot
  gullet of Mawdeep, breathing on its diurnal cycle. Three roads run
  out of Sünden Square — the Ashgate road north, the Copperbridge road
  east, the Gristwell road south — each one passing through the now
  half-empty town that gave its name to the dungeon at the road's end.

  The land between Sünden and the three mouths is no longer entirely
  ordinary country. The northern road runs along stone that has gone
  pale where it should be grey. The eastern road has copper-green water
  in every ditch and culvert, even where there is no creek to feed
  them. The southern road descends through ground the locals do not
  trust — small sinkholes open in the meadows after warm nights, and
  cattle do not graze south of the third milestone. The salt roads that
  used to cross this country east-to-west have been quietly abandoned.
  Travelers go around now. Sünden is the destination, not the way
  through.

cosmology: >-
  The Seven sleep, or so the old preachers in Sünden's chapel will tell
  you when pressed, in the world's old places — buried under marsh,
  walled into mountainsides, drowned in cold seas, packed into salt
  domes deep underground. Most of them are still sleeping. Three of
  them are not. Three of them woke up here, in this country, within a
  human generation of one another, and the people who live above them
  do not have a settled theology for why.

  The Patient Butcher under the north ridge is Pride — the sin of the
  craftsman who believes the work justifies the cost. It separates and
  refines because the work is the point; the delvers are material, and
  pride does not flinch at material. The Hoarder under the east ridge
  is Greed — the merchant who counted himself into a cave and never
  came out. The Glutton Below the southern hill is Gluttony — the
  appetite that does not stop and does not distinguish. Three of the
  Seven. The match is too clean to be coincidence and too rough to be
  doctrine. Sünden's preacher will tell you the three are kin and then,
  if you push him, retract it.

  The other four are stories told elsewhere. Travelers from the salt
  coast claim Wrath sleeps somewhere east of the river, in a barrow
  that is supposed to bleed when storms come over the headland. The
  fen-people south of the marshes say Sloth's grave is under the green
  water there, and that anyone who wades in too long forgets why they
  came. Lust is a story Sünden's preacher will not speak above a
  whisper, and only after dark, and never twice in the same week. Envy
  is the most-told and the least-believed — every village west of here
  claims a haunted well or a cursed pond that they say is the eye of
  Envy looking up. None of these have been confirmed. None have been
  visited by anyone who came back. They are stories, kept at story
  distance, and the Wall in Sünden Square has four blank columns waiting
  for them in case the stories ever come true.

themes:
  - "Three of the Seven woke close in space and time — implied kinship, never canon"
  - "Sünden is a coroner's hamlet that grew into a delvers' town"
  - "The Wall in the Square is the regional memory — names of the dead and the returned"
  - "Stress is a delving injury — Pride, Greed, Gluttony each cut their own kind"
  - "The three approach hamlets are half-abandoned; the center is where life is"
  - "Loose kinship — the four absent sins are stories told elsewhere, never committed"
  - "Coming back changed is regional knowledge, not rumor"
  - "Treasure is the byproduct of three different appetites with three different signatures"

genre_conventions:
  - "Never declare why the three woke close — imply, gesture, leave the seam open"
  - "The Wall is the camera — campaign maturity reads off its carved columns"
  - "Each sin has its own grammar of horror; do not blur them into generic dread"
  - "Sünden's services oppose the sins they treat — Confessional vs Greed, Workhouse vs Gluttony, Masquerade vs Pride"
  - "The four absent sins are rumor only; if a player asks, the answer is a story someone heard"
  - "The approach hamlets are not dead — they are diminished, and they remember being more"
  - "Surface life is muted near each ridge in the way that ridge's sin mutes things"
