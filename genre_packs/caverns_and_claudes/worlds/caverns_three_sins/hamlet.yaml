# Sünden — the Hamlet at the center of three sins.
# This file describes the persistent town: POIs, named NPCs, the three
# stress-relief services, and the Wall (campaign memory monument).

name: "Sünden"
slug: sunden

description: >-
  Sünden is the only inhabited point at the regional center, a saddle-
  ground hamlet raised in the second decade after the wakings, when the
  three towns at the corners of this country agreed they could no longer
  share a problem and could not afford to keep solving it apart. A
  coroner from each — Ashgate, Copperbridge, Gristwell — met at the
  saddle in autumn, walked the ground, and chose it for being equally
  inconvenient to everyone. The Wall went up first. The houses came
  after, around it, facing it.

  The hamlet is late-medieval parish-scale, not castle-scale: a square,
  a chapel, a tavern, three service halls and the institutions that run
  them, a recruiter's post on the south side, a stoneyard behind the
  Wall, and houses two stories at the most. Limestone pulled from the
  north ridge weathers the buildings warm-grey in their courses and
  sooty-grey in their eaves, where the lamp-oil of three generations of
  delvers waiting for dawn has worked into the stone past the point of
  scrubbing. From the upper terraces, on a clear day, you can see all
  three dungeon mouths at once — the Three Sightlines are kept cleared
  for that reason, and the Wallwrights still walk them in spring.

  Sünden is sustained by the trade that the three sins have made of
  themselves. Hirelings stage out of the bunkhouse. Treasure passes
  through the recruiter's scales on its way to the assayers downroad.
  The Confraternity lifts what stress can be lifted; the Recovery Bench
  catches what cannot. The hamlet is functional, occupied, and slightly
  too quiet for its size. Children are born here. Old people stay. It is
  never quite at ease, and nobody in it expects it to be.

geography: >-
  The Square sits at the saddle's high point. Its pavement is laid in
  three radial wedges meeting at a central drainage — pale north-ridge
  limestone, copper-stained east-flagstone, dark southern hill-stone —
  so that whichever road you walked in on, you cross your own kind of
  ground to reach the Wall. The Wall stands along the northern face of
  the Square. The Confessional sits to its left on the north-west
  corner; the Workhouse runs the long east side; the Masquerade closes
  the south side opposite the Wall. The Recruiter's Post is a single-
  room timber building at the south-east corner, doors propped from
  dawn to lamp-out, with the bunkhouse and the Vetters' Office behind
  it. The chapel is small and west, the Old Coroner's House further
  west still. The Lampwick takes the south-west corner, hard against
  the Gristwell road. Three roads run out: Ashgate north, Copperbridge
  east, Gristwell south.

points_of_interest:
  - name: Sünden Square
    slug: sunden_square
    type: settlement
    description: >-
      The hamlet's heart. The flagged pavement reads the country in
      stone — pale limestone from the north ridge, copper-stained from
      the east, dark hill-stone from the south — set in three radial
      wedges around the central drainage. A low fountain runs at the
      drainage's lip, fed from a spring under the saddle that tastes
      of nothing in particular and never quite freezes. Newcomers
      arrive into the Square by the road their coach was hired for,
      and the first thing every newcomer does, without being told to,
      is read the Wall.

  - name: The Wall
    slug: the_wall
    type: monument
    description: >-
      A standing monument three courses high and twenty paces along
      the northern face of the Square, faced on its eastern side with
      smooth slate fitted into a backing of weathered limestone. The
      slate is divided into seven columns. Three are filling — Pride,
      Greed, Gluttony — each carving cut by chisel, never stamped,
      never sawn. The other four are kept blank by custom. The
      Wallwrights work the slate at dusk and never in rain. They
      verify before they cut. They cut once per soul. The morning
      light reads the eastern face sharpest at first hour, and the
      newcomer who has been here a day already knows where to stand.

  - name: The Recruiter's Post
    slug: recruiters_post
    type: service
    description: >-
      Single-room timber building on the south-east corner of the
      Square, doors propped open from dawn until the last hireling is
      cleared. The hireling board carries cards for the current
      roster: name, days available, declared sin-affinity, the vetter
      whose desk approved the card. Contract slates hang along the
      back wall, sorted by mouth. The bench under the slates is worn
      to a shallow curve where returning delvers sit waiting for
      vetting. The Vetters' Office is the back room, locked from
      inside; the bunkhouse is two stories behind. The smell is old
      sweat, lamp oil, and chalk.

  - name: The Confessional
    slug: the_confessional
    type: stress_service
    cures: greed_stress
    cost: scaled_currency
    description: >-
      A narrow stone chapel on the north-west corner of the Square, two
      rows of low benches and a single carved screen between penitent
      and keeper. The rite is Generosity. The penitent confesses what
      was taken and from where; the keeper accepts a portion of it for
      the poor box, and the count is broken — the sum surrendered is
      tithed against the wealth carried, so the more a delver brings
      out of Horden, the more the rite asks of them. The screen is not
      breached, the surrendered coin is not displayed, the count is
      not spoken aloud after it is broken. The Greed-stress lifts the
      way a held breath releases. Anselm Vail keeps the screen, the
      ledger of broken-count tallies, and the only key to the box.
      Best for stress accrued in Horden; tolerated for spillover from
      Mawdeep and Grimvault, but not preferred.

  - name: The Workhouse
    slug: the_workhouse
    type: stress_service
    cures: gluttony_stress
    cost: time
    description: >-
      A long timber hall along the east side of the Square, open at
      both ends, set with benches and looms and a cold hearth at the
      far end. The rite is Temperance. The penitent gives the rite
      time, not coin: two delve-ticks of plain labor — bread baked,
      stones split, fields turned, looms worked — plain food eaten at
      the long bench, plain plank bed at night. The cost cannot be
      bought down, hurried, or substituted. Brother Hesh runs the
      hall from the cold hearth, sleeves up, ladle in hand, and assigns
      the work himself; the rhythm of the labor is the rhythm of the
      stress draining. People who finish the rite walk lighter.
      Wren Peatford runs the Recovery Bench at the south door,
      separate from the rite proper, for those whose drift has gone
      past what the labor can lift. Best for Mawdeep stress.

  - name: The Masquerade
    slug: the_masquerade
    type: stress_service
    cures: pride_stress
    cost: identity_risk
    description: >-
      A vaulted single-room hall on the south side of the Square, walls
      hung with carved wooden masks of every face but the wearer's. The
      rite is Humility. The penitent is fitted with a mask at dusk,
      carries it through three public services across the festival
      week, and speaks the whole time as the masked face — not as
      themselves, not as their delver, not as anyone they have ever
      been. The Pride-stress dissolves under the weight of being
      somebody else for a while. The risk is small and named: a mask
      can stick. On rare nights the masked face overwrites a flavor
      trait of the delver permanently — a cadence of speech, a
      preference, a small habit — and the Wallwrights add nothing to
      the Wall, because the delver is not changed in any way the Wall
      records. Mistress Coro tells every penitent the risk before the
      first service. Best for Grimvault stress.

  - name: The Lampwick
    slug: the_lampwick
    type: tavern
    description: >-
      Sünden's tavern, hard against the Gristwell road on the south-west
      corner of the Square. A low-ceilinged taproom with a long oak
      bar, four trestle tables, and a back room kept private for the
      Wallwrights' quarterly suppers. The lamps are trimmed short and
      run cool — the building is named for the wick, not the flame —
      and the soot of three generations has darkened the rafters past
      the point of cleaning. The Lampwick is not the Spillway; the
      Spillway belongs to Ashgate, and the locals here will correct
      a stranger who confuses them. Helga Untersee pours, listens,
      and remembers. Most rumors that move between hirelings move
      across her bar.

recurring_npcs:

  - name: Sevra Tarn
    role: wall_keeper
    description: >-
      Elder Wallwright, head carver of the guild, sixty-three this
      autumn and descended in direct line from the original Ashgate
      coroner who chose the saddle ground. She conducts every
      verification interview herself — the conversation that decides
      whether a death is a death and a return is a return — and she
      has refused more carvings in the last decade than she has cut.
      Her hands are squared with stonedust worked permanently into
      the knuckle creases. She reads the Wall to visitors when asked,
      and she does not flatter. She will not be paid extra. She knows
      who Ima Tarn was, and she will say so once.

  - name: Mira Thorn
    role: recruiter
    description: >-
      Senior vetter at the kinder desk, fifty-one, heavy-set, came up
      through the Workhouse before the Confraternity sent her over to
      the Vetters' Office. She reads each hireling's papers carefully
      and signs fewer clearances than she refuses. Three of her
      brothers walked into Horden over the years and none walked out;
      her kindness is the kind that costs and is not naive. She still
      wears the Workhouse pin on her collar. She drinks her tea cold
      because she forgets it, not because she likes it that way.

  - name: Korven Daish
    role: vetter
    description: >-
      Senior vetter at the colder desk, forty-four, wiry, formerly a
      delver — two delves into Horden and three into Grimvault before
      the drift caught up with him and the Office cleared him off the
      contracts and onto the chairs. He runs the colder desk on the
      theory that a hireling who survives one more delve is a
      hireling who buys their own bread that month. He clears
      marginal cases Mira refuses. Most of his clearances come back
      upright. The party will hate him until the night they need him,
      and after that night they will still not like him.

  - name: Anselm Vail
    role: confessional_keeper
    description: >-
      Keeper of the Confessional, fifty-six, originally from
      Copperbridge, where he watched the Counters tally souls into
      cold accounts and decided he would spend his life opposing the
      doctrine. He runs the rite by the rule: the screen is not
      breached, the count is broken, the box is sealed at lamp-out.
      Bookish, spare-cheeked, doctrinally rigorous, he treats Greed
      as the most dangerous of the three sins because it endangers
      other people, not just its host. He will say so freely in
      private and never in joint session.

  - name: Brother Hesh
    role: workhouse_master
    description: >-
      Master of the Workhouse, forty-two, heavy-shouldered, a former
      Gristwell delver who walked north out of Mawdeep after his
      second descent and stayed. Lay-monastic now, but he treats
      prayer the way he treats labor — as a thing done with the
      hands, in rhythm, until the body knows. He speaks sparingly,
      and what he says he means. He does not sit at table with
      Korven Daish. He does not refuse to. The party will respect
      him before they like him, and most of them will never quite
      like him.

  - name: Mistress Coro
    role: masquerade_host
    description: >-
      Host of the Masquerade and the Confraternity's senior voice in
      the current phase, an age the masks make hard to call — older
      than Hesh, younger than Vail, somewhere between. She runs the
      rite as theatre crossed with confession, knows every face in
      Sünden, and remembers which festival mask each of them wore
      last. She did not campaign for the senior chair; the chair
      came to her in the season the Pride-rite outpaced the others,
      and she has kept it through politeness and competence. She
      keeps her own mask pushed up on the crown of her head when
      speaking plainly. The party will notice when she does not.

  - name: Wren Peatford
    role: recovery_bench
    description: >-
      Recovery Bench technician at the Workhouse south door,
      thirty-four, small, always cold and always layered against it.
      She tests returning delvers with a tuning fork, a fan of
      colored cards, and a pouch of strong-flavored herbs — a small
      kit for sense-loss, the gentlest work in the hamlet. She came
      over from Ashgate two seasons ago and has not been back. She
      does not enter any of the three mouths. The hirelings trust
      her quietly, the way you trust someone who does not promise to
      undo a change but will teach you how to live inside it.

  - name: Helga Untersee
    role: innkeeper
    description: >-
      Keeper of the Lampwick, forty-eight, broad-handed and quiet-
      voiced, second-generation tavernkeeper — her father was a
      Copperbridge cooper who married up the road and never went
      back. She pours, listens, and remembers, and she will let a
      grudge go nowhere it does not need to. The Lampwick's back
      room is hers to lend, and she lends it to the Wallwrights for
      their quarterly suppers, to Mistress Coro for the festival
      week's quiet table, and to nobody else. She does not gossip.
      She forgets nothing. She has not been into any mouth, and
      she will not be drawn on whether she would.

  - name: Joost Marlebrand
    role: itinerant_preacher
    description: >-
      A wandering preacher, late forties, lean from the road, who
      came up out of the salt-coast valleys two summers ago and has
      not yet moved on. He stands at the east edge of the Square on
      market mornings and warns of the four absent sins — Wrath in
      a barrow east, Sloth under the southern fen, Lust whispered
      after dark, Envy in every haunted well west of here. He treats
      the dormancy of the four as a temporary state, a holding of
      breath. The Confraternity dislikes him as a doctrinal rival;
      the Vetters' Office tolerates him as a known quantity; the
      Wallwrights will not speak to him and will not listen when he
      speaks of the columns. He sleeps in the bunkhouse loft, when
      the Recruiter allows it, and on the chapel step when the
      Recruiter does not.

# ─── The Wall ───
wall:
  description: >-
    The Wall stands along the northern face of Sünden Square — not a
    separate building, not a chapel addition, but a freestanding monument
    three courses high and twenty paces along, faced on its eastern side
    with smooth slate fitted into weathered limestone backing. The slate
    is divided by carved verticals into seven columns: three filling,
    four kept blank. Names are cut by chisel, never stamped and never
    sawn. The form owes something to the death-rolls of the parish
    chapels of an older century and something to monuments raised in
    countries that lost a generation in a single war — a wall of names
    a person reads with their hand as well as their eyes. The first
    name carved into it was Ima Tarn, on a still autumn morning in the
    second decade after the wakings, and the rule of the Wall has been
    her line ever since. The Wallwrights maintain it, work it at dusk,
    do not work it in rain, and consider it the regional memory of what
    the three sins have actually cost.

  carving_style: >-
    Death-cuts go deep. Return-cuts go shallow. A delver who came back
    after the carving was already cut takes a single horizontal line
    beneath the name — Ima Tarn's line, the original. The Wallwrights
    cut one carving per soul, no exceptions for kinship or coin, and
    the underline is the only correction the slate accepts. Apprentices
    are trained on practice slates in the yard. Sevra cuts the death-
    cuts; Cael cuts most of the underlines. The chisels do not ring
    during the day.

  empty_columns: >-
    Four columns on the eastern half of the Wall are kept blank by
    standing custom — the Wallwrights polish the slate clean of any
    pilgrim's mark by morning. They are reserved for Wrath, Sloth, Lust,
    and Envy, in case the stories ever come true. Older Wallwrights
    insist the columns will stay blank. Mistress Coro has been heard,
    quietly, reading them as an open invitation — a place set at the
    table for guests who may or may not arrive. The Wallwrights have
    not corrected her in public. They have not agreed with her either.
