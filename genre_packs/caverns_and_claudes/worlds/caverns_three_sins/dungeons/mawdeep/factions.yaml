# Mawdeep — Factions
# Three forces shape Gristwell and the dungeon beneath it.
# Unlike traditional faction systems, Mawdeep's factions are asymmetric:
# two human organizations clinging to the surface, and one geological
# horror that does not negotiate.

factions:

  - name: The Delvers Guild
    description: >-
      The loose fraternity of treasure-seekers who descend into Mawdeep
      and — sometimes — return. Not a guild in any formal sense: no
      charter, no dues, no hierarchy. What they share is knowledge.
      Which rooms are trapped. Where the amber resin is thickest. How
      long a torch lasts on Level 2. This knowledge is currency.
      Experienced delvers sell maps, hire out as guides, and hoard
      intelligence about the deeper rooms. Fresh delvers buy rounds
      at The Sinkhole tavern and hope someone talks.
    goal: >-
      Extract maximum treasure from Mawdeep with minimum casualties.
      The Guild exists because the dungeon is profitable — barely,
      on average, but spectacularly for the lucky few. The dream of
      the Full Belly's hoard keeps them coming back.
    urgency: pressing
    scene_event: >-
      A delving party staggers out of the Mouth at dawn, one member
      short, packs heavy with gold. By noon the tavern is buzzing
      with rumors of what they found. By evening, three new parties
      are forming.
    disposition_to_players: friendly
    resources:
      - Maps of Level 1 (accurate, expensive)
      - Maps of Level 2 (incomplete, unreliable, very expensive)
      - Experienced hirelings (torchbearers, porters, sellswords)
      - Rumor network (which rooms have been cleared recently, Maw status)
    key_npcs:
      - name: Brecca Half-Hand
        role: Guild elder, seven-delve veteran
        description: >-
          Lost three fingers to a gullet polyp on her fourth delve.
          Kept going. Now she runs the hiring board at The Sinkhole
          and takes a cut of every contract. She has been deeper than
          anyone alive and will not talk about what she saw in the
          Stomach. She will sell you a map. She will not sell you hope.
      - name: Torchboy Fen
        role: Hireling broker, torchbearer trainer
        description: >-
          Nineteen years old, already on his eleventh delve as a
          torchbearer. He trains new torchbearers and takes a fee
          from both sides. He is very good at staying alive and
          very bad at keeping his employers alive. He does not
          seem troubled by this.
    relationships:
      Gristwell Merchants: symbiotic — the Guild sells what it extracts, the Merchants supply what delvers need
      The Dungeon Itself: adversarial — the Glutton eats delvers, delvers rob the Glutton

  - name: Gristwell Merchants
    description: >-
      The shopkeepers, innkeepers, provisioners, and moneylenders of
      Gristwell — the town that exists because the dungeon exists.
      Every business in Gristwell services the delving trade. The
      Provisioner sells torches and rations at markup. The Sinkhole
      tavern sells ale and rumors. The moneylender advances gold
      against future hauls at ruinous interest. The blacksmith repairs
      weapons that come back notched and acid-scarred. Gristwell is a
      parasite on a parasite — it feeds off the delvers who feed off
      the dungeon.
    goal: >-
      Keep the delving economy flowing. A dead delver is bad for business,
      but a successful one who retires is worse. The ideal customer
      returns with just enough gold to resupply and goes back in
      tomorrow. Gristwell's merchants are not evil — they are simply
      the economic inevitability of a town built on the lip of a
      living dungeon.
    urgency: simmering
    scene_event: >-
      The Provisioner has raised torch prices again — the last shipment
      of pitch was delayed by a sinkhole on the trade road. The
      moneylender is offering advances at only forty percent interest.
      Generous, for him.
    disposition_to_players: neutral
    resources:
      - Equipment and provisions (at Gristwell markup)
      - Moneylending (high interest, collateral = future haul)
      - Lodging and meals at The Sinkhole tavern
      - Weapon and armor repair (quality varies)
      - Fencing services for unusual loot (gems, artifacts, the Maw's components)
    key_npcs:
      - name: Marga Provisioner
        role: Supplies dealer, price gouger
        description: >-
          She sells torches, rope, rations, chalk, iron spikes, and
          everything else a delver needs at exactly the price the
          market will bear — which is steep, because the alternative
          is going into the dark without them. She is not unkind. She
          is not kind. She is accurate.
      - name: Rendel the Lender
        role: Moneylender, debt collector
        description: >-
          Advances gold against a percentage of the next haul. His
          contracts are ironclad and his collection methods are
          creative. He has never entered the dungeon. He does not
          need to. The dungeon comes to him, one debtor at a time.
      - name: Old Kettle
        role: Innkeeper, The Sinkhole tavern
        description: >-
          Runs the only tavern in Gristwell. The ale is weak, the
          stew is mysterious, and the rumors are the real product.
          Old Kettle has heard every delver's story for thirty years.
          He remembers which ones came back. He does not share his
          count unless you buy a third round.
    relationships:
      The Delvers Guild: symbiotic — merchants need delvers to buy supplies, delvers need merchants to sell treasure
      The Dungeon Itself: parasitic — Gristwell exists because the dungeon exists, and will die when it doesn't

  - name: The Dungeon Itself
    description: >-
      The Glutton Below is not a faction in any human sense. It does
      not negotiate, ally, trade, or communicate in language — though
      it speaks, after a fashion, in the grinding of stone and the
      wet sounds of digestion. It is a geological intelligence: vast,
      slow, and hungry. It has been swallowing the countryside for
      generations. Caravans, farmsteads, villages — Edgeholm went
      down whole. The dungeon grows wider every spring. The Maw is
      its guardian. The amber resin is its blood. The rooms are its
      organs. It is not malicious. It is hungry. There is no
      reasoning with hunger.
    goal: >-
      Consume. The Glutton does not plan or strategize. It responds
      to intrusion the way a stomach responds to food — with acid,
      with contraction, with digestion. Its "tactics" are autonomic:
      corridors narrow, traps reset, the Maw guards the deepest
      treasure because the deepest treasure is the most nutritious
      part of the meal. The delvers are not enemies. They are food
      that fights back.
    urgency: pressing
    scene_event: >-
      The Mouth breathed this morning — a long, slow exhalation of
      warm air that carried the smell of copper and old stone. The
      trade road cracked overnight, two hundred yards closer to
      Gristwell than the last crack. The dungeon is still growing.
    disposition_to_players: hostile
    resources:
      - Infinite regeneration (the dungeon rebuilds itself between delves)
      - The Maw (respawning boss guardian)
      - Amber hulks (constructed from digested remains)
      - Environmental control (constricting corridors, acid pools, bioluminescence)
      - Keeper awareness system (escalating hostility)
    key_npcs: []
    relationships:
      The Delvers Guild: predatory — delvers are food that carries treasure into the dungeon
      Gristwell Merchants: indifferent — the town is too far from the Mouth to eat. For now.
    notes: >-
      The Glutton is not a traditional faction. It cannot be negotiated
      with, allied to, or reasoned with. It is included as a faction
      because it is a force with goals, resources, and responses to
      player actions — the Keeper awareness system makes it a reactive
      antagonist. The "diplomacy" with the Glutton is the Offering
      trope — dropping treasure to reduce awareness. You cannot make
      peace with it. You can only feed it enough to buy time.
