# Mawdeep — Room Graph
# 19 rooms across 2 levels. Jaquayed layout with loops and one-way drops.
# The Glutton Below shapes every room — organic textures, warmth, constriction.
# tactical_scale: 4 for all rooms (grid = size * 4 cells)

# === LEVEL 1: THE GULLET ===

- id: mouth
  name: "The Mouth"
  room_type: entrance
  size: [3, 3]
  keeper_awareness_modifier: 0.8
  description: >-
    Sixty feet across. Stone lips worn smooth. Cold air breathes outward
    in a slow, rhythmic pulse. The floor slopes gently downward. Chalk
    marks from previous parties cover the walls near the entrance.
    Daylight reaches about thirty feet in before the dark swallows it.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..........#
    #..........#
    #..........#
    #...........
    #...........
    #..........#
    #..........#
    #..........#
    #..........#
    #####..#####

- id: throat
  name: "The Throat"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A descending passage wide enough for three abreast. The walls have
    a ribbed texture — horizontal ridges of stone that look disturbingly
    like cartilage. The air is warmer here. Your torchlight catches
    moisture on the ceiling.
  exits:
    - type: corridor
      target: mouth
    - type: door
      target: cistern
      is_locked: false
    - type: corridor
      target: junction
  tactical_scale: 4
  grid: |
    ###..###
    #.......
    #.......
    ###..###

- id: antechamber
  name: "The Antechamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A roughly circular room. The floor is covered in a fine grit that
    crunches underfoot — ground bone mixed with stone dust. Three archways
    lead deeper. A pile of abandoned equipment sits against the far wall.
  exits:
    - type: corridor
      target: mouth
    - type: corridor
      target: junction
    - type: corridor
      target: gallery
  tactical_scale: 4
  grid: |
    _##..##_
    #......#
    #......#
    #.......
    #.......
    #......#
    #......#
    _##..##_

- id: cistern
  name: "The Cistern"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A domed room with a sunken pool in the center. The water is black,
    still, and warm to the touch. It smells faintly sweet — not pleasant
    sweet, but the sweetness of something decomposing. Your reflection
    does not look quite right.
  exits:
    - type: door
      target: throat
      is_locked: false
    - type: corridor
      target: pantry
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #..~~..#
    #..~~..#
    #..~~..#
    #......#
    #......#
    ###..###

- id: junction
  name: "The Junction"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A crossroads where three passages meet under a high vaulted ceiling.
    The stone here is cracked and the cracks are filled with something
    amber and translucent, like hardened sap. The air is noticeably
    warmer. A faint vibration comes through the floor.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber
    - type: corridor
      target: hall
    - type: corridor
      target: chute
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..V....V..#
    #..........#
    #..........#
    ............
    ............
    #..........#
    #..........#
    #..V....V..#
    #..........#
    #####..#####
  legend:
    V: { type: atmosphere, label: "Amber-filled crack in the stone" }

- id: gallery
  name: "The Gallery of the Eaten"
  room_type: treasure
  size: [3, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    A long rectangular room. The walls are lined with alcoves, each
    containing objects — a rusted sword, a child's doll, a merchant's
    scale, a holy symbol. Personal effects of the swallowed. Hundreds
    of them, arranged with a care that suggests curation.
  exits:
    - type: corridor
      target: antechamber
    - type: door
      target: hall
      is_locked: false
  tactical_scale: 4
  grid: |
    #####..#####
    #A........A#
    #..........#
    #A..........
    #...........
    #A........A#
    #..........#
    ############
  legend:
    A: { type: atmosphere, label: "Alcove with relics of the eaten" }

- id: pantry
  name: "The Pantry"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 1.0
  description: >-
    A low-ceilinged room that smells of rot and vinegar. Wooden shelves
    line the walls, stocked with supplies that should not exist this
    deep — rations, waterskins, torches. All are spoiled.
  exits:
    - type: corridor
      target: cistern
    - type: door
      target: stairs_down
      is_locked: false
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    ###..###

- id: hall
  name: "The Swallowing Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A vast hall with a domed ceiling lost in shadow above the torchlight.
    The floor is a mosaic of different stones — fragments of buildings,
    roads, foundations. This is where Edgeholm went. A stone well in
    the center descends into darkness.
  exits:
    - type: corridor
      target: junction
    - type: door
      target: gallery
      is_locked: false
    - type: corridor
      target: stairs_down
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..........#
    #..........#
    #....WW....#
    #....WW.....
    #...........
    #..........#
    #..........#
    #..........#
    #..........#
    #####..#####
  legend:
    W: { type: interactable, label: "Stone well descending into darkness" }

- id: chute
  name: "The Chute"
  room_type: normal
  size: [1, 1]
  keeper_awareness_modifier: 1.1
  description: >-
    A steep, smooth-walled passage angled at forty-five degrees. The
    stone is slick with moisture. Once you start sliding, you cannot
    stop. This is a one-way passage to Level 2.
  exits:
    - type: corridor
      target: junction
    - type: chute_down
      target: warren
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #..#
    #..#

- id: stairs_down
  name: "The Stairs"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A carved staircase descending into warmth. The steps are uneven —
    some are six inches, some are eighteen, as though the stone is
    shifting over time. The walls are damp.
  exits:
    - type: door
      target: pantry
      is_locked: false
    - type: corridor
      target: hall
    - type: corridor
      target: landing
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #..#
    #...
    #...
    #..#
    #..#
    #..#

# === LEVEL 2: THE BELLY ===

- id: landing
  name: "The Landing"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    The foot of the stairs opens into a room where the stone changes.
    The walls are smooth, curved, and faintly warm. An orange
    bioluminescence pulses in the veins of the stone, providing just
    enough light to see shapes but not details.
  exits:
    - type: corridor
      target: stairs_down
    - type: corridor
      target: gullet_passage
    - type: corridor
      target: acid_pool
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #......#
    #.......
    #.......
    #......#
    #......#
    ###..###

- id: gullet_passage
  name: "The Gullet"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.3
  description: >-
    A corridor that narrows as you proceed. The walls are warm and
    slick. The ribbed texture from the Throat is more pronounced here.
    The ceiling drops until you are crouching. Something ahead reflects
    your torchlight with a golden glint.
  exits:
    - type: corridor
      target: landing
    - type: door
      target: vault
      is_locked: false
  tactical_scale: 4
  grid: |
    #..#
    #..#
    #,,#
    #,,#
    #,,#
    #,,#
    #..#
    #..#

- id: acid_pool
  name: "The Acid Pool"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    A room dominated by a shallow pool of clear liquid that steams
    gently. The liquid is warm and smells of bile. The far wall has
    a shaft going straight up — this is where the well from the
    Swallowing Hall terminates.
  exits:
    - type: corridor
      target: landing
    - type: corridor
      target: warren
  tactical_scale: 4
  grid: |
    _##..##_
    #......#
    #..~~..#
    #.~~~~.#
    #.~~~~.#
    #..~~..#
    #......#
    _##..##_

- id: warren
  name: "The Warren"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    A tangle of narrow passages connecting small, round chambers —
    each barely large enough for two people. The walls pulse with
    orange light. Navigation is disorienting — the passages curve
    and branch unpredictably.
  exits:
    - type: corridor
      target: acid_pool
    - type: corridor
      target: stomach
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..#....#..#
    #..#....#..#
    #..........#
    #....##....#
    #....##....#
    #..........#
    #..#....#..#
    #..#....#..#
    #..........#
    _####..####_

- id: vault
  name: "The Vault of Teeth"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A domed room. The walls are studded with stone teeth — not
    decorative, but the real teeth of the dungeon, grown from the
    rock like stalactites. Among the teeth: treasure. Coins, gems,
    and jewelry are embedded in the stone.
  exits:
    - type: door
      target: gullet_passage
      is_locked: false
    - type: corridor
      target: stomach
  tactical_scale: 4
  grid: |
    ###..###
    #......#
    #.T..T.#
    #......#
    #......#
    #.T..T.#
    #......#
    ###..###
  legend:
    T: { type: atmosphere, label: "Stone tooth studded with gems" }

- id: stomach
  name: "The Stomach"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.3
  description: >-
    The largest room on Level 2. The floor is soft — not mud, not
    flesh, but something between. Your boots sink half an inch with
    every step. The walls undulate slowly, almost imperceptibly. The
    orange bioluminescence is brightest here. This is where the
    Glutton digests.
  exits:
    - type: corridor
      target: warren
    - type: corridor
      target: vault
    - type: door
      target: marrow_hall
      is_locked: false
  tactical_scale: 4
  grid: |
    #####..#####
    #..........#
    #..,,,,,,..#
    #.,,,,,,,,.#
    #.,,,,,,,,.#
    #.,,,,,,,,,.
    #.,,,,,,,,,.
    #.,,,,,,,,.#
    #.,,,,,,,,.#
    #..,,,,,,..#
    #..........#
    #####..#####

- id: marrow_hall
  name: "Marrow Hall"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A short passage lined with exposed bone — not stone carved to
    look like bone, but actual bone grown into the walls. Femurs,
    ribs, skulls. The heat radiates from the bone itself.
  exits:
    - type: door
      target: stomach
      is_locked: false
    - type: door
      target: maw_chamber
      is_locked: false
  tactical_scale: 4
  grid: |
    #..#
    #B.#
    #.B#
    #B.#
    #.B#
    #B.#
    #.B#
    #..#
  legend:
    B: { type: atmosphere, label: "Exposed bone grown into the wall" }

- id: maw_chamber
  name: "The Maw"
  room_type: boss
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    A domed chamber where the ceiling is lost in shadow and the floor
    is a bowl of fused bone and stone. The bioluminescence pulses fast
    here — a heartbeat. In the center, something massive crouches. It
    is made of everything the Glutton has eaten and failed to digest.
    The Glutton's lieutenant. Its favorite thing.
  exits:
    - type: door
      target: marrow_hall
      is_locked: false
    - type: door
      target: full_belly
      is_locked: true
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..........#
    #..........#
    #....MM....#
    #....MM....#
    #..........#
    #..........#
    #..........#
    #..........#
    #..........#
    _####..####_
  legend:
    M: { type: hazard, label: "The Glutton's lieutenant crouches here" }

- id: full_belly
  name: "The Full Belly"
  room_type: treasure
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    The deepest room. Vast and warm and golden. The bioluminescence
    here is so bright you could read by it. The floor is a carpet
    of treasure — coins, gems, jewelry, weapons, armor, the accumulated
    wealth of generations of swallowed caravans, villages, and delvers.
    The walls breathe. You are standing inside the Glutton.
  exits:
    - type: door
      target: maw_chamber
      is_locked: false
  tactical_scale: 4
  grid: |
    _####..####_
    #..........#
    #..........#
    #.T......T.#
    #..........#
    #..........#
    #....TT....#
    #..........#
    #..........#
    #.T......T.#
    #..........#
    _##########_
  legend:
    T: { type: atmosphere, label: "Mound of treasure embedded in living stone" }
