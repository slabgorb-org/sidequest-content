# Approach: a half-abandoned hamlet at this dungeon's mouth. The party walks
# through here on the way down and on the way back. NOT a hub town — Sünden
# is the hub. Approaches are sin-touched, hollow, mostly silent.

dungeon: mawdeep
name: Gristwell
slug: gristwell

description: >-
  Gristwell clings to the lip of Mawdeep the way a barnacle clings to a
  whale — fastened to a thing that is alive, growing, and indifferent
  to whatever rides on its hide. The town was a hardscrabble crossroads
  once, propped together from timber salvaged out of older houses that
  had already fallen into the earth. Now the houses lean further. The
  ground at the eastern edge has dropped ten feet since last spring,
  and the Mouth has crept closer with it. Most people went up the road
  to Sünden once they understood the dungeon was not done eating. The
  remainder are those who profit from the dying — Bonecounters who weigh
  and price what comes out of delvers' packs, renderers who boil down
  what comes out of delvers — or those who have nowhere else, no kin
  to take them in, no road they have any business on. The wells taste
  of bile most days. Smoke from below drifts up through cracks in the
  flagstones and smells like a kitchen at dawn.

state: hollowed
population_remaining: 8

what_remains:
  - The single well in the centre of the square still draws water; nobody drinks it without straining it through cloth and salt, and on bad mornings even that does not help.
  - A rendering man named Tobel keeps a fire behind the second row of houses where he boils down what the delvers can no longer use, sells the fat and the bone-meal to the Bonecounters, and sleeps under the awning when the smoke gets bad.
  - Townsfolk still avoid stepping on the stones at the eastern edge of the square — an older custom from when the sinkhole was fresh — though the edge has moved twice since then and nobody has redrawn the line.

scene_hooks:
  - id: arrival
    when: party_first_enters
    description: >-
      The road into Gristwell tilts before the buildings do, the
      flagstones canted toward the Mouth. The smell hits before the
      first house — warm, sweet, wrong, like meat in a copper pan
      somewhere underground. Tobel's smoke threads up between the
      roofs. Nobody comes out to look at the party. The well in the
      square is uncapped and the bucket is missing.

  - id: return
    when: party_returns_from_delve
    description: >-
      The square is closer to the Mouth than it was when the party
      went down. Not by much — by a stride, perhaps — but the
      stride is real, and the line of stones the townsfolk avoid is
      now under the corner of the inn. Tobel is at his fire, looking
      up. He counts the party as they come out of the throat. Then
      he counts them again. The number is the same. He nods, once,
      and goes back to his pot.

# These were full POIs in the old world.yaml — preserve the most evocative
# 1-3 as named locations in the approach. Drop the rest.
points_of_interest:
  - name: Gristwell Square
    slug: gristwell_square
    description: >-
      A canted crossroads of timber houses leaning against each other,
      their cellars long since fallen into the earth and patched with
      whatever wood was nearest. A single well stands at the centre,
      its stone rim worn shiny by hands that do not pull on the rope
      gently. The water smells faintly of bile every dawn and worse by
      noon. The eastern quarter of the square is where the sinkhole is
      moving, and the ground there gives a little under the boot.

  - name: Bonecounter Alley
    slug: bonecounter_alley
    description: >-
      The narrow lane behind the square where the Bonecounters still
      keep two tables open — one for worked silver, one for everything
      else. They weigh what the party drags out of Mawdeep, name a
      price, and pay in coin that Sünden will accept. They do not ask
      where any of it came from. They do not answer if asked. Most of
      the alley is shuttered now. Two tables is enough for the trade
      that is left.

  - name: The Gristwell Sinkhole
    slug: the_gristwell_sinkhole
    description: >-
      The collapse at the eastern edge of the square where last
      spring's farmstead used to be. The stone at its lip is still
      warm to the hand. Mawdeep's digestion made the hole, and the
      Mouth has crept ten feet nearer the town since. Nothing has
      been rebuilt across it. Nothing will be. Children — the few
      left — throw small stones into it and listen for a sound that
      never comes back.
