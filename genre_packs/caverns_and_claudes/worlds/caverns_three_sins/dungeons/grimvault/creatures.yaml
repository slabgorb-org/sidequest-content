# Grimvault — Creature Bestiary
# The Patient Butcher's fauna: things that survived partial separation.
# Nothing here is natural. Everything has had something taken from it.
# The creatures are not hostile by instinct — they are incomplete.

creatures:

  # === TIER 1: NUISANCE ===

  - id: chalk_moth
    name: Chalk Moth
    description: >-
      Finger-length moths with wings that leave no color behind
      them — wherever they land, pigment is drained. Cloth fades.
      Skin pales. They feed on color the way normal moths feed on
      wool. Individually harmless. In clouds, they can bleach a
      torchbearer's cloak white in minutes. The moths themselves
      are pure white, but their bellies shimmer with stolen hues
      that shift as they fly.
    threat_level: 1
    morale: cowardly
    hp: 1
    max_hp: 1
    ac: 10
    damage: "0 (color drain, gear degradation)"
    abilities:
      - name: Color Feed
        description: >-
          Lands on organic material and drains pigment. No physical
          damage, but prolonged exposure makes equipment harder to
          distinguish in dim light — all gear looks the same shade
          of grey. Torchlight scatters them for two rounds.
      - name: Shimmer Cloud
        description: >-
          In groups of twenty or more, the stolen colors on their
          bellies create a disorienting shimmer. Anyone moving
          through the cloud must pause or risk walking into walls —
          depth perception fails when every surface is the same hue.
    loot:
      - description: "Chalk moth wings — worthless, crumble to white powder."
    tags: [level_1, swarm, vermin, butcher_fauna]
    rooms: [receiving, sorting_floor]
    notes: >-
      Nuisance encounter. Not dangerous but they degrade gear
      visibility and signal that the vault is paying attention.
      Treat like pale rats — resource tax, not combat threat.

  - id: seam_cricket
    name: Seam Cricket
    description: >-
      Glossy black insects the size of a thumb. They eat the
      joins between things — mortar between stones, stitching
      in leather, the binding of a book. They do not eat the
      materials themselves, only the connection. A pack left
      unguarded near seam crickets will come apart at every
      seam. The crickets make a sound like a fingernail on
      slate — a thin, continuous scraping that is worse than
      silence.
    threat_level: 1
    morale: cowardly
    hp: 1
    max_hp: 1
    ac: 11
    damage: "0 (gear destruction)"
    abilities:
      - name: Seam Eating
        description: >-
          Targets connections: stitching, knots, lashings, mortar.
          A swarm can disassemble a rope coil in one turn or
          loosen armor straps in two. Does not trigger in combat —
          only when equipment is set down unattended.
      - name: Joint Sense
        description: >-
          Drawn to joins and connections. Will ignore solid objects
          entirely. A seamless metal flask is invisible to them.
          A stitched leather pack is a feast.
    loot:
      - description: "Nothing. The crickets leave no residue."
    tags: [level_1, swarm, vermin, butcher_fauna]
    rooms: [cold_store, waste_chute]
    notes: >-
      Gear attrition encounter. Check for unattended packs and
      equipment. Hirelings who set down their loads are vulnerable.

  # === TIER 2: HAZARD ===

  - id: husk_walker
    name: Husk Walker
    description: >-
      A person-shaped thing that has had its weight separated.
      It moves like a human but weighs nothing — the wind from
      a closing door pushes it sideways. It was something else
      before the Butcher processed it. Now it is an outline
      filled with habit. It walks patrol routes through the
      workshop rooms, turning where it always turned, stopping
      where it always stopped. It does not notice intruders
      unless touched. Then it remembers it has hands.
    threat_level: 2
    morale: fearless
    hp: 6
    max_hp: 6
    ac: 10
    damage: "1d4 (grip — separates warmth from flesh on contact)"
    abilities:
      - name: Weightless
        description: >-
          Cannot be knocked prone or pushed by physical force.
          Also cannot push back — its attacks drain warmth
          rather than inflict blunt trauma. Falls from any
          height without damage. Blown by strong drafts.
      - name: Patrol Memory
        description: >-
          Follows a fixed route through its room and adjacent
          corridors. Ignores all stimuli unless physically
          contacted. Breaking its route — blocking a doorway
          it always passes through — causes it to stop and
          stand motionless, vibrating silently.
      - name: Cold Grip
        description: >-
          Melee contact separates warmth from the target.
          No physical wound — the touched area becomes numb
          and cold for one hour. Accumulated cold grip can
          render a limb useless.
    loot:
      - description: "Whatever the husk was carrying when it was processed — usually nothing."
        chance: 0.1
      - description: "A token with the Butcher's notation (5 GP to the Ledger)"
        value: 5
        chance: 0.3
    tags: [level_1, undead, patrol, butcher_fauna]
    rooms: [sorting_floor, separation_chamber_west, separation_chamber_east]
    notes: >-
      Avoidable if the party maps the patrol route. Dangerous if
      cornered — cold grip stacks. The weightless body is unsettling
      but the real threat is the numbing touch.

  - id: pane_lurker
    name: Pane Lurker
    description: >-
      A flat, translucent creature that presses itself against walls
      and floors. It has had its depth separated — it exists in two
      dimensions only. Invisible edge-on, a faint shimmer face-on.
      It feeds on the dimensions of other things, briefly flattening
      whatever it wraps around. A pane lurker on your arm makes the
      arm look painted on — flat, without volume, still functional
      but disorienting to look at.
    threat_level: 2
    morale: cautious
    hp: 4
    max_hp: 4
    ac: 13
    damage: "1d3 (dimensional drain — target area appears flat for 1 hour)"
    abilities:
      - name: Two-Dimensional
        description: >-
          Invisible when viewed edge-on. Only visible as a faint
          shimmer when facing directly. Cannot be hit by piercing
          weapons from the side. Slashing weapons effective from
          any angle.
      - name: Dimension Feed
        description: >-
          Wraps around a surface or limb and drains its apparent
          depth. Affected area looks painted-on — flat, like a
          drawing of itself. No mechanical damage but the visual
          distortion imposes disadvantage on fine manipulation
          with affected limbs.
    loot:
      - description: "Pane residue — a film that makes any surface appear perfectly flat (2 GP)"
        value: 2
        chance: 0.4
    tags: [level_1, ambush, butcher_fauna]
    rooms: [receiving, holding_cells, cold_store]
    notes: >-
      Ambush predator. Perceptive characters spot the shimmer.
      The dimensional drain is disorienting but temporary. More
      dangerous in dark rooms where the shimmer is harder to see.

  # === TIER 3: THREAT ===

  - id: silence_stalker
    name: Silence Stalker
    description: >-
      A quadruped the size of a large dog. It has had its sound
      separated completely — it moves, breathes, and kills in
      total silence. Its body is covered in a fine grey fur that
      absorbs light. Its eyes are wide and white, adapted to a
      world without echolocation or auditory hunting. It tracks
      by vibration through the stone floor. Within ten feet of a
      silence stalker, all sound ceases — your voice, your
      footsteps, the crackle of your torch. This is how you know
      it is close.
    threat_level: 3
    morale: aggressive
    hp: 12
    max_hp: 12
    ac: 14
    damage: "1d6+2 (bite, silent — no audible warning)"
    abilities:
      - name: Silence Aura
        description: >-
          All sound within ten feet of the stalker ceases. This
          includes speech, equipment noise, and combat sounds.
          Hirelings cannot communicate while in the aura. Morale
          checks in the silence aura are made at disadvantage.
      - name: Vibration Sense
        description: >-
          Detects movement through stone within thirty feet.
          Standing still makes you invisible to it. Walking on
          stone alerts it. Walking on the residue in the Residue
          Well muffles vibration.
      - name: Pack Hunter
        description: >-
          In pairs, silence stalkers flank from opposite sides.
          Their overlapping auras create a twenty-foot sphere of
          total silence. Communication is impossible.
    loot:
      - description: "Silence stalker pelt — absorbs sound when worn (25 GP)"
        value: 25
        chance: 0.5
      - description: "Stalker teeth — ground to powder, used in Assayer equipment calibration (10 GP)"
        value: 10
        chance: 0.3
    tags: [level_2, predator, pack, butcher_fauna]
    rooms: [refinement_hall, intake, specimen_gallery]
    notes: >-
      The primary combat threat on Level 2. The silence aura is
      the real danger — parties that rely on verbal coordination
      are crippled. Plan hand signals before engaging.

  - id: prism_sentinel
    name: Prism Sentinel
    description: >-
      A humanoid figure made of crystallized separated light. It
      stands motionless in the Refinement Hall until a threshold
      of Keeper awareness is reached, then activates with a
      shudder of color. Its body refracts torchlight into blinding
      spectra. It moves like a person remembering how to walk —
      stiffly, deliberately, each step a decision. It does not
      pursue. It positions itself between intruders and the exits.
    threat_level: 3
    morale: fearless
    hp: 16
    max_hp: 16
    ac: 15
    damage: "1d6+1 (prismatic strike — burns on contact, leaves no wound)"
    abilities:
      - name: Light Refraction
        description: >-
          Refracts all nearby light into blinding spectra. Torches
          within fifteen feet cast prismatic glare instead of useful
          illumination. Detailed vision is impossible — you see
          color but not form.
      - name: Threshold Guardian
        description: >-
          Only activates when Keeper awareness reaches 10 or higher.
          Below that, stands motionless and can be walked past. Once
          active, positions itself at exits and does not pursue
          beyond its assigned room.
      - name: Prismatic Strike
        description: >-
          Melee contact causes a burning sensation without heat —
          the sensation of brightness applied to nerves. No visible
          wound. Pain is real. Accumulated strikes cause disorientation.
    loot:
      - description: "Prism shard — a fragment of crystallized light (40 GP, fragile)"
        value: 40
        chance: 0.3
    tags: [level_2, guardian, keeper_construct, butcher_fauna]
    rooms: [refinement_hall]
    notes: >-
      Gate guardian. Only fights when awareness is high. Can be
      avoided entirely by keeping awareness low. The prismatic
      glare is the main threat — fighting blind is fighting dead.

  # === TIER 4: BOSS ===

  - id: the_catalogue
    name: "The Catalogue"
    description: >-
      The Butcher's lieutenant — a composite entity assembled from
      separated qualities bound into a shape. Not a creature but a
      process given form. It looks different each time it manifests:
      a figure of stolen warmth one delve, a shape of compressed
      silence the next. What is consistent is its function — it
      guards the Press and it catalogs everything it encounters.
      Fighting the Catalogue means fighting the vault's filing
      system. It knows where every quality is stored and can
      withdraw specific properties from its opponents at will.
    threat_level: 4
    morale: fearless
    hp: 30
    max_hp: 30
    ac: 16
    damage: "2d6 (targeted separation — removes a specific quality per hit)"
    abilities:
      - name: Targeted Separation
        description: >-
          Each hit separates a specific quality from the target.
          First hit: warmth (numbness, cold damage vulnerability).
          Second hit: weight (cannot carry heavy objects, cannot
          brace against force). Third hit: color (visual distinction
          of objects becomes impossible). Fourth hit: sound (cannot
          speak or hear). The Catalogue always separates in this
          order. Recovery takes one full rest outside the vault.
      - name: Quality Shield
        description: >-
          The Catalogue's body is made of separated qualities.
          Physical attacks pass through the quality-mass without
          effect. It can only be harmed by returning separated
          qualities to it — throwing the contents of the Quiet
          Archive (stored sounds), or shattering prism shards
          (crystallized light) near it. Each returned quality
          deals damage and destabilizes its form.
      - name: Manifest
        description: >-
          When destroyed, the Catalogue disperses into its
          component qualities. The Patient Butcher reassembles
          it from fresh material between delves. Each incarnation
          has different quality-composition but the same function.
    loot:
      - description: "Catalogue core — a dense sphere of interwoven qualities (100 GP)"
        value: 100
        chance: 1.0
      - description: "Quality residue — loose separated properties that slowly reattach to nearby objects (30 GP)"
        value: 30
        chance: 0.7
    tags: [level_2, boss, keeper_construct, butcher_fauna]
    rooms: [the_press]
    notes: >-
      The Maw-equivalent for Grimvault. Unlike the Maw, the
      Catalogue has a puzzle component — it cannot be damaged
      by normal weapons. Players must use the vault's own
      separated materials against it. Reward exploration and
      looting of the archive rooms before attempting the boss.
