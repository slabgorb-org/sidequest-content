# Grimvault — NPC Portraits
# Scoped to the Ashgate approach hamlet and Grimvault dungeon. Sünden
# residents (including Wren Peatford, who relocated to Sünden two
# seasons ago to run the Workhouse Recovery Bench) live in the
# world-level portrait_manifest at worlds/caverns_three_sins/.
#
# B&W pen and ink, Erol Otus / David Trampier style.

characters:

  - name: Falk Stonehelm
    role: Chief Assayer studying maps in the Assayer Hall
    type: npc_major
    appearance: >-
      A tall, gaunt man in his forties standing before a wall
      covered in dungeon maps in a stone-walled guild hall. His
      left hand holds a pen with mechanical precision, annotating
      a chart. His right hand hangs at his side, fingers slightly
      curled — they cannot grip. He wears plain medieval clothing,
      every button aligned, every crease deliberate. A lead-lined
      notebook in his breast pocket. Hollow cheeks, eyes that
      stare too long. A slate board behind him covered in precise
      handwritten measurements.
    culture_aesthetic: >-
      Medieval guild hall interior. Maps pinned to stone walls,
      shelves of leather-bound ledgers, chalk and instruments on
      workbenches. Everything measured and ordered.

  - name: Agna Ironjaw
    role: Ledger master assessing goods at her scale
    type: npc_major
    appearance: >-
      A broad woman with a square jaw standing behind a counter
      in a medieval merchant's shop, hands moving an abacus. Dark
      hair streaked grey, pulled back severely. A heavy leather
      apron over merchant's wool, pockets full of brass weights.
      A multi-lensed brass monocle hangs from a chain at her neck.
      Her vault-standard scale sits on the counter — brass pans
      balanced with strange weights. Shelves behind her hold bolts
      of pale cloth and stoppered glass bottles.
    culture_aesthetic: >-
      Medieval merchant's assessment office. Stone-walled, lantern-
      lit, scales and instruments on every surface. Strange goods
      on shelves — cloth with no color, metal with no weight.

  - name: Durn Oakwell
    role: Equipment supplier in his torch shop
    type: npc_minor
    appearance: >-
      A quiet, middle-aged man in a medieval leather apron standing
      amid racks of torches in a well-organized stone shop. Torches
      sorted by type — standard on the left, lead-lined on the
      right. Coils of rope on pegs, rations in waxed packages on
      shelves. His hands are stained with lead-compound residue.
      An honest, forgettable face. A price board on the wall
      marked with columns of tally notches and simple symbols, no
      readable letters. Everything in its place.
    culture_aesthetic: >-
      Medieval tradesman's shop. Stone walls, timber shelving,
      lantern light. Immaculately organized. The most ordered
      room in town.
