# Hamlet of Sünden — Regional Legends
# Stories told at the Square, the chapel, the tavern, and the
# Wallwrights' yard. Per-dungeon legends live in the dungeon
# directories. These are the legends that belong to the hamlet
# itself — to the meeting place of the three.

- name: "The Three Wakings"
  summary: >-
    Within a single human generation, three of the Seven woke under
    this country. Nobody alive saw all three open. The order is
    disputed, the dates approximate, and the kinship between them is
    a thing the chapel will gesture at and refuse to commit.
  era: "Three generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The story Sünden's preacher tells, and immediately apologises for
    telling, runs like this: the north ridge cracked first, in a
    spring with no rain, and the miners at Ashgate came up changed.
    The eastern cave mouth opened second, in a winter with no snow,
    and a merchant caravan went in and never returned. The hillside
    above Edgeholm broke last, in a spring after a wet autumn, and
    the village went down whole. Three wakings, three different
    weathers, and one human generation between the first and the
    last. The preacher will tell you the three are kin. He will tell
    you they are not. He will tell you nobody knows. All three are
    his sermon, depending on the week.
  faction_grudges: []
  lost_arts:
    - >-
      The pre-waking maps of the country — the ridge surveys, the
      land grants, the mineral charts. Most were lost in the first
      decade, either burned by households leaving or buried with
      the people who held them. The chapel keeps two surviving
      fragments under lock. They show towns that are not there
      anymore.
  monuments:
    - >-
      The Three Sightlines — three cleared lanes from the upper
      terrace of Sünden, each cut to keep one dungeon mouth
      visible from the same vantage. The Wallwrights maintain the
      lanes. They believe the sin you cannot see is the sin you
      forget.
  terrain_scars: []

- name: "The Founding of Sünden"
  summary:  >-
    The hamlet was founded as a coroner's station — neutral ground
    halfway between the three towns, where the dead from any of the
    three mouths could be laid out, named, and sent home. The Wall
    came before the houses.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    By the second decade after the wakings, the three towns had a
    shared problem nobody wanted in their own square: the bodies.
    Ashgate would not lay out delvers Copperbridge had sent.
    Copperbridge would not pay carting fees on Gristwell's losses.
    Gristwell did not have a chapel large enough to hold the
    accumulating dead of any season. A coroner from each of the
    three towns met at the saddle ground at the regional center, in
    autumn, and agreed on a single neutral hamlet. The Wall went
    up first — slate from a quarry that no longer exists, set on
    a course of north-ridge limestone — and the houses came after,
    around the Wall, facing it. The first family to settle Sünden
    were the descendants of the original Ashgate coroner. They are
    the Wallwrights now. They have not left.
  faction_grudges: []
  lost_arts:
    - >-
      The original coroner's notation — the marks the three town
      coroners agreed on for cause-of-return, distinct from
      cause-of-death. Some marks survive on the oldest course of
      the Wall. Most have been recut as plain names in later
      generations. The Wallwrights will not say which marks are
      original and which are restoration.
  monuments:
    - >-
      The Coroner's Stone — a flat, weathered slab set into the
      pavement of the Square between the chapel and the Wall.
      The first body was laid out on it, before there were
      benches inside. People walk around it without comment.
  terrain_scars: []

- name: "The Wall Begins"
  summary: >-
    The first name carved into the Wall was a delver who came back
    twice — once dead and once not. The Wallwrights chose to carve
    her once, and the rule of the Wall began.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The story is that the first delver carved into the Wall was a
    woman named Ima Tarn, who went into Grimvault with a small
    party, did not come out, and was reported dead. Her name was
    carved into the slate by the elder Wallwright on a still
    autumn morning. Three days later she walked out of the
    northern road, hollowed by the vault, missing the warmth of
    her own hands. The Wallwrights met that night and decided.
    They would not erase the carving — the Wall did not erase. They
    would not carve her again — the Wall did not double. They cut
    a single line under her name to mark a return that came after
    the carving, and the rule of the Wall has been that line ever
    since: one carving per delver, one underline per return-after,
    no exceptions for kinship or coin. Ima Tarn lived another seven
    years on the Recovery Bench at the Workhouse's side door, and
    her line on the Wall was the first of many.
  faction_grudges:
    - from: The Wallwrights
      to: outsiders who request second carvings
      reason: >-
        The rule is one carving per delver. Wealthy households from
        Ashgate or Copperbridge sometimes try to commission second
        carvings — a finer slab, a deeper cut, a separate stone for
        a beloved son. The Wallwrights refuse. The refusals have
        cost them patrons. They have not relented.
  lost_arts: []
  monuments:
    - >-
      Ima Tarn's Line — the first underlined carving on the Wall,
      faintly worn now but still legible in the right light. The
      Wallwrights point it out to apprentices on their first day
      and to no one else.
  terrain_scars: []

- name: "The Four Absent"
  summary: >-
    Three of the Seven woke here. The other four are stories told
    elsewhere — Wrath in a barrow east, Sloth under the southern
    fen, Lust whispered after dark, Envy in every haunted well west
    of here. None confirmed. All carried by travelers who pass
    through Sünden and read the Wall.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Travelers bring the stories in and the Wall keeps them out.
    The four blank columns on the Wall — kept blank by custom
    since the original carving — are the visible argument that the
    other four sins are stories, not local facts. Wrath, the
    travelers say, sleeps east of the river in a barrow that bleeds
    when storms come over the headland; the people of the salt
    coast bring fragments of this story but no proof. Sloth, the
    fen-people say, lies under the green water of the southern
    marsh, and they will tell you that anyone who wades in too long
    forgets why they came. Lust is the story Sünden's preacher
    will speak only after dark, only once a season, and only with
    the chapel doors closed; nobody under thirty has heard the
    full version. Envy is the most-told and the least-trusted —
    every village west of here has a haunted well or a cursed
    pond they call the eye of Envy looking up. The Wallwrights
    keep the columns blank. They will tell you, if you ask, that
    keeping a column blank is not the same as believing it will
    always be blank.
  faction_grudges: []
  lost_arts: []
  monuments:
    - >-
      The Four Blank Columns — the eastern half of the Wall,
      maintained smooth and uncarved by the Wallwrights as a
      matter of standing custom. Pilgrims occasionally try to
      leave marks. The Wallwrights polish the slate clean by
      morning.
  terrain_scars: []

- name: "The First Hireling Who Came Back Wrong"
  summary: >-
    A torchbearer named Ollet went down into one of the three
    mouths — accounts disagree on which — and came back with
    something the Wall did not yet have a column for. The
    Recovery Bench was built for him.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Every tavern in the three approach hamlets tells the Ollet
    story differently. In Ashgate's Spillway he went into Grimvault
    and came back without the warmth of his own breath; in
    Copperbridge's Clinker he went into Horden and came back
    counting under his breath, never aloud, never out loud at all;
    in Gristwell's Sinkhole he went into Mawdeep and came back
    convinced that food was a kind of betrayal. The actual Ollet,
    if he existed at all, lived on the Recovery Bench at Sünden
    for an unknown number of years and was the first delver the
    Confraternity treated with all three rites in sequence —
    Confessional, Workhouse, Masquerade — without success. He is
    cited at the Recruiter's Post as the cautionary case: a
    hireling can come back changed in ways the rites do not lift,
    and the vetters owe it to the next contract to know what the
    last one came back as. The Wall has no carving for Ollet. He
    did not die in a way the Wall could record, and he did not
    return in a way that warranted an underline. The Wallwrights
    will not speak about him. The Recovery Bench was, by
    consensus, built in his memory.
  faction_grudges:
    - from: The Wallwrights
      to: tavern-tellers of the Ollet story
      reason: >-
        The Wallwrights consider the three contradictory tavern
        versions of Ollet's story to be evidence that the story is
        not load-bearing. They are tired of being asked to settle
        the contradiction by reference to their records, which do
        not include Ollet by name and which they will not show.
  lost_arts: []
  monuments:
    - >-
      The Recovery Bench — the long pine bench at the Workhouse's
      south side door, polished smooth by generations of returned
      delvers. It is, by tradition, never moved and never
      replaced. When a board wears through, it is patched.
  terrain_scars: []
