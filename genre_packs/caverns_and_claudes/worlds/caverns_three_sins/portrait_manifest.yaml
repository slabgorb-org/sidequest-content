# Sünden — World-Level NPC Portraits
# Resident cast of the Hamlet of Sünden itself: the three institutions
# that live in Sünden Square (Wallwrights, Vetters' Office, Confraternity
# of Three Rites) plus Wren Peatford, who relocated to Sünden two
# seasons ago to run the Workhouse south-door Recovery Bench.
#
# Per-dungeon NPCs (Ashgate / Copperbridge / Gristwell residents) live
# in dungeons/<name>/portrait_manifest.yaml. Do not duplicate them here.
#
# B&W pen and ink, Erol Otus / David Trampier style. Z-Image Turbo
# render target — descriptions are renderable scene blocks, not lore.

characters:

  - name: Sevra Tarn
    role: Elder Wallwright, head of the carving guild
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a spare adult woman
      in her sixties, weather-cut face, grey hair pulled back under
      a plain linen kerchief, deep-set eyes that have measured more
      slate than they will measure in the years she has left.
      Wearing a stoneworker's leather apron over plain wool, sleeves
      rolled to the elbow, forearms dusted pale with stonedust to
      the wrist. Her hands are the giveaway — squared, calloused,
      faint grey worked permanently into the knuckle creases. She
      stands at the Wall, the slate face behind her carved with
      names in three columns, lamp-light warming the cuts from the
      left. A chisel rests in her right hand at the angle of
      finishing, not striking. Plain limestone background,
      lamp-soot shadows in the eaves above. No text, no caption,
      no watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Wallwrights are a carving guild three generations deep,
      descended from the original Ashgate coroner who founded
      Sünden. Their stoneyard inheritance is closer to a
      stonemasons' livery company than to a craft shop — formal
      verification, rituals around dusk, refusal-as-discipline. Sevra
      reads as the oldest unbroken thread of that lineage.

  - name: Wallwright Cael
    role: Junior carver, third-generation Wallwright
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult man in his
      late twenties, lean build, dark hair tied back at the nape, a
      patient expression held just short of a smile. Wearing
      the same leather apron over plainer wool than Sevra's, the
      apron less worn at the chest where he has not yet leaned
      against the slate as long. Stonedust on his hands and on the
      cuff of his right sleeve. He is finishing a shallow cut — the
      underline beneath a returned-delver's name — and the chisel
      is held delicately. Lamp-light from a brazier on the
      stoneyard wall behind him, slate practice-blocks leaned in
      stacks. No text, no caption, no watermark, fully clothed,
      modest, correct human anatomy.
    culture_aesthetic: >-
      Sevra's nephew, the youngest carver currently certified to
      cut a name unsupervised. He is the public face of the guild
      for everything except a death-cut, and he handles grieving
      families more patiently than Sevra does. Same stonemasons'-
      livery inheritance, with an apprentice's lighter hand.

  - name: Mira Thorn
    role: Senior vetter, kinder desk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a heavy-set adult
      woman in her fifties seated behind a plank desk, a leather-
      bound drift profile open before her, ink-stained right hand
      resting on the page. Iron-grey hair pinned plain, a steady
      patient face that has refused more clearances than it has
      signed. Plain wool overdress under a linen apron, sleeves
      pushed up to the forearm, a Workhouse pin still on her collar
      from her old branch. Behind her: ranks of pigeonhole files,
      folded letters, a brass lamp throwing warm cream-white light
      onto the desk and warm dark shadow onto the wall. A clay cup
      of cold tea at her elbow. No text, no caption, no watermark,
      fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Vetters' Office is the local equivalent of an early
      coffeehouse-and-correspondence bureau — Lloyd's-of-London at
      hireling-evaluation scale. Mira came up through the
      Confraternity's Workhouse before crossing to the office, and
      she still keeps the discipline of plain food and plain work
      in her habits.

  - name: Korven Daish
    role: Senior vetter, colder desk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a wiry adult man in
      his forties seated at a plank desk opposite Mira's, sleeves
      rolled, a former delver's economy in the shoulders. Dark
      hair cropped short, clean-shaven, an unsmiling face that
      reads pragmatic rather than cruel. Old ink stains and a
      faded delver's brand on the inside of his right wrist where
      the cuff folds back. Wearing a plain linen shirt and leather
      jerkin, no insignia. A clearance card pinched between two
      fingers, half-signed. Lamp-light from above and behind, his
      face split between cream-white highlight and warm dark shadow.
      Stacked drift profiles on the corner of the desk, a separate
      pigeonhole rack from Mira's behind him. No text, no caption,
      no watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      Same coffeehouse-correspondence-bureau institution as Mira,
      opposite temperament. Korven is a returned delver himself,
      cleared by the office he now staffs, and he runs the colder
      desk on the theory that field-experience beats mercy. The
      vetting office's two-desk culture is structural, not
      personal — but the air between his desk and Mira's reads
      cool in any frame they share.

  - name: Toller Renn
    role: Junior vetter, file clerk
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult man in his
      late twenties standing at a tall clerk's lectern, quill in
      his right hand, a half-written formal clearance on the
      slanted desk in front of him. Sandy hair, careful unfussy
      face, plain wool waistcoat over a linen shirt with the cuffs
      ink-blackened past the second knuckle. A stack of inter-
      hamlet correspondence at his elbow, each letter folded
      identically. The lectern is positioned between Mira's and
      Korven's desks in the background — a small figure visible at
      each, neither in focus. Warm lamp-light from a single sconce
      on the wall behind him. No text, no caption, no watermark,
      fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The clerk who actually keeps the office running. Trained in
      the same coffeehouse-correspondence-bureau tradition as the
      seniors, not yet attached to a temperament. He maintains the
      drift profiles, files the inter-hamlet correspondence, and
      writes the formal clearances after the seniors have decided.

  - name: Anselm Vail
    role: Keeper of the Confessional, Generosity branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a spare adult man
      in his fifties seated on a low bench inside the narrow
      Confessional chapel, the carved screen visible to one side,
      a poor box on the floor between his feet. Thinning hair
      combed back, hollow cheeks, a bookish careful face. Wearing
      plain dark wool vestments cut without ornament, a linen
      collar, no chain, no ring. His right hand rests on a small
      ledger of broken-count tallies; his left is open, palm up,
      empty — the gesture of the rite when the count is broken and
      the surrender is accepted. A single tallow candle on the
      bench-end throws a single cream-white highlight onto his
      face from below. No text, no caption, no watermark, fully
      clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Confraternity's Generosity branch is closest in tradition
      to the Florentine lay confraternities — penitential rite,
      poor-box discipline, screen between penitent and keeper.
      Anselm's manner is the bookish-rigorous variant. He runs the
      rite by the rule and considers Greed the most dangerous of
      the three sins because it endangers other people, not just
      its host.

  - name: Brother Hesh
    role: Master of the Workhouse, Temperance branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a heavy-shouldered
      adult man in his forties standing at the cold hearth at the
      far end of the long Workhouse hall. Dark beard kept short,
      face weathered from a delver's career and then a laborer's,
      a plain unvarnished expression. Wearing a coarse wool habit
      pushed up at the sleeves, a leather apron over it, and the
      same plank-bed-and-plain-food discipline visible in the cut
      of his clothing as in the room behind him. Forearms heavy
      and scar-laced from old delves into Mawdeep. He is mid-rite,
      ladling plain stew into a wooden bowl for a penitent kneeling
      out of frame. Long timber benches and looms recede into the
      hall behind him. Warm dark shadow on the high beams; cream-
      white highlight on the ladle and bowl rim. No text, no
      caption, no watermark, fully clothed, modest, correct human
      anatomy.
    culture_aesthetic: >-
      Workhouse-style Temperance as labor rather than worship —
      lay-monastic in inheritance, plain food and plain work, a
      cold hearth on principle. Hesh is a former Mawdeep delver
      who walked north and stayed. He is the loudest keeper in
      joint session, by some distance.

  - name: Mistress Coro
    role: Host of the Masquerade, Humility branch
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult woman of
      indeterminate age standing in the vaulted single-room
      Masquerade hall, walls hung behind her with painted wooden
      masks of every face but her own. She wears one of her own
      masks pushed up onto the crown of her head — a carved
      shallow-relief mask in pale wood — so the viewer sees the
      face beneath, which reads as composed, watchful, no longer
      young, no specific age. Long dark robes cut for movement,
      plain at the cuff and hem. One hand resting on the rim of
      another mask hung on the wall beside her. Lamp-light from a
      stand on the floor casts long warm shadows up the wall of
      masks. No text, no caption, no watermark, fully clothed,
      modest, correct human anatomy.
    culture_aesthetic: >-
      The Masquerade's Humility rite is theatre crossed with
      confession — penitents wear carved masks through three
      public services and speak as the masked face. The branch
      reads as part-commedia, part-lay-confraternity, part-public-
      ritual-stage. Mistress Coro is the senior Confraternity voice
      in the current phase and the only keeper currently speaking
      to the other two.

  - name: Sister Pell
    role: Confraternity steward, all three branches
    type: npc_minor
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of an adult woman in
      her late twenties seated at a plain table in the Confraternity
      Hall behind the Masquerade, three account-ledgers open in
      front of her in a row — Confessional, Workhouse, Masquerade —
      one quill, one inkpot, one careful posture. Dark hair pinned
      simply, a quiet steady face. Wearing a plain linen overdress
      with a Confraternity steward's pin, no branch insignia. On
      the wall behind her, three poor-box keys hang on a single
      iron ring. A carved wooden mask rests on the table corner —
      the only one in the Masquerade hall whose face is her own.
      Warm lamp-light from a single brass lamp; warm dark in the
      corners of the symmetrical room. No text, no caption, no
      watermark, fully clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      The Confraternity's joint steward — keeper of the joint
      accounts, scheduler of the quarterly sessions, drafter of
      the joint statements when the three keepers can be made to
      agree. Trained originally as Mistress Coro's apprentice in
      the Masquerade tradition; now formally above all three
      branches and quietly disliked by all three keepers in turn.

  - name: Wren Peatford
    role: Recovery Bench tech, south door of the Workhouse
    type: npc_major
    appearance: >-
      B&W pen-and-ink portrait in the style of Erol Otus and David
      Trampier, heavy crosshatching, stippled shadows, monochrome,
      high contrast. Three-quarter portrait of a small adult woman
      in her thirties seated on a long pine bench against the
      south wall of the Workhouse, holding up a tuning fork to a
      delver out of frame. Dark hair half-escaping a plain braid,
      a kind careful face, a small steady smile. Wearing layers of
      warm medieval wool — she is always cold — over a linen shift,
      a pouch of dried herbs at her belt, a fan of plain colored
      cards in her left hand. The bench is worn smooth by waiting.
      Lamp-light from a sconce above her warms the wall; the pine
      of the bench reads pale, the wool of her layers reads dark.
      A practiced small-room intimacy in the framing — patient
      work, no audience. No text, no caption, no watermark, fully
      clothed, modest, correct human anatomy.
    culture_aesthetic: >-
      Pre-existing Sünden resident, relocated from Ashgate two
      seasons ago to run the Workhouse south-door Recovery Bench.
      Her tradition is the gentlest in the hamlet — neither
      penitential like the Confessional nor disciplinary like the
      Workhouse proper, but the long care of delvers whose drift
      has gone past what the rites can lift. She does not promise
      to undo the change. She teaches them how to live inside it.
