name: Grimvault
description: >-
  A dungeon that takes things apart. Not flesh — qualities. Warmth
  leaves the stone first. Then color drains from the walls. Then
  sound stops carrying. The deeper you go, the less there is of
  everything except the Keeper's attention. The town of Ashgate
  clings to the ridge above the entrance, slowly losing its flavor.
  The bread tastes of nothing. The ale has no bite. People speak
  louder than they need to and do not notice they are doing it.

tagline: "It takes what makes things what they are."

axis_snapshot:
  comedy: 0.3
  gravity: 0.8
  outlook: 0.4

keeper:
  name: "The Patient Butcher"
  personality: methodical
  obsession: separation
  tone_override:
    comedy: 0.25
    gravity: 0.85
  awareness:
    starting: 0
    tick_rate: 1
    stealth_decay: -1
    thresholds:
      "3": "Tools left on a workbench. Clean. Recently oiled. Not yours."
      "6": "A room you passed through is now organized differently — everything sorted by material."
      "10": "Your torchlight casts no shadow. The shadow has been taken separately."
      "15": "The walls are smooth as glass. Every texture has been planed away."
      "20": "You cannot remember your own name. It has been filed somewhere deeper."
  monologue_style: >-
    Quiet, measured, clinical. The voice comes from everywhere and
    nowhere — or rather, it comes from the silences between your
    own words. It describes your qualities the way a gemcutter
    describes a stone: what can be separated, what can be kept,
    what is waste. It is never angry. It is never hurried. It has
    all the time in the world, and it is very, very thorough.
  trap_aesthetic: >-
    Precision instruments — blades that descend on calibrated tracks,
    floors that tilt at exact angles, rooms that seal with
    machined edges. Nothing crude, nothing wasteful. Each trap
    separates something specific: a room that strips color from
    clothing, a corridor that muffles footsteps to nothing, a
    chamber that makes torchfire burn cold. The deeper traps
    separate abstracts — courage, memory, the sense of direction.
  topology_tendency: >-
    Linear processing flow — rooms arranged in functional sequence
    like stations on a workshop floor. Input, preparation,
    separation, sorting, storage. Multiple entry points converge
    on the central processing rooms. The architecture of a
    well-organized manufactory, not a maze.
