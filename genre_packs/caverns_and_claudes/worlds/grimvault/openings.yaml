# Grimvault — Session Openings
# Set the scene at Ashgate before the descent.

- id: dawn_at_the_approach
  archetype: preparation
  situation: >-
    Dawn in Ashgate. The party gathers at the ridge road as pale
    light washes the limestone square. The Quiet Field stretches
    between town and the vault entrance — two hundred paces of
    meadow where sound does not carry right. Wren Peatford waits
    at the Recovery Bench with her tuning fork. Gear is checked.
    Lead-lined torches distributed. Entry time marked on the
    Threshold Stone.
  tone: clinical anticipation, muted
  avoid:
    - combat in the first scene
    - loud or dramatic entrances
    - exposition about the vault's nature (the player knows)
  first_turn_seed: >-
    Dawn. The ridge catches the first light and holds it without
    warmth. Ashgate's fountain runs clear water that tastes of
    nothing — you filled your waterskin an hour ago and already
    cannot remember if it had flavor. Across the Quiet Field,
    the vault entrance waits — a rectangle cut into stone with
    edges too sharp for any chisel. Wren Peatford holds up three
    fingers from the Recovery Bench. You count them. She nods.
    Your senses are intact. For now. Falk Stonehelm's flat voice
    carries from the Assayer Hall: today's conditions are posted.
    The Butcher's awareness is at baseline. The Sorting Floor
    was clear as of yesterday's last return. Lead-lined torches
    burn six hours. Standards burn four. Both are available at
    Durn's. You cross the Quiet Field. By the halfway point your
    footsteps make no sound. The Threshold Stone is cool under
    your hand. You mark your entry time. The vault is open.

- id: the_spillway
  archetype: social
  situation: >-
    Evening at The Spillway tavern. The ale is the only thing in
    Ashgate with full flavor — the brewer compensates. Durmach's
    Chair sits empty in the corner. Returning delvers sit at the
    bar, testing their senses. One holds a colored card at arm's
    length and squints. The Assayer board has been updated.
  tone: quiet commerce, muted camaraderie
  avoid:
    - raucous tavern scenes
    - bar fights
    - loud music or entertainment
  first_turn_seed: >-
    The Spillway. Water runs through a channel in the stone floor —
    a natural spring that emerges from the ridge and tastes of
    chalk. The ale does not taste of chalk. The brewer adds enough
    hops to fight the vault's proximity. Durn Oakwell sits at the
    bar nursing a standard mug and talking to nobody. A returned
    delver at a corner table is testing colored cards against each
    other, whispering their names like a prayer. Red. Blue. Green.
    She hesitates on yellow. Durmach's Chair is empty. It is always
    empty. The Assayer board on the wall lists today's conditions
    in Falk Stonehelm's precise hand. The Sorting Floor has been
    restocked. The Holding Cells have two new occupants. The Quiet
    Archive remains undiscovered by any active party. A note at the
    bottom in different handwriting: The Quiet Field has expanded
    twelve paces since spring.

- id: ledger_row_morning
  archetype: commerce
  situation: >-
    Morning on Ledger Row. The Quiet Trader has new stock from
    yesterday's returns. Agna Ironjaw is assessing a batch of
    weightless iron at her scale. A courier from downriver waits
    with new purchase orders.
  tone: commercial precision, strange goods
  avoid:
    - haggling comedy
    - merchant stereotypes
    - explaining the trade to the player (they know)
  first_turn_seed: >-
    Ledger Row. Three steps down from the square into the merchant
    quarter. Agna Ironjaw has her vault-standard scale out — brass
    pans balanced with weights that measure more than mass. On the
    left pan, a bar of iron that should weigh ten pounds and does
    not register. On the right pan, nothing visible, but the pan
    sinks. She is weighing the iron's missing weight. The number
    she writes in her ledger means something to a buyer in the
    lowlands. At the Quiet Trader, new stock: a bolt of cloth the
    color of nothing, three soundless bells in velvet cases, a
    jar of extracted warmth that keeps a room comfortable for a
    week. The courier from downriver has standing orders for more
    mourning cloth. The Ledger needs delvers to go deeper.
