# Grimvault — Campaign Progression
# How the world changes as players accumulate experience (treasure-as-XP)
# Structured to match HistoryChapter schema: id, label, lore[], session_range

chapters:
  - id: fresh
    label: "First Assessment"
    session_range: [1, 3]
    lore:
      - >-
        The party is new to Ashgate. Level 1 is the testing ground. The
        Workshop is organized and navigable — rooms have clear functions,
        corridors are straight, exits are obvious. The Butcher is patient.
      - >-
        Learning the quality-loss economy: which rooms take what, how
        long recovery takes, what separated materials are worth to the
        Ledger. Lead-lined torches are worth the premium.
      - >-
        The vault is cleaner than Mawdeep. Quieter. The walls are smooth
        and the air is dry. It feels more like a building than a cave.
        This should not be reassuring. Buildings are designed.
    location: "The Threshold"
    time_of_day: dawn
    atmosphere: >-
      Clinical unease. The vault is orderly and that is what is wrong.
      Dungeons should not be organized. The Butcher's attention is a
      weight on the back of the neck.
    points_of_interest:
      - name: Ashgate Square
        slug: ashgate_square
        region: ashgate_square
        type: settlement
        description: >-
          A clean, quiet square paved with pale limestone. The
          buildings are well-maintained but muted — paint fades
          faster here than it should. A fountain in the center runs
          clear water that tastes of nothing at all. The Assayer
          Hall dominates the north side, its doors always open.
      - name: The Spillway
        slug: the_spillway
        region: ashgate_square
        type: tavern
        description: >-
          A tavern built over a natural spring that emerges from the
          ridge, the water running through a channel cut into the
          floor. The ale is brewed on-site with extra hops to fight
          the vault's proximity. Durmach's empty chair sits in the
          corner. Nobody uses it.
      - name: The Approach and the Quiet Field
        slug: the_quiet_field
        region: grimvault_approach
        type: frontier
        description: >-
          A stone path leading from the edge of town across two
          hundred paces of silent grass to the vault's rectangular
          entrance. By the middle of the field your footsteps make
          no sound. By the entrance your torch burns a shade paler
          than it should.
      - name: The Threshold
        slug: the_threshold
        region: grimvault_approach
        type: dungeon
        description: >-
          A rectangular chamber inside the vault, walls cut flat to
          a polish with no seam and no joint. Your torch dims as
          you enter, as though the flame has been asked to be
          quieter. Tool marks on the walls, but not from any tool
          you recognise. A stone lectern near the entrance holds
          nothing.
      - name: The Receiving Hall
        slug: the_receiving_hall
        region: grimvault_approach
        type: dungeon
        description: >-
          A wide chamber with a low ceiling, both walls lined with
          hundreds of fist-sized stone niches at regular intervals.
          Some contain a pebble, a tooth, a coin, a button — each
          niche labelled with a mark that is not a letter in any
          language. The dust here does not settle. It has been
          separated from the air.

  - id: early
    label: "The Sorting"
    session_range: [4, 6]
    lore:
      - >-
        The party ventures deeper into Level 1. The Separation Chambers
        and Calibration Room introduce targeted quality loss — not
        ambient degradation but rooms that remove specific properties.
      - >-
        First encounters with husk walkers and pane lurkers. The
        creatures are not aggressive by default — they are incomplete.
        Learning which ones to avoid and which to exploit.
      - >-
        The Butcher's monologue begins — quiet, clinical, assessing
        the party's qualities with professional interest. Not threatening.
        Describing what it sees with the detachment of an appraiser.
      - >-
        Level 1 should feel manageable but unsettling. The real danger
        is not combat but the cumulative loss of qualities that make
        equipment and senses reliable.
    location: "The Sorting Floor"
    atmosphere: >-
      Controlled dread. The vault is comprehensible, which makes it
      worse. You can understand the system. You cannot escape it.
    points_of_interest:
      - name: The Sorting Floor
        slug: the_sorting_floor
        region: grimvault_approach
        type: dungeon
        description: >-
          The largest room on Level 1. Stone tables arranged in
          rows, each with a shallow depression at its centre. The
          depressions hold a film that catches torchlight and
          reflects a colour that was not in the flame. Channels
          cut into the floor between the tables lead to drains at
          the far wall. The channels are dry. Whatever flowed
          through them was not liquid.
      - name: The West Separation Chamber
        slug: separation_chamber_west
        region: grimvault_approach
        type: dungeon
        description: >-
          A smaller chamber where warmth has been removed — not
          winter-cold, but the cold of a thing that never had the
          idea of warmth in the first place. The stones read as
          room-temperature to the hand and still leach heat from
          whatever they touch. A delver's breath does not fog
          here. Nothing does.
      - name: The East Separation Chamber
        slug: separation_chamber_east
        region: grimvault_approach
        type: dungeon
        description: >-
          A twin to the west chamber, where colour has been
          removed. Your torchlight still illuminates, but
          everything it touches is rendered in a grey that is
          not any shade of grey. A cloak brought into the room
          and back out again keeps its shape. The colour does
          not come back.
      - name: The Calibration Room
        slug: the_calibration_room
        region: grimvault_approach
        type: dungeon
        description: >-
          A locked chamber whose walls are covered in dense
          concentric marks in the Butcher's notation. The air
          inside has been calibrated — sound carries exactly as
          far as it is supposed to and then stops. A single
          standing instrument at the centre measures a quantity
          you cannot name.
      - name: The Cold Store
        slug: the_cold_store
        region: grimvault_approach
        type: dungeon
        description: >-
          A room full of stone shelves. On the shelves: finished
          work. A sword with no weight. A coin that makes no
          sound when dropped. A helmet that fits no head because
          it has been relieved of the idea of fitting. Inventory
          tags hang from each item in the Butcher's hand.
      - name: The Quiet Archive
        slug: the_quiet_archive
        region: grimvault_approach
        type: dungeon
        description: >-
          A hidden chamber of absolute silence, reached through
          a passage that is not on any Assayer map. Your
          footsteps make no sound. Your breath makes no sound.
          Your heart, you are almost certain, still makes a
          sound — but only to you, and only if you concentrate.

  - id: mid
    label: "The Collection"
    session_range: [7, 9]
    lore:
      - >-
        Descent to Level 2. The Collection is where the vault stores
        its work. Separated qualities pool in the air. Silence stalkers
        hunt by vibration. The Specimen Gallery is a museum of arrested
        time.
      - >-
        The party knows the vault's patterns — quality-loss zones,
        creature patrol routes, the Butcher's escalation thresholds.
        The challenge shifts from discovery to optimization: how much
        can you extract before the cost exceeds the reward?
      - >-
        The Butcher's attention is personal now. It describes the
        party's qualities individually — which member has the most
        interesting warmth, whose voice would be worth preserving,
        whose sense of direction is unusually precise.
      - >-
        The economy is mature: separated materials have known prices,
        the Ledger has standing orders, and the Assayers sell detailed
        maps. The question is no longer whether to delve but how
        deep to push before turning back.
    atmosphere: >-
      Professional dread. The vault is a known adversary and the
      party respects its precision. Every delve is a calculated
      negotiation with entropy.
    points_of_interest:
      - name: The Descent
        slug: the_descent
        region: grimvault_approach
        type: dungeon
        description: >-
          A spiral staircase carved into the ridge's bedrock
          leading from Level 1 down to Level 2. The stairs are
          worn smooth but not by feet — the wear pattern matches
          no living shape. Torchlight narrows as you descend.
          Halfway down, every delver hears their own name in a
          voice they do not recognise.
      - name: The Intake
        slug: the_intake
        region: grimvault_approach
        type: dungeon
        description: >-
          The base of the descent opens into a room whose
          proportions are correct but whose surfaces are not.
          The walls are smooth to the eye and sharp to the touch.
          The ceiling hangs at the measured height and presses
          on the head regardless. Something here is being
          prepared.
      - name: The Refinement Hall
        slug: the_refinement_hall
        region: grimvault_approach
        type: dungeon
        description: >-
          The central chamber of Level 2. Stone pillars rise
          into a ceiling you cannot see, not because it is high
          but because the Butcher's attention has taken the
          idea of ceiling away from it. Between the pillars the
          air carries visible threads of separated quality,
          flowing slowly toward the deeper chambers.
      - name: The Specimen Gallery
        slug: the_specimen_gallery
        region: grimvault_approach
        type: dungeon
        description: >-
          A long room lined with cases of something like glass,
          smooth and perfectly transparent. Inside each case, a
          creature held at a single moment of its motion — a
          pane lurker mid-step, a husk walker mid-breath, a
          delver mid-scream. The cases are not sealed. Nothing
          is needed to hold the specimens in place.
      - name: The Index
        slug: the_index
        region: grimvault_approach
        type: dungeon
        description: >-
          A hidden chamber filled with stone tablets arranged in
          precise rows. Each tablet bears the Butcher's notation
          in columns that read both top-to-bottom and left-to-
          right. Standing in the middle of the room, a literate
          delver can learn to read one column before the reading
          itself is separated from them.
      - name: The Residue Well
        slug: the_residue_well
        region: grimvault_approach
        type: dungeon
        description: >-
          The floor of the waste chute, reached by a long fall
          or a longer climb. The ground is covered in the husks
          of objects that have had every quality stripped from
          them: a sword-shaped absence, a rope-shaped
          absence, a voice-shaped absence that still moves
          faintly when air passes over it.

  - id: veteran
    label: "The Press"
    session_range: [10, 12]
    lore:
      - >-
        The party attempts the Press. The deepest room, the Butcher's
        finest work, guarded by the Catalogue. Reaching it requires
        navigating Level 2's quality-stripped environment with enough
        resources and intact senses to fight.
      - >-
        The Catalogue cannot be harmed by conventional weapons. The
        party must use the vault's own materials — stored sounds from
        the Quiet Archive, crystallized light from prism sentinels,
        anything with a separated quality that can be returned to
        destabilize the boss.
      - >-
        The extraction from the Press through two levels of vault
        with the Butcher at full awareness is the climactic challenge.
        Every room is actively separating. Every creature is alert.
        The way out costs more than the way in.
      - >-
        The mechanism in the Press — what is it doing? The party can
        see the separated qualities flowing into it. Something is
        being assembled from the components. What the Butcher is
        building is the question that has no answer. Yet.
    atmosphere: >-
      Sublime dread. The vault at maximum intensity is not chaos — it
      is perfection. Every process running, every system engaged, the
      Butcher's full attention focused on the intruders who dare to
      interrupt the work. It is terrible and it is beautiful.
    points_of_interest:
      - name: The Press
        slug: the_press
        region: grimvault_approach
        type: dungeon_boss
        description: >-
          Behind a locked door in the deepest chamber of Level 2.
          A perfect stone cube, each wall the same exact length,
          the air inside held at a pressure that the body reads
          as weight. At the centre, a mechanism of impossibly
          fine components assembles something from the
          separated qualities flowing in through six channels.
          What it is assembling is the question the Butcher has
          not yet permitted anyone to finish asking.
      - name: The Catalogue Chamber
        slug: the_catalogue_chamber
        region: grimvault_approach
        type: dungeon_boss
        description: >-
          The antechamber of the Press, where the Catalogue
          resides. Its body is a ledger and its voice is a list
          and it will name every quality every delver present
          has ever lost. It cannot be harmed by conventional
          weapons. It can be interrupted only by the return of
          a separated quality to the place the Butcher took it
          from.
      - name: The Holding Cells
        slug: the_holding_cells
        region: grimvault_approach
        type: dungeon
        description: >-
          A row of ten stone cells with iron gates along a
          corridor off the Refinement Hall. Most are empty. Two
          contain creatures — thin, quiet, patient. A third
          contains a delver, eyes open, who has been there
          long enough that the name on the wall outside their
          cell has weathered and the weather is indoors.
      - name: The Waste Chute (Upper Mouth)
        slug: the_waste_chute
        region: grimvault_approach
        type: dungeon
        description: >-
          A narrow room on Level 1 with a hole in the floor
          descending into the Residue Well below. Objects lie
          scattered around the hole — dropped by delvers,
          kicked by husk walkers, or placed carefully here by
          something with a taste for composition. Everything
          near the edge has been slightly diminished.
