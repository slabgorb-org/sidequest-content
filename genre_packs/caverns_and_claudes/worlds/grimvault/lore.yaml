world_name: Grimvault
history: >-
  Ashgate was a mining town before the ridge cracked open. Three
  generations of delvers have mapped Level 1 of the vault, extracted
  modest treasure, and lost modest numbers of people. The dungeon is
  not voracious like Mawdeep — it is patient. It does not eat delvers.
  It takes pieces of them and lets them walk out diminished. The old
  delvers in Ashgate are quiet people. Not because they choose silence.
  Because something was left behind.

geography: >-
  Ridgetop country. Ashgate sits on a limestone ridge overlooking
  scrubland to the south and forest to the north. The dungeon entrance
  is a rectangular opening in the ridge face — not a natural cave
  but a doorway, cut with precision that no tool in Ashgate can
  replicate. The Quiet Field lies between town and entrance, a
  stretch of meadow where sound behaves strangely. The ridge itself
  is pale — bleached by something leaching upward from below.

cosmology: >-
  The Patient Butcher is an intelligence that separates. Not with
  blades — with attention. It observes a quality and that quality
  becomes distinct from its host. Warmth leaves stone. Color leaves
  fabric. Sound leaves air. The dungeon is the Butcher's workshop
  and everything inside it has been processed to some degree. The
  deeper rooms are further along in the separation — less color,
  less sound, less everything except the raw material the Butcher
  is interested in. What the Butcher does with the separated
  qualities is unknown. The deeper vaults are full of something.
  Nobody has survived long enough to describe what.

themes:
  - "The dungeon takes qualities, not lives — but what it leaves behind may not be living"
  - "Silence is the first warning"
  - "The Patient Butcher does not chase — it waits"
  - "Resources degrade near the vault — torches burn dimmer, rations taste of nothing"
  - "The way out restores what was taken — slowly, incompletely"
  - "Treasure is whatever the Butcher discarded as waste from its separations"

genre_conventions:
  - "Senses degrade as depth increases — describe less as the party descends"
  - "The Butcher never threatens — it observes, catalogs, and acts when ready"
  - "Creatures are things that have been partially separated and survived"
  - "Treasure is byproduct — the slag of metaphysical refinement"
  - "The surface town is affected by proximity — flavors, colors, sounds are muted"
