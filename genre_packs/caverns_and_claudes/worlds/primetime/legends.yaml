# Primetime — Legends
# What the Network, the audience, and the Unaired tell each other about the show

- name: The Forty-Two Hosts Before This One
  summary: >-
    The current Host is the forty-third. His predecessors went the way
    of Hosts. The Twelfth had an allergic reaction to a sponsor product
    on live air and was written out as a running gag. The Seventeenth
    fell in love with a contestant; she won the season and he was never
    seen again but the merchandise still sells. The Twenty-Ninth tried
    to leak the master tapes and the Network aired his attempt as the
    season finale, billed as "a very special episode." The Thirty-Fifth
    simply stopped showing up one Tuesday and the Thirty-Sixth was on
    air by Wednesday with the same jumpsuit tailored down two inches.
    Every Host is promised a retirement package. No one has ever seen
    one delivered.
  era: "Ancient and ongoing"
  affected_cultures:
    - Network Employees
    - The Unaired
  cultural_impact: >-
    The Host's job is contractually performative — the smiling certainty
    that the show will keep running regardless of who is wearing the
    jumpsuit this week. His predecessors' fates are never discussed on
    air and rarely discussed off it. Contestants who mention them by
    number find the Host's smile tighten very slightly.

- name: Season Zero
  summary: >-
    The pilot episode. The Summoning Engine's first successful casting.
    Six contestants, one season, no survivors. The Network calls it a
    classic. The footage is available, in full, at the Gift Shop for
    a premium PrimeBux price. Those who have watched it in full report
    that the aspect ratio is wrong, the Host is not the Host, and the
    arena is a different shape. The audience applause, however, is
    identical.
  era: "The beginning, whenever that was"
  affected_cultures:
    - Galactic Audience
    - Network Employees
  cultural_impact: >-
    Revered as canon. Referenced obliquely in Network marketing. The
    pilot's theme music is the show's theme music, still. Scholars who
    attempt to place Season Zero in a historical context find that no
    historical context survives the attempt.

- name: The Wyrm Incident
  summary: >-
    The one time in eleven seasons the Summoning Engine worked as
    designed. The algorithm selected an actual Slayer of the Wyrm — a
    woman who had, in fact, slain a wyrm, and not in a metaphorical
    sense. She walked into the Summoning Stage without needing her
    introduction. She went through the Promo in the first scene. She
    went through the mid-tier Stalkers in an afternoon. She declined
    the Dressing Room bargain. She broke the Control Booth's lock.
    She walked out during a Commercial Break. The Network edited the
    season into a highlight reel and pretended she never finished. She
    did. She is Unaired now, and she knows where the Control Booth's
    backdoor is, and she is waiting.
  era: "Seven seasons ago"
  affected_cultures:
    - The Unaired
    - Network Employees
    - Galactic Audience
  cultural_impact: >-
    A ghost story in the Network, a rallying point for the Unaired,
    and a footnote in the official archives. Her name is not said on
    camera. The stagehands call her Wyrm-Breaker. The Host claims not
    to remember her. The editors, however, keep her tape.

- name: The Time the Audience Revolted
  summary: >-
    A three-episode arc from somewhere in the middle seasons. The
    Network's editors have scrubbed it. The fans insist it happened.
    The Unaired confirm it. During sweeps week, a particularly
    charismatic contestant made a direct address to the audience
    camera — something the Host is contractually supposed to prevent.
    The audience did not, as had always been assumed, have only a
    cheer-track relationship with the show. The audience had opinions.
    The opinions were expressed. The next three episodes' ratings
    spiked, then the whole arc vanished from the archives between one
    Tuesday and the next. The contestant is Unaired now, or dead, or
    both, or neither. The story survives as rumor, which is the only
    form the Network cannot delete.
  era: "Middle seasons, unspecified"
  affected_cultures:
    - Galactic Audience
    - The Unaired
  cultural_impact: >-
    The possibility that the audience is not passive is a radical one
    in Network doctrine. Every subsequent Host has been carefully
    coached on preventing direct audience-camera address. This is the
    #2 clause in the contract. The #1 clause is about merchandise.

- name: The Sponsored Messiah
  summary: >-
    A contestant who leaned so hard into her mistaken stage title —
    she had been summoned as the Legendary of Fortune, having in fact
    won only a single office Secret Santa — that she achieved it for
    real, on camera, in front of fourteen billion witnesses, over the
    course of a single impossible season. The sponsors lined up.
    Every scene she entered, a brand found her first. The Host cried
    real tears in the Green Room, twice. She died at the peak of her
    popularity, in the Audience Pit, during a product-placement beat
    that should have been safe. Her merchandise is still the Gift Shop's
    top performer, and her plushie is the one the Network can't keep
    on shelves. Some say the mistaken identity became true. Some say
    the mistaken identity killed her to stay true. Both are said with
    equal conviction and neither is said in public.
  era: "Recent memory"
  affected_cultures:
    - Galactic Audience
    - The Unaired
    - Network Employees
  cultural_impact: >-
    The Sponsored Messiah is the reason mistaken-identity is now a
    known trope in Network production meetings. The bookers have
    since attempted to engineer a repeat, with mixed results. The
    Host keeps her signed headshot in the Dressing Room's drawer,
    next to the other thing he keeps there.

- name: The Gift Shop Anomaly
  summary: >-
    For one season, the Gift Shop stocked merchandise of a contestant
    who had not been summoned yet. A plushie. A t-shirt. A coffee mug
    with her face and a catchphrase she had not invented. Inventory
    flagged the anomaly. Inventory's flag was filed. The merchandise
    sold briskly. When she was finally summoned three seasons later,
    her catchphrase was already in vernacular and she didn't understand
    why the audience laughed before she spoke. The Network issued a
    statement attributing the phenomenon to a production error. The
    Unaired do not accept this. The engineering team does not comment.
  era: "Three seasons ago"
  affected_cultures:
    - The Unaired
    - Network Employees
  cultural_impact: >-
    Evidence — circumstantial, contested, undeniable to those who
    have seen the mugs — that the Summoning Engine's drift may be
    more than a calibration problem. Possibly the algorithm is
    reading from a future it has not yet produced. Possibly the
    merchandise causes the contestant. Neither possibility is
    discussed above a whisper.
