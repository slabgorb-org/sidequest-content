cover_poi: the_summoning_stage
name: Primetime
description: >-
  An ancient, galaxy-spanning television network runs Primetime — the
  universe's highest-rated live-broadcast dungeon crawl. Each season,
  the Network's Summoning Engine reaches across fourteen billion worlds
  and yanks a party of legendary heroes into the arena. The broadcast is
  mandatory viewing. The ratings are religion. The sponsors are hungry.
  The Summoning Engine has been broken for eleven seasons. Its "hero
  metrics" parse a moment's proximity to a dragon as Slayer of the Wyrm.
  Instead of heroes, the portal delivers a goat farmer, a regional sales
  manager, a methane-breathing accountant, and a guy who was in a
  gas-station bathroom when the lights flashed. The Host has to sell it.
  Every episode. The arena is a studio — lighting rigs above, wings at
  the edges, a literal gift shop on every level, and a live audience
  that can be heard but not seen. Contestants didn't consent. Contestants
  can go home. Between those two facts, there is television.

tagline: "We asked for heroes. We got… you. Let's see if we can make it work."

axis_snapshot:
  comedy: 0.95
  gravity: 0.5
  outlook: 0.6

keeper:
  name: "The Host"
  personality: warmly_vicious
  obsession: ratings_and_legacy
  tone_override:
    comedy: 0.98
    gravity: 0.4
  awareness:
    starting: 0
    tick_rate: 1
    stealth_decay: -1
    thresholds:
      "3": "Ratings soft — the Host tightens his smile. An ad slot gets sold cheap."
      "6": "A sponsor calls the booth. The next scene has product placement."
      "10": "Network memo under the door. The Host is reminded that contracts have clauses."
      "15": "Forced Commercial Break. The party is yanked into a sponsor segment mid-stride."
      "20": "Finale mode — the Host goes off-script. Stalkers dispatched. Cameras re-angled for maximum damage."
  monologue_style: >-
    Always on air. Stage-voice even when he shouldn't be using it. Sentences
    structured for applause breaks that aren't coming. Catchphrases deployed
    like weapons: "Let's see what's behind door number DIE!" — "That's gonna
    leave a merchandise opportunity!" — "Folks at home, don't try this at
    home!" — "We're gonna take a quick break, and by 'break,' I mean your
    LEGS!" He loves the contestants. He is also trying to kill them for
    ratings. These are, to him, the same feeling. Occasionally — when the
    Network isn't looking, when the boom mic dips too low to catch it — his
    voice drops half an octave and he forgets to sell the joke. These moments
    never make it to air. The editors catch them. The editors always catch them.
  trap_aesthetic: >-
    Theatrical. Spotlights that stop tracking you at the worst moment.
    Trapdoors under applause-signs. Confetti cannons that fire shrapnel.
    Prop swords that turn out to be real mid-swing. Mock-wedding chapels
    that reveal themselves to be guillotines on the eighth bar of the
    processional. The scenery is built to look dangerous and some of it
    actually is. From certain angles you can see the lighting rigs. From
    certain other angles you can see the rigging that holds the lighting
    rigs. From certain other angles you can see the audience peeking through
    the gap between the set walls. None of this is meant to be reassuring.
  topology_tendency: >-
    Studio-adjacent architecture. The arena has wings, green rooms,
    commercial-break pocket dimensions, a literal gift shop on every level,
    and corridors that occasionally cut away to a weather report. Rooms
    connect by soundstage alley rather than honest corridor. A door marked
    EXIT is never an exit; it opens onto the audience, which is worse. The
    only reliable way out is to win — or to reach the Dressing Room, where
    the Host keeps his real face in a drawer.
