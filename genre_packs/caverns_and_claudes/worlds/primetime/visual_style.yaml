# Primetime — Visual Style
# Overlit television-studio palette. Inverts mawdeep's B&W ink aesthetic.
# The show looks like a show — staged, shiny, obviously produced.

flux_prompt_suffix: >-
  overlit 1980s game show studio, saturated primary colors, harsh key
  lighting, visible overhead lighting rigs and gantries, staged
  tableau composition, slight lens flare, cyclorama walls and
  obvious set seams, sponsored banners and brand logos in background,
  studio audience silhouettes behind a low proscenium wall,
  slightly-too-shiny production design, confetti and applause-sign
  glow, lens flare and spotlight tracking, television broadcast
  composition, Press-Your-Luck-meets-Running-Man set photography

