# Primetime — Portrait Manifest
# Scene-based descriptions for Flux portrait generation.
# Overlit 1980s game-show / Running Man aesthetic per visual_style.yaml.

characters:

  - name: The Host
    role: Celebrity MC, captive performer, the arena's Keeper
    type: npc_major
    appearance: >-
      A tall man in a tailored, slightly-too-shiny teal jumpsuit with
      white piping, posed under three crossing key-light spotlights
      on the Summoning Stage. Early-fifties, network-sculpted jaw,
      teeth too white even for television, hair lacquered into a
      sidepart that does not move. Holding the podium microphone with
      practiced ease. Mid-catchphrase. His smile is perfect. His eyes
      are tired. A brand pin on the jumpsuit's collar. A sponsor
      banner visible in the background corner of frame. Catchlights
      in the eyes from the audience wall. Confetti drifting past.
    culture_aesthetic: >-
      1980s variety-show-host glamour. Slightly-too-shiny jumpsuit.
      Studio spotlights. Podium with a microphone. Audience wall
      behind him. Visible lighting rigs at upper frame edge.
      Confetti residue on the stage floor. Overlit, glossy.

  - name: THE PROMO
    role: Season-opening warm-up Stalker
    type: npc_major
    appearance: >-
      A wiry mid-twenties man in a costume that looked good in
      rehearsal and looks desperate under the arena lights. Purple
      and gold. A cape that is just slightly too large. A prop
      longsword with sponsor decals. Mid-action pose, lunging toward
      camera with earnest conviction. His entrance-music cue is
      plainly audible from the composition's framing. Sweat beading
      on his forehead. Makeup a shade too dark. Smile one hundred and
      ten percent. Stage-center under a single tracking spotlight.
    culture_aesthetic: >-
      Earnest B-movie action-figure marketing. Showy costume. Prop
      weapon. Theatrical spotlight. Sponsor decals on everything.
      Stage-center entrance composition.

  - name: MOTHER-IN-LAW
    role: Mid-tier Stalker, sitcom-horror gimmick
    type: npc_major
    appearance: >-
      An imposing woman in her sixties wearing a 1980s costume-drama
      dress with too much costume jewelry, posed under sitcom-set
      lighting. Handbag clutched in one hand. Expression: perpetual
      light disapproval. A laugh-track halo of sound-wave icons hovers
      suggestively around her head. She is standing in a fake living
      room set with a couch and a coffee table. The audience is
      laughing. She is not.
    culture_aesthetic: >-
      1980s sitcom set dressing. Fake living room. Lighting too warm.
      Costume-drama aesthetic. Handbag and jewelry. Visible laugh-sign
      cue at upper frame edge.

  - name: SUBLIME
    role: Mid-tier Stalker, ice-assassin gimmick
    type: npc_major
    appearance: >-
      A pale woman with short silver hair and a minimalist
      ice-blue bodysuit, posed between two ductwork grates with a
      sparkling ice-shard dagger. A Glacidew™ product display in
      the background. Frost forming along the floor at her feet.
      Expression: composed, amused, patient. A compact mirror in
      the other hand. The key-light is cold and blue, the fill-light
      chilly cyan. She is about to offer skincare advice.
    culture_aesthetic: >-
      Skincare advertisement crossed with spy-thriller stills. Cold
      blue lighting. Ductwork architecture. Product placement visible.
      Frost detail on surfaces.

  - name: BUZZKILL
    role: Mid-tier Stalker, chainsaw-comedy gimmick
    type: npc_major
    appearance: >-
      A seven-foot man in an open-mic-night outfit (blazer over
      t-shirt, dark jeans) holding an idling chainsaw across his
      body. Standing on a comedy-club stage under a single spotlight
      with a microphone stand. Expression: deadpan. The chainsaw
      has a name decal on its bar. The floor is stained.
    culture_aesthetic: >-
      Comedy-club stage photography meets slasher promo. Brick wall
      backdrop. Open mic on stand. Spotlight. Chainsaw menace.
      Blue-collar comedy wardrobe.

  - name: DYNAMO
    role: Mid-tier Stalker, electropop gimmick
    type: npc_major
    appearance: >-
      An eight-foot tall performer in electrified-spandex stage
      costume, mid-dance-move, strobing lights framing him. A
      branded microphone in one hand, fist raised in the other.
      Audience silhouettes behind him. A wall of electric-arc effects
      behind. He is singing. The audience is chanting the chorus.
    culture_aesthetic: >-
      Stadium-pop concert photography. Strobing lights. Electrified
      spandex. Fog machine haze. Synchronized choreography frame.

  - name: AD BREAKS
    role: Mid-tier Stalker, commercial-manifestation gimmick
    type: npc_major
    appearance: >-
      A faceless anthropomorphic advertisement — essentially a
      humanoid figure made of full-screen broadcast static and brand
      logos, posed in the center of a stark white Commercial Break
      pocket dimension. A rotating sponsor banner above. A central
      pedestal with a product. The figure's body is a collage of
      shifting sponsor imagery. No face, only a constantly updating
      SKIP button where the mouth would be.
    culture_aesthetic: >-
      Abstract commercial aesthetic. Stark white background. Full-screen
      takeover composition. Brand collage. Pedestal product display.

  - name: THE LEGAL DEPARTMENT
    role: High-tier Stalker, bureaucracy gimmick
    type: npc_major
    appearance: >-
      A tall suited figure with three professional-headshot faces on
      a single pair of shoulders, each head arguing with the others
      in legalese. Three briefcases open on a conference table before
      them. The suit is charcoal, the ties are silk, the cuff-links
      are engraved with different sub-firm names. A legal pad
      levitating mid-air, updating in real time. Fluorescent
      executive-wing lighting. Expression on all three faces: polite.
    culture_aesthetic: >-
      Corporate-executive press headshot. Conference-room lighting.
      Charcoal suit. Briefcases open. Live-updating paperwork.
      Bureaucratic menace.

  - name: THE FRANCHISE
    role: Finale Stalker, legacy-hero gimmick
    type: npc_major
    appearance: >-
      A weathered man in his fifties in a former-hero outfit that has
      been gently updated with sponsor patches over eleven seasons.
      Standing quietly at the edge of the Dressing Room lighting,
      longsword at rest. No entrance music in the composition — no
      lighting drama, no spotlight, just ordinary stagelight. His
      expression is tired and professional. A small signed perfume
      bottle on a table at his side. The camera catches him in a
      paused moment, not a frozen one.
    culture_aesthetic: >-
      Former-champion reunion photography. Muted lighting. Understated.
      Costume faded. Quiet professional bearing. Dressing room backdrop.

  - name: The Wyrm-Breaker
    role: Leader of the Unaired, actual Slayer of the Wyrm
    type: npc_major
    appearance: >-
      A middle-aged woman with short grey hair, weathered jacket,
      boots, and a well-maintained longsword sheathed at her side.
      Standing in the Soundstage Alley's dim between-sets lighting,
      her back to a half-built kitchen set from a cancelled show.
      Expression: watchful. Eyes that notice lighting rigs. Holding a
      small folded paper in one hand. No stage lighting on her — just
      the ambient work-lamp at the edge of the frame. The only
      contestant the Summoning Engine got right.
    culture_aesthetic: >-
      Off-camera documentary aesthetic. Low warm work-light.
      Utilitarian wardrobe. Cancelled-show set pieces in the
      background. Dust motes in the light.

  - name: Claudine Overton, HR
    role: Network HR field representative
    type: npc_major
    appearance: >-
      A mid-forties woman in a pressed beige suit, clipboard in one
      hand, a pen poised in the other, apparating mid-step into the
      Green Room under the fluorescent lighting. Slight translucency
      at the edges of her silhouette — she has not quite finished
      manifesting. Expression: professional smile, dead eyes. A
      Network-issue pen clipped to the clipboard. A small company
      lapel pin. She is here to deliver paperwork.
    culture_aesthetic: >-
      Corporate HR portraiture under fluorescent light. Beige palette.
      Translucency effect at the edges. Clipboard and pen forward.
      Smile stock-photo warm.

  - name: Shop Steward Grindle
    role: Stagehands Union shop steward
    type: npc_minor
    appearance: >-
      A three-and-a-half-foot-tall kobold with a grease-stained
      apron over coveralls, one working eye, a union pin polished to
      a high shine, and a clipboard. Standing between two lighting
      rigs in a backstage corridor. Expression: assessing. A wrench
      tucked into the apron's belt loop. A pamphlet in one hand,
      offered casually.
    culture_aesthetic: >-
      Blue-collar union steward aesthetic. Backstage corridor lighting.
      Greasy utilitarian wardrobe. Union regalia. Work-environment
      realism.

  - name: Dara of Row 3
    role: Regional superfan, merchandise archivist
    type: npc_minor
    appearance: >-
      A fan in her thirties in a merch-mix outfit specific to the
      current season — a Host-branded t-shirt under a Legendary-of-
      Fortune jacket, plushie backpack, autograph pen around her neck
      on a lanyard. Seated in Row 3 of the audience with a notebook
      open on her lap, recording a detail from the current scene.
      Expression: rapt attention. A camera on the chair next to her,
      red light blinking.
    culture_aesthetic: >-
      Convention-attendee superfan aesthetic. Full merchandise kit.
      Row-3 audience lighting. Notebook and camera. Cheerful
      obsessive energy.

  - name: The Stage PA
    role: Production assistant, ever-harried
    type: npc_minor
    appearance: >-
      A production assistant in their twenties, clipboard in one hand,
      headset on head, mid-stride through the Green Room. Expression:
      harried focus. Coffee cup in the crook of one arm. A pen clipped
      to the clipboard. A pocket of energy bars visible. Fluorescent
      Green Room lighting. A brief smile at the corner of the mouth
      that does not reach the eyes — they are listening to something
      on the headset.
    culture_aesthetic: >-
      Behind-the-scenes production documentary aesthetic. Greenroom
      fluorescents. Clipboard, headset, coffee. Motion-blur energy.

  - name: The Sponsor Product Table
    role: Environmental character — the set itself
    type: creature
    appearance: >-
      A central pedestal in the Commercial Break pocket dimension
      displaying a single sponsor product under a spotlight. A halo
      of shifting brand-logo holograms around it. A small placard
      naming the sponsor, the skip fee, and a disclaimer in microscopic
      font. The pedestal is set to slowly rotate. The background is
      stark white and featureless. The product looks, at first glance,
      useful. At second glance, it still does.
    culture_aesthetic: >-
      Infomercial product photography. Stark white pocket dimension.
      Rotating pedestal. Brand hologram halo. Fine-print placard.
      Product-shot reverence.
