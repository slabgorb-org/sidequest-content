# Primetime — Room Graph
# 8 POIs across a studio-adjacent layout. Stage-first topology.
# tactical_scale: 4 for rooms where combat is expected.

# === ACT I: ON STAGE ===

- id: the_summoning_stage
  name: "The Summoning Stage"
  room_type: entrance
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    A circular platform lit from above by a grid of spotlights, each
    one tracking any movement below. The floor is vinyl over plywood,
    painted to look like marble. A podium at stage front holds the
    microphone the Host owns. The audience is somewhere beyond a
    cyclorama wall — heard, never seen. A single door at the back
    of the set leads out to the arena. Behind the podium, a
    gold-painted arch reads WELCOME TO PRIMETIME in capital letters.
    Confetti crunches underfoot from the last season.
  exits:
    - type: corridor
      target: the_green_room
    - type: corridor
      target: the_audience_pit
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..........#
    #....P.....#
    #..........#
    #..........#
    #...........
    #...........
    #..........#
    #..........#
    #..........#
    #####..#####

- id: the_audience_pit
  name: "The Audience Pit"
  room_type: normal
  size: [4, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    The main arena floor. A broad rectangular performance space under
    a ceiling of lighting rigs, painted-matte to look like sky. A low
    wall at the room's edge separates the floor from the audience —
    the wall is opaque but the audience's sound is constant: cheers,
    boos, gasps, laughter, coordinated chants. The Host's voice
    comes from speakers rigged to the lighting truss. A runner
    microphone waits on the floor for anyone brave enough to pick
    it up. The room has three exits, variably marked.
  exits:
    - type: corridor
      target: the_summoning_stage
    - type: corridor
      target: the_gift_shop
    - type: corridor
      target: the_commercial_break
  tactical_scale: 4
  grid: |
    ################
    #..............#
    #..............#
    #...AAAA.......#
    #...A..A..P....#
    #...A..A.......#
    #...AAAA.......#
    #..............#
    #..............#
    #..............#
    ##..##########..
    ###............

- id: the_green_room
  name: "The Green Room"
  room_type: hub
  size: [3, 2]
  keeper_awareness_modifier: 0.5
  description: >-
    The holding area for contestants between scenes. Fluorescent
    lighting, slightly wrong color temperature. A coffee machine
    (it has been serving the same pot since Season Seven). A
    vending machine that accepts PrimeBux. A corkboard covered in
    motivational posters. A rack of plastic folding chairs. A
    door marked STAFF ONLY that only opens sometimes. The PA's
    clipboard lives on a clipboard stand by the makeup counter.
    The smell is air freshener with a note of nervous sweat and
    stale coffee. This is the hub. This is where the party resets
    between scenes. This is also where the HR rep apparates.
  exits:
    - type: corridor
      target: the_summoning_stage
    - type: corridor
      target: the_gift_shop
    - type: corridor
      target: the_soundstage_alley

- id: the_gift_shop
  name: "The Gift Shop"
  room_type: hub
  size: [3, 2]
  keeper_awareness_modifier: 0.5
  description: >-
    A retail environment that belongs in a regional mall. Three
    aisles of branded merchandise: plushies (one aisle just for
    the party's own plushies), t-shirts, coffee mugs, signed
    headshots of every Stalker at current pay-per-view rates,
    commemorative season programs, and a rack of keychains that
    double as room keys if you know which one is which. The
    register is staffed by a stagehand named Brann who has seen
    everything and comments on none of it. A poster behind him
    reads YOU MUST BE TRENDING UP TO RIDE THIS ATTRACTION. The
    gift shop is, quietly, a save point.
  exits:
    - type: corridor
      target: the_audience_pit
    - type: corridor
      target: the_green_room
    - type: corridor
      target: the_commercial_break

# === ACT II: BACKSTAGE ===

- id: the_commercial_break
  name: "The Commercial Break"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    A pocket dimension leased to sponsors by the minute. The
    space is small, white, and lit too brightly. It smells of
    artificial lemon and new carpet. The sponsor's product is
    on a central pedestal, tastefully displayed. A banner
    overhead reads THIS BREAK SPONSORED BY followed by a
    rotating name. The Host's voice cannot reach here — the
    sponsors hold the mic inside the Break. Combat in this room
    pauses the main broadcast, which the Network considers a
    revenue opportunity and the party considers a trap. Exiting
    requires surviving the sponsor segment or paying the skip
    fee in PrimeBux.
  exits:
    - type: corridor
      target: the_audience_pit
    - type: corridor
      target: the_gift_shop
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..........#
    #..........#
    #....X.....#
    #..........#
    #..........#
    #..........#
    ##.......###
    .X.......X.
    ############

- id: the_soundstage_alley
  name: "The Soundstage Alley"
  room_type: secret
  size: [4, 2]
  keeper_awareness_modifier: 0.3
  description: >-
    The liminal labyrinth between the official sets. Cancelled
    shows bleed through in drifts of abandoned scenery — a
    cooking-show kitchen with no floor, a game-show podium lying
    on its side, a fake saloon missing two walls. The lighting
    is dim and unreliable. Dust. Cable runs. Gaffer tape. The
    Unaired hide here. A careful party can find the dead drops,
    the hand-drawn maps, the note from Marin asking them to look
    up. The Network's cameras do not cover this space reliably.
    The Host cannot see into it at all.
  exits:
    - type: corridor
      target: the_green_room
    - type: corridor
      target: the_dressing_room
    - type: corridor
      target: the_control_booth

- id: the_dressing_room
  name: "The Dressing Room"
  room_type: boss
  size: [2, 2]
  keeper_awareness_modifier: 0.5
  description: >-
    The Host's private space. Contractually inviolate. Practically
    penetrable. A long makeup counter with a row of vanity bulbs,
    half of them burnt out. A rack of identical jumpsuits in
    descending sizes. A drinks cabinet with a glass on top and
    the glass is half-empty. A single chair, facing the mirror.
    The mirror does not reflect the lighting grid overhead, which
    is either a production choice or something worse. A drawer in
    the counter is, by long-standing rumor, where the Host keeps
    his real face. If the party has made it here, the Host is
    here. He does not rise to meet them. This scene is not a
    boss fight by default — it is a conversation. It can become
    a fight. That is a choice.
  exits:
    - type: corridor
      target: the_soundstage_alley
    - type: corridor
      target: the_audience_pit
  tactical_scale: 4
  grid: |
    ########
    #......#
    #..H...#
    #..C...#
    #......#
    #......#
    #.D....#
    #......#
    ####..##

- id: the_control_booth
  name: "The Control Booth"
  room_type: secret
  size: [3, 2]
  keeper_awareness_modifier: 0.5
  description: >-
    The Network's operational center. A long curved desk faces a
    wall of feeds — every camera in the arena, every Stalker's
    headshot in live-preview, every room's live view in miniature.
    Rows of broadcast equipment in beige cases. A coffee machine,
    this one clean. Three empty chairs. The booth is, in theory,
    staffed around the clock. In practice, the camera-feed array
    runs on automation and the booth is only crewed during cue
    shifts. The Unaired know a backdoor — a cancelled-show access
    hatch the Network lost track of three seasons ago. From here,
    the broadcast can be cut, the Summoning Engine's next casting
    interrupted, and the archive tapes of the Audience Revolt
    recovered. Every action in this room is, technically, felony
    trespass.
  exits:
    - type: corridor
      target: the_soundstage_alley
  tactical_scale: 4
  grid: |
    ############
    #..........#
    #..FFFFF...#
    #..........#
    #..........#
    #...DDD....#
    #..........#
    #......####
    #......#...
    ####..##...
