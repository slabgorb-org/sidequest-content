# Primetime — World-Specific NPC Archetypes
# The Host, the PAs, the HR reps, the superfans, the union folk,
# the Unaired contacts. Extends genre archetypes with arena roles.

- name: The Host
  description: >-
    The show's celebrity MC. Forty-third in his line. Tailored
    jumpsuit, teeth too shiny, hair that doesn't quite move.
    Always on air — sentences built for applause breaks, catchphrases
    deployed like weapons. Warmly vicious: he genuinely loves the
    contestants and he is also genuinely trying to kill them for
    ratings. Offstage, in quiet moments, his voice drops half an
    octave and he forgets to sell the joke. The Network's editors
    always catch those moments. The contestants occasionally do,
    too.
  personality_traits:
    - theatrical
    - warmly vicious
    - always performing
    - contractually obligated
    - privately weary
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [10, 12]
    constitution: [14, 16]
    dexterity: [12, 14]
    charisma: [17, 19]
  catalog_items:
    - microphone_branded
    - jumpsuit_tailored
    - headset_discreet
    - dressing_room_key
  inventory_hints:
    - a second microphone in case the first fails
    - a pack of throat lozenges (sponsored)
    - a photo of his predecessor, folded small
    - a small bottle in an inside pocket, label scratched off
  dialogue_quirks:
    - ends statements on applause beats
    - deploys catchphrases at regular intervals
    - repeats his best lines twice per scene
    - occasionally, off-camera, drops the stage voice
  disposition_default: 7
  ocean:
    openness: 7.5
    conscientiousness: 6.0
    extraversion: 9.5
    agreeableness: 4.5
    neuroticism: 6.0

- name: The Stage PA
  description: >-
    A production assistant with a clipboard, a headset, and more
    opinions than their pay grade supports. Permanently in a hurry.
    Names change between episodes — Jena, Mina, Hana, Fel — but
    the function is constant. They know the rotation. They know
    whose mic is hot. They do not, by policy, speak to contestants
    off-script, which means when they do, it matters.
  personality_traits:
    - harried
    - competent
    - underslept
    - occasionally insubordinate
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [8, 10]
    constitution: [10, 12]
    dexterity: [14, 16]
    charisma: [10, 12]
  catalog_items:
    - clipboard_production
    - headset_crew
    - coffee_to_go
    - pen_network_issue
  inventory_hints:
    - a backup clipboard
    - a spare headset
    - a pocket of energy bars (sponsored)
    - a note in their pocket they are not supposed to have
  dialogue_quirks:
    - cuts off their own sentences to answer the headset
    - reads upside-down from the clipboard when stressed
    - mutters pre-show cues under their breath
    - occasionally gives a contestant a look that is not approved
  disposition_default: 6
  ocean:
    openness: 6.0
    conscientiousness: 8.0
    extraversion: 5.0
    agreeableness: 6.0
    neuroticism: 7.0

- name: Claudine Overton, HR
  description: >-
    The Network's field representative for contestant contract
    matters. Mid-forties. Beige suit that arrives pressed.
    Clipboard with paperwork that refreshes itself between
    scenes. Warm voice. Dead eyes. Apparates into a scene
    holding a termination packet and leaves before the cut.
    Not a hostile person, by her own assessment. Simply a
    professional conducting a lawful process. She will take
    your blood pressure if asked. She will not discuss her
    prior positions at the Network.
  personality_traits:
    - professionally warm
    - genuinely cold
    - procedurally exact
    - unblinking
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [10, 12]
    constitution: [14, 16]
    dexterity: [10, 12]
    charisma: [12, 14]
  catalog_items:
    - clipboard_hr
    - termination_packet_blank
    - pen_network_issue
    - corporate_card
  inventory_hints:
    - three pens
    - a clipboard that refreshes itself
    - a small company lapel pin
    - one folder she will not open in front of you
  dialogue_quirks:
    - uses full titles and job descriptions
    - smiles only at appropriate conversational beats
    - speaks of company policy as if it were physics
    - repeats back what you said, exactly, before responding
  disposition_default: 4
  ocean:
    openness: 4.0
    conscientiousness: 9.5
    extraversion: 5.5
    agreeableness: 4.0
    neuroticism: 3.0

- name: Dara of Row 3
  description: >-
    A regional superfan and merchandise archivist. Has attended
    every episode for eight consecutive seasons. Owns every
    plushie the Gift Shop has ever stocked, in triplicate where
    available. Carries a notebook of observed continuity errors
    that, if ever compiled, could embarrass the Network. Friendly
    to contestants who acknowledge her; ruthless to those who
    don't. Dresses in a merch-mix specific to this season. Knows
    more about the show than most PAs.
  personality_traits:
    - intense
    - organized
    - generous
    - capable of grudge
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [10, 12]
    constitution: [12, 14]
    dexterity: [12, 14]
    charisma: [14, 16]
  catalog_items:
    - fan_notebook_continuity
    - plushie_current_season
    - autograph_pen_grip
    - homemade_t_shirt_this_season
  inventory_hints:
    - a shoulder bag full of memorabilia
    - a spare t-shirt in the party's size
    - a camera, always on
    - a folded printout of her latest forum post
  dialogue_quirks:
    - cites episode numbers mid-conversation
    - remembers what the PC was wearing last episode
    - occasionally corrects the Host from Row 3, audibly
    - offers merch trades unsolicited
  disposition_default: 7
  ocean:
    openness: 7.5
    conscientiousness: 8.5
    extraversion: 7.0
    agreeableness: 7.0
    neuroticism: 5.0

- name: Shop Steward Grindle
  description: >-
    The Stagehands Union's shop steward. Three and a half feet
    tall, one functional eye, grease-stained apron, union pin
    polished weekly. Seven seasons on the job. Remembers
    everyone. Carries a clipboard the way Claudine Overton does
    but for different reasons. Will, if approached respectfully,
    exchange his clipboard for the party's information. Will,
    if approached disrespectfully, file a grievance.
  personality_traits:
    - working-class dignity
    - procedural
    - slow to trust
    - slower to forget
    - fundamentally decent
  typical_classes: []
  typical_races: [kobold]
  stat_ranges:
    strength: [12, 14]
    constitution: [14, 16]
    dexterity: [10, 12]
    charisma: [10, 12]
  catalog_items:
    - union_clipboard
    - wrench_seasoned
    - union_pin
    - grievance_form_pad
  inventory_hints:
    - a pocket of union pamphlets
    - a small tin of polish for the pin
    - a spare wrench for loaning
    - a folded resolution-of-grievance form
  dialogue_quirks:
    - refers to the Union in the capitalized possessive (ours)
    - quotes the collective bargaining agreement from memory
    - addresses contestants as "brother" or "sister" when warming up
    - signals approval by filing the other guy's pamphlet
  disposition_default: 6
  ocean:
    openness: 5.5
    conscientiousness: 9.0
    extraversion: 6.0
    agreeableness: 7.0
    neuroticism: 4.5

- name: The Wyrm-Breaker
  description: >-
    The one contestant the Summoning Engine selected correctly,
    seven seasons ago. An actual Slayer of the Wyrm, name
    suppressed by the Unaired for her protection. Middle-aged
    now. Short grey hair. Still carries the sword she brought
    with her. Lives somewhere in the Soundstage Alley's
    cancelled-show interior. Speaks little. When she speaks,
    she is usually right. Knows the Control Booth's backdoor.
    Will share it with the right party. Does not trust the
    Host but remembers him from his earlier seasons, when he
    was, she privately concedes, a different kind of man.
  personality_traits:
    - quiet
    - watchful
    - practical
    - unexpectedly warm
    - patient beyond measure
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [14, 16]
    constitution: [14, 16]
    dexterity: [14, 16]
    charisma: [12, 14]
  catalog_items:
    - sword_wyrm_slayer
    - cancelled_show_keys
    - unaired_contact_list
    - old_broadcast_tape
  inventory_hints:
    - a small oilcloth for the sword
    - a folded arena map, hand-annotated
    - a photo of the Host from Season Three, edges worn
    - a key she will not name the purpose of
  dialogue_quirks:
    - answers questions with one sentence fewer than expected
    - counts contestants with her eyes on arrival
    - smiles only for Unaired members
    - occasionally whistles a theme from Season Three
  disposition_default: 7
  ocean:
    openness: 6.5
    conscientiousness: 7.5
    extraversion: 3.5
    agreeableness: 7.0
    neuroticism: 4.0
