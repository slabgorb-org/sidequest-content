# Primetime — Factions
# Five forces shape the arena and its inhabitants.
# Asymmetric by design: one corporate, one monstrous, one service,
# one populist, one resistance.

factions:

  - name: The Network
    description: >-
      The faceless corporate entity that owns Primetime and, by quiet
      clause in the member-world treaties, most of the air. It has no
      known leadership, no visible office, and no accountable
      individual. It communicates through memos that appear under
      doors that nobody saw shut. Its HR representatives apparate into
      scenes, deliver a clause, and leave before the cut. The Network
      does not negotiate — it files. Weaponry is ineffective against
      it. Only a loophole can.
    goal: >-
      Maintain the show. Protect the brand. Meet quarterly viewership
      targets. Silence anyone who notices that the Summoning Engine
      has been broken for eleven seasons. Extend the franchise into
      the nineteen as-yet-unreached member worlds.
    urgency: eternal
    scene_event: >-
      An HR representative apparates into the Green Room holding a
      clipboard and a fixed smile. The clipboard contains an
      addendum to the contract. A pen is offered. The pen is not a
      weapon but it is, in its own way, a threat.
    disposition_to_players: hostile
    resources:
      - Memos (persuasive, binding, occasionally retroactive)
      - NDAs (generous, onerous, full of unreadable fine print)
      - HR Representatives (apparitional, administrative, polite)
      - The Summoning Engine (broken, functional, technically under warranty)
      - The Control Booth (monitored, operational, not to be entered)
      - The Sponsors (tiered, aligned, occasionally autonomous)
    key_npcs:
      - name: The Vice President of Ratings
        role: Corporate executive, never seen in person
        description: >-
          Signs every memo in a hand so neat it looks stamped. Has
          never been photographed. Is rumored to have a face but
          the rumor does not specify where. Has the power to cancel
          a Stalker and the budget to recast one. Sometimes quoted
          in the Gift Shop promotional materials.
      - name: Claudine Overton, HR
        role: Field representative for contestant contract matters
        description: >-
          Mid-forties, beige suit, clipboard that refreshes itself
          between scenes. Warm voice. Dead eyes. Smiles when she is
          supposed to smile and only then. Carries a standard-issue
          termination packet in an inside pocket. The packet is
          blank. She fills it in when she needs to.
      - name: The Anonymous Memo-Writer
        role: Author of every memo the Network has ever sent
        description: >-
          May or may not be a single person. May or may not be a
          department. May or may not be a procedural output with
          no author. The memos are in a consistent voice. The
          consistent voice has, in moments, sounded like the
          speaker is tired.

  - name: The Stalkers
    description: >-
      The celebrity themed killer-monsters of Primetime. Named,
      merchandised, sponsored, and on rotation. Each Stalker has a
      signature gimmick, a catchphrase, entrance music, and a
      pay-per-view contract. They are the mid-to-high tier threat in
      the arena. Between takes they occupy their own green rooms,
      complete riders, and — in the case of the more established
      Stalkers — small entourages. The Franchise has a chiropractor
      on retainer. THE LEGAL DEPARTMENT has a publicist.
    goal: >-
      Perform their role. Hit their marks. Kill the contestants in
      a compelling, merchandisable way or be killed in a way that
      generates good clips. Maintain their brand across seasons.
      Negotiate better billing, where possible. A few — notably
      The Franchise — have begun to resent the routine and are
      considering their options.
    urgency: seasonal
    scene_event: >-
      The lights dim. Entrance music begins. A spotlight finds the
      edge of the set. A Stalker steps into frame exactly on the
      beat. The audience loses their mind. The party has five
      seconds before the attack sequence begins.
    disposition_to_players: hostile
    resources:
      - Signature weapons (themed, real, brand-licensed)
      - Sponsored abilities (gimmicks with ad placement baked in)
      - Entrance music (morale effects)
      - Merchandise lines (financial leverage, long-game continuity)
      - Personal stagehand crews (reset traps, assist with costume changes)
    key_npcs:
      - name: THE PROMO
        role: Season-opening warm-up Stalker
        description: >-
          See creatures.yaml. He is trying very hard. He is
          contractually obligated to lose. He may or may not know this.
      - name: SUBLIME
        role: Mid-tier Stalker, ice-assassin gimmick
        description: See creatures.yaml.
      - name: MOTHER-IN-LAW
        role: Mid-tier Stalker, sitcom-horror gimmick
        description: See creatures.yaml.
      - name: BUZZKILL
        role: Mid-tier Stalker, chainsaw-comedy gimmick
        description: See creatures.yaml.
      - name: DYNAMO
        role: Mid-tier Stalker, electropop gimmick
        description: See creatures.yaml.
      - name: AD BREAKS
        role: Mid-tier Stalker, commercial-manifestation gimmick
        description: See creatures.yaml.
      - name: THE LEGAL DEPARTMENT
        role: High-tier Stalker, bureaucracy gimmick
        description: See creatures.yaml.
      - name: THE FRANCHISE
        role: Finale Stalker, legacy-hero gimmick
        description: See creatures.yaml.

  - name: The Stagehands Union
    description: >-
      The goblins, kobolds, and other short-tempered technicians who
      reset traps between takes, rig the lighting, paint the set
      walls, repair the props, drag dead contestants off-camera, and
      — critically — are unionized. They have a shop steward, a
      grievance procedure, and a strike fund. They are largely
      indifferent to contestants who respect the work. They are
      actively helpful to contestants who tip. They are actively
      hostile to contestants who insult the union, break things
      without asking, or try to pay below scale.
    goal: >-
      Get through the shift. Meet the break rota. Extract fair
      compensation for dangerous working conditions. Keep the show
      running without getting hurt. Rebuild the pension fund, which
      was raided in season eighteen and has never been repaid.
      Possibly — in the longer view — organize with the Unaired.
    urgency: procedural
    scene_event: >-
      A Stagehand crew enters the scene with lunch pails and resets
      the traps. One of them gives the party a long, unreadable look.
      Another one quietly hands the party's thief a pamphlet about
      safe workplace conduct and then walks away before it can be
      acknowledged.
    disposition_to_players: neutral
    resources:
      - Knowledge of how the traps actually work
      - Access to the backstage corridors and stagehand-only doors
      - Pamphlets (union literature, safety notices, grievance forms)
      - Unofficial merchandise (bootleg plushies, off-brand t-shirts)
      - The Grievance Procedure (slow, formal, occasionally load-bearing)
    key_npcs:
      - name: Shop Steward Grindle
        role: Union representative, veteran kobold
        description: >-
          Three and a half feet tall, one functional eye, grease-
          stained apron, union pin polished weekly. Carries a
          clipboard of his own and will, if approached correctly,
          exchange it for the party's information. Has been shop
          steward for seven seasons. Remembers everyone.
      - name: Tibbs the Trap-Resetter
        role: Goblin technician, apprentice-tier
        description: >-
          Young. Eager. Sells information cheap. Can be turned into
          a reliable asset with a small investment of PrimeBux and
          a basic demonstration of not being an asshole.
      - name: Marthuur the Gaffer
        role: Lighting rigger, ogre-descended
        description: >-
          Nine feet tall, speaks in a near-whisper, controls which
          spotlights find which party member. A subtle ally if
          respected. A lighting problem if not.

  - name: The Fans
    description: >-
      The live studio audience, heard constantly and seen only in
      flickers through the seams of the set walls. They are not one
      mass — they are a shifting coalition of fan cohorts, superfans,
      merch collectors, hecklers, first-row regulars, and
      professionally-paid claques. Their mood is measurable, their
      allegiance is negotiable, and their attention is the currency
      the show actually runs on. Behavior is gated by the current
      week's ratings trend.
    goal: >-
      Be entertained. Be seen being entertained. Influence the show
      — their cheers and boos can move the needle. Collect
      merchandise. Establish pecking orders in their cohort. Some
      want the party to win; some want them to die spectacularly;
      all want a reason to stand up and shout.
    urgency: immediate
    scene_event: >-
      A fan swarm breaks the security line and rushes the set for
      selfies, proposals of marriage, autographs, or in rarer cases
      pitchforks. The Host waves them back with both hands and a
      practiced smile. Security stagehands converge. The party has
      thirty seconds to decide whether to engage.
    disposition_to_players: variable
    resources:
      - Cheers and boos (measurable audience response, mechanically meaningful)
      - The claque (professional fans who cheer on cue, for a fee)
      - Fan mail (occasionally useful intelligence)
      - Row 3 (a semi-fortified superfan position near the Gift Shop)
      - Cosplay (sometimes good enough to pass as a party member)
    key_npcs:
      - name: Dara of Row 3
        role: Regional superfan, merchandise archivist
        description: >-
          Has attended every episode for the past eight seasons.
          Owns every plushie the Gift Shop has ever stocked.
          Carries a notebook of observed continuity errors that,
          if ever compiled, could embarrass the Network. Friendly
          to contestants who acknowledge her. Ruthless to those
          who don't.
      - name: The Heckler
        role: Unidentified fan with a voice that carries
        description: >-
          Has been heckling from somewhere in the Audience Pit for
          at least six seasons. Never identified. Contractually
          protected — the Network refuses to remove him on the
          grounds that his heckling is good television. His
          targets notice that his timing is very, very precise.
      - name: The Claque Captain
        role: Lead professional cheerleader
        description: >-
          Runs a crew of paid-per-cheer fans. Can be hired to
          flip a crowd's mood for a price. Currency: PrimeBux.
          Quality: variable.

  - name: The Unaired
    description: >-
      The resistance. Former contestants who survived their seasons
      and went off-grid. A thin, paranoid, competent network of
      fugitives hiding in the Soundstage Alley — the labyrinth of
      cancelled sets, abandoned props, and backdoors the Network
      has lost track of. They are few. They are careful. They have
      opinions about the Network, the Host, the Summoning Engine,
      and the long arc of the show. They are trying to leak the
      master broadcast tapes to a galaxy that would rather not
      believe them. They are, quietly, waiting for the right season
      and the right party to reach them.
    goal: >-
      Leak the full archive. Expose the Network's administrative
      reach. Free the current Host from his contract (some of them
      believe this; others don't). Rescue future contestants before
      they're summoned, by breaking the Summoning Engine. Keep each
      other alive.
    urgency: patient
    scene_event: >-
      A cancelled-show prop in the Soundstage Alley turns out to be
      occupied. A note appears in the party's Green Room that
      nobody delivered. A Stagehand leaves a pamphlet the party
      didn't ask for. A door the party never noticed is ajar.
    disposition_to_players: friendly
    resources:
      - Maps of the Soundstage Alley (accurate, annotated)
      - Knowledge of the Control Booth's backdoors (one only)
      - The Wyrm-Breaker (their leader, their legend, their best fighter)
      - Dead-drop network in abandoned gift shops
      - The full recording of the Audience Revolt (on original media)
    key_npcs:
      - name: The Wyrm-Breaker
        role: Leader of the Unaired, actual Slayer of the Wyrm
        description: >-
          The one contestant the Summoning Engine got right, seven
          seasons ago. Middle-aged now. Short grey hair. Still
          carries the sword she brought with her. Speaks little.
          When she speaks, people listen, including the Host, on
          the rare recordings where they appeared together. She
          knows the Control Booth's backdoor. She will share it
          with the right party.
      - name: Rook (cancelled-show stagehand)
        role: Unaired quartermaster, former Stagehand defector
        description: >-
          Left the Union three seasons ago after the strike
          failed. Knows the arena's infrastructure inside out.
          Keeps the Unaired supplied. Trusts nobody but the
          Wyrm-Breaker.
      - name: Marin (former PA who went off-script)
        role: Unaired communications, former production assistant
        description: >-
          Was a PA for twelve seasons before she witnessed
          something she wasn't supposed to see and didn't sign
          the NDA fast enough. Went off-script. Has been off-grid
          since. Runs the dead-drop network. Knows every
          cancelled-show door. Does not trust the Host.
