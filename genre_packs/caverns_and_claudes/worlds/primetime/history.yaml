# Primetime — Campaign Progression
# Party progression through a season of the show.
# Structured to match HistoryChapter schema: id, label, lore[], session_range

chapters:
  - id: fresh
    label: "Season Premiere"
    session_range: [1, 3]
    lore:
      - >-
        The party has just been summoned. The Host's introduction still
        rings in their ears. Their stage titles still make them flinch.
        The audience is intrigued — fresh faces, unknown deeds, maximum
        marketing upside. The Network's analytics department is running
        projections. The sponsors are watching carefully.
      - >-
        This is the tutorial arc. The Promo — the season's opening
        Stalker — is the first real threat. He is trying very hard and
        he is, by design, going to die. The party's handling of him
        sets the tone for the season. Crushing him pleases the crowd;
        being kind to him pleases the editors.
      - >-
        The Green Room is the party's hub. Styrofoam coffee. A vending
        machine that accepts PrimeBux. Motivational posters that loop
        slogans you will come to hate. A production assistant who keeps
        a clipboard and too many opinions. The party has no gear beyond
        what they were holding when the portal took them.
      - >-
        Morale is high for the audience and low for the contestants.
        Nobody has died on camera yet. The Host is especially polished
        in these early episodes — he knows the first impression sells
        the season.
    location: "The Summoning Stage"
    time_of_day: showtime
    atmosphere: >-
      Disoriented dread played for laughs. The party is off-balance,
      the audience is leaning forward, and the Host is at full power.
      Everyone is finding their marks.
    points_of_interest:
      - name: The Summoning Stage
        slug: the_summoning_stage
        region: the_summoning_stage
        type: entrance
        description: >-
          The intake. Spotlights track anyone who moves. A podium with
          a microphone the Host owns. A door at the back of the set
          that opens onto the arena.
      - name: The Green Room
        slug: the_green_room
        region: the_green_room
        type: hub
        description: >-
          Holding area for contestants between scenes. Coffee machine,
          vending machine, PA with clipboard, posters with slogans.
          Smells of air freshener and nervous sweat.

  - id: early
    label: "Building the Audience"
    session_range: [4, 8]
    lore:
      - >-
        The party has survived the Premiere. Word is getting out. A
        small fan cohort has formed — Row 3 regulars, superfans who
        watched the Premiere twice, merch collectors with opinions on
        the party's aesthetic. Trending is sideways, which is better
        than it sounds.
      - >-
        Mid-pack Stalkers begin to cycle into the party's scene
        rotation. SUBLIME whispers from ductwork. MOTHER-IN-LAW's
        laugh track can be heard through two set walls. The audience
        is being primed for a rotating menagerie; the network's
        bookers are pleased.
      - >-
        The first Commercial Break arrives unannounced. The party is
        yanked mid-stride into a sponsor's pocket dimension. They
        either survive the sponsor segment or pay the skip fee. Either
        way, the sponsor gets the slot they paid for.
      - >-
        The Gift Shop becomes a tactical resource. PrimeBux begin to
        accumulate. The party learns that purchasing a plushie of
        themselves stabilizes the run. Some members resist the
        commodification. Some lean in and start doing catchphrases.
        The audience can tell the difference. So can the editors.
      - >-
        Rumors of the Unaired begin to reach the party through
        Stagehand gossip and cryptic graffiti on the back of set walls.
        Someone named Wyrm-Breaker is mentioned. No one is willing to
        say her actual name on camera.
    location: "The Audience Pit and the soundstage adjacencies"
    time_of_day: live
    atmosphere: >-
      Routine dressed up as spectacle. The contestants are learning
      the rhythm of the show. The show is learning the contestants.
      Every scene has a commercial break breathing down its neck.
    points_of_interest:
      - name: The Audience Pit
        slug: the_audience_pit
        region: the_audience_pit
        type: normal
        description: >-
          The live-broadcast arena floor. The audience is heard but
          not seen — a chorus of cheers, boos, laughter, and the
          occasional coordinated chant. The Host's mic is always on.
      - name: The Gift Shop
        slug: the_gift_shop
        region: the_gift_shop
        type: hub
        description: >-
          Merch retail cum save point. A register staffed by a
          stagehand who has been at the register for eleven seasons
          and has seen everything.
      - name: The Commercial Break
        slug: the_commercial_break
        region: the_commercial_break
        type: normal
        description: >-
          A pocket dimension rented by sponsors. The party is dragged
          in mid-scene. The sponsor greets them by name.

  - id: mid
    label: "Sweeps Week"
    session_range: [9, 15]
    lore:
      - >-
        The party is officially a brand. Trending is up and the
        analytics department has shifted them from "developing story"
        to "current property." Their likenesses are in the Gift Shop.
        Their catchphrases are in the vending machines. Their deaths,
        should they occur, are now worth considerably more.
      - >-
        Serious Stalkers enter the rotation. BUZZKILL's chainsaw
        idles in the wings. DYNAMO's entrance music has been heard.
        AD BREAKS has begun manifesting uninvited. The Network's
        analytics have noted that the party is most exciting when
        paired with a Stalker they visibly dislike; the bookers are
        adjusting the rotation to maximize friction.
      - >-
        The Fans have turned rabid. Fan Ambushes become a regular
        hazard — superfans rushing the set for selfies, proposals of
        marriage, unsolicited advice. Row 3 has fortified a position
        near the Gift Shop.
      - >-
        The Unaired reach out. A cancelled-show stagehand leaves a
        note in the party's Green Room. The message is terse and the
        handwriting is old. Following up is a choice.
      - >-
        The Host is spending more time on air and less time off it.
        His rehearsed spontaneity has an edge. He is watching the
        party closely. He has noticed the algorithm anomalies. He
        has not yet understood what he has noticed.
    location: "The Gift Shop and the backstage rotation"
    time_of_day: showtime
    atmosphere: >-
      Professional television. The party is moving through their
      routines with confidence. The Network is pushing harder. The
      sponsors are spending more. The audience wants a climax.
    points_of_interest:
      - name: The Soundstage Alley
        slug: the_soundstage_alley
        region: the_soundstage_alley
        type: secret
        description: >-
          Liminal labyrinth of cancelled sets and abandoned props.
          Where the Unaired hide. Reachable only through specific
          wrong-turns.

  - id: veteran
    label: "The Season Finale"
    session_range: [16, 25]
    lore:
      - >-
        The party has become legitimately beloved. Their mistaken
        identities have, through sheer time-on-camera, begun to seem
        true. The audience has made peace with the goat farmer being
        the Slayer of the Wyrm. The algorithm's drift has, by
        accident, produced something close to the desired result.
      - >-
        Late-tier Stalkers are unleashed. THE LEGAL DEPARTMENT's
        briefcases snap open. THE FRANCHISE has been spotted in the
        wings, tired, watching. He has been watching all season.
        He has opinions.
      - >-
        The Dressing Room becomes reachable. The Host is there, or
        can be there, at the party's discretion. He is not at his
        podium. He is drinking. His face does not sit right at this
        range. A bargain is on the table. It is a different kind of
        conversation.
      - >-
        The Control Booth remains the Network's territory. The
        Unaired know a way in. Whether the party has earned that
        knowledge is a function of which relationships they have
        cultivated.
      - >-
        Winning is possible. Going home is possible. Leaving on terms
        the Network did not approve of is possible if the party is
        willing to read a great deal of fine print out loud and
        sign it in the correct order in front of a live audience.
        The Network has not anticipated this. The Network has
        anticipated many things but not this.
    location: "The Dressing Room, the Control Booth, the backstage interior"
    time_of_day: finale
    atmosphere: >-
      Valedictory. The show is wrapping. The audience is on the edge
      of their seats. The Host is either going to cry real tears or
      sign a new contract or both. The party's choices matter in a
      way they haven't before.
    points_of_interest:
      - name: The Dressing Room
        slug: the_dressing_room
        region: the_dressing_room
        type: boss
        description: >-
          The Host's private space. Contractually, inviolate.
          Practically, penetrable. A dressing-table lit by vanity
          bulbs. A drinks cabinet. A drawer that is, by longstanding
          local rumor, where he keeps his real face.
      - name: The Control Booth
        slug: the_control_booth
        region: the_control_booth
        type: secret
        description: >-
          The Network's operational center. Monitors. Switchboards.
          A wall of feeds covering every camera in the arena. Reachable
          only through the Unaired's knowledge of the cancelled-show
          backdoors.
