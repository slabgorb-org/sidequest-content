# Primetime — Pacing Configuration
# Ratings-aware escalation. Three acts mapped to the zone progression.
# Commercial-break cadence is every 7-12 scenes (roll internally).
#
# The tension architecture follows a three-act television structure:
#   Act 1 (On Stage): The Premiere — charming, overlit, paced fast for
#          audience retention. Low lethality, high visibility. Tutorial
#          tier. The Host is at full power.
#   Act 2 (Backstage Rotation): Sweeps — mid-tier Stalkers, sponsor
#          pressure, audience pickup. Tension pickup through rotating
#          threats and commercial interruptions.
#   Act 3 (Executive Wing): The Finale — the mask slips, the Network
#          tightens, the bargain opens. Tension variable, stakes clearer.

sentence_delivery_min: 0.35
streaming_delivery_min: 0.75
escalation_streak: 3

# commercial_break_cadence: every 7-12 scenes (honored by the commercial_break trope)

levels:

  - id: level_1_stage
    name: "On Stage (Act I)"
    pacing_mode: spectacle
    beat_tempo: fast
    description: >-
      Act I is the Premiere. Bright lighting, fast camera cuts, audience
      primed for maximum engagement. The Host is operating at full
      charisma — his warmth is actually convincing at this tier, and
      the mistaken-identity titles land on an audience ready to
      believe. Combat is showy rather than lethal. Product placement
      is soft. The Promo arrives on cue. The tempo is deliberate and
      quick: keep scenes short, cut on decisions, smash-cut to the
      next beat.
    narrator_guidance: >-
      Cut fast. Every paragraph is a shot. Open on establishing
      detail, land on a decision, cut away. The Host's voice is in
      the scene constantly — describe his presence without
      necessarily quoting him every time. The audience is audible
      as a chorus — use it for emphasis. Lean into the overlit
      aesthetic: spotlights track PCs, camera crews pan, the
      applause sign flickers in the corner of vision. Establish
      mistaken identity early. Let PCs feel the gap between their
      real self and their stage title. Don't linger on dread —
      this is variety-show tempo, and dread is a Sweeps concern.
      When in doubt, introduce a sponsor.
    tension_range: [0.3, 0.6]
    resource_pressure: low
    combat_frequency: moderate
    exploration_weight: 0.4

  - id: level_2_arena
    name: "Backstage Rotation (Act II)"
    pacing_mode: escalating
    beat_tempo: fast
    description: >-
      Act II is Sweeps. Mid-tier Stalkers rotate through scenes, each
      with their own entrance and each trying to earn their slot. The
      audience is restless — they want a climax. Sponsor pressure
      increases; every scene has a sponsor mention and every third
      scene has a product. Commercial Breaks begin landing without
      warning. The Host is working harder now, and the party is
      expected to hold the screen. This is the show's working middle:
      dangerous but ratings-rewarding.
    narrator_guidance: >-
      Maintain fast tempo, but introduce friction. Stalker entrances
      are setpieces — describe the music cue, the lighting shift,
      the audience hush. Sponsor interventions should feel organic —
      a branded product in a scene's background before it's a plot
      point. Commercial Breaks are scene-pauses — drop tempo briefly
      when they fire, then snap back. Introduce Unaired rumor here —
      a pamphlet in the Green Room, a note that wasn't delivered.
      The party should feel watched. The camera should feel close.
      The Host should start to edge into the scene rather than
      simply announce it.
    tension_range: [0.5, 0.8]
    resource_pressure: moderate
    combat_frequency: frequent
    exploration_weight: 0.5

  - id: level_3_backstage
    name: "Executive Wing (Act III)"
    pacing_mode: revelatory
    beat_tempo: variable
    description: >-
      Act III is the Finale. Tempo varies — the Network's late-game
      enforcement (HR Suits, THE LEGAL DEPARTMENT) creates
      high-tension set-pieces, but the Dressing Room scene is
      deliberately slow and intimate. THE FRANCHISE's silent
      entrance breaks tempo entirely. The audience is on the edge
      of their seats. The Host's mask slips in private moments.
      The party's choices begin to produce consequences that are
      narrative rather than mechanical. The bargain opens. The
      backdoor is findable. The season ends four ways, depending on
      what the party has built.
    narrator_guidance: >-
      Slow down for the Dressing Room. Speed up for the Suits.
      Silence for THE FRANCHISE. Let quiet scenes breathe — the
      party's earned it. Describe the seams of the set in Act III —
      the lighting rigs are visible from here, the audience wall
      seams let in glimpses, the Control Booth's backdoor is
      findable to the observant. The Host, privately, is a different
      man. His catchphrases land less perfectly. His cope is
      thinning. Let the PCs see what the editors always cut. If the
      party reaches the Control Booth, handle it like a heist —
      intimate, methodical, high-stakes. If they win, let them win
      loudly. If they bargain, let it feel earned.
    tension_range: [0.4, 0.9]
    resource_pressure: variable
    combat_frequency: variable
    exploration_weight: 0.4
