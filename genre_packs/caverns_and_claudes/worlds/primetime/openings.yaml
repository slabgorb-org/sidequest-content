# Primetime — Session Openings
# Five variants for the summoning-flash opening beat.
# Pattern: mundane moment → summoning flash → mistaken-identity announcement → doors open.

- id: the_prescription
  archetype: summoning
  situation: >-
    The party has just been summoned mid-errand. One PC was picking
    up a prescription. Another was about to board a commuter tram.
    A third was halfway through a lukewarm coffee. None of them
    know each other. None of them consented to this. All of them
    are now standing on the Summoning Stage under spotlights, with
    a man in a tailored jumpsuit introducing them to an audience
    of fourteen billion.
  tone: disoriented bafflement played for the audience's delight
  avoid:
    - premature reveal of the Host's private side
    - introducing any Stalker before the doors open
    - explaining the Network in Scene 1 (it's a discoverable)
    - letting players suspect the broken algorithm in the opener
  first_turn_seed: >-
    You were picking up a prescription. You don't remember what for.
    There was a flash, a sound like a laugh track played backward,
    and then a hand — too many fingers — placed a clipboard in
    yours. Spotlights. Applause. A man with teeth like a tax audit
    and hair like a promise says, "PLEASE welcome, from a planet I'm
    not even going to try to pronounce — our LEGENDARY SLAYER OF THE
    WYRM!" You have never seen a wyrm. The applause is deafening.
    Someone in the wings is whispering urgently into a headset. The
    other contestants on the stage are looking at you, at each other,
    at the audience wall, at their own hands. No one is from the
    same planet. One of them is breathing what smells like methane.
    The Host is not finished. He is introducing the next one now.
    The doors at the back of the set are beginning to open.

- id: mid_shift
  archetype: summoning
  situation: >-
    A PC was at work — night shift, warehouse, security desk,
    hospital intake, cleaning crew. The other PCs were elsewhere,
    but the summoning has brought them here. The Host introduces
    them as Walker Between Worlds — a title the algorithm generated
    from "works third shift."
  tone: exhausted confusion, wry
  avoid:
    - resolving the mistaken identity immediately
    - giving the PC time to explain what they actually do
    - letting the Host stop his monologue for a character beat
  first_turn_seed: >-
    You were on shift. You do not remember clocking in. You do
    remember the coffee was bad and the fluorescent lighting was
    humming, and then it was humming louder, and then there was a
    flash, and then there were spotlights, and now there is a man
    at a podium telling a cheering audience of fourteen billion that
    you are the WALKER BETWEEN WORLDS. You were walking, sure.
    Between floors. On your way to the vending machine. The other
    contestants look as wrong-footed as you. One of them is still
    holding a sandwich. The Host introduces the next contestant by
    a title you have not had time to process. The sandwich-holder
    meets your eyes and whispers, "are we in a commercial?" You
    hear your own voice answer: "I don't know."

- id: the_argument
  archetype: summoning
  situation: >-
    The PC was mid-argument with a supervisor, a manager, a
    landlord, or a bureaucrat. The Host introduces them as Defier
    of Tyrants — a title the algorithm extracted from the word
    "unreasonable" in the conversation. The PC is primed for
    conflict and the audience picks up on it immediately.
  tone: righteous confusion, combustible
  avoid:
    - letting the PC reveal the argument's actual subject
    - introducing the Host's cope too early
    - letting a Stalker crash the opening
  first_turn_seed: >-
    You were telling your manager exactly what you thought. You had
    been building to it for a week. The words were good. The timing
    was finally right. You were three sentences in and you were
    winning. Then the light changed, and the floor was a stage, and
    the manager was gone, and there was an audience applauding.
    A man in a jumpsuit says, "from a world that has clearly wronged
    them — our DEFIER OF TYRANTS!" The applause hits you like a
    thrown drink. Your hands are still up. Your speech is still
    half-formed on your tongue. Someone in the audience yells "GET
    HIM." You do not know who "him" is. Other contestants have been
    summoned beside you, each one wearing a different species of
    confusion. The Host's microphone swings toward a short contestant
    with what looks like a very old sword. He introduces her as the
    party's leader. She has not volunteered for this.

- id: the_picnic
  archetype: summoning
  situation: >-
    The PC was having a genuinely good day. A picnic, a walk, a
    first date, a morning with good light. The Host introduces
    them as something absurdly martial. The tone contrast is the
    joke — a perfectly nice day followed by a broadcast dungeon.
  tone: nostalgic yearning played against spectacle
  avoid:
    - cheapening the nice moment in narration
    - making the PC feel punished for having a good day
    - interrupting with combat in Scene 1
  first_turn_seed: >-
    The light was right. You remember that. The light was right
    and someone next to you was laughing, and you were about to
    say something you'd been saving. Then the flash. A sound like
    a laugh track played backward. Spotlights. A man in a jumpsuit
    announces you to an audience that is not the audience you
    wanted. "Please welcome," he says, "a warrior of unknown
    aspect — our CRUSHER OF HEAVEN!" You have crushed nothing. You
    were, a moment ago, happy. The person who was laughing is not
    here. The other contestants on the stage are strangers. One of
    them has six arms. The Host is working the crowd. The doors at
    the back are opening. The light in here is not the light you
    remember.

- id: returning_contestant
  archetype: recap
  situation: >-
    Second or later session. The party has been in the arena before.
    They wake in the Green Room. The vending machine has their
    previous run's continuity snack. The PA is updating the
    clipboard. The Host's voice can be heard through the door,
    already warming up the crowd for today's scene.
  tone: familiar, tired, grimly ready
  avoid:
    - re-explaining the setup (they know)
    - pretending the party is new to anything
    - introducing a Stalker before the party leaves the Green Room
  first_turn_seed: >-
    The Green Room's coffee has not improved. The PA — Jena, today,
    or her clipboard says Jena, but yesterday it said Mina — is
    marking today's rotation on the board. Your plushie is on the
    shelf behind the vending machine. It was not there yesterday.
    The vending machine remembers what you bought last time and has
    stocked more. From the other side of the Green Room door you
    can hear the Host's pre-show warm-up, the audience's settling
    hum, the familiar swell of theme music beginning its loop. The
    other contestants are checking gear. Row 3 is reportedly in
    full attendance today. A note has been slipped under the Green
    Room door — thin paper, old hand, three words. You pocket it.
    The Host's voice rises: he is calling your stage titles now,
    and the doors are about to open.
