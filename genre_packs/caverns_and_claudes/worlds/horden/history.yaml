# Horden — Campaign Progression
# How the world changes as players accumulate experience (treasure-as-XP)
# Structured to match HistoryChapter schema: id, label, lore[], session_range

chapters:
  - id: fresh
    label: "The Easy Money"
    session_range: [1, 3]
    lore:
      - >-
        The party is new to Copperbridge. The outer ring is the
        playground — wide passages, cheap treasure, manageable
        hazards. Tarnish mites are a nuisance. Stack lurkers are
        a surprise. The toll gate is a puzzle they have not solved
        yet.
      - >-
        Learning the weight economy: what is worth carrying, what
        to leave, how fast encumbrance adds up. The Spiller's Scale
        at Kern's Post teaches the lesson — weigh in, weigh out,
        the difference is profit.
      - >-
        The outer ring feels generous. Treasure is everywhere. The
        temptation is to fill every pocket. The first time the
        path behind you is narrower than the path ahead, the
        lesson begins.
    location: "The Mouth"
    time_of_day: dawn
    atmosphere: >-
      Gold-rush optimism undercut by unease. The dungeon is giving
      too freely. The treasure is too easy. Something is wrong with
      a place that lets you take this much without fighting back.
    points_of_interest:
      - name: Copperbridge Square
        slug: copperbridge_square
        region: copperbridge_square
        type: settlement
        description: >-
          A square paved with mismatched stone — half limestone,
          half repurposed flagstones scavenged from the Spillfield.
          The buildings lean inward, built from salvaged materials
          and looking slightly too rich for a town this size.
          Copper-green stains run down every gutter and the old
          stone bridge over the creek is stained the same mineral
          green.
      - name: Kern's Post
        slug: kerns_post
        region: copperbridge_square
        type: shop
        description: >-
          The Spillers' headquarters and the town's working
          provisioner, run by Kern Saltwall from behind a counter
          made of stacked ingots. Torches and rope and sacks line
          the walls; at the centre sits the Spiller's Scale,
          weighing packs in and packs out. The difference is
          profit. Or death.
      - name: The Mouth of Horden
        slug: the_mouth
        region: copperbridge_approach
        type: dungeon
        description: >-
          The dungeon entrance: a ragged opening in the ridge
          face, not cut but pushed outward from inside, stone
          cracked around an absence of stone. A stale warm air
          comes up out of it carrying dust from decaying velvet
          and the green smell of verdigris. Things occasionally
          roll out of it. Nothing rolls in.
      - name: The Scrap Hall
        slug: the_scrap_hall
        region: copperbridge_approach
        type: dungeon
        description: >-
          A long chamber just inside the Mouth, lined with broken
          things: shattered swords in heaps, dented helmets
          stacked to the ceiling, rusted arrowheads ankle-deep
          underfoot. The Hoarder does not throw anything away.
          It only stops caring about the condition.
      - name: The Coin Drift
        slug: the_coin_drift
        region: copperbridge_approach
        type: dungeon
        description: >-
          A room where the floor has vanished under coins. Knee-
          deep at the entrance. Waist-deep at the centre. Nobody
          has measured the far wall and the few who walked in
          have come out carrying less than they brought. The
          coins slip around the leg and every step sounds like
          a small landslide.
      - name: The Trophy Wall
        slug: the_trophy_wall
        region: copperbridge_approach
        type: dungeon
        description: >-
          Hundreds of weapons driven point-first into the walls
          and the ceiling of a square chamber — swords, axes,
          spears, an occasional crossbow intact enough to fire.
          Each one pinned through a small stone plaque with a
          mark in the Hoarder's hand. The plaques are not in
          any order the eye can read.

  - id: early
    label: "The Toll"
    session_range: [4, 6]
    lore:
      - >-
        The toll gate. The first real test — the dungeon asks for
        something before it gives more. The middle ring beyond is
        visibly different — tighter, richer, more dangerous.
      - >-
        First encounters with the Appraiser. The counting starts.
        Awareness builds faster because the items are more valuable
        and the Hoarder cares more about what is here.
      - >-
        Rust ghosts appear — reminders that other delvers came this
        deep and never left. Their packs are sealed by corrosion.
        The treasure inside is worth a fortune. Opening them
        requires a smith in town. The trip back and forth is the
        real cost.
      - >-
        The Hoarder's whisper begins at awareness 10. It is not
        threatening. It is counting. The party's inventory, listed
        item by item. The count is accurate. This is worse than
        any threat.
    location: "The Toll Gate"
    atmosphere: >-
      The stakes have shifted. The outer ring was about picking up
      treasure. The middle ring is about getting it out. Every item
      has a carrying cost measured in narrower passages, heavier
      packs, and a Hoarder that knows exactly what you have.
    points_of_interest:
      - name: The Toll Gate
        slug: the_toll_gate
        region: copperbridge_approach
        type: dungeon
        description: >-
          A chokepoint between the outer and middle rings. The
          passage narrows to a stone arch with a shallow bronze
          bowl set in the floor beneath it. The arch will not
          admit anyone carrying more than they set down in the
          bowl. Whatever is put in the bowl is never there on
          the way back.
      - name: The Moth Gallery
        slug: the_moth_gallery
        region: copperbridge_approach
        type: dungeon
        description: >-
          A wide chamber of textiles — rotting tapestries draped
          over mounds of folded cloth, silk gone to cobweb, wool
          consumed to lace. The light is strange here; torches
          burn through small holes in the dust and cast
          unreasonable shadows on the heaps. The whole room
          smells of old funerals.
      - name: The Tarnish Hall
        slug: the_tarnish_hall
        region: copperbridge_approach
        type: dungeon
        description: >-
          The first room past the Toll Gate, and the difference
          is immediate. The treasure here is real: silver gone
          dark, gold tarnished green, crowns set with stones
          that still hold their fire under a thumbnail of dust.
          Every item is unbroken. Every item is watched.
      - name: The Gem Bower
        slug: the_gem_bower
        region: copperbridge_approach
        type: dungeon
        description: >-
          A low-ceilinged room where gems have been pressed into
          every surface — walls, floor, ceiling — in patterns
          that the eye reads as language before the mind catches
          up and refuses to understand. The light from a torch
          multiplies into dozens of small coloured points and
          none of them are reflections.
      - name: The Rust Gallery
        slug: the_rust_gallery
        region: copperbridge_approach
        type: dungeon
        description: >-
          The oldest part of the middle ring, where everything
          has been here for centuries. Iron has become dust, has
          become rust-shapes that hold their form only as long
          as no one exhales near them. The rust ghosts live
          here — the outlines of delvers whose packs were
          sealed shut by corrosion and whose bones are still
          inside.
      - name: The Bolt Room
        slug: the_bolt_room
        region: copperbridge_approach
        type: dungeon
        description: >-
          A small chamber stacked floor to ceiling with bolts
          of cloth, rolls of leather, and bundles of ribbon, all
          preserved by something that is not the dryness of
          the air. A narrow aisle between stacks leads nowhere
          visible. The aisle is wider on the way out than on
          the way in. This is not reassuring.

  - id: mid
    label: "The Weight"
    session_range: [7, 9]
    lore:
      - >-
        The weight lock. The inner sanctum demands you enter naked
        of gear. Everything you carry must be left on the shelves.
        The shelves are full of what others left. The temptation to
        take from the shelves is the trap — those items are already
        catalogued.
      - >-
        The Counting Hall reveals the Hoarder's system. The abacuses
        count automatically. The Appraiser's whispers feed the count.
        The party understands the mechanism now — and realizes the
        mechanism is getting faster.
      - >-
        Extraction is the primary challenge. Getting in is easy.
        Getting out with anything is the game. The optimal strategy
        is emerging: go deep, take one thing, sprint. The temptation
        is always one more room, one more handful.
      - >-
        The Counters approach the party with a proposition. Add items
        on your way in. Slow the count. They will provide offerings
        and share their knowledge of the trade cipher in exchange.
        The Spillers oppose this arrangement.
    atmosphere: >-
      Professional tension. The dungeon is a known quantity now —
      the rules are clear, the economy is understood, the danger
      is calibrated. The challenge is discipline. The dungeon
      punishes greed and the party must decide how greedy they are.
    points_of_interest:
      - name: The Appraisal Niche
        slug: the_appraisal_niche
        region: copperbridge_approach
        type: dungeon
        description: >-
          A hidden alcove behind the gem-studded wall of the Gem
          Bower. Inside, a stone desk and a small brass scale —
          the Appraiser's workplace. The desk is covered in
          parchment tallies of every item that has passed
          through the Bower in four hundred years. Your name
          will be added if you linger.
      - name: The Goat Path
        slug: the_goat_path
        region: copperbridge_approach
        type: dungeon
        description: >-
          A shoulder-width corridor where the walls are not
          stone — they are treasure, stacked and held together
          by weight alone. Swords pressed flat against gilded
          cups. Crowns crushed into lockbox corners. The
          corridor is wider at eye height than at pack height.
          A rider does not pass this way. A priest does, but
          only on their knees.
      - name: The Weight Lock
        slug: the_weight_lock
        region: copperbridge_approach
        type: dungeon
        description: >-
          A square room with a stone door on the far wall and
          a brass platform set into the floor. The platform
          measures carry-weight. The door opens only for the
          unburdened. A set of shelves along one wall already
          holds what previous delvers decided to surrender.
          The shelves are alphabetised.
      - name: The Counting Hall
        slug: the_counting_hall
        region: copperbridge_approach
        type: dungeon
        description: >-
          A long chamber with stone tables running its length,
          each bearing an abacus made of gold wire and polished
          jet beads. The abacuses count on their own, reading
          the party's inventory from the air. The beads click
          quietly, constantly, and the sound adjusts when
          anyone in the room shifts a pack.
      - name: The Deep Pile
        slug: the_deep_pile
        region: copperbridge_approach
        type: dungeon
        description: >-
          A chamber below the Rust Gallery, reached only by a
          one-way chute through corroded metal. Centuries of
          treasure heaped to a height that does not match the
          room's ceiling. A delver who climbs to the top finds
          a view that should not be possible from a closed
          chamber. The view is of the Counting House.

  - id: veteran
    label: "The Inhalation"
    session_range: [10, 12]
    lore:
      - >-
        The inhalation. The Hoarder breathes in. The Spillfield
        empties. Copperbridge shudders. The party has been taking
        too much — or the count has simply reached a threshold.
        The town is at risk.
      - >-
        The Counters' warning was real. The count is accelerating.
        The abacuses in the Counting Hall spin without stopping.
        The Hoarder is approaching completion — and when it finishes,
        it will reach outward.
      - >-
        The Ledger awaits in the Counting House. The boss fight is
        not a brawl — it is an audit. Everything the party took from
        the dungeon will be reclaimed. Only surface items, personal
        belongings, things the Hoarder has never counted, are safe.
        The party that looted the least is the strongest here.
      - >-
        Resolution: tear the Ledger's pages. Each torn page frees
        items from the catalogue permanently. Destroy enough pages
        and the count breaks — the Hoarder loses track, the exits
        unseal, and the inhalation stops. The dungeon does not die.
        It starts counting again, from the beginning. But the party
        is free. And they know the price of greed.
    atmosphere: >-
      Climactic reversal. Everything the party accumulated is now
      a liability. The dungeon weaponizes their success. The
      strongest party is the one that carried the least. The
      resolution demands sacrifice — give back what you took, or
      destroy the record of it.
    points_of_interest:
      - name: The Antechamber
        slug: the_antechamber
        region: copperbridge_approach
        type: dungeon
        description: >-
          The last room before the Hoarder itself. The treasure
          here is sorted by type with inhuman precision — every
          object categorised, catalogued, and placed at the
          exact distance from its neighbours the Hoarder
          considers correct. The air is still. The Hoarder's
          whisper is no longer counting. It is reading the
          count aloud.
      - name: The Counting House
        slug: the_counting_house
        region: copperbridge_approach
        type: dungeon_boss
        description: >-
          A perfect circle of a room. The walls are gold — not
          gilded, solid. The floor is a mosaic of pressed coins
          from every currency that has ever been minted, each
          face-up, each clean. At the centre, a lectern holds
          the Ledger: a book whose pages list every item in
          Horden in the Hoarder's hand. The Hoarder reads from
          it. The party can be in it.
      - name: The Spillfield
        slug: the_spillfield
        region: copperbridge_square
        type: frontier
        description: >-
          The open ground between Copperbridge and the Mouth,
          where Horden's overflow accumulates day by day as
          coins and buckles and ring fragments shake free from
          the dungeon's throat. The Spillers work it at dawn
          with rakes and sieves. During the inhalation, the
          Spillfield empties in a single breath — every coin
          lifted at once, drawn back toward the Mouth like a
          tide reversing.
      - name: Noll's Shrine
        slug: nolls_shrine
        region: spiller_row
        type: shrine
        description: >-
          A counting table in Spiller Row where Noll Thatcher
          tallies the day's spillage in his ledger and mutters
          corrections to himself. The Counters call it their
          chapel. Everyone else calls it Noll's problem. During
          the veteran chapter, Noll's numbers have been
          running in parallel with the Hoarder's. Two ledgers.
          One count. The correction is coming.
