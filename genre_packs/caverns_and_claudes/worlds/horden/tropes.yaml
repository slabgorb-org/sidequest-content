- id: the_hoarder_counts
  name: The Hoarder Counts
  description: >-
    The Hoarder's awareness rises as inventory changes occur. Unlike
    Grimvault's quality assessment or Mawdeep's hunger, this is
    accounting — precise, relentless, offended. Every item touched
    is a discrepancy. The count must be corrected.
  category: tension
  triggers:
    - picking up any item in the dungeon
    - moving treasure from one location to another
    - the Appraiser completing a count
    - entering a room for the first time (baseline inventory scan)
  narrative_hints:
    - a faint clicking from the walls, like abacus beads sliding
    - a stack nearby shifts one item closer to the edge
    - the air thickens with the smell of old paper and ink
  tension_level: 0.6
  resolution_hints:
    - put items back exactly where they were found
    - leave the dungeon carrying nothing
    - kill the Appraiser before it completes its count
  tags: [keeper, hoard, tension, escalation]
  escalation:
    - at: 0.2
      event: >-
        A doorway you passed through is partially blocked. A small
        pile of coins has appeared at its base — not enough to stop
        you, enough to notice. The Hoarder is aware of a discrepancy.
      npcs_involved: []
      stakes: Exits begin narrowing. Awareness is building. Time to consider what you are carrying.
    - at: 0.4
      event: >-
        The whispering begins. A voice at the edge of hearing, listing
        items — not yours, not yet. The Hoarder is inventorying the
        room you are in, checking what should be here against what is
        here. Something is missing. It knows.
      npcs_involved: []
      stakes: The Hoarder is actively tracking discrepancies. Awareness spikes when items are lifted.
    - at: 0.6
      event: >-
        Goat paths shift. A passage you used ten minutes ago is now
        narrower — stacks have leaned inward, coins have drifted into
        the gap. Your planned exit route requires squeezing through
        sideways. Your pack catches on a protruding crown.
      npcs_involved: []
      stakes: Navigation disrupted. Maps partially invalid. Extraction routes compromised.
    - at: 0.8
      event: >-
        The Hoarder's whisper is now audible. It is counting your
        inventory. Torches — two. Rations — three. Coins — it pauses.
        It is counting your coins. One by one. It sounds disappointed.
        The counting takes time. When it finishes, it will know
        exactly what you have taken.
      npcs_involved: []
      stakes: Full inventory scan. When the count completes, all exits seal until items are returned.
    - at: 1.0
      event: >-
        Every exit is walled. Treasure has stacked itself into solid
        barriers at every doorway. The whispering has stopped. A new
        sound — the scratching of a pen on paper. The Ledger is
        updating. You are now inventory. Your name is being written
        into the catalogue.
      npcs_involved: []
      stakes: Total lockdown. The Ledger activates. Escape requires defeating the boss or abandoning all dungeon items.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.0
    accelerators:
      - treasure_taken
      - encumbered
      - combat
      - appraiser_count

- id: the_extraction
  name: The Extraction
  description: >-
    The party turns back toward the exit carrying treasure. The
    dungeon tightens. Every step toward the mouth is harder than
    the step that brought you in. The Hoarder does not chase. It
    simply makes leaving more expensive than staying.
  category: conflict
  triggers:
    - party turns toward exit while carrying dungeon items
    - encumbrance exceeds half capacity
    - the toll gate is approached from the inside
  narrative_hints:
    - passages are narrower than they were on the way in
    - treasure you passed before has shifted to block alternate routes
    - your pack feels heavier with every step, though the weight has not changed
  tension_level: 0.7
  resolution_hints:
    - drop items to reduce encumbrance and ease passage
    - use the weight lock to strip down and pass through
    - force through the toll gate (requires deposit)
  tags: [extraction, treasure, tension, resource]
  escalation:
    - at: 0.3
      event: >-
        The goat path you used to enter the middle ring has narrowed.
        Your pack will not fit. You can pass without the pack, or
        find another route. The other route goes through the
        Counting Hall, where the abacuses will register every item.
      npcs_involved: []
      stakes: Forced choice — abandon pack contents or accept awareness spike.
    - at: 0.6
      event: >-
        A coin golem assembles at the toll gate. It stands in the
        arch, filling the passage. To pass, you must get through it.
        Every hit scatters coins worth collecting. Every coin
        collected raises awareness. The dungeon is testing your
        discipline.
      npcs_involved: []
      stakes: Combat at the chokepoint. The golem is profitable to fight but every coin picked up costs awareness.
    - at: 1.0
      event: >-
        The mouth is in sight but the Spillfield beyond it is
        pulling inward. Coins from outside are sliding back up
        the Mule Track. The Hoarder is inhaling. You have minutes
        to clear the entrance before the inhalation reverses the
        spillage — and drags you back in with it.
      npcs_involved: []
      stakes: Sprint for the exit. Drop everything or risk being pulled back. The town is at risk.
  passive_progression:
    rate_per_turn: 0.05
    rate_per_day: 0.0
    accelerators:
      - treasure
      - encumbered
      - slow
      - awareness_high

- id: the_inhalation
  name: The Inhalation
  description: >-
    The Hoarder breathes in. Treasure flows back toward the dungeon.
    The Spillfield empties. Objects in Copperbridge vibrate toward
    the ridge. If you are between the dungeon and town, you are
    caught in the current.
  category: hazard
  triggers:
    - awareness reaching maximum
    - large-scale removal of treasure over multiple delves
    - narrative escalation at VETERAN maturity
  narrative_hints:
    - coins on the ground begin to vibrate and slide
    - the Spillfield is bare — picked clean by the inhale
    - a wind blows toward the dungeon that carries no air, only weight
  tension_level: 0.9
  resolution_hints:
    - drop everything and run for town
    - shelter behind stone buildings (the inhale cannot move stone — yet)
    - the Counters claim adding items to the offering pile slows the inhalation
  tags: [hazard, dungeon, environmental, escalation]
  escalation:
    - at: 0.5
      event: >-
        The Spillfield is empty. The coins are gone, the scrap is
        gone, the blankets the Spillers left weighted down with
        stones are gone — stones and all. The ground is bare dirt.
        A wind blows from town toward the dungeon. It is not air.
        It is a pull.
      npcs_involved: []
      stakes: Spillfield cleared. Town economy disrupted. The pull is getting stronger.
    - at: 1.0
      event: >-
        Full inhalation. Everything not anchored to stone moves
        toward the dungeon. Carts slide. Market stalls tip. A house
        near the Mule Track groans on its foundation. The Hoarder
        is reorganizing at scale. The last time this happened, two
        houses went in. This time it wants more.
      npcs_involved: []
      stakes: Town-level crisis. Property damage. Possible structural loss. The Spillers evacuate.
  passive_progression:
    rate_per_turn: 0.0
    rate_per_day: 0.0
    accelerators:
      - mass_removal
      - veteran_maturity
