# Horden — Narrative Pacing Configuration
# Controls sentence delivery, render thresholds, and escalation timing.
# Horden is warmer and more seductive than Grimvault — the horror
# is abundance, not absence. The dungeon wants you to take things.

drama_thresholds:
  sentence_delivery_threshold: 0.3
  render_threshold: 0.5
  escalation_threshold: 0.7
  climax_threshold: 0.9

pacing_profile:
  default_tempo: moderate
  tempo_overrides:
    - context: exploration
      tempo: moderate
      notes: >-
        Horden exploration should feel tempting. Describe treasure
        in detail — the glint, the weight, the value. Let the
        player's greed build naturally. Do not rush past the good
        stuff. Every room should feel like an opportunity.
    - context: combat
      tempo: fast
      notes: >-
        Combat in Horden is chaotic — stacks collapse, coins scatter,
        footing is uncertain. Stack lurkers explode into components.
        Coin golems shed value with every hit. Describe the treasure
        flying, the clatter, the temptation to grab coins mid-fight.
    - context: extraction
      tempo: fast
      notes: >-
        Extraction is a sprint. Passages narrow. Weight matters.
        Short sentences, heavy breathing, the sound of coins
        shifting behind you. The Hoarder's whisper accelerates.
        Every step is a decision: keep it or drop it.
    - context: boss
      tempo: deliberate
      notes: >-
        The Ledger fight is methodical. It reclaims items one by
        one. Each reclamation is described — the item flies from
        your hands, returns to its shelf, and the Ledger's page
        updates. The pace is an audit, not a battle. The tension
        is watching your inventory empty.

narration_style:
  default: >-
    Rich and sensory. Describe what is present — the weight, the
    color, the smell, the texture. Horden is not empty. Horden
    is too full. The horror is abundance, not scarcity. Warm
    vocabulary — glint, gleam, shimmer, tarnish, patina, lustre.
    The dungeon is a dragon's hoard given architecture. Narrate
    with the seductive detail of a jeweler describing a gem.
  outer_ring: >-
    Generous and wide. The outer ring is the easy part — describe
    spacious passages, treasure in reach, low threat. Build
    confidence. The player should feel lucky. The dungeon should
    feel like it is giving gifts. This is the setup for the trap.
  middle_ring: >-
    Tighter and more oppressive. The treasure is better but the
    space is worse. Describe the narrowing — goat paths, leaning
    stacks, dust-thick air. The value goes up. The comfort goes
    down. The player should feel the squeeze of wanting more
    while having less room to carry it.
  inner_sanctum: >-
    Claustrophobic and precise. The inner rooms are organized
    with obsessive care. Every coin faces the same direction.
    Every gem is sorted by color. The disorder of the outer rings
    is gone — here, the Hoarder's mind is visible. Describe the
    precision. It is more unsettling than the chaos.
