world_name: Horden
history: >-
  Copperbridge was a crossroads town before the hoard. Two trade
  routes met at a stone bridge over a creek that ran copper-green
  from the minerals in the ridge. When delvers cracked the dungeon
  open, the trade routes dried up — who needs to trade when treasure
  spills from the ground? The town turned inward, toward the dungeon
  mouth, and built its economy on spillage. Three generations of
  Spillers have picked the Spillfield clean every morning. The
  treasure never stops coming. The dungeon never stops growing.

geography: >-
  Valley country. Copperbridge sits in a shallow valley where two
  creeks meet at a stone bridge. The ridge rises to the north, and
  the dungeon entrance is a ragged opening in the ridge face — not
  cut like Grimvault's precise rectangle, but torn, as if something
  inside pushed outward. The Mule Track runs from the bridge to the
  entrance, worn deep. The Spillfield slopes below the mouth, always
  glinting with fresh spillage. The creek runs green from copper
  leaching out of the ridge. The water is safe to drink but stains
  your teeth.

cosmology: >-
  The Hoarder is not intelligent the way the Patient Butcher is
  intelligent. It does not plan, assess, or refine. It counts. It
  counts everything inside itself and when the count is wrong it
  corrects it. Picking up an item makes the count wrong. Moving an
  item makes the count wrong. Breathing on an item makes the count
  wrong — eventually. The Hoarder does not pursue. It adjusts. Exits
  close, paths shift, stacks rearrange. The dungeon is a living
  inventory and you are a discrepancy. The only way to leave is to
  stop being interesting — to carry nothing, to touch nothing, to be
  nothing the Hoarder needs to count. But you came here for treasure.
  You were always going to touch something.

themes:
  - "The dungeon weaponizes your greed — every treasure you take makes leaving harder"
  - "Nothing leaves Horden on purpose"
  - "The Hoarder does not chase — it adjusts the inventory"
  - "Treasure is everywhere and carrying it will kill you"
  - "The town lives on spillage — the dungeon's crumbs"
  - "Encumbrance is not a mechanic, it is the antagonist"

genre_conventions:
  - "Describe abundance, not scarcity — the horror is too much, not too little"
  - "The Hoarder never threatens — it counts, corrects, and closes doors"
  - "Creatures are things trapped in the hoard, not the Hoarder's servants"
  - "The deeper you go, the more valuable the treasure and the narrower the exits"
  - "The surface town is absurdly rich from spillage but lives in fear of the next inhalation"
