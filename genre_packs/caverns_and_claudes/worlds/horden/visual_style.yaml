# Horden — Visual Style Override
# Inherits C&C genre style: B&W pen & ink, Erol Otus / David Trampier.
# Horden-specific: cluttered, dense, every surface covered in treasure.
# The horror is abundance. Crosshatch the piles, not the emptiness.

style_prompt: >-
  treasure hoard dungeon, piles of coins and tarnished metal stacked
  floor to ceiling, cluttered passages, goat paths between treasure
  walls, verdigris patina on bronze, tarnished silver, rotting fabric
  under gemstones, claustrophobic abundance, wunderkammer density,
  every surface covered, every shelf full, heavy crosshatch shadows
  between treasure stacks, single torch illuminating dense clutter

negative_prompt: >-
  empty rooms, clean surfaces, sparse decoration, minimalism,
  outdoor scenes, vegetation, water, orderly arrangement,
  modern materials, open spaces

visual_tag_overrides:
  dungeon: >-
    claustrophobic passage between walls of stacked treasure, coins
    protruding from compacted piles, crosshatched shadows between
    leaning stacks, single torch catching glints on metal surfaces,
    goat path barely wide enough for one person, dust motes in beam
  tavern: >-
    prosperous underground tavern furnished with dungeon spillage,
    copper bar top dented from coins, mismatched silver goblets,
    treasure-chest stools, chalkboard with spillage yields, a
    reinforced empty chair in the corner
  town: >-
    frontier salvage town at a dungeon mouth, stone bridge over a
    creek stained green with copper, sorting blankets on cobbles
    covered in coins and scrap metal, green-stained hands,
    prosperous but uneasy, ridge looming above

atmosphere:
  outer_ring: >-
    Generous clutter. Wide passages with treasure in easy reach.
    Crosshatch the piles loosely — they are not threatening yet.
    Glints and reflections suggested by leaving white space in
    the ink. The dungeon looks like a gift. This is the trap.
  middle_ring: >-
    Dense, oppressive stacking. The crosshatch is heavier — less
    white space, more ink. Treasure piles lean inward, creating
    tunnel-like passages. Verdigris and tarnish visible as texture
    variation in the ink work. The torch barely reaches past the
    nearest stack.
  inner_sanctum: >-
    Obsessive precision. Clean lines replace crosshatch. Every coin
    faces the same direction. Geometric patterns in the floor
    mosaic. The chaos of the outer rings gives way to unsettling
    order. Heavy black fills around the edges — the room is a
    small bright space surrounded by absolute ink.
