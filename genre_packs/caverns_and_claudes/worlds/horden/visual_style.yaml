# Horden — Visual Style Override
# Warm, cluttered, amber-lit. The opposite of Grimvault's cold precision.
# A dragon's hoard given architecture. Wunderkammer density.

style_prompt: >-
  Dungeon interior, treasure hoard, warm amber torchlight, piles
  of gold coins and tarnished silver, cluttered passages stacked
  floor to ceiling with treasure. Verdigris on bronze, patina on
  copper, dust motes in warm light. Rich fabrics rotting under
  gemstones. The aesthetic of a miser's den crossed with a
  medieval treasury. Dyson Logos crosshatch style but dense —
  every surface covered, every shelf full, claustrophobic
  abundance.

negative_prompt: >-
  empty rooms, clean surfaces, cold light, blue tones, modern
  materials, sparse decoration, minimalism, outdoor scenes,
  vegetation, water, orderly arrangement

color_palette:
  primary: "#C4923A"
  secondary: "#8B6914"
  accent: "#D4AF37"
  shadow: "#3A2810"
  highlight: "#F5DEB3"

atmosphere:
  outer_ring: >-
    Warm and inviting. Amber torchlight on gold. Wide passages
    with treasure in reach. The light catches on coins and
    jewelry — everything glints. The clutter is manageable, even
    charming. It looks like a treasure room in a fairy tale.
    This is deliberate.
  middle_ring: >-
    Oppressive abundance. The same warm tones but the stacks are
    taller, the paths narrower, the dust thicker. Torchlight
    does not reach the ceiling — the treasure blocks it. Shadows
    between stacks are deep. Tarnish and verdigris dominate —
    green on copper, black on silver. The gold is still bright
    but buried under layers of lesser metal.
  inner_sanctum: >-
    Unnervingly perfect. The clutter gives way to obsessive order.
    Gold surfaces reflect torchlight in flat, even planes. The
    floor mosaic of pressed coins creates a geometric pattern.
    The warmth is artificial — generated by the mass of metal,
    not by any fire. Everything is still. The air does not move.
