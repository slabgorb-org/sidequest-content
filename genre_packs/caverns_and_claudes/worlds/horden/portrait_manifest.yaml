# Horden — NPC Portraits
# Scene-based illustrations for Flux generation
# B&W pen and ink, Erol Otus / David Trampier style

characters:

  - name: Kern Saltwall
    role: Spiller boss weighing packs at his post
    type: npc_major
    appearance: >-
      A lean man in his fifties standing behind a counter made of
      stacked copper ingots, hands on a brass scale. Green stains
      run from his fingertips to his elbows — thirty years of
      handling corroded copper. Weathered face, sharp eyes, a
      leather apron with pockets full of weights. A ledger open
      beside him, entries in neat columns. Behind him, shelves of
      sorting sacks and hooked poles. The counter is cluttered
      with samples — coins, scrap metal, a tarnished buckle being
      assessed.
    culture_aesthetic: >-
      Medieval provisioner's shop built from salvage. Stone walls,
      copper-stained countertops, shelves of practical equipment.
      Everything functional, nothing decorative. The wealth is in
      the goods, not the fittings.

  - name: Petra Brewer
    role: Tavern keeper serving ale in dented silver
    type: npc_major
    appearance: >-
      A sturdy woman in her forties behind a copper bar top, pouring
      ale from a clay jug into a dented silver goblet. Brown hair
      tied back, sleeves rolled, a knowing smile. The bar is covered
      in ring-marks from goblets. Behind her, shelves of mismatched
      silver cups — no two alike, all from the Spillfield. A
      chalkboard on the wall lists today's yield in neat writing.
      Kreveld's Chair is visible in the background — heavy, bolted
      down, empty.
    culture_aesthetic: >-
      Medieval tavern furnished with dungeon spillage. Copper bar,
      silver drinking vessels, treasure-chest stools. Prosperous
      but uneasy — the wealth came from somewhere that wants it
      back.

  - name: Sigri Forger
    role: Appraiser examining treasure with her loupe
    type: npc_major
    appearance: >-
      A sharp-featured woman in her thirties holding a multi-lensed
      brass loupe to her eye, examining a coin pinched between her
      fingers. Dark hair, precise hands, a leather vest with pockets
      of testing equipment — acid vials, reference weights, a small
      hammer for striking metal. Her expression is neutral,
      professional, unimpressed. A table before her holds a
      morning's work — sorted piles of metal, a ledger with prices,
      a cup of cold tea she has not touched.
    culture_aesthetic: >-
      Medieval assayer's office. Stone walls, good light from a
      high window, every surface covered with instruments and
      samples. The tidiest room in Copperbridge.

  - name: Noll Thatcher
    role: Counter elder counting flagstones in a corner
    type: npc_major
    appearance: >-
      A thin man in his forties sitting alone at a corner table,
      hunched over a ledger, lips moving constantly. Hollow cheeks,
      restless fingers that tap the table in rhythm with his counting.
      His clothes are plain but his ledger is elaborate — leather-
      bound, tabbed with colored markers, pages dense with numbers.
      A pouch of wooden counting tokens sits beside his elbow. His
      eyes are focused on the floor. He is counting the flagstones.
      A tally stick lies across his lap, notched beyond readability.
    culture_aesthetic: >-
      Medieval obsessive at a tavern corner table. Isolated from
      the room's activity. Everything about him is precise except
      his expression, which is anxious. The ledger is his world.
