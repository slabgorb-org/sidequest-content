- name: "The First Counting"
  summary: >-
    Before Copperbridge existed, before the ridge had a name, a
    merchant died in a cave with everything he owned. He did not
    stop counting.
  era: "Before memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The oldest miners in the ridge country tell a story about a
    merchant who fled a war with his fortune loaded on twelve mules.
    He found a cave in the ridge and hid inside with every coin,
    every bolt of silk, every ingot. The war ended. He did not come
    out. The mules died at the entrance. The merchant kept counting.
    He counted until the counting became the cave and the cave became
    the counting. By the time anyone thought to look for him, the
    cave had rooms. By the time anyone entered, the rooms had doors
    that locked behind them. The merchant was gone. The counting
    remained.
  faction_grudges:
    - from: The Spillers
      to: The Counters
      reason: >-
        The Spillers say the merchant was a fool and his treasure is
        fair salvage. The Counters say he achieved something sacred —
        a count so perfect it became alive. Taking from the hoard
        desecrates the count.
  lost_arts:
    - >-
      The merchant's trade cipher — a notation system for tracking
      inventory that nobody alive can read. Fragments appear on
      walls deep in the dungeon. The Counters have partially
      decoded it but disagree on what the numbers mean.
    - >-
      Mule-packing — the art of loading twelve mules with a
      fortune and moving fast. Copperbridge teamsters are good
      but nobody can match the loads the legend describes.
  monuments:
    - >-
      The Twelve Posts — stone hitching posts at the dungeon mouth
      where the merchant's mules supposedly died. The posts are
      older than the town. Flowers do not grow near them.
  terrain_scars:
    - name: "The Mule Track"
      description: >-
        A worn path from the ridge road to the dungeon entrance.
        Deeper than any foot traffic would explain — as if twelve
        loaded mules walked it a thousand times in a single night.
        The ruts are filled with tarnished copper filings.
      region: "copperbridge_approach"
      type: "path"
    - name: "The Spillfield"
      description: >-
        A slope below the dungeon mouth where objects appear
        overnight. Coins, broken jewelry, scraps of rotted fabric.
        The hoard overflows when the Hoarder reorganizes. Copperbridge
        exists because of the Spillfield.
      region: "copperbridge_approach"
      type: "debris_field"

- name: "Kreveld's Expedition"
  summary: >-
    The first organized delve into Horden. Twelve went in with empty
    packs. One came out with full ones. He could not put them down.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Kreveld the Gilded was the first delver to map the outer ring. He
    brought eleven hirelings, each carrying an empty sack. The plan
    was systematic extraction — fill the sacks, walk out, sell, repeat.
    They made it to the middle ring before the goat paths closed behind
    them. Eleven died in the collapse of a coin stack that buried them
    in gold they could not lift. Kreveld walked out alone, carrying
    four full packs. He could not set them down. His hands would not
    open. He wore the packs until he died — sleeping in them, eating
    around them, shuffling through town bent double under the weight.
    He was the richest man in Copperbridge and could not spend a coin.
  faction_grudges: []
  lost_arts:
    - >-
      Kreveld's route maps — drawn from memory by a man who could
      not put down his pen without dropping a pack. The maps are
      accurate but the handwriting is illegible. Sigri Forger has
      the originals and charges to let people look at them.
  monuments:
    - >-
      Kreveld's Chair — a reinforced bench in The Clinker tavern,
      built to support a man and four full packs. Nobody sits in
      it. The wood is stained with copper residue.
  terrain_scars: []

- name: "The Night the Hoard Breathed"
  summary: >-
    One winter the dungeon exhaled. Treasure poured from the entrance
    for three hours. Then it inhaled. Most of the treasure went back.
    So did two houses.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Copperbridge residents closest to the dungeon mouth woke to the
    sound of metal sliding on stone. The hoard was spilling out — a
    river of coins, jewelry, weapons, and unidentifiable objects
    flowing down the Mule Track into the Spillfield. People filled
    buckets, carts, cellars. Three hours later, the flow reversed.
    Everything moved back toward the entrance. Two houses closest to
    the track were pulled from their foundations and dragged into
    the dungeon mouth. The families survived because they were in the
    square filling buckets. Their homes are in the outer ring now,
    flattened and stacked. The Hoarder kept the houses.
  faction_grudges:
    - from: The Spillers
      to: The Hoard Itself
      reason: >-
        The Spillers lost two storage sheds in the inhalation.
        Everything they had stockpiled from years of scavenging
        went back into the dungeon. They do not store near the
        track anymore.
  lost_arts: []
  monuments:
    - >-
      The Foundation Stones — two sets of foundation stones in
      Copperbridge where houses used to stand. Now empty lots.
      Nobody builds on them. The ground still shifts toward the
      dungeon on quiet nights.
  terrain_scars:
    - name: "The Drag Marks"
      description: >-
        Gouges in the stone of the Mule Track where two houses
        were pulled toward the dungeon. The marks are deep enough
        to collect rainwater. Copper-green stains line the grooves.
      region: "copperbridge_approach"
      type: "gouge"
