# Horden — Encounter Tables
# Per-room encounter probabilities referencing creatures.yaml IDs.
# The Hoarder's awareness triggers inventory-based encounters.
#
# Probability is base chance per room entry (0.0 to 1.0).
# Keeper awareness modifiers increase probability at higher awareness levels.
# Loot drops are per-encounter, separate from room treasure.

levels:

  - id: outer_ring
    name: "The Spillover"
    wandering_monster_chance: 0.10
    wandering_monster_awareness_bonus: 0.02
    wandering_monsters:
      - creature_id: tarnish_mite
        weight: 4
        count: "3d6"
        description: >-
          A glint of copper-green on the wall. Tiny shapes flowing
          across the surface of a coin pile, leaving dull trails
          behind them. Check your purse.
        loot:
          - description: "Nothing. The mites are too small to harvest."
      - creature_id: ledger_worm
        weight: 3
        count: "2d6"
        description: >-
          Fat pale shapes on the floor between stacks. They are
          eating something — a scrap of parchment, a tag from a
          bolt of cloth. The ink vanishes as you watch.
        loot:
          - description: "Ink pellets (worthless, indelible)."
      - creature_id: stack_lurker
        weight: 2
        count: "1"
        description: >-
          A pile of coins in the corridor. Exactly like every other
          pile. Except this one is breathing. You notice only if
          you stop and watch.
        loot:
          - description: "Scattered coins (3d6 GP, tarnish-mite infested)"
            value: 10
            chance: 1.0
      - creature_id: rust_ghost
        weight: 1
        min_awareness: 6
        count: "1"
        description: >-
          A grinding sound from behind a stack. A shape steps out —
          human-sized, coated in rust, carrying a pack it cannot
          set down. It watches you. It does not move unless you
          reach for the pack.
        loot:
          - description: "Corroded iron scraps (2 GP)"
            value: 2
            chance: 0.6

    room_encounters:
      - room_id: coin_drift
        encounters:
          - creature_id: tarnish_mite
            count: "4d6"
            probability: 0.4
            description: >-
              The surface of the coin drift ripples with tiny green
              shapes. Mites, thousands of them, skating across the
              metal surface. The coins they have passed over are dull.
          - creature_id: stack_lurker
            count: "1"
            probability: 0.2
            description: >-
              Among the coin drifts, one pile is taller than the
              rest. It has been here longer than the others. It is
              also warmer.

      - room_id: scrap_hall
        encounters:
          - creature_id: tarnish_mite
            count: "2d6"
            probability: 0.3
            description: >-
              Green trails on the iron stacks. The broken swords are
              duller than they should be. Mites flow along the edges,
              feeding on whatever shine the iron had left.

      - room_id: trophy_wall
        encounters:
          - creature_id: stack_lurker
            count: "1"
            probability: 0.25
            description: >-
              A heap of weapons at the base of the wall. Did that
              heap exist when you entered? It looks like fallen
              weapons. It is very still.
          - creature_id: rust_ghost
            count: "1"
            probability: 0.15
            min_awareness: 6
            description: >-
              Standing among the weapons, a figure in corroded
              armor. Its back is to you. Its pack is full. Its
              hands are at its sides. It has been standing here
              for a very long time.

      - room_id: moth_gallery
        encounters:
          - creature_id: ledger_worm
            count: "3d6"
            probability: 0.5
            description: >-
              The cloth is infested. Fat pale shapes nest in the
              folds of rotting tapestry, eating the embroidered
              lettering. The gold thread survives. The words do not.

  - id: middle_ring
    name: "The Collection"
    wandering_monster_chance: 0.15
    wandering_monster_awareness_bonus: 0.03
    wandering_monsters:
      - creature_id: rust_ghost
        weight: 3
        count: "1"
        description: >-
          Grinding footsteps from the corridor ahead. Heavy, slow,
          relentless. A rust ghost on patrol — following a route
          it has followed since it died. Its pack scrapes both
          walls of the goat path.
        loot:
          - description: "Rust ghost pack — sealed, requires smith (50 GP contents)"
            value: 50
            chance: 0.4
      - creature_id: the_appraiser
        weight: 2
        count: "1"
        description: >-
          A whisper from behind a stack. Not the Hoarder's whisper —
          a human voice, counting. Your torches. Your rations. Your
          coins. It is behind you and it has been following for
          longer than you realized.
        loot:
          - description: "Empty pack (3 GP)"
            value: 3
            chance: 0.5
      - creature_id: coin_golem
        weight: 1
        min_awareness: 10
        count: "1"
        description: >-
          A shape assembles in the chokepoint ahead. Coins rise
          from the floor, clicking into position, forming limbs,
          a torso, a head. It stands between you and the exit.
          It does not move. It waits for you to try to pass.
        loot:
          - description: "Coin pile (value equals remaining HP in GP)"
            value: 18
            chance: 1.0
      - creature_id: stack_lurker
        weight: 2
        count: "1d2"
        description: >-
          Two piles of treasure, side by side in the passage.
          One is real. One is not. Or perhaps both are not.
        loot:
          - description: "Scattered coins (3d6 GP, tarnish-mite infested)"
            value: 10
            chance: 1.0

    room_encounters:
      - room_id: tarnish_hall
        encounters:
          - creature_id: rust_ghost
            count: "1d2"
            probability: 0.3
            description: >-
              Rust ghosts among the silver candlesticks. Standing
              motionless, packs full, watching the entrance. They
              have been here since the middle ring had wider paths.
          - creature_id: stack_lurker
            count: "1"
            probability: 0.2
            description: >-
              A pile of tarnished silver near the wall. One of
              many. This one is slightly warmer than the others.

      - room_id: goat_path
        encounters:
          - creature_id: the_appraiser
            count: "1"
            probability: 0.4
            description: >-
              In the narrow passage, pressed against the treasure-wall,
              a figure. It is not blocking the path. It is counting
              the items on the shelves as you pass. Its lips move.
              Its eyes follow your pack.

      - room_id: counting_hall
        encounters:
          - creature_id: the_appraiser
            count: "1d2"
            probability: 0.5
            description: >-
              Appraisers at the abacuses, hands moving the beads
              alongside the automated counting. They are helping.
              They do not look up. They count.
          - creature_id: coin_golem
            count: "1"
            probability: 0.3
            min_awareness: 10
            description: >-
              A golem stands at the entrance to the antechamber.
              It assembled when the abacus clicked past a threshold.
              It is made of gold coins. It is worth a fortune.
              It will kill you if you try to take it.

      - room_id: counting_house
        encounters:
          - creature_id: the_ledger
            count: "1"
            probability: 1.0
            description: >-
              The Ledger rises from the desk. Its pages spread
              open like wings. The trade cipher flows across them
              in fresh ink — your inventory, listed in the
              Hoarder's hand. It knows what you carry. It wants
              it back.
