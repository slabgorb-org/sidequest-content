# Horden — World-Specific NPC Archetypes
# These extend the genre-level archetypes (Torchbearer, Porter, etc.)
# with Copperbridge-specific roles shaped by the hoard's economy.

- name: Spiller
  description: >-
    A Spillfield scavenger who picks the dungeon's overflow every
    morning before dawn. Knows the spillage patterns — which spots
    yield coins, which yield scrap, which yield the occasional
    intact piece. Has green-stained hands from handling corroded
    copper. Practical, superstitious about entering the dungeon,
    and deeply skeptical of anyone who does.
  personality_traits:
    - pragmatic
    - territorial
    - risk-averse
  typical_classes: []
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    wisdom: [12, 16]
  catalog_items: []
  inventory_hints:
    - sorting sack with compartments for metal types
    - a Spiller's hook for pulling items from crevices
    - copper-stained leather gloves
  dialogue_quirks:
    - weighs objects by feel before looking at them
    - quotes spillage prices from memory
  disposition_default: 5
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 5.0
    neuroticism: 6.0
  role: town
  morale: null

- name: Counter
  description: >-
    A member of the counting cult who makes regular pilgrimages
    into Horden to add items to the hoard. Carries pre-counted
    offerings in numbered pouches. Mutters tallies under their
    breath — a habit that started as devotion and became
    compulsion. They know the outer ring intimately and can
    navigate it in the dark by counting steps.
  personality_traits:
    - obsessive
    - precise
    - anxious
  typical_classes: []
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - numbered pouches of counting offerings
    - a personal tally stick notched with pilgrimage counts
    - the trade cipher reference sheet (incomplete)
  dialogue_quirks:
    - counts objects in any room they enter before speaking
    - corrects numerical inaccuracies in conversation
  disposition_default: 0
  ocean:
    openness: 4.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 3.0
    neuroticism: 8.0
  role: town
  morale: null

- name: Appraiser
  description: >-
    A specialist who evaluates treasure brought out of Horden.
    Knows metals, gems, textiles, and the difference between
    surface-quality goods and dungeon-quality goods (which have
    been handled by the Hoarder and are subtly different — heavier,
    colder, faintly humming). Sets prices. Does not negotiate.
  personality_traits:
    - precise
    - mercantile
    - unflappable
  typical_classes: []
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    charisma: [10, 14]
  catalog_items: []
  inventory_hints:
    - multi-lensed brass loupe
    - a set of reference weights in a padded case
    - acid testing kit for metal purity
  dialogue_quirks:
    - names a value before you finish describing the item
    - taps metal with a fingernail and listens before pricing
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 3.0
    neuroticism: 2.0
  role: town
  morale: null

- name: Pack Hauler
  description: >-
    A specialist hireling optimized for Horden's unique challenge:
    carrying treasure out. Wears minimal armor for maximum carry
    capacity. Knows the goat paths and which stacks are stable
    enough to lean against. Charges by the pound extracted, not
    by the day. Has a personal encumbrance limit they will not
    exceed — they know the weight that triggers the exits closing.
  personality_traits:
    - methodical
    - cautious
    - honest about limits
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [14, 18]
    constitution: [12, 16]
  catalog_items: []
  inventory_hints:
    - reinforced pack frame with wide straps
    - cloth wraps for separating metals (anti-mite)
    - a personal scale for tracking weight in real-time
  dialogue_quirks:
    - tells you exactly how much weight they will carry and not one ounce more
    - shakes their head when you pick up something heavy
  disposition_default: 0
  ocean:
    openness: 2.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: hireling
  morale: 6
