# Bugbear 1. CR CEILING 1 → shallow-only. No SRD goblinoid capstone
# exists ("Hobgoblin Warlord" is NOT in SRD 5.1). Deliberately
# big_bad-less harrier faction; low-ceiling re-roll case (see
# "Data-Forced Design Item").
