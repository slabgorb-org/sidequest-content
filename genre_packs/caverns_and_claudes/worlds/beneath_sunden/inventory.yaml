# beneath_sunden world-tier inventory (story 120-1, epic 120).
#
# The 11 dungeon-flavor / found-treasure items below have NO Worlds Without
# Number SRD analog, so they cannot live at the WWN genre baseline (which is
# 100% mode=verbatim — ADR-145 D3). Per ADR-140 (flavor in the world) they live
# here at the world tier as mode=bespoke. They MERGE (union) over the genre
# baseline at resolve time, so a beneath_sunden delver sees the full WWN catalog
# plus these eleven.
#
# KIT TRAP (ADR-140 / world-replaces-genre): a world inventory.yaml REPLACES the
# genre currency / starting_equipment / starting_gold / philosophy WHOLESALE — it
# is not merged per-field. So those four blocks below are copied from the genre
# baseline verbatim (or every class would ship an empty kit). The one intentional
# delta is the Delver starting kit, which re-adds the bespoke ten_foot_pole and
# chalk on top of the WWN-pure genre kit — the classic dungeon loadout the genre
# baseline can't carry.

currency:
  name: silver
  denominations:
    - copper
    - silver
    - gold

item_catalog:
  # === DUNGEON FLAVOR (no WWN SRD analog) ===
  - id: ten_foot_pole
    name: Ten-Foot Pole
    description: A wooden pole, ten feet long. For prodding things you do not wish to touch.
    category: equipment
    value: 1
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [utility, essential, probe]
    lore: The second most important item after the torch. Prod the floor. Prod the chest. Prod the corpse. If nothing happens, proceed.
    narrative_weight: 0.2
    provenance:
      mode: bespoke

  - id: chalk
    name: Chalk (bundle)
    description: A bundle of white chalk sticks for marking walls and mapping.
    category: equipment
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [utility, mapping, consumable]
    lore: Mark where you have been. The dungeon sometimes erases the marks.
    narrative_weight: 0.1
    provenance:
      mode: bespoke

  - id: helmet_iron
    name: Iron Helmet
    description: A simple iron pot helm. Protects the skull at the cost of peripheral vision.
    category: armor
    value: 15
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [head-armor]
    lore: The dungeon's favorite trick is things falling on your head. Wear the helmet.
    narrative_weight: 0.1
    provenance:
      mode: bespoke

  - id: lockpicks
    name: Set of Lockpicks
    description: Six slender steel picks rolled in oiled leather. Most of the trade is patience and pressure.
    category: utility
    value: 30
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [tool, thieves]
    lore: A locked door is a door that hasn't met the right professional.
    narrative_weight: 0.4
    provenance:
      mode: bespoke

  # === ARCANE/DIVINE FOCI (no WWN SRD analog) ===
  - id: spellbook
    name: Spellbook
    description: A leather-bound tome of incantations, half of which the owner can actually cast.
    category: utility
    value: 100
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [magic, focus, fragile]
    lore: Without the book, the mage is just a person with bad eyesight.
    narrative_weight: 0.6
    provenance:
      mode: bespoke

  - id: component_pouch
    name: Component Pouch
    description: A leather pouch divided into a dozen small compartments, each holding the strange materials the spellbook demands — bat guano, sulfur, dried newt.
    category: utility
    value: 25
    weight: 2.0
    rarity: common
    power_level: 1
    tags: [magic, container]
    lore: Half the cost of casting is the shopping list.
    narrative_weight: 0.3
    provenance:
      mode: bespoke

  - id: holy_symbol
    name: Holy Symbol
    description: A worn metal token bearing the cleric's chosen sigil. Held forward when faith is needed in front of teeth.
    category: utility
    value: 25
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [magic, focus, divine]
    lore: The dungeon does not always recognize the symbol. It does not need to. The cleric does.
    narrative_weight: 0.4
    provenance:
      mode: bespoke

  # === FOUND TREASURE (magic consumables; no WWN SRD analog) ===
  - id: scroll_light
    name: Scroll of Light
    description: A single-use scroll that floods a room with pale white light for ten minutes.
    category: magic
    value: 50
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [magic, consumable, light, scroll]
    lore: Written in a language that burns the page as you read it. One use. Make it count.
    narrative_weight: 0.4
    provenance:
      mode: bespoke

  - id: potion_healing
    name: Potion of Mending
    description: A cloudy red liquid in a glass vial. Tastes like rust and closes wounds.
    category: magic
    value: 75
    weight: 0.2
    rarity: rare
    power_level: 2
    tags: [magic, consumable, healing, potion]
    # Story 106-4: heal magnitude per the WWN-SRD escalation ruling
    # (gm-decisions 2026-06-13). WWN SRD has no standard healing potion, so
    # anchored to the WWN-family Lazarus-Patch idiom (1d6+level). 1d6+2 on a
    # ~10-HP L1 pool is a reprieve, not a reset — keeps the lethal ramp.
    heal_amount: "1d6+2"
    lore: Does not heal cleanly. The scar tissue is thick and numb. But you are alive.
    narrative_weight: 0.4
    provenance:
      mode: bespoke

  - id: potion_healing_greater
    name: Potion of Mending (Greater)
    description: A clear, almost luminous draught in a faceted vial. The good stuff — rare and dear.
    category: magic
    value: 200
    weight: 0.2
    rarity: very_rare
    power_level: 3
    tags: [magic, consumable, healing, potion]
    # Story 106-4: the "better" potion — the 30% upgrade of the guaranteed kit
    # heal. 2d6+2 is roughly a full L1 pool; same WWN-family idiom, one tier up.
    heal_amount: "2d6+2"
    lore: Closes the wound clean, no scar. Whoever brewed this knew what they were doing.
    narrative_weight: 0.5
    provenance:
      mode: bespoke

  - id: wand_spark
    name: Wand of Sparks
    description: A charred bone wand with three charges. Each charge throws a fistful of fire.
    category: magic
    value: 150
    weight: 0.3
    rarity: rare
    power_level: 3
    tags: [magic, consumable, weapon, wand]
    lore: Three shots. Do not waste them on goblins.
    narrative_weight: 0.5
    provenance:
      mode: bespoke

starting_equipment:
  # Copied from the genre baseline (world-replaces-genre), with the dungeon
  # loadout restored: the WWN-pure genre kit PLUS the bespoke ten_foot_pole and
  # chalk the genre tier can't carry. Every id resolves in the merged catalog
  # (genre wwn_* baseline ∪ this world's bespoke items).
  Delver:
    - wwn_torch
    - wwn_torch
    - wwn_torch
    - wwn_rations_one_week
    - wwn_waterskin_one_gallon
    - wwn_rope_50ft
    - ten_foot_pole
    - wwn_iron_spikes_10
    - chalk
    - wwn_dagger

starting_gold:
  # Copied verbatim from the genre baseline (world-replaces-genre trap).
  Delver: 10
  Warrior: 60
  Expert: 75
  Mage: 80

philosophy:
  # Copied verbatim from the genre baseline (world-replaces-genre trap).
  carry_limit: 30
  restricted_categories: []
  progression_gates: {}
