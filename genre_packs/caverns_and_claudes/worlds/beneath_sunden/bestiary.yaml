      - "Still at the shift — keeps to the work it died doing; breaks off pursuit at its gallery's edge"
    description: >-
      A dwarfhold laborer the deep kept after the body stopped. It still
      carries the tool it clocked in with, still walks its old shift line,
      and treats anything on that line as a seam to be worked. There are
      hundreds of them and no ledger of names; the hold's records burned
      with the hold.

