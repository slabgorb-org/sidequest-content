# Beneath Sünden — the descent.
#
# A single shaft into the dwarfhold of Sünden Deep, which dug a vein
# that did not end where veins end. There is no second mouth and no
# third sin: there is the dark, how far down you are willing to go,
# and the count of who went to the rope and who the rope brought back.
#
# The DUNGEON IS NOT AUTHORED HERE. The deep is generated, unbounded,
# by the Sünden Deep procedural engine (Plans 5-7). This manifest
# authors only the static surface anchor — the manifest, the
# waiting-camp at the lip (cartography region `ropefoot`), and the
# shaft mouth itself (cartography region `the_dropmouth`, the
# documented Plan-7 expansion seam). Genre truth — grave, lethal,
# Moria-as-tragedy, gravity >= 0.85, no winking — is fixed and
# enforced by world_register.yaml; the name "Sünden" is the dwarfhold's
# name and is never explained.

cover_poi: the_dropmouth
name: "Beneath Sünden"
slug: beneath_sunden
description: >-
  One mouth. It goes down. The dwarfhold of Sünden Deep cut a vein
  that did not end where veins end, and what they reached did not stay
  reached. No crew came up to say where the gold went — only what
  answered them did, and it is still answering. The camp at the lip is
  not a town and was never meant to be one: a winch and its house, a
  board where the unreturned are burned in by name, a fire kept because
  the cold that climbs the rope does not like it, and a short roster of
  people who have decided not to go down again and have not yet decided
  to leave. There is no walking to a second dungeon. There is the rope,
  the weight on it, and the count of how many of you went down against
  how many the rope brought back.
tagline: "One mouth. It only goes down. The deep keeps a count too."
starting_location: "Ropefoot, at the winch-house fire, before the rope"
tone: "Grave, lethal, Moria-as-tragedy. No winking. The name is never explained."
axis_snapshot:
  comedy: 0.05
  gravity: 0.9
  outlook: 0.2
extensions:
  - creatures
  - rooms
  - cookbook
  - world_register
