id: sunless_temple
display_name: The Sunless Temple
generator_class: labyrinthine
interior:
  # depthfirst maze (story 158-19): the temple binds the necropolis look
  # (generator_binding: depthfirst) — undead-heavy faction matching the
  # acolyte-shades + altar-horror, and a "mausoleum-formal, straight lines"
  # register that fits colonnaded halls. Was built/roomcorridor, but
  # beneath_sunden ships no roomcorridor look (only depthfirst/cellular/prim),
  # so roomcorridor is unmaterializable here. braid_ratio 0.3 = some hall
  # connectivity (architecture, not a pristine trap maze).
  algorithm: depthfirst
  params: {}
  braid_ratio: 0.3
# Random-dungeon eligibility (story 158-19): eligible at every depth; the
# the_altar_that_waits set-piece (min 45) + altar_horror (min 80) carry difficulty.
depth_band: {min: 0.0, max: null}
narrator:
  register: grave
  flavor: >-
    Deliberate halls, squared and colonnaded, raised to something that
    expected to be fed. The architecture itself is a demand.
  motifs: [temple, sacrifice, the_old_demand, deliberate_stone]
adjacency:
  prefers: [bone_crypt]
  avoids: [drowned_cavern]
creature_table:
  - {ref: temple_acolyte_shade, weight: 2.0}
  - {ref: altar_horror, weight: 1.0, depth_band: {min: 80.0}}
loot_table:
  - {ref: votive_gold, weight: 2.0}
  - {ref: sacrificial_regalia, weight: 1.0}
set_pieces:
  - id: the_altar_that_waits
    name: The Altar That Waits
    telegraph: >-
      The approach is swept clean and the channels cut into the altar
      stone are dark and dry — and recently scrubbed. It is ready.
    outcome: >-
      The channels were scrubbed clean for the next offering; the demand has
      been counting since long before you arrived, and it does not pause for
      your deliberation.
    depth_band: {min: 45.0, max: null}
    slots:
      - name: features
        options:
          - {value: blood_channel_altar, weight: 1.0}
      - name: creatures
        options:
          - {value: waking_acolytes, weight: 2.0}
          - {value: the_thing_the_temple_feeds, weight: 1.0}
    trope_components:
      - trope_id: priest_demands_a_sacrifice
        params: {countdown_expansions: 2}
    quest_components:
      - quest_id: deny_or_feed_the_altar
        params: {irreversible: true}
quest_template:
  signature: reach_deep
  title: "Beneath the Old Demand"
  objective: "The colonnaded halls were built over something older than the cult that raised them — find the descent the acolytes sealed when the offerings stopped, and open it."
