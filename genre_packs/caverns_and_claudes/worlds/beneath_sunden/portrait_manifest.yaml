# Beneath Sünden — character portrait manifest.
#
# This world has NO pre-authored named-NPC portrait set, and that is the
# true and complete state — not a placeholder. world_register.yaml's
# humanoid_constraint fixes it: "Humanoid only as grave cultists/bandits/
# the delved-too-deep — never townsfolk-tone." There are no townsfolk
# here. The people at the lip are the ones who keep the rope and keep
# the count; the things below are the deep's grammar. Any humanoid the
# party meets is materialized at runtime under the genre-truth gate, not
# drawn from a fixed portrait roster. Authoring named portraits here
# would manufacture a peopled-warmth register the world explicitly does
# not have.
#
# WHY THIS FILE EXISTS ANYWAY (verified wiring, do not delete):
# The daemon's catalog-composed render path is what serves POI images in
# this world. zimage_mlx_worker._get_composer (l.67) unconditionally
# calls CharacterCatalog.load for the world, and CharacterCatalog.load
# (catalogs.py:52-53) does `yaml.safe_load(path.read_text())` with NO
# existence guard — the file MUST exist or every render in this world
# dies with FileNotFoundError and the daemon closes the socket without a
# response (observed 2026-05-17: all 5 POI renders failed this way until
# this file was added). `characters: []` makes load() return a valid
# empty catalog: read_text() succeeds, the named-NPC loop body never
# runs over any townsfolk-warmth entry. This is the correct, contract-true
# representation of "this world has no authored *named-NPC* character
# portraits", not a stub.
#
# UPDATE 2026-06-12: the `characters:` list is no longer literally empty —
# it now carries PLAYER-PICKER face options (type: player_picker) appended
# below, matching the mutant_wasteland/seaboard_of_saints pilot, which also
# nests its picker block under `characters:`. These are NOT named NPCs and
# do NOT reintroduce townsfolk-warmth: they are the chargen face pool for
# the delver the player will play (New Arrival / Scarred Delver / Salvager
# register — the permitted humanoid tone at the lip). The original
# load()-must-not-FileNotFoundError contract is unchanged: the file still
# exists and parses to a valid catalog.

characters:

# ═══════════════════════════════════════════════════════════════════════
# PLAYER-PICKER PORTRAITS — character-creation face options
#
# Every player at Ropefoot arrives as a person who came up the dead road
# and is rigging for the descent — so the picker faces ARE the permitted
# humanoid register here (the New Arrival / Scarred Delver / Salvager
# types), not townsfolk-warmth.
#
# Mirrors the mutant_wasteland/seaboard_of_saints pilot's player_picker
# block: id `picker_<culture>_<short_role>_<sex><nn>`; `appearance` is
# terse, ONE FACE, head-and-shoulders only — NO scene prose (the backdrop
# is composed from `backdrop_poi`, a real rendered POI for this world).
#
# CULTURE: this world has exactly one playable person-culture. The pack
# cultures.yaml ships three naming cultures — Surface Folk (people),
# Keeper Titles (villain epithets, not a person culture), and Dungeon
# Names (place-name kennings, not a person culture). Only Surface Folk
# yields playable faces; the camp at the lip is entirely Surface Folk who
# came up the dead road. So all pickers are `culture: surface_folk`,
# varied across archetype and the four B/X classes, M/F balanced 9/9.
#
# TONE: grave, lethal, Moria-as-tragedy. No whimsy, no warmth. These are
# faces shaped by the dead road and the rope. Renders inherit the world's
# B&W Otus/Trampier ink discipline from visual_style.yaml positive_suffix.
#
# BACKDROPS (all verified in r2_manifest.json): the_kept_fire,
# the_rigging_benches, the_winch_house, the_dropmouth,
# the_board_of_the_unreturned.
# ═══════════════════════════════════════════════════════════════════════

# ── Picker · Surface Folk · New Arrival ─────────────────────────────────

  - id: picker_surface_folk_new_arrival_m01
    name: picker surface folk new arrival m01
    role: New Arrival
    type: player_picker
    culture: surface_folk
    archetype: New Arrival
    sex: male
    backdrop_poi: the_kept_fire
    appearance: >-
      Man, early twenties. Open square face still soft at the jaw, weather
      not yet cut into it. Brown hair pushed back, clear hazel eyes too
      bright for this place, a few days' road-dust on his cheek. Clean
      unscratched leather at the collar. The eager look the camp recognizes.

  - id: picker_surface_folk_new_arrival_f01
    name: picker surface folk new arrival f01
    role: New Arrival
    type: player_picker
    culture: surface_folk
    archetype: New Arrival
    sex: female
    backdrop_poi: the_kept_fire
    appearance: >-
      Woman, mid-twenties. Round wind-reddened face, freckles across the
      nose, dark eyes still asking questions the camp stopped answering.
      Chestnut hair in a loose road-braid coming undone. Sunburn at the
      hairline. A new buckled collar, the leather pale and unworn.

# ── Picker · Surface Folk · Scarred Delver ──────────────────────────────

  - id: picker_surface_folk_scarred_delver_m01
    name: picker surface folk scarred delver m01
    role: Scarred Delver
    type: player_picker
    culture: surface_folk
    archetype: Scarred Delver
    sex: male
    backdrop_poi: the_rigging_benches
    appearance: >-
      Man, forties. Lean grey-stubbled face hollowed at the cheek, one
      eye clouded white and the lid scarred shut above it. Dark hair gone
      iron at the temples. The good eye too steady. A burn-seam crosses
      the jaw into a high collar of cracked leather.

  - id: picker_surface_folk_scarred_delver_f01
    name: picker surface folk scarred delver f01
    role: Scarred Delver
    type: player_picker
    culture: surface_folk
    archetype: Scarred Delver
    sex: female
    backdrop_poi: the_rigging_benches
    appearance: >-
      Woman, late thirties. Sharp drawn face, skin gone grey-pale from
      lampless months, deep-set eyes that flinch at no sound and hold no
      ease. Black hair shorn close on one side over a ridge of old scar.
      A thin pale line splits one brow. Worn rope-burned collar.

# ── Picker · Surface Folk · Salvager ────────────────────────────────────

  - id: picker_surface_folk_salvager_m01
    name: picker surface folk salvager m01
    role: Salvager
    type: player_picker
    culture: surface_folk
    archetype: Salvager
    sex: male
    backdrop_poi: the_winch_house
    appearance: >-
      Man, fifties. Broad weathered face, shrewd narrow eyes that price a
      stranger before they sit. Grey-shot beard cropped close, a nose
      broken and set crooked. A grease-smudge along one cheekbone. Layered
      collars of salvaged leather, none of it originally his.

  - id: picker_surface_folk_salvager_f01
    name: picker surface folk salvager f01
    role: Salvager
    type: player_picker
    culture: surface_folk
    archetype: Salvager
    sex: female
    backdrop_poi: the_winch_house
    appearance: >-
      Woman, forties. Lean shrewd face, quick assessing grey eyes, a flat
      unsentimental mouth. Sandy hair scraped back hard under a leather
      band. A hand-scale's cord looped at her throat. A faint old soot-mark
      at the temple. Collar of cleaned, re-sold hide.

# ── Picker · Surface Folk · Winch-Keeper ────────────────────────────────

  - id: picker_surface_folk_winch_keeper_m01
    name: picker surface folk winch keeper m01
    role: Winch-Keeper
    type: player_picker
    culture: surface_folk
    archetype: Winch-Keeper
    sex: male
    backdrop_poi: the_winch_house
    appearance: >-
      Man, late fifties. Heavy seamed face, jaw set like a man who counts
      before he speaks. Deep-set tired eyes, grey brows, white stubble.
      A burn-scar webs the back of one hand lifted near the collar. Plain
      worn iron-grey wool at the throat. The flattened look of repeated loss.

  - id: picker_surface_folk_winch_keeper_f01
    name: picker surface folk winch keeper f01
    role: Winch-Keeper
    type: player_picker
    culture: surface_folk
    archetype: Winch-Keeper
    sex: female
    backdrop_poi: the_winch_house
    appearance: >-
      Woman, fifties. Square steady face cut deep at the mouth, pale eyes
      that hold a tally behind them. Iron-grey hair bound tight and plain.
      A faint hot-iron scar at one knuckle near the jaw. Heavy practical
      collar of soot-darkened wool. An expression worn flat by the count.

# ── Picker · Surface Folk · Rope-Watcher ────────────────────────────────

  - id: picker_surface_folk_rope_watcher_m01
    name: picker surface folk rope watcher m01
    role: Rope-Watcher
    type: player_picker
    culture: surface_folk
    archetype: Rope-Watcher
    sex: male
    backdrop_poi: the_board_of_the_unreturned
    appearance: >-
      Man, sixties. Gaunt grief-locked face, hollow cheeks, eyes fixed on
      something out of frame and not letting go. Thin white hair, grey
      week-old beard he has stopped tending. A blanket-edge pulled to the
      collar. The still, waiting look of a man who will not turn away.

  - id: picker_surface_folk_rope_watcher_f01
    name: picker surface folk rope watcher f01
    role: Rope-Watcher
    type: player_picker
    culture: surface_folk
    archetype: Rope-Watcher
    sex: female
    backdrop_poi: the_board_of_the_unreturned
    appearance: >-
      Woman, fifties. Drawn hollow face, dry-eyed past weeping, gaze held
      on the drum no one else watches anymore. Grey hair loose and
      unkempt. A flat worn-out voice you can read in the set of the mouth.
      A shawl drawn close at the throat. Grief gone quiet and fixed.

