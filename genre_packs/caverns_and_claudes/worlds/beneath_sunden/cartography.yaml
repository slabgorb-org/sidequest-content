# Beneath Sünden — surface cartography. REQUIRED by _load_single_world
# (loader.py:734, CartographyConfig). This authors ONLY the static
# surface anchor: two regions —
#   ropefoot       — the waiting-camp at the lip (starting_region)
#   the_dropmouth  — the shaft mouth itself (cover_poi); its downward
#                    route is the documented Plan-7 expansion seam
#
# navigation_mode is REGION (not room_graph) by deliberate design:
# _load_cartography (loader.py:597) only consults a sibling rooms.yaml
# when navigation_mode == room_graph. Keeping it `region` fences the
# procedural room-graph runtime lane (Sünden Deep engine, Plans 5-7)
# cleanly out of this static anchor. The deep is GENERATED, not authored
# here — no dungeon region exists below the_dropmouth by design.

world_name: "Beneath Sünden"
starting_region: ropefoot
navigation_mode: region
map_resolution: null
map_style: >-
  Bootworn charcoal on a single salvaged board, drawn by people who
  only ever needed to know two things — where the fire is and where the
  rope is. Bare scoured stone, no border, no compass rose; one mark for
  the winch and one heavier mark, gone over many times, for the mouth.

regions:
  ropefoot:
    name: Ropefoot
    summary: >-
      The bootworn camp at the lip of the only shaft — winch-house,
      the kept fire, and the board where the unreturned are burned in.
    description: >-
      Not a town and never built as one. Ropefoot is the flat of
      scoured stone the rope comes up onto, and the few things people
      put there because the rope made them necessary: the winch-house
      over the drum, the fire that is never let go out, two ranks of
      plank benches worn pale where parties sit to rig before they go
      down, and the board. There is no inn, no market, no temple — a
      delver who wants those walks the dead road back out, and most who
      can still walk it do not come back. The people here are the ones
      who keep the rope and the ones who have stopped going down and
      have not yet left. They are courteous in the spare way of a place
      that knows a fraction of its dead by name and the rest by the
      length of time the rope stayed slack.
    terrain: settlement
    adjacent:
      - the_dropmouth
    landmarks:
      - name: "The Winch-House"
        type: civic
        description: >-
          A low timber house built over the drum, open on the shaft
          side. The winch-keeper works it and counts it: who went onto
          the rope, when, and whether the rope came back light or heavy
          or not at all. The drum's pawl is filed loud on purpose — the
          camp likes to hear it catch.
      - name: "The Kept Fire"
        type: hearth
        description: >-
          A stone-ringed fire on the shaft side of the benches, fed in
          rota, never out. It is not ceremony. The cold that climbs the
          rope thins where the fire is, and that is the one thing
          Ropefoot is certain of, so the fire is the one thing Ropefoot
          never neglects.
      - name: "The Board of the Unreturned"
        type: monument
        description: >-
          A single salvaged plank wall on the lee side of the
          winch-house, the names burned in with an iron because no one
          here has the tools or the heart to carve. New names go on at
          the hour the rope is finally given up on. The board is the
          camp's only record and the campaign's only scorekeeper; the
          length of it is how you measure how long this has been going.
      - name: "The Rigging Benches"
        type: muster
        description: >-
          Two ranks of plank benches where parties check each other's
          knots and lamps before the rope. Worn pale in the middle, dark
          at the ends. It is understood that you sit, you rig, you go —
          the benches are not for sitting long, and everyone knows what
          sitting long means.
    settlements:
      - Ropefoot
    rivers: []

  the_dropmouth:
    name: The Dropmouth
    summary: >-
      The shaft itself — winch, rope, and the cold draught that climbs
      it. The last lit place; the seam between the built and the deep.
    description: >-
      The mouth is a worked collar of dwarf-cut stone going straight
      down into a dark the lamps do not reach the bottom of. The rope
      runs over the winch's lip, wet for the first arm's length and then
      simply gone. A draught comes UP the shaft — steady, colder than
      the night on the saddle, smelling of wet rock and the underside of
      old iron — and it does not vary with the wind because it does not
      come from the wind. This is the last place that is lit and built
      and counted. Past the rope's first length the hold's stonework
      stops being something people maintain and starts being something
      the deep is keeping, and no two parties have come back up
      describing the same way down. Ropefoot writes none of it on the
      board's good side. It only writes the names.
    terrain: descent
    cover_poi: the_dropmouth
    adjacent:
      - ropefoot
    landmarks:
      - name: "The Collar"
        type: dungeon_entrance
        description: >-
          The dwarf-cut rim of the shaft, chalked at the edge where
          parties mark their descent time. The chalk is re-marked every
          delve; the stone under it is worn to a shine by two lifetimes
          of hands taking the same last hold.
      - name: "The Rope"
        type: threshold
        description: >-
          Longer than a shaft this deep should need, and the camp has
          stopped asking why it is never quite long enough. It is
          checked at the benches and trusted to the winch. Where it ends
          is not a place anyone at Ropefoot will claim to know.
    settlements: []
    rivers: []

# The descent seam (Sünden Deep spec §5 / Plan 7 handoff).
#
# This route documents the static->procedural boundary WITHOUT authoring
# any dungeon. `to_id: deep_descent` is a SEAM SENTINEL: Plan 7's
# materializer recognises it as "root Stage-1 'surface entrance'
# expansion here". No authored region carries that id by design — the
# deep is generated, unbounded, at runtime. It is recorded as a route
# (not as `the_dropmouth.adjacent`) so surface adjacency stays
# referentially clean and nothing dangles for a future region validator.
routes:
  - name: "Down the Rope"
    description: >-
      The one-way descent. From the lit collar at the Dropmouth, down
      the rope into the generated deep. This is the documented seam
      where the static surface anchor ends and the Sünden Deep
      procedural engine (Plans 5-7) roots its Stage-1 expansion. There
      is no authored region on the far side of this route by design.
    from_id: the_dropmouth
    to_id: deep_descent
    distance: "one rope"
    danger: "total — the count on the board is the danger rating"
