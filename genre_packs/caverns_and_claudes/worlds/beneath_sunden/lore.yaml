# Beneath Sünden — world lore. REQUIRED by _load_single_world
# (loader.py:732, WorldLore). This is the world's OWN identity: one
# dwarfhold that dug too deep, Moria-as-tragedy, played straight. It is
# NOT caverns_sunden's three-sins hub — no Grimvault/Horden/Mawdeep, no
# Seven Deadly Sins, no Keeper-of-sins. The name "Sünden" is the lost
# hold's name and is never explained or winked at.

world_name: "Beneath Sünden"

history: >-
  Sünden Deep was a working hold. Not a legend, not a curse — a hold,
  with a guild ledger and a smelter and a count of how much silver came
  up each season. The dwarves who cut it followed a good vein down
  through the granite, and then through the cold rock under the granite,
  and then past the level where veins give out, because the assays kept
  coming back richer the deeper they cut and nobody who could read the
  ledger wanted to be the one to stop. They cut past where digging
  stops. What the deepest gallery broke into was not ore.

  No one came up from the deep delve to enter it in the ledger. The hold
  did not fall in a battle anyone witnessed; it simply stopped sending
  word, and then stopped sending anyone, and the upper galleries went
  quiet in the order a thing goes quiet when it is being emptied from
  below. The dwarves of Sünden Deep are not down there waiting to be
  rescued. That delve is two long lifetimes closed. What is down there
  now came up to the dark from somewhere the dwarves opened and could
  not close, and it has had those two lifetimes to learn the shape of
  the shaft.

  Ropefoot is not the hold's heir. The people at the lip are the ones
  who came after — drawn up the dead road by the same rumor that has
  always worked, that a hold this rich could not have spent itself, that
  the silver is still down there with the dead who counted it. Some of
  that is even true. The camp learned what the rumor leaves out by the
  only method the deep teaches: it counted who went down against who the
  rope brought back, and it kept the count where everyone could see it.

geography: >-
  One shaft. There is no second mouth and there is no walking-to —
  Sünden Deep is a single vertical wound in a saddle of dead stone, and
  everything that is hand-built here is built around the head of it. The
  Dropmouth is the shaft itself: a winch, a rope longer than the rope
  should need to be, and a draught of cold that comes UP it, steadily,
  colder than the night on the surface, smelling of wet rock and the
  underside of old iron. Ropefoot is the bootworn ground at the lip — a
  winch-house, a fire that is never let go out, plank benches where
  parties form, and the board where the unreturned are burned in by
  name because no one here has the tools or the heart to carve.

  Nothing grows on the saddle. The road in crosses a half-day of bare
  scoured rock and is the same road out; it carries more people in than
  it ever carries back, and the camp has stopped pretending otherwise.
  Below the lip the deep is not mapped, because the deep does not hold
  still to be mapped — every party that has come back up has come back
  up describing a different way down, and the camp has learned to write
  down none of it. The surface is fixed and small and known to the inch.
  The dark under it is neither.

cosmology: >-
  No one at Ropefoot can tell you what is down there, and the ones who
  could did not come back to be asked. The camp keeps no theology and
  no name for it. What is known is procedural and grim: the deep does
  not keep its dead. Things that should have stopped go on down there —
  go on counting, go on working, go on coming up the shaft the slow
  patient way a draught comes up it — and a delver who dies far enough
  down is understood, by everyone at the fire, to not be finished.
  Ropefoot does not debate why. It keeps the fire, because the cold that
  climbs the rope does not like the fire, and that single observed fact
  is the whole of the camp's cosmology.

  The dwarves opened something at the bottom of an honest hole dug for
  honest reasons, and it answered, and it has not stopped answering. The
  hold's name survives only as the name of the hole. The camp uses it
  the way you use any place-name — flatly, without ceremony, because the
  alternative is to think about it.

themes:
  - "Moria-as-tragedy: an honest, working hold that dug past where digging stops and did not survive its own ambition"
  - "One descent. There is no hub, no second mouth, no walking to a different dungeon"
  - "The board of the unreturned is the regional memory — the count is the campaign"
  - "Ropefoot are the ones who came after, not the hold's heirs — no rescue is possible; the delve is two lifetimes closed"
  - "The deep does not keep its dead; the undead are the deep's grammar, not a twist"
  - "The surface is fixed, small, and known; the dark below is unmapped and unmappable by design"
  - "The fire is kept because the cold dislikes it — the camp's only certainty is an observed one"

genre_conventions:
  - "Played straight, grave, lethal. Never wink. Never explain or gloss the name 'Sünden'"
  - "The rope is the camera — campaign maturity reads off the count of the unreturned"
  - "No three-sins structure, no Keeper, no Seven — this world shares only an engine with caverns_sunden, not an identity"
  - "Humanoids appear only as the delved-too-deep, grave rope-keepers, or those who will not go down again — never townsfolk-tone (world_register humanoid_constraint)"
  - "The deep is generated and unbounded (Sünden Deep procedural engine); never author a fixed map of it or imply one exists"
  - "Coming back changed, or not coming back, is the only progression the camp measures or narrates"
  - "Hope is not absent, but it is expensive and it is quiet — outlook stays low; relief is the fire, not rescue"
