room_type: settlement
name: Under the Rope
description: 'The rope ends here. Above, the collar of the shaft is a coin of grey light, too far to read faces by. The floor is a fan of everything that ever fell: rotted cord, a boot with the buckle still done, bones sorted by the water into sizes.


  Something small moves in the bone-drifts when the light does. Then more than one something.


  Three mouths of dark lead away from the landing, and none of them are marked, because everyone who could have marked them was going down for the first time too.'
