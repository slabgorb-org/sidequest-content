# Beneath Sünden — World Culture: Surface Folk
#
# World-level culture file. The daemon's StyleCatalog reads world-level
# cultures/*.yaml (sidequest-daemon/sidequest_daemon/media/catalogs.py::
# StyleCatalog.load); the picker portraits bind culture: surface_folk, so
# this file must exist or every render raises CatalogMissError.
#
# Schema matches the working mutant_wasteland world culture files: name,
# summary, description, slots (inline word_list — this pack ships no
# names/ files, so no names_file references are used), person_patterns,
# place_patterns, chargen: true.
#
# Name pools are inherited from the pack-level "Surface Folk" entry in
# genre_packs/caverns_and_claudes/cultures.yaml: grim, functional, Anglo
# dungeon-country names — the practical, expendable people who came up the
# dead road. No visual_tokens block: the world positive_suffix already
# carries the full B&W Otus/Trampier ink medium and tonal discipline, and
# the catalog defaults absent visual_tokens to empty.

name: Surface Folk
summary: The practical, expendable people of dungeon country who came up the dead road.
description: >-
  The ordinary folk of the towns and villages clinging to the edges of
  dungeon country — the ones who came up the dead road and stayed. They
  carry rope and lantern, take the work no one else will, and bury their
  own without ceremony. Practical names, no pretension, weathered faces.
slots:
  given_name:
    word_list: [Aldric, Bram, Cob, Durn, Edric, Falk, Griff, Hale, Ivo, Joss, Kern, Lud, Morden, Noll, Osric, Penn, Rolf, Sven, Tam, Wulf, Agna, Britt, Calla, Dagna, Elka, Fenna, Greta, Hild, Inga, Jula, Kess, Lira, Maren, Nessa, Ora, Petra, Runa, Sigri, Tova, Wynn, Ash, Beck, Clay, Dale, Flint, Glen, Hart, Kit, Moss, Pike, Reed, Sage, Stone, Thatch, Vale, Wren]
  family_name:
    word_list: [Blackhand, Ironjaw, Stonehelm, Ashgate, Oakwell, Copperbridge, Saltwall, Peatford, Baker, Brewer, Carter, Ditcher, Forger, Miller, Plower, Tanner, Thatcher, Welder]
  hireling_name:
    word_list: [Bort, Clem, Dob, Fen, Grist, Hob, Jek, Kel, Lob, Midge, Nub, Ork, Pim, Rog, Snit, Tork, Vetch, Wort, Yam, Zeb]
person_patterns:
- '{given_name} {family_name}'
- '{hireling_name}'
place_patterns:
- '{family_name} Square'
- "The {given_name}'s Rest"
chargen: true
