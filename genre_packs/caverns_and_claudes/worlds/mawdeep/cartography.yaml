# Mawdeep — Surface Cartography
# Overrides genre-level cartography with Gristwell specifics
# Surface uses region mode; the dungeon itself uses room_graph from rooms.yaml

navigation_mode: room_graph
starting_region: gristwell_square
map_style: >-
  Ink crosshatch dungeon map on graph paper, torchlight illumination,
  hand-drawn compass rose, notation marks and chalk tallies, Dyson
  Logos style cartography

regions:
  gristwell_square:
    name: Gristwell Square
    description: >-
      A muddy clearing surrounded by low timber buildings. The well at
      the center draws water from an underground spring that runs too
      warm for comfort. The provisioner's shop faces the tavern across
      thirty feet of churned mud. A wooden signpost lists dungeon-related
      services and nothing else.
    adjacent:
      - bonecounter_alley
      - mawdeep_mouth
    landmarks: []

  bonecounter_alley:
    name: Bonecounter Alley
    description: >-
      Behind the tanner's shop, down stone steps that smell of lye.
      Kel Bonecounter operates from a cellar room. The door is always
      closed. Knock twice, wait, knock once more.
    adjacent:
      - gristwell_square
    landmarks: []

  mawdeep_mouth:
    name: The Mouth of Mawdeep
    description: >-
      A quarter mile east of town, where the hillside splits open. Sixty
      feet across. Stone lips worn smooth. Cold air breathes outward in
      a rhythm that is not wind. Chalk marks from previous parties cluster
      near the entrance. The ground around the mouth is bare — nothing
      grows within fifty feet of the opening.
    adjacent:
      - gristwell_square
    landmarks: []

routes:
  - name: Bonecounter Steps
    from_id: gristwell_square
    to_id: bonecounter_alley
    description: Behind the tanner's, down the stone steps to Kel's cellar
  - name: Back to the Square
    from_id: bonecounter_alley
    to_id: gristwell_square
    description: Up the steps, past the lye stink, back to the square
  - name: The Rutted Track
    from_id: gristwell_square
    to_id: mawdeep_mouth
    distance: short
    description: A rutted track east through bare ground to the hillside
  - name: The Walk Back
    from_id: mawdeep_mouth
    to_id: gristwell_square
    distance: short
    description: The track back to Gristwell — it always feels shorter than the walk out
