# Mawdeep — Surface Cartography
# Overrides genre-level cartography with Gristwell specifics

regions:
  - id: gristwell_square
    name: Gristwell Square
    description: >-
      A muddy clearing surrounded by low timber buildings. The well at
      the center draws water from an underground spring that runs too
      warm for comfort. The provisioner's shop faces the tavern across
      thirty feet of churned mud. A wooden signpost lists dungeon-related
      services and nothing else.
    terrain: settlement
    tags: [town, hub]
    poi:
      - name: "Petra's Provisions"
        description: >-
          A narrow shop with barred windows. Inside: torches stacked like
          cordwood, rope coiled on pegs, rations in waxed paper. A tally
          wall behind the counter. Most marks are not crossed out.
        tags: [shop, essential]
      - name: "The Tally Tavern"
        description: >-
          Low ceiling, smoke-darkened beams, a bar made from a single slab
          of dungeon stone. Old Morden holds court in the corner booth,
          nursing a mug and a grudge against the dark. Hirelings gather
          at the far end, sizing up potential employers.
        tags: [tavern, rumors, hirelings]
      - name: "The Hireling Post"
        description: >-
          A board nailed to the tavern's exterior wall. Names and rates
          chalked in a column. Torchbearers are cheap. Sellswords are not.
          Porters are in between. All rates are per delve, paid up front.
        tags: [hirelings, recruitment]

  - id: bonecounter_alley
    name: Bonecounter Alley
    description: >-
      Behind the tanner's shop, down stone steps that smell of lye.
      Kel Bonecounter operates from a cellar room. The door is always
      closed. Knock twice, wait, knock once more.
    terrain: settlement
    tags: [town, commerce, fence]
    poi:
      - name: "Kel's Table"
        description: >-
          A table with scales made from a dungeon creature's jaw. A ledger
          in bone-tally cipher. A pouch of teeth for counting. Kel sweats
          regardless of temperature.
        tags: [trade, treasure]

  - id: mawdeep_mouth
    name: The Mouth of Mawdeep
    description: >-
      A quarter mile east of town, where the hillside splits open. Sixty
      feet across. Stone lips worn smooth. Cold air breathes outward in
      a rhythm that is not wind. Chalk marks from previous parties cluster
      near the entrance. The ground around the mouth is bare — nothing
      grows within fifty feet of the opening.
    terrain: dungeon_entrance
    tags: [dungeon, transition]
    poi:
      - name: "The Threshold"
        description: >-
          The last place where daylight reaches. Chalk tallies on the wall:
          torch counts, party sizes, dates. Some are years old. A stone
          bench where delvers sit and check their gear one last time.
        tags: [dungeon, entrance]
      - name: "The Offering Cairn"
        description: >-
          A pile of stones at the mouth's edge where locals leave small
          offerings — a copper coin, a crust of bread, a finger bone. Not
          worship. Appeasement. Nobody admits to adding to it.
        tags: [dungeon, lore]

routes:
  - from: gristwell_square
    to: bonecounter_alley
    type: path
    description: Behind the tanner's, down the stone steps
  - from: bonecounter_alley
    to: gristwell_square
    type: path
    description: Up the steps, past the lye stink, back to the square
  - from: gristwell_square
    to: mawdeep_mouth
    type: road
    description: A rutted track east through bare ground to the hillside
  - from: mawdeep_mouth
    to: gristwell_square
    type: road
    description: The track back to Gristwell — it always feels shorter than the walk out
