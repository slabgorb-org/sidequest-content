# Mawdeep — World-Specific NPC Archetypes
# Extends genre archetypes with dungeon-specific characters

- name: Nub the Torchbearer
  description: >-
    The cheapest torchbearer in Gristwell. Missing an ear from a
    previous delve. Claims the Glutton bit it off, which is not
    how torchbearers usually lose ears. Reliable with light,
    unreliable with everything else.
  personality_traits:
    - nervous
    - surprisingly brave in short bursts
    - prone to exaggeration
  stat_ranges:
    strength: [8, 10]
    constitution: [10, 12]
    dexterity: [12, 14]
  catalog_items:
    - torch
    - torch
    - torch
    - dagger_iron
  inventory_hints:
    - a lucky rat skull on a string
    - three copper coins sewn into the hem of his shirt
  dialogue_quirks:
    - touches the place where his ear used to be when frightened
    - whispers "not again" before entering any new room
  disposition_default: 8
  ocean:
    openness: 4.0
    conscientiousness: 5.0
    extraversion: 3.0
    agreeableness: 7.0
    neuroticism: 8.5
  role: hireling
  morale: 3

- name: Hild the Porter
  description: >-
    A woman built like a draft horse who carries twice what anyone
    else can. Does not speak about why she left the Hearthlands.
    Does not speak much at all. Charges by the sack, not the hour.
  personality_traits:
    - silent
    - immovable
    - oddly gentle with fragile treasure
  stat_ranges:
    strength: [16, 18]
    constitution: [14, 16]
  catalog_items:
    - sack_large
    - sack_large
    - rope_hemp
  inventory_hints:
    - leather back-brace, hand-stitched
    - a pressed flower in a tin locket
  dialogue_quirks:
    - communicates primarily with nods and head shakes
    - hums a low tuneless melody while carrying
  disposition_default: 5
  ocean:
    openness: 2.0
    conscientiousness: 8.0
    extraversion: 1.0
    agreeableness: 6.0
    neuroticism: 2.0
  role: hireling
  morale: 7

- name: Kel Bonecounter
  description: >-
    The fence of Gristwell. Buys everything at half value and sells
    nothing back. Keeps a ledger of every transaction in a cipher
    that uses bone tally marks. The bones are real.
  personality_traits:
    - calculating
    - superstitious
    - terrified of the dungeon
  stat_ranges:
    charisma: [14, 16]
    intelligence: [14, 16]
  catalog_items:
    - dagger_iron
  inventory_hints:
    - bone-tally ledger
    - scales made from a dungeon creature's jaw
    - a pouch of teeth used as counting tokens
  dialogue_quirks:
    - counts on his fingers while appraising, muttering values
    - refuses to touch anything that came from below the second level
  disposition_default: -8
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 1.0
    neuroticism: 7.0
  role: town
  morale: null

- name: Old Morden
  description: >-
    The rumormonger. Claims to have descended to the second level
    twice and survived both times. He is the only person in Gristwell
    who speaks about the Glutton by name, as though it were an old
    acquaintance. Missing three fingers on his left hand.
  personality_traits:
    - theatrical
    - half-drunk
    - knows more than he should
  stat_ranges:
    charisma: [12, 14]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - a mug that is never empty
    - a hand-drawn map of Level 1 that is mostly accurate
    - three teeth in a pouch that he says came from a door
  dialogue_quirks:
    - holds up his three-fingered hand when making a point
    - lowers his voice and leans in before saying anything about the Glutton
    - calls the dungeon "old Maw" like it is a person
  disposition_default: 5
  ocean:
    openness: 8.0
    conscientiousness: 2.0
    extraversion: 9.0
    agreeableness: 6.0
    neuroticism: 3.0
  role: town
  morale: null

- name: Petra Tallkeeper
  description: >-
    The provisioner. Runs the only supply shop in Gristwell. Keeps a
    wall of tally marks — one for every delver who bought supplies.
    Crossed-out marks mean they came back. Most marks are not crossed out.
  personality_traits:
    - businesslike
    - keeps her own counsel
    - remembers every face
  stat_ranges:
    charisma: [10, 12]
    wisdom: [14, 16]
  catalog_items:
    - torch
    - rations_day
    - rope_hemp
    - ten_foot_pole
    - iron_spikes
    - chalk
  inventory_hints:
    - a wall of tally marks behind the counter
    - a jar of personal effects from unclaimed supply tabs
  dialogue_quirks:
    - recites prices without being asked
    - pauses to cross out a tally mark mid-conversation, says nothing about it
  disposition_default: 10
  ocean:
    openness: 3.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 2.0
  role: town
  morale: null
