# Mawdeep — Legends
# What the people of Gristwell tell each other about the dungeon

legends:
  - id: the_first_swallowing
    title: The First Swallowing
    text: >-
      Three generations ago, the village of Edgeholm stood where the mouth
      is now. One spring morning the ground opened and took it — every
      building, every soul, every cow and cart. The survivors founded
      Gristwell further from the edge and learned never to build on soft
      ground. The mouth has been growing since. Slowly, but growing.

  - id: the_glutton_wakes
    title: Why It Wakes
    text: >-
      Old Morden at the tavern says the Glutton sleeps between meals.
      When no one enters, the dungeon is quiet — still hungry, but
      dormant. The moment boots touch the first step, it stirs. That
      is why the first rooms are always easy. The Glutton is tasting you.

  - id: the_full_belly
    title: The Full Belly
    text: >-
      They say there is a chamber deep below where the Glutton keeps
      everything it has eaten — Edgeholm's gold, the caravan goods,
      the belongings of every delver who never returned. A full belly,
      vast and warm and impossible to reach without being digested
      yourself. No one has seen it. No one has come back from that deep.

  - id: the_teeth_doors
    title: The Teeth Doors
    text: >-
      Some doors in Mawdeep have stone teeth along the frame. The
      rumormonger says they bite down when the Glutton is angry —
      when awareness is high. Walk through them fast, he says. Do
      not stop in the doorway. He is missing three fingers on his
      left hand, which he says is proof.
