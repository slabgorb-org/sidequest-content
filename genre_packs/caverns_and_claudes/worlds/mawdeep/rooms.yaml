# Mawdeep — Room Graph (RoomDef format)
# 18 rooms across 2 levels. Jaquayed layout with loops and one-way drops.
# Rich room content (treasure, hazards, creatures) lives in room_details.yaml
# and is injected via world history/legends raw data.
#
# This file defines topology only — the room graph navigation engine needs
# id, name, room_type, exits, and keeper_awareness_modifier.

# === LEVEL 1: THE GULLET ===

- id: mouth
  name: "The Mouth"
  room_type: entrance
  size: [3, 3]
  keeper_awareness_modifier: 0.8
  description: >-
    Sixty feet across. Stone lips worn smooth. Cold air breathes outward
    in a slow, rhythmic pulse. The floor slopes gently downward. Chalk
    marks from previous parties cover the walls near the entrance.
    Daylight reaches about thirty feet in before the dark swallows it.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber

- id: throat
  name: "The Throat"
  room_type: normal
  size: [2, 1]
  keeper_awareness_modifier: 0.9
  description: >-
    A descending passage wide enough for three abreast. The walls have
    a ribbed texture — horizontal ridges of stone that look disturbingly
    like cartilage. The air is warmer here.
  exits:
    - type: corridor
      target: mouth
    - type: door
      target: cistern
    - type: corridor
      target: junction

- id: antechamber
  name: "The Antechamber"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 0.9
  description: >-
    A roughly circular room. The floor is covered in a fine grit —
    ground bone mixed with stone dust. A pile of abandoned equipment
    sits against the far wall.
  exits:
    - type: corridor
      target: mouth
    - type: corridor
      target: junction
    - type: corridor
      target: gallery

- id: cistern
  name: "The Cistern"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 0.9
  description: >-
    A domed room with a sunken pool in the center. The water is black,
    still, and warm to the touch. It smells faintly sweet — the sweetness
    of something decomposing.
  exits:
    - type: door
      target: throat
    - type: corridor
      target: pantry

- id: junction
  name: "The Junction"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A crossroads where three passages meet under a high vaulted ceiling.
    The stone is cracked and the cracks are filled with something amber
    and translucent. A faint vibration comes through the floor — rhythmic,
    slow, like breathing.
  exits:
    - type: corridor
      target: throat
    - type: corridor
      target: antechamber
    - type: corridor
      target: hall
    - type: corridor
      target: chute

- id: gallery
  name: "The Gallery of the Eaten"
  room_type: treasure
  size: [3, 2]
  keeper_awareness_modifier: 1.1
  description: >-
    A long rectangular room. The walls are lined with alcoves, each
    containing objects — a rusted sword, a child's doll, a merchant's
    scale. Personal effects of the swallowed. Hundreds of them.
  exits:
    - type: corridor
      target: antechamber
    - type: door
      target: hall

- id: pantry
  name: "The Pantry"
  room_type: normal
  size: [1, 1]
  keeper_awareness_modifier: 0.9
  description: >-
    A low-ceilinged room that smells of rot and vinegar. Wooden shelves
    stocked with supplies that should not exist this deep — all spoiled.
  exits:
    - type: corridor
      target: cistern
    - type: door
      target: stairs_down

- id: hall
  name: "The Swallowing Hall"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.0
  description: >-
    A vast hall with a domed ceiling. The floor is a mosaic of fragments
    of buildings and roads. This is where Edgeholm went. A stone well
    in the center descends into darkness.
  exits:
    - type: corridor
      target: junction
    - type: door
      target: gallery
    - type: corridor
      target: stairs_down

- id: chute
  name: "The Chute"
  room_type: normal
  size: [1, 1]
  keeper_awareness_modifier: 1.1
  description: >-
    A steep, smooth-walled passage angled at forty-five degrees.
    The stone is slick with moisture. Once you start sliding, you
    cannot stop. ONE WAY to Level 2.
  exits:
    - type: corridor
      target: junction
    - type: chute_down
      target: warren

- id: stairs_down
  name: "The Stairs"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.0
  description: >-
    A carved staircase descending into warmth. The steps are uneven —
    some six inches, some eighteen. The walls are damp.
  exits:
    - type: door
      target: pantry
    - type: corridor
      target: hall
    - type: corridor
      target: landing

# === LEVEL 2: THE BELLY ===

- id: landing
  name: "The Landing"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    The foot of the stairs. The walls are smooth, curved, and faintly
    warm. An orange bioluminescence pulses in the veins of the stone.
    Your torch feels less bright here.
  exits:
    - type: corridor
      target: stairs_down
    - type: corridor
      target: gullet_passage
    - type: corridor
      target: acid_pool

- id: gullet_passage
  name: "The Gullet"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.3
  description: >-
    A corridor that narrows as you proceed. The ribbed walls flex
    slightly when pressed. The ceiling drops until you are crouching.
  exits:
    - type: corridor
      target: landing
    - type: door
      target: vault

- id: acid_pool
  name: "The Acid Pool"
  room_type: normal
  size: [2, 2]
  keeper_awareness_modifier: 1.2
  description: >-
    A room dominated by a shallow pool of clear liquid that steams
    gently. The liquid is warm and smells of bile. Gear from fallen
    delvers dots the pool's edge, half-dissolved.
  exits:
    - type: corridor
      target: landing
    - type: corridor
      target: warren

- id: warren
  name: "The Warren"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.2
  description: >-
    A tangle of narrow passages connecting small, round chambers.
    The walls pulse with orange light. Navigation is disorienting.
  exits:
    - type: corridor
      target: acid_pool
    - type: corridor
      target: stomach

- id: vault
  name: "The Vault of Teeth"
  room_type: treasure
  size: [2, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A domed room studded with stone teeth. Among the teeth: treasure.
    Coins, gems, and jewelry embedded in the stone. Extracting anything
    requires prying it free from the Glutton's grip.
  exits:
    - type: door
      target: gullet_passage
    - type: corridor
      target: stomach

- id: stomach
  name: "The Stomach"
  room_type: normal
  size: [3, 3]
  keeper_awareness_modifier: 1.3
  description: >-
    The largest room on Level 2. The floor is soft. Your boots sink.
    The walls undulate slowly. The orange bioluminescence pulses in a
    rhythm that matches nothing you can identify. This is where the
    Glutton digests.
  exits:
    - type: corridor
      target: warren
    - type: corridor
      target: vault
    - type: door
      target: marrow_hall

- id: marrow_hall
  name: "Marrow Hall"
  room_type: normal
  size: [1, 2]
  keeper_awareness_modifier: 1.4
  description: >-
    A short passage lined with exposed bone — actual bone grown into
    the walls. Femurs, ribs, skulls. The heat radiates from the bone.
  exits:
    - type: door
      target: stomach
    - type: door
      target: maw_chamber

- id: maw_chamber
  name: "The Maw"
  room_type: boss
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    A domed chamber. In the center, something massive crouches — made
    of everything the Glutton has eaten and failed to digest. It breathes.
    It watches with gemstone eyes. The Glutton's lieutenant.
  exits:
    - type: door
      target: marrow_hall
    - type: door
      target: full_belly
      is_locked: true

- id: full_belly
  name: "The Full Belly"
  room_type: treasure
  size: [3, 3]
  keeper_awareness_modifier: 1.5
  description: >-
    The deepest room. Vast and warm and golden. The floor is a carpet
    of treasure. It is beautiful. It is the most dangerous room in
    the dungeon. The walls breathe. You are standing inside the Glutton.
  exits:
    - type: door
      target: maw_chamber
