# Mawdeep — Pacing Configuration
# Dungeon crawl pacing: slow atmospheric tension on Level 1,
# urgent compression on Level 2, extraction panic on the way out.
#
# The tension architecture follows a three-act structure per delve:
#   Act 1 (Level 1): Exploration. Wide rooms, low threat, resource budgeting.
#          The Glutton is tasting. Tension builds through atmosphere.
#   Act 2 (Level 2): Commitment. Narrow rooms, rising threat, resource drain.
#          The Glutton is digesting. Tension builds through constriction.
#   Act 3 (Extraction): Flight. Previously cleared rooms restocked, routes
#          collapsing, the clock running out. Tension peaks.

sentence_delivery_min: 0.35
streaming_delivery_min: 0.75
escalation_streak: 3

levels:

  - id: level_1
    name: "The Gullet"
    pacing_mode: atmospheric
    beat_tempo: slow
    description: >-
      Level 1 is the slow burn. Wide corridors, high ceilings, room to
      breathe. The Glutton is patient here — it lets the party explore,
      map, and grow comfortable. The tension is environmental: ribbed
      walls that flex, water that smells wrong, supplies that spoil.
      Combat is rare and avoidable. The real pressure is resource
      awareness — every torch lit is one fewer for the descent.
    narrator_guidance: >-
      Describe rooms in full sensory detail. Linger on textures, sounds,
      smells. Let silences stretch. The party should feel the dungeon
      breathing before they feel it threatening. Hirelings comment on
      the strange warmth. Torchlight catches moisture on the ceiling.
      The chalk marks of previous parties are a constant reminder that
      others came this way and did not all return.
    tension_range: [0.1, 0.4]
    resource_pressure: low
    combat_frequency: rare
    exploration_weight: 0.7
    combat_weight: 0.1
    resource_weight: 0.2
    beats:
      - type: sensory_detail
        frequency: every_room
        description: "Each room gets a moment of pure atmosphere before anything happens"
      - type: resource_check
        frequency: every_3_rooms
        description: "Torch status, ration count, hireling morale — quiet accounting"
      - type: keeper_whisper
        frequency: every_4_rooms
        description: "A distant sound, a vibration, a warmth. The Glutton acknowledges your presence."
      - type: encounter
        frequency: situational
        description: "Pale rats, beetles, scavengers — nuisances, not threats"

  - id: level_2
    name: "The Belly"
    pacing_mode: urgent
    beat_tempo: compressed
    description: >-
      Level 2 compresses everything. Corridors narrow. Ceilings drop.
      Resource ticks accelerate. The Glutton is no longer patient — it
      is actively constricting around the party. Every room transition
      costs more. Combat is harder to avoid. The Warren disorients.
      The Vault tempts. The Maw waits. The pacing should feel like
      the dungeon is swallowing.
    narrator_guidance: >-
      Shorter descriptions. Tighter language. The luxury of atmosphere
      gives way to urgency. Rooms should feel compressed — describe them
      in terms of what the party cannot do rather than what they can see.
      The ceiling is too low for the fighter's halberd. The corridor is
      too narrow for the porter's sack. The air is too thick for the
      torch to burn properly. Make every resource expenditure feel costly.
    tension_range: [0.5, 0.85]
    resource_pressure: high
    combat_frequency: frequent
    exploration_weight: 0.2
    combat_weight: 0.4
    resource_weight: 0.4
    beats:
      - type: constriction
        frequency: every_room
        description: "Something is smaller, tighter, or harder than it was. The dungeon is closing."
      - type: resource_drain
        frequency: every_2_rooms
        description: "Torches burn faster. Rations taste of acid. Waterskins leak. The dungeon eats your supplies."
      - type: keeper_pressure
        frequency: every_2_rooms
        description: "The walls sweat. The floor softens. The bioluminescence pulses faster. The Glutton is close."
      - type: encounter
        frequency: common
        description: "Crawlers, polyps, worms, hulks — the dungeon's immune system is active"

  - id: extraction
    name: "The Run"
    pacing_mode: frantic
    beat_tempo: rapid
    description: >-
      Extraction is the third act. The party has treasure and is heading
      for the Mouth. The dungeon knows. Rooms that were empty are now
      occupied. Passages that were wide have narrowed. The Keeper's
      awareness peaks. Every room transition is a decision: fight through,
      find an alternate route, or drop treasure to lighten the load.
      The pacing should feel like a chase — the party running, the
      dungeon pursuing without legs.
    narrator_guidance: >-
      Fast, clipped narration. No lingering. The party is moving and
      the dungeon is closing. Describe obstacles, not scenery. Every
      room is a problem to solve in one round or less. Hireling morale
      cracks. Torches gutter. The porter's sack tears. The sellsword
      wants to drop the bronze bell. Make the players choose what they
      value more — gold or survival.
    tension_range: [0.7, 1.0]
    resource_pressure: critical
    combat_frequency: constant
    exploration_weight: 0.0
    combat_weight: 0.5
    resource_weight: 0.5
    beats:
      - type: restocked_room
        frequency: every_other_room
        description: "A room cleared on the way in now has occupants. The dungeon refills behind you."
      - type: route_collapse
        frequency: situational
        description: "A passage narrows or seals. The party must detour through unmapped rooms."
      - type: resource_crisis
        frequency: every_room
        description: "Torch count, encumbrance, hireling status — the math of survival, every room."
      - type: final_obstacle
        frequency: once
        description: "Something between the party and the Mouth. One last cost before daylight."

# Keeper awareness pacing integration
# The Keeper awareness system is the pacing engine's backbone.
# Low awareness = atmospheric. High awareness = urgent. Peak awareness = extraction panic.
keeper_pacing:
  atmospheric_range: [0, 6]
  urgent_range: [7, 14]
  frantic_range: [15, 20]
  awareness_to_tension_curve: logarithmic
  notes: >-
    The pacing mode should follow Keeper awareness, not the other way around.
    A party that moves quietly through Level 1 stays in atmospheric mode.
    A party that fights loudly and loots aggressively hits urgent mode on
    Level 1. Awareness is the universal pacing dial.
