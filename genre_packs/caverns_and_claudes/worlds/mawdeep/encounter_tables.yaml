# Mawdeep — Encounter Tables
# Per-room encounter probabilities referencing creatures.yaml IDs.
# Roll on room entry. The Glutton controls what you meet and where.
#
# Probability is base chance per room entry (0.0 to 1.0).
# Keeper awareness modifiers increase probability at higher awareness levels.
# Loot drops are per-encounter, separate from room treasure.

levels:

  - id: level_1
    name: "The Gullet"
    wandering_monster_chance: 0.15
    wandering_monster_awareness_bonus: 0.03
    wandering_monsters:
      - creature_id: pale_rat
        weight: 4
        count: "2d6"
        description: >-
          A swarm of pale rats, squealing and scrabbling. They scatter from
          torchlight but regroup behind you. Something drove them this way.
        loot:
          - description: "Nothing. Rats carry nothing of value."
      - creature_id: bone_beetle
        weight: 3
        count: "3d4"
        description: >-
          A clicking carpet of bone beetles flowing along the corridor walls.
          They ignore you unless you set down your pack.
        loot:
          - description: "Calcite fragments, worthless."
      - creature_id: crawling_scavenger
        weight: 2
        count: "1d3"
        description: >-
          Shapes at the edge of your torchlight. Crawling. Watching. They
          were people once. They flinch when you look at them directly.
        loot:
          - description: "A corroded copper ring (1 CP)"
            value: 1
            chance: 0.2
      - creature_id: amber_hulk
        weight: 1
        min_awareness: 10
        count: "1"
        description: >-
          A grinding sound in the corridor ahead. Something heavy, moving
          slowly. The amber light of its resin shell reflects your torch.
          The Glutton has sent an enforcer.
        loot:
          - description: "Amber resin chunks (20 GP to an alchemist)"
            value: 20
            chance: 0.5

    rooms:
      - room_id: mouth
        encounters: []
        notes: "Safe zone. No encounters. The Glutton lets you enter freely."

      - room_id: throat
        encounters:
          - creature_id: bone_beetle
            probability: 0.2
            count: "2d4"
            trigger: "Disturbing the ribbed walls or scraping against them"
            loot:
              - description: "Nothing."

      - room_id: antechamber
        encounters:
          - creature_id: pale_rat
            probability: 0.25
            count: "1d6"
            trigger: "Searching the abandoned equipment"
            loot:
              - description: "A tarnished silver button (1 SP)"
                value: 1
                chance: 0.3

      - room_id: cistern
        encounters: []
        notes: "No creatures. The water is the hazard."

      - room_id: junction
        encounters:
          - creature_id: pale_rat
            probability: 0.6
            count: "3d6"
            trigger: "Always present — the colony lives here"
            loot:
              - description: "Nothing."
          - creature_id: amber_hulk
            probability: 0.15
            min_awareness: 12
            count: "1"
            trigger: "Keeper awareness 12+. The hulk patrols through the Junction."
            loot:
              - description: "Corroded delver's dagger fused in amber (5 GP)"
                value: 5
                chance: 0.4

      - room_id: gallery
        encounters:
          - creature_id: crawling_scavenger
            probability: 0.3
            count: "1d2"
            trigger: "Removing items from the alcoves"
            loot:
              - description: "A bent copper bracelet (3 CP)"
                value: 1
                chance: 0.15

      - room_id: pantry
        encounters:
          - creature_id: bone_beetle
            probability: 0.5
            count: "4d6"
            trigger: "Opening containers or disturbing the shelves"
            loot:
              - description: "Nothing. The beetles have eaten everything organic."

      - room_id: hall
        encounters:
          - creature_id: crawling_scavenger
            probability: 0.8
            count: "3"
            trigger: "Always present — they live here, feeding on the amber in the rubble"
            loot:
              - description: "A finger bone with a gold ring still on it (8 GP)"
                value: 8
                chance: 0.1
          - creature_id: amber_hulk
            probability: 0.2
            min_awareness: 8
            count: "1"
            trigger: "Keeper awareness 8+. Emerges from behind the well."
            loot:
              - description: "A half-dissolved shield boss (3 GP)"
                value: 3
                chance: 0.3

      - room_id: chute
        encounters: []
        notes: "No creatures. The chute itself is the encounter."

      - room_id: stairs_down
        encounters:
          - creature_id: pale_rat
            probability: 0.3
            count: "2d4"
            trigger: "Rats fleeing from Level 2 — something drove them upward"
            loot:
              - description: "Nothing."

  - id: level_2
    name: "The Belly"
    wandering_monster_chance: 0.25
    wandering_monster_awareness_bonus: 0.05
    wandering_monsters:
      - creature_id: warren_crawler
        weight: 4
        count: "1d3"
        description: >-
          Shapes low to the ground, just beyond your light. Translucent
          skin, dark organs pulsing. They are not attacking. They are
          following. Waiting.
        loot:
          - description: "Coins from a previous victim's gut (1d6 GP)"
            value: 3
            chance: 0.3
      - creature_id: gullet_polyp
        weight: 3
        count: "1d4"
        description: >-
          The wall twitches. Fleshy stalks extend from what you thought
          was stone. The corridor is growing new mouths.
        loot:
          - description: "Nothing. They are part of the walls."
      - creature_id: amber_hulk
        weight: 2
        count: "1"
        description: >-
          Heavier footsteps than anything down here should have. The amber
          glow of the Glutton's enforcer rounds the corner ahead.
        loot:
          - description: "Amber resin chunks (20 GP)"
            value: 20
            chance: 0.5
      - creature_id: marrow_worm
        weight: 1
        count: "1d2"
        description: >-
          A wet, segmented shape drops from the ceiling, glowing faintly
          orange. Its mandibles click once. You do not feel the bite.
        loot:
          - description: "Enzyme glands (15 GP to Gristwell alchemist)"
            value: 15
            chance: 0.4

    rooms:
      - room_id: landing
        encounters:
          - creature_id: warren_crawler
            probability: 0.2
            count: "1"
            trigger: "A lone crawler scouts the landing, retreats if confronted"
            loot:
              - description: "Nothing — scouts carry nothing."

      - room_id: gullet_passage
        encounters:
          - creature_id: gullet_polyp
            probability: 0.7
            count: "2d4"
            trigger: "Always present — they grow from the walls"
            loot:
              - description: "Nothing."
          - creature_id: amber_hulk
            probability: 0.1
            min_awareness: 15
            count: "1"
            trigger: "Keeper awareness 15+. Blocking the passage."
            loot:
              - description: "Amber-encased short sword (15 GP, functional if freed)"
                value: 15
                chance: 0.3

      - room_id: acid_pool
        encounters: []
        notes: "No creatures. The acid and the well shaft are hazard enough."

      - room_id: warren
        encounters:
          - creature_id: warren_crawler
            probability: 0.9
            count: "2d4"
            trigger: "Always present — the warren is their nest"
            loot:
              - description: "Gut contents — 1d4 GP in corroded coins"
                value: 2
                chance: 0.25
          - creature_id: pale_rat
            probability: 0.4
            count: "3d6"
            trigger: "Rats from Level 1 that fell down the Chute"
            loot:
              - description: "Nothing."

      - room_id: vault
        encounters:
          - creature_id: amber_hulk
            probability: 0.3
            min_awareness: 10
            count: "1"
            trigger: "Keeper awareness 10+. Guards the treasure teeth."
            loot:
              - description: "A gem fragment embedded in the hulk's amber (25 GP)"
                value: 25
                chance: 0.4

      - room_id: stomach
        encounters:
          - creature_id: warren_crawler
            probability: 0.4
            count: "1d4"
            trigger: "Crawlers circle the digestion mound, feeding on scraps"
            loot:
              - description: "A half-digested gold chain (12 GP)"
                value: 12
                chance: 0.2
          - creature_id: amber_hulk
            probability: 0.25
            min_awareness: 8
            count: "1d2"
            trigger: "The Stomach spawns amber hulks from the digestion mound"
            loot:
              - description: "Amber resin chunks (20 GP)"
                value: 20
                chance: 0.5

      - room_id: marrow_hall
        encounters:
          - creature_id: marrow_worm
            probability: 0.8
            count: "2d4"
            trigger: "Always present — they live in the bone walls"
            loot:
              - description: "Enzyme glands (15 GP each)"
                value: 15
                chance: 0.4
              - description: "Bioluminescent segments (dim light source, 5 GP)"
                value: 5
                chance: 0.6

      - room_id: maw_chamber
        encounters:
          - creature_id: the_maw
            probability: 1.0
            count: "1"
            trigger: "Always present until destroyed. Respawns between delves."
            loot:
              - description: "Gemstone eyes (150 GP total)"
                value: 150
              - description: "Gold-inlaid breastplate fragment (80 GP)"
                value: 80
              - description: "Silver-capped bone club (35 GP, usable weapon)"
                value: 35
              - description: "Assorted fused metal and coin (40 GP)"
                value: 40

      - room_id: full_belly
        encounters: []
        notes: >-
          No creatures. The room itself is the encounter — the Glutton
          is the walls, the floor, the ceiling. Every round spent here
          raises Keeper awareness. The treasure is the bait. Time is the trap.
