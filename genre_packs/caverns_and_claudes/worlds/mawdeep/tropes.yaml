# Mawdeep — World-Specific Tropes
# Extend genre tropes with Glutton-specific behavior

- id: the_glutton_tastes
  name: The Glutton Tastes
  description: >-
    On Level 1, the Glutton is passive — sampling, not digesting.
    Rations spoil slightly faster. Water from the Cistern is tempting
    but tainted. The dungeon offers what looks like sustenance and
    poisons it. A prelude to the real hunger below.
  category: foreshadowing
  triggers:
    - entering Level 1 rooms with food/water
    - examining the Pantry supplies
    - drinking from the Cistern
  narrative_hints:
    - food smells slightly off
    - water has a faint yellowish tint
    - the air tastes of something you cannot name
  tension_level: 0.3
  resolution_hints:
    - trust only supplies brought from the surface
    - use the Provisioner's goods, not what the dungeon offers
  tags: [glutton, resource, foreshadowing, level_1]
  escalation:
    - at: 0.5
      event: >-
        A hireling tastes something from the dungeon. They look fine
        for now. In two rooms they will be vomiting.
      npcs_involved: []
      stakes: Resource loss — a hireling out of action for several rooms.
    - at: 1.0
      event: >-
        The Pantry is discovered. Everything looks edible. Nothing is.
        The Glutton has been collecting your kind's food and letting
        it rot in a display that might be mockery or might be hunger.
      npcs_involved: []
      stakes: Morale hit. The dungeon understands what you need and corrupts it.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.0
    accelerators:
      - food
      - water
      - rations

- id: the_belly_contracts
  name: The Belly Contracts
  description: >-
    On Level 2, the dungeon physically constricts around the party.
    Corridors narrow. Ceilings drop. Rooms shrink imperceptibly
    between visits. The Glutton is digesting.
  category: tension
  triggers:
    - entering Level 2 rooms
    - Keeper awareness above 10
    - spending more than 3 rooms on Level 2
  narrative_hints:
    - the corridor feels tighter than it did a moment ago
    - your torch catches the ceiling closer than before
    - the walls are damp and warm, like the inside of a mouth
  tension_level: 0.7
  resolution_hints:
    - move quickly — do not linger on Level 2
    - extract before the constriction traps you
    - the stairs are the only reliable two-way exit
  tags: [glutton, constriction, level_2, tension]
  escalation:
    - at: 0.3
      event: >-
        A passage that was passable on the way in is noticeably narrower
        on the way back. Armor scrapes the walls. The porter cannot fit
        with a full sack.
      npcs_involved: []
      stakes: Route may become impassable. Alternative paths needed.
    - at: 0.6
      event: >-
        A room the party passed through has contracted to half its size.
        Equipment left behind is crushed into the walls.
      npcs_involved: []
      stakes: The dungeon is actively reshaping. The map is becoming unreliable.
    - at: 1.0
      event: >-
        The Gullet passage seals completely. The party is trapped on
        Level 2 with only the stairs as an exit — if the stairs are
        still open.
      npcs_involved: []
      stakes: Single exit. Total extraction urgency.
  passive_progression:
    rate_per_turn: 0.03
    rate_per_day: 0.0
    accelerators:
      - depth
      - time
      - awareness

- id: the_offering
  name: The Offering
  description: >-
    The Glutton can be temporarily sated. Dropping treasure in certain
    rooms (the Cistern, the Stomach) reduces Keeper awareness. The
    dungeon takes back what was taken. This is the pressure valve —
    sacrifice gold to survive.
  category: resource
  triggers:
    - dropping treasure in Cistern or Stomach rooms
    - abandoning loot during extraction
  narrative_hints:
    - the pool in the Cistern ripples when gold touches the water
    - the soft floor of the Stomach absorbs dropped treasure slowly
    - a brief, satisfied rumble through the stone
  tension_level: 0.4
  resolution_hints:
    - feed the dungeon to buy time
    - calculate whether survival is worth more than the gold
  tags: [glutton, resource, sacrifice, awareness]
  escalation:
    - at: 0.5
      event: >-
        Dropping 50+ GP worth of treasure in the Cistern reduces Keeper
        awareness by 3. The water ripples. The rumbling stops. For now.
      npcs_involved: []
      stakes: Gold sacrificed is gold not extracted — lost XP.
    - at: 1.0
      event: >-
        Dropping 100+ GP worth in the Stomach reduces awareness by 5 and
        the soft floor firms up temporarily. The Glutton is satisfied.
        Briefly.
      npcs_involved: []
      stakes: Major sacrifice for major relief. The math of survival.
  passive_progression:
    rate_per_turn: 0.0
    rate_per_day: 0.0
    accelerators:
      - sacrifice
      - treasure_drop
