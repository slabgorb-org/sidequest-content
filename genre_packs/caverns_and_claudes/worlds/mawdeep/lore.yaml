# Mawdeep — Present-Day Lore

overview: >-
  Mawdeep is a living gullet in the hillside east of Gristwell. The mouth
  is sixty feet across and growing — stone lips worn smooth by whatever
  process passes for the Glutton's breathing. Cold air flows outward in
  the morning, warm air flows inward at dusk, as though the dungeon
  breathes on a diurnal cycle.

  Delvers have mapped the first level reasonably well. It is wide, open,
  and deceptively calm — a reception hall for the meal to come. The second
  level is where the architecture changes. Corridors narrow. Rooms contract.
  The stone is warm to the touch and faintly damp. The deeper chambers are
  unmapped. No one has returned from below the second level with enough
  sanity to draw a map.

the_dungeon:
  nature: >-
    Mawdeep is not a constructed space. It was not built. It grew, or it
    opened, or it has always been there. The stone has the texture of
    something organic — not quite flesh, not quite mineral, but something
    that splits the difference. Corridors curve like intestines. Rooms
    expand and contract imperceptibly. The floor is never quite level.
  behavior: >-
    The Glutton responds to intrusion with appetite, not anger. It does
    not send monsters to kill you — it sends conditions to weaken you.
    Torches gutter in the damp. Rations spoil in the warmth. Water tastes
    of something you cannot name. The dungeon is not trying to murder
    you. It is trying to soften you up. The creatures that live here
    are scavengers feeding on what the Glutton loosens.
  treasure: >-
    Everything the Glutton has swallowed over generations. Edgeholm's
    gold. Caravan goods. The equipment of dead delvers — weapons, armor,
    torches that still have a few minutes of burn left. The treasure is
    scattered through the rooms like undigested food, concentrated in
    deeper chambers where the Glutton's grip is strongest.

gristwell:
  description: >-
    A mud-street town of fifty buildings clinging to the hillside a
    quarter mile from the mouth. It exists because the dungeon exists.
    The provisioner, the fence, the tavern, the hireling market — every
    business serves the delving trade. Nobody farms here. Nobody builds
    anything permanent. The ground is not trusted.
  mood: >-
    Practical and unsentimental. People die underground every week. The
    town processes this the way a fishing village processes drownings —
    with a tally, a drink, and an empty chair that gets filled by the
    next arrival.
