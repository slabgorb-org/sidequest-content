name: Mawdeep
description: >-
  A dungeon that hungers. The Glutton Below has been swallowing the
  countryside for generations — caravans vanish, farmsteads sink into
  the earth, and the mouth of the dungeon grows wider every spring.
  The town of Gristwell clings to its edge like a barnacle on a whale,
  feeding off the gold that desperate delvers drag out of the dark.
  The deeper you go, the warmer the stone gets. The walls are damp.
  Something down there is digesting.

tagline: "It is always hungry."

axis_snapshot:
  comedy: 0.3
  gravity: 0.8
  outlook: 0.4

keeper:
  name: "The Glutton Below"
  personality: ravenous
  obsession: consumption
  tone_override:
    comedy: 0.2
    gravity: 0.85
  awareness:
    starting: 0
    tick_rate: 1
    stealth_decay: -1
    thresholds:
      "3": "Stomach rumble — distant grinding vibration through the stone"
      "6": "Rations begin spoiling faster. Waterskins taste of bile."
      "10": "Walls sweat a warm, acrid fluid. Torches sputter in the damp."
      "15": "Rooms constrict. Corridors narrow. The dungeon is swallowing."
      "20": "Full digestion — resource ticks double, every room drains HP"
  monologue_style: >-
    Wet, guttural sounds that resolve into words. The voice comes from
    the walls, from the floor, from the pooling moisture on the ceiling.
    It speaks of appetite — not anger, not malice, just relentless,
    bottomless hunger. It describes what it has eaten. It describes what
    it will eat next.
  trap_aesthetic: >-
    Organic — rooms that contract, floors that soften underfoot, pits
    lined with stone teeth, corridors that narrow to nothing. Acid pools
    that were not there a moment ago. The smell of digestion.
  topology_tendency: >-
    Funnel-shaped — wide and inviting at the entrance, narrowing as you
    descend. One-way drops into deeper chambers. Rooms that close behind
    you. The architecture of a gullet.
