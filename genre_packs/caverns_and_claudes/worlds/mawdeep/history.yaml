# Mawdeep — Campaign Progression
# How the world changes as players accumulate experience (treasure-as-XP)

chapters:
  - id: fresh
    maturity: FRESH
    session_range: [1, 3]
    title: "First Delve"
    description: >-
      The party is new to Mawdeep. Level 1 is the playground. The Gullet
      is wide and relatively calm. The Glutton stirs but does not yet
      threaten seriously. Learning the resource economy, mapping Level 1,
      and extracting small treasure is the goal.
    narrator_guidance: >-
      Emphasize the sensory experience of the dungeon — the warmth, the
      damp, the ribbed walls. Let the players get comfortable with the
      room graph and resource tracking before threatening them seriously.
      The Glutton is tasting, not biting. Hirelings are nervous but
      functional. First deaths should be avoidable — a warning, not a
      punishment.
    available_rooms:
      - mouth
      - throat
      - antechamber
      - cistern
      - junction
      - gallery
      - pantry
    locked_content: >-
      Level 2 is accessible but should feel like a serious escalation.
      The Chute and Stairs exist. Going down is a choice with consequences.

  - id: early
    maturity: EARLY
    session_range: [4, 6]
    title: "The Descent"
    description: >-
      The party ventures to Level 2. The Belly changes the rules — faster
      resource drain, constricting rooms, the Glutton's presence is
      physical. First encounters with the Vault of Teeth and the Warren.
      Extraction runs from Level 2 become the central challenge.
    narrator_guidance: >-
      Level 2 should feel alien compared to Level 1. The stone changes.
      The light changes. Everything is warmer, wetter, more organic.
      The Glutton's monologues begin — wet, guttural, speaking of
      appetite. Hireling morale is tested seriously. Some will not come
      back down.
    available_rooms:
      - all Level 1
      - landing
      - gullet_passage
      - acid_pool
      - warren
      - vault
    locked_content: >-
      The Stomach and deeper rooms are accessible but represent
      significant danger. The Full Belly is end-game content.

  - id: mid
    maturity: MID
    session_range: [7, 9]
    title: "The Belly"
    description: >-
      Deep delves into the Stomach and Marrow Hall. The party knows the
      dungeon's rhythms — when to push, when to extract, when to sacrifice
      gold to lower awareness. Hirelings are expendable resources managed
      as coldly as torches. The Full Belly is the white whale.
    narrator_guidance: >-
      The dungeon is now a known adversary. The party has strategies.
      Push back — the Glutton adapts. Rooms they cleared are restocked.
      Passages they relied on have narrowed. The Keeper's monologues
      become personal, describing what it tasted when it ate their
      hirelings. The extraction economy is the game now — how much
      gold can you carry out before the dungeon seals you in?
    available_rooms:
      - all rooms
    locked_content: none

  - id: veteran
    maturity: VETERAN
    session_range: [10, 12]
    title: "The Full Belly"
    description: >-
      The party attempts the Full Belly. The deepest room, the greatest
      treasure, the highest danger. The Glutton is fully awake and fully
      hostile. The extraction run from the Full Belly through the entire
      dungeon is the climactic experience. Win or die. Extract or be
      digested.
    narrator_guidance: >-
      This is the endgame. Every system at maximum pressure — resources,
      awareness, morale, encumbrance. The Glutton is not a distant
      presence, it IS the room. The walls breathe. The exit is closing.
      The party has 3 rounds to leave the Full Belly before it seals.
      Then they have to fight their way back through a dungeon that
      knows they have its treasure and wants it back. This should feel
      like the most intense extraction run in the game.
