# Mawdeep — Campaign Progression
# How the world changes as players accumulate experience (treasure-as-XP)
# Structured to match HistoryChapter schema: id, label, lore[], session_range

chapters:
  - id: fresh
    label: "First Delve"
    session_range: [1, 3]
    lore:
      - >-
        The party is new to Mawdeep. Level 1 is the playground. The Gullet
        is wide and relatively calm. The Glutton stirs but does not yet
        threaten seriously.
      - >-
        Learning the resource economy, mapping Level 1, and extracting
        small treasure is the goal. Torches are currency, gold is aspiration.
      - >-
        The dungeon exhales cold air at dawn and warm air at dusk. The walls
        are ribbed like the inside of a throat. Chalk marks from previous
        delvers line the first corridors — most are just tally marks. Some
        are warnings. Some are last words.
    location: "The Mouth"
    time_of_day: dawn
    atmosphere: >-
      Quiet dread. The dungeon is patient. The Glutton is tasting, not biting.
      Hirelings are nervous but functional.
    points_of_interest:
      - name: Gristwell Square
        slug: gristwell_square
        region: gristwell_square
        type: settlement
        description: >-
          A hardscrabble crossroads town clinging to the edge of
          Mawdeep like a barnacle on a whale. Timber houses
          propped against each other, most of them built from
          the bones of older houses that fell into the earth
          when the Mouth grew last. A single well in the centre.
          The water smells very faintly of bile.
      - name: Bonecounter Alley
        slug: bonecounter_alley
        region: bonecounter_alley
        type: market
        description: >-
          The narrow street behind the square where the
          Bonecounters run their trade — assayers who weigh and
          price what comes out of Mawdeep, most of it worked
          silver and stained gold and the occasional bone tool
          whose carvings nobody cares to read aloud. The
          Bonecounters do not ask where the items came from
          and will not answer if asked.
      - name: The Mouth of Mawdeep
        slug: the_mouth
        region: mawdeep_mouth
        type: dungeon
        description: >-
          Sixty feet across. Stone lips worn smooth by three
          hundred years of delvers walking in and rather fewer
          walking out. Cold air breathes outward in the
          morning, warm air in the evening. Chalk tally marks
          cover the first fifty feet of the throat. Some of
          the tallies are in hands that are no longer alive
          to hold chalk.
      - name: The Throat
        slug: the_throat
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A descending passage wide enough for three delvers
          abreast. The walls have a ribbed texture that looks
          like stone and feels like something else. Torches
          burn cleanly here. The slope is gentle but
          unrelenting, and the sound of the entrance dims
          surprisingly fast behind you.
      - name: The Antechamber
        slug: the_antechamber
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A roughly circular room at the bottom of the throat.
          The floor is covered in a fine grit that crunches
          under the boot and leaves a pale powder on anything
          it touches. Three passages lead deeper. A fourth
          passage, stone-sealed, shows the ragged edge of a
          door that was closed from this side.
      - name: The Cistern
        slug: the_cistern
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A domed chamber with a sunken pool in the centre.
          The water is black, still, and shows no reflection
          of the torchlight above it. A thrown stone makes no
          sound. The water does not ripple. Something has been
          drinking from the pool from below for a very long
          time.

  - id: early
    label: "The Descent"
    session_range: [4, 6]
    lore:
      - >-
        The party ventures to Level 2. The Belly changes the rules — faster
        resource drain, constricting rooms, the Glutton's presence is physical.
      - >-
        First encounters with the Vault of Teeth and the Warren. Extraction
        runs from Level 2 become the central challenge.
      - >-
        The Glutton's monologues begin — wet, guttural, speaking of appetite.
        Hireling morale is tested seriously. Some will not come back down.
      - >-
        Level 2 should feel alien compared to Level 1. The stone changes.
        The light changes. Everything is warmer, wetter, more organic.
    location: "Level 2 — The Belly"
    atmosphere: >-
      Oppressive. The dungeon is no longer passive. The walls sweat.
      The corridors narrow. The Glutton is digesting.
    points_of_interest:
      - name: The Junction
        slug: the_junction
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A crossroads where three passages meet under a high
          vaulted ceiling. The stone is darker here and the
          ceiling is lost in shadow regardless of how high a
          torch is held. In the middle of the floor, a
          shallow circular depression is polished smooth by
          something that has stood in it for centuries.
      - name: The Gallery of the Eaten
        slug: the_gallery
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A long rectangular chamber lined with alcoves, each
          containing a single object: a rusted dagger, a
          child's wooden horse, a single boot, an unopened
          letter, a wedding ring. No alcove contains more than
          one thing and no alcove is empty. The Glutton
          remembers its meals by the smallest thing each one
          was carrying.
      - name: The Pantry
        slug: the_pantry
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A low-ceilinged room that smells of rot and vinegar.
          Wooden shelves line the walls, bearing clay jars
          sealed with wax. The jars are full. The contents
          are not food, exactly. They are arranged in an
          order that a grocer would recognise and a delver
          should not.
      - name: The Chute
        slug: the_chute
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A steep, smooth-walled passage angled at forty-five
          degrees. The stone is polished to a glassy sheen by
          whatever has slid down it. A rope is the only safe
          descent. A rope is the only difficult ascent. The
          Chute feeds directly into the Stairs Down.
      - name: The Swallowing Hall
        slug: the_swallowing_hall
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A vast chamber with a domed ceiling lost in shadow
          above the torchlight. The floor is an elaborate
          mosaic of flattened copper coins — a currency nobody
          recognises, minted in a face nobody has seen. At
          the centre, a stone pedestal. On the pedestal, a
          single bronze key. The key is the door somewhere
          else.
      - name: The Stairs Down
        slug: the_stairs_down
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A carved staircase descending into warmth. The
          steps are uneven — some tall, some shallow, and a
          delver who counts them gets a different number each
          descent. Air from below smells of blood and
          distant animals. Torches burn brighter on these
          steps. Nothing else does.

  - id: mid
    label: "The Belly"
    session_range: [7, 9]
    lore:
      - >-
        Deep delves into the Stomach and Marrow Hall. The party knows the
        dungeon's rhythms — when to push, when to extract, when to sacrifice
        gold to lower awareness.
      - >-
        Hirelings are expendable resources managed as coldly as torches.
        The Full Belly is the white whale.
      - >-
        The dungeon is now a known adversary. The party has strategies.
        The Glutton adapts — rooms they cleared are restocked, passages
        they relied on have narrowed.
      - >-
        The Keeper's monologues become personal, describing what it tasted
        when it ate their hirelings. The extraction economy is the game now.
    atmosphere: >-
      Familiar dread. The dungeon is a known enemy. The fear is not of the
      unknown but of the mathematics — resources in, treasure out, the
      margin narrowing every delve.
    points_of_interest:
      - name: The Landing
        slug: the_landing
        region: mawdeep_mouth
        type: dungeon
        description: >-
          The foot of the Stairs Down, where the stone changes.
          The walls of Level 2 are not quite stone — they have
          the temperature of stone and the give of something
          that has not quite finished being stone. Touching
          the wall leaves a fingerprint that takes a while to
          fill back in.
      - name: The Gullet
        slug: the_gullet
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A corridor that narrows as you proceed. The walls
          are warm and slick to the touch. Torches guttering
          before they relight themselves. A delver who stops
          moving feels the walls press very slightly inward —
          not enough to crush, just enough to remind them that
          the motion is the only reason they are not being
          digested.
      - name: The Acid Pool
        slug: the_acid_pool
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A chamber dominated by a shallow pool of clear
          liquid that steams gently. A rope dropped into the
          pool is returned in seven seconds as a pale
          residue. A coin dropped into the pool is returned in
          longer — the Glutton prefers money and takes its
          time.
      - name: The Warren
        slug: the_warren
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A tangle of narrow passages connecting small, round
          chambers — each barely high enough to stand in, each
          scented differently. One chamber smells of vinegar.
          Another of honey. Another of the specific smell of
          a kitchen at dawn. The smells are not traps. They
          are menu options.
      - name: The Vault of Teeth
        slug: the_vault_of_teeth
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A domed chamber whose walls are studded with stone
          teeth — not decorative, grown from the stone itself
          in orderly rows along the inside of the dome. At
          the centre, a pit. Looking down the pit, a delver
          sees another dome, identical, seen from above.
          Looking back up, the original dome is gone.
      - name: Marrow Hall
        slug: marrow_hall
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A short passage lined with exposed bone — not stone
          carved to look like bone, real bone, long-bone
          fitted to long-bone to form the walls and ceiling
          of the hall. The joints are held together by
          something patient and dark. A delver who touches
          the wall leaves a mark the wall does not
          reciprocate.

  - id: veteran
    label: "The Full Belly"
    session_range: [10, 12]
    lore:
      - >-
        The party attempts the Full Belly. The deepest room, the greatest
        treasure, the highest danger. The Glutton is fully awake and fully hostile.
      - >-
        The extraction run from the Full Belly through the entire dungeon is the
        climactic experience. Win or die. Extract or be digested.
      - >-
        Every system at maximum pressure — resources, awareness, morale,
        encumbrance. The Glutton is not a distant presence, it IS the room.
      - >-
        The walls breathe. The exit is closing. The party has 3 rounds to
        leave the Full Belly before it seals. Then they fight their way back
        through a dungeon that knows they have its treasure and wants it back.
    atmosphere: >-
      Apocalyptic intensity. This is the endgame. The dungeon is a living
      throat and the party is the thing it is trying to swallow.
    points_of_interest:
      - name: The Stomach
        slug: the_stomach
        region: mawdeep_mouth
        type: dungeon
        description: >-
          The largest chamber on Level 2. The floor is soft
          underfoot — not mud, not flesh, but something
          between, something that remembers having been either.
          The ceiling drips warm fluid onto anything that
          stands still too long. The smell is the inside of
          a wound that has been kept very clean for very long.
      - name: The Maw
        slug: the_maw
        region: mawdeep_mouth
        type: dungeon
        description: >-
          A domed chamber where the ceiling is lost in shadow
          and the floor is a single unbroken stone tongue
          stretching toward the far wall. The walls are lined
          with receding stone ridges that look, if a delver
          looks too long, like the inside of a mouth that has
          been opened halfway. The Maw is the room the Full
          Belly eats from.
      - name: The Full Belly
        slug: the_full_belly
        region: mawdeep_mouth
        type: dungeon_boss
        description: >-
          The deepest room. Vast and warm and golden. The
          bioluminescence here is not torchlight — the walls
          themselves give off a soft amber light, and the
          treasure heaped against them shines back. The floor
          is warm to the bare hand. The walls move, slowly,
          in a rhythm a delver's breathing will synchronise
          with if they are not careful. The Full Belly is the
          Glutton and the Glutton is the Full Belly. The
          treasure is bait.
      - name: The Gristwell Sinkhole
        slug: the_gristwell_sinkhole
        region: gristwell_square
        type: frontier
        description: >-
          The fresh collapse at the eastern edge of Gristwell
          Square where last spring's farmstead used to be.
          The hole is still warm. The Glutton's digestion
          made it, and the edge of the Mouth has grown ten
          feet closer to the town since the collapse.
          Nothing has been rebuilt on it. The townsfolk do
          not step on the stones at the edge.
