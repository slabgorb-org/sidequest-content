# Caverns Sünden — Drift Profiles
#
# How the Hamlet of Sünden drifts after each kind of delve. Consumed
# by the Hamlet narrator prompt-zone via a `latest_delve_region` flag
# (or `latest_delve_sin` for sin-based routing). Decay is a flag swap
# at delve-end — drift is overwritten by the next delve's profile,
# never blended.
#
# Folded 2026-05-10 from per-descent dungeons/{grimvault,horden,
# mawdeep}/drift_profile.yaml. Region IDs match cartography.yaml.

regions:

  grimvault_descent:
    sin: pride
    ambient_drift: >-
      Sünden cools. Lamps burn at a measured rate, as if rationed. Sound
      travels short distances and stops, like cloth absorbing it. Doors close
      without slamming. The cobbles look sorted — paler stones together,
      darker together, no one remembers laying them that way. Steam from the
      kettles rises straight, no curl. Townsfolk pass each other without
      greeting, then glance back, as though checking a tally. Nothing is
      hurried. Nothing is warm. The square feels measured against a standard
      it does not name.

    npc_overrides:
      - role: innkeeper
        drift: >-
          She speaks softly enough that you lean in. She does not repeat
          herself. She names the cut of meat before she names the price, and
          looks at your hands when she serves you, as though grading the
          grip. Her smile is a closed line.
      - role: recruiter
        drift: >-
          He reads each hireling's papers aloud, slowly, in front of them.
          He pauses at flaws — a limp, a debt, a missing tooth — and lets
          the pause sit. He never says no. He simply hands the papers back
          and waits to see who flinches first.
      - role: market_vendor
        drift: >-
          She has resorted her stall by material rather than price: bone
          with bone, iron with iron, cloth with cloth. She quotes weight, not
          worth. When you choose, she nods once, as though you have passed
          a small examination she did not announce.
      - role: confessional_keeper
        drift: >-
          He listens longer than usual. The screen feels closer. He repeats
          one phrase you said back to you, stripped of feeling, as if testing
          it for soundness. The coin you push through is counted twice. He
          does not absolve. He says, "Noted."
      - role: workhouse_master
        drift: >-
          He inspects hands before assigning labor — calluses, scars, the
          set of the thumb. He sorts workers into piles he does not name.
          Praise is withheld; correction is precise and quiet. The bell rings
          on the half-hour, never the hour.
      - role: masquerade_host
        drift: >-
          She is unsettled and tries to hide it. She fits masks by holding
          them an inch from your face and studying the gap. She speaks of
          "improvement" rather than disguise. She charges more tonight, and
          will not say why, and does not look away when you pay.
      - role: itinerant_preacher
        drift: >-
          He has gone quiet on Wrath and Lust. Tonight he warns only of the
          sin that "weighs the soul on its own scale," and will not name it.
          He speaks in clean sentences, no shouting, and the crowd listens
          the way a ledger listens.

    decay:
      duration_delves: 1
      notes: >-
        Drift is overwritten by the next delve's drift profile. There is no
        fade — it's a flag swap on delve-end.

  horden_warren:
    sin: greed
    ambient_drift: >-
      Coins do not move freely tonight. They stick to palms a moment too
      long; change is given in undercount and nobody corrects it. Doors
      across Sünden stand half-closed — not shut, not open, as though
      someone might still come back for what was left. Sentences end early
      and nobody finishes them. Small piles accumulate on counters, on
      windowsills, in the corners of the square: buttons, nails, copper
      scraps. No one is counting them. No one is moving them. Lamplight
      pools and refuses to spread.

    npc_overrides:
      - role: innkeeper
        drift: >-
          She pours short and does not top up. She quotes the price, then
          quotes it again as though you misheard. She slides your coin into
          a drawer she does not close. The bread basket sits between you,
          and she does not push it forward.
      - role: recruiter
        drift: >-
          He names a price for each hireling and does not take payment. He
          lets the figure sit on the counter while he describes the next
          one. The papers stay on his side. He says "we can discuss it" and
          then discusses something else.
      - role: market_vendor
        drift: >-
          He adds to a small pile beside the till with every sale — buttons,
          pins, a bent nail — and does not ring it up. He weighs your coin
          in his hand before pocketing it. Goods stay on the stall. Sales
          conclude without the goods leaving.
      - role: confessional_keeper
        drift: >-
          He seems lighter tonight, vindicated, almost amused. He takes the
          coin through the screen and lets it rest in his palm a beat too
          long, then sets it aside rather than into the box. He absolves
          quickly. The sin is named and not lingered on.
      - role: workhouse_master
        drift: >-
          He revises today's wages downward, citing a cost no one
          remembers. He keeps a private tally on a slate he turns to the
          wall. Tools are issued reluctantly, one at a time. Workers leave
          with less than they earned, and do not press the point.
      - role: masquerade_host
        drift: >-
          She rents masks tonight rather than selling them, and the deposit
          is steep. She does not return all of it. The cheaper masks are
          "spoken for." The expensive ones hang on the wall, available, and
          somehow never quite for sale.
      - role: itinerant_preacher
        drift: >-
          He preaches with one hand on his coin pouch. He warns of Envy
          tonight — the sin that "wants what is owed and what is not." He
          does not pass the cup. When a coin is offered unprompted, he
          pockets it and does not break his sermon.

    decay:
      duration_delves: 1
      notes: >-
        Drift is overwritten by the next delve's drift profile. There is no
        fade — it's a flag swap on delve-end.

  mawdeep_gullet:
    sin: gluttony
    ambient_drift: >-
      Sünden chews. Somebody is eating in every doorway — bread, fat,
      rind, gristle — and the chewing carries further than the talk. The
      air smells of broth and rendered tallow no matter which street you
      walk. Crumbs collect on benches, on ledgers, on the rim of the well.
      Plates are never empty long; refills arrive uncalled. Tables are
      sticky. The cobbles glisten in patches that may be rain. Nobody looks
      full. Even the lamplight seems hungry, eating the dark slowly and
      then asking for more.

    npc_overrides:
      - role: innkeeper
        drift: >-
          She talks with her mouth full and does not apologize. The kitchen
          keeps sending out plates you did not order. Grease shines on her
          apron, on the bar, on the rim of your cup. She refills before you
          ask and stands too close while you eat.
      - role: recruiter
        drift: >-
          He chews while reading the contracts. Crumbs settle in the seal
          wax. He offers each hireling a heel of bread before their name,
          and watches them eat it. His thumbprint is on every page. He
          licks it before turning.
      - role: market_vendor
        drift: >-
          He samples his own goods between customers — cheese, sausage,
          pickle — and does not stop talking through it. Portions are
          generous and slightly past their prime. He presses a taste into
          your hand before you ask, and watches your throat as you swallow.
      - role: confessional_keeper
        drift: >-
          He is eating a pear behind the screen. The juice is audible. He
          hears your sin around the fruit and absolves between bites. The
          coin sticks to his fingers when he takes it. He asks if you have
          eaten today, and means it as scripture.
      - role: workhouse_master
        drift: >-
          He looks unsettled — his domain, his sin, and he knows it. He
          keeps a bowl of fat on his desk and dips bread without looking
          down. He assigns longer shifts and shorter meals, and the
          contradiction does not seem to trouble him. The bell sounds late.
      - role: masquerade_host
        drift: >-
          She serves wine before fitting masks. The masks have grown
          mouths — wider, wetter, lined in red. Guests arrive hungry and
          leave hungrier. She presses a sweetmeat into your palm with the
          mask, as though one will not work without the other.
      - role: itinerant_preacher
        drift: >-
          He preaches with crumbs in his beard. Tonight he warns of Sloth —
          the sin that "lies down at the table and does not rise." He pauses
          mid-sermon to chew. The crowd brings him offerings of food. He
          accepts each one and keeps preaching, mouth full.

    decay:
      duration_delves: 1
      notes: >-
        Drift is overwritten by the next delve's drift profile. There is no
        fade — it's a flag swap on delve-end.
