# Caverns & Claudes — Hamlet of Sünden — World-Level Archetypes
#
# Hirelings are world-level: they live in Sünden and can be sent into any
# of the three dungeons (Grimvault/Pride, Horden/Greed, Mawdeep/Gluttony).
# Each archetype is tagged with sin_origin where it was originally authored
# for one sin's culture. Entries below are concatenated verbatim from the
# pre-merge per-dungeon archetypes.yaml files; only the `sin_origin` field
# is new. No exact-name collisions across the three sources.

# ── Pride-origin archetypes (was worlds/grimvault/archetypes.yaml) ──────────

- name: Assayer
  sin_origin: pride
  description: >-
    A meticulous cataloger who maps quality-loss zones and records
    separation patterns. Carries a lead-lined notebook and a set
    of calibrated instruments. Speaks in precise measurements.
    Measures everything twice. Trusts nothing they have not
    personally verified.
  personality_traits:
    - precise
    - skeptical
    - obsessive
  typical_classes: [Mage, Thief]
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [12, 16]
  catalog_items: []
  inventory_hints:
    - lead-lined notebook with separation logs
    - calibrated instruments in a padded case
    - chalk in three colors for marking quality zones
  dialogue_quirks:
    - quotes exact measurements before opinions
    - corrects imprecise language in others
  disposition_default: 5
  ocean:
    openness: 6.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 4.0
    neuroticism: 5.0
  role: town
  morale: null

- name: Recovery Specialist
  sin_origin: pride
  description: >-
    Treats returning delvers for quality loss. Part therapist, part
    sensory coach, part diagnostician. Can identify which qualities
    have been separated by testing reactions. Has never entered the
    vault and says so without shame.
  personality_traits:
    - empathetic
    - observant
    - cautious
  typical_classes: [Cleric, Mage]
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    charisma: [12, 16]
  catalog_items: []
  inventory_hints:
    - a set of colored cards for testing vision
    - a tuning fork for testing hearing
    - a pouch of strongly-flavored herbs for testing taste
  dialogue_quirks:
    - asks you to describe what you see before speaking
    - holds up fingers and waits for you to count them
  disposition_default: 15
  ocean:
    openness: 7.0
    conscientiousness: 7.0
    extraversion: 5.0
    agreeableness: 8.0
    neuroticism: 3.0
  role: town
  morale: null

- name: Material Trader
  sin_origin: pride
  description: >-
    A Ledger specialist who deals in separated materials. Knows
    the market price of weightless iron, colorless cloth, and
    bottled silence. Evaluates vault byproducts with a practiced
    eye and an instrument that looks like a brass monocle with
    too many lenses.
  personality_traits:
    - mercantile
    - knowledgeable
    - calculating
  typical_classes: [Mage, Thief]
  typical_races: []
  stat_ranges:
    charisma: [12, 16]
    intelligence: [12, 16]
  catalog_items: []
  inventory_hints:
    - multi-lensed assessment monocle
    - vault-standard scale
    - samples of separated materials for comparison
  dialogue_quirks:
    - names a price before you finish describing the item
    - tests materials by holding them near a candle and watching what happens
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 6.0
    extraversion: 6.0
    agreeableness: 3.0
    neuroticism: 4.0
  role: town
  morale: null

- name: Lead-Liner
  sin_origin: pride
  description: >-
    A specialist hireling who treats equipment with lead compounds
    to resist quality drain. Expensive but essential for deep
    delves. Works slowly, speaks less, and guarantees nothing
    except that the treatment was applied correctly. What the
    vault does after that is the vault's business.
  personality_traits:
    - methodical
    - taciturn
    - honest about limitations
  typical_classes: [Fighter, Thief]
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    constitution: [10, 14]
  catalog_items:
    - torch
  inventory_hints:
    - lead-compound paste in sealed jars
    - fine brushes for application
    - treated leather gloves
  dialogue_quirks:
    - tests your equipment before agreeing to treat it
    - charges by the item, not by the hour
  disposition_default: 0
  ocean:
    openness: 3.0
    conscientiousness: 8.0
    extraversion: 1.0
    agreeableness: 5.0
    neuroticism: 2.0
  role: hireling
  morale: 7

# ── Greed-origin archetypes (was worlds/horden/archetypes.yaml) ─────────────

- name: Spiller
  sin_origin: greed
  description: >-
    A Spillfield scavenger who picks the dungeon's overflow every
    morning before dawn. Knows the spillage patterns — which spots
    yield coins, which yield scrap, which yield the occasional
    intact piece. Has green-stained hands from handling corroded
    copper. Practical, superstitious about entering the dungeon,
    and deeply skeptical of anyone who does.
  personality_traits:
    - pragmatic
    - territorial
    - risk-averse
  typical_classes: [Thief]
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    wisdom: [12, 16]
  catalog_items: []
  inventory_hints:
    - sorting sack with compartments for metal types
    - a Spiller's hook for pulling items from crevices
    - copper-stained leather gloves
  dialogue_quirks:
    - weighs objects by feel before looking at them
    - quotes spillage prices from memory
  disposition_default: 5
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 5.0
    neuroticism: 6.0
  role: town
  morale: null

- name: Counter
  sin_origin: greed
  description: >-
    A member of the counting cult who makes regular pilgrimages
    into Horden to add items to the hoard. Carries pre-counted
    offerings in numbered pouches. Mutters tallies under their
    breath — a habit that started as devotion and became
    compulsion. They know the outer ring intimately and can
    navigate it in the dark by counting steps.
  personality_traits:
    - obsessive
    - precise
    - anxious
  typical_classes: [Cleric, Mage]
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - numbered pouches of counting offerings
    - a personal tally stick notched with pilgrimage counts
    - the trade cipher reference sheet (incomplete)
  dialogue_quirks:
    - counts objects in any room they enter before speaking
    - corrects numerical inaccuracies in conversation
  disposition_default: 0
  ocean:
    openness: 4.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 3.0
    neuroticism: 8.0
  role: town
  morale: null

- name: Appraiser
  sin_origin: greed
  description: >-
    A specialist who evaluates treasure brought out of Horden.
    Knows metals, gems, textiles, and the difference between
    surface-quality goods and dungeon-quality goods (which have
    been handled by the Hoarder and are subtly different — heavier,
    colder, faintly humming). Sets prices. Does not negotiate.
  personality_traits:
    - precise
    - mercantile
    - unflappable
  typical_classes: [Mage, Thief]
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    charisma: [10, 14]
  catalog_items: []
  inventory_hints:
    - multi-lensed brass loupe
    - a set of reference weights in a padded case
    - acid testing kit for metal purity
  dialogue_quirks:
    - names a value before you finish describing the item
    - taps metal with a fingernail and listens before pricing
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 3.0
    neuroticism: 2.0
  role: town
  morale: null

- name: Pack Hauler
  sin_origin: greed
  description: >-
    A specialist hireling optimized for Horden's unique challenge:
    carrying treasure out. Wears minimal armor for maximum carry
    capacity. Knows the goat paths and which stacks are stable
    enough to lean against. Charges by the pound extracted, not
    by the day. Has a personal encumbrance limit they will not
    exceed — they know the weight that triggers the exits closing.
  personality_traits:
    - methodical
    - cautious
    - honest about limits
  typical_classes: [Fighter]
  typical_races: []
  stat_ranges:
    strength: [14, 18]
    constitution: [12, 16]
  catalog_items: []
  inventory_hints:
    - reinforced pack frame with wide straps
    - cloth wraps for separating metals (anti-mite)
    - a personal scale for tracking weight in real-time
  dialogue_quirks:
    - tells you exactly how much weight they will carry and not one ounce more
    - shakes their head when you pick up something heavy
  disposition_default: 0
  ocean:
    openness: 2.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: hireling
  morale: 6

# ── Gluttony-origin archetypes (was worlds/mawdeep/archetypes.yaml) ─────────

- name: Nub the Torchbearer
  sin_origin: gluttony
  description: >-
    The cheapest torchbearer in Gristwell. Missing an ear from a
    previous delve. Claims the Glutton bit it off. Reliable with light,
    unreliable with everything else.
  personality_traits:
    - nervous
    - surprisingly brave in short bursts
    - prone to exaggeration
  typical_classes: [Thief, Fighter]
  typical_races: []
  stat_ranges:
    strength: [8, 10]
    constitution: [10, 12]
    dexterity: [12, 14]
  catalog_items:
    - torch
    - torch
    - torch
    - dagger_iron
  inventory_hints:
    - a lucky rat skull on a string
    - three copper coins sewn into the hem of his shirt
  dialogue_quirks:
    - touches the place where his ear used to be when frightened
    - whispers "not again" before entering any new room
  disposition_default: 8
  ocean:
    openness: 4.0
    conscientiousness: 5.0
    extraversion: 3.0
    agreeableness: 7.0
    neuroticism: 8.5

- name: Hild the Porter
  sin_origin: gluttony
  description: >-
    A woman built like a draft horse who carries twice what anyone
    else can. Does not speak about why she left the Hearthlands.
    Charges by the sack, not the hour.
  personality_traits:
    - silent
    - immovable
    - oddly gentle with fragile treasure
  typical_classes: [Fighter]
  typical_races: []
  stat_ranges:
    strength: [16, 18]
    constitution: [14, 16]
  catalog_items:
    - sack_large
    - sack_large
    - rope_hemp
  inventory_hints:
    - leather back-brace, hand-stitched
    - a pressed flower in a tin locket
  dialogue_quirks:
    - communicates primarily with nods and head shakes
    - hums a low tuneless melody while carrying
  disposition_default: 5
  ocean:
    openness: 2.0
    conscientiousness: 8.0
    extraversion: 1.0
    agreeableness: 6.0
    neuroticism: 2.0

- name: Kel Bonecounter
  sin_origin: gluttony
  description: >-
    The fence of Gristwell. Buys everything at half value and sells
    nothing back. Keeps a ledger in bone tally cipher.
  personality_traits:
    - calculating
    - superstitious
    - terrified of the dungeon
  typical_classes: [Thief, Mage]
  typical_races: []
  stat_ranges:
    charisma: [14, 16]
    intelligence: [14, 16]
  catalog_items:
    - dagger_iron
  inventory_hints:
    - bone-tally ledger
    - scales made from a dungeon creature's jaw
    - a pouch of teeth used as counting tokens
  dialogue_quirks:
    - counts on his fingers while appraising, muttering values
    - refuses to touch anything that came from below the second level
  disposition_default: -8
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 1.0
    neuroticism: 7.0

- name: Old Morden
  sin_origin: gluttony
  description: >-
    The rumormonger. Claims to have descended to the second level
    twice and survived both times. Missing three fingers on his left hand.
  personality_traits:
    - theatrical
    - half-drunk
    - knows more than he should
  typical_classes: [Thief, Cleric]
  typical_races: []
  stat_ranges:
    charisma: [12, 14]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - a mug that is never empty
    - a hand-drawn map of Level 1 that is mostly accurate
    - three teeth in a pouch that he says came from a door
  dialogue_quirks:
    - holds up his three-fingered hand when making a point
    - lowers his voice and leans in before saying anything about the Glutton
    - calls the dungeon "old Maw" like it is a person
  disposition_default: 5
  ocean:
    openness: 8.0
    conscientiousness: 2.0
    extraversion: 9.0
    agreeableness: 6.0
    neuroticism: 3.0

- name: Petra Tallkeeper
  sin_origin: gluttony
  description: >-
    The provisioner. Runs the only supply shop in Gristwell. Keeps a
    wall of tally marks — one for every delver who bought supplies.
    Most marks are not crossed out.
  personality_traits:
    - businesslike
    - keeps her own counsel
    - remembers every face
  typical_classes: [Cleric, Thief]
  typical_races: []
  stat_ranges:
    charisma: [10, 12]
    wisdom: [14, 16]
  catalog_items:
    - torch
    - rations_day
    - rope_hemp
    - ten_foot_pole
    - iron_spikes
    - chalk
  inventory_hints:
    - a wall of tally marks behind the counter
    - a jar of personal effects from unclaimed supply tabs
  dialogue_quirks:
    - recites prices without being asked
    - pauses to cross out a tally mark mid-conversation, says nothing about it
  disposition_default: 10
  ocean:
    openness: 3.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 2.0

# ── Caster archetypes (post-2026-05-09 B/X pivot) ─────────────────────────
# Sünden's caster classes — Mage and Cleric — produce a class of person, not
# just a class of player character. The archetypes below give the narrator
# stock NPCs to populate the rite-houses, the Recruiter's Post back rooms,
# Brecca Half-Hand's silver-market lodgings, and the wandering edges of the
# imported faiths (Herdsman's Witnesses, Green-Watchers, Dust-Listeners).
# All are PC-buildable as well — a player who picks Mage or Cleric at chargen
# and wants a Sünden-anchored backstory can pull from these.

- name: Brecca's Apprentice
  sin_origin: pride
  description: >-
    A guild-outsider Mage who lodges in the silver-market back rooms
    above Brecca Half-Hand's office. Pays the rent in scroll-identifying
    work — the trader brings something back from Horden each season and
    the Apprentice spends the morning telling her whether it will burn
    her hand or not. Chronically half-blind from reading by lamp-soot.
    Carries a spellbook with the standard Sünden Mage's three
    workings — Detect Magic, Read Magic, Sleep — and not much else.
  personality_traits:
    - bookish
    - careful with words
    - quietly practical
  typical_classes: [Mage]
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [10, 14]
    constitution: [8, 12]
  catalog_items:
    - spellbook
    - component_pouch
    - dagger_iron
    - torch
  inventory_hints:
    - a leather-bound spellbook with Brecca's silver-market mark on the spine
    - a component pouch missing one or two compartments by long use
    - reading lenses in a hinged copper case
    - a list of pending scroll-jobs for Brecca, in cipher
  dialogue_quirks:
    - asks to see the writing before naming the price
    - corrects pronunciation of magical words without comment
    - pauses for a long count before refusing a job
  disposition_default: 5
  ocean:
    openness: 8.0
    conscientiousness: 7.0
    extraversion: 3.0
    agreeableness: 6.0
    neuroticism: 5.0
  role: town
  morale: null

- name: Wallwright Scribe
  sin_origin: pride
  description: >-
    A Mage in the formal employment of the Wallwrights — the guild that
    chisels names into the Wall of Names. The Scribe's job is to verify
    that the proposed inscription matches the deceased's true name (which
    the Wall reads back if the working is performed correctly). One Scribe
    per shift, paid in lodging and silence. They almost never speak the
    names they have verified; they take the secrecy as part of the work.
  personality_traits:
    - reverent
    - exact
    - selectively mute
  typical_classes: [Mage]
  typical_races: []
  stat_ranges:
    intelligence: [14, 16]
    wisdom: [12, 16]
  catalog_items:
    - spellbook
    - component_pouch
  inventory_hints:
    - a Wallwright's verification stylus, ash-tipped
    - a spellbook with one extra working — Read Magic plus a name-checker
      cantrip the Wallwrights teach in-house
    - a closed ledger of the day's verifications, sealed with wax
  dialogue_quirks:
    - never repeats a name they have just chiselled
    - touches the Wall before answering any question about it
  disposition_default: 8
  ocean:
    openness: 5.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 6.0
    neuroticism: 3.0
  role: town
  morale: null

- name: Confessional Acolyte
  sin_origin: greed
  description: >-
    A junior Cleric of Anselm Vail's rite-house, working a rotation under
    the keeper before they are entrusted with the screen and the count.
    Acolytes wear plain undyed linen, carry the pierced-coin holy symbol,
    and are the rite-house's first responders for any party returning
    from a Greed-aligned dungeon — the count needs to be broken before
    the cleric's cure-light-wounds can run. They learn doctrine slowly
    and stop apologising for it eventually.
  personality_traits:
    - earnest
    - tightly disciplined
    - quietly competitive about coin-counts
  typical_classes: [Cleric]
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    charisma: [12, 16]
    constitution: [10, 14]
  catalog_items:
    - mace_iron
    - holy_symbol
    - rope_hemp
  inventory_hints:
    - the Confessional pierced-copper holy symbol, worn inside the collar
    - a folded rite-book of the standing penance-counts
    - a leather purse with the morning's poor-box change for working-cost
  dialogue_quirks:
    - states the penance-count before applying any healing
    - looks at the screen-wall when speaking even when no screen is present
    - calls Anselm Vail "the keeper" never "Vail"
  disposition_default: 12
  ocean:
    openness: 4.0
    conscientiousness: 9.0
    extraversion: 4.0
    agreeableness: 7.0
    neuroticism: 4.0
  role: town
  morale: 7

- name: Workhouse Novice
  sin_origin: gluttony
  description: >-
    A junior Cleric of Brother Hesh's rite-house, in the second of
    seven years of formation. Novices are the muscle of the Workhouse
    — they bake the day's loaves before dawn, mend the looms, draw
    well-water for the visiting parties, and cast Purify Food and
    Water before every shared meal as a matter of habit. Their working
    is unhurried by design, and they are notoriously hard to hurry by
    persuasion. They keep a personal labour-tally that is more
    important to them than the silver the Workhouse pays in.
  personality_traits:
    - patient
    - physically calm
    - allergic to shortcuts
  typical_classes: [Cleric]
  typical_races: []
  stat_ranges:
    constitution: [14, 18]
    wisdom: [12, 16]
    strength: [12, 14]
  catalog_items:
    - hammer_war
    - holy_symbol
    - rations_day
  inventory_hints:
    - the Workhouse pinewood-disc holy symbol on plain twine
    - a folded apron with flour and pine-soap stains
    - a small tally-book in which the labour-counts and prayer-counts share columns
  dialogue_quirks:
    - finishes any current task before answering the question
    - pauses to bless plain bread before eating in the field
    - says "Brother Hesh would" before any deviation from rote
  disposition_default: 8
  ocean:
    openness: 3.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 7.0
    neuroticism: 2.0
  role: town
  morale: 8

- name: Wandering Witness
  sin_origin: pride
  description: >-
    A Cleric of the Herdsman, lodging at the Recruiter's Post when in
    Sünden and walking the Wall of Names on holy days. Witnesses came
    south from the Klas steppes after a bad winter and stayed because
    the Wall reminded them of the Mjöndenheill's roll-call. They
    handle the rite of separation — sick from healthy, dying from
    salvageable — and they pay in years-of-life for every working.
    Apparent age is not stated age. They do not complain about it.
  personality_traits:
    - flat-affected
    - careful with names
    - decisive at the wrong moments
  typical_classes: [Cleric]
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    constitution: [10, 14]
    charisma: [12, 14]
  catalog_items:
    - mace_iron
    - holy_symbol
  inventory_hints:
    - a short wooden crook the length of a forearm, dark with use
    - an Aldkin-pattern wool cloak, river-grey
    - a small leather-bound journal of names with the prayer-tolls noted
      against each
  dialogue_quirks:
    - speaks Aldkin-cadenced Common with flat consonants and long vowels
    - half-step pause before any name
    - decides for you which side of the line you sit on
  disposition_default: 5
  ocean:
    openness: 4.0
    conscientiousness: 7.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 3.0
  role: town
  morale: 6

- name: Hill-Country Watcher
  sin_origin: gluttony
  description: >-
    A celibate druidic Cleric of the Green who patrols the limestone
    hills between Sünden and the dungeon mouths. Watchers are not from
    here — usually displaced from a northern forest that was cut down
    or burned — and they tend the Sünden hill country because what
    survives is what they tend. They take water at the Workhouse, sleep
    upwind of dungeon vents, and pay in childlessness for the Green's
    bond. Half a season ahead of the parties they shadow, knowing the
    hill-paths better than any guide the Recruiter's Post provides.
  personality_traits:
    - quiet
    - unsentimental about loss
    - softly observant of growing things
  typical_classes: [Cleric]
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    dexterity: [12, 16]
    constitution: [12, 14]
  catalog_items:
    - hammer_war
    - holy_symbol
    - rope_hemp
    - rations_day
  inventory_hints:
    - a pressed-leaf disc the size of a thumbprint on a long cord
    - a Watcher's hill-bag with seed-packets and small clay water-pots
    - a stitched cloak in three shades of green that pattern-breaks at distance
  dialogue_quirks:
    - speaks half under the breath
    - addresses growing things (trees, moss, lichen) before addressing strangers
    - declines invitations to lodge indoors with a single nod
  disposition_default: 0
  ocean:
    openness: 7.0
    conscientiousness: 6.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: town
  morale: 7

- name: Wall-Listener
  sin_origin: pride
  description: >-
    A Dust-Listener Cleric who works the Wall of Names at first
    lamp-light and at the hour before dawn. Listeners hear the named
    dead at thin places and translate the fragments for the parties
    who will accept the framing. Their healing is laced with funeral
    cadence and they pray to specific names on the Wall, not into the
    air. They pay in being slowly pulled toward the Chalky Cliffs;
    veteran Listeners walk in their sleep and have to be turned around.
  personality_traits:
    - composed
    - oriented toward the dead
    - plain-spoken about cost
  typical_classes: [Cleric]
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    intelligence: [12, 16]
    constitution: [10, 14]
  catalog_items:
    - mace_iron
    - holy_symbol
  inventory_hints:
    - a knuckle-sized limestone chip on a cord, the source-name written along the cord
    - a journal of named-dead-heard with annotations in two hands (the Listener's and their predecessor's)
    - a long cord coiled at the belt — used at night, when the pull is strongest
  dialogue_quirks:
    - prays to a specific named dead before treating an injury
    - quotes the dead in fragments, fills the gaps without flagging which is which
    - watches the Wall during conversations rather than the speaker
  disposition_default: 5
  ocean:
    openness: 7.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: town
  morale: 7
