  disposition_default: 5
  ocean:
    openness: 8.0
    conscientiousness: 2.0
    extraversion: 9.0
    agreeableness: 6.0
    neuroticism: 3.0

- name: Petra Tallkeeper
  sin_origin: gluttony
  description: >-
    The provisioner. Runs the only supply shop in Gristwell. Keeps a
    wall of tally marks — one for every delver who bought supplies.
    Most marks are not crossed out.
  personality_traits:
    - businesslike
    - keeps her own counsel
    - remembers every face
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [10, 12]
    wisdom: [14, 16]
  catalog_items:
    - torch
    - rations_day
    - rope_hemp
    - ten_foot_pole
    - iron_spikes
    - chalk
  inventory_hints:
    - a wall of tally marks behind the counter
    - a jar of personal effects from unclaimed supply tabs
  dialogue_quirks:
    - recites prices without being asked
    - pauses to cross out a tally mark mid-conversation, says nothing about it
  disposition_default: 10
  ocean:
    openness: 3.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 2.0
