    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 1.0
    neuroticism: 7.0

- name: Old Morden
  sin_origin: gluttony
  description: >-
    The rumormonger. Claims to have descended to the second level
    twice and survived both times. Missing three fingers on his left hand.
  personality_traits:
    - theatrical
    - half-drunk
    - knows more than he should
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [12, 14]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - a mug that is never empty
    - a hand-drawn map of Level 1 that is mostly accurate
    - three teeth in a pouch that he says came from a door
  dialogue_quirks:
    - holds up his three-fingered hand when making a point
    - lowers his voice and leans in before saying anything about the Glutton
