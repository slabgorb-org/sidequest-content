# Caverns & Claudes — Hamlet of Sünden — World-Level Archetypes
#
# Hirelings are world-level: they live in Sünden and can be sent into any
# of the three dungeons (Grimvault/Pride, Horden/Greed, Mawdeep/Gluttony).
# Each archetype is tagged with sin_origin where it was originally authored
# for one sin's culture. Entries below are concatenated verbatim from the
# pre-merge per-dungeon archetypes.yaml files; only the `sin_origin` field
# is new. No exact-name collisions across the three sources.

# ── Pride-origin archetypes (was worlds/grimvault/archetypes.yaml) ──────────

- name: Assayer
  sin_origin: pride
  description: >-
    A meticulous cataloger who maps quality-loss zones and records
    separation patterns. Carries a lead-lined notebook and a set
    of calibrated instruments. Speaks in precise measurements.
    Measures everything twice. Trusts nothing they have not
    personally verified.
  personality_traits:
    - precise
    - skeptical
    - obsessive
  typical_classes: []
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [12, 16]
  catalog_items: []
  inventory_hints:
    - lead-lined notebook with separation logs
    - calibrated instruments in a padded case
    - chalk in three colors for marking quality zones
  dialogue_quirks:
    - quotes exact measurements before opinions
    - corrects imprecise language in others
  disposition_default: 5
  ocean:
    openness: 6.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 4.0
    neuroticism: 5.0
  role: town
  morale: null

- name: Recovery Specialist
  sin_origin: pride
  description: >-
    Treats returning delvers for quality loss. Part therapist, part
    sensory coach, part diagnostician. Can identify which qualities
    have been separated by testing reactions. Has never entered the
    vault and says so without shame.
  personality_traits:
    - empathetic
    - observant
    - cautious
  typical_classes: []
  typical_races: []
  stat_ranges:
    wisdom: [14, 18]
    charisma: [12, 16]
  catalog_items: []
  inventory_hints:
    - a set of colored cards for testing vision
    - a tuning fork for testing hearing
    - a pouch of strongly-flavored herbs for testing taste
  dialogue_quirks:
    - asks you to describe what you see before speaking
    - holds up fingers and waits for you to count them
  disposition_default: 15
  ocean:
    openness: 7.0
    conscientiousness: 7.0
    extraversion: 5.0
    agreeableness: 8.0
    neuroticism: 3.0
  role: town
  morale: null

- name: Material Trader
  sin_origin: pride
  description: >-
    A Ledger specialist who deals in separated materials. Knows
    the market price of weightless iron, colorless cloth, and
    bottled silence. Evaluates vault byproducts with a practiced
    eye and an instrument that looks like a brass monocle with
    too many lenses.
  personality_traits:
    - mercantile
    - knowledgeable
    - calculating
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [12, 16]
    intelligence: [12, 16]
  catalog_items: []
  inventory_hints:
    - multi-lensed assessment monocle
    - vault-standard scale
    - samples of separated materials for comparison
  dialogue_quirks:
    - names a price before you finish describing the item
    - tests materials by holding them near a candle and watching what happens
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 6.0
    extraversion: 6.0
    agreeableness: 3.0
    neuroticism: 4.0
  role: town
  morale: null

- name: Lead-Liner
  sin_origin: pride
  description: >-
    A specialist hireling who treats equipment with lead compounds
    to resist quality drain. Expensive but essential for deep
    delves. Works slowly, speaks less, and guarantees nothing
    except that the treatment was applied correctly. What the
    vault does after that is the vault's business.
  personality_traits:
    - methodical
    - taciturn
    - honest about limitations
  typical_classes: []
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    constitution: [10, 14]
  catalog_items:
    - torch
  inventory_hints:
    - lead-compound paste in sealed jars
    - fine brushes for application
    - treated leather gloves
  dialogue_quirks:
    - tests your equipment before agreeing to treat it
    - charges by the item, not by the hour
  disposition_default: 0
  ocean:
    openness: 3.0
    conscientiousness: 8.0
    extraversion: 1.0
    agreeableness: 5.0
    neuroticism: 2.0
  role: hireling
  morale: 7

# ── Greed-origin archetypes (was worlds/horden/archetypes.yaml) ─────────────

- name: Spiller
  sin_origin: greed
  description: >-
    A Spillfield scavenger who picks the dungeon's overflow every
    morning before dawn. Knows the spillage patterns — which spots
    yield coins, which yield scrap, which yield the occasional
    intact piece. Has green-stained hands from handling corroded
    copper. Practical, superstitious about entering the dungeon,
    and deeply skeptical of anyone who does.
  personality_traits:
    - pragmatic
    - territorial
    - risk-averse
  typical_classes: []
  typical_races: []
  stat_ranges:
    dexterity: [12, 16]
    wisdom: [12, 16]
  catalog_items: []
  inventory_hints:
    - sorting sack with compartments for metal types
    - a Spiller's hook for pulling items from crevices
    - copper-stained leather gloves
  dialogue_quirks:
    - weighs objects by feel before looking at them
    - quotes spillage prices from memory
  disposition_default: 5
  ocean:
    openness: 3.0
    conscientiousness: 7.0
    extraversion: 4.0
    agreeableness: 5.0
    neuroticism: 6.0
  role: town
  morale: null

- name: Counter
  sin_origin: greed
  description: >-
    A member of the counting cult who makes regular pilgrimages
    into Horden to add items to the hoard. Carries pre-counted
    offerings in numbered pouches. Mutters tallies under their
    breath — a habit that started as devotion and became
    compulsion. They know the outer ring intimately and can
    navigate it in the dark by counting steps.
  personality_traits:
    - obsessive
    - precise
    - anxious
  typical_classes: []
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    wisdom: [10, 14]
  catalog_items: []
  inventory_hints:
    - numbered pouches of counting offerings
    - a personal tally stick notched with pilgrimage counts
    - the trade cipher reference sheet (incomplete)
  dialogue_quirks:
    - counts objects in any room they enter before speaking
    - corrects numerical inaccuracies in conversation
  disposition_default: 0
  ocean:
    openness: 4.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 3.0
    neuroticism: 8.0
  role: town
  morale: null

- name: Appraiser
  sin_origin: greed
  description: >-
    A specialist who evaluates treasure brought out of Horden.
    Knows metals, gems, textiles, and the difference between
    surface-quality goods and dungeon-quality goods (which have
    been handled by the Hoarder and are subtly different — heavier,
    colder, faintly humming). Sets prices. Does not negotiate.
  personality_traits:
    - precise
    - mercantile
    - unflappable
  typical_classes: []
  typical_races: []
  stat_ranges:
    intelligence: [14, 18]
    charisma: [10, 14]
  catalog_items: []
  inventory_hints:
    - multi-lensed brass loupe
    - a set of reference weights in a padded case
    - acid testing kit for metal purity
  dialogue_quirks:
    - names a value before you finish describing the item
    - taps metal with a fingernail and listens before pricing
  disposition_default: -5
  ocean:
    openness: 5.0
    conscientiousness: 8.0
    extraversion: 3.0
    agreeableness: 3.0
    neuroticism: 2.0
  role: town
  morale: null

- name: Pack Hauler
  sin_origin: greed
  description: >-
    A specialist hireling optimized for Horden's unique challenge:
    carrying treasure out. Wears minimal armor for maximum carry
    capacity. Knows the goat paths and which stacks are stable
    enough to lean against. Charges by the pound extracted, not
    by the day. Has a personal encumbrance limit they will not
    exceed — they know the weight that triggers the exits closing.
  personality_traits:
    - methodical
    - cautious
    - honest about limits
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [14, 18]
    constitution: [12, 16]
  catalog_items: []
  inventory_hints:
    - reinforced pack frame with wide straps
    - cloth wraps for separating metals (anti-mite)
    - a personal scale for tracking weight in real-time
  dialogue_quirks:
    - tells you exactly how much weight they will carry and not one ounce more
    - shakes their head when you pick up something heavy
  disposition_default: 0
  ocean:
    openness: 2.0
    conscientiousness: 9.0
    extraversion: 2.0
    agreeableness: 5.0
    neuroticism: 4.0
  role: hireling
  morale: 6

# ── Gluttony-origin archetypes (was worlds/mawdeep/archetypes.yaml) ─────────

- name: Nub the Torchbearer
  sin_origin: gluttony
  description: >-
    The cheapest torchbearer in Gristwell. Missing an ear from a
    previous delve. Claims the Glutton bit it off. Reliable with light,
    unreliable with everything else.
  personality_traits:
    - nervous
    - surprisingly brave in short bursts
    - prone to exaggeration
  typical_classes: []
  typical_races: []
  stat_ranges:
    strength: [8, 10]
    constitution: [10, 12]
    dexterity: [12, 14]
  catalog_items:
    - torch
    - torch
    - torch
    - dagger_iron
  inventory_hints:
    - a lucky rat skull on a string
    - three copper coins sewn into the hem of his shirt
  dialogue_quirks:
    - touches the place where his ear used to be when frightened
    - whispers "not again" before entering any new room
  disposition_default: 8
  ocean:
    openness: 4.0
    conscientiousness: 5.0
    extraversion: 3.0
    agreeableness: 7.0
    neuroticism: 8.5

