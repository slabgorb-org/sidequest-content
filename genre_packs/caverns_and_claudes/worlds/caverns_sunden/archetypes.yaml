    nothing back. Keeps a ledger in bone tally cipher.
  personality_traits:
    - calculating
    - superstitious
    - terrified of the dungeon
  typical_classes: []
  typical_races: []
  stat_ranges:
    charisma: [14, 16]
    intelligence: [14, 16]
  catalog_items:
    - dagger_iron
  inventory_hints:
    - bone-tally ledger
    - scales made from a dungeon creature's jaw
