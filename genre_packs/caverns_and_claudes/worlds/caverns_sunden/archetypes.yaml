    constitution: [14, 16]
  catalog_items:
    - sack_large
    - sack_large
    - rope_hemp
  inventory_hints:
    - leather back-brace, hand-stitched
    - a pressed flower in a tin locket
  dialogue_quirks:
    - communicates primarily with nods and head shakes
    - hums a low tuneless melody while carrying
  disposition_default: 5
  ocean:
    openness: 2.0
    conscientiousness: 8.0
    extraversion: 1.0
    agreeableness: 6.0
    neuroticism: 2.0

- name: Kel Bonecounter
  sin_origin: gluttony
  description: >-
