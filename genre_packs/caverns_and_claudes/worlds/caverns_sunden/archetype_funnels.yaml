# Caverns & Claudes — Hamlet of Sünden — World-Level Archetype Funnels
#
# Funnels are world-level: a hireling rolled in Sünden may be funneled into
# any of these specialist roles before being sent into a dungeon. Each funnel
# is tagged with sin_origin for the culture it was originally authored for.
# Funnels referencing per-dungeon factions (The Assayers, The Counters, The
# Delvers Guild, etc.) remain valid because those factions are scoped to the
# corresponding approach hamlet (Ashgate / Copperbridge / Gristwell) and are
# preserved in dungeons/<name>/factions.yaml.

funnels:

  # ── Pride-origin funnels (was worlds/grimvault/archetype_funnels.yaml) ────

  # ── Assayer Fraternity ─────────────────────────────────────────────────
  - name: Cataloging Delver
    sin_origin: pride
    absorbs:
      - [hero, tank]
      - [ruler, tank]
    faction: The Assayers
    lore: >-
      The Assayers prize durability above all else — a delver who can hold a
      position while the rest of the team withdraws is worth their weight in
      separation logs. Cataloging Delvers are the fraternity's frontline, trained
      to absorb what the vault takes and keep moving anyway. They enter knowing
      what will be stripped and have made their peace with losing it, which makes
      them harder to rattle than most.
    cultural_status: respected by the Assayer fraternity, regarded as "used" by civilians who see the flat eyes
    disposition_toward:
      The Assayers: loyal
      The Ledger: transactional
      The Vault Itself: professional

  - name: Assessment Runner
    sin_origin: pride
    absorbs:
      - [hero, dps]
      - [hero, jack_of_all_trades]
      - [explorer, dps]
    faction: The Assayers
    lore: >-
      Where the Cataloging Delver holds, the Assessment Runner moves — clearing
      creatures from mapped zones so the data teams can work uninterrupted.
      The Assayers have precise records of every creature the vault produces and
      what qualities it has lost; Runners exploit these profiles, targeting the
      specific degradations that make each creature easier to put down. They work
      fast because the Assayers bill by the hour.
    cultural_status: hired help who know the job, trusted inside the vault, anonymous outside it
    disposition_toward:
      The Assayers: employed
      The Vault Itself: adversarial-professional

  - name: Quality Mapper
    sin_origin: pride
    absorbs:
      - [sage, control]
      - [explorer, jack_of_all_trades]
      - [explorer, support]
      - [explorer, stealth]
    faction: The Assayers
    lore: >-
      The Assayers' most valued specialists — delvers who can read a room's
      quality-loss signature and map its influence radius before walking into
      it. A Quality Mapper knows which rooms strip warmth, which strip color,
      which take the sense of direction, and crucially, which rooms overlap.
      They control the team's movement through the vault with the authority of
      a navigator at sea. Their notes are the fraternity's most traded asset.
    cultural_status: prestigious within the Assayers, treated as oracles by other delvers
    disposition_toward:
      The Assayers: collegial
      The Ledger: guarded — what the maps are worth to merchants is a source of friction

  - name: Separation Scholar
    sin_origin: pride
    absorbs:
      - [sage, stealth]
      - [magician, stealth]
    faction: The Assayers
    lore: >-
      A student of the Butcher's methods who has learned that the vault's
      own separation logic can be turned to cover. A delver drained of color
      casts no meaningful shadow. One drained of warmth reads as furniture
      to creatures that hunt by heat. Separation Scholars treat quality-loss
      not as degradation but as camouflage, moving through the vault by
      becoming incrementally less detectable to it.
    cultural_status: unsettling to civilians, indispensable on deep delves
    disposition_toward:
      The Assayers: academic
      The Vault Itself: studying

  # ── The Ledger ─────────────────────────────────────────────────────────
  - name: Extraction Agent
    sin_origin: pride
    absorbs:
      - [outlaw, dps]
      - [outlaw, stealth]
      - [outlaw, support]
    faction: The Ledger
    lore: >-
      The Ledger does not fund exploration — it funds delivery. Extraction
      Agents are commissioned to bring specific separated materials out of
      specific rooms, on contract, at price. They are not supposed to catalog
      anything or linger. They are not supposed to speak to the Assayers.
      They go in, they remove the targeted item from wherever the vault has
      sorted it, and they come out. The moral arithmetic of taking separated
      waste from a dungeon that processes people is something they have stopped
      doing.
    cultural_status: financially reliable, professionally disreputable
    disposition_toward:
      The Ledger: contracted
      The Assayers: competitive
      The Vault Itself: thieving from it professionally

  - name: Recovery Broker
    sin_origin: pride
    absorbs:
      - [caregiver, support]
      - [caregiver, dps]
      - [lover, support]
    faction: The Ledger
    lore: >-
      Some delvers do not come out whole. The Ledger employs Recovery Brokers
      to handle the economics of this fact — arranging Wren Peatford's
      services, negotiating next-of-kin compensation, and quietly purchasing
      any separated materials the returning delver no longer needs or no longer
      remembers they owned. They are warm, attentive, and genuinely good at
      their work. The warmth serves the business. That does not make it false.
    cultural_status: necessary and slightly suspected, like all useful intermediaries
    disposition_toward:
      The Ledger: employed
      The Assayers: professionally cordial

  # ── Vault's Surface Effects (Ashgate civilians) ────────────────────────
  - name: Ashgate Steadfast
    sin_origin: pride
    absorbs:
      - [everyman, tank]
      - [everyman, jack_of_all_trades]
    faction: null
    lore: >-
      Ashgate produces a particular kind of person: someone who has lived next
      to the vault long enough that the mild quality-drain of proximity has
      become background noise. Food has always tasted flat. Sound has always
      been slightly muffled. They adapt by needing less — less comfort, less
      reassurance, less color in their expectations. When they delve, they are
      not hardened by training but by having grown up this close to something
      that takes things. They notice when something is missing. They keep going.
    cultural_status: unremarkable in Ashgate, quietly impressive to outsiders
    disposition_toward:
      The Assayers: familiar
      The Ledger: familiar
      The Vault Itself: local fact of life

  - name: Quiet-Field Regular
    sin_origin: pride
    absorbs:
      - [everyman, support]
      - [everyman, dps]
    faction: null
    lore: >-
      The name is what the Assayer logs call them — delvers who cross the Quiet
      Field often enough that the ambient separation between town and vault has
      smoothed some of their edges. Not broken. Not diminished in ways that
      matter. Just worn to a professional finish. They find work as crew
      specialists, extra hands, and the people other delvers want next to them
      when something goes wrong because Quiet-Field Regulars do not panic — the
      vault has already taken whatever in them would have.
    cultural_status: known to the fraternity, invisible to the town
    disposition_toward:
      The Assayers: freelance but aligned

  # ── Independent Pride Delvers ──────────────────────────────────────────
  - name: Separated Blade
    sin_origin: pride
    absorbs:
      - [outlaw, control]
      - [caregiver, control]
    faction: null
    lore: >-
      Delvers who have used the vault's own logic as a fighting discipline —
      controlling engagements not by force but by deliberately placing quality-
      stripped objects, creatures, and zones between themselves and their
      problems. A Separated Blade in a quality-drained room is on home territory;
      she knows exactly what the room does and has positioned everyone else
      inside it first. The Assayers consider them dangerously unscientific.
      The vault considers them indistinguishable from material.
    cultural_status: impressive to other delvers, too strange to hire through normal channels
    disposition_toward:
      The Vault Itself: exploiting it
      The Assayers: tolerated

  - name: Vault-Wise
    sin_origin: pride
    absorbs:
      - [sage, healer]
      - [sage, support]
    faction: null
    lore: >-
      The vault's separations are not random — they follow the Butcher's
      process logic, and a careful student can learn to predict recovery.
      Vault-Wise delvers occupy the narrow role of field healers who know not
      just wounds but quality-loss: how to stabilize someone who has had color
      stripped, how to compensate for a delver who can no longer hear, how to
      keep a team functional when the vault is taking things a conventional
      healer has no name for. Wren Peatford trains the good ones.
    cultural_status: respected by the Assayers, recommended by the Recovery Specialist
    disposition_toward:
      The Assayers: collaborative
      The Vault Itself: studying the damage it does

  - name: Threshold Keeper
    sin_origin: pride
    absorbs:
      - [caregiver, healer]
      - [innocent, healer]
      - [innocent, support]
    faction: null
    lore: >-
      The person stationed at the vault entrance who waits for the team to
      come out. Not ceremonial — the Threshold Keeper is the one who catches
      delvers who stagger back missing something and gets them to Wren before
      they sit down and stop moving. The innocent's unsettled earnestness is,
      unexpectedly, an asset: someone who has not yet learned that the vault's
      damage is normal responds faster and better when it isn't. The Keeper
      counts everyone in and counts everyone out. Discrepancies are logged.
    cultural_status: trusted and quietly mourned when they themselves finally break
    disposition_toward:
      The Assayers: supportive
      The Vault Itself: waiting for it to return what it took

  - name: Ruin Wit
    sin_origin: pride
    absorbs:
      - [jester, stealth]
      - [jester, support]
      - [artist, stealth]
    faction: null
    lore: >-
      The vault takes warmth, color, and sound — but it has not yet found a
      way to take the sense of the absurd. Ruin Wits are delvers who process
      the dungeon's horror through observation, mockery, and a running commentary
      that either keeps the team sane or drives them to distraction depending
      on the team. Their stealth comes from stillness — someone who has learned
      to stop moving and start watching is genuinely hard to notice. They name
      the creatures before they fight them. This turns out to help.
    cultural_status: beloved or intolerable, no middle position
    disposition_toward:
      The Vault Itself: narrating it

  - name: Depth Bard
    sin_origin: pride
    absorbs:
      - [artist, support]
      - [artist, control]
      - [lover, healer]
      - [lover, support]
    faction: null
    lore: >-
      The vault strips sound from corridors, color from walls, warmth from
      stone. The Depth Bard is the counter-measure — not fighting the
      separations but replacing what the vault removes with something that
      comes from inside the party itself. Music that sounds thin in the
      Quiet Field sounds different when the person making it knows they are
      fighting a process that wants it to stop. Color descriptions spoken
      aloud fill rooms that have had color removed. The Butcher has cataloged
      these delvers with particular interest. They represent an anomaly in
      its process.
    cultural_status: famous in Ashgate taverns, not for their songs but for who comes back with them
    disposition_toward:
      The Vault Itself: defiant in the exact wrong way
      The Assayers: appreciated — they reduce casualty rates

  - name: Precision Stalker
    sin_origin: pride
    absorbs:
      - [magician, control]
      - [magician, dps]
      - [magician, support]
      - [ruler, control]
    faction: null
    lore: >-
      The vault operates on precision — rooms calibrated to specific separations,
      traps descending on machined tracks, zones measured to the inch. Precision
      Stalkers have learned the Butcher's methodology well enough to work within
      it: timing movements through separation zones at their minimum effect
      moments, using the vault's own mechanical precision as a map for where its
      attention is focused. They are the closest thing the dungeon has to a
      student. The Butcher has noted them in its ledger under a category that has
      no translation yet.
    cultural_status: rare enough to be memorable, valued by anyone who has seen one work
    disposition_toward:
      The Vault Itself: comprehending it
      The Assayers: sharing data, cautiously

  - name: Rulerless Captain
    sin_origin: pride
    absorbs:
      - [ruler, support]
      - [ruler, dps]
      - [hero, control]
      - [hero, stealth]
    faction: null
    lore: >-
      Leadership in Grimvault does not look like it does above ground. The
      person running the team is the one who knows which room strips courage
      first and has positioned the party so it hits someone else before it
      hits the person whose courage you need. Rulerless Captains carry no
      insignia — the vault would separate it anyway — and operate by studied
      attention to who is losing what and when to pull back. They are called
      rulerless because the Assayer logs showed that teams with formal leaders
      lost more people. The good ones decided it was funnier to keep the name.
    cultural_status: the de facto leadership structure of every serious delving team
    disposition_toward:
      The Assayers: draws on their maps
      The Ledger: negotiates contracts
      The Vault Itself: racing its process

  - name: Jester's Edge
    sin_origin: pride
    absorbs:
      - [jester, dps]
      - [innocent, jack_of_all_trades]
    faction: null
    lore: >-
      The vault does not understand unpredictability — its separations are
      calibrated, its processes orderly, its attention methodical. A delver
      who operates outside expected behavioral patterns interferes with the
      Butcher's catalog in ways that the fraternity cannot fully explain but
      has learned to exploit. The Jester's Edge is someone who fights like
      they are solving a puzzle while being hit, which is not entirely wrong.
      The innocent who has not yet learned that this should be terrifying runs
      on instinct instead of plan, which produces the same interference by
      different means.
    cultural_status: unpredictable to party and dungeon alike
    disposition_toward:
      The Vault Itself: confusing it, possibly intentionally

  # ── Greed-origin funnels (was worlds/horden/archetype_funnels.yaml) ───────

  # ── Fighters, Soldiers & Hired Arms ────────────────────────────────────
  - name: Mule Track Blade
    sin_origin: greed
    absorbs:
      - [hero, tank]
      - [ruler, tank]
      - [everyman, tank]
    faction: null
    lore: >-
      Copperbridge has no standing militia — what it has is the Mule Track, and
      the hard-handed people who walk it. Mule Track Blades are fighters who
      hire out to delver parties as bulk carriers and point-men: they know how
      to hold a door, read a wobbling stack, and walk out lighter than they
      went in. Kern Saltwall keeps a short list of reliable ones behind the
      counter at Kern's Post. The reliable ones charge more. They are worth it.
    cultural_status: respected by Spillers, essential to any serious delve
    disposition_toward:
      The Spillers: allied
      The Counters: wary

  - name: Hazard Scout
    sin_origin: greed
    absorbs:
      - [hero, dps]
      - [ruler, dps]
      - [explorer, dps]
    faction: null
    lore: >-
      The outer ring of Horden is easy. Everything past the Toll Gate is not.
      Hazard Scouts are the fighters who have been deep enough to know the
      difference between a stack that will fall and one that will not — and
      who to kill first when something that has been sealed in the hoard for
      a century comes loose. The Clinker's back table is where they drink.
      Petra Brewer knows them all by name and keeps their tabs in a separate
      ledger.
    cultural_status: valued by delvers, regarded as fools by Spillers
    disposition_toward:
      The Spillers: transactional
      The Hoard Itself: hostile

  # ── Delvers, Scavengers & Dungeon Specialists ─────────────────────────
  - name: Weight Runner
    sin_origin: greed
    absorbs:
      - [hero, jack_of_all_trades]
      - [explorer, jack_of_all_trades]
      - [everyman, jack_of_all_trades]
    faction: null
    lore: >-
      A Weight Runner is not specialized — they are calibrated. They know
      exactly how much they can carry, exactly when to drop something and
      run, and exactly which rooms in Horden add to the count fastest.
      They run in, take one thing, run out, and are home before the Hoarder
      finishes correcting for their entry. The Spillers consider them the
      only sane delvers in Copperbridge. The Weight Runners consider the
      Spillers' opinion a compliment.
    cultural_status: the gold standard of safe delving in Copperbridge
    disposition_toward:
      The Spillers: friendly
      The Counters: neutral

  - name: Tollbreaker
    sin_origin: greed
    absorbs:
      - [outlaw, stealth]
      - [explorer, stealth]
      - [hero, stealth]
    faction: null
    lore: >-
      The Toll Gate between the outer and middle rings asks for payment.
      A Tollbreaker goes through without paying — and the Hoarder notices.
      They are specialists in moving silently through stacks that shift
      at any weight change: side-stepping the bronze bowl, crossing the
      Goat Path without scraping a single crown, threading the Weight
      Lock without triggering the platform. The Hoarder knows they are
      there. They are counting on leaving before the correction arrives.
    cultural_status: quietly infamous in delver circles
    disposition_toward:
      The Spillers: wary — Spillers think they invite inhalations
      The Hoard Itself: hunted

  # ── Scholars, Lore-Keepers & Counter-Affiliated ───────────────────────
  - name: Trade Cipher Reader
    sin_origin: greed
    absorbs:
      - [sage, control]
      - [sage, support]
      - [sage, stealth]
      - [ruler, control]
      - [ruler, support]
    faction: The Counters
    lore: >-
      The Hoarder annotates everything it owns in a notation that is not quite
      any known language. The Counters have decoded fragments of it, and Trade
      Cipher Readers are the scholars who can work from those fragments — mapping
      the Hoarder's inventory categories, predicting which rooms are currently
      active in the count, and navigating Horden by reading the markings on the
      wall instead of guessing. Noll Thatcher trains them personally. None of
      them come out of that training without developing at least one counting
      compulsion.
    cultural_status: invaluable to the Counters, unsettling to everyone else
    disposition_toward:
      The Spillers: cold
      The Hoard Itself: carefully reverential

  - name: Counting Pilgrim
    sin_origin: greed
    absorbs:
      - [sage, healer]
      - [caregiver, healer]
      - [innocent, healer]
    faction: The Counters
    lore: >-
      Every Counter pilgrimage into Horden includes a healer — because adding
      items to the count is peaceful, but the tunnels are not. Counting
      Pilgrims train under Inga Ditcher: they learn to carry offerings instead
      of weapons, to move in ways the Hoarder finds acceptable, and to patch
      a wound without making enough noise to shift a stack. Their healing
      is spare and practical. The dungeon teaches you not to carry bandages
      you cannot afford to lose.
    cultural_status: respected within the Counters, regarded as peculiar everywhere else
    disposition_toward:
      The Spillers: strained
      The Hoard Itself: tolerant

  # ── Spillers, Surface Workers & Town Folk ─────────────────────────────
  - name: Spiller Weigher
    sin_origin: greed
    absorbs:
      - [everyman, support]
      - [everyman, dps]
      - [caregiver, support]
    faction: The Spillers
    lore: >-
      The Spillers run the weight economy of Copperbridge, and not all of
      that work is sorting coins on the Spillfield. Spiller Weighers staff
      Kern's Post, calibrate the Spiller's Scale, negotiate the hazard tax
      with returning delvers, and occasionally break the arm of someone
      who brings back a load that provokes a reorganization. They are
      unfailingly practical people. They do not enter Horden. The Spillfield
      is enough, and they will explain this to you at length.
    cultural_status: essential to Copperbridge commerce, universally trusted on weights
    disposition_toward:
      The Counters: hostile
      The Hoard Itself: wary

  - name: Clinker Regular
    sin_origin: greed
    absorbs:
      - [outlaw, dps]
      - [jester, dps]
      - [everyman, dps]
      - [jester, support]
    faction: null
    lore: >-
      Petra Brewer runs The Clinker's back table as a de facto delver's
      hall: anyone who has been past the Toll Gate and come back is welcome.
      Clinker Regulars are the veterans who drink there — fighters, scouts,
      and one memorable minstrel who performed seven nights in a row to
      cover his tab. They share maps, pool equipment, and maintain a
      running tally of which rooms are currently hot. Nobody goes to Horden
      alone. Nobody who has been there twice wants to.
    cultural_status: the social fabric of Copperbridge's delver community
    disposition_toward:
      The Spillers: friendly
      The Counters: skeptical

  # ── Tacticians, Controllers & Information Operators ───────────────────
  - name: Ledger Thief
    sin_origin: greed
    absorbs:
      - [outlaw, control]
      - [outlaw, support]
      - [hero, control]
    faction: null
    lore: >-
      The Hoarder catalogs everything. A Ledger Thief works against the
      catalog — not by fighting the count, but by confusing it. They study
      the trade cipher fragments the Counters have decoded, learn which
      items the Hoarder tracks most closely, and find ways to move through
      Horden without being entered in the ledger at all. Some carry nothing
      in and out; they specialize in memorizing the layout and selling maps.
      Others specialize in carrying things the Hoarder considers already
      present. The Hoarder counts everything. A Ledger Thief is the one
      thing it counts wrong.
    cultural_status: sought by serious delver crews, distrusted by Spillers
    disposition_toward:
      The Counters: professional respect
      The Hoard Itself: adversarial

  - name: Appraiser's Shadow
    sin_origin: greed
    absorbs:
      - [magician, control]
      - [magician, stealth]
      - [magician, support]
      - [sage, stealth]
    faction: null
    lore: >-
      Deep in Horden, the Appraiser moves — a presence in the Appraisal
      Niche that adds names to the parchment tallies whenever someone lingers
      in the Gem Bower. An Appraiser's Shadow is a practitioner who has
      studied the Hoarder's detection system closely enough to move through
      it: suppressing the awareness that comes with carrying high-value items,
      masking the magical signature of artifacts, or — at the highest skill
      level — briefly convincing the count that someone is not there. None
      of them fully understand how the count works. All of them are very
      careful about what they touch.
    cultural_status: rare, expensive, rumored rather than advertised
    disposition_toward:
      The Counters: curious
      The Hoard Itself: studiously invisible

  # ── Practitioners with Unusual Approaches (greed) ─────────────────────
  - name: Rust Ghost Hunter
    sin_origin: greed
    absorbs:
      - [magician, dps]
      - [caregiver, dps]
      - [caregiver, control]
    faction: null
    lore: >-
      The Rust Gallery in Horden's middle ring is home to what centuries of
      delvers left behind — not just their packs, but their outlines: rust
      ghosts, the corrosion-sealed shapes of people who stayed too long and
      were catalogued into the count. Rust Ghost Hunters specialize in them:
      breaking the seals, reclaiming the contents of iron-frozen packs, and
      neutralizing the ghosts before they rearrange themselves into something
      that objects to being broken. It pays well. It requires specific skills.
      Nobody does it twice without better equipment.
    cultural_status: specialists in high demand, briefly
    disposition_toward:
      The Spillers: useful
      The Hoard Itself: deeply hostile

  # ── Artists, Lovers & Social Operators (greed) ────────────────────────
  - name: Counting Hall Witness
    sin_origin: greed
    absorbs:
      - [artist, support]
      - [artist, control]
      - [artist, stealth]
      - [lover, support]
    faction: The Counters
    lore: >-
      The Counters keep records of everything the trade cipher has revealed
      about the Hoarder's cataloging system. A Counting Hall Witness is the
      person who goes inside not to take or to add, but to observe — to copy
      the markings on the walls, sketch the arrangement of the Counting Hall's
      abacuses, and track how the gold-wire beads move when the count changes.
      The work is dangerous not because of traps but because of temptation.
      Every Counting Hall Witness has a story about the one thing they almost
      touched. The good ones never did.
    cultural_status: valued by Counters, regarded as morbid curiosity elsewhere
    disposition_toward:
      The Spillers: neutral
      The Hoard Itself: observational

  # ── Caregivers, Support & Social Connectors (greed) ───────────────────
  - name: Spiller Row Healer
    sin_origin: greed
    absorbs:
      - [lover, healer]
      - [innocent, support]
      - [innocent, jack_of_all_trades]
      - [jester, stealth]
    faction: The Spillers
    lore: >-
      Spiller Row is the working district of Copperbridge: provisioners,
      smiths, rope-twisters, and the healers who patch up anyone who made
      it out of Horden on their own feet. Spiller Row Healers are town
      people first — they know every face in Copperbridge and half the
      faces that come through looking for a delve. They keep their supplies
      light, their questions gentle, and their opinions about going into
      the dungeon strictly to themselves. The last one who shared her
      opinion scared off three paying customers.
    cultural_status: beloved in Copperbridge, essential infrastructure
    disposition_toward:
      The Spillers: embedded
      The Counters: quietly skeptical

  # ── Lone Operators & Wanderers (greed) ────────────────────────────────
  - name: Inhalation Reader
    sin_origin: greed
    absorbs:
      - [explorer, support]
      - [outlaw, support]
      - [jester, stealth]
      - [lover, support]
    faction: null
    lore: >-
      The Spillers know the inhalation patterns from spillage — when Horden
      reorganizes, the overflow changes character before the event. An
      Inhalation Reader is not affiliated with the Spillers, but reads the
      same signs with different tools: the sound of the dungeon's throat,
      the temperature of the air at the Mouth, the way the Mule Track's
      packed earth vibrates. They sell warnings to anyone going in and
      extraction routes to anyone coming out in a hurry. They are
      spectacularly unpopular during inhalations because they are always right.
    cultural_status: tolerated by everyone, trusted when it matters
    disposition_toward:
      The Spillers: professional rival
      The Counters: cautiously allied

  # ── Gluttony-origin funnels (was worlds/mawdeep/archetype_funnels.yaml) ─

  # ── Vanguard Delvers ──────────────────────────────────────────────────
  - name: Gutcutter
    sin_origin: gluttony
    absorbs:
      - [hero, tank]
      - [ruler, tank]
      - [everyman, tank]
    faction: The Delvers Guild
    lore: >-
      The Delvers Guild's term for whoever walks point and takes the first
      hit — whether that is a scarred veteran enforcing marching order or
      a common laborer who had the nerve to step up. Gutcutters do not hold
      territory; they hold a corridor long enough for the party to extract.
      Brecca Half-Hand was one before she lost her fingers and became
      something rarer: a Gutcutter who survived to tell the count.
    cultural_status: respected inside the Guild, marked by visible damage everywhere else
    disposition_toward:
      The Delvers Guild: loyal
      The Dungeon Itself: adversarial

  - name: Hearthland Blade
    sin_origin: gluttony
    absorbs:
      - [hero, dps]
      - [ruler, dps]
      - [caregiver, dps]
    faction: null
    lore: >-
      The Hearthlands — that vague, sunlit somewhere east that none of
      Gristwell's residents talk about in detail — produce a certain kind of
      fighter: purposeful, slightly too earnest for dungeon work, carrying
      a sense of mission that the Glutton finds no more nourishing than the
      sword. A Hearthland Blade came here for a reason. The dungeon does not
      care what that reason is. The Gristwell tavern crowd learns not to ask.
    cultural_status: welcomed as paying customers, pitied privately
    disposition_toward:
      Gristwell Merchants: transactional
      The Delvers Guild: cautiously open

  # ── Versatile Survivors (gluttony) ────────────────────────────────────
  - name: Jack-Trade Delver
    sin_origin: gluttony
    absorbs:
      - [hero, jack_of_all_trades]
      - [explorer, jack_of_all_trades]
      - [everyman, jack_of_all_trades]
      - [innocent, jack_of_all_trades]
    faction: null
    lore: >-
      Gristwell does not attract specialists. It attracts people who can
      hold a torch, patch a wound, pick a lock, and lie to a Guild elder
      without blinking — not perfectly, but well enough. The Jack-Trade
      Delver is the town's ambient character: unremarkable on the street,
      indispensable in a corridor when the specialist is dead. Old Kettle
      at The Sinkhole estimates they make up half the delving parties
      that walk out alive.
    cultural_status: unremarkable above ground; quietly essential below it

  # ── The Knowing (gluttony) ────────────────────────────────────────────
  - name: Gullet Scholar
    sin_origin: gluttony
    absorbs:
      - [sage, control]
      - [sage, support]
      - [magician, control]
      - [magician, support]
    faction: null
    lore: >-
      Something in the dungeon's deep architecture is organized — the amber
      resin deposits, the Gallery of the Eaten, the copper-coin mosaic in
      the Swallowing Hall. Someone drew those coins. Someone arranged those
      alcoves. The Gullet Scholar came to Mawdeep because of that. Whether
      they are a cataloguing sage with a ruined notebook or a caster who
      wants to understand what exactly the Glutton is, they share the fatal
      habit of pausing to take notes somewhere they absolutely should not stop.
    cultural_status: regarded as eccentric at best, dangerously distracted at worst
    disposition_toward:
      The Dungeon Itself: professionally fascinated, personally terrified

  - name: Amber Reader
    sin_origin: gluttony
    absorbs:
      - [sage, healer]
      - [sage, stealth]
    faction: The Delvers Guild
    lore: >-
      The amber resin that lines Mawdeep's deeper walls is not decoration.
      Guild veterans know it keeps wounds from festering and repels certain
      scavengers that move in the dark. Amber Readers are delvers who have
      mapped these properties through painful empiricism — part field medic,
      part naturalist, part spy for the Guild's internal intelligence network.
      They move quietly because the rooms that have the most resin also have
      the things that want to eat them.
    cultural_status: valued, secretive, never explains the stains on their hands
    disposition_toward:
      The Delvers Guild: informant-adjacent

  # ── Rogues & Fixers (gluttony) ────────────────────────────────────────
  - name: Bonecounter's Hand
    sin_origin: gluttony
    absorbs:
      - [outlaw, stealth]
      - [outlaw, control]
      - [outlaw, support]
      - [explorer, stealth]
    faction: Gristwell Merchants
    lore: >-
      Kel Bonecounter the fence does not buy everything that comes out of
      Mawdeep. He pays particular delvers to find particular things — and to
      do it quietly, without the Guild's cut. A Bonecounter's Hand moves in
      the dungeon the way Gristwell moves around the dungeon: practically,
      without sentiment, with one eye on the exit. They know which rooms
      have been cleared recently because they asked the right questions
      over the right drinks at The Sinkhole.
    cultural_status: known to both factions, trusted by neither, useful to both
    disposition_toward:
      Gristwell Merchants: working relationship
      The Delvers Guild: evasive

  - name: Dustfoot Runner
    sin_origin: gluttony
    absorbs:
      - [outlaw, dps]
      - [explorer, dps]
      - [explorer, support]
    faction: null
    lore: >-
      Named for the pale powder that coats the Antechamber floor — the fine
      grit that marks anyone who has been down and back, impossible to wash
      out before it settles in the boot seam. Dustfoot Runners hit fast and
      move faster, carrying only what can be grabbed without slowing the
      extraction run. They are the freelance economy of Mawdeep: no Guild
      loyalty, no merchant debt, and a very good feel for when the dungeon
      is beginning to constrict.
    cultural_status: admired for nerve, mistrusted for loyalty

  # ── Healers & Sustainers (gluttony) ───────────────────────────────────
  - name: Sinkhole Mendicant
    sin_origin: gluttony
    absorbs:
      - [caregiver, healer]
      - [caregiver, support]
      - [lover, healer]
      - [innocent, healer]
      - [innocent, support]
    faction: null
    lore: >-
      Every tavern at a dungeon's edge has one: the healer who set up in
      the back room, stitching up delvers who stagger out alive and preparing
      the ones who do not for the tally mark on Petra Tallkeeper's wall.
      The Sinkhole Mendicant is not religious, not merciful by philosophy —
      just pragmatic. People die here every week. Someone has to stay calm
      about it. They charge what the traffic will bear and put every coin
      toward their own eventual exit from this town.
    cultural_status: necessary, depended upon, invisible until needed
    disposition_toward:
      Gristwell Merchants: transactional

  - name: Torchwarden
    sin_origin: gluttony
    absorbs:
      - [caregiver, control]
      - [ruler, support]
      - [ruler, control]
    faction: The Delvers Guild
    lore: >-
      Guild expeditions of three or more require a Torchwarden — the
      designated person who manages the light economy, the marching order,
      and the argument about whether to push deeper or extract. The role is
      partly logistical and partly psychological: the dungeon softens people
      up by inches, and someone has to notice before the group makes the
      decision that kills them. Brecca Half-Hand trained every Torchwarden
      currently active. She taught them one rule: the torch count is never
      wrong.
    cultural_status: senior within Guild expeditions; anonymous outside of them
    disposition_toward:
      The Delvers Guild: institutional loyalty

  # ── The Peculiar (gluttony) ───────────────────────────────────────────
  - name: Singing Delver
    sin_origin: gluttony
    absorbs:
      - [artist, support]
      - [artist, control]
      - [artist, stealth]
      - [jester, support]
      - [lover, support]
    faction: null
    lore: >-
      The long corridors of Mawdeep are surprisingly acoustic. Someone
      figured out that the right sound — a specific pitch, a practiced hum —
      keeps the Glutton's scavengers at bay by mimicking the dungeon's own
      resonance. Whether that is true or superstition, Singing Delvers have
      been hired on the strength of it for two generations. Old Morden at The
      Sinkhole claims the Glutton itself pauses when someone sings in the
      Swallowing Hall. He says he heard it stop. He will not sing there himself.
    cultural_status: considered eccentric; hired anyway when the Guild is short on options
    disposition_toward:
      The Dungeon Itself: uneasy détente (possibly imagined)

  - name: Mouth Wit
    sin_origin: gluttony
    absorbs:
      - [jester, stealth]
      - [jester, dps]
      - [magician, stealth]
    faction: null
    lore: >-
      Not every Gristwell delver is grim about it. Some handle the dungeon's
      appetite with a running commentary: naming the traps, narrating the
      creatures, making the Gutcutter laugh at the wrong moment. A Mouth Wit
      is either the last one alive because nobody dies laughing in Mawdeep
      or the first one dead because they stopped moving to deliver a punchline.
      The survivors of the type are genuinely difficult to predict and
      surprisingly quiet when the corridors begin to narrow.
    cultural_status: beloved at the tavern; tolerated in the dungeon; not hired twice if they cost someone a limb
    disposition_toward:
      The Delvers Guild: cheerfully indifferent

  # ── The Lost and the Found (gluttony) ─────────────────────────────────
  - name: Edgeholm Ghost
    sin_origin: gluttony
    absorbs:
      - [innocent, jack_of_all_trades]
      - [everyman, support]
      - [everyman, dps]
    faction: null
    lore: >-
      The Glutton swallowed Edgeholm whole three generations ago. The
      legend says it swallowed everyone in it. The counter-legend, passed
      quietly at The Sinkhole, says a few got out — children, mostly, who
      have been in Gristwell so long they are no longer certain they remember
      Edgeholm or only remember the stories. Edgeholm Ghosts go into the
      dungeon looking for something they cannot name: proof, recovery, the
      last ordinary object from a swallowed life. The Glutton's Gallery of
      the Eaten is full of those objects. That is where they go. That is
      where the dungeon wants them.
    cultural_status: regarded with pity, sometimes reverence, always caution
    disposition_toward:
      The Dungeon Itself: personally anguished

  - name: Debt-Cleared Delver
    sin_origin: gluttony
    absorbs:
      - [everyman, healer]
      - [lover, healer]
      - [caregiver, stealth]
    faction: Gristwell Merchants
    lore: >-
      Rendel the Lender's contracts are ironclad and his interest is
      compounding. The fastest way to clear a debt in Gristwell is one
      successful deep delve — and the fastest way to acquire a debt in
      Gristwell is needing Rendel before you have the gold for supplies.
      Debt-Cleared Delvers are in the dungeon against their better judgment,
      operating under a specific financial deadline that the Glutton does
      not recognize or respect. They are careful in proportion to how
      desperately they need to come back.
    cultural_status: "common enough that Gristwell has a word for it: Rendel-ridden"
    disposition_toward:
      Gristwell Merchants: obligated, resentful

  # ── The Devoted (gluttony) ────────────────────────────────────────────
  - name: Offering Keeper
    sin_origin: gluttony
    absorbs:
      - [lover, dps]
      - [lover, control]
      - [innocent, dps]
    faction: null
    lore: >-
      The Offering trope is the only thing in Mawdeep that resembles
      negotiation: drop treasure down a pit and the Glutton's awareness
      subsides. Somebody has to volunteer. The Offering Keeper is the
      delver who took that role seriously — who started timing the drops,
      studying what the Glutton responds to, and eventually arrived at
      the unsettling conclusion that the Glutton has preferences. It
      prefers gold to silver. It prefers worked objects to raw metal.
      It prefers things that were loved. The Offering Keeper does not
      share this last observation with the rest of the party.
    cultural_status: trusted with a job nobody else wants; watched more carefully for it
    disposition_toward:
      The Dungeon Itself: ritual relationship (one-sided)
