# magic.yaml — caverns_and_claudes / caverns_sunden world layer
#
# 2026-05-07: pivoted to D&D Basic Set (B/X). Sünden now ships both the
# innate caster surface (Cleric / Magic-User daily spell slots) AND the
# item-based surface (scrolls, potions, wands, cursed reliquaries).
#
# Loader requires both genre AND world magic.yaml; absence at either
# tier silently no-ops the entire magic subsystem.

world: caverns_sunden
genre: caverns_and_claudes

# B/X intensity is moderate — magic exists, casters are notable, but
# combat is still mostly steel and wits at low levels.
intensity: 0.4

# Folkloric register survives the pivot — peasants tell wizard stories,
# clerics attend the same shrine generations have. The mechanics are now
# B/X spell slots; the prose stays grounded.
world_knowledge:
  primary: folkloric

# Sünden's priesthood and lay folk both treat working magic with respectful
# distance. Magic-Users are tolerated guild outsiders; Clerics are part of
# the village's ritual rhythm. Cursed items keep the dismissed register —
# every other tavern story is "I knew a man who picked one up."
visibility:
  primary: feared
  local_register: dismissed

# Three plugins active. ``innate_v1`` is the player-facing surface for
# spell casting (cast_spell beat in rules.yaml). ``item_legacy_v1``
# powers scrolls, potions, wands, cursed gear instantiated on pickup.
# ``learned_v1`` is the data layer (per dual-plugin pivot 2026-05-09):
# it owns the spell-catalog loader, prepared_spells / known_spells
# state, and the prepare/cast/rest/turn_undead operations. innate_v1's
# cast_spell beat consumes learned_v1's prepared list via the
# beat-filter prepared-list gate.
active_plugins: [item_legacy_v1, innate_v1, learned_v1]

# B/X-aligned cost vocabulary. ``spell_slots`` is the caster-side cost
# (a memorized spell is consumed when cast); ``components`` and
# ``backlash`` remain item-side costs. ``divine_favor`` is the Cleric's
# bidirectional standing-with-the-rite-house bar — narrator may emit
# negative deltas (broken vow, expedient compromise) or positive deltas
# (penance completed, rite observed). Cost-type names MUST match the
# ledger bar id below — the engine routes ``cost_type → bar_id``
# directly at ``magic/state.py``. A `slots`/`spell_slots` divergence
# dropped every Mage cast silently in the 2026-05-08 playtest; the
# ``divine_favor`` omission would do the same for any narrator-emitted
# Cleric standing change against the rite-house, the imported faiths
# (Herdsman / Green / Dust), or the Wall of Names itself.
cost_types_active: [components, backlash, spell_slots, divine_favor]

# Per-character spell-slot pool. The B/X model is "memorize today's
# allotment from your spellbook (Magic-User) or pray for it (Cleric);
# spend slots as you cast; refresh on rest." We model that as a single
# down-bar normalized to [0.0, 1.0]; the per-class chargen-init value
# encodes B/X canon at L1:
#   Mage    1.0   (1 L1 slot/day at L1)
#   Cleric  0.0   (Cleric casting begins at L2)
#   Fighter 0.0   (non-caster)
#   Thief   0.0   (non-caster)
#   Delver  0.0   (pre-class default; non-caster)
#
# When L2+ chargen lands, expand to per-spell-level bars
# (spell_slots_l1, spell_slots_l2, …) — do NOT reinterpret this normalized
# bar as a count, that direction lies. Class-aware resolution lives in
# ``MagicState.add_character`` via ``LedgerBarSpec.starts_at_chargen``
# accepting either a scalar or a class-keyed dict.
#
# Note: ``promote_to_status`` is intentionally absent. Slot exhaustion
# is a transient resource state ("rest to refresh"), not a Status to
# pin to the character sheet — the narrator surfaces "out of slots"
# via the consequence_on_low_cross prose hook instead.
ledger_bars:
  - id: spell_slots
    scope: character
    direction: down
    range: [0.0, 1.0]
    threshold_low: 0.0
    consequence_on_low_cross: "no spells available until rest — find an inn or risk a wilderness camp"
    starts_at_chargen:
      Mage: 1.0
      Cleric: 0.0
      Fighter: 0.0
      Thief: 0.0
      Delver: 0.0

  # Cleric class-scope bar (story 47-10). Tracks the Cleric's standing
  # with the Three Rites of Sünden — bidirectional, [-1.0, 1.0] with
  # thresholds at ±0.7. High band: narrator may grant a free reliquary
  # effect within the session. Low band: cleric cannot Turn Undead until
  # restored (Confessional / Workhouse / Masquerade narrator hooks).
  # Non-Cleric classes start at 0.0 and the bar is dormant for them.
  - id: divine_favor
    scope: character
    direction: bidirectional
    range: [-1.0, 1.0]
    threshold_high: 0.7
    threshold_low: -0.7
    consequence_on_high_cross: "narrator-discretion: cleric receives one free reliquary effect this session"
    consequence_on_low_cross: "narrator-discretion: cleric cannot Turn until favor is restored at the Confessional / Workhouse / Masquerade"
    starts_at_chargen:
      Mage: 0.0
      Cleric: 0.0
      Fighter: 0.0
      Thief: 0.0
      Delver: 0.0

# Player-build hooks. B/X has Cleric and Magic-User as caster classes,
# Fighter and Thief as non-casters. Item-user shape (Delver pre-class)
# remains valid for any character.
can_build_caster: true
can_build_item_user: true
