# Caverns Sünden — Factions
#
# Folded 2026-05-10 from the per-descent dungeon directories into a
# single world-tier file. The list runs in three layers:
#   1. Hamlet of Sünden's resident institutions (Wallwrights, Vetters'
#      Office, Confraternity of Three Rites) — the regional bodies that
#      predate any delving career.
#   2. Per-descent factions: Ashgate (Grimvault) — Assayers, Ledger,
#      The Vault Itself.
#   3. Copperbridge (Horden) — Spillers, Counters, The Hoard Itself.
#   4. Gristwell (Mawdeep) — Delvers Guild, Gristwell Merchants,
#      The Dungeon Itself (Glutton Below).
#
# Cross-faction relationships (e.g. Wallwrights ↔ Assayers) are
# expressed in each entry's `relationships:` map; see those for the
# full graph.

factions:

  - name: The Wallwrights
    description: >-
      The carving guild who maintain the Wall in Sünden Square. They
      are the descendants of the original Ashgate coroner who founded
      the hamlet, and they have not married out of the trade in three
      generations. The Wallwrights cut every name that goes onto the
      Wall — deaths in deeper letter, returns in shallower, and the
      single horizontal line under any name whose owner came back
      after the carving was already cut. They work at dusk. They do
      not work in rain. They will not carve a name they cannot
      verify, and their idea of verification is older than any of the
      three towns.
    goal: >-
      Keep the Wall accurate. The Wallwrights consider the Wall the
      regional memory — the only object in the country that records
      what the three sins have actually cost in carved fact rather
      than in tavern story. Their goal is not commemoration. It is
      bookkeeping. The Wall must be correct, and correctness for the
      Wallwrights includes refusing carvings as much as cutting them.
      They reject second carvings, embellished carvings, and any
      attempt to buy a deeper cut than the verification warrants.
    urgency: simmering
    scene_event: >-
      A wealthy household from one of the approach hamlets has sent a
      mason of their own to Sünden, with a finer slate and a request
      to commission a private monument inside Sünden Square. Sevra
      Tarn, the elder Wallwright, has refused. The mason is still in
      the hamlet, drinking at the Recruiter's Post, waiting to see
      whether the party will press the case for him.
    disposition_to_players: respectful but watchful
    resources:
      - The Wall (regional memory, public artifact, custom-protected)
      - The carving rite (verification ritual, interview process)
      - The Coroner's Stone and the Old Coroner's House (founding artifacts)
      - The eastern extension courses (the new slate, freshly quarried)
      - The original founding records (kept under lock, rarely shown)
    key_npcs:
      - name: Sevra Tarn
        role: Elder Wallwright, head of the carving guild
        description: >-
          A spare woman in her sixties, descended in direct line
          from the original Ashgate coroner who chose the saddle
          ground for the hamlet. She does the verification interviews
          herself — the conversation that decides whether a death is
          a death and a return is a return. She has refused more
          carvings than she has cut in the last decade. She is not
          unkind. She is precise. She holds the chisels for first
          carvings on apprentice work and her own chisels for
          everything else. She will not be flattered, and she will
          not be paid extra.
      - name: Wallwright Cael
        role: Junior carver, third-generation Wallwright
        description: >-
          Sevra's nephew, late twenties, the youngest carver
          currently certified to cut a name unsupervised. He does
          most of the underline-after-return cuts because the work
          is shallow and the verifications are quicker. He is more
          patient with grieving families than Sevra is and is
          therefore the public face of the guild for everything
          except a death-cut. He has begun, quietly, to suggest the
          Wallwrights revisit the rule against second carvings. The
          guild has not agreed.
    relationships:
      The Vetters' Office: cooperative — the Wallwrights and the vetters share information about returning delvers. The Wall's underline-after-return depends on the same verification the vetters use to clear a hireling for a second contract. The two institutions read each other's records.
      The Confraternity of Three Rites: respectful — the Confraternity treats the stress; the Wallwrights record the outcome. The two institutions stay out of each other's work and meet quarterly at a single supper hosted in the Old Coroner's House.
      The Assayers (Ashgate): cordial — the Assayers' meticulous records of who entered Grimvault and when feed directly into Wallwright verifications. Falk Stonehelm and Sevra Tarn correspond in letters cut to the same precision Falk uses for everything else.
      The Spillers (Copperbridge): wary — the Spillers occasionally request that names of relatives be carved for delvers who never returned from Horden but whose deaths were not witnessed. The Wallwrights refuse without witnesses. The Spillers consider this cruel. The Wallwrights consider it the rule.
      The Counters (Copperbridge): tolerant — the Counters keep their own private tally of every name on the Wall. The Wallwrights have decided not to mind, on the condition that the Counters do not annotate the Wall itself.
      The Delvers Guild (Gristwell): friendly — Brecca Half-Hand sends information north regularly. Most Mawdeep deaths are verified through her ledger.
      Gristwell Merchants: neutral — the Merchants pay their carving fees and ask no questions. The Wallwrights extend the same courtesy.

  - name: The Vetters' Office
    description: >-
      The hireling-evaluation guild that operates out of the back room
      behind the Recruiter's Post. The vetters interview every delver
      who has come back from any of the three mouths and decide
      whether they are fit to be sent down again, and into which sin.
      They keep drift profiles — files on what each returning delver
      came back as, in what direction the change runs, and whether
      that change makes them more or less useful in each of the three
      kinds of horror. The vetters are not one mind. The office is
      divided by long-standing temperament into a kinder desk and a
      colder one, and which desk a returning delver lands on shapes
      the rest of their career.
    goal: >-
      Match the right hireling to the right contract, and prevent
      catastrophes that come from sending the wrong person down. The
      vetters' formal goal is fitness assessment. Their unstated goal
      is harder to pin down — the kinder desk wants to keep delvers
      alive and to retire them honorably onto the Recovery Bench when
      the drift becomes too much. The colder desk wants the
      contracts filled and is willing to send a marginally drifted
      delver into a sin that matches the drift, on the grounds that a
      drifted hireling who survives one more delve is a hireling who
      buys their own bread that month.
    urgency: pressing
    scene_event: >-
      A returning delver from Horden arrived this morning carrying
      one of his own packs and counting under his breath. The
      vetters disagree on his file. Mira Thorn (kinder desk) wants
      him retired to the Recovery Bench under Wren Peatford's care.
      Korven Daish (colder desk) has a Mawdeep contract that requires
      a hireling who can keep an exact count of supplies and is
      willing to clear the file if Mira will not. The dispute has
      reached the Recruiter and the Recruiter has bounced it back.
    disposition_to_players: pragmatic
    resources:
      - Drift profiles (full files on every returning delver of the last decade)
      - The verification system (shared with the Wallwrights — the Wall's underline-after-return depends on the vetters' clearance)
      - Hireling contracts (the office vets every contract before the Recruiter's Post posts it)
      - The Recovery Bench referrals (the formal route off the rolls and onto Wren Peatford's care)
      - Inter-hamlet correspondence (letters from the Assayers, the Delvers Guild, and Bonecounter Alley, all routed through the office)
    key_npcs:
      - name: Mira Thorn
        role: Senior vetter, kinder desk
        description: >-
          A heavy-set woman in her fifties who came up through the
          Workhouse before the Confraternity sent her over to the
          vetting office. She runs the kinder desk, which is to say
          the desk that says no more often than yes. She is not
          sentimental. She has buried more hirelings than she has
          retired. But she will not sign a clearance she does not
          believe, and she has retired delvers onto the Recovery
          Bench against their own protests on more than one
          occasion. The Recruiter respects her. Korven does not.
      - name: Korven Daish
        role: Senior vetter, colder desk
        description: >-
          A wiry man in his forties, formerly a delver himself, two
          delves into Horden and three into Grimvault before the
          drift caught up with him. He runs the colder desk on the
          theory that he has been the delver getting cleared by the
          office and knows what the field looks like. He clears
          marginal cases that Mira would refuse, and most of his
          clearances come back from another delve still upright.
          Most. The ones that do not are why Mira will not eat at
          the same table as him.
      - name: Toller Renn
        role: Junior vetter, file clerk
        description: >-
          Late twenties, neither senior nor settled into a temperament,
          and the staff member who actually keeps the office
          running. He maintains the drift profiles, files the
          inter-hamlet correspondence, and writes the formal
          clearances after the seniors have agreed the verdict. He is
          watching Mira and Korven and has not yet decided which desk
          he wants to inherit. His private suspicion is that the
          office needs a third desk, and his private fear is that he
          is the one who will have to invent it.
    relationships:
      The Wallwrights: cooperative — the same verifications underpin both institutions' work. Toller Renn and Wallwright Cael are personal friends and exchange notes at the Recruiter's Post over the lunch break.
      The Confraternity of Three Rites: practical — the vetters refer drifted delvers to whichever rite matches the drift, and the Confraternity's keepers report back on the rite's success or failure. The relationship is warmer with the Workhouse (Mira's old branch) than with the Confessional or the Masquerade.
      The Wallwrights (specifically Sevra Tarn): correspondent — Sevra and Mira have a standing weekly meeting on the Coroner's Stone at first light. Korven is not invited.
      The Assayers (Ashgate): correspondent — Falk Stonehelm sends Grimvault delve summaries every fortnight by mule courier. Mira reads them. Korven reads them. They disagree about what the summaries imply.
      The Delvers Guild (Gristwell): correspondent — Brecca Half-Hand writes less regularly but with greater density. Her letters tend to support Korven's clearances and unsettle Mira's refusals.
      The Counters (Copperbridge): wary — the Counters periodically try to enroll vetted hirelings into their counting pilgrimages. The vetters refuse on the grounds that a counting-drifted hireling is not a viable contract. The Counters disagree.

  - name: The Confraternity of Three Rites
    description: >-
      The religious-mercantile institution that operates the three
      stress services in Sünden — the Confessional on the north side
      of the Square, the Workhouse on the east, the Masquerade on
      the south. The Confraternity is one body with three branches,
      each branch keyed to one of the three opposing virtues:
      Generosity against Greed, Temperance against Gluttony, Humility
      against Pride. The branches are formally equal. They are not,
      in practice, equal. The keeper of whichever rite is busiest in
      a given season is the senior voice in the Confraternity for
      that season, and the politics of the institution shift with
      each shift in the campaign's wounded sins.
    goal: >-
      Lift delving stress and keep the hamlet functional. The formal
      doctrine of the Confraternity holds that the three sins are
      treated by their three opposing virtues, that the rites are
      equally valuable, and that the institution exists to serve all
      delvers regardless of which mouth they came out of. The
      practical reality is that the three keepers compete for
      Confraternity resources — donations, apprentices, the better
      benches — and each keeper privately believes that their rite
      is the one most needed in the current phase. The keepers do
      not say this aloud at joint sessions. They do not need to.
    urgency: simmering
    scene_event: >-
      The Confraternity's quarterly joint session ended badly last
      week. Anselm Vail (Confessional) accused Brother Hesh
      (Workhouse) of poaching a penitent who came to the Confessional
      first and was redirected. Mistress Coro (Masquerade) refused
      to take a side and is therefore the only keeper currently
      speaking to all three. The party will be solicited for an
      opinion the moment any of them sets foot in any of the three
      service halls.
    disposition_to_players: warm in branch, political in council
    resources:
      - The Confessional (Generosity rite — lifts Greed stress)
      - The Workhouse (Temperance rite — lifts Gluttony stress)
      - The Masquerade (Humility rite — lifts Pride stress)
      - Confraternity Hall (joint meeting room behind the Masquerade)
      - The poor boxes (each branch keeps its own; the contents are not pooled)
      - Apprentices and acolytes (each branch trains its own; transfers between branches are rare and politically charged)
    key_npcs:
      - name: Anselm Vail
        role: Keeper of the Confessional, Generosity branch
        description: >-
          A spare, bookish man in his fifties, originally from
          Copperbridge, where he watched the Counters and decided
          they were a doctrinal error he had to spend his life
          opposing. He runs the Confessional with rigorous
          discretion — the rite is private, the screen is not
          breached, the surrendered treasure goes to the poor box
          and the count is broken. His private opinion is that the
          Confessional is the most important of the three rites
          because Greed is the sin that endangers other people, not
          just its own host. He will not say this in joint
          session. He says it freely in private.
      - name: Brother Hesh
        role: Master of the Workhouse, Temperance branch
        description: >-
          A heavy-shouldered man in his forties, formerly a
          Gristwell delver, two delves into Mawdeep before he
          climbed out for the last time and walked north to Sünden.
          He runs the Workhouse from the cold hearth at the long
          end of the hall — plain food, plain work, plain plank
          beds — and treats the rite as labor rather than worship.
          His private opinion is that the Workhouse is the rite
          that actually works, because Gluttony is the only one of
          the three sins whose drift can be reliably driven out by
          discipline. He is not subtle in joint session. He is not
          subtle anywhere.
      - name: Mistress Coro
        role: Host of the Masquerade, Humility branch
        description: >-
          A woman of indeterminate age — the masks make it harder
          to tell, and she wears one of her own oftener than the
          other two keepers wear vestments. She runs the Masquerade
          as theatre crossed with confession: penitents wear
          carved masks through three public services and speak as
          the masked face. Her private opinion is that Pride is
          the most dangerous of the three because Pride does not
          announce itself, and the Pride-drifted delver returns
          looking, to themselves and to the vetters, like the
          version of themselves that left. She is the senior voice
          in the Confraternity in the current phase. She did not
          ask for this. She is competent at it anyway.
      - name: Sister Pell
        role: Confraternity steward, all three branches
        description: >-
          A young woman in her late twenties who handles the
          Confraternity's joint accounts, schedules the quarterly
          sessions, and writes the joint statements when the three
          keepers can be made to agree on one. She is the closest
          thing the Confraternity has to a neutral voice, and she
          is therefore quietly disliked by all three keepers in
          turn. She was Mistress Coro's apprentice originally. The
          mask she wears at the Masquerade is the only one in the
          hall whose face is her own.
    relationships:
      The Wallwrights: respectful — the Wall and the rites are the two halves of the same regional accounting. The Confraternity does not interfere with carving decisions. The Wallwrights do not interfere with rite outcomes. The Old Coroner's House is the meeting ground for joint suppers.
      The Vetters' Office: practical — the vetters refer drifted delvers to whichever rite matches the drift. Mira Thorn is closer to Brother Hesh (her old branch) than to either of the other keepers; Korven Daish is closer to Anselm Vail; Mistress Coro maintains correspondence with both vetters and is read by both.
      The Counters (Copperbridge): hostile (Confessional only) — Anselm Vail considers the Counters a doctrinal error and the Confessional has refused to admit any avowed Counter as penitent. The other two branches are neutral.
      The Spillers (Copperbridge): neutral — the Spillers occasionally use the Confessional after a particularly rich Spillfield haul. Anselm Vail considers this the rite working as intended.
      The Delvers Guild (Gristwell): cordial — Brother Hesh's old fraternity. He still corresponds with Brecca Half-Hand. The Workhouse's policy is that any retired Gristwell delver is owed a free first rite.
      The Assayers (Ashgate): cool — the Assayers prefer measurement to ritual and have been formally polite to the Confraternity for thirty years without ever actually participating. Mistress Coro finds this unsporting.
      Gristwell Merchants and the Ledger (Ashgate): transactional — both consortiums donate to the poor boxes regularly, both for reasons that are not entirely about charity, and both are accepted on the unspoken terms each side understands.

  # === Ashgate / Grimvault Descent — Pride ===
  # (folded from dungeons/grimvault/factions.yaml)

  - region: grimvault_descent
    name: The Assayers
    description: >-
      The delving fraternity of Ashgate — experienced vault-runners
      who measure everything twice. Where Gristwell's Delvers Guild
      is a loose brotherhood of treasure-seekers, the Assayers are
      obsessive catalogers. They map every room, record every anomaly,
      note every quality that was different on the way out compared
      to the way in. Their records are Ashgate's most valuable asset.
      They know which rooms take what, and how long it takes to get
      it back.
    goal: >-
      Systematic extraction. The Assayers believe the vault can be
      understood and therefore exploited safely — that with enough
      data, they can predict which rooms are dangerous and which
      are merely strange. They are wrong about this, but their
      data is still useful.
    urgency: pressing
    scene_event: >-
      An Assayer team returned from Level 1 with a crate of separated
      materials — iron that weighs nothing, cloth that has no color,
      a bell that makes no sound. The Ledger is already pricing them.
    disposition_to_players: friendly
    resources:
      - Maps of Level 1 (meticulous, annotated with quality-loss zones)
      - Separation logs (what was taken from whom, which rooms, recovery times)
      - Specialized equipment (lead-lined torches, salted rations, mirror compasses)
      - Hireling vetting (they know which hirelings have been in before and what they lost)
    key_npcs:
      - name: Falk Stonehelm
        role: Chief Assayer, twelve-delve veteran
        description: >-
          Speaks in a flat monotone — not by choice. The vault took
          the pitch from his voice on his ninth delve. He compensates
          with precision in his words. Every sentence is exactly as
          long as it needs to be. He has more data on Grimvault than
          anyone alive and shares it at fixed rates. He draws maps
          with his left hand. His right hand cannot hold a pen
          anymore — the grip was separated from his fingers.
      - name: Wren Peatford
        role: Recovery specialist, sensory therapist
        description: >-
          The closest thing Ashgate has to a healer for what the
          vault does. Wren treats returned delvers — retraining
          senses that came back scrambled, coaching people to taste
          food again, teaching the color-blind to navigate by shadow.
          She has never entered the vault herself. She says she
          cannot afford to lose what she uses to help others.
    relationships:
      The Ledger: competitive — the Assayers want data, the Ledger wants profit. They need each other and resent it.
      The Vault Itself: clinical — the Assayers study the vault like naturalists study a predator.

  - region: grimvault_descent
    name: The Ledger
    description: >-
      Ashgate's merchant consortium — shopkeepers, moneylenders, and
      fences who trade in the byproducts of separation. Where
      Gristwell's merchants sell torches and buy gold, the Ledger
      deals in stranger goods. Weightless iron sells to smiths who
      make armor for the elderly. Soundless bells sell to temples
      that need silence. Colorless cloth sells to mourners. The
      vault's waste products have found a market, and the Ledger
      controls it.
    goal: >-
      Monetize everything the vault discards. The Ledger does not
      care about understanding the dungeon — only about what comes
      out of it and what it is worth. They price separated materials
      the way any merchant prices exotic goods: by scarcity and by
      how far the buyer is from understanding what they are buying.
    urgency: simmering
    scene_event: >-
      A Ledger courier arrived from downriver with orders for
      fifty yards of colorless cloth. A noble house wants mourning
      drapes that do not remind anyone of anything. The price is
      extraordinary. The Ledger needs delvers to go deeper.
    disposition_to_players: neutral
    resources:
      - Equipment and provisions (at Ashgate markup, competitive with Gristwell)
      - Separated-material trading (unique to Ashgate)
      - Credit advances (against future haul, terms negotiable)
      - Downriver trade contacts (buyers for exotic vault byproducts)
    key_npcs:
      - name: Agna Ironjaw
        role: Ledger master, pricing authority
        description: >-
          A broad woman with an abacus and no patience. She sets
          the buy price for everything that comes out of Grimvault.
          Her assessments are fast, fair in the mathematical sense,
          and non-negotiable. She has a vault-standard scale that
          weighs properties as well as mass — she can tell you
          how much color a fabric has lost, measured in units she
          invented herself.
      - name: Durn Oakwell
        role: Equipment supplier, torch specialist
        description: >-
          Sells the lead-lined torches that burn longer in the
          vault's quality-draining atmosphere. Also sells standard
          torches at half the price. He is honest about the
          difference but does not push the upgrade. Most buyers
          figure it out after one delve.
    relationships:
      The Assayers: competitive — the Ledger wants to sell what the Assayers want to study. Conflicting incentives.
      The Vault Itself: transactional — the vault produces waste, the Ledger sells waste.

  - region: grimvault_descent
    name: The Vault Itself
    description: >-
      The Patient Butcher does not negotiate, threaten, or communicate
      in any conventional sense. It observes. It catalogs. It separates.
      The vault is its workshop and every room is a station in a
      process that no surface intelligence has fully mapped. Unlike
      the Glutton Below, the Butcher is not hostile by nature — it
      is indifferent to intent. It processes what enters. Delvers
      are not food or enemies. They are material. The vault's immune
      responses are not rage but quality control — removing variables
      that interfere with the work.
    goal: >-
      Continue the work. The Butcher has been separating qualities
      for longer than Ashgate has existed. It separated the color
      from the ridge stone long before miners cracked it open. The
      delvers are a minor interruption — interesting material, but
      not the primary project. What the primary project is, nobody
      knows. The deeper vaults contain the results. Nobody has
      survived to catalog them.
    urgency: pressing
    scene_event: >-
      The Quiet Field has expanded. It now reaches thirty paces
      closer to town than it did last spring. Agna Ironjaw hired
      a surveyor to measure it. The surveyor's instruments lost
      their calibration halfway through.
    disposition_to_players: hostile
    resources:
      - Environmental quality drain (passive resource degradation)
      - Separation traps (targeted removal of specific qualities)
      - The Catalogue (respawning boss guardian)
      - Processed fauna (creatures partially separated and still moving)
      - Keeper awareness system (escalating precision of response)
    key_npcs: []
    relationships:
      The Assayers: indifferent — the Assayers catalog the vault. The vault catalogs the Assayers.
      The Ledger: indifferent — trade in separated byproducts is a surface concern.
    notes: >-
      The Patient Butcher is not malicious. This is worse. Malice
      can be reasoned with, bargained with, avoided. Indifference
      cannot. The vault processes what enters the way a mill
      processes grain. It does not hate the grain.

  # === Copperbridge / Horden Warren — Greed ===
  # (folded from dungeons/horden/factions.yaml)

  - region: horden_warren
    name: The Spillers
    description: >-
      Copperbridge's salvage guild — the people who pick the
      Spillfield clean every morning and sell what they find. They
      never enter Horden. They never need to. The dungeon's overflow
      is enough to sustain the entire town. The Spillers are
      organized, territorial about their salvage rights, and deeply
      suspicious of delvers who go inside. Going in means you are
      greedy. The Spillfield is enough for anyone who is not.
    goal: >-
      Control the spillage economy. The Spillers want exclusive
      rights to the Spillfield and a cut of anything delvers bring
      out — a hazard tax for attracting the Hoarder's attention.
      They believe delvers provoke the inhalations by disturbing
      the count, which endangers the whole town.
    urgency: pressing
    scene_event: >-
      A Spiller crew returned from the dawn sweep with an intact
      gold chain — not scrap, not corroded, still warm from the
      dungeon. The Hoarder is reorganizing. That means an inhalation
      is possible. The Spillers are moving their stockpiles away
      from the Mule Track.
    disposition_to_players: neutral
    resources:
      - Spillfield salvage (daily income, no risk)
      - Town contacts (they know everyone, control commerce)
      - Mule teams for hauling (available for hire, at a premium)
      - Inhalation warnings (they read the spillage patterns)
    key_npcs:
      - name: Kern Saltwall
        role: Spiller boss, veteran scavenger
        description: >-
          A lean man with permanently green-stained hands from
          handling copper spillage every morning for thirty years.
          He speaks in weights and prices, never in abstractions.
          He has never entered Horden and considers this evidence
          of intelligence, not cowardice. His scale is the standard
          in Copperbridge — if Kern says it weighs ten pounds, it
          weighs ten pounds.
      - name: Petra Brewer
        role: Tavern keeper, information hub
        description: >-
          Runs The Clinker from behind a bar made of hammered
          copper. She brews strong ale and collects stories from
          returning delvers. Not a Spiller by trade but married
          to one — she knows the spillage patterns as well as
          anyone and will share them for the price of a good tale.
    relationships:
      The Counters: hostile — the Spillers think the Counters are mad. The Counters think the Spillers are thieves.
      The Hoard Itself: wary — the Spillers respect the dungeon the way fishermen respect the sea.

  - region: horden_warren
    name: The Counters
    description: >-
      A cult of obsessive talliers who believe the Hoarder's count
      is sacred. They enter Horden not to take but to add — bringing
      offerings of new items to keep the count growing, to keep the
      Hoarder occupied, to prevent it from ever finishing. They
      believe if the Hoarder completes the count — tallies every
      item perfectly with nothing new to add — it will reach outward
      for more. The inhalations are previews. The Counters are
      trying to prevent the final one.
    goal: >-
      Keep the count going forever. The Counters add items to the
      hoard on regular pilgrimages. They oppose delvers who remove
      items because every removal forces a recount, and recounts
      bring the Hoarder closer to completion. They want to ban
      delving entirely and rely on spillage only.
    urgency: simmering
    scene_event: >-
      Noll Thatcher returned from a counting pilgrimage with his
      hands shaking. He added forty items — coins, buttons, a
      brass spoon — but the abacus in the Counting Hall was moving
      faster than he had ever seen it. The count is accelerating.
      The Counters are worried.
    disposition_to_players: wary
    resources:
      - Knowledge of the counting patterns (which rooms the Hoarder focuses on)
      - Safe passage in the outer ring (the Hoarder ignores those who add, not take)
      - The trade cipher (partial decoding — can read some of the Hoarder's notation)
      - Tally sticks (pre-counted offerings that satisfy the toll gate without losing anything valuable)
    key_npcs:
      - name: Noll Thatcher
        role: Counter elder, counting pilgrim
        description: >-
          A thin man with restless fingers who counts everything
          he sees — flagstones, roof tiles, buttons on your coat.
          He does not do this voluntarily. He entered Horden once
          and came out counting. He has not stopped in fifteen
          years. He keeps a running tally of Copperbridge in his
          ledger and can tell you if a single cobblestone has been
          moved. The Counters call him blessed. Everyone else calls
          him Noll.
      - name: Inga Ditcher
        role: Counter acolyte, offering crafter
        description: >-
          A young woman who makes counting offerings — small items
          designed to occupy the Hoarder's attention without being
          valuable enough to attract the Appraiser. She crafts
          buttons, tokens, and wooden beads in precise quantities.
          She has never entered the dungeon herself. Noll will not
          allow it until she can count to ten thousand without error.
    relationships:
      The Spillers: hostile — the Counters see spillage-taking as desecration. The Spillers see counting-obsession as dangerous madness.
      The Hoard Itself: reverential — the Counters serve the count. They are the only faction the Hoarder tolerates.

  - region: horden_warren
    name: The Hoard Itself
    description: >-
      The Hoarder does not negotiate. It does not communicate
      except through the count — the whispered inventory, the
      shifting stacks, the doors that close when something moves.
      Unlike the Patient Butcher's clinical indifference or the
      Glutton's ravenous hunger, the Hoarder is proprietary. It
      knows what it has. It knows when something is missing. It
      does not rage. It corrects. The dungeon is a self-adjusting
      inventory system and you are a discrepancy in the ledger.
    goal: >-
      Retain everything. The Hoarder cannot stop acquiring and
      cannot release what it has. The hoard grows. The exits
      narrow. The count becomes more precise. Eventually the
      dungeon will consume Copperbridge, the ridge, and everything
      within reach. The Counters know this and are trying to
      delay it. The Spillers do not believe it. The delvers do
      not think about it.
    urgency: pressing
    scene_event: >-
      The Spillfield yielded more than usual this morning — three
      intact weapons, a set of armor, and a sealed chest. The
      Hoarder is reorganizing the outer ring, pushing old stock
      outward. This means the inner rings are getting denser.
      Something is being compressed to make room for something
      new.
    disposition_to_players: hostile
    resources:
      - Environmental encumbrance (passages narrow as you carry more)
      - The count (awareness based on inventory changes, not noise)
      - Stack collapse (treasure piles that fall on the overburdened)
      - Exit sealing (doors close behind those carrying dungeon items)
      - The Ledger (boss guardian that reclaims catalogued items)
    key_npcs: []
    relationships:
      The Spillers: indifferent — spillage is waste. The Hoarder does not miss it.
      The Counters: tolerant — they add to the count. This is acceptable.
    notes: >-
      The Hoarder is not evil. It is compulsive. It cannot stop
      counting because counting is what it is. The merchant died
      and the counting continued without him. The dungeon is not
      a monster. It is a habit that became architecture.

  # === Gristwell / Mawdeep Gullet — Gluttony ===
  # (folded from dungeons/mawdeep/factions.yaml)

  - region: mawdeep_gullet
    name: The Delvers Guild
    description: >-
      The loose fraternity of treasure-seekers who descend into Mawdeep
      and — sometimes — return. Not a guild in any formal sense: no
      charter, no dues, no hierarchy. What they share is knowledge.
      Which rooms are trapped. Where the amber resin is thickest. How
      long a torch lasts on Level 2. This knowledge is currency.
      Experienced delvers sell maps, hire out as guides, and hoard
      intelligence about the deeper rooms. Fresh delvers buy rounds
      at The Sinkhole tavern and hope someone talks.
    goal: >-
      Extract maximum treasure from Mawdeep with minimum casualties.
      The Guild exists because the dungeon is profitable — barely,
      on average, but spectacularly for the lucky few. The dream of
      the Full Belly's hoard keeps them coming back.
    urgency: pressing
    scene_event: >-
      A delving party staggers out of the Mouth at dawn, one member
      short, packs heavy with gold. By noon the tavern is buzzing
      with rumors of what they found. By evening, three new parties
      are forming.
    disposition_to_players: friendly
    resources:
      - Maps of Level 1 (accurate, expensive)
      - Maps of Level 2 (incomplete, unreliable, very expensive)
      - Experienced hirelings (torchbearers, porters, sellswords)
      - Rumor network (which rooms have been cleared recently, Maw status)
    key_npcs:
      - name: Brecca Half-Hand
        role: Guild elder, seven-delve veteran
        description: >-
          Lost three fingers to a gullet polyp on her fourth delve.
          Kept going. Now she runs the hiring board at The Sinkhole
          and takes a cut of every contract. She has been deeper than
          anyone alive and will not talk about what she saw in the
          Stomach. She will sell you a map. She will not sell you hope.
      - name: Torchboy Fen
        role: Hireling broker, torchbearer trainer
        description: >-
          Nineteen years old, already on his eleventh delve as a
          torchbearer. He trains new torchbearers and takes a fee
          from both sides. He is very good at staying alive and
          very bad at keeping his employers alive. He does not
          seem troubled by this.
    relationships:
      Gristwell Merchants: symbiotic — the Guild sells what it extracts, the Merchants supply what delvers need
      The Dungeon Itself: adversarial — the Glutton eats delvers, delvers rob the Glutton

  - region: mawdeep_gullet
    name: Gristwell Merchants
    description: >-
      The shopkeepers, innkeepers, provisioners, and moneylenders of
      Gristwell — the town that exists because the dungeon exists.
      Every business in Gristwell services the delving trade. The
      Provisioner sells torches and rations at markup. The Sinkhole
      tavern sells ale and rumors. The moneylender advances gold
      against future hauls at ruinous interest. The blacksmith repairs
      weapons that come back notched and acid-scarred. Gristwell is a
      parasite on a parasite — it feeds off the delvers who feed off
      the dungeon.
    goal: >-
      Keep the delving economy flowing. A dead delver is bad for business,
      but a successful one who retires is worse. The ideal customer
      returns with just enough gold to resupply and goes back in
      tomorrow. Gristwell's merchants are not evil — they are simply
      the economic inevitability of a town built on the lip of a
      living dungeon.
    urgency: simmering
    scene_event: >-
      The Provisioner has raised torch prices again — the last shipment
      of pitch was delayed by a sinkhole on the trade road. The
      moneylender is offering advances at only forty percent interest.
      Generous, for him.
    disposition_to_players: neutral
    resources:
      - Equipment and provisions (at Gristwell markup)
      - Moneylending (high interest, collateral = future haul)
      - Lodging and meals at The Sinkhole tavern
      - Weapon and armor repair (quality varies)
      - Fencing services for unusual loot (gems, artifacts, the Maw's components)
    key_npcs:
      - name: Marga Provisioner
        role: Supplies dealer, price gouger
        description: >-
          She sells torches, rope, rations, chalk, iron spikes, and
          everything else a delver needs at exactly the price the
          market will bear — which is steep, because the alternative
          is going into the dark without them. She is not unkind. She
          is not kind. She is accurate.
      - name: Rendel the Lender
        role: Moneylender, debt collector
        description: >-
          Advances gold against a percentage of the next haul. His
          contracts are ironclad and his collection methods are
          creative. He has never entered the dungeon. He does not
          need to. The dungeon comes to him, one debtor at a time.
      - name: Old Kettle
        role: Innkeeper, The Sinkhole tavern
        description: >-
          Runs the only tavern in Gristwell. The ale is weak, the
          stew is mysterious, and the rumors are the real product.
          Old Kettle has heard every delver's story for thirty years.
          He remembers which ones came back. He does not share his
          count unless you buy a third round.
    relationships:
      The Delvers Guild: symbiotic — merchants need delvers to buy supplies, delvers need merchants to sell treasure
      The Dungeon Itself: parasitic — Gristwell exists because the dungeon exists, and will die when it doesn't

  - region: mawdeep_gullet
    name: The Dungeon Itself
    description: >-
      The Glutton Below is not a faction in any human sense. It does
      not negotiate, ally, trade, or communicate in language — though
      it speaks, after a fashion, in the grinding of stone and the
      wet sounds of digestion. It is a geological intelligence: vast,
      slow, and hungry. It has been swallowing the countryside for
      generations. Caravans, farmsteads, villages — Edgeholm went
      down whole. The dungeon grows wider every spring. The Maw is
      its guardian. The amber resin is its blood. The rooms are its
      organs. It is not malicious. It is hungry. There is no
      reasoning with hunger.
    goal: >-
      Consume. The Glutton does not plan or strategize. It responds
      to intrusion the way a stomach responds to food — with acid,
      with contraction, with digestion. Its "tactics" are autonomic:
      corridors narrow, traps reset, the Maw guards the deepest
      treasure because the deepest treasure is the most nutritious
      part of the meal. The delvers are not enemies. They are food
      that fights back.
    urgency: pressing
    scene_event: >-
      The Mouth breathed this morning — a long, slow exhalation of
      warm air that carried the smell of copper and old stone. The
      trade road cracked overnight, two hundred yards closer to
      Gristwell than the last crack. The dungeon is still growing.
    disposition_to_players: hostile
    resources:
      - Infinite regeneration (the dungeon rebuilds itself between delves)
      - The Maw (respawning boss guardian)
      - Amber hulks (constructed from digested remains)
      - Environmental control (constricting corridors, acid pools, bioluminescence)
      - Keeper awareness system (escalating hostility)
    key_npcs: []
    relationships:
      The Delvers Guild: predatory — delvers are food that carries treasure into the dungeon
      Gristwell Merchants: indifferent — the town is too far from the Mouth to eat. For now.
    notes: >-
      The Glutton is not a traditional faction. It cannot be negotiated
      with, allied to, or reasoned with. It is included as a faction
      because it is a force with goals, resources, and responses to
      player actions — the Keeper awareness system makes it a reactive
      antagonist. The "diplomacy" with the Glutton is the Offering
      trope — dropping treasure to reduce awareness. You cannot make
      peace with it. You can only feed it enough to buy time.
