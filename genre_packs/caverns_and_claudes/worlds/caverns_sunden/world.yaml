# Caverns & Claudes — Hamlet of Sünden
# A standard leaf world. The Hamlet of Sünden sits at the center of a
# wound where three of the Seven Deadly Sins woke close together. The
# player walks from the Hamlet to whichever dungeon they want to
# enter — Grimvault (Pride), Horden (Greed), Mawdeep (Gluttony) — by
# saying so. More dungeons can be added by adding regions to the
# cartography.
#
# Pivoted away from the hub-world / hireling-patron design (2026-05-06):
# what made Sünden special was always the *content* (sins, drift,
# the Wall, the wound mechanics). The engine plumbing for it has been
# discarded; Sünden is a normal cartography world with rich
# narrator-zone fodder.

cover_poi: sunden_square
name: "Hamlet of Sünden"
slug: caverns_sunden
description: >-
  Three of the Seven Deadly Sins woke close together. Three dungeon
  mouths gape at the borders of a single town. The Hamlet of Sünden
  is the only inhabited point at the regional center — limestone
  weathered by lamp-soot, a Wall of carved names along the north face
  of the square, three stress-service houses keyed to the opposing
  virtues (Generosity / Temperance / Humility), and the Recruiter's
  Post at the south edge where new delvers are presented and taken on.
  Some come back. Some come back changed. Some get carved into the
  Wall. Pride lives in Grimvault under the Patient Butcher's clinical
  eye. Greed lives in Horden under the Hoarder's offended count.
  Gluttony lives in Mawdeep under the Glutton Below's wet appetite.
  Sünden reads each delve afterwards in the drift on its own NPCs —
  the innkeeper's voice doesn't carry, the market vendor sorts by
  material, someone is always chewing. The campaign is the long shape
  of which sins get wounded and which survive to drift the Hamlet
  again.

tagline: "Three sins. One town. Walk down to whichever wakes you up."

starting_location: "Sünden Square at first lamp-light"

axis_snapshot:
  comedy: 0.25
  gravity: 0.85
  outlook: 0.4
