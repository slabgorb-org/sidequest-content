# Sünden — World-Tier Tropes
# Folded from per-descent dungeons/{grimvault,horden,mawdeep}/tropes.yaml
# (2026-05-10). Each trope's tags carry region affinity (vault/hoard/glutton).
# These extend genre-tier tropes via TropeInheritance.

# === Grimvault Descent (Pride / The Patient Butcher) ===
- id: the_butcher_assesses
  name: The Butcher Assesses
  description: >-
    The Patient Butcher observes and catalogs the party's qualities.
    As awareness rises, the assessment becomes more specific — from
    ambient observation to targeted interest in individual members.
  category: tension
  triggers:
    - keeper awareness threshold reached
    - entering a new room for the first time
    - using equipment that has interesting properties
    - speaking loudly or making unusual sounds
  narrative_hints:
    - a feeling of being measured, as though someone is taking notes
    - your torch dims fractionally, as if something tasted the light
    - the silence deepens in a way that feels deliberate
  tension_level: 0.6
  resolution_hints:
    - reduce awareness through quiet, careful movement
    - leave the vault and return when the Butcher's attention fades
    - push to the objective before the assessment is complete
  tags: [keeper, vault, tension, escalation]
  escalation:
    - at: 0.2
      event: >-
        Something has been moved. A tool on a workbench is in a
        different position. A label on a shelf has changed. The
        vault is cataloging your presence.
      npcs_involved: []
      stakes: The Butcher is aware of intruders. Separation effects in rooms intensify slightly.
    - at: 0.4
      event: >-
        A voice — calm, quiet, clinical — describes a quality of one
        party member. Their warmth, their voice, their gait. The
        description is accurate. The interest is professional.
      npcs_involved: []
      stakes: Targeted separation begins. Specific party members may lose specific qualities in specific rooms.
    - at: 0.6
      event: >-
        Doors begin closing on their own. Not slamming — settling
        into place with machined precision. The vault is isolating
        rooms. Processing zones are being activated.
      npcs_involved: []
      stakes: Navigation restricted. Some exits sealed. Alternate routes required.
    - at: 0.8
      event: >-
        The Butcher's assessment is complete. It knows what each
        party member has and what it wants. Separation effects are
        now targeted — the room you enter will take specifically
        the quality the Butcher is interested in from specifically
        the person it wants it from.
      npcs_involved: []
      stakes: Quality loss is no longer random. The vault is hunting specific properties.
    - at: 1.0
      event: >-
        Full processing mode. Every room actively separates. The
        Catalogue activates regardless of location. The vault is
        no longer a workshop you are exploring — you are material
        on the processing floor.
      npcs_involved: []
      stakes: Maximum separation. The party must extract immediately or be fully processed.
  passive_progression:
    rate_per_turn: 0.015
    rate_per_day: 0.0
    accelerators:
      - combat
      - loud
      - breach
      - treasure_taken

- id: quality_extraction
  name: Quality Extraction
  description: >-
    The party is heading for the exit with separated materials.
    The vault does not want its waste back — but removing materials
    disrupts the Butcher's filing system, and that draws attention.
  category: conflict
  triggers:
    - party turns back toward exit with vault materials
    - carrying separated materials through processing rooms
    - keeper awareness elevated while carrying loot
  narrative_hints:
    - rooms you passed through are now more active — separation effects stronger
    - husk walkers change their patrol routes to intersect your path
    - the Butcher's voice describes what you are carrying with displeasure
  tension_level: 0.7
  resolution_hints:
    - drop separated materials to reduce attention
    - move quickly through known safe rooms
    - use lead-lined containers to mask material signatures
  tags: [extraction, treasure, tension, resource]
  escalation:
    - at: 0.3
      event: >-
        A room you passed through safely on the way in now has active
        separation effects. The warmth drain is stronger. Your torch
        burns dimmer. Something has been recalibrated.
      npcs_involved: []
      stakes: Resource drain increases on the way out. Extraction is more expensive than exploration.
    - at: 0.6
      event: >-
        A husk walker blocks a corridor — not by accident but by
        reassignment. Its patrol route has changed to intersect your
        extraction path. It stands in the doorway, weightless and
        still, cold hands at its sides.
      npcs_involved: []
      stakes: Combat or detour. Both cost resources.
    - at: 1.0
      event: >-
        The Threshold is in sight but the Calibration Room has opened
        its normally-locked door. The calibration sphere hums with
        the vault's full attention. Passing it means submitting to
        a final assessment. The Butcher will take one last quality
        from each party member as a processing fee.
      npcs_involved: []
      stakes: Final cost. Accept the quality loss and leave, or find another route.
  passive_progression:
    rate_per_turn: 0.04
    rate_per_day: 0.0
    accelerators:
      - treasure
      - encumbered
      - slow

- id: sensory_cascade
  name: Sensory Cascade
  description: >-
    A party member has accumulated too many separated qualities.
    The remaining senses overcompensate — colors are too vivid,
    sounds are too loud, textures are overwhelming. The body is
    trying to fill the gaps with what it has left.
  category: hazard
  triggers:
    - third quality separation on a single character
    - extended time on Level 2
    - multiple cold grip hits in one encounter
  narrative_hints:
    - the affected character flinches at normal sensory input
    - they describe things others cannot perceive — phantom colors, phantom sounds
    - they become unreliable narrators of their own experience
  tension_level: 0.5
  resolution_hints:
    - leave the vault immediately for surface recovery
    - Wren Peatford at the Recovery Bench can stabilize
    - press on with reduced reliability
  tags: [quality_loss, hazard, character, resource]
  escalation:
    - at: 0.5
      event: >-
        The character's remaining senses spike. Colors are painfully
        vivid. Sounds are deafening. They perceive things that are
        not there — compensatory hallucinations filling the gaps in
        their sensory field.
      npcs_involved: []
      stakes: Unreliable perception. The character may report things that are not real.
    - at: 1.0
      event: >-
        Full cascade. The character's senses are a kaleidoscope of
        overcompensation. They cannot distinguish real from phantom
        input. They need to be led by hand. They are a liability.
        Surface recovery takes days.
      npcs_involved: []
      stakes: Character effectively incapacitated. Must be escorted out.
  passive_progression:
    rate_per_turn: 0.03
    rate_per_day: 0.0
    accelerators:
      - separation
      - depth
      - fear

# === Horden Warren (Greed / The Hoarder) ===
- id: the_hoarder_counts
  name: The Hoarder Counts
  description: >-
    The Hoarder's awareness rises as inventory changes occur. Unlike
    Grimvault's quality assessment or Mawdeep's hunger, this is
    accounting — precise, relentless, offended. Every item touched
    is a discrepancy. The count must be corrected.
  category: tension
  triggers:
    - picking up any item in the dungeon
    - moving treasure from one location to another
    - the Appraiser completing a count
    - entering a room for the first time (baseline inventory scan)
  narrative_hints:
    - a faint clicking from the walls, like abacus beads sliding
    - a stack nearby shifts one item closer to the edge
    - the air thickens with the smell of old paper and ink
  tension_level: 0.6
  resolution_hints:
    - put items back exactly where they were found
    - leave the dungeon carrying nothing
    - kill the Appraiser before it completes its count
  tags: [keeper, hoard, tension, escalation]
  escalation:
    - at: 0.2
      event: >-
        A doorway you passed through is partially blocked. A small
        pile of coins has appeared at its base — not enough to stop
        you, enough to notice. The Hoarder is aware of a discrepancy.
      npcs_involved: []
      stakes: Exits begin narrowing. Awareness is building. Time to consider what you are carrying.
    - at: 0.4
      event: >-
        The whispering begins. A voice at the edge of hearing, listing
        items — not yours, not yet. The Hoarder is inventorying the
        room you are in, checking what should be here against what is
        here. Something is missing. It knows.
      npcs_involved: []
      stakes: The Hoarder is actively tracking discrepancies. Awareness spikes when items are lifted.
    - at: 0.6
      event: >-
        Goat paths shift. A passage you used ten minutes ago is now
        narrower — stacks have leaned inward, coins have drifted into
        the gap. Your planned exit route requires squeezing through
        sideways. Your pack catches on a protruding crown.
      npcs_involved: []
      stakes: Navigation disrupted. Maps partially invalid. Extraction routes compromised.
    - at: 0.8
      event: >-
        The Hoarder's whisper is now audible. It is counting your
        inventory. Torches — two. Rations — three. Coins — it pauses.
        It is counting your coins. One by one. It sounds disappointed.
        The counting takes time. When it finishes, it will know
        exactly what you have taken.
      npcs_involved: []
      stakes: Full inventory scan. When the count completes, all exits seal until items are returned.
    - at: 1.0
      event: >-
        Every exit is walled. Treasure has stacked itself into solid
        barriers at every doorway. The whispering has stopped. A new
        sound — the scratching of a pen on paper. The Ledger is
        updating. You are now inventory. Your name is being written
        into the catalogue.
      npcs_involved: []
      stakes: Total lockdown. The Ledger activates. Escape requires defeating the boss or abandoning all dungeon items.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.0
    accelerators:
      - treasure_taken
      - encumbered
      - combat
      - appraiser_count

- id: the_extraction
  name: The Extraction
  description: >-
    The party turns back toward the exit carrying treasure. The
    dungeon tightens. Every step toward the mouth is harder than
    the step that brought you in. The Hoarder does not chase. It
    simply makes leaving more expensive than staying.
  category: conflict
  triggers:
    - party turns toward exit while carrying dungeon items
    - encumbrance exceeds half capacity
    - the toll gate is approached from the inside
  narrative_hints:
    - passages are narrower than they were on the way in
    - treasure you passed before has shifted to block alternate routes
    - your pack feels heavier with every step, though the weight has not changed
  tension_level: 0.7
  resolution_hints:
    - drop items to reduce encumbrance and ease passage
    - use the weight lock to strip down and pass through
    - force through the toll gate (requires deposit)
  tags: [extraction, treasure, tension, resource]
  escalation:
    - at: 0.3
      event: >-
        The goat path you used to enter the middle ring has narrowed.
        Your pack will not fit. You can pass without the pack, or
        find another route. The other route goes through the
        Counting Hall, where the abacuses will register every item.
      npcs_involved: []
      stakes: Forced choice — abandon pack contents or accept awareness spike.
    - at: 0.6
      event: >-
        A coin golem assembles at the toll gate. It stands in the
        arch, filling the passage. To pass, you must get through it.
        Every hit scatters coins worth collecting. Every coin
        collected raises awareness. The dungeon is testing your
        discipline.
      npcs_involved: []
      stakes: Combat at the chokepoint. The golem is profitable to fight but every coin picked up costs awareness.
    - at: 1.0
      event: >-
        The mouth is in sight but the Spillfield beyond it is
        pulling inward. Coins from outside are sliding back up
        the Mule Track. The Hoarder is inhaling. You have minutes
        to clear the entrance before the inhalation reverses the
        spillage — and drags you back in with it.
      npcs_involved: []
      stakes: Sprint for the exit. Drop everything or risk being pulled back. The town is at risk.
  passive_progression:
    rate_per_turn: 0.05
    rate_per_day: 0.0
    accelerators:
      - treasure
      - encumbered
      - slow
      - awareness_high

- id: the_inhalation
  name: The Inhalation
  description: >-
    The Hoarder breathes in. Treasure flows back toward the dungeon.
    The Spillfield empties. Objects in Copperbridge vibrate toward
    the ridge. If you are between the dungeon and town, you are
    caught in the current.
  category: hazard
  triggers:
    - awareness reaching maximum
    - large-scale removal of treasure over multiple delves
    - narrative escalation at VETERAN maturity
  narrative_hints:
    - coins on the ground begin to vibrate and slide
    - the Spillfield is bare — picked clean by the inhale
    - a wind blows toward the dungeon that carries no air, only weight
  tension_level: 0.9
  resolution_hints:
    - drop everything and run for town
    - shelter behind stone buildings (the inhale cannot move stone — yet)
    - the Counters claim adding items to the offering pile slows the inhalation
  tags: [hazard, dungeon, environmental, escalation]
  escalation:
    - at: 0.5
      event: >-
        The Spillfield is empty. The coins are gone, the scrap is
        gone, the blankets the Spillers left weighted down with
        stones are gone — stones and all. The ground is bare dirt.
        A wind blows from town toward the dungeon. It is not air.
        It is a pull.
      npcs_involved: []
      stakes: Spillfield cleared. Town economy disrupted. The pull is getting stronger.
    - at: 1.0
      event: >-
        Full inhalation. Everything not anchored to stone moves
        toward the dungeon. Carts slide. Market stalls tip. A house
        near the Mule Track groans on its foundation. The Hoarder
        is reorganizing at scale. The last time this happened, two
        houses went in. This time it wants more.
      npcs_involved: []
      stakes: Town-level crisis. Property damage. Possible structural loss. The Spillers evacuate.
  passive_progression:
    rate_per_turn: 0.0
    rate_per_day: 0.0
    accelerators:
      - mass_removal
      - veteran_maturity

# === Mawdeep Gullet (Gluttony / The Glutton Below) ===
# Mawdeep — World-Specific Tropes
# Extend genre tropes with Glutton-specific behavior

- id: the_glutton_tastes
  name: The Glutton Tastes
  description: >-
    On Level 1, the Glutton is passive — sampling, not digesting.
    Rations spoil slightly faster. Water from the Cistern is tempting
    but tainted. The dungeon offers what looks like sustenance and
    poisons it. A prelude to the real hunger below.
  category: foreshadowing
  triggers:
    - entering Level 1 rooms with food/water
    - examining the Pantry supplies
    - drinking from the Cistern
  narrative_hints:
    - food smells slightly off
    - water has a faint yellowish tint
    - the air tastes of something you cannot name
  tension_level: 0.3
  resolution_hints:
    - trust only supplies brought from the surface
    - use the Provisioner's goods, not what the dungeon offers
  tags: [glutton, resource, foreshadowing, level_1]
  escalation:
    - at: 0.5
      event: >-
        A hireling tastes something from the dungeon. They look fine
        for now. In two rooms they will be vomiting.
      npcs_involved: []
      stakes: Resource loss — a hireling out of action for several rooms.
    - at: 1.0
      event: >-
        The Pantry is discovered. Everything looks edible. Nothing is.
        The Glutton has been collecting your kind's food and letting
        it rot in a display that might be mockery or might be hunger.
      npcs_involved: []
      stakes: Morale hit. The dungeon understands what you need and corrupts it.
  passive_progression:
    rate_per_turn: 0.01
    rate_per_day: 0.0
    accelerators:
      - food
      - water
      - rations

- id: the_belly_contracts
  name: The Belly Contracts
  description: >-
    On Level 2, the dungeon physically constricts around the party.
    Corridors narrow. Ceilings drop. Rooms shrink imperceptibly
    between visits. The Glutton is digesting.
  category: tension
  triggers:
    - entering Level 2 rooms
    - Keeper awareness above 10
    - spending more than 3 rooms on Level 2
  narrative_hints:
    - the corridor feels tighter than it did a moment ago
    - your torch catches the ceiling closer than before
    - the walls are damp and warm, like the inside of a mouth
  tension_level: 0.7
  resolution_hints:
    - move quickly — do not linger on Level 2
    - extract before the constriction traps you
    - the stairs are the only reliable two-way exit
  tags: [glutton, constriction, level_2, tension]
  escalation:
    - at: 0.3
      event: >-
        A passage that was passable on the way in is noticeably narrower
        on the way back. Armor scrapes the walls. The porter cannot fit
        with a full sack.
      npcs_involved: []
      stakes: Route may become impassable. Alternative paths needed.
    - at: 0.6
      event: >-
        A room the party passed through has contracted to half its size.
        Equipment left behind is crushed into the walls.
      npcs_involved: []
      stakes: The dungeon is actively reshaping. The map is becoming unreliable.
    - at: 1.0
      event: >-
        The Gullet passage seals completely. The party is trapped on
        Level 2 with only the stairs as an exit — if the stairs are
        still open.
      npcs_involved: []
      stakes: Single exit. Total extraction urgency.
  passive_progression:
    rate_per_turn: 0.03
    rate_per_day: 0.0
    accelerators:
      - depth
      - time
      - awareness

- id: the_offering
  name: The Offering
  description: >-
    The Glutton can be temporarily sated. Dropping treasure in certain
    rooms (the Cistern, the Stomach) reduces Keeper awareness. The
    dungeon takes back what was taken. This is the pressure valve —
    sacrifice gold to survive.
  category: resource
  triggers:
    - dropping treasure in Cistern or Stomach rooms
    - abandoning loot during extraction
  narrative_hints:
    - the pool in the Cistern ripples when gold touches the water
    - the soft floor of the Stomach absorbs dropped treasure slowly
    - a brief, satisfied rumble through the stone
  tension_level: 0.4
  resolution_hints:
    - feed the dungeon to buy time
    - calculate whether survival is worth more than the gold
  tags: [glutton, resource, sacrifice, awareness]
  escalation:
    - at: 0.5
      event: >-
        Dropping 50+ GP worth of treasure in the Cistern reduces Keeper
        awareness by 3. The water ripples. The rumbling stops. For now.
      npcs_involved: []
      stakes: Gold sacrificed is gold not extracted — lost XP.
    - at: 1.0
      event: >-
        Dropping 100+ GP worth in the Stomach reduces awareness by 5 and
        the soft floor firms up temporarily. The Glutton is satisfied.
        Briefly.
      npcs_involved: []
      stakes: Major sacrifice for major relief. The math of survival.
  passive_progression:
    rate_per_turn: 0.0
    rate_per_day: 0.0
    accelerators:
      - sacrifice
      - treasure_drop
