id: workhouse
name: "The Workhouse"
region: sunden_hamlet
room_type: settlement
description: >-
  A long timber hall along the east side of the Square, open at both ends, set
  with benches, looms, and a cold hearth. The rite is Temperance: two delve-ticks
  of plain labor — bread baked, stones split, fields turned, looms worked — plain
  food at the long bench, plain plank bed at night. The cost cannot be bought down,
  hurried, or substituted. Brother Hesh runs the hall from the cold hearth, sleeves
  up, ladle in hand. The rhythm of the labor is the rhythm of the stress draining.
  Wren Peatford's Recovery Bench sits at the south door for those whose drift has
  gone past what the labor can lift. Best for stress from Mawdeep.
exits:
  - {to: sunden_square, label: "west to Sünden Square"}
  - {to: recruiter_post, label: "south to the Recruiter's Post"}
  - {to: mouth, label: "south road to the Mawdeep Gullet"}
