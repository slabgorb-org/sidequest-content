id: recruiter_post
name: "The Recruiter's Post"
region: sunden_hamlet
room_type: settlement
description: >-
  A single-room timber building on the south-east corner of the Square, doors
  propped open from dawn until the last hireling is cleared. The hireling board
  carries cards for the current roster: name, days available, declared sin-affinity,
  the vetter whose desk approved the card. Contract slates hang along the back wall,
  sorted by mouth. The bench under the slates is worn to a shallow curve where
  returning delvers sit waiting for vetting. The smell is old sweat, lamp oil, and
  chalk. Mira Thorn signs fewer clearances than she refuses. Korven Daish clears the
  marginal cases she will not.
exits:
  - {to: sunden_square, label: "north to Sünden Square"}
  - {to: workhouse, label: "north to the Workhouse"}
  - {to: mouth, label: "south road to the Mawdeep Gullet"}
