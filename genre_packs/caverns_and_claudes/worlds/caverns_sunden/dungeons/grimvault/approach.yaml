# Approach: a half-abandoned hamlet at this dungeon's mouth. The party walks
# through here on the way down and on the way back. NOT a hub town — Sünden
# is the hub. Approaches are sin-touched, hollow, mostly silent.

dungeon: grimvault
name: Ashgate
slug: ashgate

description: >-
  Ashgate was a clean ridge-town of pale limestone and quiet pride, the
  kind of place that polished its doorsteps and kept its accounts in
  order. The pride drift took it first — and slowest. Year by year the
  bread tasted of less. The ale lost bite. Voices lost carry, so people
  spoke louder and never noticed. By the time the Patient Butcher's pull
  was named for what it was, half of Ashgate had already moved to
  Sünden carrying boxes of things they could no longer remember
  enjoying. The square is still swept. The fountain still runs. The
  water still tastes of nothing at all. The few who stayed are the
  ones whose tongues went flat in the cradle and could not be cured by
  distance — pride-touched in the bone, with nowhere else that food
  would taste any different.

state: hollowed
population_remaining: 16

what_remains:
  - The Assayer Hall on the north side of the square stands open as it always did, its doors propped wide; nobody works the desk now, but a ledger lies on the counter in case someone brings something out worth weighing.
  - Wren Peatford still keeps the Recovery Bench at the field's edge, tuning fork in her apron pocket, because somebody has to check returning delvers for what the vault took, and she is the only one left who learned the trick of it.
  - Households still set the table for the absent — a clean plate at the empty seat, a cup turned upright — though nobody now in Ashgate can remember whose seats those used to be.

scene_hooks:
  - id: arrival
    when: party_first_enters
    description: >-
      The road from Sünden ends at a square paved in pale stone that has
      forgotten how to hold colour. A fountain runs clear in the middle,
      pigeons drinking from it without sound. Three women at a window
      watch the party pass and do not call out. The bread cooling on a
      sill smells of warm air and nothing else. The vault's mouth is
      visible past the last roofline.

  - id: return
    when: party_returns_from_delve
    description: >-
      Wren is already on the bench when the party crests the field, fork
      in hand before the first delver reaches her. The square seems
      smaller on the way back — the buildings the same height, the
      streets the same width, the air thinner around them. Someone has
      laid out cups of the tasteless water on a trestle. They are for
      the party. Nobody says so.

# These were full POIs in the old world.yaml — preserve the most evocative
# 1-3 as named locations in the approach. Drop the rest.
points_of_interest:
  - name: The Quiet Field
    slug: the_quiet_field
    description: >-
      Two hundred paces of silent grass between the last Ashgate
      rooftop and the vault's rectangular entrance. A stone path runs
      down the centre. By the middle of the field a delver's footsteps
      stop reaching their own ears; by the entrance a torch burns a
      shade paler than it should. Birds cross the field in silence and
      come out the other side singing again, as though nothing had been
      wrong.

  - name: The Spillway
    slug: the_spillway
    description: >-
      A tavern built over a spring that emerges through the floor and
      runs out under the back wall in a cut stone channel. The ale is
      still brewed on-site with a hard hand of hops, because the brewer
      who stayed says it is the last drink in the hamlet that tastes
      of anything at all. Durmach's chair still sits in the corner,
      empty. Nobody uses it. Nobody has explained who Durmach was for
      a long time.

  - name: The Recovery Bench
    slug: the_recovery_bench
    description: >-
      A plain wooden bench at the edge of the Quiet Field, set under a
      lean-to roof so the rain does not come down on whoever is sat on
      it. Wren Peatford keeps a tuning fork, a candle, a thumb-mirror,
      and a small slate by her side — enough to test what came back
      with the delver and what stayed behind in the vault. The slate
      is wiped clean between parties. The chalk dust never quite leaves
      her cuffs.
