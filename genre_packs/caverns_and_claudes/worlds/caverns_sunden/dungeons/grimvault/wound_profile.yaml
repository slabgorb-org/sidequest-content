# Wound profile: applied to dungeon after boss-floor success.
# Merges into the Keeper definition via narrator prompt-zone (engine plan separate).

dungeon: grimvault
sin: pride

# Override deltas — narrator prompt-zone applies these on top of base Keeper.
keeper_overrides:
  monologue_style_delta: >-
    The voice no longer rises from the silences between your words; it
    rises from every surface at once, slower and colder, the way a
    workshop speaks after the gemcutter has set the stone down and
    walked away.

  awareness_delta:
    starting: -1
    tick_rate: -0.25
    threshold_overrides:
      "3": >-
        Tools left on a dozen workbenches at once. Clean. Recently oiled. None of them yours.
      "6": >-
        Rooms you have not yet entered are already sorted by material, waiting.
      "10": >-
        Your shadow is missing from every wall, not just this one. It has been distributed.
      "15": >-
        Every surface has been planed smooth — floor, ceiling, the back of your own hand.
      "20": >-
        Your name has been filed into a hundred drawers, one syllable at a time, and none of them are deeper than the others.

ambient_delta: >-
  The workshop is no longer a place — it is a condition. What used to
  concentrate at the bottom of Grimvault now hangs evenly through every
  corridor, like dust that refuses to settle. The cold is uniform. The
  quiet is uniform. There is no central room to fear, because the
  attention has been spread across all rooms equally. Doors that once
  opened onto preparation chambers now open onto more of the same
  patient, unhurried emptiness. The dungeon has been opened up. It is
  larger inside than it was, and slower to focus, but when it focuses
  it focuses harder.

new_lore_strand: >-
  Carvers add a thinner line beneath Pride's name and call it the
  Distributed Cut. The countryside notes it in small ways — knives in
  Ashgate hold an edge longer, lullabies sung indoors carry less than
  they used to, mirrors in three villages stop reflecting warmth before
  they stop reflecting faces. The Wall's new inscription reads: HE WAS
  NARROWED, NOT ENDED. THE WORKSHOP IS EVERYWHERE NOW. Delvers who go
  back in find the Patient Butcher harder to provoke and worse to wake.
  Something was taken from him on the boss floor. He has spent the
  years since spreading what remains across more surfaces, so it can
  never be taken whole again.
