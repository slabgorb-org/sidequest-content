# Hamlet of Sünden — World Visual Style
# The warmth-and-people counterweight to the three dungeons. Pale
# limestone hamlet, sin-touched but lived-in. Warmer than Grimvault's
# clinical chill, drier than Horden's verdigris damp, less organic than
# Mawdeep's cartilage walls — and never quite at ease.
#
# WIRING: positive_suffix is the field the daemon's StyleCatalog reads
# (sidequest-daemon/sidequest_daemon/media/catalogs.py::StyleCatalog.load).
# World-level positive_suffix layers on top of the genre's B&W ink
# suffix via the explicit-recipes PromptComposer's ART_SENSIBILITY.WORLD
# slot.
#
# IMPORTANT (playtest 2026-05-06 fix): the world-level suffix is INJECTED
# INTO EVERY RENDER IN THIS WORLD, including dungeon scenes (Grimvault,
# Horden, Mawdeep). Earlier this field carried a long Sünden-hamlet
# subject description (limestone hamlet, parish-church scale, market
# stalls, parish Wall, etc.) which then dominated dungeon prompts —
# a torchlit chamber inside Grimvault rendered as the hamlet's exterior
# town square. The dungeon-level visual_style.yaml files in
# `worlds/caverns_sunden/dungeons/<dungeon>/` are NOT yet wired into
# the StyleCatalog, so they cannot currently override.
#
# Doctrine for this slot: keep the world-level suffix to *tonal art
# discipline* (palette mood, line discipline, what the WHOLE world looks
# like as black-and-white ink). Subject specifics (which architecture,
# which props, which lighting) belong on the per-POI ``visual_prompt``
# block in ``history.yaml`` (see ``sunden_square`` for the canonical
# shape) — those are pulled into the LOCATION layer only when the
# scene actually resolves to that POI. Free-form prose locations
# (mid-corridor, transient encounters) intentionally fall through with
# only the world-level tonal layer + the narrator's
# ``visual_scene.subject`` describing the scene-specific imagery.
#
# Z-Image Turbo runs at guidance_scale=0 and ignores negative_prompt
# entirely (see sidequest-content/PROMPTING_Z_IMAGE.md). Rejection
# clauses are folded into positive_suffix as "No X, no Y" rather than
# authored as a separate negative_prompt.

positive_suffix: >-
  B&W pen-and-ink discipline in the genre style of Erol Otus and
  David Trampier, heavy crosshatch shadow, fine line work on carved
  stone and grain in cut timber, high contrast, no readable signage,
  no text, no caption, no title, no watermark.

# Z-Image ignores this; rejection clauses are in positive_suffix above.
negative_prompt: ""

color_palette:
  primary: "#C9C2B2"      # warm pale limestone
  secondary: "#9A8466"    # weathered ochre, lamp-soot wood
  accent: "#A85A3C"       # low-saturation brick / copper warm
  shadow: "#3E342A"       # warm dark, not dungeon cold-black
  highlight: "#F2E7C9"    # cream-white oil-lamp light

atmosphere:
  square: >-
    Sünden Square is the warmest and most populated frame in the
    world. Pale limestone underfoot in three radial wedges of
    different stone, the central drainage running clean. The Wall
    stands on the western edge with morning sun behind it; in any
    other lighting the light is oil-lamp warm spilling from window
    slits and porches. The square is lived-in but never bustling —
    five or six figures in frame is full, and one of them is always
    standing slightly too still.
  market: >-
    The market arcade tucks under the south side of the square — a
    timber-and-stone awning sheltering a dozen stalls. Crates and
    sacks are present but the sorting is wrong in small ways: a row
    of identical apples in obsessive order, a fish stall with no
    fish out and the fishmonger waiting, a coin tray sorted by date
    rather than denomination. Lamp-soot blackens the rafters above
    the stalls. The light is warm but the shadows under the awning
    are heavier than they should be at midday.
  the_wall: >-
    The Wall is a three-course slate monument on the western edge
    of the square, twenty paces along, faced east so the carved
    names read sharpest at first light. Seven columns. Three of
    them — Pride, Greed, Gluttony — bear cut names of varying
    depth; the other four are kept blank by custom. Heavy fine line
    work on the carved letters, deeper cut for deaths than for
    returns, a single horizontal line beneath any name whose owner
    came back after their carving. The Wallwrights work this surface
    at dusk by lamp; the chisels do not ring during the day.
  approaches: >-
    The three approach hamlets — Ashgate north, Copperbridge east,
    Gristwell south — read visually as hollowed-out variants of
    Sünden's late-medieval template. Each is thinner than the town
    it was built for: half-boarded windows, fountains running
    flavorless water, hitching posts with no horses tied. Ashgate's
    hollowing is bleached pale (limestone gone too white, stones
    that should not be stones); Copperbridge's is verdigris and
    copper-stained (water that should not be that color, bridges
    mossed over); Gristwell's is sunken and damp (ground that gives
    underfoot, buildings on the highest holdouts). All three carry
    the same B&W ink discipline as Sünden but with more white space
    where the population should be.

# ============================================================
# Per-descent visual-style overrides — NOT YET WIRED
# ============================================================
#
# These are preserved authorial intent for each descent. The
# StyleCatalog currently reads only the world-tier positive_suffix
# above; per-region overrides have no consumer yet (the daemon's
# StyleCatalog has no concept of region-level style override).
# Folded 2026-05-10 from dungeons/{grimvault,horden,mawdeep}/visual_style.yaml
# pending wiring through the explicit-recipes PromptComposer at the
# REGION layer.

regions:

  grimvault_descent:
    positive_suffix: Dungeon interior, cold stone, desaturated palette, precise geometry,
      clean-cut walls with no tool marks, flat surfaces, sharp edges, machined precision,
      torchlight that does not warm, shadows that are too sharp, empty shelves, labeled
      niches, stone workbenches, the aesthetic of a laboratory not a cave, Dyson Logos
      crosshatch style but cleaner — less organic, more architectural. No gore, no blood,
      no organic textures, no warmth, no comfort, no natural stone, no rough surfaces,
      no vegetation, no water, no moisture, no bright colors.
    negative_prompt: ''
    color_palette:
      primary: '#C4C4C4'
      secondary: '#8A8A8A'
      accent: '#E8E8E8'
      shadow: '#3A3A3A'
      highlight: '#FFFFFF'
    atmosphere:
      level_1: Subtly desaturated. Colors exist but are muted — as if viewed through frosted
        glass. Torchlight is cool-toned. Shadows have hard edges.
      level_2: Severely desaturated. Almost monochrome. Occasional patches of intense
        color where separated qualities pool — unnaturally vivid against the grey. Like
        a black-and-white photograph with a single color element.

  horden_warren:
    positive_suffix: treasure hoard dungeon, piles of coins and tarnished metal stacked
      floor to ceiling, cluttered passages, goat paths between treasure walls, verdigris
      patina on bronze, tarnished silver, rotting fabric under gemstones, claustrophobic
      abundance, wunderkammer density, every surface covered, every shelf full, heavy
      crosshatch shadows between treasure stacks, single torch illuminating dense clutter
    negative_prompt: empty rooms, clean surfaces, sparse decoration, minimalism, outdoor
      scenes, vegetation, water, orderly arrangement, modern materials, open spaces
    visual_tag_overrides:
      dungeon: claustrophobic passage between walls of stacked treasure, coins protruding
        from compacted piles, crosshatched shadows between leaning stacks, single torch
        catching glints on metal surfaces, goat path barely wide enough for one person,
        dust motes in beam
      tavern: prosperous underground tavern furnished with dungeon spillage, copper bar
        top dented from coins, mismatched silver goblets, treasure-chest stools, chalkboard
        with spillage yields, a reinforced empty chair in the corner
      town: frontier salvage town at a dungeon mouth, stone bridge over a creek stained
        green with copper, sorting blankets on cobbles covered in coins and scrap metal,
        green-stained hands, prosperous but uneasy, ridge looming above
    atmosphere:
      outer_ring: Generous clutter. Wide passages with treasure in easy reach. Crosshatch
        the piles loosely — they are not threatening yet. Glints and reflections suggested
        by leaving white space in the ink. The dungeon looks like a gift. This is the
        trap.
      middle_ring: Dense, oppressive stacking. The crosshatch is heavier — less white
        space, more ink. Treasure piles lean inward, creating tunnel-like passages. Verdigris
        and tarnish visible as texture variation in the ink work. The torch barely reaches
        past the nearest stack.
      inner_sanctum: Obsessive precision. Clean lines replace crosshatch. Every coin faces
        the same direction. Geometric patterns in the floor mosaic. The chaos of the outer
        rings gives way to unsettling order. Heavy black fills around the edges — the
        room is a small bright space surrounded by absolute ink.

  mawdeep_gullet:
    positive_suffix: black and white pen and ink illustration in the style of Erol Otus
      and David Trampier, organic dungeon, ribbed stone walls like cartilage, bioluminescent
      veins in rock, claustrophobic perspective, single torch source casting long shadows,
      damp stone surfaces, stomach-like architecture, tooth-shaped stone formations, heavy
      crosshatching, stippled shadows, monochrome, high contrast, 1979 TSR interior art
    portrait_style: black and white pen and ink portrait in the style of Erol Otus and
      David Trampier, torchlit from below, heavy crosshatching, dungeon grime and sweat,
      wide frightened eyes or hollow exhaustion, monochrome, high contrast, stippled shadows,
      rough paper texture
    creature_style: black and white pen and ink illustration in the style of Erol Otus
      and David Trampier, 1979 Monster Manual interior plate, organic dungeon horror,
      ribbed stone walls, bioluminescent veins, heavy crosshatching, stippled shadows,
      bold black outlines, monochrome, high contrast, surreal unsettling proportions,
      single torch source, rough paper texture
    poi_style: black and white pen and ink illustration of an organic dungeon chamber
      in the style of Erol Otus and David Trampier, ribbed walls like cartilage, bioluminescent
      veins in stone, single torch illumination, claustrophobic framing, heavy crosshatching,
      stippled shadows, monochrome, high contrast, moisture glistening on surfaces
