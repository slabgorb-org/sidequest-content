# Sünden cartography — region-level adjacency.
#
# Four regions arranged around the Hamlet:
#   sunden_hamlet — the limestone town at center, the only safe ground
#   grimvault_descent — Pride; the clean cold vault under Ashgate ridge
#   horden_warren — Greed; the counting passages under Copperbridge
#   mawdeep_gullet — Gluttony; the wet deep under Gristwell
#
# Adjacency: the Hamlet borders all three dungeons. Dungeons do NOT
# border each other — you cross back through the Hamlet to switch sins.
# This matches the world.yaml geography ("three dungeon mouths gape
# at the borders of a single town").
#
# More dungeons can be added by appending region entries; the engine
# does not care how many there are.

map_resolution: null
map_style: >-
  Soot-stained ink on weathered parchment, hand-drawn pilgrim chart,
  three chambered mouths sketched in Iron Gall, Hamlet limestone
  rendered in cross-hatched gray, candlelight shadow, deliberate
  imperfections.

starting_region: sunden_hamlet

regions:
  sunden_hamlet:
    name: Hamlet of Sünden
    summary: The limestone town at the wound's center; Wall, Recruiter's Post, three stress-relief houses.
    description: >-
      A single square paved in pale limestone, smoke-stained around
      the north face where the Wall has been chiseled and re-chiseled
      across generations of names. The fountain at the center runs
      clear water that tastes of nothing at all — long-time residents
      drink from the brewery instead. Three houses on the side
      streets keep the town livable: the Confessional (humility),
      the Workhouse (temperance), the Masquerade (generosity). At
      the south edge, the Recruiter's Post sees through a thin door
      whoever the day brings; some are turned away, some are not.
      Three dungeon mouths watch the town from their respective
      ridges, never quite out of sight.
    terrain: settlement
    adjacent:
      - grimvault_descent
      - horden_warren
      - mawdeep_gullet
    landmarks:
      - name: "Sünden Square"
        type: plaza
        description: >-
          Fountain at center; the Wall of Names along the north face;
          the four cardinal lamps lit at dusk by whoever is working
          the Workhouse rota that week. Where the Hamlet gathers when
          a delving party returns or fails to return.
      - name: "The Recruiter's Post"
        type: civic
        description: >-
          A narrow door in a narrow building at the south edge. The
          Recruiter is a different person every season; the role
          rotates among Hamlet residents who have lost too many
          delvers to do anything else. They take notes, they ask
          three questions, they decide.
      - name: "The Wall"
        type: monument
        description: >-
          A single limestone face the height of three people, carved
          and re-carved with the names of every delver who did not
          return. New names are chiseled in at dawn after a defeat;
          the chiseler is whoever in town holds the hammer that day.
      - name: "The Confessional / The Workhouse / The Masquerade"
        type: stress_relief_houses
        description: >-
          Three small houses keyed to the virtues that oppose the
          three sins. The Confessional (humility, against pride),
          the Workhouse (temperance, against gluttony), the
          Masquerade (generosity, against greed). A delver who
          returns shaken can spend a day or two in the appropriate
          house at no cost.
    settlements:
      - Sünden
    rivers: []

  grimvault_descent:
    name: Grimvault Descent
    summary: Pride — a clean rectangular shaft cut into the limestone above Ashgate. The Patient Butcher waits inside.
    description: >-
      The vault entrance is a rectangle cut into limestone with edges
      too sharp for any chisel. It sits on the ridge above Ashgate,
      one of three approach hamlets that grew up along the descent
      paths. Wren Peatford's Recovery Bench sits at the threshold;
      she checks each delver's hearing with a tuning fork before
      they enter and again when they return. Inside: clinical
      passages, white-lit chambers, the Patient Butcher who notices
      everything and forgives nothing. Pride is the sin that survives
      contact with this place. Pride does not survive long.
    terrain: dungeon
    sin: pride
    tagline: "It takes what makes things what they are."
    cover_poi: the_descent
    axis_snapshot:
      comedy: 0.3
      gravity: 0.8
      outlook: 0.4
    keeper:
      name: "The Patient Butcher"
      personality: methodical
      obsession: separation
      tone_override:
        comedy: 0.25
        gravity: 0.85
      awareness:
        starting: 0
        tick_rate: 1
        stealth_decay: -1
        thresholds:
          "3": "Tools left on a workbench. Clean. Recently oiled. Not yours."
          "6": "A room you passed through is now organized differently — everything sorted by material."
          "10": "Your torchlight casts no shadow. The shadow has been taken separately."
          "15": "The walls are smooth as glass. Every texture has been planed away."
          "20": "You cannot remember your own name. It has been filed somewhere deeper."
      monologue_style: >-
        Quiet, measured, clinical. The voice comes from everywhere and
        nowhere — or rather, it comes from the silences between your
        own words. It describes your qualities the way a gemcutter
        describes a stone: what can be separated, what can be kept,
        what is waste. It is never angry. It is never hurried. It has
        all the time in the world, and it is very, very thorough.
      trap_aesthetic: >-
        Precision instruments — blades that descend on calibrated tracks,
        floors that tilt at exact angles, rooms that seal with
        machined edges. Nothing crude, nothing wasteful. Each trap
        separates something specific: a room that strips color from
        clothing, a corridor that muffles footsteps to nothing, a
        chamber that makes torchfire burn cold. The deeper traps
        separate abstracts — courage, memory, the sense of direction.
      topology_tendency: >-
        Linear processing flow — rooms arranged in functional sequence
        like stations on a workshop floor. Input, preparation,
        separation, sorting, storage. Multiple entry points converge
        on the central processing rooms. The architecture of a
        well-organized manufactory, not a maze.
    adjacent:
      - sunden_hamlet
    landmarks:
      - name: "Ashgate Square"
        type: settlement
        description: >-
          The approach hamlet on the ridge above the Vault. Limestone
          cottages, the Spillway tavern, Durn's Provisions, the
          Assayer Hall. Quiet by design; the Quiet Field below the
          town eats sound on the way to the threshold.
      - name: "The Threshold Stone"
        type: dungeon_entrance
        description: >-
          A flat slab of limestone at the bottom of the Quiet Field.
          Delvers mark their entry time with chalk on its face. The
          stone is cool to the touch even in summer.
      - name: "The Sorting Floor"
        type: dungeon_chamber
        description: >-
          The vault's first deep room — perfectly white, perfectly
          lit, perfectly silent. The Patient Butcher does not appear
          here, but his attention does.
    settlements:
      - Ashgate
    rivers: []

  horden_warren:
    name: Horden Warren
    summary: Greed — counting passages and ledger rooms under Copperbridge. The Hoarder counts and re-counts.
    description: >-
      The Warren entrance is a wooden trapdoor at the back of a
      counting house in Copperbridge, the second approach hamlet.
      The trapdoor has no lock; it does not need one. Below: a
      branching maze of ledger-rooms, weighing chambers, and tally
      passages where the Hoarder's offended counting echoes through
      every wall. Greed survives here longer than pride does in
      Grimvault — but Greed gets sorted, weighed, and recorded
      while it survives.
    terrain: dungeon
    sin: greed
    tagline: "Nothing leaves."
    cover_poi: the_approach_and_the_quiet_field
    axis_snapshot:
      comedy: 0.35
      gravity: 0.75
      outlook: 0.45
    keeper:
      name: "The Hoarder"
      personality: proprietary
      obsession: retention
      tone_override:
        comedy: 0.3
        gravity: 0.8
      awareness:
        starting: 0
        tick_rate: 1
        stealth_decay: -1
        thresholds:
          "3": "A stack you passed has been rearranged. Everything is one item closer to the edge."
          "6": "A doorway you came through is now half-blocked by a pile that was not there before. You could still squeeze past. For now."
          "10": "A whisper begins — just at the edge of hearing. It is counting. Your torches. Your rations. Your coins. Your teeth."
          "15": "The goat paths have shifted. Your map is wrong. The stacks have moved to seal the route you planned to take out."
          "20": "Every exit is walled shut with treasure. The whispering has stopped. It has finished counting. You are on the list."
      monologue_style: >-
        Offended. Not angry — offended. The voice of an accountant who
        found a discrepancy in a ledger that has been balanced for three
        hundred years. It speaks in inventory. It describes your
        possessions with more affection than you have ever felt for them.
        It knows what you are carrying. It knew before you picked it up.
        It is disappointed that you touched it. Not because it was
        forbidden. Because now the count is wrong.
      trap_aesthetic: >-
        Weight-based. Doors that only open when you are lighter than when
        you entered the room. Corridors that narrow as your encumbrance
        increases — the walls are stacked treasure, and they close in
        when the Hoarder decides you are carrying too much. Floors built
        from layered coins that give way under heavy loads, dropping the
        overburdened into lower chambers. Locks that require a deposit —
        put something in to get something out, and what you put in never
        comes back.
      topology_tendency: >-
        Concentric rings tightening inward. The outer chambers are wide
        and spacious, loosely piled with cheap junk — easy to navigate,
        easy to loot, easy to grow confident. The middle ring narrows.
        Goat paths between stacks that reach the ceiling. Single-file
        passages where your pack scrapes both walls. The inner sanctum
        is barely navigable — treasure so dense the architecture is
        built from it. Walls of stacked ingots. Floors of compacted
        coin. The Hoarder sits at the center and counts.
    adjacent:
      - sunden_hamlet
    landmarks:
      - name: "Copperbridge Square"
        type: settlement
        description: >-
          The approach hamlet for Horden. A narrow town built on
          accumulated trade. The Counting House sits where the
          square narrows; nobody has counted what's inside in three
          generations, and nobody has been allowed to.
      - name: "The Trapdoor"
        type: dungeon_entrance
        description: >-
          Wooden, splintered, unlocked. Past it: a downward stair,
          a single oil lamp on a hook, and the first weighing room.
          Once you've taken the stair, the lamp begins to gutter.
      - name: "The First Ledger Room"
        type: dungeon_chamber
        description: >-
          A small chamber lined floor-to-ceiling with bound books.
          A scale sits in the middle. Whatever you carry in, you
          must weigh; whatever you weigh, the Hoarder counts.
    settlements:
      - Copperbridge
    rivers: []

  mawdeep_gullet:
    name: Mawdeep Gullet
    summary: Gluttony — wet sloping passages and the slow throat under Gristwell. The Glutton Below eats and eats.
    description: >-
      Mawdeep is an open shaft on the riverbank below Gristwell,
      half-flooded most of the year and fully flooded after the
      autumn rains. The descent is wet, the air is rich, and the
      passages narrow as they go down. The Glutton Below does not
      hunt, does not stalk, does not appear; the Glutton Below
      simply eats — slowly, patiently, with a wet appetite that
      makes itself known as warmth in your face long before you
      hear or see it.
    terrain: dungeon
    sin: gluttony
    tagline: "It is always hungry."
    cover_poi: the_gullet
    axis_snapshot:
      comedy: 0.3
      gravity: 0.8
      outlook: 0.4
    keeper:
      name: "The Glutton Below"
      personality: ravenous
      obsession: consumption
      tone_override:
        comedy: 0.2
        gravity: 0.85
      awareness:
        starting: 0
        tick_rate: 1
        stealth_decay: -1
        thresholds:
          "3": "Stomach rumble — distant grinding vibration through the stone"
          "6": "Rations begin spoiling faster. Waterskins taste of bile."
          "10": "Walls sweat a warm, acrid fluid. Torches sputter in the damp."
          "15": "Rooms constrict. Corridors narrow. The dungeon is swallowing."
          "20": "Full digestion — resource ticks double, every room drains HP"
      monologue_style: >-
        Wet, guttural sounds that resolve into words. The voice comes from
        the walls, from the floor, from the pooling moisture on the ceiling.
        It speaks of appetite — not anger, not malice, just relentless,
        bottomless hunger. It describes what it has eaten. It describes what
        it will eat next.
      trap_aesthetic: >-
        Organic — rooms that contract, floors that soften underfoot, pits
        lined with stone teeth, corridors that narrow to nothing. Acid pools
        that were not there a moment ago. The smell of digestion.
      topology_tendency: >-
        Funnel-shaped — wide and inviting at the entrance, narrowing as you
        descend. One-way drops into deeper chambers. Rooms that close behind
        you. The architecture of a gullet.
    adjacent:
      - sunden_hamlet
    landmarks:
      - name: "Gristwell Quay"
        type: settlement
        description: >-
          The approach hamlet for Mawdeep, built on the riverbank
          where the water meets the shaft. Fishermen and farmers;
          everyone over forty has lost someone to the deep. The
          Quay has a single tavern and three priests of three
          different faiths.
      - name: "The Maw"
        type: dungeon_entrance
        description: >-
          A river-mouth in stone, the throat sloping down into wet
          dark. Most delvers descend by rope. The walls are warm
          even in winter.
      - name: "The Slow Throat"
        type: dungeon_chamber
        description: >-
          The first deep chamber. Wet limestone, knee-deep water,
          the slow drip of something organic from the ceiling.
          Sound carries here, but only downward.
    settlements:
      - Gristwell
    rivers:
      - Mawriver

# ============================================================
# Per-descent approach-cartography — NOT YET WIRED
# ============================================================
#
# Preserved authorial intent for each descent's surface topology
# (approach hamlet → merchant row → dungeon mouth). The world-tier
# cartography above runs in `region` navigation_mode and treats each
# descent as a single region. CartographyConfig has extra='ignore',
# so this `approach_regions:` key is silently dropped by the loader.
#
# When ready to activate room-graph navigation:
#   1. Set navigation_mode: room_graph above
#   2. Lift these sub-regions into the top-level `regions:` map (with
#      adjacency wired through the parent dungeon region)
#   3. Confirm rooms.yaml ids cross-reference correctly
#
# Folded 2026-05-10 from dungeons/{grimvault,horden,mawdeep}/cartography.yaml.

approach_regions:

  grimvault_descent:
    world_name: Grimvault
    starting_region: ashgate_square
    navigation_mode: room_graph
    regions:
      ashgate_square:
        name: Ashgate Square
        summary: Ridge-top town center with provisioner, tavern, and assayer hall
        description: A clean, quiet square paved with pale limestone. The buildings are
          well-maintained but muted — paint fades faster here than it should. The provisioner's
          shop has a new sign every season. The Assayer Hall dominates the north side,
          its doors always open. A fountain in the center runs clear water that tastes
          of nothing at all.
        terrain: settlement
        adjacent:
        - ledger_row
        - grimvault_approach
        landmarks:
        - name: Durn's Provisions
          type: shop
          description: 'Torches, rope, rations, chalk, and lead-lined equipment for vault
            work. A sign in the window reads: Standard torches burn 4 hours. Lead-lined
            burn 6. Both prices displayed without commentary.'
        - name: The Spillway
          type: tavern
          description: Built over a natural spring that emerges from the ridge. The water
            runs through a channel in the floor. The ale is brewed on-site and is the
            only thing in Ashgate that still tastes like itself — the brewer adds extra
            hops to compensate for proximity to the vault. Durmach's Chair sits in the
            corner. Nobody uses it.
        - name: Assayer Hall
          type: guild_hall
          description: Maps cover every wall. Separation logs fill shelves from floor
            to ceiling. A large slate board lists current vault conditions — rooms recently
            entered, qualities recently taken, estimated Keeper awareness levels. Updated
            daily by returning parties.
        settlements: []
        rivers: []
      ledger_row:
        name: Ledger Row
        summary: Merchant quarter with specialty traders in separated materials
        description: A narrow street behind the square where the Ledger conducts its trade.
          Three shops and a counting house. The goods on display are strange — bolts of
          cloth in no color, metal ingots that weigh nothing, bottles of extracted silence
          sold as sleeping aids.
        terrain: settlement
        adjacent:
        - ashgate_square
        landmarks:
        - name: Agna's Scale
          type: shop
          description: The Ledger master's assessment office. A vault-standard scale sits
            on the counter — brass pans balanced with weights that measure properties
            beyond mass. Agna Ironjaw sits behind it, abacus clicking.
        - name: The Quiet Trader
          type: shop
          description: Specialty goods for downriver buyers. Colorless mourning cloth,
            soundless wind chimes, weightless ballast stones. Each item tagged with provenance
            — which room it came from, which quality was removed, and on which delve.
        settlements: []
        rivers: []
      grimvault_approach:
        name: The Approach
        summary: Path across the Quiet Field to the vault's rectangular entrance
        description: A stone path leading from the edge of town across the Quiet Field
          to the vault entrance. The field is two hundred paces wide. By the time you
          reach the middle, your footsteps make no sound. By the time you reach the entrance,
          your torch burns a shade paler than it should. The entrance itself is a rectangle
          — ten feet wide, eight feet tall, cut into the ridge face with edges sharp enough
          to cast a shadow. No chisel marks. No tool marks of any kind.
        terrain: dungeon_entrance
        adjacent:
        - ashgate_square
        landmarks:
        - name: The Threshold Stone
          type: entrance
          description: A flat stone set into the ground at the vault's entrance. Delvers
            check their gear here. The stone is always cool to the touch regardless of
            weather. Falk Stonehelm carved measurement marks into its edge for calibrating
            equipment before descent.
        - name: The Recovery Bench
          type: shrine
          description: A wooden bench thirty paces from the entrance where Wren Peatford
            meets returning delvers. She checks their senses before they walk back to
            town — counts fingers, names colors, asks them to hum a tune. Some cannot.
        settlements: []
        rivers: []
    routes:
    - name: Ledger Row
      description: Behind the square, down three steps to the merchant quarter
      from_id: ashgate_square
      to_id: ledger_row
      distance: short
      danger: none
    - name: Ledger Row Return
      description: Back up to the square from the counting houses
      from_id: ledger_row
      to_id: ashgate_square
      distance: short
      danger: none
    - name: The Quiet Path
      description: Across the Quiet Field — sound fades with every step
      from_id: ashgate_square
      to_id: grimvault_approach
      distance: medium
      danger: none
    - name: The Quiet Path Return
      description: Back across the field — sound returns gradually, never quite all the
        way
      from_id: grimvault_approach
      to_id: ashgate_square
      distance: medium
      danger: none

  horden_warren:
    world_name: Horden
    starting_region: copperbridge_square
    navigation_mode: room_graph
    regions:
      copperbridge_square:
        name: Copperbridge Square
        summary: Valley crossroads town built on dungeon spillage
        description: A square paved with mismatched stone — half limestone, half repurposed
          flagstones scavenged from the Spillfield. The buildings lean inward, built from
          salvaged materials and looking slightly too rich for a town this size. Copper-green
          stains run down every gutter from the creek water. The air smells of old metal.
          A stone bridge spans the creek at the square's south edge — the original bridge,
          green with mineral deposits, that gave the town its name.
        terrain: settlement
        adjacent:
        - spiller_row
        - copperbridge_approach
        landmarks:
        - name: The Clinker
          type: tavern
          description: Named for the sound coins make when dropped on stone. The bar top
            is hammered copper, the stools are repurposed treasure chests, and the ale
            is served in dented silver goblets because the town has more goblets than
            clay mugs. Kreveld's Chair sits in the corner — reinforced, stained green,
            never used. The brewer pays in spillage.
        - name: Kern's Post
          type: shop
          description: 'The Spillers'' headquarters and general provisioner. Kern Saltwall
            runs it from behind a counter made of stacked ingots. Torches, rope, sacks,
            and one critical item: the Spiller''s Scale, which weighs your pack before
            and after a delve. The difference is your profit. Or your death.'
        - name: The Assay House
          type: guild_hall
          description: Where Sigri Forger evaluates what comes out of Horden. A stone
            building with iron shutters and a reinforced door. Inside, every surface is
            covered with scales, loupes, and reference samples. Sigri sets the buy price
            for everything. Her rates are fair. Her assessments are final.
        settlements: []
        rivers: []
      spiller_row:
        name: Spiller Row
        summary: Salvage market where spillage is sorted, priced, and sold
        description: A narrow street behind the square where the day's spillage is laid
          out on blankets and tables. Everything here came from the Spillfield this morning
          — coins, buckles, ring fragments, unidentifiable metal objects. The Spillers
          sort by material and the buyers sort by value. Prices fluctuate with the tide
          of the hoard's overflow.
        terrain: settlement
        adjacent:
        - copperbridge_square
        landmarks:
        - name: Noll's Shrine
          type: shrine
          description: Not a real shrine — a counting table where Noll Thatcher sits tallying
            the day's spillage in his ledger. He counts everything twice and mutters corrections
            to himself. The Counters call this their chapel. Everyone else calls it Noll's
            problem.
        - name: The Sorting Blankets
          type: market
          description: 'Oilcloth blankets laid on the cobbles, each belonging to a specific
            Spiller. Spillage is sorted by type: coins, jewelry, metal scrap, oddments.
            Buyers browse at dawn. By noon, everything worth having is gone. By evening,
            the blankets are rolled up and stored. Tomorrow there will be more.'
        settlements: []
        rivers: []
      copperbridge_approach:
        name: The Approach
        summary: The Mule Track from town to the dungeon mouth
        description: A worn track rising from the bridge to the ridge face. The ruts are
          deep — deeper than foot traffic explains. Copper filings fill the grooves and
          catch the light at sunset, making the path glow green-gold. The Spillfield slopes
          below the track, always glinting. The Twelve Posts stand at the dungeon entrance
          — ancient, uncarved, driven deep. The entrance itself is a ragged tear in the
          stone, wider than it is tall, as though the ridge tried to yawn.
        terrain: dungeon_entrance
        adjacent:
        - copperbridge_square
        landmarks:
        - name: The Twelve Posts
          type: entrance
          description: Stone hitching posts at the dungeon mouth. Older than the town,
            older than the track. No carvings, no marks. Flowers do not grow near them.
            Delvers tie their mules here and joke about it. Nobody laughs very hard.
        - name: The Spillfield
          type: landmark
          description: A slope of loose earth and treasure below the dungeon entrance.
            Every morning, new objects appear — coins, fragments, the occasional intact
            piece. The Spillers pick it clean by noon. By morning, there is more. The
            hoard overflows like a river in flood, constantly.
        settlements: []
        rivers: []
    routes:
    - name: Spiller Row
      description: Behind the square, through an alley of salvage stalls
      from_id: copperbridge_square
      to_id: spiller_row
      distance: short
      danger: none
    - name: Spiller Row Return
      description: Back to the square past the sorting blankets
      from_id: spiller_row
      to_id: copperbridge_square
      distance: short
      danger: none
    - name: The Mule Track
      description: Up the ridge to the dungeon mouth — copper filings crunch underfoot
      from_id: copperbridge_square
      to_id: copperbridge_approach
      distance: medium
      danger: none
    - name: The Mule Track Return
      description: Back down to the bridge — your pack heavier than when you left, or
        lighter
      from_id: copperbridge_approach
      to_id: copperbridge_square
      distance: medium
      danger: none

  mawdeep_gullet:
    world_name: Mawdeep
    starting_region: gristwell_square
    navigation_mode: room_graph
    regions:
      gristwell_square:
        name: Gristwell Square
        summary: Muddy town center with provisioner, tavern, and hireling post
        description: A muddy clearing surrounded by low timber buildings. The well at
          the center draws water from an underground spring that runs too warm for comfort.
          The provisioner's shop faces the tavern across thirty feet of churned mud. A
          wooden signpost lists dungeon-related services and nothing else.
        terrain: settlement
        adjacent:
        - bonecounter_alley
        - mawdeep_mouth
        landmarks:
        - name: Petra's Provisions
          type: shop
          description: 'A narrow shop with barred windows. Inside: torches stacked like
            cordwood, rope coiled on pegs, rations in waxed paper. A tally wall behind
            the counter. Most marks are not crossed out.'
        - name: The Tally Tavern
          type: tavern
          description: Low ceiling, smoke-darkened beams, a bar made from a single slab
            of dungeon stone. Old Morden holds court in the corner booth, nursing a mug
            and a grudge against the dark. Hirelings gather at the far end, sizing up
            potential employers.
        - name: The Hireling Post
          type: notice_board
          description: A board nailed to the tavern's exterior wall. Names and rates chalked
            in a column. Torchbearers are cheap. Sellswords are not. Porters are in between.
            All rates are per delve, paid up front.
        settlements: []
        rivers: []
      bonecounter_alley:
        name: Bonecounter Alley
        summary: Back-alley fence operation behind the tanner's shop
        description: Behind the tanner's shop, down stone steps that smell of lye. Kel
          Bonecounter operates from a cellar room. The door is always closed. Knock twice,
          wait, knock once more.
        terrain: settlement
        adjacent:
        - gristwell_square
        landmarks:
        - name: Kel's Table
          type: shop
          description: A table with scales made from a dungeon creature's jaw. A ledger
            in bone-tally cipher. A pouch of teeth for counting. Kel sweats regardless
            of temperature.
        settlements: []
        rivers: []
      mawdeep_mouth:
        name: The Mouth of Mawdeep
        summary: Sixty-foot-wide dungeon entrance breathing cold air from below
        description: A quarter mile east of town, where the hillside splits open. Sixty
          feet across. Stone lips worn smooth. Cold air breathes outward in a rhythm that
          is not wind. Chalk marks from previous parties cluster near the entrance. The
          ground around the mouth is bare — nothing grows within fifty feet of the opening.
        terrain: dungeon_entrance
        adjacent:
        - gristwell_square
        landmarks:
        - name: The Threshold
          type: entrance
          description: 'The last place where daylight reaches. Chalk tallies on the wall:
            torch counts, party sizes, dates. Some are years old. A stone bench where
            delvers sit and check their gear one last time.'
        - name: The Offering Cairn
          type: shrine
          description: A pile of stones at the mouth's edge where locals leave small offerings
            — a copper coin, a crust of bread, a finger bone. Not worship. Appeasement.
            Nobody admits to adding to it.
