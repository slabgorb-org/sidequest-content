# Hamlet of Sünden — Regional Legends
# Stories told at the Square, the chapel, the tavern, and the
# Wallwrights' yard. Per-dungeon legends live in the dungeon
# directories. These are the legends that belong to the hamlet
# itself — to the meeting place of the three.

- name: "The Three Wakings"
  summary: >-
    Within a single human generation, three of the Seven woke under
    this country. Nobody alive saw all three open. The order is
    disputed, the dates approximate, and the kinship between them is
    a thing the chapel will gesture at and refuse to commit.
  era: "Three generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The story Sünden's preacher tells, and immediately apologises for
    telling, runs like this: the north ridge cracked first, in a
    spring with no rain, and the miners at Ashgate came up changed.
    The eastern cave mouth opened second, in a winter with no snow,
    and a merchant caravan went in and never returned. The hillside
    above Edgeholm broke last, in a spring after a wet autumn, and
    the village went down whole. Three wakings, three different
    weathers, and one human generation between the first and the
    last. The preacher will tell you the three are kin. He will tell
    you they are not. He will tell you nobody knows. All three are
    his sermon, depending on the week.
  faction_grudges: []
  lost_arts:
    - >-
      The pre-waking maps of the country — the ridge surveys, the
      land grants, the mineral charts. Most were lost in the first
      decade, either burned by households leaving or buried with
      the people who held them. The chapel keeps two surviving
      fragments under lock. They show towns that are not there
      anymore.
  monuments:
    - >-
      The Three Sightlines — three cleared lanes from the upper
      terrace of Sünden, each cut to keep one dungeon mouth
      visible from the same vantage. The Wallwrights maintain the
      lanes. They believe the sin you cannot see is the sin you
      forget.
  terrain_scars: []

- name: "The Founding of Sünden"
  summary:  >-
    The hamlet was founded as a coroner's station — neutral ground
    halfway between the three towns, where the dead from any of the
    three mouths could be laid out, named, and sent home. The Wall
    came before the houses.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    By the second decade after the wakings, the three towns had a
    shared problem nobody wanted in their own square: the bodies.
    Ashgate would not lay out delvers Copperbridge had sent.
    Copperbridge would not pay carting fees on Gristwell's losses.
    Gristwell did not have a chapel large enough to hold the
    accumulating dead of any season. A coroner from each of the
    three towns met at the saddle ground at the regional center, in
    autumn, and agreed on a single neutral hamlet. The Wall went
    up first — slate from a quarry that no longer exists, set on
    a course of north-ridge limestone — and the houses came after,
    around the Wall, facing it. The first family to settle Sünden
    were the descendants of the original Ashgate coroner. They are
    the Wallwrights now. They have not left.
  faction_grudges: []
  lost_arts:
    - >-
      The original coroner's notation — the marks the three town
      coroners agreed on for cause-of-return, distinct from
      cause-of-death. Some marks survive on the oldest course of
      the Wall. Most have been recut as plain names in later
      generations. The Wallwrights will not say which marks are
      original and which are restoration.
  monuments:
    - >-
      The Coroner's Stone — a flat, weathered slab set into the
      pavement of the Square between the chapel and the Wall.
      The first body was laid out on it, before there were
      benches inside. People walk around it without comment.
  terrain_scars: []

- name: "The Wall Begins"
  summary: >-
    The first name carved into the Wall was a delver who came back
    twice — once dead and once not. The Wallwrights chose to carve
    her once, and the rule of the Wall began.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The story is that the first delver carved into the Wall was a
    woman named Ima Tarn, who went into Grimvault with a small
    party, did not come out, and was reported dead. Her name was
    carved into the slate by the elder Wallwright on a still
    autumn morning. Three days later she walked out of the
    northern road, hollowed by the vault, missing the warmth of
    her own hands. The Wallwrights met that night and decided.
    They would not erase the carving — the Wall did not erase. They
    would not carve her again — the Wall did not double. They cut
    a single line under her name to mark a return that came after
    the carving, and the rule of the Wall has been that line ever
    since: one carving per delver, one underline per return-after,
    no exceptions for kinship or coin. Ima Tarn lived another seven
    years on the Recovery Bench at the Workhouse's side door, and
    her line on the Wall was the first of many.
  faction_grudges:
    - from: The Wallwrights
      to: outsiders who request second carvings
      reason: >-
        The rule is one carving per delver. Wealthy households from
        Ashgate or Copperbridge sometimes try to commission second
        carvings — a finer slab, a deeper cut, a separate stone for
        a beloved son. The Wallwrights refuse. The refusals have
        cost them patrons. They have not relented.
  lost_arts: []
  monuments:
    - >-
      Ima Tarn's Line — the first underlined carving on the Wall,
      faintly worn now but still legible in the right light. The
      Wallwrights point it out to apprentices on their first day
      and to no one else.
  terrain_scars: []

- name: "The Four Absent"
  summary: >-
    Three of the Seven woke here. The other four are stories told
    elsewhere — Wrath in a barrow east, Sloth under the southern
    fen, Lust whispered after dark, Envy in every haunted well west
    of here. None confirmed. All carried by travelers who pass
    through Sünden and read the Wall.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Travelers bring the stories in and the Wall keeps them out.
    The four blank columns on the Wall — kept blank by custom
    since the original carving — are the visible argument that the
    other four sins are stories, not local facts. Wrath, the
    travelers say, sleeps east of the river in a barrow that bleeds
    when storms come over the headland; the people of the salt
    coast bring fragments of this story but no proof. Sloth, the
    fen-people say, lies under the green water of the southern
    marsh, and they will tell you that anyone who wades in too long
    forgets why they came. Lust is the story Sünden's preacher
    will speak only after dark, only once a season, and only with
    the chapel doors closed; nobody under thirty has heard the
    full version. Envy is the most-told and the least-trusted —
    every village west of here has a haunted well or a cursed
    pond they call the eye of Envy looking up. The Wallwrights
    keep the columns blank. They will tell you, if you ask, that
    keeping a column blank is not the same as believing it will
    always be blank.
  faction_grudges: []
  lost_arts: []
  monuments:
    - >-
      The Four Blank Columns — the eastern half of the Wall,
      maintained smooth and uncarved by the Wallwrights as a
      matter of standing custom. Pilgrims occasionally try to
      leave marks. The Wallwrights polish the slate clean by
      morning.
  terrain_scars: []

- name: "The First Hireling Who Came Back Wrong"
  summary: >-
    A torchbearer named Ollet went down into one of the three
    mouths — accounts disagree on which — and came back with
    something the Wall did not yet have a column for. The
    Recovery Bench was built for him.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Every tavern in the three approach hamlets tells the Ollet
    story differently. In Ashgate's Spillway he went into Grimvault
    and came back without the warmth of his own breath; in
    Copperbridge's Clinker he went into Horden and came back
    counting under his breath, never aloud, never out loud at all;
    in Gristwell's Sinkhole he went into Mawdeep and came back
    convinced that food was a kind of betrayal. The actual Ollet,
    if he existed at all, lived on the Recovery Bench at Sünden
    for an unknown number of years and was the first delver the
    Confraternity treated with all three rites in sequence —
    Confessional, Workhouse, Masquerade — without success. He is
    cited at the Recruiter's Post as the cautionary case: a
    hireling can come back changed in ways the rites do not lift,
    and the vetters owe it to the next contract to know what the
    last one came back as. The Wall has no carving for Ollet. He
    did not die in a way the Wall could record, and he did not
    return in a way that warranted an underline. The Wallwrights
    will not speak about him. The Recovery Bench was, by
    consensus, built in his memory.
  faction_grudges:
    - from: The Wallwrights
      to: tavern-tellers of the Ollet story
      reason: >-
        The Wallwrights consider the three contradictory tavern
        versions of Ollet's story to be evidence that the story is
        not load-bearing. They are tired of being asked to settle
        the contradiction by reference to their records, which do
        not include Ollet by name and which they will not show.
  lost_arts: []
  monuments:
    - >-
      The Recovery Bench — the long pine bench at the Workhouse's
      south side door, polished smooth by generations of returned
      delvers. It is, by tradition, never moved and never
      replaced. When a board wears through, it is patched.
  terrain_scars: []

# ===========================================================
# Ashgate / grimvault_descent — Pride legends
# (folded from dungeons/grimvault/legends.yaml 2026-05-10)
# ===========================================================

- name: "The Separation of Ashgate"
  summary: >-
    A prosperous mining town lost its prosperity overnight when the
    ridge cracked open and Grimvault exhaled for the first time.
  era: "Three generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The miners who first broke into the vault's upper chambers reported
    that their tools lost their edge — not dulled, but unmade. The steel
    simply forgot how to be hard. Within a season, the mine was abandoned.
    Within a year, the town had remade itself around the delving trade.
    The old miners' families are the merchant class now. They remember
    what the town used to be. They do not talk about it.
  faction_grudges:
    - from: The Assayers
      to: The Ledger
      reason: >-
        The Assayers blame the Ledger's moneylenders for funding the
        deep-mining expedition that cracked the ridge. The Ledger
        insists the vault was inevitable — it was growing toward
        the surface already.
  lost_arts:
    - >-
      The Ashgate ore-tempering technique — a method of hardening iron
      that relied on a specific mineral vein now inside Grimvault.
      No smith in three generations has replicated it.
    - >-
      Quiet listening — the old miners could hear the stone. They
      knew where to dig by sound alone. Nobody can hear the stone
      anymore. Grimvault ate the sound.
  monuments:
    - >-
      The Cracked Ridgeline — visible from Ashgate, a geological scar
      where the surface split open. Grass does not grow along the crack.
  terrain_scars:
    - name: "The Ridge Crack"
      description: >-
        A fissure running two hundred yards along the ridgetop above
        Ashgate. The stone on either side is pale — bleached by
        proximity to the vault. Moss refuses the surface.
      region: "ashgate_ridge"
      type: "fissure"
    - name: "The Quiet Field"
      description: >-
        A meadow between town and the dungeon entrance where sound
        does not carry properly. Shout from one side, and the person
        ten paces away hears a whisper. Birds avoid it.
      region: "ashgate_ridge"
      type: "dead_zone"

- name: "Durmach's Descent"
  summary: >-
    The first delver to reach the second level. She returned speaking
    in colors and seeing in sounds. She had been separated.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Durmach Copperbridge was the strongest delver Ashgate had produced.
    She went deeper than anyone before her and came back wrong. Not
    injured — rearranged. She could taste the color blue and hear the
    weight of objects. Her senses had been taken apart and put back in
    the wrong order. She lived another twenty years, selling maps of
    Level 1 from a chair in the tavern. She drew them from memory,
    which was the only thing the Butcher had left intact.
  faction_grudges: []
  lost_arts:
    - >-
      Durmach's deep route — she claimed to have found a passage
      that bypassed the central processing chambers entirely. She
      could not describe its location because the words had been
      taken from her. She drew maps but the maps contradicted
      themselves.
  monuments:
    - >-
      Durmach's Chair — still in The Spillway tavern. Nobody sits in it.
  terrain_scars: []

# ===========================================================
# Copperbridge / horden_warren — Greed legends
# (folded from dungeons/horden/legends.yaml 2026-05-10)
# ===========================================================

- name: "The First Counting"
  summary: >-
    Before Copperbridge existed, before the ridge had a name, a
    merchant died in a cave with everything he owned. He did not
    stop counting.
  era: "Before memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The oldest miners in the ridge country tell a story about a
    merchant who fled a war with his fortune loaded on twelve mules.
    He found a cave in the ridge and hid inside with every coin,
    every bolt of silk, every ingot. The war ended. He did not come
    out. The mules died at the entrance. The merchant kept counting.
    He counted until the counting became the cave and the cave became
    the counting. By the time anyone thought to look for him, the
    cave had rooms. By the time anyone entered, the rooms had doors
    that locked behind them. The merchant was gone. The counting
    remained.
  faction_grudges:
    - from: The Spillers
      to: The Counters
      reason: >-
        The Spillers say the merchant was a fool and his treasure is
        fair salvage. The Counters say he achieved something sacred —
        a count so perfect it became alive. Taking from the hoard
        desecrates the count.
  lost_arts:
    - >-
      The merchant's trade cipher — a notation system for tracking
      inventory that nobody alive can read. Fragments appear on
      walls deep in the dungeon. The Counters have partially
      decoded it but disagree on what the numbers mean.
    - >-
      Mule-packing — the art of loading twelve mules with a
      fortune and moving fast. Copperbridge teamsters are good
      but nobody can match the loads the legend describes.
  monuments:
    - >-
      The Twelve Posts — stone hitching posts at the dungeon mouth
      where the merchant's mules supposedly died. The posts are
      older than the town. Flowers do not grow near them.
  terrain_scars:
    - name: "The Mule Track"
      description: >-
        A worn path from the ridge road to the dungeon entrance.
        Deeper than any foot traffic would explain — as if twelve
        loaded mules walked it a thousand times in a single night.
        The ruts are filled with tarnished copper filings.
      region: "copperbridge_approach"
      type: "path"
    - name: "The Spillfield"
      description: >-
        A slope below the dungeon mouth where objects appear
        overnight. Coins, broken jewelry, scraps of rotted fabric.
        The hoard overflows when the Hoarder reorganizes. Copperbridge
        exists because of the Spillfield.
      region: "copperbridge_approach"
      type: "debris_field"

- name: "Kreveld's Expedition"
  summary: >-
    The first organized delve into Horden. Twelve went in with empty
    packs. One came out with full ones. He could not put them down.
  era: "Two generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Kreveld the Gilded was the first delver to map the outer ring. He
    brought eleven hirelings, each carrying an empty sack. The plan
    was systematic extraction — fill the sacks, walk out, sell, repeat.
    They made it to the middle ring before the goat paths closed behind
    them. Eleven died in the collapse of a coin stack that buried them
    in gold they could not lift. Kreveld walked out alone, carrying
    four full packs. He could not set them down. His hands would not
    open. He wore the packs until he died — sleeping in them, eating
    around them, shuffling through town bent double under the weight.
    He was the richest man in Copperbridge and could not spend a coin.
  faction_grudges: []
  lost_arts:
    - >-
      Kreveld's route maps — drawn from memory by a man who could
      not put down his pen without dropping a pack. The maps are
      accurate but the handwriting is illegible. Sigri Forger has
      the originals and charges to let people look at them.
  monuments:
    - >-
      Kreveld's Chair — a reinforced bench in The Clinker tavern,
      built to support a man and four full packs. Nobody sits in
      it. The wood is stained with copper residue.
  terrain_scars: []

- name: "The Night the Hoard Breathed"
  summary: >-
    One winter the dungeon exhaled. Treasure poured from the entrance
    for three hours. Then it inhaled. Most of the treasure went back.
    So did two houses.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Copperbridge residents closest to the dungeon mouth woke to the
    sound of metal sliding on stone. The hoard was spilling out — a
    river of coins, jewelry, weapons, and unidentifiable objects
    flowing down the Mule Track into the Spillfield. People filled
    buckets, carts, cellars. Three hours later, the flow reversed.
    Everything moved back toward the entrance. Two houses closest to
    the track were pulled from their foundations and dragged into
    the dungeon mouth. The families survived because they were in the
    square filling buckets. Their homes are in the outer ring now,
    flattened and stacked. The Hoarder kept the houses.
  faction_grudges:
    - from: The Spillers
      to: The Hoard Itself
      reason: >-
        The Spillers lost two storage sheds in the inhalation.
        Everything they had stockpiled from years of scavenging
        went back into the dungeon. They do not store near the
        track anymore.
  lost_arts: []
  monuments:
    - >-
      The Foundation Stones — two sets of foundation stones in
      Copperbridge where houses used to stand. Now empty lots.
      Nobody builds on them. The ground still shifts toward the
      dungeon on quiet nights.
  terrain_scars:
    - name: "The Drag Marks"
      description: >-
        Gouges in the stone of the Mule Track where two houses
        were pulled toward the dungeon. The marks are deep enough
        to collect rainwater. Copper-green stains line the grooves.
      region: "copperbridge_approach"
      type: "gouge"

# ===========================================================
# Gristwell / mawdeep_gullet — Gluttony legends
# (folded from dungeons/mawdeep/legends.yaml 2026-05-10)
# ===========================================================

- name: The First Swallowing
  summary: >-
    Three generations ago, the village of Edgeholm stood where the mouth
    is now. One spring morning the ground opened and took it — every
    building, every soul, every cow and cart. The survivors founded
    Gristwell further from the edge and learned never to build on soft
    ground. The mouth has been growing since. Slowly, but growing.
  era: "Three generations ago"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Gristwell is built on the bones of Edgeholm's loss. Nobody builds
    permanent structures. Nobody trusts the ground.

- name: Why It Wakes
  summary: >-
    Old Morden at the tavern says the Glutton sleeps between meals.
    When no one enters, the dungeon is quiet — still hungry, but
    dormant. The moment boots touch the first step, it stirs. That
    is why the first rooms are always easy. The Glutton is tasting you.
  era: "Living memory"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Delvers time their descents for dawn, hoping the Glutton is
    at its most sluggish after a night without visitors.

- name: The Full Belly
  summary: >-
    They say there is a chamber deep below where the Glutton keeps
    everything it has eaten — Edgeholm's gold, the caravan goods,
    the belongings of every delver who never returned. A full belly,
    vast and warm and impossible to reach without being digested
    yourself. No one has seen it. No one has come back from that deep.
  era: "Unknown"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    The Full Belly is Gristwell's legend of El Dorado — the dream
    that keeps delvers descending despite the odds.

- name: The Teeth Doors
  summary: >-
    Some doors in Mawdeep have stone teeth along the frame. The
    rumormonger says they bite down when the Glutton is angry —
    when awareness is high. Walk through them fast, he says. Do
    not stop in the doorway. He is missing three fingers on his
    left hand, which he says is proof.
  era: "Recent"
  affected_cultures:
    - Surface Folk
  cultural_impact: >-
    Delvers learn to move quickly through doors. The three-fingered
    salute has become Gristwell's version of a warning gesture.
