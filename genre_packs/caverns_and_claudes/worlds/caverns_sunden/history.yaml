# Hamlet of Sünden — Campaign Progression
# Maturity tracking for the consolidated three-dungeon hub.
# Chapters do NOT track per-dungeon depth — they track the
# campaign's relationship to the three sins as a whole.

chapters:
  # NOTE: chapter id MUST be one of {fresh, early, mid, veteran} for
  # CampaignMaturity.from_chapter_id() to map it to a tier. Other ids
  # are skipped by world_materialization. The remaining chapters
  # below (first_blood, wounded_*) currently use non-canonical ids
  # and are authoring stubs awaiting canonicalization.
  - id: fresh
    label: "Arrival in Sünden"
    session_range: [1, 2]
    lore:
      - >-
        The party arrives at Sünden by one of the three roads. The
        coach driver does not come into the Square. He stops at the
        outer post, unloads, takes payment, turns the team around. The
        roads in are slower than the roads out for reasons the locals
        do not put into words.
      - >-
        All three sins are stories at this stage. The Wall in the
        Square is read but not yet relevant — names of strangers, in a
        hand the party does not know. The three mouths are visible
        from the upper terraces but unvisited. The Recruiter's Post
        has cards pinned to its board for delves the party does not
        yet know how to evaluate.
      - >-
        Sünden's services are introduced as curiosities. The
        Confessional, the Workhouse, the Masquerade — each pitched as
        a remedy for an injury the party has not yet sustained. The
        Confraternity's three keepers will explain politely, once. They
        will not explain twice. The party will need to remember.
    location: "Sünden Square"
    time_of_day: morning
    atmosphere: >-
      Quiet introduction. The hamlet is functional, occupied, and
      slightly too quiet for its size. Three mouths visible from the
      upper terraces. None of them dramatic. All of them present. The
      Wall is the first thing every newcomer reads, and the last thing
      they think about before sleep.
    points_of_interest:
      - name: Sünden Square
        slug: sunden_square
        region: sunden
        type: settlement
        description: >-
          The center of the hamlet. A flagged pavement of pale
          limestone (from the north ridge), copper-stained flagstones
          (from the east), and dark hill-stone (from the south)
          arranged in three radial wedges meeting at a central
          drainage. Three streets enter, three streets leave, and the
          Wall stands on the western edge with the morning sun behind
          it so the carved names read sharpest at first light.
        visual_prompt:
          solo: >-
            Wide establishing landscape of a small late-medieval European
            limestone hamlet square at first lamp-light. Foreground: a
            flagged pavement laid in three radial wedges of different
            stone — pale limestone, copper-stained flag, and dark
            hill-stone — meeting at a central round drainage with a
            low fountain at its lip. Middle ground: a standing slate
            Wall three courses high along the northern face of the
            square, the slate divided into seven columns, three of
            them marked with rows of carved names, the other four
            blank. Three narrow flagged streets exit the square — one
            north past the Wall, one east, one south. Low limestone
            and timber dwellings ring the square on all sides, oak
            shutters rubbed grey, pitched slate roofs with moss in the
            shaded courses. South-east corner: a single-room timber
            Recruiter's Post with its doors propped open, a hireling
            board on the wall. South-west corner: a low timber
            Lampwick tavern with one lamp burning over its lintel.
            Background: the upper terraces of the hamlet step away
            into mist, with three small dark notches barely visible
            on the far ridge — the dungeon mouths, off-center, never
            framed. A handful of figures in plain wool stand in the
            middle distance, one of them too still. Lighting from
            oil lamps spilling cream-white onto warm grey walls and
            from the first edge of dawn behind the Wall. Heavy
            crosshatch shadow under eaves and arches, fine line work
            on carved slate, B&W pen-and-ink discipline in the genre
            style of Erol Otus and David Trampier.
          backdrop: >-
            Limestone hamlet square at lamp-light, three radial
            wedges of mixed flagstone meeting at a low fountain, a
            carved slate Wall along the northern face, low pitched
            roofs ringing the square, three small dark notches on
            the far upper terraces, B&W pen-and-ink, heavy
            crosshatch shadow.
      - name: The Wall
        slug: the_wall
        region: sunden
        type: monument
        description: >-
          A standing stone monument three courses high and twenty
          paces along, faced on the eastern side with smooth slate.
          The slate is divided into seven columns. Three of them —
          Pride, Greed, Gluttony — are filling slowly with carved
          names, each cut deeper for a death than for a return. The
          other four columns are blank, kept blank by custom, ready
          for stories that have not yet come this way.
      - name: The Recruiter's Post
        slug: recruiters_post
        region: sunden
        type: shop
        description: >-
          A single-room timber building on the south side of the
          Square, doors propped open from dawn until the last delver
          is hired. Hireling cards on the board, contract slates on
          the wall, a long bench against the back where returning
          delvers wait to be vetted before being sent down again. The
          smell is of old sweat, lamp oil, and chalk.
      - name: The Approach to Ashgate
        slug: ashgate_road
        region: ashgate
        type: frontier
        description: >-
          The northern road climbs out of the Square in three long
          switchbacks, then runs the ridgeline for half a day to
          Ashgate's half-empty terraces. The roadside stones are
          paler than they should be in the last mile. Birds do not
          land. The town at the end of the road is thinner than the
          town the road was built for.

  - id: first_blood
    label: "First Names on the Wall"
    session_range: [3, 5]
    lore:
      - >-
        The first carving. Whether it is a death or a return-changed,
        the party now has a name they recognise on the Wall. The
        Wallwrights worked it in at dusk, and somebody — a friend, a
        hireling's widow, the recruiter — was there when the chisel
        finished. The Wall is no longer abstract.
      - >-
        One sin has been scratched. Not wounded, not yet — only
        scratched. The party has been into one of the three mouths
        and come back out with treasure, with losses, and with a
        first taste of what that particular sin does to a person.
        The other two are still stories, but they are stories told
        differently now, by people who have seen what kind of injury
        a sin leaves.
      - >-
        Sünden's services are no longer curiosities. The Confessional
        keeper has had at least one of the party in front of her. The
        Workhouse has had its bell rung at an odd hour. The Masquerade
        has fitted a mask to a face that did not want one. The
        Confraternity's politics begin to surface — each keeper has
        opinions about what the other two are doing wrong.
    location: "Sünden Square"
    time_of_day: dusk
    atmosphere: >-
      The hamlet has become specific. Faces have names; names have
      histories; histories have prices. The Wall reads as personal
      now. The party walks past it on the way to the tavern and looks
      at it on the way back, and the Wallwrights notice them looking.
    points_of_interest:
      - name: The Confessional
        slug: the_confessional
        region: sunden
        type: shrine
        description: >-
          A narrow stone chapel on the north side of the Square, two
          rows of low benches and a single carved screen between
          penitent and keeper. The keeper takes confessions of acquired
          treasure — what was taken, from where, at what cost. The
          rite is Generosity: the penitent surrenders a portion to the
          poor box and the count is broken. The Greed-stress lifts
          the way a held breath releases.
      - name: The Workhouse
        slug: the_workhouse
        region: sunden
        type: shrine
        description: >-
          A long timber hall on the east side of the Square, open at
          both ends, set with benches and looms and a cold hearth. The
          rite is Temperance: the penitent works for two days at
          plain labor, eats plain food, sleeps on a plank. The
          Gluttony-stress drains in the rhythm of the work. People
          who finish the rite come out walking lighter.
      - name: The Masquerade
        slug: the_masquerade
        region: sunden
        type: shrine
        description: >-
          A vaulted single-room hall on the south side of the Square,
          its walls hung with painted wooden masks, each one carved
          to a face that is not the wearer's. The rite is Humility:
          the penitent wears a mask through three public services and
          speaks as the masked face, not as themselves. The
          Pride-stress dissolves under the weight of being someone
          else for a while.
      - name: Copperbridge Approach
        slug: copperbridge_road
        region: copperbridge
        type: frontier
        description: >-
          The eastern road. It runs through pasture that should be
          green and is not, past culverts that run copper-colored
          water with no source upstream. The town at the end of the
          road has a half-empty square, a bridge that still stands,
          and a pair of tarnished old hitching posts that everyone
          walks around without commenting.

  - id: wounded_one
    label: "One Wounded"
    session_range: [6, 10]
    lore:
      - >-
        The first sin has been wounded. Not killed — wounded.
        Something in one of the three mouths has been hurt enough that
        its rhythm has changed. The Spillfield runs lighter, or the
        Quiet Field has stopped expanding, or Mawdeep's exhalations
        are off-schedule. The locals notice. The Wall reflects it: the
        column for that sin has carved returns where it used to have
        only carved deaths.
      - >-
        Drift profiles are now part of the conversation at the
        Recruiter's Post. The hireling vetters have files on returning
        delvers — what came back changed, in what direction, how
        useful the change is. Some delvers are now sent down only into
        the sin that matches their drift. Some are not sent down at
        all, and live on the Recovery Bench at the Workhouse's side
        door, eating temperance bread and waiting for something that
        is not coming.
      - >-
        The Confraternity has begun to argue. The Confessional keeper
        and the Workhouse master disagree on whether a delver who has
        been twice into Mawdeep should be allowed into Horden. The
        Masquerade host considers both of them fools. The party is
        invited to take sides, or to refuse, and either way the Wall
        will be carved with the consequence.
      - >-
        The four absent sins are spoken about more often. Travelers
        come through with stories — a barrow east that bled in last
        week's storm, a fen-light south that pulled three children in
        and gave back two. Sünden's preacher does not encourage these
        stories. He does not silence them either.
    location: "Sünden Square"
    atmosphere: >-
      Operational dread. The party has a rhythm now. They know which
      service to use after which delve. They know which keeper to
      avoid on which day. The Wall has names they put there. The
      hamlet has stopped being a stage and started being a home, and
      home is where the loss accumulates.
    points_of_interest:
      - name: The Recovery Bench
        slug: recovery_bench
        region: sunden
        type: shrine
        description: >-
          A long pine bench against the south wall of the Workhouse,
          run by Wren Peatford who came over from Ashgate two
          seasons ago. She works with delvers whose drift has gone
          beyond what the rites can lift. She does not promise to
          undo the change. She promises to teach them how to live
          inside it. Some of her clients leave after a month.
          Others have been on the bench so long it has worn to fit
          them.
      - name: The Wallwrights' Yard
        slug: wallwrights_yard
        region: sunden
        type: shop
        description: >-
          A walled stoneyard behind the Wall itself, where the
          carvers cut their letters into spare slate before
          committing them to the monument. Practice slates lean
          against every wall, some bearing the names of delvers
          whose returns were ambiguous and whose carving was
          deferred. The Wallwrights work at dusk. The chisels do
          not ring during the day.
      - name: The Hireling Bunkhouse
        slug: hireling_bunkhouse
        region: sunden
        type: shop
        description: >-
          A two-story timber building behind the Recruiter's Post.
          Bunks for forty, rarely more than twenty filled. The
          ground floor common room has three notice walls, one for
          each sin, and the postings on each wall tell a different
          story about what is currently being asked for and what is
          currently coming back.
      - name: Gristwell Approach
        slug: gristwell_road
        region: gristwell
        type: frontier
        description: >-
          The southern road. It descends through ground that gives
          slightly underfoot in warm weather and feels solid in
          frost. The town at the end is thinner than it was last
          year. The Mawdeep mouth is visible from the last mile,
          breathing on its diurnal cycle, and the road never quite
          looks at it directly.

  - id: wounded_two
    label: "Two Wounded"
    session_range: [11, 15]
    lore:
      - >-
        Two of the three sins are now wounded. The hamlet's character
        has shifted in ways that are noticed by everyone who has been
        here longer than a season. The Spillfield no longer fills at
        dawn the way it used to. The bleached zone north of Sünden
        has stopped advancing. Mawdeep's mouth still breathes but the
        rhythm is uneven, the diurnal pattern broken into something
        more nervous.
      - >-
        The third sin gets the full attention now — the one not yet
        wounded carries the weight of all three appetites for those
        who watch the Wall. Carved names cluster in its column. The
        Recruiter's Post is sending the most experienced delvers
        only in that direction, and the hireling bunkhouse is louder
        on those mornings than on any other.
      - >-
        The Confraternity's politics have hardened. Two of the three
        keepers see their workload dropping as the sin they oppose
        weakens, and the third sees their service overrun. The
        keeper of the rite still in demand begins to act as though
        their branch is the only branch that matters. The other two
        do not contradict this in public. They do, in private.
      - >-
        Travelers from elsewhere arrive in greater numbers than the
        hamlet is used to. People come to Sünden now to see what a
        wounded sin looks like — pilgrims, scholars, opportunists,
        and a few preachers from other valleys looking for evidence
        that their absent sin is the next to wake.
    location: "Sünden Square"
    atmosphere: >-
      Late campaign weight. The hamlet is fuller than it was at
      arrival but quieter. People have stopped greeting each other
      across the Square. The Wall is read every morning by more
      people than read it last season. Two of the three columns no
      longer get new carvings as often as they did. The third gets
      them weekly.
    points_of_interest:
      - name: The Pilgrim's Yard
        slug: pilgrims_yard
        region: sunden
        type: shrine
        description: >-
          A flagged outer yard west of the Wall where outsiders
          camp. Tents, mules, the occasional cart. The Confraternity
          tolerates the camp because the donations to all three
          rites have risen with the pilgrim traffic. Local opinion
          is mixed. The pilgrims do not stay long. They come,
          they read the Wall, they leave a token in whichever
          poor box matches their fear.
      - name: The Vetters' Office
        slug: vetters_office
        region: sunden
        type: shop
        description: >-
          A back room behind the Recruiter's Post, locked from the
          inside, where the hireling vetters keep their files.
          Drift profiles, return-pattern logs, notes on which
          delver came back able to do what. The vetters are not
          one mind. The office is divided informally — a kinder
          desk and a colder one, and which delver's file lands on
          which desk shapes the rest of their career.
      - name: The Old Coroner's House
        slug: old_coroners_house
        region: sunden
        type: monument
        description: >-
          The first building Sünden ever raised — a low stone hall
          on the western edge, the place where the dead were laid
          out before the Wall existed. Now it is empty, kept by
          the Wallwrights as a curiosity and as a workshop in bad
          weather. The slabs inside are smooth from generations of
          use. Locals do not enter it on dark nights, and they do
          not say why.
      - name: Ashgate Town Square (Half-Empty)
        slug: ashgate_square_thin
        region: ashgate
        type: settlement
        description: >-
          What remains of Ashgate's central square. Half the
          buildings are boarded; the other half are kept open by
          stubbornness. The fountain still runs but the water
          tastes of nothing. The Spillway tavern is the last
          functional building. Anyone living in Ashgate now is
          either too old to leave or too rooted to consider it.

  - id: wounded_all
    label: "Three Wounded"
    session_range: [16, 20]
    lore:
      - >-
        All three sins are wounded. The hamlet has become the
        regional center for something nobody knows how to name yet.
        The Wall has carvings in every active column and not enough
        room for the names that will come in the next year. The
        Wallwrights are extending the slate eastward in fresh
        courses. The new courses are not yet weathered. They look
        wrong against the old.
      - >-
        The four absent sins are no longer abstract. With three
        wounded and visibly diminishing, every traveler with a
        story about a barrow, a fen, a well, or a quiet word about
        the fourth, fifth, sixth, or seventh sin is taken more
        seriously than they were a year ago. Nobody in Sünden has
        said the four absent ones are coming. Nobody in Sünden has
        said they are not.
      - >-
        The Confraternity has reorganised. The three branches now
        meet in joint session weekly, something they never did when
        the rites were busy. The keepers who used to refuse to
        speak in the same room now share notes on what the rites
        do to a returning delver who has fought all three sins. The
        Masquerade host is the senior voice now. The other two
        defer to her when they thought they would not.
      - >-
        Sünden has become a destination for outsiders in ways its
        founders did not plan for. The approach hamlets are more
        empty than ever — Ashgate has six functional households
        left, Copperbridge four, Gristwell three. Their salvageable
        materials are being moved up to Sünden by mule cart on
        weekly runs. The hamlet is becoming the only town. The
        approach roads are becoming approaches to nothing else.
    location: "Sünden Square"
    atmosphere: >-
      Late, weighted, and not yet finished. The hamlet has earned
      its scars. The Wall is the most-read object in the region.
      Every conversation in the Square is shorter than it was at
      arrival, and every silence between conversations is longer.
      The party knows the keepers by their off days, the
      Wallwrights by the sound of their chisels, and the
      Recruiter's bench by the dent their packs have left in it.
    points_of_interest:
      - name: The Wall, Eastern Extension
        slug: the_wall_extension
        region: sunden
        type: monument
        description: >-
          The fresh courses of slate the Wallwrights have added to
          the eastern face of the Wall. The first carvings on the
          new stone are still pale, the cuts not yet weathered to
          match the rest. The four absent columns are still kept
          blank, by custom, but on the new extension the four
          columns are wider than the three sin columns. Whoever
          ordered the proportions has not been named.
      - name: The Confraternity Hall
        slug: confraternity_hall
        region: sunden
        type: settlement
        description: >-
          A purpose-built meeting room behind the Masquerade,
          completed in the late phase of the campaign. The three
          keepers meet here weekly. The room is plain, the
          furniture symmetrical, the seating equal — and yet
          everyone who has been inside more than once knows which
          chair is the senior chair. It is the one with the
          Masquerade's mask carved into its back.
      - name: Copperbridge, Last Households
        slug: copperbridge_last
        region: copperbridge
        type: settlement
        description: >-
          What remains of Copperbridge — a row of four households
          along the bridge, the bridge itself still standing but
          mossed over, the creek still running copper. The
          Spillfield is no longer worked. The tarnish in the
          water has lessened. The locals interpret this as bad
          news, not good.
      - name: Gristwell, Final Holdouts
        slug: gristwell_holdouts
        region: gristwell
        type: settlement
        description: >-
          Three households in Gristwell still occupied, all of
          them on the highest ground furthest from the Mouth.
          The Mouth still breathes but more shallowly. The locals
          who remain say the breathing is what tells them the
          ground is still being held. When the breathing stops,
          they say, they will leave.
