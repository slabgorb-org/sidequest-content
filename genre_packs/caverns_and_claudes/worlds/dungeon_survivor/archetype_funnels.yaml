# Dungeon Survivor — Archetype Funnels
# Six stage-title categories that funnel genre archetypes into
# mistaken-identity narrative hooks. Every summoned PC gets a
# title from this list.

funnels:

  # ── Slayer of the Wyrm ──────────────────────────────────────────
  - name: Slayer of the Wyrm
    absorbs:
      - [hero, tank]
      - [ruler, tank]
      - [everyman, tank]
    faction: null
    lore: >-
      The algorithm's most common misread. The Engine flags any
      subject who has, at any point in their life, stood within a
      wyrm's line of sight, been present at a dragon-related
      incident, or witnessed a large lizard from a comfortable
      distance. The current season's Slayer of the Wyrm is a goat
      farmer who once stood on a hill while a wyvern circled
      another valley. The farmer is fine with goats. The Host
      refers to the hill as "the field of the slaying." The
      goats were not on the field of the slaying. The wyvern did
      not land. The title nevertheless sticks, if played into.
    cultural_status: respected in the moment, hollow in private
    disposition_toward:
      The Network: transactional
      The Fans: variable
      The Unaired: cautiously open

  # ── Legendary of Fortune ────────────────────────────────────────
  - name: Legendary of Fortune
    absorbs:
      - [hero, dps]
      - [ruler, dps]
    faction: null
    lore: >-
      The algorithm recognizes "winning" as mythic and does not
      discriminate by scale. Office Secret Santa victors, lottery
      scratch-off winners, and people who once found twenty credits
      in a coat pocket all pattern-match to the same template.
      The current Legendary of Fortune is a regional sales manager
      who won her district's annual raffle last quarter. The prize
      was a spa weekend. She had not yet taken it. The Host
      describes her as having defeated a storied rival. The rival
      is, in fact, the second-best regional sales manager, now
      very slightly resentful in a conference room on a planet
      very far from the arena.
    cultural_status: envied publicly, ordinary privately
    disposition_toward:
      The Network: wary
      The Fans: transactional
      The Unaired: neutral

  # ── Walker Between Worlds ───────────────────────────────────────
  - name: Walker Between Worlds
    absorbs:
      - [caregiver, support]
      - [everyman, support]
    faction: null
    lore: >-
      The algorithm interprets any kind of liminal profession as
      mystical: night-shift security guards, long-haul drivers,
      hospital intake clerks, cleaning crews, and airport ground
      staff have all been summoned under this title. The current
      Walker Between Worlds is a warehouse shift-leader who
      was, at the moment of summoning, walking from one floor
      to another on the way to a vending machine. The Host speaks
      of her journeys between planes of reality. She knows which
      plane is the break room and which is the loading dock. She
      is finding the title annoying and weirdly, in its own way,
      useful.
    cultural_status: mysterious publicly, practical privately
    disposition_toward:
      The Network: unimpressed
      The Fans: neutral
      The Unaired: open

  # ── Defier of Tyrants ───────────────────────────────────────────
  - name: Defier of Tyrants
    absorbs:
      - [rebel, dps]
      - [jester, dps]
      - [outlaw, dps]
    faction: null
    lore: >-
      The algorithm extracts this title from any conversation
      involving the word "unreasonable," "manager," "landlord," or
      "policy." The current Defier of Tyrants was mid-argument
      with a supervisor when summoned. He had been saving up the
      argument for a week. It was going well. The Host has
      committed to the title and the crowd has embraced it. The
      supervisor, back on the home planet, is still standing in
      the break room holding a coffee mug and wondering where
      his employee went.
    cultural_status: cheered, mostly harmless
    disposition_toward:
      The Network: hostile
      The Fans: cheering
      The Unaired: natural ally

  # ── Silent Blade ────────────────────────────────────────────────
  - name: Silent Blade
    absorbs:
      - [outlaw, tank]
      - [magician, dps]
    faction: null
    lore: >-
      The algorithm reads professional silence as assassination
      credential. Librarians, dental hygienists, mimes, sound
      engineers, and introverts with a mild social anxiety have
      all been promoted to Silent Blade. The current Silent Blade
      is an actual professional mime. She carries no weapons. She
      communicates by raised eyebrow, hand gesture, and — at
      pivotal moments — a single raised finger that the audience
      has come to love. The Host describes her as the terror of
      the quiet places. She used to be. Her quiet place was a
      practice room at the conservatory.
    cultural_status: mysterious, highly memed
    disposition_toward:
      The Network: observant
      The Fans: fascinated
      The Unaired: cautious

  # ── Witness to the Dark ─────────────────────────────────────────
  - name: Witness to the Dark
    absorbs:
      - [sage, support]
      - [magician, support]
    faction: null
    lore: >-
      The algorithm flags anyone who has seen something they
      couldn't look away from: a traffic accident, a minor fire,
      an uncomfortable family dinner, a coworker's nervous
      breakdown, a sports team's collapse in the playoffs. The
      current Witness to the Dark is a methane-breathing
      accountant who once watched, from across a cafeteria, a
      coworker eat a sandwich that was visibly not agreeing with
      him. The accountant remembers the sandwich. The sandwich's
      owner survived. The Host describes the accountant's many
      visions of terrible knowledge. The accountant is patient
      about this and keeps reminding the Host that he is, in
      fact, a certified tax professional in the jurisdictions
      of six non-adjacent worlds.
    cultural_status: enigmatic, professionally mild
    disposition_toward:
      The Network: bureaucratically wary
      The Fans: baffled
      The Unaired: useful
