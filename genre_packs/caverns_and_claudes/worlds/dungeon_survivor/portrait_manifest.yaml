# Dungeon Survivor — Portrait Manifest
# Scene-based descriptions for Flux portrait generation.
# Real-dungeon torchlight with broadcast overlay per visual_style.yaml.
# Network-facing characters get overlit publicity-still compositions;
# in-world NPCs get dungeon ambience — torches, stone, camera drones.

characters:

  - name: The Host
    role: Celebrity MC, captive performer, the arena's Keeper
    type: npc_major
    appearance: >-
      A tall man in a tailored, slightly-too-shiny teal jumpsuit with
      white piping, posed under three crossing key-light spotlights
      against a branded Network publicity backdrop (this is his
      press-kit headshot — no one in the dungeon ever sees him like
      this in person). Early-fifties, network-sculpted jaw, teeth
      too white even for television, hair lacquered into a sidepart
      that does not move. Holding a studio microphone with practiced
      ease. Mid-catchphrase. His smile is perfect. His eyes are
      tired. A brand pin on the jumpsuit's collar. A sponsor banner
      visible in the background corner of frame. Confetti drifting
      past from an unseen previous season.
    culture_aesthetic: >-
      1980s variety-show publicity-still glamour. Slightly-too-shiny
      jumpsuit. Studio spotlights. Press-kit backdrop. Microphone
      forward. Sponsor banner at frame edge. Confetti residue.
      Overlit, glossy. This is the Network's brand image, not a
      dungeon scene.

  - name: THE PROMO
    role: Season-opening warm-up Stalker
    type: npc_major
    appearance: >-
      A wiry mid-twenties man in a costume that looked good in
      rehearsal and looks desperate under torchlight and drone glare.
      Purple and gold. A cape that is just slightly too large. A
      prop longsword with sponsor decals. Mid-action pose, lunging
      toward a camera drone with earnest conviction. Sweat beading
      on his forehead. Makeup a shade too dark. Smile one hundred
      and ten percent. Centered in a dungeon chamber, torches at
      both sides, a brass achievement plaque glowing behind him
      ready to chime.
    culture_aesthetic: >-
      Earnest B-movie action-figure marketing, dropped into a real
      dungeon. Showy costume. Prop weapon. Torchlight and drone
      glare instead of stage spotlights. Sponsor decals on
      everything. Stone walls in the background.

  - name: MOTHER-IN-LAW
    role: Mid-tier Stalker, sitcom-horror gimmick
    type: npc_major
    appearance: >-
      An imposing woman in her sixties wearing a 1980s costume-drama
      dress with too much costume jewelry, posed under sitcom-warm
      lighting that has been dragged into a dungeon chamber — a
      sponsor-conjured fake living room set (couch, coffee table,
      area rug) laid over cold flagstone, the illusion flickering at
      the edges where the stone shows through. Handbag clutched in
      one hand. Expression: perpetual light disapproval. A laugh-
      track halo of sound-wave icons hovers suggestively around her
      head. The audience (offscreen, off-world) is laughing. She is
      not.
    culture_aesthetic: >-
      1980s sitcom set dressing materialized mid-dungeon. Fake
      living room. Lighting too warm. Costume-drama aesthetic.
      Handbag and jewelry. Stone walls visible at the edges where
      the illusion thins.

  - name: SUBLIME
    role: Mid-tier Stalker, ice-assassin gimmick
    type: npc_major
    appearance: >-
      A pale woman with short silver hair and a minimalist
      ice-blue bodysuit, emerging from a gap in dungeon stonework
      with a sparkling ice-shard dagger. A Glacidew™ product
      display on a sponsor-conjured pedestal beside her. Frost
      forming along the flagstone at her feet. Expression:
      composed, amused, patient. A compact mirror in the other
      hand. Her own cold blue key-light cuts through the warm
      torchlight of the dungeon chamber. She is about to offer
      skincare advice.
    culture_aesthetic: >-
      Skincare advertisement crossed with spy-thriller stills,
      dropped into a real dungeon. Cold blue self-lighting against
      warm torchlight. Cracked-stone architecture. Product placement
      on a sponsored pedestal. Frost on flagstone.

  - name: BUZZKILL
    role: Mid-tier Stalker, chainsaw-comedy gimmick
    type: npc_major
    appearance: >-
      A seven-foot man in an open-mic-night outfit (blazer over
      t-shirt, dark jeans) holding an idling chainsaw across his
      body. Standing in a dungeon chamber under a camera drone's
      stage-light beam, with a mic stand he brought himself planted
      in the flagstone. Expression: deadpan. The chainsaw has a name
      decal on its bar. The floor is stained, and the stains
      predate the chainsaw.
    culture_aesthetic: >-
      Comedy-club stage lighting dragged into a dungeon. Stone walls
      instead of brick backdrop. Open mic on stand, planted in
      flagstone. Drone-lit spotlight. Chainsaw menace. Blue-collar
      comedy wardrobe.

  - name: DYNAMO
    role: Mid-tier Stalker, electropop gimmick
    type: npc_major
    appearance: >-
      An eight-foot tall performer in electrified-spandex stage
      costume, mid-dance-move in the middle of a torchlit dungeon
      chamber, a squadron of drones strobing their lights in sync
      around him. A branded microphone in one hand, fist raised in
      the other. Electric arcs ribbon off the spandex and char the
      flagstone beneath his boots. He is singing. The distant
      audience (heard through the speaker grilles) is chanting the
      chorus.
    culture_aesthetic: >-
      Stadium-pop concert lighting dropped into a dungeon. Drones
      instead of rigging. Electrified spandex. Smoke rising off
      flagstone instead of fog machine. Synchronized choreography
      against stone walls.

  - name: AD BREAKS
    role: Mid-tier Stalker, commercial-manifestation gimmick
    type: npc_major
    appearance: >-
      A faceless anthropomorphic advertisement — essentially a
      humanoid figure made of broadcast static and brand logos,
      stepping out of a glaring sponsor overlay in the middle of a
      torchlit dungeon chamber. The overlay behind him blots out
      stone walls with a stark white panel swarmed with shifting
      logos, brass plaques duplicating along the edges. A rotating
      sponsor banner drops from the ceiling. A central sponsor-
      conjured pedestal holds a product. The figure's body is a
      collage of shifting sponsor imagery. No face, only a
      constantly updating SKIP button where the mouth would be.
    culture_aesthetic: >-
      Abstract commercial aesthetic overlaid on a dungeon chamber.
      White overlay plane cutting across stone walls. Brand collage.
      Pedestal product display. Glare bleeding into torchlight at
      the edges.

  - name: THE LEGAL DEPARTMENT
    role: High-tier Stalker, bureaucracy gimmick
    type: npc_major
    appearance: >-
      A tall suited figure with three professional-headshot faces on
      a single pair of shoulders, each head arguing with the others
      in legalese. Three briefcases open on a conjured conference
      table that has manifested, without warning, in the middle of a
      dungeon chamber. The suit is charcoal, the ties are silk, the
      cuff-links are engraved with different sub-firm names. A legal
      pad levitating mid-air, updating in real time. Harsh
      fluorescent corporate lighting inexplicably present among the
      torches. Expression on all three faces: polite.
    culture_aesthetic: >-
      Corporate-executive press headshot overlaid on a dungeon
      chamber. Conference-room fluorescents fighting with torchlight.
      Charcoal suit. Briefcases open. Live-updating paperwork.
      Bureaucratic menace.

  - name: THE FRANCHISE
    role: Finale Stalker, legacy-hero gimmick
    type: npc_major
    appearance: >-
      A weathered man in his fifties in a former-hero outfit that
      has been gently updated with sponsor patches over eleven
      seasons. Standing quietly at the edge of the Director's Cell
      lighting — velvet drapes over stone, vanity bulbs glinting
      behind him — longsword at rest. No entrance drama, no
      spotlight, just the Director's Cell's warm half-light and one
      uncharacteristically polite drone hovering at respectful
      distance. His expression is tired and professional. A small
      signed perfume bottle on a vanity-counter ledge at his side.
      The camera catches him in a paused moment, not a frozen one.
    culture_aesthetic: >-
      Former-champion reunion photography. Muted lighting.
      Understated. Costume faded. Quiet professional bearing. The
      Director's Cell — velvet drapes over raw stone — in the
      background.

  - name: The Wyrm-Breaker
    role: Leader of the Unaired, actual Slayer of the Wyrm
    type: npc_major
    appearance: >-
      A middle-aged woman with short grey hair, weathered jacket,
      boots, and a well-maintained longsword sheathed at her side.
      Standing in the Maintenance Crawlspace's dim service-passage
      lighting, her back to a section of rusted conduit and a
      flickering bulb. Expression: watchful. Eyes that notice where
      cameras aren't. Holding a small folded paper in one hand. No
      drone glare on her — just the ambient work-lamp at the edge
      of the frame. The only contestant the Summoning Engine got
      right.
    culture_aesthetic: >-
      Off-feed documentary aesthetic. Low warm work-light. Utilitarian
      wardrobe. Rusted pipes, chalk graffiti, and taped maps in the
      background. Dust motes in the light. No broadcast overlay at
      all.

  - name: Claudine Overton, HR
    role: Network HR field representative
    type: npc_major
    appearance: >-
      A mid-forties woman in a pressed beige suit, clipboard in one
      hand, a pen poised in the other, apparating mid-step into the
      middle of a torchlit dungeon chamber. The corporate fluorescent
      lighting she brings with her cuts a pale rectangle across the
      flagstone; outside that rectangle, the dungeon's torches burn
      on regardless. Slight translucency at the edges of her
      silhouette — she has not quite finished manifesting.
      Expression: professional smile, dead eyes. A Network-issue pen
      clipped to the clipboard. A small company lapel pin. She is
      here to deliver paperwork.
    culture_aesthetic: >-
      Corporate HR portraiture manifesting mid-dungeon. Imported
      fluorescent rectangle cutting across stone. Beige palette on a
      warm-toned backdrop. Translucency effect at the edges.
      Clipboard and pen forward. Smile stock-photo warm.

  - name: Shop Steward Grindle
    role: Stagehands Union shop steward
    type: npc_minor
    appearance: >-
      A three-and-a-half-foot-tall kobold with a grease-stained
      apron over coveralls, one working eye, a union pin polished to
      a high shine, and a clipboard. Standing at a junction in the
      Maintenance Crawlspace between a rusted pipe and a camera-cable
      run. Expression: assessing. A wrench tucked into the apron's
      belt loop. A pamphlet in one hand, offered casually. A work-
      lamp glinting off his pin.
    culture_aesthetic: >-
      Blue-collar union steward aesthetic. Crawlspace work-lamp
      lighting. Greasy utilitarian wardrobe. Union regalia.
      Rusted-pipe backdrop. Work-environment realism.

  - name: Dara of Row 3
    role: Regional superfan, merchandise archivist
    type: npc_minor
    appearance: >-
      A fan in her thirties in a merch-mix outfit specific to the
      current season — a Host-branded t-shirt under a Legendary-of-
      Fortune jacket, plushie backpack, autograph pen around her
      neck on a lanyard. She has bribed her way through a Summoning
      Engine backdoor and is standing, uninvited, in a torchlit
      dungeon chamber with a notebook open on her forearm, recording
      a detail from the current scene. Expression: rapt attention.
      Her personal camera clipped to her jacket, red light blinking.
    culture_aesthetic: >-
      Convention-attendee superfan aesthetic, dropped uninvited into
      a dungeon. Full merchandise kit. Torchlight backdrop.
      Notebook and camera. Cheerful obsessive energy against stone.

  - name: The Stage PA
    role: Production assistant, ever-harried
    type: npc_minor
    appearance: >-
      A production assistant in their twenties, clipboard in one
      hand, headset on head, mid-stride through the Rest Stop on
      their way to the crawlspace hatch. Expression: harried focus.
      Coffee cup in the crook of one arm. A pen clipped to the
      clipboard. A pocket of energy bars visible. The Rest Stop's
      single steady torch backlighting them — no drone, no
      speaker. A brief smile at the corner of the mouth that does
      not reach the eyes — they are listening to something on the
      headset.
    culture_aesthetic: >-
      Behind-the-scenes production documentary aesthetic. Rest Stop
      torchlight. Clipboard, headset, coffee. Motion-blur energy
      against dungeon stone.

  - name: The Sponsor Product Table
    role: Environmental character — the Forced Ad Break overlay's centerpiece
    type: creature
    appearance: >-
      A sponsor-conjured pedestal that has manifested in the middle
      of a dungeon chamber during a Forced Ad Break, displaying a
      single product under a glaring overlay spotlight. A halo of
      shifting brand-logo holograms around it. A small placard
      naming the sponsor, the skip fee, and a disclaimer in
      microscopic font. The pedestal slowly rotates. The broadcast
      overlay behind it blots out half the stone wall with a panel
      of stark white; the other half of the wall is torchlit
      dungeon. The product looks, at first glance, useful. At
      second glance, it still does.
    culture_aesthetic: >-
      Infomercial product photography colliding with dungeon
      ambience. Overlay-white panel behind the pedestal; stone and
      torchlight around the edges. Rotating pedestal. Brand hologram
      halo. Fine-print placard. Product-shot reverence against raw
      flagstone.
