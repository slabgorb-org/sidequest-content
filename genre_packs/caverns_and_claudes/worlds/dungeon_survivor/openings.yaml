# Dungeon Survivor — Session Openings
# Five variants for the summoning-flash opening beat.
# Pattern: mundane moment → summoning flash → mistaken-identity announcement
# → first door opens. Every opening lands in The Drop: stone pit at the
# bottom of a summoning shaft, brass plaque chiming a stage title, a
# camera drone already in the room, and the Host's voice coming out of
# a speaker grille bolted into keystone.

- id: the_prescription
  archetype: summoning
  situation: >-
    The party has just been summoned mid-errand. One PC was picking
    up a prescription. Another was about to board a commuter tram.
    A third was halfway through a lukewarm coffee. None of them
    know each other. None of them consented to this. All of them
    are now standing in a stone pit at the bottom of a long shaft
    with a camera drone hovering at shoulder height, a brass plaque
    chiming their titles at them one by one, and a man in a tailored
    jumpsuit introducing them over the wall speaker to an off-world
    audience of fourteen billion.
  tone: disoriented bafflement played for the audience's delight
  avoid:
    - premature reveal of the Host's private side
    - introducing any Stalker before the first door opens
    - explaining the Network in Scene 1 (it's a discoverable)
    - letting players suspect the broken algorithm in the opener
  first_turn_seed: >-
    You were picking up a prescription. You don't remember what for.
    There was a flash, a sound like a laugh track played backward,
    and then a hand — too many fingers — placed a clipboard in yours.
    Then stone. You are standing on pitted flagstone at the bottom
    of a long vertical shaft, two torches guttering in brackets, a
    brass plaque on the wall beside you chiming awake in green:
    WELCOME. SEASON ELEVEN. 0 KILLS / 0 DEATHS. A fist-sized camera
    drone hums politely at your face. From a speaker grille bolted
    into the keystone: "PLEASE welcome, from a planet I'm not even
    going to try to pronounce — our LEGENDARY SLAYER OF THE WYRM!"
    You have never seen a wyrm. Somewhere far away, a crowd erupts;
    the sound reaches you as a tinny cheer through the grille. The
    other contestants are beside you, confused, not from the same
    planet — one of them is breathing what smells like methane. The
    Host is not finished. He is introducing the next one now. Ahead,
    a single iron-banded door is beginning to swing open, with a
    cheerful foil sticker pasted just above the handle: GOOD LUCK,
    BROUGHT TO YOU BY GLOAMREACH WHETSTONES™.

- id: mid_shift
  archetype: summoning
  situation: >-
    A PC was at work — night shift, warehouse, security desk,
    hospital intake, cleaning crew. The other PCs were elsewhere,
    but the summoning has brought them here. The Host introduces
    them as Walker Between Worlds — a title the algorithm generated
    from "works third shift."
  tone: exhausted confusion, wry
  avoid:
    - resolving the mistaken identity immediately
    - giving the PC time to explain what they actually do
    - letting the Host stop his monologue for a character beat
  first_turn_seed: >-
    You were on shift. You do not remember clocking in. You do
    remember the coffee was bad and the fluorescent lighting was
    humming, and then it was humming louder, and then there was a
    flash, and now you are standing on pitted flagstone in a round
    stone pit, with a drone drifting around your face and a brass
    plaque beside you blinking green. A man's voice from a speaker
    grille in the wall tells a cheering audience — somewhere, not
    here — that you are the WALKER BETWEEN WORLDS. You were walking,
    sure. Between floors. On your way to the vending machine. The
    other contestants in the pit look as wrong-footed as you. One
    of them is still holding a sandwich. The voice introduces the
    next contestant by a title you have not had time to process.
    The sandwich-holder meets your eyes and whispers, "are we in a
    commercial?" You hear your own voice answer: "I don't know."
    A single iron-banded door at the pit's edge is beginning to
    open.

- id: the_argument
  archetype: summoning
  situation: >-
    The PC was mid-argument with a supervisor, a manager, a
    landlord, or a bureaucrat. The Host introduces them as Defier
    of Tyrants — a title the algorithm extracted from the word
    "unreasonable" in the conversation. The PC is primed for
    conflict and the audience picks up on it immediately.
  tone: righteous confusion, combustible
  avoid:
    - letting the PC reveal the argument's actual subject
    - introducing the Host's cope too early
    - letting a Stalker crash the opening
  first_turn_seed: >-
    You were telling your manager exactly what you thought. You had
    been building to it for a week. The words were good. The timing
    was finally right. You were three sentences in and you were
    winning. Then the light changed, and the floor was stone, and
    the manager was gone, and the shaft of distant daylight above
    closed over, and a voice through a brass grille in the wall
    said, "from a world that has clearly wronged them — our DEFIER
    OF TYRANTS!" A cheer reaches you tinnily through the speaker.
    The plaque beside you chimes your new title in green. Your
    hands are still up from the argument. Your speech is still
    half-formed on your tongue. Someone in the distant crowd yells
    "GET HIM." You do not know who "him" is. Other contestants
    have been summoned into the pit beside you, each one wearing
    a different species of confusion. The voice swings to a short
    contestant with what looks like a very old sword. He
    introduces her as the party's leader. She has not volunteered
    for this. An iron door at the pit's edge is opening.

- id: the_picnic
  archetype: summoning
  situation: >-
    The PC was having a genuinely good day. A picnic, a walk, a
    first date, a morning with good light. The Host introduces
    them as something absurdly martial. The tone contrast is the
    joke — a perfectly nice day followed by a broadcast dungeon.
  tone: nostalgic yearning played against spectacle
  avoid:
    - cheapening the nice moment in narration
    - making the PC feel punished for having a good day
    - interrupting with combat in Scene 1
  first_turn_seed: >-
    The light was right. You remember that. The light was right and
    someone next to you was laughing, and you were about to say
    something you'd been saving. Then the flash. A sound like a
    laugh track played backward. Then: cold stone, two dripping
    torches, a brass plaque chiming green. A camera drone ducks in
    for a reaction shot. From the wall speaker, a man's voice
    announces you to an audience somewhere else — not the audience
    you wanted. "Please welcome," he says, "a warrior of unknown
    aspect — our CRUSHER OF HEAVEN!" The cheer reaches you muffled,
    ambient, wrong. You have crushed nothing. You were, a moment
    ago, happy. The person who was laughing is not here. The other
    contestants in the pit are strangers. One of them has six arms.
    The voice is working the crowd. The iron door at the pit's edge
    is opening. The light in here is not the light you remember.

- id: returning_contestant
  archetype: recap
  situation: >-
    Second or later session. The party has been in the dungeon
    before. They wake in the Rest Stop — the dungeon's one safe
    room — instead of the Drop. The water box is already stocked
    with their continuity brand. The graffiti near the door has
    been updated in their own handwritings. The Host's voice can
    be heard on the other side of the door, already warming up
    the crowd for today's scene.
  tone: familiar, tired, grimly ready
  avoid:
    - re-explaining the setup (they know)
    - pretending the party is new to anything
    - introducing a Stalker before the party leaves the Rest Stop
  first_turn_seed: >-
    The Rest Stop's water box has not improved. The complimentary
    paper cup still has terms and conditions on the bottom, in a
    font you cannot read. Someone has added to the LAST SAFE PLACE
    chalk near the door — a small arrow and the words OR IS IT in
    a hand that might be yours. Your plushie is still at the
    Boneyard Bazaar, one shelf over from where it was last session.
    The water box remembers what you bought last time and has
    stocked more. From the other side of the Rest Stop door you
    can hear the Host's pre-show warm-up bleeding through the
    stone, the ambient hum of the broadcast, the familiar swell of
    a speaker-grille cue beginning its loop. The other contestants
    are checking gear. A note has been slipped under the door —
    thin paper, old hand, three words. You pocket it. The Host's
    voice rises: he is calling your stage titles now, and the
    drones are hovering at the threshold, waiting for you to step
    out.
