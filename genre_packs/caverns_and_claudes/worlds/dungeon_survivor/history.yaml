# Dungeon Survivor — Campaign Progression
# Party progression through a season of the show.
# Structured to match HistoryChapter schema: id, label, lore[], session_range

chapters:
  - id: fresh
    label: "Season Premiere"
    session_range: [1, 3]
    lore:
      - >-
        The party has just been summoned. They woke at the bottom of a
        stone shaft with a brass plaque blinking WELCOME — SEASON
        ELEVEN on the wall beside them. The Host's introduction,
        broadcast through a speaker grille bolted into the keystone,
        still rings in their ears. Their stage titles still make them
        flinch. The audience — fourteen billion civilizations watching
        from off-world — is intrigued: fresh faces, unknown deeds,
        maximum marketing upside. The Network's analytics department
        is running projections. The sponsors are watching carefully.
      - >-
        This is the tutorial arc. The Promo — the season's opening
        Stalker — is the first real threat. He is trying very hard
        and he is, by design, going to die. The party's handling of
        him sets the tone for the season. Crushing him pleases the
        crowd; being kind to him pleases the editors.
      - >-
        The Rest Stop is the party's hub. A stone bench. A water-
        dispensing box sponsored by GLOAMREACH WHETSTONES™. The one
        place in the dungeon the camera drones are not permitted to
        follow. The party has no gear beyond what they were holding
        when the portal took them — a half-eaten sandwich, a lukewarm
        coffee, a clipboard, an argument they were three sentences
        into winning.
      - >-
        Morale is high for the audience and low for the contestants.
        Nobody has died on camera yet. The Host's voice is especially
        polished in these early episodes — he knows the first
        impression sells the season. He has not yet noticed which
        parts of his own monologue the dungeon is changing.
    location: "The Drop"
    time_of_day: showtime
    atmosphere: >-
      Disoriented dread played for laughs. The party is off-balance,
      the audience is leaning forward, and the Host's voice is at
      full power. Everyone is finding their marks. The dungeon is
      watching, too.
    points_of_interest:
      - name: The Drop
        slug: the_drop
        region: the_drop
        type: entrance
        description: >-
          The intake. A round stone pit at the bottom of the
          summoning shaft. Brass plaque chimes WELCOME. A single
          iron-banded door leads into the dungeon proper. The first
          camera drone is already in the room.
      - name: The Rest Stop
        slug: the_rest_stop
        region: the_rest_stop
        type: hub
        description: >-
          The dungeon's one safe room. Stone bench, water box, one
          steady torch, no camera drones, no speaker grille, no
          Host. A narrow hatch on the back wall leads into the
          crawlspaces where the Network can't see.

  - id: early
    label: "Building the Audience"
    session_range: [4, 8]
    lore:
      - >-
        The party has survived the Premiere. Word is getting out. A
        small fan cohort has formed — off-world superfans who watched
        the Premiere twice, merch collectors with opinions on the
        party's aesthetic. Trending is sideways, which is better
        than it sounds.
      - >-
        Mid-pack Stalkers begin to cycle into the party's rotation.
        SUBLIME whispers from ductwork that isn't on any official
        map. MOTHER-IN-LAW's laugh track can be heard through two
        stone walls. The audience is being primed for a rotating
        menagerie; the Network's bookers are pleased.
      - >-
        The first Forced Ad Break arrives mid-combat. The party does
        not move. The Ad Spirit materialises in the current room, a
        ninety-second sponsor pitch overlays the fight, brass plaques
        multiply on the walls, drones repack the ceiling. Survive
        the pitch or pay the skip fee. Either way, the sponsor gets
        the slot they paid for. The dungeon's monsters pause
        politely for the ad; this, too, is in the lease.
      - >-
        The Boneyard Bazaar becomes a tactical resource. PrimeBux
        accumulate. Brann the goblin accepts them without comment.
        The party learns that purchasing a plushie of themselves
        stabilizes the run. Some members resist the commodification.
        Some lean in and start doing catchphrases. The audience can
        tell the difference. So can the editors.
      - >-
        Rumors of the Unaired begin to reach the party through
        crawlspace graffiti and a dead drop behind a loose stone.
        Someone named Wyrm-Breaker is mentioned. No one is willing
        to say her actual name within earshot of a drone.
    location: "The Knave's Grotto and the dungeon's upper ring"
    time_of_day: live
    atmosphere: >-
      Routine dressed up as spectacle. The contestants are learning
      the rhythm of the dungeon. The dungeon is learning them. Every
      scene has a Forced Ad Break breathing down its neck.
    points_of_interest:
      - name: The Knave's Grotto
        slug: the_knaves_grotto
        region: the_knaves_grotto
        type: normal
        description: >-
          The first proper combat room. Six granite pillars, a
          shallow pool, patient wrong-shaped things in the shadows.
          The brass plaque on the far wall is cocked to chime
          ACHIEVEMENT UNLOCKED the moment something here dies.
      - name: The Boneyard Bazaar
        slug: the_boneyard_bazaar
        region: the_boneyard_bazaar
        type: hub
        description: >-
          Brann's shop. Save point. Lanterns on fishing wire. A
          counter made of two coffins and a plank. Shelves of
          cursed daggers, plushies of the party, and commemorative
          programmes that spoil seasons that haven't aired.
      - name: The Gauntlet
        slug: the_gauntlet
        region: the_gauntlet
        type: normal
        description: >-
          Trap corridor. Pressure-plate flagstones, a pedestal chest
          with a sponsor sticker, and the mounted remains of Season
          Nine pinned to the far wall under a CONDOLENCES plaque.

  - id: mid
    label: "Sweeps Week"
    session_range: [9, 15]
    lore:
      - >-
        The party is officially a brand. Trending is up and the
        analytics department has shifted them from "developing
        story" to "current property." Their likenesses are on
        Brann's shelves. Their catchphrases are in the speaker
        rotation. Their deaths, should they occur, are now worth
        considerably more.
      - >-
        Serious Stalkers enter the rotation. BUZZKILL's chainsaw
        idles in the shadows. DYNAMO's entrance music has been
        heard, bleeding through the stone from the next chamber
        over. AD BREAKS has begun manifesting uninvited, the
        Stalker-form of the broadcast overlay itself. The Network's
        analytics have noted that the party is most exciting when
        paired with a Stalker they visibly dislike; the bookers are
        adjusting the rotation to maximize friction.
      - >-
        The Fans have turned rabid. Fan Ambushes become a regular
        hazard — off-world superfans bribing their way in through
        Summoning Engine backdoors for selfies, proposals of
        marriage, unsolicited advice. Row 3 has fortified a position
        near the Boneyard Bazaar.
      - >-
        The Unaired reach out. Marin's dead drop in the crawlspace
        is replaced with a fresh note. The message is terse and the
        handwriting is old. Following up is a choice.
      - >-
        The Host is spending more time on the speakers and less
        time off them. His rehearsed spontaneity has an edge. He is
        watching the party closely. He has noticed the algorithm
        anomalies. He has not yet understood what he has noticed.
    location: "The Boneyard Bazaar and the dungeon's mid-ring"
    time_of_day: showtime
    atmosphere: >-
      Professional television. The party is moving through their
      routines with confidence. The Network is pushing harder. The
      sponsors are spending more. The audience wants a climax.
      The dungeon continues to watch.
    points_of_interest:
      - name: The Maintenance Crawlspace
        slug: the_maintenance_crawlspace
        region: the_maintenance_crawlspace
        type: secret
        description: >-
          Liminal service labyrinth. Where the Unaired hide.
          Reachable only through specific wrong-turns, loose
          stones, and hatches hidden in the safe rooms.

  - id: veteran
    label: "The Season Finale"
    session_range: [16, 25]
    lore:
      - >-
        The party has become legitimately beloved. Their mistaken
        identities have, through sheer time-on-camera, begun to seem
        true. The audience has made peace with the goat farmer being
        the Slayer of the Wyrm. The algorithm's drift has, by
        accident, produced something close to the desired result.
      - >-
        Late-tier Stalkers are unleashed. THE LEGAL DEPARTMENT's
        briefcases snap open. THE FRANCHISE has been spotted in the
        dim, tired, watching. He has been watching all season. He
        has opinions.
      - >-
        The Director's Cell becomes reachable. The Host is there, or
        can be there, at the party's discretion. He is not at his
        microphone. He is drinking. His face does not sit right at
        this range, and the mirror does not reflect the camera rig
        overhead. A bargain is on the table. It is a different kind
        of conversation.
      - >-
        The Scrying Pool remains the Network's territory, though it
        predates the Network by centuries. The Unaired know a way
        in. Whether the party has earned that knowledge is a
        function of which relationships they have cultivated.
      - >-
        Winning is possible. Going home is possible. Leaving on
        terms the Network did not approve of is possible if the
        party is willing to read a great deal of fine print out
        loud and sign it in the correct order in front of a live
        broadcast. The Network has not anticipated this. The
        Network has anticipated many things but not this.
    location: "The Director's Cell, the Scrying Pool, the crawlspace interior"
    time_of_day: finale
    atmosphere: >-
      Valedictory. The show is wrapping. The audience is on the
      edge of their seats. The Host is either going to cry real
      tears or sign a new contract or both. The party's choices
      matter in a way they haven't before.
    points_of_interest:
      - name: The Director's Cell
        slug: the_directors_cell
        region: the_directors_cell
        type: boss
        description: >-
          The Host's private chamber. A circular crypt with velvet
          drapes over stone. Vanity counter, jumpsuit rack, drinks
          cabinet, a locked drawer that rumour says holds his real
          face. No cameras. Contractually.
      - name: The Scrying Pool
        slug: the_scrying_pool
        region: the_scrying_pool
        type: secret
        description: >-
          The dungeon's original divination chamber. A stone basin
          of black water that shows every camera feed tiled across
          its surface. The Network has installed broadcast kit
          around it without understanding what the pool actually
          is. Reachable only through the Unaired's knowledge of
          the crawlspace backdoors.
