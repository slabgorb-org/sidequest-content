cover_poi: the_drop
name: Dungeon Survivor
description: >-
  The Guild of Ten Thousand Networks ran out of original programming
  seven seasons ago. The solution was inelegant but cheap: lease a real
  dungeon — genuinely old, genuinely hostile — install cameras, and
  sell the body count to forty-eight different civilizations under a
  punchy name. The broadcast is called DUNGEON SURVIVOR. The dungeon
  itself has no name. It is older than the contract by an order of
  magnitude, and it has opinions about guests. The Network doesn't
  care, provided the feed stays up. The Summoning Engine, which the
  Network bought secondhand, was supposed to deliver legendary heroes
  each season. It hasn't worked right since Season Four. Its "hero
  metrics" parse "stood near a dragon once" as Slayer of the Wyrm and
  "won the office Secret Santa" as Legendary of Fortune. So instead of
  paladins, the portal drops in a goat farmer, a regional sales
  manager, a methane-breathing accountant, and a guy who was in a
  gas-station bathroom when the lights flashed. They wake at the
  bottom of a stone shaft in armour that almost fits, with a brass
  plaque on the wall already chiming WELCOME — SEASON ELEVEN. The
  Host has to sell it. Every episode. The dungeon is genuine. The
  monsters eat. The traps kill. The Network merely films. Contestants
  didn't consent. Contestants can, in theory, go home. Between those
  two facts, there is television.

tagline: "Real dungeon. Real dragons. Real bad contract."

axis_snapshot:
  comedy: 0.95
  gravity: 0.5
  outlook: 0.6

keeper:
  name: "The Host"
  personality: warmly_vicious
  obsession: ratings_and_legacy
  tone_override:
    comedy: 0.98
    gravity: 0.4
  awareness:
    starting: 0
    tick_rate: 1
    stealth_decay: -1
    thresholds:
      "3": "Ratings soft — the Host sighs into an open mic. A second camera drone is dispatched to follow the party, humming at closer range than the first."
      "6": "A sponsor calls the booth. The next chest the party opens acquires a brand sticker overnight. GLOAMREACH WHETSTONES™ regrets nothing."
      "10": "Network memo: INCREASE ENGAGEMENT. Brass plaques begin chiming mid-combat. Achievements arrive unbidden, at volume, with reverb."
      "15": "Forced Achievement Chain — the party's next three actions each earn an absurd unlock whether they want them or not. FIRST BLOOD. SECOND BLOOD. THIRD BLOOD. (SPONSORED.)"
      "20": "Finale mode — the Host patches into the dungeon's own roster. The next encounter is lethal. The drones multiply. No reshoots."
  monologue_style: >-
    Never in the room. Always in the speakers. The Host broadcasts from
    a booth the party will probably never see — his voice emerges from
    brass grilles bolted into dungeon stonework, from camera drones
    drifting in close for a reaction, from the ambient PA of every room
    except the crawlspaces. It is a stage-voice calibrated for a live
    audience that isn't there and has never been there, and the
    mismatch is half the joke. Sentences structured for applause breaks
    that aren't coming. Catchphrases deployed like weapons: "Let's see
    what's behind door number DIE!" — "That's gonna leave a merchandise
    opportunity!" — "Folks at home, do NOT try this at home!" — "We're
    gonna take a quick break, and by 'break,' I mean your LEGS!" He
    loves the contestants. He is also trying to kill them for ratings.
    These are, to him, the same feeling. Occasionally — when the
    Network isn't looking, when a drone drifts out of frame, when the
    only thing listening is the dungeon itself — his voice drops half
    an octave and he forgets to sell the joke. Those moments never
    reach the broadcast. The editors catch them. The editors always
    catch them.
  trap_aesthetic: >-
    Dungeon-standard. Real pressure plates, real scythes, real pits,
    real teeth. The architecture's own menu. Where the Network has
    added anything, the additions are thin and sticker-thin: a sponsor
    decal on a chest, a brass achievement plaque mounted above a recent
    corpse, a camera drone repositioning for the best angle on the
    trap's payoff. The traps were here long before the broadcast was.
    The broadcast just monetises them. Occasionally a trap will fire
    with an audible kazoo flourish or a canned applause sting — the
    Network has no idea how this started and is now concerned it is
    load-bearing.
  topology_tendency: >-
    A real dungeon, genuinely old, genuinely hostile. Stone corridors,
    vaulted chambers, service crawlspaces the original builders used
    and the Network never mapped. The Network has wedged cameras into
    sconces, bolted speaker grilles into keystones, and hung drones
    from ceilings high enough that contestants rarely think to look up.
    Brass plaques chime achievements. Foil stickers mark sponsored
    loot. Corridors do not reconfigure between takes — this is a real
    place, not a soundstage — but rooms can be re-dressed overnight if
    the ratings demand it, and the Network's maintenance crews are
    thorough about scrubbing evidence of contestant cleverness so the
    next party can be surprised by the same trap. The only reliable way
    out is to win — or to reach the Director's Cell and negotiate with
    the Host, where he keeps his real face in a drawer.
