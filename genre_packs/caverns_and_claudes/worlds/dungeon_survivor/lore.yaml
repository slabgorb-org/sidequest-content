# Dungeon Survivor — Present-Day Lore

overview: >-
  DUNGEON SURVIVOR is the Network's flagship property and the
  highest-rated live broadcast in the observable galaxy. Every season,
  a fresh party of heroes — summoned from across fourteen billion
  worlds — is dropped into a genuinely old, genuinely hostile dungeon
  for the amusement of an audience that outnumbers every civilization
  combined. The broadcast is mandatory viewing on most member worlds.
  The ratings keep stars warm. The sponsors keep the Network solvent.
  The dungeon, for its part, keeps eating.

  The Host introduces each party over the speaker grilles bolted into
  dungeon stonework, with the warmth of a man who has seen everything
  and would like you to know he is still capable of surprise. The
  contestants are introduced by their legendary deeds. The audience
  gasps. The contestants stare at the brass plaque chiming their
  titles at them. A door opens, with a cheerful sponsor sticker pasted
  just above the handle.

  Every season ends one of four ways: the party wins and goes home
  (rare, glorious, good for ratings); the party dies in a compelling
  formation (common, televised with dignity, good for ratings); the
  party is quietly edited out between broadcast cuts (common, not
  televised, not discussed); or the party goes off-script in a way the
  Network decides is not going to be mentioned (very rare, very
  career-ending for the Host of the moment).

  The show has been running for longer than most member worlds have
  had civilizations. The dungeon is older still. No one alive
  remembers when either of them started. No one alive is expected to.

the_network:
  nature: >-
    The Network is the corporate entity that owns Dungeon Survivor, the
    Summoning Engine, the gift-shop franchise, the merchandise rights,
    the audience-polling infrastructure, and — by quiet clause in the
    member-world treaties — most of the air. It has no known face, no
    known leadership, no known office you can visit. It communicates
    through memos. The memos slide under doors that nobody saw shut.
  interaction_style: >-
    Administrative. Always administrative. An HR representative
    apparates into the scene holding a clipboard and a fixed smile.
    A severance packet is explained in clauses. A non-disclosure
    agreement is slid across a surface that was not there a moment
    ago. The Network does not negotiate. It files. Confrontation with
    the Network is paperwork with teeth. Weaponry is ineffective. The
    only recognized counter-instrument is a loophole.
  reach: >-
    Every member world, every sponsor, every broadcast relay, every
    gift shop, every Summoning Engine intake portal, and — it is
    whispered — the Host's dental records. The Network does not ask
    permission. It already has the signed forms. It has had them for
    longer than you have been alive.
  weakness: >-
    Contractual. The Network cannot overrule a clause it has already
    signed. Contestants who read the fine print — and there is, in
    fact, a great deal of fine print — occasionally discover that
    they are entitled to things the Host would prefer they not claim.

the_summoning_engine:
  nature: >-
    A device of pre-civilizational origin, maintained by an engineering
    team that has been on-call for two thousand seasons. The Engine
    opens a pinhole portal across galactic distances and retrieves a
    single sapient subject per casting. Six castings per season.
    Pre-calibrated, allegedly, to retrieve individuals who match the
    Network's canonical hero profile.
  the_algorithm: >-
    The hero-metrics algorithm that drives the Engine's target
    selection has been miscalibrated for eleven consecutive seasons.
    The misalignment is known internally as "the drift." The
    engineering team logs incident reports every season. The reports
    are filed. Nothing has been fixed. Memos have been exchanged on
    the subject of fixing it. The memos say the fix is coming. The
    fix has been coming for eleven seasons.

    The drift causes the algorithm to parse ordinary biographical
    data as mythic deed. "Stood near a dragon once" reads as Slayer
    of the Wyrm. "Won the office Secret Santa" reads as Legendary of
    Fortune. "Argued with a manager" reads as Defier of Tyrants.
    "Works a night shift" reads as Walker Between Worlds. The pattern
    is consistent. The algorithm is, in its own mis-tuned way,
    internally coherent. It simply selects the wrong people with
    great confidence.
  who_knows: >-
    The engineering team knows. The Unaired know (they are what the
    algorithm occasionally produces when it accidentally gets it
    right). The Host does not know. The Host cannot know; his
    contract is contingent on him believing he is introducing heroes.
    The Network has made certain this belief is maintained.
  implication: >-
    The party in the arena is not a legendary cohort. The party in
    the arena is a cosmic accident. They can be told, or they can
    find out. Either way, the revelation is a late-game beat, not an
    opener. The Host goes on selling them as heroes because he
    genuinely believes they are. The belief is half the show.

the_broadcast:
  scale: >-
    Fourteen billion member worlds. Mandatory broadcast on most.
    Cultural-holiday status in some. The season finale outranks, by
    viewership, every other event in the quadrant. Weddings are moved.
    Wars are paused. Clergy preach on themes drawn from recent
    episodes. The Host's catchphrases enter vernacular in forty-seven
    languages per season.
  ad_tiers: >-
    Three tiers of sponsor participation: Premier (brand sticker on a
    chest, sponsor-branded achievement plaques, product placement on
    loot drops), Primary (live broadcast overlay — Ad Spirit manifests
    in the current room with a ninety-second sponsor pitch, skip fee
    in PrimeBux), Platinum (narrative intervention — the sponsor
    directly helps or hinders the party, monkey's-paw rules). Tier
    rates are public. The party's decisions influence rates for the
    following week.
  economics: >-
    The show is the single largest revenue engine in the galaxy.
    Member-world contributions to the Network are assessed in
    viewership — worlds that don't watch enough get invoiced for the
    shortfall. The Boneyard Bazaar moves enough merchandise in a
    season to sustain a medium-sized planetary economy. Contestants,
    by contract, are paid scale. Scale is not disclosed.

the_arena:
  nature: >-
    The dungeon itself. A genuine pre-civilizational structure —
    stone, torchlight, running water, shadows with teeth — that the
    Network has leased from a party nobody can quite identify at a
    rate nobody can quite audit. Walls are walls. Corridors are
    corridors. Rooms are rooms. The Network has wedged cameras into
    sconces, bolted speaker grilles into keystones, and hung drones
    from ceilings high enough that contestants rarely think to look
    up. None of that infrastructure changes what the dungeon is.
    Contestants who stop reading the overlay and start reading the
    stone often find that the stone has a lot to say.
  what_resets: >-
    Cosmetic: room dressing, sponsor stickers, trap recharging,
    monster spawn-state, achievement plaque counts. Automatic:
    between episodes, while the broadcast is on ad rotation,
    maintenance crews sweep through. What the party did remains, in
    theory — but the Network's editors may quietly scrub a player's
    clever trick so the next party can fall for the same trap. This
    is a minor sore point with the crews, several of whom are
    Unaired sympathizers.
  what_persists: >-
    Named Stalker deaths (which are expensive — a Stalker requires
    full re-casting and re-merchandising). The Host's memory (he
    notices if you come back). The dungeon's memory (it notices
    harder). The Unaired's hideouts in the crawlspace (off-feed,
    off-book, off-limits to the Network). The contestant's own body,
    for better or worse.
  geography_of_the_dungeon: >-
    The Drop is the intake — a stone pit at the bottom of the
    summoning shaft. The Knave's Grotto is the first proper room,
    where the scene's opening fight lives. The Gauntlet is the trap
    corridor. The Rest Stop is the dungeon's one safe room — no
    cameras, no drones, no Host. The Boneyard Bazaar is Brann's
    shop, the save point. The Maintenance Crawlspace is the liminal
    service labyrinth where the Unaired live and the Network can't
    see. The Director's Cell is the Host's private chamber; it is,
    contractually, off-limits. The Scrying Pool is the dungeon's
    own divination chamber, which the Network has colonised with
    broadcast kit without quite understanding what the pool is.

the_bazaar_economy:
  currency: >-
    PrimeBux™. An in-show scrip denominated in audience-attention
    units. Earned by playing to the camera, spent at the Boneyard
    Bazaar. The currency does not convert to anything outside the
    dungeon. Contestants who try to take their PrimeBux home
    discover, at the extraction portal, that they crumble into
    sponsored flyers.
  what_you_can_buy: >-
    A plushie of yourself. A plushie of the monster that almost
    killed you. A t-shirt featuring your most-recent mistake, printed
    with your own catchphrase (whether or not you actually have one).
    A coffee mug. A signed headshot of any Stalker, priced by threat
    level. A key that may or may not fit the next door. A hint about
    the next Stalker (expensive). Torches. Ten feet of rope. A
    potion labeled in an alphabet Brann will not translate.
  the_save_mechanic: >-
    Bazaar visits serve as save points. The purchase of a
    commemorative item at Brann's counter timestamps the current run
    for recovery purposes. The Network insists this is merely
    memorabilia. The contestants who have tested it disagree,
    quietly. Brann does not comment.
  concerning_detail: >-
    The Boneyard Bazaar occasionally stocks merchandise of
    contestants who have not yet been summoned. The Network swears
    these are production errors. The Unaired have opinions about
    this. Brann continues not to comment.
