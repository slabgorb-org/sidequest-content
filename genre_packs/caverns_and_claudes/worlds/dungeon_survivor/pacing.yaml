# Dungeon Survivor — Pacing Configuration
# Ratings-aware escalation. Three acts mapped to the room progression.
# Forced Ad Break cadence is every 7-12 scenes (roll internally).
#
# The tension architecture follows a three-act structure:
#   Act 1 (Upper Ring): The Premiere — the first rooms, faster cuts,
#          higher light, lower lethality. The Host is at full power
#          and the broadcast overlay is thick.
#   Act 2 (Mid-Ring): Sweeps — mid-tier Stalkers, Forced Ad Break
#          overlays, rotating threats, the party visibly on-brand.
#   Act 3 (Underside): The Finale — crawlspace, Director's Cell,
#          Scrying Pool. The overlay thins. The Host is off-mic. The
#          dungeon's older voice gets closer to the surface.

sentence_delivery_min: 0.35
streaming_delivery_min: 0.75
escalation_streak: 3

# commercial_break_cadence: every 7-12 scenes (honored by the commercial_break trope)

levels:

  - id: level_1_stage
    name: "Upper Ring (Act I)"
    pacing_mode: spectacle
    beat_tempo: fast
    description: >-
      Act I is the Premiere. Torches dripping orange light, drones
      humming at close range, audience primed for maximum engagement.
      The Host is operating at full charisma through the speaker
      grilles — his warmth is actually convincing at this tier, and
      the mistaken-identity titles land on an audience ready to
      believe. Combat is showy rather than lethal. Product placement
      is soft: a sticker on a chest, a logo flickering on a plaque.
      The Promo arrives on cue. The tempo is deliberate and quick:
      keep scenes short, cut on decisions, smash-cut to the next beat.
    narrator_guidance: >-
      Cut fast. Every paragraph is a shot. Open on establishing
      detail (stone, torch, drone, plaque), land on a decision, cut
      away. The Host's voice is in the scene constantly through the
      speaker grille — describe his presence without necessarily
      quoting him every time. The audience is audible only as a
      distant bleed through the grilles — use it for emphasis. Lean
      into the overlay aesthetic: a drone drifts in close, a plaque
      chimes an achievement, a sponsor sticker catches the torchlight.
      Establish mistaken identity early. Let PCs feel the gap between
      their real self and their stage title. Don't linger on dread —
      this is variety-show tempo, and dread is a Sweeps concern.
      When in doubt, introduce a sponsor sticker.
    tension_range: [0.3, 0.6]
    resource_pressure: low
    combat_frequency: moderate
    exploration_weight: 0.4

  - id: level_2_arena
    name: "Mid-Ring (Act II)"
    pacing_mode: escalating
    beat_tempo: fast
    description: >-
      Act II is Sweeps. Mid-tier Stalkers rotate through rooms, each
      with their own entrance cue and each trying to earn their slot.
      The audience is restless — they want a climax. Sponsor pressure
      increases; every scene has a sponsor mention and every third
      scene has a product. Forced Ad Breaks begin landing without
      warning — the room's plaques multiply, the drones pack the
      ceiling, the overlay drops across whatever the party was
      doing. The Host is working harder now, and the party is
      expected to hold the screen. This is the show's working middle:
      dangerous but ratings-rewarding.
    narrator_guidance: >-
      Maintain fast tempo, but introduce friction. Stalker entrances
      are setpieces — describe the speaker-grille cue, the torchlight
      shift, the distant hush of the bleed audio. Sponsor
      interventions should feel organic — a sticker-branded product
      in a scene's background before it's a plot point. Forced Ad
      Breaks are scene-overlays — slow tempo briefly as the room's
      furniture multiplies around the party, then snap back when the
      ad resolves. Introduce Unaired rumor here — a pamphlet left by
      a stagehand, a note pushed under the Rest Stop door, graffiti
      in the Crawlspace. The party should feel watched. The drone
      should feel close. The Host should start to edge into the
      scene rather than simply announce it.
    tension_range: [0.5, 0.8]
    resource_pressure: moderate
    combat_frequency: frequent
    exploration_weight: 0.5

  - id: level_3_backstage
    name: "Underside (Act III)"
    pacing_mode: revelatory
    beat_tempo: variable
    description: >-
      Act III is the Finale. Tempo varies — the Network's late-game
      enforcement (HR Suits, THE LEGAL DEPARTMENT) creates
      high-tension set-pieces, but the Director's Cell scene is
      deliberately slow and intimate. THE FRANCHISE's silent entrance
      breaks tempo entirely. The audience is on the edge of their
      seats. The Host's mask slips in private moments — particularly
      in the Director's Cell, where no drone can film him and only
      the party (and the dungeon) can see. The party's choices begin
      to produce consequences that are narrative rather than
      mechanical. The bargain opens. The backdoor through the
      Crawlspace to the Scrying Pool is findable. The season ends
      four ways, depending on what the party has built.
    narrator_guidance: >-
      Slow down for the Director's Cell. Speed up for the Suits.
      Silence for THE FRANCHISE. Let quiet scenes breathe — the
      party's earned it. Describe the dungeon's own voice in Act
      III: the stone hums differently in the Crawlspace, the
      Scrying Pool's surface shifts when looked away from, the
      Director's Cell mirror refuses to reflect the cameras the
      Network has installed. The Host, privately, is a different
      man. His catchphrases land less perfectly. His cope is
      thinning. Let the PCs see what the editors always cut. If the
      party reaches the Scrying Pool, handle it like a heist —
      intimate, methodical, high-stakes. If they win, let them win
      loudly. If they bargain, let it feel earned.
    tension_range: [0.4, 0.9]
    resource_pressure: variable
    combat_frequency: variable
    exploration_weight: 0.4
