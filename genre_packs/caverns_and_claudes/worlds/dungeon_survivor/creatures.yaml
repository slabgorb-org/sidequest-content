# Dungeon Survivor — Creature Bestiary
# The Network's talent roster plus the dungeon's actual ecology.
# Every creature here is either a genuine dungeon resident the Network
# has put a sponsor patch on, or a paid Stalker the Network has dropped
# in from its own roster. The monsters eat. The traps kill. The
# broadcast overlays.

creatures:

  # === TIER 1: SET DRESSING (Non-combat / environmental) ===

  - id: stagehand_crew
    name: Stagehand Crew
    description: >-
      A union crew of three to five short-tempered goblins, kobolds,
      or ogre-descended technicians resetting traps between takes.
      They wear name tags. They carry lunch pails, tool belts, and
      clipboards. They are not hostile by default — they are here
      to do a shift and go home. Engaging them in combat is a labor
      violation. They will file.
    threat_level: 1
    morale: steady
    hp: 6
    max_hp: 6
    ac: 11
    damage: "1d4 (wrench, improvised)"
    abilities:
      - name: Union Protection
        description: >-
          If attacked without cause, the crew takes no action
          beyond sounding a grievance-horn. Within two rounds, a
          Network HR Representative apparates to serve paperwork.
          The party has larger problems now.
      - name: Work Pause
        description: >-
          On a whim, a crew can simply stop working mid-task.
          Traps go un-reset. Lights stay dark on a cue. The
          Host's catchphrases land in silence. Useful, if
          negotiated.
    loot:
      - description: "A crumpled union pamphlet (Safe Workplace Conduct, Rev. 47)"
      - description: "One wrench. Iron. Standard-issue. Worth 1 PrimeBux."
    tags: [level_1, neutral, union, primetime_crew]
    rooms: [the_rest_stop, the_maintenance_crawlspace, the_gauntlet]
    notes: >-
      First-line rule: don't hit them. Second-line rule: tip them.

  - id: prop
    name: Animate Prop
    description: >-
      Set dressing that was built to look dangerous and turned out
      to actually be. A chandelier that swings on its own. A
      wedding cake full of daggers. A couch that eats ankles.
      Props vary wildly in threat — some are just squeaky and
      fall over, others have been in the rotation for seven
      seasons and have acquired hunger.
    threat_level: 2
    morale: mindless
    hp: 8
    max_hp: 8
    ac: 14
    damage: "1d6 (bludgeon or impale, depending on prop)"
    abilities:
      - name: Set Dressing
        description: >-
          The prop blends in until engaged. Players who are not
          paying attention to scenery take a -2 on surprise rolls
          when a prop activates.
      - name: Scripted Timing
        description: >-
          Props tend to attack on applause cues, laugh-track
          swells, or catchphrase deliveries. A party that tracks
          the audio can sometimes predict the strike window.
    loot:
      - description: "Splinters of sponsored lumber (worthless, unless bagged as merch)"
      - description: "One prop weapon, now broken. 1-in-6 it was real."
    tags: [level_1, environmental, scripted]
    rooms: [the_drop, the_knaves_grotto, the_directors_cell]
    notes: >-
      The prop class is a flavor wrapper for environmental hazards.
      Swap the specifics per room.

  - id: fan_swarm
    name: Fan Swarm
    description: >-
      A mob of superfans who have broken through the security line
      and are rushing the set for selfies, autographs, proposals
      of marriage, or — if trending is down — pitchforks. Fan
      Swarms are morale-based. Their behavior depends entirely on
      whether the party is currently a crowd favorite.
    threat_level: 3
    morale: fanatic
    hp: 12
    max_hp: 12
    ac: 10
    damage: "1d4 (grab, shove, selfie-stick concussion)"
    abilities:
      - name: Trend-Gated Hostility
        description: >-
          If trending up, the swarm is non-hostile — they block
          the party with adoration (grab, selfie, kiss) rather
          than harm. If trending down, they attack with whatever
          is in their bags. Mechanical effect toggles on the
          current ratings state.
      - name: Signature Obsession
        description: >-
          A fan swarm focuses its attention on one party member
          — the one with the highest audience affinity. That
          member is either protected (trending up) or swarmed
          (trending down). Either way, they are the focus.
      - name: Crowd Cover
        description: >-
          Entering a swarm grants a brief stealth benefit at the
          cost of dignity. Difficult to track a contestant
          through a selfie cluster.
    loot:
      - description: "A handful of autograph-seeking pens (worthless, charming)"
      - description: "A half-eaten branded snack (sponsored)"
      - description: "A fan's notebook of continuity errors (useful)"
    tags: [level_1, populist, morale_based, primetime_crew]
    rooms: [the_knaves_grotto, the_boneyard_bazaar, the_drop]
    notes: >-
      Wiring: the `fan_ambush` trope triggers Fan Swarm encounters.

  - id: ad_spirit
    name: Ad Spirit
    description: >-
      A commercial-dimension entity that manifests during or near
      a Forced Ad Break. Ad Spirits have a sponsor and a pitch.
      They are cheerful, insistent, and bound by brand law —
      they cannot lie about the product but they can distort the
      truth in ways that would make a lawyer weep with joy.
      They attack by engagement: every interaction with an Ad
      Spirit is a sales pitch with consequences.
    threat_level: 2
    morale: steady
    hp: 10
    max_hp: 10
    ac: 12
    damage: "1d4 (persuasion damage, morale drain)"
    abilities:
      - name: The Pitch
        description: >-
          The Ad Spirit opens with a ninety-second sponsored
          pitch. Players who listen take morale damage but gain
          a sponsor-ally buff. Players who refuse to listen
          trigger the pitch's combat phase.
      - name: Skip Button
        description: >-
          The Ad Spirit can be dismissed by paying the sponsor's
          skip fee in PrimeBux. Cost varies by Spirit tier.
      - name: Product Placement
        description: >-
          If defeated, an Ad Spirit drops a sponsored product.
          The product does one useful thing and one
          unexpected-clause thing. Read the fine print.
    loot:
      - description: "A sponsored product (variable; consult sponsor manifest)"
      - description: "A stack of PrimeBux coupons (expire unpredictably)"
    tags: [level_2, commercial, sponsor_bound]
    rooms: [the_knaves_grotto, the_gauntlet, the_boneyard_bazaar]
    notes: >-
      Wiring: the `commercial_break` and `sponsor_intervention`
      tropes spawn Ad Spirits.

  - id: network_suit
    name: Network Suit
    description: >-
      An HR representative's apparition. Beige suit, clipboard,
      fixed smile, voice that sounds slightly pre-recorded. Not
      a physical being in the conventional sense — hitting it
      is like hitting a legal document. They do not tire. They
      do not bleed. They carry paperwork that, once signed,
      binds both parties in ways that are not adjudicable in
      the arena.
    threat_level: 4
    morale: corporate
    hp: 18
    max_hp: 18
    ac: 15
    damage: "1d6 (clause, binding)"
    abilities:
      - name: Binding Clause
        description: >-
          On hit, the target must spend the next round complying
          with a specific corporate policy (no weapons in lobby,
          no running in the arena, mandatory audience-facing
          posture). Failure to comply triggers a second clause.
      - name: Paperwork Counterattack
        description: >-
          Standard attacks roll at disadvantage against a Suit.
          The weakness is loopholes — a party member who
          verbally identifies a clause the Suit has misquoted
          can force it to retract the strike.
      - name: Severance
        description: >-
          Once per encounter, the Suit can attempt to "terminate"
          a contestant's participation. The attempt manifests as
          an actual termination packet with a signature line.
          Signing ends the contestant's season. Refusing
          requires a difficult morale save.
    loot:
      - description: "A termination packet (blank, usable as leverage)"
      - description: "A ballpoint pen (Network-issue, heavy)"
      - description: "A binding clause that can be invoked against the Network"
    tags: [level_2, corporate, administrative]
    rooms: [the_rest_stop, the_directors_cell, the_scrying_pool]
    notes: >-
      Suits are the Network faction's muscle. They show up when
      the party steps on a clause they didn't know existed.

  # === TIER 2: STALKERS (Named celebrity monsters) ===

  - id: promo
    name: THE PROMO
    description: >-
      The season-opening warm-up Stalker. A mid-career aspirational
      monster in a slightly-too-tight costume, sponsored by the
      next Stalker on the bill. He is trying very hard. His
      entrance music is good. His attacks are telegraphed. He
      will die in this scene — that is the scene's entire point
      — and he is going to die giving one hundred and ten percent
      because he thinks this is his break. The audience finds him
      endearing, which is the other thing the scene is for.
    threat_level: 3
    morale: desperate
    hp: 14
    max_hp: 14
    ac: 13
    damage: "1d6 (themed weapon, earnest)"
    abilities:
      - name: Entrance Music
        description: >-
          PROMO enters to a full musical cue. The first round of
          combat, his attacks are at +1 and he narrates each
          strike with his own hype lines. After round one, the
          cue fades and he's just a guy with a costume.
      - name: Tutorial Monologue
        description: >-
          PROMO will, if allowed, explain the arena's basic
          mechanics to the party mid-fight. Each monologue turn
          is wasted on his side; players who listen pick up
          one useful piece of tutorial information.
      - name: Heart of Gold
        description: >-
          If the party shows mercy, PROMO turns into a one-time
          ally for the current scene. He will escort them to
          the next room and leave. If they kill him hard, he
          drops merch; if they kill him gently, he drops a
          note he meant to give his mother.
    loot:
      - description: "A signed PROMO plushie (moves at the Boneyard Bazaar)"
      - description: "A headshot with a hopeful smile"
      - description: "His signature prop weapon (looks dangerous, was real)"
    tags: [stalker, boss, celebrity, primetime_crew, warmup]
    rooms: [the_drop, the_knaves_grotto]
    notes: >-
      Scene-one Stalker. Both outcomes (merciful/brutal) shift
      audience disposition; see trope `mistaken_identity` for
      the ratings fork.

  - id: mother_in_law
    name: MOTHER-IN-LAW
    description: >-
      A sitcom-reheated monstrosity in costume jewelry and a
      laugh track. She is perpetually disapproving and her
      voice carries. A live studio laugh-track follows her
      everywhere. She will comment on your appearance, your
      choices, your career, and the state of your shoes. The
      laugh track laughs at her jokes even when they aren't
      jokes, which is how you know you're in a fight.
    threat_level: 5
    morale: inherited
    hp: 24
    max_hp: 24
    ac: 14
    damage: "1d6 (handbag, disapproving gaze)"
    abilities:
      - name: Persistent Disapproval
        description: >-
          Each round, she selects a party member and delivers a
          pointed critique. That member takes -1 on their next
          roll and suffers a morale debuff until someone
          verbally redirects the conversation in-character.
      - name: Laugh Track
        description: >-
          Her laugh track applauds her every action. On
          defensive rounds, the laugh track grants her +1 AC.
          On offensive rounds, it grants her +1 to hit. The
          track can be disrupted by a very loud counter-joke
          (requires player creativity, GM adjudicates).
      - name: Holiday Gathering
        description: >-
          Once per encounter, she can summon a table. Everyone
          must sit at it. She serves a meal nobody wants to
          eat. Leaving the table costs a morale save.
    loot:
      - description: "A costume-jewelry brooch (gaudy, expensive)"
      - description: "A signed cookbook (recipes are violations)"
      - description: "A handbag (heavy, contains unknown objects)"
    tags: [stalker, boss, celebrity, sitcom, morale_pressure]
    rooms: [the_rest_stop, the_knaves_grotto, the_boneyard_bazaar]
    notes: >-
      Morale-drain Stalker. Parties without a strong in-character
      speaker will struggle.

  - id: sublime
    name: SUBLIME
    description: >-
      The ice-assassin Stalker. Whispers rather than speaks.
      Sponsored by Glacidew™ Premium Spring Water — her
      cross-branded skincare line is available at the Boneyard Bazaar.
      She attacks from ductwork, air vents, and catering-cart
      cooler compartments. Kills contestants while offering
      unsolicited skincare advice. Her exit music is a chime.
    threat_level: 5
    morale: composed
    hp: 22
    max_hp: 22
    ac: 15
    damage: "1d8 (sparkling ice-shard dagger)"
    abilities:
      - name: Subzero Aura
        description: >-
          Within 10 feet of SUBLIME, all party actions are at
          disadvantage on dexterity checks. The air tastes of
          artificial glacier.
      - name: Ductwork Ambush
        description: >-
          SUBLIME can reposition once per encounter into any
          adjacent vent, duct, or cooler compartment. Line of
          sight breaks. Next turn she emerges behind a party
          member with a new dagger and a compliment on their
          skincare routine.
      - name: Sponsored Endorsement
        description: >-
          On hit, SUBLIME recommends a Glacidew™ product. If
          the target agrees to purchase (PrimeBux cost), they
          regain 1d4 HP and take a branded debuff. If they
          refuse, the damage doubles next round.
    loot:
      - description: "A sparkling ice-shard dagger (+1, stylish, freezes rations)"
      - description: "A Glacidew™ gift basket (products, coupons, a chilled robe)"
      - description: "A signed SUBLIME skincare catalog"
    tags: [stalker, boss, celebrity, assassin, sponsor_bound]
    rooms: [the_rest_stop, the_gauntlet, the_maintenance_crawlspace]
    notes: >-
      Sponsored Stalker. SUBLIME's scene typically includes a
      forced product-placement beat.

  - id: buzzkill
    name: BUZZKILL
    description: >-
      A chainsaw-wielding stand-up comedian. Seven feet tall,
      open-mic-night outfit, chainsaw that has its own name.
      He only attacks on the punchline. The chainsaw is the
      punchline. The jokes are, by and large, not good. The
      setup is long. The setup is deadly if you don't know
      the rhythm. A party that listens carefully can survive
      BUZZKILL without taking a scratch. A party that
      interrupts him becomes the punchline.
    threat_level: 6
    morale: stubborn
    hp: 28
    max_hp: 28
    ac: 14
    damage: "2d6 (chainsaw, punchline)"
    abilities:
      - name: The Punchline
        description: >-
          BUZZKILL attacks only on the beat of a joke's
          punchline. Players who identify the rhythm can dodge
          with +2. Players who don't eat the full attack.
      - name: Set Protection
        description: >-
          Interrupting BUZZKILL mid-setup triggers a defensive
          buff — the chainsaw roars up to full RPM and his AC
          improves by 3 until the end of the bit.
      - name: Roasting
        description: >-
          Between jokes, BUZZKILL can single out a party
          member for a personalized roast. The roast is
          uncomfortably accurate. Morale save or take a -1
          on the next action.
    loot:
      - description: "The chainsaw (still idling, needs fuel)"
      - description: "A notebook of bad jokes (occasionally funny)"
      - description: "A press photo from his open-mic days"
    tags: [stalker, boss, celebrity, comedy, rhythm_combat]
    rooms: [the_knaves_grotto, the_gauntlet]
    notes: >-
      Rhythm-combat Stalker. Parties that hit on-beat deal max
      damage; off-beat attackers suffer the penalty.

  - id: dynamo
    name: DYNAMO
    description: >-
      Eight feet of singing synthpop in electrified spandex. He
      attacks strictly to the beat of his own backing track. The
      arena lights strobe. The audience chants his chorus. His
      voice is, objectively, pretty good. His dance moves are
      coordinated with his fist strikes in a way that is both
      terrifying and choreographically impressive. He has his
      own music video. It's on at the Boneyard Bazaar.
    threat_level: 6
    morale: theatrical
    hp: 26
    max_hp: 26
    ac: 15
    damage: "1d8 (electrified fist, on beat)"
    abilities:
      - name: Rhythmic Assault
        description: >-
          DYNAMO's attacks are entirely predictable — on every
          fourth beat of his current track. The track is
          audible to the party. This should be a mercy. The
          lights, however, are not.
      - name: Strobe Lights
        description: >-
          The arena lights strobe in time with DYNAMO's track.
          All party members are at -1 on visual perception
          checks. Reading the room, identifying hazards, and
          tracking Stalker movement all suffer.
      - name: Drop the Beat
        description: >-
          Once per encounter, DYNAMO can cue a bass drop. The
          next attack deals +1d8 damage. Party members with a
          musical background (or a d6 save) can catch the cue
          and evade.
    loot:
      - description: "A piece of electrified spandex (still buzzing)"
      - description: "A CD of his latest single (sponsored)"
      - description: "A branded microphone (functional, loud)"
    tags: [stalker, boss, celebrity, electropop, visual_tax]
    rooms: [the_knaves_grotto, the_directors_cell]
    notes: >-
      Visual-attention-tax Stalker. Players who can hear but not
      see have a surprising advantage.

  - id: ad_breaks
    name: AD BREAKS
    description: >-
      A commercial-spirit monster in Stalker tier. He manifests as a
      broadcast overlay on the party's current room — brass plaques
      multiply on the walls, camera drones pack the ceiling, a
      thirty-second sponsor pitch plays at unskippable volume, and a
      figure in a too-clean suit steps out of the glare. The stone
      beneath is still the stone of whatever room they were in; the
      dungeon's own monsters pause politely for the ad, which is in
      the lease. AD BREAKS cannot be reasoned with but he can,
      technically, be skipped (at a cost). He is sponsored by nobody
      in particular; his brand is the ad break as a concept. He has
      been on the roster since Season Four.
    threat_level: 6
    morale: inevitable
    hp: 30
    max_hp: 30
    ac: 16
    damage: "2d4 (branding, interruption)"
    abilities:
      - name: Broadcast Overlay
        description: >-
          AD BREAKS's entrance pauses the current scene and blankets
          the room in broadcast furniture — multiplying plaques,
          swarming drones, sponsor banners draped over stone. The
          dungeon's own inhabitants step back for the duration. The
          Host has no authority while the overlay holds. Combat
          resumes in the same physical room, visually transformed.
      - name: Skip Fee
        description: >-
          Party members can attempt to skip the encounter by
          paying 5d6 PrimeBux, pooled. If paid, AD BREAKS
          dissolves, the overlay drops, and the scene resumes. If
          not, combat continues.
      - name: Product Placement Strike
        description: >-
          On hit, AD BREAKS attaches a temporary sponsor-brand
          tattoo to the target. The tattoo grants +1 AC but
          applies a permanent-for-this-session affinity penalty
          with the Unaired.
    loot:
      - description: "A handful of skip-fee coupons (expire in two scenes)"
      - description: "A sponsored product voucher (random brand)"
      - description: "A shard of broadcast overlay (harmless, unnerving)"
    tags: [stalker, boss, celebrity, commercial, sponsor_bound]
    rooms: [the_knaves_grotto, the_gauntlet, the_boneyard_bazaar, the_drop]
    notes: >-
      Can manifest in any broadcast-active room (everywhere except
      the Rest Stop, Maintenance Crawlspace, and Director's Cell).
      Wired to the `commercial_break` trope's escalation tier.

  - id: legal_department
    name: THE LEGAL DEPARTMENT
    description: >-
      A three-headed bureaucrat Stalker in a charcoal suit.
      Briefcases, not weapons. Speaks in clauses. Attacks by
      citing subsection numbers. Cannot be defeated by combat —
      only by signing the correct paperwork in the correct
      order, and the paperwork is live-updating. The heads argue
      with each other in legalese, which is sometimes exploitable.
      Represents the Network's endgame enforcement capacity.
    threat_level: 7
    morale: unassailable
    hp: 36
    max_hp: 36
    ac: 18
    damage: "2d6 (binding clause, administrative damage)"
    abilities:
      - name: Clause and Counterclause
        description: >-
          Each of THE LEGAL DEPARTMENT's three heads can cite
          one binding clause per round. The clauses stack. Party
          members under three clauses suffer a compounding -3
          on all actions. Dissolving a clause requires identifying
          a contradicting clause.
      - name: Live-Updating Paperwork
        description: >-
          Defeating THE LEGAL DEPARTMENT requires signing a
          specific document. The document rewrites itself each
          round. Reading the current revision, identifying the
          signature line, and signing it is a three-round puzzle.
      - name: Loophole
        description: >-
          If a party member verbally identifies a loophole
          ("you are not authorized to make this demand during a
          Forced Ad Break"), the encounter ends immediately.
          The loophole must be genuine.
    loot:
      - description: "A legally-binding signed document (usable against the Network)"
      - description: "Three briefcases (empty, imposing)"
      - description: "A charcoal suit (size XL, fits nobody)"
    tags: [stalker, boss, celebrity, bureaucracy, puzzle_combat]
    rooms: [the_scrying_pool, the_directors_cell]
    notes: >-
      Puzzle-combat Stalker. Combat-only parties will struggle.
      Parties with a verbally adept member can win in one round.

  - id: the_franchise
    name: THE FRANCHISE
    description: >-
      The Stalker who used to be a contestant. Won Dungeon Survivor
      twelve seasons ago. Never left. Now he is a legacy-act
      trap-laying monster, tired and dangerous and a little bit
      on the party's side when no one is looking. His perfume
      line is still in the Boneyard Bazaar. He has won seven Audience
      Favorite awards. He has stopped accepting them. His entrance
      is the only one without music — he walks into a scene in
      silence and the audience goes still. Even the Host is quiet
      when he's on camera. If the party reaches the finale, this
      is the Stalker they face. He does not want to fight them.
      He is contractually obligated.
    threat_level: 9
    morale: weary
    hp: 48
    max_hp: 48
    ac: 17
    damage: "2d8 (anything he picks up, competently)"
    abilities:
      - name: Legacy Traps
        description: >-
          THE FRANCHISE has been in the arena long enough to
          have left traps in every scene. At the start of an
          encounter, the GM can trigger one previously-seeded
          trap that the party has walked past in earlier
          sessions. The trap has been waiting.
      - name: Silent Entrance
        description: >-
          No music cue. No announcement. He is simply there.
          The party takes a surprise round unless they have
          read the Boneyard Bazaar signage (hint available).
      - name: Off-Script Whisper
        description: >-
          Once per encounter, between beats, THE FRANCHISE can
          quietly tell the party a true thing about the arena,
          the Host, or the Network. The audience does not hear
          it. The whisper is one sentence. It is load-bearing.
      - name: I Have Been Here Too Long
        description: >-
          If a party member sincerely offers THE FRANCHISE a
          way out — not a bargain, an actual offer — he hesitates.
          The encounter's resolution forks. See `openings.yaml`
          `the_bargain` for the finale-hook.
    loot:
      - description: "His signature sword (well-maintained, real)"
      - description: "A sealed bottle of THE FRANCHISE perfume (Season 12 vintage)"
      - description: "A signed headshot from his winning season (the smile is different)"
      - description: "A note in his handwriting, folded small"
    tags: [stalker, boss, celebrity, finale, legacy, unaired_sympathizer]
    rooms: [the_directors_cell, the_scrying_pool, the_maintenance_crawlspace]
    notes: >-
      Finale Stalker. His scene is the season's climax. Combat
      resolution is not the only resolution — sometimes not even
      the best one. Coordinate with the `mistaken_identity` and
      `audience_vote` tropes and the Director's Cell bargain.
