# Caverns & Claudes — random equipment tables (WWN-verbatim genre baseline)
#
# Consumed by CharacterBuilder when a character creation scene declares
# `equipment_generation: random_table` in its mechanical_effects (see `the_kit`
# scene in char_creation.yaml).
#
# Each slot lists candidate item_ids. The builder rolls one item per slot
# during character creation (or `rolls_per_slot` override). Every id must
# exist in inventory.yaml item_catalog — the wiring test enforces this.
#
# Story 31-3: wire equipment_generation random_table in CharacterBuilder.
# Replaces the hardcoded `starting_equipment.Delver` list at inventory.yaml:294.
#
# Story 120-1 (ADR-145): the genre baseline is now 100% WWN-SRD-verbatim, so every
# id here is a `wwn_*` catalog item. The dungeon-flavor gear the old kit carried
# (ten_foot_pole, chalk, lockpicks, the recovered-pages spellbook prop,
# component_pouch, helmet_iron, and the heal potion) has NO WWN SRD analog and now
# lives at the WORLD tier (worlds/beneath_sunden/inventory.yaml, mode=bespoke). The
# beneath_sunden world equipment_tables.yaml merges those items back into these
# kits world-over-genre (per-slot APPEND) via resolve_equipment_tables
# (story 120-4, ADR-140).

tables:
  weapon:
    - wwn_dagger
    - wwn_sword_short
    - wwn_mace
    - wwn_spear_light
    - wwn_axe_hand
  armor:
    - wwn_linothorax
    - wwn_small_shield
  light:
    - wwn_torch
  consumable:
    # Story 106-4: the heal potion moved out of the random pool into
    # guaranteed_grants. The Potion of Mending has no WWN analog, so its guarantee
    # lives at the world tier (worlds/beneath_sunden/equipment_tables.yaml).
    - wwn_rations_one_week
    - wwn_waterskin_one_gallon
  utility:
    - wwn_rope_50ft
    - wwn_iron_spikes_10
    - wwn_crowbar
    - wwn_sack
    - wwn_oil_one_pint

# Override the default 1-roll-per-slot for bulk items. Mirrors the old
# hardcoded Delver loadout (3 torches, 2 rations + 1 other, 3 utility picks).
rolls_per_slot:
  light: 3
  consumable: 3
  utility: 3

# Class-themed kits — consumed by `equipment_generation: class_kit`.
# Each ClassDef.kit_table in classes.yaml resolves to one block here.
# Slots match the top-level `tables:` slot names so rolls_per_slot
# applies consistently.
# Re-keyed for the WWN Callings (2026-06-12 port): fighter_kit→warrior_kit,
# thief_kit→expert_kit; cleric_kit retired with the class. Story 120-1 repointed
# every id to the WWN-verbatim catalog (leather_armor→wwn_linothorax AC 13,
# shield_wood→wwn_small_shield, hand_axe→wwn_axe_hand, …); the dungeon-flavor
# utility items (spellbook/component_pouch/chalk/lockpicks/ten_foot_pole) and the
# iron helm now arrive from the beneath_sunden world override.
class_tables:
  warrior_kit:
    weapon: [wwn_sword_long, wwn_sword_short, wwn_mace, wwn_axe_hand, wwn_spear_light]
    armor:  [wwn_linothorax, wwn_small_shield]
    light:  [wwn_torch]
    consumable: [wwn_rations_one_week, wwn_waterskin_one_gallon]
    utility: [wwn_rope_50ft, wwn_iron_spikes_10]

  mage_kit:
    weapon: [wwn_dagger, wwn_staff]
    armor:  []
    light:  [wwn_torch]
    consumable: [wwn_rations_one_week, wwn_waterskin_one_gallon]
    # spellbook (recovered-pages prop), component_pouch, and chalk are world-tier
    # bespoke — appended by worlds/beneath_sunden/equipment_tables.yaml.
    utility: []

  expert_kit:
    weapon: [wwn_dagger, wwn_sword_short]
    armor:  [wwn_linothorax]
    light:  [wwn_torch, wwn_oil_one_pint]
    consumable: [wwn_rations_one_week, wwn_waterskin_one_gallon]
    # lockpicks, ten_foot_pole, and chalk are world-tier bespoke — appended by
    # worlds/beneath_sunden/equipment_tables.yaml.
    utility: [wwn_sack]

# Story 106-4: every character starts with exactly one heal potion (decision Keith
# 2026-06-13: "everyone gets one"), with a 30% chance it's the better Potion of
# Mending (Greater) instead. The Potion of Mending has no WWN SRD analog (it is
# world-tier bespoke), so the guarantee lives at the world tier
# (worlds/beneath_sunden/equipment_tables.yaml) and is merged in world-over-genre.
# The WWN-pure genre baseline grants nothing.
guaranteed_grants: {}
