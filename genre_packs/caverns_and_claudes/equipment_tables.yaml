# Caverns & Claudes — random equipment tables
#
# Consumed by CharacterBuilder when a character creation scene declares
# `equipment_generation: random_table` in its mechanical_effects (see `the_kit`
# scene in char_creation.yaml).
#
# Each slot lists candidate item_ids. The builder rolls one item per slot
# during character creation (or `rolls_per_slot` override). Every id must
# exist in inventory.yaml item_catalog — the wiring test enforces this.
#
# Story 31-3: wire equipment_generation random_table in CharacterBuilder.
# Replaces the hardcoded `starting_equipment.Delver` list at inventory.yaml:294.

tables:
  weapon:
    - dagger_iron
    - sword_short
    - mace_iron
    - spear
    - hand_axe
  armor:
    - leather_armor
    - shield_wood
    - helmet_iron
  light:
    - torch
  consumable:
    - rations_day
    - waterskin
    - potion_healing
  utility:
    - rope_hemp
    - ten_foot_pole
    - iron_spikes
    - chalk
    - crowbar
    - sack_large
    - lantern_oil

# Override the default 1-roll-per-slot for bulk items. Mirrors the old
# hardcoded Delver loadout (3 torches, 2 rations + 1 other, 3 utility picks).
rolls_per_slot:
  light: 3
  consumable: 3
  utility: 3

# Class-themed kits — consumed by `equipment_generation: class_kit`.
# Each ClassDef.kit_table in classes.yaml resolves to one block here.
# Slots match the top-level `tables:` slot names so rolls_per_slot
# applies consistently.
# Re-keyed for the WWN Callings (2026-06-12 port): fighter_kit→warrior_kit,
# thief_kit→expert_kit; cleric_kit retired with the class. Kit CONTENTS are
# unchanged (no retuning) — the mage's "spellbook" utility item is the
# physical recovered-pages prop, not the retired B/X spellbook.yaml surface.
class_tables:
  warrior_kit:
    weapon: [sword_long, sword_short, mace_iron, hand_axe, spear]
    armor:  [leather_armor, shield_wood, helmet_iron]
    light:  [torch]
    consumable: [rations_day, waterskin, potion_healing]
    utility: [rope_hemp, ten_foot_pole, iron_spikes]

  mage_kit:
    weapon: [dagger_iron, staff_wood]
    armor:  []
    light:  [torch]
    consumable: [rations_day, waterskin, potion_healing]
    utility: [spellbook, component_pouch, chalk]

  expert_kit:
    weapon: [dagger_iron, sword_short]
    armor:  [leather_armor]
    light:  [torch, lantern_oil]
    consumable: [rations_day, waterskin, potion_healing]
    utility: [lockpicks, ten_foot_pole, chalk, sack_large]
