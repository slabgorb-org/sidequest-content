primary: '#5C7A4F'      # mossy green — kirkyard moss, the meadow above the burn
secondary: '#A67B5B'    # warm tea-stained sepia — old paper, brass-and-cream parlour
accent: '#C9A96E'       # honey-gold — late afternoon light through tall windows
background: '#F4EBDA'   # cream — the colour of a tea-room wall in late summer
surface: '#FDF6E8'      # paler cream — the linen on the round table
text: '#2C2417'         # warm brown ink — the colour of a careful hand on a postcard
border_style: light
web_font_family: Lora

dinkus:
  enabled: true
  cooldown: 2
  default_weight: medium
  glyph:
    light: "—  ❧  —"
    medium: "❧ ❧ ❧"
    heavy: "❧ ❧ ❧ ❧ ❧"

session_opener:
  enabled: true
