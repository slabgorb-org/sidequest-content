- id: origins
  title: How Do You Come to the Village?
  narration: |
    The bar of the village inn is half a foot of polished oak that has been
    polished by hands going back to your great-grandmother's time. The fire
    is going. The rain has just eased off. The publican has set down a mug
    in front of you without asking — strong tea, the kind that gets you
    through to supper.

    He wipes his hands on the cloth tucked into his belt. He has the way
    village publicans have of looking at strangers — friendly, unhurried,
    taking your measure for the next ten years.

    "Settling in, then. You'll be wanting your supper before long." He
    folds the cloth. "Where do your people come from?"
  loading_text: "The publican sets a second mug down and listens..."
  choices:
    - label: Old Family Hereabouts
      description: >-
        Your name belongs to this place. Your grandfather is in the
        kirkyard and your aunt is in the second pew. You may have been
        away — school, the regiment, the city — but the village knew you
        as a child and treats you, more or less, as one of its own.
      mechanical_effects:
        race_hint: Gentry
        background: Local
    - label: The Manse or the Surgery
      description: >-
        You were born into a respectable household — the doctor's, the
        minister's, the country solicitor's. Educated, not landed.
        Comfortable rather than wealthy. You learned early that
        professional courtesy opens doors that money cannot.
      mechanical_effects:
        race_hint: Clergy
        background: Professional
    - label: Trade or Distillery
      description: >-
        Your family built something — a mill, a shop, a distillery,
        a chandlery on the coast. The money is recent and was earned.
        The old families are polite to your face and gossip behind it.
        You do not entirely mind.
      mechanical_effects:
        race_hint: Trade
        background: New Money
    - label: The Village Itself
      description: >-
        You are of the place in the truest sense — a crofter, a
        farmhand, a shopkeeper, a railwayman's daughter. You know
        every footpath and which farms hold a grudge. The squire
        nods to you in the lane.
      mechanical_effects:
        race_hint: Servant
        background: Village
    - label: From Down South
      description: >-
        Edinburgh, Manchester, London — you were educated south of the
        line and have come north to work, to recover, or to settle.
        The village is patient with your manners. You are learning
        to be patient with the village.
      mechanical_effects:
        race_hint: Bohemian
        background: Returner
    - label: From Away
      description: >-
        India, the Cape, Canada, the Caribbean — you have lived in
        places these neighbours can barely imagine. You came back
        with stories, a slight tan, and a habit of standing at
        windows that troubles the housekeeper.
      mechanical_effects:
        race_hint: Colonial
        background: Returned
  allows_freeform: true

- id: vocation
  title: What Do You Do for a Living?
  narration: |
    The publican refills your mug without being asked. The fire pops. A
    dog has settled itself across your feet without consulting you on
    the matter.

    "Working folk, then." He says it as observation, not question.
    "There's plenty of work in a village if you've a trade for it. What's
    yours?"
  loading_text: "The publican nods slowly, as though placing you..."
  choices:
    - label: Country Doctor
      description: >-
        Surgery hours posted on the door, house calls across the glen,
        a black bag with brass clasps and a telephone (one of two in
        the village). You enter any household at any hour without
        being asked twice. You have seen everyone in their dressing-
        gown and know what their hands look like when they are lying.
      mechanical_effects:
        class_hint: Doctor
        personality_trait: observant
        vocation: doctor
    - label: Parish Minister
      description: >-
        The manse, the parish register, Sunday twice and Wednesday
        evening, weddings and funerals and the awkward bit in between.
        Church of Scotland by default. You sit with the dying, the
        bereaved, and the merely guilty. People tell you things they
        will tell no one else.
      mechanical_effects:
        class_hint: Clergyman
        personality_trait: discreet
        vocation: minister
    - label: Episcopal Rector
      description: >-
        The small chapel for the recusant families and the laird's
        household when they're in residence. Scottish Episcopal —
        Anglican Communion, small congregation, an outsider's
        eye in your own parish. The Father-Brown sort of clergyman:
        attentive, patient, harder to fool than you look.
      mechanical_effects:
        class_hint: Clergyman
        personality_trait: perceptive
        vocation: rector
    - label: Postmistress
      description: >-
        The post office, the telegraph, the parcel counter. Every
        letter that enters or leaves the village passes through your
        hands. You know who writes to whom, in what frequency, and
        from where. You see the village's correspondence as a single
        long conversation about which you are the only complete witness.
      mechanical_effects:
        class_hint: Society
        personality_trait: attentive
        vocation: postmistress
    - label: Schoolmistress
      description: >-
        The village school, thirty children, the slate and the bell.
        You have taught every adult under forty. You know which
        marriages are going well by what the children draw at break.
        The children tell you things they will not tell their parents.
      mechanical_effects:
        class_hint: Governess
        personality_trait: principled
        vocation: schoolmistress
    - label: Country Veterinary Surgeon
      description: >-
        Large-animal practice across every farm and sporting estate
        in the glen. You see the back kitchen of every household and
        the inside of every byre. You know whose horses are kept
        well and whose are not, and what that says about the rest
        of the household.
      mechanical_effects:
        class_hint: Doctor
        personality_trait: pragmatic
        vocation: vet
    - label: Village Constable
      description: >-
        The county constabulary, one sergeant, one bicycle. Official
        authority that is utterly dependent on village cooperation.
        You know which lies are habitual and which are new. You can
        tell from a man's coat whether his Sunday was where he said
        it was.
      mechanical_effects:
        class_hint: Detective
        personality_trait: methodical
        vocation: constable
    - label: Retired Colonial Officer
      description: >-
        Half-pay, a cottage you are still painting, three months in the
        glen and already restless. India or the Cape or the West
        Indies — you came back with a bad leg, several decorations,
        and an inability to ignore a stranger who does not move like
        a civilian.
      mechanical_effects:
        class_hint: Explorer
        personality_trait: watchful
        vocation: colonel
  allows_freeform: true

- id: eye
  title: What Do You Always Notice?
  narration: |
    The publican is wiping a glass slowly, the way a man does when he is
    listening to something he wants to remember. The fire has settled. The
    dog has begun to snore.

    "Folk in a village," he says, conversational, to the glass rather than
    to you. "They all see different things. The doctor sees hands. The
    minister sees faces. The schoolmistress sees the children of folk who
    haven't said a word." He sets the glass down. "What about you. What
    do you always notice?"
  loading_text: "The publican is no longer wiping the glass..."
  choices:
    - label: What's Out of Place
      description: >-
        The stain on the glove. The chair drawn up to a desk it doesn't
        belong at. The umbrella by the door that doesn't match anyone
        in the house. You see what doesn't fit, and once you've seen
        it you can't stop seeing it.
      mechanical_effects:
        personality_trait: observant
        eye: out_of_place
    - label: What Isn't Said
      description: >-
        The pause before the answer. The subject changed too smoothly.
        The condolence offered to the wrong person. You read silence
        the way other people read newspapers.
      mechanical_effects:
        personality_trait: perceptive
        eye: silence
    - label: The Children
      description: >-
        Children watch everything and tell most of it to whoever asks
        nicely. A child's sudden fear of a particular adult is a fact
        worth its weight. A child's sudden knowledge of a word they
        shouldn't have is a clue.
      mechanical_effects:
        personality_trait: patient
        eye: children
    - label: The Money
      description: >-
        Sudden frugality. Sudden flush. A new hat on a wife whose
        husband is meant to be in debt. A pew rebuilt by a family
        that swore they had nothing. You follow the money because
        the money has never lied to you yet.
      mechanical_effects:
        personality_trait: shrewd
        eye: money
    - label: The Room Before the People
      description: >-
        You take a room in before you take its occupants in. What's
        on the mantel. Which book is half-read. Whether the windows
        have been opened today. By the time you greet your host you
        already know more than they intend.
      mechanical_effects:
        personality_trait: attentive
        eye: room
    - label: I Won't Let It Go
      description: >-
        It isn't that you notice more than other people. It's that
        you don't stop noticing. Once something has caught your
        attention you will return to it until it gives way, however
        long that takes, however gentle you have to be.
      mechanical_effects:
        personality_trait: tenacious
        eye: tenacity
  allows_freeform: true

- id: confirmation
  title: Settling In
  narration: |
    The publican nods slowly, as though placing the last piece of you on
    the shelf where you belong.

    "You'll be wanting a room, then, I expect. The back bedroom looks
    over the burn — better than the front, the carriages come past at
    six. Supper is at the half-hour." He picks up the cloth again.

    "And {name}? Welcome to the village. They'll have you up the lane
    for tea before the week's out."

    {name} — a {race} {class} with a fresh suitcase and a steady eye —
    follows the publican's gesture toward the stairs.
  choices: []
  allows_freeform: false
