visual_tag_overrides:
  blackthorn_hall: >-
    handsome Georgian stone manor house on rising ground, three storeys
    with east and west wings, ivy on the south wall, gravel drive
    circling a stone fountain, tall windows with amber light in the
    evening, rooks in the chimneys, autumn trees flanking the approach,
    the moors rising behind
  study: >-
    oak-panelled gentleman's study, book-lined walls, bay window facing
    open moorland, partners desk in dark wood, a glass of brandy on a
    silver tray, papers squared on the blotter, pipe rack and tobacco
    jar, fireplace with low embers, a single lamp casting warm light,
    the sense of recent absence
  drawing_room: >-
    south-facing Victorian drawing room in afternoon light, heavy
    curtains in faded rose silk, family portraits in gilt frames, a
    piano in the corner nobody plays, tea service on a low table,
    careful flower arrangement, the light catching dust motes, a
    room where conversations are performed
  moors: >-
    Yorkshire moorland in autumn, heather in brown and purple, bracken
    turning gold, a single track winding toward a distant ridge, sheep
    on the hillside, vast grey sky with breaks of golden light, wind
    bending the grass, standing stones on the horizon, the sense of
    enormous space and solitude
  village: >-
    Yorkshire village of grey stone cottages, a Norman church with a
    square tower, a pub with a painted sign, cobbled lane between
    drystone walls, smoke from chimneys, a post office with a bay
    window, autumn leaves in the gutters, the sound of sheep
  mill: >-
    Victorian cotton mill in a Yorkshire valley, tall brick chimney
    trailing smoke, rows of windows reflecting grey sky, workers in
    flat caps and shawls at the gate, cobbled yard with a cart,
    terraced houses climbing the hillside behind, the sound of
    machinery carrying on the wind
  churchyard: >-
    English country churchyard in autumn, weathered headstones tilting
    in rough grass, a fresh grave with dark earth, yew trees and a
    lychgate, the church wall sheltering the Blackthorn family plot,
    fallen leaves on the path, quiet except for rooks
  station: >-
    small Yorkshire railway station, single platform with a wooden
    waiting room, a bench facing the moors, a signal box, tracks
    stretching in both directions toward empty landscape, a locomotive
    arriving in a cloud of steam, the stationmaster checking his watch
  servants_hall: >-
    below-stairs kitchen and servants' hall, long scrubbed table, a
    bell board on the wall with room labels, copper pots on hooks,
    the cook's domain warm with bread and broth, back stairs leading
    up into the house, a candle and a sense of quiet hierarchy
