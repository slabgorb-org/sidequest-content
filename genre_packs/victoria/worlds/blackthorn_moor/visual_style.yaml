# Visual style overrides for Blackthorn Moor
# Keeps the genre's Pre-Raphaelite oil painting base but shifts toward
# Yorkshire landscape painting — muted, atmospheric, autumnal.
# Think Atkinson Grimshaw's moonlit lanes and John Brett's moorland.

positive_suffix: >-
  Victorian oil painting, Yorkshire moorland atmosphere, muted autumnal
  palette of brown purple grey and amber, low golden afternoon light,
  rain-washed stone, heather and bracken, candlelit interiors with warm
  shadows, country house architectural detail, visible brushwork,
  narrative composition suggesting mystery and secrets

negative_prompt: >-
  photo, photograph, photorealistic, photography, camera, lens, DSLR,
  studio lighting, studio portrait, sharp focus, depth of field, bokeh,
  smooth skin, pores, skin texture, real person, celebrity, modern
