world_name: Blackthorn Moor

history: |
  The Blackthorn family has held this land for two hundred years. They were
  minor gentry — a few hundred acres of moorland and a village church with
  their name on the memorial — until Edmund's father saw what the railway
  could do and built the first mill in the valley. Edmund expanded it into
  three mills and a fortune. He married above his station — Lady Catherine
  was a Grenville — and the county never quite forgave either of them.

  Edmund was respected but not loved. He was fair to his workers by the
  standards of the age, which is to say he did not actively starve them.
  He was generous to the church, attentive to his ward, and utterly opaque
  to his wife. He kept his own counsel, locked his study at night, and
  walked the moors alone in weather that kept everyone else indoors.

  He died on the night of October the fourteenth, in his study, with the
  fire burning and a glass of brandy untouched on the desk. Dr. Ashworth
  was called at eleven. By midnight it was over. By morning the household
  had its story, and the story has held — until now.

cosmology: |
  God is the vicar's department. The moors are indifferent. Justice, if it
  comes, will be delivered by human hands or not at all. The only force at
  work in Blackthorn Hall is human nature — greed, loyalty, love, fear,
  and the terrible weight of secrets kept too long.

geography: |
  The Hall sits on a shelf of high ground where the moors begin to climb
  toward the ridge. Below, the valley holds Millbridge — smoke, industry,
  terraced houses, and the three Blackthorn mills that employ half the
  town. Between them, the village of Thornkirk clusters around its church
  and its pub, knowing everything about everyone and discussing it at
  length. The railway station is a mile south of the village — the only
  connection to the wider world. When the weather closes in, which it
  does often, the Hall might as well be on an island.

factions:
  - name: The Household
    summary: "Hall residents maintaining operations and protecting the version of events that keeps it standing"
    description: >-
      Lady Blackthorn, the servants, the governess — the people who live
      in the Hall and maintain its daily operation. Their loyalty is to the
      house itself, and to the version of events that keeps it standing.
    goals:
      - Preserve the family's reputation
      - Protect the household from outside scrutiny
      - Maintain the established order of things
    tensions:
      - The servants know things the family doesn't realize they know
      - Lady Blackthorn's composure is itself suspicious
      - Miss Fairfax occupies an uncomfortable position between upstairs and down

  - name: The Heirs
    summary: "Estate claimants positioning before the unread will with enormous stakes"
    description: >-
      Captain Hale and anyone else with a claim on Sir Edmund's estate.
      The will has not yet been read. The contents are unknown. The stakes
      are enormous.
    goals:
      - Secure the inheritance
      - Prevent any revelation that might invalidate the will
      - Position themselves favorably before the solicitor
    tensions:
      - Captain Hale's debts are larger than anyone knows
      - There may be a claimant no one has accounted for

  - name: The Investigators
    summary: "Doctor, solicitor, and player examining facts rather than accepting the household story"
    description: >-
      Dr. Ashworth, the solicitor Mr. Graves, and potentially the player.
      People who have reason to look at the facts rather than accept the
      story.
    goals:
      - Determine what actually happened the night Sir Edmund died
      - Ensure the will is executed properly
      - Protect themselves from the consequences of what they find
    tensions:
      - Dr. Ashworth signed a death certificate he has doubts about
      - Mr. Graves has instructions from Sir Edmund that predate the death
      - The anonymous letter that started all this came from someone in this house

  - name: The Village
    summary: "Thornkirk and Millbridge observers whose gossip and mill jobs depend on the outcome"
    description: >-
      Thornkirk and Millbridge — the vicar, the pub landlord, the mill
      workers, the shopkeepers. They observe, they gossip, and they have
      their own interests in the outcome.
    goals:
      - Know what happened (curiosity is the village's primary industry)
      - Protect the mills and the jobs they provide
      - See justice done, or at least see the powerful embarrassed
    tensions:
      - The mills' future depends on who inherits
      - The vicar knows something from confession that he cannot share
      - The village has its own theory about Sir Edmund's death
