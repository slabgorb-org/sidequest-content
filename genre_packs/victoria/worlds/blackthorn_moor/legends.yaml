world_name: Blackthorn Moor

legends:
  - name: The First Mill
    period: "1790s"
    summary: >-
      Edmund's grandfather, Thomas Blackthorn, was a sheep farmer who saw
      the future in cotton. He sold half the moorland to finance the first
      mill in the valley. The county gentry laughed. Within a decade he was
      richer than all of them. The family's relationship with old money has
      been complicated ever since.

  - name: The Grenville Marriage
    period: "1838"
    summary: >-
      Edmund married Lady Catherine Grenville — a match that shocked the
      county. The Grenvilles were old family, land-poor and title-rich.
      Catherine brought breeding; Edmund brought money. The county decided
      she had married beneath her. Catherine decided the county could go
      to hell. Neither side has forgiven the other.

  - name: The Mill Fire of 1852
    period: "1852"
    summary: >-
      The second Blackthorn mill burned in the night. Three workers died.
      An inquest found faulty equipment. The village remembers it differently —
      there was a labour dispute that week, and the foreman who argued loudest
      against Edmund's terms was among the dead. Nothing was proved. Nothing
      was forgotten.

  - name: The Ward
    period: "1860"
    summary: >-
      Sir Edmund took in a ward — a girl named Rose, said to be the orphaned
      daughter of a distant cousin. The household accepted this. The village
      noted that Rose has Edmund's eyes. Lady Blackthorn has never once
      referred to the child's parentage.

  - name: Edmund's Last Year
    period: "1866"
    summary: >-
      In the year before his death, Sir Edmund changed. He walked the moors
      more often, stayed later in his study, and dismissed his valet of
      twenty years without explanation. He visited the solicitor in Leeds
      three times in as many months. He received letters that he burned
      after reading. The household noticed. The household did not ask.
