          The sun-warmed lintel-stone under the hand. The new-cut
          larch's slight resin tack. The cold morning air on the
          back of the neck.
      avoid_at_all_costs:
        - the colonel having a flashback / war horror on turn 1 (no PTSD framing)
        - any body, any death, any forensic detail on turn 1
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      The Long Pass climbs gently for a mile out of the village and
      then bears north along the side of the glen between the Ross
      of Glenross to the east and the lower Ben Eilidh to the west.
      On a small shelf above the burn — half a mile short of the
      high cairn — the colonel's cottage is going up. Stone walls to
      the lintel course, roof timbers stacked, a sheet of canvas
      pegged over the joists against the rain. A rose bed has been
      dug along the south wall and the first canes planted, with
      labels in a neat hand.

      The colonel is at the works with his coat off, shirt-sleeves
      rolled, his bad leg straight on a stool while he writes
      something into a small notebook on his knee. A brazier with
      a tin kettle on it is going by the doorway. The view from the
      shelf, on a clear morning like this one, is twelve miles of
      glen southward to the village and the distillery's smoke and
      the railway halt's roof — and northward, up the path, the
      cairn at the head of the Pass against a sky the colour of
      wet slate.

      A buzzard is high above the shoulder of Ben Eilidh. A curlew
      calls from the moor. Down on the path, twenty yards below the
      shelf, Old Tam Cattanach is climbing up at the unhurried pace
      of a gillie who has come a mile for a reason and would prefer
      to take the last twenty yards slowly.

      The colonel looks up at you and his smile is unforced. "Aye.
      Come up. The kettle's on the brazier and the second mug is in
      the basket. Mind the rose bed; I am going to be insufferable
      about it for two years."
    first_turn_invitation: |
      The colonel writes one more line in the notebook and closes
      it. The kettle on the brazier is at the boil. Old Tam is ten
      yards short of the shelf, taking his cap off as he climbs.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Old Tam reaches the shelf, takes his cap off, and inclines
        his head to the colonel. "Colonel. Afternoon. I'd not come
        up at this hour, only Sir Iain asked me to walk by and pass
        a word, and the cottage was on my way anyhow." He looks
        once at the view and once at the rose bed and once at the
        colonel.

        "There was a gentleman walking the high path on Tuesday
        evening, between five and seven. He stopped at the burnt
        shieling for ten minutes and walked on. Sir Iain saw him
        through the glass from the high stand. He has not been
        named in the village and he has not come back. Sir Iain
        thought you might have seen him."

        The colonel sets the notebook down on the larch joist
        carefully, and his attention rests for a long moment on
        the curlew on the moor before he answers.
      escalation_path:
        turn_2_or_3: >-
          The unnamed walker on Tuesday evening is the wrinkle. By
          turn three the colonel will say what he saw and didn't
          say at the time, or Old Tam will mention the burnt
          shieling, or the player will offer to walk up to the
          shieling. Narrator picks the path on the basis of the
          player's vocation. Do not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "Doctor — sit. The stool under the canvas." The colonel
          gestures with the pen. "I had not meant to ask you up
          for the leg today but the dampness has been worse, you
          will see it in three minutes' walking, and I am too proud
          to ride down for a consultation. Five minutes of your
          time and I will be honest about it for the first time
          this autumn."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Reverend. The kettle's on. Sit." The colonel's smile is
          warm and faintly puzzled, the way it always is when the
          manse comes calling. "I am not a churchgoer in your house,
          as you'll know, but you'll find the cottage rises whether
          I attend or not. Sit and tell me if I have spent the
          summer wisely."
      - applies_to: { class: "Society" }
        beat: |
          "Aye, up at the Hall, are we." The colonel's voice carries
          a faint dry amusement. "Sir Iain has been good enough to
          let me have the larch from the home wood at a price that
          will embarrass me in twenty years' time. If you are dining
          at the Hall tonight, you may tell him the joists are laid
          and the roof will be on before the storms."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss." The colonel inclines his head. "The schoolhouse
          children come up on a Saturday and have a competition to
          see who can balance on the lintel-stone. I will not
          discourage it. If Miss Ferguson would care for an
          afternoon's class up here next term I will provide tea
          and biscuits and no instruction."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant — sit." The colonel sets the notebook aside.
          "I had been meaning to walk down and find you. There was
          a gentleman on the high path on Tuesday evening who I
          did not know and did not wish to interrogate from the
          shelf with no reason. Now Sir Iain has sent word — and
          you have come up — and we can speak of it without
          pretending it is nothing."
      - applies_to: { class: "Explorer" }
        beat: |
          The colonel's smile is the real one — broad, brief, and
          a degree older than his face. "Aye. Another half-pay
          builder. Sit. The kettle's on and the second mug is
          yours. The cottage is two summers from its first winter
          and the rose bed is six years from being worth speaking
          of. Tell me, honestly, whether your cottage is as much
          trouble as mine."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # MULTIPLAYER — Cricket-and-shinty Saturday (carried from v1)
  # ──────────────────────────────────────────────────────────────────

  - id: mp_cricket_saturday
    name: "The Cricket Ground — the Saturday fixture, the village out in force"
    triggers:
      mode: multiplayer
      min_players: 2
      max_players: 4
      backgrounds: []
    setting:
      location_label: the_cricket_ground
      situation: >-
        Late August, the Saturday fixture against the eleven up from
        Cullenmore. Half the parish is at the meadow. The pavilion is
        full. The marquee that is going up for the parish fete next
        week is half-erected at the far end of the field. The cricket
        is well into the second innings; the village team is doing
        better than expected. The players' party are all at the
        ground for various reasons of their own and have not yet
        quite found each other.
      present_npcs:
        - hamish_sinclair
        - rev_murchison
        - mrs_cameron
        - sgt_macrae
        - mrs_buchan
        - hugo_ross
    tone:
      register: "warm, sociable, the village in full courtesy"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — the wrinkle is at the marquee"
      sensory_layers:
        smell: >-
          Cut grass, paraffin lamp from the pavilion verandah, the
          tea-and-sandwiches smell from the back of the marquee, peat
          smoke from a single chimney drifting down off the village.
        sound: >-
          The slow regular sound of bat on ball, polite applause from
          the pavilion, the unhurried commentary of half a dozen
          village men along the rope, a child somewhere being told
          to come back from the boundary. The bell at the kirk has
          just rung the half-past four.
        touch: >-
          Late afternoon warm on the back of the neck. The pavilion
          rail worn smooth under the hand. The mug, when one is put
          into your hand at some point in the next half hour, is
          warm enough to be honest and not hot enough to spill.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - bringing the wrinkle out before the players have introduced themselves to each other
        - asking the player a question — turn 1 closes on a declarative
        - moving any player without their input
        - the gothic register
    establishing_narration: |
      The cricket ground is full. The village pavilion at the north
      end is doing brisk trade in tea-and-sandwiches; the lime-washed
      verandah is two-deep in villagers along the rope; the marquee
      that's going up for next week's parish fete is half-erected at
      the far end of the meadow. The sky is the soft blue of a late
      August Saturday in the Highlands, with a thinner mid-altitude
      cloud bank moving in from the west — there will be a shower,
      but not yet.

      The eleven from Cullenmore are batting. The Glenross XV
      shinty captain — who is also the Glenross XI's second-change
      bowler — has just come on, and his first over is going well
      enough that the rope is leaning slightly forward in attention.
      Hugo Ross, the laird's son, is the village's wicket-keeper
      this season; he is taller than the keepers Cullenmore
      remember, and the boundary has noticed.

      Reverend Murchison is on the rope in his tweed jacket and
      Sunday collar, hands clasped behind his back, watching with
      the unhurried attention of a man who has watched this fixture
      for thirty years. Mrs. Cameron is moving along the rope with
      a teapot in either hand. Mrs. Buchan, the postmistress, has
      brought her knitting out, has not done much knitting with it,
      and is watching the marquee being raised at the far end with
      the particular look of a woman who is reading the field rather
      than the cricket. Sergeant MacRae's bicycle is leaning against
      the back wall of the pavilion; he is leaning beside it,
      neither watching the cricket nor not watching it.

      The party — you — are here at the same fixture for your own
      reasons. You have not yet quite found each other.
    first_turn_invitation: |
      The bell at the kirk has just rung the half-past four. The
      bowler's run-up is restarting. The marquee at the far end
      shakes once in a gust of wind. The village is at full
      Saturday courtesy.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        At the far end of the meadow, the marquee that is going up
        for next week's fete loses one of its corner ropes in a
        small flurry of wind. One of the men putting it up — a
        broad figure in a brown jacket, no one the regulars on the
        rope quite recognise — straightens, looks toward the
        pavilion, then walks the long way around the back of the
        marquee rather than the short way along the rope.

        Sergeant MacRae's gaze, which had not been watching the
        cricket, follows him until he is out of sight behind the
        canvas. Then the sergeant unclips a bicycle clip and
        re-clips it on the other ankle, which is a thing he does
        when he is about to walk the long way around something
        himself.

        Mrs. Buchan picks up her knitting again. The bowler's run-
        up restarts. From the back of the pavilion Mrs. Cameron is
        calling someone's name in a tone of practical authority.
      escalation_path:
        turn_2_or_3: >-
          The figure at the marquee is the wrinkle. By turn three he
          will have left, will be missed at the village hall, will
          turn up at the inn under a name no one recognises, will
          have left a parcel at the post office, or — most likely —
          will have done the polite circuit that visiting men do at
          a village fixture and become the topic of the rope's
          conversation. Narrator picks the path on the basis of the
          party's vocations and chargen choices. Do not preview the
          shape of the wrinkle on turn one.
    party_framing:
      already_a_crew: false
      bond_tier_default: "trusted"
      shared_history_seeds:
        - >-
          The players have lived in or visited the glen long enough to
          know each other by name. The doctor has treated the
          schoolmistress's brother for a chill last winter; the
          constable has been at the inn with the rector after the
          last cricket match; the postmistress has handed the
          minister his correspondence every weekday morning for as
          long as either of them can remember. The bonds are warm
          but the relationships are not romantic by default — the
          village's social tissue, in other words.
      narrator_guidance: >-
        The party are not arriving as a single unit. They are at the
        same fixture for their own reasons. Introduce each player to
        the scene through what they would notice — the doctor sees
        a child's bandage that has come undone, the minister sees a
        face he has not seen at Sunday service in a fortnight, the
        constable sees the marquee figure walk the long way around,
        the postmistress sees a letter she has been waiting on
        delivered to a hand she did not expect to see. Let the
        players find each other naturally across turns 1 and 2.
    magic_microbleed: null
