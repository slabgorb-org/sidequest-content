# Glenross — Openings bank.
#
# Hard contracts (validators in genre/loader.py + models/narrative.py):
#   - first_turn_invitation must NOT contain "?"
#   - establishing_narration / first_turn_invitation must NOT contain
#     "[authored", "[TBD", "[migrated", "[placeholder"
#   - OpeningSetting requires exactly one anchor: chassis_instance OR
#     location_label (not both, not neither). Glenross uses location_label.
#   - At least one solo + one multiplayer opening present.
#   - PerPcBeat.applies_to keys are constrained to {background, drive,
#     race, class}.
#
# Spec: docs/superpowers/specs/completed/2026-05-01-canned-openings-design.md
#       docs/superpowers/specs/2026-05-11-tea-and-murder-glenross-design.md
#
# Voice contract: warm, observant, dryly witty, slightly arch in the way
# the best village storytellers are arch. Tea Cup Test applies — body
# discovery (when it comes) is off-stage or tidy; turn 1 never carries
# a body. Stakes on turn 1 are gentle; the complication waits for
# turn 2 or 3 per the SOUL pacing rule.
#
# v2 bank (2026-05-11): EIGHT solo openings, one anchored at each
# vocation's signature POI, plus one MP at the cricket ground. All solo
# entries use triggers.backgrounds: [] so they share the fallback pool —
# the runtime picks one at random at chargen-complete. Each opening
# carries per_pc_beats for all six chargen class_hints (Doctor,
# Clergyman, Society, Governess, Detective, Explorer) so any
# vocation/POI combination still threads the player's day-job into the
# scene gracefully. (A "perfect" anchoring where vocation hard-gates
# opening selection requires an OpeningTrigger schema extension —
# tracked as a separate Dev follow-up; see opening_bank_v2 finding in
# the orchestrator handoff.)

version: "0.2.0"
world: glenross
genre: victoria

openings:

  # ──────────────────────────────────────────────────────────────────
  # SOLO #1 — The Surgery (Country Doctor's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_surgery_morning_post
    name: "The Surgery — Tuesday morning post, the kettle on, the waiting bench empty"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: the_surgery
      situation: >-
        Tuesday morning, late autumn. Surgery hours are ten to noon and
        nobody has yet come through the door. Dr. Eilidh Ross has the
        kettle on, the post on the desk, the dispensary cabinet open
        for the weekly inventory. The lane outside is quiet; a horse
        is being shod down at the inn yard and the sound carries.
      present_npcs:
        - dr_ross
    tone:
      register: "warm, observant, the village in its weekday courtesy"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — the wrinkle is in the morning post"
      sensory_layers:
        smell: >-
          Carbolic and lavender from the dispensary cabinet, peat smoke
          drifting in from the bar across the lane, the faint tea smell
          of a kettle that has just come off, the wax-and-paper smell
          of a stack of unopened envelopes.
        sound: >-
          The kettle settling. The slow rhythmic ring of the farrier's
          hammer at the inn yard, three doors down, carrying as such
          sounds do on a still autumn morning. The surgery clock,
          which is always two minutes fast.
        touch: >-
          The waiting-bench cushion thin under the hand. The
          dispensary cabinet's brass handles cool. The mug, when it
          arrives, is the heaviest object in the room.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - introducing the surgery telephone ringing on turn 1 (save it)
        - asking the player a question — turn 1 closes on a declarative
        - moving the player without their input
        - the gothic register
    establishing_narration: |
      The surgery faces the lane, painted cream, three steps up to a
      door that has been propped open since nine. Inside, the waiting
      bench is empty and the kettle has just come off. Dr. Eilidh
      Ross is at the desk with the morning post in three neat piles —
      the local hand on the left, the Edinburgh and London on the
      right, the one with the foreign stamp by itself in the middle.

      She looks up at you with the unhurried half-smile of a country
      doctor who has learned that nine visitors in ten can be put at
      ease by the look on the practitioner's face before anything else
      happens. "You're early. Or I'm slow. Sit yourself down — the
      kettle's just come off and I've a few minutes before the first
      of them."

      The dispensary cabinet is open behind her, the weekly inventory
      half done. The surgery telephone — one of two in the village —
      is mounted on the wall by the door, silent for the moment.
      Through the window, the farrier's hammer at the inn yard rings
      out three doors down, and somewhere up at the kirk a single
      bell tolls the half-past.
    first_turn_invitation: |
      The kettle is just settled. Dr. Ross is reaching for the
      foreign-stamped letter in the middle pile. The lane outside is
      doing its slow Tuesday-morning business.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Dr. Ross opens the foreign-stamped letter with a paper-knife
        and reads it through once without expression. Then a second
        time, more slowly. She does not put it down. She refolds it
        once along its existing crease and slides it under the
        blotter without comment.

        "Well." She picks up the next letter, which is in a local
        hand. "How are your people keeping. I haven't seen your aunt
        in the lane this fortnight."

        The clock on the surgery wall, which is always two minutes
        fast, ticks audibly into the small pause that follows.
      escalation_path:
        turn_2_or_3: >-
          The foreign-stamped letter is the wrinkle. By turn three Dr.
          Ross will have brought it up, or it will fall out from
          under the blotter, or the writer will be the next person
          through the door. The narrator picks the path on the basis
          of the player's vocation. Do not preview on turn one.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "You'll know the cabinet then." Dr. Ross gestures, without
          quite looking. "I'm short on quinine and the wholesaler in
          Inverness has been promising for three weeks. If you've a
          spare grain in your bag I would consider it a kindness. The
          kettle's just on; help yourself."
      - applies_to: { class: "Clergyman" }
        beat: |
          Dr. Ross sets the post aside. "Reverend. Tea." She fills two
          mugs without asking. "I've a parishioner of yours who has
          not been at service these three Sundays and who will not
          tell me why. I won't betray a confidence, but I will say
          that the manse might walk past her cottage this afternoon."
      - applies_to: { class: "Society" }
        beat: |
          "You'll have come for the news, then." Dr. Ross's smile is
          courteous and entirely unguileless. "Sit down. The kettle's
          just on. Whatever you've heard about Lady Annabel's nephew
          I will not confirm or deny, but I will give you tea while
          you ask."
      - applies_to: { class: "Governess" }
        beat: |
          "Schoolmistress — sit. Sit." Dr. Ross indicates the bench
          with the back of a pen. "Young Tommy MacKay's cough was the
          croup, not the chest, but I want him in here Thursday all
          the same. Tell his mother for me. She'll take it better
          from you than from the prescription pad."
      - applies_to: { class: "Detective" }
        beat: |
          Dr. Ross considers you over the mug. "Sergeant. I haven't
          called for you and I haven't been called on. So I take it
          this is a friendly cup of tea." Her glance touches the
          foreign-stamped letter under the blotter and does not
          rest. "It is, isn't it."
      - applies_to: { class: "Explorer" }
        beat: |
          "Colonel." Dr. Ross's tone shifts faintly — the careful
          politeness of one professional meeting another. "Your leg.
          Be honest with me, before you sit. The damp this autumn has
          been worse than last year's, and pride has set back more
          recoveries than gout ever did."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # SOLO #2 — The Manse (Parish Minister's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_manse_bee_garden
    name: "The Manse — late afternoon in the bee garden, the minister cutting roses"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: the_manse
      situation: >-
        Late afternoon, autumn sunshine. The Reverend Andrew Murchison
        is in the walled garden behind the manse, cutting the last of
        the roses for Mrs. Drummond to put on the kitchen table.
        Beyond the kitchen door is the bee-garden with its six hives;
        beyond that, the kirkyard sloping down to the burn. There is
        no parish emergency today.
      present_npcs:
        - rev_murchison
    tone:
      register: "warm, contemplative, ministerially attentive"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — surfaces from the kirkyard side"
      sensory_layers:
        smell: >-
          Cut rose stems, beeswax from the hives, woodsmoke from the
          manse chimney, the wet-leaf smell from the kirkyard yew, the
          faint kitchen-bread smell from the open back door.
        sound: >-
          The drowsy late-season hum from the bee-garden. Mrs.
          Drummond moving things on the kitchen flagstones. A blackbird
          in the yew. Far off, two farm dogs disagreeing about a stoat.
        touch: >-
          The garden bench warmer than expected in the afternoon sun.
          The rose stems' cool wet weight against the cuff. The
          beeswax-and-newsprint feel of the minister's hands.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - using "Father" as the form of address (he is "Mr." or "Reverend"; CofS)
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      The manse garden is at the side of a house that has been a
      minister's house for a hundred and forty years. Stone wall,
      high enough to be private and low enough to nod over to a
      passer-by. Six bee-hives in the bee-garden at the far end,
      drowsing through the last of the season. Roses in a long bed
      against the south-facing wall — too late for many, but enough
      for the kitchen table.

      The Reverend Andrew Murchison is cutting them with secateurs in
      the unhurried way of a widower who has learned that small
      tendings keep the larger sadnesses in proportion. He is in his
      shirt-sleeves and waistcoat, the dog-collar plain at his
      throat, sleeves rolled to the elbow. His hands are stained
      faintly with the brown ink of the morning's correspondence and
      the green of the rose stems.

      He looks up as you come down the path from the kitchen door,
      and the smile he produces is the smile of a man who has spent
      forty years being glad to see whoever comes through a manse
      door. "Aye. Sit down, sit down. Mrs. Drummond is bringing tea
      out in a quarter of an hour and there is no hurry on any of it.
      Mind the bees on the lavender — they are slow in the cool but
      they take a step badly."

      Beyond the bee-garden, the kirkyard yew is throwing a long
      shadow across the dry-stone wall, and somewhere on the lane a
      child is calling for a dog called Bonnie who is not coming.
    first_turn_invitation: |
      The minister has gone back to the secateurs. The kettle indoors
      has just begun to whistle. The bees in the lavender are taking
      their slow last business of the day, and the kirkyard yew is
      shading the wall.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Mrs. Drummond comes out with the tea tray, sets it on the
        garden table, and pauses with her hand still on the pot.
        "Mr. Murchison. The Buchan girl was at the kitchen door not
        ten minutes ago. She wouldn't come in. She left a note." Mrs.
        Drummond produces a folded paper from her apron pocket. "She
        said: when the minister has the time. Not before."

        Andrew Murchison takes the note, unfolds it, reads it once,
        and folds it back along the same crease. He does not put it
        down. "Aye. Thank you, Mrs. Drummond. I'll walk down at six."

        Mrs. Drummond looks once at the visitor, once at the note,
        and goes back to the kitchen without comment. The yew shadow
        has reached the bee-garden.
      escalation_path:
        turn_2_or_3: >-
          The Buchan girl's note is the wrinkle. By turn three the
          minister will be heading down to the post office, or the
          girl will be at the gate, or the note's content — a name,
          a place, a time — will have surfaced. Narrator picks the
          shape on the basis of the player's vocation. Do not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "Doctor — sit. I was going to send word." Andrew sets the
          secateurs down. "Old Mrs. Cattanach. I sat with her on
          Sunday and she would not say what was wrong, but it was
          something, and it was new. Could you call this week
          without making it a call. She would notice the bag and
          she would not say a word more."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Aye. Reverend." Andrew's face shifts faintly with the
          recognition. "You'll have heard about the rector and me —
          we get on, you'll find, better than is expected of two men
          of our different houses. Sit. Mrs. Drummond will bring out
          a second cup directly. The bees have been quiet today;
          they are a good measure of the parish, the bees."
      - applies_to: { class: "Society" }
        beat: |
          "The Hall, I take it." Andrew nods, not displeased. "Sir
          Iain has been by twice this week. Lady Annabel I have not
          seen in a fortnight — I do not say this with concern, but
          I say it. If you are up at Castle Ross again before Sunday,
          ask after her in a way that lets her change the subject
          gracefully."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss." Andrew gives the secateurs a wipe with a kerchief.
          "There is a child in the lower form whose father has not
          been home this fortnight. I do not say which child. I am
          only mentioning that the school is sometimes the first
          place a household's quietness becomes visible. You will
          know better than I."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant. Sit." Andrew sets the secateurs into the basket
          and wipes his hands. "Nothing has been put before me that
          would warrant your time. I will say only — the way I would
          say it to any sergeant, if I had the chance — that the
          village is unusually quiet this week, and a village is
          rarely quiet without a reason."
      - applies_to: { class: "Explorer" }
        beat: |
          "Colonel. The bench in the sun is the warmest seat in the
          garden." Andrew gestures. "You'll find I do not press a
          retired man on his recollections. But Sir Iain served too,
          and he is up at the Hall this week, and the manse is
          always a peaceable house if you've a mind for a walk down
          on a quiet evening."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # SOLO #3 — St. Margaret's Chapel (Episcopal Rector's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_chapel_vestry_evensong
    name: "St. Margaret's — late vestry hour before evensong, the rector at his books"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: st_margarets_chapel
      situation: >-
        Half past four on a Thursday in autumn. The Reverend Alistair
        Quill is in the vestry of St. Margaret's, going over the
        register and the offertory book before evensong at six.
        Outside the chapel porch a lone visitor's umbrella is propped
        and dripping. The Ross family are at the Hall this week; the
        rector's small congregation is otherwise scattered through the
        glen.
      present_npcs:
        - rev_quill
    tone:
      register: "mild, observant, gently relentless"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — surfaces in the offertory book"
      sensory_layers:
        smell: >-
          Beeswax polish on the pews, damp wool from a hanging coat,
          old paper from the bound parish register, the cold faintly-
          metallic smell of Aberdeenshire granite.
        sound: >-
          The slow tick of the vestry clock. Rain on the roof —
          intermittent, polite. The chapel door breathing once or
          twice in the wind. The rector's pen moving across paper in
          steady short scratches.
        touch: >-
          The vestry chair worn smooth on its arms. The cold of the
          chapel granite where the hand rests on a pew. The dry rustle
          of register pages turned with care.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - any sectarian aside (Roman Catholic / sectarian baggage)
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register (despite the chapel — keep it small and warm)
        - moving the player without their input
    establishing_narration: |
      St. Margaret's is the size of a country chapel that no one
      built large because no one expected the small congregation to
      need anything else. Single nave, six bays, a porch with a
      noticeboard whose copperplate is the rector's own hand. The
      Aberdeenshire granite is the colour of dry oatmeal under a
      grey sky and the colour of warm sand under a clear one. Today,
      it is the first.

      The rector is in the vestry, which is the size of a large
      cupboard with one window. The register is open on the desk
      and the offertory book is open beside it, and the rector is
      checking one against the other in the quiet way that small-
      congregation clergymen check anything they intend to
      remember. He is in his cassock, his black umbrella propped
      mended-side-up by the door, and the breviary that lives in
      his pocket is on the desk where the lamp catches it.

      He looks up at your shadow in the doorway and the smile that
      arrives is small, exact, and entirely unsurprised. "Aye. Come
      in. The vestry is the warmest of three options — porch, nave,
      vestry — and the seat is mine but I'll not be on it for the
      next half hour." He stands, slips the pen into the inkwell,
      and turns the lamp a quarter further on. "I had a feeling the
      door would open before evensong. Sit, sit."

      Outside the high window, the rain is patient. From the rear of
      the chapel the small lay-clerk who attends to the brass is
      humming something that is not a hymn.
    first_turn_invitation: |
      The rector has set the offertory book aside, but kept his finger
      between the pages. The vestry clock ticks unhurriedly. The
      copper kettle on the small spirit-burner — there is one — is
      not yet on.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        The rector closes the offertory book at last, but not before
        he has paused with his finger on one entry for a beat too
        long. "I notice things, you'll find — it is a small
        failing." He sets the book on the shelf. "There is a sum
        in the plate at Sunday last that did not come from any of
        the forty I know to have been at service. A whole sovereign,
        in among the half-crowns. And a card with no name on it,
        wedged behind a hymnbook in the back pew that nobody sits
        in."

        He produces the card from the cassock pocket and lays it on
        the desk. The reverse is plain. The face is plain. There is
        an address in copperplate — Edinburgh — but no name.

        The rain on the chapel roof pauses for a moment, as such
        rain does, and then takes itself back up.
      escalation_path:
        turn_2_or_3: >-
          The card and the sovereign are the wrinkle. By turn three
          the rector will name a household worth visiting, or the
          visitor whose umbrella drips in the porch will return for
          it, or the address on the card will be traced. Narrator
          picks the path on the basis of the player's vocation. Do
          not preview on turn one.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "Doctor." The rector's eyes warm by a degree. "I will not
          ask you anything that would compromise a confidence. I will
          only say that the Munros' youngest is in my Sunday school
          and has been pale these three weeks. The mother will not
          come to the surgery. If you are passing the distillery on
          another errand, she would speak to a doctor at her own door
          who she would not speak to at yours."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Aye." The rector's smile is faint and entirely glad.
          "Brother. Murchison and I have shared the parish forty
          years between us and disagreed about exactly two things,
          and both of them small. Sit. The kettle will be on in a
          minute. The offertory I will not show you, but the chapter
          and verse I would gladly bring before yours."
      - applies_to: { class: "Society" }
        beat: |
          "I take it the Hall sent you." The rector's tone is mild
          and unprovokeable. "Lady Annabel and I correspond by note
          when she is in residence — she has a difficulty with stairs
          which she does not name and I do not press. If you would
          carry a small bundle of books back up the hill, the
          gardener at the lodge will know what to do with them."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss." The rector's manner softens to the careful warmth
          he reserves for women who teach village children. "Two of
          the lower form are mine on Sundays, and one of them has
          been writing in her catechism in pencil what she ought to
          be writing in ink. The reason will be at home, not at
          school. You will know that without my saying so."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant. Sit." The rector glances at the visitor's
          umbrella in the porch and then back. "I will not waste
          your time with hypotheticals. I will only mention that I
          have, in this drawer, a sovereign that arrived without
          a face attached to it, and that I would be in your debt
          if you would look at the card it came in with. The rest
          you will see in five seconds."
      - applies_to: { class: "Explorer" }
        beat: |
          "Colonel — sit." The rector indicates the second chair.
          "Sir Iain told me once that the Long Pass walked is the
          best half-hour in the parish for a man with a thought
          to consider. If you have come down off it this afternoon
          and stopped here on the way, I take it as a courtesy. The
          chapel is small enough to feel like a tent, in its way."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # SOLO #4 — The Post Office (Postmistress's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_post_office_morning_round
    name: "The Post Office — the morning sorting, the kettle on, the bell waiting to ring"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: the_post_office
      situation: >-
        Quarter past eight on a still autumn morning. Mrs. Catriona
        Buchan has the day's post on the counter, sorted into walking
        rounds. The bag for the postman is half full. The telegraph
        machine in the back is silent. The kettle is on. The lane
        outside is quiet but is about to not be, as it always is at
        the half-hour.
      present_npcs:
        - mrs_buchan
    tone:
      register: "alert, courteous, the village's information at attention"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — surfaces from a letter on the counter"
      sensory_layers:
        smell: >-
          Stamp paste from a small open pot, paraffin from the lamp
          that is still on in the back, peat smoke from a chimney
          that has been going since six, the dry-paper smell of a
          counter that has been the counter for forty years.
        sound: >-
          The kettle just on. The slow regular click of Mrs. Buchan
          stamping a date onto the morning round. The lane outside,
          which is not yet busy. A cart at the bridge, just audible.
        touch: >-
          The polished counter under the hand. The brass scale's
          smooth weight when leaned against. The faintly waxy feel
          of a freshly stamped envelope.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - having Mrs. Buchan reveal the contents of any letter unprompted
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      The post office at this hour is the village's quietest busy
      room. Mrs. Catriona Buchan is behind the counter, in the
      grey-blue smock she has worn for sorting since the late king's
      reign. The day's post is laid out in three rows — the
      manse, the surgery, Castle Ross — and the bag for the postman
      is half full. The brass scale at the corner of the counter is
      polished to within an inch of its life. The kettle is on.

      The wall behind the counter carries the rate-card, the telegraph
      manual, and a small photograph of Mrs. Buchan's son, who took a
      commission and is in Quetta. There is a pot of stamp paste, a
      brass-handled date stamp, and a cup of tea that has gone cold
      while she finished the manse round.

      She looks up at you with the alert, careful courtesy that has
      kept her in the post office for twenty-two years. "Good
      morning. The kettle's just back on — I'll have a fresh cup in
      a minute. You'll forgive me if I finish the round; the postman
      will be in at the half-hour and he is, may I say, a man who
      will not be made to wait."

      The lane outside the door is quiet, but is about to not be.
      The bell over the door is hung on a curled iron bracket and
      has not rung yet today.
    first_turn_invitation: |
      Mrs. Buchan picks up the date stamp again and lays it once,
      precisely, on a thick cream envelope. The kettle is at the boil.
      The lane outside is still empty. The clock is two minutes off
      eight-thirty.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Mrs. Buchan pauses on a particular envelope — thick cream
        paper, an unfamiliar hand, a London postmark — and turns it
        over once in her fingers as though the back will explain the
        front. It does not. She looks at the front again. She does
        not lay it on any of the three rounds. She sets it down
        flat on the counter between the rounds, equidistant.

        "Mrs. Cameron at the tea rooms." She says it conversationally.
        "It is not Mrs. Cameron's correspondence — she has a sister
        in Glasgow whose hand I know by sight. This is not her
        sister's hand. Mind you" — she fits the envelope into the
        Mrs. Cameron round at last — "she is sixty-three years old
        and the post office is not in the habit of supposing on a
        person's mail."

        The bell over the door rings as the first villager of the
        day pushes in.
      escalation_path:
        turn_2_or_3: >-
          The cream envelope is the wrinkle. By turn three Mrs.
          Cameron will have come for her post and either opened it
          in the post office or walked out without doing so; or Mrs.
          Buchan will have admitted what she suspects and asked for
          a discreet eye on the tea rooms. Narrator picks the path
          on the basis of the player's vocation. Do not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "Doctor — the telephone is yours if you want it." Mrs.
          Buchan inclines her head toward the wall set. "Inverness
          has been intermittent this morning — they tell me a tree
          is down by Tomatin — but Aberdeen has been clear. I will
          not be a moment with the round if you need to make a call."
      - applies_to: { class: "Clergyman" }
        beat: |
          Mrs. Buchan slides the manse round to the front of the
          counter. "Reverend — I was going to send this up at noon.
          There is a letter from Edinburgh that came in last night
          and I think it is the matter Mrs. Drummond was asking after
          last week. I'll trust your discretion on it; you'll know
          what's needed."
      - applies_to: { class: "Society" }
        beat: |
          "The Hall's round goes up at ten." Mrs. Buchan's manner
          shifts a degree — courteous, observant, unreadable. "If
          you are walking up, I would be obliged for the favour and
          would myself save the postman ten minutes. There is one
          letter for Sir Iain marked private. I do not say that to
          mean anything by it."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss — the school's two letters today, both for the
          schoolhouse address. One is your subscription to the
          Educational Times, the other is from the inspector's
          office at Inverness. I would not open the inspector's one
          on the doorstep, if I may say. Take a chair on the bench."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant. The bell will ring in a moment and you will
          have a witness." Mrs. Buchan does not glance at the cream
          envelope on the counter, but her hand has come to rest on
          a different part of the counter from where it was. "Stand
          this side of the counter, would you, and pretend to be
          waiting for the post round. I have a thing to show you in
          half a minute."
      - applies_to: { class: "Explorer" }
        beat: |
          Mrs. Buchan reaches for a particular pigeonhole. "Colonel.
          Your mail today — two from the regimental association,
          one from your sister in Stirling, and the catalogue from
          the seedsman. Nothing from India this round; I would have
          said so directly if there had been." She lays the four
          pieces on the counter in the order received.
