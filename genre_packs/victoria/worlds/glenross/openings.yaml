  # ──────────────────────────────────────────────────────────────────
  # SOLO #5 — The School (Schoolmistress's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_school_after_bell
    name: "The School — after the four o'clock bell, the room empty, the slate not yet wiped"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: the_school
      situation: >-
        Ten past four on a Wednesday in autumn. The four o'clock bell
        has been rung and the schoolroom is empty of children. Miss
        Margaret Ferguson is at the slate, marking up tomorrow's
        psalm. The coal stove at the far end is going down. Through
        the long windows the schoolyard is settling into late-
        afternoon. The schoolmistress's cottage door at the back is
        open and a kettle is on.
      present_npcs:
        - miss_ferguson
    tone:
      register: "principled, patient, the schoolroom quiet of children just gone"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — surfaces from a child's slate"
      sensory_layers:
        smell: >-
          Chalk dust, the faint coal-smoke from the stove, lavender
          from a small dish Miss Ferguson keeps on the corner of her
          desk, the wet-wool smell of thirty coats just gone from the
          hooks at the back.
        sound: >-
          The stove ticking as it cools. The schoolhouse clock
          marking the quarter. A single child still in the
          schoolyard, calling to another who has gone on. The faint
          sound of a kettle just back on through the cottage door.
        touch: >-
          The chalk-dust roughness on the desk's edge. The smooth
          cool of the slate. The warmer wood of the chairs where
          thirty children have just sat.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - infantilising the schoolmistress or treating her as fragile
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      The schoolroom is a long single room with tall windows on the
      lane side and a coal stove at the far end. Thirty desks in
      five rows, slates stacked on the corner of each, inkwells
      filled — the inkwells were filled on Friday, as they are every
      Friday for thirty years and as they will be next Friday — and
      a smell of chalk dust hanging on the air the way it always
      does for ten minutes after the bell.

      Miss Margaret Ferguson is at the master slate at the front,
      sleeves pinned back, marking up tomorrow's text. The bell rope
      is coiled neatly on its hook by the door. The schoolmistress's
      green-covered register is closed on her desk; the daily mark
      is done. Through the open door at the back, into the cottage,
      the kettle has just come back on.

      She looks up as you come in, and the smile she produces is the
      smile of a woman who has not been surprised by anything that
      walked through a schoolroom door in twenty years. "Aye. Come
      in. The bench by the stove is the warmest seat. I have ten
      minutes before I shut the place up. Mind the chalk." She
      gestures with the duster. "It is not my best class, dust-wise."

      Through the long windows, the schoolyard is settling. One
      child — the MacRae girl, by her plait — is still at the gate,
      her satchel against her hip, looking down the lane in the
      patient way of a child who is not in a hurry to go home today.
    first_turn_invitation: |
      Miss Ferguson sets the chalk down on the master slate. The
      duster is over her arm. The stove ticks as it cools. The MacRae
      girl is still at the schoolyard gate, looking down the lane.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Miss Ferguson glances at the MacRae girl through the long
        window, and a small considering line forms between her
        eyes. "Effie MacRae has not gone home tonight. Effie
        MacRae goes home, every day, before the bell has stopped
        its first ring. She is the eldest of four and she has the
        habit." She lays the duster down on the desk.

        She walks the three steps to her own desk and lifts a
        slate from the top of the stack. "This is Effie's. The
        word at the bottom is the word she has written, neat as a
        copybook, three times today instead of her sums. Look at
        it. Tell me what you think it is."

        On the slate, written in a careful nine-year-old hand,
        three times under the day's date, is the word: ROOM.

        Just the word. Just three times. Just clean.
      escalation_path:
        turn_2_or_3: >-
          Effie at the gate and the word ROOM are the wrinkle. By
          turn three Miss Ferguson will have asked the player to
          walk Effie home, or the constable will have been sent for,
          or Effie will have come back inside on a pretext. Narrator
          picks the path on the basis of the player's vocation. Do
          not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          "Doctor — sit." Miss Ferguson indicates the bench by the
          stove. "It is nothing I would call a case yet, but the
          MacRae children have all four had a cold this fortnight,
          and Effie's is taking longer than I would like. Their
          mother is proud and will not call. If you happen past
          the cottage on the way back, my favour for a year."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Reverend — the bench is yours." Miss Ferguson's manner
          shifts toward the careful directness she uses with the
          minister. "There is a household in the school I would
          rather not name in here, but the children have been
          quieter than children should be these two weeks. If you
          are at the manse tonight, I will walk by after supper."
      - applies_to: { class: "Society" }
        beat: |
          "Sit. The bench, please." Miss Ferguson's smile is small
          and unsentimental. "Your aunt has been an excellent
          subscriber to the school's lending library, and I am due
          to call. If you will tell her I will be up on Friday at
          tea-time, I will be obliged. Take a barley sugar from
          the tin on the desk; the children are not here to notice."
      - applies_to: { class: "Governess" }
        beat: |
          "Sister." Miss Ferguson does not use the word lightly, and
          her face warms a degree at saying it. "I have a slate I
          would rather not show to Sergeant MacRae just yet, and
          a child at the gate who has not gone home. Sit. I am
          asking you, between teachers, what you would do."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant." Miss Ferguson straightens slightly. "I have
          not sent for you, and what I am about to show you is in
          a child's hand. I will trust your discretion, and I will
          trust your discretion twice." She lifts a slate from the
          top of the stack and holds it. "Read what is at the
          bottom. Then I will tell you whose slate it is."
      - applies_to: { class: "Explorer" }
        beat: |
          "Colonel — the bench by the stove is warmer than the
          parlour." Miss Ferguson resumes her marking. "I have
          taught your housekeeper's grandson, and I will tell you
          frankly that your cottage roof is the wonder of the village
          children, who have a competition going as to who will be
          first invited inside. The eldest MacRae girl is winning."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # SOLO #6 — Castle Ross stables (Country Vet's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_castle_stables_lameness
    name: "Castle Ross — the stables, a hunter standing wrong, Old Tam waiting at the door"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: castle_ross
      situation: >-
        Eleven in the morning. The laird's bay hunter has been
        standing wrong since the hunt meet on Saturday and Old
        Tam Cattanach, the gillie, has sent down for a professional
        eye. The day is bright and cold. Sir Iain is shooting; Lady
        Annabel is at the lodge with the housekeeper's accounts; the
        stables are quiet but for one tack-man whistling at the far
        end. The hunter is in the second loose-box, head down.
      present_npcs:
        - old_tam
    tone:
      register: "practical, professional, the steady kindness of working hands"
      stakes: "none on turn 1 — animal is uncomfortable, not in danger"
      complication: "defer to turn 2 or 3 — surfaces from what's in the tack-room"
      sensory_layers:
        smell: >-
          Sweet hay, leather oil from the tack-room, the warm-stall
          smell of a horse that has stood overnight, the faint cold
          stone smell of the courtyard.
        sound: >-
          A horse breathing. A wood-pigeon in the lime walk. The
          distant single report of a shotgun on the high ground —
          Sir Iain's. The tack-man whistling something pre-war from
          the far end of the stable.
        touch: >-
          The smooth wood of the loose-box rail. The warm flank of a
          horse leaned against in patience. The cold morning air
          across the back of the neck under the stable arch.
      avoid_at_all_costs:
        - the horse being mortally injured or having to be put down on turn 1
        - any human body, any death, any forensic detail on turn 1
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      Castle Ross's stable courtyard is a cobbled square enclosed on
      three sides by a long stable block of the same Highland-
      baronial stone as the house. The clock above the carriage arch
      says eleven. The morning is bright and cold; the cobbles are
      wet from a stable-lad's bucket and the air smells of leather
      oil and sweet hay. A wood-pigeon is in the lime walk on the
      drive side.

      Old Tam Cattanach is at the door of the second loose-box,
      tweed cap in hand, with the steady, patient bearing of a man
      who has been gillie at Castle Ross longer than the present
      laird has been laird. "Aye. Thank you for coming up so prompt.
      I'll not waste your time. The bay hunter has been standing
      wrong since Saturday's meet, and Sir Iain wants him sound
      for the Tuesday hunt, and I would not lay a fortune on
      Tuesday at this minute. The leg is right there." He
      indicates with the cap.

      Inside the loose-box, the bay is on three legs and not on
      four, head a little down, the off-fore not bearing weight
      properly. There is no swelling. The hoof has been picked out
      since Saturday and the leg has been hosed; Old Tam will have
      done both. He is not the kind of gillie who would have failed
      to.

      "I have not let anyone else in to look at him until you got
      here." Old Tam lays a hand on the bay's neck and the bay
      breathes out heavily and lets his head down another inch.
      "And the lad with the bucket is the tack-man's son and the
      tack-man's son is to be trusted. The tack-room is the third
      door on the right; the kettle is on. Take your time."
    first_turn_invitation: |
      The bay is unbothered by your presence. Old Tam has stepped
      back a pace to give you the box. The wood-pigeon in the lime
      walk has not stopped. There is no swelling, but the leg is
      not bearing weight properly.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        Old Tam clears his throat in the careful way of a man who
        is about to say a thing he would prefer not to have to say.
        "I would not bring this up if it were the bay's leg alone.
        But the tack-room is the third door on the right, and there
        is a thing on the bench in it that came in with the
        Saturday tack and has not been claimed by any rider I know.
        I would be obliged for a second pair of eyes on it before
        Sir Iain comes down off the hill at one."

        He does not say what is on the bench. He looks once toward
        the high ground where the shotgun went off, and once
        toward the tack-room door, and he stays where he is by
        the bay's head.

        The wood-pigeon in the lime walk falls silent for a moment
        and then resumes.
      escalation_path:
        turn_2_or_3: >-
          The thing in the tack-room is the wrinkle. By turn three
          the player will have looked, or Old Tam will name it, or
          Sir Iain will be back from the hill. Object on the bench:
          narrator's choice on the basis of the player's vocation —
          an unfamiliar riding crop with a foreign maker's mark; a
          spent shotgun shell that should not be there; a glove that
          is the wrong size for the household. Do not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          Old Tam tips his cap further back. "Doctor — I have not
          sent down for you, and I will not pretend the horse is
          a person. But you are the only set of careful hands the
          glen has, and Mr. Dempster the vet from Cullenmore is
          three hours away on the morning train. I would consider
          a look an enormous kindness, with no charge expected."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Reverend — you came up at Lady Annabel's word, I take it."
          Old Tam's manner softens. "She is in the lodge office at
          this hour. I am to bring you across the moment you are
          finished here. She would not have called you for the bay's
          leg. There is a thing in the tack-room she will want you
          to look at."
      - applies_to: { class: "Society" }
        beat: |
          Old Tam touches his cap. "Up for the shooting, then.
          Sir Iain is on the high ground and Hugo went up with him.
          They will be down at one. The bay's leg is a bother but
          you have a quarter of an hour spare; if you would lean
          on the rail and pretend an interest in the leg, I would
          be obliged."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss." Old Tam's manner formalises a degree. "Lady
          Annabel asked me to send word if you came up — she is
          arranging the children's harvest at the school and would
          take a quarter of an hour over tea before you walk down.
          The bay's leg, in the meantime, is no concern of yours
          but I am grateful for the company."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant — I am glad of the call." Old Tam does not look
          at the tack-room door. "The bay's leg is real, and I will
          not pretend it is not, but the matter I sent down about
          is in the tack-room. I would prefer Sir Iain heard about
          it from you rather than from me, when he comes down."
      - applies_to: { class: "Explorer" }
        beat: |
          Old Tam's eye warms a degree. "Colonel. Sir Iain said you
          might come up. The Sutherland mare you admired at the
          summer meet is the third box along; she has settled well.
          The bay here is the trouble of the morning. If you have
          a quarter of an hour, you and I have not had a proper
          conversation since the spring."
    magic_microbleed: null

  # ──────────────────────────────────────────────────────────────────
  # SOLO #7 — The Bridge (Village Constable's signature POI)
  # ──────────────────────────────────────────────────────────────────

  - id: solo_bridge_constable_tea
    name: "The Bridge — Sgt MacRae's quarters, the kettle on, the bicycle against the rail"
    triggers:
      mode: solo
      min_players: 1
      max_players: 1
      backgrounds: []
    setting:
      location_label: the_bridge
      situation: >-
        Half past three on a still autumn afternoon. Sergeant
        Findlay MacRae has just had his tea in the small whitewashed
        cottage that serves as the village's police house, at the
        south end of the bridge. His bicycle is leaning against the
        bridge rail. He has been waiting, in the way constables wait,
        for whoever is going to come down the lane next. He is not
        expecting anyone in particular and is therefore expecting
        everyone.
      present_npcs:
        - sgt_macrae
    tone:
      register: "methodical, patient, the long courtesy of a county sergeant"
      stakes: "none on turn 1"
      complication: "defer to turn 2 or 3 — surfaces from a notebook entry"
      sensory_layers:
        smell: >-
          The cold-water smell of the burn under the bridge, peat
          smoke from the constable's chimney, the leather of a
          well-tended bicycle saddle, a faint paraffin smell from
          the cottage lamp left burning for a dim afternoon.
        sound: >-
          The Allt Ross over its stones beneath the bridge. The
          milestone-and-leaves sound of a single cart going up the
          north lane. The sergeant's regulation notebook closing
          and reopening as he checks something against itself.
        touch: >-
          The bridge parapet's smooth cold stone. The pencil stub
          worn to a usable length. The bicycle saddle's slight
          warmth where the sergeant has been sitting on it
          intermittently for the last twenty minutes.
      avoid_at_all_costs:
        - any body, any death, any forensic detail on turn 1
        - the sergeant being officious, suspicious, or hostile (he is not)
        - asking the player a question — turn 1 closes on a declarative
        - the gothic register
        - moving the player without their input
    establishing_narration: |
      The bridge over the Allt Ross is three stone arches at the
      heart of the village, with a milestone at the south end —
      Inverness 28, Cullenmore 7 — and a small whitewashed cottage
      tucked behind a hedge on the south bank that serves as the
      county constabulary's only Glenross outpost. The cottage door
      is propped open; the kettle has just come off; a notebook is
      open on the bridge parapet, weighted down by a pencil.

      Sergeant Findlay MacRae is leaning on the parapet beside the
      notebook, looking neither at it nor at the river. His bicycle
      is propped against the bridge rail with its bicycle clip on
      the saddle. He has had his tea. He has done his afternoon
      walk to the kirk and back. He is, by all visible appearances,
      doing nothing — but his eyes are tracking the lane up to the
      crossroads and the lane down toward the railway halt with the
      easy economy of a man who has worked the same village for
      eighteen years and would notice a new pair of boots before he
      had registered the wearer.

      He looks at you over the bridge and the smile is unhurried.
      "Aye. Afternoon." He nods once. "I'd offer tea, but you'll
      have seen the kettle's just off, and I have not the heart for
      a second pot before five. The cottage is open and the bench
      under the lime is the warmer seat. Sit, if you've a mind. I
      have not been called on these three hours and I expect that
      will not last."

      The Allt Ross is running dark and quick beneath. Up at the
      kirk a single bell rings the half-past three.
    first_turn_invitation: |
      Sgt MacRae has gone back to looking at nothing in particular,
      which is what village constables look at when they are doing
      their most attentive work. The notebook on the parapet has
      not been opened. The bicycle clip is on the saddle and not on
      his ankle.
    soft_hook:
      kind: pull_not_push
      timing: "surfaces if conversation lulls; otherwise wait for turn 2"
      narration: |
        The sergeant unclips the bicycle clip from the saddle and
        re-clips it to his right ankle in the precise economical
        movement of a man preparing to walk somewhere. He does not
        get on the bicycle. He picks up the notebook from the
        parapet and turns to a page that is two pages back from
        today's.

        "I keep a record." He says it conversationally, not to
        anyone in particular. "Most days are empty pages. Three days
        ago there is an entry that is not empty. A gentleman went
        up the Long Pass at four in the afternoon, came down at
        seven, and did not stop at the inn on the way back —
        which is the only thing about him that would make me write
        it down at all. He has not been seen since."

        He closes the notebook unhurriedly and tucks it into the
        breast pocket of his tunic. "I have not yet decided whether
        it is anything."
      escalation_path:
        turn_2_or_3: >-
          The unaccounted gentleman is the wrinkle. By turn three
          the player will be walking the Long Pass with the sergeant
          on a pretext, or a witness from the inn will surface, or
          the man's name will be guessed. Narrator picks the path on
          the basis of the player's vocation. Do not preview.
    per_pc_beats:
      - applies_to: { class: "Doctor" }
        beat: |
          Sgt MacRae touches his cap. "Doctor — your father served
          here, didn't he, before the surgery was built. I will not
          waste your time with hypotheticals. There is a man I have
          on my mind who walked up the Pass three days ago. If you
          have heard of any stranger calling at a household between
          here and Cullenmore, I would be obliged to know."
      - applies_to: { class: "Clergyman" }
        beat: |
          "Reverend." Sgt MacRae's manner softens to the careful
          courtesy he uses with the manse. "I will not ask you to
          break a confidence and I never have. I will only say that
          the man I have on my mind walked up the Pass on Tuesday
          and walked down at seven and that the manse is on the way
          back from the Pass."
      - applies_to: { class: "Society" }
        beat: |
          "Up at the Hall, then. I'll not detain you." Sgt MacRae
          glances along the lane toward Castle Ross's gates.
          "Sir Iain has been kind enough to let me know when the
          shooting parties go up the high ground. If you are dining
          there tonight, I would consider it a courtesy to be told
          which guests took a stroll on the Pass Tuesday last."
      - applies_to: { class: "Governess" }
        beat: |
          "Miss." Sgt MacRae tips his cap. "Effie MacRae is my
          brother's daughter and she has been quiet in the school
          this week and quieter at home. I do not ask you to break
          a teacher's discretion. I do ask, if you will, whether
          a stranger spoke to the children on the lane on Tuesday
          afternoon. They notice strangers."
      - applies_to: { class: "Detective" }
        beat: |
          "Sergeant." Sgt MacRae's smile broadens by a faint degree
          — the recognition between two men of the same trade.
          "I have a county colleague at the next table, then. Sit.
          The notebook is yours to read if you wish. I have one
          entry from Tuesday I will not pretend to be at ease with."
      - applies_to: { class: "Explorer" }
        beat: |
          Sgt MacRae nods slowly. "Colonel. The Pass walked is a
          good walk for a man with a thought. If you took it on
          Tuesday afternoon between four and seven you would have
          met a single gentleman coming down at six who has not
          since been seen in the village. I do not say this to
          imply you did. I say it to ask whether you would."
    magic_microbleed: null

