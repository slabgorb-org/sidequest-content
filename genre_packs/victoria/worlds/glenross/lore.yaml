world_name: Glenross

history: >-
  The Ross family of Castle Ross took the glen in the 1740s and have
  held it ever since. The kirk of St. Maelrubha was restored in the
  1850s with the laird's father's money. The Munro distillery was
  established in the 1820s on a licence the laird's grandfather
  granted; three generations on, the Munros have built a quietly
  growing reputation in Edinburgh and London. The railway came
  thirty years ago and the village rearranged itself around the
  halt. The present laird, Sir Iain Ross, took the estate twelve
  years ago after his father died of a chill on the Twelfth — Iain
  was not raised to inherit it, his elder brother having died as a
  child of rheumatic fever. The village's living memory holds the
  South African War (the war memorial in the kirk porch carries
  three names), the laird's father's death, and Mr. Murchison's
  wife's death five years ago, in roughly that order of weight.

geography: >-
  A fictional Highland glen, running east-west. The river Allt Ross
  threads through the glen and is bridged by a single three-arch
  stone bridge at the village centre. The railway runs north-south,
  crossing the glen at the village's southern edge where a single
  platform serves the village. To the north the glen narrows into
  the Long Pass and rises toward the high shielings and the Ross of
  Glenross peak. To the south the glen opens onto farmland and
  ultimately the sea loch a parish over. Castle Ross sits on the
  rise above the bridge, visible from almost anywhere in the
  village. The kirk on its mound is the village's geographic
  centre after the bridge. The distillery sits west of the bridge
  along the burn-side, downwind by design. The cricket and shinty
  ground is east of the village on the laird's leased meadow.

cosmology: >-
  The village's cosmology is materialist by default — at Glenross's
  gothic axis of 0.05, every chill has a rational explanation, the
  green lady at Castle Ross is the wallpaper, the burnt shieling is
  history rather than haunting, and the white stag of the Ross is a
  biological pattern treated as legend by tradition. Two churches
  hold the village's spiritual life: the parish kirk (Church of
  Scotland) and the small Episcopal chapel of St. Margaret's. The
  Wee Free meet in a barn on the third Sunday of the month. The
  laird's family attend the chapel; most of the village attends the
  kirk.

# Freeform world detail (schema permits extras).

overview: >-
  Glenross is a working Highland village in the Edwardian afternoon
  of empire — large enough to support a minister, a doctor, a school,
  a post office, an inn, and a distillery; small enough that everyone
  knows everyone's business by sundown. Visiting season runs August
  through October. The rest of the year is the village by itself,
  which is when most mysteries — those drawn from the village's own
  quietly accumulated tensions — tend to happen.

economy: >-
  Castle Ross (the laird's house — rents, gillies, household,
  gardens), the Munro distillery (the village's outward-facing
  industry), the home farm and a dozen tenant crofts, salmon
  fishing in season (the laird's gillies manage the beats), and
  hospitality (the inn keeps three rooms for visiting sportsmen).
  The school, the surgery, the post office, the tea rooms, the
  smithy, the manse — the small infrastructure that holds the
  village together.

religion: >-
  Church of Scotland — the parish kirk of St. Maelrubha, Rev.
  Andrew Murchison, the village's senior moral voice. Scottish
  Episcopal — the small chapel of St. Margaret's, Rev. Alistair
  Quill, English-educated, congregation of perhaps forty including
  the laird's family. Wee Free — a small congregation meets in a
  barn the third Sunday of the month. The minister and the rector
  are cordial. The kirk session and the chapel vestry do not
  overlap. The laird's family attends both, as required.

transport: >-
  The railway (two trains a day, north to Inverness, south to the
  coast); the road (single-track, unmade above the village, paved
  through the village centre); bicycles (the constable, the
  doctor, the postmistress, the schoolmistress, the rector, the
  younger Munros, anyone going to Cullenmore); motor-cars (three
  in the parish — the laird's Riley, the doctor's smaller car, an
  occasional visitor's); horse and trap (Castle Ross keeps four;
  the inn keeps a pair for the visiting trade).

period_texture: >-
  Telephones — two in the village (the doctor's and the post
  office); Castle Ross has its own line. Electricity — Castle
  Ross has a private plant; the village runs on gaslight and
  oil. The wireless telegraph is novel news; the postmistress
  dispenses Marconi messages with the same gravity as Royal
  Mail. King Edward is on the throne. The 1903 Wright Brothers
  flight is still news. Women's suffrage is gathering in the
  cities and arriving in the glen via the schoolmistress's
  pamphlets. The South African War is a recent memory; the
  Retired Colonel served in it. Class is still load-bearing but
  mobility is increasing — the doctor's daughter at university,
  the distiller's son at the bar in Edinburgh.

cosy_constraints: >-
  Body discovery is always off-stage or tidy; never forensic.
  Recurring cast (the warm cast) are never the victim. Children
  and animals are never harmed. The supernatural exists only at
  the highest gothic dial; default is rational explanation.
  Romance is restrained, optional, gentle; never the engine of a
  session. Each session is one mystery, resolved cleanly.

the_village_voice: |
  Glenross is loyal to its own. It will defend a long-resident
  against an outsider's accusation almost reflexively, and the
  sleuth must work with this rather than against it. It is patient
  with returners and curious about visitors. It maintains a
  courteous distance from the Big House and a familiar warmth
  toward the manse, the surgery, the school, the post office, and
  the tea rooms — its working professionals. It distrusts hurry,
  performance, and anyone who treats the village as a backdrop.
  It rewards observation, care, and the willingness to wait out
  a story until it tells itself.
