# Glenross — World Visual Style
#
# WIRING: positive_suffix layers onto genre's positive_suffix.
#
# AUTHORING RULE (learned from coyote_star playtest 2026-05-03):
# This file describes HOW to render, not WHAT to render. Every render
# (portrait, interior, exterior, POI landscape) layers this on top of
# its own subject. Object-nouns here become artifacts the model paints
# into every scene — "lamp" puts a lamp in the lawn party, "kettle"
# puts a kettle in the chase scene, "rose garden" puts roses behind
# every portrait.
#
# So: only style, medium, palette, light, and composition vocabulary.
# Abstract qualifiers ("sunlit", "soft-edged", "watercolour-bleed") are
# fine — they describe a surface treatment for whatever subject is
# rendered. Concrete nouns ("kettle", "lamp", "kirk", "bridge") are
# NOT — they crystallize as objects in every frame regardless of subject.
#
# Concrete subject vocabulary belongs in per-POI / per-portrait prompts
# (portrait_manifest.yaml entries, /sq-poi landscape prompts), not here.
#
# Negative-style instructions ("no thatch, no kilt") do NOT work —
# Z-Image runs at guidance_scale=0 and ignores negation. The only
# working defense against an unwanted object is to never name it.

positive_suffix: >-
  Edwardian watercolour on heavy paper in the lineage of Helen Allingham
  and Sutton Palmer crossed with the soft pastoral register of vintage
  British postcard art. Visible paper grain, washed pigment with soft
  bleed at edges, fine line drawing beneath the colour, gentle aerial
  perspective. Light is golden-afternoon and warm-directional, source
  upper-left, shadows pooling warm umber and faded sepia rather than
  cool blue. Palette favours moss-green and heather-purple, warm
  cream and brass-and-honey ochre, with bracken-russet for autumn
  texture. Surfaces read as lived-in, hand-worn, gently weathered.
  Atmosphere mild, never harsh — mist softens distance, weather is
  pastoral rather than gothic. Composition prefers layered depth
  (clear foreground, soft middle, atmospheric distance), restraint,
  and the British landscape watercolour habit of leaving paper-light
  to do half the work. The accent that carries the painting's
  emotional anchor is a single warm honey-gold note — saved, not
  spent. No text, no caption, no title, no writing, no label, no
  signature, no watermark.

negative_prompt: ""

preferred_model: dev

base_seed: 1908
