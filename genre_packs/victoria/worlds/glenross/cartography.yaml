map_resolution: null
map_style: >-
  A handpainted parish map in the style of an Ordnance Survey reissue
  c. 1905 — village centre rendered in fine ink, the river Allt Ross in
  pale blue, the kirkyard and the Big House labelled in copperplate, the
  surrounding glen in soft watercolour wash of heather purple and bracken
  ochre. Tea-coloured paper. The cartographer was the schoolmistress's
  brother on a winter visit.
navigation_mode: region
starting_region: the_glenross_arms
world_name: Glenross

regions:
  the_glenross_arms:
    name: The Glenross Arms
    summary: "The village inn, the fire going, the publican wiping the bar"
    description: >-
      A two-storey stone building at the village crossroads with a slate
      roof, three small dormer windows above and a swinging sign painted
      with the Ross arms. Bar through the door on the right, parlour on
      the left, three rooms upstairs with sloping floors and a view of
      the burn from the back bedroom. Hamish Sinclair keeps it, his dog
      Caley sleeps in front of the fire, and the snug at the end of the
      bar is where the village's quieter conversations happen.
    terrain: building
    controlled_by: hamish_sinclair
    adjacent:
      - the_post_office
      - the_kirk_of_st_maelrubha
      - the_bridge
      - the_surgery
    landmarks:
      - the bar with its slate of regulars' tabs
      - the snug at the end with its private fire
      - the upstairs landing with three numbered doors
      - the stable yard behind, used for visiting traps
    rivers: []
    settlements: []

  the_post_office:
    name: The Post Office
    summary: "Mrs. Buchan's domain — counter, telegraph, parcel scale, kettle"
    description: >-
      The post office is a single low-ceilinged room with a polished
      counter, a brass scale, a telegraph machine in the back behind a
      curtain, a wooden chair for waiting villagers, and a kettle that is
      always either just on or just off. Catriona Buchan keeps it, and
      the back room is where she lives. The window looks out on the
      lane; the postmistress reads the world as it walks past.
    terrain: building
    controlled_by: catriona_buchan
    adjacent:
      - the_glenross_arms
      - the_tea_rooms
      - the_school
      - the_bridge
    landmarks:
      - the brass scale on the counter
      - the telegraph machine behind the back curtain
      - the village notice board outside, where the funerals and the cricket fixtures are pinned
    rivers: []
    settlements: []

  the_tea_rooms:
    name: Mrs. Cameron's Tea Rooms
    summary: "Three round tables, a counter, china that does not match"
    description: >-
      A small parlour off the lane with three round tables in starched
      linen, a counter, a kitchen behind a half-door, and a window of
      mismatched panes. Mrs. Cameron runs it, her cook bakes seed cake
      on Mondays and shortbread on Thursdays, and the geraniums in the
      window are her late mother's. The village's daytime social life
      happens here — the parish committee, the lift to the schoolhouse,
      the unofficial reckoning of who has been seen with whom.
    terrain: building
    controlled_by: mrs_cameron
    adjacent:
      - the_post_office
      - the_school
      - the_glenross_arms
    landmarks:
      - the geraniums in the front window
      - the round table by the door (the gossip table)
      - the corner table behind the screen (the discreet table)
      - the slate behind the counter with the day's specials
    rivers: []
    settlements: []

  the_school:
    name: The School
    summary: "Thirty children, a slate, a bell, and Miss Ferguson"
    description: >-
      The schoolhouse is a single long room with a coal stove at one end,
      tall windows, slate-grey desks in rows, the inkwells filled every
      Friday afternoon, and a bell rung at quarter past and quarter to.
      Miss Margaret Ferguson teaches from seven years old to fourteen.
      The schoolmistress's cottage is attached at the back. The schoolyard
      runs down to a hawthorn hedge and a stile onto the path to the
      railway halt.
    terrain: building
    controlled_by: margaret_ferguson
    adjacent:
      - the_post_office
      - the_tea_rooms
      - the_railway_halt
    landmarks:
      - the coal stove at the far end (the warmth bench is the privilege of the eldest)
      - the schoolmistress's slate on the wall, with the day's text
      - the cottage door through the back of the schoolroom
      - the schoolyard hawthorn hedge
    rivers: []
    settlements: []

  the_surgery:
    name: The Surgery
    summary: "Dr. Ross's consulting room, dispensary, and waiting bench"
    description: >-
      A converted cottage opposite the inn, painted cream, with surgery
      hours posted on the door (Mon-Wed-Fri, ten to noon and four to six).
      The waiting room is the front parlour with a bench along the wall
      and a small shelf of well-worn books. The consulting room is
      behind, with the examining couch and the dispensary cabinet. Dr.
      Eilidh Ross lives upstairs. One of the village's two telephones is
      mounted on the surgery wall.
    terrain: building
    controlled_by: eilidh_ross
    adjacent:
      - the_glenross_arms
      - the_manse
      - the_kirk_of_st_maelrubha
    landmarks:
      - the surgery telephone (a village utility as much as a private line)
      - the dispensary cabinet
      - the examining couch behind the curtain
      - the waiting bench under the parlour window
    rivers: []
    settlements: []

  the_manse:
    name: The Manse
    summary: "Rev. Murchison's house — beekeeper, rose-grower, listener"
    description: >-
      A handsome stone house beside the kirkyard, two storeys, slate
      roof, sash windows with the curtains never quite drawn. Andrew
      Murchison lives here alone since his wife's death five years ago,
      kept in order by his housekeeper Mrs. Drummond. The walled garden
      behind has six hives, a bench, and roses that take the autumn
      sunlight beautifully. The minister's study at the front looks
      onto the lane.
    terrain: building
    controlled_by: andrew_murchison
    adjacent:
      - the_surgery
      - the_kirk_of_st_maelrubha
      - st_margarets_chapel
    landmarks:
      - the minister's study at the front
      - the walled garden with the bee-hives
      - the kitchen door onto the kirkyard
      - the parlour where parishioners are received
    rivers: []
    settlements: []

  st_margarets_chapel:
    name: St. Margaret's Chapel
    summary: "Scottish Episcopal — Rev. Quill's small congregation"
    description: >-
      A small chapel of Aberdeenshire granite, a single nave, a vestry,
      and a porch with a noticeboard listing services in a copperplate
      hand. Rev. Alistair Quill has been rector here twelve years and
      lives in the cottage behind, which has a study smelling of beeswax
      and ink and a kitchen that needs more light than it gets. The
      congregation of forty includes the Ross family of Castle Ross and
      a scattering of recusant farmers from the upper glen.
    terrain: building
    controlled_by: alistair_quill
    adjacent:
      - the_manse
      - the_kirk_of_st_maelrubha
    landmarks:
      - the chapel porch with the noticeboard
      - the vestry with the rector's robes and the parish register
      - the rector's study in the cottage behind
      - the small walled chapelyard with three graves
    rivers: []
    settlements: []

  the_kirk_of_st_maelrubha:
    name: The Kirk of St. Maelrubha
    summary: "The parish kirk on its mound, with the long kirkyard sloping to the burn"
    description: >-
      A Norman-Scoto-medieval parish kirk on a low mound at the village
      centre, restored in the 1850s with the laird's father's money.
      Square bell-tower, a long nave, oak pews dark with three centuries
      of polish, the laird's family pew at the front and the village's
      working pews behind. The kirkyard slopes down to the burn,
      gravestones leaning, moss bright in the rain. The Murchisons,
      Munros, Buchans, Ferguson, and MacRaes are all in here somewhere.
    terrain: building
    controlled_by: kirk_session
    adjacent:
      - the_manse
      - the_surgery
      - st_margarets_chapel
      - the_cricket_ground
      - the_glenross_arms
    landmarks:
      - the bell-tower (the bell is rung for funerals, Sundays, fires, and the New Year)
      - the laird's pew at the front
      - the war memorial in the porch (South Africa, three names)
      - the kirkyard slope down to the burn
    rivers: []
    settlements: []

  the_railway_halt:
    name: Glenross Halt
    summary: "A single platform, two trains a day, Stationmaster MacGregor"
    description: >-
      A single platform of dressed stone with a wooden waiting room, a
      ticket window, a stationmaster's office, a small goods siding for
      whisky barrels, and a kettle in the office that is always on.
      Albert MacGregor is stationmaster, has been for twenty years, and
      knows by face every regular passenger and every regular freight.
      Two trains a day — the morning up from the south, the afternoon
      down from Inverness. Anything happening in the village that
      involves the world arrives or departs from this platform.
    terrain: building
    controlled_by: albert_macgregor
    adjacent:
      - the_school
      - the_bridge
    landmarks:
      - the stationmaster's office (kettle always on)
      - the goods siding for the distillery
      - the ticket window
      - the wooden bench under the awning
    rivers: []
    settlements: []

  the_bridge:
    name: The Bridge over the Allt Ross
    summary: "The single stone bridge at the centre of the village"
    description: >-
      A handsome stone bridge of three arches across the river Allt Ross
      at the village centre. The drove road crossed here a hundred years
      before the railway arrived; the road now turns east-west at the
      bridge to the Pass and to the coast respectively. The river runs
      dark and fast over the stones beneath; in autumn the leaves
      collect against the upstream side of the central arch and the
      gillie clears them once a week.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_glenross_arms
      - the_post_office
      - the_railway_halt
      - the_distillery
      - the_long_pass
    landmarks:
      - the three stone arches
      - the central span (the place where the village stops to look at the river)
      - the upstream side where the leaves collect
      - the milestone at the south end (Inverness 28, Cullenmore 7)
    rivers: [allt_ross]
    settlements: []

  the_distillery:
    name: The Munro Distillery
    summary: "Three generations of Munros, a working still, peat-smoke in November"
    description: >-
      The distillery sits west of the bridge along the burn, downwind by
      design. A long stone building with two pagoda-roofed kilns, a
      mash house, the still room, three bonded warehouses, and a small
      office where Donald Munro keeps the books and the visitors. The
      copper stills are sixty years old. The current vintage is
      well-spoken-of in Edinburgh; a London merchant ordered three
      casks last spring. The distillery is the village's outward face.
    terrain: building
    controlled_by: donald_munro
    adjacent:
      - the_bridge
      - castle_ross
    landmarks:
      - the two pagoda kilns
      - the bonded warehouse (number one — the longest aged)
      - the still room with the two copper stills (Caelidh and Brigid)
      - the distiller's office with the tasting cabinet
    rivers: [allt_ross]
    settlements: []

  castle_ross:
    name: Castle Ross
    summary: "The laird's house on the rise — Highland baronial, late additions"
    description: >-
      A late-Georgian house with a Highland baronial restoration of the
      1870s — turret, crow-stepped gables, a porte-cochère added in 1888
      for the visiting Royal stalking party that never quite happened.
      Twenty bedrooms, fourteen of them in use during the season. Walled
      gardens on the south side, the river below, the parkland and home
      farm to the west. Sir Iain and Lady Annabel keep it; their son
      Hugo is here for the autumn. The household is the village's largest
      single employer.
    terrain: building
    controlled_by: ross_family
    adjacent:
      - the_distillery
      - the_long_pass
      - the_cricket_ground
    landmarks:
      - the porte-cochère and the main door
      - the library on the south side (the laird's room)
      - the rose garden (the gardener's domain — and the place where bodies are sometimes found)
      - the gun-room beside the stables
      - the long drive down to the lodge gates
    rivers: []
    settlements: []

  the_cricket_ground:
    name: The Cricket and Shinty Ground
    summary: "The village's social fixture meadow — both codes, friendly rivalries"
    description: >-
      A long flat meadow east of the kirk, leased from the laird and
      kept by the village. Cricket through the summer, shinty in
      autumn, the parish fete in late August. The pavilion at the
      north end is the village's only structure of pure leisure — a
      wooden, lime-washed, slate-roofed clubhouse with a verandah and
      two changing rooms. The visiting Cullenmore eleven and shinty
      fifteen come up by train; the rivalry is older than the railway.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_kirk_of_st_maelrubha
      - castle_ross
    landmarks:
      - the pavilion at the north end
      - the cricket square at the centre
      - the shinty goals (north and south)
      - the marquee field where the fete is held
    rivers: []
    settlements: []

  the_long_pass:
    name: The Long Pass
    summary: "The drove road north up the glen toward the shielings"
    description: >-
      The Long Pass is the road north out of the village, climbing
      gently for two miles before it narrows into a pass between the
      Ross of Glenross to the east and the lower Ben Eilidh to the
      west. Beyond the pass the road becomes a track, the track
      becomes a path, and the path leads to the high shielings, the
      deer forest, and eventually — if you keep going for a day —
      another parish. The Pass is where chase scenes and body
      discoveries happen; it is also where the village walks of a
      summer evening for the view.
    terrain: outdoors
    controlled_by: village
    adjacent:
      - the_bridge
      - castle_ross
    landmarks:
      - the high cairn at the head of the pass (built by a previous laird's wife)
      - the burnt shieling (a ruin, late 1860s, the cause is folklore now)
      - the view of the glen back south, on a clear day
      - the path that branches east to the Ross summit
    rivers: [allt_ross]
    settlements: []
