# English Gentry — visual identity tokens for the Castle Ross
# household (laird, his wife, the heir, visiting Edinburgh aunt,
# London cousins). Late-Edwardian English country-gentry register,
# c. 1908. Used as the ART_SENSIBILITY.CULTURE composer layer. Kept
# terse: the genre and world style layers already carry watercolour/
# palette/light; this layer adds only what is culturally specific.
# Z-Image discipline: no proper nouns.

visual_tokens: >-
  Late-Edwardian English country-gentry dress c. 1908, tailored and
  restrained. Finely cut tweed shooting suits or Norfolk jackets for
  men, high-collared lawn shirtwaists and ankle-length skirts for
  women, pearls or a fine gold locket, hair in a softer Edwardian
  pompadour. Smooth pale complexions, confident relaxed bearing.
