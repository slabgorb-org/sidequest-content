# Highland Scots — visual identity tokens for Glenross village
# characters (minister, doctor, postmistress, schoolmistress, publican,
# constable, distiller, tea-rooms, gillie, stationmaster, housekeepers).
# Edwardian Highland working-and-professional register, c. 1908. Used
# as the ART_SENSIBILITY.CULTURE composer layer. Kept terse: the genre
# and world style layers already carry watercolour/palette/light;
# this layer adds only what is culturally specific. Z-Image discipline:
# no proper nouns.

visual_tokens: >-
  Hardwearing Edwardian Highland village dress c. 1908. Sturdy tweeds
  in moss-green or heather-grey, plain flannel shirts, sensible
  hobnailed boots, the working professions in dark sober wool. Faces
  pale-Scots and weather-tested, not ruddy. Hair pinned plain — not
  the showier English pompadour. Quiet self-contained bearing.
