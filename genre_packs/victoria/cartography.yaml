world_name: ""
starting_region: county
map_style: "Victorian engraved map in sepia and black ink, ornate compass rose, cross-hatched terrain, copper-plate lettering"
map_resolution: [1024, 1024]

regions:
  county:
    name: The County
    description: Rolling English countryside — great houses, market towns, parish churches, and lanes hedged in hawthorn. Everyone knows everyone's business.
    origin: origins
    adjacent: [moors, london, industrial_north, coast]

  moors:
    name: The Moors
    description: Vast, windswept, and empty. Heather and bracken, standing stones, and farmhouses miles apart. The sky is enormous and the weather is personal.
    origin: origins
    adjacent: [county, industrial_north]

  london:
    name: London
    description: The great machine — fog, gaslight, crowds, opportunity, and danger. From Mayfair to Whitechapel, every street has its own character and its own price.
    origin: origins
    adjacent: [county, docks, coast]

  industrial_north:
    name: The Industrial North
    description: Mill towns, factory smoke, and the collision of old money and new. Manchester, Leeds, Sheffield — where fortunes are made and people are spent.
    origin: origins
    adjacent: [county, moors]

  docks:
    name: The Docklands
    description: Where the Empire's wealth arrives — cargo, sailors, customs agents, and the underworld that feeds on all three. The Thames at low tide smells of mud and ambition.
    adjacent: [london]

  coast:
    name: The Coast
    description: Seaside towns where the gentry take the air and invalids take the cure. Quieter, slower, full of retired colonials and secrets sent away from London to be forgotten.
    adjacent: [county, london]

routes:
  - from_id: county
    to_id: london
    name: "The Great Western Railway"
    distance: medium
    description: "First class, second class, and the luggage van. Two hours and a different world."
  - from_id: county
    to_id: moors
    name: "The North Road"
    distance: long
    description: "Increasingly empty as the hedgerows give way to open sky."
  - from_id: county
    to_id: industrial_north
    name: "The Midland Railway"
    distance: medium
    description: "The landscape darkens as mills replace manors."
  - from_id: london
    to_id: docks
    name: "Eastward Through the City"
    distance: short
    description: "The streets narrow, the buildings lean, and the air thickens with river and coal smoke."
  - from_id: county
    to_id: coast
    name: "The Branch Line"
    distance: medium
    description: "A single-track railway through farming country to the sea."
  - from_id: london
    to_id: coast
    name: "The Brighton Express"
    distance: short
    description: "London's escape valve — fast, fashionable, and full of gossip."
  - from_id: industrial_north
    to_id: moors
    name: "The Packhorse Road"
    distance: medium
    description: "An old trade route climbing out of the smoke into open air."
