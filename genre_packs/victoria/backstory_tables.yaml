# Backstory tables — Victoria
# Random one-liner backstories used at chargen for atmospheric NPCs and
# for players who decline to write their own. Drawn for a 1860s–1880s
# British setting; class-aware, period-correct.
# Template: "{origin}. {past}. {arrival}."
# The engine picks one from each table and composes.

template: "{origin}. {past}. {arrival}."

origin:
  - Born above a draper's shop in York, the smell of new cloth still in your hair
  - Raised in the parsonage at Whitby, six children to a fire that never drew
  - Daughter of a half-pay captain who drank his pension before he drank his health
  - A foundling left at the workhouse gate in Halifax with a name pinned to the blanket
  - Educated at a girls' school in Cheltenham that taught French, watercolour, and silence
  - The third son of a Lincolnshire vicar — too late for the living, too early for India
  - Born to a Manchester mill-master who made his money in Egyptian cotton and would not say how
  - Raised in the servants' hall of a great house in Northumberland, the family's name on your tongue from infancy
  - A cousin's cousin from County Galway, sent over after the bad years and never sent back
  - Reared in a Bristol counting-house where the ledgers were the only books in the room
  - Born in Calcutta to a regimental surgeon, brought home at seven and never warm again
  - The only child of a London barrister who lost his practice over a question of forged probate
  - Raised in a Quaker household in Darlington, where you learned to sit still and watch
  - Daughter of a Norfolk farmer who lost the farm to the railway company's compulsory purchase
  - Born to a French émigrée governess in a Sussex village, taught to curtsey before you could read
  - A Scottish minister's son from Stirling, the Free Kirk schism your bedtime story
  - Raised in a Paris convent until your aunt remembered you and sent for you in mourning black
  - Born in a Whitechapel tenement, your accent is the first thing in the room
  - The youngest of seven in a Cornish fishing village, the sea took three of your brothers
  - Raised at a girls' charity school in Lowood by a master who said suffering was character
  - Daughter of a Birmingham brassfounder whose patent made him a fortune and a target
  - Born in the Channel Islands and not, technically, English when it suits you
  - Reared in a Liverpool boarding-house your mother kept after your father went to sea and stayed there
  - The orphaned ward of a maiden aunt in Scarborough who left you the house and the gossip
  - Born in a Welsh coalfield town where the chapel bell and the pithead bell were the same note
  - Raised in Edinburgh's New Town, neighbours to advocates and anatomists, both of whom called
  - A regimental child who followed her mother from Aldershot to the Cape and home again
  - Daughter of an Irish horse-trainer whose horses won and whose creditors did not
  - Born to Dissenters in a Dorset village, your family's pew the one farthest from the squire's
  - Raised in a Hampstead villa by a widowed father who collected fossils and forgot meals

past:
  - There was a fire at the school the year you turned twelve, and they never settled what started it
  - Your eldest sister took her own life with laudanum and the family agreed on a fever
  - You corresponded for two years with a man who did not exist; the letters came from someone in the house
  - A child died in your care once. The inquest said croup. You have your own opinion
  - You broke off an engagement at the altar and have not been received in three counties since
  - A draft of a novel sits in your trunk under a false name; the publisher would post here if asked
  - Your father shot himself in the library and the household called it a hunting accident
  - You learned at fourteen that the woman you called mother was your father's sister
  - There is a child in a Wiltshire village whose schooling you pay for and whose name you avoid
  - You testified against a master at your last position and the reference still arrives, polite and useless
  - A man drowned in the millpond the summer you were nineteen; you were the last to see him walking
  - You spent six months in a private asylum near Bath that the family agreed was a Continental tour
  - You were left out of a will you had been promised, and the codicil was witnessed by the housekeeper
  - A letter went into the fire that, if read in court, would have saved a life
  - You nursed your husband through six weeks of dying and discovered, on the seventh, that he had a wife in Boulogne
  - You walked out of a séance in Bayswater and never spoke to your hostess again
  - There was a duel — yes, still — over a remark made in a hotel at Scarborough; a man limps because of you
  - You burned a diary the night before the inquest and could repeat its contents from memory
  - You inherited a debt rather than a fortune, and have been paying it down at fourpence in the pound for nine years
  - A photographer took a portrait of you that ought not to have been taken; he is still alive
  - You taught the daughters of a household whose son later proposed; the offer was withdrawn within an hour
  - You broke a window at the British Museum during a public lecture and cannot fully explain why
  - A friend from your governess years writes from Sydney; the letters say she is well, but the postmarks are wrong
  - You were the one who found the body and the one who suggested they call the doctor before the constable
  - There is a sealed envelope at your solicitor's marked "to be opened only in the event of"
  - You once cashed a cheque that was not, strictly speaking, yours; the matter was settled, but settlements have memories
  - You corresponded with a poet of some reputation; the letters were returned, unread, after his death by a woman not his wife
  - A friend's husband paid you marked attentions one summer; you said nothing, and the friend has not written since
  - You were named in a divorce petition that was withdrawn before it reached the courts; the documents still exist
  - A séance at a Yorkshire hotel produced a name you had told no one, and you have not slept easily through October since

arrival:
  - The letter from Mr Carstairs, the family solicitor, was peremptory and post-paid
  - You answered an advertisement in The Times and received a reply by return that asked no references
  - The Dowager wrote in her own hand and enclosed the railway fare in a separate envelope
  - You came up from London on the late train and found no carriage waiting at Skipton halt
  - A telegram arrived at half past nine: "Come at once. Edmund dead. Bring the papers."
  - Your invitation came through a cousin who, on reflection, you do not believe you have
  - The will named you, and the solicitor would not say why over the wires
  - You are a guest of Lady Blackthorn, who befriended your mother forty years ago and remembered the obligation
  - You were sent by your editor to write three columns on a country house in the autumn
  - The Inspector's letter said your testimony might assist; the warrant card was enclosed by way of courtesy
  - You arrived as a paid companion to a relative who has since taken to her bed and not received you
  - The vicar at Blackthorn wrote to your father's curate, and so it was arranged
  - You came on the strength of a rumour you would not repeat to the household, but came nonetheless
  - You have been asked to value the library; the carriage met you, but the house had not been told
  - You are the new governess. The advertisement did not mention the recent death
  - You were on the moor at sunset and accepted the offer of shelter with an alacrity you now regret
  - A standing invitation from the late Sir Edmund — three years old, never withdrawn — has at last become convenient
  - You came as the doctor's locum and were asked, before unpacking, to view the body in the icehouse
  - The Society for Psychical Research forwarded the request; the household had written for "a discreet observer"
  - You came to attend the funeral and discovered the funeral had been a fortnight ago
  - You answered a personal advertisement that gave only initials and a Yorkshire poste restante
  - The Dean of your old college had a friend who had a friend; the chain ended at this gate
  - You came on the morning train from Leeds with a portmanteau and no return ticket
  - A matter of business with the Millbridge mill office took you to the district; the family sent for you when they heard
  - You were summoned as an executor, though you do not recall agreeing to be one
  - You came in answer to an unsigned letter, posted in London, that knew things you have never written down
  - The household has been unable to keep a maid this season; you took the place sight unseen
  - Your aunt's last letter mentioned the family by name and underlined it; she died before you could ask why
  - You came because the alternative was a winter in your sister-in-law's house in Bath
  - You were invited to the reading of the will and arrived to find that no one had been told you were coming
