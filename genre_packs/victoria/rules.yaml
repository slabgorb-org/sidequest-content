stat_generation: point_buy
point_buy_budget: 27
magic_level: none

ability_score_names:
  - Angst
  - Pride
  - Humour
  - Nerve
  - Cunning
  - Passion

allowed_classes:
  - Governess
  - Detective
  - Society
  - Doctor
  - Industrialist
  - Explorer
  - Clergyman

allowed_races:
  - Gentry
  - Trade
  - Servant
  - Clergy
  - Bohemian
  - Colonial

hp_formula: "class_base + (nerve_mod * level)"

stat_display_fields:
  - hp
  - max_hp
  - standing

class_hp_bases:
  Governess: 6
  Detective: 8
  Society: 6
  Doctor: 8
  Industrialist: 10
  Explorer: 10
  Clergyman: 6

default_class: Governess
default_race: Gentry
default_hp: 6
default_ac: 10
default_location: "The entrance hall of a great house, rain streaking the tall windows"
default_time_of_day: evening

custom_rules:
  lethality: low
  injury_system: none
  rest_variant: standard
  encumbrance: none

  standing_system: >-
    Standing tracks social position from 0 (ruined) to 5 (toast of the season).
    Actions that display virtue, breeding, accomplishment, or connection raise
    Standing. Scandal, impropriety, association with the wrong people, or public
    failure lower it. High Standing opens doors — invitations, introductions,
    favorable terms. Low Standing closes them — cut direct, whispered warnings,
    doors that no longer answer. Standing can change overnight. A single
    revelation at the wrong dinner party can undo years of careful cultivation.

  scandal_system: >-
    Reckless actions, discovered secrets, and social missteps generate Scandal.
    Scandal erodes Standing. Some NPCs trade in Scandal as currency — the
    gossip columnist, the blackmailer, the rival who smiles too sweetly.
    Scandal can be suppressed through influence, favors, or counter-scandal,
    but it never truly disappears. The Narrator tracks Scandal independently
    from Standing — a character can have high Standing AND mounting Scandal,
    living on borrowed time.

  the_occult: >-
    Controlled by the Gothic tone axis. At low: séances are parlor tricks,
    mesmerists are charlatans, ghost stories are for children. At high:
    mesmerism works, the house has a presence, the moors remember the dead,
    and some books should never have been opened. Even at maximum, the
    supernatural is dread and atmosphere, never a toolbox. No one casts
    spells. Things happen that cannot be explained, and the not-knowing
    is the point.

  propriety: >-
    Victorian society runs on rules that are never written down but everyone
    knows. Who speaks first, who sits where, what can be said in mixed
    company, what a glance means, what an uninvited visit implies. Breaking
    propriety is a weapon — sometimes deliberate, sometimes devastating by
    accident. The Narrator uses propriety as environmental hazard: the wrong
    word at dinner is as dangerous as a knife in an alley.

resources:
  - name: standing
    label: Standing
    min: 0.0
    max: 5.0
    starting: 3.0
    voluntary: false
    decay_per_turn: 0.0

encounter_base_tension:
  random: 0.05
  ambush: 0.15
  boss: 0.30
  final: 0.40

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Polite Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Appeal to Reason"
        metric_delta: 2
        stat_check: Cunning
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Veiled Threat"
        metric_delta: 3
        stat_check: Nerve
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "A polite suggestion with steel beneath. Propriety barely maintained."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: Cunning
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Take One's Leave"
        metric_delta: 0
        stat_check: Nerve
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player excuses themselves. The matter is dropped — for now."
    mood: tension
  - type: trial
    label: "Trial by Tribunal"
    category: social
    metric:
      name: conviction
      direction: ascending
      starting: 0
      threshold_high: 8
    beats:
      - id: cross_examine
        label: "Cross-Examine"
        metric_delta: 2
        stat_check: Cunning
        effect: "witness credibility damaged"
        narrator_hint: "Pick apart the testimony. Find contradictions."
      - id: present_argument
        label: "Present Argument"
        metric_delta: 2
        stat_check: Passion
        narrator_hint: "Address the tribunal directly. Be persuasive."
      - id: object
        label: "Object"
        metric_delta: 1
        stat_check: Cunning
        risk: "overruled — lose credibility if frivolous"
        narrator_hint: "Challenge procedure or evidence. Must be substantive."
      - id: yield
        label: "Yield the Floor"
        metric_delta: -1
        stat_check: Passion
        effect: "opponent speaks — may reveal weakness"
        narrator_hint: "Strategic silence. Let them overplay their hand."
    mood: tension
  - type: auction
    label: "Auction"
    category: social
    metric:
      name: bid
      direction: ascending
      starting: 0
      threshold_high: 8
    beats:
      - id: raise
        label: "Raise the Bid"
        metric_delta: 2
        stat_check: Cunning
        effect: "push the price higher — pressure opponents to fold"
        narrator_hint: "A discreet signal to the auctioneer. The bid climbs."
      - id: bluff
        label: "Bluff"
        metric_delta: 3
        stat_check: Nerve
        risk: "called out — lose credibility and 2 bid points"
        narrator_hint: "Feign deeper pockets than you possess. Convince them you'll go higher."
      - id: read_room
        label: "Read the Room"
        metric_delta: 0
        stat_check: Cunning
        reveals: opponent_intent
        narrator_hint: "Study the other bidders. Who is bluffing? Who is desperate?"
      - id: withdraw
        label: "Withdraw"
        metric_delta: 0
        stat_check: Nerve
        resolution: true
        consequence: "bow out gracefully — reputation intact, item lost"
        narrator_hint: "A subtle shake of the head. The bid is yours no longer."
    secondary_stats:
      - name: purse
        source_stat: Cunning
        spendable: true
    mood: tension

