    narrator_hint: A cutting remark, perfectly timed. The room goes quiet.
  - id: appeal_propriety
    label: Appeal to Propriety
    metric_delta: -2
    stat_check: Cunning
    effect: "Invoke social convention to embarrass the opponent"
  - id: composure
    label: Maintain Composure
    metric_delta: 0
    stat_check: Nerve
    effect: "Recover poise — resist the next barb"
  - id: concede
    label: Concede Gracefully
    metric_delta: 0
    stat_check: Humour
    resolution: true
    consequence: "Duel ends — withdraw with dignity intact"
  mood: mystery
- type: scandal
  label: Scandal Eruption
  category: social
  metric:
    name: exposure
    direction: ascending
    starting: 0
    threshold_high: 8
  beats:
