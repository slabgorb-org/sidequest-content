custom_rules:
  lethality: low
  injury_system: none
  rest_variant: standard
  encumbrance: none

  standing_system: >-
    Standing tracks social position from 0 (ruined) to 5 (toast of the season).
    Actions that display virtue, breeding, accomplishment, or connection raise
    Standing. Scandal, impropriety, association with the wrong people, or public
    failure lower it. High Standing opens doors — invitations, introductions,
    favorable terms. Low Standing closes them — cut direct, whispered warnings,
    doors that no longer answer. Standing can change overnight. A single
    revelation at the wrong dinner party can undo years of careful cultivation.

  scandal_system: >-
    Reckless actions, discovered secrets, and social missteps generate Scandal.
    Scandal erodes Standing. Some NPCs trade in Scandal as currency — the
    gossip columnist, the blackmailer, the rival who smiles too sweetly.
    Scandal can be suppressed through influence, favors, or counter-scandal,
    but it never truly disappears. The Narrator tracks Scandal independently
    from Standing — a character can have high Standing AND mounting Scandal,
    living on borrowed time.

  the_occult: >-
    Controlled by the Gothic tone axis. At low: séances are parlor tricks,
    mesmerists are charlatans, ghost stories are for children. At high:
    mesmerism works, the house has a presence, the moors remember the dead,
    and some books should never have been opened. Even at maximum, the
    supernatural is dread and atmosphere, never a toolbox. No one casts
    spells. Things happen that cannot be explained, and the not-knowing
    is the point.

  propriety: >-
    Victorian society runs on rules that are never written down but everyone
    knows. Who speaks first, who sits where, what can be said in mixed
    company, what a glance means, what an uninvited visit implies. Breaking
    propriety is a weapon — sometimes deliberate, sometimes devastating by
    accident. The Narrator uses propriety as environmental hazard: the wrong
    word at dinner is as dangerous as a knife in an alley.

