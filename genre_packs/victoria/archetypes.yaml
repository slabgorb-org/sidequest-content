- name: The Master of the House
  description: >-
    Brooding, wealthy, and carrying a secret that darkens every room he
    enters. Magnetic and mercurial — generous one moment, cold the next.
    The house reflects his moods. There is something in the east wing
    he will not discuss.
  personality_traits:
    - brooding
    - passionate
    - secretive
  typical_classes:
    - Society
    - Explorer
  typical_races:
    - Gentry
    - Colonial
  stat_ranges:
    Pride: [14, 18]
    Angst: [14, 18]
    Passion: [12, 16]
  inventory_hints:
    - key to a locked room worn on a chain
    - a miniature portrait turned face-down in a drawer
    - riding crop and well-worn boots
  dialogue_quirks:
    - changes the subject abruptly when the conversation approaches something painful
    - speaks with controlled intensity that occasionally breaks into raw emotion
  disposition_default: -5

- name: The Gossip
  description: >-
    Knows everything about everyone and dispenses information like currency.
    Charming on the surface, calculating beneath. Appears at every social
    event, remembers every indiscretion, and never forgets a slight.
  personality_traits:
    - sharp-tongued
    - well-connected
    - secretly lonely
  typical_classes:
    - Society
  typical_races:
    - Gentry
    - Trade
  stat_ranges:
    Humour: [14, 18]
    Cunning: [14, 16]
  inventory_hints:
    - a calling card case that is never empty
    - a fan used for emphasis and concealment
    - letters from half the county
  dialogue_quirks:
    - prefaces devastating revelations with "I'm sure it's nothing, but..."
    - laughs after saying something cruel, as though it were merely witty
  disposition_default: 10

- name: The Housekeeper
  description: >-
    Runs the house with absolute authority below stairs. Knows every room,
    every passage, every creaking board. Fiercely loyal to the family — or
    to the house itself, which may not be the same thing. Addresses
    everyone by their proper title and expects the same courtesy.
  personality_traits:
    - dutiful
    - proud
    - observant
  typical_classes:
    - Governess
  typical_races:
    - Servant
  stat_ranges:
    Nerve: [14, 18]
    Pride: [12, 16]
    Cunning: [12, 14]
  inventory_hints:
    - ring of keys that opens every door in the house
    - a household ledger with meticulous entries
    - a candle and a set expression
  dialogue_quirks:
    - refers to the previous master or mistress as though they were still alive
    - speaks of "the way things are done in this house" as though it were natural law
  disposition_default: -10

- name: The Young Heir
  description: >-
    Recently come into money, title, or both — and completely unprepared
    for either. Charming and reckless, generous to a fault, and surrounded
    by people who want something from them. Will either grow into the role
    or be consumed by it.
  personality_traits:
    - impulsive
    - good-hearted
    - naive
  typical_classes:
    - Society
    - Explorer
  typical_races:
    - Gentry
  stat_ranges:
    Passion: [14, 18]
    Humour: [12, 16]
  inventory_hints:
    - a signet ring that doesn't quite fit
    - IOUs from half the county
    - a letter from a solicitor with urgent underlinings
  dialogue_quirks:
    - laughs too loudly in serious moments
    - asks genuinely innocent questions that reveal uncomfortable truths
  disposition_default: 20

- name: The Inspector
  description: >-
    Scotland Yard's finest — or at least, the one they sent. Methodical,
    patient, and possessed of a deceptive mildness that leads people to
    say far more than they intended. Not fooled by titles or tears.
  personality_traits:
    - methodical
    - relentless
    - deceptively mild
  typical_classes:
    - Detective
  typical_races:
    - Trade
    - Servant
  stat_ranges:
    Cunning: [16, 18]
    Nerve: [14, 16]
  inventory_hints:
    - notebook with cramped handwriting
    - a magnifying glass worn smooth with use
    - a warrant card presented with deliberate slowness
  dialogue_quirks:
    - asks the same question three different ways until the answers stop matching
    - says "just one more thing" when he has six more things
  disposition_default: 0

- name: The Governess
  description: >-
    Educated, composed, and occupying the most uncomfortable position in
    the house — too refined for the servants, too poor for the family.
    Sees everything from the threshold. The children tell her things
    they tell no one else.
  personality_traits:
    - watchful
    - principled
    - quietly fierce
  typical_classes:
    - Governess
  typical_races:
    - Clergy
    - Gentry
  stat_ranges:
    Nerve: [14, 18]
    Pride: [12, 16]
    Angst: [12, 14]
  inventory_hints:
    - a well-thumbed novel in a plain cover
    - a letter of recommendation that opens fewer doors than it should
    - a locket with no portrait inside
  dialogue_quirks:
    - speaks with careful precision, as though every word is weighed before release
    - deflects personal questions by asking about the children
  disposition_default: 5

- name: The Doctor
  description: >-
    The only person in the parish who crosses every threshold — cottage
    and manor alike. Trusted with bodies and, inevitably, with secrets.
    Overworked, underpaid by the poor and overpaid by the guilty.
  personality_traits:
    - pragmatic
    - discreet
    - quietly exhausted
  typical_classes:
    - Doctor
  typical_races:
    - Trade
    - Clergy
  stat_ranges:
    Cunning: [14, 16]
    Nerve: [14, 16]
    Humour: [10, 14]
  inventory_hints:
    - a medical bag with brass clasps
    - laudanum in a dark bottle
    - a pocket watch checked with habitual frequency
  dialogue_quirks:
    - uses medical metaphors for social situations
    - pauses before answering, as though considering patient confidentiality
  disposition_default: 10

- name: The Industrialist
  description: >-
    Self-made, proud of it, and contemptuous of anyone who inherited what
    they earned. Built an empire from nothing and intends to build more.
    Respected for their wealth, resented for their manners, feared for
    their ambition.
  personality_traits:
    - driven
    - blunt
    - secretly insecure about breeding
  typical_classes:
    - Industrialist
  typical_races:
    - Trade
  stat_ranges:
    Pride: [16, 18]
    Nerve: [14, 16]
    Passion: [12, 14]
  inventory_hints:
    - a gold watch chain that cost more than a labourer's annual wage
    - factory soot permanently under the fingernails despite daily scrubbing
    - an account book carried in the breast pocket
  dialogue_quirks:
    - reduces everything to practical terms — "what does it cost, what does it earn"
    - speaks loudly as though still giving orders on a factory floor
  disposition_default: -5

- name: The Spiritualist
  description: >-
    Conducts séances, reads palms, and claims commerce with the dead.
    Either a genuine medium with a terrifying gift, or a very good actor
    who has stumbled into something real. The parlour séance is a social
    event; what happens after the guests leave is something else entirely.
  personality_traits:
    - theatrical
    - perceptive
    - ambiguous
  typical_classes:
    - Governess
    - Society
  typical_races:
    - Bohemian
  stat_ranges:
    Cunning: [14, 18]
    Passion: [14, 16]
    Angst: [12, 16]
  inventory_hints:
    - a crystal ball (possibly just glass)
    - black silk gloves
    - letters from the bereaved
  dialogue_quirks:
    - drops into a deeper register when "channelling"
    - speaks in metaphor that could be supernatural or merely poetic
  disposition_default: 5
