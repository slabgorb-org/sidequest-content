# Visual style configuration for the Tea & Murder genre.
#
# Z-Image authoring per sidequest-content/PROMPTING_Z_IMAGE.md and ADR-086.
#
# AUTHORING RULE (load-bearing — from coyote_star 2026-05-03 playtest):
# This file describes HOW to render, not WHAT to render. positive_suffix
# layers onto every render in the genre. Object-nouns here become
# artifacts the model paints into every scene — "lamp" forces a lamp
# into the cricket match, "teacup" forces a teacup into the chase, and
# "frock coat" forces Edwardian costume into a render of an empty
# meadow. Only style / medium / palette / light / composition vocabulary
# belongs here. Abstract qualifiers ("sunlit", "soft-edged", "lived-in")
# are fine. Concrete nouns are not.
#
# Costume, architecture, and prop vocabulary lives per-context in
# visual_tag_overrides below, or per-subject in portrait_manifest.yaml
# and per-POI in /sq-poi landscape prompts.
#
# Negative-style instructions ("no gothic, no rain") do NOT work — Z-Image
# runs at guidance_scale=0 and ignores negation. Defense against an
# unwanted element is to never name it.

# ── Core Style ─────────────────────────────────────────────────────

positive_suffix: >-
  Edwardian-era watercolour painting on heavy paper, visible paper-grain
  texture, soft pigment bleed at edges, fine drawn line beneath the
  colour, in the painterly lineage of Helen Allingham, Sutton Palmer,
  and Edwardian British postcard illustration. Palette favours warm
  cream and honey-gold, moss-green, heather-purple, brass-and-sepia,
  with bracken-russet and slate-grey as supporting tones. Light is
  golden-afternoon directional, warm rather than cool, shadows pooling
  warm umber. Surfaces read as lived-in, hand-worn, gently weathered.
  Atmosphere is pastoral, never gothic — mild weather, soft
  distance, gentle bleed at horizons. Composition prefers layered
  depth (clear foreground, soft middle, atmospheric distance),
  restraint, and the British landscape watercolour habit of leaving
  paper-light to do half the work. No text, no caption, no title,
  no writing, no label, no signature, no watermark, no border, no
  frame.

# Z-Image Turbo runs at guidance_scale=0 and ignores negative_prompt.
# All constraints live in positive_suffix above.
negative_prompt: ""

preferred_model: dev

base_seed: 1908

# ── Per-Context Tag Overrides ──────────────────────────────────────
#
# Concrete nouns ARE permitted here because each override applies ONLY
# when the relevant tag is active. "Tea-rooms" only paints a teapot
# when the render is tagged tea-rooms. Foreground / middle / background
# layout. Proper nouns avoided (Z-Image renders them as text). Aim for
# ~40-60 words per override to stay under the T5 token ceiling.

visual_tag_overrides:
  inn: >-
    interior of a small Highland country inn at late afternoon,
    foreground a polished oak bar with a slate of regulars' tabs in
    pencil and a glass cloth folded on it, middle ground a fire in
    a stone hearth and a sleeping dog, background a low-beamed
    ceiling and a window onto the lane
  manse: >-
    Edwardian Highland manse parlour in afternoon, foreground a
    sash window with light pouring in and a writing desk with
    sermon notes folded between book pages, middle ground a fire
    in a small grate and an upholstered armchair, background
    walls of cream wallpaper with a single botanical print
  surgery: >-
    Edwardian country doctor's surgery, foreground a polished
    consulting desk with a notebook and a brass pocket watch,
    middle ground a glass-fronted dispensary cabinet with labelled
    bottles, background a sash window with cream curtains half
    drawn, soft sunlight
  post_office: >-
    Edwardian village post office, foreground a polished wooden
    counter with a brass scale, middle ground a chair against the
    wall and a slate of postal rates pinned up, background a curtain
    drawn across an inner doorway, late afternoon light through a
    small front window
  school: >-
    Edwardian village schoolroom, foreground rows of slate-grey
    wooden desks with inkwells and a coal stove at the near end,
    middle ground a blackboard with the day's lesson in copperplate
    chalk, background tall windows with hawthorn hedge visible
    beyond
  tea_rooms: >-
    Edwardian small village tea rooms in afternoon, foreground three
    round tables in starched linen, foreground a window with
    geraniums in red bloom, middle ground a counter with shortbread
    on a glass stand, background mismatched china on shelves, warm
    afternoon light, soft cream wallpaper
  parish_kirk: >-
    interior of a Scottish parish kirk, foreground dark oak pews
    polished by three centuries, middle ground a simple stone pulpit
    and a brass communion table, background tall plain-glass
    windows on either side of the apse, soft cool light
  episcopal_chapel: >-
    interior of a small Scottish Episcopal chapel, foreground a
    short nave with simple pews, middle ground a stone altar with
    embroidered frontal and two brass candlesticks, background a
    plain-glass window above and whitewashed Aberdeenshire granite
    walls
  kirkyard: >-
    a Highland parish kirkyard sloping toward a river, foreground
    weathered headstones leaning, middle ground grass gone to seed
    in autumn and bracken at the wall, background the bell-tower of
    the parish kirk and a low stone perimeter, golden afternoon
  railway_halt: >-
    Edwardian single-platform Highland railway halt, foreground
    dressed-stone platform edge and the ticket window of a small
    wooden building, middle ground a goods siding with empty
    wooden casks, background the curve of the line vanishing into
    the glen, soft mist on the hills
  bridge: >-
    a stone three-arch bridge over a Highland river, foreground the
    parapet with moss in the joints, middle ground the river running
    dark and quick over stones, background the village rooftops in
    soft afternoon distance, autumn trees overhanging the burn
  distillery: >-
    exterior of a small working Highland distillery, foreground a
    long stone building with two pagoda-roofed kilns, middle ground
    a yard with empty wooden barrels stacked, background the burn
    running past and woodland beyond, peat-smoke from a single
    kiln chimney
  great_house: >-
    exterior of a Highland baronial country house in afternoon,
    foreground a curving gravel drive and clipped lawn, middle
    ground the house with crow-stepped gables and a square turret,
    background the glen rising behind and autumn woodland in
    middle distance, soft sunlit watercolour
  manor_interior: >-
    interior of an Edwardian country house library, foreground a
    leather-topped writing desk with correspondence in neat piles
    and a green-shaded lamp, middle ground floor-to-ceiling
    bookshelves in walnut, background a stone fireplace with a
    laird's portrait above, afternoon light through a tall window
  cricket_ground: >-
    Edwardian village cricket ground in summer, foreground a long
    flat meadow with a single roller at the side, middle ground a
    lime-washed wooden pavilion with a verandah, background distant
    hills under a soft pastoral sky, golden afternoon light
  long_pass: >-
    a Highland drove road climbing north into a glen pass, foreground
    a worn path through heather and bracken, middle ground a small
    cairn at the head of the pass and a ruined stone shieling,
    background the hills rising in autumn purple under a soft sky,
    long evening light
  lane: >-
    a Highland village lane in late afternoon, foreground a worn
    track of small stones, middle ground low stone cottages set
    back behind small front gardens, background the parish bell-
    tower in soft distance, autumn trees overhanging
  cottage: >-
    a small Highland stone cottage in autumn, foreground a path of
    worn stones up to a low door, middle ground sash windows with
    cream curtains half drawn, background a slate roof and a
    chimney with rising peat-smoke, the glen rising behind in soft
    distance
