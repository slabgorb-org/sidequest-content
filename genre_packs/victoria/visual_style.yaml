# Visual style configuration for victoria genre pack
#
# Controls how Flux image generation renders scenes for this genre.
# Victorian visual identity: impressionist oil painting — physical medium
# descriptors (impasto, cracked varnish, canvas texture) push Flux away
# from photorealism. Rich dark palette, candlelight, 1860s costume.
# Narrative scene composition with multiple figures works better than
# isolated portrait busts for achieving painterly quality.

# ── Core Style ────────────────────────────────────────────────

positive_suffix: >-
  impressionist oil painting on canvas, thick visible impasto brushstrokes,
  cracked varnish, museum painting, heavy paint texture, rich dark palette
  of burgundy umber gold and grey, dramatic chiaroscuro candlelight,
  1860s Victorian period costume, narrative scene composition,
  painted not photographed

negative_prompt: >-
  photo, photograph, photorealistic, photography, camera, lens, DSLR,
  studio lighting, studio portrait, sharp focus, depth of field, bokeh,
  smooth skin, pores, skin texture, real person, celebrity, modern
  clothing, modern suit, necktie, business suit, 20th century, 21st
  century, contemporary fashion, wire-frame glasses, bright colors,
  anime, cartoon, 3d render, fantasy creatures, medieval armor, neon,
  pixel art, smooth airbrushed, digital clean lines, cheerful sunny,
  high saturation, flat lighting, minimalist, sci-fi

preferred_model: flux

base_seed: 1853

# ── Location Tag Overrides ────────────────────────────────────

visual_tag_overrides:
  manor: >-
    grand Victorian country house at dusk, ivy-covered stone facade,
    tall windows with warm amber light spilling across gravel drive,
    dark yew hedges, a single lit window in the east wing, rooks
    circling the chimneys, storm clouds gathering
  drawing_room: >-
    Victorian drawing room in evening, heavy velvet curtains in deep
    burgundy, oil paintings in gilt frames, fire burning low in marble
    fireplace, crystal decanters on a silver tray, beeswax candles
    in branching candelabra, a woman's silhouette in the window seat
  moor: >-
    vast Yorkshire moorland under turbulent sky, heather and bracken
    in purple and brown, a single track winding through, standing
    stones on the horizon, wind-bent hawthorn trees, distant rain
    sweeping across the landscape, a figure walking alone
  garden: >-
    walled garden in late summer, climbing roses over weathered brick,
    gravel paths between boxwood hedges, a stone bench beneath a
    copper beech, late afternoon light slanting through, a forgotten
    book on the bench, lavender and thyme scenting the air
  street: >-
    gaslit London street at night, wet cobblestones reflecting halos
    of amber light, fog drifting between terraced houses, a hansom
    cab waiting at the kerb, iron railings and basement windows, a
    figure with an umbrella passing, the distant sound of a church bell
  church: >-
    English parish church interior, grey stone and dark oak pews,
    stained glass casting coloured light on stone floor, brass
    memorial plaques on the walls, the vicar's candle on the lectern,
    dust motes in a shaft of light, the smell of cold stone and old books
  kitchen: >-
    below-stairs kitchen in a great house, copper pots catching
    firelight, long scrubbed-wood table, the cook's domain, rising
    steam and the smell of bread, bells on a board above the door
    connecting to upstairs rooms, a servant carrying a tray
  bedroom: >-
    four-poster bed with heavy curtains half-drawn, a candle guttering
    on the nightstand, rain on the window, a fire dying to embers,
    a writing desk with an unfinished letter, a wardrobe door slightly
    ajar, shadows moving with the candlelight
  ballroom: >-
    grand ballroom in full use, crystal chandeliers blazing with
    hundreds of candles, dancers in silk and broadcloth, an orchestra
    on a raised platform, gilt mirrors multiplying the light, flowers
    banked along the walls, the heat of a hundred bodies
  study: >-
    gentleman's study with leather-bound books floor to ceiling,
    a partners desk in dark mahogany, green-shaded lamp casting a
    pool of light, a globe and a decanter, correspondence in neat
    piles, a letter-opener and sealing wax, the smell of pipe tobacco
  station: >-
    Victorian railway station in iron and glass, steam billowing from
    an arriving locomotive, passengers in travelling clothes on the
    platform, a porter with luggage, destination boards in white paint,
    the shriek of the whistle echoing under the vaulted roof
  attic: >-
    attic room under the eaves, bare floorboards and sloped ceiling,
    a small window looking out on chimneys and sky, dust on everything,
    trunks and covered furniture, old portraits turned to face the wall,
    a single candle and a sense of things abandoned
  cottage: >-
    stone cottage in the English countryside, thatched roof dark with
    rain, a garden gate half-open, smoke from the chimney, lace
    curtains in small windows, a path worn through the grass, the
    sound of sheep on the hill beyond
  docks: >-
    Thames-side wharf at low tide, warehouses in dark brick, the
    smell of tar and river mud, cargo being unloaded by lantern light,
    a customs officer with a manifest, fog rolling off the water,
    the creak of ropes and hulls
