name: Victoria
version: "1.0.0"
description: >-
  Secrets kept behind silk curtains have a way of catching fire. Victorian
  England — moody manors, gaslit streets, drawing room intrigue, and the
  sharp edge of class. Brontë Gothic romance meets Conan Doyle deduction
  meets the social warfare of the marriage season. The occult simmers at
  the edges, tunable from parlor trick to genuine horror. Standing is
  everything, scandal destroys, and the truth is rarely convenient.
min_sidequest_version: "0.1.0"
refine_hooks: false

# --- Creative DNA (reference for all subsequent steps) ---

inspirations:
  - name: "Jane Eyre / Wuthering Heights (Brontë)"
    element: "Gothic atmosphere, class tension, brooding romance, madwoman in the attic"
  - name: "Bridgerton"
    element: "Social season, reputation as currency, marriage market as battlefield, wit"
  - name: "Sherlock Holmes (Conan Doyle)"
    element: "Deduction, London fog, criminal underworld, rationalism vs. superstition"
  - name: "The Woman in White (Wilkie Collins)"
    element: "Identity theft, conspiracy, asylums, legal traps, suspense"
  - name: "North and South (Gaskell)"
    element: "Industrial tension, class collision, moral compromise, unlikely attraction"
  - name: "Bleak House (Dickens)"
    element: "Legal system as labyrinth, fog as metaphor, institutional rot"
  - name: "The Turn of the Screw (James)"
    element: "Ambiguous horror, unreliable perception, isolation, dread"

era_range: "1840s-1880s"

core_vibe: >-
  Someone in this house is lying. The question is whether finding the truth
  will save you or destroy everything you've built.

emotional_tone:
  - simmering tension
  - restrained passion
  - moral reckoning
  - gothic unease

differentiation: >-
  No swords, no starships — real-world adjacent Victorian England. Class is the
  primary axis of conflict. Romance is central but never easy — desire collides
  with duty, expectation, and propriety. Mystery runs through everything: who
  is this person really, what happened in the east wing, why did the previous
  governess leave. The supernatural exists but stays in the background as
  atmosphere and dread, not the core loop. Standing and Scandal replace hit
  points as the thing you're most afraid to lose. Lethality is low — social
  death is worse than actual death.
