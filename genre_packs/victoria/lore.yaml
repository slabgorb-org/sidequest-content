world_name: ""

history: |
  The world runs on appearances. Beneath the gaslight and good manners, every
  great house has a locked room, every fortune has a secret origin, and every
  family has a name they do not speak at dinner. The Empire stretches across
  the globe, bringing wealth and guilt in equal measure. Industry is remaking
  the landscape — mills devour the countryside, railways stitch the nation
  together, and fortunes rise and fall with the price of cotton. The old
  landed families watch the new money with contempt and envy. The Church
  preaches virtue while its congregants scheme. And somewhere in the fog,
  someone knows something that could bring it all crashing down.

cosmology: |
  God is assumed but rarely helpful. The universe operates on moral consequence
  rather than divine intervention — sins find you out, secrets surface, and
  the truth has a way of arriving at the worst possible moment. The supernatural,
  if it exists at all, is Gothic rather than theological — hauntings, curses,
  presences — things that suggest the past is not truly past. Faith is a social
  institution first and a spiritual one second. The vicar's opinion matters
  because the vicar controls the parish, not because God is watching.

geography: |
  England is a character. London is the great machine — fog, gaslight, crowds,
  anonymity, opportunity, and danger. The countryside is older, slower, and
  full of houses with histories. The moors are desolate and romantic. The
  industrial north is smoke and ambition. The seaside is where secrets go to
  rest. Every great house is a world unto itself, with its own hierarchies,
  its own tensions between upstairs and downstairs, its own locked rooms.
  The railway connects everything, collapsing distance and bringing the wrong
  people to the right places.

