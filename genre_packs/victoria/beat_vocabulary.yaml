obstacles:
  - name: Locked door
    description: A door that should not be locked, or one to which you should not want the key
    stat_check: Cunning
    failure_penalty: Discovery, someone knows you tried
    tags: [house, access, secret]

  - name: Chaperone
    description: A watchful companion who must not suspect your true destination
    stat_check: Humour
    failure_penalty: Scandal +1, the chaperone reports to your guardian
    tags: [social, romantic, surveillance]

  - name: Crowded ballroom
    description: A press of bodies and opinions — reach the right person without the wrong one noticing
    stat_check: Pride
    failure_penalty: Wrong conversation, Standing -1
    tags: [social, crowd, public]

  - name: Muddy lane
    description: Rain-soaked country road — your clothes will suffer and so will your dignity
    stat_check: Nerve
    failure_penalty: Appearance ruined, social disadvantage at destination
    tags: [rural, weather, physical]

  - name: Suspicious servant
    description: A member of staff who has been told to watch you
    stat_check: Cunning
    failure_penalty: Movements reported, the household knows where you've been
    tags: [house, surveillance, stealth]

  - name: Drawing room interrogation
    description: Polite questions that are not polite at all — someone is probing for information
    stat_check: Nerve
    failure_penalty: Information leaked, a secret is closer to exposure
    tags: [social, verbal, pressure]

  - name: Dark staircase
    description: No candle, unfamiliar house, and the sound of someone else moving in the dark
    stat_check: Nerve
    failure_penalty: Fall, noise, discovery — or worse, you find what's at the bottom
    tags: [house, night, physical]

  - name: Mourning call
    description: A social obligation to visit the bereaved — refuse and you're heartless, attend and you'll learn things
    stat_check: Humour
    failure_penalty: Reputation damage from callousness or from asking the wrong question
    tags: [social, obligation, information]

  - name: Carriage pursuit
    description: Follow a hansom through London streets without being seen
    stat_check: Cunning
    failure_penalty: Lost the trail, or they know you're following
    tags: [urban, chase, investigation]

  - name: Difficult correspondence
    description: A letter that must be written with perfect precision — one wrong word changes everything
    stat_check: Cunning
    failure_penalty: Misunderstanding, offence given, or intention revealed
    tags: [communication, social, precision]
