# sidequest-content/genre_packs/victoria/places.yaml
# Archetypal place keys for the daemon's scene interpreter, tuned to
# Blackthorn Moor. Each archetypal slot is realised as a specific named
# location in the world: tavern → the Blackthorn Arms; castle →
# Blackthorn Hall; temple → St Oswald's chapel; etc. The `solo` field
# carries texture (architecture, weather, the small load-bearing
# detail); the `backdrop` field carries terse cues for portrait or
# wide-shot composition. `landmark` is held empty per the archetypal
# schema convention.

tavern:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      the taproom of the Blackthorn Arms — low oak beams blackened by
      a hundred years of pipe smoke, a coal fire banked in a stone
      hearth, settles polished by the trousers of three generations of
      shepherds, the landlord's wife polishing the same glass she
      polished an hour ago, a tap-room conversation that drops a tone
      when the door opens, the framed broadside above the mantel
      announcing the 1879 enclosure auction in copperplate
    backdrop: "low-beamed taproom, coal fire, settles, framed broadside"
  description:
    solo: "the Blackthorn Arms taproom"
    backdrop: "a Yorkshire village inn"

forest:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      the Blackthorn Coppice on the north edge of the park — sessile
      oak and rowan grown close, leaf-mould soft underfoot, a path
      worn by gamekeepers and by older feet than theirs, the standing
      stones of Whitethorn Reach visible through the trunks where the
      ground rises, autumn light coming sideways, the wind in the
      heather audible from inside the wood
    backdrop: "oak coppice, rowan, leaf-mould path, distant standing stones"
  description:
    solo: "the Blackthorn Coppice"
    backdrop: "a Yorkshire wood at the edge of the moor"

dungeon:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      the locked north wing of Blackthorn Hall — corridor of papered
      walls gone foxed and damp, oil sconces unlit since spring, dust
      sheets over furniture in shapes that suggest something else,
      door after door with the same brass handle and a different lock,
      the smell of camphor and old fire-grates, a draught from
      somewhere that should not draw, the housekeeper's keys absent
      from this floor of the ring
    backdrop: "papered corridor, dust-sheeted furniture, locked doors"
  description:
    solo: "the north wing"
    backdrop: "a closed wing of a country house"

castle:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      Blackthorn Hall in late afternoon — Jacobean stone darkened by
      two centuries of Pennine weather, mullioned windows catching the
      low gold light, the portico lamps not yet lit, rooks above the
      east chimney, the carriage drive raked that morning and already
      printed by the doctor's gig, the hall door standing six inches
      open as it has done since Sir Edmund insisted on it as a young
      man and no one has thought to close it since
    backdrop: "Jacobean facade, mullioned glass, rooks, raked drive"
  description:
    solo: "Blackthorn Hall"
    backdrop: "a Yorkshire country house"

market:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      Blackthorn village on a Wednesday — the market cross worn
      smooth, stalls of plain goods (eggs, butter, mended boots,
      pickled samphire from the coast), the post office window with
      its black-edged notice still up for Sir Edmund, the smith's
      hammer audible from down the lane, a knot of women not buying
      anything talking quietly outside the haberdasher's, the
      magistrate's clerk crossing the square with a folio under his
      arm and not looking at anyone
    backdrop: "market cross, plain stalls, black-edged notice, hammer-fall"
  description:
    solo: "Blackthorn village square"
    backdrop: "a Yorkshire market village"

cave:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      the abandoned lead workings on the moor's western edge — adit
      timbered in oak that the damp has gone through, the shaft
      flooded since the eighty-one collapse, a draught coming up from
      below that smells of cold iron and standing water, names and
      dates scratched into the lintel by miners who came out and by
      one or two who did not, a wren's nest in the crook of the
      winding-gear, the silence of a working that has not worked in
      five years
    backdrop: "timbered adit, flooded shaft, scratched lintel, winding-gear"
  description:
    solo: "the old lead workings"
    backdrop: "an abandoned Pennine mine"

temple:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      St Oswald's chapel at the edge of the park — Norman font, box
      pews with the Blackthorn arms carved on the squire's, a memorial
      to the boy who drowned in the millpond in 'fifty-eight that
      gives only his initials, the air thick with damp stone and beeswax,
      Sir Edmund's freshly cut ledger-stone in the chancel floor
      pale against the older slabs around it, the vicar's surplice
      hung on a peg as though he had only just stepped out
    backdrop: "Norman font, box pews, fresh ledger-stone, beeswax"
  description:
    solo: "St Oswald's chapel"
    backdrop: "an English country chapel"

battlefield:
  landmark: {solo: "", backdrop: ""}
  environment:
    solo: >-
      the open moor between Blackthorn and the railway halt at
      Hartside — heather gone brown and purple, peat-cuttings filled
      with black water, the bog where two of the Hall's hounds went
      down in the spring, the shepherd's hut a quarter-mile off
      against the skyline, no wind for a moment and then all of it,
      the kind of country where a body can lie a week before anyone
      thinks to walk that way, the kind of country where weather
      decides whether you are found
    backdrop: "open moor, heather, peat-cuttings, distant hut, low cloud"
  description:
    solo: "the high moor"
    backdrop: "the Yorkshire moors"
