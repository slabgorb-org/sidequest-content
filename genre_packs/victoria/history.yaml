world_name: ""
starting_era: "Mid-Victorian (1850s-1860s)"

overview: |
  Britain at the height of its power and the peak of its contradictions.
  The Great Exhibition has declared the nation's industrial supremacy.
  The railway has stitched the country together. The Empire spans the
  globe. And beneath the surface — in the locked wards, the factory
  floors, the servants' halls, and the drawing rooms where nothing is
  ever said directly — the tensions that will reshape the century are
  already building.

key_events:
  - year: 1837
    event: "Victoria's coronation — a young queen, a new era, a nation redefining itself"
  - year: 1845
    event: "Railway mania — fortunes made and lost, the landscape transformed"
  - year: 1847
    event: "Jane Eyre published — the governess speaks, and the world listens"
  - year: 1851
    event: "The Great Exhibition — Crystal Palace, industrial pride, the future on display"
  - year: 1854
    event: "Crimean War — the first war reported by telegraph, the first war with nurses"
  - year: 1859
    event: "On the Origin of Species — faith shaken, science ascendant, drawing rooms divided"
  - year: 1861
    event: "Prince Albert dies — the Queen retreats, the nation mourns, mourning becomes fashion"
  - year: 1868
    event: "The Moonstone published — the first detective novel, the birth of a genre"
  - year: 1882
    event: "The Married Women's Property Act — women can own things, the patriarchy notices"

social_tensions:
  - name: "Class Collision"
    description: "Old money and new money. The gentry despise the industrialists; the industrialists are buying the gentry's houses."
  - name: "The Woman Question"
    description: "Education, property, suffrage — women are pushing against every wall, and some walls are moving."
  - name: "Empire and Conscience"
    description: "The wealth is real. So is the cost. Returned colonials bring stories that don't match the propaganda."
  - name: "Faith and Doubt"
    description: "Darwin, geology, biblical criticism — the certainties are crumbling. Some cling harder; some let go."
  - name: "Reform and Resistance"
    description: "Workhouses, child labour, the Poor Law — the conscience of the nation versus the convenience of the powerful."
