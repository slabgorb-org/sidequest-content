affinities:
  - name: "Perception"
    description: "Observation, deduction, reading people and scenes for what others miss"
    triggers:
      - "noticing a detail others overlooked — a stain, a glance, a missing object"
      - "deducing a person's history or intentions from their appearance"
      - "finding physical evidence at a scene"
      - "connecting two pieces of information that seemed unrelated"
      - "reading subtext in a conversation — what was really being said"
    tier_thresholds: [5, 12, 25]

  - name: "Composure"
    description: "Grace under pressure, maintaining appearances, enduring without breaking"
    triggers:
      - "maintaining calm in a crisis or confrontation"
      - "concealing true feelings in a social situation"
      - "enduring hardship, insult, or loss without showing weakness"
      - "performing a difficult social duty with dignity"
      - "keeping a secret under direct questioning"
    tier_thresholds: [5, 12, 25]

  - name: "Influence"
    description: "Persuasion, social leverage, getting what you want through connections and charm"
    triggers:
      - "convincing someone to act against their initial judgment"
      - "using a connection or introduction to open a door"
      - "navigating a social event to advance your position"
      - "negotiating terms in your favor"
      - "planting or suppressing a rumor effectively"
    tier_thresholds: [5, 12, 25]

  - name: "Tenacity"
    description: "Stubbornness, endurance, refusing to give up when everything says you should"
    triggers:
      - "pursuing a lead or goal after a significant setback"
      - "surviving a dangerous situation through sheer determination"
      - "standing your ground against someone with more power"
      - "continuing to investigate when warned off"
      - "returning to a confrontation after being dismissed"
    tier_thresholds: [5, 12, 25]

  - name: "Empathy"
    description: "Understanding others, genuine connection, seeing through pretense to the person beneath"
    triggers:
      - "earning genuine trust from someone guarded"
      - "understanding a character's real motivation, not their stated one"
      - "comforting someone in genuine distress"
      - "recognizing when someone is performing versus being honest"
      - "bridging a social divide through human connection"
    tier_thresholds: [5, 12, 25]

  - name: "Daring"
    description: "Boldness, risk-taking, acting when propriety or prudence says don't"
    triggers:
      - "breaking a social rule deliberately for a good reason"
      - "entering a dangerous place alone"
      - "speaking truth to someone with power over you"
      - "taking a physical risk — climbing, riding, fleeing"
      - "making a dramatic gesture that changes the dynamic of a scene"
    tier_thresholds: [5, 12, 25]
