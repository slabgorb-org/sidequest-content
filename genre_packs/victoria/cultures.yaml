# Victoria uses real-world Victorian-era names.
# Name lists in corpus/ directory. *_first.txt files contain mixed-gender
# given names; *_family.txt contain surnames. Per-NPC gender is decided
# at the archetype/portrait layer, not at the name draw.

- name: English Gentry
  summary: "The landed families, old money, county society"
  description: "The landed families, old money, county society. Names that appear in Burke's Peerage and on estate gates."
  slots:
    given_name:
      names_file: english_gentry_first.txt
    family_name:
      names_file: english_gentry_family.txt
    title:
      word_list: [Mr., Mrs., Miss, Lady, Lord, Sir, The Honourable, Dowager, Reverend, Dr.]
    place_noun:
      word_list: [Hall, Manor, Park, House, Lodge, Grange, Court, Abbey, Cottage, Rectory]
    adjective:
      word_list: [Thornfield, Wuthering, Blackwood, Ashworth, Ferndale, Netherfield, Pemberley, Briarwood, Whitmore, Harrowgate]
  person_patterns:
    - "{given_name} {family_name}"
    - "{title} {family_name}"
    - "{title} {given_name} {family_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "{family_name} {place_noun}"
    - "The {adjective} {place_noun}"

- name: London Professional
  summary: "Doctors, lawyers, detectives, journalists"
  description: "Doctors, lawyers, detectives, journalists — the educated middle class of the capital."
  slots:
    given_name:
      names_file: english_professional_first.txt
    family_name:
      names_file: english_professional_family.txt
    title:
      word_list: [Mr., Mrs., Miss, Dr., Inspector, Sergeant, Professor, Barrister, Solicitor]
    place_noun:
      word_list: [Street, Lane, Court, Square, Chambers, Row, Mews, Terrace, Gardens, Passage]
    adjective:
      word_list: [Baker, Fleet, Bow, Cheapside, Whitechapel, Holborn, Marylebone, Clerkenwell, Spitalfields, Limehouse]
  person_patterns:
    - "{given_name} {family_name}"
    - "{title} {family_name}"
    - "{title} {given_name} {family_name}"
  place_patterns:
    - "{adjective} {place_noun}"
    - "{family_name}'s {place_noun}"
    - "The {place_noun} off {adjective}"

- name: Servant Class
  summary: "Below stairs"
  description: "Below stairs — housekeepers, valets, maids, cooks. Known by surname or role, rarely by first name in company."
  slots:
    given_name:
      names_file: english_servant_first.txt
    family_name:
      names_file: english_servant_family.txt
    title:
      word_list: [Mrs., Mr., Cook, Nurse]
    place_noun:
      word_list: [kitchen, pantry, scullery, cellar, attic, servants' hall, back stairs, coal hole, laundry, stillroom]
    adjective:
      word_list: [lower, upper, east, west, old, back, night, early, cold, quiet]
  person_patterns:
    - "{family_name}"
    - "{title} {family_name}"
    - "{given_name}"
  place_patterns:
    - "the {adjective} {place_noun}"
    - "the {place_noun}"

