currency:
  name: pounds
  denominations:
    - pennies
    - shillings
    - pounds

item_catalog:
  - id: calling_cards
    name: Calling Cards
    description: Engraved on good stock — leaving one is a social act, withholding one is a weapon.
    category: social
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: You are no one until your card is on someone's salver.
    narrative_weight: 0.1

  - id: mourning_locket
    name: Mourning Locket
    description: Black enamel and a lock of hair. Grief made portable and socially acceptable.
    category: accessory
    value: 5
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [personal, emotional, social]
    lore: Everyone wears one. The question is whose hair is inside.
    narrative_weight: 0.3

  - id: laudanum_bottle
    name: Laudanum
    description: Opium in alcohol — the Victorian answer to everything from toothache to heartbreak.
    category: consumable
    value: 2
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [medical, sedative, social]
    lore: Available at any chemist. Nobody talks about how much they take.
    narrative_weight: 0.3

  - id: letter_of_introduction
    name: Letter of Introduction
    description: A door-opener — someone of standing vouches for your character and breeding.
    category: social
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [social, access, one-use]
    lore: Worth more than money in the right circles. Worthless in the wrong ones.
    narrative_weight: 0.4

  - id: walking_stick
    name: Walking Stick
    description: Respectable accessory — and in a pinch, a weapon no one can object to your carrying.
    category: weapon
    value: 3
    weight: 1.0
    rarity: common
    power_level: 1
    tags: [melee, concealed, social, gentleman]
    lore: Every gentleman carries one. The sword-cane variant costs considerably more.
    narrative_weight: 0.1

  - id: derringer
    name: Derringer
    description: Two shots and small enough to hide in a reticule or waistcoat. A last resort.
    category: weapon
    value: 15
    weight: 0.3
    rarity: uncommon
    power_level: 2
    tags: [ranged, firearm, concealed, one-handed]
    lore: Not a gentleman's weapon, which is exactly why it's useful.
    narrative_weight: 0.5

  - id: medical_bag
    name: Medical Bag
    description: Brass clasps, leather worn smooth. Contains everything needed to treat or to poison.
    category: tool
    value: 20
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [medical, access, professional]
    lore: A doctor's bag opens every door. People do not ask what's inside.
    narrative_weight: 0.3

  - id: magnifying_glass
    name: Magnifying Glass
    description: Brass and crystal. The detective's instrument — makes the invisible visible.
    category: tool
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [investigation, observation, professional]
    lore: The difference between looking and seeing.
    narrative_weight: 0.2

  - id: family_bible
    name: Family Bible
    description: Contains the family record — births, deaths, marriages. The truth that cannot be forged.
    category: document
    value: 0
    weight: 2.0
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal]
    lore: The one book in the house that tells no lies. Usually kept locked.
    narrative_weight: 0.7

  - id: skeleton_key
    name: Skeleton Key
    description: Opens most standard locks in old houses. Possession is difficult to explain innocently.
    category: tool
    value: 10
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [access, stealth, criminal]
    lore: Every housekeeper has one. Anyone else has some explaining to do.
    narrative_weight: 0.4

  - id: smelling_salts
    name: Smelling Salts
    description: Ammonia in a crystal vial. Revives the fainted, steadies the shaken.
    category: consumable
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [medical, social, recovery]
    lore: Every lady's reticule and every doctor's bag contains one.
    narrative_weight: 0.1

  - id: silk_handkerchief
    name: Silk Handkerchief
    description: Monogrammed, scented, and a silent declaration of breeding. Also useful for evidence.
    category: accessory
    value: 2
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, personal, evidence]
    lore: A dropped handkerchief has started more stories than any weapon.
    narrative_weight: 0.2
