currency:
  name: pounds
  denominations:
    - pennies
    - shillings
    - pounds

item_catalog:
  - id: calling_cards
    name: Calling Cards
    description: Engraved on good stock — leaving one is a social act, withholding one is a weapon.
    category: social
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: You are no one until your card is on someone's salver.
    narrative_weight: 0.1

  - id: mourning_locket
    name: Mourning Locket
    description: Black enamel and a lock of hair. Grief made portable and socially acceptable.
    category: accessory
    value: 5
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [personal, emotional, social]
    lore: Everyone wears one. The question is whose hair is inside.
    narrative_weight: 0.3

  - id: laudanum_bottle
    name: Laudanum
    description: Opium in alcohol — the Victorian answer to everything from toothache to heartbreak.
    category: consumable
    value: 2
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [medical, sedative, social]
    lore: Available at any chemist. Nobody talks about how much they take.
    narrative_weight: 0.3

  - id: letter_of_introduction
    name: Letter of Introduction
    description: A door-opener — someone of standing vouches for your character and breeding.
    category: social
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 2
    tags: [social, access, one-use]
    lore: Worth more than money in the right circles. Worthless in the wrong ones.
    narrative_weight: 0.4

  - id: walking_stick
    name: Walking Stick
    description: Respectable accessory — and in a pinch, a weapon no one can object to your carrying.
    category: weapon
    value: 3
    weight: 1.0
    rarity: common
    power_level: 1
    tags: [melee, concealed, social, gentleman]
    lore: Every gentleman carries one. The sword-cane variant costs considerably more.
    narrative_weight: 0.1

  - id: derringer
    name: Derringer
    description: Two shots and small enough to hide in a reticule or waistcoat. A last resort.
    category: weapon
    value: 15
    weight: 0.3
    rarity: uncommon
    power_level: 2
    tags: [ranged, firearm, concealed, one-handed]
    lore: Not a gentleman's weapon, which is exactly why it's useful.
    narrative_weight: 0.5

  - id: gladstone_bag
    name: Gladstone Bag
    description: A black leather portmanteau with brass clasps and a hinged spine. The doctor's working bag — opens flat across a kitchen table, every instrument in its loop.
    category: tool
    value: 20
    weight: 3.0
    rarity: uncommon
    power_level: 2
    tags: [medical, access, professional, signature]
    lore: A Gladstone bag opens every door. People do not ask what's inside.
    narrative_weight: 0.3

  - id: magnifying_glass
    name: Magnifying Glass
    description: Brass and crystal. The detective's instrument — makes the invisible visible.
    category: tool
    value: 5
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [investigation, observation, professional]
    lore: The difference between looking and seeing.
    narrative_weight: 0.2

  - id: family_bible
    name: Family Bible
    description: Contains the family record — births, deaths, marriages. The truth that cannot be forged.
    category: document
    value: 0
    weight: 2.0
    rarity: rare
    power_level: 3
    tags: [document, evidence, family, legal]
    lore: The one book in the house that tells no lies. Usually kept locked.
    narrative_weight: 0.7

  - id: skeleton_key
    name: Skeleton Key
    description: Opens most standard locks in old houses. Possession is difficult to explain innocently.
    category: tool
    value: 10
    weight: 0.1
    rarity: rare
    power_level: 2
    tags: [access, stealth, criminal]
    lore: Every housekeeper has one. Anyone else has some explaining to do.
    narrative_weight: 0.4

  - id: smelling_salts
    name: Smelling Salts
    description: Ammonia in a crystal vial. Revives the fainted, steadies the shaken.
    category: consumable
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [medical, social, recovery]
    lore: Every lady's reticule and every doctor's bag contains one.
    narrative_weight: 0.1

  - id: silk_handkerchief
    name: Silk Handkerchief
    description: Monogrammed, scented, and a silent declaration of breeding. Also useful for evidence.
    category: accessory
    value: 2
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, personal, evidence]
    lore: A dropped handkerchief has started more stories than any weapon.
    narrative_weight: 0.2

  # === DOCTOR'S KIT ===
  - id: stethoscope
    name: Stethoscope
    description: Two rubber tubes, an ebonite chestpiece, the new binaural pattern from the medical journals. Hangs around the neck like a sign of office.
    category: tool
    value: 6
    weight: 0.3
    rarity: uncommon
    power_level: 1
    tags: [medical, diagnostic, signature]
    lore: The instrument that lets a doctor hear what the patient will not say.
    narrative_weight: 0.3

  - id: clinical_thermometer
    name: Clinical Thermometer
    description: A six-inch glass tube with a mercury bulb and a kink that holds the reading. Cased in a leather sleeve.
    category: tool
    value: 4
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [medical, diagnostic]
    lore: Six minutes under the tongue. The fever does not lie.
    narrative_weight: 0.2

  - id: quinine_bottle
    name: Quinine
    description: A small brown bottle of quinine sulphate — for fevers, malaria, the lingering complaints of anyone who has served in a hot country.
    category: consumable
    value: 3
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [medical, apothecary]
    lore: Every household with a colonial past keeps a bottle on the mantelpiece.
    narrative_weight: 0.2

  - id: iodine_tincture
    name: Tincture of Iodine
    description: A dark brown bottle with a stopper. Stings when applied, but cleans a wound that would otherwise turn.
    category: consumable
    value: 2
    weight: 0.2
    rarity: common
    power_level: 1
    tags: [medical, antiseptic]
    lore: Modern medicine in a small bottle. Lister would approve.
    narrative_weight: 0.1

  - id: bandages_linen
    name: Linen Bandages
    description: A roll of clean white linen, boiled and folded. Enough to dress an arm or wrap a head.
    category: consumable
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [medical, dressing]
    lore: The first thing a doctor unrolls and the last thing he packs away.
    narrative_weight: 0.1

  # === ECCLESIASTICAL KIT ===
  - id: breviary
    name: Breviary
    description: A small leather-bound book of daily offices, worn smooth at the corners. The Episcopal sort — Anglican Communion, English-printed.
    category: document
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [devotional, signature, clergy]
    lore: The rector's daily office. Read on the train, at the bedside, between funerals.
    narrative_weight: 0.3

  - id: prayer_book
    name: Book of Common Prayer
    description: Cloth-bound, ribbon-marked, signed inside the cover by the giver. Church of Scotland Wee Free or Episcopal — opens differently to each.
    category: document
    value: 3
    weight: 0.5
    rarity: common
    power_level: 1
    tags: [devotional, clergy]
    lore: Some people read it. Some carry it. The difference shows.
    narrative_weight: 0.2

  - id: sermon_notebook
    name: Sermon Notebook
    description: A clothbound notebook, half-filled with Sunday outlines in a hand that becomes neater toward the back. Marginalia in pencil.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [clergy, writing]
    lore: A minister's working drafts. Some pages are crossed out savagely.
    narrative_weight: 0.2

  - id: communion_kit
    name: Portable Communion Kit
    description: A small mahogany case fitted with a pewter chalice, a screw-top paten, and a glass vial for wine. For house-calls and the dying.
    category: tool
    value: 12
    weight: 1.0
    rarity: uncommon
    power_level: 2
    tags: [clergy, signature, ritual]
    lore: Carried to bedsides where the parishioner cannot reach the kirk.
    narrative_weight: 0.4

  # === DETECTIVE / CONSTABLE KIT ===
  - id: whistle_brass
    name: Brass Police Whistle
    description: A two-tone Acme Thunderer on a chain. The shriek carries half a mile across the glen.
    category: tool
    value: 2
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [signal, constabulary, signature]
    lore: One long, two short — the constabulary's old code. Help arriving.
    narrative_weight: 0.2

  - id: notebook_leather
    name: Pocket Notebook
    description: A small black leather notebook with a pencil loop. Lined paper, an elastic closure, the corners softened by a year in a coat pocket.
    category: document
    value: 1
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [writing, investigation]
    lore: Everything anyone has ever said in your presence, set down before it could be denied.
    narrative_weight: 0.2

  - id: fountain_pen
    name: Fountain Pen
    description: A black hard-rubber pen with a gold nib, refilled from a glass bottle. Leaks in the heat. Indispensable.
    category: tool
    value: 6
    weight: 0.1
    rarity: common
    power_level: 1
    tags: [writing]
    lore: An honest record needs an honest pen. The pencil can be erased.
    narrative_weight: 0.1

  # === GOVERNESS / SCHOOLMISTRESS KIT ===
  - id: chalkboard_slate
    name: Slate and Chalk
    description: A schoolroom slate in a wooden frame, with a length of chalk in a silk wrap. Wipes clean with a damp cloth.
    category: tool
    value: 1
    weight: 0.8
    rarity: common
    power_level: 0
    tags: [teaching, signature]
    lore: The classroom in a satchel. Thirty children have written sums on the same slate before yours.
    narrative_weight: 0.2

  - id: school_primer
    name: First Reader
    description: A small cloth-bound primer — the village school's standard text, dog-eared at the easier pages.
    category: document
    value: 1
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [teaching]
    lore: The book every child in the parish has cried over at some point.
    narrative_weight: 0.1

  # === EXPLORER / RETIRED OFFICER KIT ===
  - id: field_compass
    name: Field Compass
    description: A brass-cased prismatic compass in a worn leather pouch. The card still settles true.
    category: tool
    value: 8
    weight: 0.4
    rarity: uncommon
    power_level: 1
    tags: [navigation, signature, military]
    lore: Carried across two continents and back. Knows north better than its owner does.
    narrative_weight: 0.3

  - id: regimental_decorations
    name: Service Decorations
    description: A small ribbon bar in a velvet case — campaign medals, a clasp for India, another for the Cape. Worn on dress occasions, kept in a drawer otherwise.
    category: accessory
    value: 0
    weight: 0.2
    rarity: rare
    power_level: 0
    tags: [military, social, identity]
    lore: The ribbon says where you were. The medal says what you did. The clasp says who else didn't come back.
    narrative_weight: 0.5

  - id: service_revolver
    name: Service Revolver
    description: A six-shot Webley in a leather flap-holster, oiled and kept. Heavier than the derringer, far less subtle.
    category: weapon
    value: 30
    weight: 2.0
    rarity: uncommon
    power_level: 3
    tags: [ranged, firearm, military, signature]
    lore: The officer's sidearm. Carried home from a place no one wants to talk about, and not surrendered since.
    narrative_weight: 0.6

  # === INDUSTRIALIST KIT ===
  - id: ledger_book
    name: Ledger Book
    description: A heavy clothbound ledger with marbled endpapers and double-entry columns. Half-filled in a careful hand.
    category: document
    value: 3
    weight: 1.5
    rarity: common
    power_level: 1
    tags: [finance, signature, business]
    lore: The book that says who owes whom. The columns add up; the lives behind them do not always.
    narrative_weight: 0.3

  - id: hip_flask
    name: Silver Hip Flask
    description: A pewter-and-silver flask, engraved with initials that may or may not be your own. Holds a respectable measure of whisky.
    category: consumable
    value: 4
    weight: 0.3
    rarity: common
    power_level: 0
    tags: [social, vice]
    lore: Carried for the cold. Used for the meeting that should have been easier than it was.
    narrative_weight: 0.2

  # === SHARED VICTORIAN ESSENTIALS ===
  - id: visiting_cards
    name: Visiting Cards
    description: A small leather case of engraved cards. Left at the door of a house one has called upon — folded corners carry their own meaning.
    category: document
    value: 1
    weight: 0.1
    rarity: common
    power_level: 0
    tags: [social, identity, introduction]
    lore: The card on the salver outranks the visit itself in many Edinburgh houses.
    narrative_weight: 0.2

  - id: pocket_watch_silver
    name: Silver Pocket Watch
    description: A hunter-cased silver pocket watch on a fob chain. Engraved inside with a date and a set of initials.
    category: accessory
    value: 12
    weight: 0.3
    rarity: common
    power_level: 1
    tags: [accessory, identity, heirloom]
    lore: A respectable man carries the time and his father's name on the same chain.
    narrative_weight: 0.3

  - id: oilskin_coat
    name: Oilskin Coat
    description: A long waxed-canvas coat, stiffened by wear and weather. Smells faintly of paraffin. Keeps the Highland rain out.
    category: outerwear
    value: 8
    weight: 3.0
    rarity: common
    power_level: 0
    tags: [outdoor, practical]
    lore: The garment that says you have walked the back lanes in November and intend to walk them again.
    narrative_weight: 0.2

starting_gold:
  # Pounds-denominated (matches currency block). Tuned so every calling
  # can engage low-level social gates — a card-game stake, a coach fare,
  # a small bribe — without arriving at chargen-end with empty pockets.
  Doctor: 30
  Clergyman: 15
  Detective: 12
  Society: 80
  Governess: 8
  Explorer: 25
  Industrialist: 120
