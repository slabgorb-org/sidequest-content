# Seed tropes for mutant_wasteland — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the wastes demand.
#
# World-agnostic by design (ADR-140): genre grammar only — scavenge
# economics, the Ancients' leavings as treasure-or-trap, mutation as
# ordinary fact, and communities improvising civilization out of salvage.
# No specific settlement, faction, or map feature; those belong to the
# worlds.

- id: the_tech_still_has_an_owner
  name: The Salvage Is Still Under Warranty
  description: >-
    A piece of Ancient tech the party holds or covets wakes up enough
    to disagree about being salvage. A light blinks in a pattern. A
    voice recites a fragment. A panel seals itself. Somewhere, by the
    logic of the Ancients, this thing is still checked out to
    somebody — and it has started trying to complete its errand.
  flavor_tags: [ancients, tech, salvage, errand]
  lifespan_turns: 8
  delivery_hints:
    - The errand-behavior is directional; the thing works better, or worse, along one bearing
    - A scav elder recognizes the pattern and prices the item down sharply, which is information
    - Letting it complete one small step of its errand changes what it will do next
  narrative_hint: >-
    The waking tech is a leash with a mystery on the far end. Let
    the bearing point somewhere worth a journey, and let the
    "owner" it reports to be long dead, horribly alive, or a
    system still patiently keeping accounts.

- id: the_water_tastes_like_metal_now
  name: The Water Changed on Tuesday
  description: >-
    A water source a community depends on — well, cistern, condenser
    line — has changed: a new taste, a film, a warmth it never had.
    Nobody is sick yet. The community's choices are all bad: keep
    drinking, tap a neighbor's supply, or trace the change upstream
    into ground nobody walks for good reasons.
  flavor_tags: [water, community, contamination, upstream]
  lifespan_turns: 7
  delivery_hints:
    - The change has a schedule — stronger some days, gone others — which means a process, not an accident
    - Something small and local has already adapted to the new water and is thriving
    - The community's water-keeper knows more than they're saying and is drinking from a private jug
  narrative_hint: >-
    Water is the wasteland's truest currency — let the upstream
    trace find a cause with an agenda: a leaking Ancient process, a
    new neighbor's tailings, or somebody treating the supply as a
    message. The water-keeper's private jug is the first thread.

- id: the_caravan_is_overdue
  name: The Caravan Is Three Days Overdue
  description: >-
    A trade caravan that is never late is late. The route is known,
    the schedule was kept for years, and the goods it carries are
    things people here have already promised to others. Waiting
    costs more every day. The route crosses ground where going to
    look is its own decision.
  flavor_tags: [caravan, trade, route, search]
  lifespan_turns: 6
  delivery_hints:
    - The caravan master's last stop reports nothing unusual — they left on time, provisioned, cheerful
    - Somebody in the settlement quietly stops waiting and starts liquidating their position
    - "The first sign on the route is wrong in a specific way: cargo untouched, something else taken"
  narrative_hint: >-
    The overdue caravan is a mystery whose answer reprices the whole
    region — bandits mean one thing, a new predator another, a
    closed route a third. Let what was TAKEN (people? one crate?
    the water?) define the antagonist before anyone sees it.

- id: the_mutation_is_spreading_socially
  name: The New Mutation Has Opinions
  description: >-
    A mutation is appearing across the community — same expression,
    multiple people, no shared blood. Mutations are as common as
    freckles; mutations that ARRIVE like rumors are not. The changed
    are calm about it. Increasingly, similarly calm. They've begun
    having opinions in unison.
  flavor_tags: [mutation, community, contagion, consensus]
  lifespan_turns: 8
  delivery_hints:
    - The commonality traces to a shared exposure — a place, a food, a salvage lot — recent and findable
    - The changed are not hostile; they are organized, and they vote together now
    - One of the changed fights it, privately, and wants help while it's still their idea to want it
  narrative_hint: >-
    The social mutation is body-horror played as politics. Let the
    consensus be benign on every individual issue and terrifying in
    aggregate, and let the resister's window be the clock — what
    they know about the inside of it is the party's only map.

- id: the_door_the_ancients_locked
  name: The Door the Ancients Bothered to Lock
  description: >-
    Scavs have found doors before — most opened by time, crowbars,
    or collapse. This one is different: intact, powered, and locked
    with intent. The Ancients left in a hurry and locked almost
    nothing. Whatever they locked, they locked it ON PURPOSE, with
    the power still running, and the light over it is green.
  flavor_tags: [ancients, vault, temptation, warning]
  lifespan_turns: 8
  delivery_hints:
    - The lock is solvable — there are markings, a sequence, a key-shape — which is somehow worse
    - Scav tradition has a word for green-light doors and a strong custom about them, honored unevenly
    - Someone else has camped near it, recently and repeatedly, working up their nerve or waiting for company
  narrative_hint: >-
    The locked door is the genre's central wager: treasure or trap,
    and the Ancients' own care is the only label. Let the custom be
    grounded in a remembered disaster, the camper be a rival or a
    warning, and whatever's inside justify both readings at once.

- id: the_signal_repeats_at_dusk
  name: The Signal Repeats at Dusk
  description: >-
    A signal has started up — a flash from a far ridge, a tone on a
    salvaged receiver, a column of smoke too regular to be a fire.
    Same time every evening. It is a message, or a beacon, or bait;
    the wasteland teaches that those categories overlap. Somebody,
    or something, wants watchers to come.
  flavor_tags: [signal, beacon, journey, bait]
  lifespan_turns: 7
  delivery_hints:
    - The signal's pattern carries structure — a count, a repetition — decodable with patience or the right elder
    - It started the night something else happened, and the coincidence is doing a lot of work
    - Others have noticed; departure preparations are visible in the settlement if anyone looks
  narrative_hint: >-
    The dusk signal is a race the party can choose to enter. Let
    decoding it beat traveling blind, and let the sender be neither
    rescue nor trap exactly — somebody bargaining with the only
    voice they have left.

- id: the_stranger_without_a_mark
  name: The Stranger Without a Mark
  description: >-
    A traveler has come in off the wastes with no mutation at all —
    no mark, no quirk, none of the ordinary freckling of the world.
    Clean like the old pictures. To some that's a relic; to some a
    miracle; to a quiet few, a commodity with a known buyer. The
    stranger seems unaware of the attention. That seems unlikely.
  flavor_tags: [stranger, purity, commodity, suspicion]
  lifespan_turns: 7
  delivery_hints:
    - The stranger's gear is subtly wrong — too uniform, too new, provisioned by someone with resources
    - A broker in the settlement sends word somewhere the night they arrive
    - The stranger asks innocent questions that assemble, in retrospect, into a survey
  narrative_hint: >-
    The unmarked stranger inverts the genre's body politics —
    purity as the freakish thing. Let three interests converge
    (venerate, sell, recruit) and let the stranger's own errand,
    when it surfaces, recast everyone's first read of them.

- id: the_garden_that_shouldnt_grow
  name: Something Green Where Nothing Grows
  description: >-
    Green has come up in dead ground — a stand of growth where the
    soil count says nothing should live. It is spreading at a
    walking pace. The growth is edible, or beautiful, or useful,
    early reports disagree — and old hands know the wasteland
    rarely gives gifts without invoicing later.
  flavor_tags: [growth, anomaly, hope, price]
  lifespan_turns: 8
  delivery_hints:
    - Animals avoid it; children don't; both facts are data
    - At its center there is a source — planted, leaked, or grown from something dropped
    - The first settlement reaction is fencing it, and the fence's owner is already selling shares
  narrative_hint: >-
    The green anomaly is hope with an asterisk. Let the party
    arbitrate what it becomes — food, shrine, hazard, or property —
    and let the source at the center connect to an Ancient process
    that hasn't finished what it was started for.

- id: the_toll_road_changed_hands
  name: The Toll Road Has New Management
  description: >-
    A route everyone uses — the pass, the bridge, the only graded
    road — has new keepers. The old arrangement was extortionate
    but predictable. The new collectors are polite, organized,
    better armed, and asking for something other than goods: names,
    rosters, who trades what with whom. The toll is information now.
  flavor_tags: [route, power, information, tribute]
  lifespan_turns: 7
  delivery_hints:
    - The new keepers' uniforms are improvised but their procedures aren't — someone trained them
    - What happened to the old keepers is told three ways, none firsthand
    - Travelers who answer the questions fully are waved through and remembered
  narrative_hint: >-
    Whoever buys information about everyone's trade is building a
    map for something. Let the party choose between feeding it,
    starving it, and tracing the trained procedures upstream to
    the actual proprietor — who is preparing a move that needs
    exactly that map.

- id: the_old_one_remembers_differently
  name: The Old One Remembers It Differently
  description: >-
    The settlement's oldest resident — keeper of the before-stories
    everyone was raised on — has started correcting the canon. Small
    things first: a name, a direction, the order of two disasters.
    The corrections are consistent, specific, and they all bend
    toward one claim: something everyone believes about this place
    is a lie someone planted on purpose.
  flavor_tags: [memory, history, canon, reveal]
  lifespan_turns: 8
  delivery_hints:
    - The corrections check out where they can be checked — a landmark, a salvage mark, a grave
    - Somebody is very invested in the old canon and starts attending every storytelling
    - The planted lie, if it is one, has a beneficiary whose family still collects on it
  narrative_hint: >-
    Revised history is a property dispute wearing a shawl. Let the
    old one's corrections point to something concrete — a claim, a
    boundary, a buried cache — and let the canon's defender act
    before the party finishes deciding whom to believe.

- id: the_repair_that_needs_a_part
  name: The Machine Needs One Part Everyone Recognizes
  description: >-
    Something the community runs on — the pump, the mill, the
    condenser — has finally broken, and the broken piece is Ancient
    work. Everyone who sees it recognizes the type; that's not the
    problem. The problem is everyone also knows where parts like it
    come from, and the knowing gets very quiet after that.
  flavor_tags: [tech, repair, expedition, taboo]
  lifespan_turns: 7
  delivery_hints:
    - A workaround exists and is consuming something the settlement can't spare for long
    - The place the part comes from has a survivor, an avoider, or a fresh set of tracks leading toward it
    - Somebody offers a part for trade at a price that proves they know exactly how badly it's needed
  narrative_hint: >-
    The needed part prices the taboo — let the expedition be the
    obvious play and the trader the tempting one, and let the
    trader's stock raise the better question: they've been to the
    quiet place, more than once, and come back saleable.

- id: the_kids_found_something_first
  name: The Kids Found It First
  description: >-
    The settlement's children have a new game, a new hideout, or a
    new friend — and the details, when an adult finally listens,
    describe something the adults would never have gone near. The
    children are fine. The children have BEEN fine for weeks. That's
    the part that needs explaining.
  flavor_tags: [children, discovery, innocence, dread]
  lifespan_turns: 6
  delivery_hints:
    - The kids' nonsense words for it, taken seriously, are accurate technical description
    - The thing has rules, and the children recite them like skip-rope rhymes; the rules are protective
    - One child has recently stopped playing the game and won't say why
  narrative_hint: >-
    Children as first contact: the thing has been gentle on
    purpose, learning the settlement through its smallest members.
    Let the skip-rope rules be a real protocol worth recording,
    and the child who quit be the one who saw past the gentleness.

- id: the_bounty_on_a_kind_of_person
  name: The Bounty Is on a Kind of Person
  description: >-
    Word comes down the trade routes: somebody well-resourced is
    paying for people of a particular description — a mutation
    type, a skill, a bloodline marker — alive, unharmed, top rates,
    no questions answered. At least one person in the party's orbit
    fits the description. The recruiters are already working the
    settlements, friendly as sales agents.
  flavor_tags: [bounty, mutation, pursuit, protection]
  lifespan_turns: 8
  delivery_hints:
    - The recruiters genuinely pay, and the first volunteers send back one cheerful message each, then nothing
    - The description is precise in a way that implies the buyer knows what the trait is FOR
    - Someone local has started compiling a list to sell, and the party is in a position to know who
  narrative_hint: >-
    The trait-bounty seeds a slow-burn rescue arc — let the
    cheerful-then-silent messages establish dread, the list-maker
    force a local confrontation, and the buyer's purpose connect
    the wanted trait to something the Ancients left running.

- id: the_map_sold_twice
  name: The Salvage Map Was Sold More Than Once
  description: >-
    The party holds a salvage map — bought, won, or inherited — to a
    site worth the trip. On the way, evidence accumulates that the
    seller ran a volume business: matching boot prints, a camp with
    the same map's margins copied out, a rival crew asking directions
    to landmarks only the map names.
  flavor_tags: [salvage, map, rivals, race]
  lifespan_turns: 6
  delivery_hints:
    - The rivals bought a cheaper edition — theirs lacks one detail the party's has, and the detail matters
    - Sign at the site says somebody has already been digging in the wrong spot, loudly
    - The seller is findable, afterward, and their client list is its own treasure
  narrative_hint: >-
    The oversold map turns a treasure hunt into a scramble with
    table manners — first arrival matters less than the missing
    detail. Let the rivals be negotiable, the wrong-spot diggers
    have woken something, and the seller's list seed the next
    three expeditions.
