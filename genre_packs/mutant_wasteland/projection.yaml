# ProjectionFilter rules for mutant_wasteland.
#
# Fog-of-war is load-bearing for this genre: a scavenger who hasn't seen
# an enemy yet should not see that enemy's intent or internal state leak
# into their narration. The core invariants handle targeting and
# self-echo; this file layers in the flavor-appropriate redactions.
#
# Kinds available in v1: NARRATION, CONFRONTATION. Extend as more kinds
# flow through _emit_event.
#
# Validate with:
#   python -m sidequest.cli.validate.projection_check \
#       sidequest-content/genre_packs/mutant_wasteland

rules:
  # visibility_tag activates the VisibilityTagFilter for canonical narration
  # events — reads payload._visibility attached by the narration decomposer
  # and enforces per-recipient inclusion + fidelity transforms.
  - kind: NARRATION
    visibility_tag: {}
  # SECRET_NOTE events carry prompt-redacted dispatches stripped from the
  # narrator prompt (Group G Task 5/6). Same visibility_tag rule so each
  # note only reaches the recipients named in its _visibility.visible_to.
  - kind: SECRET_NOTE
    visibility_tag: {}
  # Further CONFRONTATION / STATE_UPDATE redactions will layer in here once
  # payload schemas stabilize. visibility_tag MUST remain first so structural
  # decisions are not re-opened by later redactions.
