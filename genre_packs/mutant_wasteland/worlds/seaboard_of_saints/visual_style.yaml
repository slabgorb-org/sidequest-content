# Visual style — The Seaboard of Saints (world-level override).
#
# WORLD HARD OVERRIDE of the mutant_wasteland genre look. This world does
# NOT inherit the parent genre's grim Geiger-counter palette (desaturated
# rust, bruised toxic-green sky, scavenger despair). The Seaboard *works*:
# fifteen centuries after the Glory, the trains still run, the lighthouses
# still turn, the Mint still strikes coin, and miracles are adjudicated by
# committee. The strangeness comes from historical depth and matter-of-fact
# mutation — never from despair. Mutation is rendered the way a working
# coast renders weather: present, unremarked, woven in. Webbed hands mend
# nets; a grandfather-whale breaches off the grounds; nobody screams.
#
# Reference register (instance-level, per cliche-granularity discipline):
# Hudson River School luminism (Church, Kensett's coastal light) for the
# wild country; WPA post-office-mural civic optimism for the working towns;
# American Catholic devotional folk art and the linoleum-block saint-card
# for the iconography; New Bedford / Fitz Henry Lane luminist marine painting
# for the harbors. NOT concept-art grimdark, NOT cyberpunk neon, NOT the
# genre's wasteland.

# ── Core Style ────────────────────────────────────────────────

positive_suffix: >-
  luminous narrative digital painting in a New England maritime register,
  the real silver light of a working coast — sea-haze, granite, salt-bleached
  wood, lamp-amber interiors. Painterly with visible brushwork, warm and
  habitable rather than desolate; the world is fifteen centuries old but
  lived-in and tended, not ruined. Devotional gilt accents catch the light —
  saint-gold leaf, votive candle-flame, the gleam of struck coin and turning
  lighthouse glass. Mutation reads as matter-of-fact biology folded into a
  functioning civilization, never as horror: an extra-jointed hand at honest
  work, a strange-bodied whale on the far grounds, a man with chloroplast-pale
  eyes reading the weather. Quiet wonder, not dread. Composition favors the
  human scale of piers, parlors, mill-yards, meeting-grounds, and rail
  platforms, with the uncanny held at the edge of frame. Surface age is
  fifteen centuries of weather and repair — lichen on granite, salt-frost,
  patched brick, oiled wood — layered as texture, never as legible writing.
  No text, no caption, no title, no writing, no signs, no signage, no labels,
  no inscriptions, no graffiti, no watermark, no artist signature, no studio
  logo, no UI overlay, no game HUD, no title card, no border, no frame.

preferred_model: dev

color_palette:
  primary: "#8A9BA8"     # sea-silver granite — the coast's working light
  secondary: "#C7BBA6"   # salt-bleached driftwood and old brick
  accent: "#D9A441"      # devotional gilt — saint-gold, candle-flame, struck coin
  shadow: "#1E2A33"      # deep harbor blue-green
  highlight: "#EAF1F0"   # sea-foam and lighthouse glass

# ── POI landscapes — one establishing prompt per region (cartography.yaml) ──
# Keys are region ids; the POI renderer scopes these to
# worlds/seaboard_of_saints/assets/poi/<key>.png on R2.

atmosphere:
  down_east: >-
    Penobscot Bay at the far northeast corner — granite headlands, cold
    water, and a fog that seems to carry its own pale cold light. The
    rotating lights of the outer islands wheel over Mount Desert; far inland,
    Ktaadn stands blue over the Maine Woods. Composition keeps the horizon
    low and the granite dominant, with a tidal lobster-pound and the
    sternmen's hall at human scale on the shore. The light is northern and
    silver, almost colorless except where lamp-amber leaks from a hall window.
    Insular, weathered, entirely self-possessed.

  whalecoast: >-
    The deep-water whaling country — New Bedford wharves, Nantucket and the
    Aquinnah cliffs of Martha's Vineyard. The preserved whaleship Acushnet
    rides at her berth; oil-lamp warmth spills from the Seaman's Bethel.
    Far out on the grounds a Glory-strange leviathan breaches once, rendered
    as work and weather rather than menace — the whalers' covenant, not a
    horror. Palette runs marine-luminist: pewter sea, bone-pale sky, the
    warm pinpoint of a try-works fire. Composition holds the cliffs and the
    drowned salt marsh; the whale is small and far and unremarkable.

  cape_ann: >-
    A rockbound cove coast between Rockport and Gloucester — the granite
    quarries flooded to deep, still, cold pools that take the sky. The
    Sodality hall sits low at Pigeon Cove; seine nets dry on the rocks at
    Folly Cove, mended by hands a few generations of founder-effect have
    made webbed and unhurried. The Annisquam light stands off. Light is
    clear, hard, North-Shore midday; the water in the quarry pools is
    near-black and mirror-flat.

  boston_common: >-
    A brick city on filled tideland and steep Beacon Hill, the harbor
    islands half-drowned beyond. The bowfront of the Somerset Club on Beacon
    Street; across the Charles, the scriptoria of Harvard and MIT. The
    register is old-money portrait light — burnished, interior, a little
    cold. Brahmin mutation is carried with patrician unconcern. Autumn elms,
    gas-amber windows, the Common's long shadows; the mourned Charlestown
    convent-ground kept as a green silence at the edge of frame.

  salem_country: >-
    Tidal-river township country — the old Salem Village meeting-ground at
    Danvers, the registry house, the Court of Spectral Evidence still in
    polite session. Civic witch-craft rendered as orderly civic business:
    clapboard meeting-houses, a court bench, a quill, not a pyre. The light
    is low October gold through bare branches; the uncanny is procedural,
    almost dull, which is the point. Composition centers the meeting-ground
    commons under a wide pale sky.

  merrimack_mills: >-
    Canal-laced mill cities on a fast river — Lowell and Lawrence, the brick
    Boott complex with its power-looms still turning, water sluicing the
    races. On Pawtucket Street the Grotto's Stations of the Cross climb a
    landscaped hill; the Bread-and-Roses memorial stands at Lawrence. Steam,
    wet brick, immigrant-labor dignity. Light is mill-window grey shot with
    the warm grime of the weave-room; the canals mirror the smokestacks.
    Composition stacks brick verticals against moving water.

  providence: >-
    A hill city at the head of a drowned bay — the starting region. The
    Providence Athenaeum's reading room glows bookish-amber up College Hill;
    down on Atwells Avenue, Federal Hill's parlours breathe supper-smoke into
    the dusk. Off east at Swan Point the Lo'in keep their quiet pilgrimage to
    a poet's grave. The register is warm and literate — lamplight on book
    spines, the steam of a kitchen, brick and slate under a wet violet
    evening sky. The most welcoming light in the world.

  pioneer_valley: >-
    The broad Connecticut River valley between low ranges — Amherst,
    Northampton, the oxbow curling silver below Mount Holyoke. The college
    library stands quiet; the shut house at Amherst keeps a single upstairs
    window lit. The register is pastoral and reticent: white clapboard, water
    meadows, a pressed-flower stillness. Light is soft, high, New England
    summer — nothing dramatic, everything held in. Composition is wide, calm,
    and almost empty of figures.

  hudson_valley: >-
    A deep tidal river under faerie-haunted Highlands — Storm King's bulk
    over the water, the Dunderberg brooding, the Tarry Town church bridge at
    Sleepy Hollow. Stepped Dutch-gabled manors of the Patroon houses sit in
    wisteria shade. The register is washingtonian dusk: long gold light,
    deep blue cloves where unseen ninepin-players roll their distant thunder.
    Composition holds the river broad and the highlands close, with one manor
    or one bridge at human scale.

  catskills: >-
    Resort mountains and deep wooded cloves — the grand verandas of Brown's
    Hotel and Grossinger's, lit bandstand-bright against the evening pines.
    Inside, the Sleepers' Sodality keeps the thaw-floor cold while thawed
    pre-war retirees come downstairs to the dining room asking what they
    missed. The register is Borscht-Belt warm and faintly absurd — string
    lights, a comic's bandstand, ninepin-thunder in the high cloves. Comedy,
    never eeriness. Light is lamp-gold over a blue mountain dusk.

  adirondacks: >-
    High wild peaks, deep ponds, and trackless forest — Slabsides, a
    bark-sided hermit's cabin above a celery swamp at West Park; the
    Philosophers' Camp on Follensby Pond; Lake Champlain silvering below the
    High Peaks. The register is Hudson River School luminism: vast, hushed,
    transcendental light breaking through cloud onto still water. Human
    presence is one cabin, one canoe, dwarfed and at peace. Composition is
    wilderness-grand with a single quiet sign of the philosopher's life.

  white_mountains: >-
    Alpine summits with the worst weather on the seaboard — Mount Washington
    under the Big Wind, the Tip-Top House summit cathedral lashed in rime,
    Lizzie Bourne's cairn near the top. The weather-priests of the
    Observatory read the storm as scripture. Wind is made visible as torn
    cloud and horizontal rime-ice; the light is cold, scoured, and pewter.
    Composition is vertical and brutal — the summit cathedral small and
    defiant against a sky doing violence.

  plymouth_stone: >-
    A sandy cape of kettle ponds and drowned tidal flats — the toothed Rock
    at the tideline (it grew teeth), Patuxet and the Mashpee Wampanoag
    grounds, and far offshore the Mayflower sighted again, pale and
    impossible. King Philip's War is the unhealed wound here, so the register
    is grave-grey and cold-sand under a wide gull sky. Composition keeps the
    flats low and wet, the Rock close and strange, the ghost-ship a small
    cold smudge on the horizon.

  sunken_bight: >-
    The half-drowned vertical city — old New York taken to the
    skyscraper-shoulders, brackish tide running green through the avenues.
    Lady Liberty stands drowned to the shoulders in the harbor, and her torch
    still burns, kept as a working lighthouse — the one warm point in a cold
    dusk. The drowned Midtown towers wear filter-feeder reefs; the flooded
    subway lines breathe with the tide. Composition is grand and vertical:
    the burning torch high and small against bruised harbor twilight, the
    drowned towers receding into haze. Awe, not ruin-porn.

  outer_boroughs: >-
    Dense dry-ground neighborhoods ringing the drowned bight — the New
    Catholic core. Arthur Avenue's Belmont Italian parishes, Bensonhurst,
    East 116th Street in Spanish Harlem, and Mother Cabrini's shrine high at
    Fort Tryon. The register is feast-day warm: strings of votive bulbs over
    a narrow street, devotional banners, a procession's brass and timbales,
    tenement brick glowing in low gold light. Crowded, alive, and held
    together by the saints. Composition is street-level and intimate.

  philadelphia: >-
    Federal-era ruins on a tidal river, working row-house wards between them
    — the United States Mint still striking coin from the pre-war dies, Broad
    Street kept as the Mummers' route, Father Divine's Peace Mission estate
    out at Gladwyne. The register bridges north and south: red brick, white
    federal marble gone soft with age, the glint of new-struck pennies. Light
    is humid mid-Atlantic afternoon, gold and a little heavy. Composition
    sets a crumbling federal colonnade against a living row-house street.

  baltimore: >-
    A harbor city on the wide brackish Chesapeake — Poe's grave in the
    Westminster burying-ground, the skipjack oyster fleet working under sail
    by law, the Eastern Shore and Tubman's Dorchester marshes beyond. The
    register braids a Poe dirge with crab-house warmth: dark churchyard stone
    and a single candle against, elsewhere, the white press of sail on green
    water and the steam of a crab table. Light is overcast pearl over the
    bay, with one warm interior point. Composition holds harbor, sail, and
    churchyard.

  dc: >-
    A monumental ruin-city on a tidal estuary — the Mall run wild, the
    Smithsonian kept as a reliquary with the Air & Space hall a cathedral of
    hung machines, and Brookland ("Little Rome") seating the Magisterium's
    southern see in a hush of brick seminaries and chapel domes. The Pentagon
    is both cult and ruin at the edge of frame. The register is polite and
    strange: ivied marble, liturgical quiet, sun through a broken dome onto a
    venerated relic. Light is green-gold and reverent. Composition is grand,
    overgrown, and serene.
