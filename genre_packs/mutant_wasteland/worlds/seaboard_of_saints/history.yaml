chapters:
- id: the_northern_reach
  label: The Northern Reach
  points_of_interest:
  - name: Down East
    slug: down_east
    region: down_east
    type: coast
    description: Penobscot Bay granite and cold fog; lobster guilds and lighthouse keepers, with Ktaadn
      standing inland over the Maine Woods.
    visual_prompt:
      solo: 'Wide establishing view of a rugged granite headland coast under luminous cold fog. Foreground:
        a tidal lobster-pound of weathered grey timber and slatted pens, a low lichened granite hall with
        one window leaking lamp-amber light, coiled rope and wooden traps on the ledge. Middle ground:
        black cold water, a tall white lighthouse on an outer island slowly turning a pale beam through
        the haze. Background: the blue inland bulk of a far granite mountain and a higher distant peak,
        low silver northern light, almost colorless sky. Painterly luminist marine light, soft brushwork,
        weathered lichened granite, salt-frost on the timber, warm and lived-in. No text, no caption, no
        title, no writing, no labels, no signage, no watermark, no logos, no border, no frame.'
      backdrop: Granite headland coast in luminous cold fog, a tidal lobster-pound and lamp-lit granite
        hall, a turning outer-island lighthouse beam, blue inland mountains, low silver northern light.
