chapters:
- id: the_northern_reach
  label: The Northern Reach
  points_of_interest:
  - name: Down East
    slug: down_east
    region: down_east
    type: coast
    description: Penobscot Bay granite and cold fog; lobster guilds and lighthouse keepers, with Ktaadn
      standing inland over the Maine Woods.
    visual_prompt:
      solo: 'Wide establishing view of a rugged granite headland coast at Penobscot Bay under self-luminous
        cold fog. Foreground: a tidal lobster-pound of weathered timber and a low granite sternmen''s
        hall, one window leaking lamp-amber. Middle ground: black cold water, a rotating lighthouse on
        an outer island throwing a pale beam through the haze. Background: the blue inland bulk of Mount
        Desert and distant Ktaadn under low silver northern light, almost colorless. Painterly luminist
        marine register, fifteen centuries of lichened granite. No text, no caption, no labels, no watermark,
        no UI, no border.'
      backdrop: Granite headland coast in luminous cold fog, a tidal lobster-pound and lamp-lit sternmen's
        hall, an outer-island lighthouse beam, blue inland mountains, silver northern light.
  - name: The Whalecoast
    slug: whalecoast
    region: whalecoast
    type: coast
    description: Mutant whalers and a preserved whaleship; Melville syncretized with Wampanoag practice
      and the plain biology of the deep.
