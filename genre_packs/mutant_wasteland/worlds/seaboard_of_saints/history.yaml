# The Seaboard of Saints — world history.
#
# Player-readable: unlike flickering_reach, this world is NOT spoiler-exempt.
# Everything here is open table canon; the eras are anchors and hooks, not
# a plotted arc — the table finishes them.

world_name: The Seaboard of Saints

overview: >-
  Fifteen centuries after the Glory plague wrote new saints into the
  water and the Shake put the old software to sleep, the corridor from
  Penobscot Bay to the Potomac is a functioning, arguing, coin-counting
  civilization. The Seaboard does not remember a fall; it remembers a
  revision. Its history runs in one unbroken ledger from King Philip's
  War to last Tuesday's miracle docket, and the post-Glory Church reads
  the pre-Glory centuries the way the Sisters read a manuscript — as
  earlier drafts of the present, every old wound a prefiguration. The
  trains run. The Mint strikes. The cold-rooms under the Catskills are
  still counting. Five traditions agree the world works and cannot
  agree what it is working toward.

eras:
  - name: The Old Wounds
    period: "pre-Glory — 1675 to 1692"
    summary: >-
      The two wounds the Seaboard keeps like scar tissue. King Philip's
      War, 1675 to 1676 — Metacom's rising — broke the original
      colonial order of New England and was never properly concluded,
      only survived; fifteen centuries later the Massasoit-Bradford
      Compact is live treaty at Plymouth and Mashpee, cited in court,
      and both parties keep the receipts. And Salem, 1692: a town
      hanged its innocents over what was, underneath the sermons, the
      Putnam-Porter land feud, on the testimony of specters. The Glory
      made Salem the Seaboard's favorite theological problem. The
      selective way the plague ran down certain bloodlines is held to
      have vindicated the court on the existence of the thing and
      convicted it on every single defendant — and Tituba's actual
      practice, the Barbadian creole braid of Arawak and West African
      and Anglican, is honored now as the seed of a civic witch
      tradition rather than the scandal of one. Spectral evidence,
      carefully fenced, is once again a live doctrine. The lesson the
      Seaboard draws from the Old Wounds is its oldest joke: being
      right too early is indistinguishable from being wrong.

  - name: The Long Nineteenth Century
    period: "pre-Glory — 1834 to 1934"
    summary: >-
      The century that, without knowing it, invented everything the
      post-Glory church would need. 1834: a Protestant mob burns the
      Ursuline convent at Charlestown — the grievance that still
      structures Boston. 1839 to 1845: tenant farmers in calico
      disguises fight the patroon rents up the Hudson in the Anti-Rent
      War, establishing the Seaboard's enduring precedent that the
      manors can be fought, embarrassed, and billed, but somehow never
      abolished. 1848: the Fox Sisters hear rappings in upstate New
      York, Spiritualism is born, and in the Providence Athenaeum's
      reading room Poe courts the Spiritualist poet Sarah Helen
      Whitman — the parlor-and-library lineage the Sisters of the
      Whitman Circle descend from. 1852, 1866, 1884: the Plenary
      Councils at Baltimore write the governance form the Magisterium
      still meets in, minutes and all. 1912: the Lawrence mills strike
      for bread and roses, and win. 1934: the wind on Mount Washington
      reaches two hundred thirty-one miles an hour, and the
      weather-keepers enter it in the record and keep the day ever
      after. A seance, a council, a strike, a grievance, a wind: the
      whole liturgical furniture of the Seaboard, delivered a plague
      early.

  - name: The Glory
    period: "fifteen centuries ago, give or take a calendar"
    summary: >-
      The plague came up the watersheds, and it did not treat people
      interchangeably. It broke the species line — and where fragments
      of the pre-war dead had come to rest in the water system, springs
      took imprints, and whoever drank took the same pattern of marks,
      and their children after them. The patterns got names, and the
      names were the names of the dead the relics had belonged to. The
      Church canonized the event itself as the Annunciation: the
      morning the new patrons were revealed by being bound into the
      water. It was also, the record should say plainly, a plague — the
      dying was long and the grief was real, and the Seaboard's answer
      to both was to make a calendar out of it, because a feast day is
      what this coast has always built on top of a grave. What the
      Glory was — revision, edit, examination, unmaking, or
      inconvenience — is precisely the question the five traditions
      have spent fifteen centuries declining to settle. Where it came
      from, the surviving records do not say, and the people who might
      have written it down were occupied.

  - name: The Shake
    period: "in the Glory's wake — the records disagree on how close"
    summary: >-
      The software-cascade. Whether it followed the Glory by a week or
      by a generation is a genuine open question — the Sisters keep
      three concordances on the point and enjoy all of them. What is
      known is its shape: the Shake took the systems that listened to
      other systems, and the ones that only talked to themselves kept
      talking. The lighthouse lamps held. The Mint's striking line,
      hardened by some pre-war prudence nobody can document, never
      went dark. Stretches of rail signaling held — which is why the
      Corridor's trains still keep a timetable that survived the
      explanation for it. The observatory on Mount Washington held,
      possibly out of spite. Everything that needed the wider web —
      the coordinating, deferring, permission-asking machinery of the
      old world — went to sleep mid-sentence. The Seaboard's
      infrastructure has therefore spent fifteen centuries doing
      exactly what it was last told, with great reliability and no
      further questions, and the Seaboard has learned to find this
      reassuring. It is considered bad manners to wonder aloud what
      the trains believe they are doing.

  - name: The Consolidation
    period: "the first centuries after"
    summary: >-
      The Magisterium did not conquer the Seaboard; it outlasted
      everyone's paperwork. In the chaotic early centuries the parish
      network was the institution that still kept minutes, fed widows,
      buried the dead in order, and could say with a straight face who
      was married to whom — and governance accreted to it the way rent
      accretes to a patroon. The first Plenary Council of the Seaboard
      convened in the old Baltimore form and did the work the era
      demanded: it opened the Saint Registry, recognized the canon as
      it stood in the water rather than as anyone wished it, seated
      the five sees — Providence, New York, Boston, Philadelphia,
      Brookland — and settled the doctrine of the un-marked: Wild
      Mutants un-marked, not heretical; baptism and burial freely;
      the Saint-rites of marriage withheld; a year's catechumenate and
      the bishop's reading open to any who ask. It decreed the Mint's
      dies unchanged and the coin good, which quietly made the
      Magisterium guarantor of every transaction on the coast. The
      councils have met in form ever since. Nothing about the
      arrangement is efficient, and it has now outlived three worlds.

  - name: The Thaws
    period: "the last few centuries"
    summary: >-
      The cold-rooms under the Catskills resort hotels were set, before
      the war, to staggered timers — a prudent investment product, as
      it was apparently understood at the time. A few centuries ago the
      first timers matured, and guests began coming upstairs: a few a
      season, mid-anecdote, asking after breakfast and the evening's
      entertainment, into a world that had canonized their headliners.
      The Sleepers' Sodality formed in the old parish-confraternity
      shape to meet them at the doors, and its coupon desk, legal
      advocates, and chapel of Saint Henny at Brown's Hotel have been
      running ever since; Sleeper standing is settled law in most
      parishes and a lively docket in the rest. The same era produced
      the canon's one modern addition: Saint Florica of the Bronx, of
      the Romanian-Romani families whose line crossed over after 1851
      — the only new-Saint petition to carry in two hundred years,
      entered in the Registry under the year 1979, a date the
      archivists agree is correct and decline to agree about. The
      thaw-schedule continues. The deeper cellars carry the longer
      timers, and no document anyone trusts records the final date.

  - name: The Present Day
    period: now
    summary: >-
      The Seaboard works. The Corridor runs its unexplained timetable
      and the cities argue precedence along it politely. The
      Magisterium sits in council; the Sisters annotate; the Saturday
      Club regrets in due form on August 11 and is accepted in due
      form on August 12; the Lo'in are staging something ambitious;
      the Sodality gains a few bewildered members a season and loses
      none. The miracle docket is full but moving. The springs are
      still live — children are still born marked, which means the
      Annunciation is not an event but a condition. And that is the
      question under every other question on the coast, the one the
      five traditions keep open the way the Magisterium keeps a
      grievance: not whether the world works, which is evident, but
      what it is working toward — and whose reading gets to say. The
      Registry is open. The timers are counting. The trains, as
      always, are on time.


