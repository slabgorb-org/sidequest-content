        glow from the Seaman''s Bethel. Middle ground: pewter deep water where a single Glory-strange
        leviathan breaches far off, unremarkable and at work, not menacing. Background: the red clay Aquinnah
        cliffs of Martha''s Vineyard, bone-pale sky. Marine-luminist digital painting, warm and habitable.
        No text, no caption, no labels, no watermark, no UI, no border.'
