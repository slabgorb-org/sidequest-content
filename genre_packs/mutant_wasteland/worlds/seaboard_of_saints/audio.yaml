# Fail-loud contract
# ---------------------------------------------------------------------------
# Per music-director core principles: if a path listed above does not exist on
# disk / in R2 at runtime, the engine MUST fail loudly. This manifest declares
# NO track as optional — every entry is a contract. The ACE-Step pipeline run
# (operator: `python scripts/generate_music.py --genre mutant_wasteland`,
# world-scoped to seaboard_of_saints) is a SEPARATE step; until tracks are
# generated and uploaded to R2 under worlds/seaboard_of_saints/audio/, this
# manifest is the spec, and the loader should refuse to bind this world rather
# than silently fall back to the genre's grim mood beds. The override is total:
# NONE of mutant_wasteland's wasteland mood_tracks — the Geiger-counter tension,
# the scrap-iron combat, the desolate-expanse drone, the radioactive ambience —
# may sound in this world. A world that works does not sound like the end of the
# world. The world stays draft: true until these tracks (and the image renders)
# flip the asset gate to MET.
