# The Seaboard of Saints — cosmological ground truth.
# Player-readable: everything here is open doctrine, open history, open argument.
#
# factions[] holds two layers, all retrievable units (ADR-118):
#   1. The six MAJOR powers — the Glory's tradition readings (Magisterium,
#      Sisters of the Whitman Circle, Brahmin Remnant/Saturday Club, Lo'in,
#      Sleepers' Sodality) plus the Hudson-Valley Patroon Houses.
#   2. The regional MINORS (story 103-7, world spec §7) — guilds, councils,
#      orders, and societies bound to the 103-6 region slugs.
#
# Cryptic-Alliance tags (story 103-7): factions a PC can tie to at chargen
# carry `joinable: true` + a `chargen_tie` block. v1 these are CONTENT TAGS —
# the tie is realized in char_creation.yaml's `cryptic_alliance` scene, which
# grants the `chargen_tie.starting_item` via item_hint (the equipment slot),
# and that token in inventory is the signal the narrator reads to color a
# faction's opening NPC reactions (ADR-020 disposition stays narrator-mediated
# in v1). When AWN Plan 7 lands the Enclave sim, these same tags are its
# retrofit hook — see `# AWN Plan 7 Enclave retrofit hook` markers below.

world_name: The Seaboard of Saints

cosmology: >-
  Fifteen centuries ago the Glory plague broke the species line, and
  the Seaboard long ago stopped calling it a catastrophe. The Church
  calls it the Annunciation: the morning new patrons were revealed by
  being bound into the water. When the Glory came up the watersheds it
  carried fragments of the pre-war dead — a ship's timber steeping in
  one spring, a poet's grave-soil in another — and wherever a relic
  steeped, the water took an imprint. Whoever drank from that spring
  took the same pattern of marks, and their children after them, and
  theirs. Each pattern is a Saint. The vocabulary is settled and
  everyone uses it, including the irreligious: one is Saint-marked, a
  mark-bearer; the gift's cost is the Saint's drawback, carried as
  openly as the gift; to bear both well is called walking under the
  patron's hand. The faith that recognizes the canon is New
  Catholicism — the Italian, Irish, Latin, and French-Canadian parish
  traditions that had venerated folk saints alongside the official
  canon for centuries, fused with veneration of the literary dead and
  with the parlor Spiritualism of 1848 — the Fox Sisters' rappings and
  the Whitman Circle's parlors — a lineage that taught the Seaboard to
  regard the dead as merely awkward correspondents. Its governing body, the Magisterium of the
  Seaboard, meets in Plenary Council — the form borrowed whole, minutes
  and all, from the Baltimore Plenary Councils of 1852, 1866, and
  1884 — with principal sees at Providence, New York, Boston,
  Philadelphia, and Brookland in Washington, the neighborhood the old
  church already called Little Rome. Five traditions hold five readings
  of the Annunciation, and the disagreement is doctrine, not war: the
  Magisterium holds that the Glory was God revising the canon; the
  Sisters of the Whitman Circle hold that it was a manuscript revision,
  and insist the difference is not semantic; the Brahmin remnant holds,
  quietly, that it was a test the Catholics passed; the Lo'in hold that
  saints are roles, not rewards; and the Sleepers' Sodality, thawed
  into the argument fifteen centuries late, mostly holds its coffee and
  converts. On the un-marked the Magisterium is precise: a Wild
  Mutant — born off the water-system, or to springs too mixed to
  read — is un-marked, not heretical. Baptism, yes; burial, yes; the
  Saint-rites of marriage, no, for those require a mark on both
  parties. The remedy is a year's catechumenate at a parish, after
  which the local bishop rules whether the candidate's pattern matches
  a Saint in the Registry or merits a petition for a new one. Petitions
  almost never carry. In the last two hundred years exactly one has:
  Saint Florica of the Bronx, of the Romanian-Romani families whose
  line crossed over after 1851, whose recognition the Registry dates to
  the year 1979 — and which of the three running calendars that year
  belongs to is a question the Athenaeum archivists answer differently
  depending on who is asking and how much time you have. Even the money
  is theology. The United States Mint at Philadelphia — founded 1792,
  oldest in the country, its striking line hardened against the Shake
  and never once dark — strikes coin to the pre-war dies by Magisterium
  decree, because nobody has dared change them. IN GOD WE TRUST on the
  quarter is read as the Federal Coinage's submission to the
  Magisterium; the eagle on the reverse is venerated, informally, as
  Saint Eagle of the Reverse; Sacagawea on the gold dollar is canonized
  outright. Denomination carries meaning: a roll of quarters is a
  serious transaction, old silver dollars settle debts of honor, and
  pennies are alms — the Saint-marked tithe to their parishes in
  pennies, counted out by hand, because the counting is the prayer.

geography: >-
  The Seaboard runs from Penobscot Bay to the Potomac along the spine
  everyone calls the Corridor — the pre-war rail line that still
  connects the settled cities, on trains that keep a schedule nobody
  understands, posted nowhere, and missed by no one who matters.
  Movement along the Corridor is fast and civilized; movement off it
  is the adventure. The rugged Northeast held up better than most of
  the continent — granite headlands, deep harbors, infrastructure
  built by people who expected winter — and fifteen centuries have
  worn it without breaking it. Lighthouses still turn on the Maine
  coast above the lobster boats. The observatory on Mount Washington
  still takes the weather, still publishes it, and is no longer
  entirely clear on the difference between predicting a storm and
  scheduling one. The Hudson runs through manor country, old patroon
  land where the rents are still argued in the original paperwork; the
  Catskills resorts open every summer to guests who checked in before
  the Glory. Southward the shifted sea took the lower coast: New York
  stands shoulder-deep in its own harbor, its upper floors lively, its
  drowned statue holding her torch up as a working light, rent in the
  high stories paid in quarters. Philadelphia keeps the Mint. Baltimore
  keeps a sail-only oyster fleet on the Chesapeake under a pre-war law
  nobody can repeal. Washington keeps the Library of Congress, still
  cataloguing, and a Capitol that hosts a body which believes it
  governs, politely attended. The land between is not empty and it is
  not dead — woods, farms, parish villages, river trade. It is simply
  off the Corridor, which on the Seaboard is its own kind of distance.

history: >-
  The Seaboard's history did not begin with the Glory; the Glory just
  reread it. King Philip's War never quite closed — the
  Massasoit-Bradford Compact is live treaty at Plymouth and Mashpee,
  and both parties keep the receipts. Salem hanged innocents in 1692
  over what was, underneath the theology, the Putnam-Porter land feud;
  fifteen centuries of the Glory's selective bloodlines later, the
  trials are held to have been right about the existence of the thing
  and wrong about every single defendant, which is the most Seaboard
  verdict imaginable. Tituba's practice — Barbadian creole, Arawak and
  West African and Anglican braided together — is honored as the seed
  of a civic witch tradition, and spectral evidence is again
  admissible, narrowly, before Magisterium courts. In 1834 a Protestant
  mob burned the Ursuline convent at Charlestown, and the Magisterium
  has never forgotten: the Saturday Club observes the anniversary every
  August 11 with what it calls regret expressed in due form, and the
  Magisterium accepts the regret, in due form, annually. Tenant farmers
  in calico disguises fought the patroon rents up the Hudson from 1839
  to 1845, and the rents survived both the rebellion and the
  apocalypse. The mills at Lawrence struck for bread and roses in 1912
  and won. The wind on Mount Washington hit two hundred thirty-one
  miles an hour in 1934, and the weather-keepers still keep the day.

  Then the water changed. The Glory came up the watersheds as a plague
  and settled in as a calendar; the Shake followed, the
  software-cascade that put the old systems to sleep — some gently,
  some not — and whether it came a week after the Glory or a
  generation is a question the surviving records decline to answer.
  What had been hardened held: the Mint's striking line, the
  lighthouse lamps, stretches of rail signaling, the observatory on
  its mountain. The Magisterium consolidated across the early
  centuries less by conquest than by being the institution that still
  kept minutes — the first Plenary Council of the Seaboard, the Saint
  Registry, the five sees, the doctrine of the un-marked. The Corridor
  never stopped running; the timetable survived even though the
  explanation for it did not. A few centuries ago the cold-rooms under
  the Catskills hotels began opening on their pre-war timers, a few
  guests a season, retirees thawing mid-anecdote into a world that had
  canonized their headliners. Today the Seaboard works. The trains
  run. The Mint strikes. The miracles are heard on the docket in
  order. It is, everyone agrees, a functioning world — and the
  argument five traditions deep is about what, exactly, it is
  functioning as.

factions:
  - name: The Magisterium of the Seaboard
    disposition: neutral
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    joinable: true
    chargen_tie:
      starting_item: magisterium_letter
      opening_reaction: >-
        Parish NPCs read the letter and treat you as a known quantity owed
        courtesy — and owed the occasional errand. Brahmin and Patroon NPCs
        note the seal and grow correct, which is not the same as warm.
    summary: >-
      The Plenary-Council church of New Catholicism — keeper of the
      Saint Registry and of the canon's mainstream reading of the Glory.
    description: >-
      The Magisterium reads the Glory as God revising the canon. The
      immigrant parishes had venerated folk saints alongside the
      official roll for centuries; the Annunciation, in this reading,
      simply made it official, in water instead of ink. The Magisterium
      governs in Plenary Council, the form taken whole from the
      Baltimore Plenary Councils of 1852, 1866, and 1884 — sessions,
      schemata, promulgations, and a profound institutional patience —
      with principal sees at Providence, New York, Boston,
      Philadelphia, and Brookland in Washington. It keeps the canonical
      Saint Registry and adjudicates Saint recognition, marriage
      between marks, miracle disputes, and the narrow modern uses of
      spectral evidence. It administers the doctrine of the un-marked
      with scrupulous correctness: Wild Mutants are not heretics, and
      a year's catechumenate is always open to them. Its one visible
      grievance is old and tended like a garden — the Ursuline convent
      burned at Charlestown in 1834, regretted annually by the
      Saturday Club, the regret accepted annually, nothing concluded.

  - name: The Sisters of the Whitman Circle
    disposition: neutral
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    joinable: true
    chargen_tie:
      starting_item: athenaeum_borrowers_card
      opening_reaction: >-
        Learned NPCs and any house with a library treat you as a colleague
        with stack privileges; the Sisters expect you to bring back as much
        as you take out. The unlettered find the card faintly alarming.
    summary: >-
      The bibliographic-Spiritualist order of the Providence Athenaeum,
      for whom the Glory was a revision of the manuscript of the world.
    description: >-
      Named for Sarah Helen Whitman — the Providence Spiritualist poet
      whom Poe courted in the Athenaeum's reading room in 1848 — the
      Sisters read the Glory as a manuscript revision: the world is a
      text, the Annunciation was an editor's hand passing through it,
      and the Saints are emendations. Argue that this is a metaphor and
      a Sister will ask, with terrible courtesy, what you think isn't.
      Their practice is library-as-faith. They preserve pre-war
      scripture — newspapers, sheet music, technical manuals, novels —
      as canon alongside the Bible, conduct authenticated seances in
      the Fox Sisters lineage, and hold the Magisterium's license for
      approved automatic writing, a license both parties pretend was
      never in doubt. They keep junior houses in the learned cities and
      a senior claim on every marginal note in the Seaboard. Of Wild
      Mutants they say only: unsigned manuscripts, awaiting
      attribution — and the Sisters do love an attribution problem.

  - name: The Brahmin Remnant
    disposition: wary
    # The Saturday Club is the Remnant's governing dinner-circle (world spec §7
    # names the Club as the major; the Remnant is the people, the Club their
    # organ). AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag.
    joinable: true
    chargen_tie:
      starting_item: saturday_club_card
      opening_reaction: >-
        Old-blood and counting-house NPCs extend exquisite, conditional
        courtesy — the card means you are useful, not equal. Italian,
        Dominican, and Nuyorican NPCs clock it and keep their own counsel.
    summary: >-
      Boston's old Protestant aristocracy, who hold the Glory was a
      test — one the Catholics passed and the Protestants failed.
    description: >-
      The remnant of the old New England Protestant ascendancy reads
      the Annunciation as an examination whose results are not under
      appeal: the Catholics passed, the Protestants did not, and a
      gentleman does not dispute a grade. They are humble about it, in
      the way of people for whom humility is a finer carriage, but the
      strain is there, and it is built on the unhealed wound of 1834 —
      a Protestant mob burning the Ursuline convent at Charlestown, a
      debt their tradition incurred and cannot retire. The Saturday
      Club, the dinner circle descended from Emerson's table of 1855,
      observes the anniversary every August 11 with what it describes
      as regret expressed in due form; the form is exquisite, the
      regret is real, and the Magisterium's annual acceptance of both
      concludes nothing, by mutual and centuries-old agreement. Of Wild
      Mutants the remnant says one word — honest — and means it as the
      highest compliment its theology still has license to award.

  - name: The Lo'in
    disposition: cautious
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    joinable: true
    chargen_tie:
      starting_item: loin_playbill
      opening_reaction: >-
        Other Lo'in greet a fellow castmember and start angling for your
        part; theatres, taverns, and Swan Point pilgrims open up. The
        Magisterium is polite and watchful, the way one watches a mirror.
    summary: >-
      Mutant performers who reenact the pre-war myths in mutated form,
      and who hold that saints are roles, not rewards.
    description: >-
      The Lo'in read the Glory as an unmaking: it dissolved humanity
      into its archetypes, and what the Church calls Saints they call
      roles — not divine, but castable. Where the Magisterium
      canonizes, the Lo'in stage. A Lo takes a name and a part — Lo
      Edgar-of-the-Raven is a famous one — and performs the pre-war
      literary, musical, and cinematic myth in mutated flesh, which
      they hold to be the only honest medium left for it. Their one
      pilgrimage outside the repertoire is to Swan Point in Providence,
      to the grave of a pre-war writer of horrors who never once wrote
      of people like them as monsters; they reclaim him by reading him
      aloud over his stone, lovingly miscast. The traditions find the
      Lo'in unsettling in inverse proportion to how recently they have
      seen a performance. Of Wild Mutants the Lo'in say: cast members
      without scripts — and unlike everyone else who has an opinion
      about the un-marked, the Lo'in hold auditions.

  - name: The Sleepers' Sodality
    disposition: neutral
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    joinable: true
    chargen_tie:
      starting_item: sodality_coupon_book
      opening_reaction: >-
        Thawed Sleepers and the cold-room desks treat you as family with a
        claim on the coupon desk and the legal-aid roster. Parish clerks
        sigh at the coupon book and honor it anyway, by committee ruling.
    summary: >-
      The mutual-aid confraternity of thawed pre-war sleepers,
      headquartered at Brown's Hotel in the Catskills. Doctrinally:
      confused, and organized about it.
    description: >-
      The Sodality is what the thawed made of their bewilderment: a
      mutual-aid confraternity in the old parish form, because the
      parish sodality was the one pre-war institution that still
      worked exactly the way they remembered. Headquartered at Brown's
      Hotel in the Catskills, with a junior house at Maryhouse on the
      Lower East Side, it meets new sleepers at the cold-room doors
      with coffee, a current calendar, and a volunteer whose entire
      job is saying "yes, really" in a reassuring tone. It provides
      legal advocacy — Sleeper standing is still being settled in some
      parishes — and runs the famous coupon desk, which redeems
      pre-war retail coupons at a rate set by a committee that has
      been arguing about it for two hundred years. On the Glory the
      Sodality has no official reading; its members woke into a world
      that had canonized their headliners, and many converted on the
      spot. Saint Henny has a chapel at Brown's. The punchlines are
      considered liturgy, and attendance is excellent.

  # === The sixth major power ===

  - name: The Patroon Houses
    disposition: wary
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    joinable: true
    chargen_tie:
      starting_item: patroon_indenture
      opening_reaction: >-
        Manor NPCs read the indenture and slot you into the household with
        a place at the lower table and a debt you did not sign for. Free
        farmers and Anti-Rent men see the paper and go cold; the Houses'
        debts are the one thing the valley has never forgiven.
    summary: >-
      The Hudson Valley's feudal-pastoral manor-states, who hold the
      Glory simply confirmed an order the land had always kept — and who
      have never settled the Anti-Rent debt.
    description: >-
      Six manor-houses on grants older than the Republic — Van
      Rensselaer of Rensselaerswijck at Albany, the senior house;
      Livingston of Clermont in the mid-Hudson; Philipse of Philipsburg
      Manor at Tarrytown; and Beekman, Van Cortlandt, and Schuyler
      between. They read the Annunciation as the land confirming its own
      tenure: each manor keeps a Saint of its preference, and a manor
      Saint's marks run truer the longer a bloodline has held the
      ground, which the Houses regard as proof and their tenants regard
      as a racket. The register over all of it is faerie-feudal — the
      manors keep older bargains than the Church likes to name, and a
      Patroon's word in the dark of the Sleepy Hollow glen carries a
      weight no parish court will overrule. Their one unhealed conflict
      is the Anti-Rent War: in 1839 the valley's tenant farmers rode in
      disguise as Calico Indians and broke the manorial collections by
      force, and the question of what a Patroon may actually demand has
      been open, and armed, ever since. They want the old tenures
      honored, the rents resumed, and the glen's bargains kept; the free
      towns want them ended; and the Magisterium, which would rather not
      choose, keeps finding reasons the case is not yet ripe.

  # === Regional minor factions (world spec §7) ===
  # Bound to 103-6 region slugs; narrative + disposition + retrieval
  # entities only — no Enclave settlement sim (that is AWN Plan 7).

  - name: The Sternmen Guilds
    disposition: neutral
    region: down_east
    joinable: true
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    chargen_tie:
      starting_item: sternmens_lay_token
      opening_reaction: >-
        Down East pound-keepers and lobster co-ops treat you as a hand
        with a lay coming, owed a berth and a share. Inland NPCs find the
        token meaningless and the smell of it considerable.
    summary: >-
      The pound-keepers and lobster co-ops of Down East, who run the
      grounds by a hierarchy older than the Glory.
    description: >-
      The confederated guilds of the Penobscot Bay sternmen — the
      pound-keepers, the lobster co-ops, the lighthouse-tenders' locals —
      who hold the cold grounds from Bar Harbor to Eastport by a charter
      of seniority that predates the Annunciation and survived it
      unchanged. A guild berth is inherited or earned over years; the lay
      (the fractional share of a season's catch) is the unit of standing,
      and a Sternman's word on whose trap-line is whose is the only court
      Down East recognizes. They are insular, weather-hardened, and
      indifferent to the Corridor's politics except where a Patroon or a
      Mint clerk tries to tax the water. They want their grounds left
      alone and their lays honored, and they keep an uneasy, respectful
      border with the Penobscot, whose fog-cosmology they only half
      pretend not to believe.

  - name: The Mount Washington Observatory
    disposition: neutral
    region: white_mountains
    joinable: false
    summary: >-
      The weather-priests of the White Mountains, who read the worst
      weather in the Seaboard as scripture and sell the forecast dear.
    description: >-
      An order of weather-priests holding the summit station on Mount
      Washington, where the pre-war instruments never went dark and the
      wind has been measured at speeds the rest of the coast refuses to
      credit. They read the mountain's violence as a continuous
      revelation and keep the only reliable long-range forecast on the
      Seaboard, which they sell to the rail lines, the Sternmen, and the
      Catskills hotels at rates that fund their hermitage. The
      Magisterium has never decided whether their practice is meteorology
      or a minor heresy and has prudently left the question on the
      summit. They want the station kept, the readings unbroken, and the
      pilgrims who climb to ask the weather to tip well and leave.

  - name: The Cape Ann Sodality
    disposition: neutral
    region: cape_ann
    joinable: false
    summary: >-
      The fishing-village confraternity of Folly Cove, Lanesville, and
      Pigeon Cove — a coastal isolate that married its own for so long
      the Glory had unusual material to work with.
    description: >-
      The lay confraternity of the Cape Ann fishing villages — Folly
      Cove, Lanesville, Pigeon Cove, Annisquam — Azorean and Sicilian and
      old-Yankee families who have intermarried on the same granite
      headland for fifteen centuries. The founder effect is real and
      old: a narrow gene pool that the Glory entered through a small door
      and rang like a bell, so the Cape Ann marks run to a family
      likeness the rest of the coast finds uncanny and the Sodality finds
      unremarkable. They keep their own feast-days, their own dialect of
      the liturgy, and a courteous distance from outsiders; they are
      fishermen and net-menders and stonecutters, not a mystery, and they
      tire of being looked at as one. They want a good haul, a kept
      feast, and to be left off the list of things the Corridor finds
      strange.

  - name: The Smithsonian Reliquary Order
    disposition: neutral
    region: dc
    joinable: false
    summary: >-
      The Brookland-affiliated keepers of the national collection, a
      junior house of the Whitman Circle that guards the Ancients'
      objects rather than their words.
    description: >-
      The order that holds the pre-war national collection on the Mall —
      a junior house of the Sisters of the Whitman Circle, affiliated to
      the Brookland sees, who specialize not in manuscripts but in
      objects: the Ancients' machines, instruments, aircraft, and
      relics, catalogued and venerated as a parallel scripture of things.
      Where the Sisters authenticate texts, the Reliquary Order
      authenticates artifacts, and a thing certified by the Order carries
      a provenance the whole Corridor will honor — which makes their seal
      worth forging and their authenticators worth bribing. They keep
      careful, jealous custody and an old rivalry with the Library of
      Congress house over which is the senior reading of the Ancients.
      They want the collection whole, the catalogue closed, and the
      Lo'in, who keep trying to borrow exhibits for the stage, kept at
      the door.

  - name: The Atwells Avenue Society
    disposition: wary
    region: providence
    joinable: true
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    chargen_tie:
      starting_item: atwells_avenue_marker
      opening_reaction: >-
        Federal Hill NPCs read the marker and extend the particular warmth
        owed to a friend of friends — and the particular expectation. The
        Magisterium's clerks see it and pretend, courteously, not to.
    summary: >-
      The men who keep order on Federal Hill — an honored society
      syncretized with the Providence parishes in an arrangement neither
      the Society nor the Magisterium will fully describe.
    description: >-
      The society that keeps its own kind of order along Atwells Avenue
      in Providence — the Italian quarter's own authority, structured by
      family and obligation and a long memory, that the Federal Hill
      parishes have come to a working arrangement with over the
      centuries. The arrangement is real and unwritten: the Society keeps
      the peace its own way, contributes generously to the feast of Saint
      Rocco and the parish coffers, and the Magisterium's clerks find
      their ledgers reconcile and their questions answered before they
      are asked. They are not a crime out of the pulps; they are an
      institution that predates the law it operates beside, courteous and
      patient and absolutely not to be crossed on the Hill. They want
      respect, the feast kept, the arrangement honored, and the Saturday
      Club's Boston money kept on its own side of the Shore Line.

  - name: The Mashpee-Aquinnah Council
    disposition: neutral
    region: plymouth_stone
    joinable: false
    summary: >-
      The joint council of the two sovereign Wampanoag nations — Mashpee
      on the Cape, Aquinnah on the western cliffs of Martha's Vineyard —
      whose standing predates the Glory and survived it intact.
    description: >-
      The standing council of the Mashpee and Aquinnah Wampanoag — two
      distinct, sovereign nations, one on the Cape and one on the red
      clay cliffs of Aquinnah at the western end of Martha's Vineyard —
      who held their ground and their governance through the Glory as
      they had held it through everything before. Their sovereignty is
      not a courtesy the Corridor extends; it is older than the Corridor,
      and the Council treats the Magisterium, the Patroons, and the
      Saturday Club as exactly what they are — newer powers, to be dealt
      with at arm's length and by treaty. They keep their own relation to
      the land and the dead that the New Catholic canon has learned not
      to translate, and their whalecoast kin run the Acushnet lays
      alongside the Melville-marked without conceding a thing. They want
      their waters, their cliffs, and their council respected, and the
      old habit of being narrated by outsiders finally broken.

  - name: The Red Hook Stevedores
    disposition: wary
    region: sunken_bight
    joinable: true
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    chargen_tie:
      starting_item: stevedores_button
      opening_reaction: >-
        The Red Hook locals read the button and put you on the shape-up
        with a hook of your own; the docks open, and so do the debts a
        hook carries. Customs men and Mint clerks read it and watch their
        manifests.
    summary: >-
      The longshoremen and smugglers of Red Hook, whose elevated houses
      rode out the Sunken Bight and who control what moves off the
      drowned wharves.
    description: >-
      The longshoremen's local and the smuggling rings that share its
      membership entirely, working the wharves of Red Hook — the Brooklyn
      ground whose elevated houses stood high enough to survive the
      flooding of the Sunken Bight. They run the shape-up, the hiring
      hook by which a man works or doesn't, and the quiet second trade in
      what comes off a manifest before it is counted. Standing is a union
      button and a reputation for keeping your mouth shut; the bosses
      settle disputes on the pier and the river keeps the records. They
      hold a hard border with the Patroon Houses upriver, who own the
      cargo, and a working truce with the Atwells Avenue Society, who
      understand the business. They want the docks theirs, the hook
      honored, and the Sunken Bight's drowned cellars left to the divers
      they license.

  - name: The Catskills Resorts Guild
    disposition: neutral
    region: catskills
    joinable: false
    summary: >-
      The hoteliers' association of the Catskills — Brown's, Grossinger's,
      the Concord — who keep the resorts running, the thaw-rooms cold,
      and the Borscht-Belt liturgy of Saint Henny in repertory.
    description: >-
      The association of the great Catskills hotels — Brown's, the
      Concord, Kutsher's, the Nevele, the Pines, Grossinger's — who keep
      the resorts and their cold reliquary racks running on a calendar
      fifteen centuries deep. The hotels are where the Sleepers thaw, on
      schedule, and the Guild has made an institution of the
      bewilderment: a tummler at every cold-room door, a card-room and a
      dining-room and a stage, and Saint Henny's punchlines kept in
      nightly repertory as both entertainment and rite. They work hand in
      glove with the Sleepers' Sodality, which advocates for the thawed
      the Guild profits from housing, and the two argue endlessly and
      affectionately over the bill. They want full bookings, kept
      schedules, the racks reliable, and a good closer for the late
      show.

  - name: The Tubman Trails Society
    disposition: neutral
    region: baltimore
    joinable: true
    # AWN Plan 7 Enclave retrofit hook — Cryptic-Alliance tag (v1 content only).
    chargen_tie:
      starting_item: trail_token
      opening_reaction: >-
        Station-keepers from the Eastern Shore to Philadelphia read the
        token and open the safe houses, the routes, and the network's
        long memory to you. Slavers' heirs and toll-takers read it and
        find you suddenly hard to follow.
    summary: >-
      The route-keepers of the old Underground Railroad lines from the
      Maryland Eastern Shore through Philadelphia — a network that moves
      people the Corridor would rather not see moved.
    description: >-
      The society that keeps the old conductor-routes alive from the
      Maryland Eastern Shore up through Philadelphia — the safe houses,
      the signs, the river crossings, and the institutional memory of how
      to move a person past anyone who wants them stopped. Founded on the
      real Underground Railroad lines that Harriet Tubman ran out of
      Dorchester County, the Society has outlasted the thing it was built
      to defeat and turned the craft to whoever needs passage now:
      Sleepers fleeing a hostile parish, Wild Mutants the Magisterium has
      not gotten to, marks fleeing a Patroon's indenture. They are quiet,
      disciplined, and trusted by everyone who has ever needed them. They
      want their routes open, their station-keepers safe, and the
      Corridor's toll-takers none the wiser.

  - name: The Cabrini Missionary Sisters
    disposition: neutral
    region: outer_boroughs
    joinable: false
    summary: >-
      Mother Cabrini's order, still founding hospitals, schools, and
      orphanages the length of the Corridor — the Magisterium's hands in
      the immigrant parishes.
    description: >-
      The missionary order descended from Mother Frances Xavier Cabrini,
      who never stopped doing the work she was founded for: planting
      hospitals, schools, orphanages, and clinics through the immigrant
      parishes the length of the Corridor, from the Italian Bronx to
      Inwood to Federal Hill. Where the Magisterium governs and the
      Whitman Circle remembers, the Cabrini Sisters build and tend, and
      their institutions are the one Church presence the Atwells Avenue
      Society, the Stevedores, and the Nuyorican parishes all trust
      without reservation. They keep a studied distance from the Corridor's
      faction politics and a great deal of practical leverage because of
      it — a parish will defy its bishop before it crosses the Sister who
      runs its hospital. They want the work funded, the institutions
      staffed, and the poor of every mark and stock looked after,
      doctrine be damned.
