# The Seaboard of Saints — world items (story 103-2: the Sleeper implant lane).
#
# `implants` are System-Strain item sources (build plan §D-B; AWN rebase
# addendum): using one charges its `strain_cost` through the SAME strain
# pool AWN cyberware and stims spend — no parallel implant economy. The
# five entries are the spec implants (world design §13 via the addendum);
# install/uninstall mid-game stays narrative-only in v1.

world: seaboard_of_saints
genre: mutant_wasteland

implants:
  - id: subdermal_weave
    name: Subdermal Weave
    description: >-
      A mesh of Ancient filament grown under the skin. Brace it and blades
      skate; the weave pulls warmth and water from the body to knit itself.
    strain_cost: 1

  - id: cortex_booster
    name: Cortex Booster
    description: >-
      A cold sliver behind the left ear. Thought runs faster while it
      burns — and it burns the body's budget, not the mind's.
    strain_cost: 2

  - id: optic_suite
    name: Optic Suite
    description: >-
      Lenses etched by the Ancients: dark becomes dusk, far becomes near.
      The eyes water for hours after, and something behind them aches.
    strain_cost: 1

  - id: dermal_vox
    name: Dermal Vox
    description: >-
      A voice-box of printed cartilage in the throat. It can whisper on
      the old frequencies the relay towers still carry, and it hums
      against the pulse while it transmits.
    strain_cost: 1

  - id: blood_filter
    name: Blood-Filter
    description: >-
      A coiled organ riding the liver, older than any shrine on the
      coast. It eats poison, rot, and bad water — slowly, and it sends
      the bill to the body that hosts it.
    strain_cost: 2

# Cryptic-Alliance faction tokens (story 103-7). Each is the starting
# equipment-slot grant for a `joinable: true` faction's chargen tie (see
# lore.yaml `chargen_tie.starting_item`). The char_creation.yaml
# `cryptic_alliance` scene hands one to a tied PC via item_hint; the token
# in inventory is the signal the narrator reads to color that faction's
# opening NPC reactions. AWN Plan 7 Enclave retrofit hook — v1 content only.
named_items:
  - id: magisterium_letter
    name: A Magisterium Letter of Introduction
    description: >-
      A folded letter on parish stock, sealed with the Plenary Council's
      device and a vicar's signature, naming you as a person in good
      standing whom the Church commends to the courtesy of every see from
      Penobscot to the Potomac. It opens doors and attaches errands.
    category: document
    tags: [faction_token, magisterium]

  - id: athenaeum_borrowers_card
    name: An Athenaeum Borrower's Card
    description: >-
      A worn card from the Providence Athenaeum, countersigned by the
      Sisters of the Whitman Circle, granting stack privileges in every
      house they keep — and the standing obligation to bring back more
      than you take out.
    category: document
    tags: [faction_token, whitman_circle]

  - id: saturday_club_card
    name: A Saturday Club Card
    description: >-
      An engraved card admitting the bearer to the lower rooms of the
      Somerset Club and the Saturday Club's table — old-blood Boston's
      sign that you are useful to them, which is not the same as welcome
      among them.
    category: document
    tags: [faction_token, brahmin]

  - id: loin_playbill
    name: A Lo'in Playbill
    description: >-
      A hand-set playbill listing you in the company — a castmember's
      credential among the mutant performers, good for a part, a bed
      backstage, and a fellow Lo'in's scheming to take your role.
    category: document
    tags: [faction_token, loin]

  - id: sodality_coupon_book
    name: A Sodality Coupon Book
    description: >-
      A fat book of pre-war retail coupons stamped by the Sleepers'
      Sodality, honored at the famous coupon desk and proof of membership
      in the thawed mutual-aid confraternity — and a claim on its
      legal-aid roster when a parish gets ideas about Sleeper standing.
    category: document
    tags: [faction_token, sleepers_sodality]

  - id: patroon_indenture
    name: A Patroon House Indenture
    description: >-
      A manorial indenture in an old Dutch hand, binding you to a Hudson
      Valley House's household — a place at the lower table, the
      protection of the manor, and a debt measured in service that the
      Anti-Rent men would tell you never to have signed.
    category: document
    tags: [faction_token, patroon]

  - id: sternmens_lay_token
    name: A Sternmen's Lay Token
    description: >-
      A drilled brass disc stamped with a pound-keeper's mark, entitling
      the bearer to a hand's lay — a fractional share of the season's
      catch — and a berth in the Down East guilds. Worthless inland and
      unmistakable on the water.
    category: token
    tags: [faction_token, sternmen]

  - id: atwells_avenue_marker
    name: An Atwells Avenue Marker
    description: >-
      A plain bone button passed by hand on Federal Hill — no words on
      it, and none needed. To those who know it, it names you a friend of
      friends, owed the Society's warmth and held to the Society's
      expectations.
    category: token
    tags: [faction_token, atwells_avenue]

  - id: stevedores_button
    name: A Stevedores' Union Button
    description: >-
      A longshoreman's local button from Red Hook, the kind that gets a
      man a hook at the shape-up — work, standing on the pier, and a
      share of the quiet second trade that comes off a manifest before
      it's counted.
    category: token
    tags: [faction_token, red_hook]

  - id: trail_token
    name: A Conductor's Trail Token
    description: >-
      A small carved token in the old station-keepers' pattern, known
      from the Maryland Eastern Shore to Philadelphia. Shown at the right
      door it opens the safe houses, the routes, and the Tubman Trails
      Society's long memory of how to move a person past anyone watching.
    category: token
    tags: [faction_token, tubman_trails]
