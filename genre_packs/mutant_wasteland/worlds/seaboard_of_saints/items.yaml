# The Seaboard of Saints — world items (story 103-2: the Sleeper implant lane).
#
# `implants` are System-Strain item sources (build plan §D-B; AWN rebase
# addendum): using one charges its `strain_cost` through the SAME strain
# pool AWN cyberware and stims spend — no parallel implant economy. The
# five entries are the spec implants (world design §13 via the addendum);
# install/uninstall mid-game stays narrative-only in v1.

world: seaboard_of_saints
genre: mutant_wasteland

implants:
  - id: subdermal_weave
    name: Subdermal Weave
    description: >-
      A mesh of Ancient filament grown under the skin. Brace it and blades
      skate; the weave pulls warmth and water from the body to knit itself.
    strain_cost: 1

  - id: cortex_booster
    name: Cortex Booster
    description: >-
      A cold sliver behind the left ear. Thought runs faster while it
      burns — and it burns the body's budget, not the mind's.
    strain_cost: 2

  - id: optic_suite
    name: Optic Suite
    description: >-
      Lenses etched by the Ancients: dark becomes dusk, far becomes near.
      The eyes water for hours after, and something behind them aches.
    strain_cost: 1

  - id: dermal_vox
    name: Dermal Vox
    description: >-
      A voice-box of printed cartilage in the throat. It can whisper on
      the old frequencies the relay towers still carry, and it hums
      against the pulse while it transmits.
    strain_cost: 1

  - id: blood_filter
    name: Blood-Filter
    description: >-
      A coiled organ riding the liver, older than any shrine on the
      coast. It eats poison, rot, and bad water — slowly, and it sends
      the bill to the body that hosts it.
    strain_cost: 2
