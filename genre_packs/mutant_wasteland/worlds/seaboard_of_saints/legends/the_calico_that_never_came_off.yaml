name: The Calico That Never Came Off
summary: >-
  Up the Hudson the manor rents are still argued in the original paperwork,
  and the tenant farmers still answer the way they did in the Anti-Rent War
  of 1839 to 1845 — in calico disguise, tin dinner-horns passing the signal
  ridge to ridge, the distraint agent turned off the land without a blow in
  the old manner. The rebellion never properly closed; it survived, like
  everything on this coast, by being kept. The patroon rents survived it,
  and the apocalypse after it, and the calico survived both, cut down fresh
  in a barn loft before dawn every rent-day there has ever been since. When
  the Glory came the Patroon Houses read it as the land confirming its own
  tenure — each manor keeps a Saint of its preference, and a manor Saint's
  marks run truer the longer a bloodline has held the ground, which the
  Houses regard as proof and their tenants regard as a racket — but the
  water changed nothing about the standoff itself. A grant older than the
  Republic still has a clause the tenants read aloud at the gate, and the
  Houses still have houndsmen to close the coverts, and the question of what
  a Patroon may actually demand has been open, and armed, for as long as
  anyone keeps receipts. The register over all of it is faerie-feudal: the
  manors keep older bargains than the Church likes to name, and a Patroon's
  word in the dark of the Sleepy Hollow glen carries a weight no parish
  court will overrule, so papers are not carried through the glen after
  moonset by either side. Saint Washington of Sunnyside is venerated and
  feared in this country, because both sides understand the manor's whole
  title is a story, and a thing becomes true by being told well — which is
  why the bitterest rent-disputes end not in a courtroom but at a
  storytelling vigil, where a tale begun on one bank of the glen must be
  finished before the far one. The calico is already cut for next year.
era: "pre-Glory rebellion the canon never let close, live into the Present Day"
affected_cultures:
  - Hudson Valley Patroon
faction_grudges:
  - from: The Patroon Houses
    to: The Red Hook Stevedores
    reason: >-
      The Houses own the cargo that goes down the river to the drowned port
      and hold that the high-floor rents and licensed dives of the Sunken
      Bight owe the manor a tithe; the Stevedores work the hook downriver
      and concede the Houses nothing, and the border between manor water and
      dock water has never been agreed.
  - from: The Magisterium of the Seaboard
    to: The Patroon Houses
    reason: >-
      The Anti-Rent case has sat unresolved on the see's docket for
      centuries; the Magisterium, which would rather not choose between the
      manors and the free towns, keeps finding the case not yet ripe, and
      the Houses' unsettled bargains in the glen are older than the canon
      likes to name and outside any reading the church will commit to print.
lost_arts:
  - The full text of the oldest manor grants, whose original wording both
    sides cite and neither can produce entire; the strongboxes hold leaves
    the Glory and the damp have eaten, and the missing clauses are argued
    from memory, which on this coast is itself a kind of title.
  - Safe travel through the Sleepy Hollow glen after moonset — the road is
    still there, but the bargains kept in it are not the church's to govern,
    and no carrier of papers, tenant or Patroon, will use it in the dark;
    the knowledge of how to pass it safely, if it was ever held, is gone.
monuments:
  - Sunnyside's Stepped Gable — the Dutch-gabled manor in wisteria shade
    where Saint Washington is kept, the millpond and the Old Dutch burying
    ground below it; the bridge-crossing rite is walked here, and the
    storytelling vigils that settle the worst rent-disputes are held at the
    graveyard wall, a tale begun on one bank to be finished before the far.
  - The Calico in Evidence — folded bolts of the disguise-cloth filed at the
    see's court as exhibit in the Anti-Rent case, alongside the original
    paperwork; entered, re-entered, and never ruled on, the cloth is the
    rebellion's standing receipt that the manors can be fought, embarrassed,
    and billed, but somehow never abolished.
terrain_scars:
  - name: The Sleepy Hollow Glen
    region: hudson_valley
    type: cursed_ground
    description: >-
      The dark wooded hollow below the Tarry Town bridge and the Old Dutch
      church, deep in the faerie-feudal country where the Patroon Houses
      keep older bargains than the Church will name. The Horseman rides here
      on moonless nights — Saint Washington's vision read as fact in this
      valley — and a Patroon's word spoken in the glen binds where no parish
      court reaches. Neither tenant nor manor carries papers through it after
      moonset, by an agreement no one signed and everyone keeps.
  - name: The Rensselaerswijck Tenant-Lands
    region: hudson_valley
    type: ruin
    description: >-
      The mid-Hudson manor country of the senior House, water-meadow and
      hayfield and stone manor-house under brooding highlands, where the
      back-rents are posted and the calico is cut against them. The covert
      gates are watched by houndsmen; the tin horns answer over three ridges
      when a distraint is served; and a grant older than the Republic sits
      in a strongbox while both sides cite the same eaten clause. Rent-day
      reopens the war here, civilly and entirely in documents and disguises,
      every year it comes round.
