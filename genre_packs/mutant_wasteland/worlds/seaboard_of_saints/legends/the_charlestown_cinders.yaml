name: The Charlestown Cinders
summary: >-
  Long before the Glory, in 1834, a Protestant mob burned the Ursuline
  convent at Charlestown across the water from Boston, and the Seaboard has
  never let the fire go out — not the flames, which were put down in a
  night, but the grievance, which the Magisterium tends like a garden and
  will not allow to close. Fifteen centuries and a remade species later the
  Annunciation gave the wound a theology: the Brahmin Remnant, Boston's old
  Protestant ascendancy, reads the Glory as an examination the Catholics
  passed and the Protestants failed, and the burning is the debt their
  tradition incurred and cannot retire. So each August 11 the Saturday Club
  — the dinner circle descended from Emerson's table of 1855 — observes the
  anniversary with what it calls regret expressed in due form, and each
  August 12 the Magisterium accepts the regret, in due form, and nothing is
  concluded, by mutual and centuries-old agreement. The form is exquisite.
  The regret is real. The convent-ground at Charlestown is swept and dressed
  every year and mourned by both the people who set the fire and the church
  that lost the house, which is the most Seaboard arrangement imaginable: a
  grief kept deliberately unfinished, because some manuscripts, the Sisters
  of the Whitman Circle observe, are kept unfinished on purpose, and the
  difference is not semantic. The one word the Brahmin will spend without
  reservation is honest, offered across the table like an absolution no one
  at it has license to grant. To propose actually concluding the matter is,
  on Beacon Hill, a stranger act than the original crime — and it is
  proposed, quietly, by a younger Brahmin every few generations, to the
  silence of the elders.
era: "pre-Glory wound, kept as live grievance into the Present Day"
affected_cultures:
  - "Brahmin / Saturday-Club"
  - Federal Hill Italian
  - French-Canadian Lowell
faction_grudges:
  - from: The Magisterium of the Seaboard
    to: The Brahmin Remnant
    reason: >-
      The burning of the Ursuline convent is the Magisterium's one visible
      grievance, tended annually and never retired; the church accepts the
      Saturday Club's regret in due form every August 12 and pointedly
      declines, year on year, to declare the account settled.
  - from: The Brahmin Remnant
    to: The Atwells Avenue Society
    reason: >-
      The old Boston money has never forgiven Providence its Italian
      quarter's separate order, nor the way Federal Hill's arrangement with
      its parishes leaves Boston's reach short of the Shore Line; the
      Society, for its part, wants the Saturday Club's money kept on its own
      side of that line, and the two keep an exquisite, cold distance.
lost_arts:
  - The convent's pre-fire school records and the names of the girls taught
    there, which burned with the house in 1834; the Magisterium keeps the
    anniversary precisely because it could not keep the roll.
  - The actual concluding of a grievance, on Beacon Hill — the Brahmin have
    forgotten, if they ever knew, how to let a debt of honor end, and a
    gentleman who proposes it is met not with argument but with the silence
    reserved for a breach of form.
monuments:
  - The Convent-Ground at Charlestown — the swept and dressed site of the
    burned Ursuline house, mourned every August 11 by the Saturday Club and
    received every August 12 by a monsignor sent up from the southern see;
    nothing is built on it, by agreement, so that the absence remains the
    monument.
  - The Saturday Club's Plate at 42 Beacon Street — the dinner service laid
    each anniversary for a meal that resolves nothing, where the regret is
    drafted in a form unchanged in centuries and the word honest is spoken
    once across the table like a rite.
terrain_scars:
  - name: The Charlestown Burning-Ground
    region: boston_common
    type: cursed_ground
    description: >-
      The cleared rise across the harbor from Boston where the Ursuline
      convent stood until the mob took it. It is kept bare on purpose: swept
      grass, a few dressed stones, no building permitted. On the night of
      August 11 candles are set along it by hands from both traditions, and
      the half-drowned harbor islands beyond catch the light. Penitents who
      come to embroider their faults gorgeously and wear them through town,
      in the manner of Saint Hester's rite, keep their vigil here first.
  - name: The Somerset Club Block
    region: boston_common
    type: ruin
    description: >-
      The Beacon Hill street of red-brick bowfront houses where the Brahmin
      Remnant keeps its clubs and its long memory, gas-amber windows over
      elm shadow and a green park sloping down. The Saturday Club's house
      stands here, its plate laid for the annual dinner; the strain of a
      tradition humble about a grade it did not pass shows in the carriage
      of the place, correct in every particular and warm in none.
