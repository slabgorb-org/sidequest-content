name: The Drowning of the Bight
summary: >-
  In the centuries after the Glory the sea came up the lower coast and did
  not go down again, and New York went under to the shoulders. The Seaboard
  does not call it a flood; it calls it the Drowning, and keeps no agreed
  date for it, because the records that would have fixed one were among the
  first things the water took. What is remembered is the shape of the loss:
  the avenues filling slow over a generation, the lamps in the high floors
  going out street by street as the families above climbed higher or rowed
  away north, and the great robed colossus in the harbor settling until the
  tide stood at her collarbone — and her torch, hardened against the Shake
  by some pre-war prudence no one can document, still burning. The Red Hook
  ground, raised on its old fill, stood high enough to keep its feet, and
  the longshoremen who rode out the water became the people who decide what
  comes off a manifest in the Sunken Bight to this day. The Magisterium,
  consolidating in the same centuries, declined to mourn the city as dead:
  its upper floors were lively, rent in the high stories paid in quarters,
  and a drowned saint who keeps her lamp lit is, by the canon's reading, not
  a ruin but a working light. Saint Manhattan is venerated as the tall one
  who walks the flooded avenues and will not sleep, and her people sleep in
  shifts so the city that cannot be is never entirely unwatched. The one
  thing the Drowning settled for good is denominational: rent above the
  tideline is reckoned in quarters, a roll of them a serious transaction,
  because the water made every dry floor worth counting by hand.
era: "the first centuries after the Glory, during the Consolidation"
affected_cultures:
  - Bensonhurst Italian
  - Inwood Dominican
  - Spanish Harlem Nuyorican
faction_grudges:
  - from: The Red Hook Stevedores
    to: The Patroon Houses
    reason: >-
      The Houses own the cargo that comes down the Hudson into the drowned
      port, and have argued since the water rose that the high-floor rents
      and the licensed dives of the Sunken Bight are theirs to tithe; the
      Stevedores hold that the hook and the drowned cellars are the river's
      to keep and theirs to work, and the border has been hard ever since.
  - from: The Red Hook Stevedores
    to: The Smithsonian Reliquary Order
    reason: >-
      Reliquary authenticators claim the Ancients' machines lifted from the
      flooded lower floors as national collection the moment they surface;
      the divers the Stevedores license hold that a thing the water took and
      a diver brought up is salvage, not exhibit, and certify their own.
lost_arts:
  - The pre-war records that would have dated the Drowning — tide-logs,
    harbor charts, the city's own clocks — went under in the first floors
    to flood, which is why the Seaboard keeps the loss but not its year.
  - The skill of working the deepest drowned floors, where the licensed
    divers of the Sunken Bight no longer go; the old dive-charts naming
    which cellars hold air and which hold only water are read now as relics,
    not as instructions, and a diver who trusts one is held to be a fool.
monuments:
  - The Torch of the Colossus — the raised arm of the robed statue standing
    drowned to the collarbone in the harbor, her flame kept burning as a
    working lighthouse; on the Blackout Vigil of November 9 the Sunken
    Bight puts out its own lamps and leaves only her light over the water.
  - The Red Hook High Line — the band of elevated fill and old wharf-houses
    that stood above the flood, where the Stevedores run the shape-up and
    the hiring hook; standing here is a union button and a reputation for
    keeping your mouth shut, and the river keeps the rest of the records.
terrain_scars:
  - name: The Sunken Bight
    region: sunken_bight
    type: ruin
    description: >-
      The half-drowned vertical city, brackish blue-green tide running
      through the flooded avenues, the lower floors clad in shellfish reef
      and weed and the upper floors lively and lamp-lit. Boats thread the
      streets; rent in the high stories is paid in quarters; and licensed
      divers work the drowned cellars the Stevedores allow them, never the
      deep ones. Saint Manhattan's marked sleep in shifts so the city is
      never wholly unwatched, and the steam-vents that still breathe are
      read at dawn as oracles by those who hold the water answers questions.
  - name: The Drowned Lower Floors
    region: sunken_bight
    type: cursed_ground
    description: >-
      The deepest flooded levels beneath the Bight, where the dive-charts
      no longer hold and no diver the Stevedores license will go. The cold
      runs black and the reef has closed over the old doorways; divers who
      have gone down and come back speak of rooms that hold air they did not
      expect and rooms that hold none where the chart promised both, and of
      a current that pulls toward the center on a tide no almanac predicts.
      The Stevedores price a charter to the edge of it and refuse one past.
