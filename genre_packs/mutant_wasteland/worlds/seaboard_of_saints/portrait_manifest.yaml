# Portrait manifest — The Seaboard of Saints.
#
# Two casts:
#   1. SAINT ICONS (25) — the devotional images of the Saint canon
#      (saints.yaml). These are venerated *images*, not encounter portraits:
#      render register is American Catholic devotional folk art — the
#      saint-card, the gilt icon, the votive holy-card — frontal or
#      three-quarter, gold-leaf ground, the saint's attributes legible as
#      iconography. Each `appearance` is taken from the saint's authored
#      `iconography` field (the canon's own description of the image).
#   2. FACTION FIGUREHEADS (6) — the representative office-holder face of
#      each of the six major cross-corridor factions (lore.yaml), for the
#      chargen faction-tie surface and first-contact framing. These are
#      living NPC portraits in the world's luminous-maritime register;
#      mutation is matter-of-fact, never horror.
#
# Schema: PortraitManifestEntry (genre/models/pack.py) — extra fields are
# ignored by the loader, so `id` / `register` are flavor only. `type` is a
# free string. The render + R2 sync of these portraits is a SEPARATE operator
# step; until rendered, the world stays draft: true.

characters:

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — LITERARY CANON
  # ════════════════════════════════════════════════════════════════════

  - id: herman_of_the_acushnet
    name: Saint Herman of the Acushnet
    role: "Saint · literary canon · patron of the Whalecoast"
    type: saint_icon
    register: devotional icon, gilt holy-card, frontal
    appearance: >-
      A bearded man with a full dark beard and weathered sea-tanned face,
      half-length and facing forward in dark oilskins wound with coils of
      manila line. He holds a curved whale's jawbone worn as a yoke across his
      shoulders, a small leather ledger tucked at his belt.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "full dark beard, oilskins, manila line, whale-jawbone yoke, leather ledger at the belt"

  - id: henry_of_the_maine_woods
    name: Saint Henry of the Maine Woods
    role: "Saint · literary canon · patron of Down East"
    type: saint_icon
    register: devotional icon, gilt holy-card, three-quarter
    appearance: >-
      A lean man with a clean-shaven upper lip and bare cheeks, a fringe of
      neck-beard running under the jaw from ear to ear like a chin-curtain, no
      mustache. Half-length, facing forward in a plain homespun coat, a graphite
      pencil behind one ear, a coiled brass surveyor's chain at the hip, his
      fingers stained purple with huckleberry.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean upper lip, chin-curtain neck-beard, homespun coat, graphite pencil, surveyor's chain, huckleberry-stained fingers"

  - id: john_of_slabsides
    name: Saint John of Slabsides
    role: "Saint · literary canon · patron of the Adirondacks and Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card
    appearance: >-
      An elderly man with a long flowing white beard and kind weathered face,
      half-length and facing forward in a rough wool jacket. A small brown
      hermit thrush perches on his outstretched wrist; a worn leather notebook
      rests in his other hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "long white beard, rough wool jacket, hermit thrush on the wrist, leather notebook"

  - id: emily_of_amherst
    name: Saint Emily of Amherst
    role: "Saint · literary canon · patron of the Pioneer Valley"
    type: saint_icon
    register: devotional icon, white-on-white, restrained gilt
    appearance: >-
      A young woman with dark hair parted severely down the center and drawn
      back, a pale solemn face, in a plain high-necked white dress. Half-length
      and facing forward, she holds a small woven basket on a rope in one hand
      and a single pressed blue gentian flower in the other.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground, pale palette"
    element_visual: "young woman, dark center-parted hair, white dress, woven basket on a rope, pressed gentian flower"

  - id: washington_of_sunnyside
    name: Saint Washington of Sunnyside
    role: "Saint · literary canon · patron of the Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A stout older gentleman with a smooth clean-shaven jaw and grey
      side-whiskers down the cheeks, balding with grey hair, a round kind face.
      Half-length and facing forward in an early-19th-century black coat and
      cravat, holding an open book.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "smooth clean-shaven jaw, grey side-whiskers, open book, black cravat"

  - id: edgar_of_baltimore
    name: Saint Edgar of Baltimore
    role: "Saint · literary canon · patron of Baltimore and Providence"
    type: saint_icon
    register: devotional icon, dark ground, cold gilt
    appearance: >-
      A pale gaunt man with a long smooth bare chin and hollow clean-shaven
      cheeks, only a thin dark mustache on the upper lip, high broad forehead,
      dark swept-back hair, heavy-lidded melancholy grey eyes. Black coat and
      high black stock collar. A black raven perched on his shoulder. Dark
      ground, thin gold halo.
    culture_aesthetic: "frontal devotional holy card, dark ground, cold gilt"
    element_visual: "thin dark mustache, smooth clean-shaven jaw, black stock collar, black raven on the shoulder"

  - id: hester_of_the_letter
    name: Saint Hester of the Letter
    role: "Saint · literary canon · patron of Salem Country"
    type: saint_icon
    register: devotional icon, gilt, the letter as gold attribute
    appearance: >-
      A young woman with dark hair drawn back under a simple cap, a calm
      composed face, in a plain grey gown. Half-length and facing forward, on
      her breast a large ornately gold-embroidered letter "A", a single red wild
      rose pinned beside it, a threaded needle held mid-stitch in one hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "young woman, dark hair under a cap, grey gown, gold-embroidered letter A on the breast, red wild rose, threaded needle"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — CATHOLIC-IMMIGRANT CANON
  # ════════════════════════════════════════════════════════════════════

  - id: francis_of_hoboken
    name: Saint Francis of Hoboken
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs, Providence, Philadelphia"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A slight young clean-shaven man with a smooth bare chin and bright blue
      eyes, a snap-brim grey fedora tilted back on his head. Half-length and
      facing forward in a sharp dark suit with an orange pocket square, a
      raincoat slung over one shoulder.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "young clean-shaven man, blue eyes, grey fedora, dark suit, orange pocket square, raincoat over the shoulder"

  - id: eugene_of_new_london
    name: Saint Eugene of New London
    role: "Saint · catholic-immigrant canon · patron of Boston Common and Providence"
    type: saint_icon
    register: devotional icon, fog-grey ground, thin gilt
    appearance: >-
      A clean-shaven man with a smooth bare chin, dark hair, a gaunt
      intense face and dark deep-set eyes. Half-length and facing forward in a
      dark plain coat. Behind him four empty wooden chairs are turned to face
      apart from one another in soft grey fog.
    culture_aesthetic: "frontal devotional holy card, fog-grey ground, thin gilt"
    element_visual: "clean-shaven man, dark hair, gaunt intense face, plain dark coat, four chairs turned apart"

  - id: roberto_of_the_bridge
    name: Saint Roberto of the Bridge
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs, Sunken Bight, D.C."
    type: saint_icon
    register: devotional icon, gilt, motion frozen
    appearance: >-
      A clean-shaven athletic Latino man with short dark hair and a strong
      handsome face, in a cream baseball uniform with the number 21 across the
      back. Half-length and facing forward, a baseball gripped in his raised
      throwing hand, a leather glove on the other.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean-shaven Latino man, athletic, cream baseball uniform, number 21, baseball in the throwing hand, leather glove"

  - id: tito_of_spanish_harlem
    name: Saint Tito of Spanish Harlem
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs and Philadelphia"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A grinning clean-shaven Latino man with short dark hair, in a bright white
      suit. Half-length and facing forward behind a pair of chrome timbales, a
      drumstick raised in each hand mid-strike.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean-shaven Latino man, grinning, white suit, chrome timbales, raised drumsticks"

  - id: dorothy_of_the_bowery
    name: Saint Dorothy of the Bowery
    role: "Saint · catholic-immigrant canon · patron of the Sunken Bight, Outer Boroughs, Baltimore"
    type: saint_icon
    register: devotional icon, gilt, the kettle as quiet miracle
    appearance: >-
      An older woman with grey hair in a braid wound at the back, a plain
      austere lined face, a simple headscarf and a worn dark coat. Half-length
      and facing forward, holding a long-handled ladle over a large iron soup
      kettle, a wooden picket sign leaned at her side.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "older woman, grey braided hair, headscarf, worn coat, soup ladle, iron kettle, leaned picket sign"

  - id: francesca_of_the_heights
    name: Saint Francesca of the Heights
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs"
    type: saint_icon
    register: devotional icon, gilt, keys as attribute
    appearance: >-
      A small older woman in a black nun's habit and white wimple framing a
      gentle resolute face. Half-length and facing forward, holding up a heavy
      iron ring crowded with many keys in one hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "older woman, black nun's habit, white wimple, heavy iron ring of many keys"

  - id: jack_of_lowell
    name: Saint Jack of Lowell
    role: "Saint · catholic-immigrant canon · patron of the Merrimack Mills and Down East"
    type: saint_icon
    register: devotional icon, gilt, the scroll as attribute
    appearance: >-
      A young clean-shaven man with a smooth bare chin, tousled dark hair and a
      handsome rugged face, in an open red-and-black plaid flannel shirt.
      Half-length and facing forward, a canvas rucksack slung on one shoulder, a
      long unspooling roll of paper held in his hands.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "young clean-shaven man, tousled dark hair, plaid flannel shirt, canvas rucksack, unspooling paper scroll"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — FOLK-PLACE CANON
  # ════════════════════════════════════════════════════════════════════

  - id: plymouth
    name: Saint Plymouth
    role: "Saint · folk-place canon · patron of Plymouth Stone"
    type: saint_icon
    register: devotional icon, place-saint, austere gilt
    appearance: >-
      A solemn cloaked figure in plain pilgrim grey, half-length and facing
      forward, cradling a small grey boulder marked with a jagged toothed edge.
      On a shallow pewter plate held in the other hand sit five dried kernels of
      yellow corn; a white quill is tucked at the breast.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "cloaked pilgrim figure, grey toothed boulder, pewter plate, five corn kernels, white quill"

  - id: tisquantum
    name: Saint Tisquantum
    role: "Saint · folk-place canon · patron of Plymouth Stone"
    type: saint_icon
    register: devotional icon, gilt, between two shores
    appearance: >-
      A Native American man with smooth bare cheeks and no facial hair, long
      dark hair, a calm steady face, in period deerskin dress. Half-length and
      centered facing forward, holding a single silver herring in one hand and a
      seed-corn cornhill cradled in the other.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "Native American man, no facial hair, long dark hair, deerskin dress, silver herring, seed-corn mound"

  - id: manhattan
    name: Saint Manhattan
    role: "Saint · folk-place canon · patron of the Sunken Bight"
    type: saint_icon
    register: devotional icon, colossus, drowned-city gilt
    appearance: >-
      A stately woman with an upswept crown of dark hair and a serene face, in a
      flowing blue-grey robe wreathed with curling steam. Half-length and facing
      forward, she cradles a small model of a drowned tower-city in her hands,
      its tiny windows lit like candles.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "stately woman, upswept dark hair, blue-grey steam-wreathed robe, small lit tower-city held in the hands"

  - id: folly_of_the_cove
    name: Saint Folly of the Cove
    role: "Saint · folk-place canon · patron of Cape Ann"
    type: saint_icon
    register: linoleum block print on linen, two-color, NEVER painted
    appearance: >-
      A weathered fisherwoman with webbed hands and short windblown hair, a
      plain working face. Half-length and facing forward, holding a meshed seine
      net across her hands; a small white lighthouse emblem at her shoulder.
      Bold carved black line, flat two-color ink, visible block texture.
    culture_aesthetic: "linoleum block print on linen, bold carved line, flat two-color ink, frontal folk icon"
    element_visual: "fisherwoman, webbed hands, windblown hair, seine net, small lighthouse emblem, carved block-print line, flat ink"

  - id: rebecca_of_nurse
    name: Saint Rebecca of Nurse
    role: "Saint · folk-place canon · patron of Salem Country"
    type: saint_icon
    register: devotional icon, gilt, the petition as attribute
    appearance: >-
      An elderly woman with a deeply lined serene face under a plain white
      Puritan coif, in a dark grey Puritan gown. Half-length and facing forward,
      her hands bound together before her with cord, an unrolled signed petition
      scroll resting against her arm.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "elderly woman, white Puritan coif, grey gown, bound hands, signed petition scroll"

  - id: tubman_of_the_crossing
    name: Saint Tubman of the Crossing
    role: "Saint · folk-place canon · patron of Baltimore, Boston Common, Philadelphia"
    type: saint_icon
    register: devotional icon, night ground, lantern-gilt
    appearance: >-
      An older Black woman with a strong determined face, a patterned headscarf
      knotted over her hair and a heavy shawl. Half-length and facing forward
      against a dark night ground, holding up a glowing brass lantern in one
      hand, an army scout's pistol tucked at her belt.
    culture_aesthetic: "frontal devotional holy card, dark night ground, lantern-gilt"
    element_visual: "older Black woman, patterned headscarf, shawl, glowing brass lantern, army scout's pistol at the belt"

  - id: nikola_of_the_hotel
    name: Saint Nikola of the Hotel
    role: "Saint · folk-place canon · patron of the Sunken Bight"
    type: saint_icon
    register: devotional icon, gilt, electric nimbus
    appearance: >-
      A tall lean man with a smooth clean-shaven chin and bare cheeks, only a
      thin neat dark mustache on the upper lip, dark hair slicked straight back,
      a gaunt elegant face. Half-length and facing forward in a formal high-
      collared black coat, a white pigeon perched on his outstretched hand,
      crackling electric arcs forming a halo around his head.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground, electric nimbus"
    element_visual: "thin dark mustache, clean-shaven cheeks, slicked-back dark hair, formal black coat, white pigeon on the hand, electric-arc halo"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — WILDERNESS / SLEEPER CANON
  # ════════════════════════════════════════════════════════════════════

  - id: lizzie_of_the_cairn
    name: Saint Lizzie of the Cairn
    role: "Saint · wilderness/sleeper canon · patron of the White Mountains"
    type: saint_icon
    register: devotional icon, storm ground, warm-stone gilt
    appearance: >-
      A young Victorian woman with dark hair pinned up, a pale resolute face, in
      an 1850s long walking-dress stiff with frost. Half-length and facing
      forward against a scoured grey storm sky, her bare hands stacking a small
      cairn of warm amber-glowing stones.
    culture_aesthetic: "frontal devotional holy card, storm-grey ground, warm-stone gilt"
    element_visual: "young Victorian woman, dark upswept hair, frost-stiffened walking-dress, bare hands, cairn of amber-glowing stones"

  - id: rip_of_the_catskills
    name: Saint Rip of the Catskills
    role: "Saint · wilderness/sleeper canon · patron of the Catskills and Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt, the sleeper-saint
    appearance: >-
      A very old man with a long unkempt grey beard and a weathered sleeping
      face, eyes closed, in ragged worn colonial clothes, slumped against the
      trunk of an oak. Half-length and facing forward, a rusted old fowling-piece
      across his lap, an empty leather dog collar held loose in one hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf dusk ground"
    element_visual: "very old man, long grey beard, eyes closed asleep, ragged colonial clothes, rusted fowling-piece, empty dog collar"

  - id: henny_of_the_borscht
    name: Saint Henny of the Borscht
    role: "Saint · wilderness/sleeper canon · patron of the Catskills"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A clean-shaven older man with a smooth bare chin, short grey hair and a
      wide grin, in a black tuxedo and bow tie. Half-length and facing forward,
      a violin tucked under his chin and a bow in his raised hand, a small index
      card peeking from the breast pocket.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean-shaven older man, grey hair, grin, black tuxedo, bow tie, violin and bow, index card in the pocket"

  - id: crispin_of_the_mill
    name: Saint Crispin of the Mill
    role: "Saint · wilderness/sleeper canon · patron of the Merrimack Mills"
    type: saint_icon
    register: devotional icon, gilt, craft-saint
    appearance: >-
      A sturdy bearded craftsman with a short brown beard and a calm capable
      face, in a leather work apron over rolled sleeves. Half-length and facing
      forward, holding an iron shoemaker's last and an awl crossed over a
      wooden weaver's shuttle, a loaf of bread in one apron pocket and a rose in
      the other.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "bearded craftsman, short brown beard, leather work apron, shoemaker's last and awl crossed over a weaver's shuttle, bread and rose in the apron pockets"

  # ════════════════════════════════════════════════════════════════════
  # FACTION FIGUREHEADS — the six major cross-corridor factions
  # ════════════════════════════════════════════════════════════════════

  - id: faction_magisterium
    name: The Cardinal-Registrar of the Magisterium
    role: "Figurehead · the Magisterium of the Seaboard (New Catholic Plenary Council, keeper of the Saint Registry)"
    type: npc_major
    appearance: >-
      A clean-shaven cleric of late middle age with a smooth chin, a patient dry
      face and short grey hair. Half-length and facing forward in plain
      grey-and-oxblood vestments, a silver pectoral cross on the chest, a
      reading-glass on a ribbon at the neck. A faint second set of knuckles on
      the writing hand. He holds a large clasped leather-bound registry book
      against one arm.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean-shaven cleric, grey hair, grey-and-oxblood vestments, silver pectoral cross, reading-glass on a ribbon, clasped registry book, second set of knuckles on one hand"

  - id: faction_whitman_circle
    name: An Athenaeum Sister of the Whitman Circle
    role: "Figurehead · the Sisters of the Whitman Circle (bibliographic-Spiritualist order, Providence Athenaeum)"
    type: npc_major
    appearance: >-
      A woman with a pale exact scholarly face and dark hair drawn back, in a
      severe ink-dark reading-habit. Half-length and facing forward, a
      jeweller's loupe pushed up on her brow, her fingers stained dark with ink,
      a faint closed third eye marked at her hairline. She holds an old foxed
      folio open against one forearm.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "woman, dark hair drawn back, ink-dark reading-habit, jeweller's loupe on the brow, ink-stained fingers, open foxed folio, faint closed third eye at the hairline"

  - id: faction_brahmin_remnant
    name: A Patrician of the Brahmin Remnant
    role: "Figurehead · the Brahmin Remnant (old Protestant aristocracy, the Boston clubs)"
    type: npc_major
    appearance: >-
      An elderly aristocrat with a pale long-boned haughty face, white hair and
      faint translucent skin at the temples, clean-shaven but for trim white
      side-whiskers. Half-length and facing forward in an immaculately kept
      old-fashioned black frock-coat and high stiff collar, a heavy signet ring
      on one overlong patrician finger.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "elderly aristocrat, white hair, white side-whiskers, translucent temples, black frock-coat, high collar, signet ring, overlong fingers"

  - id: faction_loin
    name: A Player of the Lo'in
    role: "Figurehead · the Lo'in (mutant performers; saints are roles, not rewards)"
    type: npc_major
    appearance: >-
      A mutant stage performer with a lively expressive face, grease-paint half
      applied across the cheeks. Half-length and facing forward in a patched
      multicolored motley costume, an extra second pair of arms spread in
      theatrical gesture, a halo of bent brass wire held up over the head.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "stage performer, half-applied grease-paint, patched multicolored motley, a second pair of arms, bent-brass property halo"

  - id: faction_sleepers_sodality
    name: A Thawed Elder of the Sleepers' Sodality
    role: "Figurehead · the Sleepers' Sodality (thawed pre-war sleepers, Brown's Hotel, the Catskills)"
    type: npc_major
    appearance: >-
      An older retiree with a pleasant faintly bewildered clean-shaven face,
      thinning grey hair and reading-glasses. Half-length and facing forward in
      a soft buttoned cardigan over a collared shirt, a small enamel hotel pin
      on the lapel, a folded paper schedule held in one hand, faint frost rimed
      at his cuffs.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "older retiree, thinning grey hair, reading-glasses, soft cardigan, enamel lapel pin, folded paper schedule, faint frost at the cuffs"

  - id: faction_patroon_houses
    name: A Lord of the Patroon Houses
    role: "Figurehead · the Patroon Houses (feudal-pastoral manor-states of the Hudson Valley)"
    type: npc_major
    appearance: >-
      A broad weather-beaten manor-lord with a calm proprietary face, short
      grey-brown hair and trimmed whiskers, a pale horn-coloured ridge of tissue
      circling his brow like a low grown coronet. Half-length and facing forward
      in good worn Dutch-cut riding wool, both hands resting on a brass-headed
      wooden staff.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "broad manor-lord, grey-brown hair, trimmed whiskers, horn-coloured coronet-ridge at the brow, Dutch-cut riding wool, brass-headed staff"
