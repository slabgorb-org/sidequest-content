# Portrait manifest — The Seaboard of Saints.
#
# Two casts:
#   1. SAINT ICONS (25) — the devotional images of the Saint canon
#      (saints.yaml). These are venerated *images*, not encounter portraits:
#      render register is American Catholic devotional folk art — the
#      saint-card, the gilt icon, the votive holy-card — frontal or
#      three-quarter, gold-leaf ground, the saint's attributes legible as
#      iconography. Each `appearance` is taken from the saint's authored
#      `iconography` field (the canon's own description of the image).
#   2. FACTION FIGUREHEADS (6) — the representative office-holder face of
#      each of the six major cross-corridor factions (lore.yaml), for the
#      chargen faction-tie surface and first-contact framing. These are
#      living NPC portraits in the world's luminous-maritime register;
#      mutation is matter-of-fact, never horror.
#
# Schema: PortraitManifestEntry (genre/models/pack.py) — extra fields are
# ignored by the loader, so `id` / `register` are flavor only. `type` is a
# free string. The render + R2 sync of these portraits is a SEPARATE operator
# step; until rendered, the world stays draft: true.

characters:

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — LITERARY CANON
  # ════════════════════════════════════════════════════════════════════

  - id: herman_of_the_acushnet
    name: Saint Herman of the Acushnet
    role: "Saint · literary canon · patron of the Whalecoast"
    type: saint_icon
    register: devotional icon, gilt holy-card, frontal
    appearance: >-
      A bearded man with a full dark beard and weathered sea-tanned face,
      half-length and facing forward in dark oilskins wound with coils of
      manila line. He holds a curved whale's jawbone worn as a yoke across his
      shoulders, a small leather ledger tucked at his belt.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "full dark beard, oilskins, manila line, whale-jawbone yoke, leather ledger at the belt"

  - id: henry_of_the_maine_woods
    name: Saint Henry of the Maine Woods
    role: "Saint · literary canon · patron of Down East"
    type: saint_icon
    register: devotional icon, gilt holy-card, three-quarter
    appearance: >-
      A lean man with a clean-shaven upper lip and bare cheeks, a fringe of
      neck-beard running under the jaw from ear to ear like a chin-curtain, no
      mustache. Half-length, facing forward in a plain homespun coat, a graphite
      pencil behind one ear, a coiled brass surveyor's chain at the hip, his
      fingers stained purple with huckleberry.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "clean upper lip, chin-curtain neck-beard, homespun coat, graphite pencil, surveyor's chain, huckleberry-stained fingers"

  - id: john_of_slabsides
    name: Saint John of Slabsides
    role: "Saint · literary canon · patron of the Adirondacks and Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card
    appearance: >-
      An elderly man with a long flowing white beard and kind weathered face,
      half-length and facing forward in a rough wool jacket. A small brown
      hermit thrush perches on his outstretched wrist; a worn leather notebook
      rests in his other hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "long white beard, rough wool jacket, hermit thrush on the wrist, leather notebook"

  - id: emily_of_amherst
    name: Saint Emily of Amherst
    role: "Saint · literary canon · patron of the Pioneer Valley"
    type: saint_icon
    register: devotional icon, white-on-white, restrained gilt
    appearance: >-
      A young woman with dark hair parted severely down the center and drawn
      back, a pale solemn face, in a plain high-necked white dress. Half-length
      and facing forward, she holds a small woven basket on a rope in one hand
      and a single pressed blue gentian flower in the other.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground, pale palette"
    element_visual: "young woman, dark center-parted hair, white dress, woven basket on a rope, pressed gentian flower"

  - id: washington_of_sunnyside
    name: Saint Washington of Sunnyside
    role: "Saint · literary canon · patron of the Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A stout older gentleman with a smooth clean-shaven jaw and grey
      side-whiskers down the cheeks, balding with grey hair, a round kind face.
      Half-length and facing forward in an early-19th-century black coat and
      cravat, holding an open book.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "smooth clean-shaven jaw, grey side-whiskers, open book, black cravat"

  - id: edgar_of_baltimore
    name: Saint Edgar of Baltimore
    role: "Saint · literary canon · patron of Baltimore and Providence"
    type: saint_icon
    register: devotional icon, dark ground, cold gilt
    appearance: >-
      A pale gaunt man with a long smooth bare chin and hollow clean-shaven
      cheeks, only a thin dark mustache on the upper lip, high broad forehead,
      dark swept-back hair, heavy-lidded melancholy grey eyes. Black coat and
      high black stock collar. A black raven perched on his shoulder. Dark
      ground, thin gold halo.
    culture_aesthetic: "frontal devotional holy card, dark ground, cold gilt"
    element_visual: "thin dark mustache, smooth clean-shaven jaw, black stock collar, black raven on the shoulder"

  - id: hester_of_the_letter
    name: Saint Hester of the Letter
    role: "Saint · literary canon · patron of Salem Country"
    type: saint_icon
    register: devotional icon, gilt, the letter as gold attribute
    appearance: >-
      A young woman with dark hair drawn back under a simple cap, a calm
      composed face, in a plain grey gown. Half-length and facing forward, on
      her breast a large ornately gold-embroidered letter "A", a single red wild
      rose pinned beside it, a threaded needle held mid-stitch in one hand.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "young woman, dark hair under a cap, grey gown, gold-embroidered letter A on the breast, red wild rose, threaded needle"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — CATHOLIC-IMMIGRANT CANON
  # ════════════════════════════════════════════════════════════════════

  - id: francis_of_hoboken
    name: Saint Francis of Hoboken
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs, Providence, Philadelphia"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A slight young clean-shaven man with a smooth bare chin and bright blue
      eyes, a snap-brim grey fedora tilted back on his head. Half-length and
      facing forward in a sharp dark suit with an orange pocket square, a
      raincoat slung over one shoulder.
    culture_aesthetic: "frontal devotional holy card, warm gold-leaf ground"
    element_visual: "young clean-shaven man, blue eyes, grey fedora, dark suit, orange pocket square, raincoat over the shoulder"

  - id: eugene_of_new_london
    name: Saint Eugene of New London
    role: "Saint · catholic-immigrant canon · patron of Boston Common and Providence"
    type: saint_icon
    register: devotional icon, fog-grey ground, thin gilt
    appearance: >-
      A clean-shaven man with a smooth bare chin, dark hair, a gaunt
      intense face and dark deep-set eyes. Half-length and facing forward in a
