# Portrait manifest — The Seaboard of Saints.
#
# Two casts:
#   1. SAINT ICONS (25) — the devotional images of the Saint canon
#      (saints.yaml). These are venerated *images*, not encounter portraits:
#      render register is American Catholic devotional folk art — the
#      saint-card, the gilt icon, the votive holy-card — frontal or
#      three-quarter, gold-leaf ground, the saint's attributes legible as
#      iconography. Each `appearance` is taken from the saint's authored
#      `iconography` field (the canon's own description of the image).
#   2. FACTION FIGUREHEADS (6) — the representative office-holder face of
#      each of the six major cross-corridor factions (lore.yaml), for the
#      chargen faction-tie surface and first-contact framing. These are
#      living NPC portraits in the world's luminous-maritime register;
#      mutation is matter-of-fact, never horror.
#
# Schema: PortraitManifestEntry (genre/models/pack.py) — extra fields are
# ignored by the loader, so `id` / `register` are flavor only. `type` is a
# free string. The render + R2 sync of these portraits is a SEPARATE operator
# step; until rendered, the world stays draft: true.

characters:

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — LITERARY CANON
  # ════════════════════════════════════════════════════════════════════

  - id: herman_of_the_acushnet
    name: Saint Herman of the Acushnet
    role: "Saint · literary canon · patron of the Whalecoast"
    type: saint_icon
    register: devotional icon, gilt holy-card, frontal
    appearance: >-
      A pilgrim in oilskins lashed about with manila line, one hand on a
      whale's jawbone worn as a reliquary yoke, ledger of lays tucked at the
      belt; behind him the preserved Acushnet rides at anchor. Rendered as a
      devotional saint-card: gold-leaf ground, the jawbone and the ship
      legible as attributes, a faint halo of try-works light.
    culture_aesthetic: >-
      New Catholic devotional folk art — the whaler-saint of New Bedford,
      his attributes the bone and the ledger of shares.
    element_visual: "whale-jawbone yoke, manila line, ledger of lays, the Acushnet at anchor"

  - id: henry_of_the_maine_woods
    name: Saint Henry of the Maine Woods
    role: "Saint · literary canon · patron of Down East"
    type: saint_icon
    register: devotional icon, gilt holy-card, three-quarter
    appearance: >-
      A lean surveyor in a homespun coat, a pencil of his own family's
      graphite behind one ear, surveyor's chain coiled at the hip and
      huckleberry-stained fingers; behind him Ktaadn's tableland stands in
      cloud, and he is looking at it instead of at you. Gold-leaf ground,
      the mountain rendered as a holy attribute behind the figure.
    culture_aesthetic: >-
      Devotional saint-card of the surveyor-hermit; the wilderness itself is
      his reliquary.
    element_visual: "graphite pencil, surveyor's chain, huckleberry-stained hands, Ktaadn in cloud"

  - id: john_of_slabsides
    name: Saint John of Slabsides
    role: "Saint · literary canon · patron of the Adirondacks and Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card
    appearance: >-
      A white-bearded man on the porch of a bark-sided cabin above a celery
      swamp, a hermit thrush perched on his wrist mid-phrase; his boots are
      off and his notebooks are full. Devotional register, the thrush haloed,
      the cabin a small gold-edged hermitage behind him.
    culture_aesthetic: "Devotional saint-card of the naturalist-hermit, the thrush his evangelist's symbol."
    element_visual: "hermit thrush on the wrist, bark-sided cabin, full notebooks, bare feet"

  - id: emily_of_amherst
    name: Saint Emily of Amherst
    role: "Saint · literary canon · patron of the Pioneer Valley"
    type: saint_icon
    register: devotional icon, white-on-white, restrained gilt
    appearance: >-
      A small woman in white at an upstairs window, lowering a basket of
      gingerbread on a rope to children she will not come down to meet; on the
      sill, a pressed gentian and a writing table seventeen and one-half inches
      square. The palette is almost entirely white and pale, the gilt held to
      a thin halo — a saint of reticence.
    culture_aesthetic: "Devotional card of the recluse-poet; the white dress is the habit, the window the cell."
    element_visual: "white dress, basket on a rope, pressed gentian, the small square writing table"

  - id: washington_of_sunnyside
    name: Saint Washington of Sunnyside
    role: "Saint · literary canon · patron of the Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A stout gentleman asleep in wisteria shade against the stepped Dutch
      gable of Sunnyside, ink not yet dry on the page in his lap; across the
      millpond a rider holds a jack-o'-lantern at arm's length, waiting
      politely for him to wake. Warm gold-leaf dusk, the storyteller haloed
      mid-sleep — first of the Four Voices.
    culture_aesthetic: >-
      Devotional card of the storyteller-saint; New Catholic doctrine seats
      him first of the Four Voices (the storyteller).
    element_visual: "Dutch stepped gable, wisteria, wet ink page, the headless rider's lantern across the millpond"

  - id: edgar_of_baltimore
    name: Saint Edgar of Baltimore
    role: "Saint · literary canon · patron of Baltimore and Providence"
    type: saint_icon
    register: devotional icon, dark ground, cold gilt
    appearance: >-
      A gaunt man in a high black stock collar at a rain-dark grave, a raven
      at the shoulder, one candle behind smoked glass; his eyes carry the
      bruised look of a man who reads after midnight on purpose. The darkest
      saint-card in the canon — gilt reduced to the candle and a thin nimbus.
    culture_aesthetic: "Devotional card of the midnight-saint; the raven is his attribute, the grave his altar."
    element_visual: "black stock collar, raven at the shoulder, candle behind smoked glass, rain-dark headstone"

  - id: hester_of_the_letter
    name: Saint Hester of the Letter
    role: "Saint · literary canon · patron of Salem Country"
    type: saint_icon
    register: devotional icon, gilt, the letter as gold attribute
    appearance: >-
      A gray-gowned woman whose gold-embroidered letter outshines the shame it
      was cut for, a wild rose from the prison door worn at the breast, needle
      mid-stitch; she has made the badge beautiful, which was not what the
      magistrates intended. The embroidered letter is the brightest gold in
      the image.
    culture_aesthetic: "Devotional card of the seamstress-saint; the punitive badge reclaimed as the halo's equal."
    element_visual: "gold-embroidered letter, gray gown, wild rose at the breast, needle mid-stitch"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — CATHOLIC-IMMIGRANT CANON
  # ════════════════════════════════════════════════════════════════════

  - id: francis_of_hoboken
    name: Saint Francis of Hoboken
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs, Providence, Philadelphia"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A slight man under a streetlamp with a raincoat over one shoulder, an
      orange pocket square, eyes an improbable ring-a-ding blue; behind him the
      Hoboken ferry slips and a band shell with the chairs still warm. Warm
      streetlamp gold for a halo — the singer, second of the Four Voices.
    culture_aesthetic: >-
      Devotional card of the crooner-saint; doctrine seats him second of the
      Four Voices (the singer).
    element_visual: "raincoat over the shoulder, orange pocket square, streetlamp halo, the Hoboken ferry and warm band shell"

  - id: eugene_of_new_london
    name: Saint Eugene of New London
    role: "Saint · catholic-immigrant canon · patron of Boston Common and Providence"
    type: saint_icon
    register: devotional icon, fog-grey ground, thin gilt
    appearance: >-
      The Monte Cristo Cottage in fog, and on its porch a man thin as a held
      breath, four chairs behind him arranged to face away from one another;
      out on the Thames the foghorn sounds the interval it always sounds. A
      saint-card of estrangement — the gilt barely cuts the fog.
    culture_aesthetic: "Devotional card of the playwright-saint; the four turned-away chairs are his passion."
    element_visual: "fogbound cottage porch, four chairs facing apart, the river and the foghorn"

  - id: roberto_of_the_bridge
    name: Saint Roberto of the Bridge
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs, Sunken Bight, D.C."
    type: saint_icon
    register: devotional icon, gilt, motion frozen
    appearance: >-
      A right fielder mid-throw from the warning track, number 21, the arm like
      judgment arriving; below the span behind him, a low plane over dark water
      with relief crates lashed in the hold. A saint-card of the perfect throw
      and the last flight — gold-leaf ground, the number 21 haloed.
    culture_aesthetic: "Devotional card of the ballplayer-saint; the number 21 and the relief plane are his attributes."
    element_visual: "number 21, right-fielder's throw, the bridge span, a low relief plane over dark water"

  - id: tito_of_spanish_harlem
    name: Saint Tito of Spanish Harlem
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs and Philadelphia"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A grinning man in a white suit behind timbales, sticks blurred to smoke;
      behind him the Palladium Ballroom on a Wednesday night, every dancer
      caught mid-step on his accent. Bright, joyous gilt — the drummer, third
      of the Four Voices.
    culture_aesthetic: >-
      Devotional card of the timbalero-saint; doctrine seats him third of the
      Four Voices (the drummer).
    element_visual: "white suit, timbales, sticks blurred to smoke, the Palladium dancers mid-step"

  - id: dorothy_of_the_bowery
    name: Saint Dorothy of the Bowery
    role: "Saint · catholic-immigrant canon · patron of the Sunken Bight, Outer Boroughs, Baltimore"
    type: saint_icon
    register: devotional icon, gilt, the kettle as quiet miracle
    appearance: >-
      A gray-braided woman in a donated coat ladling at a soup line, a picket
      sign leaned against the kettle; folded in her apron, the masthead of a
      penny paper. The soup-kettle catches a low gold light — the line's
      never-quite-empty pot, which the Magisterium has thrice declined to rule
      a miracle, on the grounds that the hungry were fed either way.
    culture_aesthetic: "Devotional card of the worker-saint; the ladle and the picket sign are her attributes."
    element_visual: "donated coat, soup ladle and kettle, leaned picket sign, penny-paper masthead in the apron"

  - id: francesca_of_the_heights
    name: Saint Francesca of the Heights
    role: "Saint · catholic-immigrant canon · patron of the Outer Boroughs"
    type: saint_icon
    register: devotional icon, gilt, keys as attribute
    appearance: >-
      A very small woman in a black habit at a riverboat rail, an iron ring of
      sixty-seven keys at her belt — one for every house she founded — her gaze
      already on the far bank. Gold-leaf ground, the ring of keys the image's
      bright detail.
    culture_aesthetic: "Devotional card of the founder-saint; the sixty-seven keys are her great attribute."
    element_visual: "black habit, iron ring of sixty-seven keys, riverboat rail, gaze on the far bank"

  - id: jack_of_lowell
    name: Saint Jack of Lowell
    role: "Saint · catholic-immigrant canon · patron of the Merrimack Mills and Down East"
    type: saint_icon
    register: devotional icon, gilt, the scroll as attribute
    appearance: >-
      A flannel-shirted man at the Grotto's Stations of the Cross on Pawtucket
      Street, rucksack on one shoulder, a roll of teletype paper unspooling
      from his jacket and down the hill toward the Merrimack. The unspooling
      scroll is rendered like a saint's banner, gold-edged.
    culture_aesthetic: "Devotional card of the road-saint; the teletype scroll is his gospel-banner."
    element_visual: "flannel shirt, rucksack, the Grotto Stations of the Cross, teletype scroll unspooling downhill"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — FOLK-PLACE CANON
  # ════════════════════════════════════════════════════════════════════

  - id: plymouth
    name: Saint Plymouth
    role: "Saint · folk-place canon · patron of Plymouth Stone"
    type: saint_icon
    register: devotional icon, place-saint, austere gilt
    appearance: >-
      The Rock with teeth, half-submerged at the tideline; above it a quill
      laid across a sea-chest, and a plate holding exactly five kernels of
      parched corn. A place-saint with no human figure — the toothed Rock is
      the holy image, gold-leaf sky behind.
    culture_aesthetic: "Devotional card of a place-saint; the toothed Rock itself is venerated."
    element_visual: "the toothed Rock at the tideline, quill across a sea-chest, five kernels of parched corn"

  - id: tisquantum
    name: Saint Tisquantum
    role: "Saint · folk-place canon · patron of Plymouth Stone"
    type: saint_icon
    register: devotional icon, gilt, between two shores
    appearance: >-
      A man standing between two shorelines — one of masts, one of graves —
      treading eels from the mud with bare feet; behind him, a herring set in
      every cornhill. The two shores compose left and right, the saint
      centered and haloed between them.
    culture_aesthetic: "Devotional card of the between-worlds saint; the eel and the seed-herring are his attributes."
    element_visual: "two shorelines (masts / graves), bare feet treading eels, a herring in every cornhill"

  - id: manhattan
    name: Saint Manhattan
    role: "Saint · folk-place canon · patron of the Sunken Bight"
    type: saint_icon
    register: devotional icon, colossus, drowned-city gilt
    appearance: >-
      A figure tall as a water tower wading the drowned avenues at dusk, steam
      from the vents wreathing her hem, windows lighting one by one as she
      passes. A colossus-saint; the lit windows read as votive candles, the
      dusk gold-edged.
    culture_aesthetic: "Devotional card of the city-colossus saint; the lighting windows are her votives."
    element_visual: "colossal wading figure, drowned avenues, steam-wreathed hem, windows lighting one by one"

  - id: folly_of_the_cove
    name: Saint Folly of the Cove
    role: "Saint · folk-place canon · patron of Cape Ann"
    type: saint_icon
    register: linoleum block print on linen, two-color, NEVER painted
    appearance: >-
      Webbed hands mending a seine net beside a granite quarry pool, the
      Annisquam light behind. Her image is always a linoleum block print on
      linen, in the Folly Cove manner — bold carved line, flat two-color ink,
      visible block texture — never a painted icon. The one saint whose image
      breaks the gilt register on purpose.
    culture_aesthetic: >-
      Folly Cove Designers' block-print idiom — carved linoleum, hand-printed
      on linen; a folk craft, not a holy-card.
    element_visual: "webbed hands, seine net, granite quarry pool, the Annisquam light, block-print line and flat ink"

  - id: rebecca_of_nurse
    name: Saint Rebecca of Nurse
    role: "Saint · folk-place canon · patron of Salem Country"
    type: saint_icon
    register: devotional icon, gilt, the petition as attribute
    appearance: >-
      A woman of seventy-one in a white coif, hands bound before her, face
      unbothered; behind her a petition sheet bearing the signatures of
      thirty-nine neighbors who would not let the lie stand unanswered. The
      petition sheet is rendered like a saint's scroll, the signatures gilt.
    culture_aesthetic: "Devotional card of the wrongly-condemned saint; the petition of thirty-nine is her relic."
    element_visual: "white coif, bound hands, calm face, petition sheet with thirty-nine signatures"

  - id: tubman_of_the_crossing
    name: Saint Tubman of the Crossing
    role: "Saint · folk-place canon · patron of Baltimore, Boston Common, Philadelphia"
    type: saint_icon
    register: devotional icon, night ground, lantern-gilt
    appearance: >-
      A small woman with a lantern and an army scout's pistol, head turned as
      if listening to something under the wind; behind her, gunboats low in the
      Combahee reeds and seven hundred walking free. Night-ground saint-card,
      the lantern the source of all the gold in the image.
    culture_aesthetic: "Devotional card of the conductor-saint; the lantern and the scout's pistol are her attributes."
    element_visual: "lantern, army scout's pistol, head turned listening, Combahee gunboats, the freed walking behind"

  - id: nikola_of_the_hotel
    name: Saint Nikola of the Hotel
    role: "Saint · folk-place canon · patron of the Sunken Bight"
    type: saint_icon
    register: devotional icon, gilt, electric nimbus
    appearance: >-
      A tall man at the window of Room 3327, a pigeon on the sill, eighteen
      dinner napkins folded in thirds on the table behind him; over the Hudson,
      lightning that visibly wants to come in. The lightning forms a crackling
      electric halo — the gilt rendered as live current.
    culture_aesthetic: "Devotional card of the inventor-saint; the pigeon and the folded napkins are his attributes."
    element_visual: "hotel window Room 3327, pigeon on the sill, eighteen napkins folded in thirds, lightning over the Hudson"

  # ════════════════════════════════════════════════════════════════════
  # SAINT ICONS — WILDERNESS / SLEEPER CANON
  # ════════════════════════════════════════════════════════════════════

  - id: lizzie_of_the_cairn
    name: Saint Lizzie of the Cairn
    role: "Saint · wilderness/sleeper canon · patron of the White Mountains"
    type: saint_icon
    register: devotional icon, storm ground, warm-stone gilt
    appearance: >-
      A young woman in 1855 walking-dress, hem frozen stiff, building a cairn
      with bare hands in horizontal wind; every stone she sets glows faintly
      warmer than the air, and the trail behind her is marked in small lights.
      The warm-glowing stones are the only gold in a scoured pewter image.
    culture_aesthetic: "Devotional card of the lost-on-the-mountain saint; the warm cairn-stones are her miracle."
    element_visual: "1855 walking-dress frozen stiff, bare hands stacking a cairn, warm-glowing stones, a trail of small lights"

  - id: rip_of_the_catskills
    name: Saint Rip of the Catskills
    role: "Saint · wilderness/sleeper canon · patron of the Catskills and Hudson Valley"
    type: saint_icon
    register: devotional icon, gilt, the sleeper-saint
    appearance: >-
      A bearded man asleep against an oak, fowling-piece rusted to lace beside
      him, an empty dog collar held loose in one hand; up the mountain, squat
      figures bowl at nine-pins in the thunder. The patron of the thawed
      Sleepers — gold-leaf dusk, the sleeper haloed at rest.
    culture_aesthetic: "Devotional card of the sleeper-saint; the rusted gun and empty collar mark the years lost."
    element_visual: "man asleep against an oak, fowling-piece rusted to lace, empty dog collar, ninepin-bowlers up the mountain"

  - id: henny_of_the_borscht
    name: Saint Henny of the Borscht
    role: "Saint · wilderness/sleeper canon · patron of the Catskills"
    type: saint_icon
    register: devotional icon, gilt holy-card, one of the Four Voices
    appearance: >-
      A man in a tuxedo holding a violin he plays badly on purpose, an index
      card of one-liners in the breast pocket; behind him the Imperial Room at
      the Concord, caught mid-laugh. Warm stage-gold halo — the comic, fourth
      and last of the Four Voices.
    culture_aesthetic: >-
      Devotional card of the tummler-saint; doctrine seats him last of the Four
      Voices (the comic).
    element_visual: "tuxedo, violin played badly on purpose, index card of one-liners, the Concord's Imperial Room mid-laugh"

  - id: crispin_of_the_mill
    name: Saint Crispin of the Mill
    role: "Saint · wilderness/sleeper canon · patron of the Merrimack Mills"
    type: saint_icon
    register: devotional icon, gilt, craft-saint
    appearance: >-
      A man holding a shoemaker's last and awl crossed over a weaver's shuttle —
      the old cordwainer's saint syncretized to the whole Merrimack — the mill
      bell above him, bread in one apron pocket and a rose in the other. The
      crossed tools compose like a coat of arms, gold-leaf ground.
    culture_aesthetic: "Devotional card of the craft-and-labor saint; the crossed last-and-shuttle is his emblem."
    element_visual: "shoemaker's last and awl crossed over a weaver's shuttle, mill bell, bread and a rose in the apron pockets"

  # ════════════════════════════════════════════════════════════════════
  # FACTION FIGUREHEADS — the six major cross-corridor factions
  # ════════════════════════════════════════════════════════════════════

  - id: faction_magisterium
    name: The Cardinal-Registrar of the Magisterium
    role: "Figurehead · the Magisterium of the Seaboard (New Catholic Plenary Council, keeper of the Saint Registry)"
    type: npc_major
    appearance: >-
      An unhurried cleric of late middle age in the Magisterium's plain
      grey-and-oxblood plenary vestments, a New Catholic pectoral cross worked
      in salvaged silver, reading-glass on a ribbon. The face is a committee-
      chair's face — patient, dry, used to ruling on miracles by procedure. A
      faint matter-of-fact mutation: a second set of knuckles on the writing
      hand, unremarked. Holds the great clasped Saint Registry against one arm.
    culture_aesthetic: >-
      New Catholicism as functioning bureaucracy — vestment-plain, archival,
      Roman-by-way-of-committee. Authority worn as paperwork, not menace.
    element_visual: "grey-and-oxblood plenary vestments, salvaged-silver pectoral cross, the clasped Saint Registry, reading-glass on a ribbon"

  - id: faction_whitman_circle
    name: An Athenaeum Sister of the Whitman Circle
    role: "Figurehead · the Sisters of the Whitman Circle (bibliographic-Spiritualist order, Providence Athenaeum)"
    type: npc_major
    appearance: >-
      A woman of indeterminate age in the Circle's ink-dark reading-habit, a
      lensed jeweller's loupe pushed up on her brow, fingers stained with gall
      ink and shelf-dust. She regards the world as a manuscript under revision
      and you as a marginal note. Ink-stained third eye faintly visible at the
      hairline — a reader's mutation, worn with scholarly pride. A foxed folio
      open against her forearm.
    culture_aesthetic: >-
      Bibliographic Spiritualism — the Athenaeum reading-room as cloister, the
      catalogue as scripture. Quiet, exact, a little uncanny.
    element_visual: "ink-dark reading-habit, jeweller's loupe on the brow, gall-ink-stained fingers, an open foxed folio, faint third eye at the hairline"

  - id: faction_brahmin_remnant
    name: A Patrician of the Brahmin Remnant
    role: "Figurehead · the Brahmin Remnant (old Protestant aristocracy, the Boston clubs)"
    type: npc_major
    appearance: >-
      An elderly aristocrat in a Somerset Club frock-coat fifteen centuries out
      of fashion and impeccably maintained, high collar, a signet of a vanished
      bank. The bearing of someone who holds the Glory was a test the
      Protestants failed and has never quite forgiven the universe for it.
      Pale, long-boned, a heritable mutation bred true down the Beacon Street
      line — overlong fingers, a faint translucence at the temples — carried as
      pedigree.
    culture_aesthetic: >-
      Boston Brahmin old-money — burnished, exclusive, declining with immense
      dignity. Mutation as bloodline, never as shame.
    element_visual: "maintained Somerset Club frock-coat, high collar, defunct-bank signet ring, translucent temples, overlong patrician fingers"

  - id: faction_loin
    name: A Player of the Lo'in
    role: "Figurehead · the Lo'in (mutant performers; saints are roles, not rewards)"
    type: npc_major
    appearance: >-
      A mutant performer in half-costume between the Federal Hill parlours and
      the Swan Point stone — a patched motley that quotes three saints at once,
      grease-paint half on, a property halo of bent brass wire held ready. The
      body is theatrically strange and entirely owned: an extra pair of
      expressive arms used as a second set of gestures, a voice pitched for the
      back row. Mid-bow, already watching for the next cue.
    culture_aesthetic: >-
      Pilgrim-players of the mutated myth — vaudeville-pious, irreverent and
      devout at once. The saint is a part you play, the mutation your costume
      that doesn't come off.
    element_visual: "patched saint-quoting motley, half-on grease-paint, bent-brass property halo, a second expressive pair of arms, mid-bow"

  - id: faction_sleepers_sodality
    name: A Thawed Elder of the Sleepers' Sodality
    role: "Figurehead · the Sleepers' Sodality (thawed pre-war sleepers, Brown's Hotel, the Catskills)"
    type: npc_major
    appearance: >-
      A pre-war retiree in a cardigan and resort-casual slacks fifteen
      centuries obsolete, a Brown's Hotel guest-pin still on the lapel,
      reading-glasses and a folded activities schedule nobody can read anymore.
      Pleasant, faintly bewildered, perpetually asking what he missed.
      Cold-sleep has left him strangely unaged and faintly frost-rimed at the
      cuffs — a man who came downstairs to breakfast a millennium late and
      means to make the most of it.
    culture_aesthetic: >-
      Borscht-Belt confraternity — the thaw-floor mutual-aid society, organized
      and genuinely confused. Comic warmth, never pathos.
    element_visual: "obsolete resort cardigan, Brown's Hotel guest-pin, reading-glasses, unreadable activities schedule, faint cold-sleep frost at the cuffs"

  - id: faction_patroon_houses
    name: A Lord of the Patroon Houses
    role: "Figurehead · the Patroon Houses (feudal-pastoral manor-states of the Hudson Valley)"
    type: npc_major
    appearance: >-
      A landed manor-lord in Dutch-cut riding clothes of good worn wool, a
      brass-headed staff of patroonship, the calm proprietary gaze of someone
      whose family has held this bend of the river since before the Glory and
      considers the Glory to have merely confirmed it. Weather-beaten, broad,
      unhurried; a heritable mutation — a faint extra ring of horn-pale tissue
      at the brow, like a coronet grown rather than worn — that the manors read
      as the land's own seal of tenure.
    culture_aesthetic: >-
      Hudson Valley patroonship — feudal-pastoral, Knickerbocker-Dutch,
      land-proud. Authority as inheritance and acreage.
    element_visual: "Dutch-cut riding wool, brass-headed staff of patroonship, horn-pale coronet-ridge at the brow, the manor and river behind"
