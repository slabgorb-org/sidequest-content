# Seed tropes for mutant_wasteland/seaboard_of_saints — world-tier deck
# (Epic 94: genre is the rulebook only; flavor lives in the world). Short-arc
# narrative hooks dealt at session start and on engagement/lull draws, expiring
# after lifespan_turns and lingering as ghosts for later callback (ADR-018,
# ADR-128). Seeds are baited hooks (ADR-014 diamonds-and-coal) — deliberately
# vague; the narrator threads an engaged seed into whatever the Corridor's
# business demands.
#
# Without this file the lull engine declined `none_available` every quiet turn
# and the narrator invented NPCs to fill the silence — the bug this deck fixes.
# The world-tier deck supersedes the genre floor: the engine reads world-first.
#
# Register, LOAD-BEARING (world.yaml): literary-gonzo comic dystopia in which
# life, inconveniently, WORKS. Wry, literate, specific — Henny Youngman thawing
# at Brown's, not the end of the world. hope 0.8, weirdness 0.85. The strangeness
# is historical depth, never despair; the comedy is sincere. Most of these seeds
# set in motion an ARGUMENT, a DOCKET, a PILGRIMAGE, or a RENT-DAY — the recurring
# business of a civilization that never stopped keeping minutes. Lethality lives
# in the wilderness margins (Mount Washington, the open abyss, the drowned
# skyline), not the parishes. Reference-stack on THIS world's idioms: the Mint's
# pre-war dies, pennies-as-alms / quarters-as-rent / silver-dollars-for-honor,
# the catechumenate and the Saint Registry, the coupon desk, the lay and the
# shape-up hook, civic spectral evidence, the calico and the Anti-Rent clause,
# the Mayflower compact, the Four Voices, the drowned-floor dive-charts. Never
# generic post-apoc; no irradiated zealots roaming a blasted coast.

- id: seaboard_of_saints_the_penny_count_came_up_short
  name: The Penny-Count Came Up Short
  description: >-
    A parish that tithes its alms in pennies counted by hand — because the
    counting is the prayer — has come up short three Sundays running, and the
    sexton will not say by how much. The Mint strikes only to the pre-war dies,
    so a penny that does not ring true is not a forgery anyone has language for.
    The deacon would rather the matter were settled before the bishop's clerk
    next reconciles the books.
  flavor_tags: [parish, money, propriety, gossip]
  lifespan_turns: 6
  delivery_hints:
    - A sexton counts a tithe-bowl twice at the rail and sets a single coin aside without a word
    - Someone offers to make the shortfall good in quarters, and is quietly, firmly refused — the denomination is the point
    - A penny in the bowl is the wrong weight, struck to no die the Mint admits to keeping
  narrative_hint: >-
    SOUL: let the world's economy be theology. Thread this so the players learn
    the shortfall is never about the sum — a roll of quarters would cover it ten
    times over — but about what an off-die coin means in a faith where the
    counting is the prayer. Bind the bad penny to whoever the parish comes to
    mistrust; if ignored, it surfaces in a tithe the players themselves must pay.

- id: seaboard_of_saints_a_pattern_the_registry_cannot_read
  name: A Pattern the Registry Cannot Read
  description: >-
    A catechumen at the end of the year's catechumenate has a set of marks no
    clerk will swear belong to any Saint in the Registry — nor swear belong to
    none. The local bishop must rule whether the pattern matches a patron, merits
    a petition for a new one, or sends the candidate back un-marked for another
    year. The candidate is patient. The candidate's family is not.
  flavor_tags: [magisterium, doctrine, marks, kinship]
  lifespan_turns: 7
  delivery_hints:
    - A parish letter circulates in fair copy, asking learned passers-by to look at a body and offer a reading
    - A clerk holds a candidate's marks against a marginal note and shakes his head, neither yes nor no
    - The phrase un-marked, not heretical is said aloud, gently, by someone who knows it is no comfort at all
  narrative_hint: >-
    SOUL: the canon was built to argue politely forever, and that is the drama,
    not a villain. Let the players be drawn in as witnesses, readers, or kin —
    every honest reading they offer narrows or widens the case. A petition for a
    new Saint has carried exactly once in two centuries; let that fact do the
    weighing, and never let the matter resolve cleanly.

- id: seaboard_of_saints_a_coupon_two_centuries_unredeemed
  name: A Coupon Two Centuries Unredeemed
  description: >-
    A pre-war retail coupon has surfaced that the Sleepers' Sodality's coupon
    desk has never priced — the committee that sets the rate has been arguing one
    schedule for two hundred years and would dearly love a new line of argument.
    The holder swears it entitles them to something the living parish would have
    to honor. Nobody can decide if the paper is a curiosity, a claim, or a small
    bomb.
  flavor_tags: [sleeper, money, bureaucracy, absurdity]
  lifespan_turns: 5
  delivery_hints:
    - A thawed sleeper produces a creased coupon and asks, reasonably, what it is worth in today's money
    - The Sodality's coupon desk convenes in unusual haste over a single slip of paper
    - A house steward wants the holder moved off his ledger before the rate is fixed at all
  narrative_hint: >-
    SOUL: comedy is sincere; the bewilderment is institutionalized, never cruel.
    Thread this as a bureaucratic farce with real stakes for one bewildered
    person. Let the players be asked to carry the coupon, argue its rate, or
    redeem it somewhere it was never meant to bind — and let the committee, true
    to two centuries of form, decline to decide.

- id: seaboard_of_saints_a_lay_owed_and_a_berth_unfilled
  name: A Lay Owed and a Berth Unfilled
  description: >-
    A sternman's lay — the fractional share of a season's catch that is the whole
    unit of standing Down East — has been promised against a berth that is no
    longer there to fill. A guild charter older than the Annunciation says whose
    trap-line is whose, and a pound-keeper's word is the only court the cold
    grounds recognize. Someone is owed a share, and the water keeps the records.
  flavor_tags: [down_east, debt, guild, obligation]
  lifespan_turns: 6
  delivery_hints:
    - A pound-keeper reckons a lay aloud at the co-op and the arithmetic does not come out for everyone
    - A berth that was promised has been given to another hand, and nobody will say by whose say-so
    - The smell of the token settling the dispute reaches a room before the token does
  narrative_hint: >-
    SOUL: the world's hierarchies are old and load-bearing, not lawless. Let the
    players be slotted into the shape-up — a hook, a share, a debt a hook carries
    — and learn that a guild charter that predates the Glory cannot simply be
    overruled by being right. Bind the contested lay to a faction grudge the
    players will recognize once the cargo's owner is named.

- id: seaboard_of_saints_an_accusation_left_standing
  name: An Accusation Left Standing
  description: >-
    In Salem country a grudge was sworn before a magistrate and never resolved,
    and under the old doctrine — where the 1692 trials are held right about the
    thing and wrong about every defendant — an unsettled accusation can keep its
    own shape. Spectral evidence is admissible, narrowly, before the court that
    raised it. The court has not sat again. The accusation has not gone anywhere.
  flavor_tags: [salem_country, doctrine, accusation, uncanny]
  lifespan_turns: 7
  delivery_hints:
    - A magistrate's docket lists a sworn accusation with no verdict entered beside it
    - A registered familiar — a black hare, a banded crow — watches a stranger too steadily to be only a beast
    - Someone insists the matter is civic and legal, not occult, in the tone of a person who has seen otherwise
  narrative_hint: >-
    SOUL: terror here is civic, not supernatural-generic — the law itself gives
    the accusation a body. Let the players be drawn in to settle the grudge the
    only way the doctrine allows: reconvene the court, or answer the sworn charge
    in due form. Mundane weapons pass through what an unresolved oath has made;
    only true testimony or a magistrate's writ closes it.

- id: seaboard_of_saints_the_calico_is_cut_for_rent_day
  name: The Calico Is Cut for Rent-Day
  description: >-
    Up the Hudson a Patroon house has served back-rents argued in the original
    pre-war paperwork, and in a barn loft before dawn the calico is already being
    cut down for masks. The Anti-Rent clause has held since before the water
    changed, and both sides cite the same wording. Tin dinner-horns are waiting on
    the ridges for a signal nobody has given yet.
  flavor_tags: [hudson_valley, rent, faction, standoff]
  lifespan_turns: 6
  delivery_hints:
    - Bolts of calico are being cut for masks in a loft, and the cutter will not say for whose faces
    - A houndsman asks a traveler's business at every covert gate on the manor land
    - A lease older than the Glory sits open on a table with both parties' fingers on the same clause
  narrative_hint: >-
    SOUL: a rebellion the canon never let fully close, conducted in documents and
    disguises rather than blood. Let the players be pressed to read the clause,
    carry the papers, or stand on a ridge when the horns answer — and let neither
    the rent nor the calico be retired, because both have outlasted a rebellion
    and an apocalypse already. The glen lies between; nobody delivers papers
    through it after moonset.

- id: seaboard_of_saints_a_voice_in_the_wrong_office
  name: A Voice in the Wrong Office
  description: >-
    One of the Four Voices — storyteller, singer, drummer, comic — has a feast
    procession seated in canonical order, and someone has claimed an office in
    that order without ordination, apprenticeship, or petition. The room they
    worked was delighted. The office is held by a rite that delight does not
    satisfy. A house with no holder of the office is incomplete; a house with two
    is a fight.
  flavor_tags: [loin, doctrine, performance, succession]
  lifespan_turns: 5
  delivery_hints:
    - An uninvited performer does ten minutes at a sanctioned rite, and the room laughs while the office-holder does not
    - Word of an unbilled claimant reaches a parish before the procession comes back down the hill
    - Someone files no petition and takes the part anyway, and is good enough that the company seats them
  narrative_hint: >-
    SOUL: saints are roles or rewards, and the world will not yield the word —
    that argument is the engine. Let the players witness, judge, or vouch for a
    claimant who is genuinely good and canonically out of order. The Lo'in hold
    auditions where everyone else holds opinions; let that be the bait, and let
    the contest over who may bear a Voice stay open.

- id: seaboard_of_saints_a_silver_dollar_on_the_table
  name: A Silver Dollar on the Table
  description: >-
    An old silver dollar has been set down to settle a debt of honor — the
    denomination that, by the Seaboard's reckoning, no quarter and no roll of
    pennies can substitute for. The debt is years old and the coin is heavier than
    the sum. Someone has decided the account must be closed; someone else holds
    that an honor-debt settled is an honor-debt admitted, and would rather it
    stayed open.
  flavor_tags: [money, honor, grudge, propriety]
  lifespan_turns: 6
  delivery_hints:
    - A worn silver dollar lies on a table between two people who are not touching it
    - A debt the players assumed was money turns out to be honor, and the coin is the proof of which
    - One party offers to settle in any other denomination and is refused, because the coin is the meaning
  narrative_hint: >-
    SOUL: denomination carries meaning; the money is theology. Let the players be
    asked to carry the dollar, witness its settling, or stand surety for the
    honor it admits — and let the act of paying it be the dangerous part, not the
    sum. Bind the old debt to a grudge between named houses the players will be
    slow to see, because both are so visibly correct.

- id: seaboard_of_saints_a_dive_chart_no_one_will_honor
  name: A Dive-Chart No One Will Honor
  description: >-
    A chart of the drowned lower floors has surfaced in the Sunken Bight — naming
    which flooded cellars hold air and which hold only water — and no licensed
    diver the Stevedores allow will trust it, because the old charts are read as
    relics now and not as instructions. Someone wants to go down anyway. The
    Stevedores will price a charter to the edge of the deep dark and refuse one
    past it.
  flavor_tags: [sunken_bight, salvage, peril, hubris]
  lifespan_turns: 8
  delivery_hints:
    - A water-stained chart of the deep floors is offered for sale by someone who will not dive it themselves
    - The Stevedores quote a charter to the edge of the drowned levels and go silent on anything past it
    - A diver speaks of rooms that held air the chart denied and none where it promised both
  narrative_hint: >-
    SOUL: lethality lives in the margins, and the drowned dark is the deepest
    margin on the coast. Let the chart be a genuine temptation with a real intake
    current beneath it — the tide that pulls toward the center on no almanac's
    schedule. If the players take the bait, let the deep floors keep the contract
    the licensed divers refuse to sign; if they pass, let the chart's seller
    surface later, having found someone who didn't.

- id: seaboard_of_saints_a_thing_made_canonical_by_witness
  name: A Thing Made Canonical by Witness
  description: >-
    A relic has been brought up — off a ledge, out of a cellar, down from an
    attic — and the question on the Seaboard is never whether the thing is real
    but whether it has been witnessed, because here a relic is made canonical by
    witness, not provenance, exactly as the Rock was identified a century and
    twenty-one years late. The Whitman Circle wants to authenticate it. The
    Smithsonian Order wants to claim it. Both want a credible witness, and quickly.
  flavor_tags: [relic, doctrine, faction, authentication]
  lifespan_turns: 7
  delivery_hints:
    - An object is set before a small circle of people and someone asks, pointedly, who will witness it
    - A Reliquary authenticator and an Athenaeum Sister both arrive for the same thing and are exquisitely polite about it
    - The matter turns not on where the relic came from but on whose word will be entered in the minutes
  narrative_hint: >-
    SOUL: the canon's own lesson is that telling a thing well makes it true. Let
    the players be the witness everyone is courting — their word, entered in the
    minutes, settles the relic and outlives them. Bind the contest to the old
    Whitman-Circle / Smithsonian-Order rivalry over the senior reading of the
    Ancients, and never let the provenance matter more than the testimony.

- id: seaboard_of_saints_what_year_do_you_believe_it_to_be
  name: What Year Do You Believe It to Be
  description: >-
    A cold-room has opened on its pre-war timer out of season, and a sleeper has
    come downstairs mid-anecdote into a world that canonized his headliners fifteen
    centuries ago. The waking rite opens, as it always does, with the gentlest
    question in the canon — and nobody likes the answer. The Sodality is at the
    door with coffee and a current calendar; the man would like to be paid for the
    nights he slept through.
  flavor_tags: [catskills, sleeper, thaw, absurdity]
  lifespan_turns: 5
  delivery_hints:
    - A vault door under a resort breathes fog into a warm corridor out of season
    - A man in a forty-year-old dinner jacket asks which tummler is on tonight, and means it
    - A welcome-volunteer's coffee urn is carried at a half-run down a service stair
  narrative_hint: >-
    SOUL: the comedy is sincere and the bewilderment is real. Thread this so the
    players meet a whole person, not a punchline — out of step with everything and
    at peace with almost none of it, working the room with the timing intact. His
    back pay is a theological question and his standing is unsettled; let the
    players advocate, host, or argue him into the living world, and let the
    thaw-floor timers, indifferent, ready the next room.

- id: seaboard_of_saints_a_passenger_who_must_not_be_moved
  name: A Passenger Who Must Not Be Moved
  description: >-
    Someone needs to be carried past anyone who wants them stopped — a sleeper
    fleeing a hostile parish, an un-marked candidate the Magisterium has not gotten
    to, a mark fleeing a Patroon's indenture — and the old conductor-routes are
    quiet, disciplined, and trusted by everyone who has ever needed them. The
    station-keepers do not advertise. The Corridor's toll-takers would dearly like
    to know which house is moving whom.
  flavor_tags: [baltimore, passage, secrecy, mercy]
  lifespan_turns: 7
  delivery_hints:
    - A station-keeper opens a safe-house door only after a token is read, and asks no further questions
    - A traveler the players have met turns out to be carried, not merely traveling, and the difference is everything
    - A toll-taker presses, too casually, to learn who came through and when
  narrative_hint: >-
    SOUL: graceful degradation and mercy are doctrine here, not weakness. Let the
    players be drawn into the passage — as conductor, as cargo, or as the one
    asked to look the other way — and let the network's long memory be the asset
    and the danger both. Bind the passenger's pursuer to a named house's debt; if
    the players decline the route, let the pursuit catch up to someone the routes
    would have saved.
