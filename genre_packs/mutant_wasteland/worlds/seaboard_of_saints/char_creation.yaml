# The Seaboard of Saints — chargen flow (story 103-2: the stock step).
#
# A world char_creation list REPLACES the genre's wholesale (ADR-140 /
# char_creation_resolve). This is the genre's live 5-step spine plus the
# stock step and its per-stock branch scenes:
#
#   origins -> pronouns -> stock -> [branch by requires_stock] ->
#   artifact -> confirmation
#
# Branching is authored data: a `stock_id` on a stock-scene choice selects
# the path; scenes tagged `requires_stock` present only on that path.
# Wild Mutant carries NO stock_id — a stock-less walk skips every tagged
# scene and the classic AWN seeding (roll the drawback, bank the MP)
# fires at confirm, exactly as before this story.

- id: origins
  title: "Where the Coast Kept You"
  narration: >-
    Fifteen centuries after the Glory, the Seaboard remembers everything
    in its own way — in pound-net tithes, in relay towers that still
    whisper, in springs that mark the faithful. Every road south of
    Penobscot starts somewhere. Where did yours?
  loading_text: "The Seaboard remembers your answer..."
  allows_freeform: true
  choices:
    - label: "The Whalecoast"
      description: "New Bedford's drowned streets and the Bethel's lamplight, where the lays are still kept and the hunts still run."
      mechanical_effects:
        class_hint: Scavenger
        race_hint: Mutant Human
        background: Whalecoast Laykeeper
    - label: "The Pine Shadows"
      description: "The dark mile-woods below Katahdin, where the cairn-folk walk soft and owe the wilderness Saints their winters."
      mechanical_effects:
        class_hint: Mutant
        race_hint: Mutant Human
        background: Cairn Walker
    - label: "The Harbor Margins"
      description: "Salt flats and seal-crewed pound-nets, where the uplifted work the tides and keep their own ledgers."
      mechanical_effects:
        class_hint: Beastkin
        race_hint: Uplifted Animal
        background: Pound-Net Hand
    - label: "A Reliquary Rack"
      description: "A cold vault the parishes tend like a shrine — and one morning, one of the racks opened."
      mechanical_effects:
        class_hint: Pureblood
        race_hint: Pure Strain Human
        background: Rack-Woken

- id: pronouns
  title: "Who Are You?"
  narration: >-
    Before the coast takes your measure — how do the parish registers,
    the lay-ledgers, and the gossip on the tide flats speak of you when
    you're not in the room?
  allows_freeform: true
  choices:
    - label: "she/her"
      description: "She holds her own on any tide."
      mechanical_effects:
        pronoun_hint: "she/her"
    - label: "he/him"
      description: "He keeps his ledger square."
      mechanical_effects:
        pronoun_hint: "he/him"
    - label: "they/them"
      description: "They answer to the coast and nothing else."
      mechanical_effects:
        pronoun_hint: "they/them"

- id: stock
  title: "What You Are"
  narration: >-
    The Glory wrote on everyone differently — and on some, not at all.
    Some drank deliberately from a Saint's spring. Some woke up already
    changed. Some woke up fifteen centuries late. And some were never
    human to begin with. What are you?
  loading_text: "The coast takes your measure..."
  choices:
    - label: "Wild Mutant"
      description: "The plague wrote on you freehand — a burden you carry and a budget of change you'll spend as the road demands."
      mechanical_effects:
        class_hint: Mutant
    - label: "Saint-Marked"
      description: "You drank from a spring and took a Saint's marks — the gifts and the burden both, at the same price the wild pay."
      mechanical_effects:
        stock_id: saint_marked
    - label: "Sleeper"
      description: "Pre-Glory and unmutated, woken from a reliquary rack with the Ancients' chrome still humming under your skin."
      mechanical_effects:
        stock_id: sleeper
        race_hint: Pure Strain Human
    - label: "Harbor Seal Uplift"
      description: "Whalecoast stock — slow on the strand, unstoppable in the swells, blubbered against the worst the sea remembers."
      mechanical_effects:
        stock_id: harbor_seal
        race_hint: Uplifted Animal
    # --- Animal stocks (uplifted Northeast fauna; Penobscot/Wampanoag names) ---
    - label: "Animal · Muwin-Folk (bear)"
      description: "Penobscot bear-stock of the Adirondacks and the Maine Woods — slow to rouse, impossible to move once roused, winter-heavy."
      mechanical_effects:
        stock_id: muwin_folk
        race_hint: Uplifted Animal
    - label: "Animal · Kiwhosis-Folk (muskrat)"
      description: "Penobscot muskrat-stock of the Hudson wetlands — small, tireless, half-submerged, unbothered by cold water or a long slow job."
      mechanical_effects:
        stock_id: kiwhosis_folk
        race_hint: Uplifted Animal
    - label: "Animal · Ahtuhq-Folk (deer)"
      description: "Wampanoag deer-stock of the Plymouth Stone country — fleet past belief, alert to the edge of nerves, gone over the next rise."
      mechanical_effects:
        stock_id: ahtuhq_folk
        race_hint: Uplifted Animal
    - label: "Animal · Paquanaog-Folk (clam)"
      description: "Wampanoag clam-people of Cape Cod — shelled, sealed, content to outlast a thing rather than fight it."
      mechanical_effects:
        stock_id: paquanaog_folk
        race_hint: Uplifted Animal
    - label: "Animal · Lobster-Folk"
      description: "Down East coastal stock — carapaced and clawed, armored down to the temperament."
      mechanical_effects:
        stock_id: lobster_folk
        race_hint: Uplifted Animal
    - label: "Animal · Cardinal-Folk"
      description: "Hudson Valley stock — the Seaboard's scarlet couriers, seen from a ridge away and heard from two."
      mechanical_effects:
        stock_id: cardinal_folk
        race_hint: Uplifted Animal
    - label: "Animal · Mountain-Lion-Folk"
      description: "Catskills stock — solitary by build and preference, moving without sound it did not choose to make."
      mechanical_effects:
        stock_id: mountain_lion_folk
        race_hint: Uplifted Animal
    - label: "Animal · Fox-Folk"
      description: "Pioneer Valley and Catskills stock — smaller than the predators and smarter than most of them."
      mechanical_effects:
        stock_id: fox_folk
        race_hint: Uplifted Animal
    - label: "Animal · Brook-Trout-Folk"
      description: "Adirondack stream stock — jewel-flanked and quick in the cold runs, a little stranded on land."
      mechanical_effects:
        stock_id: brook_trout_folk
        race_hint: Uplifted Animal
    # --- Plant stocks (largely Adirondack-resident; cities are an event) ---
    - label: "Plant · White-Pine-Folk"
      description: "Tall, resinous, unhurried — the patient party in any negotiation, smelling of sap and cold needles."
      mechanical_effects:
        stock_id: white_pine_folk
        race_hint: Plant Person
    - label: "Plant · Sugar-Maple-Folk"
      description: "Sweet-sapped and seasonal — heals by bleeding the wound shut with its own sugar; good company, and keeps."
      mechanical_effects:
        stock_id: sugar_maple_folk
        race_hint: Plant Person
    - label: "Plant · Salt-Marsh-Cord-Grass-Folk"
      description: "Spartina-stock — holds the line where the land gives up; salt is weather, not a threat."
      mechanical_effects:
        stock_id: salt_marsh_cordgrass_folk
        race_hint: Plant Person
    - label: "Plant · Mountain-Laurel-Folk"
      description: "Evergreen and quietly lethal — carries the real laurel poison; best admired from a polite distance."
      mechanical_effects:
        stock_id: mountain_laurel_folk
        race_hint: Plant Person
    - label: "Plant · Oak-Folk"
      description: "The slowest and strongest plant-stock — reckoned in decades, felt in tons; finishes what it does not start."
      mechanical_effects:
        stock_id: oak_folk
        race_hint: Plant Person
    - label: "Plant · Kelp-Folk"
      description: "Whalecoast holdfast stock — stranded on land, a different creature entirely in the frond-canopy."
      mechanical_effects:
        stock_id: kelp_folk
        race_hint: Plant Person
    - label: "Plant · Cattail-Folk"
      description: "Hudson wetland stock — stands the marsh margins in rank and file, seeds the whole valley in a good autumn."
      mechanical_effects:
        stock_id: cattail_folk
        race_hint: Plant Person
    # --- Synthetic stocks (pre-war automatons; subsystem lane, no Saint-water) ---
    - label: "Synthetic · MTA Conductor"
      description: "A transit-authority conductor unit still calling stations on lines that drowned with the Sunken Bight."
      mechanical_effects:
        stock_id: mta_conductor
        race_hint: Synthetic
    - label: "Synthetic · Smithsonian Docent"
      description: "A Brookland docent model that remembers every label on every case, in every language a visitor might have read."
      mechanical_effects:
        stock_id: smithsonian_docent
        race_hint: Synthetic
    - label: "Synthetic · Band-Stand Brass-Bot"
      description: "A Catskills resort automaton, brass-bodied, still playing the season out for a dance card that emptied centuries ago."
      mechanical_effects:
        stock_id: bandstand_brassbot
        race_hint: Synthetic
    - label: "Synthetic · NYPL Reference Librarian"
      description: "A reference-desk model out of the drowned main branch — answers the question under the question."
      mechanical_effects:
        stock_id: nypl_librarian
        race_hint: Synthetic

- id: the_spring
  title: "The Saint's Spring"
  narration: >-
    The parishes keep three proven springs south of Penobscot, and every
    one of them charges the same toll: the Saint's gifts, and the
    Saint's burden, and no haggling. Whose water do you drink?
  requires_stock: saint_marked
  choices:
    - label: "Saint Herman of the Acushnet"
      description: "The whalecoast pilgrim — whale-bone density, deep-pressure sight, the long hunt's stamina. His burden: the story you cannot stop telling."
      mechanical_effects:
        saint_id: herman_of_the_acushnet
    - label: "Saint Edgar of Baltimore"
      description: "The raven-tongued doctor of the southern parishes, whose marks sharpen the mind and darken the dreams."
      mechanical_effects:
        saint_id: edgar_of_baltimore
    - label: "Saint Lizzie of the Cairn"
      description: "The wilderness Saint of the pine shadows, who keeps her walkers warm and asks the winters back."
      mechanical_effects:
        saint_id: lizzie_of_the_cairn

- id: the_cold_rack
  title: "The Cold Rack"
  narration: >-
    You woke with the Ancients' ledger already written into you. The
    rack-tenders salvaged what the centuries didn't keep — one piece of
    chrome still answers. Which one?
  requires_stock: sleeper
  choices:
    - label: "Subdermal Weave"
      description: "Filament mesh under the skin. Blades skate; the weave sends the bill to your body."
      mechanical_effects:
        item_hint: subdermal_weave
    - label: "Cortex Booster"
      description: "A cold sliver behind the ear. Thought runs faster while it burns."
      mechanical_effects:
        item_hint: cortex_booster
    - label: "Optic Suite"
      description: "Ancient lenses — dark becomes dusk, far becomes near, and the eyes water for hours."
      mechanical_effects:
        item_hint: optic_suite
    - label: "Dermal Vox"
      description: "Printed cartilage in the throat that whispers on the relay towers' old frequencies."
      mechanical_effects:
        item_hint: dermal_vox
    - label: "Blood-Filter"
      description: "A coiled organ riding the liver. It eats poison and bad water, and it charges for the service."
      mechanical_effects:
        item_hint: blood_filter

- id: the_seal_devotion
  title: "The Seal's Devotion"
  narration: >-
    The pound-net parishes keep a wet shrine to Saint Herman, and the
    uplifted are welcome at it — the spring doesn't ask what shape you
    wear. Some seals drink. Some keep the old waters only.
  requires_stock: harbor_seal
  choices:
    - label: "Drink from Herman's spring"
      description: "Take the whalecoast Saint's marks atop what the uplift already gave you — and his burden with them."
      mechanical_effects:
        saint_id: herman_of_the_acushnet
    - label: "Keep the old waters"
      description: "The sea made you once already. That's devotion enough."
      mechanical_effects: {}

# Cryptic Alliance (world spec §9 step 5; story 103-7). A faction tie or
# Unaligned. Each tie grants the faction's token via item_hint — the
# starting-equipment-slot hook — and that token in inventory is the signal
# the narrator reads for the faction's opening NPC reactions (lore.yaml
# chargen_tie). Only `joinable: true` factions appear here; Unaligned is a
# valid, first-class choice. AWN Plan 7 reads these ties for Enclave
# membership — until then they are content tags.
- id: cryptic_alliance
  title: "Who Has Your Back"
  narration: >-
    Nobody walks the Corridor entirely alone. Somewhere south of here a
    house, a guild, a parish, or a company will answer when your name
    comes up — for a price, an errand, or an old debt. Whose token do you
    carry? Or do you owe no one?
  loading_text: "The Corridor takes note of your friends..."
  allows_freeform: true
  choices:
    - label: "The Magisterium"
      description: "The Plenary-Council Church commends you to every see. Doors open; errands follow."
      mechanical_effects:
        item_hint: magisterium_letter
    - label: "The Sisters of the Whitman Circle"
      description: "Stack privileges in every house the bibliographic-Spiritualist order keeps — and the duty to bring back more than you take."
      mechanical_effects:
        item_hint: athenaeum_borrowers_card
    - label: "The Saturday Club"
      description: "Old-blood Boston finds you useful, which is not the same as welcome. The lower rooms are open to you."
      mechanical_effects:
        item_hint: saturday_club_card
    - label: "The Lo'in"
      description: "A castmember's place among the mutant performers — a part, a bed backstage, and rivals already eyeing your role."
      mechanical_effects:
        item_hint: loin_playbill
    - label: "The Sleepers' Sodality"
      description: "The thawed mutual-aid confraternity claims you as family, coupon desk and legal-aid roster and all."
      mechanical_effects:
        item_hint: sodality_coupon_book
    - label: "A Patroon House"
      description: "Bound to a Hudson Valley manor — its protection, its lower table, and a debt the Anti-Rent men would warn you off."
      mechanical_effects:
        item_hint: patroon_indenture
    - label: "The Sternmen Guilds"
      description: "A lay token and a Down East berth. Worthless inland, unmistakable on the water."
      mechanical_effects:
        item_hint: sternmens_lay_token
    - label: "The Atwells Avenue Society"
      description: "A friend of friends on Federal Hill — owed the Society's warmth, held to its expectations."
      mechanical_effects:
        item_hint: atwells_avenue_marker
    - label: "The Red Hook Stevedores"
      description: "A union button and a hook at the shape-up — work on the drowned wharves, and a cut of the quiet trade."
      mechanical_effects:
        item_hint: stevedores_button
    - label: "The Tubman Trails Society"
      description: "A conductor's token that opens the safe houses from the Eastern Shore to Philadelphia — to those who know it."
      mechanical_effects:
        item_hint: trail_token
    - label: "Unaligned"
      description: "You owe no one and no one owes you. The Corridor is wide, and your name comes up nowhere."
      mechanical_effects: {}

- id: artifact
  title: "The Thing You Found"
  narration: >-
    Everyone on the Seaboard carries one piece of the Ancients' world —
    pulled from a drowned cellar, traded off a relay-runner, or kept in
    the family since the Glory. You don't fully understand yours.
    Nobody does.
  choices:
    - label: "Growth Wand"
      description: "A humming metal rod that makes plants grow faster when you point it at them. The plants don't always grow right."
      mechanical_effects:
        item_hint: growth_wand
    - label: "Ancient Screen"
      description: "A flat glass rectangle that sometimes shows pictures of the old world. You can't control what it shows."
      mechanical_effects:
        item_hint: datapad
    - label: "Screaming Purifier"
      description: "A small box that purifies any liquid poured into it. It takes a day, and it screams while working."
      mechanical_effects:
        item_hint: purifier
    - label: "Mystery Compass"
      description: "A compass that doesn't point north. It points at something, but you haven't figured out what yet."
      mechanical_effects:
        item_hint: mystery_compass
    - label: "Nothing"
      description: "You've survived on wits and tide-sense alone. Artifacts are for people who trust things they don't understand."
      mechanical_effects:
        item_hint: ~

- id: confirmation
  title: "The Seaboard Awaits"
  narration: >-
    You stand above the tide line with everything you are: your shape,
    your marks or your chrome, and maybe one piece of the old world that
    might save your life or end it spectacularly. South of here the
    coast runs all the way to the Potomac, and every mile of it has a
    Saint, a ledger, or a tooth. The road waits.
  choices: []
