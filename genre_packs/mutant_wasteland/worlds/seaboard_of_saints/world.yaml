# The Seaboard of Saints — world metadata.
# draft: true keeps this world out of selection until the asset gate is met.
# Player-readable: unlike flickering_reach, this world is NOT spoiler-exempt.

name: The Seaboard of Saints
slug: seaboard_of_saints
draft: true

# Hero shot for the lobby. MUST match a real POI slug rendered to R2 —
# server rest.py builds hero_image as assets/poi/<cover_poi>.png (a slug
# typo silently 404s to the placeholder glyph). `sunken_bight` is keyed in
# visual_style.yaml `atmosphere`: the drowned colossus whose torch still
# burns as a lighthouse — the world's signature image.
cover_poi: sunken_bight

era: "fifteen centuries after the Glory"

tone: >-
  Literary-gonzo comic dystopia in which life, inconveniently for the
  genre, works. Wry, literate, specific: the register is Henny Youngman
  thawing at Brown's Hotel and asking which tummler is on tonight, not
  the end of the world. Cities function. Trains run. Miracles are
  adjudicated by committee. The strangeness comes from historical
  depth, never from despair, and the comedy is always sincere.

axis_snapshot:
  hope: 0.8
  tech_level: 0.65
  weirdness: 0.85

description: >-
  The rail corridor from Penobscot Bay to the Potomac, fifteen
  centuries after the Glory plague wrote new saints into the water and
  the Shake put the old software to sleep. The trains still run, on a
  schedule nobody understands and nobody dares correct. The lighthouses
  still turn — one of them is the torch of a drowned colossus standing
  shoulder-deep in New York harbor. The Magisterium of the Seaboard
  meets in Plenary Council to rule on miracles; the Philadelphia Mint
  strikes pennies from the pre-war dies because nobody has dared change
  them; and under the Catskills resorts, pre-war retirees thaw on
  schedule and come downstairs asking what they missed. The Seaboard is
  not a wasteland. It works. That is the strange part.

starting_location: "Providence — between the Athenaeum's reading room and the supper-smoke of Federal Hill"

extensions: []
