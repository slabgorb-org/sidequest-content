name: Spanish Harlem Nuyorican
summary: El Barrio — the Puerto Rican community of East Harlem, La Marqueta and the
  casitas, bomba and plena under the elevated, fifteen centuries of island memory
  kept alive on the mainland.
description: >
  El Barrio, the Puerto Rican heart of East Harlem above the old outer-borough
  sprawl. Nuyorican to the bone — island-born grandparents and mainland-born
  children, the language doubled, neither half complete without the other. La
  Marqueta under the railway arches, the community gardens and hand-built casitas,
  botánicas and cuchifrito counters, bomba and plena spilling out of doorways on a
  hot night. Catholic and Pentecostal and something older underneath, fierce about
  family and about disrespect. They built a homeland out of a few avenues and
  defend it the way you defend the only thing you brought with you.
