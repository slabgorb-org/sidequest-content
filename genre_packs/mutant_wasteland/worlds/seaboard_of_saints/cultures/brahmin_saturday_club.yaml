name: Brahmin / Saturday-Club
summary: The old Boston Yankee Protestant aristocracy of Beacon Hill — Cabots, Lowells,
  Saltonstalls — fifteen centuries deep and still pouring sherry on Mount Vernon Street.
description: >
  The Brahmin caste of Beacon Hill and the Back Bay, the families that founded
  Boston Common's drawing-room order and never relinquished it: Cabots, Lowells,
  Saltonstalls, Endicotts, Forbeses, Peabodys, Lodges. They keep the Saturday Club
  and the Athenaeum, marry their cousins, and measure a stranger by the cut of his
  vowels. Unitarian by inheritance, abolitionist by memory, devastating by
  understatement — the worst thing they can say of you is nothing at all. Their
  wealth is older than the Glory and quieter than money; their power is the long
  pause before a sentence they decline to finish.
