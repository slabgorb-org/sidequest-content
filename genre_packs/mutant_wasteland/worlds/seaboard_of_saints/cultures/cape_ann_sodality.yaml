name: Cape Ann Sodality
summary: The Gloucester fishing confraternity of Cape Ann — Azorean and Sicilian
  families of Folly Cove, Lanesville, and Pigeon Cove, bound by the saint's-day
  procession and fifteen centuries of the same blood on the same shore.
description: >
  The fishing families of Cape Ann — Gloucester and the granite villages of Folly
  Cove, Lanesville, and Pigeon Cove — Azorean Portuguese and Sicilian by descent,
  bound into a sodality by the Fishermen's Feast and the blessing of the fleet. A
  coastal isolate fifteen centuries on its own headland: the same surnames in the
  same coves, the same boats handed down, a founder-effect people where everyone is
  cousin to everyone and the parish register doubles as a pedigree. They carry the
  saint to the water's edge each summer and ask the sea to give the men back. Devout,
  insular, weather-wise — knit tight by marriage and grief, not by anything stranger
  than that.
