name: The Lo'in
summary: Mutant players who reenact the pre-war canon as living myth, taking stage-names
  in the "Lo-" pattern; itinerant troupes who make the Swan Point pilgrimage to Providence.
description: >
  The Lo'in are a traveling order of mutant performers who keep the pre-Glory canon
  alive by becoming it — reenacting the old American myths as a sacred repertory and
  taking their names from the figures they carry. A player is not called by birth
  but by the part: Lo Ahab, Lo Hester-of-the-Letter, Lo Edgar-of-the-Raven. They
  tramp the seaboard with their wagon-stages, but every troupe at least once makes
  the pilgrimage to Swan Point in Providence to perform over the old graves. The
  canon is scripture, the stage is an altar, and the name is the costume you never
  take off.
slots:
  stage_prefix:
    word_list:
    - Lo
  mythic_figure:
    word_list:
    - Ahab
    - Ishmael
    - Bartleby
    - Ligeia
    - Gatsby
    - Ophelia
    - Edgar-of-the-Raven
    - Hester-of-the-Letter
    - Melville-at-the-Whale
    - Sinatra-of-the-Stage
    - Pearl-the-Scarlet
    - Usher-of-the-Fall
    - Queequeg
    - Hawthorne-of-the-Seven-Gables
    - Daisy-of-the-Green-Light
    - Pip-the-Castaway
    - Annabel-by-the-Sea
    - Roderick
    - Starbuck
    - Tashtego
    - Dimmesdale
    - Lenore
    - Nevermore
    - Whitman-of-the-Grass
  troupe_word:
    word_list:
    - Players
    - Company
    - Wagon
    - Repertory
    - Pageant
    - Mummers
    - Stage
    - Pilgrimage
  adjective:
    word_list:
    - Wandering
    - Painted
    - Last
    - Drowned
    - Burning
    - Grave
person_patterns:
- '{stage_prefix} {mythic_figure}'
- '{stage_prefix} {mythic_figure}'
place_patterns:
- The {adjective} {troupe_word}
- '{stage_prefix} {mythic_figure}''s {troupe_word}'
chargen: true
