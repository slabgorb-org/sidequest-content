name: Inwood Dominican
summary: The Dominican north of Manhattan — Inwood and Washington Heights, colmados
  and bachata, the merengue-loud quisqueyano community at the top of the island.
description: >
  The Dominican community at the northern tip of Manhattan, Inwood and Washington
  Heights, looking down over the upper outer-borough flats. Quisqueyano and proud —
  colmados open all night, the bachata and merengue out of the car windows, baseball
  on every lot, the flag in every window. Island-born elders and city-born kids,
  remittance and return woven into family the way the patron-saint festival is woven
  into the calendar. Catholic with an older grain beneath, hard-working and
  hard-celebrating, quick to claim kin and quicker to defend the barrio. The
  Cloisters loom over them and they treat the old stones as just more of the
  neighborhood.
slots:
