name: Hudson Valley Patroon
summary: The manorial Dutch of the Hudson — Van Rensselaers and Schuylers on their
  vast patroonships, a feudal-pastoral order of tenant farms, river sloops, and old
  Sleepy Hollow weather.
description: >
  The Dutch landed gentry of the Hudson Valley, heirs to the patroonships that
  parceled the river country into manors before the Glory and somehow still hold
  them: Van Rensselaers, Schuylers, Van Cortlandts, Beekmans. A feudal-pastoral
  order of tenant farms and rent-day, fieldstone manor houses, river sloops, and
  Dutch Reformed steeples over orchard towns. They keep the old holidays and the
  old deference, and the country around Sleepy Hollow is thick with weather that
  doesn't behave — a soft uncanny that the patroons treat as a tenant treats his
  landlord: quietly, and without asking questions out loud.
