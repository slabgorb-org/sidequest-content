name: Arthur Avenue Bronx Italian
summary: The real Little Italy of the Bronx — Arthur Avenue and East 187th, the
  retail market and the cheese-pulling families, an Italian high street that feeds
  the whole seaboard.
description: >
  Belmont, the Bronx's true Little Italy, centered on Arthur Avenue and East 187th
  Street around the covered retail market. Where Bensonhurst guards a residential
  block and Federal Hill rules a Providence hill, Arthur Avenue is a working market
  street — mozzarella pulled by hand at dawn, butchers and fishmongers and bread
  ovens, the families who supply every other Italian table on the seaboard. Old
  Neapolitan and Calabrian and Sicilian houses bound together by the market and the
  parish of Mount Carmel, proud of the trade and the recipe and the name over the
  shop. Hospitality at the counter, flint underneath it.
