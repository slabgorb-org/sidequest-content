name: Mashpee-Aquinnah Wampanoag
summary: The Wampanoag nations of Cape Cod and Noepe — the Mashpee and the Aquinnah,
  sovereign people of the dawn-land, keepers of the clay cliffs, the herring runs,
  and a language carried back from near-silence.
description: >
  The Wampanoag — the People of the First Light — whose two recognized nations, the
  Mashpee on the Cape and the Aquinnah on the western cliffs of Noepe, have held
  this coast since long before the Pilgrims' stone and hold it still as sovereign
  governments. Theirs is the country of the herring runs and the cranberry bogs,
  the great clay cliffs at Aquinnah, the meetinghouse and the powwow and the
  Wampanoag language reclaimed word by word from the old records. Tribal council
  and clan, the homeland kept against fifteen centuries of pressure: not a relic
  and not a flavor, but a living polity that issues its own law and remembers
  Massasoit and Metacomet as ancestors, not legends.
