name: Penobscot
summary: The Penobscot Nation of the great river and Indian Island — Wabanaki people
  of the Dawnland, basket-makers and river-keepers, sovereign in the Down-East fog.
description: >
  The Penobscot Nation, Wabanaki people of the Dawnland, whose island town sits in
  the river that bears their name above the Down-East coast. A sovereign nation with
  its own council and its own representative, holding the river islands and the
  ash-and-sweetgrass basketry, the canoe routes, and the fog-cosmology carried in
  the oral tradition of the old families — Orono, Neptune, Sockalexis, Attean,
  Mitchell. The fog off the water is not weather to them but a told thing, a country
  of stories about Gluskabe and the river that they keep the way other people keep
  deeds. Not a vanished people: a present government, a living language, a homeland
  defended.
