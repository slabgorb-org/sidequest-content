name: Down-East Maine Yankee
summary: The fog-coast lobstering Yankees of the Penobscot Bay granite — sternmen, pound-keepers,
  and lighthouse families who measure a man by whether he hauls his own traps.
description: >
  The old Yankee stock of the Down-East coast: lobstermen and sternmen, fish-pound
  keepers, boatwrights, and lighthouse families strung along the granite headlands
  from Stonington out to Vinalhaven and Matinicus, where the fog comes in for days.
  Congregational and plain-spoken, frugal past the
  point of comfort, suspicious of anyone from away and slow to say so out loud.
  Their wealth is gear and a sound hull and a string of buoys nobody else touches;
  their law is the harbor gang and the unwritten territory of the traps. They speak
  little, fix everything twice, and remember a slight for three generations.
