name: Bensonhurst Italian
summary: The Sicilian South Brooklyn stronghold along 18th Avenue and 86th Street —
  Cristoforo Colombo, social clubs and pork stores, the last hard Italian neighborhood
  on the bight.
description: >
  The Sicilian and Southern Italian quarter of South Brooklyn, hung on 18th Avenue
  and 86th Street above the sunken bight. The most stubbornly Italian ground left
  in the boroughs — pork stores with the lard-paper in the window, espresso bars
  full of men who never order anything, the avenue draped for the Cristoforo Colombo
  feast. Where Federal Hill keeps a courtly Providence formality, Bensonhurst is
  street-loud and territorial, a folded-arms neighborhood that knows every face on
  the block and watches every one that isn't. Family, the parish, the corner — and
  a long institutional memory for who owes what.
