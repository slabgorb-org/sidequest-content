name: Brookland DC Catholic
summary: Little Rome — the Black Catholic community of Brookland in northeast DC,
  clustered around the basilica and the university, fifteen centuries of striving,
  sodality, and Sunday best.
description: >
  Brookland, the Black Catholic heart of northeast Washington — Little Rome,
  ringed by the great basilica, the university, and a hundred religious houses and
  seminaries. A community built by Black families who claimed the Church as their
  own and made the neighborhood a citadel of faith and respectability: the parish
  school, the Knights and the sodalities, the funeral homes and the social aid
  clubs, the brass band at the saint's-day procession. Educated, organized, and
  immovably dignified — Sunday best on a Tuesday, the choir loft as a power base,
  a long communal memory of every door opened and every door closed.
