name: Federal Hill Italian
summary: The Providence Italian colony of Atwells Avenue — the pinecone gate, the
  bakeries and social clubs, Southern Italian and Sicilian families fifteen centuries
  rooted on the Hill.
description: >
  The Italian quarter of Providence, climbing Atwells Avenue under La Pigna, the
  bronze pinecone hung over the gate. Southern Italian and Sicilian stock —
  Neapolitans, Calabrians, families out of Itri and Sciacca — who came for the
  jewelry shops and the textile mills and made the Hill their own republic.
  Pasticcerie and salumerie, the festa of the parish saint carried on shoulders,
  the social club where old men play scopa and decide things the city never hears
  about. Family is the first law and the parish the second; respect is currency
  and a closed door is an answer. DePasquale Square at the center, the fountain,
  the smell of bread before dawn.
