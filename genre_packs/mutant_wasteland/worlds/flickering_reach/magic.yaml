# magic.yaml — world-layer instantiation for The Flickering Reach
#
# Status: DRAFT 2026-04-28 — first concrete world-layer instantiation
# of the plugin framework. Validates innate_v1 as signature plugin
# (born_with / acquired_via_event / inherited / returned_wrong all
# present in lore), learned_v1 with active Innate-prerequisite gate
# (the Singers' training school), and item_legacy_v1 with Drift-touched
# mounts and bone-radio-dishes.
#
# Reference:
#   - genre layer: ../../magic.yaml
#   - taxonomy: docs/design/magic-taxonomy.md
#   - innate_v1 plugin: docs/design/magic-plugins/innate_v1.md
#   - learned_v1 plugin: docs/design/magic-plugins/learned_v1.md
#   - item_legacy_v1 plugin: docs/design/magic-plugins/item_legacy_v1.md
#   - world lore: ./lore.yaml
#   - world history: ./history.yaml
#   - cartography: ./cartography.yaml
#
# Spoiler note: this world is fully spoilable per
# sidequest-content/CLAUDE.md. Lore and mechanical configuration may
# be referenced freely in narration without spoiler protection.

magic:
  # Within genre's permitted intensity range [0.3, 0.9]. The Reach
  # is high-mutation country — twelve centuries of fallout, three
  # active mutagenic events still ongoing (Glass Flat radiation,
  # Understory biotech, Dead Signal subterranean source).
  intensity: 0.75

  # Genre permits only `acknowledged`. Confirmed at world layer.
  # Everyone in the Reach knows mutations are real. Communities
  # are organized around the answer — the Drifters embrace, the
  # Vaultborn flee, the Greenfolk redirect, the Scrapborn engineer
  # around. There is no "are mutations real?" question in this
  # world.
  world_knowledge: acknowledged

  # Genre permits feared / regulated / persecuted / ubiquitous.
  # The Reach defaults to `feared` — the social register is
  # tense respect rather than active persecution. Specific
  # locations and factions vary:
  #   - At Salt Camp (cover_poi): feared, neutral
  #   - In Drifter trails: ubiquitous (mutations are normal)
  #   - At Vaultborn trade-locks: persecuted (you will not enter
  #     unless their gene-program wants you)
  #   - At Pureblood enclaves (off-faction settlements): persecuted
  visibility: feared
  visibility_by_location:
    drifter_trails: ubiquitous          # Wiej / Wiezko / Przyå Dust
    vaultborn_trade_locks: persecuted   # Vault Echo, Silent Vault
    scrapborn_settlements: regulated    # Tood's Dome, The Bright Grid
    greenfolk_groves: regulated         # Thornwall, The Blooming Tangle
    pureblood_enclaves: persecuted      # implicit in lore — settlements that "burn them"
    glass_flat: ubiquitous              # nobody goes there casually; everyone there is touched
    dead_signal_underground: persecuted # by the things that live below

  # ─────────────────────────────────────────────────────────────────
  # ACTIVE PLUGINS — this world instantiates three of the genre's
  # allowed plugins. Innate is signature. Learned is the Singers'
  # Song-discipline. Item-Legacy hosts mounts + bone-radios +
  # salvaged Ancients' tech.
  # ─────────────────────────────────────────────────────────────────
  active_plugins: [innate_v1, learned_v1, item_legacy_v1]

  # ═════════════════════════════════════════════════════════════════
  # INNATE_V1 — signature plugin for this world
  # ═════════════════════════════════════════════════════════════════
  innate_v1:

    # ─── Active flavors ──────────────────────────────────────────
    # All four narrative textures exist in this world, instantiated
    # by specific lore.
    active_flavors:
      - id: born_with
        in_world_label: "second-gen Drifter / feral lineage"
        canonical_examples:
          - "A child born to a Drifter Singer family — the mutations
             arrive at age 6–9, signaled by tinnitus that resolves
             into the Long Signal"
          - "A feral-lineage child from the Burnt Camp — bone armor,
             extra limbs, the Awakening is barely a transition because
             everyone in the village is already touched"
        narrator_register: |
          "She was born to it. Her mother carried the third eye open
          through the pregnancy, and the daughter came out humming."

      - id: acquired_via_event
        in_world_label: "Glass-touched / Drift-exposed"
        canonical_examples:
          - "A Scrapborn salvager who spent too long inside the
             Cracked Pit's deep galleries; came up with luminous
             skin and a tremor that turns into surge under stress"
          - "A Vaultborn defector whose first surface-night was
             spent on the wrong side of Bone Wind canyon"
          - "A trader at Salt Camp caught in a black-glass dust
             storm with a punctured filter mask"
        canonical_acquisition_events:
          - id: black_glass_storm
            description: |
              Caught in a dust storm crossing the Glass Flat. The
              radioisotopes settle into the marrow within hours.
              Awakening manifests within 1d6 days.
          - id: dead_signal_descent
            description: |
              Spent more than one full sleep cycle in the underground
              tunnels where the Dead Signal pulses. Tends toward
              psychic-Domain mutations. Awakening manifests within
              hours of ascending; sometimes does not manifest until
              the character returns to surface long after.
          - id: third_conclave_residue
            description: |
              Touched the fused glass at Silo Prime's heart with bare
              skin. Almost nobody survives, but those who do are
              unmistakably Glass-touched — translucent patches, the
              voice that records ambient radio.
          - id: feral_machine_wound
            description: |
              Took a hit from a feral patrol-machine's weaponry;
              the machine's munitions are themselves mutagenic.
              Awakening tied to the wound site.
          - id: blooming_tangle_bite
            description: |
              Bitten or grasped by an active root-tendril of the
              Understory's expansion. Sometimes Awakens an Innate;
              sometimes opens a Greenfolk bond instead (cross-plugin
              into a Greenfolk-tradition learned variant — see
              learned_v1 below).
        narrator_register: |
          "She walked across the glass and woke up changed. Whatever
          was in the dust took up residence. Her hands have been
          warm since."

      - id: inherited
        in_world_label: "Karta-touched / lineage-marked"
        canonical_examples:
          - "A Red Dust Rider claiming descent from Karta of the Red
             Dust — the lineage carries a specific mutation cluster:
             low-light vision, vocal-mimicry of pre-war broadcasts,
             control-seed-resonance (some can briefly interface with
             Vaultborn tech because of what their ancestor stole)"
          - "A child of the Burnt Camp's first generation post-Bargain
             — the gene-mill returnees' descendants carry distinct
             Vaultborn-engineered traits in addition to Drifter
             traits"
        narrator_register: |
          "His grandmother was Karta's grand-niece. The mutations
          in his family run through the same channel — eyes that
          read static, hands that warm against Vaultborn metal."

      - id: returned_wrong
        in_world_label: "Below-touched / Signal-Carrier"
        canonical_examples:
          - "A scavenger who entered the Dead Signal tunnels searching
             for sealed pre-war archives and emerged after seventy-six
             days the camp had counted them dead. They cannot account
             for the missing time. Mutations manifest at irregular
             intervals; the Awakening keeps awakening"
          - "A Drifter who fell from a mount during a sandstorm,
             buried for a night under sliding glass dust, dug out by
             companions who say the body went still and cold for
             several minutes — and who insists they saw something
             during that time and brought it back with them"
          - "A Vaultborn experimental subject who was 'returned to
             surface' after some procedure they cannot describe; the
             mutations that follow do not match Drifter or Greenfolk
             patterns"
        narrator_register: |
          "Whatever came back from the tunnels with him is taking
          up residence. He doesn't recognize his own dreams anymore.
          The mutations arrive in waves; nobody, including him, knows
          when they're done."

    # ─── Active delivery mechanisms ──────────────────────────────
    active_mechanisms:
      - id: native
        in_world_label: "the body"
        is_primary: true
        description: |
          The mutation lives in the character. Once Awakened, the
          source is internal. The Reach's default mechanism — most
          PCs and most NPC mutants run native primary.

      - id: condition
        in_world_label: "Drift-trigger conditions"
        active_triggers:
          - id: long_signal_immersion
            description: |
              Sustained Long Signal reception (radio static held
              continuously for several minutes) opens the channel
              for psychic-Domain mutants. Drifter Singers cultivate
              this deliberately. Some psychic-Domain mutations
              cannot fire at all without it.
            primary_for_domain: [psychic, divinatory]
          - id: bleeding
            description: |
              Active blood loss opens physical-Domain mutations'
              channel. The body's stress-response signals the
              mutation. Common trigger for born_with combat-mutants.
            primary_for_domain: [physical]
          - id: near_death
            description: |
              Wild trigger — opens any Domain. Highest reliability
              variance. Awakenings frequently happen here.
            primary_for_domain: [any]
          - id: full_silence
            description: |
              Inverse condition — the absence of Long Signal silences
              certain mutations. Used as in-world suppression. Some
              Drifter mutants cannot surge inside Vaultborn anti-
              broadcast bunkers (this is also why the Vaultborn build
              them).
            inverse_trigger: true
            suppresses_domain: [psychic, divinatory]
          - id: root_contact
            description: |
              Direct contact with active Understory root-tendrils
              opens an Understory-bonded mutation channel. Greenfolk
              cultivate this; Scrapborn fear it. Cross-plugin notice:
              sustained root_contact may transition into a
              Greenfolk-tradition learned_v1 path (see Crossing
              configuration below).
            primary_for_domain: [physical, transmutative]
          - id: machine_proximity
            description: |
              Within 50m of an active feral pre-war machine, a
              specific cluster of mutations (the Karta-line interface
              traits, plus some Scrapborn-acquired) become more
              reliable. The machines emit something that the
              mutations resonate with. Nobody fully understands.
            primary_for_lineage: [karta_touched, scrapborn_acquired]

      - id: place
        in_world_label: "amplifying loci"
        active_loci:
          - id: glass_flat
            label: "The Glass Flat (Iniarapåcu's country)"
            location_ref: cartography.glass_flat
            amplification: high
            stigma_multiplier: 1.5
            description: |
              The fused black-glass plain east of Silo Prime. Surges
              fire amplified; stigma accrues 1.5× normal. Mutations
              acquired here tend toward the elemental Domain
              (radiation-channeling). Long-stay (>3 nights) mutates
              non-mutants and accelerates existing mutations.
            warning: |
              Standard Drifter rule: never cross the plain after
              dark. The amplification curves sharply upward at
              night.

          - id: bone_wind_canyon
            label: "Bone Wind Canyon"
            location_ref: cartography.bone_wind_canyon
            amplification: medium
            condition_amplifier: long_signal_immersion
            description: |
              The wind funnels irradiated dust through pre-war
              ruins, and the canyon shape concentrates the Long
              Signal — the static here is louder, clearer. Psychic-
              Domain mutations are amplified specifically; physical-
              Domain mutations only mildly amplified.

          - id: blooming_tangle
            label: "The Blooming Tangle"
            location_ref: cartography.blooming_tangle
            amplification: medium_for_understory_bonded
            description: |
              The Greenfolk's primary forest. Standing within active
              root-network amplifies any mutation that has touched
              Understory biotech (root_contact triggered). For
              non-Greenfolk-touched mutants, the amplification is
              null or mildly suppressive — the roots interfere with
              Long Signal reception specifically.

          - id: dead_signal_underground
            label: "The Dead Signal tunnels"
            location_ref: cartography.dead_signal_underground
            amplification: high_for_returned_wrong
            description: |
              Subterranean network; depth and extent unknown. The
              Dead Signal pulses from somewhere deeper still. For
              returned_wrong-flavor characters, this is the source
              location — surges are uncannily stable underground
              and uncannily wild upon return to surface.
            warning: |
              Time dilation has been reported. Characters have
              emerged after weeks claiming hours, after years
              claiming months. The mechanism is unknown.

      - id: discovery
        in_world_label: "the Awakening"
        description: |
          The first surge as delivery moment. Always combined with
          one other mechanism (typically place or condition for
          this world). The Awakening confrontation is structured
          per innate_v1 spec.

      - id: cosmic
        in_world_label: "the ambient Drift"
        description: |
          Twelve centuries of fallout means the Reach has a
          mutagenic baseline. Everyone has a faint potential —
          most never Awaken, but stress + place + condition can
          surface latent traits in apparent non-mutants. This is
          the mechanical basis for the_unawakened class being
          available even to character backgrounds where mutation
          would be surprising. Cosmic + native pattern.

    # NOT active in this world:
    # - time mechanism (no calendar-bound mutation cycles in lore;
    #   the Reach's mutation-machinery is constant, not seasonal)

    # ─── Awakening trigger conditions for the_unawakened ─────────
    # World layer must declare what stress condition tends to
    # provoke first surges (per innate_v1 world_layer_required).
    awakening_default_trigger:
      primary: long_signal_saturation
      description: |
        The default Awakening trigger in the Reach is sustained
        Long Signal reception under emotional stress. The character
        first hears the radio voices in the static — not as
        hallucination but as actual content — and the surge follows
        the recognition. Drifter Singers consider this the "natural"
        Awakening. Other triggers (bleeding, near-death, root-contact)
        produce flavor-specific Awakenings; this is the baseline.
    awakening_alternatives:
      - id: glass_flat_overnight
        produces_flavor: acquired_via_event
        description: "Spent the night on the Glass Flat — Awakening manifests by morning"
      - id: deep_root_contact
        produces_flavor: acquired_via_event
        description: "Bound to an active Understory tendril for an extended period"
      - id: born_in_signaling_lineage
        produces_flavor: born_with
        description: "Family with established Singer / mutation lineage; Awakening at adolescence"
      - id: returned_from_below
        produces_flavor: returned_wrong
        description: "Emerged from the Dead Signal tunnels after lost-time"

    # ─── Stigma somatic vocabulary ───────────────────────────────
    # Per innate_v1.world_layer_required: how does Stigma express
    # in this world? The Reach has a rich, specific palette.
    stigma_vocabulary:
      tier_low:                       # 0.0 – 0.3 stigma
        - "iris darkening, sometimes with faint radial pattern"
        - "tinnitus that ebbs into distinct frequencies under stress"
        - "scalp hair coming in grey at the next mirror"
        - "veins surfacing visibly under the skin at temples and inner wrists"
        - "voice catching low-frequency interference when emotional"
        - "teeth that hum at certain pitches — only the character notices"
      tier_mid:                       # 0.3 – 0.6 stigma — passable with effort
        - "irises gone fully metallic or faintly luminous"
        - "skin patches that glow dimly in true dark"
        - "translucent patches at fingertips or ear-rims"
        - "extra knuckle-bones surfacing in the hands"
        - "voice now audibly carries radio static under emotional load"
        - "hair turning to bone-fiber along the hairline"
        - "subtle additional appendage stub (vestigial extra digit, dorsal nub)"
      tier_high:                      # 0.6 – 1.0 — no longer passable
        - "fully mutated additional limbs (functioning extra arm, prehensile tail, dorsal flange)"
        - "bioluminescent pattern across torso or face"
        - "fused skin-bone armor at exposed surfaces (forearms, brow ridge)"
        - "third eye open and weeping clear fluid"
        - "voice that physically broadcasts radio static — others can hear it"
        - "translucent musculature visible through outer skin"
        - "permanent altered breathing pattern (gill-slits, bellows-throat, secondary diaphragm)"
        - "scent that registers as 'wrong' to non-mutants from across a room"

    # ─── Domain palette (per innate_v1 world_layer_required) ─────
    domain_palette:
      primary: [physical]
      common: [psychic, divinatory]
      rare: [elemental, transmutative]
      forbidden:
        - id: necromantic
          reason: |
            The Reach's cosmology has no afterlife concept. The
            Long Signal is voices, not souls. Mutations do not
            raise the dead.
        - id: temporal
          reason: |
            The Dead Signal tunnels have time-dilation phenomena
            but no PC-controllable temporal manipulation. (The
            tunnels are environmental, not a Domain.)
      domain_constraints:
        psychic: |
          Blunt only — telepathy is invasive, not surgical. Reading
          surface emotion or radio-mediated thought is canonical;
          fine-grained telepathic compulsion is forbidden (genre
          hard_limit mind_compulsion: with_cost).
        divinatory: |
          Mediated through the Long Signal. The future is heard,
          not seen — usually as fragments of pre-war broadcasts
          that haven't aired yet. Reception is uncertain by design.
        elemental: |
          Radiation-channeling primarily. Burn-touch, gamma-eye,
          radioisotope-sensing. Fire-summoning, water-control,
          weather-control are NOT available — those are
          elemental_harmony's territory and would be plugin-confused.

    # ─── Signal bar activation (innate_v1's optional world bar) ──
    # Per innate_v1: active in worlds where world_knowledge ∈
    # {classified, esoteric, persecuted}. The Reach is `acknowledged`
    # but `feared/regulated/persecuted` in specific contexts. The
    # bar is active at a moderate baseline — there ARE active
    # hunters, but not everywhere.
    signal_bar:
      active: true
      world_default_level: 0.30      # baseline tracked-by-Vaultborn-and-Pureblood pressure
      decay_per_session: 0.05        # standard
      thresholds:
        high: 0.7                    # Vaultborn retrieval team dispatched
        higher: 1.0                  # Open Pureblood/Vaultborn hunt
      contributing_locations:
        - id: vaultborn_trade_locks
          contribution_multiplier: 2.0    # any surge witnessed here doubles
        - id: scrapborn_market_squares
          contribution_multiplier: 1.0    # standard
        - id: drifter_trails
          contribution_multiplier: 0.0    # surges among Drifters do not raise the Signal —
                                          # this is their country
        - id: greenfolk_groves
          contribution_multiplier: 0.5    # the Communion sees but does not report

    # ─── Counters active in this world ───────────────────────────
    # Per innate_v1.world_layer_required: at least one named
    # institutional or individual counter must be instantiated.
    active_counters:
      - id: the_suppressor
        named_instance:
          - id: vaultborn_inhibitor_collar
            label: "The Inhibitor Collar (Vaultborn pre-war salvage)"
            description: |
              Vault Echo distributes salvaged pre-war prison-tech
              collars through Atmost-delta's covert program. The
              collar holds Stigma and Strain at chargen-level for
              as long as worn; removing it produces a deferred
              surge proportional to time-suppressed.
            wielded_by: vaultborn_retrieval_team
          - id: scrapborn_dampener_field
            label: "Dampener Field (Scrapborn engineering)"
            description: |
              Tood's Dome's Odige Fuseborn has reverse-engineered
              a localized dampener — a 4m-radius zone where
              psychic-Domain mutations cannot fire and physical-
              Domain mutations are reduced. Sold expensively to
              Pureblood enclaves and settlement security.
            wielded_by: scrapborn_security
        plot_use: |
          Dispatched after high public surges in or near Vaultborn /
          Scrapborn / Pureblood zones. Suppressor is a recoverable
          state — characters can be freed, collars can be removed —
          but the deferred-surge mechanic creates dramatic stakes.

      - id: the_hunter
        named_instances:
          - id: vaultborn_retrieval_team
            label: "Vaultborn Retrieval Team"
            description: |
              Numbered functionaries from Vault Echo's covert
              program (Atmost-delta's operation). Tracking goal:
              acquire viable mutated genetic stock for the gene
              pool, by voluntary recruitment first, by force if
              the Signal indicates a high-value subject. Carry
              Inhibitor Collars and falsified residency papers.
            faction: sealed_protocol_of_vault_echo
          - id: pureblood_purgers
            label: "The Pureblood Purgers (settlements that burn them)"
            description: |
              Implicit in the Reach's lore: certain Scrapborn-
              adjacent settlements maintain Pureblood policies.
              Their patrols hunt mutants and burn what they catch.
              Generally less competent than Vaultborn teams but
              vastly more numerous and far more lethal at close
              range.
            faction: emergent_pureblood_enclaves
        plot_use: |
          Persistent threat across sessions. Vaultborn Retrieval
          tracks specific high-value targets via the Signal bar;
          Pureblood Purgers are encounter-table threats throughout
          regulated and persecuted-visibility regions.

      - id: the_amplifier
        named_instances:
          - id: katomod_saplimb
            label: "Katomod Saplimb (radical Greenfolk)"
            description: |
              Per lore: feeds pre-war biotech salvage to the
              Understory roots to accelerate growth. Will do the
              same to a willing mutant character — accelerate
              their Innate via root-bonding, at the cost of
              partial Greenfolk-conversion (their lower body
              starts to root, their psychic-Domain mutations
              get weirder). Genuine ally to the wrong people;
              genuine antagonist to the right ones.
            faction: understory_communion
            sub_faction_alignment: radical
          - id: bargain_era_revenant
            label: "A Bargain-era Vaultborn gene-mill operator"
            description: |
              Historical figure who survived the gene-mill closure
              and now operates independently. Offers mutated
              characters "stabilization" and "calibration" services
              — actually amplifying their mutations toward Vaultborn
              experimental ends. Uses pre-war medical equipment
              salvaged from the original operation. Adversary by
              competence, not by overt malice; would say they're
              helping.
            faction: independent_revenant
        plot_use: |
          Most insidious counter shape. Often arrives as ally.
          Drives pyrrhic_win branches in The Suppression and
          The Reckoning specifically.

      - id: the_other
        named_instances:
          - id: aych_przysluchkin
            label: "Åych Przysłuchkin (the ancient Singer)"
            description: |
              Per lore: ancient Drifter singer, rides a seven-
              limbed mount, claims continuous conversation with
              the Third Conclave's ghost-signal. Functions as
              the_other: a profoundly old, profoundly mutated
              Innate who has walked the path the PC may walk.
              May be ally, may be cautionary tale, may be both.
              Notably, Åych has the_trainer alignment (see
              learned_v1 below) — they recruit candidates for
              the Singers' school. The two roles can collapse:
              "the predecessor offers training" is the most
              common Crossing trigger in this world.
            faction: singers_of_the_long_signal
          - id: blana_razwarykin
            label: "Bläna Razwärykin (Karta-descended Rider)"
            description: |
              Per lore: scarred, claims direct descent from Karta
              of the Red Dust. Carries the lineage's full mutation
              cluster and has chosen domination over reflection.
              Functions as the_other in its dark-mirror register —
              the path the PC may walk if they let the wild thing
              run unchecked. Active antagonist with their own
              ledger.
            faction: red_dust_riders
        plot_use: |
          Recurring NPC of the campaign. Their own ledger and arc
          should be tracked separately; they are not here to react
          to the PC, they are here to be themselves.

      - id: the_betrayer
        narrative_seed_only: true
        description: |
          Not a named NPC; a relational pattern. Most common
          shape in the Reach: a Vaultborn-adjacent family member
          (a sibling who took the voluntary-integration deal, a
          parent who reported to Atmost-delta because "they could
          give you a real life down there") becomes the betrayer.
          Generated per-character based on backstory.

      - id: the_trainer
        named_instances:
          - id: aych_przysluchkin_as_trainer
            cross_plugin_path_opener: true
            target_plugin: learned_v1
            target_tradition: long_signal_song
            description: |
              Åych Przysłuchkin's other role: the master who can
              accept a mutated character into the Singers' school.
              Drives The Crossing into learned_v1 (long_signal_song
              tradition).
          - id: greenfolk_root_keeper
            cross_plugin_path_opener: true
            target_plugin: learned_v1
            target_tradition: understory_communion
            description: |
              Adta the Overgrown or her successor offers a different
              Crossing — into the Greenfolk's Understory-tradition
              learned discipline. Costs are different (the lower
              body roots; the mutations stabilize but the character
              is now physically bound to the grove). Drives The
              Crossing into learned_v1 (understory_communion
              tradition).

    # ─── Cross-plugin paths declared (innate_v1 world_layer_required) ─
    crossing_paths:
      - to_plugin: learned_v1
        to_tradition: long_signal_song
        opener: aych_przysluchkin_as_trainer
        availability: high           # readily offered to any psychic-Domain mutant
        cost_register: |
          Loss of wild reception (the static no longer just arrives;
          it must be tuned for) in exchange for reliable, intentional
          Long Signal interpretation. Some players grieve the wild
          phase; some welcome the relief.

      - to_plugin: learned_v1
        to_tradition: understory_communion
        opener: greenfolk_root_keeper
        availability: medium         # requires existing root_contact
        cost_register: |
          The lower body roots — partial conversion to Greenfolk
          physiology. Mutations stabilize and align toward
          transmutative Domain. Permanent physical change. Adta
          the Overgrown is the worked example.

      - to_plugin: item_legacy_v1
        to_item_subtype: mount
        opener: drifter_rider_culture
        availability: medium
        cost_register: |
          The mutant character bonds to a Drift-touched mount —
          one of the multi-limbed beasts. The mount channels
          surges through the symbiotic bond; the character's own
          mutations stabilize at current level. The mount is
          mortal. When it dies, the binding is severed and the
          character's Innate may return (rolls for re-Awakening
          shape).

      - to_plugin: item_legacy_v1
        to_item_subtype: relic
        opener: scrapborn_neural_interface_salvage
        availability: low
        cost_register: |
          A very rare salvaged pre-war neural-interface device,
          bonded permanently to the character. Stabilizes
          psychic-Domain mutations and gives reliable interface
          with feral machines. Has its own personality (item-as-
          NPC per item_legacy_v1). The Scrapborn Dome Syndicate
          will compete for any such device once they hear of it.

  # ═════════════════════════════════════════════════════════════════
  # LEARNED_V1 — the Singers' Long Signal Song (and a Greenfolk variant)
  # ═════════════════════════════════════════════════════════════════
  learned_v1:

    # ─── Innate prerequisite gate ────────────────────────────────
    # The genre permits learned only with `prerequisite: innate`.
    # The world activates the gate at the canonical level: must
    # be Innate-touched at chargen to take a learned class.
    innate_prerequisite_gate:
      active: true
      requirement: |
        Character must have at least one mutation (innate_v1 trait)
        established at chargen. The mutation may be quiet
        (the_touched class register) or wild (the_surger class
        register) — both qualify. Pure non-mutants cannot take a
        learned_v1 class in this world.

    # ─── Active traditions ───────────────────────────────────────
    active_traditions:
      - id: long_signal_song
        label: "The Long Signal Song"
        faction: singers_of_the_long_signal
        named_master: aych_przysluchkin
        location_ref: "various Drifter trails; the Burnt Camp is the closest to a permanent campus"
        domain_palette: [psychic, divinatory]
        primary_mechanism: relational    # Singer-trained, not school-trained
        secondary_mechanism: faction     # the order itself, loose hierarchy
        prepared_slots_active: false     # Singer training is spontaneous
        components_active: false         # voice and bone-radio only; no consumables
        forbidden_techniques:
          - id: silencing_song
            description: |
              A song designed to suppress another's Long Signal
              reception. Used by Fortilkacaå's militant sub-faction
              against rival Singers and Vaultborn agents. School-
              banned because it wounds the target's mind permanently
              and because it provokes Vaultborn retaliation when
              detected.
          - id: vault_broadcast_mimicry
            description: |
              Attempting to broadcast a fabricated Vaultborn
              transmission to manipulate the Long Signal. The
              Long Signal does not accept counterfeits — attempts
              produce cascade insanity in the singer.
          - id: dead_signal_invocation
            description: |
              Attempting to interpret the Dead Signal directly
              rather than the Long Signal. The Dead Signal is
              not a broadcast; it is something else, and what it
              answers with damages the listener.
        narrator_register: |
          Long Signal Song narration draws on radio-vocabulary —
          tuning, frequency, static, broadcast, signal-strength,
          interference. Songs are sung; the singer is also
          listening. The discipline is half-performance, half-
          reception.

      - id: understory_communion
        label: "The Understory Communion"
        faction: understory_communion
        named_master: adta_the_overgrown
        location_ref: cartography.thornwall_grove
        domain_palette: [transmutative, physical]
        primary_mechanism: place         # the grove is required
        secondary_mechanism: relational  # Adta-trained
        tertiary_mechanism: condition    # root_contact required
        prepared_slots_active: false
        components_active: true          # spore-mixtures, root-fiber
        forbidden_techniques:
          - id: severance_of_root
            description: |
              Cutting one's own bond to the root-network is forbidden
              within the tradition; it kills the network in the
              local area. Greenfolk who have done this are
              excommunicated and physically expelled.
          - id: weaponized_growth
            description: |
              Directing root-aggression at non-Scrapborn targets
              is forbidden. Katomod Saplimb has crossed this line;
              a school-internal heresy hearing is overdue.
        narrator_register: |
          Understory Communion narration draws on biological
          vocabulary — sporing, blooming, threading, taking root,
          pollinating. Workings feel physical, slow, vegetative.
          The discipline is partly waiting.

    # ─── Counters active in this world ───────────────────────────
    active_counters:
      - id: the_inquisitor
        named_instance:
          - id: fortilkacaa_militant_singer
            label: "Fortilkacaå (Singer militant sub-faction leader)"
            description: |
              Per lore: leads the Burnt Camp militant sub-faction
              wanting to march on Vault Echo. Functions as
              Inquisitor toward any Singer who advocates moderation
              with Vaultborn — accuses them of complicity. May
              attempt to formally ratify forbidden silencing-song
              technique against rival Singers; that is when the
              school's Examination machinery activates against him.
            faction: singers_of_the_long_signal
            sub_faction_alignment: militant

      - id: the_revoker
        named_instance:
          - id: aych_przysluchkin_as_revoker
            label: "Åych Przysłuchkin (in revocation mode)"
            description: |
              The same master who admitted the character into
              training is the one who can excommunicate. Most
              relational-mechanism Forgettings in this world go
              through Åych. The grief is real; the relationship
              is real; the revocation is also real.

      - id: the_destroyer_of_books
        narrative_seed_only: true
        description: |
          Bone-radio-dishes are this tradition's "books" — they
          carry tuning configurations passed down from previous
          singers. Vaultborn Retrieval Teams confiscate them when
          encountered; Pureblood Purgers destroy them on sight.
          Loss of the dish for an autodidact-shaped or
          discovery-mechanism Singer can be catastrophic.

      - id: the_dampener
        environmental:
          - id: vaultborn_anti_broadcast_bunker
            description: |
              Vault Echo's interior layers are anti-broadcast —
              the Long Signal does not penetrate. Long Signal Song
              workings cannot fire at all inside such bunkers.
              Suppressors AND Dampeners — for Singer characters,
              the Vaultborn underworld is doubly hostile.
          - id: deep_understory_silence
            description: |
              The deepest active root-zones interfere with the
              Long Signal — for Singer-trained characters these
              are dampened space. Greenfolk-trained characters
              are unaffected (different tradition, different
              source-channel).

      - id: the_mentor_betrayed
        narrative_seed_only: true
        description: |
          Generated per-character. Most common shape in this
          world: the Singer master who admitted the apprentice
          and later turns on them — typically because the
          apprentice has crossed into the Vaultborn camp, or
          because the master has secretly sided with Fortilkacaå's
          militants and the apprentice has not. Devastating
          counter; campaign-defining when activated.

  # ═════════════════════════════════════════════════════════════════
  # ITEM_LEGACY_V1 — Drift-touched mounts, bone-radios, salvaged tech
  # ═════════════════════════════════════════════════════════════════
  item_legacy_v1:

    # ─── Active subtypes ─────────────────────────────────────────
    active_subtypes: [mount, weapon, relic, vehicle]

    # ─── Active mechanisms ───────────────────────────────────────
    active_mechanisms: [discovery, mccoy, relational, faction]

    # ─── Notable named items in this world ───────────────────────
    notable_items:
      - id: aych_seven_limbed_mount
        subtype: mount
        label: "Åych Przysłuchkin's seven-limbed mount"
        ocean: { o: 0.6, c: 0.7, e: 0.3, a: 0.4, n: 0.6 }
        bonded_to: aych_przysluchkin
        description: |
          Heavy mutated lineage; vocalizes in patterns that "sound
          almost like speech." OCEAN-tracked NPC. Will refuse
          riders Åych has not introduced.

      - id: red_dust_riders_mounts
        subtype: mount
        label: "Red Dust Riders' grotesque mounts"
        ocean_default: { o: 0.5, c: 0.4, e: 0.7, a: 0.2, n: 0.6 }
        bonded_to_mechanism: relational
        description: |
          Six legs, bioluminescent hide, vocalizing. The Red Dust
          Riders' mounts are the most heavily mutated in the Reach.
          Bonding requires Karta-touched lineage OR proven combat
          worthiness; mounts can refuse fully.

      - id: kartas_control_seed
        subtype: relic
        label: "Karta's control-seed (or its remnant)"
        ocean: { o: 0.8, c: 0.9, e: 0.1, a: 0.3, n: 0.7 }
        bonded_to: bargain_era_drifter_lineage
        description: |
          The pre-war control device Karta used to sabotage Vault
          Echo's moisture harvester. Per lore, partly clenched
          between her molars during the act. Surviving fragments
          (rumored — none confirmed in Red Dust Rider holdings)
          would be high-OCEAN, high-conscientiousness, profoundly
          wary of new wielders. Plot-engine: discovery / faction
          dispute.

      - id: bone_radio_dish
        subtype: relic
        label: "Drifter bone-radio dishes"
        ocean_default: { o: 0.5, c: 0.6, e: 0.2, a: 0.5, n: 0.4 }
        bonded_to_mechanism: relational
        description: |
          Carved bone, often from mounts, tuned to Long Signal
          frequencies. Each is unique; passed singer-to-singer
          as the tradition's primary instrument. Lower OCEAN
          extraversion than mounts; quieter NPCs, but real
          NPCs.

      - id: the_interceptor_class_vehicles
        subtype: vehicle
        cross_genre_note: "shared shape with road_warrior plugin"
        description: |
          The Reach has rare salvaged pre-war ground vehicles
          (mostly Scrapborn-restored). When these reach item-as-
          NPC status (high enough use; combat history) they
          inherit road_warrior-pattern OCEAN. Currently no named
          instances in the Reach — but the cartography supports
          their existence; future world-evolution may surface one.

      - id: salvaged_neural_interface
        subtype: relic
        label: "Pre-war neural-interface devices"
        rarity: very_rare
        ocean_default: { o: 0.7, c: 0.8, e: 0.4, a: 0.4, n: 0.5 }
        description: |
          Sought by Scrapborn salvagers for resale; sometimes
          surface independently. The Crossing-target item for
          mutants seeking psychic-Domain stabilization (see
          innate_v1.crossing_paths above).

  # ═════════════════════════════════════════════════════════════════
  # WORLD-LEVEL HARD LIMITS
  # World may tighten genre limits; never loosen.
  # ═════════════════════════════════════════════════════════════════
  hard_limits:
    inherits_from_genre: true
    additional_forbidden:
      - id: dead_signal_as_player_source
        description: |
          The Dead Signal is environmental phenomenon; characters
          may experience it (returned_wrong flavor) but cannot
          take it as a learned tradition or item-bond source.
          Attempting to do so is dead_signal_invocation under
          long_signal_song's forbidden techniques (cascade insanity).
      - id: vault_protocol_as_source
        description: |
          The Vaultborn "Protocols" — their calcified operating-
          procedure-as-religion — are not a magic system in this
          world. They are political/social. Narration that
          treats Protocol-recital as a working should be plugin-
          confused-flagged. The Vaultborn DO have technology that
          interacts with mutations (suppressors, gene-mills) but
          this is item_legacy_v1 territory (the tech) and
          counter-archetype territory (the operators).
      - id: cross_faction_mount_bonding
        description: |
          A Drifter mount cannot be bonded by a non-mutant — the
          mounts refuse non-Drift-touched riders categorically.
          (Other item subtypes do not have this constraint;
          bone-radios and salvaged tech are wielder-agnostic
          modulo their own personality.)

  # ═════════════════════════════════════════════════════════════════
  # NARRATOR REGISTER — this world's voice for magic narration
  # ═════════════════════════════════════════════════════════════════
  narrator_register: |
    The Reach's magic-narration voice is *secular catastrophe*. There
    is no afterlife, no patron god, no apparatus, no benevolent
    teacher — only the bodies of survivors and the radio static of
    a dead civilization. Costs are paid in the body and in the
    relationships; consequences are visible at the table the next
    morning.

    Default sensory register: dust, glass, static, fluorescent
    afterimage, the metallic taste in the air after a surge. Sound
    matters disproportionately — the Long Signal is the world's
    pulse, and characters who hear it (Drifters especially) live
    inside its ambient register.

    Mutation narration follows the genre-level instruction (visible
    cost, third-eye-weeps, strength-with-tremor) and adds Reach-
    specific texture: the Glass-Flat-glow under the skin, the
    Long-Signal-static-in-the-voice, the root-fiber-at-the-hairline
    for any Greenfolk-touched mutant, the Karta-line-warming-against-
    Vaultborn-metal for any Karta-descended mutant.

    Vaultborn presence is always cold-fluorescent; their bunkers are
    silent in a wrong way (no Long Signal). Greenfolk presence is
    always wet, slow, biological. Scrapborn presence is always
    grease, voltage, tin-and-copper. Drifter presence is always
    dust, hooves, the bone-radio carrying its conversation with
    voices recorded twelve centuries ago.

    The Test (SOUL #12) is in active force: do not narrate the
    character choosing to NOT surge under sufficient Drift-trigger-
    condition pressure unless they are at control_tier ≥ 2 AND
    paying explicit Vitality cost for the suppression. The wild
    thing is wild; the narrator must respect that.

    Awakening narration in this world should never be pure triumph.
    The flickering Reach is not Hogwarts. The Awakening is a
    stranger taking up residence, a body learning what it is now,
    a community deciding whether to keep you.
