positive_suffix: >-
  post-apocalyptic digital painting, gritty painterly texture, visible
  brush strokes, desaturated bone-and-rust earth tones. Atmospheric haze
  carries a faint phosphor-green radio undertone —
  the Dead Signal humming under the static — a barely perceptible
  green tint at the edges of light sources and a whisper of scan-line
  interference in deep distance. Age reads twelve centuries: weathering
  is older than the genre baseline, with bone-bleach, salt-frost, and
  fused-glass scarring layered into surfaces; light is thin and
  pre-modern rather than new. A faint dust-static texture sits in the
  atmospheric depth, never as overlay. No CRT screens, no radar
  overlays, no on-screen readouts, no game HUD, no UI elements rendered
  literally in the scene — the Signal is felt in the haze, never
  pictured as hardware. No text, no caption, no title, no writing,
  no labels, no signage, no watermark, no border, no frame.

negative_prompt: ""

color_palette:
  primary: "#8E8473"
  secondary: "#5A5641"
  accent: "#7CC472"
  shadow: "#1F1A14"
  highlight: "#D8E2C0"


atmosphere:
  glass_flat: >-
    The mutagenic black-glass plain east of Silo Prime. Composition
    keeps the horizon flat, low, and silent; the world's single
    slow-blinking phosphor-green eye at the plain's center pulses
    below the horizon line, reflected once in the glass surface and
    a second time as a tint in the haze above. Nothing grows. The
    glass is dust-glazed but not weathered — it has refused twelve
    centuries of erosion. Light is sourceless and pre-dawn, with no
    sun position resolvable. The plain is always farther than it looks.
  bone_wind: >-
    The northern canyon — wind made visible as dust streaks, sound
    made visible as tension lines across the frame. Palette runs dry:
    bone, rust, the occasional phosphor flicker where stressed wire
    touches stressed wire. Composition prefers tight verticals and
    high horizons; figures are dwarfed when present. The light is
    canyon-bottom indirect, never warm.
  blooming_tangle: >-
    The hyper-mutated jungle. Bioluminescence is heavy but
    chromatically wide — not the genre's stock toxic green, but a
    full synesthetic spectrum where each species of root runs a
    different note. Roots invade frame from below and from the sides;
    the canopy fluoresces in patterns that read as both light and
    sound. The mood is calm and attentive — the jungle is *listening*,
    not threatening.
  vault_echo: >-
    The sealed Pre-War bunker zone. The cleanest geometry in any
    frame is the perfect grass circles around the air vents — grass
    inside the circles reads correctly green, outside resumes the
    wasteland palette immediately. The pale phosphor-green column
    rising from the main shaft is always cropped, never resolved at
    its top. Composition keeps the bunker half-buried; ground texture
    suggests slow pulsing without rendering motion lines.
  tood_s_dome: >-
    The Scrapborn trade-city. Palette runs warmer than the rest of
    the Reach — copper, lamp-amber, rust-orange from oil-drum fires
    and salvage-wired arc-lamps — but the haze above the dome carries
    the world's phosphor undertone, so the warmth is always tinged
    rather than pure. Surfaces are over-weathered: twelve centuries
    of scrap accreted in visible layers, with no clean fresh element
    anywhere in frame.
  blind_reach: >-
    The carving canyon. Composition makes the carved wall the dominant
    surface and the floor a cracked, lateral plane. Carvings layer
    over centuries with no era cleanly readable — rage-gouged scoring
    interleaved with clinical notation interleaved with ride-glyphs,
    none of it healed. Light is low, lateral, and dusk-coloured. No
    figure should ever appear larger than a carving cluster.
  the_understory: >-
    The Greenfolk root network below the surface. The lighting source
    is the roots themselves — green bioluminescent dimness, neither
    night nor day. Boundary between living tissue and geological
    structure is aggressively blurred; rock and root interweave. Read
    in low-saturation green-on-black with occasional bone-pale
    highlights where the network has consumed something that used to
    walk. Air is implied to be still and humid.
  signal_radius: >-
    The transient zone where Drifter singers can hear the Long Signal
    clearly. No fixed location. Visual marker is a thickening of the
    world suffix's phosphor undertone — the haze runs greener at the
    frame edges, the scan-line whisper deepens in distance, and the
    sky reads as if a CRT were glowing two rooms away. Figures inside
    the radius are subtly outlined in phosphor where light catches
    them. Composition is otherwise unconstrained.
