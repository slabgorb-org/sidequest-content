affected_cultures:
- Drifters
- Vaultborn
- Scrapborn
cultural_impact: The Bargain is the defining shame of three cultures. The Drifters
  revere Karta but cannot speak of the forty tithe-years without grief; families still
  search for descendants lost into the Vaults. The Vaultborn lost their only leverage
  over the surface world and have grown increasingly isolationist, sealing Vault Echo
  entirely — no one has entered or exited in a century, and strange lights are seen
  in its air-shafts at night. The Scrapborn profited enormously from the rain-catcher
  technology and built Tood's Dome into a trade hub, but everyone knows the tech was
  born from stolen children, and Drifter merchants negotiate with visible contempt.
era: 300 years ago
faction_grudges:
- from: Drifters
  reason: Forty years of child-tithe; an entire generation of Drifter children converted
    into Vaultborn drones — some Drifter clans still carry lists of the taken and
    swear recovery oaths
  to: Vaultborn
- from: Vaultborn
  reason: Tood's Dome profited from stolen Vaultborn technology and has refused every
    demand for its return, citing 'finder's law'
  to: Scrapborn
- from: Drifters
  reason: The Scrapborn commodified a technology born from Drifter suffering, charging
    the very people whose children paid for it
  to: Scrapborn
lost_arts:
- The original atmospheric moisture harvester — Karta destroyed it during her escape,
  and the Vaultborn lacked the parts to rebuild
- Drifter storm-reading, a method of predicting weather by reading mount behavior
  — the tithe-generation gap broke the oral tradition, and modern Drifters rely on
  crude instruments instead
- Whatever the Vaultborn were doing inside Vault Echo after it sealed — Scrapborn
  listening posts at the surface vents report mechanical sounds, chanting, and what
  might be laughter
monuments:
- Karta's Road — a trail of red-painted stones stretching from Vault Echo to Tood's
  Dome, maintained by Drifter riders who repaint them every spring in iron-oxide pigment
- The Tithe Wall inside Tood's Dome — Odige Fuseborn carved the names of every known
  tithed child into a sheet of scrap steel; Drifters visiting Tood's Dome touch it
  in silence before conducting any trade
- Vault Echo's Sealed Gate — a massive blast door fused shut from the inside, covered
  in Drifter graffiti and offerings of children's shoes
name: The Bargain at Blind Reach
summary: 'When a decade-long drought drove the Drifters to the edge of extinction,
  their greatest rider-poet Sinä the Storm led a desperate caravan to Vault Echo,
  where the Vaultborn leader Vous-nul controlled the only working atmospheric moisture
  harvester on the continent. Vous-nul offered water in exchange for something monstrous:
  a yearly tithe of Drifter children to replenish the Vaultborn gene pool, which had
  grown dangerously inbred after twelve centuries underground. Sinä accepted. For
  forty years the tithe was paid — Drifter children disappeared into Vault Echo and
  emerged years later as pale, numbered, clinical strangers who no longer recognized
  their birth-families. The arrangement ended in blood when Karta of the Red Dust,
  a tithed child who remembered her Drifter name, sabotaged the moisture harvester
  from within and rode out of Vault Echo on a stolen mount, carrying the harvester''s
  control-seed in her teeth. She delivered it to the Scrapborn at Tood''s Dome, who
  reverse-engineered it into cruder but functional rain-catchers — and charged everyone
  for the privilege.'
terrain_scars:
- description: The dry canyon where Sinä the Storm first met Vous-nul's emissaries.
    The canyon walls are carved with the terms of the Bargain in both Drifter trail-script
    and Vaultborn clinical notation. The carvings have been defaced, restored, and
    defaced again so many times that they now form a palimpsest of rage and grief,
    layers deep. A Drifter camp at the canyon mouth — Salt Camp — serves as both a
    trading post and a memorial site. Psychic frogs living in the canyon's one remaining
    spring are said to croak the names of the tithed children at dusk, though the
    Drifters insist this is not a legend but an observable fact.
  name: Blind Reach
  region: ''
  type: ruin
- description: The sealed Vaultborn bunker complex, its surface structures crumbling
    but its underground levels apparently still active. The ground above throbs with
    a low vibration felt in the bones. Grass grows in perfect circles around the air
    vents, each blade exactly the same height. Drifter riders report their mounts
    becoming agitated within a mile of the site, and any metal brought near the vents
    becomes briefly magnetized. At night, a column of pale green light occasionally
    pulses from the main shaft, visible for miles across the steppe. No one has gone
    in. The last Scrapborn salvage crew to try found the door warm to the touch and
    heard someone on the other side, breathing.
  name: Vault Echo
  region: ''
  type: cursed_ground
