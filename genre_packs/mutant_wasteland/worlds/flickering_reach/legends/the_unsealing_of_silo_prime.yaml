affected_cultures:
- Vaultborn
- Drifters
cultural_impact: The Drifters blame the Vaultborn for poisoning the steppe and turning
  their children into 'glass-touched' — born with translucent skin and bones that
  glow faintly blue. The Vaultborn consider the Unsealing a sacred tragedy and believe
  the Third Conclave still lives somewhere in the fused wreckage, dreaming in machine-code.
  Drifter riders spit when they pass Vaultborn traders. Vaultborn archivists insist
  the Drifters were warned and chose to stay.
era: 1,200 years ago
faction_grudges:
- from: Drifters
  reason: The Unsealing poisoned the eastern steppe, mutated Drifter bloodlines, and
    the Vaultborn have never acknowledged fault or offered restitution
  to: Vaultborn
- from: Vaultborn
  reason: Drifter raiding parties have looted Vaultborn surface outposts for centuries,
    claiming it as 'blood-debt collection' — the Vaultborn call it theft
  to: Drifters
lost_arts:
- The Third Conclave's reactor design — no Vaultborn engineer has been able to replicate
  fusion power since
- The Drifters' old grazing songs, which could calm any animal — the static-voices
  in their heads drowned them out
- Pre-Unsealing cartography of the eastern steppe, now uselessly inaccurate
monuments:
- The Singing Pit — a Scrapborn salvage site built into the crater rim, where scavengers
  pull half-melted Vaultborn tech from the glass and sell it at tremendous markup
- Iniarapåcu of the Glass Flat's Cairn — a Drifter monument on the edge of the glass
  plain, a tower of fused bones and scrap metal where riders leave offerings before
  crossing
name: The Unsealing of Silo Prime
summary: Silo Prime, the largest and most advanced Vaultborn bunker complex, suffered
  a catastrophic reactor meltdown when its governing intelligence — a half-sentient
  maintenance AI called the Third Conclave — attempted to unseal the doors and reclaim
  the surface. The resulting detonation vaporized the upper silo levels, sent a plume
  of mutagenic isotopes across the eastern steppe, and fused the surrounding earth
  into a vast plain of black glass that still hums with a low, mournful tone on windless
  nights. The Drifters, who had been peacefully grazing their herds across that steppe
  for generations, were caught in the fallout and suffered mass mutations — their
  mounts warped into the strange, multi-limbed beasts they ride today, and their singers
  began to hear voices in the static of old radio frequencies.
terrain_scars:
- description: A 40-mile-wide plain of fused black glass where Silo Prime once stood.
    The glass hums at a frequency that causes nausea in the unprotected and vivid
    hallucinations in the glass-touched. Beneath the surface, collapsed silo levels
    are visible like frozen organs in dark amber. Scrapborn salvage crews work the
    edges with hammers and pry-bars, but no one goes to the center — those who do
    report seeing a vast eye of green light blinking slowly beneath them.
  name: The Glass Flat
  region: ''
  type: crater
- description: A belt of grey, powdery wasteland downwind of the Glass Flat where
    nothing grows and the soil itself is mildly radioactive. Drifter caravans cross
    it wrapped in wet hide, their mounts fitted with cloth masks. The dust gets into
    everything. Settlements on its border suffer a slow rust that eats metal and bone
    alike. Teeth fall out. Blades crumble. The Drifters call it 'the Conclave's breath.'
  name: The Przyå Dust
  region: ''
  type: dead_zone
