affected_cultures:
- Scrapborn
- Greenfolk
cultural_impact: The destruction of Noce's Hub shattered what had been a cautious
  trade relationship between Scrapborn and Greenfolk. Scrapborn settlements now burn
  a perimeter of cleared earth around their walls and kill any Greenfolk spore-carrier
  found within a mile of their scrap-heaps. The Greenfolk see the Scrapborn's fire-clearings
  as acts of ecological violence. Kuinem the Overgrown is either a war criminal or
  a saint depending on who you ask — their body was never found, and Greenfolk pilgrims
  claim the massive banyan-like tree at the center of the ruins still speaks with
  Kuinem's voice, though only to those with chlorophyll in their blood.
era: 600 years ago
faction_grudges:
- from: Scrapborn
  reason: The Rooting destroyed their greatest city and killed hundreds; Scrapborn
    mothers still use 'the green comes' as a threat to frighten children
  to: Greenfolk
- from: Greenfolk
  reason: After the Rooting, Scrapborn began systematic burn-clearing and have torched
    several Greenfolk nurseries in retaliatory raids they call 'weeding'
  to: Scrapborn
lost_arts:
- Noce's Hub was the only settlement that had partially restored electrical lighting
  — the generator designs were buried under root-mass and never recovered
- The Scrapborn art of 'junction-singing' — a method of testing wire integrity by
  ear — was centered in Noce's Hub and died with its practitioners
- The specific biotech formulas Kuinem extracted from Lab Sigma, which the Vaultborn
  desperately want back
monuments:
- The Kuinem Tree — a grotesque, building-sized growth at the center of the ruins
  that pulses with bioluminescence and has been observed to move its branches toward
  sound
- Hicienck of the Singing Junction's Wall — a salvaged steel barricade on the western
  approach to The Bright Grid, covered in scratched warnings about root-signs and
  spore-weather, maintained by Scrapborn patrols
name: The Rooting of Noce's Hub
summary: The Scrapborn city of Noce's Hub — a thriving trade settlement built in the
  shell of a pre-war industrial complex — was consumed overnight when a Greenfolk
  elder named Kuinem the Overgrown performed a ritual they called the Great Sowing.
  Kuinem had been experimenting with pre-war agricultural biotech recovered from Lab
  Sigma, splicing it with their own spore-based mutations. The resulting organism
  — a hyper-aggressive root network with rudimentary intelligence — erupted from the
  soil beneath Noce's Hub and grew through every structure in a single night, crushing
  steel beams, splitting concrete, and entombing hundreds of sleeping Scrapborn in
  cocoons of living wood. Those who survived reported the roots whispering to them,
  offering 'peace in the green.' The Greenfolk claim Kuinem was trying to heal the
  poisoned earth. The Scrapborn say it was an invasion.
terrain_scars:
- description: The remains of Noce's Hub, now a miles-wide jungle of hyper-mutated
    vegetation growing through and around industrial wreckage. Steel girders serve
    as trellises for carnivorous orchids. Roots as thick as trains have cracked open
    factory floors. The air is thick with spores that cause temporary synesthesia
    — you can taste colors, hear the texture of bark. Greenfolk communities thrive
    in the upper canopy. Below, in the dark at ground level, Scrapborn salvage crews
    creep through root-tunnels hunting for pre-Rooting tech, and sometimes the roots
    grab them.
  name: The Blooming Tangle
  region: ''
  type: ruin
- description: A ring of land surrounding the Blooming Tangle where the root network
    is slowly expanding outward, about a foot per year. Trees here grow in geometric
    patterns. Animals born in the zone have bark-like patches on their skin and seem
    to move in coordinated groups, like cells in an organism. Scrapborn burn-crews
    fight the expansion constantly. Some Drifters have reported that their mounts
    refuse to enter the area, planting their feet and screaming.
  name: The Tangled Nursery
  region: ''
  type: cursed_ground
