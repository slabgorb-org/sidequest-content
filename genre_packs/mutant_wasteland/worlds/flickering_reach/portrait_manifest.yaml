      unpractised wonder. Hair like fine spun filament.

  - id: picker_vaultborn_ruin_diver_m02
    name: picker vaultborn ruin diver m02
    role: Ruin Diver
    type: player_picker
    culture: vaultborn
    archetype: Ruin Diver
    sex: male
    backdrop_poi: silent_vault
    appearance: >-
      Man, thirties. Bunker-pale face squinting against unfamiliar
      light, watchful grey eyes, a fresh sunburn he isn't used to.
      Regulation-cut dark hair grown slightly out of order. Lean,
      careful, the look of a sealed man learning the surface.

  - id: picker_vaultborn_dead_signal_chaser_f03
    name: picker vaultborn dead signal chaser f03
    role: Dead Signal Chaser
    type: player_picker
    culture: vaultborn
    archetype: Dead Signal Chaser
    sex: female
    backdrop_poi: vault_echo_shaft
