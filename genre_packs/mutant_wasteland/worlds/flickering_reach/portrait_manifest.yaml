      Woman, ageless, mutant. Green-tinged calm face, eyes flecked with
      chloroplast that glow faintly in light. Bald scalp under a fine
      trimmed moss. Pale mycelium threading visible under the skin of
      the wrists and throat. Bark plating creeping up one forearm.

