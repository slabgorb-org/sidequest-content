      Woman, late twenties, mutant. Pale sleepless face, fever-bright
      eyes counting something behind them. Dark hair escaping a flat
      pin, translucent temples with a faint green flicker beneath.
      Lips moving slightly, mid-count. An obsessive, listening stare.

  - id: picker_drifters_dead_signal_chaser_m03
    name: picker drifters dead signal chaser m03
    role: Dead Signal Chaser
    type: player_picker
    culture: drifters
    archetype: Dead Signal Chaser
    sex: male
    backdrop_poi: bone_wind
    appearance: >-
      Man, forties, mutant. Hollow wind-burnt face, deep-set eyes too
      wide and too steady. Long grey hair lashed back against the dust.
      Translucent skin at the temples showing faint phosphor veins. A
      muttering, distracted mouth. Always half-hearing the pulse.
