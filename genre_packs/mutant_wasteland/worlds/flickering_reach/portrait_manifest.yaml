  - id: picker_scrapborn_salvage_leader_m01
    name: picker scrapborn salvage leader m01
    role: Ruin Diver
    type: player_picker
    culture: scrapborn
    archetype: Ruin Diver
    sex: male
    backdrop_poi: the_rusted_junction
    appearance: >-
      Man, twenties. Pale dust-and-grease face under a mop of wire-tied
      red hair, a careless grin. Goggles pushed up on the forehead.
      Thin and wiry, a smear of soot along the jaw. Bright eyes that
      have already spotted the exit.

  - id: picker_scrapborn_tinker_f02
    name: picker scrapborn tinker f02
    role: Wasteland Trader
    type: player_picker
    culture: scrapborn
    archetype: Wasteland Trader
    sex: female
    backdrop_poi: the_bright_junction
    appearance: >-
      Woman, fifties. Lean brown calculating face, close-cropped grey
      hair, pre-war reading lenses pushed down the nose to look over.
      Copper clan-tattoos at the jaw. A dry, transactional smile.
      Hands marked with the small burns of a working tinker.

  - id: picker_scrapborn_tech_cultist_m02
    name: picker scrapborn tech cultist m02
    role: Tech Cultist
    type: player_picker
    culture: scrapborn
    archetype: Tech Cultist
    sex: male
    backdrop_poi: the_copper_haul
    appearance: >-
      Man, thirties, mutant. Gaunt fervent face lit copper from below,
      one eye replaced by a salvaged brass lens that catches the light.
      Shaved scalp inscribed with circuit-ink whorls. Wire filaments
      braided into a short beard. A zealot's fixed stare.

  # ── Picker · Vaultborn ─────────────────────────────────────────

  - id: picker_vaultborn_protocol_warden_m01
    name: picker vaultborn protocol warden m01
    role: Protocol Warden
    type: player_picker
    culture: vaultborn
    archetype: Protocol Warden
    sex: male
    backdrop_poi: silent_vault
    appearance: >-
      Man, indeterminate age. Pale never-weathered face that doesn't
      move quite right, flat colourless eyes blinking a beat too slow.
      Sterile pallor, fine bloodless features, hair cut to regulation
      length. An expression composed entirely of approved phrases.

  - id: picker_vaultborn_protocol_warden_f01
    name: picker vaultborn protocol warden f01
    role: Protocol Warden
    type: player_picker
    culture: vaultborn
    archetype: Protocol Warden
    sex: female
    backdrop_poi: silo_prime
    appearance: >-
      Woman, indeterminate age. Smooth bunker-pale face, symmetrical to
      the point of unease, grey eyes that catalogue rather than meet.
      Colourless hair pinned flat and exact. Bloodless lips, no
      expression she hasn't been authorised to wear.

  - id: picker_vaultborn_wandering_synth_f02
    name: picker vaultborn wandering synth f02
    role: Wandering Synth
    type: player_picker
    culture: vaultborn
    archetype: Wandering Synth
    sex: female
    backdrop_poi: vault_echo_shaft
    appearance: >-
      Woman, ageless, synthetic. Too-perfect porcelain face, faint seam
      lines at the hairline and jaw, eyes with a slow pale phosphor
