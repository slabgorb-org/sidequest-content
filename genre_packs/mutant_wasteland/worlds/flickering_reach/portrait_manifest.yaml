  - id: picker_scrapborn_rain_catcher_broker_f01
    name: picker scrapborn rain catcher broker f01
    role: Rain-Catcher Broker
    type: player_picker
    culture: scrapborn
    archetype: Rain-Catcher Broker
    sex: female
    backdrop_poi: toods_dome
