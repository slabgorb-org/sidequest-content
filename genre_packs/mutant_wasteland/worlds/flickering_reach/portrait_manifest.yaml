    name: picker greenfolk communion speaker m01
    role: Village Elder
    type: player_picker
    culture: greenfolk
    archetype: Village Elder
    sex: male
    backdrop_poi: the_blooming_tangle_canopy
    appearance: >-
      Man, indeterminate age, mutant. Deep green weathered face, slow
      deliberate eyes lit with a faint internal glow. Small soft leaves
      sprouting from the shoulders and one temple. Lichen stippling the
      cheekbones. A serene, listening half-smile.

  - id: picker_greenfolk_root_tender_m02
    name: picker greenfolk root tender m02
    role: Root Tender
    type: player_picker
    culture: greenfolk
    archetype: Root Tender
    sex: male
    backdrop_poi: the_understory_heart
    appearance: >-
      Man, young, mutant. Pale green-washed face, wide chloroplast eyes
      with a dim glow, an open earnest expression. A fungal cap budding
      at the hairline, fine spores on the brows. Mycelium-traced jaw.
      Cheeks faintly luminous in the root-light.

  - id: picker_greenfolk_beastkin_scout_f02
    name: picker greenfolk beastkin scout f02
    role: Beastkin Scout
    type: player_picker
    culture: greenfolk
    archetype: Beastkin Scout
    sex: female
    backdrop_poi: sporecap_garden
    appearance: >-
      Woman, twenties, mutant. Smooth jade-green face, alert dark eyes
      ringed with pale luminescence. Hair replaced by a dense crown of
      fine ferns and tendrils. Faint vine-scarring down one cheek. A
      quick, watchful tilt of the head.

