            steppe receding to a flat horizon on the living side,
            black mirror-surface extending toward a distant green
            smear on the glass side. Thin overhead light.
          backdrop: >-
            A razor-sharp ridge on open steppe — dead black glass on
            one side, living grey soil on the other, angular warning
            carvings along the crest, bioluminescent root-tendrils
            crossing from the living side and cracking the glass,
            green glow at intrusion points, the glass extending
            toward a distant green smear.
        environment:
          solo: >-
            The ridge as a sensory boundary — on the glass side, dead
            silence and cold mineral air; on the living side, wind
            and the smell of dry grass and distant soil. Standing on
            the ridge itself, both atmospheres press against the body
            simultaneously. The roots crossing the line emit a faint
            wet creak as they extend into the glass, and where they
            crack it, a thin bell-tone rises. The carving-glyphs worn
            smooth by twelve centuries of wind but still legible as
            warning.
          backdrop: >-
            Sensory boundary — dead silence and cold on the glass side,
            wind and dry grass on the living side, root-creak and thin
            bell-tone where tendrils crack the glass, worn warning
            glyphs in the ridge stone.
      - name: Conclave's Breath
        slug: conclaves_breath
        region: przyå_dust
        type: road
        description: >-
          The choking passage through irradiated dust downwind of the
          Glass Flat. The Signal is loudest here: a voice speaking a
          status report in a dead language, over and over, unhurried.
          Travelers who stay too long stop being sure whose voice
          they are hearing.
        visual_prompt:
          solo: >-
            Wide landscape view of a narrow passage through dense
            irradiated dust under a low oppressive sky. Foreground:
            grey radioactive powder banked in drifts against exposed
            rock outcrops, the powder surface rippled by a constant
            low wind, corroded metal stakes marking the path — each
            stake bleeding rust into the grey powder around its base.
            Middle ground: the passage narrowing between low eroded
            ridges, visibility reduced to twenty meters by thick grey
            particulate haze, a lone figure hunched forward into the
            wind with a wet-hide wrap over nose and mouth, the dust
            coating everything in uniform grey. Background: the haze
            thickening to opacity, a sourceless phosphor-green glow
            suffusing the particulate from within — the Signal at its
            strongest here, the dust itself seeming to carry the green
            tint, the sky indistinguishable from the ground in the
            deepest haze. No text, no caption, no title, no writing,
            no labels, no watermark.
          backdrop: >-
            A narrow passage through irradiated dust — grey powder
            banked against rocks, corroded marker stakes bleeding
            rust, visibility reduced by thick particulate haze, a
            sourceless phosphor-green glow suffusing the dust from
            within, sky and ground merging in the deepest haze, the
            Signal made visible as green tint in the particulate.
        environment:
          solo: >-
            The Signal at its loudest — not heard with the ears but
            felt as a steady coherent vibration in the skull, a voice
            repeating at regular intervals in a cadence that sounds
            like a status report in no living language. Grey dust
            coating the throat and eyes, the alkaline burn of
            irradiated powder, visibility shrinking with each step
            deeper, the phosphor-green glow intensifying in the
            particulate until the air itself seems to be broadcasting.
          backdrop: >-
            The Signal vibrating in the skull — coherent and repeating,
            grey dust coating throat and eyes, alkaline burn, visibility
            shrinking, phosphor-green intensifying in the particulate
            until the air broadcasts.
