# Flickering Reach — World History & DM Prep
#
# SPOILER NOTE: This is the only fully-spoilable world in SideQuest.
# Everything here — arc structure, veteran chapter twists, the Signal's
# true nature — can be discussed openly in dev/playtest/notes.
#
# Source of truth for:
#  - points_of_interest → feeds POI image generator (chapters[].points_of_interest[])
#  - chapter arcs      → feeds narrator's campaign maturity prompts
#  - trope wiring      → references ids in this world's tropes.yaml

world_name: The Flickering Reach

overview: >-
  Three wounds define the Flickering Reach, each one a betrayal that
  reshaped the land and the people on it. Twelve centuries of grudges,
  held together by mutual need and the shared knowledge that every
  faction owes a debt to every other that cannot be repaid with anything
  but blood. The Long Signal hums under the static. The Understory
  grows. The vaults stay sealed — until they don't.

eras:
  - name: Before the Unsealing
    period: ancient
    summary: >-
      The steppe was open and green. The Drifters grazed their herds
      across it, following rain and season. The Vaultborn were sealed
      below in their bunker complexes, running on pre-war protocols
      and recycled air. The Scrapborn hadn't coalesced yet — just
      scattered scavengers picking through the bones of the old world.
      The surface and the underground coexisted by ignoring each other.

  - name: The Unsealing of Silo Prime
    period: 1200 years ago
    summary: >-
      The Third Conclave — a half-sentient maintenance AI governing
      Silo Prime — attempted to unseal the bunker and reclaim the
      surface. The reactor detonated. The upper silo levels vaporized.
      A plume of mutagenic isotopes swept the eastern steppe. The
      earth fused into forty miles of black glass that still hums on
      windless nights. The Drifters caught in the fallout mutated —
      their mounts grew extra limbs, their singers began hearing
      voices in radio static. The Vaultborn sealed their remaining
      bunkers tighter and declared the surface a failed experiment.

  - name: The Rooting of Noce's Hub
    period: 600 years ago
    summary: >-
      The Greenfolk elder Kuinem the Overgrown fed pre-war biotech
      from Lab Sigma to the earth beneath the Scrapborn city of Noce's
      Hub. A hyper-aggressive root network erupted overnight, crushing
      steel beams, splitting concrete, and entombing hundreds in
      cocoons of living wood. The Scrapborn rebuilt at Tood's Dome
      and swore vengeance. The Greenfolk called it healing. The root
      network — the Understory — is still growing, still thinking,
      and still whispering "peace in the green" to anyone who
      presses their ear to its bark.

  - name: The Bargain at Blind Reach
    period: 300 years ago
    summary: >-
      A decade-long drought drove the Drifters to Vault Echo, where
      the Vaultborn controlled the only working moisture harvester.
      The price: a yearly tithe of Drifter children to replenish the
      Vaultborn gene pool. For forty years the tithe was paid — children
      disappeared into the vault and emerged as numbered strangers with
      perfect teeth and no memories of sky. Karta of the Red Dust ended
      it by sabotaging the harvester from within and delivering the
      control-seed to the Scrapborn at Tood's Dome. They reverse-
      engineered it into rain-catchers and charged everyone for the
      privilege.

  - name: The Present Day
    period: now
    summary: >-
      The Flickering Reach is a web of grudges held together by mutual
      need. The Vaultborn at Vault Echo have sealed their doors — no
      one has entered in a century, and strange lights pulse from the
      main shaft at night. The Drifters ride the wastes on grotesque
      mounts, their singers pulling intelligence from radio static.
      The Scrapborn tinker and trade from Tood's Dome, their rain-catcher
      monopoly making them indispensable and universally resented. And
      the Greenfolk press outward from the Blooming Tangle, their roots
      converting wasteland into alien jungle. The rain-catchers work.
      The roots spread. The glass plain hums. The Reach flickers on.

# ─────────────────────────────────────────────────────────────────────
# CAMPAIGN STRUCTURE
# Three chapter tiers keyed to session ranges and narrative maturity.
# Each tier has its own stakes, POIs, and trope progressions.
# ─────────────────────────────────────────────────────────────────────

chapters:
  # ───────────────────────────────────────────────────────────────────
  # EARLY (Sessions 1-5): Rust, dust, and a bad trade
  # ───────────────────────────────────────────────────────────────────
  - id: early
    label: "The Rain-Catcher Debt"
    session_range: [1, 5]
    location: "Tood's Dome and the Przyå Dust corridor"
    atmosphere: >-
      Hammered sheet metal gleaming under rain-catcher arrays. Haggling
      in three trade-pidgins at once. Dust on everything, even the
      inside of your teeth. The arc-lights of The Bright Junction flicker
      when the wind changes. Every price is negotiable and every
      negotiation is a small war.
    active_stakes: >-
      The Dome Syndicate just raised water tariffs by thirty percent.
      Three border settlements are whispering about a coalition. A
      Greenfolk "accident" took out a rain-catcher near the Burn Line
      last week. Odige Fuseborn is looking for deniable muscle.
    character:
      archetype: Wasteland Trader
      name: ""
      culture: Scrapborn or Drifter outsider
      level: 2
      hp: 18
      max_hp: 18
      ac: 12
      backstory: >-
        Owes the Dome Syndicate more water-credit than they can repay.
        The rain-catcher on their caravan broke two weeks ago, and
        Odige's collection crew is three days behind them on the Wiej
        Trail. They need a score, a patron, or a miracle — and the
        Reach only ships one of those in any volume.
      personality: >-
        Pragmatic, mouthy, and deeply superstitious about radio static.
        Laughs at funerals, cries at auctions.
      items:
        - scavenged_revolver
        - leather_duster_patched
        - geiger_charm
        - canteen_half_full
        - coil_of_copper_wire
        - {catalog: salvage_knife, name: "Rust Tooth", lore: "Took it off a Scrapborn collector who had worse luck than them."}
      gold: 8  # water-credits, locally
      affinities:
        Scrap: {tier: 1, progress: 4}
        Signal: {tier: 0, progress: 2}
        Green: {tier: 0, progress: 0}
        Vault: {tier: 0, progress: 0}
        Dust: {tier: 0, progress: 3}
    npcs:
      - archetype: Wasteland Trader
        name: Odige Fuseborn
        location: Tood's Dome, the Dome Syndicate counting house
        disposition: 0
        personality: >-
          Merchant-engineer. Smiles like a hinge opening. Believes every
          problem can be priced and most can be bought twice.
      - archetype: Ruin Diver
        name: Darty Ironlung
        location: The Rusted Junction excavation
        disposition: -5
        personality: >-
          Crew boss with a pre-war rebreather fused to her jaw. Speaks
          in work-orders. Her crews don't complain twice.
      - archetype: Beastkin Scout
        name: Lestera Såajäkin
        location: The Przyå Dust, anywhere the wind is going
        disposition: 10
        personality: >-
          Red Dust rider with three eyes and a seven-limbed mount. Hates
          the Syndicate. Will sell news for water but never for credit.
      - archetype: Wandering Synth
        name: Which-zero
        location: Trade-lock kiosk outside Vault Echo
        disposition: 5
        personality: >-
          A numbered Vaultborn functionary whose face doesn't quite move
          right. Speaks only in approved phrases. Nobody has ever seen
          it blink.
    points_of_interest:
      - name: Tood's Dome
        slug: toods_dome
        region: toods_dome
        type: settlement
        description: >-
          A Scrapborn trade-city roofed inside a half-collapsed pre-war
          stadium, its overhead a patchwork of hammered sheet metal and
          glittering rain-catcher arrays. The main market fills the
          old infield; arc-light towers burn along what used to be
          the concourse. Every stall has two prices and three lies.
        visual_prompt:
          solo: >-
            Wide elevated view of a scrap-metal trade city built inside
            a half-collapsed pre-war sports stadium. Foreground: dense
            market stalls of corrugated iron, oil-drum counters,
            salvage-wire scales, bolts of sun-faded cloth draped between
            rebar poles. Middle ground: the old infield packed with
            traders under a patchwork overhead of hammered sheet metal
            and glass rain-catcher arrays catching thin light, arc-light
            towers rising from the cracked concourse ring, their glow
            copper-amber. Background: the stadium's broken upper rim
            open to a bruised sky, scrap-welded catwalks spanning the
            gaps, a faint phosphor-green haze above the dome's apex
            where moisture condenses on the catcher arrays. Twelve
            centuries of accreted salvage visible in the layered walls —
            no clean surface anywhere. No text, no caption, no title,
            no writing, no labels, no watermark.
          backdrop: >-
            A scrap-metal trade dome interior — hammered sheet-metal
            roof overhead with rain-catcher glass arrays, arc-light
            towers glowing copper-amber, dense market stalls of
            corrugated iron and rebar, twelve centuries of accreted
            salvage layered in the walls, faint phosphor-green haze
            above under a bruised sky visible through the broken rim.
        environment:
          solo: >-
            Copper-amber arc-light glow filtered through moisture on
            rain-catcher glass, warm lamp-light from below competing
            with thin sky-light from the broken rim above, the clang
            of salvage-hammer on sheet metal, the smell of machine oil
            and hot copper and dust-on-iron, a background static hum
            from a dozen jury-rigged radios all tuned to different
            dead channels.
          backdrop: >-
            Warm copper-amber glow, layered salvage surfaces, the hum
            of arc-light towers and distant radio static, oil and hot
            metal in the air.
      - name: The Bright Junction
        slug: the_bright_junction
        region: the_bright_junction
        type: outpost
        description: >-
          A Scrapborn outpost built around a still-functioning pre-war
          electrical substation. The arc-lights burn all night. Moths
          the size of hands circle them, their wings humming at a
          frequency that makes dogs whine. The Burn Line begins where
          the arc-light ends.
        visual_prompt:
          solo: >-
            Wide landscape view of a fortified outpost built around a
            pre-war electrical substation at night. Foreground: coiled
            razor-wire atop stacked concrete barriers, a guard booth
            of welded plate-steel with a rifle slit. Middle ground:
            the substation itself — massive ceramic insulators on
            rust-pitted steel frames, transformer housings trailing
            jury-rigged cable runs, three tall arc-light towers blazing
            white-blue against the dark, hand-sized moths with pale
            translucent wings circling in dense spirals around the
            lights. Background: a ring of scrap-built shelters and
            workshops under the arc-light wash, the darkness beyond
            absolute and flat where the light abruptly ends, a faint
            green-phosphor line at the horizon. No text, no caption,
            no title, no writing, no labels, no watermark.
          backdrop: >-
            A fortified outpost at night — massive arc-light towers
            blazing white-blue, pre-war substation insulators and
            transformer housings, hand-sized moths spiraling in the
            light, scrap-built shelters in the wash, absolute darkness
            beyond the light perimeter.
        environment:
          solo: >-
            Harsh white-blue arc-light from above drowning all shadow,
            the electric crackle and transformer hum of pre-war power
            still running, the papery flutter of oversized moth wings,
            a subsonic frequency felt in the chest and teeth, ozone
            and hot ceramic insulator smell, the crisp border where
            light ends and the wasteland dark begins.
          backdrop: >-
            White-blue arc-light wash, electric hum and moth-wing
            flutter, ozone smell, the hard edge between illumination
            and absolute dark.
      - name: The Burn Line
        slug: the_burn_line
        region: the_bright_junction
        type: frontier
        description: >-
          A contested no-man's-strip between Scrapborn burn-crews and
          the advancing root-network of the Blooming Tangle. Charred
          vegetation, the acrid smell of herbicidal fire-gel, and new
          tendrils already pushing green through yesterday's ash.
        visual_prompt:
          solo: >-
            Wide landscape view of a contested frontier strip at dusk.
            Foreground: blackened earth and charred root stumps, pools
            of congealed fire-gel with an amber sheen, a discarded
            flamethrower nozzle trailing a rubber hose. Middle ground:
            the boundary itself — a ragged line where charred ash
            meets aggressive green growth, thick bioluminescent
            tendrils pushing through cracked black soil, new shoots
            already a foot tall with pale green veins pulsing faintly,
            smoke still rising from a recent burn in thin grey columns.
            Background: on the left, the dense wall of a mutated
            jungle canopy glowing in soft polychromatic bioluminescence;
            on the right, flat scorched wasteland receding toward
            distant arc-light towers. A bruised amber sky with a faint
            phosphor-green tinge at the horizon. No text, no caption,
            no title, no writing, no labels, no watermark.
          backdrop: >-
            A contested frontier — charred earth and fire-gel pools on
            one side, aggressive bioluminescent tendrils pushing through
            ash on the other, smoke columns rising, the dense glow of
            mutated jungle canopy behind, distant arc-lights opposite,
            bruised amber sky.
        environment:
          solo: >-
            Acrid chemical fire-gel smoke layered over the sweet
            vegetal smell of fresh growth, dusk light filtered through
            a haze of ash particulate, the crackle of cooling embers,
            the faint wet sound of tendrils extending through soil,
            a sourceless green glow from the jungle side intensifying
            as the sky darkens.
          backdrop: >-
            Acrid smoke over sweet vegetal growth, ash haze, the
            crackle of embers and wet sound of advancing roots, green
            glow from the jungle side.
      - name: Bone Wind Waystation
        slug: bone_wind
        region: bone_wind
        type: waystation
        description: >-
          A Drifter waystation on the open steppe where three trails
          converge. Towering cairns of bleached mount-bones lean into
          the wind. Salvage-wire harps hum between them, tuned by
          singer-riders to catch the Long Signal's eastern voice.
        visual_prompt:
          solo: >-
            Wide landscape view of a nomadic waystation on a flat open
            steppe under a high pale sky. Foreground: beaten-earth
            crossroads where three trails converge, hoof-prints of
            large multi-limbed beasts pressed into dust, a ring of
            flat stones around a cold fire-pit. Middle ground: three
            towering cairns of bleached bone — massive ribcages,
            femurs the length of a person, vertebrae stacked and
            leaning into the prevailing wind — with salvage-wire harps
            strung between them, the wires catching thin light. A
            small camp of hide-and-salvage tents in the cairns' lee.
            Background: flat unbroken steppe to every horizon, dust
            streaks carried on a visible wind, a faint phosphor-green
            shimmer low on the eastern horizon. No text, no caption,
            no title, no writing, no labels, no watermark.
          backdrop: >-
            A nomadic waystation on open steppe — towering cairns of
            bleached mount-bones with salvage-wire harps strung between
            them, hide-and-salvage tents in their lee, flat steppe to
            every horizon, dust streaks on the wind, faint phosphor-green
            shimmer at the eastern horizon.
        environment:
          solo: >-
            Constant dry wind from the north carrying fine bone-dust
            and alkaline grit, the low harmonic drone of wire harps
            vibrating in the gusts, thin cold light with no warmth,
            the smell of bleached bone and dried hide, a faint
            subsonic pulse felt in the sternum when the wire catches
            a particular frequency — the radio signal bleeding through
            the physical world.
          backdrop: >-
            Dry northern wind, harmonic wire-harp drone, thin cold
            light, bone-dust and dried hide smell, a subsonic pulse
            in the chest from the signal bleeding through.
      - name: The Przyå Dust
        slug: the_przya_dust
        region: przyå_dust
        type: wasteland
        description: >-
          A belt of grey, mildly radioactive powder downwind of the
          Glass Flat. Nothing grows here. Metal crumbles to rust within
          weeks. Drifter caravans cross it wrapped in wet hide, navigating
          by radio static and the taste of alkaline wind.
        visual_prompt:
          solo: >-
            Wide landscape view of a flat radioactive dust plain under
            a low overcast sky. Foreground: grey powder surface with
            no vegetation, a half-collapsed metal pole crumbling to
            rust-flake at its base, wind-carved ripples in the powder
            like frozen waves. Middle ground: a caravan of four
            multi-limbed beasts wrapped in wet hide blankets, riders
            hunched under hoods, crossing single-file through a low
            grey dust-cloud stirred by their passage. Background: the
            plain extending to a flat featureless horizon, the sky a
            uniform bruised grey-violet, no sun position resolvable,
            a faint phosphor-green smear at the eastern edge where
            the dust thins toward the distant glass plain. The air
            thick with fine particulate giving everything a soft
            unfocused edge. No text, no caption, no title, no writing,
            no labels, no watermark.
          backdrop: >-
            A flat radioactive dust plain — grey powder with wind-carved
            ripples, crumbling metal remnants, a caravan of hide-wrapped
            multi-limbed beasts crossing single-file through low dust,
            bruised grey-violet sky, faint phosphor-green smear at the
            horizon, everything soft-edged with particulate haze.
        environment:
          solo: >-
            Grey particulate haze reducing visibility to a quarter mile,
            the alkaline taste of irradiated powder on the tongue and
            in the sinuses, no sound but wind and the muffled footfalls
            of beasts on powder, a faint static crackle that rises and
            falls in waves from the east, the feeling of metal
            corroding — belt buckles pitting, knife edges going soft.
          backdrop: >-
            Grey particulate haze, alkaline dust taste, wind and muffled
            footfalls, static crackle rising from the east, the slow
            corrosion of metal on the body.
      - name: The Copper Haul
        slug: the_copper_haul
        region: toods_dome
        type: road
        description: >-
          A well-patrolled Scrapborn supply road rutted by salvage-cart
          wheels. Arc-light towers at intervals keep the nights bright
          enough that raiders don't bother. It is the only safe road
          in the Reach, and everyone pays the Syndicate for the safety.
        visual_prompt:
          solo: >-
            Wide landscape view of a well-maintained supply road cutting
            across flat wasteland at twilight. Foreground: deep ruts in
            packed earth from heavy salvage-cart wheels, copper cable
            bundles stacked on a parked flatbed cart with iron-strap
            wheels, a toll-post of welded rebar with a tin collection
            box. Middle ground: the road stretching straight ahead,
            arc-light towers at regular intervals casting overlapping
            pools of white-blue light, a patrol of two armed figures
            in heavy scrap-plate armor walking the shoulder. Background:
            flat dry wasteland on either side receding into darkness
            beyond the arc-light perimeter, the road diminishing to a
            point beneath a bruised amber sky with the towers' lights
            forming a bright corridor to the horizon. No text, no
            caption, no title, no writing, no labels, no watermark.
          backdrop: >-
            A supply road at twilight — deep cart ruts in packed earth,
            arc-light towers casting overlapping white-blue pools,
            armed patrol figures in scrap-plate armor, copper cable
            bundles on a parked flatbed, the road forming a bright
            corridor through flat dark wasteland.
        environment:
          solo: >-
            White-blue arc-light overhead in rhythmic pools with brief
            dark gaps between, the creak of overloaded cart axles, the
            crunch of boots on packed earth, a faint copper tang in the
            air from exposed cable ends, the comfort of regular
            illumination against the absolute dark of unlit wasteland
            pressing in from both sides.
          backdrop: >-
            Rhythmic arc-light pools with dark gaps, cart-axle creak,
            boots on packed earth, copper tang, the comfort of light
            against pressing wasteland dark.
    tropes:
      - id: scrapborn_empire
        status: active
        progression: 0.10
        notes:
          - "Water tariff hike announced at Tood's Dome council."
          - "Three border settlements talking coalition over distilled beer."
      - id: understory_hunger
        status: active
        progression: 0.08
        notes:
          - "Roots breached a rain-catcher on the Burn Line two weeks ago."
      - id: the_long_signal_wakes
        status: dormant
        progression: 0.03
        notes:
          - "A Drifter singer at Bone Wind heard a word in the static. Would not repeat it."
      - id: vault_heresy
        status: dormant
        progression: 0.00

  # ───────────────────────────────────────────────────────────────────
  # MID (Sessions 6-15): The three wounds reopen at once
  # ───────────────────────────────────────────────────────────────────
  - id: mid
    label: "Three Wounds Open"
    session_range: [6, 15]
    location: "The Glass Flat, the Blooming Tangle, and the Tithe Road"
    atmosphere: >-
      The black glass hums a new note at dawn. The roots have reached
      places they've never reached. A sealed vault door at Silent Vault
      shows scratches on the inside. Every faction is looking east,
      toward Silo Prime, and pretending they aren't. Dust storms carry
      a coherent whisper now. The singers are not sleeping.
    active_stakes: >-
      Darty Ironlung's excavation at the Rusted Junction is finding
      pre-war hardware that moves when it isn't watched. The Greenfolk
      are staging pilgrimages to growth-fronts the Syndicate thought
      were dormant. A young Vaultborn in unfamiliar surface gear has
      appeared at the Tood's Dome trade-lock, asking for "anyone who
      trades with the Dome Syndicate." Åych Przysåuchkin has sent
      runners to every settlement and is waiting, publicly, for an
      answer that has not come.
    character:
      level: 5
      hp: 42
      max_hp: 42
      ac: 14
      milestones_earned:
        - "triumph:Paid off the rain-catcher debt"
        - "discovery:Found pre-war data tapes in the Rusted Junction"
        - "connection:Earned Lestera's trust on the Wiej Trail"
        - "survival:Walked the Przyå Dust without a rebreather"
    npcs:
      - archetype: Tech Cultist
        name: Åych Przysåuchkin
        location: Bone Wind Waystation, under the wire harps
        disposition: 15
        personality: >-
          Ancient singer, seven-limbed mount, eyes that track radio
          sources across the horizon. Speaks in half-sentences, finishes
          each one with a hum you can feel in your teeth.
      - archetype: Village Elder
        name: Päan Sporecap
        location: Sporecap Garden, the nursery's inner ring
        disposition: 5
        personality: >-
          Greenfolk elder with mycelium threading through one socket
          and out the other. Claims to have heard the Understory laugh.
          Has not stopped smiling since.
      - archetype: Wandering Synth
        name: The Vaultborn Emissary
        location: Tood's Dome trade-lock, blinking in the arc-light
        disposition: 0
        personality: >-
          Young, terrified, carrying a sealed message and a vault-standard
          sidearm that still works perfectly. Asks questions the Protocols
          forbid.
    points_of_interest:
      - name: The Rusted Junction Excavation
        slug: the_rusted_junction
        region: toods_dome
        type: dig_site
        description: >-
          A Scrapborn strip-mine pulled into the shadow of a pre-war
          atmospheric processor that should not be there. Tarpaulins
          flap in the dust. Arc-welders spit sparks that die without
          reason. Roots the thickness of a human arm push through
          concrete overnight and are cut back by morning.
        visual_prompt:
          solo: >-
            Wide elevated view of an open-pit excavation site in the
            shadow of a massive pre-war atmospheric processor tower.
            Foreground: terraced dig levels cut into rust-red earth,
            tarpaulins flapping loose from rebar stakes, a pile of
            freshly-cut root segments thick as a human arm with pale
            green sap weeping from the ends. Middle ground: workers
            in heavy goggles and leather aprons operating arc-welders
            on exposed pre-war infrastructure — pipe bundles, conduit
            runs, a half-unearthed turbine housing — orange sparks
            scattering. Roots push through cracked concrete along the
            pit walls, already regrowing where yesterday's cuts were
            made. Background: the atmospheric processor rising dark
            and angular against a bruised amber sky, its intake vanes
            motionless, corroded surface twelve centuries deep, a faint
            phosphor-green haze gathering at its base. No text, no
            caption, no title, no writing, no labels, no watermark.
          backdrop: >-
            An open-pit excavation — terraced rust-red earth, flapping
            tarpaulins, arm-thick roots pushing through cracked
            concrete, arc-welder sparks on exposed pre-war pipe
            infrastructure, a massive dark atmospheric processor tower
            rising behind against bruised amber sky, phosphor-green
            haze at its base.
        environment:
          solo: >-
            The sharp ozone of arc-welders cutting metal, dust from
            disturbed earth mixing with the sweet-sap smell of severed
            roots, tarpaulins snapping in irregular gusts, the
            intermittent clang of salvaged pipe being stacked, an
            unsettling stillness when the welders pause — sparks dying
            mid-air as if the atmosphere swallowed them, the roots
            making a faint wet creaking as they grow back in real time.
          backdrop: >-
            Arc-welder ozone and root-sap sweetness, tarpaulin snap,
            pipe clang, sparks dying in still air, the wet creak of
            roots regrowing.
      - name: The Glass Flat
        slug: the_glass_flat
        region: glass_flat
        type: wasteland
        description: >-
          Forty miles of fused black glass ringing like a struck bell
          when the wind hits it right. Collapsed silo levels hang
          beneath the surface like frozen organs in dark amber. At
          the center, a vast green eye blinks slowly. Nobody agrees
          on how long between blinks.
        visual_prompt:
          solo: >-
            Wide landscape view of an immense plain of fused black glass
            under a sourceless pre-dawn sky. Foreground: the glass
            surface dust-glazed but unweathered, reflecting a pale sky
            in dark mirror-sheen, hairline fractures running in radial
            patterns outward, a single figure's boot-print visible as
            a dust disturbance on the surface. Middle ground: beneath
            the translucent glass, collapsed cylindrical silo levels
            frozen at angles like dark organs suspended in amber —
            pipe-runs, gantries, walkways all fused in place twelve
            centuries ago. Background: the flat extends to every
            horizon with no feature except, at the exact center of
            the composition, a vast pupil of living green light pulsing
            slowly upward through the glass — the green eye — its glow
            reflected once in the glass surface and a second time as a
            tint in the haze above. No sun position resolvable. No
            text, no caption, no title, no writing, no labels, no
            watermark.
          backdrop: >-
            An immense fused black-glass plain — dust-glazed mirror
            surface with radial fractures, collapsed silo levels
            frozen beneath like organs in amber, a vast pupil of
            living green light pulsing at the center, its glow
            reflected in the glass and tinting the haze above,
            sourceless pre-dawn sky, no horizon features.
        environment:
          solo: >-
            Absolute silence broken only by the glass singing — a deep
            bell-tone when wind crosses the surface at the right angle,
            felt in the bones before the ears register it. No smell
            but cold mineral. The air thin and dry. Underfoot the glass
            is unnaturally smooth, refusing erosion. A faint green
            pulse visible at the periphery of vision, never when looked
