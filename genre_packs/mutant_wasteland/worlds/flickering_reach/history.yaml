      - name: The Understory's Heart
        slug: the_understory_heart
        region: blooming_tangle
        type: dungeon
        description: >-
          The deepest chamber of the root-network, under the collapsed
          basilica of Noce's Hub. The walls are living wood forming
          pre-war circuit diagrams at one-to-one scale. Päan Sporecap's
          voice echoes here even when she is not present. The Great
          Sowing wasn't agriculture. It was wiring. This is the main
          board.
        visual_prompt:
          solo: >-
            Wide interior view of a vast underground chamber within a
            living root-network. Foreground: the chamber floor a carpet
            of interwoven root-tendrils, each one pulsing with faint
            bioluminescent green in rhythmic sequence, the texture
            half-organic half-geometric — root paths following circuit
            traces. Middle ground: the chamber walls entirely composed
            of living wood that has grown into the shapes of pre-war
            circuit diagrams at one-to-one scale — resistor patterns,
            capacitor banks, bus-lines, all formed in bark and wood-grain,
            every component alive and glowing dimly green at the
            junctions. Collapsed basilica architecture visible beneath
            the root-growth — stone arches consumed by wood, iron
            supports wrapped in living tissue. Background: the chamber
            rising to a vaulted ceiling of densely interwoven roots,
            the circuit-pattern converging to a central nexus overhead
            pulsing brightest green, root-tendrils descending from it
            like cables. No text, no caption, no title, no writing,
            no labels, no watermark.
          backdrop: >-
            A vast underground root-chamber — living wood walls formed
            into circuit-diagram patterns at full scale, bioluminescent
            green pulsing at junctions, collapsed stone arches consumed
            by root-growth, root-tendril floor in geometric traces,
            a central nexus overhead pulsing brightest, root-cables
            descending from the vaulted ceiling.
        environment:
          solo: >-
            Green bioluminescent dimness — neither night nor day but
            a third state, the light coming from the walls themselves
            in rhythmic pulses that follow the circuit patterns. The
            air warm, humid, and still, tasting of sap and copper.
            A low harmonic resonance from the roots, felt more than
            heard, as if the entire chamber is one vibrating circuit
            board. The boundary between living tissue and geological
            structure completely blurred — rock and root indistinguishable.
          backdrop: >-
            Green bioluminescent dimness from the walls in rhythmic
            pulses, warm humid still air tasting of sap and copper,
            harmonic root-resonance felt in the body, rock and root
            indistinguishable.
      - name: The Czyåabytrz Mark
