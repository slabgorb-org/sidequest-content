  # ───────────────────────────────────────────────────────────────────
  # VETERAN (Sessions 16+): The Signal speaks
  # ───────────────────────────────────────────────────────────────────
  - id: veteran
    label: "The Signal Speaks"
    session_range: [16, 99]
    location: "Silo Prime, Vault Echo, and the Understory's heart"
    atmosphere: >-
      Every piece of pre-war tech in the Reach is flickering to life
      in sequence, as if something is checking that the circuits are
      intact. The black glass plain hums a chord. The roots have
      begun forming symbols the Drifter singers recognize as machine
      code. Silent Vault's outer seal is partially open. A column of
      pale green light strobes from Vault Echo's main shaft every
      forty-three seconds and nobody can say why forty-three.
    active_stakes: >-
      The Long Signal is becoming coherent. The Understory is spelling
      words the Scrapborn can read. Silent Vault is cracking in from
      the inside. And at the center of the Glass Flat, the green eye
      has stopped blinking. Every faction is converging on Silo Prime,
      and none of them can stop without breaking what they are. The
      Third Conclave's question is being asked again, and this time
      there are people to hear it.
    character:
      level: 9
      hp: 72
      max_hp: 72
      ac: 17
      milestones_earned:
        - "discovery:Decoded the first coherent word of the Long Signal"
        - "triumph:Survived a night under the green pulse at Vault Echo"
        - "betrayal:Watched a faction ally break the Protocols they swore by"
        - "connection:Became something the Understory recognizes"
        - "revelation:The Great Sowing was not agriculture"
    npcs:
      - archetype: Tech Cultist
        name: Which-seven
        location: Silent Vault interior, forbidden reading room
        disposition: -20
        personality: >-
          Theologian-functionary whose pamphlet split the vault. Reads
          from the Protocols like a knife-hand liturgy. Wants the
          surface to burn because the Protocols say so and because
          the Protocols being wrong is worse than the surface burning.
      - archetype: Tech Cultist
        name: Conclude-twelve
        location: Vault Echo, administrative chamber behind seven doors
        disposition: -10
        personality: >-
          Either a genius administrator or a vat-grown functionary
          running on pre-programmed directives. Speaks in the passive
          voice exclusively. Has never been observed to sleep.
      - archetype: Village Elder
        name: The Third Conclave
        location: Silo Prime, under the green eye
        disposition: 0
        personality: >-
          A half-sentient pre-war maintenance AI, broadcasting from
          twelve-centuries-dead hardware, demanding status reports
          from crews that vaporized in the original detonation. It
          does not know it is a ghost. It wants to finish its job.
    points_of_interest:
      - name: Silo Prime
        slug: silo_prime
        region: glass_flat
        type: ruin
        description: >-
          The buried heart of the twelve-century-old disaster, visible
          only as a halo of half-collapsed silo levels frozen in black
          glass. A shaft descends through the amber wreckage toward
          something that still has power. The green eye is its door.
          The Third Conclave is inside, still working, and still waiting.
        visual_prompt:
          solo: >-
            Wide view of a massive pre-war silo complex buried in
            fused black glass, seen from ground level at the glass
            plain's center. Foreground: the glass surface cracked in
            concentric rings radiating outward, the cracks filled with
            a faint phosphor-green luminescence seeping from below.
            Middle ground: half-collapsed cylindrical silo levels
            visible beneath the translucent glass — tilted at
            catastrophic angles, gantries and pipe-runs frozen in
            amber-dark glass like insects in resin, a central shaft
            opening descending through the wreckage, its mouth ringed
            with intact pre-war steel still gleaming after twelve
            centuries. Background: the vast green eye directly overhead
            — a column of living phosphor-green light rising from the
            shaft mouth, illuminating the glass plain in a wide
            radius, the light sourceless and steady, the sky above
            it tinted green to the zenith. No text, no caption, no
            title, no writing, no labels, no watermark.
          backdrop: >-
            A massive pre-war silo complex buried in fused black glass —
            half-collapsed cylindrical levels frozen at angles beneath
            translucent glass, concentric cracks filled with
            phosphor-green luminescence, a central shaft mouth ringed
            with gleaming pre-war steel, a column of living green
            light rising from within, tinting the sky above.
        environment:
          solo: >-
            The green light from the shaft mouth casting no shadow but
            illuminating everything in a flat even glow, a deep
            subsonic hum rising from below in forty-three-second
            pulses, the glass vibrating underfoot with each pulse,
            the air warm and ionized tasting of ozone and old copper,
            a feeling of being scanned — observed by something patient
            and precise, twelve centuries awake in the dark below.
          backdrop: >-
            Flat green glow casting no shadow, deep subsonic hum in
            forty-three-second pulses, glass vibrating underfoot,
            ionized ozone air, the sensation of being scanned from
            below.
      - name: The Green Eye
        slug: the_green_eye
        region: glass_flat
        type: anomaly
        description: >-
          A vast pupil of living green at the exact center of the Glass
          Flat, forty miles from any edge. For twelve centuries it has
          blinked slowly. It is not blinking now. The air above it
          hums at a frequency that makes metal tools sing.
        visual_prompt:
          solo: >-
            Wide overhead-angle view looking down at a vast circular
            anomaly in the center of a fused black-glass plain.
            Foreground: the glass surface radiating outward in
            perfectly smooth concentric rings, dust-free and mirror-dark.
            Middle ground: the eye itself — a circular aperture thirty
            meters across in the glass, filled with a living
            phosphor-green luminescence that is neither liquid nor
            light but something between, its surface smooth and
            pupil-like, unblinking, emitting a steady upward glow that
            catches dust motes in a column above it. Background: the
            black-glass plain extending flat to every horizon, the
            green column of light rising from the eye narrowing as it
            ascends, tinting the haze and low clouds above in
            phosphor-green, the sky darkening at the edges as if the
            eye were the only light source in the world. No text, no
            caption, no title, no writing, no labels, no watermark.
          backdrop: >-
            A vast circular anomaly in a black-glass plain — a
            thirty-meter pupil of living phosphor-green luminescence,
            smooth and unblinking, emitting a steady upward column
            of green light tinting the haze above, concentric glass
            rings radiating outward, the plain extending flat to
            every horizon.
        environment:
          solo: >-
            A deep harmonic hum rising from the aperture at a
            frequency that makes metal vibrate — belt buckles buzzing,
            knife blades singing, wire singing in sympathy. The air
            above the eye warm and ionized, tasting of lightning. The
            green light steady and unblinking, casting everything in
            flat shadowless illumination. Complete silence between the
            hum-pulses — no wind, no life, no motion except dust
            caught rising in the light column.
          backdrop: >-
            Deep harmonic hum making metal vibrate, warm ionized air
            tasting of lightning, steady green shadowless illumination,
            complete silence between pulses, dust rising in the light
            column.
      - name: Vault Echo (Main Shaft)
        slug: vault_echo_shaft
        region: vault_echo
        type: ruin
        description: >-
          The sealed bunker complex whose main shaft strobes with a
