# Mutant Wasteland — pack bestiary (story 90-1)
#
# SRD-aligned combat stat blocks for the awn ruleset module. Encountergen
# samples these for the Monster Manual encounters pool (free-play reachable
# hostiles); narrative layers (OCEAN, visual prompt) are composed at
# generation time. Stats are faithful to Ashes Without Number Free Edition
# (Sine Nomine Publishing) foe tables — level == HD, hp == average (4.5/HD),
# ascending AC, morale on the 2d12 ladder. World creatures.yaml (e.g.
# flickering_reach) still takes precedence when present; this is the
# genre-tier floor.
#
# Genre tier rules (ADR-120): names here are genre-generic — no named
# world factions or POIs. World-specific hostiles belong in
# worlds/<slug>/ overrides.
entries:
  - id: wasteland_raider
    name: Wasteland Raider
    level: 1
    hp: 4
