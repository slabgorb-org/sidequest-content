    attack_bonus: 2
    damage: "1d8"
    move: "10m"
    morale: 8
    skill: 1
    save: 15
    role: scrap-armored highway raider
    tags: [human, raider]
    description: >-
      A roadside killer in tire-tread armor and somebody else's boots,
      rusty pistol out, eyeing what's worth taking off your corpse.
