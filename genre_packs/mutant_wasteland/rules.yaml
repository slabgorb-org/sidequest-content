tone: gonzo-sincere
lethality: moderate

# ── Ruleset binding (ADR-117 / epic 88) ─────────────────────────────
# Ashes Without Number (Sine Nomine, CC0). AWN personal combat IS Cities
# Without Number — the awn module subclasses cwn and inherits the d20-vs-AC
# attack, the four saves, and the Shock / Trauma / System Strain / Mortal &
# Major Injury lethality stack. `ruleset: awn` is the HONEST slug (it surfaces
# in OTEL spans, saves, and the GM panel); the mechanics are CWN's.
#
# magic_level removed (was `none`): the flag is retired per its own DRAFT note.
# Mutation-as-magic framing moves to Plan 2 (bespoke MutationPlugin) — see
# ./magic.yaml. Nothing in Plan 1 implies a live magic system.
ruleset: awn
awn:
  # AWN natively uses the standard six (design D4) — attribute_map is an identity
  # mapping from the canonical AWN attribute to the sheet label.
  attribute_map:
    STRENGTH: STR
    DEXTERITY: DEX
    CONSTITUTION: CON
    INTELLIGENCE: INT
    WISDOM: WIS
    CHARISMA: CHA
  system_strain:
    max_source: CONSTITUTION  # System Strain pool max = CON (AWN p.52)
    rest_recovery_per_night: 1
    first_aid_cost: 1
  trauma:
    default_trauma_target: 6   # Trauma Target 6 (AWN p.48)
    mortal_injury_rounds: 6     # 0 HP → die in 6 rounds, stabilize diff 8 (p.52)
    major_injury_save: physical

stat_generation: point_buy
point_buy_budget: 27

ability_score_names:
  - STR
  - DEX
  - CON
  - INT
  - WIS
  - CHA

allowed_classes:
  - Scavenger
  - Mutant
  - Pureblood
  - Wirewalker
  - Beastkin
  - Tinker

allowed_races:
  - Mutant Human
  - Pure Strain Human
  - Uplifted Animal
  - Plant Person
  - Synthetic
  - Hybrid

race_label: Stock
class_label: Calling


# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: negotiation
    label: "Wasteland Parley"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [haggle, bargain, barter, offer, deal, price, sell, buy, negotiate]
    on_intent_mismatch: warn
    category: social
    player_metric:
      name: leverage
      starting: 0
      threshold: 10
    opponent_metric:
      name: leverage
      starting: 0
      threshold: 10
    beats:
      - id: persuade
        label: "Make Your Case"
        kind: strike
        base: 2
        stat_check: CHA
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        kind: strike
        base: 3
        stat_check: STR
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      # concede_point: strategic retreat to reveal opponent's real goal — angle
      - id: concede_point
        label: "Concede a Point"
        kind: angle
        target_tag: "Real Goal Revealed"
        stat_check: CHA
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        kind: push
        stat_check: WIS
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player turns their back on the deal. Walking away."
    mood: tension

  - type: combat
    label: "Wasteland Brawl"
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [strike, attack, fight, kill, slay, swing, shoot, hit, stab]
    on_intent_mismatch: reprompt
    category: combat
    # AWN/CWN ablative-HP combat (epic 88, design §6.2): the brawl now resolves on
    # HP reaching 0, not a momentum dial. The momentum metrics below stay as the
    # beat-texture tempo (command of the fight); HP flows underneath via the strike
    # channel. This drops the pack from the dial COMBAT_PACKS calibration set by
    # design (§6.4) — mutant_wasteland intentionally has zero opposed_check now.
    resolution_mode: beat_selection
    win_condition: hp_depletion
    # A generic wasteland raider. All six ability scores present for AWN's four
    # saves (calibrated ≤10 per ADR-093). hp / armor_class / dexterity are reserved
    # CreatureCore-seed keys (dexterity feeds the 1d8+DEX initiative roll), exempt
    # from the stat ceiling.
    opponent_default_stats:
      STR: 10
      DEX: 10
      CON: 10
      INT: 10
      WIS: 10
      CHA: 10
      hp: 8
      armor_class: 12
      dexterity: 10
    # Momentum tempo — tracks command of the brawl, not lethality. HP is the
    # win condition; this is the beat-selection texture on top.
    player_metric:
      name: momentum
      starting: 0
      threshold: 7
    opponent_metric:
      name: momentum
      starting: 0
      threshold: 7
    beats:
      - id: attack
        label: "Attack"
        kind: strike
        base: 2
        stat_check: STR
        attack_bonus: 1
        combat_skill: 1
        damage_channel: strike
        effect: "deal damage to the target"
        narrator_hint: "Describe the blow connecting — gritty, physical, consequential."
      - id: defend
        label: "Defend"
        kind: brace
        base: 1
        stat_check: CON
        effect: "reduce incoming damage, hold position"
        narrator_hint: "Player braces or blocks. Show the impact absorbed."
      # flank: risky repositioning for better attack angle — angle (setup for next strike)
      - id: flank
        label: "Flank"
        kind: angle
        target_tag: "Positional Advantage"
        deltas:
          crit_fail:
            own: -2
        stat_check: DEX
        risk: "exposed if it fails — lose 2 momentum and become open to the next enemy beat"
        effect: "gain positional advantage"
        narrator_hint: "Risky repositioning for a better angle of attack."
      - id: mutant_ability
        label: "Use Mutation"
        kind: strike
        base: 4
        deltas:
          crit_fail:
            own: -2
        stat_check: WIS
        risk: "mutation instability — lose 2 momentum and narrate a visible side effect on failure"
        effect: "unleash mutation on target"
        narrator_hint: "The mutation manifests visibly. Show the cost as well as the power."
        # AWN Plan 2 §6.3 wiring marker (story 102-7): applying this beat
        # routes through the mutation engine (mutations.yaml catalog,
        # Strain cost, usage limits) via BeatSelection.mutation_id —
        # mechanical backing instead of bare risk-narration.
        mutation_resolution: true
      - id: flee
        label: "Flee"
        kind: push
        stat_check: DEX
        consequence: "escape combat, possible pursuit"
        narrator_hint: "Player breaks contact and runs. Not every fight needs a winner."
    mood: combat

  - type: chase
    label: Wasteland Pursuit
    # Spec 2026-05-20 confrontation-intent-validator
    intent_verbs: [chase, pursue, flee, run, escape, follow]
    on_intent_mismatch: reprompt
    category: movement
    player_metric:
      name: separation
      starting: 0
      threshold: 7
    opponent_metric:
      name: pursuit
      starting: 0
      threshold: 7
    beats:
      - id: scramble
        label: Scramble
        kind: push
        base: 2
        stat_check: DEX
        narrator_hint: Boots on dust, pickup tires spitting rocks.
      - id: shortcut
        label: Shortcut
        kind: push
        base: 3
        deltas:
          crit_fail:
            own: -2
        stat_check: INT
        risk: "Dead end in the rubble — lose 2 separation"
      # distraction: throw a flare, scatter scrap — angle (misdirection tag)
      - id: distraction
        label: Distraction
        kind: angle
        target_tag: "Misdirected"
        stat_check: INT
        effect: "Throw a flare, scatter scrap, misdirect"
      - id: go_underground
        label: Go Underground
        kind: push
        stat_check: DEX
        consequence: "Chase ends — vanish into a drainage tunnel or bunker"
    mood: tension
