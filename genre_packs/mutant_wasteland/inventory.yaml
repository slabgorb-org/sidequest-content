    - rad_pills
    - medkit_crude
    - water_canteen
    - glow_rod
  Wirewalker:
    - tool_kit_basic
    - glow_rod
    - water_canteen
  Beastkin:
    - sharpened_rebar
    - water_canteen
    - water_canteen
  Tinker:
    - tool_kit_basic
    - glow_rod
    - water_canteen

starting_gold:
  Scavenger: 8
  Mutant: 3
  Pureblood: 15
  Wirewalker: 5
  Beastkin: 2
