# mutant_wasteland/magic.yaml
# Genre-layer magic config — AWN mutations are the magic system.
# Mutations.yaml holds the mechanic catalog; this declares the narrator frame.

genre: mutant_wasteland

# AWN mutations can be innate (genetic gift) or acquired (experimentation/exposure).
allowed_sources: [innate, acquired]

# The only plugin: AWN mutation engine.
permitted_plugins: [awn_mutation_v1]

intensity:
  default: 0.8
  # Mutations are central to wasteland fiction, not exceptional.

world_knowledge_default:
  primary: common_lore

# No hard restrictions on mutation narrative.
hard_limits: []

# Mutations don't have a "cost" in the magic-system sense; they're paid for
# via System Strain (defined in the AWN rules module).
cost_types: []

narrator_register: |
  Mutations are not magic — they are biology run wild. Characters with mutations
  are not mages; they are living weapons or living jokes. Treat mutation use as
  visceral, costly, and flawed: the character's body betrays them as often as it
  saves them. Show the strain, the instability, the visible cost. Mutations should
  feel dangerous to the wielder, never polished or controlled.
