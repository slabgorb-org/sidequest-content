# spaghetti_western — Fate gear (ADR-144 gear model, story 114-10).
#
# Fate has no equipment economy: gear is not a carried inventory, it is the
# signature kit the rider walks in with — compiled onto the FateSheet at chargen
# as aspects + a permission. Every entry here is aspect-/permission-gear (FREE —
# no refresh debit), so a starting spaghetti_western PC keeps the SRD refresh of
# 3. The pistol is not a damage table; it is story colour. Conflicts route to the
# Fate engine (the Leone standoff is a Contest of nerve and reputation, 121-5),
# not to HP.
- id: western_weathered_hat
  name: A Hat That's Outlived Better Men
  description: >-
    Sweat-stained felt, the brim cracked and re-shaped a dozen times, a bullet
    crease through the crown that you don't talk about. It throws your eyes into
    shadow before you've said a word, and in this country a man's face is the
    last thing he wants read.
  grants_aspects:
    - text: Eyes in the Brim's Shadow
      kind: character

- id: western_worn_pistol
  name: The Pistol With a History
  description: >-
    A single-action revolver worn smooth at the grip and short a notch or two it
    should rightly carry. It rides low and easy, more often produced than fired —
    the talking usually ends the moment your hand drifts toward it. The weight of
    it is the weight of every man who learned not to test you.
  grants_aspects:
    - text: My Reputation Rides Ahead of Me
      kind: character

- id: western_saddlebags
  name: Everything You Own, Behind the Saddle
  description: >-
    Cracked leather saddlebags carrying the sum of a wandering life — a spare box
    of shells, hardtack going to dust, a tintype you never show anyone, and the
    quiet knowledge that you can be gone before sunup and leave nothing of
    yourself behind.
  grants_aspects:
    - text: I Travel Light and Leave No Trail
      kind: character

- id: western_wanted_poster
  name: Your Own Face, Folded in a Pocket
  description: >-
    A handbill gone soft at the creases — a likeness that's only half wrong, a
    sum of money that's gone up since it was printed, and a name the law would
    very much like to put a rope around. You carry it to remember what you're
    worth to the wrong people. It opens some doors and bolts a great many more.
  grants_aspects:
    - text: There's a Price on This Head
      kind: permission
