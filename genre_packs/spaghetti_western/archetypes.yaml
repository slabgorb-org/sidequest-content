- name: The Man With No Name
  description: >-
    A stranger with no past and no allegiance. Rides into town, sizes up
    the power structure, and plays every side against the middle. Speaks in
    single sentences. Kills without hesitation but occasionally — almost
    accidentally — does the right thing. The poncho hides more than guns.
  personality_traits:
    - laconic
    - calculating
    - self-interested with a buried conscience
  typical_classes:
    - Gunslinger
    - Drifter
  typical_races:
    - Frontier Born
    - War Survivor
  stat_ranges:
    DRAW: [14, 18]
    NERVE: [14, 16]
    CUNNING: [12, 16]
  catalog_items:
    - revolver_worn
    - poncho
  inventory_hints:
    - cigarillo, half-smoked
    - a few coins of uncertain origin
  dialogue_quirks:
    - answers questions with silence or a flat stare
    - speaks only when it changes something
    - dry wit that lands like a slap
  disposition_default: 0

- name: The Bounty Collector
  description: >-
    A professional with a ledger and a long gun. Tracks fugitives across
    territory lines with patience and precision. Cultured, even refined —
    but refinement makes the killing colder, not warmer. Treats death as
    a line item.
  personality_traits:
    - methodical
    - cultured
    - ruthlessly professional
  typical_classes:
    - Bounty Hunter
  typical_races:
    - City Exile
    - War Survivor
  stat_ranges:
    DRAW: [12, 16]
    CUNNING: [14, 18]
    NERVE: [12, 16]
  catalog_items:
    - rifle_scoped
    - wanted_posters
  inventory_hints:
    - leather-bound ledger of names and prices
    - pocket watch, engraved
  dialogue_quirks:
    - quotes prices mid-conversation like discussing weather
    - polite even when threatening
    - adjusts spectacles or hat before violence
  disposition_default: -5

- name: The Desperate Bandit
  description: >-
    Part clown, part survivor, part cornered animal. Lives by theft and
    fast talk, driven equally by greed and by a past that left no honest
    options. Loud where the Stranger is quiet. Comic where the Collector
    is cold. But underestimate the desperation at your peril.
  personality_traits:
    - garrulous
    - opportunistic
    - surprisingly loyal when cornered
  typical_classes:
    - Outlaw
  typical_races:
    - Border Crosser
    - Frontier Born
  stat_ranges:
    GRIT: [12, 16]
    CUNNING: [12, 14]
    PRESENCE: [12, 16]
  catalog_items:
    - revolver_cheap
    - rope
  inventory_hints:
    - stolen religious medallion worn sincerely
    - a knife strapped where nobody looks
  dialogue_quirks:
    - talks constantly, especially when nervous
    - invokes saints and mothers in the same breath as threats
    - laughs too loud and too often
  disposition_default: -10

- name: The Corrupt Sheriff
  description: >-
    The law in name, the problem in practice. Takes a cut from every
    racket in town, jails whoever the power brokers need jailed, and
    keeps the peace only when peace serves his interests. The badge is
    real. The authority behind it is hollow.
  personality_traits:
    - venal
    - territorial
    - dangerous when cornered
  typical_classes:
    - Marshal
  typical_races:
    - Frontier Born
    - War Survivor
  stat_ranges:
    GRIT: [12, 16]
    PRESENCE: [14, 18]
    NERVE: [10, 14]
  catalog_items:
    - revolver_engraved
    - sheriff_badge
  inventory_hints:
    - ring of keys to the jail
    - flask of whiskey, always within reach
  dialogue_quirks:
    - smiles too much
    - calls everyone friend or partner while calculating their value
    - voice drops when making threats — gets quieter, not louder
  disposition_default: -15

- name: The Widow
  description: >-
    The one who stayed after everyone with sense left. Husband dead,
    ranch contested, surrounded by men who see her as an obstacle or
    an opportunity. Navigates a world of predators through intelligence,
    resilience, and a willingness to make deals that would horrify the
    civilized east.
  personality_traits:
    - resilient
    - pragmatic
    - fiercely independent
  typical_classes:
    - Gambler
    - Drifter
  typical_races:
    - Frontier Born
    - City Exile
  stat_ranges:
    NERVE: [14, 18]
    CUNNING: [14, 16]
    PRESENCE: [12, 16]
  catalog_items:
    - derringer_hidden
    - land_deed
  inventory_hints:
    - letters from a dead husband, unread
    - a small strongbox, locked
  dialogue_quirks:
    - assesses every man's usefulness within ten seconds of meeting him
    - speaks softly but never repeats herself
    - smiles rarely — when she does, it changes the room
  disposition_default: 5

- name: The Card Sharp
  description: >-
    Information is currency and this one has a vault. Plays cards to read
    people, not to win money — though the money is nice. Knows everyone's
    secrets, owes favors to half the territory, and trades in leverage
    the way others trade in lead. The most dangerous person in any room
    without ever touching a gun.
  personality_traits:
    - charming
    - amoral
    - addicted to risk
  typical_classes:
    - Gambler
  typical_races:
    - City Exile
    - Border Crosser
  stat_ranges:
    CUNNING: [16, 18]
    PRESENCE: [14, 18]
    LUCK: [14, 16]
  catalog_items:
    - deck_marked
    - derringer_hidden
  inventory_hints:
    - deck of cards, well-worn
    - IOUs from people who shouldn't owe
  dialogue_quirks:
    - shuffles cards or coins while talking
    - deflects every direct question with a question
    - knows your name before you give it
  disposition_default: 0

- name: The Hired Gun
  description: >-
    The instrument. Points at a problem and it stops being a problem.
    No philosophy, no vendetta, no complexity — just a rate and a
    reputation. The most honest person in the spaghetti western, in
    the worst possible way.
  personality_traits:
    - detached
    - efficient
    - utterly without pretense
  typical_classes:
    - Gunslinger
    - Bounty Hunter
  typical_races:
    - War Survivor
    - Frontier Born
  stat_ranges:
    DRAW: [16, 18]
    GRIT: [14, 16]
    NERVE: [12, 16]
  catalog_items:
    - revolver_custom
    - rifle_repeating
  inventory_hints:
    - cleaning kit, used religiously
    - tally marks scratched into gun grip
  dialogue_quirks:
    - states terms once, does not negotiate
    - long silences between sentences
    - no small talk — ever
  disposition_default: -5

- name: The Preacher
  description: >-
    Whether the faith is real or the collar is a cover, this one walks
    between the factions with something nobody else has — perceived
    neutrality. Buries the dead, counsels the desperate, and sees
    everything from the church steps. Might be a genuine man of God.
    Might be running from something that a collar cannot absolve.
  personality_traits:
    - watchful
    - compassionate or performatively so
    - carrying a secret
  typical_classes:
    - Drifter
    - Marshal
  typical_races:
    - City Exile
    - War Survivor
  stat_ranges:
    NERVE: [14, 18]
    PRESENCE: [14, 16]
    CUNNING: [10, 14]
  catalog_items:
    - bible_worn
    - shotgun_sawnoff
  inventory_hints:
    - a bible with a passage underlined too many times
    - communion wine, nearly empty
  dialogue_quirks:
    - speaks in parables that might be threats
    - calls everyone son or daughter
    - hands are steady in a way that suggests a past life
  disposition_default: 10
