# Spaghetti Western — Genre-Level NPC Archetypes
#
# These are the mythic shapes — personality, statline, dialogue rhythm —
# that define the spaghetti western regardless of whether the costume is
# Leone's Almería or Kurosawa's Sengoku province. They are the rulebook
# archetypes; worlds supply concrete named realizations (e.g.
# worlds/dust_and_lead/archetypes.yaml adds The Company Man, The Ranchera,
# The Apache Scout — concrete NPCs specific to the Sangre Territory).
#
# Pattern notes:
# - No catalog_items here (items are world flavor; see inventory.yaml —
#   currently still at genre level pending loader world-override).
# - typical_classes use genre mechanical classes (Gunslinger, Bounty
#   Hunter, Marshal, Drifter, Gambler, Outlaw). A samurai world in this
#   genre would either reuse these as shorthand or ship mapping.
# - Dialogue quirks are trimmed to locale-neutral behavior; world-specific
#   tics (crosses himself, quotes scripture, corridos, papel picado) live
#   in world archetypes.

- name: The Stranger
  description: >-
    A drifter with no past anyone can verify and no allegiance anyone can
    buy. Rides in, reads the power structure, plays every side against
    the middle. Speaks in single sentences. Kills without hesitation but
    occasionally — almost accidentally — does the right thing. The
    anonymity is a weapon.
  personality_traits:
    - laconic
    - calculating
    - self-interested with a buried conscience
  typical_classes:
    - Gunslinger
    - Drifter
  typical_races:
    - Frontier Born
    - War Survivor
  stat_ranges:
    DRAW: [14, 18]
    NERVE: [14, 16]
    CUNNING: [12, 16]
  inventory_hints:
    - half-smoked smoke, lit at a bad moment
    - a few coins of uncertain origin
  dialogue_quirks:
    - answers questions with silence or a flat stare
    - speaks only when it changes something
    - dry wit that lands like a slap
    - repeats the last word of someone else's sentence, flat, like tasting it
    - tilts head slightly before deciding whether to answer
    - speaks in the third person when delivering a threat
    - finishes other people's sentences — always wrong, never corrected
    - gives directions using the dead as landmarks
  disposition_default: 0

- name: The Hunter
  description: >-
    A professional with a ledger and a long weapon. Tracks targets across
    territory lines with patience and precision. Cultured, even refined —
    but refinement makes the killing colder, not warmer. Treats death as
    a line item.
  personality_traits:
    - methodical
    - cultured
    - ruthlessly professional
  typical_classes:
    - Bounty Hunter
  typical_races:
    - City Exile
    - War Survivor
  stat_ranges:
    DRAW: [12, 16]
    CUNNING: [14, 18]
    NERVE: [12, 16]
  inventory_hints:
    - a ledger of names and prices, leather-bound
    - a timepiece, engraved, well-kept
  dialogue_quirks:
    - quotes prices mid-conversation like discussing weather
    - polite even when threatening
    - adjusts spectacles or hat brim before violence
    - corrects other people's grammar mid-argument
    - references the deceased as satisfied former clients
    - offers a handshake before and after every killing
    - reads aloud from contracts or warrants with theatrical diction
    - wipes dust off boots before entering any building, even a ruin
  disposition_default: -5

- name: The Desperate Bandit
  description: >-
    Part clown, part survivor, part cornered animal. Lives by theft and
    fast talk, driven equally by greed and by a past that left no honest
    options. Loud where the Stranger is quiet. Comic where the Hunter is
    cold. Underestimate the desperation at your peril.
  personality_traits:
    - garrulous
    - opportunistic
    - surprisingly loyal when cornered
  typical_classes:
    - Outlaw
  typical_races:
    - Border Crosser
    - Frontier Born
  stat_ranges:
    GRIT: [12, 16]
    CUNNING: [12, 14]
    PRESENCE: [12, 16]
  inventory_hints:
    - a stolen trinket worn sincerely
    - a blade strapped where nobody looks
  dialogue_quirks:
    - talks constantly, especially when nervous
    - invokes higher powers and mothers in the same breath as threats
    - laughs too loud and too often
    - tells the same story three different ways depending on the audience
    - whispers when planning something dangerous, shouts when planning something stupid
    - counts on his fingers during negotiations, always loses count
    - hums fragments of old songs when he thinks nobody is listening
  disposition_default: -10

- name: The Corrupt Authority
  description: >-
    The law in name, the problem in practice. Takes a cut from every
    racket, arrests whoever the power brokers need removed, keeps the
    peace only when peace serves his interests. The badge — or the
    commission, or the magistrate's seal — is real. The authority behind
    it is hollow.
  personality_traits:
    - venal
    - territorial
    - dangerous when cornered
  typical_classes:
    - Marshal
  typical_races:
    - Frontier Born
    - War Survivor
  stat_ranges:
    GRIT: [12, 16]
    PRESENCE: [14, 18]
    NERVE: [10, 14]
  inventory_hints:
    - keys to wherever he keeps people he doesn't like
    - drink, always within reach
  dialogue_quirks:
    - smiles too much
    - calls everyone friend or partner while calculating their value
    - voice drops when making threats — gets quieter, not louder
    - tells you what the law says, then tells you what he says, then asks which you prefer
    - leans on doorframes like he owns every building in town
    - offers a drink before delivering bad news, never after
    - refers to bribes as civic contributions
    - winks when lying, which is most of the time
  disposition_default: -15

- name: The Widow
  description: >-
    The one who stayed after everyone with sense left. Spouse dead, land
    contested, surrounded by men who see her as an obstacle or an
    opportunity. Navigates a world of predators through intelligence,
    resilience, and a willingness to make deals that would horrify
    polite society.
  personality_traits:
    - resilient
    - pragmatic
    - fiercely independent
  typical_classes:
    - Gambler
    - Drifter
  typical_races:
    - Frontier Born
    - City Exile
  stat_ranges:
    NERVE: [14, 18]
    CUNNING: [14, 16]
    PRESENCE: [12, 16]
  inventory_hints:
    - letters from the dead, unread
    - a small lockbox
  dialogue_quirks:
    - assesses every person's usefulness within ten seconds of meeting them
    - speaks softly but never repeats herself
    - smiles rarely — when she does, it changes the room
    - folds her hands when she's made up her mind — the conversation is over
    - uses her spouse's name like a weapon nobody else can draw
    - pours hospitality for guests and poison for enemies with the same gesture
    - looks out the window while delivering her worst truths
    - addresses men by their last names until they earn the first
    - goes silent when angry — the silence is louder than shouting
  disposition_default: 5

- name: The Broker
  description: >-
    Information is currency and this one has a vault. Plays games of
    chance to read people, not to win money — though the money is nice.
    Knows everyone's secrets, owes favors to half the territory, and
    trades in leverage the way others trade in lead. The most dangerous
    person in any room without ever touching a weapon.
  personality_traits:
    - charming
    - amoral
    - addicted to risk
  typical_classes:
    - Gambler
  typical_races:
    - City Exile
    - Border Crosser
  stat_ranges:
    CUNNING: [16, 18]
    PRESENCE: [14, 18]
    LUCK: [14, 16]
  inventory_hints:
    - the tools of whichever game this territory plays
    - IOUs from people who shouldn't owe
  dialogue_quirks:
    - shuffles something — cards, coins, dice — while talking
    - deflects every direct question with a question
    - knows your name before you give it
    - deals invisible moves when thinking through a problem
    - speaks in metaphors drawn from whichever game they prefer
    - never sits with his back to a door, rearranges furniture if necessary
    - tips his hat to mark the end of a conversation, whether the other person agrees or not
    - calls every bluff, even social ones
    - quotes odds on survival like a bookie quoting a race
  disposition_default: 0

- name: The Instrument
  description: >-
    The weapon with a voice. Points at a problem and it stops being a
    problem. No philosophy, no vendetta, no complexity — just a rate
    and a reputation. The most honest person in the spaghetti western,
    in the worst possible way.
  personality_traits:
    - detached
    - efficient
    - utterly without pretense
  typical_classes:
    - Gunslinger
    - Bounty Hunter
  typical_races:
    - War Survivor
    - Frontier Born
  stat_ranges:
    DRAW: [16, 18]
    GRIT: [14, 16]
    NERVE: [12, 16]
  inventory_hints:
    - a cleaning kit, used religiously
    - tally marks scratched into a weapon grip
  dialogue_quirks:
    - states terms once, does not negotiate
    - long silences between sentences
    - no small talk — ever
    - counts ammunition aloud when reloading, like a man counting change
    - refers to targets by contract number, never by name
    - eats during tense conversations as if nothing is happening
    - maintains a weapon while someone else is talking
    - answers questions about his past with a price — you can buy the answer
    - nods once for yes, does not bother indicating no
  disposition_default: -5

- name: The Witness
  description: >-
    Whether the faith is real or the collar is a cover, this one walks
    between the factions with something nobody else has: perceived
    neutrality. Buries the dead, counsels the desperate, sees everything
    from the edge of the room. Might be a genuine holy person. Might be
    running from something that vestments cannot absolve.
  personality_traits:
    - watchful
    - compassionate or performatively so
    - carrying a secret
  typical_classes:
    - Drifter
    - Marshal
  typical_races:
    - City Exile
    - War Survivor
  stat_ranges:
    NERVE: [14, 18]
    PRESENCE: [14, 16]
    CUNNING: [10, 14]
  inventory_hints:
    - a worn text, a passage underlined too many times
    - something a congregant pressed into his hand and forgot to ask back
  dialogue_quirks:
    - speaks in parables that might be threats
    - calls everyone by a familial title
    - hands are steady in a way that suggests a past life
    - blesses people who didn't ask for it and curses people who did
    - pours two drinks — one for you, one for whoever you lost
    - folds his hands in a devotional gesture when he's actually furious
    - speaks of the dead in present tense
    - closes every consequential exchange as if closing a ledger
  disposition_default: 10
