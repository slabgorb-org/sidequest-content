# Audio configuration for spaghetti western genre pack
# Mood tracks, SFX library, creature voice presets, mixer settings
#
# Audio identity: Morricone-inspired — whistling melodies over sparse
# electric guitar, reverb-drenched twang, whip cracks as percussion,
# harmonica wails, choral chants. Long silences are part of the score.
# Music enters as punctuation, not wallpaper.

