mixer:
  music_volume: 0.08
  sfx_volume: 0.15
  crossfade_default_ms: 3000

themes:
  - name: exploration
    mood: exploration
    base_prompt: "Ennio Morricone, lonely electric guitar, reverb twang, whistling melody, sparse percussion, desert wind, vast open landscape, cinematic western"
    variations:
      - type: full
        path: audio/music/exploration_full.ogg
      - type: ambient
        path: audio/music/exploration_ambient.ogg
      - type: sparse
        path: audio/music/exploration_sparse.ogg
      - type: tension_build
        path: audio/music/exploration_tension_build.ogg
      - type: resolution
        path: audio/music/exploration_resolution.ogg
      - type: overture
        path: audio/music/exploration_overture.ogg
  - name: combat
