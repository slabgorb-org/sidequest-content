stat_generation: point_buy
point_buy_budget: 27
magic_level: none

allowed_classes:
  - Gunslinger
  - Bounty Hunter
  - Outlaw
  - Drifter
  - Gambler
  - Marshal

allowed_races:
  - Frontier Born
  - City Exile
  - Border Crosser
  - War Survivor

banned_spells: []

hp_formula: "class_base * level"

custom_rules:
  rest_variant: campfire
  encumbrance: saddlebag
  injuries: lingering
  standoff: true
  reputation: multi_faction
  bounty_board: true
  luck_as_resource: true

default_class: Drifter
default_race: Frontier Born
default_hp: 10
default_ac: 10
default_location: "A nameless border town baking under a white sun"
default_time_of_day: high_noon

class_hp_bases:
  Gunslinger: 8
  Bounty Hunter: 10
  Outlaw: 10
  Drifter: 8
  Gambler: 6
  Marshal: 10

ability_score_names:
  - GRIT
  - DRAW
  - NERVE
  - CUNNING
  - PRESENCE
  - LUCK

stat_display_fields:
  - hp
  - max_hp
  - ac
  - luck

encounter_base_tension:
  random: 0.15
  ambush: 0.35
  standoff: 0.50
  boss: 0.45
  final: 0.60

# ── Standoff System ──────────────────────────────────────────
# Pre-combat phase that replaces initiative for one-on-one or
# small-group confrontations. The stare-down IS the mechanic.
standoff_rules:
  sizing_up:
    description: >-
      Before violence erupts, combatants lock eyes. Each makes a
      NERVE check to read their opponent — stance, breathing, the
      twitch of a hand near the holster. Success reveals the
      opponent's DRAW score and intent (fight, bluff, or flee).
    check: NERVE
    contested: true
  focus_or_draw:
    description: >-
      After sizing up, each combatant secretly chooses: FOCUS
      (steady aim — bonus to hit and damage but telegraphs intent)
      or DRAW (quick-draw — wins initiative on a DRAW check, but
      no aim bonus). The one who read their opponent better in the
      sizing-up phase gets to see the other's choice first.
    focus_bonus_hit: 2
    focus_bonus_damage: 4
    draw_initiative_bonus: 4
  nerve_break:
    description: >-
      If a combatant's NERVE check fails badly (by 5 or more),
      they flinch — losing their action and suffering disadvantage
      on their first attack. In the spaghetti western, fear kills
      before bullets do.
    threshold: 5

# ── Reputation System ────────────────────────────────────────
reputation_factions:
  - id: outlaws
    name: Outlaws & Bandits
    description: "The lawless. Respect strength and cunning."
  - id: law
    name: The Law
    description: "Sheriffs, marshals, deputies. What passes for order."
  - id: merchants
    name: Merchants & Settlers
    description: "The people trying to build something. Easy marks or loyal clients."
  - id: guns_for_hire
    name: Guns for Hire
    description: "Bounty hunters, mercenaries, hired muscle. Professional courtesy."
  - id: power_brokers
    name: Power Brokers
    description: "Railroad barons, land owners, political fixers. The real power."

reputation_effects:
  high:
    - "NPCs of this faction offer jobs, shelter, and information freely"
    - "Prices drop. Doors open. People step aside."
  neutral:
    - "Standard interactions. No favors, no hostility."
  low:
    - "NPCs are suspicious, uncooperative, or openly hostile"
    - "Bounties may be placed. Safe havens close."

# ── Luck System ──────────────────────────────────────────────
luck_rules:
  starting_luck: 3
  max_luck: 5
  spend_effects:
    - name: Cheat Death
      cost: 2
      effect: "Survive a killing blow with 1 HP. The bullet grazes, the blade turns."
    - name: Lucky Break
      cost: 1
      effect: "Reroll any single check. Take the better result."
    - name: Right Place, Right Time
      cost: 1
      effect: "Arrive at a scene just in time, or find something you need nearby."
  recovery:
    per_session: 1
    bonus_triggers:
      - "Survive a standoff without drawing"
      - "Complete a bounty alive"
      - "Win a high-stakes gamble"

confrontations:
- type: combat
  label: Gunfight
  category: combat
  metric:
    name: hp
    direction: descending
    starting: 0
    threshold_low: 0
  beats:
  - id: draw
    label: Draw
    metric_delta: -10
    stat_check: DRAW
    narrator_hint: Hand drops to the holster. Time stretches. Who clears leather first?
  - id: fan_the_hammer
    label: Fan the Hammer
    metric_delta: -15
    stat_check: DRAW
    risk: "Wide spray — hit a bystander on failure"
    narrator_hint: Empty the cylinder. Six shots in two seconds.
  - id: duck
    label: Duck
    metric_delta: 0
    stat_check: NERVE
    effect: "Dive behind the bar, the horse trough, the coffin"
  - id: walk_away
    label: Walk Away
    metric_delta: 0
    stat_check: CUNNING
    resolution: true
    consequence: "Combat ends — turn your back and dare them to shoot"
  mood: combat
- type: chase
  label: Horseback Pursuit
  category: movement
  metric:
    name: separation
    direction: ascending
    starting: 3
    threshold_high: 10
    threshold_low: 0
  beats:
  - id: spur
    label: Spur the Horse
    metric_delta: 2
    stat_check: CUNNING
    narrator_hint: Dust clouds, hoofbeats, the creak of leather.
  - id: canyon_cut
    label: Canyon Shortcut
    metric_delta: 3
    stat_check: GRIT
    risk: "Boxed in — dead end canyon, lose 2 separation"
  - id: river_cross
    label: Ford the River
    metric_delta: 1
    stat_check: GRIT
    effect: "Water slows pursuit behind you"
  - id: go_to_ground
    label: Go to Ground
    metric_delta: 0
    stat_check: CUNNING
    resolution: true
    consequence: "Chase ends — dismount, hide among the rocks"
  mood: tension
- type: standoff
  label: Showdown at High Noon
  category: pre_combat
  metric:
    name: nerve
    direction: descending
    starting: 100
    threshold_low: 0
  beats:
  - id: stare_down
    label: Stare Down
    metric_delta: -15
    stat_check: NERVE
    narrator_hint: Eyes narrow. A bead of sweat runs down a temple. The clock tower ticks.
  - id: sizing_up
    label: Size Up
    metric_delta: -10
    stat_check: CUNNING
    effect: "Read the opponent — reveal their DRAW score"
    narrator_hint: Feet shift. Weight settles. Hands drift closer to iron.
  - id: taunt
    label: Taunt
    metric_delta: -20
    stat_check: PRESENCE
    risk: "Enrages opponent — they draw early, escalates to combat"
    narrator_hint: Words cut deeper than bullets. Make them doubt.
  - id: draw_first
    label: Draw First
    metric_delta: 0
    stat_check: DRAW
    resolution: true
    consequence: "Standoff ends — first shot fired, escalates to combat"
  escalates_to: combat
  mood: tension
- type: card_game
  label: High Stakes Poker
  category: social
  metric:
    name: pot
    direction: ascending
    starting: 0
    threshold_high: 100
  beats:
  - id: raise
    label: Raise
    metric_delta: 15
    stat_check: CUNNING
    narrator_hint: Chips click. Eyes flick to the cards, then back.
  - id: bluff
    label: Bluff
    metric_delta: 20
    stat_check: PRESENCE
    risk: "Called — lose double the bet if they see through it"
    narrator_hint: A face like stone. Not a tell in sight. Or is that the tell?
  - id: read
    label: Read the Table
    metric_delta: 5
    stat_check: CUNNING
    effect: "Reveal one opponent's hand strength"
    narrator_hint: The way he stacks his chips. The way she holds her cards. Everyone talks.
  - id: cheat
    label: Cheat
    metric_delta: 25
    stat_check: CUNNING
    risk: "Caught — standoff or gunfight if they notice"
    narrator_hint: The marked deck slides. The bottom deal is clean. Almost clean.
  - id: fold
    label: Fold
    metric_delta: 0
    stat_check: NERVE
    resolution: true
    consequence: "Walk away from the table with what you've got"
  mood: tension
- type: negotiation
  label: Parley
  category: social
  metric:
    name: leverage
    direction: ascending
    starting: 50
    threshold_high: 100
    threshold_low: 0
  beats:
  - id: offer
    label: Make an Offer
    metric_delta: 10
    stat_check: PRESENCE
    narrator_hint: Name your price. Everything out here has one.
  - id: threaten
    label: Threaten
    metric_delta: 15
    stat_check: GRIT
    risk: "Refused — lose 10 leverage, they dig in"
    narrator_hint: The hand rests on the holster. Not a draw. A reminder.
  - id: sweeten
    label: Sweeten the Deal
    metric_delta: 10
    stat_check: CUNNING
    effect: "Add information, a favor, or a cut of the take"
  - id: walk_away
    label: Walk Away
    metric_delta: 0
    stat_check: NERVE
    resolution: true
    consequence: "Negotiation ends — no deal, no hard feelings. Maybe."
  mood: tension
