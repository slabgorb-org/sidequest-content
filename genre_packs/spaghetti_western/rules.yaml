stat_generation: point_buy
point_buy_budget: 27
magic_level: none

allowed_classes:
  - Gunslinger
  - Bounty Hunter
  - Outlaw
  - Drifter
  - Gambler
  - Marshal

allowed_races:
  - Frontier Born
  - City Exile
  - Border Crosser
  - War Survivor

banned_spells: []

hp_formula: "class_base * level"

custom_rules:
  rest_variant: campfire
  encumbrance: saddlebag
  injuries: lingering
  standoff: true
  reputation: multi_faction
  bounty_board: true
  luck_as_resource: true

default_class: Drifter
default_race: Frontier Born
default_hp: 10
default_ac: 10
default_location: "A nameless border town baking under a white sun"
default_time_of_day: high_noon

class_hp_bases:
  Gunslinger: 8
  Bounty Hunter: 10
  Outlaw: 10
  Drifter: 8
  Gambler: 6
  Marshal: 10

ability_score_names:
  - GRIT
  - DRAW
  - NERVE
  - CUNNING
  - PRESENCE
  - LUCK

stat_display_fields:
  - hp
  - max_hp
  - ac
  - luck

resources:
  - name: luck
    label: Luck
    min: 0.0
    max: 6.0
    starting: 3.0
    voluntary: true
    decay_per_turn: 0.0
    thresholds:
      - at: 1.0
        event_id: luck_critical
        narrator_hint: "Luck is nearly spent — one bad break from disaster."
      - at: 0.0
        event_id: luck_depleted
        narrator_hint: "Out of luck entirely. Everything depends on grit and skill."

encounter_base_tension:
  random: 0.15
  ambush: 0.35
  standoff: 0.50
  boss: 0.45
  final: 0.60

# ── Standoff System ──────────────────────────────────────────
# Pre-combat phase that replaces initiative for one-on-one or
# small-group confrontations. The stare-down IS the mechanic.
standoff_rules:
  sizing_up:
    description: >-
      Before violence erupts, combatants lock eyes. Each makes a
      NERVE check to read their opponent — stance, breathing, the
      twitch of a hand near the holster. Success reveals the
      opponent's DRAW score and intent (fight, bluff, or flee).
    check: NERVE
    contested: true
  focus_or_draw:
    description: >-
      After sizing up, each combatant secretly chooses: FOCUS
      (steady aim — bonus to hit and damage but telegraphs intent)
      or DRAW (quick-draw — wins initiative on a DRAW check, but
      no aim bonus). The one who read their opponent better in the
      sizing-up phase gets to see the other's choice first.
    focus_bonus_hit: 2
    focus_bonus_damage: 4
    draw_initiative_bonus: 4
  nerve_break:
    description: >-
      If a combatant's NERVE check fails badly (by 5 or more),
      they flinch — losing their action and suffering disadvantage
      on their first attack. In the spaghetti western, fear kills
      before bullets do.
    threshold: 5

# ── Reputation System ────────────────────────────────────────
reputation_factions:
  - id: outlaws
    name: Outlaws & Bandits
    description: "The lawless. Respect strength and cunning."
  - id: law
    name: The Law
    description: "Sheriffs, marshals, deputies. What passes for order."
  - id: merchants
    name: Merchants & Settlers
    description: "The people trying to build something. Easy marks or loyal clients."
  - id: guns_for_hire
    name: Guns for Hire
    description: "Bounty hunters, mercenaries, hired muscle. Professional courtesy."
  - id: power_brokers
    name: Power Brokers
    description: "Railroad barons, land owners, political fixers. The real power."

reputation_effects:
  high:
    - "NPCs of this faction offer jobs, shelter, and information freely"
    - "Prices drop. Doors open. People step aside."
  neutral:
    - "Standard interactions. No favors, no hostility."
  low:
    - "NPCs are suspicious, uncooperative, or openly hostile"
    - "Bounties may be placed. Safe havens close."

# ── Luck System ──────────────────────────────────────────────
luck_rules:
  starting_luck: 3
  max_luck: 5
  spend_effects:
    - name: Cheat Death
      cost: 2
      effect: "Survive a killing blow with 1 HP. The bullet grazes, the blade turns."
    - name: Lucky Break
      cost: 1
      effect: "Reroll any single check. Take the better result."
    - name: Right Place, Right Time
      cost: 1
      effect: "Arrive at a scene just in time, or find something you need nearby."
  recovery:
    per_session: 1
    bonus_triggers:
      - "Survive a standoff without drawing"
      - "Complete a bounty alive"
      - "Win a high-stakes gamble"

# ── Confrontations ──────────────────────────────────────────
confrontations:
  - type: standoff
    label: "Standoff"
    category: pre_combat
    metric:
      name: tension
      direction: ascending
      starting: 0
      threshold_high: 10
    beats:
      - id: size_up
        label: "Size Up"
        metric_delta: 2
        stat_check: CUNNING
        reveals: opponent_detail
      - id: bluff
        label: "Bluff"
        metric_delta: 3
        stat_check: NERVE
        risk: "opponent may call it — immediate draw"
      - id: flinch
        label: "Flinch"
        metric_delta: -1
        stat_check: NERVE
      - id: draw
        label: "Draw"
        metric_delta: 0
        stat_check: DRAW
        resolution: true
    secondary_stats:
      - name: focus
        source_stat: NERVE
        spendable: true
    escalates_to: combat
    mood: standoff
  - type: negotiation
    label: "Tense Negotiation"
    category: social
    metric:
      name: leverage
      direction: bidirectional
      starting: 5
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: persuade
        label: "Make Your Case"
        metric_delta: 2
        stat_check: PRESENCE
        effect: "opponent considers your argument"
        narrator_hint: "Show the NPC weighing the player's words."
      - id: threaten
        label: "Threaten"
        metric_delta: 3
        stat_check: NERVE
        risk: "faction reputation -1 if it fails"
        consequence: "NPC becomes hostile on critical failure"
        narrator_hint: "Escalate tension. The threat should feel dangerous."
      - id: concede_point
        label: "Concede a Point"
        metric_delta: -1
        stat_check: PRESENCE
        effect: "opponent disposition +5, reveals their real goal"
        narrator_hint: "Strategic retreat. Player gives ground to gain information."
      - id: walk_away
        label: "Walk Away"
        metric_delta: 0
        stat_check: NERVE
        resolution: true
        consequence: "deal collapses, reputation intact"
        narrator_hint: "Player leaves the table. No deal."
    mood: tension
  - type: poker
    label: "Poker"
    category: social
    metric:
      name: edge
      direction: bidirectional
      starting: 0
      threshold_high: 8
      threshold_low: -8
    beats:
      - id: bet
        label: "Bet"
        metric_delta: 1
        stat_check: NERVE
        risk: "bad hand — lose 2 edge on fail"
        narrator_hint: "Push chips forward. Confidence or bluff?"
        gold_delta: -5
      - id: raise
        label: "Raise"
        metric_delta: 3
        stat_check: CUNNING
        risk: "overplayed — lose 3 edge if called and weak"
        narrator_hint: "Escalate the stakes. Make them sweat."
        gold_delta: -15
      - id: bluff
        label: "Bluff"
        metric_delta: 2
        stat_check: CUNNING
        risk: "called bluff — lose 4 edge, table reads you"
        reveals: opponent_tell
        narrator_hint: "Stone face. Sell the lie."
        gold_delta: -10
      - id: call
        label: "Call"
        metric_delta: 0
        stat_check: CUNNING
        reveals: hand_strength
        narrator_hint: "Match the bet. See what they've got."
        gold_delta: -5
      - id: fold
        label: "Fold"
        metric_delta: -1
        stat_check: NERVE
        narrator_hint: "Live to play another hand."
      - id: read_table
        label: "Read the Table"
        metric_delta: 0
        stat_check: CUNNING
        reveals: opponent_tell
        narrator_hint: "Watch their eyes. Everyone's got a tell."
      - id: cheat
        label: "Cheat"
        metric_delta: 4
        stat_check: DRAW
        risk: "caught cheating — loss of all edge, possible gunfight"
        consequence: "if caught, opponent draws on you — standoff escalation"
        narrator_hint: "Palm a card. Bottom deal. The Card Shark's specialty."
        requires: "Card Shark archetype or class ability"
        gold_delta: -5
      - id: accuse_cheating
        label: "Accuse of Cheating"
        metric_delta: 0
        stat_check: CUNNING
        risk: "wrong accusation — lose 3 edge, table turns on you"
        reveals: cheat_evidence
        narrator_hint: "Call them out. If you're right, they're done. If you're wrong, so are you."
    mood: saloon
  - type: combat
    label: Gunfight
    category: combat
    # Momentum-based. Gunfights are fast and brutal — big momentum swings.
    # `walk_away` as resolution is western genre gold: the hero who
    # turns their back and keeps walking.
    metric:
      name: momentum
      direction: bidirectional
      starting: 0
      threshold_high: 10
      threshold_low: -10
    beats:
      - id: draw
        label: Draw
        metric_delta: 3
        stat_check: DRAW
        effect: "Target takes damage this round"
        narrator_hint: A single heartbeat. Then iron clears leather.
      - id: fan_hammer
        label: Fan the Hammer
        metric_delta: 4
        stat_check: NERVE
        risk: "Empty cylinder — lose 2 momentum and skip next turn on failure"
        effect: "Target takes heavy damage"
        narrator_hint: Six shots in as many seconds. Accuracy sacrificed for volume.
      - id: duck
        label: Duck
        metric_delta: 1
        stat_check: CUNNING
        effect: "Reduce incoming damage — hit the dirt or dive for cover"
        narrator_hint: Dust puffs where you were a breath ago.
      - id: walk_away
        label: Walk Away
        metric_delta: 0
        stat_check: NERVE
        resolution: true
        consequence: "Combat ends — turn your back and keep walking"
        narrator_hint: Holster the iron. Don't look back. Let them wonder.
    mood: combat
  - type: chase
    label: Horseback Pursuit
    category: movement
    metric:
      name: separation
      direction: ascending
      starting: 3
      threshold_high: 10
      threshold_low: 0
    beats:
      - id: spur
        label: Spur the Horse
        metric_delta: 2
        stat_check: DRAW
        narrator_hint: Hooves thunder across the flats. Dust plumes behind.
      - id: canyon
        label: Canyon Shortcut
        metric_delta: 3
        stat_check: CUNNING
        risk: "Dead-end box canyon — lose 2 separation"
      - id: ford_river
        label: Ford the River
        metric_delta: 1
        stat_check: NERVE
        effect: "Cross water to break pursuit's trail"
      - id: go_to_ground
        label: Go to Ground
        metric_delta: 0
        stat_check: CUNNING
        resolution: true
        consequence: "Chase ends — dismount, hide among the rocks"
    mood: tension
