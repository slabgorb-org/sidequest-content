# spaghetti_western — Fate Core binding (ADR-144 / story 114-10).
# Fate REPLACES the native d20 build + combat engine; conflicts route to the
# fate_conflict engine. The Leone standoff is a Contest of nerve and reputation
# (121-5 design), not an HP exchange. Only the genre flavor Fate does NOT own —
# Luck as a resource, the reputation factions, the standoff/confrontation colour,
# scene defaults — is retained below as typed-but-unconsumed content. The d20
# scaffolding (stat_generation, point_buy_budget, allowed_classes,
# ability_score_names, stat_display_fields) is stripped; chargen now seeds a Fate
# skill ladder instead of rolling six stats.
ruleset: fate
magic_level: none
# NOTE: named guns, the impossible quickdraw, the gunslinger's mythic reputation
# are item-channeled / reflexive flavor (see ./magic.yaml), narrated — never a
# spellbook. Under Fate they live as aspects and stunts, not a magic_level dial.

fate:
  # The frontier skill ladder. One seeded starting spread for every PC for now
  # (per-archetype allocation is a later story). The wandering gunhand peaks at
  # Shoot, can sit a horse and read a stranger, holds his nerve under a leveled
  # pistol, and would rather talk (or walk) than bleed.
  skills:
    Shoot: 4
    Ride: 3
    Provoke: 3
    Notice: 3
    Physique: 2
    Will: 2
    Deceive: 2
    Fight: 2
    Athletics: 1
    Rapport: 1
    Empathy: 1
    Resources: 1
    Lore: 1
    Stealth: 1
  refresh: 3
  # Refresh-invariant knobs (114-10). SRD default 3/3. The signature gear below is
  # all aspect-/permission-gear (free), so a starting rider keeps refresh 3.
  base_refresh: 3
  free_stunts: 3
  # Shared signature gear compiled onto every PC's sheet at chargen (gear.yaml).
  gear:
    - western_weathered_hat
    - western_worn_pistol
    - western_saddlebags
    - western_wanted_poster
  default_high_concept: "Nameless Gun Riding Toward One Last Reckoning"
  default_trouble: "My Reputation Always Finds Me First"
  # Story 126-24 (content gap-fill, 2026-06-20): narrative-chargen seed table.
  # Maps each crucible class_hint (worlds/<world>/char_creation.yaml — WORLD-tier
  # here; dust_and_lead, five_points, and the_real_mccoy all share the same six
  # callings) to a COMPLETE legal pyramid (1 Great / 2 Good / 3 Fair / 4 Average,
  # per the SRD chargen_pyramid [1,2,3,4]@apex 4) + free-aspect seeds, so the
  # friendly narrative on-ramp presents a pre-ranked Fate sheet (editable defaults
  # — the player overrides any rating/aspect) instead of the blank pyramid the
  # seam read nothing for. Covers every crucible class_hint (No Silent Fallbacks).
  # Allocations draw ONLY from the 14-skill western ladder above (Shoot/Ride/Fight;
  # no Investigate/Contacts).
  chargen_seed_table:
    Gunslinger:
      pyramid: { Shoot: 4, Fight: 3, Notice: 3, Athletics: 2, Physique: 2, Will: 2, Provoke: 1, Ride: 1, Deceive: 1, Resources: 1 }
      aspects:
        - "The Weapon Is an Extension of My Will"
        - "Every Town Has a Boy Who Wants to Be the One Who Killed Me"
    Bounty Hunter:
      pyramid: { Notice: 4, Shoot: 3, Ride: 3, Stealth: 2, Physique: 2, Will: 2, Fight: 1, Provoke: 1, Lore: 1, Athletics: 1 }
      aspects:
        - "Everyone Leaves a Trail"
        - "I Always Bring Them Back — Dead Is Cheaper"
    Outlaw:
      pyramid: { Stealth: 4, Shoot: 3, Ride: 3, Deceive: 2, Notice: 2, Physique: 2, Provoke: 1, Athletics: 1, Resources: 1, Will: 1 }
      aspects:
        - "The World Only Has Things Waiting to Be Taken"
        - "There's Paper on Me in Three Territories"
    Drifter:
      pyramid: { Athletics: 4, Notice: 3, Empathy: 3, Ride: 2, Stealth: 2, Will: 2, Physique: 1, Shoot: 1, Deceive: 1, Rapport: 1 }
      aspects:
        - "Never Stay Long Enough to Owe Anyone"
        - "I Always Know When to Run"
    Gambler:
      pyramid: { Deceive: 4, Rapport: 3, Empathy: 3, Notice: 2, Provoke: 2, Will: 2, Shoot: 1, Resources: 1, Athletics: 1, Lore: 1 }
      aspects:
        - "Every Conversation Is a Hand Being Played"
        - "I Always Have an Ace — and Sometimes Two"
    Marshal:
      pyramid: { Provoke: 4, Shoot: 3, Will: 3, Notice: 2, Physique: 2, Rapport: 2, Fight: 1, Ride: 1, Lore: 1, Empathy: 1 }
      aspects:
        - "The Law Out Here Is Whatever I Say It Is"
        - "I Have Opinions About Justice a Gun Can Enforce"
  stunts:
    - name: "The Quick Draw"
      description: >-
        Once per conflict, when you act first against an opponent who hasn't yet
        cleared leather, you may use Shoot in place of your action's skill and
        invoke a situation aspect for free — iron clears the holster before
        thought catches up.
    - name: "Read the Hands, Not the Eyes"
      description: >-
        +2 to Notice to size up whether someone is about to draw, bluff, or run —
        you watch the twitch of a hand near the holster, not the face, because the
        face has been lying since they walked in.
    - name: "Nerves of Cold Iron"
      description: >-
        +2 to Will to defend against Provoke while a weapon is pointed at you.
        You've had guns in your face before; the trick is not to blink, and in the
        standoff, fear kills a man before any bullet does.
    - name: "Walk Away Slow"
      description: >-
        Once per scene, when you choose to end a confrontation by turning your back
        and walking, you may roll Provoke to create a Leaving Them to Wonder aspect
        on the scene with a free invoke — nobody fires on the man who isn't afraid
        to give them his back.

custom_rules:
  rest_variant: campfire
  encumbrance: none
  injuries: lingering
  standoff: "true"
  reputation: multi_faction
  bounty_board: "true"
  luck_as_resource: "true"

allowed_races:
  - Frontier Born
  - City Exile
  - Border Crosser
  - War Survivor

default_race: Frontier Born
default_location: "A nameless border town baking under a white sun"
default_time_of_day: high_noon

resources:
  - name: luck
    label: Luck
    min: 0.0
    max: 6.0
    starting: 3.0
    voluntary: true
    decay_per_turn: 0.0
    thresholds:
      - at: 1.0
        event_id: luck_critical
        narrator_hint: "Luck is nearly spent — one bad break from disaster."
      - at: 0.0
        event_id: luck_depleted
        narrator_hint: "Out of luck entirely. Everything depends on grit and skill."

encounter_base_tension:
  random: 0.15
  ambush: 0.35
  standoff: 0.50
  boss: 0.45
  final: 0.60

# ── Standoff System ──────────────────────────────────────────
# Pre-combat phase that replaces initiative for one-on-one or
# small-group confrontations. The stare-down IS the mechanic.
standoff_rules:
  sizing_up:
    description: >-
      Before violence erupts, combatants lock eyes. Each makes a
      NERVE check to read their opponent — stance, breathing, the
      twitch of a hand near the holster. Success reveals the
      opponent's DRAW score and intent (fight, bluff, or flee).
    check: NERVE
    contested: true
  focus_or_draw:
    description: >-
      After sizing up, each combatant secretly chooses: FOCUS
      (steady aim — bonus to hit and damage but telegraphs intent)
      or DRAW (quick-draw — wins initiative on a DRAW check, but
      no aim bonus). The one who read their opponent better in the
      sizing-up phase gets to see the other's choice first.
    focus_bonus_hit: 2
    focus_bonus_damage: 4
    draw_initiative_bonus: 4
  nerve_break:
    description: >-
      If a combatant's NERVE check fails badly (by 5 or more),
      they flinch — losing their action and suffering disadvantage
      on their first attack. In the spaghetti western, fear kills
      before bullets do.
    threshold: 5

# ── Reputation System ────────────────────────────────────────
reputation_factions:
  - id: outlaws
    name: Outlaws & Bandits
    description: "The lawless. Respect strength and cunning."
  - id: law
    name: The Law
    description: "Sheriffs, marshals, deputies. What passes for order."
  - id: merchants
    name: Merchants & Settlers
    description: "The people trying to build something. Easy marks or loyal clients."
  - id: guns_for_hire
    name: Guns for Hire
    description: "Bounty hunters, mercenaries, hired muscle. Professional courtesy."
  - id: power_brokers
    name: Power Brokers
    description: "Railroad barons, land owners, political fixers. The real power."

reputation_effects:
  high:
    - "NPCs of this faction offer jobs, shelter, and information freely"
    - "Prices drop. Doors open. People step aside."
  neutral:
    - "Standard interactions. No favors, no hostility."
  low:
    - "NPCs are suspicious, uncooperative, or openly hostile"
    - "Bounties may be placed. Safe havens close."

# ── Luck System ──────────────────────────────────────────────
luck_rules:
  starting_luck: 3
  max_luck: 5
  spend_effects:
    - name: Cheat Death
      cost: 2
      effect: "Survive a killing blow with 1 HP. The bullet grazes, the blade turns."
    - name: Lucky Break
      cost: 1
      effect: "Reroll any single check. Take the better result."
    - name: Right Place, Right Time
      cost: 1
      effect: "Arrive at a scene just in time, or find something you need nearby."
  recovery:
    per_session: 1
    bonus_triggers:
      - "Survive a standoff without drawing"
      - "Complete a bounty alive"
      - "Win a high-stakes gamble"

# ── Confrontations ──────────────────────────────────────────
confrontations:
- type: standoff
  label: Standoff
  intent_verbs:
  - draw
  - stare
  - threaten
  - intimidate
  - square
  - confront
  on_intent_mismatch: reprompt
  category: pre_combat
  player_metric:
    name: tension
    starting: 0
    threshold: 3
  opponent_metric:
    name: tension
    starting: 0
    threshold: 3
  beats:
  - id: size_up
    label: Size Up
  - id: bluff
    label: Bluff
    narrator_hint: opponent may call it — immediate draw
  - id: flinch
    label: Flinch
  - id: draw
    label: Draw
    narrator_hint: Standoff resolves into action — gun clears leather
  secondary_stats:
  - name: focus
    source_stat: NERVE
    spendable: true
  escalates_to: combat
  mood: standoff
  resolution_mode: contest
- type: negotiation
  label: Tense Negotiation
  intent_verbs:
  - haggle
  - bargain
  - barter
  - offer
  - deal
  - price
  - sell
  - buy
  - negotiate
  on_intent_mismatch: warn
  category: social
  player_metric:
    name: leverage
    starting: 0
    threshold: 3
  opponent_metric:
    name: leverage
    starting: 0
    threshold: 3
  beats:
  - id: persuade
    label: Make Your Case
    narrator_hint: Show the NPC weighing the player's words.
  - id: threaten
    label: Threaten
    narrator_hint: Escalate tension. The threat should feel dangerous.
  - id: concede_point
    label: Concede a Point
    narrator_hint: Strategic retreat. Player gives ground to gain information.
  - id: walk_away
    label: Walk Away
    narrator_hint: Player leaves the table. No deal.
  mood: tension
  resolution_mode: contest
- type: poker
  label: Poker
  intent_verbs:
  - bet
  - raise
  - call
  - fold
  - bluff
  - ante
  - wager
  on_intent_mismatch: warn
  category: social
  resolution_mode: table_resolution
  win_condition: table_showdown
  table_game: poker
  max_decision_points: 3
  beats:
  - id: fold
    label: Fold
    kind: push
    base: 0
    stat_check: WIS
    narrator_hint: Live to play another hand.
  - id: call
    label: Call
    kind: push
    base: 0
    stat_check: WIS
    narrator_hint: Match the bet. See what they've got.
  - id: bet
    label: Bet
    kind: strike
    base: 1
    stat_check: CHA
    narrator_hint: Push chips forward. Confidence or bluff?
  - id: raise
    label: Raise
    kind: strike
    base: 2
    stat_check: CHA
    narrator_hint: Escalate the stakes. Make them sweat.
  - id: bluff
    label: Bluff
    kind: push
    base: 2
    stat_check: CHA
    narrator_hint: Stone face. Sell the lie.
  - id: read_table
    label: Read the Table
    kind: angle
    target_tag: Opponent Tell
    base: 1
    stat_check: WIS
    narrator_hint: Watch their eyes. Everyone's got a tell.
  - id: cheat
    label: Cheat
    kind: strike
    base: 3
    stat_check: DEX
    narrator_hint: Palm a card. Bottom deal. The Card Shark's specialty.
  - id: accuse
    label: Accuse of Cheating
    kind: angle
    target_tag: Cheat Exposed
    base: 2
    stat_check: WIS
    narrator_hint: Call them out. If you're right, they're done. If you're wrong, so are you.
  mood: saloon
- type: combat
  label: Gunfight
  intent_verbs:
  - strike
  - attack
  - fight
  - kill
  - slay
  - swing
  - shoot
  - hit
  - stab
  on_intent_mismatch: reprompt
  category: combat
  resolution_mode: conflict
  beats:
  - id: draw
    label: Draw
    narrator_hint: A single heartbeat. Then iron clears leather.
  - id: fan_hammer
    label: Fan the Hammer
    narrator_hint: Six shots in as many seconds. Accuracy sacrificed for volume.
  - id: duck
    label: Duck
    narrator_hint: Dust puffs where you were a breath ago.
  - id: walk_away
    label: Walk Away
    narrator_hint: Holster the iron. Don't look back. Let them wonder.
  mood: combat
- type: chase
  label: Horseback Pursuit
  intent_verbs:
  - chase
  - pursue
  - flee
  - run
  - escape
  - follow
  on_intent_mismatch: reprompt
  category: movement
  player_metric:
    name: separation
    starting: 0
    threshold: 3
  opponent_metric:
    name: pursuit
    starting: 0
    threshold: 3
  beats:
  - id: spur
    label: Spur the Horse
    narrator_hint: Hooves thunder across the flats. Dust plumes behind.
  - id: canyon
    label: Canyon Shortcut
    narrator_hint: Dead-end box canyon — lose 2 separation
  - id: ford_river
    label: Ford the River
    narrator_hint: Cross water to break pursuit's trail
  - id: go_to_ground
    label: Go to Ground
    narrator_hint: Chase ends — dismount, hide among the rocks
  mood: tension
  resolution_mode: contest
