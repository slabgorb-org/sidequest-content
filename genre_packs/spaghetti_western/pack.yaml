name: Spaghetti Western
version: "1.0.0"
description: >-
  Morally ambiguous anti-heroes in a sun-scorched world where everyone has
  a price and nobody is clean. Inspired by Leone, Corbucci, and Kurosawa —
  the mythic loner who rides into a corrupt town, the standoff as ritual,
  the betrayal as inevitability. The genre handles the soul; the worlds
  handle the costume. A dusty Mexican border town and a war-torn Japanese
  province both live here.
min_sidequest_version: "0.1.0"
