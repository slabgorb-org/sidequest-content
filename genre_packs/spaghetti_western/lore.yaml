# Spaghetti Western — Genre-Level Lore
# This is the cosmology and world-building convention template.
# World packs REPLACE this with setting-specific lore.

genre_truth: >-
  The world is indifferent. There is no cosmic justice, no destiny, no
  divine plan. There are only people — flawed, greedy, desperate, and
  occasionally brave — making choices in a landscape that will outlast
  all of them. The frontier is not a place. It is a condition: the
  absence of the structures that civilized people use to pretend they
  are not animals.

cosmology: >-
  No gods intervene. If there is a higher power, it expresses itself
  only through luck — and luck is a finite resource that runs out at
  the worst possible moment. Religion exists as culture, as comfort,
  and occasionally as cover. The preacher may be sincere. The prayer
  may be heard. But the bullet does not care.

power_structure: >-
  Power flows from three sources: violence (the gun), wealth (the gold),
  and information (the secret). Every faction, every town, every alliance
  is a negotiation between these three currencies. The person who holds
  all three rules. The person who holds none is dust.

moral_framework: >-
  There are no heroes in the classical sense. There are survivors,
  opportunists, and — rarely — people who choose to protect others at
  cost to themselves. The genre does not reward virtue. It tests it.
  The question is never "will good triumph?" but "what are you willing
  to pay for the right thing, knowing it might not matter?"

frontier_nature: >-
  The landscape is a character. Heat, dust, distance, thirst — these
  are not background. They are antagonists. The frontier kills more
  people than bullets do. It strips away pretense and reduces every
  person to their essential nature: what they will do when comfort,
  law, and witness are all absent.

violence_philosophy: >-
  Violence is not casual in this genre — it is ritualized. The standoff
  is a ceremony. The gunfight is a sacrament. Every death carries weight,
  even when the dead are villains. The genre treats violence with the
  same gravity a tragedy treats fate: inevitable, consequential, and
  never truly resolved by more of the same.
