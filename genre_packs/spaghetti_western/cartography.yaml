# Spaghetti Western — Genre-Level Cartography Defaults
# World packs override this with specific regional maps.
# These define the terrain vocabulary and movement rules.

terrain_types:
  - id: desert
    name: Open Desert
    description: "Flat, sun-scorched, featureless. The horizon shimmers."
    movement_cost: 2
    water_availability: none
    cover: none
    ambush_risk: low

  - id: canyon
    name: Canyon Country
    description: "Narrow passages between sandstone walls. Echo carries."
    movement_cost: 3
    water_availability: rare
    cover: excellent
    ambush_risk: high

  - id: mesa
    name: Mesa & Butte
    description: "Flat-topped elevations with commanding views. Hard to reach, easy to defend."
    movement_cost: 3
    water_availability: none
    cover: good
    ambush_risk: moderate

  - id: river_valley
    name: River Valley
    description: "The only green on the map. Cottonwoods, muddy banks, contested water."
    movement_cost: 1
    water_availability: abundant
    cover: moderate
    ambush_risk: moderate

  - id: badlands
    name: Badlands
    description: "Eroded gullies and sharp ridges. No trail. No shade. No mercy."
    movement_cost: 4
    water_availability: none
    cover: moderate
    ambush_risk: moderate

  - id: grassland
    name: Prairie / Grassland
    description: "Rolling open country. Good for cattle. Bad for hiding."
    movement_cost: 1
    water_availability: seasonal
    cover: none
    ambush_risk: low

  - id: mountain_pass
    name: Mountain Pass
    description: "High, cold, narrow. Controls access between regions."
    movement_cost: 4
    water_availability: seasonal
    cover: good
    ambush_risk: high

  - id: town
    name: Settlement
    description: "A cluster of buildings and the illusion of civilization."
    movement_cost: 0
    water_availability: well
    cover: good
    ambush_risk: moderate

settlement_types:
  - id: border_town
    name: Border Town
    description: >-
      Straddles the line between territories or nations. Double the
      factions, double the corruption, double the opportunity.
    typical_factions: [outlaws, law, merchants, power_brokers]
    population: medium

  - id: mining_town
    name: Mining Town
    description: >-
      Built on a vein of silver or gold. Booming or busted, nothing
      in between. Full of desperate men with money or desperate men
      without it.
    typical_factions: [merchants, outlaws, power_brokers]
    population: medium

  - id: railroad_town
    name: Railroad Town
    description: >-
      Exists because the tracks go through it. Will die if they don't.
      The railroad company is the real government.
    typical_factions: [power_brokers, merchants, law]
    population: large

  - id: ghost_town
    name: Ghost Town
    description: >-
      Abandoned when the mine played out or the water dried up. Empty
      buildings, creaking signs, and the feeling of being watched.
    typical_factions: [outlaws]
    population: none

  - id: ranch
    name: Ranch / Hacienda
    description: >-
      A private fiefdom. The landowner's word is law within the fence
      line. May be a haven or a prison depending on who owns it.
    typical_factions: [power_brokers, guns_for_hire]
    population: small

  - id: mission
    name: Mission
    description: >-
      Adobe walls, a bell tower, and the last pretense of mercy in
      the territory. May offer sanctuary. May have its own agenda.
    typical_factions: [merchants]
    population: small

route_types:
  - id: trail
    name: Trail
    description: "A marked path. Faster than open country. Predictable."
    speed_modifier: 1.5
    visibility: high
    bandit_risk: moderate

  - id: road
    name: Stage Road
    description: "Maintained road connecting settlements. The fastest way — and the most watched."
    speed_modifier: 2.0
    visibility: high
    bandit_risk: high

  - id: smuggler_path
    name: Smuggler's Path
    description: "Unmarked, winding, known only to those who need it."
    speed_modifier: 0.8
    visibility: low
    bandit_risk: low

  - id: river_crossing
    name: River Crossing
    description: "The territory's chokepoint. Whoever controls the crossing controls the traffic."
    speed_modifier: 0.5
    visibility: high
    bandit_risk: high
