# Seed tropes for spaghetti_western — short-arc narrative hooks dealt at
# session start from a per-pack deck (ADR-018, ADR-128). Dealt without
# replacement; each seed expires after its lifespan_turns and lingers as a
# ghost for later callback. Seeds are baited hooks (ADR-014
# diamonds-and-coal) — vague on purpose; the narrator retroactively threads
# engaged seeds into whatever the campaign demands.
#
# World-agnostic by design (ADR-140): "the genre handles the soul; the
# worlds handle the costume." These must land equally on a border town, a
# ward of 1850s Manhattan, or a mill city's company streets. Genre grammar
# only — everyone has a price, nobody is clean, the standoff is a ritual,
# and the past always rides in eventually.

- id: a_stranger_asks_after_an_old_name
  name: A Stranger Asks After an Old Name
  description: >-
    Someone has come to town asking about a name — politely, patiently,
    buying drinks and information in that order. The name belongs to a
    player character's past, or to someone they once rode with, worked
    for, or buried. The stranger does not say why they are asking.
    Professionals never do.
  flavor_tags: [past, pursuit, identity, stranger]
  lifespan_turns: 7
  delivery_hints:
    - The stranger's questions are a half-step out of date — they know the name's history but not its present face
    - Locals are already trading the stranger's coin for half-remembered scraps, some of them accurate
    - The stranger is courteous to the player character in particular, which could mean anything
  narrative_hint: >-
    The stranger is a clock — every turn they remain unconfronted,
    they learn more. Let their purpose be honestly ambiguous: hired
    gun, kin of the wronged, or someone carrying news the old name
    would actually want.

- id: the_face_on_the_notice
  name: A Familiar Face on the Notice
  description: >-
    A reward notice is posted — fresh ink, official seal or close
    enough — and the face or name on it is known to the party: a
    friend, an old partner, somebody who once did them a good turn.
    The price is high enough to tempt honest people. The crime listed
    is not the one anybody who knows them would have predicted.
  flavor_tags: [bounty, loyalty, law, temptation]
  lifespan_turns: 8
  delivery_hints:
    - Others have seen the notice; some are already calculating, and one has sent word ahead for help
    - The listed crime is specific, recent, and wrong in a detail the party is positioned to know is wrong
    - The wanted friend has not run, which either means innocence or means the running is done
  narrative_hint: >-
    The notice is a loyalty test priced in currency. Let the party
    choose between the reward, the friend, and the truth — three
    different things — and let whoever posted the notice be the
    real story.

- id: the_collection_round
  name: The Collection Round Comes Through
  description: >-
    Somebody collects here — for protection, for the boss, for the
    company, for the "fund." The collection round arrives while the
    party is present, and the collectors are businesslike about it.
    The take is modest, the schedule is regular, and everyone pays.
    Everyone. That is rather the point being made.
  flavor_tags: [extortion, power, town, complicity]
  lifespan_turns: 7
  delivery_hints:
    - The collectors are polite to the party — newcomers get one free pass and a clear explanation
    - One local has decided, this round, not to pay; the consequences are scheduled, not immediate
    - The money's destination is an open secret, and following it leads somewhere respectable
  narrative_hint: >-
    The round is the town's power structure performing itself. Let the
    party's response — pay, refuse, intervene, invest — set their
    standing with every faction at once. The non-payer is the Bang:
    helping them is war, watching is complicity.

- id: both_sides_make_an_offer
  name: Both Sides Make an Offer
  description: >-
    Two powers are squeezing the same territory — two bosses, two
    families, the company and the strikers, the law and the other law.
    Both, within days of the party's arrival, make an offer of work.
    The offers are good. The work is against each other. Neither side
    tolerates a refusal that smells of the other's coin.
  flavor_tags: [factions, mercenary, town, leverage]
  lifespan_turns: 8
  delivery_hints:
    - Each side's recruiter bad-mouths the other with accusations that are, on inspection, both true
    - The pay difference between the offers is itself information about who is winning
    - A previous neutral party left town suddenly; their lodgings are available, cheap
  narrative_hint: >-
    The double offer is the Yojimbo engine — let the party play the
    sides, join one, or stand conspicuously apart, and make each
    posture cost something. The town's ordinary people are the stakes
    nobody at the table mentions.

- id: the_widow_calls_in_a_debt
  name: The Widow Calls In What's Owed
  description: >-
    A debt a player character owes — money, a life, an unkept promise —
    has changed hands: the man it was owed to is dead, and his widow,
    daughter, or partner has the paper and the long memory. They have
    arrived, or sent for the character, with a settlement in mind that
    is not what the dead man would have asked.
  flavor_tags: [debt, past, grief, reckoning]
  lifespan_turns: 7
  delivery_hints:
    - The claim is just; whatever the character's version of events, the core of it holds
    - The proposed settlement is strange — a task, an escort, a truth told to a third party — not coin
    - Someone else offered to settle the debt for them, and the holder refused; that refusal is a clue
  narrative_hint: >-
    The debt-holder wants something the debt is merely leverage for.
    Let the real ask reveal what the dead man left unfinished, and
    let paying in full change how the character's past reads —
    to others and to themselves.

- id: the_gun_someone_wants_back
  name: Somebody Wants the Gun Back
  description: >-
    A weapon in the party's possession — won, bought, looted, inherited
    — is recognized. It has a history: a maker's mark, a notch pattern,
    an engraving someone reads from across the room. The person who
    recognizes it has a claim, a grudge, or a price, and the weapon's
    story is about to become the party's story.
  flavor_tags: [weapon, history, claim, recognition]
  lifespan_turns: 6
  delivery_hints:
    - The recognizer goes very still first, and only afterward decides what to feel about it
    - The weapon's previous owner is a story locals tell two different ways depending on who's buying
    - Selling it suddenly becomes both easy and unwise; offers arrive within the day
  narrative_hint: >-
    The weapon is a chain of custody written in consequences. Let the
    claim be partly legitimate, let the grudge attach to the previous
    owner's deeds, and let keeping it mean inheriting its enemies.

- id: the_lawman_is_honest_and_outnumbered
  name: The Lawman Is Honest, Which Is the Problem
  description: >-
    There is a lawman here — sheriff, constable, ward captain, company
    marshal — who is actually trying to do the job. This makes them
    inconvenient to everyone with means, and the means are being
    gathered. The lawman knows. They have started deputizing strangers,
    because the locals know better than to accept.
  flavor_tags: [law, integrity, town, doom]
  lifespan_turns: 8
  delivery_hints:
    - The badge offer comes with pay that is honestly described as not worth it
    - The respectable opposition has a legal path to removing the lawman and a faster one in reserve
    - The lawman keeps a file; people would pay to know what's in it, and more to burn it
  narrative_hint: >-
    The honest lawman is the genre's doomed saint — let the party
    decide whether to stand with them, profit from their fall, or
    walk away, and let the file be the load-bearing secret. No
    rescue is clean; the town watches everything.

- id: the_job_is_a_rehearsal
  name: The Job Is Somebody's Rehearsal
  description: >-
    Simple work — guard this, carry that, stand there Thursday — pays
    a little too well and asks a little too precisely. The employer is
    testing something: a route's defenses, a guard rotation, the
    party's own nerve and discretion. The real job is later, bigger,
    and the party has just become either accomplices or loose ends.
  flavor_tags: [heist, deception, employer, complicity]
  lifespan_turns: 7
  delivery_hints:
    - The instructions include details that only matter if someone is watching how they're carried out
    - Pay arrives promptly and with a bonus, which experienced hands know is the worrying part
    - A second engagement is offered before the first is even complete
  narrative_hint: >-
    The rehearsal structure lets the party discover the real job from
    inside its planning. Let the moment of realization be the Bang:
    they know enough to profit, to warn, to bargain, or to take the
    score themselves — and the employer planned for three of those.

- id: an_old_partner_resurfaces_flush
  name: An Old Partner Resurfaces, Flush
  description: >-
    Someone a player character once worked with — the kind of work one
    doesn't list — is in town, conspicuously prosperous, and delighted
    to see them. The delight is real. So is the prosperity. The story
    of where it came from has a hole in it exactly the shape of the
    last job they did together.
  flavor_tags: [past, betrayal, partnership, money]
  lifespan_turns: 7
  delivery_hints:
    - The partner is generous to the point of insistence; old debts are waved off, drinks appear
    - Their version of the old days is warmer than the character remembers, and edits one night entirely
    - Somebody else watches the partner with a patience that has nothing friendly in it
  narrative_hint: >-
    The reunion is a confession in installments. Let the prosperity
    trace back to something taken — from the character, or blamed on
    them — and let the partner's warmth be genuine guilt looking for
    cheap absolution. The watcher is holding the other end of it.

- id: the_town_remembers_a_different_version
  name: The Town Already Knows the Story — Wrong
  description: >-
    Something a player character did — or is said to have done — has
    arrived here ahead of them as a story. The story has grown teeth:
    braver, bloodier, or uglier than the truth. Strangers buy drinks
    or pick fights based on a version of the character that does not
    exist. Correcting the record convinces no one.
  flavor_tags: [reputation, legend, identity, burden]
  lifespan_turns: 6
  delivery_hints:
    - The first person to recognize them gets a detail wrong and is angrily corrected — by a bystander
    - Someone is in town specifically because of the story, with intentions calibrated to the false version
    - The story's origin can be traced; somebody started it deliberately
  narrative_hint: >-
    Reputation is the genre's second currency. Let the false legend
    pay and cost in the same scene, and let the deliberate origin be
    the thread — someone profits from this character being mythologized.

- id: the_witness_who_saw_it_all
  name: There Was a Witness
  description: >-
    Something happened here recently — a killing, a fire, a deal that
    went wrong in the dark — and the official account has settled over
    it like a tarp. But there was a witness. Word of that is starting
    to move, and every interested party is converging on the same small
    person with very different intentions.
  flavor_tags: [witness, coverup, race, protection]
  lifespan_turns: 6
  delivery_hints:
    - The witness is somebody beneath notice — which is why they saw, and why they're still alive
    - The official account has a beneficiary who is paying to keep it official
    - The witness wants only one thing, and it is not justice; it is to leave
  narrative_hint: >-
    The witness is a small person holding a heavy thing. Let the party
    reach them in the middle of the convergence and decide what their
    knowledge is for — sale, leverage, truth, or ash. Genre truth:
    whoever helps them pays for it.

- id: the_marked_money
  name: The Money Is Marked
  description: >-
    Money has come into the party's hands — payment, winnings, a found
    purse — and somewhere along its travels it was marked: cut notes,
    recorded serials, a banker's private cipher. Spending it leaves a
    trail. Somebody designed it to, and they are following the
    blossoms of every note that surfaces.
  flavor_tags: [money, trap, pursuit, taint]
  lifespan_turns: 7
  delivery_hints:
    - The first note spent brings a quiet visitor within days, asking where it came from
    - The marking is professional — this money was bait in something that already sprang on somebody else
    - Holding it is safe; spending it is signaling; returning it is a conversation nobody survives unchanged
  narrative_hint: >-
    The money is a lit fuse moving backward — it tells its owner where
    it's been. Let the party trace the marking to its purpose and find
    the trap's original quarry, who has opinions about whoever is
    spending their bait.

- id: the_kid_wants_a_name
  name: The Kid Wants to Make a Name
  description: >-
    There is a kid — young, fast, unproven, and aimed at a player
    character like a compass needle. Maybe it's the reputation, maybe
    a grudge inherited from somebody the character barely remembers.
    The kid is not ready. The kid does not believe that. Everyone in
    town can see how this wants to end.
  flavor_tags: [challenge, youth, reputation, ritual]
  lifespan_turns: 8
  delivery_hints:
    - The kid's preparation is diligent and public; the town has begun, horribly, to take an interest
    - Somebody is sharpening the kid on purpose — funding, flattering, feeding the grievance
    - The kid has one genuine grievance under the bravado, and it is older than they are
  narrative_hint: >-
    The kid is a slow tragedy the party can steer. Deflection,
    de-escalation, and delegation all exist — and all cost face in a
    world where face is armor. Let whoever is sharpening the kid be
    the real enemy, and the kid the weapon they're willing to break.

- id: the_burial_nobody_attends
  name: The Funeral Nobody Attends
  description: >-
    Somebody died here recently, and the burial is conspicuously,
    eloquently unattended — no mourners, a hurried officiant, a grave
    at the edge of things. The dead had standing once. The town's
    refusal to mourn is a verdict, or a fear, or an instruction
    somebody issued. The party catches the tail end of it.
  flavor_tags: [death, town, silence, verdict]
  lifespan_turns: 6
  delivery_hints:
    - One person watches the burial from a distance and leaves before it ends
    - Asking about the deceased gets the same three vague words from everyone, like a rehearsed answer
    - The dead's effects are being sold off fast and cheap, except one item nobody will touch
  narrative_hint: >-
    The empty funeral is a town-sized guilty conscience. Let the
    distant watcher be the loose thread, the untouchable item the
    physical clue, and the rehearsed answer the proof of instruction.
    Whoever taught the town its three words is the seed's true face.
