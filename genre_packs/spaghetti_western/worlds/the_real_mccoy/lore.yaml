dispatches:

  - id: argus_our_doctor_iii
    format: newspaper
    publication: "The Allegheny Argus"
    dateline: "PITTSBURGH — MAY 4, 1878"
    headline: "OUR DOCTOR REMAINS SILENT; THE RACE SPEAKS FOR HIM"
    byline: "Mordecai Carrington, Editor"
    body: >-
      We have in this city a physician-engineer whose inventions — the
      hydraulic splint, the antiseptic field-kit, the river-water
      purifier recently adopted at Bethel's lower vestry — are a
      monthly rebuke to the doctrine that the Negro's mechanical genius
      is a myth.

      Dr. GRANVILLE McCOY has declined this week to receive a
      delegation from this office for the THIRD consecutive time. The
      Leader has taken this as evidence of the doctor's distaste for
      "racial advocacy." We take it as the reticence of a man who is
      working. Let the Leader's editors produce one splint; we will
      accept an interview when they do. In the meantime this column
      will continue to claim the doctor for the race he belongs to
      whether he consents or not.

  - id: leader_self_appointed
    format: newspaper
    publication: "Pittsburg Leader"
    dateline: "PITTSBURGH — MAY 8, 1878"
    headline: "THE SELF-APPOINTED PHYSICIAN OF PROGRESS"
    byline: "Editorial"
    body: >-
      The city endures, at Fifth and Wood and along the 28th Street
      sidings, a private railway carriage in which one Dr. McCoy
      claims to practice medicine, mechanics, and — by the Argus's
      continuing declarations — the uplift of an entire race. We
      raise no objection to the first two. The third is a posture
      the doctor himself has never taken; the Argus has seconded him
      into it without a vote. We invite the doctor, in the interest
      of his own reputation, to disavow the advocacy done in his
      name. His continued silence is increasingly difficult to tell
      from consent.

  - id: argus_the_loupe
    format: newspaper
    publication: "The Allegheny Argus"
    dateline: "BRADDOCK — JUNE 12, 1878"
    headline: "WHAT THE FOREMAN'S GLASS SEES; WHAT IT DOES NOT SAY"
    byline: "Mordecai Carrington, Editor"
    body: >-
      At the Edgar Thomson hiring line on Monday last, this editor
      observed the clerk at the foreman's table examining the
      applicants through a brass-rimmed optic of clear manufacture
      and unclear provenance. Upon inquiry, the clerk claimed the
      glass was "for reading the card." The card was printed at
      eight-point Clarendon. We do not believe him.

      The glass is a fluoroscope monocle. It renders the interior
      of the human chest visible to the operator for a duration of
      some seconds. It was designed for the field surgeon's tent.
      It is being used, at Braddock and — we are informed — at
      Homestead and at Eliza Furnace, to reject any man whose lungs
      show the shadow of consumption, silicosis, or old injury. No
      man so rejected is told why.

      Capt. WILLIAM JONES has declined, at this writing, to comment
      for publication. We note that he has not denied.

  - id: volksblatt_raubritter_bench
    format: newspaper
    publication: "Pittsburger Volksblatt"
    dateline: "SEWICKLEY HEIGHTS — 14 März 1878"
    headline: "DER RAUBRITTER'SCHE FORSCHUNGSSTAND ERÖFFNET"
    byline: "Aus dem Deutschen übersetzt"
    body: >-
      On Thursday last the Raubritter Concern opened the Industrial
      Sciences Bench at the Shadyside residence of Herr Doktor
      Cornelius Raubritter. Five Heidelberg men at the inaugural
      demonstration; Krupp-pattern plate laboratory fittings; a
      Gramme ring dynamo freshly delivered from Vienna. An address
      in lightly ironic German from the Herr Doktor on "the duty
      of the well-made shop to answer the carelessness of the
      well-meaning tinkerer." The guest list was drawn from the
      German commercial families of Deutschtown and the Ellsworth
      Avenue set. Herr Doktor McCoy was invited and did not attend.
      Herr Doktor Raubritter did not remark upon the absence. The
      Bench commences contract work on Monday the 18th.

  - id: argus_prudence_sighting
    format: newspaper
    publication: "The Allegheny Argus"
    dateline: "STRIP DISTRICT — JUNE 18, 1878"
    headline: "A LADY AT THE PRODUCE MARKET"
    byline: "Staff"
    body: >-
      A Monongahela House porter returning from the Liberty Avenue
      produce market on Friday morning reports having exchanged
      courtesies with a lady in a plain dark dress who thanked him
      in the Pennsylvania Dutch of Lancaster County and whose
      deportment, he says, was "more correct than I have ever
      been." She was accompanied by a child of about twelve from
      Miss Semple's Academy of Allegheny City and by no other
      person. The porter recognized her from no description. This
      paper does not speculate. This paper does observe that the
      porter was, at the end of his errand, certain of the
      encounter in a way that has kept him talking about it since.

  - id: wu_washington_envoy
    format: telegram
    from: "WAR DEPT / WASHINGTON"
    to: "DR G McCOY / CARE WESTERN UNION PITTSBURGH"
    dateline: "MAY 16 1878 10:42"
    charge: "48 WORDS RELAYED FROM WASHINGTON MAIN OFFICE VIA HARRISBURG"
    body: >-
      DOCTOR — UNDERSIGNED REQUESTS AN INTERVIEW AT YOUR EARLIEST
      CONVENIENCE — PARTICULARS NOT FOR WIRE — MATTER CONCERNS
