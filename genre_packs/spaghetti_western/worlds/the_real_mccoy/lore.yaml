# The Real McCoy — World Lore
# In-world artifacts. Dispatches, clippings, wires, tracts, memos, broadsides.
# Short, stake-bearing, info-dense. Winchell-meets-Hemingway register.
# Datelines always. Period-correct spelling (Pittsburg Leader, no 'h').

world_truth: >-
  Pittsburgh in the spring of 1878 is the loudest city in the country and
  the one that sees itself least clearly. Coal smoke holds the inversion
  over the three rivers eleven months of the year. A physician-engineer
  named Dr. Granville McCoy rides the rails in an armored Pullman workshop
  building devices the city does not always know it needs and the wider
  world is learning to misuse. The household is small. The enemies are
  not. Every gadget he makes is read twice — once by the people it was
  made for, once by the people it was made against.

the_city: >-
  Pittsburgh and Allegheny City are still two municipalities across a
  river and a bridge toll. Union Station is eight months rebuilt from
  the Roundhouse Riot. The Bessemer converter at Edgar Thomson Steel
  in Braddock is visible seven miles up the Monongahela on a clear
  night — and there are five clear nights a year. The new Duquesne
  Incline ticks up and down Coal Hill every twenty minutes. The
  Allegheny Arsenal is winding down. Russell's Bible House is
  winding up. The Strip District is in four languages before breakfast.

the_household: >-
  Dr. Granville McCoy's train runs the Pittsburgh, Fort Wayne & Chicago
  main line and its branches, based out of the 28th Street yards. Six
  cars: locomotive, boiler, workshop, study, library, observation, plus
  the passenger, kitchen, medical, and caboose aft. McCoy builds.
  Tabitha McCoy runs logistics. Prudence does what is needed. Dr. Teague
  keeps the household from dying of its own enthusiasm. The crew — that
  is, you — does the work the doctor's mildness cannot do in person.

the_weaponization: >-
  Every device McCoy makes is misused by somebody. The household
  maintains a ledger of this in Tabitha's hand, bound in black Morocco
  in the Study safe. The rule of the ledger is that no entry is closed
  until the Weaponization has been disrupted, documented, or lived
  with — and most, most are lived with. This is the household's
  discipline and the world's tragedy in one column of a book.

factions:
  - name: McCoy Industries Ltd.
    summary: "The train. Dr. Granville McCoy's rolling laboratory and its household."
    reputation_id: merchants
    description: >-
      Six-car private train, Pullman-bodied, Baldwin 4-4-0 locomotive,
      Planté lead-acid banks for the electrical bench, Pintsch gas for
      lights, Baker coal stoves for heat. Dr. McCoy in the Workshop Car.
      Tabitha McCoy in the Study. Prudence where she is needed. Dr.
      Abigail Teague in the Medical Car. Commission work for the War
      Department, the Pennsylvania Railroad, Edgar Thomson Steel, the
      U.S. Patent Office, the City of Pittsburgh Board of Health, and
      — when the doctor is caught alone — the Allegheny Argus. The
      crew is the household's field arm.
    leader: Dr. Granville McCoy
    base: The 28th Street yards siding, Pittsburgh
    goals:
      - Fulfill the commissions
      - Keep the household intact
      - Maintain the ledger of Weaponizations

  - name: Raubritter Concern
    summary: "Old-money industrialist cartel out of Shadyside and Sewickley Heights."
    reputation_id: power_brokers
    description: >-
      Cornelius Raubritter, Heidelberg-educated, Sewickley Heights estate
      ("Schloss Hohenzollern-Sewickley"), Shadyside city residence on
      Ellsworth Avenue. Industrial Sciences Bench opened March 1878
      with Heidelberg-trained staff and Krupp-plate laboratory fittings.
      Pittsburg Leader carries the Concern's line; Raubritter's private
      secretary drafts the editorials. Allied with Pinkerton Pittsburgh,
      Keely Motor Company (quietly, through a cutout), the Southern
      Redeemer weeklies, and Silas Markham in Paris.
    leader: Cornelius Raubritter
    base: East Liberty / Sewickley Heights
    goals:
      - Surpass McCoy in commerce, patent, or press
      - Acquire the unlicensed replicant chassis program at scale
      - Make the doctor's apolitical posture politically untenable

  - name: Pinkerton National Detective Agency — Pittsburgh Branch
    summary: "Industrial surveillance and contract labor-suppression, Chicago-HQ'd."
    reputation_id: guns_for_hire
    description: >-
      Agent Oscar Holm, superintendent, Swedish-immigrant, formal, polite,
      relentless. Branch offices above the Fourth Avenue bank district.
      Contracts current with Carnegie, Frick Coke, Raubritter, B&O, PRR.
      Photographic intake on every arrival at the 28th Street yards.
      The Aliquippa draft of 14 February 1879 — naming specific Mon
      Valley mill towns by letterhead — is on Holm's desk this season.
    leader: Agent Oscar Holm
    base: Fourth Avenue, Downtown
    goals:
      - Fulfill the contracts
      - Keep photographic intake current on McCoy's train
      - Acquire McCoy technology by contract, by purchase, or by subterfuge

  - name: The Allegheny Black Press
    summary: "The Allegheny Argus and its allied pulpits."
    reputation_id: merchants
    description: >-
      Mordecai Carrington, editor, third-generation Hill District.
      Offices above the Wylie Avenue mercantile, one block from Bethel
      AME. Press run of about 3,200 on the Ackerley hand-press. Ally
      networks: Bethel AME clergy, Prince Hall lodges (Doric No. 18 on
      Wylie), the Monongahela House all-Black staff, the Pullman
      Porters' Mutual Aid Society, the Christian Recorder in Philadelphia,
      T. Thomas Fortune's New York Globe (founded 1879). Publishing
      rival: the Pittsburg Leader, which Carrington calls "the paper
      that will shake your hand and steal your watch."
    leader: Mordecai Carrington
    base: Wylie Avenue, Hill District
    goals:
      - Claim McCoy publicly for the race, without his consent
      - Defend Black civic space in Pittsburgh
      - Muckrake Raubritter

  - name: The Replicant Makers (anonymous cohort)
    summary: "Plural, uncoordinated, each with its own small stable and mission."
    reputation_id: power_brokers
    description: >-
      Not one faction; several. Suspected makers include the Raubritter
      Industrial Sciences Bench (via Markham's Paris plans), the U.S.
      War Department Ordnance Bureau (via the Allegheny Arsenal's
      quieter shops), the British War Office (through the Vickers
      correspondence), the French Third Republic (via the Gare du Nord
      address), the Imperial German General Staff intelligence
      apparatus (post-1871), an Okhrana cell operating out of a Hester
      Street tenement in New York, and — the household suspects,
      without proof — one or more industrial cartels. No maker knows,
      reliably, how many other makers there are. Every replicant has a
      mission from its maker. Some missions cross. Some replicants
      defect. A few have written letters.
    leader: plural
    base: plural
    goals:
      - Each maker pursues its own mission
      - The stable grows without central coordination
      - The world has not yet agreed that they exist

