  - id: scientific_american_muybridge
    format: teletype
    publication: "Scientific American, by wire to Pittsburgh Dispatch"
    dateline: "NEW YORK — OCTOBER 19, 1878"
    headline: "THE HORSE IN MOTION — PALO ALTO PLATES PUBLISHED"
    body: >-
      Mr EADWEARD MUYBRIDGE of the Palo Alto Stock Farm, under
      commission of Mr LELAND STANFORD, has resolved the gait of
      the running horse by means of twelve electromechanical
      shutters tripped in sequence by trip-wires laid across the
      track. Exposures one one-thousandth of a second on
      wet-collodion plates. The series is reproduced in this
      number of the SCIENTIFIC AMERICAN. The horses are ABE
      EDGINGTON, OCCIDENT, and SALLIE GARDNER. At the gallop all
      four feet are off the ground simultaneously, in the
      attitude of a crouch, not the rocking-horse of the
      painters. Mr MUYBRIDGE proposes to extend the series to the
      human figure in motion. Applications of the method to
      medicine, athletics, and the courts are expected to follow.

  - id: electrical_world_brush
    format: teletype
    publication: "Electrical World, relayed by wire"
    dateline: "CLEVELAND — APRIL 29, 1879"
    headline: "BRUSH ARC LAMPS ILLUMINATE PUBLIC SQUARE"
    body: >-
      Twelve BRUSH arc lamps of two-thousand candlepower each were
      illuminated at the Public Square of this city on Tuesday
      evening at a quarter past eight. Power supplied by a single
      BRUSH dynamo in the basement of the Telegraph Supply Company
      on Saint Clair. The lights burned eight hours to a carbon
      pair. Pittsburgh, Baltimore, and Buffalo are understood to
      be taking subscriptions. Mr CHARLES F BRUSH has filed no
      public comment on the installation at the 28th Street yards
      of DR GRANVILLE McCOY, nor on the private rumor that that
      installation preceded this one by three months.

  - id: patent_mccoy_fluoroscope
    format: patent
    publication: "United States Patent Office Gazette"
    dateline: "WASHINGTON — FILED MARCH 3, 1877 / ISSUED JANUARY 15, 1878"
    headline: "No. 199,412. — McCOY, GRANVILLE. FLUOROSCOPIC MONOCLE FOR FIELD DIAGNOSIS."
    body: >-
      A handheld optical-electrical device for the rapid
      fluoroscopic examination of the thoracic cavity in the field
      clinic, comprising a CROOKES-type evacuated tube in a
      gutta-percha housing, coupled by a flexible conduit to a
      PLANTE-cell power bank of not fewer than six cells, and
      terminating in a calcium tungstate fluorescent screen mounted
      in a brass monocle frame. The operator places the lens over
      the patient's sternum, the screen opposite, and observes the
      shadow of bone and viscus for not more than ten seconds.
      Exposure above twenty seconds is contra-indicated. The
      present inventor contemplates its use solely by the
      qualified physician and upon the patient in extremity. No
      license is granted for any other purpose.

  - id: patent_raubritter_flywheel
    format: patent
    publication: "United States Patent Office Gazette"
    dateline: "WASHINGTON — FILED AUGUST 22, 1878 / ISSUED MAY 6, 1879"
    headline: "No. 215,088. — RAUBRITTER, CORNELIUS. IMPROVED FLYWHEEL REGULATOR FOR ETHERIC-VAPOR ENGINES."
    body: >-
      A flywheel governor for the class of engines operating upon
      the ETHERIC VAPOR of KEELY, comprising a Siemens-wound
      regulator coil inductively coupled to a mass flywheel of not
      less than four hundredweight, the regulator being tuned to
      the characteristic frequency of the ETHERIC RESONATOR. The
      present inventor avers that the device improves the
      consistency of KEELY-type output by a factor of not less than
      three. The present inventor does not, by this filing, aver
      the reality of the ETHERIC VAPOR itself. That question is
      left to the judgment of the subscriber.

  - id: mccoy_broadside_purifier
    format: broadside
    publication: "McCoy Industries Ltd., printed at the Monongahela House press-room"
    dateline: "PITTSBURGH — SPRING 1878"
    headline: "THE McCOY GRAVITY-FED RIVER-WATER PURIFIER — ADOPTED BY BETHEL AME"
    body: >-
      For parishes, almshouses, mill-yards, and the crowded
      tenement — the McCOY GRAVITY-FED PURIFIER renders the
      Monongahela, Allegheny, and Ohio waters FIT FOR THE
      HOUSEHOLD. Twin-chamber sand-and-charcoal, sulphate-of-
      aluminium flocculant in the upper basin, outlet tap of
      TINNED COPPER not LEAD. FORTY GALLONS THE HOUR. NO MOVING
      PART TO FAIL. Recently installed at BETHEL AME lower
      vestry on WYLIE AVENUE, at SAINT ADALBERT'S parish house
      of the SOUTH SIDE, and at the MONONGAHELA HOUSE HOTEL.
      Subscription by the quarter — inquire at the front desk.
      Of this device the ALLEGHENY ARGUS has written: "the only
      gentleman in Pittsburgh who has addressed typhoid fever
      with an instrument rather than a sermon." Of this device
      the doctor has written: "it is a sand filter with a tap."
      Both are correct.

  - id: mccoy_broadside_splint
    format: broadside
    publication: "McCoy Industries Ltd., printed at the Monongahela House press-room"
    dateline: "PITTSBURGH — SPRING 1878"
    headline: "THE McCOY HYDRAULIC FIELD SPLINT — FOR THE MILL-YARD AND THE MINE-HEAD"
    body: >-
      A splint for the compound fracture that sets ITSELF on
      application of water from the nearest pump. Vulcanized
      rubber bladder, gutta-percha stiffener, brass buckle — a
      working man bandaged in forty seconds by a foreman with
      neither medical training nor a second hand free. Six
      splints to a wall-crate. Crates as installed at EDGAR
      THOMSON STEEL, at the LUCY and ISABELLA furnaces, at the
      WESTINGHOUSE air-brake works, and at the ALLEGHENY
      ARSENAL infirmary. Subscription per crate: inquire 28th
      Street yards Pullman or the Monongahela House front
      desk. This splint was designed for the mill. Reports of
      its appearance in the saddlebags of light cavalry on
      the southwestern frontier are not, at this writing,
      confirmed.

  - id: cartoon_harpers_may
    format: cartoon
    publication: "Harper's Weekly"
    dateline: "NEW YORK — MAY 11, 1878"
    headline: "THE DOCTOR AND THE RICH MAN (Thomas Nast, wood engraving)"
    caption: >-
      In the foreground, a small bespectacled man in a Pullman-car
      doorway offers a hydraulic splint to a one-legged mill hand.
      Behind him, a tall figure in a frock coat — unmistakably
      Heidelberg cap and fencing scar — holds the same splint in
      a closed fist like a truncheon, while a top-hatted Pinkerton
      takes down the mill hand's name in a ledger. Legend: *DR. G.
      McCOY: "IT IS A SPLINT, SIR."  HERR DR. R——: "IT IS
      WHATEVER I CHOOSE TO MAKE IT."* Below the legend, in
      smaller type: *And the Pinkerton pays by the head.*

  - id: cartoon_leader_answer
    format: cartoon
    publication: "Pittsburg Leader"
    dateline: "PITTSBURGH — MAY 18, 1878"
    headline: "THE ARGUS'S MIRROR (Unattributed)"
    caption: >-
      A stout editorial desk labeled *ALLEGHENY ARGUS*. Behind it,
      an editor — caricatured with Carrington's moustache and AME
      preaching-band — holds a small mirror up to a weary,
      abstracted figure at the drafting board. In the mirror the
      figure's reflection is in clerical vestments, hands raised
      in benediction. The figure at the board says: *Sir, I am
      making a valve.* The editor says: *Doctor, you are
      preaching whether you will or no.* A small devil at the
      editor's elbow is labelled *CIRCULATION*.

  - id: case_file_pinkerton_aliquippa
    format: case_file
    publication: "Pinkerton National Detective Agency — Pittsburgh Branch, Internal"
    dateline: "PITTSBURGH — FILED FEBRUARY 14, 1879"
    headline: "DRAFT CONTRACT ALIQUIPPA — MONONGAHELA VALLEY SCHEDULE"
    body: >-
      Subject: operational schedule for the period covering the
      seasonal hiring cycle at the mills and works of the
      MONONGAHELA and ALLEGHENY VALLEYS. Priority surveillance
      targets, by letterhead: JONES & LAUGHLIN ELIZA FURNACE
      (South Side); EDGAR THOMSON STEEL WORKS (Braddock); LUCY
      FURNACE No. 1 (Lawrenceville); ISABELLA FURNACE (Etna);
      HOMESTEAD STEEL WORKS (Homestead, under construction);
      UNION IRON MILLS (Thirty-third Street). Method: paired
      operatives at the hiring line, photographic intake,
      cross-reference to the consolidated labor index at Chicago.
      Specific instruction as to any applicant whose application
      is accompanied by correspondence bearing the MC letterhead
      or the ALLEGHENY ARGUS imprint: RECORD, DO NOT INTERVENE.
      Agent HOLM's cover memorandum attached: "The household is
      to be photographed, not obstructed. The obstruction comes
      later and from elsewhere."

  - id: case_file_pinkerton_replicant
    format: case_file
    publication: "Pinkerton National Detective Agency — Pittsburgh Branch, Internal"
    dateline: "PITTSBURGH — FILED MARCH 2, 1879"
    headline: "SUBJECT: IRREGULAR EMPLOYEE — J&L ELIZA FURNACE CAST FLOOR"
    body: >-
      Subject: an applicant hired to the cast floor of the Eliza
      Furnace on the nineteenth of February. Gave the name
      MARTIN KRAUSE. References, on inquiry, from a firm that
      does not exist at an address that does. Handshake too firm.
      Work output on the first shift: one hundred and forty
      percent of the experienced-crew average, with no visible
      fatigue and no recorded rest. Pulse taken by the shift
      medic after an incident on the twenty-fourth: forty-eight
      to the minute, forehead not damp. The medic signed the card
      as "fit" because he did not know what else to write.

      This office recommends: no intervention pending CLIENT
      INSTRUCTION. Possible articulation with the McCOY dossier.
      Further: at the Friday shift change subject was observed in
      conversation with another cast-floor hand, surname
      WEINHOLD, who may be of the same type. Subject has attended
      the morning mass at St. Mary of the Mount on Sunday the
      twenty-seventh. He sang the responses in passable Latin.
      He did not take communion.

  - id: watchtower_russell
    format: broadside
    publication: "Zion's Watch Tower and Herald of Christ's Presence"
    dateline: "ALLEGHENY CITY — JULY 1879"
    headline: "THE PRESENT EVIL AGE AND THE RETURN OF OUR LORD"
    byline: "C. T. Russell, 610 Arch Street"
    body: >-
      Brethren — it has been given to us to see that OUR LORD has
      returned, not visibly in the clouds, but INVISIBLY in the
      spirit, upon His parousia, in the month of OCTOBER 1874. The
      evidences are plain to the prayerful. The ingathering of the
      saints has commenced. The age of the Gentiles runs down. The
      year 1914 is the appointed end.

      Much is made in the Pittsburg papers of mechanical marvels —
      the telegraph, the phonograph, the arc lamp, the newer and
      stranger engines. Brethren, these are not signs of the end
      by themselves. They are the harvest tools of the age that
      is ending. Use them, give thanks for them, and do not take
      them for the kingdom.

      Some ask me of the reports of MANLIKE FIGURES moving in
      the Strip and the Hill, of hand that is too firm and
      memory that is too clear. I have no doctrine upon this.
      I counsel prayer. I counsel that we prove all spirits
      whether they be of God. The days are short. The workman
      is still worthy of his hire. The kingdom is at the door.

  - id: mccoy_comms_tabitha_ledger
    format: mccoy_comms
    publication: "Tabitha McCoy, Morocco Ledger, Study Safe (extract)"
    dateline: "APRIL 17, 1878"
    headline: "ENTRY THE SEVENTEENTH — THE FLUOROSCOPE MONOCLE"
    body: >-
      *Device:* Fluoroscope monocle, patent no. 199,412 (US),
      granted January 15, '78. Designed: field surgeon's tent.

      *Intended use:* Rapid thoracic diagnosis of wounded men, at
      under ten seconds per patient, at not less than three feet
      from the operator's eye (per the doctor's own note on the
      wrapper).

      *Observed misuse:* At the Edgar Thomson hiring line (first
      reported by the Allegheny Argus, 12 June); at Homestead
      construction camp (reported by Cap'n Jones, 14 June); at
      Eliza Furnace cast floor (reported by Dr. Teague's cousin
      Absalom, 16 June). Used by the hiring clerk at the
      foreman's table to reject applicants showing the shadow of
      TB, silicosis, or old injury. No applicant so rejected has
      been told why.

      *Actor identified:* Three separate foremen; procurement of
      the instruments traced, in two of three cases, to a
      wholesaler on Fourth Avenue with a Raubritter-concern
      account number.

      *Disposition:* OPEN. Captain Jones requests covert
      reclamation. Mr Carrington requests a column. The doctor
      requests that the instruments be kept out of the mills if
      that is possible without the doctor being seen to do it.
      All three requests are being worked.

      *Entered by:* T. McCoy, in her own hand, at half past
      eleven of the evening on this the seventeenth of April.
