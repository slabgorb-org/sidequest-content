id: the_night_the_roundhouse_burned
name: The Night the Roundhouse Burned
era: July 21, 1877
description: The story, as the Edgar Thomson blowing-mill tells it, is this. A crowd
  of three hundred had burned Union Station and was headed up the 28th Street yards
  with torches and the idea of every locomotive going the same way. McCoy's train
  was in the yards. Cap'n Bill Jones had ridden down from Braddock without an order
  from the superintendent and without a man who wasn't his own. He stepped into the
  torchlight at the yard gate and he did not draw. He called four men by name. He
  shared a flask. He walked the torch-party out of the yard by a route that took them
  past the roundhouse gates on the way to the courthouse fire. The roundhouse burned.
  One hundred and four locomotives went with it. The train did not. At dawn McCoy
  and Jones drank coffee brewed on a coal shovel by a nightwatchman who went home
  and did not tell his wife about it for three years. McCoy said "I owe you more than
  a drink." Jones said "We'll settle up as we go." The coal shovel is propped in the
  corner of the Edgar Thomson blowing-mill foreman's office, behind the door. It has
  not been used for coal since. The two coffee cups are on the same shelf, washed,
  upside down.
