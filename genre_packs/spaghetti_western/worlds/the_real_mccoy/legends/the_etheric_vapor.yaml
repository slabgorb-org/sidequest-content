id: the_etheric_vapor
name: The Etheric Vapor
era: 1872 onward
description: The tale as the downtown barrooms tell it is that Mr. John Worrell Keely
  of Philadelphia has discovered a new force in nature, "etheric vapor," that will
  drive a locomotive for a fortnight on a quart of tap water, and that a demonstration
  office for his motor company has opened in Pittsburgh in the second floor over the
  Sixth Avenue pharmacy, financed — though not in his own name — by Herr Doktor Raubritter.
  Investors have been taken through by appointment. The machine whistles. The machine
  trembles. The machine sometimes runs a brass flywheel that was not connected a moment
  ago. The machine has never been taken apart in the investor's presence. McCoy was
  invited by Raubritter's secretary in the summer of 1878 and went once, out of what
  he called "professional courtesy," and sat through the demonstration with his hands
  folded on the head of his cane and a mild smile and asked at the end whether the
  gentleman might consent to a single valve being opened. The gentleman declined.
  McCoy thanked him and left. The Allegheny Argus ran a column the following week
  under the headline *Our Doctor's Silence*. The Pittsburg Leader replied two days
  later by calling McCoy a mechanical materialist. Keely is on his fourth round of
  subscriptions. The Sixth Avenue office has taken on a second clerk.
