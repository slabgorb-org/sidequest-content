id: the_wake_of_the_keely_investor
name: The Wake of the Keely Investor
era: February 1878
description: Thomas O'Hara of the Strip District, late foreman of the Eliza Furnace
  cast-floor and husband to Bridget O'Hara of the same parish, put his retirement
  savings into a subscription of Keely Motor Company stock in the autumn of 1877,
  on the assurance of a well-dressed German gentleman who had knocked at the door
  of the saloon on a Sunday and left a calling card that smelled of bay-rum. The stock
  was worthless by February. Thomas O'Hara was dead of apoplexy within the week —
  the doctor said from the shock, the priest said from the shame, and Bridget said
  from the German gentleman. The wake was held at the O'Hara flat above the Liberty
  Avenue mercantile. The body lay on the kitchen table for two days. The clocks were
  stopped. The mirrors were covered. The window was opened for the soul and the cat
  kept being evicted so the cat would not stop the soul. The keening was Maggie Donovan's
  — she is the last of the Lower Hill keeners and she charges by the hour — and the
  wake games went on past two in the morning of the second night, which Father Reilly
  of St. Patrick's has written two sermons against and attended four times. McCoy
  sent flowers. Bridget returned them with a note. The note said *I will accept flowers
  from the doctor when the doctor has brought me the German.* The note is framed behind
  the bar at the Liberty Avenue mercantile. The doctor has been told, by Dr. Teague,
  that the note exists. He has not yet gone to see it.
