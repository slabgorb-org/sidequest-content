id: the_making_of_prudence
name: The Making of Prudence
era: Winter 1874
description: Tabitha was twelve and had been running fever for eight weeks and the
  three physicians McCoy had consulted had all given different diagnoses and none
  of the three had given her mother's. The doctor closed the Workshop Car and did
  not come out for thirteen weeks. Markham brought him meals. Tabitha, from her bed
  in the Passenger Quarters, heard the lathe and the brazing torch and the soft voice
  in German when the doctor talked himself through a problem. What came out of the
  Workshop Car when it opened again was a woman of about twenty-five, in a plain dark
  dress, with a voice like a new cello, and a memory that did not need a notebook.
  She took Tabitha's hand and sang to her in the Pennsylvania Dutch her mother had
  sung. The fever broke in four days. When Tabitha was well, Prudence stayed. She
  has never not been there. She was named from the King James — it was Tabitha's choice,
  from the same verse Adelaide had underlined in the family Bible, and the doctor
  wept for the first time since the burial when his daughter said the name. The underlined
  verse is Proverbs 8:12. The Bible sits on the Study shelf between Maxwell and Babbage,
  and the pencil mark in the margin is still legible.
