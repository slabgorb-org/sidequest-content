id: the_leak
name: The Leak
era: November 1876
description: Silas Markham was twenty-three and McCoy's apprentice of nine years and
  the one the doctor trusted with the master drawings. He had been sleeping in the
  drafting room because the rent on his boarding-house in Lawrenceville was past-due
  and the doctor had told him there was no need to pay rent when the drafting room
  had a sofa. The last man to see him in Pittsburgh was the Monongahela House night
  clerk, who signed for a trunk at two in the morning. The next person who saw him
  recognized him from a carte-de-visite was a porter on the Cunard steamer out of
  New York. He sent the doctor a wire from the Gare du Nord in January with an apology
  that used the word "unforgivable" three times and asked after Tabitha. The doctor
  has never publicly accused him of anything. He has never stopped writing back. The
  cipher is the one he taught the boy. Every time a new replicant turns up wearing
  one of the tells Markham would have put in — a left-hand grip a degree too strong,
  a too-steady pulse at the wrist in fever — the doctor goes into the Study and closes
  the door and nobody asks what he is thinking. On the desk in the Study, inside the
  green pasteboard folder marked only *S.M.*, are forty-one letters from Paris in
  a hand the doctor taught, and forty-one carbons of his replies in his own.
