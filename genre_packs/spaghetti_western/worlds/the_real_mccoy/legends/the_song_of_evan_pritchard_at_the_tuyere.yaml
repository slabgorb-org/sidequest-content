id: the_song_of_evan_pritchard
name: The Song of Evan Pritchard at the Tuyere
era: '1866'
description: The Welsh puddlers at the South Side mills keep a song that is not sung
  outside the blowing-house. Evan Pritchard, of the Cwmbach valley, was a puddler
  at Jones & Laughlin Eliza Furnace when the tuyere wall cracked in April of '66 and
  the cinders cast a line of fire across the floor that had three men between it and
  the door. Pritchard went out through it rather than around it and carried two of
  them on his shoulders and came back for the third. He lived through the night and
  died at dawn of burns that the Irish-Catholic women at St. Adalbert's said were
  worse than the ones the saints had. His wake was a three-chapel affair — Calvinistic
  Methodist, Roman Catholic, and the AME congregation that had bought his life insurance
  through a fraternal burial society — and the song that came out of it is a Welsh
  hymn tune with a Gaelic chorus and an AME amen, and it is sung only on the night-shift,
  only at the blow, only between one charge and the next. Prudence has heard it sung
  and has asked whether she might learn the Welsh. The night-shift foreman said yes.
  She does not sing it in company.
