id: the_argus_and_the_ironmonger
name: The Argus and the Ironmonger
era: 1861-1862
description: The Allegheny Argus is not as old as the Christian Recorder and not as
  old as the Pittsburgh Commercial Gazette but it is old enough. Mordecai Carrington
  tells the story this way in the Bethel vestibule when a visiting preacher asks.
  The paper was founded in the second year of the war by his father, Josiah Carrington,
  then a Hill District barber-shop proprietor, with a hand-press borrowed from a white
  ironmonger named Thaddeus Ackerley who had taken three of Josiah's barbering customers
  to freedom by way of his foundry attic and had never once said so aloud. Ackerley
  was killed at Gettysburg in July of '63, in a regiment he volunteered for at forty-one
  because, he told Josiah, he had some things to settle. The hand-press was returned
  to Ackerley's widow in Wilkinsburg in the autumn. She sent it back a week later
  with a note that said *it was never my husband's to lend, and so it is never mine
  to take back.* The press has printed the Argus for sixteen years. There is a brass
  plate on the side of the frame with Ackerley's name engraved by Mordecai himself
  on the morning he took the editor's chair. Every issue goes out with his name running
  in iron between the words.
