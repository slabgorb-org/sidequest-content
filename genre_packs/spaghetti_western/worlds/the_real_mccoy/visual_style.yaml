positive_suffix: >-
  1870s newspaper engraving, lines, ink on sepia, fine lines, engraved
  detail, monochrome sepia tonality, 1870s period costume. Storefronts,
  posters, signs, broadsides, and printed matter in frame are weathered
  blank paper or wood with abstract ink scars rather than legible
  writing. No text, no caption, no title, no writing, no lettering, no
  inscription, no nameplate, no signage, no posters with words, no
  newspaper text, no masthead, no headline, no street sign, no signature,
  no watermark, no border, no frame.

negative_prompt: ""

preferred_model: dev

base_seed: 1878

palette:
  coal_smoke_sepia:    "#5a4a3a"
  gaslight_amber:      "#d9a34a"
  bessemer_orange:     "#e8692b"
  mahogany_walnut:     "#3d2418"
  brass_warm:          "#a8803a"
  fog_grey_white:      "#c7c2b8"
  cemetery_slate:      "#4a4e52"
  coal_black:          "#12100e"
  parchment_cream:     "#e8dcc0"
  ink_iron_gall:       "#2a1f18"
  bethel_ame_gold:     "#b8882e"

palette_usage:
  sky_default: coal_smoke_sepia
  sky_dramatic: bessemer_orange
  interior_warm: gaslight_amber
  interior_cold: cemetery_slate
  wood_tone: mahogany_walnut
  metal_tone: brass_warm
  shadow: coal_black
  mist: fog_grey_white

medium_primary: >-
  1870s carte-de-visite and cabinet-card studio portraiture engraving, 
  lines, ink on sepia, fine lines, engraved detail, monochrome, sepia, 

medium_secondary_replicant_reveal: >-
  Albert Robida illustration register for Villiers de l'Isle-Adam's
  *L'Ève future* (1886); Jules Worms period engraving; the uncanny
  stillness of posthumous daguerreotype portraiture; the female
  automaton in Charles Babbage's 1840s salon anecdote visualized

period_anchor: "1878-1880 Pittsburgh industrial Gilded Age"

period_constraints:
  technology_ceiling: "1878 — pre-Tesla AC, pre-Edison incandescent (Edison filed Oct 1879, first public demo Dec 1879), Brush arc-light DC is current-year tech"
  clothing_ceiling: "1878 — frock coat, waistcoat, watch chain, top hat (formal) or bowler (working), no Edwardian shoulders, no 1890s mutton-sleeves, no 1900s shirtwaist"
  architecture_ceiling: "1878 — Second Empire mansard, Italianate commercial, early Richardsonian Romanesque, no Beaux-Arts, no steel-frame skyscraper (Home Insurance Bldg is 1885)"
  photography_medium: "albumen print from wet-collodion plate; cabinet card format (4.25x6.5 in) and carte-de-visite (2.5x4 in); early dry-plate appearing late-decade"
  illumination_real: "gaslight (interior), Brush arc-light (exterior, 1878 rollout), kerosene lamp, candle, firelight — NO incandescent, NO fluorescent"

visual_tag_overrides:

  the_point: >-
    the confluence of the Monongahela and Allegheny forming the Ohio at
    dawn, a brick Fort Pitt blockhouse foundation visible at low water on
    the near bank, four-story wooden and brick warehouses crowding both
    riverfronts, three coal barges moored two-deep at a timber wharf on
    the left, a single tugboat with a tall stack easing a loaded flat
    upstream through fog, the Sixth Street iron truss bridge in the middle
    distance with gaslamps still burning at its piers, two rail yards
    crosshatched with sidings on the right bank, gulls circling over the
    warehouse roofs, coal-smoke sepia sky above a fog-grey-white river

  strip_district: >-
    Penn Avenue at dawn between the Allegheny wharf and a rising bluff,
    canvas-striped produce stalls in three rows on the right under a
    colonnade of three-story brick wholesale houses, slaughterhouse smoke
    curling from a chimney four blocks down, Irish labourers in flannel
    shirtsleeves and waistcoats stamping mud from their boots at a stall,
    a pair of heavy German brewery draft-horses with a beer dray at the
    curb, streetcar rails embedded in wet cobblestone, gaslight standards
    every sixty feet, a coal dray passing in the far distance

  hill_district: >-
    Wylie Avenue climbing a steep ridge in late afternoon, close-packed
    two- and three-story brick rowhouses with painted wooden stoops
    flanking both sides, Bethel AME's red brick facade and white bell
    tower rising a block ahead with its double front doors standing open,
    three Black professional men in frock coats and stovepipe hats on a
    plank sidewalk, a woman in mourning-jet bonnet passing with a basket,
    a lamplighter reaching a gaslamp with a brass pole, damp cobbles
    reflecting the first amber, coal-smoke sepia sky above

  lawrenceville: >-
    the Allegheny Arsenal's long Civil-War-era red-brick workshop walls
    on the right of a cobblestone avenue, crenellated iron gates padlocked
    at the arsenal entrance, a tall Bessemer smokestack in the middle
    distance with an orange flare crowning its rim, a gothic wrought-iron
    cemetery gate at the far end of the block with a pair of cast-iron
    lions flanking, a carved lyre headstone under three weeping willows
    visible beyond the gate, two-story brick workers' rowhouses on the
    left, coal-smoke sepia sky

  allegheny_city: >-
    East Ohio Street in German Deutschtown across the Allegheny, three-story
    brick row-houses on both sides with painted Fraktur shop signage on
    the ground-floor storefronts, a grey stone Western Penitentiary wall
    closing the far end of the avenue, a narrow four-story brick storefront
    on the left with a printer's sign on the upper floor and amber lamplight
    in the windows, an iron suspension bridge with a single horse-cart
    crossing in the middle distance, gaslight standards at each corner,
    coal-smoke sepia sky above

  south_side_birmingham: >-
    Jones & Laughlin's Eliza Furnace and Clinton Furnace (1859) on the
    south bank of the Monongahela at dusk, two blast-furnace stacks venting
    orange flare against Mount Washington's four-hundred-foot cliff face
    rising behind, three Welsh puddlers in scorched leather aprons working
    long iron rods at a tuyere opening on the casting floor, a bottom-poured
    ingot glowing white on the casting pad beyond them, a line of Czech
    and Polish workers at shift change crossing a plank, wet cobblestones
    reflecting furnace-orange

  mount_washington: >-
    a ridgetop overlook four hundred feet above the Monongahela at dusk,
    the red-brick Gothic spire of St. Mary of the Mount on the left with
    a bell visible in its openwork tower, a Duquesne Incline cherry-wood
    cable-car cresting a thirty-degree grade at the lower-right, the
    entire river valley spread below with gaslamp pinpricks along three
    rivers and a distant orange Bessemer flare at Edgar Thomson, coal-smoke
    haze thickening middle distance into fog-grey-white, deep amber-to-indigo sky

  downtown: >-
    Fifth Avenue commercial core at midday, the Monongahela House hotel
    on the left with wrought-iron balconies at each of five storeys, cream
    sandstone Italianate bank and mercantile facades darkened by soot
    flanking both sides, gaslight standards every sixty feet along the
    curb, streetcars on iron rails down the centre with two horse-drawn
    coal drays passing, a pair of newspaper-boys with broadsheets calling
    from the foreground corner, a Brush arc-lamp experimental standard
    at the far intersection, coal-smoke sepia sky

  east_liberty: >-
    Ellsworth Avenue in late afternoon rain, Second-Empire mansard-roofed
    brick mansions set back forty feet behind wrought-iron fences with
    lamp-topped gateposts, mature sycamores and magnolias shading the
    verge, a brick carriage house at the rear of one lot, a black coach
    with two matched bays waiting at a carriage sweep on the left, a Krupp-iron
    fence painted forest green enclosing the opposite courtyard with two
    potted fig trees flanking its gate, cream sandstone facades softened
    by mist, a new stone cemetery chapel visible two blocks down

  braddock: >-
    the Edgar Thomson Steel Works at night on a wide Monongahela river
    bend, two Bessemer converter vessels tipped and throwing a minutes-long
    geyser of orange sparks against a coal-black sky, four blast furnaces
    lined along the riverbank with their stacks venting flare, a glowing
    steel rail rolling on the hot line in the middle ground, three
    foremen in scorched leather aprons silhouetted in rim-light against
    the converter flare, a string of coke-laden flatcars on a siding,
    a glowing slag dump at the far left, molten metal reflections on
    wet cobblestones

  schloss_hohenzollern_sewickley: >-
    a Richardsonian-Romanesque country mansion of cut sandstone on a high
    Ohio River bluff, round-arched windows in a three-bay facade, a slate
    mansard roof with copper flashing, a formal parterre garden of clipped
    boxwood in the foreground terraced across the lawn, a Rhineland
    wrought-iron gate at the carriage sweep on the right, crushed-slate
    drive curving up to the portico, two peacocks on the lawn at centre,
    a private stone dock and a pair of gig boats visible on the river
    below, cold cream highlights over a cemetery-slate palette, overcast sky

  the_train_exterior: >-
    a matte-black Baldwin 4-4-0 locomotive at the head of a private consist,
    parked at a rail siding at dusk, polished brass fittings on the
    running board and a varnished wood cab, a blank brass nameplate on the
    boiler jacket, six trailing mahogany Pullman-type cars with brass
    railings and small blank gold-leaf cartouches on the flanks,
    a steam plume rising from the stack, coal-smoke trailing along the
    rooflines, a single Brush arc-lamp standard casting hard white light
    on the yard from the left, crushed shadows beneath the trucks

train_interior_tags:

  engine_cab: >-
    interior of a Baldwin 4-4-0 engineer's cab, a bronze-and-walnut
    pressure-gauge panel on the forward bulkhead with three brass-rimmed
    dials, a steam-whistle pull cord overhead, the iron firebox door
    cracked open on the lower left glowing bessemer_orange, the engineer
    in a striped denim jacket and flat cap at the right-hand controls,
    a fireman with a long-handled coal shovel bent to the tender on the
    left, coal dust settled on every surface, a single lantern on a hook,
    warm amber on polished brass

  boiler_car: >-
    interior of a converted coal tender, bulk coal heaped forward to a
    plank divider, aft section fitted with a bank of twenty-four tall
    glass-jar Planté wet cells in a walnut rack with brass terminals and
    black rubber insulator pads, dilute electrolyte visible at half-fill
    in the jars, a Gramme ring dynamo on a cast-iron frame at the far
    end, copper bus-bar running the length of the overhead, a single
    gaslight through a roof skylight, warm amber on polished wood

  workshop: >-
    interior of a rolling laboratory car thirty feet long, long polished
    walnut benches with iron-strap edges running both walls, a belt-driven
    brass lathe on the right bench with its flywheel mid-turn, an acetylene
    brazing torch lit blue on a ceramic pad, three coils of gutta-percha
    insulated wire on an iron hook, a Crookes tube glowing faint violet
    in a walnut cradle in the far corner, ink blueprints pinned to a cork
    drafting board on the end wall, a work coat on a peg by the door, a
    small Franklin stove aft venting through the roof, gaslight amber
    with a violet corona at the tube

  armory: >-
    interior of a narrow mahogany-panelled car, wall racks of McCoy-designed
    defensive instruments along both walls — a brass-and-walnut compressed-air
    stun-rifle, a Faraday-cage net-thrower on a vertical clip, a resonance-harmonic
    tuning-fork weapon in a padded cradle, each item catalogued on an
    engraved brass plate with serial number, six wrought-iron crates bolted
    to the plank floor holding ammunition and compressed-air tanks, two
    Spencer repeating carbines on a forward rack, a locked steel cabinet
    set into the forward bulkhead, a single gaslight on a swiveled brass
    sconce, cool cemetery-slate undertone

  study: >-
    interior of a private drafting room, mahogany-and-walnut panelling
    on every wall, a large draftsman's table at centre with a brass
    T-square and parallel-rule laid across ink sketches, a side desk on
    the right with neat stacks of correspondence and a brass letter-opener,
    a green-shaded banker's oil lamp at the desk's near corner pooling
    warm amber on the blotter, a brass loupe and iron-gall ink stains on
    the blotter, a small framed daguerreotype of a young woman angled
    toward the chair, a globe on a brass stand in the corner, floor-to-ceiling
    leather-bound bookshelves behind

  library: >-
    interior of a reading-and-research car, floor-to-ceiling mahogany
    bookcases on both walls with a brass rail running along the third
    shelf, bound scientific periodicals 1860-1878 in green cloth, Patent
    Office Gazettes stacked horizontally on the lower shelves, a brass-stand
    globe at the forward end, Verne novels in gilt-tooled calf on an eye-level
    shelf, a central reading desk with a green-shaded banker's oil lamp
    and an atlas-stand open at Pennsylvania, two deep oxblood horsehair-leather
    armchairs flanking a side table, warm gaslight amber on polished wood

  observation_car: >-
    interior of an observation car aft of the study, broad plate-glass
    windows on three sides framing a passing landscape, four brass cuspidors
    at the corners, velvet-upholstered banquettes in deep burgundy-green
    damask along both side walls, a central mahogany meeting table with
    six chairs, a mahogany sideboard on the rear wall with three crystal
    decanters and a gasogene, an etched-glass gaslight chandelier on a
    brass gimbal overhead, mahogany-and-walnut panelling, warm amber on
    polished brass

  passenger_quarters: >-
    interior of a narrow crew-staterooms car, four compact sleeping bays
    with fold-down upper berths along the left wall, damask privacy curtains
    partly drawn on two bays, each bay personalized — one with a folded
    map and a cigar box on the washstand, one with sheet music on a fold-down
    desk and a dress form in the corner, one with a compact rifle case
    under the berth, one neat and ascetic with a black wool coat on a peg
    — a shared water closet door at the far end with an enameled-iron basin
    visible, a Baker coal stove at the aft end, mahogany-and-brass trim,
    warm kerosene-reading-lamp amber

  kitchen: >-
    interior of a galley car, a coal-fired cast-iron range black-leaded
    to a gleam running along the left wall, a rack of nine copper pots
    of graduated sizes overhead, three braids of onion and a smoked ham
    hanging from a ceiling beam, a zinc sink with a hand pump at the end,
    a butcher-block prep table at centre with an oilcloth cover and a
    carving board, a tin-lined icebox with ice-tongs beside it, a cook's
    white jacket on a peg by the door, a small blackboard with the day's
    menu in chalk, warm gaslight amber over copper

  medical_car: >-
    interior of Dr. Teague's clinical rail car, a white-enameled-iron
    examining table at centre with straps folded on its edge, a Lister
    carbolic-spray apparatus on a shelf to the right, a steam autoclave
    of Chamberland pattern on a side bench, gauze and catgut in labelled
    glass jars on a glass-fronted cabinet, a brass microscope on a polished
    stand, two curtained observation cots at the aft end, sterile cream-and-white
    painted walls contrasting the warm mahogany elsewhere on the train,
    a deliberate visual break — the clean car, bright cool gaslight

  caboose: >-
    interior of a caboose with rear observation door, a conductor's rolltop
    desk on the right with a Morse telegraph-key, a stack of waybills under
    a green-shaded oil lamp, and a leather logbook open to the current date,
    a Baker coal stove in the forward-left corner with a copper kettle on
    its top, a gun rack on the left wall holding two shotguns and a Sharps
    carbine, a brass-lanterned kerosene lamp in a gimbal housing, a small
    open door at the rear framing the receding rails in coal-smoke sepia,
    warm amber lamplight on mahogany

scene_registers:

  interior_domestic: >-
    soft gaslight amber pooling from a green-shaded banker's oil lamp
    at desk height, warm mahogany-and-walnut panelling, visible coal-smoke
    particulate drifting in the amber-lamp beams, a medium close-up with
    shoulders-up framing, shallow focal depth with background bookshelves
    softened, one small object on the desk in foreground sharp focus

  interior_institutional: >-
    cooler gaslight with cemetery-slate undertones for a Raubritter or
    Pinkerton or bank or federal interior, sparse heavy furniture —
    a single desk, a row of three chairs, a tall ledger cabinet — hard
    shadows thrown by a single overhead gaslight, dark oak panelling to
    chair-rail height, brass fittings polished, a barometer or a framed
    stock certificate on the wall, no warmth

  exterior_daylight_urban: >-
    coal-smoke sepia sky (never blue), cream sandstone commercial facades
    darkened by soot on both sides of the avenue, gaslight standards
    every sixty feet along the curb, a mid-shot street-level composition
    with a clear foreground (curbside detail), middleground (pedestrians
    and drays), and background (tall buildings fading into haze), visible
    air particulate in the light, occasional raking arc-light slashing
    the overcast

  exterior_daylight_industrial: >-
    a wide Mon Valley mill complex along a river bank, Bessemer smokestacks
    as strong verticals rising from long shed-roofed mill buildings, the
    river as a horizontal band across the middle third, three or four
    workers in mid-ground rendered as small silhouettes for scale against
    the furnace buildings, a coke-laden flatcar on a siding in the left
    foreground, coal-smoke haze thickening the far distance into a wall
    of fog-grey-white

  exterior_night_industrial: >-
    Bessemer-sublime lighting with furnace flare illuminating everything
    from below in bessemer_orange, sky above pure coal_black, molten
    metal and fresh-rolled rail reflecting orange on wet cobblestones,
    three worker silhouettes rim-lit against the flare at the tuyere,
    the geyser of converter sparks arcing up against the black sky, a
    glowing slag dump at the far left, a slow wide composition framed
    to show both the furnace and the men

  exterior_river_fog: >-
    the Point at pre-dawn with fog_grey_white pressing down to the water,
    two coal-barge silhouettes emerging from the mist at the wharf, a
    single tugboat stack barely visible behind, rail-yard lanterns on
    the far bank as amber pinpricks in the fog, the gaslamps on the
    Sixth Street bridge still burning and doubled in the water, cool
    wet tonality, a long composition compressed by haze, stillness

  action_beat: >-
    a frozen-instant action frame with figures in mid-stride or mid-swing
    rendered with unusual sharpness of outline, dust and sparks suspended
    in the air at the moment of impact, one figure tipped off balance,
    another with a raised arm just before contact, every pleat of fabric
    and every spark in crisp mid-motion stasis, a tight mid-shot composition

  replicant_reveal: >-
    L'Ève future illustration register — subject rendered with too-perfect
    facial symmetry, unnaturally uniform skin tone, wide-open unblinking
    eyes, hand folded precisely at the waist in a calibrated pose,
    uncanny-doll stillness of posthumous daguerreotype, Albert Robida
    engraving linework in the deep shadows

  mourning_cemetery: >-
    Allegheny Cemetery at late afternoon overcast, cemetery_slate dominant
    across the wrought-iron fence and weathered stone, a carved lyre
    headstone under three weeping willows at centre, a widow in full
    mourning weeds with jet jewelry at the gravestone's foot with a
    black-gloved hand on the stone, moss-softened obelisks and draped-urn
    monuments rolling away across the lawns behind, a pair of cast-iron
    lions at a distant gatehouse, soft diffused overcast light

