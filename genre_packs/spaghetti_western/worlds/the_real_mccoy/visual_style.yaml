medium_primary: hand-tinted 1870s albumen photographic plate over wet-collodion silver grain, daguerreotype
  stillness, soft shallow focus, monochrome coal-smoke sepia warmed at the gaslight and cooled at the slate
  shadows, in the register of a period Pittsburgh studio view darkened by industrial soot
medium_secondary_industrial_engraving: 1870s illustrated-weekly wood-engraving register, fine ink linework
  on sepia, engraved crosshatching, monochrome, in the manner of a Harper's Weekly or Scientific American
  industrial plate — used for wide exterior mill, river, and rail-yard views and for cabinet-card character
  portraits
medium_tertiary_furnace_flare: long-minutes Bessemer-blow flare register, an orange geyser of sparks against
  a pure coal-black night sky, hard furnace-orange rim light raking every figure and reflected wet on
  cobbles and river — used for Edgar Thomson, the Eliza and Lucy furnaces, and any night mill scene
period_anchor: spring 1878, Pittsburgh and Allegheny City, Allegheny County, Pennsylvania
period_constraints:
  technology_ceiling: 1878 — gaslight and Pintsch-gas interior lamps, kerosene lamps, Bessemer converters,
    blast furnaces, funicular inclines, steam locomotives, telegraph, the first experimental Brush arc-lamp
    standards just appearing; no incandescent bulb in general service, no telephone in general service, no
    automobile, no paved asphalt, no steel-frame skyscraper
  clothing_ceiling: 1878 — frock and sack coats, waistcoats, stovepipe and homburg and bowler hats, work
    shirts and flannel and leather aprons for the mill hands, German loden and leather suspenders, floor-length
    bustled or plain day-dresses, bonnets and shawls for women; no Edwardian line, no 20th-century dress, no
    frontier cowboy duster or sombrero
  architecture_ceiling: 1878 — soot-blackened red-brick warehouses four and five storeys, Italianate
    commercial fronts in cream sandstone darkened to charcoal, Second-Empire mansard mansions, Civil-War-era
    arsenal brick, Gothic-Revival churches, two-storey frame workers' rowhouses; no cast-iron skyscraper, no
    steel frame, no Beaux-Arts, no adobe, no timber false-front frontier storefront
  photography_medium: wet-collodion albumen print and the new gelatin dry plate just arriving; hand-tinting
    over monochrome; no film roll, no halftone, no color photography
  illumination_real: gaslight (street standards and interiors), Pintsch compressed-gas car lamps, kerosene
    lamp, Bessemer and blast-furnace flare, the first experimental Brush arc lamps — no incandescent general
    service, no arc-light street grid yet
visual_tag_overrides:
  industrial_riverfront: a wide soot-grey river at dawn between close-crowding four- and five-storey
    red-brick warehouses, coal barges moored two-deep at timber wharves in the foreground, crosshatched
    rail yards running along the far bank, a low iron truss bridge in the middle distance with gaslamps
    still burning and doubled in the water, a river-fog layer pressing low and a coal-smoke inversion layer
    hanging above it not quite mixing, gulls over the warehouse roofs, coal-smoke sepia sky
  bessemer_works_night: a Bessemer steelworks at night on a wide river bend, blast furnaces lined along the
    bank with their stacks crowned in bessemer-orange flare, a converter vessel tipped mid-blow throwing a
    minutes-long geyser of orange sparks against a pure coal-black sky, a rolling mill with long shed roofs,
    a glowing steel rail on the hot line with steam rising, the entire river bend reflecting furnace-orange,
    coke-laden flatcars on a siding, furnace-orange rim light on every wet cobble
  gaslit_commercial_avenue: a wide Italianate commercial avenue at midday, cream sandstone bank and hotel
    fronts darkened by soot with wrought-iron balconies and dark-green shuttered windows, streetcar rails
    down the centre, a horse-drawn coal dray and a passenger streetcar in the middle distance, gaslight
    standards every sixty feet and a single experimental Brush arc-lamp standard at the far corner,
    newspaper-boys in flat caps with broadsheets on the foreground corner, coal-smoke sepia sky
  steep_brick_ridge_street: a cobblestone street climbing a steep ridge in late afternoon, close-packed
    two- and three-storey red-brick rowhouses with painted wooden stoops and tall narrow windows flanking
    both sides, a red-brick church with a white bell tower at the crest, figures in frock coats and bonnets
    on uneven plank sidewalks, a lamplighter reaching a gaslamp with a long brass pole, damp cobbles
    catching the first gaslight-amber, ground-floor storefront signage, coal-smoke sepia sky above
  ridgetop_incline_overlook: a panoramic ridgetop overlook at dusk four hundred feet above a river valley,
    a cherry-wood funicular incline car cresting a thirty-degree grade with its gaslit interior glowing
    amber, the city valley spread below with thousands of gaslamp pinpricks along three rivers, a distant
    bessemer-orange furnace flare bleeding through the haze on the far horizon, iron bridge trusses in the
    middle distance, coal-smoke haze thickening into fog-grey-white, deep amber-to-indigo sky above
  mansard_old_money_street: a wide cobblestone street in late-afternoon rain, Second-Empire mansard-roofed
    red-brick mansions set back behind wrought-iron fences and lamp-topped gateposts, mature sycamores and
    magnolias dark with rain, cream sandstone facades softened by mist and flaked at the cornices, a black
    closed carriage with matched bays at a carriage sweep, forest-green iron fencing with ornate finials,
    gaslamps already lit and doubled in puddles, cemetery-slate cool light with no warmth
  rail_siding_at_night: a private varnished six-car train at a rail siding at dusk, a matte-black 4-4-0
    locomotive with polished brass fittings and a tall diamond stack trailing a steam plume at the head,
    mahogany Pullman cars with brass railings and small gold-leaf flank lettering, coal-smoke drifting
    along the rooflines, a single Brush arc-lamp standard casting hard white light and crushed coal-black
    shadows beneath the trucks, a yard switcher idle on a parallel track, a brick yard office with amber
    lamplight in the far background, a nightwatch lantern swinging along the consist
  arsenal_yard: a federal arsenal on a wide cobblestone street in late afternoon, long Civil-War-era
    red-brick workshop buildings with low-pitched slate roofs behind a tall brick perimeter wall, black
    crenellated iron gates flanking a central entrance, a padlocked yard with empty timber munitions racks
    and a rusted powder cart visible through the gate, faded brass ordnance plates on the nearest doors, a
    flagpole on the parade ground beyond, a uniformed sentry in blue wool at a small stone guardhouse,
    arsenal-grey institutional light, coal-smoke sepia sky
scene_registers:
  interior_rolling_laboratory: the interior of a thirty-foot Pullman-length rail car converted to a
    laboratory, long polished walnut benches with iron-strap edges running both walls, a brass microscope
    on a gimbal mount and a Crookes tube glowing faint violet in a walnut cradle, a lit acetylene brazing
    torch on a ceramic pad beside an iron vise, coils of gutta-percha wire on hooks, a drafting board with
    pinned blueprints on the end wall, a small Franklin stove venting at the aft end, gaslight-amber overhead
    with a violet corona at the tube, warm and close, a medium interior shot
  interior_study_warm: the interior of a private drafting-room rail car, mahogany-and-walnut panelling to a
    coffered ceiling, a draftsman's table with T-square and parallel-rule across an unrolled blueprint, a
    green-shaded banker's oil lamp pooling warm gaslight-amber across a blotter, floor-to-ceiling bookshelves
    of leather-bound volumes behind the desk, a brass globe on a stand in the corner, a small framed
    daguerreotype angled toward the chair, warm gaslight-amber on mahogany, a still close composition
