# The Real McCoy — visual style (1878 Pittsburgh industrial-western gaslight override of the genre frontier look)
# THIS IS NOT THE BORDER FRONTIER. dust_and_lead is sun-bleached desert; this world is the opposite — a
#   soot-and-steel river city under a coal-smoke inversion eleven months a year. "Hell with the lid taken
#   off" (James Parton, Atlantic Monthly, 1868). The light here is gaslight, Bessemer flare, and overcast
#   coal-haze, NOT desert midday. Keep the desert out via the positive "1878 Pittsburgh coal-smoke" anchor,
#   NOT a "no desert" list (see below).
# Z-Image Turbo: negative_prompt is inert at guidance_scale=0, so every "don't" must live in the positive
#   text. Two consequences (see ../../../PROMPTING_Z_IMAGE.md): (1) object-negations BACKFIRE — "no cactus /
#   no cowboy hat / no desert" can SUMMON the thing — so we keep the frontier out by ANCHORING to the
#   industrial city, NOT by negating the frontier. (2) The only tail clause is META-ARTIFACT suppression
#   (no watermark / caption / title / page-numbers / signature), NOT a blanket "no text": this world is full
#   of period in-world signage (Fraktur shop boards, brewery drays, gilt window lettering, broadsheets) and
#   we WANT it, so text is not suppressed.
#   The suffix is STYLE/MEDIUM/PALETTE ONLY — no scene content.
#   All scene content (what a place IS, its props, the train cars, the mills, signage, crowds, staging)
#   lives in the per-region / per-landmark / per-train-car visual_prompt fields in cartography.yaml and the
#   visual_tag_overrides / scene_registers blocks below — NOT here. Do NOT add mills or crowds to this
#   always-applied suffix: it would wrongly inject furnaces and street mobs into interior scenes (the
#   workshop bench, the medical car, the séance demonstration parlor).
# Signage is WELCOME period texture, not suppressed. 1878 Pittsburgh was visually dense — painted shop
#   boards, German Fraktur window signage in Deutschtown and the Strip, gilt-lettered bow windows, brewery
#   dray lettering, layered broadsheets and the McCoy Industries press broadsides. Author it into the
#   per-region prompts as painted/printed period lettering, weathered with soot; plausible gibberish
#   lettering reads fine as a teeming industrial city. The ONE hard rule: NEVER put a literal snake_case
#   slug or a region/landmark name rendered as a title/caption into any prompt — describe scenes, not labels.
# Palette tokens (bessemer_orange, fog_grey_white, cemetery_slate, gaslight_amber, coal_smoke_sepia) are
#   already used by name across cartography.yaml's region/landmark/train-car prompts — this file is their
#   canonical source. Keep them in sync.
# Slugs canonicalized by world-builder to match cartography region keys.

positive_suffix: 1878 Pittsburgh, coal-smoke inversion over three rivers, hell with the lid taken off,
  hand-tinted albumen photographic plate over wet-collodion grain, slightly soft daguerreotype focus,
  monochrome coal-smoke sepia with cemetery-slate cool shadows and warm gaslight-amber and bessemer-orange
  highlights, industrial soot pall, gaslight and furnace-flare ambient light. No watermark, no caption,
  no title, no page numbers, no signature.
negative_prompt: ''
