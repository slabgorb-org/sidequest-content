# The Real McCoy — World Cartography
# Pittsburgh metro + the train (rolling HQ) + landmarks
# Merged from cartography_poi_prose.yaml (writer) + structural adjacency (world-builder)

world_name: The Real McCoy
starting_region: downtown
map_style: 'Hand-tinted photograph-over-topographic-survey of Pittsburgh 1878: coal-smoke sepia atmosphere,
  brass compass rose, three rivers rendered in iron-gall ink, incline railways marked with dashed lines,
  rail yards in crosshatched plate, German-Fraktur labels for Allegheny City districts, Currier & Ives
  lithographic border trim, ''Pittsburg'' spelled without the ''h'' per period convention.'
regions:
  the_point:
    name: The Point
    summary: Where the Monongahela joining the Allegheny forms the Ohio.
    terrain: river confluence, rail-yard
    visual_prompt: >-
      A wide river confluence at dawn where two rivers merge into a third,
      four- and five-story brick warehouses and rail yards crowding both
      banks, coal barges moored at wooden wharves, a fog layer pressing
      low on the water with a coal-smoke inversion above, gaslamps still
      burning on a low iron truss bridge in the middle distance, a small
      brick blockhouse visible at the waterline, Underwood stereograph
      composition, albumen print tonality, coal-smoke sepia sky.
    description: Where the Monongahela joining the Allegheny forms the Ohio. The old Fort Pitt brick is
      visible at low water under the fill. Rail yards and coal wharves crowd both banks; warehouses stand
      four and five stories tall in the smoke. At dawn the river-fog lies in the valley like cotton batting
      and the coal-smoke inversion lies above it, the two layers not quite mixing, and the gaslamps burn
      on the bridges well past ten. At dusk the Bessemer flare from Edgar Thomson throws orange onto the
      undersides of the clouds. The Duquesne Incline cable ticks rhythmically against its pylon on the
      far south bank. Trinitarians call it a cosmogram. Catholics call it a baptismal font. Stevedores
      call it the dumping ground. All three are right.
    adjacent:
    - strip_district
    - downtown
    - allegheny_city
    - mount_washington
    - braddock
  strip_district:
    name: The Strip District
    summary: A half-mile strip between the Allegheny wharf and the bluff, running northeast from the Point
      along Liberty and Penn Avenues.
    terrain: industrial wharf
    visual_prompt: >-
      A wide cobblestone avenue at dawn between a river wharf and a rising
      bluff, produce stalls under striped canvas on one side, three-story
      brick wholesale houses on the other, a brewer's heavy draft-horse
      and beer dray at the curb, streetcar rails embedded in the cobbles,
      gaslight standards every sixty feet, Irish and German labourers in
      waistcoats and flannel shirts in the middle distance, faint butcher's
      smoke on the air, Harper's Weekly engraving composition.
    description: A half-mile strip between the Allegheny wharf and the bluff, running northeast from the
      Point along Liberty and Penn Avenues. Produce markets from four in the morning, in Italian and German
      and Polish and English; slaughterhouses at 16th Street, venting the smell of hog down the river
      breeze; Irish laborers with flannel shirts and heavy wool trousers, German brewers in loden jackets
      with leather suspenders, Czech and Polish men just beginning to arrive in numbers and board in the
      flats. A streetcar every ten minutes on Liberty Avenue; a coal dray every five. The Eberhardt &
      Ober brewery wagon passes at noon with the shift-change beer. The Strip is four languages before
      breakfast and three religions before Sunday dinner.
    adjacent:
    - the_point
    - downtown
    - lawrenceville
    - allegheny_city
  hill_district:
    name: The Hill District
    summary: The ridge running east from Downtown, climbing steeply from the Lower Hill at Wylie Avenue
      into the Upper Hill toward Arthursville.
    terrain: urban residential, mixed-ethnicity
    visual_prompt: >-
      A steep cobblestone avenue climbing a ridge in late afternoon,
      close-packed two- and three-story brick rowhouses flanking both
      sides, a red-brick church with a white bell tower rising a block
      ahead, Black professional men in frock coats and stovepipe hats
      walking a plank sidewalk, a lamplighter with a long brass pole
      reaching a gaslamp, damp cobbles reflecting the amber, coal-smoke
      sepia sky, carte-de-visite street-scene composition.
    description: 'The ridge running east from Downtown, climbing steeply from the Lower Hill at Wylie
      Avenue into the Upper Hill toward Arthursville. The Black professional and working community is
      settled along Wylie: barbershops, tailors, physicians, teachers, and the rising entrepreneurial
      class whose sons will attend Lincoln University. Bethel AME on Wylie Avenue is the axis. The Allegheny
      Argus is above the mercantile a block down. Prince Hall Doric No. 18 meets two blocks over. The
      houses are frame and brick, closer-packed on the Lower Hill, with gardens in the Upper. The Irish,
      Italian, and Jewish arrivals live alongside and do not always share streets with. A dispensation
      of mutual wariness and a decade-long working accommodation.'
    adjacent:
    - downtown
    - lawrenceville
  lawrenceville:
    name: Lawrenceville
    summary: North and east of the Strip along the Allegheny.
    terrain: industrial
    visual_prompt: >-
      A riverside industrial district in late afternoon, long Civil-War-era
      brick arsenal walls with crenellated iron gates on one side of the
      street, a tall Bessemer smokestack with an orange flare crown in the
      middle distance, a gothic wrought-iron cemetery gate at the end of
      the block, weeping willows and a carved headstone beyond, brick
      workers' rowhouses along the river bluff, W.A. Rogers engraving
      composition, coal-smoke sepia.
    description: North and east of the Strip along the Allegheny. The Allegheny Arsenal grounds lie between
      39th and 40th Streets, the buildings Civil-War-era brick, the shops quieter than they were in '63,
      winding down from the munitions peak. The Lucy Furnace (Carnegie) stands at 51st Street, visible
      for a mile up the river by its plume alone; Isabella is across the water at Etna. The Allegheny
      Cemetery runs on 300 acres of rolling ground east of the arsenal — rural-cemetery planting, Stephen
      Foster buried since 1864, the broken-column obelisks and weeping willows are a Sunday destination
      for courting couples who have read Mount Auburn in the pages of Godey's.
    adjacent:
    - hill_district
    - east_liberty
    - strip_district
  allegheny_city:
    name: Allegheny City
    summary: Across the Allegheny River, a separate city until the 1907 consolidation.
    terrain: independent municipality
    visual_prompt: >-
      A wide street view looking across an iron suspension bridge from
      a neighboring city, three-story brick row-houses with painted Fraktur
      shop-signs on the ground floors, a grey stone penitentiary wall at
      the far end of the avenue, a narrow four-story brick storefront
      with a printer's sign, a synagogue dome visible three blocks west,
      gaslight standards, coal-smoke sepia sky, Underwood stereograph
      composition.
    description: Across the Allegheny River, a separate city until the 1907 consolidation. Sixth Street
      Bridge and Seventh Street Bridge cross from the Point and from Downtown; the toll is two cents either
      way. Deutschtown — the East End — runs along East Ohio Street, German in street-sign and window-sign
      and church. The Western Penitentiary (1826) stands on Ohio River Boulevard, grey stone and a dry
      moat. Federal Street climbs north from the river through the German commercial core to 610 Arch,
      the Bible House, where C. T. Russell's Watch Tower will be printed starting July 1879. Miss Semple's
      Academy is on Stockton Avenue. The Rodef Shalom first synagogue was dedicated in 1862 three blocks
      west — the first synagogue west of the Alleghenies.
    adjacent:
    - the_point
    - strip_district
    - downtown
  south_side:
    name: The South Side (Birmingham)
    summary: The south bank of the Monongahela, flat ground between the river and the base of Mount Washington's
      cliff.
    terrain: industrial flats
    visual_prompt: >-
      A riverside ironworks at dusk on flat ground beneath a four-hundred-foot
      cliff, two blast-furnace stacks venting orange flare against the
      cliff face, Welsh puddlers in scorched leather aprons working long
      iron rods at a tuyere opening, a bottom-poured ingot glowing white
      on the casting floor, close-packed two-story frame houses behind,
      wet cobblestones reflecting furnace-orange, Harper's Weekly
      engraving composition.
    description: The south bank of the Monongahela, flat ground between the river and the base of Mount
      Washington's cliff. Jones & Laughlin's Eliza Furnace and Clinton Furnace (1859) dominate the wharf.
      The Welsh puddlers work the tuyeres at the Eliza; they sing at the blow and they die young. Czech
      and Polish men are beginning to take the worst of the casting-floor jobs. The houses are two- story
      frame, close together, with vegetable patches behind; the smell of cabbage and kielbasa and sulphur
      hangs in the air in varying proportions depending on wind. St. Adalbert's Polish Catholic parish
      keeps the Sunday masses that matter. The Smithfield Street Bridge crosses to Downtown at the north
      end; the Monongahela Incline climbs to Mount Washington behind.
    adjacent:
    - downtown
    - mount_washington
  mount_washington:
    name: Mount Washington (Coal Hill)
    summary: Four hundred feet above the Monongahela, an almost-cliff that forced the city's vertical
      transit to evolve into the inclines.
    terrain: ridgetop
    visual_prompt: >-
      A panoramic ridgetop overlook at dusk four hundred feet above a
      river valley, a wooden funicular cable-car cresting the summit on
      a thirty-degree grade, a red-brick German-Catholic church with a
      gothic spire at the crest, the city valley spread below with
      gaslamp pinpricks and a distant orange Bessemer flare, coal-smoke
      haze thickening the middle distance, Currier and Ives lithograph
      composition.
    description: Four hundred feet above the Monongahela, an almost-cliff that forced the city's vertical
      transit to evolve into the inclines. St. Mary of the Mount (1861, German Catholic) stands at the
      summit, bell visible and — in an east wind — audible across the river; a pilgrimage climb for South
      Side Catholics of a Sunday. The Monongahela Incline (1870) climbs from Carson Street; the Duquesne
      Incline (1877) climbs from a pair of blocks west on the same bank, Diescher's work, 30-degree grade,
      800-foot rise, cherry cars with brass fittings. From the Grandview overlook the entire river valley
      glitters at night with gaslamp, Bessemer flare, and — after the 1879 Brush rollout — the first arc
      lights.
    adjacent:
    - the_point
    - south_side
  downtown:
    name: Downtown / Fifth Avenue
    summary: The triangle between the rivers.
    terrain: commercial core
    visual_prompt: >-
      A wide commercial avenue at midday, cream sandstone Italianate
      bank and hotel facades darkened by soot on both sides, wrought-iron
      balconies on a five-story hotel on the left, streetcar rails on
      iron tracks down the centre, a horse-drawn coal dray and a passenger
      streetcar mid-distance, gaslight standards every sixty feet, an
      experimental arc-lamp standard at the corner, newspaper-boys with
      broadsheets in the foreground, coal-smoke sepia sky.
    description: The triangle between the rivers. Banks on Fourth Avenue, papers on Smithfield and Wood,
      the Monongahela House hotel at Water and Smithfield, two blocks from the Point. Union Station is
      being rebuilt — the old one went in the Roundhouse Riot of '77 — the paint still curing on the replacement.
      The courthouse sits on Grant Street beside the county jail. St. Paul's Cathedral rises five blocks
      east. The Pittsburg Leader's offices are over the Wood Street mercantile; the Commercial Gazette's
      are one street over; the Dispatch is three blocks south; the Post is two blocks west. Gaslamps on
      every corner, Brush arc rollout expected by autumn '79. The streetcar lines converge on Fifth Avenue
      and run out to every neighborhood.
    adjacent:
    - the_point
    - hill_district
    - strip_district
    - east_liberty
    - south_side
    - allegheny_city
  east_liberty:
    name: East Liberty / Shadyside / Homewood
    summary: Four miles east of the Point on the streetcar line, old-money country.
    terrain: bourgeois residential
    visual_prompt: >-
      A wide residential avenue in late afternoon rain, Second Empire
      mansard-roofed brick mansions set back behind wrought-iron fences
      and lamp-topped gateposts, mature sycamores and magnolias along
      the verge, a coachman's quarters visible at the rear of the lot,
      a black carriage waiting at a carriage sweep, cream sandstone
      facades softened by mist, a Krupp-iron fence painted forest green
      in the middle ground, cabinet-card exterior framing.
    description: Four miles east of the Point on the streetcar line, old-money country. Mansarded brick
      and stone houses set back from Ellsworth and Fifth, mature sycamores and magnolias, iron fences,
      a coachman's quarters at the rear of every second lot. The Raubritter city residence is on Ellsworth
      at Negley, Second- Empire brick with a Krupp-iron fence painted forest green. Homewood Cemetery
      is chartered as of 1878 and will open its gates to burials in 1880; the cemetery architect has laid
      out the lanes and the first monuments are being cut at Pittsburgh granite-works this spring. The
      Mellons are four blocks east. The Carnegies, when they are in town, are five blocks south.
    adjacent:
    - downtown
    - lawrenceville
  braddock:
    name: Braddock
    summary: Seven miles east of the Point by the Pennsylvania Railroad main line.
    terrain: industrial
    visual_prompt: >-
      A Bessemer steel works at night on a wide river bend, two converter
      vessels tipped and throwing a geyser of orange sparks against a
      coal-black sky, four blast furnaces lined along the riverbank with
      their stacks venting orange flare, a glowing rail rolling on the
      hot line in the middle ground, coke-laden flatcars on a siding,
      a hiring yard under the lee of a blast furnace, Harper's Weekly
      W.A. Rogers engraving composition.
    description: Seven miles east of the Point by the Pennsylvania Railroad main line. The Edgar Thomson
      Steel Works (Carnegie, 1875) dominates the south bank of the Monongahela on a bend where the river
      widens and the flats carry four furnaces and a Bessemer converter house. The first Bessemer heat
      was blown 22 August 1875. Capt. Bill Jones is superintendent. Frick coke arrives by the Pittsburgh,
      McKeesport & Youghiogheny Railroad from the Connellsville field. The hiring line forms under the
      lee of No. 2 Blast Furnace and, when the foreman's glass is in use, the line moves slowly and the
      rejected men walk back to town along the railroad grade without speaking. The town itself is a mile
      of clapboard boarding houses, two saloons, a Slovak Catholic parish beginning construction, and
      a brick Methodist chapel.
    adjacent:
    - the_point
  the_train:
    name: The Train
    summary: A private six-car train commissioned from Pullman's Detroit shops in 1874.
    terrain: rolling HQ
    visual_prompt: >-
      A private train parked at a rail siding at dusk, a matte-black
      Baldwin 4-4-0 locomotive with polished brass fittings and a varnished
      wood cab at the head, a trailing consist of mahogany Pullman-type
      cars with brass railings and small gold-leaf lettering on the flanks,
      steam plume at the stack, coal-smoke drifting along the rooflines,
      a single arc-lamp standard lighting the yard, Underwood stereograph
      composition, albumen print tonality.
    description: A private six-car train commissioned from Pullman's Detroit shops in 1874. Baldwin 4-4-0
      locomotive in matte black, with the brass nameplate MCCOY INDUSTRIES on the running board. Six-wheel
      trucks with elliptical leaf springs. Mahogany and walnut interiors with brass throughout. Pintsch
      gas lighting (adopted '77 on a pre- order through a Hamburg agent) supplementing kerosene. Baker
      coal stoves in the passenger cars; steam heat piped from the locomotive when stationary long enough.
      The household's home and laboratory and field HQ. Runs the Pittsburgh, Fort Wayne & Chicago main
      and branches; PRR Pittsburgh Division with rights; B&O Pittsburgh Branch with advance notice. The
      car graph below reads forward-to-aft.
    adjacent: []
train_cars:
  engine:
    name: Engine
    visual_prompt: >-
      Interior of a Baldwin 4-4-0 engineer's cab, a bronze-and-walnut
      pressure-gauge panel on the forward bulkhead, brass steam-whistle
      pull overhead, iron firebox door glowing orange when cracked,
      engineer in a striped denim jacket and cap at the right-hand
      controls, fireman with a coal shovel on the left, coal dust
      settled on every surface, lantern amber over brass, tight stereograph framing.
    description: A Baldwin 4-4-0 of 1871 vintage, rebuilt at the Altoona Shops in 1876 with McCoy's own
      additions — a Planté-cell auxiliary bank in the tender for starting the dynamo, a set of pressure
      gauges in a bronze-and-walnut panel that the engineer regards with suspicion, and a brass steam
      whistle that plays three notes in rising thirds because McCoy cannot help himself. Engineer Silas
      Proctor, three years in service, has learned not to comment.
    adjacent:
    - boiler_car
  boiler_car:
    name: Boiler Car
    visual_prompt: >-
      Interior of a converted coal tender, bulk coal heaped forward, aft
      section fitted with a bank of twenty-four tall glass-jar Planté
      wet cells in a walnut rack with brass terminals and black rubber
      insulator pads, dilute electrolyte visible in the jars, a Gramme
      ring dynamo on a cast-iron frame at the far end, copper bus-bar
      overhead, a single gaslight through a roof skylight, warm amber
      on polished wood.
    description: Coal tender with a capacity of eight tons and — below the coal — a Planté-cell bank of
      twenty-four cells in a glass-walled rack, dilute sulphuric acid, the smell of ozone faint when the
      dynamo is running. Auxiliary Gramme ring dynamo, Viennese build, driven off a belt from a siding-mounted
      donkey engine when the train is parked. Recharges the workshop benches, the medical car autoclave,
      and Prudence.
    adjacent:
    - engine
    - workshop
  workshop:
    name: The Workshop
    visual_prompt: >-
      Interior of a rolling laboratory car thirty feet long, long polished
      walnut benches with iron-strap edges on both walls, a brass microscope
      on a gimbal mount on the left bench, a Crookes tube glowing faint
      violet in a walnut cradle on the right, an acetylene brazing torch
      on a ceramic pad, coils of gutta-percha wire, a drafting board
      with pinned blueprints on the end wall, a small Franklin stove
      at the aft end, gaslight amber with a violet corona.
    description: Thirty feet of Pullman-length car converted to laboratory. Brass microscope on a gimbal
      mount. A Crookes tube humming violet in a walnut cradle. Acetylene brazing torch on a ceramic pad.
      Gutta- percha wire in coils. Three benches; the drafting board on the fourth wall; a Franklin stove
      at the aft end venting through the roof. Coal-smoke sepia light by day; Jablochkoff-candle flare
      by night when the doctor wants real illumination. The door into the boiler car is tight-seal against
      acid vapor. The door into the armory is double-locked; Tabitha keeps one key.
    adjacent:
    - boiler_car
    - armory
  armory:
    name: The Armory
    visual_prompt: >-
      Interior of a narrow armory car, mahogany-panelled walls, wall racks
      of brass-and-walnut mechanical instruments each catalogued on an
      engraved brass plate, wrought-iron crates bolted to the plank floor,
      two Spencer repeating carbines on a rack, a locked steel cabinet
      set into the forward bulkhead, a Currier and Ives print framed
      above it, a single gaslight on a swiveled sconce, cool cemetery-slate
      undertone.
    description: A narrow car between the workshop and the study. Racked McCoy hydraulic field splints;
      crated fluoroscope monocles the household has reclaimed; a hoop of gutta-percha-insulated electrical
      cable; two Spencer repeating carbines on a rack the doctor does not like to look at; a locked steel
      cabinet holding the devices the household will not publish and will not sell. Tabitha's ledger-safe
      is mortared into the forward bulkhead, under a Currier & Ives print of the Horseshoe Curve.
    adjacent:
    - workshop
    - study
  study:
    name: McCoy's Study
    visual_prompt: >-
      Interior of a private drafting room car, mahogany-and-walnut panelling,
      a large draftsman's table with a T-square and parallel-rule at centre,
      a green-shaded banker's oil lamp on a side desk, a globe on a brass
      stand, floor-to-ceiling bookshelves of leather-bound volumes behind,
      a small framed daguerreotype of a young woman on the desk, a brass
      loupe and iron-gall ink stains on the blotter, warm gaslight amber
      on mahogany.
    description: 'Mahogany panelling, a green-shaded banker''s lamp, a globe that still has the Indian
      Territory on it. Bookshelves: Verne''s voyages in leather; Maxwell''s Treatise on Electricity and
      Magnetism; Babbage''s Passages from the Life of a Philosopher; a first edition of Ada Lovelace''s
      notes on Menabrea; a King James Bible Adelaide gave the doctor the day they were married, Proverbs
      31 marked. A cabinet photograph of Adelaide at nineteen sits angled so only the doctor sees it from
      his chair. Tabitha''s desk at the fore end runs logistics; the telegraph key clacks through the
      bulkhead from the workshop. The Morocco ledger of Weaponizations lives in the safe behind a painted
      panel.'
    adjacent:
    - armory
    - library
  library:
    name: The Library
    visual_prompt: >-
      Interior of a reading-and-research car, floor-to-ceiling mahogany
      bookcases with a brass rail running along the shelves, bound volumes
      of scientific periodicals in green cloth, a globe on a brass stand,
      an atlas-stand open at centre, two horsehair-upholstered oxblood
      leather armchairs flanking a side table, a green-shaded banker's
      oil lamp on the table, warm gaslight amber, cabinet-card interior
      composition.
    description: Scientific American bound back to 1860 in green cloth. The Patent Office Gazette, current.
      Harper's Weekly current. Electrical World current. The Allegheny Argus and the Pittsburg Leader
      and the Pittsburger Volksblatt current (the Argus on top, by habit, not by policy). A globe. An
      atlas-stand with Colton's General Atlas 1876 open to Pennsylvania. A pair of horsehair-upholstered
      leather chairs with a table between. Where the crew sits when the work is thinking rather than doing.
    adjacent:
    - study
    - observation
  observation:
    name: Observation Car
    visual_prompt: >-
      Interior of an observation car, broad plate-glass windows on three
      sides framing a passing landscape, velvet-upholstered banquettes
      in deep green damask, a central mahogany meeting table, a sideboard
      with crystal decanters, brass cuspidors at each corner, a gaslight
      chandelier with etched-glass shades overhead on a brass gimbal,
      mahogany-and-walnut panelling, stereograph composition, warm
      amber tonality.
    description: Aft of the study. Broad windows on three sides, brass cuspidors, upholstered banquettes
      in green damask. A Pintsch-gas chandelier on a brass gimbal. The brass-railed observation platform
      aft opens to the weather. Meetings with visitors happen here — the cuspidors removed for Heidelberg-educated
      guests, replaced for the Edgar Thomson men. A small writing-desk for dispatch replies.
    adjacent:
    - library
    - passenger
  passenger:
    name: Passenger Quarters
    visual_prompt: >-
      Interior of a narrow passenger quarters car, four compact sleeping
      bays with fold-down upper berths along one side, damask privacy
      curtains partly drawn, mahogany-and-brass trim throughout, a
      washstand with marble top and enameled-iron basin at one bay,
      a small wardrobe at another, a kerosene reading lamp on a swing-arm,
      a coal stove at the aft end, warm gaslight amber on wood.
    description: Four sleeping bays with folding upper berths, damask curtains, a water closet with running
      water from a tank on the roof, a Baker coal stove at the aft end. The crew's staterooms. Each bay
      has a mahogany wardrobe, a washstand with a marble top, a kerosene reading lamp. Bay One is Tabitha's;
      Bay Four is the crew's chief's by tradition; Bays Two and Three rotate with the composition of the
      household.
    adjacent:
    - observation
    - kitchen
  kitchen:
    name: Kitchen
    visual_prompt: >-
      Interior of a galley car, a coal-fired cast-iron range black-leaded
      to a gleam along one wall, a rack of copper pots overhead, hanging
      braids of onion and a smoked ham from the ceiling beam, a zinc sink
      with a hand pump at the end, a butcher-block prep table at centre
      with an oilcloth cover, a tin-lined icebox with ice-tongs, a cook's
      jacket on a peg, warm gaslight amber over copper.
    description: The galley. A coal-fired cast-iron range of Pittsburgh make, a zinc sink with a hand
      pump drawing from the roof cistern, a pie- safe, a hanging copper batterie de cuisine. Mrs. Eulalia
      Stokes of Arthursville, cook, forty-eight, a widow of the Hill District Black working class, keeps
      the range the way Cap'n Jones keeps the converter. The Monongahela House kitchen trades her a weekly
      loaf of rye for a weekly cornbread. Coffee is always on.
    adjacent:
    - passenger
    - medic
  medic:
    name: Medical Car
    visual_prompt: >-
      Interior of a clinical rail car, white-enameled-iron examining
      table at centre, a Lister carbolic-spray apparatus on a shelf, a
      steam autoclave of Chamberland pattern on a side bench, gauze and
      catgut in glass jars, a brass microscope on a polished stand, a
      glass-fronted cabinet of bottles with Latin labels, sterile
      cream-and-white painted walls contrasting the warm mahogany
      elsewhere on the train, bright cool gaslight.
    description: Dr. Abigail Teague's clinic. An autoclave that McCoy built to her specifications in 1875;
      a sterile-gauze rack; a carbolic- soap station; a glass-fronted cabinet of bottles in Latin labels;
      a leather examining-table that folds for transport. Two observation cots at the aft end, curtained.
      The smell is carbolic and lavender water in roughly equal parts. Teague keeps the train's medical
      ledger in her own hand in a green buckram volume, locked in the drawer under the examining-table.
    adjacent:
    - kitchen
    - caboose
  caboose:
    name: Caboose
    visual_prompt: >-
      Interior of a caboose, a conductor's rolltop desk with a Morse
      telegraph-key and waybills under a green-shaded oil lamp, a coal
      stove in the corner, a gun rack on one wall holding two shotguns
      and a Sharps carbine, a brass-lanterned kerosene lamp in a housing,
      a small open door at the rear framing the receding rails in
      coal-smoke sepia, warm amber lamplight on mahogany.
    description: The rear observation platform and the conductor's office. Ezekiel Holloway, conductor,
      runs the car — fifty-three, from the North Side, a Bethel AME deacon, runs orders up to the engineer
      and dispatches down to the yards. Emergency exit door to the outside at the rear; a Spencer carbine
      on the inside wall that has not been used and is not loaded. A kerosene lamp in a brass housing,
      a cast-iron stove, a rolltop desk with the conductor's logbook open on it.
    adjacent:
    - medic
landmarks:
  monongahela_house:
    name: The Monongahela House Hotel
    region: downtown
    visual_prompt: >-
      A five-story Italianate brick hotel at a downtown street corner in
      late afternoon, wrought-iron balconies at each upper floor, tall
      arched windows with dark shutters, a gaslit portico at the ground
      floor entrance, cream sandstone trim darkened by soot, a liveried
      Black porter standing at the door with gloved hands folded, a
      horse-drawn cab waiting at the curb, coal-smoke sepia sky above,
      cabinet-card exterior composition.
    description: Five stories of Italianate brick at Water and Smithfield, two blocks from the Point.
      Opened 1847, rebuilt in 1859 and again after the 1877 fire damage. The all-Black staff — front desk,
      bellhops, porters, waiters, laundresses, and the kitchen in its entirety — are the household's informal
      signals corps. Mr. Absalom Teague, head porter, runs the signals. The grand parlor is papered in
      a hand-blocked French print of the Rhine; the dining room seats one hundred and sixty and is filled
      on Saturday nights; the press-room in the basement prints the McCoy Industries broadsides on a Hoe
      Type Revolving press the hotel bought secondhand from the Post. McCoy keeps a suite on the third
      floor for the nights when the train is away and he is not.
  the_duquesne_incline:
    name: The Duquesne Incline
    region: mount_washington
    visual_prompt: >-
      A thirty-degree funicular railway climbing an eight-hundred-foot
      cliff face at dusk, a cherry-wood passenger car with brass fittings
      and gaslit interior lamp cresting a pair of steel rails, a brick-
      and-timber engine house at the lower station by a riverside street,
      a frame observation pavilion at the upper station on a ridgetop,
      coal-smoke sepia sky behind, Currier and Ives lithograph composition.
    description: Diescher's 1877 funicular from Carson Street on the South Side to Grandview Avenue on
      Mount Washington. 30-degree grade, 800- foot rise, cherry cars with brass fittings and gas lamps.
      The lower station is a brick-and-timber building with an engine house; the upper station is a frame
      pavilion with an observation deck. The fare is five cents. The operator's shift is twelve hours
      and the operator this season is a one-legged veteran of the 2nd Pennsylvania Heavy Artillery named
      Jonas Bick, who reads the Commercial Gazette between runs and does not miss a face on either car.
  edgar_thomson_works:
    name: Edgar Thomson Steel Works
    region: braddock
    visual_prompt: >-
      A Bessemer steelworks at night seen from across a wide river bend,
      four blast furnaces lined along the riverbank with their stacks
      crowned in orange flare, a converter house throwing a geyser of
      orange sparks against a coal-black sky, a rolling-mill building
      with long shed roofs, an office block of cream sandstone, a hiring
      yard under the lee of a blast furnace, water reflecting furnace-orange,
      Harper's Weekly engraving composition.
    description: Carnegie, McCandless and Company's Bessemer works of 1875, named for the Pennsylvania
      Railroad's late president. Four blast furnaces on the river, a Bessemer converter house visible
      for seven miles at the blow, a rolling mill, a heating furnace, an office block, a hiring yard.
      Cap'n Bill Jones runs it on an eight-hour-shift experiment that has not yet been countermanded.
      The converter's minutes-long geyser of sparks casts a flare-shadow on every man's face in rhythm
      with the oxygen cycle. The shift-change whistle is audible at the 28th Street yards on a still night.
  bethel_ame_wylie:
    name: Bethel AME, Wylie Avenue
    region: hill_district
    visual_prompt: >-
      A red-brick church with white trim on a steep cobblestone avenue
      in late afternoon, a tall white bell tower rising above the roof,
      tall plain-glass arched windows flanking a double front door, worn
      dark floorboards visible through the open vestibule, a brass
      handrail on the front steps, Black parishioners in frock coats
      and bonnets on the walk, gaslight standards, coal-smoke sepia sky,
      carte-de-visite exterior composition.
    description: Red brick with white trim, a bell tower visible from the Lower Hill. The congregation
      dates to 1808, among the oldest west of the Alleghenies; the present building is the third on the
      site. The floorboards in the vestibule have stood since the congregation was a fugitive-railroad
      station; the boards are dark with seventy years of polish and four decades of secret footprint.
      Afternoon light through plain glass the congregation refuses to replace with pictorials — Bishop
      Payne's decorous- worship lineage takes its plainness seriously. Mordecai Carrington conducts editorial
      business on the third pew. Prudence has attended a Sunday morning service once, accompanied by Tabitha.
      Nobody there was fooled. Nobody there commented.
  bible_house_610_arch:
    name: Russell's Bible House at 610 Arch Street
    region: allegheny_city
    visual_prompt: >-
      A narrow four-story brick storefront on a German-quarter street,
      the ground floor a men's-furnishings shop with painted window
      signage, the upper floors a print shop with ink-smudged tall
      windows glowing amber from kerosene lamps, a street-level door
      to the upper floors, a flat roofline, neighboring row storefronts
      flanking, coal-smoke sepia sky, cabinet-card exterior composition.
    description: A narrow four-story brick at 610 Arch Street, Allegheny, the ground floor a men's-furnishings
      store owned by the Russell family and the upper floors, from July 1879, the print shop and distribution
      office of Zion's Watch Tower and Herald of Christ's Presence. The type is Clarendon for headlines,
      Caslon for body, Fette Fraktur for the German-language supplement. The smell is printer's ink and
      kerosene. The first issue is being proofed on the third floor at the current moment; Russell is
      correcting the galleys himself.
  allegheny_cemetery:
    name: Allegheny Cemetery
    region: lawrenceville
    visual_prompt: >-
      A wide rural cemetery in late afternoon overcast, rolling lawns
      dotted with broken-column obelisks and draped-urn monuments, mature
      weeping willows trailing over a carved lyre headstone at centre,
      a cast-iron gatehouse with a pair of seated lions at the entrance
      at the far end of a gravel lane, wrought-iron fencing along the
      road, a Sunday couple walking an upper lane, cemetery-slate palette,
      soft diffused mourning-register light.
    description: Three hundred acres of rolling ground on Penn Avenue, chartered 1844, the second rural
      cemetery in the country after Mount Auburn. Stephen Foster has been buried here since 1864; the
      family plot is in Section 8 with a carved lyre on the headstone. Weeping willows, broken-column
      obelisks, draped-urn monuments, a pair of cast-iron lions at the gatehouse. Sunday picnics are general;
      courting couples keep to the upper lanes. Adelaide Sayre McCoy is not buried here — her grave is
      in Lancaster County, at the Quaker meeting — but the doctor has a marker in Section 11 with her
      name on it and no dates.
  st_mary_of_the_mount:
    name: St. Mary of the Mount
    region: mount_washington
    visual_prompt: >-
      A red-brick and stone Gothic church on a ridgetop avenue at dusk,
      a tall spire with a bell visible in the openwork tower, tall
      lancet stained-glass windows flanking the nave, a carved stone
      entrance arch, a modest brick rectory adjoining, the city river
      valley spread far below with gaslamp pinpricks and a distant
      Bessemer orange flare, coal-smoke sepia sky, Currier and Ives
      lithograph composition.
    description: German Catholic parish founded 1861, the present church a brick-and-stone Gothic on Grandview
      Avenue at the summit of Mount Washington. The bell is audible across the river in an east wind.
      The pastor is Father Meinrad Lauterbach, Bavarian, fifty-six, a quiet man who preaches in German
      on Sundays and in English at one weekday mass. The replicant in the Pinkerton case file has been
      observed at the 7:00 Sunday Mass. Father Lauterbach noticed on the third attendance and has not
      mentioned it to anyone who would print it.
  raubritter_city_residence:
    name: Raubritter's City Residence, Shadyside
    region: east_liberty
    visual_prompt: >-
      A Second-Empire brick mansion on a residential avenue at dusk, a
      slate mansard roof with dormer windows, tall narrow windows with
      dark shutters, a wrought-iron courtyard fence painted forest green
      with ornate finials, two potted fig trees flanking a stone entrance,
      a carriage sweep at the side, a black carriage waiting, lit windows
      glowing amber on the ground floor, cream sandstone trim darkened
      by soot, cabinet-card exterior composition.
    description: 'Second-Empire brick on Ellsworth at Negley, mansard roof in slate, a Krupp-iron fence
      around the courtyard with the finials painted forest green. Fig trees in the courtyard, imported
      from Bavaria in the sixties. The drawing room is Heidelberg: dark oak panelling, a framed Fraktur
      broadside on the mantel, a Heidelberg stein collection in a walnut vitrine, a portrait of Raubritter''s
      mother in half-mourning crape. The industrial- science library in the next room is where the work
      happens — a galvanic bench, a Crookes tube bigger than McCoy''s, a Gramme ring dynamo with a Viennese
      brass plate, shelves of Annalen der Physik and the Proceedings of the Royal Society.'
  schloss_hohenzollern_sewickley:
    name: Schloss Hohenzollern-Sewickley
    region: outside_the_map
    visual_prompt: >-
      A Richardsonian-Romanesque country mansion of cut sandstone on a
      high river bluff in late afternoon, round-arched windows, a slate
      mansard roof with copper flashing, formal parterre garden of clipped
      boxwood in the foreground, a Rhineland wrought-iron gate at the
      carriage sweep, crushed-slate drive, two peacocks on the lawn,
      a private dock visible on the river below, cemetery-slate palette
      with cold cream highlights, overcast sky.
    description: Raubritter's country estate on the Ohio River ten miles upriver at Sewickley Heights.
      An 1868 Richardson-Romanesque house of forty rooms on eighty acres, deliberately christened with
      the name Hohenzollern by Raubritter's father as a ninetieth-birthday tribute to the Kaiser. Staff
      of sixteen. A rose garden designed by a Berlin landscape architect. A private dock on the river
      and a pair of gig boats. A telegraph line from the estate to the Pittsburgh office. The doctor has
      not been invited there until the autumn of 1878.
  allegheny_arsenal:
    name: Allegheny Arsenal
    region: lawrenceville
    visual_prompt: >-
      A federal munitions arsenal on a wide cobblestone street in late
      afternoon, long Civil-War-era red-brick workshop buildings with
      crenellated iron gates flanking the entrance, a padlocked yard
      visible through the gate with empty timber racks, faded brass
      shop-door plates, a flagpole on the parade ground beyond, a tall
      perimeter wall of brick, a single uniformed sentry at the guardhouse,
      coal-smoke sepia sky, Harper's Weekly engraving composition.
    description: Federal munitions facility between 39th and 40th Streets on Butler Street, established
      1814, peak during the Civil War when forty percent of the Union Army's cartridges were filled here.
      Winding down since '66; the west yard is leased as a commercial machine shop; the east yard is still
      under federal padlock. The brick buildings are Civil-War-era, the brass plates on the workshop doors
      faded. The commanding officer is Major Rufus Hathaway, forty-seven, who has been assigned to the
      arsenal because the War Department has no better use for him, and who has been approached twice
      this year by a man in a pressed wool suit about a quiet commission.
  keely_motor_demonstration:
    name: Keely Motor Co. Pittsburgh Demonstration Offices
    region: downtown
    visual_prompt: >-
      Interior of a three-room demonstration parlor on the upper floor
      of a downtown commercial block, dark green velvet wallpaper, a
      polished mahogany demonstration table at centre supporting a brass
      mechanical apparatus under a brocade cover, a brass velvet rope
      cordoning the table, tall windows with dark drapes, a gaslight
      chandelier overhead, two upholstered chairs for a seated investor,
      warm dramatic gaslight amber, cabinet-card interior tonality.
    description: Second floor above the Sixth Avenue pharmacy, Downtown, above Dr. Mulligan's druggist.
      A single suite of three rooms — reception, parlor, demonstration — with gaslight, dark green wallpaper,
      a polished mahogany demonstration table on which the ETHERIC GENERATOR stands under a brocade cover,
      and a brass velvet rope keeping the investor three feet from the apparatus. The demonstration is
      by appointment. The appointment is made through an agent in the Monongahela House lobby. The agent
      is a retainer of Raubritter's paid under a cutout name. Keely may or may not know this. The question
      is open.
