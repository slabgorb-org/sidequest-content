# The Real McCoy — world bestiary (pittsburgh_works_hazards)
#
# World-tier override on the spaghetti_western pack. NOT monsters and NOT
# automata — this is a human-drama "western" set in 1878 industrial
# Pittsburgh. The roster is the mundane animal hazard of a mill-and-river
# city: mill-yard guard dogs, river and warehouse vermin off the Allegheny
# and Monongahela wharves, and the heavy draft animals of the works and the
# coal teams. NO desert fauna — no rattlesnakes, coyotes, cougars, javelina,
# or longhorns in the Pittsburgh smoke. (The rumored "manlike automata" of
# the Strip District are inventions/legend, not creatures — see
# inventions.yaml and legends/.)
#
# Stats follow the SRD generic form — level == HD, hp == average, ascending
# AC, morale on the 2d12 ladder. Animals are level 1-2.
#
# World tier (ADR-120): industrial river-city fauna belongs here, not in the
# pack. Sources: Rattus norvegicus on the three-rivers wharves; mill-yard
# watch dogs of the Gilded Age works; Pit-bred ratting terriers; runaway
# coal- and ore-team dray horses in period accident reports. No fantasy.
entries:
  - id: river_rat_swarm
    name: River Rat Swarm
    level: 1
    hp: 2
    armor_class: 12
    attack_bonus: 1
    damage: "1d3"
    move: "20 ft."
    morale: 5
    skill: 0
    save: 15
    role: wharf and warehouse rats
    tags: [beast, vermin, swarm]
    abilities:
      - "Swarms — pours out of a grain warehouse or a flooded riverbank cellar in numbers"
      - "Foul bite — a deep one festers in the coal-grimed wet"
    description: >-
      The brown rats of the Allegheny and Monongahela wharves, slick with
      coal soot and fat on spilled grain, swarming the warehouse floors and
      the sewer mouths where the rivers back up against the works.
  - id: mill_yard_dog
    name: Mill-Yard Dog
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "40 ft."
    morale: 8
    skill: 1
    save: 15
    role: chained works watch-dog
    tags: [beast, dog]
    abilities:
      - "Trained to the chain — silent until a stranger crosses the yard, then all teeth"
    description: >-
      A heavy, soot-flecked watch-dog kept on a running chain in a mill or
      foundry yard, set on by the night watchman against thieves and union
      men alike. Off the chain after a trespasser, it gives no warning bark.
  - id: ratting_terrier
    name: Ratting Terrier
    level: 1
    hp: 4
    armor_class: 13
    attack_bonus: 2
    damage: "1d4"
    move: "40 ft."
    morale: 7
    skill: 1
    save: 15
    role: warehouse vermin-killer
    tags: [beast, dog]
    abilities:
      - "Gameness — locks its grip and will not be shaken loose"
    description: >-
      A wiry little terrier kept by the warehousemen and the wharf saloons to
      thin the rats, quick and fearless past its size. The dock crowd matches
      them for wagers; loosed on a man, it goes low and fast for the leg.
  - id: runaway_coal_team
    name: Runaway Coal Team
    level: 2
    hp: 9
    armor_class: 12
    attack_bonus: 3
    damage: "1d8"
    move: "40 ft."
    morale: 5
    skill: 0
    save: 14
    role: bolted draft-horse team
    tags: [beast, livestock]
    abilities:
      - "Bolt — a spooked team hauls a loaded coal or ore wagon through the street, trampling all in its path"
      - "Iron-shod hooves — a kick from a panicked dray horse shatters bone"
    description: >-
      A four-horse team on a loaded coal or pig-iron dray, overworked and
      blinkered, that shies at a steam-whistle or a dropped rail and bolts
      down the cobbles — tons of iron-tired wagon that crushes whoever cannot
      clear the way before it reaches the corner.
  - id: feral_hollow_dog
    name: Feral Hollow Pack
    level: 2
    hp: 8
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "40 ft."
    morale: 6
    skill: 1
    save: 14
    role: masterless dogs of the mill hollows
    tags: [beast, dog, pack]
    abilities:
      - "Pack tactics — bold in numbers in the slag hollows and shanty rows below the works"
    description: >-
      The ownerless dogs of the smoke-blackened hollows below the mills,
      living off the slop of the company rows and the offal of the rivers.
      One slinks off alone; a hard-winter pack will run down a lone walker
      on the unlit paths between the furnaces.
