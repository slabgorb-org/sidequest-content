# The Real McCoy — Campaign History
# Pittsburgh, spring 1878 and the decade that made it.
# Four chapters. Session ranges are structural, not prescriptive — the table
# decides when a chapter has earned its close.

chapters:
  - id: fresh
    label: "Spring Commissions — The Train Pulls into Union Station"
    session_range: [1, 5]
    location: downtown
    time_of_day: morning
    atmosphere: >-
      Coal-smoke hangs in the river valley so thick the gaslamps burn at ten
      in the morning. The rebuilt Union Station smells of fresh pine and
      creosote — the old one burned in the Roundhouse Riot and the paint is
      still curing on the new one. Dr. Granville McCoy's private train sits
      on a siding at the 28th Street yards: a matte black locomotive, a
      workshop car with the stovepipes venting faint acetylene, a Pullman
      Palace study in mahogany and brass. The telegraph key in the study
      has been clacking since breakfast. Washington wants something. The
      Allegheny Argus wants a statement. Raubritter's paper wants a scalp.
      Out on the dockside a new hire at Jones & Laughlin shook hands with a
      foreman yesterday and the foreman has not been quite right since.
    active_stakes: >-
      The crew is establishing itself as McCoy's field arm. The doctor is
      mild, distracted, specific about his tools, and unhelpful about
      politics. Tabitha runs logistics from the study and expects the crew
      to take the morning's three dispatches and come back with answers.
      Every faction in the city already has an opinion about the train.
      The crew has one week before the War Department envoy arrives to
      find out where the household stands.
    points_of_interest:
      - name: The Workshop Car at the 28th Street Yards
        description: >-
          Thirty feet of Pullman-length car converted to laboratory. Brass
          microscope on a gimbal mount. A Crookes tube humming violet in a
          walnut cradle. Racks of Planté lead-acid cells in dilute sulfuric
          acid, smelling faintly of ozone. Acetylene brazing torch on a
          ceramic pad. Gutta-percha wire in coils. A partly-assembled
          stereoscopic viewer that McCoy has been calling a "stop-motion
          plate-runner." Coal-smoke sepia light coming through one small
          window, Jablochkoff-candle flare from a borrowed arc lamp
          when McCoy needs real illumination. The drafting board has
          three sketches pinned: a hydraulic splint, a fluoroscope monocle,
          and something the crew agrees not to ask about.
      - name: The Monongahela House Lobby
        description: >-
          A five-story Italianate hotel at Water and Smithfield, two blocks
          from the Point. Marble floors, gas chandeliers with Pintsch-gas
          mantles the staff are still learning to trim. An all-Black staff
          who know every face in the city and give nothing away. The front
          desk clerk signs for McCoy's mail and palms a folded note to
          Mordecai Carrington's office twice a week. Brass cuspidors. A
          parlor where Raubritter's calling card was left this morning,
          heavier than it should be.
      - name: The Point at Dawn
        description: >-
          The confluence where the Monongahela joins the Allegheny to form
          the Ohio. River fog at the water, coal-smoke inversion above it,
          the two layers not quite mixing. Old Fort Pitt brick visible
          under the fill. A tugboat pushing a coal flat upstream. Gulls
          over the warehouses. The Duquesne Incline cable ticks rhythmically
          against its pylon on the far south bank. The city's baptismal
          font, as the Catholics will tell you. The cosmogram, as the
          Trinitarians will tell you. The dumping ground for everything
          the mills can't sell, as the stevedores will tell you.
    npcs:
      - archetype: "The Patron Inventor"
        name: "Dr. Granville McCoy"
        location: the_train
        disposition: 15
        notes: >-
          Mild, precise, politically opaque. Offers the crew a choice of
          three devices for the morning's dispatch. Will not tell them
          which one is the answer.
      - archetype: "The Train's Logistician"
        name: "Tabitha McCoy"
        location: the_train
        disposition: 20
        notes: >-
          Sixteen, running the study. Reads the dispatches before her
          father does. Knows which crewmember to trust with which errand.
      - archetype: "The Hotel Majordomo"
        name: "Mr. Absalom Teague"
        location: downtown
        disposition: 10
        notes: >-
          Monongahela House head porter, Dr. Teague's cousin. Moves
          messages between the train, the Argus, and Bethel AME
          without letting any of them see the others' envelopes.
    quests: {}
    lore:
      - The rebuilt 28th Street yards have a fence and a nightwatch now — the Pinkertons photograph every arrival
      - The Allegheny Argus has already claimed McCoy as "our doctor" in three editorials he never read
      - A new hire at J&L Eliza Furnace has a handshake that isn't quite right and a memory that's slightly too good
    notes:
      - The Workshop Briefing meta-trope fires at the first session
      - The Weaponization trope is dormant but a McCoy invention the crew has already handled is about to turn up in a use nobody intended
      - Raubritter's calling card is a scene-injection, not a summons — he does not appear in person yet
    narrative_log: []
    tropes:
      - id: workshop_briefing
        status: active
        progression: 0.1
        notes: []
      - id: the_weaponization
        status: dormant
        progression: 0.0
        notes: []
      - id: real_mccoy_among_us
        status: building
        progression: 0.2
        notes: []
      - id: the_watchmakers_apprentice
        status: dormant
        progression: 0.0
        notes: []

  - id: early
    label: "Summer Dispatches — Smoke in the Papers"
    session_range: [6, 12]
    location: hill_district
    time_of_day: afternoon
    atmosphere: >-
      July heat in the river valley, the inversion layer trapping the
      sulphurous coke-oven vent downriver until every north wind smells
      like a struck match. The Argus has been running a weekly column on
      "Our Doctor." Raubritter's paper has begun calling him "The Self-
      Appointed Physician of Progress," which is worse because it is
      somehow accurate. The crew has recovered a monocle that shouldn't
      be in the hands that had it. A Pinkerton flashpan photograph of
      the train crew appeared on an inside page of a Southern Redeemer
      weekly reprinted as far south as Atlanta. And a wire from a Paris
      address the crew now recognizes arrived in cipher on a Tuesday,
      which is the day Silas Markham used to like.
    active_stakes: >-
      The crew is no longer new. They have enemies by name. The
      Bessemer's Shadow trope is active — fluoroscope monocles have
      been sighted on the hiring line at Edgar Thomson — and Capt. Bill
      Jones wants a meeting in Braddock. The Paris dispatch names a
      new buyer of the plans. The War Department envoy missed his own
      appointment. Somewhere on the Strip District, a Pullman porter
      has recognized a replicant who used to be a friend.
    points_of_interest:
      - name: Bethel AME on Wylie Avenue
        description: >-
          Red brick, white trim, a bell tower visible from the lower
          Hill. The floorboards in the vestibule have stood since the
          congregation was a fugitive-railroad station. Afternoon light
          through plain glass the congregation refuses to replace with
          stained pictorials — Bishop Payne's decorous-worship lineage
          takes its plainness seriously. The sanctuary smells of lamp
          oil and cedar and the lye-soap the ladies' auxiliary uses
          on Saturday. Mordecai Carrington conducts editorial business
          on the third pew when the editorial office is too public.
      - name: The Edgar Thomson Hiring Line
        description: >-
          A muddy yard east of Braddock, under the lee of No. 2 Blast
          Furnace. Two hundred men in four loose rows, stamping the mud
          off their boots. The Bessemer converter is in the blow — a
          minutes-long geyser of orange sparks visible across the
          Monongahela, casting a flare-shadow on every man's face in
          rhythm with the oxygen cycle. At the foreman's table a clerk
          peers through a brass-rimmed device like a jeweler's loupe
          attached to a small kerosene-fed housing. The men in the line
          do not know what he is looking at. Cap'n Bill Jones stands
          at the doorway of the blowing-mill, arms folded, not saying
          what he thinks of the loupe.
      - name: The Paris Dispatch on the Library Car Table
        description: >-
          A cable-form yellow telegraph sheet, folded twice, sitting on
          the mahogany table of the Library Car beside a half-drunk
          cup of tea. Transatlantic via Valentia Island to Heart's
          Content to New York City to Pittsburgh's Western Union main
          office, relayed to the train at the yard. Ten words minimum
          at ten dollars a word. The cipher is Markham's personal one,
          the key half-burnt on the stove of the Workshop Car. The
          decoded sheet beside it names a buyer the crew has not heard
          of. McCoy has not come out of the Study to read it.
    npcs:
      - archetype: "The Muckraker Editor"
        name: "Mordecai Carrington"
        location: hill_district
        disposition: 20
        notes: >-
          Editor of the Allegheny Argus. Claims McCoy in print, lectures
          the crew in person about what McCoy owes the race, does not
          accept the answer that McCoy owes the race nothing because he
          owes nobody anything.
      - archetype: "The Mill Foreman"
        name: "Capt. Bill Jones"
        location: braddock
        disposition: 25
        notes: >-
          Welsh-American, labor-progressive, 8-hour-shift experimenter.
          Has seen the loupes. Wants them gone. Will not burn them
          himself because it has to be done in a way the papers can
          use.
      - archetype: "The Pinkerton Superintendent"
        name: "Agent Oscar Holm"
        location: downtown
        disposition: -10
        notes: >-
          Swedish-immigrant, polite, ruthless. Introduces himself in a
          Monongahela House parlor. Mentions, without threatening, the
          Aliquippa draft on his desk.
    quests: {}
    lore:
      - The Paris cipher key is McCoy's own — Markham is using the apprentice-cipher he was taught
      - Carrington's column has begun attracting angry letters from the Southern Redeemer weeklies
      - The Presidential Request trope will open when the Washington envoy rebooks — the missed appointment was not an accident
    notes:
      - The Weaponization trope activates around the fluoroscope monocle
      - The Watchmaker's Apprentice trope ramps; Markham's buyer is not Raubritter
      - Real McCoy Among Us fires at least once — a porter recognizes a face
    narrative_log: []
    tropes:
      - id: workshop_briefing
        status: active
        progression: 0.4
        notes: []
      - id: the_weaponization
        status: active
        progression: 0.3
        notes: []
      - id: real_mccoy_among_us
        status: active
        progression: 0.4
        notes: []
      - id: the_watchmakers_apprentice
        status: active
