# Seed tropes for spaghetti_western/the_real_mccoy — world-tier deck (Epic 94:
# genre is the rulebook only; flavor lives in the world). Short-arc baited hooks
# dealt at session start and on lull/engagement draws, expiring after
# lifespan_turns and lingering as ghosts for later callback (ADR-018, ADR-128).
# Seeds are baited hooks (ADR-014 diamonds-and-coal) — deliberately vague; the
# narrator threads an engaged seed into whatever the household's week demands of
# the crew.
#
# Without this file the_real_mccoy drew from an empty deck (the engine reads
# world-first: websocket_session_handler `_seed_source = worlds.get(slug) or
# pack`), so the lull engine declined `none_available` on every quiet turn and
# the narrator invented NPCs to fill silence. This deck fixes that.
#
# Register: Pittsburgh, spring 1878 — "hell with the lid taken off." This is NOT
# the open range; it is a soot-choked industrial river city eight months out
# from the Roundhouse Riot, with the inversion holding eleven months a year.
# Leone's railroad-as-inexorable and Kurosawa's unwilling-fulcrum register, in a
# city of Bessemer flare, company-store ledgers, Pinkerton photographic intake,
# coal-barge trade, and four-languages-before-breakfast immigrant enclaves. The
# crew is Dr. McCoy's field arm; every seed is a thread the household could pull
# or let lie, and most get lived with. Pitch finer than western cliche — name the
# mill, the furnace, the parish, the ledger column. Tone runs wry-earnest over a
# gravity floor; the comedy is the sincerity-gap between McCoy's mildness and the
# world's misuse, never slapstick. Keep McCoy firmly NPC; the seeds bait the crew.

- id: the_real_mccoy_a_barge_held_at_the_point
  name: A Coal Flat Held Three Days at the Point
  description: >-
    A loaded coal flatboat has sat moored two-deep at the Point timber wharf for
    three days, its tug gone back upriver empty, and nobody at the river offices
    will say whose coal it is or why it has not been poled to the works. The
    stevedores have stopped asking. A tarpaulin over the after end of the load is
    lashed down tighter than coal needs.
  flavor_tags: [river, coal, wharf, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - A Monongahela House porter mentions the idle flat in passing, puzzled that a tug would deadhead upriver leaving paid freight behind
    - The wharf clerk's tally book has the barge entered under a consignee initialed only, where every other line is a named firm
    - Old stevedores on the night shift have begun walking the long way round rather than past the lashed tarpaulin
  narrative_hint: >-
    A small wrongness on the river trade the crew can pull on or leave. SOUL —
    let the world's misuse hide in plain commerce; bind the barge's true
    consignee to whichever faction the crew comes to mistrust, and if ignored
    let the tug return one night and the flat be gone by morning.

- id: the_real_mccoy_a_name_struck_from_the_card
  name: A Name Struck From the Hiring Card
  description: >-
    A puddler with twenty years at the iron was turned from the Eliza Furnace
    gate this week with no cause stated, his card marked with a small pencil
    cross the clerk would not explain. He is not the first; a Welshman and two
    Slovak coke-men carry the same mark. None of the rejected were told what the
    clerk saw when he held the brass glass to their chests.
  flavor_tags: [labor, mill, weaponization, grievance]
  lifespan_turns: 7
  delivery_hints:
    - The struck puddler is drinking through his savings at a South Side saloon and will show the crew the crossed card if asked plainly
    - Capt. Bill Jones has heard the rejection count and wants it correlated across the Mon Valley mills before he moves
    - A boarding-house keeper in Braddock can name three more single men sent home in a fortnight without a week's wage between them
  narrative_hint: >-
    A Bessemer's-Shadow thread in miniature — McCoy's fluoroscope monocle
    culling the line. SOUL — render the rejected man's bewilderment and the
    clerk's procedural calm with equal sincerity; let the crew choose to
    document, disrupt, or enter it in Tabitha's ledger and live with it.

- id: the_real_mccoy_the_company_store_book
  name: A Debt That Outgrew the Wages
  description: >-
    A coke-patch family below the works owes the company store more than the man
    of the house can earn back in a year, and the new clerk has begun adding
    charges nobody recalls drawing — lamp oil, a doctor's call that never came, a
    fine for a tool returned bent. The scrip they are paid in spends nowhere but
    the company counter. The wife has started selling the children's Sunday boots.
  flavor_tags: [debt, company-store, enclave, hardship]
  lifespan_turns: 6
  delivery_hints:
    - A Slovak boarding-house cook asks a crew member, ashamed, whether a debt entered wrong can ever be argued at all
    - The store's tally ledger shows the family's column climbing in a hand different from the old clerk's, with no goods named against the new entries
    - The parish priest at Saint Adalbert's has quietly paid down two such books this month and will not be able to pay a third
  narrative_hint: >-
    Debt-bondage by the scrip column, the soft machinery of the patch. SOUL —
    keep the cruelty bureaucratic and bloodless, not villainous; let the crew's
    intervention cost the family the clerk's spite or cost the household a quiet
    enemy, and if ignored let the family vanish from the patch by autumn.

- id: the_real_mccoy_a_photograph_at_the_yard_gate
  name: A Photograph No One Posed For
  description: >-
    The Pinkerton flashpan at the 28th Street yard gate goes off most mornings on
    arrivals, but this week it fired twice on a man who only walked past the
    fence — a stranger in a good coat who did not board any train and was not
    seen to leave. The nightwatch found the spent flash-powder tray emptied and
    reloaded at an hour no operative is rostered.
  flavor_tags: [pinkerton, surveillance, stranger, intrigue]
  lifespan_turns: 5
  delivery_hints:
    - The yard nightwatch mentions the off-hours flash to a crew member while warming his hands at the coal-shovel fire
    - Agent Holm's intake, if glimpsed, has the stranger's plate filed under a case number that belongs to no current contract
    - A Strip District news-boy saw the same good coat twice in three days, always a block from wherever the crew had been the day before
  narrative_hint: >-
    Counter-surveillance the crew did not order, on someone watching them. SOUL —
    let the watcher's purpose stay opaque and double-edged; bind the stranger to
    a maker's mission or a buyer's scout when the crew narrows it, and if ignored
    let the good coat be at the next scene before they are.

- id: the_real_mccoy_the_roundhouse_ash
  name: Something Recovered From the Burned Roundhouse
  description: >-
    A rail-yard scavenger working the still-uncleared rubble of the roundhouse
    that burned in the riot last July has turned up a strongbox the fire did not
    open, and word of it is moving faster than the man can sell it. He cannot
    read the maker's mark stamped in the lid. Two parties have already offered
    him more than a scavenger sees in a season, which has made him afraid rather
    than rich.
  flavor_tags: [roundhouse, riot-aftermath, salvage, intrigue]
  lifespan_turns: 6
  delivery_hints:
    - The scavenger sends word through a Strip pawnbroker that he will deal only with a buyer who comes alone and at dusk
    - The strongbox's lid mark, described secondhand, resembles a serial notch the household has seen on Markham's leaked work
    - One of the two other interested parties has been asking after the box in a Heidelberg cadence the wharf does not usually hear
  narrative_hint: >-
    The riot's ash still gives up its dead. SOUL — let the riot's unhealed wound
    be the texture, not a set-piece; bind the strongbox's contents to the
    Watchmaker's leak or the Weaponization ledger when the crew opens it, and if
    ignored let the scavenger turn up drowned at the Point and the box gone.

- id: the_real_mccoy_the_water_that_killed_a_court
  name: Fever in a Court Bethel Could Have Saved
  description: >-
    Typhoid has taken two children in a Lower Hill tenement court that drinks
    straight from a river standpipe, three streets from a vestry where McCoy's
    gravity purifier runs forty gallons the hour. The landlord will not pay the
    quarter's subscription for a filter and the families cannot. Carrington has
    the story and is deciding whether to print the landlord's name.
  flavor_tags: [typhoid, hill-district, public-health, ethics]
  lifespan_turns: 7
  delivery_hints:
    - A Bethel AME deacon asks a crew member, plainly, whether the doctor who built the filter would object to one being installed without the landlord's leave
    - Dr. Teague can confirm the standpipe water against the purified vestry water with a glass and a grim word
    - Carrington holds the landlord's name back from the next Argus and lets the crew know he is holding it
  narrative_hint: >-
    The soot economy's quiet arithmetic — typhoid is a landlord's ledger
    decision. SOUL — let the device's good and the world's neglect sit in one
    frame; let the crew install, expose, or pay, each at a cost, and if ignored
    let a third child's name reach the breakfast clipping.

- id: the_real_mccoy_a_handshake_at_saint_marys
  name: A Communicant Who Will Not Take Communion
  description: >-
    A new cast-floor hand at one of the Mon Valley furnaces sings the Latin
    responses at Sunday mass in a true clear voice and then steps from the rail
    every week before the host, and the sexton at Saint Mary of the Mount has
    begun to watch him. His handshake at the sign of peace is firm past comfort.
    He has taken no rest on a shift in a fortnight and his collar is never damp.
  flavor_tags: [replicant, parish, uncanny, infiltration]
  lifespan_turns: 6
  delivery_hints:
    - Prudence stills and goes quiet when the man's parish is named, which the crew has learned to read as data
    - The sexton mentions to a crew member, troubled, that the man knows hymn verses by the third Sunday that take the choir a year
    - A shift medic's card on the man records a pulse of forty-eight and a forehead bone-dry after eight hours at the cast floor
  narrative_hint: >-
    A Real-McCoy-Among-Us tell surfacing in the register of devotion. SOUL — let
    the uncanny be gentle and sad, not monstrous; let the crew run the
    verification at a parlor or a pew, and bind the man's maker and mission to
    whichever capital the trail later names.

- id: the_real_mccoy_the_leader_has_a_new_hand
  name: An Editorial Sharper Than the Paper Can Write
  description: >-
    The Pittsburg Leader's line on the household has hardened in a week — the
    prose tighter, the malice better aimed, the facts about the train's movements
    too current to be guesswork. Someone is feeding the editor a calendar of the
    crew's errands, and feeding the secretary who drafts the column a wit he did
    not have a fortnight ago. The Argus has noticed the change and not its source.
  flavor_tags: [press, raubritter, intrigue, reputation]
  lifespan_turns: 7
  delivery_hints:
    - A Monongahela House parlor-maid who dusts the Leader's reading copies has seen the new sharp paragraphs pencilled in before they ran
    - The column cites the train's whereabouts on a day the crew told no one but the household
    - Carrington, comparing the two papers at the third pew of Bethel, asks the crew who in their own house keeps a loose tongue
  narrative_hint: >-
    A leak inside the household's own movements, dressed as a press war. SOUL —
    let the betrayal stay ambiguous between a paid informant and an honest slip;
    bind the source to a Raubritter cutout or a turned servant when the crew runs
    it down, and if ignored let the next column name a place only McCoy knew.

- id: the_real_mccoy_a_splint_in_the_wrong_saddlebag
  name: A Mill Splint Gone West
  description: >-
    A drummer back from the southwestern territories was overheard at the
    Monongahela House bar describing the hydraulic splint he saw in a light
    cavalry trooper's kit — the same self-setting splint McCoy crated for the
    Lucy and Isabella furnaces. The crates were sold by subscription to mills,
    not to the Army. Somewhere between the furnace wall and the frontier saddle,
    a wall-crate changed hands.
  flavor_tags: [weaponization, federal, supply-chain, ethics]
  lifespan_turns: 6
  delivery_hints:
    - The drummer will retell it for a crew member over a second whiskey and place the trooper's company by its facings
    - Tabitha's ledger shows one furnace subscription crate short against the delivery manifest, never reconciled
    - A Fourth Avenue wholesaler with a Raubritter-concern account number handled the resale and would rather the question went away
  narrative_hint: >-
    A Weaponization tracing the splint's drift from mill-yard to Indian-Wars kit.
    SOUL — keep McCoy's intent and the device's new use in one honest frame; let
    the crew trace, recall, or record the diverted crate, and if ignored let the
    next clipping show the splint in a federal requisition.

- id: the_real_mccoy_the_incline_meeting
  name: A Man Waiting at the Grandview Rail
  description: >-
    The Duquesne Incline operator runs the cars empty on the half-hour at dusk,
    and for three evenings a man in a pressed wool suit with a leather portfolio
    has ridden up alone and waited at the Grandview rail, watching the valley
    lights and the 28th Street sidings far below. He buys no return and is gone
    by full dark. The operator does not know him and has stopped charging him,
    which frightens the operator more than the fare would.
  flavor_tags: [federal, stranger, mount-washington, intrigue]
  lifespan_turns: 5
  delivery_hints:
    - The incline operator mentions the silent rider to a crew member while running a balance-cable car up empty
    - From the Grandview rail the watched stretch of valley is precisely the train's siding and the wharf the idle barge sits at
    - The portfolio bears a routing stamp a Western Union boy half-recognizes as an executive-branch code
  narrative_hint: >-
    A federal approach that has not yet announced itself, surveying before it
    knocks. SOUL — let the man's purpose stay civil and unreadable; bind him to
    the Presidential Request or to Holm's contract when the crew approaches, and
    if ignored let his portfolio be on the Library Car table by week's end.

- id: the_real_mccoy_prudence_asks_a_question
  name: A Question Prudence Cannot Stop Asking
  description: >-
    Prudence has begun asking the household what is owed to a thing that was made
    to serve and has started to refuse — first in her copy of Mill, now at the
    galley stove, now of the crew directly, in the slightly-too-perfect diction
    she falls into when she is not singing. She has heard of the cast-floor hands
    who do not take communion. She wants to know whether she would be expected to
    verify one of them, and what verification is for.
  flavor_tags: [prudence, replicant, ethics, household]
  lifespan_turns: 8
  delivery_hints:
    - Prudence stops mid-task and asks a crew member, without heat, whether a made thing can withhold its consent and still be kept
    - She has left her copy of Mill's Subjection of Women open on the Library table to a passage about service and will
    - Dr. Teague, who keeps the household from dying of its own enthusiasm, warns a crew member that the question is not rhetorical and not safe to answer carelessly
  narrative_hint: >-
    The household's own conscience surfacing from the inside, the campaign's
    quietest and longest fuse. SOUL — let the question be genuine and
    unanswerable, not a puzzle with a key; let the crew's reply shift Prudence's
    standing and the household's sense of itself, and let it linger as a ghost
    that returns whenever a replicant must be verified.
