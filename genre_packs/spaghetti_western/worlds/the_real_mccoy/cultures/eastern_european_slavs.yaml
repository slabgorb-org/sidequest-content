name: Eastern European Slavs
summary: The new arrivals — Polish, Slovak, Hungarian, Rusyn, Lithuanian single-man
  labor cohort in the South Side and Braddock boarding houses
description: 'The emerging 1870s wave — Galician Poles, Slovaks from Upper Hungary,
  Magyars, Carpatho-Rusyns, Lithuanians. Mostly single men on labor contracts, boarding-house
  living on the South Side and in Braddock. The most dangerous mill and coke-oven
  jobs at the lowest pay. 1878 is early — the mass wave follows 1880. Greek Catholic
  (Rusyn), Roman Catholic (Polish, Slovak, Magyar), Lutheran (some Slovak), boarding-house
  diets of kielbasa, haluski, kapusta, rye bread. Foremen and clerks Anglicize the
  names at the hiring line — Jan becomes John, Mikolaj becomes Nicholas, Štefan becomes
  Steve — but home and parish keep the original.

  '
