name: German
summary: Deutschtown and South Side — brewers, bakers, machinists, cabinetmakers,
  Turnverein and Sängerbund
description: 'The 48er and post-1865 German-American community centered on Deutschtown
  (East End of Allegheny City), Lower Hill, and the South Side. Skilled craftsmen
  and industrialists — Iron City Brewing (Frauenheim), Eberhardt & Ober, H. J. Heinz,
  H. C. Frick, George Westinghouse. Bilingual homes, Pittsburger Volksblatt on the
  breakfast table, Turnverein gymnastics and Sängerbund choral societies as civic
  cornerstones. St. Mary of the Mount on the ridgetop for the Catholic cohort; Smithfield
  Street German Evangelical for the Protestants.

  '
