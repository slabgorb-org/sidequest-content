name: Scots-Irish Presbyterian
summary: Pittsburgh old-stock — law, banking, business ownership, East Liberty and
  Shadyside homes
description: 'The founding Anglo-Scots-Ulster Presbyterian families established in
  Pittsburgh since the 1770s. Dominant in law, banking, manufacturing ownership, and
  the civic-reform establishment. Brick and stone homes in Allegheny City, East Liberty,
  Shadyside. Mellon, Negley, Denny, Carnegie, Wilkins, Scaife. First Presbyterian
  on Wood Street is the mother congregation. Austere Calvinist registers — sermons
  quoted at dinner, Latin mottoes on the stationery, Burns recited ironically.

  '
