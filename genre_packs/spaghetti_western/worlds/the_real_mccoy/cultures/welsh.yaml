name: Welsh
summary: The technical aristocracy — puddlers and rollers imported from the South
  Wales valleys, Braddock and South Side chapels
description: 'The imported technical aristocracy of Pittsburgh iron — puddlers and
  rollers recruited from Merthyr Tydfil, Dowlais, Rhondda, Aberdare because the American
  skill base couldn''t yet match them. Small, chapel-focused, Welsh-language at home.
  Calvinistic Methodist and Welsh Congregational chapels in Braddock and on the South
  Side. Clog-shod on the puddling floor (steel-toed boots cost more than a day''s
  wage; the clogs keep feet above the cinders). Eisteddfods on Christmas and July
  4. Patronymic naming skew: Jones, Williams, Davies, Evans, Thomas, Lewis dominate.

  '
