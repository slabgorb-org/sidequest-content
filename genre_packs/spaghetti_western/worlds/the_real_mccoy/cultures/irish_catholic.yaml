name: Irish Catholic
summary: Post-Famine Pittsburgh — mill puddlers, streetcar conductors, police, domestics,
  Strip and Lower Hill
description: 'The mass Irish-Catholic cohort arriving Pittsburgh 1847 onward. Mill
  puddlers (the elite), streetcar conductors, police, domestics, saloon-keepers, drayage.
  Shantytown housing on the Hill''s north slope, South Side flats, rail-adjacent North
  Side. St. Patrick''s in the Strip (1808) is the mother parish; St. Paul Cathedral
  the bishop''s seat. Wakes, rosaries, whiskey, and union cards. The "Bridget" domestic
  stereotype runs through Scots-Irish households like a parallel economy.

  '
