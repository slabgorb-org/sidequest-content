characters:

  - name: Dr. Granville McCoy
    role: Patron, holy-fool inventor
    type: npc_major
    appearance: >-
      1870s cabinet-card studio portrait engraving, fine ink linework on
      sepia, engraved crosshatching detail, monochrome. Chest-up portrait of
      an adult Black American man in his early forties, warm medium-brown
      skin, short-trimmed hair, a neatly trimmed goatee, a faint graphite
      smudge on one cheek, ink-stained fingers. Warm, slightly amused
      expression, eyes looking just off to one side. Wearing a black wool
      frock coat slightly rumpled with a small scorch mark on the left cuff,
      a burgundy silk waistcoat, a white high-collar shirt with a dark cravat
      in a loose knot, a gold watch chain, dark trousers, a workshop apron
      pushed down around the waist. Plain felt homburg or bareheaded.
    culture_aesthetic: >-
      A brass magnifying loupe on a black ribbon cord hangs at the breastbone,
      a graphite pencil tucked behind the right ear. Soft warm gaslight from
      one side, plain aged-paper studio background.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no page numbers, no border, no frame. Fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

  - name: Cornelius Raubritter
    role: Antagonist, old-money industrialist
    type: npc_major
    appearance: >-
      1870s cabinet-card studio portrait engraving, fine ink linework on
      sepia, engraved crosshatching detail, monochrome. Chest-up portrait of
      an adult German-American man in his mid-fifties, tall with erect
      posture, pale northern-European skin with reddened cheekbones, iron-grey
      hair combed straight back, a full short-trimmed moustache, a thin pale
      dueling scar on the left cheek, pale grey eyes, an even unsmiling
      expression. Wearing an immaculately tailored charcoal frock coat, a
      dove-grey waistcoat with pearl buttons, a starched white wing-collar
      with a black silk ascot pinned by a small gold pin, a heavy gold watch
      chain with a small fob, dark trousers.
    culture_aesthetic: >-
      A gold signet ring on the left little finger, one hand resting on the
      silver top of an ebony walking stick. Cool side light with cemetery-slate
      undertones, plain dark studio background.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no page numbers, no border, no frame. Fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

  - name: Tabitha McCoy
    role: Logistics, McCoy's daughter
    type: npc_major
    appearance: >-
      1870s cabinet-card studio portrait engraving, fine ink linework on
      sepia, engraved crosshatching detail, monochrome. Three-quarter portrait
      of an adult young woman of sixteen, Black American, medium-brown skin, a
      composed competent face with a steady level gaze and a faint patient
      set to the mouth, a young woman's slim adult build and upright bearing,
      not a small child. Dark hair drawn back in a simple low bun. Wearing a
      plain high-necked dark-blue wool working day-dress with a small white
      collar and full-length sleeves, a leather belt at the waist carrying a
      small ring of keys, a plain dark pinafore apron, a thin silver chain
      with a small cross at the throat.
    culture_aesthetic: >-
      A graphite pencil tucked behind the right ear, a folded paper ledger
      held in one hand. Plain ribbon in the hair. Soft even studio light,
      plain aged-paper background.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no page numbers, no border, no frame. An adult sixteen-year-old
      young woman, fully clothed, modest high-necked dress, correct adult
      proportions, natural hands and fingers, non-sexualized depiction, not a
      young child.

  - name: Prudence
    role: Humanoid replicant, nursemaid companion
    type: npc_major
    appearance: >-
      Albert Robida illustration register, fine engraved linework on sepia,
      the uncanny stillness of a posthumous daguerreotype, monochrome.
      Chest-up portrait of an adult female-presenting woman of about
      twenty-five, pale-to-medium skin of unnaturally uniform even tone with
      no freckles and no asymmetry, chestnut hair parted centre and drawn into
      a perfectly symmetrical low chignon with no stray strands, deliberate
      grey-green eyes held wide and steady, a faint fixed pleasant resting
      smile, posture slightly too upright, hands folded precisely at the
      waist. Wearing a plain grey wool nursemaid's day-dress, a spotless
      starched white apron, a white collar and cuffs, a small silver brooch at
      the throat.
    culture_aesthetic: >-
      Too-perfect facial symmetry and uncanny calm, ordinary human skin and
      ordinary cloth with no visible mechanism, no metal, no seam, no joint.
      Cool still even light, plain pale studio background.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no page numbers, no border, no frame. Fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction, ordinary human skin, no visible machinery.

