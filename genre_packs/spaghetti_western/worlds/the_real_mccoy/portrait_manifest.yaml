  # Pre-generated sample faces for the chargen portrait chooser.
  # Each carries a `backdrop_poi` naming a real rendered POI slug
  # (all confirmed in r2_manifest.json); the daemon plants the
  # subject inside that POI with a telephoto montage guard.
  # DISCIPLINE: `appearance` is terse, physical face/upper-body ONLY,
  # period-true 1878 Pittsburgh, dress described only at the collar.
  # No background prose. `culture` = culture filename stem;
  # `archetype` = real archetype name from world archetypes.yaml.
  # Allocation: 9M / 9F across all 7 cultures.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Black American ────────────────────────────────────

