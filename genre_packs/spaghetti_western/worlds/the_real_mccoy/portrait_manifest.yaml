  - name: Dr. Abigail Teague
    role: Irish-American woman physician, train medic
    type: npc_major
    appearance: >-
      An Irish-American woman in her late thirties, Woman's Medical College
      of Pennsylvania graduate (1870s cohort — the real route). Dark auburn
      hair pinned up in a low practical knot (not a fashion style — medical
      practicality). Fair skin with freckles across the nose and cheekbones
      (period-honest, not filtered out). Green-grey eyes, direct. Small
      crow's-feet from squinting at slides and surgical fields. Hands kept
      carbolic-clean and slightly reddened from it.
    dress_1878: >-
      Professional woman-physician 1878: dark green or slate-blue wool
      day-dress with a high collar and long sleeves, bodice cut plain
      for ease of movement, practical boots, a white pinafore apron
      when in clinic. A silver brooch at the throat with a small cameo
      (her mother's, Galway). A gold signet ring on the right ring
      finger (her WMCP class ring). No corset (progressive medical
      view) — the silhouette is noticeably less Victorian-pinched than
      the society matrons around her.
    culture_aesthetic: >-
      Progressive Irish-Catholic woman physician 1878 — the lack of
      the fashion-silhouette corset is the visible tell. Competence over
      decoration.
