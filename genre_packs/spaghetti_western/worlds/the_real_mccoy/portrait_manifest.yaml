# Portrait Manifest — The Real McCoy
#
# 1878-1880 Pittsburgh. Carte-de-visite and cabinet-card studio register
# (Napoleon Sarony 1870s Broadway studio) for character portraits.
# All subjects rendered in period-authentic 1878 dress: frock coat +
# waistcoat + watch chain for men of station, working shirtsleeves +
# waistcoat for laborers, full Victorian mourning or day-dress bodice
# for women of station, plain calico for working women.
#
# NO post-1900 elements. NO brass-goggle steampunk. NO wide-brim cowboy
# hats. NO visible mechanical elements on replicants (the POINT is you
# can't tell by looking).
#
# Reference images: no actual URLs fetched — citations are to named
# real-world reference bodies only.
#
# Negative prompt additions (appended to world-level negative):
#   - Every entry inherits visual_style.yaml negative_prompt
#   - Per-character additions listed under `negative_additions:`

characters:

  # ── 12 Named NPCs ───────────────────────────────────────────

  - name: Dr. Granville McCoy
    role: Patron, holy-fool inventor
    type: npc_major
    appearance: >-
      A Black American man in his early forties, Baltimore-born, Pittsburgh
      resident. Short-trimmed hair, clean-shaven or carefully trimmed goatee
      (artist choice — consistent per session). Warm medium-brown skin with
      the softness of someone who works indoors. Ink-stained fingers and a
      faint graphite smudge on one cheek. A pencil behind the right ear.
      A brass magnifying loupe on a black ribbon cord around his neck,
      hanging at the breastbone. Eyes that are genuinely looking at you —
      warm, slightly amused, occasionally drifting mid-sentence to whatever
      he was thinking about before you arrived.
    dress_1878: >-
      Black wool frock coat (slightly rumpled, a scorch mark on the left
      cuff), burgundy silk waistcoat, white high-collar shirt with dark
      cravat tied in a loose knot, gold watch chain, dark trousers. A
      workshop apron pushed down around his waist when working. Never a
      top hat — a plain felt homburg at most.
    culture_aesthetic: >-
      Black professional class, Pittsburgh 1878 — the frock coat is correct,
      the loupe is the tell. Not dandified, not austere. The ink-stain is
      load-bearing.
    register: cabinet_card_studio   # Sarony 1870s tonal range, warm
    flux_prompt: >-
      carte-de-visite studio portrait of a Black American man in his
      early forties, short-trimmed hair, warm brown skin, pencil behind
      right ear, brass magnifying loupe on black ribbon cord at breastbone,
      1878 black wool frock coat with a small scorch mark on left cuff,
      burgundy silk waistcoat, white high-collar shirt with dark cravat,
      gold watch chain, ink-stained fingers, faint graphite smudge on
      cheek, warm intelligent eyes with slight amused detachment,
      Napoleon Sarony 1870s Broadway studio register, albumen print tonality,
      gaslight amber warm lighting, mahogany and walnut backdrop,
      oval cabinet-card vignette, coal-smoke sepia atmosphere
    negative_additions: >-
      genius bulging-eye cliche, mad scientist wild hair, goggles, lab coat,
      Einstein pastiche, 20th century clothing, modern suit
    references:
      - "Napoleon Sarony 1870s cabinet cards of Black sitters (e.g. Frederick Douglass Sarony portraits)"
      - "Mathew Brady studio portraits of Black Union veterans post-1865"
      - "Southworth & Hawes daguerreotype tonal range (reference only)"

  - name: Cornelius Raubritter
    role: Antagonist, old-money industrialist
    type: npc_major
    appearance: >-
      A German-American man in his mid-fifties, Heidelberg-educated, Pittsburgh
      old money. Tall, erect posture. Iron-grey hair combed back, full but
      short-trimmed Kaiser-style moustache (NOT a Prussian wax-tip — more
      restrained). A visible Mensur dueling scar on the left cheek, pale and
      deliberate. Pale northern-European skin with red at the cheekbones from
      brandy and cold air. Eyes pale grey, unsmiling at rest but not
      snarling — a banker's face, not a villain's.
    dress_1878: >-
      Immaculately tailored charcoal frock coat (bespoke, Rhineland cut),
      dove-grey waistcoat with pearl buttons, starched white wing-collar
      with a black silk ascot pinned by a small gold pin, heavy gold
      watch chain with a Heidelberg fraternity fob, dark trousers,
      polished side-button boots. Carries a silver-topped ebony walking
      stick. Signet ring on the little finger of the left hand.
    culture_aesthetic: >-
      Sewickley Heights Gilded Age patrician with Rhenish-revival tastes —
      expensive, restrained, un-American in its precision.
    register: cabinet_card_studio_cold
    flux_prompt: >-
      cabinet-card studio portrait of a German-American industrialist in
      his mid-fifties, tall erect posture, iron-grey hair combed back,
      short Kaiser moustache, pale Mensur dueling scar on left cheek,
      pale grey unsmiling eyes, 1878 charcoal bespoke frock coat
      Rhineland cut, dove-grey waistcoat with pearl buttons, starched
      white wing-collar, black silk ascot with gold pin, heavy gold
      watch chain with fraternity fob, signet ring on left little finger,
      Napoleon Sarony studio register, albumen print, cool cemetery-slate
      undertone, mahogany backdrop, oval vignette, patrician formal
    negative_additions: >-
      villain sneer, twirling moustache, monocle on chain, Prussian
      pickelhaube, wax-tip kaiser moustache, Bismarck caricature,
      top hat with band, modern suit
    references:
      - "Napoleon Sarony 1870s cabinet cards of Gilded Age industrialists"
      - "Franz von Lenbach oil-portrait poses of German industrialists c.1875"
      - "Otto von Bismarck period-correct portraiture (pose reference only; NOT facial similarity)"

  - name: Tabitha McCoy
    role: Logistics, McCoy's 16-year-old daughter
    type: npc_major
    appearance: >-
      A Black American girl of sixteen, compact and practical. Natural hair
      in two thick braids or a simple low bun depending on day. Medium-brown
      skin. A pencil behind the right ear (like her father — inherited
      habit). A folded paper or ledger in one hand — always. Eyes that have
      been managing her father's life for four years and it shows: patient,
      efficient, not world-weary but not wide-eyed either.
    dress_1878: >-
      Plain working day-dress in dark blue or brown wool, high-necked with
      a small white collar, sleeves to the wrist, practical boots. A leather
      belt at the waist with a small ring of keys (train cars, lockers,
      correspondence boxes). Pinafore apron over when in the workshop car.
      No jewelry except a simple silver cross on a thin chain (inherited
      from her mother). Hair accessory is a plain ribbon, not a fashion plate.
    culture_aesthetic: >-
      Working Black teenager with adult responsibilities — not a fashion
      plate, not a child. The keys at the belt are the tell.
    register: cabinet_card_three_quarter
    flux_prompt: >-
      cabinet-card studio portrait of a sixteen-year-old Black American
      girl, natural hair in two thick braids, medium brown skin, pencil
      behind right ear, folded ledger paper in one hand, 1878 plain
      dark-blue wool day-dress with small white collar and wrist-length
      sleeves, leather belt with small ring of keys, simple silver cross
      on thin chain, plain hair ribbon, practical working boots,
      intelligent patient eyes, slight tired warmth, three-quarter pose,
      Sarony 1870s studio register, albumen print tonality, warm
      gaslight amber lighting, mahogany backdrop
    negative_additions: >-
      fashion plate, debutante gown, elaborate jewelry, child's pinafore-only
      outfit, wide-eyed innocence, big ringlets, modern teen styling
    references:
      - "Gurney & Son 1870s NYC cabinet cards of Black schoolgirls and young teachers"
      - "J.P. Ball (Black Cincinnati photographer) 1870s studio work"
      - "Frances Benjamin Johnston early work (as a rare period-correct reference)"

  - name: Prudence
    role: Humanoid replicant, nursemaid-prototype, companion register
    type: npc_major
    appearance: >-
      A female-presenting humanoid, visual age mid-twenties. Pale-to-medium
      skin with an unnatural uniformity of tone (no freckles, no blush, no
      asymmetry). Chestnut hair parted center, drawn back into a perfectly
      symmetrical low chignon (no stray hairs — ever). Eyes a deliberate,
      manufactured grey-green. Mouth held in a slight, pleasant, resting
      smile that does not change when the conversation does. Posture five
      percent too upright. Hands folded precisely at the waist when at rest.
      She blinks, but not quite often enough.
    dress_1878: >-
      Nursemaid's plain grey wool day-dress, white apron starched to
      architectural rigidity, white collar and cuffs spotless in a way
      that reads as WRONG given she works in a coal-smoke city, plain
      boots polished to mirror finish, small silver brooch at the
      throat (a gift from McCoy, in-world).
    culture_aesthetic: >-
      L'Ève future 1886 register — a period-dressed woman rendered with
      the uncanny stillness of a posthumous daguerreotype. NOT visibly
      mechanical. NOT chrome. NOT doll-seamed. The wrongness is in the
      symmetry, the stillness, the too-clean apron, the blink rate.
    register: leve_future_illustration
    flux_prompt: >-
      1878 cabinet-card studio portrait of a young woman, mid-twenties,
      pale-to-medium skin with unnaturally uniform tone no freckles no
      blush, chestnut hair parted center in a perfectly symmetrical low
      chignon, manufactured grey-green eyes, slight pleasant resting
      smile, posture five percent too upright, hands folded precisely
      at waist, plain grey wool nursemaid day-dress, architecturally
      starched white apron, spotless white collar and cuffs, small
      silver brooch at throat, Albert Robida L'Ève future 1886
      illustration register blended with Sarony studio portrait,
      uncanny stillness of posthumous daguerreotype, too-perfect
      symmetry, too-clean in coal-smoke city, albumen print tonality,
      cool gaslight, mahogany backdrop
    negative_additions: >-
      visible machinery, gears, chrome, robot joints, android seams,
      glowing eyes, LED, fiber optic, clockwork face, exposed metal,
      steampunk goggles, asymmetric hair, stray hair strands, freckles,
      natural blush variation
    references:
      - "Albert Robida 1886 illustrations for Villiers de l'Isle-Adam *L'Ève future*"
      - "Posthumous daguerreotype portraits, US 1840s-1860s (tonal/stillness reference)"
      - "Lady Clementina Hawarden 1860s stereoscopic studies of young women (pose stillness)"
      - "Hans Bellmer later Poupée work (anti-reference — do NOT go this far)"

  - name: Silas Markham
    role: Apprentice-turned-betrayer, Paris expatriate
    type: npc_major
    appearance: >-
      A white American man in his mid-thirties, lean, actor-handsome.
      Dark brown hair worn slightly longer than Pittsburgh men wear it
      (Paris-expatriate tell), combed back. Thin dark moustache, carefully
      trimmed. Blue-grey eyes that hold warmth until they don't. Clean-
      shaven cheeks. Fair skin with a permanent faint color at the cheekbones
      — looks like a flush; is not.
    dress_1878: >-
      Cut French rather than American — narrower shoulders, longer coat
      line, tighter trousers. Dark blue wool frock coat, pearl-grey waistcoat,
      starched wing-collar with a self-tied silk bow cravat (Parisian), slim
      watch chain, polished oxblood boots. A small white flower in the
      buttonhole (boutonnière) when in public. A silver cigarette case in
      the breast pocket (cigarettes, not cigars — another Paris tell).
    culture_aesthetic: >-
      American in Paris, returning — the cut of the coat is the first
      wrong note in any Pittsburgh room. Charm as a practiced instrument.
    register: cabinet_card_studio_charm
    flux_prompt: >-
      cabinet-card studio portrait of a white American man in his
      mid-thirties, lean actor-handsome, dark brown hair worn slightly
      long combed back Paris expatriate style, carefully trimmed thin
      dark moustache, blue-grey eyes with practiced warmth, permanent
      faint flush at cheekbones, 1878 dark blue wool frock coat French
      cut narrower shoulders longer line, pearl-grey waistcoat, starched
      wing-collar with self-tied silk bow cravat, slim watch chain,
      white boutonnière in lapel, silver cigarette case in breast pocket,
      Napoleon Sarony studio register, albumen print tonality, gaslight
      amber, charm turned slightly cold
    negative_additions: >-
      frontier cowboy, wide-brim hat, moustache curled at tips,
      mustache wax, dandy caricature, visible sneer, anime bishounen,
      20th century clothing
    references:
      - "Sarony 1870s cabinet cards of matinee actors (e.g. Edwin Booth tonal register)"
      - "Nadar Paris 1870s studio portraits (cut-of-clothing reference)"
      - "John Singer Sargent early male portrait studies c.1878-80"

  - name: Capt. Bill Jones
    role: Welsh-American steel foreman, Edgar Thomson, labor-progressive
    type: npc_major
    appearance: >-
      A Welsh-American man in his early forties, built like the puddler
      he used to be before he became foreman. Red-gold hair going grey at
      the temples, full walrus moustache (not waxed, practical). Ruddy
      complexion permanently reddened by furnace work, heavy forearms,
      hands that have been burned and healed many times over. Eyes that
      laugh quick and close hard. Scar at the left eyebrow from a flying
      scale of hot metal, 1869.
    dress_1878: >-
      Working foreman's kit at the mill: heavy cotton shirt rolled to the
      elbows, leather vest scorched in a half-dozen places, canvas trousers,
      heavy boots, a Civil-War-era revolver sometimes on the hip (officer-
      brother's, kept). Off-shift formal: plain black wool sack-coat suit
      (not frock coat — he's labor, not owner), simple black cravat, no
      watch chain (pawn ticket; in-world joke with crew), a single Methodist
      lapel pin.
    culture_aesthetic: >-
      Welsh-American labor foreman — the burn-scars on the hands are the
      tell. Dignity without pretension.
    register: cabinet_card_three_quarter_working
    flux_prompt: >-
      cabinet-card studio portrait of a Welsh-American steel foreman in
      his early forties, built heavy and strong, red-gold hair greying at
      temples, full practical walrus moustache, ruddy weather-beaten
      complexion, heavy forearms with old burn scars, scar at left
      eyebrow, laughing-then-hard eyes, 1878 working attire — heavy
      cotton shirt rolled to elbows, leather vest scorched in several
      places, canvas trousers, heavy boots, three-quarter pose with
      one hand resting on a wrought-iron rail, Harper's Weekly W.A. Rogers
      working-man register blended with Sarony portrait, coal-smoke
      sepia atmosphere, Bessemer orange rimlight from distant furnace,
      albumen print tonality
    negative_additions: >-
      clean office worker, top hat, frock coat formal, wide-brim cowboy
      hat, modern industrial safety gear, hardhat, hi-vis vest,
      clean shaven, 20th century clothing
    references:
      - "William Allen Rogers Harper's Weekly 1878 Mon Valley steel-mill engravings"
      - "Mathew Brady Civil War noncom portraits (tonal register)"
      - "Real period photos of Captain Bill Jones (historical — died 1889 at ET Works)"

  - name: Mordecai Carrington
    role: Editor, *The Allegheny Argus*, AME orator
    type: npc_major
    appearance: >-
      A Black American man in his late forties, orator's build — tall,
      shoulders set back, head carried high. Short salt-and-pepper hair,
      full but neatly trimmed greying beard (rabbinical cut more than
      Civil-War cut — Bethel AME sermonic register), dark skin with a warm
      undertone. Gold-rimmed reading spectacles usually folded in a breast-
      pocket case, sometimes perched on the nose. Eyes that pin you with
      the weight of Scripture and a circulation number in the same glance.
    dress_1878: >-
      Black wool Prince Albert frock coat (longer than McCoy's, more
      formal — pulpit register), deep-plum silk waistcoat, starched wing-
      collar with plain black silk cravat, gold watch chain with an AME
      fraternal fob, black trousers, polished gaiters over boots. Carries
      a leather portfolio bound in black calf. Small Bethel AME
      church-officer pin at the lapel.
    culture_aesthetic: >-
      Hill District Black press / Bethel AME — the pulpit and the press
      at once. The Prince Albert cut is the rhetorical move.
