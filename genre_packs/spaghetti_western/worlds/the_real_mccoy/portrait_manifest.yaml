    references:
      - "Historical cabinet-card portraits of Abner Doubleday c.1870s-1880s"
      - "Mathew Brady studio portraits of retired Union generals c.1875"
      - "Sarony cabinet cards of MOLLUS members 1870s"

  - name: John Worrell Keely
    role: Real — Keely Motor Co. fraud inventor, Philadelphia
    type: npc_major_real
    appearance: >-
      A white American man in his mid-fifties (born 1827 — 51-53 in
      1878-1880). Thick dark hair going grey, worn longer than business
      standard (showman register), combed back high. Full beard, deep
      and dark, theatrical. Heavy brow. Ruddy complexion from years of
      demonstration-hall gaslight and brandy. Eyes that perform
      conviction — wide and held on the listener a beat too long, like
      a stage mesmerist. Hands expressive, always in motion when
      speaking (stage-demonstrator gestures).
    dress_1878: >-
      Showman-inventor register: midnight-blue velvet sack-coat (slight
      theatrical cut), cream waistcoat with gold watch chain heavier
      than McCoy's, silk cravat in deep maroon with a jeweled stickpin
      (probably paste), dark trousers, polished oxford-tie boots. A
      heavy signet ring on the left little finger. Often pictured
      beside his "Vibratory Generator" apparatus in period photographs —
      he cultivated the prop-beside-the-man pose.
    culture_aesthetic: >-
      Philadelphia demonstration-hall showman inventor — the velvet coat
      and the jeweled stickpin are the tell. Keely looks exactly like
      what he is: a confidence man with a workshop.
    register: cabinet_card_studio_theatrical
    flux_prompt: >-
      cabinet-card studio portrait of a white American showman-inventor
      in his early fifties, thick dark greying hair worn longer than
      standard combed back high, full deep dark theatrical beard,
      heavy brow, ruddy complexion, wide performing conviction eyes
      held a beat too long, expressive mid-gesture hands, 1878
      midnight-blue velvet sack-coat theatrical cut, cream waistcoat,
      heavy gold watch chain, deep-maroon silk cravat with jeweled
      stickpin, signet ring on left little finger, Sarony studio
      register, albumen print tonality, warm dramatic gaslight,
      mahogany backdrop, one hand resting on a brass mechanical
      apparatus (Vibratory Generator prop)
    negative_additions: >-
      serious scientist in plain lab attire, clean-cut engineer,
      modern magician costume, top hat and tails, Houdini register
      (wrong decade and wrong theatrical mode), frontier huckster
    references:
      - "Historical cabinet-card portraits of John Worrell Keely c.1875-1885"
      - "Keely beside the Vibratory Generator period newspaper engravings"
      - "Sarony cabinet cards of theatrical-mesmerism showmen 1870s"


  # ── Archetype Templates (narrator-generative) ──────────────
  # Reusable portrait templates for unnamed NPCs per design brief
