      eyes, 1878 dark navy-blue wool frock coat military-register cut,
      plain grey waistcoat, white high-collar shirt, black silk cravat,
      MOLLUS rosette at lapel beside small Theosophical Society pin,
      gold watch chain with regimental fob, Sarony 1870s studio register,
      albumen print tonality, warm gaslight amber, mahogany backdrop,
      formal three-quarter pose
    negative_additions: >-
      active-duty uniform (he's retired civilian now), epaulettes,
