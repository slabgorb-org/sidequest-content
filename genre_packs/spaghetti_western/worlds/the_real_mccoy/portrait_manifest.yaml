      Man, late thirties. Warm dark-brown skin, close-cropped hair greying at
      the temples, a trim moustache. Steady level gaze, the practiced
      pleasant composure of long service. A high starched white collar and
      the brass-buttoned dark blue jacket of a railroad porter at the throat.

