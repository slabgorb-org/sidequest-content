  - name: Agent Oscar Holm
    role: Pinkerton Pittsburgh superintendent, Swedish immigrant
    type: npc_major
    appearance: >-
      A Swedish-American man in his early forties, tall and lean, blond
      hair going pale at the temples, close-cropped Scandinavian cut.
      Clean-shaven (unusual for 1878 — the clean cheek is his tell).
      Pale northern skin, pale blue eyes that do not move until they need
      to. A thin white scar on the jawline (work, 1874). Expression at rest:
      nothing. He does not smile when you expect him to. He does not
      smile when you don't.
    dress_1878: >-
      Pinkerton Pittsburgh standard — dark charcoal sack-suit (not frock
      coat — agents wore the newer business-suit cut to blend), starched
      wing-collar, plain black cravat, dark grey waistcoat, plain watch
      chain, black derby bowler. Long wool overcoat in winter. Always
      carries a small leather-bound notebook and an Eberhard Faber pencil.
      Colt Model 1877 Lightning double-action revolver in a shoulder
      holster (the agency-issue sidearm for the year).
    culture_aesthetic: >-
      Pinkerton Pittsburgh 1878 — the business suit, the notebook, the
      absence of any expressive element. Uniformity as intimidation.
    register: cabinet_card_institutional_cold
