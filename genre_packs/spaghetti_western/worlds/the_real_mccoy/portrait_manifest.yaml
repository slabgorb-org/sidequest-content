  - name: Charles Taze Russell
    role: Real — earnest millenarian, Allegheny Bible House
    type: npc_major_real
    appearance: >-
      A white American man in his late twenties (born 1852 — 27 in 1879).
      Medium-brown hair worn slightly long for the period, parted on the
      side and combed back. Young, earnest, unlined face. Clean-shaven
      (he grew the famous full beard later). Pale skin. Eyes that burn with
      specific sincere conviction — not fanatic-wild, just absolutely
      certain. Holds a Bible (Rotherham's Emphasized, or King James)
      under one arm as a habitual gesture.
    dress_1878: >-
      Young Allegheny Presbyterian-reared, turning-his-own-way mercantile
      class: modest black wool sack-coat suit (his father's haberdashery
      business background shows), white high-collar shirt, plain dark
      cravat, no watch chain (stewardship convictions). Plain black boots.
      No ornament. A leather Bible case at hand.
    culture_aesthetic: >-
      Allegheny City millenarian — sincere, well-turned-out in a plain
      register, visibly self-denying. The missing watch chain is the tell.
    register: cabinet_card_studio
    flux_prompt: >-
      cabinet-card studio portrait of a young white American millenarian
      preacher in his late twenties, medium-brown hair parted on side
      combed back, young earnest unlined face, clean-shaven, pale skin,
      burning-sincere certain eyes, Bible under one arm, 1878-1879
      modest black wool sack-coat suit, white high-collar shirt, plain
      dark cravat, no watch chain no ornament, leather Bible case,
      Napoleon Sarony studio register, albumen print tonality, warm
      but sober gaslight, mahogany backdrop, three-quarter pose
    negative_additions: >-
      full beard, old man, bearded patriarch (that's his later look),
      clerical collar (Russell never wore one), ornate clergy dress,
      pulpit robes, modern evangelist suit
    references:
      - "Historical cabinet-card photographs of C.T. Russell c.1879-1882 (Watch Tower Society archive, pre-beard)"
      - "Sarony cabinet cards of young Protestant clergy 1875-1880"

  - name: Abner Doubleday
    role: Real — Civil War general, Theosophical Society interim president 1879
    type: npc_major_real
    appearance: >-
      A white American man in his early sixties (born 1819, age 60 in
      1879). Full head of steel-grey hair swept back, full grey walrus
      moustache with the ends drooping (not waxed), clean-shaven cheeks.
      Military bearing — shoulders squared, spine straight, the posture
      of forty years of command. Weathered fair skin. Eyes that have seen
      Gettysburg and find Theosophy a small and orderly consolation. Looks
      every inch the Union general he was.
    dress_1878: >-
      Retired-general civilian: dark navy-blue wool frock coat cut in a
      slightly military register (narrow lapel, deeper skirt), plain
      grey waistcoat, white high-collar shirt, black silk cravat,
      MOLLUS (Military Order of the Loyal Legion of the United States)
      rosette at the lapel, gold watch chain with a small regimental
      fob. Sometimes a Theosophical Society lapel pin (the interlaced
      symbols) beside the MOLLUS rosette — visual juxtaposition is
      the whole point of the character.
    culture_aesthetic: >-
      Retired Union general becoming an American occultist — the MOLLUS
      rosette next to the Theosophical pin is the visual tell.
    register: cabinet_card_studio_formal
    flux_prompt: >-
      cabinet-card studio portrait of a retired US Army general in his
