# Spaghetti Western — Item Catalog and Starting Equipment
#
# NOTE ON WORLD/GENRE SPLIT: Items are world-flavor (a Mexican border
# world ships revolvers and Winchesters; a Sengoku world would ship
# katanas, wakizashi, and matchlocks). Currently the loader reads
# inventory.yaml ONLY from the genre path — there's no world-level
# override hook (see sidequest-api/crates/sidequest-genre/src/loader.rs:57).
# The item catalog below is therefore the dust_and_lead American-West
# inventory living at genre scope by constraint, not by design. When a
# second world in this genre is added, the loader needs extension
# (`load_yaml_optional(&world_path.join("inventory.yaml"))` with world
# overriding genre) before the inventory can split properly.

currency:
  name: Dollars
  denominations:
    cents: 1
    dollars: 100
    eagles: 1000

item_catalog:
  # ── Weapons ────────────────────────────────────────────────
  - id: revolver_worn
    name: Worn Revolver
    description: "A six-shooter that has seen better days. Reliable enough if you clean it."
    category: weapon
    value: 800
    weight: 3
    rarity: common
    power_level: 1
    tags: [firearm, sidearm]
    lore: "Every drifter's first companion. The grip is smooth from use."
    narrative_weight: standard

  - id: revolver_cheap
    name: Cheap Pistol
    description: "Mass-produced, poorly balanced, and prone to jamming. Better than nothing."
    category: weapon
    value: 400
    weight: 2
    rarity: common
    power_level: 1
