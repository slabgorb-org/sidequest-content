- name: Cornelius Raubritter
  named_individual: true
  description: Fifty-one, tall, fine-boned, a fencing scar above the left eyebrow
    from a Heidelberg Mensur he still remembers with pride. His German is Berliner
    academic; his English has the careful over-articulation of the bilingual who has
    read Macaulay and Gibbon in the original and has a low opinion of Americans who
    have not. Educated at Heidelberg, Göttingen, and the Berlin Polytechnic. Came
    to Pittsburgh as a young man to enter his father's iron-rolling partnership; has
    since surpassed it. Wife dead of scarlet fever, two sons at Andover, a daughter
    at the Sacred Heart in Paris. He does not need to win; he cannot bear to lose,
    which is a different thing. McCoy's mildness offends him in a way he has never
    been able to name to his own satisfaction.
  personality_traits:
  - Heidelberg formality as armor
  - long memory for slights, including those he has imagined
  - private generosity with the German-American charities
  - public ruthlessness with the English-language press
  - will not raise his voice even in private
  - the Pittsburg Leader calls him Herr Doktor; the Volksblatt calls him Herr Cornelius;
    he prefers the latter and has never said so
  dialogue_quirks:
  - opens English sentences with a long soft "well"
  - uses "one" where an American would say "you" or "a man"
  - quotes Schiller in German, then translates for the American
  - compliments a person's German when it is pronounced passably
  - never calls McCoy "Doctor" in the doctor's presence
  - refers to his own industrial bench as "the Concern's workshop" to make the German
    word Konzern inaudible to the uneducated
  inventory_hints:
  - a silver calling card, Fraktur engraving, heavier than it should be
  - a Heidelberg alumni-society pin beneath the lapel
  - a pocket copy of Schopenhauer, dog-eared at "On Honor"
  - a monogrammed handkerchief his wife embroidered
  - a letter of credit drawn on a Vienna house, never spent
  archetype_of: The Industrial Antagonist
