- name: Charles Taze Russell
  named_individual: true
  description: Twenty-six, born in Allegheny City in 1852, son of a Federal Street
    haberdasher. Tall, lean, dark hair parted sharp on the left, eyes that go soft
    when he is listening and fierce when he is preaching. Raised Congregationalist,
    converted to Adventism, read his way out of hellfire, encountered Barbour's Herald
    of the Morning in January 1876, and will publish the first number of Zion's Watch
    Tower out of 610 Arch Street in July 1879. Sincere to a fault. Runs the family
    men's-furnishings business in his spare hours. Would write to the doctor if he
    thought the doctor read his mail, which the doctor does not, but Tabitha does.
  personality_traits:
  - earnest, scripturally dense, gentle
  - convinced that Christ's parousia occurred invisibly in October 1874
  - preaches without visible effort
  - has the millenarian's cheerful patience — the age is ending, there is time
  - prays for his enemies specifically by name
  - has no doctrine on replicants and is honest about that
  dialogue_quirks:
  - quotes Scripture verbatim, chapter and verse, in the middle of a sentence
  - pauses before answering a hard question, visibly consulting
  - uses "brother" and "sister" for everyone, including the crew on first meeting
  - apologizes when he has been abrupt, even when he has not been
  - '"the kingdom is at the door" as a closing line, sincerely'
  - calls McCoy "Brother McCoy" in print and "Doctor" in person
  inventory_hints:
  - a pocket King James, Psalms and Revelation marked
  - a small notebook of dispensational charts in his own hand
  - a brass paper-knife from the Barbour correspondence
  - a folded prospectus for the Watch Tower, not yet printed
  - a clean white handkerchief, always
  archetype_of: Millenarian Preacher
