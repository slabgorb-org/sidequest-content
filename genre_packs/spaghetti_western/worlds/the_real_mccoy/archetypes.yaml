- name: Silas Markham
  named_individual: true
  description: Twenty-five, chestnut hair, easy laugh, charm that is not faked — and
    therein the trouble. Born at Lyons, New York, on the Erie Canal; father a lock-keeper
    killed when a lock wall collapsed in 1866; mother gone the winter after. Apprenticed
    to McCoy at fourteen; in Paris since late 1876. Lives above a watchmaker's on
    the Rue de Turbigo, pays the rent reliably, reads the Allegheny Argus by mail
    a month late. Has taken four mistresses in two years, none unkindly. His cold
    laugh, which he produces only when cornered, is the one tell the doctor would
    recognize; the crew will only hear it once, and they had better hear it.
  personality_traits:
  - charming by nature, not by calculation, which makes him worse
  - writes weekly in cipher to the doctor, signed S
  - has a real affection for Tabitha that does not redeem him
  - genuinely believes he is selling the plans to keep them from being locked up by
    someone worse
  - has been selling them to everyone worse
  - a cold laugh when cornered, from his father
  dialogue_quirks:
  - calls the doctor "Master" in correspondence, "the doctor" to strangers, and "Granville"
    only in a private letter he has written twice and posted once
  - opens a telegram with "UNFORGIVABLE" the way other men open with "WELL"
  - switches to French when he is lying
  - ends letters with "your apprentice," ten years after
  - uses Tabitha's name in letters and never her title
  - the cold laugh — a single exhale — when a plan is turning against him
  inventory_hints:
  - a locket with Adelaide's miniature Tabitha gave him for his twenty-first birthday;
    he still carries it
  - a Breguet pocket-watch, inherited from his watchmaker landlord's father, not purchased
  - three sets of the master drawings, hand-copied, in separate hiding-places in Paris,
    Le Havre, and (as of autumn) New Orleans
  - a Remington over-and-under derringer he has never fired
  - the apprentice's oath from McCoy's shop, framed, on the bedroom wall of the Rue
    de Turbigo rooms
