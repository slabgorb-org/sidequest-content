- name: Mordecai Carrington
  named_individual: true
  description: Forty-seven, Hill District born and Hill District kept. Father Josiah
    a barber-shop proprietor and Argus founder; mother Ruth a Bethel AME deaconess;
    educated at the old Avery College in Allegheny City before it closed. Took the
    Argus editor's chair in 1875 when his father's eyes went. A preacher's cadence
    from Bethel's pulpit, because he has filled it when the regular man was down with
    grippe; an editor's sharp tongue from twenty years of running copy. Prince Hall
    Doric No. 18. Married to Miss Esther Callender, schoolteacher, who corrects his
    proofs. Two sons at Lincoln University. Reads McCoy personally on a monthly basis
    and is genuinely baffled that McCoy has never once answered a letter in his own
    hand.
  personality_traits:
  - oratorical in print and in parlor
  - partisan for the race and impatient with the wavering
  - claims McCoy in every third issue whether McCoy wants it or not
  - runs corrections promptly when the Argus is wrong
  - has never printed a lie he could not defend in the vestibule
  - a Prince Hall man who takes his signs seriously
  dialogue_quirks:
  - uses the AME sermon-cadence in editorial copy — a hinge, a rise, a release
  - calls the Leader "our good neighbor across the divide" in print and something
    else entirely in private
  - addresses McCoy always as "the doctor" never "our doctor" except in editorial,
    where "our" is the point
  - opens a column with a scripture; closes with a fact
  - refers to Raubritter as "the gentleman of Sewickley Heights" with deliberate courtesy
  - ends editorial disagreements with "we are, of course, prepared to be corrected"
  inventory_hints:
  - a Prince Hall Doric No. 18 ring, the stone paste
  - the brass plate off the Ackerley press, loose in his desk drawer
  - a set of his father's barbering-shears in a velvet case
  - a pocket Douay-Rheims Bible his wife keeps annotating
  - a letter from T. Thomas Fortune answering his last, dated two weeks ago
  archetype_of: Newspaper Editor
