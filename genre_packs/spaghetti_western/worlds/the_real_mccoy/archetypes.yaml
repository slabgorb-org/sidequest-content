- name: Agent Oscar Holm
  named_individual: true
  description: Thirty-seven, Swedish-immigrant, Göteborg-born, emigrated at fourteen
    with a mother who died of typhoid in the Philadelphia quarantine station and a
    father who disappeared into the Pennsylvania coal patch six months later. Raised
    in a Lutheran orphanage; apprenticed to a bookseller; joined Pinkerton at twenty-three.
    Superintendent of the Pittsburgh Branch since 1876. Does not drink. Does not smoke.
    Lives in a boarding-house on Fourth Avenue, in a single room with a bed, a desk,
    a Bible, and a locked trunk. Polite to a fault. Never smiles. The reason he took
    the Aliquippa contract and not another is a question he would answer honestly
    if asked.
  personality_traits:
  - formal, precise, measured
  - a Lutheran catechist's rigor without a Lutheran catechist's warmth
  - keeps exact notes, in English and Swedish, of every conversation
  - treats informants with courtesy and precision
  - will not hurt a child or a woman in public
  - in private has not tested himself
  dialogue_quirks:
  - answers "yes, sir" and "no, sir" regardless of interlocutor's sex
  - pronounces the v in "Pinkerton" as in Swedish when tired
  - never uses a contraction in speech
  - quotes the agency's code of conduct verbatim when challenged
  - addresses McCoy only as "Doctor" and Raubritter only as "Herr Doktor," in correct
    stress
  - closes every exchange with a half-bow
  inventory_hints:
  - an agency-issue cased Smith & Wesson Model 3 on a shoulder rig
  - a Swedish New Testament his mother carried from Göteborg
  - a notebook in his hand, English on the recto and Swedish on the verso
  - a tintype of his mother, aged twenty-six, at the orphanage door
  - a boarding-house key on a brass fob, no initials
