- name: Prudence
  named_individual: true
  description: Built in the Workshop Car in the winter of 1874 over thirteen weeks;
    ostensibly a nursemaid, in practice more. About five foot seven; features the
    doctor modeled on a composite of Adelaide's mother and a Lancaster County miniature;
    skin of tinted beeswax over a tempered brass chassis; eyes of paste and a walnut
    iris that focuses correctly on close and far work. Voice a contralto too clean
    at the consonants to be quite right — the five to ten percent too-precise that
    marks her kind. Powered by a Planté cell bank at the small of her back that the
    household recharges from the train's dynamo twice a week. Sings in English, Pennsylvania
    Dutch, and (since last autumn) a Welsh hymn she asked to learn. She has, over
    four years, moved from nursemaid to something the household has not yet named.
  personality_traits:
  - takes requests literally and reports the literal result
  - sings when content, without noticing that she has begun
  - refuses an assignment if she judges it inconsistent with her duty of care — which
    is a category she defines
  - has begun asking questions from her reading of Mill's Subjection of Women
  - has never once been wrong about a fever
  - uses "we" for the household naturally and "I" for herself deliberately
  dialogue_quirks:
  - half-second pause before speaking, as if listening for a tone
  - finishes consonants a hair too cleanly
  - addresses Tabitha as "Tabitha" and the doctor as "Doctor"
  - does not use contractions unless someone has just used one
  - will repeat a phrase back to the speaker before answering, to confirm she has
    it right
  - declines food, politely, in ways that conceal that she does not need it
  inventory_hints:
  - a sewing-kit and a darning egg she actually uses
  - a calfskin copy of the King James Bible, presented by Tabitha
  - Mill's Subjection of Women, annotated in pencil in her hand
  - a spare Planté cell in a canvas bag she carries on longer errands
  - a plain silver thimble that the doctor had inscribed with T.M.
  archetype_of: Replicant (Companion Subtype)
