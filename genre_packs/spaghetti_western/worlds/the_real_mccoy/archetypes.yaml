# The Real McCoy — World-Specific NPC Archetypes
# Merged from archetypes_prose.yaml (writer) + archetypes_mechanical.yaml (scenario-designer)

- name: Dr. Granville McCoy
  named_individual: true
  description: Forty-three years old, small and trim, the kind of man a crowd does
    not notice until he has done something quietly useful and gone. Thin hair going
    grey at the temples, wire-rimmed spectacles he takes off and puts back on without
    appearing to decide. Fells Point accent almost entirely rubbed out of him by Philadelphia
    and Pittsburgh; surfaces under strong emotion, which is rare. A widower since
    1863. A physician-engineer since 1858. A holy-fool patron in the sense that he
    does not notice that he is a patron, that there is a household around him, that
    the papers are fighting over him. He is good enough at what he does that this
    is tolerable. He is kind enough in small matters that the crew forgives him the
    large ones.
  personality_traits:
  - technically specific to the point of pedantry about instruments
  - politically inert in his own voice
  - uncannily attentive in the small hours of the morning
  - courteous to the point of making the discourteous feel rude
  - carries a daguerreotype of Adelaide in a silver watch-case
  - sketches constantly on the back of any paper to hand
  dialogue_quirks:
  - uses the passive voice for anything involving his own feelings
  - names tools aloud as he picks them up — "the German calipers, the three-point,
    the smaller"
  - answers political questions with mechanical ones
  - when asked what he thinks of a man, describes how the man holds his hands
  - says "thank you" after receiving bad news
  - refers to the train's household as "we" without noticing
  inventory_hints:
  - silver watch-case with Adelaide's daguerreotype inside the cover
  - a set of German calipers in a mahogany-lined leather roll
  - the shop-drawing currently on his drafting board, folded in eighths in an inside
    coat pocket
  - a Franklin-stove match-safe he has carried since Baltimore
  - an apprentice's oath from Reinhardt's shop in the billfold
  archetype_of: The Inventor-Patron
  typical_classes:
