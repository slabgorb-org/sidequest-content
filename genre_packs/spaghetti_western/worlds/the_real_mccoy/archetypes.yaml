- name: Tabitha McCoy
  named_individual: true
  description: Sixteen. Dark hair in a single plait; mother's grey eyes; father's
    habit of half-finishing sentences in his own head and moving on. Educated at Miss
    Semple's Academy in Allegheny City, where she is the only girl who has taken the
    mathematics examinations; private tutoring in German, French, and Latin from her
    father's friends; has been running the train's Study since she was twelve. Not
    forward, not shy. Patient with her father to the point of policy. Allows Prudence
    to call her by her name; allows no one else to call her by anything less formal
    than Miss McCoy until the household has known them for a year.
  personality_traits:
  - organized beyond her years, without fuss
  - better at managing the doctor than anyone else alive
  - keeps the Weaponization ledger in her own hand
  - reading her way through Mill and Martineau this spring
  - writes her mother a letter every Sunday; does not post them
  - will not be patronized twice
  dialogue_quirks:
  - uses her father's passive voice, deliberately, as a bit
  - addresses Prudence by first name and only first name
  - says "I should think" where another girl would say "I think"
  - finishes other people's sentences, correctly, once per conversation
  - goes quiet before making a decision, as her father does
  - refuses the diminutive Tabby except from Prudence
  inventory_hints:
  - black Morocco ledger of Weaponizations, current year
  - her mother's silver-nibbed pen and the inkwell it came with
  - Miss Semple's quarterly examination certificates, folded small
  - a braid of her own and Adelaide's hair in a locket
  - a pocket-sized railroad timetable for the PRR main and branches
