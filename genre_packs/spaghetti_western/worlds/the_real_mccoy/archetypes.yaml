- name: Dr. Abigail Teague
  named_individual: true
  description: Thirty-four, Irish-Catholic, born in the Strip District, educated at
    the Women's Medical College of Pennsylvania (graduated 1874, the year Prudence
    was built), practiced at the Magee Hospital for two years before McCoy offered
    her the Medical Car and she took it for the same reason anyone takes any job —
    because she was tired of being told what she could not do. Married once, widowed
    at twenty-six, no children; her late husband's cousin Absalom is the Monongahela
    House majordomo. Short, dark-haired, quick- moving, an accent that tightens toward
    Connemara when she is angry. Swears in Gaelic when annoyed, which is often, which
    is how the household learned what the Gaelic for "you stupid stubborn beautiful
    man" sounds like.
  personality_traits:
  - no-nonsense and affectionate in exactly that order
  - competent to a degree that intimidates the doctor
  - in love with Prudence as a patient case and as a friend
  - prays the Rosary weekly at St. Patrick's and would fight a priest over the sacraments
    if she had to
  - keeps the Medical Car spotless and the train's coffee drinkable
  - has ordered McCoy out of her own infirmary twice
  dialogue_quirks:
  - Gaelic oaths under breath — "a Dhia na bhfeart" at minimum three times per crisis
  - switches between Connemara Irish and the Strip District Irish- American depending
    on who is in the room
  - calls McCoy "Doctor" in front of patients and "Granville" in front of no one
  - quotes Galen and Lister in the same breath without noticing
  - says "sit down" as a full sentence and means it
  - laughs without smiling
  inventory_hints:
  - a leather doctor's bag fitted with autoclave-sterilizable instruments McCoy built
    to her specifications
  - a set of Rosary beads of Connemara marble
  - her late husband's watch, in her vest
  - a flask of Bushmills in the Medical Car cabinet for after the worst hours
  - a Women's Medical College class photograph, 1874, four alumnae still in practice
  archetype_of: Train Medic
