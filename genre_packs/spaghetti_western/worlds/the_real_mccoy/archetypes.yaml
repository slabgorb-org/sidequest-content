- name: Capt. Bill Jones
  named_individual: true
  description: Thirty-nine, Welsh-American, born in the Cwmbach valley, emigrated
    with his family at eleven, puddler at thirteen, foreman at twenty-two, Superintendent
    of the Edgar Thomson Steel Works since Carnegie opened it in 1875. Broad-shouldered,
    red-bearded, quick-tempered and quicker to laugh, a man who will curse at a furnace
    and a vice-president with the same vocabulary. The eight- hour-shift experiment
    is his and he knows it will outlive him. Does not like being called Captain; has
    to be, because of the brevet. The man who walked the torch-party out of the 28th
    Street yards on the night of 21 July 1877 without a drawn pistol. He is going
    to die in a furnace blowout in 1889; the household does not know this and he does
    not either.
  personality_traits:
  - labor-progressive in a city that is not
  - short-fused on behalf of his men and long-suffering on behalf of himself
  - Calvinistic Methodist chapel once a month, whether he needs it or not
  - curses in Welsh when he is out of English
  - keeps the Cwmbach hymn at the tuyere in his head
  - addresses everyone, including Carnegie, by first name after the third meeting
  dialogue_quirks:
  - Welsh "look you" at the end of a declarative
  - the word "boyo" for anyone under thirty-five, regardless of sex
  - will quote his foreman's-apprenticeship oath when angry
  - laughs before he curses; the laugh is the warning
  - '"Doctor" for McCoy, always, the way other men say "brother"'
  - '"Herr Doktor" for Raubritter, with a specific ironic stress'
  inventory_hints:
  - a puddler's wooden clog, sole half-worn, kept on his office shelf
  - a Calvinistic Methodist pocket hymnal in Welsh
  - Carnegie's monthly letters, in a leather folio
  - a bottle of Jameson Irish whiskey in the bottom desk drawer, for the doctor's
    visits
  - a flask of the same, on his person, for the mill
