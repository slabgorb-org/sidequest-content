- name: John Worrell Keely
  named_individual: true
  description: Forty-one. Self-taught. Theatrical. Born Philadelphia, the son of a
    carpenter, educated at the Franklin Institute's public lectures, formerly a painter
    of band-organ cabinets. Founder of the Keely Motor Company on Market Street, Philadelphia,
    since 1872; has raised something like five million dollars from subscribers on
    the promise of the etheric vapor engine. Demonstrations alternately grandiose
    and vague. The Pittsburgh demonstration office above the Sixth Avenue pharmacy
    opened in March 1878, financed by Raubritter through a cutout. Whether Keely himself
    knows this, or whether Raubritter is riding a genuine enthusiasm he cannot tell
    from the fraud underneath, is an open question even to Raubritter. Keely will
    die in 1898 and the compressed-air machinery will be found in the basement wall.
