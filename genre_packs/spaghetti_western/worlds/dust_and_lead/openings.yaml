# Dust and Lead — World-tier opening hooks
#
# Sangre Territory, 1878. The railroad is coming, silver has been found in
# the mountains, and Mexican families, Anglo settlers, Buffalo Soldiers,
# and the last Apache war bands are converging on the same hundred miles
# of desert. Tone: sun-scorched, mythic, slow-fuse violence. Inspirations
# in world.yaml — Leone's Trilogy, Django, The Great Silence, Salt War,
# Victorio's Campaign, Southern Pacific expansion.
#
# Authored at unified Opening schema
# (spec: docs/superpowers/specs/2026-05-01-canned-openings-design.md).

version: "0.1.0"
world: dust_and_lead
genre: spaghetti_western

openings:
  - id: sangre_del_paso_main_street_noon
    name: "Sangre del Paso — Main Street, Noon"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Sangre del Paso main street, midday, Sangre Territory"
    tone:
      register: sun-scorched, deliberate, slow-fuse
      avoid_at_all_costs:
        - tavern roll-call introductions
        - strangers offering quest exposition
        - bandit-ambush kickoffs
        - omniscient narrator naming the villain on page one
    establishing_narration: >-
      Sangre del Paso at noon is two streets, one church, one rail-survey
      stake driven where a corral used to be, and a heat that bleaches
      the colour out of everything by the second day. Three things happen
      this morning that the territory cannot quite hold all at once: a
      Southern Pacific surveyor reaches town with brass instruments and
      a federal escort; a Mexican family that has owned the well at the
      south end of Main since before the border has been told the well
      now belongs to the railroad; and a stranger has ridden in from the
      Apache country wearing a coat that does not match the season. None
      of these three parties has yet spoken to the other two. You
      are in town. You have water and you have eyes. The first
      decision is whose direction to face.
    first_turn_invitation: >-
      The wind off the Sangre flats is hot enough to smell. The
      surveyor's mule is tied at the trough nearest the bank. The
      Aragón family's eldest, Doña Mercedes, is standing very still in
      the door of the well-house. The stranger has dismounted at the
      end of the street and has not turned his face. The bell at the
      mission has rung the half-hour, and the territory is making the
      next noise.

  - id: silver_canyon_buffalo_soldiers
    name: "Silver Canyon — The Soldiers' Camp"
    triggers:
      mode: multiplayer
      backgrounds: []
      min_players: 2
      max_players: 6
    setting:
      location_label: "Buffalo Soldier outpost, Silver Canyon mouth, Sangre Territory"
    tone:
      register: tense, watchful, military-formal
      avoid_at_all_costs:
        - cavalry-rescue heroics
        - Apache portrayed as faceless threat
        - quest-board task assignments
        - white-hat / black-hat moral framing
    establishing_narration: >-
      Silver Canyon is six miles long, two springs deep, and now, per a
      Washington patent that arrived by stagecoach yesterday, federal
      land. The Tenth Cavalry detachment camped at the canyon mouth has
      orders nobody has explained: to keep the canyon clear pending a
      Southern Pacific survey crew that is already three days late, and
      to do it without provoking Victorio's people, who are camped
      somewhere up the western draw and have not moved in nine days.
      The party rode in this morning under a flag of parley, an Aragón
      letter of introduction, and a shared understanding that the
      lieutenant, a Sergeant Quincy whose name is on more than one
      Civil War citation, will not invent his own orders. The party is
      seated in the lieutenant's tent. The lieutenant is reading the
      Aragón letter for the second time. The kettle is on.
    first_turn_invitation: >-
      Lieutenant Marsh sets down the letter, pours four tin cups of
      coffee that has been on the fire too long, and says nothing for
      a measured count. Sergeant Quincy stands at the tent flap with
      his back to the canyon, watching the western draw. Outside, a
      trooper is unsaddling a fresh horse the party has not seen
      before — its hide still has dust on it from a hard southern
      ride. The lieutenant lifts his cup, looks at each of you in
      turn, and asks the party to explain, plainly, why the Aragón
      family thinks the canyon is theirs to negotiate over.

  - id: the_drifters_offer
    name: "Cantina La Sombra — The Drifter's Offer"
    triggers:
      mode: either
      backgrounds: []
    setting:
      location_label: "Cantina La Sombra, back booth, Sangre del Paso"
    tone:
      register: low-light, ironic, knife-quiet
      avoid_at_all_costs:
        - tavern brawls as kickoff
        - the drifter delivering a clear quest brief
        - mysterious-stranger archetype played for melodrama
        - moralizing about the railroad
    establishing_narration: >-
      The cantina is the third building south of the church and the
      only one in town that does not sell to the railroad. The drifter
      who rode in from Apache country has been sitting in the back
      booth since dusk yesterday and has paid for his meals with
      silver coin that none of the merchants in Sangre del Paso have
      seen the shape of before. He sent a boy from the mission to find
      you — by description, not by name — and he is willing to
      buy you a meal in exchange for the courtesy of a conversation.
      He has not said about what. The cantina is mostly empty. The
      barkeep, an Aragón cousin, has put a kettle on without being
      asked.
    first_turn_invitation: >-
      The booth is in the corner the lamps don't quite reach. The
      drifter — older than the trail-coat suggests, hands that have
      not held a rifle in a season — gestures to the bench across from
      him with the small unhurried courtesy of someone who has done
      this before. There is a folded square of oilcloth on the table
      between you. He has not opened it. He uncorks a bottle the
      cantina does not stock, pours, and waits for you to sit down.
