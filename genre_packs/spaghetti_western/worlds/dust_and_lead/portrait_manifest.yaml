characters:
  - name: Superintendent Josephus Ward
    role: Leader of The Consolidated
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult man in his
      forties, pale fair skin sunburned pink across the nose and at the collar,
      narrow clean-shaven face, thin lips, thinning light-brown hair combed
      flat and slicked back, fine wire-rimmed spectacles. Wearing a grey wool
      three-piece suit with a dark silk waistcoat and a thin gold watch chain
      across the front, a high white collar gone limp with sweat, a sheen of
      perspiration on his forehead and temples. Composed measured expression,
      eyes level behind the lenses.
    culture_aesthetic: >-
      Eastern money — the cut of the suit, the watch chain, and the spectacles
      mark a man of capital rather than the territory, the dust on his clothes
      out of place on the fabric.
    element_visual: >-
      Grey wool suit, dark silk waistcoat, thin gold watch chain, wire-rimmed
      spectacles catching hard light, a leather document folder held against his
      chest. Shot on a long 135mm telephoto portrait lens, compressed
      perspective, shallow depth of field, the face sharp and filling the frame,
      a soft out-of-focus rail yard behind him at sunset with the dark mass of a
      cold locomotive and a bruised orange sky thrown far out of focus. Single
      uncropped shot, one subject only, no split screen, no diptych, no montage,
      no inset, no second image, no wide shot, no extra figures. No text, no
      caption, no title, no writing, no labels, no watermark. Fully clothed,
      modest outfit, correct human anatomy, natural hands and fingers.

  - name: Señora Alma Reyes
    role: Matriarch of The Families
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult Mexican woman
      in her fifties, deep brown skin weathered by sun and wind, deep lines
      around the eyes
      and mouth, high cheekbones, silver-grey hair pulled back and braided.
      Wearing a plain dark riding dress of heavy practical cloth buttoned to a
      modest high neck, a simple worn rosary of dark wooden beads resting at her
      collar. Steady level expression, dark eyes looking directly forward,
      composed and unhurried.
    culture_aesthetic: >-
      Mexican ranchero — the dress is working cloth, plain and practical, and
      the rosary is the single ornament, worn smooth from handling.
    element_visual: >-
      Plain dark riding dress buttoned high, worn dark-wood rosary at the
      collar, a holstered revolver belt just visible at the shoulder strap.
      Shot on a long 135mm telephoto portrait lens, compressed perspective,
      shallow depth of field, the face sharp and filling the frame, a soft
      out-of-focus adobe ranch courtyard behind her at dusk with thick ochre
      plaster walls and an old fig tree thrown far out of focus. Single uncropped
      shot, one subject only, no split screen, no diptych, no montage, no inset,
      no second image, no wide shot, no extra figures. No text, no caption, no
      title, no writing, no labels, no watermark. Fully clothed, modest outfit,
      correct human anatomy, natural hands and fingers.

  - name: Captain Abel Stone
    role: Leader of The Sangre Rangers
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult man in his
      forties, deeply sun-blasted tanned skin, permanent squint lines fanning
      from narrowed pale eyes, a long drooping grey moustache, lean weathered
      face. Wearing a sweat-stained dust-colored wide-brimmed hat, a faded grey
      collarless shirt and a worn leather vest, a tarnished metal star badge
      pinned over the left breast. Hard tired expression, jaw set.
    culture_aesthetic: >-
      Sangre Anglo lawman — the star badge is the whole identity, everything
      else worn to the point of asceticism, nothing decorative.
    element_visual: >-
      Sweat-stained dust-colored wide-brimmed hat, worn leather vest, tarnished
      metal star badge over the left breast, a faded neckerchief. Shot on a long
      135mm telephoto portrait lens, compressed perspective, shallow depth of
      field, the face sharp and filling the frame, a soft out-of-focus
      two-story pale sandstone courthouse behind him under hard noon light with
      its covered plank porch thrown far out of focus. Single uncropped shot, one
      subject only, no split screen, no diptych, no montage, no inset, no second
      image, no wide shot, no extra figures. No text, no caption, no title, no
      writing, no labels, no watermark. Fully clothed, modest outfit, correct
      human anatomy, natural hands and fingers.

  - name: Don Alejandro Vega
    role: Hacendado and Power Broker
    type: npc_supporting
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult Mexican man in
      his sixties, warm brown skin, neatly trimmed white goatee and white hair, a
      composed assessing expression. Wearing a dark charro jacket fastened with
      rows of ornate silver buttons over a crisp white shirt, a wide-brimmed
      dark felt sombrero, a silk cravat at the throat. Cool steady dark eyes,
      faint knowing set to the mouth, immaculate despite the heat.
    culture_aesthetic: >-
      Mexican aristocracy — the silver-buttoned charro jacket is a deliberate
      statement of status, every element pressed and exact.
    element_visual: >-
      Dark charro jacket with rows of ornate silver buttons, crisp white shirt,
      silk cravat, wide-brimmed dark felt sombrero, a leather riding crop held
      across the chest. Shot on a long 135mm telephoto portrait lens, compressed
      perspective, shallow depth of field, the face sharp and filling the frame,
      a soft out-of-focus dim cantina interior behind him with thick adobe walls
      in shadow and a warm amber lantern glow thrown far out of focus. Single
      uncropped shot, one subject only, no split screen, no diptych, no montage,
      no inset, no second image, no wide shot, no extra figures. No text, no
      caption, no title, no writing, no labels, no watermark. Fully clothed,
      modest outfit, correct human anatomy, natural hands and fingers.

  - name: Solomon Cole
    role: Leader of The Contractors
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult man in his
      late forties, weathered tanned skin, lean angular clean-shaven face,
      flat thin lips, close-cropped grey-streaked dark hair, pale grey level
      eyes. Wearing a
      long dark dust-grey duster coat over a black shirt buttoned to the
      throat, a flat-brimmed black hat low on the brow, plain dark leather
      gloves. Still even expression, the face held perfectly composed and
      unmoving.
    culture_aesthetic: >-
      Sangre Anglo hired gun — every garment dark, plain, and exact, nothing
      ornamental, the clothing of a man who keeps a ledger and never misses
      an entry.
    element_visual: >-
      Long dark dust-grey duster, black shirt buttoned high, flat-brimmed black
      hat low on the brow, plain dark leather gloves, a holstered revolver grip
      just visible at the shoulder. Shot on a long 135mm telephoto portrait lens,
      compressed perspective, shallow depth of field, the face sharp and filling
      the frame, a soft out-of-focus flat bare clearing of packed dirt behind
      him at sunset with a hard low orange sun and long shadows thrown far out of
      focus. Single uncropped shot, one subject only, no split screen, no
      diptych, no montage, no inset, no second image, no wide shot, no extra
      figures. No text, no caption, no title, no writing, no labels, no
      watermark. Fully clothed, modest outfit, correct human anatomy, natural
      hands and fingers.

  - name: Capitán Emilio Fierro
    role: Leader of Los Cuervos
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult Mexican man in
      his thirties, warm brown skin, strong jaw, a thick dark moustache, dark
      wavy hair to the collar, dark bright eyes. Wearing a dust-worn
      open-collared shirt under a
      short embroidered charro jacket gone faded, crossed leather bandolier
      belts of brass cartridges over the chest, a wide straw sombrero pushed
      back off the forehead. Open easy half-smile, chin lifted, an unguarded
      confident expression.
    culture_aesthetic: >-
      Sangre Frontera revolutionary — the faded charro jacket and the bandoliers
      together, ranchero pride worn over a fighter's gear, the crow rider who
      carries an inherited name.
    element_visual: >-
      Faded short charro jacket over an open-collared shirt, crossed brass
      bandolier belts across the chest, wide straw sombrero pushed back, a small
      crow feather tucked into the hatband. Shot on a long 135mm telephoto
      portrait lens, compressed perspective, shallow depth of field, the face
      sharp and filling the frame, a soft out-of-focus flat red sandstone mesa
      summit behind him with a ring of blackened signal-fire stones and a wide
      pale sky thrown far out of focus. Single uncropped shot, one subject only,
      no split screen, no diptych, no montage, no inset, no second image, no wide
      shot, no extra figures. No text, no caption, no title, no writing, no
      labels, no watermark. Fully clothed, modest outfit, correct human anatomy,
      natural hands and fingers.
