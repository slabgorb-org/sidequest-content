  - name: Captain Abel Stone
    role: Leader of The Sangre Rangers
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult man in his
      forties, deeply sun-blasted tanned skin, permanent squint lines fanning
      from narrowed pale eyes, a long drooping grey moustache, lean weathered
      face. Wearing a sweat-stained dust-colored wide-brimmed hat, a faded grey
      collarless shirt and a worn leather vest, a tarnished metal star badge
      pinned over the left breast. Hard tired expression, jaw set.
    culture_aesthetic: >-
      Sangre Anglo lawman — the star badge is the whole identity, everything
      else worn to the point of asceticism, nothing decorative.
    element_visual: >-
      Sweat-stained dust-colored wide-brimmed hat, worn leather vest, tarnished
