  # ═══════════════════════════════════════════════════════════════
  # PLAYER PICKER PORTRAITS (18)
  # Pre-generated sample faces for the chargen portrait chooser. Each
  # entry carries a `backdrop_poi` naming a real rendered POI slug from
  # this world's assets/poi/ set (confirmed in r2_manifest.json); the
  # daemon's portrait-in-location preset plants the subject inside that
  # POI behind a long telephoto lens (montage guard).
  #
  # DISCIPLINE: `appearance` is PHYSICAL face / upper-body ONLY — no
  # background prose (the backdrop is composed from `backdrop_poi`), no
  # wide-scene description (it triggers the Z-Image split montage).
  # Period dress is named only at the collar. `culture` = culture file
  # stem; `archetype` = a real world archetype (archetypes.yaml) or a
  # real class display_name (pack classes.yaml).
  #
  # Allocation: 18 entries, 9M / 9F, 6 per culture, all three cultures
  # covered, varied archetypes, distinct faces.
  # ═══════════════════════════════════════════════════════════════

  # ── Picker · Sangre Anglo ──

  - id: picker_sangre_anglo_marshal_m01
    name: picker sangre anglo marshal m01
    role: Marshal
    type: player_picker
    culture: sangre_anglo
    archetype: Marshal
    sex: male
    backdrop_poi: the_courthouse
    appearance: >-
      Man, fifties. Long sun-cured Anglo face seamed by glare, a heavy
      iron-grey moustache over a flat hard mouth, pale washed-out grey eyes
      under a low brow. Close-cropped greying hair, a faded neckerchief
      knotted at the open collar of a worn collarless shirt. The settled,
      unhurried stare of a man used to being obeyed.

  - id: picker_sangre_anglo_gunslinger_f01
    name: picker sangre anglo gunslinger f01
    role: Gunslinger
    type: player_picker
    culture: sangre_anglo
    archetype: Gunslinger
    sex: female
    backdrop_poi: the_three_way_standoff_ground
    appearance: >-
      Woman, early thirties. Lean wind-burned face, sharp cheekbones, cool
      flint-grey eyes that hold steady and do not blink first. Dirty-blonde
      hair pulled back hard and tied, a thin white scar nicking one eyebrow.
      A man's dust-grey shirt buttoned to the throat under a worn leather
      vest collar. Calm, ready stillness.

  - id: picker_sangre_anglo_outlaw_m01
    name: picker sangre anglo outlaw m01
    role: Outlaw
    type: player_picker
    culture: sangre_anglo
    archetype: Outlaw
    sex: male
    backdrop_poi: the_canyon_ambush_site
    appearance: >-
      Man, late twenties. Gaunt sunburned face, a few days of patchy reddish
      stubble, restless pale-blue eyes set close, a broken-and-healed nose.
      Lank sandy hair shoved under the brim of a battered low hat, a dark
      bandana pulled down loose at the open collar. A wary, cornered-animal
      set to the jaw.

  - id: picker_sangre_anglo_company_man_m01
    name: picker sangre anglo company man m01
    role: The Company Man
    type: player_picker
    culture: sangre_anglo
    archetype: The Company Man
    sex: male
    backdrop_poi: the_railhead_at_sangre_del_paso
    appearance: >-
      Man, forties. Soft pale face sunburned pink across the nose, smooth
      clean-shaven cheeks, thin precise lips set in a closing-door courtesy.
      Light-brown hair combed flat and oiled, fine wire-rimmed spectacles. A
      high starched white collar gone limp with sweat under a dark silk
      waistcoat. The measured, assessing eyes of eastern money.

  - id: picker_sangre_anglo_gambler_f01
    name: picker sangre anglo gambler f01
    role: Gambler
    type: player_picker
    culture: sangre_anglo
    archetype: Gambler
    sex: female
    backdrop_poi: rositas_cantina
    appearance: >-
      Woman, thirties. Pale composed face, a deliberate half-smile that gives
      nothing away, level hazel eyes practiced at reading tells. Auburn hair
      pinned up with a few loose strands, a small jet earring. A dark
      brocade dress collar buttoned high at the throat, a thin black ribbon
      at the neck. Unhurried, watchful poise.

  - id: picker_sangre_anglo_bounty_hunter_f01
    name: picker sangre anglo bounty hunter f01
    role: Bounty Hunter
    type: player_picker
    culture: sangre_anglo
    archetype: Bounty Hunter
    sex: female
    backdrop_poi: ghost_ridge_at_dawn
    appearance: >-
      Woman, late thirties. Hard weather-darkened face, deep squint-lines,
      a thin grim mouth, brown eyes that measure a man like a warrant
      description. Dark hair cropped short and uneven under a flat-brimmed
      dust-colored hat, a faded trail-worn coat collar turned up at the neck.
      Patient, unforgiving stillness.

  # ── Picker · Sangre Frontera ──

  - id: picker_sangre_frontera_ranchera_f01
    name: picker sangre frontera ranchera f01
    role: The Ranchera
    type: player_picker
    culture: sangre_frontera
    archetype: The Ranchera
    sex: female
    backdrop_poi: reyes_ranch
    appearance: >-
      Mexican woman, forties. Deep brown sun-weathered face, strong high
      cheekbones, fine lines fanning from steady dark eyes, a firm
      unsmiling mouth. Black hair shot with grey, parted center and braided
      back. A plain dark riding dress of heavy practical cloth buttoned to a
      modest high neck, a worn dark-wood rosary at the collar.

  - id: picker_sangre_frontera_outlaw_m01
    name: picker sangre frontera outlaw m01
    role: Outlaw
    type: player_picker
    culture: sangre_frontera
    archetype: Outlaw
    sex: male
    backdrop_poi: rojo_mesa_signal_fire
    appearance: >-
      Mexican man, thirties. Warm brown face, a thick dark moustache over a
      crooked half-grin, bright dark eyes lit with mischief and threat both.
      Black wavy hair to the collar under a wide straw sombrero pushed back,
      a faded open-collared shirt under crossed brass bandolier belts at the
      chest. Loose, dangerous ease.

  - id: picker_sangre_frontera_gambler_m01
    name: picker sangre frontera gambler m01
    role: Gambler
    type: player_picker
    culture: sangre_frontera
    archetype: Gambler
    sex: male
    backdrop_poi: rositas_cantina
    appearance: >-
      Mexican man, late twenties. Smooth warm-brown face, a thin trimmed
      moustache, quick dark assessing eyes, an easy gambler's smile held
      just short of his teeth. Black hair slicked back neat, a single silver
      stud. A dark embroidered charro jacket collar over a crisp white
      shirt, a silk cravat at the throat. Unbothered, reading the room.

  - id: picker_sangre_frontera_drifter_f01
    name: picker sangre frontera drifter f01
    role: Drifter
    type: player_picker
    culture: sangre_frontera
    archetype: Drifter
    sex: female
    backdrop_poi: the_sangre_river_ford
    appearance: >-
      Mexican woman, late twenties. Lean brown trail-dusted face, watchful
      dark eyes, a guarded set to the mouth, a faint old scar along the jaw.
      Black hair in a single long braid pulled forward over one shoulder, a
      sweat-faded kerchief tied at the open collar of a man's worn shirt. The
      flat, ready calm of someone always half-gone.

  - id: picker_sangre_frontera_gunslinger_m01
    name: picker sangre frontera gunslinger m01
    role: Gunslinger
    type: player_picker
    culture: sangre_frontera
    archetype: Gunslinger
    sex: male
    backdrop_poi: smugglers_crossing
    appearance: >-
      Mexican man, early thirties. Hard handsome brown face, a clean strong
      jaw, dark steady eyes that track without moving, a thin scar through
      one brow. Black hair to the collar under a dark felt hat low on the
      brow, a dust-worn dark shirt buttoned high, a thin leather cord at the
      throat. Cool, coiled, unblinking.

  - id: picker_sangre_frontera_cantinera_f01
    name: picker sangre frontera cantinera f01
    role: The Cantinera
    type: player_picker
    culture: sangre_frontera
    archetype: The Cantinera
    sex: female
    backdrop_poi: rositas_cantina
    appearance: >-
      Mexican woman, fifties. Broad warm-brown face, knowing dark eyes that
      have judged every man in the room, a wry unflappable set to the full
      mouth. Black hair coiled up with a tortoiseshell comb, silver hoops at
      the ears. A dark blouse with an embroidered collar fastened at the
      throat, a fringed shawl drawn over the shoulders. Settled authority.

  # ── Picker · Ndé ──

  - id: picker_nde_apache_scout_m01
    name: picker nde apache scout m01
    role: The Apache Scout
    type: player_picker
    culture: ndé
    archetype: The Apache Scout
    sex: male
    backdrop_poi: the_sierra_perdida_mine_entrance
    appearance: >-
      Ndé Apache man, fifties. Broad weather-dark face, high flat
      cheekbones, deep-set still eyes that read the country before they read
      a face. Long black hair greying at the temples, parted center and
      bound back with a folded cloth band at the brow. A plain trade-cloth
      shirt collar, a single strand of shell beads at the throat. Patient,
      private stillness.

  - id: picker_nde_apache_scout_f01
    name: picker nde apache scout f01
    role: The Apache Scout
    type: player_picker
    culture: ndé
    archetype: The Apache Scout
    sex: female
    backdrop_poi: ghost_ridge_at_dawn
    appearance: >-
      Ndé Apache woman, thirties. Brown high-boned face, alert dark eyes set
      wide, a calm closed mouth, a fine straight nose. Black hair parted
      center and falling loose past the shoulders, a beaded leather band at
      the brow. A trade-cloth dress collar, strung trade-bead and shell
      necklaces layered at the throat. Quiet, measuring watchfulness.

  - id: picker_nde_bounty_hunter_m01
    name: picker nde bounty hunter m01
    role: Bounty Hunter
    type: player_picker
    culture: ndé
    archetype: Bounty Hunter
    sex: male
    backdrop_poi: the_canyon_ambush_site
    appearance: >-
      Ndé Apache man, forties. Lean hard-cut brown face, a long old scar
      across one cheek, narrow unblinking eyes, a flat unreadable mouth.
      Black hair to the shoulders tied back with a dark cloth band, a faded
      Anglo trail-coat collar turned up over a trade-cloth shirt. The settled
      patience of a man who herds his quarry, never chases it.

  - id: picker_nde_drifter_m01
    name: picker nde drifter m01
    role: Drifter
    type: player_picker
    culture: ndé
    archetype: Drifter
    sex: male
    backdrop_poi: the_acequia
    appearance: >-
      Ndé Apache man, late twenties. Smooth brown face, sharp jaw, dark
      restless eyes that note every exit, a guarded half-set to the mouth.
      Black hair worn loose and shoved under a battered low-crowned hat, a
      faded kerchief at the open collar of a dust-worn shirt. The wary ease
      of someone never staying long.

  - id: picker_nde_drifter_f01
    name: picker nde drifter f01
    role: Drifter
    type: player_picker
    culture: ndé
    archetype: Drifter
    sex: female
    backdrop_poi: the_sangre_river_ford
    appearance: >-
      Ndé Apache woman, late twenties. Brown trail-worn face, high
      cheekbones, steady dark eyes, a self-contained set to the mouth. Black
      hair in two loose braids wrapped in faded cloth, a thin beaded cord at
      the brow. A plain trade-cloth shirt collar under a worn blanket-cloth
      coat. The flat composure of long solitary travel.

  - id: picker_nde_bounty_hunter_f01
    name: picker nde bounty hunter f01
    role: Bounty Hunter
    type: player_picker
    culture: ndé
    archetype: Bounty Hunter
    sex: female
    backdrop_poi: rojo_mesa_signal_fire
    appearance: >-
      Ndé Apache woman, forties. Hard brown sun-cured face, deep squint
      lines, dark eyes that measure and do not warm, a grim level mouth.
      Black hair greying at the part, bound back tight under a flat-brimmed
      dust-colored hat, a beaded band at the brow. A trail-worn coat collar
      turned up over a trade-cloth shirt. Unforgiving patience.

  - name: Capitán Emilio Fierro
    role: Leader of Los Cuervos
    type: npc_major
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult Mexican man in
      his thirties, warm brown skin, strong jaw, a thick dark moustache, dark
      wavy hair to the collar, dark bright eyes. Wearing a dust-worn
      open-collared shirt under a
      short embroidered charro jacket gone faded, crossed leather bandolier
      belts of brass cartridges over the chest, a wide straw sombrero pushed
      back off the forehead. Open easy half-smile, chin lifted, an unguarded
      confident expression.
    culture_aesthetic: >-
      Sangre Frontera revolutionary — the faded charro jacket and the bandoliers
      together, ranchero pride worn over a fighter's gear, the crow rider who
      carries an inherited name.
