# Character portraits for Dust and Lead
# Visual descriptions for Flux portrait generation
# Leone cinematography — harsh midday light, desaturated earth tones,
# extreme close-ups, sweat and dust, Morricone intensity

characters:
  - name: Elias Croft
    role: Railroad Company Representative
    type: npc_major
    appearance: >-
      A man in his forties in a suit too expensive for the territory,
      already wilting in the heat. Pale skin burning pink at the collar
      and wrists, thinning hair slicked back with pomade that's losing
      the fight against dust. Clean-shaven, narrow face, spectacles that
      he polishes compulsively. The suit is grey wool, the vest is silk,
      the watch chain is gold. He sweats through all of it. Carries a
      leather portfolio of legal documents and a derringer he doesn't
      know how to use.
    culture_aesthetic: >-
      Eastern money — the suit, the watch, the spectacles all announce
      someone who represents capital, not territory. The dust on his
      shoes is an insult to both.
    element_visual: >-
      Wilting grey suit, gold watch chain, leather portfolio, spectacles
      catching desert light, the railroad survey stakes visible behind him.

  - name: Juana Reyes
    role: Rancher and Community Leader
    type: npc_major
    appearance: >-
      A Mexican woman in her fifties with sun-darkened skin and hands
      that have worked cattle, land, and men in equal measure. Silver
      hair braided down her back, a face carved by wind and decision.
      Wears a practical riding dress, leather boots, and a holstered
      revolver that she treats like a tool — useful, maintained, not
      a toy. A rosary around her neck, well-worn. The ranch behind her
      has been in her family for four generations and it shows in the
      way she stands on it.
    culture_aesthetic: >-
      Mexican ranchero — the dress is practical, the boots are working
      boots, the revolver is not decorative. The rosary is the only
      concession to anything beyond function.
    element_visual: >-
      Silver braid, working holster, rosary, leather boots in stirrups,
      the ranch house and corrals behind her under white sun.

  - name: Captain Abel Hatch
    role: Texas Ranger
    type: npc_major
    appearance: >-
      An Anglo man in his forties with a sun-blasted face and eyes
      that have been squinting for so long they might not open all the
      way anymore. Lean as a fence post, wearing a sweat-stained hat,
      a badge that's been through more than most men, and a gun belt
      that sits on his hips like it grew there. Dust-colored clothing
      that was white once. A repeating rifle in the saddle scabbard.
      Moustache that droops like it's tired of everything too.
    culture_aesthetic: >-
      Texas Ranger — the badge is the whole identity. Everything else is
      practical to the point of asceticism. The rifle is better maintained
      than the man.
    element_visual: >-
      Star badge, drooping moustache, squint lines, repeating rifle in
      scabbard, the Sangre River behind him, the border he can't cross.

  - name: Don Alejandro Vega
    role: Hacendado and Power Broker
    type: npc_supporting
    appearance: >-
      A Mexican man in his sixties, immaculate in a silver-buttoned
      charro jacket and pressed trousers despite the heat. White hair
      beneath a wide-brimmed hat, a trimmed goatee, hands that haven't
      done physical labor in decades but still carry a riding crop.
      Dark eyes that assess everyone's net worth on sight. His horse
      is the most beautiful thing in any frame that contains it.
    culture_aesthetic: >-
      Mexican aristocracy — the charro jacket is a statement of status,
      the horse is a statement of wealth, the riding crop is a statement
      of authority. Everything is deliberate.
    element_visual: >-
      Silver-buttoned charro jacket, riding crop, wide-brimmed hat,
      the best horse in the territory, hacienda walls behind him.
