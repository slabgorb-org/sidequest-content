  - name: Don Alejandro Vega
    role: Hacendado and Power Broker
    type: npc_supporting
    appearance: >-
      cinematic western film still, desaturated dusty earth tones, Technicolor
      film grain, extreme close-up chest-up portrait of an adult Mexican man in
      his sixties, warm brown skin, neatly trimmed white goatee and white hair, a
