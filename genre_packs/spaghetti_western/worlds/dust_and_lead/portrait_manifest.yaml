      Faded short charro jacket over an open-collared shirt, crossed brass
      bandolier belts across the chest, wide straw sombrero pushed back, a small
      crow feather tucked into the hatband. Shot on a long 135mm telephoto
      portrait lens, compressed perspective, shallow depth of field, the face
      sharp and filling the frame, a soft out-of-focus flat red sandstone mesa
      summit behind him with a ring of blackened signal-fire stones and a wide
      pale sky thrown far out of focus. Single uncropped shot, one subject only,
      no split screen, no diptych, no montage, no inset, no second image, no wide
      shot, no extra figures. No text, no caption, no title, no writing, no
      labels, no watermark. Fully clothed, modest outfit, correct human anatomy,
