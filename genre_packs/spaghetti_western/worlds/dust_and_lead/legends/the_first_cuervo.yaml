id: the_first_cuervo
name: The First Cuervo
era: '1870'
description: When the Rangers hanged three Mexican cattle hands on suspicion of rustling
  — no trial, no evidence, just rope and a cottonwood tree — a young vaquero named
  Emilio Vargas rode south across the border and swore he would take back from the
  Anglos everything they had taken from his people. He painted a crow on his saddle.
  Within a year, thirty men rode under that sign. Vargas is dead now — killed in a
  raid in '75 — but Los Cuervos survived him. His nephew leads them. The crow still
  flies.
