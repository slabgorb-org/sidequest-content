id: the_ghost_ridge_massacre
name: The Ghost Ridge Massacre
era: '1862'
description: During the war between the states, a Confederate patrol rode into Viejo
  Cañón hunting deserters. They found an Apache camp instead. What happened next depends
  on who tells the story. The Anglos say the patrol was ambushed. The Apache say the
  soldiers opened fire on women and children. The canyon walls still have bullet scars.
  The Apache call it Ghost Ridge and they have not forgotten.
