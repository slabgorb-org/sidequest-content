id: the_crossing
name: The Crossing
era: '1848'
description: Thirty years ago, a treaty moved the border south. Families who had lived
  on their land for generations woke up in a different country without moving a step.
  The Reyes family, the Vargases, the Delgados — their deeds were Mexican. Their land
  was suddenly American. Some kept their holdings. Others lost everything to Anglo
  lawyers who knew the new system better than the old families ever would. The wound
  never healed. It just stopped bleeding where anyone could see.
