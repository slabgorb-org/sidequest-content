id: the_buffalo_soldiers_arrive
name: The Buffalo Soldiers Arrive
era: '1875'
description: The 10th Cavalry rode into the Sangre Territory with orders to pacify
  the Apache and secure the border. Black soldiers in a territory that did not want
  them, fighting a people they had no quarrel with, on behalf of a government that
  barely acknowledged their service. They built Fort Resolución on the eastern edge
  of Viejo Cañón and have held it since, earning the grudging respect of everyone
  except the people they are ordered to hunt.
