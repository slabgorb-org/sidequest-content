id: the_salt_war
name: The Salt War
era: '1877'
description: The salt flats east of Sangre del Paso had been common ground for decades
  — anyone could harvest salt, Mexican or Anglo. Then an Anglo politician filed a
  claim and declared the salt his private property. The Mexican community erupted.
  Two men died. The Rangers came. More men died. The Army came. The salt flats are
  fenced now. The politician is rich. The families who depended on that salt buy it
  from his company at prices they can barely afford. Marshal Dent was a deputy then.
  He stood with the claimant. The Families remember.
