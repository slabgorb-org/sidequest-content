id: the_silver_strike
name: The Silver Strike
era: '1874'
description: 'A prospector named Cornelius Harwick found silver in the Sierra Perdida
  — a vein thick enough to see from the mine entrance. He filed his claim in Sangre
  del Paso and was dead within a month. Officially: heatstroke. The claim passed to
  his business partner, who sold it to the Consolidated Mining & Rail Company for
  a price nobody in town believes was honest. The mine has been producing steadily
  since, staffed by men who have few other options and guarded by men who answer to
  nobody local.'
