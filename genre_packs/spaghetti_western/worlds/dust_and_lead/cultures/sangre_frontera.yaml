name: Sangre Frontera
summary: Mexican families rooted in the territory for generations
description: Mexican families rooted in the territory for generations — mission names,
  rancho identity
slots:
  given_name:
    names_file: frontera_given.txt
  family_name:
    names_file: frontera_surnames.txt
  place_noun:
    word_list:
    - rancho
    - misión
    - vado
    - ojo
    - cañada
    - acequia
    - camposanto
    - jacal
    - presidio
    - remuda
  adjective:
    word_list:
    - sangre
    - perdido
    - quemado
    - viejo
    - bravo
    - salado
    - chico
    - largo
    - prieto
    - llorón
person_patterns:
- '{given_name} {family_name}'
- '{given_name} de la {family_name}'
- Don {given_name} {family_name}
- Doña {given_name} {family_name}
place_patterns:
- Rancho {family_name}
- Misión de {adjective} {place_noun}
- '{place_noun} del {adjective}'
