# Dust and Lead — world bestiary (sangre_territory_hazards)
#
# World-tier override on the spaghetti_western pack. These are NOT monsters —
# this is a human-drama western. The roster is the mundane fauna of the
# Texas-Mexico desert frontier circa 1878: snakes, predators, ornery stock,
# vermin. Encountergen samples these for environmental hazards; narrative
# layers (visual prompt) compose at generation time. Stats follow the SRD
# generic form used across SideQuest bestiaries — level == HD, hp == average,
# ascending AC, morale on the 2d12 ladder. Animals are level 1-2.
#
# World tier (ADR-120): desert-frontier fauna belongs here, not in the pack.
# Sources: Crotalus atrox (western diamondback) range/behavior; Sonoran/
# Chihuahuan desert mammalia (coyote, javelina, cougar); frontier cattle and
# remuda hazards. No fantasy elements — the genre denies them.
entries:
  - id: diamondback_rattler
    name: Western Diamondback
    level: 1
    hp: 2
    armor_class: 13
    attack_bonus: 1
    damage: "1d3"
    move: "15 ft."
    morale: 6
    skill: 0
    save: 15
    role: venomous desert snake
    tags: [beast, vermin, venomous]
    abilities:
      - "Venom — a struck target saves or sickens; untreated, the bite festers and kills slowly"
      - "Rattles a warning before it strikes — alert prey can give it room"
    description: >-
      Five feet of patterned muscle coiled in the shade of a mesquite or
      under a sun-warmed rock, the dry buzz of its tail the only mercy it
      offers. It wants nothing to do with a man until a boot lands too close.
  - id: coyote_pack
    name: Coyote Pack
    level: 1
    hp: 4
    armor_class: 13
    attack_bonus: 1
    damage: "1d4"
    move: "40 ft."
    morale: 6
    skill: 1
    save: 15
    role: scavenging desert canids
    tags: [beast, pack]
    abilities:
      - "Pack tactics — bold in numbers around a kill or a camp, scattered alone"
    description: >-
      Lean grey-brown shadows that work the edge of the firelight, yipping
      the night into pieces. Singly they slink off; a hungry pack will pull
      down a hobbled horse or worry a wounded man left in the open.
  - id: feral_javelina
    name: Feral Javelina
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "30 ft."
    morale: 7
    skill: 0
    save: 15
    role: bristling desert peccary
    tags: [beast]
    abilities:
      - "Charges in a squealing herd when cornered or when its young are near"
    description: >-
      A musky, tusked pig of the brush country, near-sighted and bad-
      tempered, traveling in rooting bands through the prickly pear. Step
      between a sow and her shoats and the whole herd comes at the ankles.
  - id: longhorn_stampede
    name: Spooked Longhorn
    level: 2
    hp: 9
    armor_class: 12
    attack_bonus: 3
    damage: "1d8"
    move: "40 ft."
    morale: 5
    skill: 0
    save: 14
    role: half-wild range cattle
    tags: [beast, livestock]
    abilities:
      - "Stampede — a panicked herd tramples anything afoot in its path for heavy damage"
      - "Six-foot horn spread — a single goaded steer gores and tosses"
    description: >-
      Rangy, slab-sided, and six feet of horn from tip to tip, the half-wild
      longhorn tolerates a rider until thunder or a gunshot turns the herd
      into a brown river of horn and hoof that flattens fence, camp, and man.
  - id: mountain_lion
    name: Mountain Lion
    level: 2
    hp: 9
    armor_class: 14
    attack_bonus: 3
    damage: "1d8"
    move: "40 ft."
    morale: 7
    skill: 1
    save: 14
    role: solitary ambush cat
    tags: [beast, predator]
    abilities:
      - "Ambush — drops from a ledge or brush; the first strike lands before it is seen"
    description: >-
      A tawny ghost of the canyon rims, mostly content with deer and
      jackrabbit, but a starved or cornered cat will take a calf, a dog, or
      a man asleep apart from the fire — and is gone before the scream ends.
