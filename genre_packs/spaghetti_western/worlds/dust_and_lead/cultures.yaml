# Dust and Lead — World-Level Culture Extensions
# Extends genre-level Frontera/Gringo/Nativo cultures with
# world-specific place nouns and adjectives grounded in the
# Sangre Territory geography.

- name: Frontera
  extends: Frontera
  place_noun:
    word_list: [arroyo, mesa, cañón, cruz, fuente, hacienda, llano, paso, pozo, puente, sierra, valle, misión, vado, loma]
  adjective:
    word_list: [viejo, rojo, seco, muerto, negro, blanco, santo, perdido, quieto, hondo, sangre, hueso, polvo, bravo]

- name: Gringo
  extends: Gringo
  place_noun:
    word_list: [gulch, ridge, creek, flats, springs, crossing, bend, bluff, fork, hollow, pass, butte, station, claim, camp]
  adjective:
    word_list: [dead, dry, red, broken, burnt, bitter, lost, rattlesnake, devil, coyote, copper, bone, buzzard, silver, alkali]

- name: Nativo
  extends: Nativo
  place_noun:
    word_list: [canyon, mesa, spring, wash, butte, bluff, cave, ledge, basin, peak, ridge, shadow, wind, water]
  adjective:
    word_list: [singing, sleeping, red, black, white, thunder, eagle, coyote, ancient, hidden, ghost, bone, iron, still]
