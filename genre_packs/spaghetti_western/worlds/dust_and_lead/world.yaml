cover_poi: sangre_del_paso_main_street
name: Dust and Lead
slug: dust_and_lead
genre: spaghetti_western
description: >-
  The Sangre Territory, 1878. A sun-scorched stretch of the Mexican-American
  border where the railroad is coming, silver has been found in the mountains,
  and every faction — from cross-border rustlers to railroad magnates to the
  last Apache war bands — is converging on the same hundred miles of desert.
  Mexican families who predate the border, Anglo settlers chasing fortune,
  Buffalo Soldiers patrolling canyons they didn't choose, and a drifter nobody
  can explain. The territory has room for all of them. It has patience for none.

era: 1878
setting: "Sangre Territory — Texas-Mexico borderlands"
