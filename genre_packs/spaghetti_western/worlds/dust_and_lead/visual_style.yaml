# Dust and Lead — World-Specific Visual Style
# Overrides genre defaults for the Sangre Territory setting.
# Positive suffix is era + biome + film-stock only — no POI-specific objects.
# Specific locations (Sangre River, mission walls, ranch buildings) belong in
# per-POI visual_prompt fields, not in this world-level suffix.

positive_suffix: >-
  cinematic western film still, harsh Chihuahuan desert midday sun,
  red rock canyons and white alkali flats, the Sangre River cutting
  through dusty lowland, adobe mission walls and wooden ranch buildings,
  sweat on leather, extreme close-up Leone framing, 1860s frontier
  clothing and equipment, Technicolor film grain, Mexican and Anglo
  frontier architecture side by side, the railroad's iron reaching west.
  Fake weathered hand-painted storefront signage, wanted posters, and
  saloon lettering are allowed as in-world texture. No film sprocket
  border, no camera info overlay, no date stamp, no subtitle, no
  production credit, no watermark, no frame.

# Z-Image Turbo ignores negative_prompt at guidance_scale=0. All constraints
# live in positive_suffix. See PROMPTING_Z_IMAGE.md.
negative_prompt: ""

preferred_model: dev

base_seed: 1966

loras:
  add:
    - name: sw_leone_landscape
      file: spaghetti_western/landscape.safetensors
      scale: 0.65
      applies_to: [landscape]

visual_tag_overrides:
  town:
    >-
    A sun-bleached frontier town of timber false-fronts along a wide dirt
    main street, hitching posts and a single horse in thin shade, heat
    shimmer off packed earth under hard overhead sun.
  ranch:
    >-
    An adobe ranch house with a covered porch and weathered corrals, a
    dry fountain in a dusty courtyard, cottonwoods along an irrigation
    ditch and blue mountains on the horizon, amber late-afternoon sun.
  cantina:
    >-
    The cool dim interior of a Mexican cantina, thick adobe walls and
    dried chile strings from ceiling beams, candles in tin holders and
    papel picado banners over a scarred wooden bar, warm lantern glow.
  river:
    >-
    A wide shallow muddy-brown river at a ford, pale cottonwoods peeling
    in the heat on both banks, a stretched rope bank to bank and hoof
    marks churning the mud, midday sun.
  canyon:
    >-
    A red sandstone canyon with sheer three-hundred-foot walls closing
    to a narrow passage, a bright slash of sky overhead, boulders on the
    floor and a thin stream at the bottom, deep shade and hard contrast.
  desert:
    >-
    Chihuahuan desert to the horizon, creosote and mesquite on cracked
    earth, white alkali patches and distant purple mountains, a wagon
    track dissolving into dust, hard overhead sun.
  railroad:
    >-
    Fresh-laid steel rail on a gravel bed cutting through open desert,
    wooden ties stretching to the vanishing point, survey stakes with
    red ribbons along the grade, a lone water tower, hard afternoon
    light.
  mission:
    >-
    A Spanish colonial mission of crumbling adobe, a single-bell tower
    and a graveyard of weathered wooden crosses, prickly pear growing
    from the wall base, amber late-day sun on the plastered facade.
