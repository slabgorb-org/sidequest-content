pregame_timeline:
- year: 1845
  event: >-
    The Famine begins in Ireland. Over the next decade the boats come — Munster
    and Connacht emptied into Liverpool and onto the packet ships, and onto the
    Sixth Ward. Every adult who sails has been keened over first at an American
    wake, mourned as good as dead by the people they leave, so that the living
    walk ashore at New York as their own ghosts. By 1855 the Irish are better
    than a third of the city's voters.
- year: 1849
  event: >-
    Cholera takes the ward — better than five thousand dead in the city that
    summer, the Sixth Ward the epicenter, the outbreak traced to a lightless
    Baxter Street cellar with foul water pooling at the door. The dead go into
    hurried mass pits, unwaked, unkeened, no priest to spare. The Irish hold
    that the unconsecrated dead are restless and dangerous, and that the ground
    of the ward has been wrong ever since.
- year: 1852
  event: >-
    December. The Ladies' Home Missionary Society buys the Old Brewery — the
    rookery where, the legend ran, a murder was done every night for fifteen
    years — and tears it down stone from stone. On its footprint they raise the
    Five Points Mission, and across the way the House of Industry, with its
    sewing shop and school and subsidized rooms. The Old Brewery survives only
    as a tale told to frighten children. The reform survives as a daily fact.
- year: 1854
  event: >-
    Cholera again — better than two thousand five hundred dead, the ward again
    the worst of it, more mass pits, more unwaked dead under the fill. The same
    year the city renames the corners to scrub the stigma: Anthony to Worth,
    Orange to Baxter, Cross to Park. The names change. The mud does not.
- year: 1855
  event: >-
    February. William Poole, the Bowery's nativist champion, takes pistol-balls
    from Lew Baker and Jim Turner at Stanwix Hall on Broadway after a confrontation
    with the prizefighter John Morrissey. He dies on the eighth of March; "Goodbye
    boys, I die a true American," they say he said. Thousands follow him to
    Green-Wood. His killers will stand three trials and walk on three hung juries.
    A brutal man becomes a covenant martyr, and the Know-Nothings have their saint.
  entities:
  - name: William Poole
    proposed: false
  - name: Stanwix Hall
    proposed: false
- year: 1855
  event: >-
    August. Castle Garden opens at the Battery as the emigrant landing depot,
    fenced off to shield the bewildered new arrivals from the runners who fleece
    them. Inside the fence: honest exchange, true fares, a doctor. Outside it the
    runners work the rail — many of them Tammany shoulder-hitters, the same men
    who guard the boxes on election day, selling a fast naturalization with the
    vote already bought.
  entities:
  - name: Castle Garden
    proposed: false
- year: 1856
  event: >-
    Autumn. A year after Poole's burial. Rynders holds the Sixth Ward from the
    Empire Club and the green-groceries of Paradise Square, with young Morrissey
    ascendant beside him. The Bowery papers print "Dead Rabbits" as if it were a
    regiment; the Baxter Street men reclaim the dead hare on a pike and deny the
    gang exists. Buchanan is elected with Rynders's sluggers behind the New York
    vote. Uptown, Albany has begun to talk of taking the police away from the
    Mayor. The player arrives at the edge of the fuse. The campaign opens.
- year: 1857
  event: >-
    Spring and summer. Albany's Metropolitan Police Act abolishes Mayor Wood's
    Municipal force and raises its own; Wood keeps the Municipals anyway, and two
    police departments operate at once. In June it comes to blows on the City Hall
    steps and the militia arrests the Mayor, who is bailed within the hour. In
    July, People v. Draper upholds Albany and eventually breaks Wood. And on the
    Fourth and Fifth of July, with the law too divided to muster, the ward burns —
    the Dead Rabbits Riot, eight hundred to a thousand combatants, barricades on
    Bayard Street, Rynders stoned mid-mediation, the 8th and 71st Regiments at
    last. Eight dead. This is the fuse the campaign is built to reach.
