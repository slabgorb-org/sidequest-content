- id: veteran
  label: "The Fourth of July — The Ward Burns in the Gap"
  session_range:
  - 25
  - 99
  location: paradise_square
  time_of_day: night
  atmosphere: >-
    July 4-5, 1857. It starts as a raid — a Roach-and-Dead-Rabbits coalition on
    a Bowery clubhouse, repelled back to Paradise Square — and then it does not
    stop. The fight spreads across Pearl and Chatham and Park Row, eight hundred
    and a thousand men with paving stones and brickbats and axes, pushcart
    barricades thrown across Bayard Street. The police take no action because
    the police are two forces still fighting each other and neither can muster.
    Rynders himself comes to mediate near evening, the boss who owns the ward,
    and the ward stones him and rejects him — the limit of the machine, when its
    own muscle slips the leash. The militia comes at last, the 8th and the 71st
    Regiments behind two police detachments, and puts it down near nine at night.
    Eight dead. Then the breath after, and the dread on the horizon nobody can
    see yet: the draft fires of '63, six years off, never shown.
  active_stakes: >-
    The Fuse reaches the Fourth. The riot is the operatic set piece — barricades,
    the militia, the boss stoned mid-mediation, the law absent because it is at
    war with itself. The player's choices over the whole campaign compound here:
    which banner they flew, whose hand they served, whether they defended the
    Floor. Redemption is reachable in the breath after the riot — costly, never
    forced. The ward does not end. It buries its eight, and goes on sinking into
    the marsh, and the next fire is always coming.
  points_of_interest:
  - name: The Barricades on Bayard Street
    slug: the_barricades_on_bayard_street
    visual_prompt:
      solo: >-
        Wide Leone-tight landscape of a barricaded tenement street at night, frozen at
        the instant of impact. Foreground: a barricade of overturned pushcarts and torn-up
        paving stones thrown across the lane, men in shirtsleeves crouched behind it,
        one tipped off balance mid-throw, a brickbat suspended in the air. Middle ground:
        a mass of figures pressing the barricade from the far side with brickbats and
        clubs raised, a raised gang banner on a pike caught in the smoke, the half-paved
        mud churned and supplying its own ammunition. Background: leaning tenement and
        shop fronts on both sides, their lower storeys carrying painted grog and grocery
        boards, a hanging trade sign knocked askew, and peeling overlapping broadsides
        and a torn theatre bill on the brick (painted period lettering, weathered), every upper window crowded with women leaning out
        passing stones down into the dark, no fire engine and no police anywhere in the
        frame. Coal-soot smoke and dust against an orange-grey summer night sky, every
        pleat of fabric crisp in mid-motion stasis, operatic tension held in extreme
        stillness.
      backdrop: >-
        Matching wider-LOD variant — a night street barricaded with overturned pushcarts
        and torn paving stones, two masses of men squared across it with raised clubs and
        a gang banner on a pike in the smoke, leaning tenement and shop fronts carrying
        painted grog and grocery boards and peeling broadsides, women in every upper
        window passing down stones, coal-soot smoke against an orange-grey summer night sky,
        frozen mid-riot.
    description: >-
      Pushcarts and paving stones thrown across Bayard, a thousand men on both
      sides of it, brickbats arcing in the July dark and the windows above full
      of women passing down stones. No water company runs to a fire tonight; no
      copper comes. The mud of the ward, half-paved, supplies its own ammunition.
      This is the Leone-tight frame the whole campaign has been building toward —
      the standoff that finally breaks into the open.
  - name: Where Rynders Was Stoned
    slug: where_rynders_was_stoned
    visual_prompt:
      solo: >-
        Wide Leone-tight landscape of the triangular muddy square near dusk, the instant
        a single man is driven off. Foreground: torn-up cobbles and paving stones scattered
        across the foot-deep mud, a dropped plug hat trampled in a rut, stones caught in
        the air mid-flight. Middle ground: one heavyset man in a good dark frock coat
        staggering backward alone, arm thrown up to shield his head, retreating across the
        open mud — the boss rejected by his own ground. Background: a dense ragged crowd
        of the ward closing in a loose arc behind him, arms cocked to throw, dark coats
        and plug hats and shawls, more onlookers and gawkers crowding every tenement
        window above and packed in the side-street mouths watching; the leaning
        soot-stained grog-grocery fronts of the five corners crowding the edges, their
        lower storeys carrying painted grog and grocery boards and peeling overlapping
        broadsides (weathered period lettering), a single
        gaslight standard. Low gone-to-dusk coal-soot sky, the cold grey light failing,
        a held instant of a machine meeting its limit.
      backdrop: >-
        Matching wider-LOD variant — the triangular muddy square at dusk, torn cobbles
        scattered in the mud, a lone heavyset man in a good coat staggering back with his
        arm up while a dense ragged crowd closes behind him cocked to throw and gawkers
        crowd the tenement windows above, leaning soot-stained grog-grocery fronts with
        painted boards and peeling broadsides and a gaslight standard at the corners,
        failing coal-soot dusk light.
    description: >-
      Near evening on the Square, the boss who owns the ward steps into the gap
      to mediate — and the ward he owns turns on him and drives him off with the
      same paving stones. The exact spot the machine met its limit. A man can
      buy a ward's votes and feed its gangs for years and still find, on one July
      night, that he commands none of it. The mud where Isaiah Rynders learned that.
  - name: The Breath After, in Paradise Square
    slug: the_breath_after_in_paradise_square
    visual_prompt:
      solo: >-
        Wide subdued landscape of the triangular muddy square at dawn, hushed and battered
        the morning after violence but not deserted. Foreground: foot-deep mud churned and
        rutted and now still, scattered torn cobbles and a broken brickbat half-sunk in it,
        a thin film of wet ash over the standing water, an abandoned shawl in the mire,
        a kneeling woman and a stunned survivor sitting on a stoop. Middle ground: a line
        of militiamen in plain dark coats holding a corner with shouldered muskets, knots
        of weary survivors and mourners gathering in the open, a few children picking
        through the wreckage, a thin coil of smoke from a burnt doorway. Background: pale
        faces of gawkers at the tenement windows looking down on the aftermath, the
        leaning soot-stained grog-grocery fronts of the five corners standing scorched,
        their painted boards and peeling broadsides smoke-darkened (weathered period
        lettering), a single gaslight standard burnt out, the
        marsh-damp rising. Pale cold river-fog pewter dawn light, low overcast sky, an
        exhausted memento-mori hush, the ground still sinking, a wide still composition.
      backdrop: >-
        Matching wider-LOD variant — the triangular muddy square at dawn, hushed and
        battered but not empty, torn cobbles and wet ash over the standing water,
        militiamen holding a corner, weary survivors and mourners gathering, gawkers at
        the tenement windows, leaning scorched grog-grocery fronts with smoke-darkened
        boards and peeling broadsides all round, pale cold pewter dawn light, an
        exhausted hush.
    description: >-
      Dawn on the sixth. The militia holds the corners. Eight are dead and the
      count of the hurt is nobody's to settle. Smoke and wet ash and the smell
      of the marsh coming back up through it all. The wakes will start tonight,
      the clocks stopped and the mirrors covered, Maggie Doyle keening over
      whoever the player could not save. The ground is still sinking. The next
      fire is already somewhere down the years. This is where the campaign's
      choices land, and where redemption, if it comes, is paid for.
  npcs:
  - archetype: The Ward Boss
    name: Isaiah Rynders
    location: where_rynders_was_stoned
    disposition: -5
    notes: >-
      Comes to mediate and is stoned and rejected. The night the machine found
      its limit. However the player has dealt with him over the campaign, he is
      diminished here — a powerful man learning he was never as powerful as the story.
  - archetype: The Keening Woman
    name: Maggie Doyle
    location: the_breath_after_in_paradise_square
    disposition: 10
    notes: >-
      Keens over the riot's dead in the breath after. The Witness at the end as
      at the beginning. Whether her shawl ever truly marked a man, she has now
      sung more of the ward across than anyone, and she remembers who held it.
  - archetype: The Free Black Proprietor
    name: Pete Williams
    location: the_breath_after_in_paradise_square
    disposition: 20
    notes: >-
      The floor survived the riot or it did not, depending on the player's
      choices. Either way Pete Williams is the moral measure of the breath
      after — the man with no banner and no machine, asking, without saying it,
      what the player's banner was finally worth.
