- id: veteran
  label: "The Fourth of July — The Ward Burns in the Gap"
  session_range:
  - 25
  - 99
  location: paradise_square
  time_of_day: night
  atmosphere: >-
    July 4-5, 1857. It starts as a raid — a Roach-and-Dead-Rabbits coalition on
    a Bowery clubhouse, repelled back to Paradise Square — and then it does not
    stop. The fight spreads across Pearl and Chatham and Park Row, eight hundred
    and a thousand men with paving stones and brickbats and axes, pushcart
    barricades thrown across Bayard Street. The police take no action because
    the police are two forces still fighting each other and neither can muster.
    Rynders himself comes to mediate near evening, the boss who owns the ward,
    and the ward stones him and rejects him — the limit of the machine, when its
    own muscle slips the leash. The militia comes at last, the 8th and the 71st
    Regiments behind two police detachments, and puts it down near nine at night.
    Eight dead. Then the breath after, and the dread on the horizon nobody can
    see yet: the draft fires of '63, six years off, never shown.
  active_stakes: >-
    The Fuse reaches the Fourth. The riot is the operatic set piece — barricades,
    the militia, the boss stoned mid-mediation, the law absent because it is at
    war with itself. The player's choices over the whole campaign compound here:
    which banner they flew, whose hand they served, whether they defended the
    Floor. Redemption is reachable in the breath after the riot — costly, never
    forced. The ward does not end. It buries its eight, and goes on sinking into
    the marsh, and the next fire is always coming.
  points_of_interest:
  - name: The Barricades on Bayard Street
    slug: the_barricades_on_bayard_street
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for the_barricades_on_bayard_street'
      backdrop: 'TODO (art-director): author backdrop LOD for the_barricades_on_bayard_street'
    description: >-
      Pushcarts and paving stones thrown across Bayard, a thousand men on both
      sides of it, brickbats arcing in the July dark and the windows above full
      of women passing down stones. No water company runs to a fire tonight; no
      copper comes. The mud of the ward, half-paved, supplies its own ammunition.
      This is the Leone-tight frame the whole campaign has been building toward —
      the standoff that finally breaks into the open.
  - name: Where Rynders Was Stoned
    slug: where_rynders_was_stoned
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for where_rynders_was_stoned'
      backdrop: 'TODO (art-director): author backdrop LOD for where_rynders_was_stoned'
    description: >-
      Near evening on the Square, the boss who owns the ward steps into the gap
      to mediate — and the ward he owns turns on him and drives him off with the
      same paving stones. The exact spot the machine met its limit. A man can
      buy a ward's votes and feed its gangs for years and still find, on one July
      night, that he commands none of it. The mud where Isaiah Rynders learned that.
  - name: The Breath After, in Paradise Square
    slug: the_breath_after_in_paradise_square
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for the_breath_after_in_paradise_square'
      backdrop: 'TODO (art-director): author backdrop LOD for the_breath_after_in_paradise_square'
    description: >-
      Dawn on the sixth. The militia holds the corners. Eight are dead and the
      count of the hurt is nobody's to settle. Smoke and wet ash and the smell
      of the marsh coming back up through it all. The wakes will start tonight,
      the clocks stopped and the mirrors covered, Maggie Doyle keening over
      whoever the player could not save. The ground is still sinking. The next
      fire is already somewhere down the years. This is where the campaign's
      choices land, and where redemption, if it comes, is paid for.
  npcs:
  - archetype: The Ward Boss
    name: Isaiah Rynders
    location: where_rynders_was_stoned
    disposition: -5
    notes: >-
      Comes to mediate and is stoned and rejected. The night the machine found
      its limit. However the player has dealt with him over the campaign, he is
      diminished here — a powerful man learning he was never as powerful as the story.
  - archetype: The Keening Woman
    name: Maggie Doyle
    location: the_breath_after_in_paradise_square
    disposition: 10
    notes: >-
      Keens over the riot's dead in the breath after. The Witness at the end as
      at the beginning. Whether her shawl ever truly marked a man, she has now
      sung more of the ward across than anyone, and she remembers who held it.
  - archetype: The Free Black Proprietor
    name: Pete Williams
    location: the_breath_after_in_paradise_square
    disposition: 20
    notes: >-
      The floor survived the riot or it did not, depending on the player's
      choices. Either way Pete Williams is the moral measure of the breath
      after — the man with no banner and no machine, asking, without saying it,
      what the player's banner was finally worth.
  lore:
  - "The riot of July 4-5 1857 burned because the two police forces were too busy fighting each other to stop it"
  - "Rynders came to mediate and the ward he owned stoned him — the machine's limit, made visible"
  - "The 8th and 71st Regiments under the militia put it down near nine at night; eight dead"
