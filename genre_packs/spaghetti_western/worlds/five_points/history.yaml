# Five Points — World Maturity History
# Four chapters as a FUSE to the July 4-5, 1857 Dead Rabbits Riot.
# Story Now: each chapter is a SITUATION with hooks, not a scripted quest chain.
# POI visual_prompt fields are art-director's lane — left as TODO markers here;
# writer supplies the description prose. Mechanical trope state is scenario-designer's.

chapters:
- id: fresh
  label: "Autumn in the Sixth Ward — Learn Who Flies Which Banner"
  session_range:
  - 1
  - 5
  location: paradise_square
  time_of_day: morning
  atmosphere: >-
    Autumn 1856, a year after they laid Bill Poole in the ground at Green-Wood
    and the nativists still toast him by name. The five corners run a foot deep
    in mud the pigs have not finished with; the tenements lean a degree more
    than last winter; coal smoke and privy stink and the river hang together
    over the Square. Rynders's green-groceries are open along the triangle and
    his saloons behind them. A fresh boat is in at Castle Garden and the runners
    are working the fence. The Bowery papers print "Dead Rabbits" like it's a
    regiment; the Baxter Street men say there's no such gang. The police war is
    a rumor uptown and nobody in the ward has felt it yet. You arrive — off the
    boat, born to the court, sent to save it, or run down to lose yourself in it.
  active_stakes: >-
    The player learns the ward: who flies which banner and which hand works it.
    The runner takes a newcomer's arm at the Garden gate. The first turf scuffle
    flares over a hydrant or a box. A folk-charm changes hands — a medal, a
    shillelagh, a marked deck — and the man who gives it tells you why it's lucky.
    Tammany offers a small kindness with a price attached. Nobody asks you to
    choose a side yet. They are only learning your face, and you theirs.
  points_of_interest:
  - name: Paradise Square at the Five Corners
    slug: paradise_square_at_the_five_corners
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for paradise_square_at_the_five_corners'
      backdrop: 'TODO (art-director): author backdrop LOD for paradise_square_at_the_five_corners'
    description: >-
      The triangular open lot where Worth, Baxter, and Park meet with Little
      Water feeding in — one of the few open spaces in the ward, cleared a
      generation ago over the buried Little Collect. Mud underfoot that never
      dries; the ground gives a little when a wagon stands on it too long.
      Rynders's green-groceries ring the triangle, oranges and onions in the
      window and a back room behind. Pigs work the gutters. This is the
      standoff ground, the place a crowd gathers and a body has been found.
  - name: The Castle Garden Gate
    slug: the_castle_garden_gate
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for the_castle_garden_gate'
      backdrop: 'TODO (art-director): author backdrop LOD for the_castle_garden_gate'
    description: >-
      The round stone fort at the Battery, fenced off the year before to keep
      the runners off the bewildered new arrivals. Inside the fence: honest
      money-changing, the true fare, a word on a boarding-house, a doctor.
      Outside it, working the rail like gulls, the runners — soft Cork voices,
      good coats, a boarding-house and a fast naturalization to sell. Salt off
      the harbor, tar and wet wool and the press of a thousand people who have
      been keened over already, back home, as good as dead before they sailed.
  - name: A Cellar Wake in Cow Bay
    slug: a_cellar_wake_in_cow_bay
    visual_prompt:
      solo: 'TODO (art-director): author solo visual_prompt for a_cellar_wake_in_cow_bay'
      backdrop: 'TODO (art-director): author backdrop LOD for a_cellar_wake_in_cow_bay'
    description: >-
      Down the dead-end sink at the foot of Little Water, the old tannery
      stink still in the brick. A body laid on the kitchen table two days, the
      clocks stopped and the mirrors covered and the window cracked for the
      soul. Maggie Doyle keening over it, paid in whiskey, the priest of old
      St. Patrick's disapproving and not staying away. By midnight it is half a
      funeral and half a party — riddles, songs, a wager, a courtship beside
      the corpse. The merry wake. Death and revel are the same room here.
  npcs:
  - archetype: The Ward Boss
    name: Isaiah Rynders
    location: paradise_square
    disposition: 10
    notes: >-
      Holds the ward from the green-groceries and saloons. Friendly, useful,
      and keeping a ledger of who he was friendly to. Offers the small kindness
      with the price hidden in it. Does not yet show the player his hand.
  - archetype: The Runner
    name: Cornelius Mulligan
    location: the_castle_garden_gate
    disposition: -10
    notes: >-
      Works the fence. Soft voice, good coat, a boarding-house and a fast vote
      to sell. Fleeces the newcomer. The first hand in the ward the player
      sees plainly — because a predator-broker does not bother to hide it.
  - archetype: The Keening Woman
    name: Maggie Doyle
    location: a_cellar_wake_in_cow_bay
    disposition: 5
    notes: >-
      The last of the Lower Hill keeners. Keens for hire. Says she knows when
      a man is marked, and has a shawl she'll let you hold for a consideration.
      The Witness — she sees the death-rite truth under the ward's lies.
  lore:
  - "The 'Dead Rabbits' may be one gang, several, or a press slur — the ward itself does not agree"
  - "Bill Poole is a year dead and his killers walked after three hung juries; the nativists toast him still"
  - "The runners work the Castle Garden fence; the same gate is a mercy inside and a harvest outside"
  - "The cholera dead of '49 and '54 lie unwaked in mass pits under the fill; the old people say the ground gives the wailing back"
  notes:
  - "The Fuse to the Fourth (A-plot) is dormant this chapter — the police war is only a rumor"
  - "A folk-charm changes hands in the first sessions and the giver tells the player why it is lucky"
  - "No faction asks the player to choose yet; they are reading the player's face"
