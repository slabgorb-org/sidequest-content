- id: mid
  label: "Spring into Summer — The Police War Erupts"
  session_range:
  - 13
  - 25
  location: broadway_uptown
  time_of_day: evening
  atmosphere: >-
    The spring of 1857 and the law goes openly to war with itself. Albany has
    abolished the Mayor's police and raised its own; the Mayor has kept his
    anyway, and for a season two forces wear two stars and recognize neither
    the other's warrants. In June it comes to blows on the City Hall steps —
    Metropolitans and Municipals brawling in the corridors, a general and his
    regiment called out to arrest the Mayor, who is bailed within the hour.
    Down in the ward the meaning is plain: call the law now and you must choose
    which law is real this week, and the two of them would rather fight each
    other than answer you. The reform raids and the nativist tide press on the
    Floor from both sides.
  active_stakes: >-
    The police war erupts and the player can no longer stand between. Calling
    the cops is choosing a faction. The June City Hall confrontation is the
    public proof that the law cannot govern itself. The Floor at Almack's comes
    under real pressure — Mission raids on the dance cellars, nativist threats
    on the one free space — and the player who has danced there must decide
    whether to defend it and how. Every banner now demands the player stand
    under it openly. The fuse is lit and shortening.
  points_of_interest:
  - name: The City Hall Steps
    slug: the_city_hall_steps
    visual_prompt:
      solo: >-
        Wide civic landscape looking up a broad flight of white marble steps to the
        portico of a columned public building, the steps thronged. Foreground: the clean
        pale stone of the lower steps, a dropped plug hat and a broken cane on the
        marble, a smear where blood has been sluiced away, a newsboy with a bundle of
        sheets and a knot of gawkers and reporters craning up, the aftermath of a brawl.
        Middle ground: two ragged ranks of men in dark frock coats squared off across
        the steps, a line of militia in plain dark coats with muskets and fixed bayonets
        glinting at the top, a dense wary crowd pressed to the margins. Background: a
        colonnaded marble facade and a low cupola, a posting-kiosk and a hoarding to one
        side layered with official printed proclamations and broadsides in painted period
        lettering (weathered), bare park trees beyond,
        soot-thinned grey sky. Flat overcast daylight, clean stone instead of mud, cool
        grey shadows, an uneasy hush after violence, a wide elevated shot.
      backdrop: >-
        Matching wider-LOD variant — a broad flight of white marble steps up to a
        columned public building with a low cupola, dark-coated men ranked across the
        steps and a line of bayonets at the top, a crowd of gawkers and a newsboy below,
        a hoarding layered with printed proclamations and broadsides to one side, bare
        park trees, soot-thinned grey sky, clean pale stone, flat overcast daylight.
    description: >-
      The white marble theater of the police war, uptown and a world away from
      the mud of the Points. The June confrontation happened here — fifty
      Metropolitans driven back down the steps by three hundred Municipals
      pouring out the doors, a thirty-minute brawl in the corridors, the
      militia surrounding the building to take the Mayor. Clean stone, and the
      blood washed off it by morning, and the question of which law is real
      still unsettled.
  - name: Stanwix Hall on Broadway
    slug: stanwix_hall_on_broadway
    visual_prompt:
      solo: >-
        Interior landscape of a respectable gaslit Broadway saloon barroom, busy with
        patrons. Foreground: a polished mahogany bar running across the frame, a row of
        cut-glass decanters and labeled bottles catching the light, a brass rail, a
        spittoon, an aproned barman drawing a drink, a single dark hat set down as if
        abandoned. Middle ground: a tall gilt-framed mirror behind the bar doubling the
        room with painted gilt barroom lettering arched across its top (period
        lettering, weathered), gas jets in frosted globes
        throwing gaslight-amber along the wall, a row of native-born men in good coats
        and stovepipe hats ranged along the bar, several standing quiet and hats off at
        one spot as if at a shrine. Background: a pressed-tin ceiling, a marble-topped
        side table with seated drinkers, a heavy curtained window onto the avenue, more
        patrons in the warm brown shadow at the back. Gaslight-amber glow, plate-glass
        respectability, a hushed pilgrimage stillness in a place where a man was shot,
        a medium interior shot.
      backdrop: >-
        Matching wider-LOD variant — a busy gaslit Broadway saloon barroom, a polished
        mahogany bar with decanters and labeled bottles, an aproned barman and patrons
        ranged along the brass rail, a tall gilt-framed mirror with painted gilt
        lettering doubling the room, frosted gas globes throwing amber light, a
        pressed-tin ceiling, warm gaslight-amber glow, a hushed respectable stillness.
    description: >-
      The Broadway saloon where Poole took the pistol-balls two years gone, now
      a pilgrimage site for the native-born who come to stand on the spot and
      say his last words. Mirrored bar, gaslight, the respectable city's idea
      of itself. The Bowery men make a shrine of it; the Roach men cross the
      street to avoid it. A relic-place: the legend lives here whether or not
      the facts ever did.
  - name: The Stair Down to Almack's Under Pressure
    slug: the_stair_down_to_almacks_under_pressure
    visual_prompt:
      solo: >-
        Tense vertical landscape looking down a steep worn stair from a street doorway
        into a below-grade dance cellar. Foreground: the top of the stair at street
        level, a sober deputation of several dark-coated reformers crowding the head of
        it looking down, a nativist handbill in painted period lettering pasted crooked
        to the open plank door and a couple more bills layered beside it (weathered). Middle ground: the descending stone steps glowing warm
        candle-tallow at the bottom with light spilling up, and below, a packed cellar
        of dancers mid-reel — a fiddler on a barrel-head, mixed couples crowding the
        floor, a stout landlady at a plank bar, glimpsed through the glow. Background, at
        the street corner: a lone figure in a long coat with a copper's star leaning in
        the gaslamp shadow, watching, a few wary loungers near the door. Cold river-fog
        pewter street light above against the warm candle-tallow glow rising from the
        crowded cellar, a held-breath tension between the two, the warmth pressed from
        above.
      backdrop: >-
        Matching wider-LOD variant — a steep worn stair dropping from a cold pewter-lit
        street doorway into a packed below-grade dance cellar glowing warm candle-tallow
        gold at the bottom, dancers and a fiddler crowding the floor below, layered
        nativist handbills in painted lettering on the open door, dark-coated reformers
        crowding the head of the stair, a watcher with a star in the gaslamp shadow at
        the corner, tense.
    description: >-
      The cellar off Baxter, fiddle and bones and the best floor in the Points
      — and a Mission deputation at the top of the stair now, and a nativist
      handbill pasted to the door, and a copper who may or may not have a legal
      star this week leaning at the corner. Pete Williams keeps the floor open
      one more night. Master Juba cuts it as if nothing presses. The candles
      burn the same. Everyone in the room knows what is coming.
  npcs:
  - archetype: The Divided Copper
    name: Owen Sheridan
    location: the_city_hall_steps
    disposition: 0
    notes: >-
      Wears a star and cannot say this week whether it is lawful. Loyal to the
      ward, paid by one force, hunted by the other. Embodies the war: every
      arrest he makes might be a crime by the other law.
  - archetype: The Free Black Proprietor
    name: Pete Williams
    location: the_stair_down_to_almacks_under_pressure
    disposition: 15
    notes: >-
      Keeps the floor — the one free space. The moral center, the man who has
      seen it all. No machine behind him, a barred ballot, and the only
      democracy in the ward on his boards. Under pressure from reform and tide
      both, and choosing each night to open the stair anyway.
  - archetype: The B'hoy / Fire Laddie
    name: Andrew Walling
    location: stanwix_hall_on_broadway
    disposition: -5
