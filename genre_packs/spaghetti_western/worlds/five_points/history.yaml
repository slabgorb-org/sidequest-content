- id: early
  label: "Winter — The Factions Show Their Hands"
  session_range:
  - 6
  - 12
  location: mulberry_bend
  time_of_day: afternoon
  atmosphere: >-
    Winter on the ward. The mud freezes into ruts and the cellar dwellings run
    with cold damp; the courts of Mulberry Bend — Bottle Alley, Ragpickers'
    Row, Bandit's Roost — go dark by four. The player is no longer a stranger;
    the factions have read the face and now they court it. Tammany has a job to
    offer. A gang wants an oath. The Mission wants to help, which is its own
    kind of recruitment. And there has been a killing that will not stay quiet
    — an echo of Poole, a man down over a box or a hydrant or an insult, and
    everyone with a banner is already telling you whose fault it was.
  active_stakes: >-
    The factions show their hands to the player who has earned a look. The
    courting is real: a Tammany place on the docks, a Roach oath at the parish,
    a Bowery red shirt, the Mission's offer of a clean room with a price in the
    soul. The killing that won't stay quiet forces small allegiances. Uptown,
    Albany and the Mayor begin to clash over who owns the police — the first
    cold edge of the war that has been a rumor. The player is choosing, in small
    ways, which banner to be seen under.
  points_of_interest:
  - name: Bandit's Roost off Mulberry Bend
    slug: bandits_roost_off_mulberry_bend
    visual_prompt:
      solo: >-
        Tight vertical landscape looking down a narrow blind tenement alley reached
        through a low passage too cramped for a cart, the cramped court alive with its
        own. Foreground: a wet cobble-and-mud lane, heaps of rags, broken bottles, bones
        and scrap iron banked against the alley mouth, an abandoned ragpicker's handcart
        tipped at the kerb, two ragged barefoot children sorting through the junk, a
        bony dog. Middle ground: four-storey soot-blackened brick fronts leaning in over
        the lane from both sides until they nearly touch, a grimy junk-shop and rag-shop
        cellar at the base with painted trade boards and crude hanging signs over their
        doors and a few tattered peeling bills pasted on the brick, the painted lettering
        weathered and overlapping; lines of grey washing strung
        across the gap, a woman leaning from a window, gang toughs and a fence in worn
        coats lounging wary in a dark doorway watching the passage. Background: the alley
        jogging crooked and dead-ending in deep mourning-jet shadow under a thin strip
        of overcast sky. Mid-afternoon and the daylight already gone in the deep court,
        grime and damp on every surface, cold flat light.
      backdrop: >-
        Matching wider-LOD variant — a narrow blind tenement alley, four-storey
        soot-blackened brick leaning in overhead, grimy junk-shop and rag-shop boards
        and tattered peeling bills on the brick, grey washing strung across the gap,
        rags and broken bottles banked at the mouth, ragged children and lounging toughs
        in the court, the lane dead-ending in deep mourning-jet shadow, cold flat light.
    description: >-
      A blind court off the curve of Mulberry, reached through a passage a
      cart could not take, rear tenements abutting fronts and the daylight gone
      by mid-afternoon. Washing strung between the leaning brick. The fence
      economy lives here — rags for paper, bottles, bones, scrap, and stolen
      goods moving quiet through the junk shops. A man learns fast not to
      stand with his back to the passage mouth.
  - name: Old St. Patrick's on Mott Street
    slug: old_st_patricks_on_mott_street
    visual_prompt:
      solo: >-
        Wide street landscape of a walled brick Catholic parish church rising over a
        busy tenement lane. Foreground: a high brick churchyard wall and an iron gate,
        worn flagstones, a few leaning weathered grave markers in the yard, beggars and
        ragged children at the gate, a beadle, parish-oxblood warmth in the old brick.
        Middle ground: the tall side elevation of an early Gothic Revival church,
        pointed-arch windows, a squat tower, a stone stoop and a heavy plank door, a
        crowd of dark-coated parishioners and shawled women filing in and out at the
        steps, a clutch of gang toughs in plug hats loitering at the wall. Background:
        soot-stained tenement and shop fronts crowding close behind the church on a
        narrow street, their lower storeys carrying painted period signage — a grocer's
        board, a tavern's hanging trade sign, peeling overlapping broadsides and ballad
        sheets pasted up the brick, the lettering weathered and overlapping; a low overcast coal-soot grey sky over the rooflines, a thin coil
        of incense or chimney smoke. Flat cold daylight, cool grey shadows, cold stone
        and old brick the keynote.
      backdrop: >-
        Matching wider-LOD variant — a tall walled brick Catholic parish church with
        pointed-arch windows and a squat tower, an iron churchyard gate with beggars and
        parishioners crowding it, soot-stained tenement and shop fronts behind carrying
        painted grocer and tavern boards and peeling broadsides, a narrow lane, low
        overcast coal-soot grey sky, cold flat daylight.
    description: >-
      The live cathedral of the ward — brick, walled, the seat of a militant
      sacred authority that has warned the city it would make New York
      "another Moscow" before it would see a Catholic church burned. Candle
      smoke and cold stone and Latin. The parish that the Roach men defend and
      the Mission means, gently, to empty. Father Lynch disapproves of the
      keening and the wake and cannot stop either.
  - name: The Empire Club Back Room
    slug: the_empire_club_back_room
    visual_prompt:
      solo: >-
        Interior landscape of a close, low political club back room behind a grocery,
        thick with cigar smoke hanging in the lamplight, the room full of men.
        Foreground: a heavy round table littered with a stoneware inkstand, two open
        ledger books, scattered coin, a corner of green baize, a single oil lamp pooling
        gaslight-amber on the wood. Middle ground: four or five broad men in good dark
        frock coats seated and leaning over the table, faces half-lit from below, one
        heavyset and prosperous, a broad-shouldered prizefighter standing at his
        shoulder, talk held close. Background: more ward men and hangers-on crowding the
        doorway and the shadows along the wall, a black iron coal stove glowing in the
        corner, a painted political club banner in period lettering hung over the
        panelling (weathered) and a chalked tally-board beside
        it, a shuttered window, panelled walls going to deep shadow. Warm gaslight-amber
        glow against deep brown shadow, close smoky air, conspiratorial press, a medium
        interior shot.
      backdrop: >-
        Matching wider-LOD variant — a smoky lamp-lit political club back room crowded
        with ward men, a heavy round table with ledgers and a single oil lamp, broad
        dark-coated men leaning over it and more loitering in the doorway, a painted
        club banner and a chalked tally-board on the panelling, a glowing iron coal
        stove in the corner, warm gaslight-amber glow, close conspiratorial air.
    description: >-
      Behind a green-grocery on the Square, the room where the ward is actually
      run — cigar smoke, a coal stove, a ledger of favors and a ledger of debts.
      Rynders here, and Morrissey, the prizefighter, broad in a good coat. A
      place a man is offered a job and understands, taking it, that he has just
      been bought a little. The banner on the wall says friend of the people.
      The hand on the table is counting votes.
  npcs:
  - archetype: The Roach Brawler
    name: Denis Rafferty
    location: old_st_patricks_on_mott_street
    disposition: 5
    notes: >-
      Wants the player's oath. Defends his own and means it; is also Wood's
      muscle by retainer and does not see the contradiction. The killing that
      won't stay quiet is partly his to answer.
  - archetype: The Ward Boss
    name: John Morrissey
    location: the_empire_club_back_room
    disposition: 0
    notes: >-
      Old Smoke. The prizefighter who did for Poole's friends, the coming man
      under Rynders. Offers the dock job. Charming, dangerous, ascendant. The
      hand under Tammany's banner, made flesh.
  - archetype: The Mission Lady
    name: Phebe Hubbard
    location: the_mission_block
    disposition: 10
    notes: >-
      Means the salvation entirely. Does the harm anyway. Offers the player's
      poorest contact a clean room and a schoolroom, and asks only for the
      rosary at the door and the child made new.
