# Five Points — Folk-Charm Item Table (world-level override/extension)
#
# GOVERNING LAW: Magic is FOLK-CHARM tier ONLY. Small, situational, modest
# bonuses. NO cosmology, NO apocalypse, NO charge-accrual / "paying the rounds"
# relic ladder. Folk superstition explains *why* each object is lucky (blessed,
# killed-a-man, paid-the-rounds-over-it) — that is FLAVOR, never a power ladder.
# Ambiguity preserved: maybe it is just luck.
#
# Mechanically these are catalog items in the genre inventory.yaml CatalogItem
# shape (id/name/description/category/value/weight/rarity/power_level/tags/lore/
# narrative_weight — the model is extra="forbid", so the charm's mechanical bite
# lives inside `lore`, never in an invented field). Bonuses route through the
# genre stat vocabulary (GRIT/DRAW/NERVE/CUNNING/PRESENCE/LUCK) and the genre
# `luck` resource and reputation_factions from rules.yaml — NO new resource pool.
# power_level stays 0–1 across the whole table: these are charms, not arsenals.
#
# WORLD/GENRE SPLIT: like worlds/the_real_mccoy/inventions.yaml, this is a
# world item file. Currency restated as Dollars (NYC 1850s) to match the genre.

currency:
  name: Dollars
  denominations:
    cents: 1
    dollars: 100
    eagles: 1000

item_catalog:

  - id: blackthorn_shillelagh
    name: Blackthorn Shillelagh
    description: "A fire-hardened blackthorn cudgel, knob worn smooth. Munster men swear it knows a nativist by smell."
    category: weapon
    value: 150
    weight: 2
    rarity: uncommon
    power_level: 1
    tags: [melee, charm, irish]
    lore: "Cut from a Connacht hedge, carried across the water, blessed by a priest now dead. CHARM: +1 to hit vs Bowery Boys in a brawl or standoff; no bonus against anyone else. Maybe it knows them; maybe it is just luck."
    narrative_weight: notable

  - id: bill_pooles_cleaver
    name: Bill Poole's Cleaver
    description: "A butcher's cleaver said to be Poole's own. The b'hoys touch it like a relic; the Irish flinch from it."
    category: weapon
    value: 400
    weight: 2
    rarity: rare
    power_level: 1
    tags: [melee, charm, nativist, relic]
    lore: "'Goodbye boys, I die a true American.' The cleaver outlives the man and carries the words. CHARM: +1 to hit while wielded; once per scene a Bowery Boy who sees it bared takes a small NERVE-break check (rules.yaml standoff nerve_break), and it rattles the nativists' enemies the same beat. A notable item, not a wrath engine."
    narrative_weight: notable

  - id: hare_on_a_pike_standard
    name: The Hare-on-a-Pike Standard
    description: "A dead hare lashed to a pike — the slur 'Dead Rabbits' reclaimed as a battle emblem. Two hands to carry; not worn."
    category: tool
    value: 0
    weight: 4
    rarity: rare
    power_level: 1
    tags: [banner, charm, irish, rally]
    lore: "Whether the Dead Rabbits were ever one gang is contested; the standard is realer than the gang. CHARM: once per scene, raise it to rally Roach Guards / Irish allies (a morale/initiative nudge, like Mose's trumpet) and impose a small fear effect on facing nativists. Drawing it flags the bearer to every nativist in sight."
    narrative_weight: notable

  - id: moses_fire_trumpet
    name: Mose's Fire-Trumpet
    description: "A battered brass speaking-trumpet from a volunteer fire company, dented from old runs to the hydrant."
    category: tool
    value: 100
    weight: 2
    rarity: uncommon
    power_level: 1
    tags: [charm, fire_company, rally]
    lore: "Named for Mose the b'hoy of the penny-stage stories. CHARM: once per scene, rally your company — a morale/initiative nudge to allies in the same brawl, turf scuffle, or barricade. No effect on strangers."
    narrative_weight: standard

  - id: miraculous_medal
    name: Miraculous Medal
    description: "A small oval medal of the Virgin, worn thin against the skin on a bit of twine."
    category: tool
    value: 25
    weight: 0
    rarity: common
    power_level: 0
    tags: [charm, irish, catholic, faith]
    lore: "Pressed into a hand at old St. Patrick's on Mott Street; the Famine-Irish do not leave the house without it. CHARM: reroll one death save per session (the genre Cheat-Death register, no Luck cost). Maybe faith; maybe luck."
    narrative_weight: standard

  - id: brown_scapular
    name: Brown Scapular
    description: "Two squares of brown wool on cords, worn over the shoulders under the shirt."
    category: tool
    value: 20
    weight: 0
    rarity: common
    power_level: 0
    tags: [charm, irish, catholic, faith]
    lore: "The promise sewn into it: who dies wearing it does not die unshriven. CHARM: once per session, when the bearer would spend Luck to Cheat Death, the scapular covers it instead (no Luck spent). Does not stack with another death-charm in the same instant."
    narrative_weight: standard

  - id: keening_womans_shawl
    name: The Keening-Woman's Shawl
    description: "A black wool shawl that smells of turf smoke and grave-clay, lent by the bean caointe who keens the ward's dead."
    category: tool
    value: 50
    weight: 1
    rarity: rare
    power_level: 0
    tags: [charm, irish, death_rite, omen]
    lore: "She keens for the marked before they know they are marked. CHARM: once, wrap it round your shoulders and know whether a single named NPC is 'marked' — the GM signals whether lethal danger hangs on them this arc. One use, then it is just a shawl."
    narrative_weight: notable

  - id: marked_deck_five_points
    name: Marked Deck
    description: "A deck of cards with imperfections only the dealer who marked them can read; favored in the Baxter Street cellars."
    category: tool
    value: 50
    weight: 0
    rarity: uncommon
    power_level: 0
    tags: [charm, gambling, deception]
    lore: "Honest until it is needed; the marks are on the edges. CHARM: edge on one cheat or gamble check per scene (the rules.yaml poker `cheat` beat). If caught, the table turns — and a marked deck found on you is its own crime in the ward."
    narrative_weight: minor

  - id: loaded_bones
    name: Loaded Bones
    description: "A pair of dice weighted with a fleck of lead, run in the green-grocery back rooms off Paradise Square."
    category: tool
    value: 30
    weight: 0
    rarity: uncommon
    power_level: 0
    tags: [charm, gambling, deception]
    lore: "The fixer who sold them swore they only rolled lucky for honest men; he was not an honest man. CHARM: edge on one gamble check per scene. Mutually exclusive with the marked deck in the same game — palm one or the other, not both."
    narrative_weight: minor

  - id: hot_corn_girls_basket
    name: The Hot-Corn Girl's Basket
    description: "A shawl-lined basket that sold roasted corn on the night streets; its girl knows every doorway in the Points."
    category: tool
    value: 40
    weight: 2
    rarity: common
    power_level: 0
    tags: [charm, street, information]
    lore: "'Hot corn, all hot!' — the cry heard everywhere by everyone. CHARM: once per scene, carrying the basket through a region grants a small CUNNING edge to gather street word or pass a corner uncollared; a hot-corn girl is invisible the way the powerless are invisible."
    narrative_weight: standard

  - id: masters_worn_taps
    name: Master Juba's Worn Taps
    description: "A pair of hard-worn dancing shoes from the Floor at Almack's, soles slick from the cellar boards."
    category: armor
    value: 60
    weight: 1
    rarity: rare
    power_level: 0
    tags: [charm, floor, dance, amalgamation]
    lore: "Said to have danced the juba against the Irish step until the two made one new thing; the Floor's only relic. CHARM: once per scene on the Floor or in any crowd, a small PRESENCE edge to move, read a room, or carry the floor — the body that learned the cellar's rhythm is hard to corner. No bonus to violence."
    narrative_weight: notable

# Charms are FOUND, inherited, lent, or pressed into a hand — never bought as a
# loadout. A charm changing hands is a FRESH-tier beat in tropes.yaml. They are
# not assigned as class starting gear; world archetypes that carry one reference
# it in their starting_inventory in _archetypes_mech.yaml.
#
# ── Mundane gear (class loadouts) ────────────────────────────────────────────
# Playtest fix 2026-06-07: the comment that used to live here promised "the
# genre inventory.yaml supplies class loadouts" — that file does not exist,
# and world inventory REPLACES genre wholesale (epic 94), so every five_points
# character chargenned with an EMPTY inventory. Loadouts are world-level here,
# matching siblings dust_and_lead / the_real_mccoy. Items below are mundane
# 1850s Sixth Ward gear — no charms, no charm tags, power_level 0 throughout.

  - id: colt_pocket_revolver
    name: Colt Pocket Revolver
    description: "A .31-calibre pocket Colt, five shots, small enough to ride a coat pocket without printing."
    category: weapon
    value: 1200
    weight: 1.5
    rarity: uncommon
    power_level: 0
    tags: [firearm, concealable]
    lore: "Pistols are for ending arguments, not winning them — the Points fights with fists, boots, and iron before powder. Producing one changes the temperature of any room."
    narrative_weight: standard

  - id: pepperbox_pistol
    name: Pepperbox Pistol
    description: "A six-barrel Allen & Thurber pepperbox, as likely to fire two barrels as one. Cheap, loud, and rude."
    category: weapon
    value: 600
    weight: 1.5
    rarity: common
    power_level: 0
    tags: [firearm, concealable, unreliable]
    lore: "The gambler's gun: nobody, including the man holding it, knows quite where it will shoot. At card-table range that hardly matters."
    narrative_weight: standard

  - id: slungshot
    name: Slungshot
    description: "A lead weight braided into a rope lanyard, worn around the wrist under the cuff. The Points' signature persuader."
    category: weapon
    value: 50
    weight: 1
    rarity: common
    power_level: 0
    tags: [melee, concealable, gang]
    lore: "Quiet, deniable, and devastating in a crowd. Half the Sixth Ward carries one; the other half has been hit with one."
    narrative_weight: standard

  - id: brass_knuckles
    name: Brass Knuckles
    description: "A cast-brass four-finger bar, edges filed smooth from use."
    category: weapon
    value: 75
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [melee, concealable]
    lore: "Sold openly at the hardware stalls on Chatham Street as 'paperweights.'"
    narrative_weight: standard

  - id: oyster_knife
    name: Oyster Knife
    description: "A short, stout-bladed knife for shucking — and for everything else a knife is for."
    category: weapon
    value: 25
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [melee, tool]
    lore: "Every cellar oyster-house hands these out and never counts them back in. The most common blade in the Ward and the least remarked."
    narrative_weight: standard

  - id: hickory_club
    name: Hickory Club
    description: "A turned hickory truncheon, twenty-two inches, leather thong through the pommel."
    category: weapon
    value: 100
    weight: 2
    rarity: common
    power_level: 0
    tags: [melee]
    lore: "The Municipal pattern — but plenty walk the Ward that never saw a station house."
    narrative_weight: standard

  - id: copper_star
    name: Copper Star
    description: "The eight-pointed copper badge of the Municipal Police, pinned inside the lapel as often as outside it."
    category: tool
    value: 0
    weight: 0.1
    rarity: uncommon
    power_level: 0
    tags: [badge, authority, municipal]
    lore: "It opens doors in some blocks and closes them in others. In the Points, showing the star is a decision, not a habit."
    narrative_weight: notable

  - id: manacles_iron
    name: Iron Manacles
    description: "A pair of screw-key manacles, key on a neck string."
    category: tool
    value: 300
    weight: 2
    rarity: uncommon
    power_level: 0
    tags: [restraint]
    lore: "A man walked in irons through Paradise Square is a message to everyone watching."
    narrative_weight: standard

  - id: bullseye_lantern
    name: Bullseye Lantern
    description: "A tin lantern with a lensed shutter — a tight beam, or darkness, at a flick."
    category: tool
    value: 150
    weight: 2
    rarity: common
    power_level: 0
    tags: [light]
    lore: "The cellars under the Points go further than any map admits. A shuttered bullseye is the difference between exploring them and being found in them."
    narrative_weight: standard

  - id: wanted_handbills
    name: Sheaf of Wanted Handbills
    description: "A folded sheaf of reward notices — faces, names, sums — annotated in pencil."
    category: tool
    value: 0
    weight: 0.5
    rarity: common
    power_level: 0
    tags: [information, bounty]
    lore: "Rewards posted by the banks, the steamship lines, and men who'd rather not say. Knowing which faces are worth money is its own trade."
    narrative_weight: standard

  - id: deck_of_cards_plain
    name: Deck of Playing Cards
    description: "An honest deck of steamboat playing cards, corners soft from play."
    category: tool
    value: 25
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [gambling]
    lore: "Honest, as far as anyone can prove. A faro bank or a three-card pitch can be set up on any barrel-head in the Ward."
    narrative_weight: standard

  - id: silk_cravat
    name: Silk Cravat
    description: "A gambler's silk cravat, tied high in the sporting style, pin glinting."
    category: armor
    value: 200
    weight: 0.1
    rarity: uncommon
    power_level: 0
    tags: [clothing, sporting]
    lore: "In the Points, dressing above the gutter is armor of a kind — doors open for a sporting man that stay shut for a tough."
    narrative_weight: standard

  - id: bedroll_wool
    name: Wool Bedroll
    description: "A waxed-canvas roll around a wool blanket, rope-tied for the shoulder."
    category: tool
    value: 80
    weight: 4
    rarity: common
    power_level: 0
    tags: [travel]
    lore: "The drifter's whole address. A sevenpenny lodging-house bunk is the alternative, lice included."
    narrative_weight: standard

  - id: clay_pipe_and_twist
    name: Clay Pipe and Tobacco Twist
    description: "A short clay pipe and a twist of black tobacco in oilcloth."
    category: tool
    value: 15
    weight: 0.2
    rarity: common
    power_level: 0
    tags: [comfort, social]
    lore: "Offering the twist is the cheapest introduction in the Ward, and the most reliable."
    narrative_weight: standard

# Class loadouts — keys are the genre rules.yaml allowed_classes. Items resolve
# against the item_catalog above (mundane section only; charms never start in a
# pocket). Gold is in cents (currency above: dollars: 100).

starting_equipment:
  Gunslinger:
    - colt_pocket_revolver
    - oyster_knife
    - clay_pipe_and_twist
  Bounty Hunter:
    - colt_pocket_revolver
    - manacles_iron
    - wanted_handbills
    - bullseye_lantern
  Outlaw:
    - slungshot
    - brass_knuckles
    - oyster_knife
  Drifter:
    - hickory_club
    - bedroll_wool
    - oyster_knife
    - clay_pipe_and_twist
  Gambler:
    - pepperbox_pistol
    - deck_of_cards_plain
    - silk_cravat
  Marshal:
    - copper_star
    - hickory_club
    - bullseye_lantern
    - manacles_iron

starting_gold:
  Gunslinger: 50
  Bounty Hunter: 80
  Outlaw: 20
  Drifter: 15
  Gambler: 100
  Marshal: 60
