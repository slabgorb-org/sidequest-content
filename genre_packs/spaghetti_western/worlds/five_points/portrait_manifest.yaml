# =============================================================================
# five_points (spaghetti_western) — PORTRAIT MANIFEST
# =============================================================================
# Portrait prompt SPECS for the named diamonds and the world archetypes.
# Renderer: Z-Image Turbo (no negative_prompt; "no text" clause lives in the
# world positive_suffix which is appended to every render). Medium register:
# 1850s wet-collodion / daguerreotype studio plate, in the Mathew Brady
# Broadway gallery manner — the period-correct way a New Yorker of 1856-57
# was actually portrayed.
#
# DISCIPLINE (from PROMPTING_Z_IMAGE.md, hard-won):
#  - Every face is described as PHYSICAL FACT, never as impression/expression
#    editorial ("owlish", "manic", "unsettling" -> cartoon drift). Physical
#    features only; the narrator reads the personality.
#  - Every negation is phrased positively ("bareheaded or a plain cap", never
#    "no hat").
#  - Backdrops are neutral or symbolic (plain studio paper, a soot-stained
#    wall, lamplight) — NOT a specific canon POI, so a portrait never pins a
#    character to one location.
#  - Clothing and props are canonical SIGNATURES. Only what the character
#    actually carries/wears appears.
#  - Named colors render as a selective hand-tint over the sepia plate — used
#    sparingly (a waistcoat, a banner, a kerchief).
#  - "adult" stated for every human; SOUL-safe modesty clause in every entry.
# Mirrors the_real_mccoy/portrait_manifest.yaml schema exactly.
# =============================================================================

characters:

