  - name: John Morrissey
    role: Ascendant boss, ex-prizefighter, Tammany muscle
    type: npc_major_real
    appearance: >-
      1850s wet-collodion studio photographic plate, daguerreotype stillness,
      fine silver-grain, soft shallow focus, monochrome sepia with cool grey
      shadows. Chest-up portrait of an adult Irish-American man in his
      mid-twenties, large-framed and heavily muscled with a thick neck and
      broad shoulders, a square jaw, a slightly flattened prizefighter's nose,
      dark hair worn thick and combed back, dark side-whiskers, clean-shaven
      chin, dark steady eyes, a healed scar above one brow. Wearing a snug
      dark frock coat over a deep-wine silk waistcoat, a white high-collar
      shirt with a loosely knotted dark cravat, a heavy gold watch chain.
    culture_aesthetic: >-
      A gold signet ring and faintly scarred knuckles read plainly on the
      hand. Warm directional gaslight from one side, plain dark studio
      background.
    element_visual: >-
      No text, no caption, no title, no writing, no signature, no labels, no
      watermark, no border, no frame. Adult man, fully clothed, modest,
      correct human anatomy, natural hands and fingers, non-sexualized
      depiction.

