# Five Points — World Cartography
# Merged by world-builder: writer POI prose + art-director visual_prompt + structural adjacency.
# Bidirectional adjacency asserted. Post-1854 street names.

world_name: Five Points
starting_region: paradise_square
map_style: 'Hand-tinted ward survey of the Sixth Ward, New York, 1856: coal-smoke sepia wash, the five-cornered
  junction at Paradise Square inked at center, the buried Collect Pond ghosted blue under the street grid,
  ward boundary in iron-gall ink, Croton water-mains dashed, Castle Garden and the Battery at the southern
  margin, Currier & Ives lithographic border trim, post-1854 street names (Worth, Baxter, Park).'
regions:
  paradise_square:
    name: Paradise Square
    summary: The triangular contested heart of the ward, where Worth, Baxter, and Park come together with
      Little Water feeding in — one of the few open spaces in a slum that has no room to spare, cleared
      a generation ago over the buried Little Collect.
    terrain: urban plaza on sinking Collect-Pond fill
    visual_prompt: five_points, the five-cornered intersection where three muddy streets meet at a small
      triangular open lot, foot-deep mud and standing water filling the wagon-ruts in the foreground,
      a leaning three-storey brick grog-grocery on the left with a gaslight standard at its corner and
      a pig rooting at the gutter, soot-stained tenements crowding all five corners and tilting a degree
      off true on their sinking foundations, a knot of men in frock coats and plug hats standing wary
      in the middle distance, overcast coal-soot grey sky pressing low, Leone-tight standoff framing,
      the buried marsh ground glistening wet
    description: 'The triangular contested heart of the ward, where Worth, Baxter, and Park come together
      with Little Water feeding in — one of the few open spaces in a slum that has no room to spare, cleared
      a generation ago over the buried Little Collect. The ground is never dry; it gives a little underfoot,
      and a loaded wagon left standing too long sinks a finger''s width into it. Rynders''s green-groceries
      ring the triangle — oranges and onions in the window, a back room behind every one — and his saloons
      stand behind those. Pigs work the gutters. The smell is mud and privy and the sweet rot of the produce
      going over, with the river under it all when the wind turns. This is the standoff ground: where
      a crowd gathers, where a body turns up, where the boss comes to mediate and, on one July night,
      gets stoned for his trouble. Everything in the ward radiates from here, and so does every fight.'
    adjacent:
    - mulberry_bend
    - cow_bay
    - the_mission_block
    - almacks_baxter_cellars
    - the_docks
    - the_bowery
    - broadway_uptown
  mulberry_bend:
    name: Mulberry Bend
    summary: The badlands maze where Mulberry Street curves — Bottle Alley, Ragpickers' Row, Bandit's
      Roost — rear tenements crammed behind front ones and reached through blind passages a cart could
      not take.
    terrain: tenement maze, blind alleys
    visual_prompt: five_points, a crooked curve of a narrow tenement street choking into a maze of blind
      alleys, four-storey soot-blackened brick fronts leaning over a wet cobble-and-mud lane in the foreground,
      a rear tenement reached through a dark archway in the middle ground with washing strung on lines
      between the walls, heaps of rags and broken bottles and scrap iron banked against the alley mouth,
      a ragpicker's handcart abandoned at the kerb, the alley dead-ending in deep mourning-jet shadow
      under an overcast sky, grime and damp on every surface
    description: 'The badlands maze where Mulberry Street curves — Bottle Alley, Ragpickers'' Row, Bandit''s
      Roost — rear tenements crammed behind front ones and reached through blind passages a cart could
      not take. By mid-afternoon the daylight is gone in the deep courts; washing hangs grey between leaning
      brick blackened with grime, and the air is close with coal-smoke, wet rag, and the ammoniac sting
      of too many people and too few privies. This is where the scavenging economy lives: rags for the
      paper-mills, bones, bottles, scrap metal, all sorted and sold through the junk shops — and the same
      junk shops fence what was stolen the night before. A stranger learns fast not to stand with his
      back to a passage mouth. The fence and the fixer keep their business here, and so does everyone
      who needs a thing moved without a name on it.'
    adjacent:
    - paradise_square
    - cow_bay
    - the_mission_block
    - almacks_baxter_cellars
  cow_bay:
    name: Cow Bay
    summary: The dead-end sink at the foot of Little Water, named for an old inlet of the Collect that
      the slum grew over — the worst of the worst, the bottom of the bottom.
    terrain: dead-end slum cul-de-sac, low wet ground
    visual_prompt: five_points, a dead-end cul-de-sac sinking at the foot of a short muddy street, low
      sagging wood-frame and brick rookeries packed three deep around a fouled yard in the foreground,
      a single rear privy and a standing pool of black water reflecting the grey sky, a derelict tannery
      wall of stained brick closing the far end, ragged washing on a line above the alley, a thin coil
      of smoke from a bent stovepipe, no gaslight reaching this hollow, river-fog pewter light, the worst
      and lowest ground in the ward
    description: The dead-end sink at the foot of Little Water, named for an old inlet of the Collect
      that the slum grew over — the worst of the worst, the bottom of the bottom. Tanneries and rendering
      plants stood here before the tenements came, and the brick still holds their reek under the privy-stench
      and the damp; on a still night the smell sits in the cul-de-sac like water in a basin. The ground
      is the lowest and wettest in the ward, the cellars run with seepage, and the cholera came up out
      of a cellar near here twice in seven years. This is where the wakes are held in rooms with the corpse
      on the kitchen table, and where the old people swear the keening comes back off the dark end of
      the Bay when no living woman is crying. A place you go to die, to mourn, or to hide where even the
      ward's own would rather not follow.
    adjacent:
    - paradise_square
    - mulberry_bend
  the_mission_block:
    name: The Mission Block
    summary: 'The footprint of the Old Brewery, gone these five years, and on its grave an island of order:
      the Five Points Mission on Park Street and, across the way, the House of Industry with its sewing-shop,
      schoolroom, and subsidized rooms.'
    terrain: reform-institution block
    visual_prompt: five_points, a broad cleared lot where a notorious rookery once stood, a plain four-storey
      whitewashed mission building of clean bone-plaster-cream brick on the right with shuttered windows
      and a railed stone stoop, a lower House-of-Industry workshop across the lane with women's plain
      bonnets visible at its long windows, a swept plank sidewalk and a single young tree in a wooden
      guard in the foreground, the surrounding tenements held back at the lot edge, soft even overcast
      light, an island of order in the grime
    description: 'The footprint of the Old Brewery, gone these five years, and on its grave an island
      of order: the Five Points Mission on Park Street and, across the way, the House of Industry with
      its sewing-shop, schoolroom, and subsidized rooms. It is the one clean-swept, well-lit, warm-smelling
      block in the ward — lamp oil and lye soap and something honest on the stove, the clack of the needle
      and children''s voices at their letters through the wall. It is also the one block where the price
      of warmth is your rosary at the door and your child made new. The ward''s poorest come here when
      the cold or the hunger leaves no choice, and the parish resents every soul that does. Brave women
      walk these rooms where the police will not go, doing real good and real harm in the same gentle
      breath.'
    adjacent:
    - paradise_square
    - mulberry_bend
  almacks_baxter_cellars:
    name: Almack's & the Baxter Street Cellars
    summary: THE FLOOR.
    terrain: below-grade dance and oyster cellars
    visual_prompt: five_points, the interior of a low below-grade dance cellar reached by worn steps from
      the street, a packed earth-and-plank floor, a fiddler on a barrel-head platform on the left and
      a long plank bar on the right, a crowd of mixed Black and Irish dancers of various classes mid-reel
      and mid-shuffle in the candle-lit center with a long-exposure motion blur smearing their limbs,
      tallow candles in tin sconces and a single bright red kerchief on the stout landlady at the bar,
      low soot-stained beams overhead, warm candle-tallow glow against deep shadow, ecstatic and crowded
      and fragile
    description: THE FLOOR. Down a stair off Baxter, below the oyster cellar, Pete Williams's dance hall
      — a shilling at the door and no question who you came in beside. Candlelight and the heat of two
      hundred bodies, fiddle and bones and the stamp and shuffle of the best floor in the Points, the
      air thick with tallow smoke, spilled beer, sweat, and the salt of the oysters from the cellar next
      along. Black and Irish, sailor and seamstress, the gentleman come slumming and the ragpicker, all
      of them exactly the same height on these boards and not one taller. Master Juba cuts the floor until
      the room tips over into something the priest would call possession. It is the only democracy the
      bottom rung of the ward will ever stand in — fragile, ecstatic, and pressed now from above by the
      Mission's closing-orders and the nativist tide.
    adjacent:
    - paradise_square
    - mulberry_bend
  the_docks:
    name: The Docks
    summary: The East River and North River waterfront the ward feeds with its men — longshore labor,
      the casual hiring that is the Irishman's wage when the needle and the scavenge run out, and under
      it the smuggling and the pilferage that the fences turn over uptown.
    terrain: river waterfront, longshore labor
    visual_prompt: five_points, a working East River wharf of weathered timber piers at low grey tide,
      a forest of ship masts and furled sail crowding the slips in the background, stacked cotton bales
      and barrels and a cargo net on the foreground planks, longshoremen in flannel shirtsleeves and waistcoats
      hauling a sling-load in the middle ground, a coal-laden lighter moored two-deep at the timber wharf,
      river-fog pewter light, oily black water slapping the piles, coal-soot sky above the rooflines
    description: The East River and North River waterfront the ward feeds with its men — longshore labor,
      the casual hiring that is the Irishman's wage when the needle and the scavenge run out, and under
      it the smuggling and the pilferage that the fences turn over uptown. The smell is tide-mud and tar
      and rope and rotting piling; the sound is the shouted gang-boss, the creak of the boom, the slap
      of water on the pier. A man stands at the morning hiring and takes what the boss gives, and the
      boss takes what Tammany tells him, and the dock job is a favor that becomes a debt the moment it's
      offered. Work, smuggling, and the machine's reach all meet at the water's edge, where the ward earns
      the little it earns and owes for the privilege.
    adjacent:
    - paradise_square
    - castle_garden
  the_bowery:
    name: The Bowery
    summary: B'hoy turf, the nativist heart, a wider and brighter street than anything in the Points proper
      — gaslit theaters, oyster saloons, the engine-houses of the volunteer fire companies with their
      machines polished like altars.
    terrain: broad gaslit theater street (ward edge)
    visual_prompt: five_points, a wide gaslit commercial avenue at dusk, a volunteer fire-company house
      with tall arched engine doors and a hand-pumper visible inside on the left, a theater front with
      a lamp-lit marquee of blank weathered boards in the middle distance, b'hoys in red firehouse shirts
      and stovepipe hats with greased soaplocks lounging at the corner in the foreground, a gaslight standard
      throwing amber on wet cobbles, taller brick blocks than the slum behind, coal-soot sky going to
      deep blue, the nativist heart of the city's edge
    description: B'hoy turf, the nativist heart, a wider and brighter street than anything in the Points
      proper — gaslit theaters, oyster saloons, the engine-houses of the volunteer fire companies with
      their machines polished like altars. The sound is brass and barkers and the clang of a fire-bell,
      the smell is cigar smoke and lamp oil and frying. Here the native-born b'hoy holds court in his
      red shirt and soaplocks and stovepipe, loyal to his company past sense, and here Poole is toasted
      by name a year and more after Stanwix Hall. American Party money moves quietly through the engine-houses.
      It is a place of pride and performance and rentable muscle, a step up out of the mud and a world
      that means to keep the Points and its Famine flood firmly below it.
    adjacent:
    - paradise_square
    - kleindeutschland
    - broadway_uptown
  kleindeutschland:
    name: Kleindeutschland
    summary: Little Germany, up along Avenues A and B — pointedly, deliberately neutral, the third presence
      that proves the two-sided holy war is a lie.
    terrain: German skilled-trade district (ward edge)
    visual_prompt: five_points, a clean-swept German commercial avenue of three- and four-storey brick
      row-houses, ground-floor lager-beer halls and a cabinetmaker's workshop with shutters open on the
      left, a brewery dray with two heavy draft horses at the kerb in the foreground, orderly gaslight
      standards down the middle distance, a pair of men in sober dark coats and a woman with a market
      basket on the plank walk, weathered blank shop-board signage, overcast grey light, pointedly tidier
      and more sober than the Irish ward
    description: 'Little Germany, up along Avenues A and B — pointedly, deliberately neutral, the third
      presence that proves the two-sided holy war is a lie. Where the Points is casual labor and scavenge
      and the needle, this is skilled trades: cabinetmakers and locksmiths and tailors and, above all,
      brewers, organized through an imported guild system. Avenue A runs to lager halls and oyster saloons;
      Avenue B, the German Broadway, to the commercial trade. The smell is sawdust and fresh-cut wood
      and lager, the sound is German in four dialects and the scrape of the plane and the lathe. It is
      a place to flee to, to buy a good cabinet or a sound lock from, or to drink a clean beer in and
      be left alone — not a deep playable zone, but proof that the ward''s war is a choice some people
      simply decline to make.'
    adjacent:
    - the_bowery
  castle_garden:
    name: Castle Garden / the Battery
    summary: The round stone fort at the southern tip of the island, the emigrant landing depot, fenced
      off the year before to keep the runners off the new arrivals — the map's entry point for everyone
      who came off a boat.
    terrain: harbor emigrant depot (ward edge)
    visual_prompt: five_points, the round stone walls of the old Battery fort converted to an immigrant
      landing depot, seen from the muddy waterfront approach, a high board fence ringing the depot to
      hold back the touts in the foreground, a crowd of fresh-landed Famine emigrants in homespun and
      shawls clutching bundles and sea-chests in the middle ground, a moored sailing packet and a harbor
      of masts behind under river-fog pewter haze, runners in loud checked coats pressing at the fence
      line, gulls over the water, cold wet morning light off the bay
    description: 'The round stone fort at the southern tip of the island, the emigrant landing depot,
      fenced off the year before to keep the runners off the new arrivals — the map''s entry point for
      everyone who came off a boat. Salt and tar and wet wool and the press of a thousand bewildered people;
      gulls, harbor wind, the creak of moored ships. Inside the fence: honest money-changing, the true
      fare, a doctor for your eyes, a word on a boarding-house. Outside it, working the rail like gulls
      of their own, the runners — soft homeland accents, good coats, a fast naturalization to sell with
      the vote already bought. It is a mercy and a harvest and, for the Famine Irish keened over before
      they sailed, a resurrection — and which of the three a soul meets at the gate is only luck.'
    adjacent:
    - the_docks
    - broadway_uptown
  broadway_uptown:
    name: Broadway / Uptown
    summary: The respectable city — broad and paved and gaslit, plate glass and marble, Stanwix Hall where
      Poole took the pistol-balls and where the native-born come now to stand on the spot and say his
      last words; City Hall, the white marble theater of the police war; the ward's "frontier line" toward
      the power that governs it from above.
    terrain: paved respectable city (ward edge)
    visual_prompt: five_points, a broad respectable uptown avenue at midday, cream stone and brick Italianate
      commercial fronts and a five-storey marble-faced hotel with iron balconies on the left, gaslight
      standards every sixty feet down a clean swept walk, a horse-drawn omnibus and a private carriage
      with matched bays in the middle of the avenue, well-dressed gentlemen in top hats and ladies in
      hooped day-dresses on the foreground sidewalk, the hotel where a famous man was shot standing quiet
      as a pilgrimage site, soot-thinned grey sky, the world's line toward power
    description: The respectable city — broad and paved and gaslit, plate glass and marble, Stanwix Hall
      where Poole took the pistol-balls and where the native-born come now to stand on the spot and say
      his last words; City Hall, the white marble theater of the police war; the ward's "frontier line"
      toward the power that governs it from above. The smell is clean stone and horse and money instead
      of mud and privy; the sound is carriage wheels on pavement that the Points will never have. This
      is where the law fights itself on the steps, where the machine bribes and the reformers reach over
      the city's head, and where a man from the Points is tolerated as a curiosity and watched as a threat.
      The power that decides the ward's fate lives up here and almost never comes down.
    adjacent:
    - paradise_square
    - the_bowery
    - castle_garden
