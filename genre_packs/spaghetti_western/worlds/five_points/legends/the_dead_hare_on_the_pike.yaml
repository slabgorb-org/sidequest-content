id: the_dead_hare_on_the_pike
name: The Dead Hare on the Pike
era: the standard ongoing; the name fastened on c. 1850s
description: >-
  This is the strangest relic in the ward, because it may be the colors of a
  gang that never was. The story the Baxter Street men tell: some Bowery
  reporter, leaning on Bowery sources, called the pro-Wood Roach men the "Dead
  Rabbits" — street slang, a slur, a tough or a thief — and printed it as if it
  were a regiment with officers and a muster roll. The Five Points men did not
  know the name. And then, the tale runs, in the middle of a faction quarrel one
  of them caught a dead hare, ran it up on a pike, and carried it into the fight:
  if that is what you call us, then here are our colors, come and take them. So
  the standard was born of a slur thrown back. And the standard is realer now
  than the gang it stands for. Men rally to the hare on the pike who could not
  tell you who their captain is or whether they have one. The relic men say that
  carry it into a brawl and the Roach lads come to it like iron to a lodestone,
  and the other side feels a cold drop in the gut at the sight. Whether that is
  the relic or only the memory of every fight it has flown over, no one can prove.
  A gang that is half a journalist's invention has a battle-flag people will die
  under. In the Sixth Ward the legend does not commemorate the fact. It outlives
  it. It out-reals it.
