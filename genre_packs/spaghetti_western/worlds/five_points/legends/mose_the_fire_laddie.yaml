id: mose_the_fire_laddie
name: Mose the Fire-Laddie
era: the stage Mose from 1848; the folk-giant ongoing
description: >-
  There was a real Moses Humphrey, a printer and a volunteer fireman of the
  Bowery, and then there was Mose, who was never a man at all but the size the
  Bowery wishes it were. The stage made him first — A Glance at New York, '48,
  the red-shirted b'hoy in his soaplocks and stovepipe stalking the boards — and
  the ward took him off the stage and made him eight feet tall. They will tell
  you Mose tore a lamppost out of the cobbles to beat back a rival company off
  the hydrant. That he swam the Hudson in two strokes and carried a horsecar of
  passengers across on his shoulders. That his fire-trumpet, when he set it to
  his lips, was heard in Brooklyn and rallied every red shirt in the Sixth Ward
  to the blaze. He is the Bowery Boy made myth — native, brawling, loyal to the
  company and the company alone — and that is why the relic men say a fireman's
  speaking-trumpet that has rallied a real company in a real fire takes on a
  little of Mose, and will rally your own laddies once when the night goes bad.
  Whether it does, or whether sixteen frightened men simply ran toward a familiar
  horn, the trumpet does not say. Mose never settled anything either. He was only
  ever the answer to the question of how big a fireman could be if the answer were
  allowed to be a lie.
