id: the_old_brewery_a_murder_a_night
name: The Old Brewery — A Murder a Night
era: built 1792, a tenement from 1837, demolished December 1852
description: >-
  Ask an old hand and he will tell you the Old Brewery was the worst building
  in the worst ward in America, and he will tell it like Scripture. Coulthard
  brewed beer there at the turn of the century, southeast of the Collect; the
  Panic of '37 broke the trade and the brewery filled instead with people — two
  hundred and more crammed into five-and-thirty rooms, a thousand across its
  years, the census takers said, though the census takers did not go into the
  cellar. A murder a night, the tale runs, for fifteen years, and the bodies
  passed out through the cellar to the Cow Bay where no one asked. A blind
  passage they called Murderers' Alley. Children born in its rooms who never
  saw the street. The Ladies' Home Missionary Society bought it in '52 and tore
  it down stone from stone, and on its grave they raised the Mission — but the
  ward will tell you that the digging turned up bones in the cellar fill, more
  than the years could account for, and that the lowest course of the Mission
  wall is set on a layer nobody consecrated. The Mission says this is slander
  meant to frighten the saved back to Rome. The ward says go down to the Bay on
  a still night and listen. Both have been saying it since the building came
  down, and the building has been gone five years.
