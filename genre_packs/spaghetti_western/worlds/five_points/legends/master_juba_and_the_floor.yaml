id: master_juba_and_the_floor
name: Master Juba and the Floor at Almack's
era: Dickens saw him 1842; kept alive on the floor in 1856
description: >-
  Down the stair off Baxter, below the oyster cellar, is the only democracy the
  Sixth Ward has. A shilling at the door and no question who you came in beside —
  black and Irish, sailor and seamstress, the gentleman come slumming and the
  ragpicker come to forget, and on Pete Williams's boards they are all exactly
  the same height and not one of them taller. The English novelist came once, a
  dozen and more years gone, and wrote of the wit of the assembly, the greatest
  dancer known — William Henry Lane, Master Juba, the man who married the Irish
  step to the African shuffle on one set of boards and made a thing that had been
  danced nowhere on earth before. And he is still on the floor. Cutting it when
  the spirit takes the room, single shuffle and double shuffle, cross-cut and
  snap, the fiddle going at it tooth and nail and new brightness in the very
  candles — until the room tips over into something the priest would call
  possession and the Mission would call sin and the dancers would call only the
  best night of a hard week. The relic men whisper that Juba's worn-out shoes, or
  a plank prised from the floor he has danced to splinters, carry the floor's own
  charge: hold them and for one turn no man in the room outranks you. Whether
  that is the relic or only the truth of the place — that on this floor and
  nowhere else above it the powerless are equal — Pete Williams will not say. He
  only takes your shilling and opens the stair one more night, with the nativist
  handbill on the door and the reform deputation at the top of it, because the
  one free space stays free as long as someone is willing to dance in it.
