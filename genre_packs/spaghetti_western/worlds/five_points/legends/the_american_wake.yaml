id: the_american_wake
name: The American Wake — Keened Before They Sailed
era: the rite ongoing through the Famine years
description: >-
  The greenest thing a native-born can fail to understand about the Famine Irish
  is that they came ashore at Castle Garden already dead. Not in body — in rite.
  In the old country, when a young man or woman took the emigrant boat for America,
  the family held the American wake the night before: the same wake they would
  hold over a corpse. The clocks stopped, the songs were sung, the keening women
  keened, and the people who would never see the emigrant again mourned them as
  good as in the ground — because America was as far as the grave and the letters
  home were the letters of a ghost. So every Famine adult in the Sixth Ward has
  been waked once already, on the far side of an ocean, before ever they walked
  down the gangway. They are their own ghosts, the old people say, walking the
  ward they were buried out of Ireland to reach. It is why the wakes here are so
  fierce and so merry both — a people who have already died once do not fear a
  second wake, and will revel beside a corpse till two in the morning to spite
  death twice over. And it is why the runner at the Castle Garden fence, taking a
  newcomer's arm, is fleecing a man the man's own family has already grieved. The
  Garden is a gangway, a vote-harvest, and a resurrection, and which one a soul
  meets there is only luck.
