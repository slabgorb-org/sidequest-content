id: i_die_a_true_american
name: "Bill Poole — 'I Die a True American'"
era: shot February 25, 1855, died March 8, buried Green-Wood March 11
description: >-
  Here is the gap, and the gap is the whole of it. The fact: William Poole was
  a Bowery butcher and a Know-Nothing street champion, a brawler who confronted
  the prizefighter John Morrissey at Stanwix Hall on the Broadway, took three
  pistol-balls from Lew Baker and Jim Turner two nights running, and died of
  them after eleven days. His killers stood three trials and walked on three
  hung juries; the whole city knew who fired and no jury would say so. A brutal
  man, killed in a squalid factional quarrel that the newspapers dressed up as a
  war of nations. That is the fact. The legend is finer. They say his last words
  were "Goodbye boys — I die a true American," and whether he said them or a
  reporter said them for him, the Bowery took them up like a creed. Thousands
  followed the bier to Green-Wood; they draped the flag on him; the phrase
  became a rallying cry at every nativist box in the city. And the relic — the
  cleaver, the butcher's blade — draws its whole charge from the legend and none
  from the man. A native-born will pay for a chance to hold it and swears it
  rattles the enemies of America. An Irishman will tell you it is just a knife
  that killed pigs, and that the saint it served was a thug. The blade does not
  settle the argument. It is the argument, in iron.
