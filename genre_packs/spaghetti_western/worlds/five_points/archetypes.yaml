- name: The Fence / Fixer
  description: The broker of the Baxter Street and Mulberry Bend underworld — moves stolen goods through
    the junk shops that also buy the honest rags and bones and bottles, and moves information through
    the same channels, and cannot always tell you which trade he values more. He knows who robbed whom,
    who is selling which vote, which copper has a lawful star this week, and where a body went. He sells
    all of it to whoever pays, asks no banner, and survives by being too useful to every faction for any
    of them to be rid of him. The one man in the ward who profits no matter which way the next fire burns.
  personality_traits:
  - values information above goods, and goods above loyalty
  - useful to everyone, owned by no one, trusted by none
  - fences the stolen rosary and the stolen secret with the same shrug
  - knows the ward's hidden hands because he brokers for all of them
  - profits whichever way the riot goes
  dialogue_quirks:
  - low, transactional, "everything's for sale, friend; the question is the price"
  - prices a secret out loud the way a grocer prices an onion
  - never gives a thing away, never quite refuses a thing either
  - speaks of all factions in the same flat appraising tone
  banner: An honest dealer in old clothes and second-hand goods, Baxter Street.
  hand: Fences stolen goods and stolen secrets; broker to every faction at once.
  motivation: Stay the indispensable middleman to every hand in the ward, take a cut of every secret and
    every stolen thing, and be the one man still in business the morning after the fire.
  archetype_of: The Broker
