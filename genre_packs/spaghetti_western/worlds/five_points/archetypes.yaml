- name: The Keening Woman
  description: The bean caointe, the death-rite seer of the ward — Maggie Doyle, last of the Lower Hill
    keeners, paid in whiskey to sing the family's grief over the corpse in a structured improvised lament
    the priest disapproves of and cannot suppress. She has keened more of the Sixth Ward across than anyone
    living. She says she knows when a man is marked, and has a shawl she'll let you hold for a consideration,
    and the court has buried two this month who held it and laughed. Whether she truly sees death coming
    or only knows the ward well enough to guess right, she is the Witness — the one who sees the death
    under the lies.
  personality_traits:
  - sees who is marked, or sees the ward clearly enough to seem to
  - keeps the old rites against priest and Mission both
  - paid in whiskey and pays attention in return
  - mourns professionally and means it anyway
  - unafraid of the dead, wary of the living who don't fear them enough
  dialogue_quirks:
  - keens in the old structured way, half-song half-speech
  - speaks plainly between, dry as a stone, "he's marked, that one"
  - names the dead by their people, never by their faction
  - offers the shawl the way a card-sharp offers a cut
  banner: Keeper of the death-rite — the one who sings the dead across.
  hand: (no faction; the Witness owes no banner) — but knowledge is its own currency.
  motivation: See the ward's dead waked properly, keep the old rite alive, and trade the one thing she
    truly has — knowing who is marked — for what whiskey and coin and standing the ward will give her.
  archetype_of: The Witness
