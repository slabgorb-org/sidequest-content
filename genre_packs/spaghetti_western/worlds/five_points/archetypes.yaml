- name: The Free Black Proprietor
  description: 'The keeper of the floor — Pete Williams, or a man cut to his pattern: a free Black proprietor
    of a Baxter Street dance cellar, the one free space in the Sixth Ward, where for a shilling and no
    questions the most powerless people in America are all the same height on his boards. He has no machine
    behind him and a ballot the property law has barred, and what he holds instead is moral — sanctuary,
    knowledge, the trust of everyone the machine ignores, and the only democracy the bottom rung of the
    ward will ever stand in. He has seen every kind of trouble come down his stair. He is the conscience
    of the world.'
  personality_traits:
  - the moral center; the one who has seen it all and stayed
  - holds power that is cultural and informational, never brawn
  - opens the stair one more night against the closing tide
  - measures a stranger by how they treat the people with the least
  - carries the weight of being unfranchised without performing it
  dialogue_quirks:
  - calm, spare, weighs each word, "we keep the floor open. That's all we keep."
  - asks a stranger one quiet question that turns out to be the whole test
  - speaks of the dancing as a right, never as a charity
  - says less than he knows and knows more than the machine
  banner: Keeper of the one free space — the floor where the powerless are equal.
  hand: (no hidden hand; the absence is the point) — moral standing, not muscle.
  motivation: Keep the floor open and free for as long as one person will dance on it; hold sanctuary
    and the truth of the place against reform and nativist tide both; bear witness to a ward that would
    rather not be seen clearly.
  archetype_of: The Witness
