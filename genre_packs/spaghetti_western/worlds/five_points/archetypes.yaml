- name: The Divided Copper
  description: A policeman who cannot say, this week, whether his own star is lawful. When Albany raised
    the Metropolitans over the Mayor's head and the Mayor kept his Municipals anyway, every patrolman
    in the city woke up serving one of two forces that do not recognize each other's warrants and will
    brawl on the City Hall steps rather than answer a third party. He is loyal to the ward he walks, paid
    by one force, and liable to be arrested by the other for the arrests he makes. He is the law in a
    season when there are two laws, and calling him for help means choosing which law you think is real.
  personality_traits:
  - loyal to his beat, uncertain of his commission
  - tired in the particular way of a man whose authority keeps changing
  - decent by instinct, compromised by the war he didn't start
  - knows the ward's faces and which of them to not see tonight
  - every arrest a gamble on which law holds by morning
  dialogue_quirks:
  - weary, careful, "and whose warrant would that be, now"
  - hedges jurisdiction the way other men hedge bets
  - speaks of the other force the way one speaks of a faithless brother
  - gives a straight answer only about the ward, never about Albany
  banner: The law — order, the peace of the ward, the star on the coat.
  hand: Which law? The machine's enforcer or Albany's reach — and he can't always say.
  motivation: Keep his beat and his neck through a war between two governments, do a little good where
    the divided law allows it, and survive until somebody decides which star is real.
