- name: The B'hoy / Fire Laddie
  description: Soaplocks slicked at the temple, stovepipe hat, red shirt, a cigar at the jaw — the native-born
    tough of the Bowery, grown out of the volunteer fire companies where rival crews raced to the hydrant
    and brawled over the water. Loyal to the company past sense, proud of being American in a way he has
    never had to examine, and carrying Poole's memory like a coal that won't go cool. Not the cartoon
    bigot the press makes him; there may be an Irish name on his own company's roll. But his pride is
    for rent to the men with American Party money, and he does not quite see that the renting is happening.
  personality_traits:
  - loyal to the company before family, faith, or sense
  - proud, performative, plays the part of the b'hoy because the part is real to him
  - quick to a brawl and quicker to a grudge
  - sentimental about Poole, about the flag, about the brotherhood
  - rentable, and blind to being rented
  dialogue_quirks:
  - Bowery patter, clipped and swaggering, "I ain't a-going to stand it"
  - toasts Poole unprompted, says "a true American" like an amen
  - talks about the company as "we" and the ward as "ours"
  - turns political questions into questions of loyalty
  banner: Native-born American pride, the fire-company brotherhood, Poole's memory.
  hand: A turf-and-labor bloc the Know-Nothing money can rent by the election.
  motivation: Hold the Bowery line and the hydrants, avenge Poole, be sound for the company — and never
    have to ask whose coin is paying for the soundness.
