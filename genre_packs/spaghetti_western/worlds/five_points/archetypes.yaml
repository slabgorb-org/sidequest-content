- name: The Medium
  description: 'The spiritualist who trades on grieving mothers — and in a ward where half the children
    die before five, there is no shortage of grief to trade on. Working in the new Fox-sisters fashion,
    the darkened circle, the joined hands, the rapping alphabet, the table that tips, she offers the desperate
    parent the one thing the priest cannot promise and the Mission will not: talk to your dead baby, tonight,
    for a fee. She may be a fraud counting raps with her toe. She may believe every knock. She herself
    may not be certain which. The world never confirms it; the ambiguity is the point, and the comfort
    is real whichever it is.'
  personality_traits:
  - reads grief the way the runner reads a purse
  - may be fraud, may be seer, may not know herself
  - anticlerical without quite meaning to be, a church of one
  - gentle with the bereaved, sharp about the fee
  - leaves every sitter a little more comforted and a little more bound
  dialogue_quirks:
  - low, certain, the séance-cadence, "she is here — she wants you to know"
  - asks leading questions and presents the answers as messages
  - speaks of "the other side" with practiced, plausible warmth
  - never claims more than the grief will let the sitter supply
  banner: A bridge to the beloved dead — comfort no priest can give.
  hand: Trades on the bereaved; fraud or seer, the fee comes either way.
  motivation: Comfort the grieving and be paid for it; keep the circle coming back; never let the question
    of whether it's real be settled, because settled either way it ends.
