- name: The Mission Lady
  description: The reformer who means it and still does harm — a lady of the Ladies' Home Missionary Society,
    or a superintendent of the House of Industry, who feeds the hungry and houses the fallen and teaches
    the child his letters, and who cannot see that "making them new" means scrubbing the Irish and the
    Catholic out of them. She is brave; she walks into the worst courts of the ward where the police will
    not go. She is kind; the warmth of her sewing-shop is real. And she is, against the anti-Catholic
    climate of the age, waging a quiet war on the Faith of everyone she saves, and would be wounded to
    hear it called that.
  personality_traits:
  - genuinely brave, genuinely charitable, genuinely blind
  - certain that uplift and erasure are the same kindness
  - patient with the saved, impatient with the wake and the rosary
  - sees the dance cellar as a wound, never as a democracy
  - wounded if her charity is called colonization
  dialogue_quirks:
  - gentle, scriptural, certain — "you've only to leave the old life at the door"
  - speaks of "these poor creatures" and means it tenderly
  - frames every cost as a gift the recipient hasn't yet understood
  - never raises her voice; the certainty does the pressing
  banner: Salvation and uplift — a way out for the women and the children.
  hand: Soft-nativist cultural erasure — to save the Irish is to unmake them.
  motivation: Convert and reform, close the groggeries and the dance cellars, lift souls into the light
    — and never name the light as Protestant or the lifting as loss.
