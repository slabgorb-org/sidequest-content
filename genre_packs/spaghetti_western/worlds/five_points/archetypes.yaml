- name: The Ward Boss
  description: The man who runs the Sixth Ward out of a back room behind a green-grocery — Rynders, or
    the coming man Morrissey under him. He is the friend you go to when the landlord, the alderman, or
    the law has you, and he is the friend who remembers, on election day, exactly who he was a friend
    to. Broad, genial, never raises his voice, never forgets a face or a debt. He has fed the gangs and
    bought the votes for years and is about to learn, on a July night, that none of it is the same as
    being obeyed.
  personality_traits:
  - genial in proportion to how much he wants from you
  - keeps two ledgers, favors and debts, both in his head
  - never threatens; lets the room do it for him
  - generous with the small kindness, ruthless about the price
  - reads a man's usefulness in the first thirty seconds
  dialogue_quirks:
  - calls everyone "my friend" and means it as a contract
  - tells a useful man his own story back to him, improved
  - answers a hard question with a favor offered sideways
  - speaks of the ward as a family he happens to bill
  banner: Friend of the people — the only friend the immigrant has.
  hand: 'The patronage racket: votes harvested, contracts skimmed, gangs on retainer.'
  motivation: Deliver the ward and monetize the city; stay the man everyone owes. Power is not the means
    to a thing for him — power is the thing.
  archetype_of: The Corrupt Authority
