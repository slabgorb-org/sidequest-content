- name: The Runner
  description: The Castle Garden tout — clean coat, soft Cork voice, a boarding-house and a money-changer
    and a fast naturalization all to sell, and a cut coming to him on every one. He works the rail of
    the fence the depot put up to keep him out, taking the newcomer's arm at the gate before the boots
    are dry. Some of the runners are Tammany shoulder-hitters who guard the boxes on election day; the
    vote he's selling you was bought before you landed. He is the one hand in the ward the player sees
    plainly, because a predator-broker does not bother to hide.
  personality_traits:
  - warm as a brother for exactly as long as the mark is worth it
  - knows every fleece, fare, and false friend in Lower Manhattan
  - works for a cut from three men at once and feels clever about it
  - sells the vote he was already paid to deliver
  - has no banner and feels no need of one
  dialogue_quirks:
  - soft homeland accent deployed like a tool, "sure I'll see you right"
  - reassuring, hurrying, never quite letting go of the rope
  - knows just enough true help to make the false help credible
  - vanishes mid-sentence when a better mark appears
  banner: A friend to the newcomer — the first kind face in America.
  hand: 'Predator-broker: fleece the arrival, deliver the pre-bought vote, take the cut.'
  motivation: Take a cut off every desperate soul coming down the gangway, and stay useful enough to the
    machine that the law at the fence never quite catches him.
