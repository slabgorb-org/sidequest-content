- name: The Roach Brawler
  description: 'A Sixth Ward parish tough, Famine-born or Famine-bred, who fights for his own and calls
    it nothing grander than that. The press calls him a Dead Rabbit; he will tell you there is no such
    gang, or that there is and he''s proud of it, depending on the day and who''s asking. He defends the
    parish and the kin who came off the boats behind him, and he is also Wood''s muscle by retainer at
    the boxes on election day, and he does not feel the contradiction because to him it is one thing:
    you protect your own, and the machine is how you do it.'
  personality_traits:
  - fights for his own and asks no further reason
  - defiant about the slur turned standard, the hare on the pike
  - devout in the rough parish way, rosary in the pocket, wake before Mass
  - answers to the ward captains and through them to the machine
  - carries the Famine in him without naming it
  dialogue_quirks:
  - Munster-inflected, fast, fond of the defiant boast
  - Dead Rabbits, is it? Aye, and what of it
  - swears by the saints and the parish in the same breath as a threat
  - says "our own" the way the b'hoy says "the company"
  banner: Irish-Catholic defense of their own — the parish, the kin, the Faith.
  hand: Pro-Wood electoral muscle; the men who guard the right boxes.
  motivation: Protect the parish and the arrivals, hold the streets and the votes, and answer the captain's
    call without ever calling it being owned.
