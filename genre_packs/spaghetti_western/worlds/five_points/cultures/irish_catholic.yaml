name: Irish Catholic
summary: The ward majority — Famine emigrants from Munster and Connacht packed into
  the Sixth Ward; laborers, cartmen, hod-carriers, domestics, groggery-keepers, and
  the gang muscle of the Roach Guards
description: 'The mass Irish-Catholic cohort that filled the Sixth Ward after the
  Great Hunger — Munster and Connacht country people landed at Castle Garden from
  1847 onward, crowded into the rear tenements of Mulberry Bend, the rookeries of
  Cow Bay, and the cellars off Baxter and Worth Streets. Day laborers and hod-carriers,
  longshoremen on the docks, cartmen, washerwomen and domestics, groggery and
  green-grocery keepers around Paradise Square. Old St. Patrick''s on Mott Street
  is the mother parish and Archbishop "Dagger John" Hughes its militant shepherd.
  The wake, the rosary, the keening woman (bean caointe), poteen and the union of
  the parish against the nativist and the reformer alike. The "Dead Rabbit" was a
  slur the press pinned on them and they flew it back on a pike. The Bridget domestic
  and the Paddy laborer were the cartoons the native-born drew of them; the ward
  was the answer they made.

  '
