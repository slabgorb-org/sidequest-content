name: Anglo-American Nativist
summary: The native-born Protestant b'hoys — the Bowery fire-laddies, soaplocks and
  red shirts; old-stock American surnames; the Bowery Boys and Bill Poole's memory
description: 'The native-born American Protestant cohort of the Bowery and its
  fringes — the b''hoys: volunteer firemen and fire-company runners, butchers and
  market men, mechanics and shipwrights, prizefighters and shoulder-hitters, in
  soaplocks, stovepipe hats, and the red flannel shirt. Old-stock English and
  Yankee descent, generations in America, Protestant, and loud about it. The
  fire-company brotherhood and the engine house are their parish; the Bowery
  theater, the saloon, and the political club their halls. They fly the banner of
  native-born American pride and the memory of Bill Poole, shot at Stanwix Hall —
  the martyr-cleaver of the cause. Beneath it, a turf-and-labor bloc, anti-Wood,
  ready to be bought by Know-Nothing money. Not cartoon haters: the b''hoy world
  could carry Irish names in its own ranks. Naming runs to the plain Anglo-American
  register — William, George, Henry, Andrew — over old English and Yankee surnames:
  Poole, Walling, Baker, Turner, Walker, Stevens.

  '
