positive_suffix: period 1850s New York City, wet-collodion albumen photographic plate, fine silver-grain,
  slightly soft daguerreotype focus, monochrome sepia tonality with cool grey shadows, gaslight and coal-soot,
  damp muddy streets, soot-stained brick, overcast sky, lantern-lit and candle-lit interiors. Storefronts,
  posters, broadsides, shop signs, and printed matter in frame are weathered blank wood or paper with
  abstract ink and paint scars rather than legible writing. No text, no caption, no title, no writing,
  no lettering, no inscription, no signage, no posters with words, no newspaper text, no masthead, no
  headline, no street sign, no signature, no watermark, no logo, no border, no frame, no date stamp, no
  modern signage, no clean pavement, no color film, no desert, no mesa, no cactus, no cowboy hat, no open
  frontier, no film still.
