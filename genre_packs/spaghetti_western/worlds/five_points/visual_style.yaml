period_anchor: 1856-1857 Five Points, Sixth Ward, Lower Manhattan
period_constraints:
  technology_ceiling: 1856-57 — gaslight street and interior lamps, kerosene and whale-oil lamps, tallow
    candles, hand-pumped volunteer fire engines and hose reels, no electric light, no telephone, no automobile,
    no paved asphalt, no skyscraper
  clothing_ceiling: 1856-57 — frock coats, sack coats, waistcoats, stovepipe and plug hats, the b'hoy's
    soaplocks and red firehouse shirt, hooped or plain crinoline day-dresses, shawls, bonnets, working-women's
    plain wool, immigrant homespun and shawls; no bustle (post-1869), no Edwardian line, no 20th-century
    dress
  architecture_ceiling: 1856-57 — low brick and wood-frame tenements three to five storeys, Greek Revival
    and early Italianate commercial fronts, rear tenements behind blind alleys, below-grade cellar dwellings
    and dance cellars, no cast-iron skyscraper, no steel frame, no Beaux-Arts
  photography_medium: daguerreotype and ambrotype on glass, wet-collodion albumen print; carte-de-visite
    format spreading by 1857; no dry plate, no film, no halftone
  illumination_real: gaslight (street standards and interiors), kerosene and whale-oil lamp, tallow candle,
    hearth and forge firelight, the fire company's pitch torches — no incandescent, no arc-light
