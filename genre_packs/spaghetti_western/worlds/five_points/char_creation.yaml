# Five Points — World-level character creation override.
#
# The genre pack's spaghetti_western/char_creation.yaml has 5 scenes (origins,
# crucible, reputation, the_ride, confirmation). This world overrides the
# `origins` scene ONLY — because in the 1857 Sixth Ward the genre's
# "Territory / Back East / Across the Border / The War" origin vocabulary does
# not map. Origins here are the five cohorts of the ward: the Famine arrival,
# the native-born b'hoy, the free Black resident, the Mission reformer, and the
# uptown runaway. Each origin sets a `background:` id that gates the world's
# session-1 openings (off_the_boat_at_castle_garden, the_red_shirt_and_the_
# anniversary, the_stair_at_almacks, the_runaway_and_the_tract).
#
# All five scenes are world-localized (2026-06-07): the genre's frontier
# vocabulary (cantina, horse at the rail, riding into town, the territory)
# read absurd in the 1857 Sixth Ward, so crucible / reputation / the_ride /
# confirmation now carry ward-register narration too. Scene ids, titles,
# choice labels, and ALL mechanical_effects are byte-identical to the genre
# scenes — only prose changed. This file is a BARE LIST of scenes per the
# world loader contract (loader.py validates
# `isinstance(char_creation_raw, list)`); a top-level `scenes:` mapping would
# silently load nothing.
#
# Class/race hints draw ONLY from genre rules.yaml allowed_classes
# (Gunslinger, Bounty Hunter, Outlaw, Drifter, Gambler, Marshal) and
# allowed_races (Frontier Born, City Exile, Border Crosser, War Survivor).
# Stat keys are the genre's six: GRIT, DRAW, NERVE, CUNNING, PRESENCE, LUCK.
# Folk-charm tier only — no invented powers, no Gangs of New York (2002).

- id: origins
  title: Where Did You Come From?
  narration: |
    The groggery off Paradise Square is close with pipe-smoke and wet wool, and the rain on Baxter Street comes down the way it always does on the Sixth Ward — straight into the mud and no farther. A tallow dip gutters on the plank between you. Outside, a fire-bell somewhere up the Bowery, then nothing.

    The old man across the table is a ward fixture — the kind who knows which copper has a lawful star this week and which alderman owes whom. He has been buying the drink and asking the questions, not from kindness, and not from idle curiosity. He is taking your measure for a use.

    "Everybody in this ward come down to it from somewhere," he says. "Off a boat, down a stair, in off the street with the cold still on you. Where'd you come down from?"
  loading_text: "The old man waits, turning his glass on the scarred plank..."
  choices:
    - label: Off the boat — Famine Irish
      description: >-
        You came down the gangway at Castle Garden with the Hunger still
        in your bones — Munster or Connacht country folk, landed into the
        rear tenements of Mulberry Bend and the cellars off Worth Street.
        A rosary, a temper, a memory for debts, and a name the parish
        already keens. America is one smiling runner deep, so far.
      mechanical_effects:
        race_hint: City Exile
        background: fresh_famine_immigrant
        personality_trait: Devout
    - label: Native-born — a Bowery b'hoy
      description: >-
        You were born here, native and Protestant and loud about it —
        soaplocks at the temple, stovepipe hat, the red flannel shirt of
        the volunteer fire company. The engine-house is your parish and
        Bill Poole's memory the creed. Loyal to the company before sense,
        and your pride is for rent to men you do not quite see counting.
      mechanical_effects:
        class_hint: Outlaw
        race_hint: Frontier Born
        background: native_born_bhoy
        personality_trait: Loyal
    - label: Free of the ward — Black resident
      description: >-
        You are a free man or woman of the Sixth Ward, barred from the
        ballot by a property law that bound no white man, shut out of the
        machine's favor and the gangs' patronage. What you hold instead is
        the floor — Pete Williams's cellar, the one free space, where the
        powerless stand the same height — and the trust of everyone the
        ward would rather not see.
      mechanical_effects:
        class_hint: Drifter
        race_hint: City Exile
        background: free_black_resident
        personality_trait: Steadfast
    - label: The Mission — reformer's instrument
      description: >-
        You serve the Ladies' Home Missionary Society or the House of
        Industry — you feed the hungry, house the fallen, teach the child
        his letters, and you believe every word of it. You are brave; you
        walk courts the police will not. You have not yet let yourself
        hear that "making them new" means scrubbing the old faith out.
      mechanical_effects:
        class_hint: Marshal
        race_hint: City Exile
        background: reformer_missionary
        personality_trait: Earnest
    - label: Down off the street — uptown runaway
      description: >-
        You came in off the cold tonight, fled from an uptown house and
        something you will not name. Proud, half-frozen, and done being
        somebody's property in good linen. The ward is hard, but it never
        once called itself your home, which is more than the house you ran
        from could say. You know what "made new" cost the last time.
      mechanical_effects:
        race_hint: City Exile
        background: uptown_runaway
        personality_trait: Guarded
  allows_freeform: true

# ---------------------------------------------------------------------------
# Scenes below carry the same ids/titles/labels/mechanical_effects as the
# genre pack's (spaghetti_western/char_creation.yaml) — the world loader does
# NOT merge genre + world scenes (char_creation_resolve.py returns world
# scenes wholesale when non-empty), so the full flow must be present
# world-tier. Narration and choice descriptions are localized to the ward.
# ---------------------------------------------------------------------------

- id: crucible
  title: What Made You Dangerous?
  narration: |
    The old man nods slowly — not surprised, not sympathetic. There is no story that comes down to the Points he has not already bought a drink for. He refills your glass without being asked.

    "This ward eats the soft ones the first winter," he says. He turns his glass on the scarred plank, watching the tallow light move in it. "The ones still walking after — every one of them found the thing in themselves the ward could use. Some were born with it. Some had it beaten in. Some woke one morning in a cellar on Worth Street and found the thing they feared most was the thing they were best at."

    He meets your eyes. "What was it for you?"
  choices:
    - label: The Gun
      description: >-
        You have a gift for violence — fast hands, steady nerve, the
        ability to see a fight three moves ahead. Pocket revolver,
        knife, or a stretch of lead pipe in a stocking — the weapon is
        an extension of your will.
      mechanical_effects:
        class_hint: Gunslinger
        personality_trait: Lethal
    - label: The Hunt
      description: >-
        You learned to track and find. Debtors, runaways, witnesses —
        it does not matter. Patience is your weapon. The ward is your
        map, every court and cellar of it. Everyone leaves a trail,
        even through Mulberry Bend.
      mechanical_effects:
        class_hint: Bounty Hunter
        personality_trait: Patient
    - label: The Take
      description: >-
        You learned that the world does not give — it only has things
        that can be taken. Till-tapping, river piracy off the wharves,
        the second-storey trade — you found your talent outside the law
        and the law never caught up.
      mechanical_effects:
        class_hint: Outlaw
        personality_trait: Reckless
    - label: The Road
      description: >-
        You survived by moving. Never sleeping twice in the same
        lodging-cellar, never owing the same man two weeks running. The
        streets themselves became your skill — reading strangers,
        finding a dry stair, knowing when to run.
      mechanical_effects:
        class_hint: Drifter
        personality_trait: Adaptable
    - label: The Table
      description: >-
        Cards, dice, confidence games — you learned to read people
        before you learned to read books. Every conversation is a hand
        being played. Every room is a pot to be won.
      mechanical_effects:
        class_hint: Gambler
        personality_trait: Perceptive
    - label: The Badge
      description: >-
        Someone pinned authority on you — or you pinned it on yourself.
        With two police forces brawling over one city, the law in this
        ward is whatever the man wearing the star says it is, and you
        discovered you have opinions about justice that a star can
        enforce.
      mechanical_effects:
        class_hint: Marshal
        personality_trait: Authoritative
  allows_freeform: true

- id: reputation
  title: What Do People Say About You?
  narration: |
    The old man pushes back his chair. From inside his coat he produces a folded piece of paper — a police bill, or a pawn ticket, or a letter in a copperplate hand. Hard to tell by tallow light. He smooths it on the plank between you.

    "Word travels in this ward faster than fire," he says. "A name crosses Paradise Square before its owner does. The grocers have it by noon and the Tombs has it by supper. By the time you stand at a man's door, he already knows something about you."

    He taps the paper. "What does he know?"
  choices:
    - label: The stories are worse than the truth
      description: >-
        Your reputation has outrun your reality. People expect a monster,
        a legend, a force of nature. The real you is smaller than the
        myth, but the myth opens doors — and closes others.
      mechanical_effects:
        personality_trait: Mythologized
        reputation_bonus: intimidation
    - label: Nobody knows my name
      description: >-
        You are a ghost. No police bill, no ballad, no debts and no
        credit. Every ward is a fresh start — and every person you
        meet has to take you at face value.
      mechanical_effects:
        personality_trait: Anonymous
        reputation_bonus: stealth
    - label: I am owed favors
      description: >-
        You have done things for people — saved lives, covered debts,
        kept secrets. The Points remembers its debts the way the parish
        remembers its dead, and yours are scattered through the wards
        like coin sewn into a coat lining.
      mechanical_effects:
        personality_trait: Connected
        reputation_bonus: network
    - label: There is a price on my head
      description: >-
        Someone wants you found. Maybe the law, maybe a family, maybe
        someone you wronged. The price follows you like a shadow, and
        every thief-taker and shoulder-hitter below Canal Street knows
        the number.
      mechanical_effects:
        personality_trait: Hunted
        reputation_bonus: notoriety
  allows_freeform: true

- id: the_ride
  title: Why Are You Here?
  narration: |
    The old man folds the paper and returns it to his coat. He finishes his drink in one pull, sets the glass down with the finality of a gavel, and stands.

    "Last question," he says from the doorway. Behind him the square is rain and tallow-light, and somewhere off toward the Bowery a fire-bell is going again. "Everybody the tide leaves in this ward has a reason they stay in it. A debt, a name, a number, a grave they are looking for. Nobody lodges in the Points for the air."

    The rain picks up. Somewhere above, a shutter bangs on its one hinge.

    "What is yours?"
  choices:
    - label: Revenge
      description: >-
        Someone took something that cannot be replaced. A person, a
        life, a future. You are here to find them and balance the
        ledger in the only currency the Points accepts.
      mechanical_effects:
        goals: Vengeance
        emotional_state: Cold
    - label: Gold
      description: >-
        Somewhere in this ward there is money — buried under a hearth,
        sewn into a tick, promised on a handshake, or simply waiting for
        someone bold enough to take it. You are here because poverty in
        this city is a death sentence and wealth is the only freedom.
      mechanical_effects:
        goals: Wealth
        emotional_state: Hungry
    - label: A fresh start
      description: >-
        You are running from something — a crime, a failure, a life that
        closed around you like a fist. The Points is the last place in
        the city that never asks twice who you were before you came
        down to it.
      mechanical_effects:
        goals: Redemption
        emotional_state: Guarded
    - label: Someone needs finding
      description: >-
        A name. A face. Someone who came down to the wards and did not
        come back out. Whether you are bringing them home or bringing
        them to justice, the search is all that matters.
      mechanical_effects:
        goals: The Search
        emotional_state: Driven
  allows_freeform: true

- id: fate_aspects
  title: "What Do They Call You?"
  narration: |
    The old man pauses in the doorway, rain coming in around him off the square.
    "Hold a moment," he says. "A body comes down to the Points, the ward wants a
    name for them. Not the one the priest wrote down — the one they say quiet,
    after you have gone by. The thing a stranger would put to you in five words
    before he decided whether to stand you a gin or step back from the bar."

    He thumbs a lucifer alight on the doorframe and lets it gutter in the damp.

    "And everyone fetches up here with a crack. The flaw that brought you down to
    the wards and, like as not, is waiting at the bottom of them. Name it before
    the Points does — it always does. Then whatever else you want known."
  loading_text: "The old man lets the match gutter in the damp..."
  mechanical_effects:
    fate_chargen_step: aspects
  choices: []
  allows_freeform: false

- id: fate_pyramid
  title: "What Are You Good For?"
  narration: |
    "Talk is cheap in this ward," the old man says, "and cheaper in a groggery at
    this hour. The Points does not care what you say you are. It cares what you can
    do when the gin runs out and the watch will not come past Anthony Street and
    the only friend you have is whatever you carry in your own two hands."

    He slides a torn playbill and a stub of pencil across the bar. "Lay it out
    honest. One thing you are dangerous at. A couple you are good at. The rest you
    will get by on, or the river will see to you. The ones who swore they were good
    at everything are the ones Potter's Field knows by their faces."
  loading_text: "The old man waits while you reckon..."
  mechanical_effects:
    fate_chargen_step: pyramid
  choices: []
  allows_freeform: false

- id: fate_stunts
  title: "What's Your Edge?"
  narration: |
    "One more thing." The old man's voice drops under the rain working through the
    roof. "Any mug can throw a punch and any mug can run, and the Points is paved
    with the ones who could do both. The bodies that see another winter have a
    trick — a thing the other fellow does not know is coming until it is already
    done."

    He nods at whatever you keep in your coat. "Pick what you carry down into the
    ward. But carry it light. Down here every favor you lean on is one somebody
    comes to collect, and they never knock at a decent hour."
  loading_text: "The old man sizes up your hand..."
  mechanical_effects:
    fate_chargen_step: stunts
  choices: []
  allows_freeform: false

- id: confirmation
  title: The Road Ahead
  narration: |
    The old man is gone. You are alone in the groggery with the guttering tallow dip and the empty bottle and the sound of rain working through the roof into a pail somebody gave up emptying.

    Outside, five streets meet in the mud of Paradise Square, and every one of them is a promise of a different kind. Worth Street runs up toward Broadway and the swells who come slumming with full pockets. Baxter runs past the groceries that sell more by the back door than the front. Park goes down toward the Mission side, where they will make you new whether you ask or not. Mulberry bends into the Bend, where the courts go dark twenty feet in. And Little Water is hardly a street at all — which is exactly what the people who use it like about it.

    You stand. You feel the weight in your coat pocket. You step into the rain.

    The ward does not care who you are. But it is about to find out.
  choices: []
  allows_freeform: false
