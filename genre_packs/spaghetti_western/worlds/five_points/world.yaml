cover_poi: paradise_square_at_the_five_corners
name: Five Points
slug: five_points
genre: spaghetti_western
tagline: "Everybody flies a banner. Nobody shows their hand."
description: >-
  The Sixth Ward, Lower Manhattan, 1856. A slum built on the filled-in
  Collect Pond, sinking into its own methane marsh, the tenements tilting
  a degree more each winter and the streets a foot deep in mud and worse.
  Bill Poole has been a year in his Green-Wood grave and the nativists
  still toast him by name; the Famine boats are still coming through Castle
  Garden faster than the ward can swallow them. Every man here flies a
  banner — native pride, the old Faith, the friend-of-the-people machine,
  reform and uplift — and behind every banner is a hand nobody will show:
  who really pulls it, and what it really wants. The law is about to go to
  war with itself. By next July the ward will burn in the gap between two
  police forces too busy fighting each other to stop it. You arrive at the
  edge of that fuse, with a banner to choose and a hand of your own to play.

era: 1856
setting: "The Sixth Ward / Five Points, Lower Manhattan, New York"
starting_region: paradise_square
time_anchor: "autumn 1856, a year after Poole's burial, the police war still a rumor uptown"
inspirations:
  - "Tyler Anbinder, 'Five Points' (2001) — the de-Asbury scholarly anchor; no clean ethnic war, gangs as electoral muscle"
  - "Charles Dickens, 'American Notes' (1842) — the Almack's dance-cellar passage, Master Juba's trance-dance"
  - "Sergio Leone, 'Once Upon a Time in the West' (1968) — the standoff framing reserved for Paradise Square and the riot"
  - "Sergio Corbucci, 'The Great Silence' (1968) — the moral weight, the mud, the law that does not save you"
  - "Akira Kurosawa, 'Yojimbo' (1961) — the outsider playing two factions against the middle in a ruined town"
  - "Herbert Asbury, 'The Gangs of New York' (1928) — used as IN-WORLD LEGEND ONLY, the tale the ward tells, never as fact"
  - "The July 4-5, 1857 Dead Rabbits Riot — the VETERAN climax; Rynders stoned mid-mediation"
  - "The 1857 Metropolitan-vs-Municipal police war; People v. Draper, 15 N.Y. 532 (July 1857)"

