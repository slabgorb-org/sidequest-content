# Five Points — world bestiary (sixth_ward_vermin)
#
# World-tier override on the spaghetti_western pack. NOT monsters — this is a
# human-drama "western" relocated to the 1856 Sixth Ward slum of Lower
# Manhattan. The roster is the mundane animal hazard of a sinking tenement
# city: wharf rats off the East River docks, fighting and feral dogs, rat-pit
# and stable vermin, and the draft horses that kill more New Yorkers than any
# gang. NO desert fauna — there are no rattlesnakes, coyotes, cougars, or
# longhorns in Lower Manhattan.
#
# Stats follow the SRD generic form — level == HD, hp == average, ascending
# AC, morale on the 2d12 ladder. Animals are level 1-2.
#
# World tier (ADR-120): urban-slum fauna belongs here, not in the pack.
# Sources: Rattus norvegicus on the antebellum NYC waterfront; Kit Burns'
# Sportsmen's Hall rat-baiting pit (Water St.); the bull-and-terrier
# fighting-dog trade; runaway dray-horse fatalities in period coroner
# records. No fantasy elements.
entries:
  - id: wharf_rat_swarm
    name: Wharf Rat Swarm
    level: 1
    hp: 2
    armor_class: 12
    attack_bonus: 1
    damage: "1d3"
    move: "20 ft."
    morale: 5
    skill: 0
    save: 15
    role: dockside brown rats
    tags: [beast, vermin, swarm]
    abilities:
      - "Swarms — bites add up fast when a cellar or a sewer line floods them out"
      - "Foul bite — a deep one festers; the ward calls it 'the dock fever'"
    description: >-
      The brown rats of the East River wharves, fat on spilled grain and
      worse, boiling out of a grain ship's bilge or a flooded tenement
      cellar in numbers that turn a man's nerve before they ever touch him.
  - id: pit_terrier
    name: Pit Terrier
    level: 1
    hp: 4
    armor_class: 13
    attack_bonus: 2
    damage: "1d4"
    move: "40 ft."
    morale: 8
    skill: 1
    save: 15
    role: rat-baiting and fighting dog
    tags: [beast, dog]
    abilities:
      - "Gameness — bred not to let go; once it has a grip it must be pried off"
    description: >-
      A scarred bull-and-terrier from the cellar pits off Water Street, all
      jaw and stub tail, bred to kill rats by the hundred and other dogs for
      the wagering crowd. Loosed on a man, it goes for the wrist and stays.
  - id: feral_alley_dog
    name: Feral Alley Pack
    level: 1
    hp: 5
    armor_class: 13
    attack_bonus: 1
    damage: "1d6"
    move: "40 ft."
    morale: 6
    skill: 1
    save: 15
    role: masterless slum dogs
    tags: [beast, dog, pack]
    abilities:
      - "Pack tactics — emboldened in numbers in the dark courts and dead-end alleys"
    description: >-
      The ownerless curs of the back courts, ribs showing, slipping between
      the privies and ash-heaps. One cringes and runs; a winter-starved pack
      will corner a drunk in a blind alley and not be driven off easy.
  - id: runaway_dray_horse
    name: Runaway Dray Horse
    level: 2
    hp: 9
    armor_class: 12
    attack_bonus: 3
    damage: "1d8"
    move: "40 ft."
    morale: 5
    skill: 0
    save: 14
    role: bolted draft horse
    tags: [beast, livestock]
    abilities:
      - "Bolt — a spooked team drags an iron-shod dray through the crowd, trampling and crushing"
      - "Iron-shod hooves — a single kick from a panicked animal breaks bone"
    description: >-
      A heavy Conestoga or brewery horse, blinkered and overworked, that
      shies at a firecracker or a falling crate and bolts down a packed
      street — a ton of muscle and an iron-tired wagon that flattens whoever
      cannot scramble out of the gutter in time.
  - id: cellar_rat_king
    name: Cellar Rat King
    level: 2
    hp: 8
    armor_class: 13
    attack_bonus: 2
    damage: "1d6"
    move: "20 ft."
    morale: 6
    skill: 0
    save: 14
    role: outsized boss rat of the rookery
    tags: [beast, vermin]
    abilities:
      - "Cornered fury — fights when trapped instead of fleeing, and draws the swarm to it"
    description: >-
      The old grey patriarch of a rookery's rats, scarred and cat-sized,
      grown bold in the rotting timbers under the worst of the Old Brewery.
      Where it dens, the swarm dens; corner it and it comes up the arm.
