# Spaghetti Western — Voice Presets for TTS
# Configures Piper/Kokoro voice synthesis per archetype

narrator:
  model: en_US-libritts_r-medium
  pitch: 0.9
  rate: 0.8
  effects:
    - type: compressor
      params:
        threshold_db: -20
        ratio: 4
    - type: reverb
      params:
        room_size: 0.15

characters:
  The Man With No Name:
    model: en_US-libritts_r-medium
    pitch: 0.8
    rate: 0.7
    effects:
      - type: compressor
        params:
          threshold_db: -22
          ratio: 5
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 3200

  The Bounty Collector:
    model: en_US-libritts_r-medium
    pitch: 0.95
    rate: 0.85
    effects:
      - type: compressor
        params:
          threshold_db: -18
          ratio: 3
      - type: reverb
        params:
          room_size: 0.1

  The Desperate Bandit:
    model: en_US-libritts_r-medium
    pitch: 1.1
    rate: 1.15
    effects:
      - type: compressor
        params:
          threshold_db: -15
          ratio: 3
      - type: gain
        params:
          db: 2

  The Corrupt Sheriff:
    model: en_US-libritts_r-medium
    pitch: 0.9
    rate: 0.85
    effects:
      - type: compressor
        params:
          threshold_db: -18
          ratio: 4
      - type: reverb
        params:
          room_size: 0.2

  The Widow:
    model: en_US-libritts_r-medium
    pitch: 1.15
    rate: 0.85
    effects:
      - type: compressor
        params:
          threshold_db: -18
          ratio: 3

  The Card Sharp:
    model: en_US-libritts_r-medium
    pitch: 1.0
    rate: 1.0
    effects:
      - type: compressor
        params:
          threshold_db: -16
          ratio: 3
      - type: reverb
        params:
          room_size: 0.15

  The Hired Gun:
    model: en_US-libritts_r-medium
    pitch: 0.85
    rate: 0.75
    effects:
      - type: compressor
        params:
          threshold_db: -22
          ratio: 5
      - type: lowpass_filter
        params:
          cutoff_frequency_hz: 3000

  The Preacher:
    model: en_US-libritts_r-medium
    pitch: 0.95
    rate: 0.8
    effects:
      - type: compressor
        params:
          threshold_db: -18
          ratio: 3
      - type: reverb
        params:
          room_size: 0.35
