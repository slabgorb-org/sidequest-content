- id: standoff
  archetype: standoff
  situation: >-
    The player walks into a confrontation already in progress. Two or more
    parties are squared off. The player's arrival changes the calculus.
    No one is friendly. Everyone is armed.
  tone: terse, dangerous
  avoid:
    - cantina introductions
    - helpful townsfolk
    - fetch and delivery errands
  first_turn_seed: >-
    Three men in the street. One on a knee, bleeding. The other two
    haven't drawn yet. Every eye in town just found you.

- id: ambush_aftermath
  archetype: survival
  situation: >-
    The player comes to after an ambush — robbed, injured, left for dead
    on the road. Everything they had is gone. The nearest town is a smudge
    of heat on the horizon. Survival first, revenge later.
  tone: gritty, desperate
  avoid:
    - settlement welcome
    - NPC exposition
    - comfortable starting position
  first_turn_seed: >-
    Sand in your teeth. Sun on the back of your neck. Your horse is gone.
    Your guns are gone. The vultures are not gone.

- id: stranger_arrives
  archetype: arrival
  situation: >-
    The player rides into town and the town reacts to THEM. Shutters close.
    A child runs inside. The sheriff steps onto the porch. The player is
    the disruption, not the audience. What they do in the first minute
    defines every relationship that follows.
  tone: iconic, charged
  avoid:
    - being given a quest
    - friendly NPC introductions
    - market or saloon socializing
  first_turn_seed: >-
    The town goes quiet when you ride in. Not the quiet of siesta — the
    quiet of a hand moving to a holster. Someone was expected. You're not them.

- id: bounty_hunt
  archetype: chase
  situation: >-
    The player is tracking someone — or being tracked. A bounty is involved.
    The trail leads through dangerous territory. Every stranger could be
    the target, the competition, or bait.
  tone: predatory, paranoid
  avoid:
    - settled starting locations
    - quest-giver NPCs
    - safe environments
  first_turn_seed: >-
    The tracks are fresh — two hours, maybe less. Whoever you're following
    knows this territory better than you do. The canyon narrows ahead.
