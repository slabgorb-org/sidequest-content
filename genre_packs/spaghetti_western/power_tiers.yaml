# Power Tiers — spaghetti_western
# Per-class visual descriptions at each level range.
# Keyed by class from rules.yaml:
#   Gunslinger, Bounty Hunter, Outlaw, Drifter, Gambler, Marshal

Gunslinger:
  - level_range: [1, 3]
    label: green hand
    player: >-
      a revolver that's seen more cleaning than shooting, a hat that
      doesn't quite fit right, a poncho chosen for warmth not style,
      boots that blister on long rides, the nervous habit of touching
      the holster to make sure it's still there
    npc: >-
      a young gun trying to build a reputation, fast enough to be
      dangerous, not experienced enough to know when not to draw
  - level_range: [4, 6]
    label: pistolero
    player: >-
      a revolver worn smooth at the grip, a hat that sits right because
      the head beneath it has learned to carry it, a poncho that's been
      through dust storms and gunfights and smells of both, the measured
      walk of someone who doesn't hurry because hurrying is for people
      who didn't see it coming
    npc: >-
      a gun for hire with a name that opens some doors and closes others,
      whose draw speed is a matter of local legend and bar argument
  - level_range: [7, 9]
    label: legend
    player: >-
      a revolver that has a story — every scratch, every replacement
      part, every notch that isn't there because legends don't need to
      count, a silhouette that's recognizable at distance, a reputation
      that arrives in town before the horse does
    npc: >-
      a gunfighter whose name silences saloons, whose presence changes
      the power balance of any town they ride into
  - level_range: [10, 10]
    label: the name they whisper
    player: >-
      the gun is almost irrelevant — the legend is the weapon, towns
      surrender at the silhouette, men who've killed dozens won't draw
      against the name, a figure that has become more myth than person,
      moving through a world that has decided they cannot be killed

Bounty Hunter:
  - level_range: [1, 3]
    label: skip tracer
    player: >-
      a stack of wanted posters folded into a coat pocket, a rifle that's
      accurate enough and a horse that's fast enough, rope and shackles
      on the saddle, the grim focus of someone doing ugly work for
      reliable pay
    npc: >-
      a man who brings back bodies more often than prisoners, works the
      easy bounties and avoids the dangerous names
  - level_range: [4, 6]
    label: hunter
    player: >-
      a rifle with a scope, a horse trained to stand steady during
      gunfire, wanted posters organized by value, tools of the trade —
      manacles, tracking gear, a coat long enough to hide a shotgun,
      the patient focus of someone who has learned that bounties are
      won by waiting, not chasing
    npc: >-
      a professional bounty hunter whose capture rate earns them the
      difficult contracts, known by sheriffs and outlaws alike
  - level_range: [7, 9]
    label: man hunter
    player: >-
      a reputation that makes fugitives keep running, a network of
      informants in every territory, equipment honed by dozens of
      captures, a horse that knows the work as well as the rider,
      the cold certainty of someone who has never lost a bounty they
      committed to
    npc: >-
      a bounty hunter whose name on a warrant is a death sentence —
      not because they kill, but because they never stop coming
  - level_range: [10, 10]
    label: angel of death
    player: >-
      the bounty hunter who caught the uncatchable, who brought in
      the name that no one else would take, whose reputation has
      become justice itself — when the law fails, they are what's left

Outlaw:
  - level_range: [1, 3]
    label: rustler
    player: >-
      a cheap revolver and a bandana pulled up over the nose, a stolen
      horse that isn't quite broken, a price on their head too small
      to interest real hunters, the desperate energy of someone who
      chose the wrong side of the law and is committed now
    npc: >-
      a petty thief or cattle rustler, dangerous but small-time,
      running with whoever will have them
  - level_range: [4, 6]
    label: desperado
    player: >-
      a matched pair of revolvers, a horse chosen for speed over
      comfort, a price on their head that's starting to attract
      attention, scars from close calls, the defiant grin of someone
      who has decided that if the world won't give them a place,
      they'll take one
    npc: >-
      a known outlaw with a gang and a territory, wanted in two
      jurisdictions, feared by travelers on the routes they claim
  - level_range: [7, 9]
    label: bandit king
    player: >-
      a gang that's become an army, a territory that's become a
      kingdom, wanted posters that have become recruitment flyers,
      a personal legend that draws followers and terrifies law —
      not a criminal anymore but a force of nature with a grudge
    npc: >-
      an outlaw leader whose power rivals the law's, whose raids
      are campaigns and whose hideout is a fortress
  - level_range: [10, 10]
    label: folk hero
    player: >-
      the outlaw who became the legend — whose crimes became justice,
      whose name became a song, whose wanted poster is framed in
      saloons as decoration, the one the poor protect and the rich
      fear, Robin Hood with a six-gun

Drifter:
  - level_range: [1, 3]
    label: stranger
    player: >-
      a worn revolver, a duster coat faded to grey, a horse that's
      been ridden too far, a face that doesn't give anything away,
      the silence of someone who has learned that talking leads to
      staying and staying leads to trouble
    npc: >-
      a nameless rider passing through, keeps to themselves, pays
      cash, asks no questions and answers fewer
  - level_range: [4, 6]
    label: wanderer
    player: >-
      a revolver that's part of the hand, a duster that's part of
      the silhouette, a horse that knows the rider's mind, a trail
      of solved problems and burned bridges stretching across three
      territories, the calm of someone who has nothing left to lose
      and everything left to do
    npc: >-
      a drifter whose arrival in a town means something is about
      to change, whose departure means it already did
  - level_range: [7, 9]
    label: the man with no name
    player: >-
      no past, no future, just the present and whatever's in it —
      a figure who walks into the worst situations and walks out
      with them resolved, whose motives are unclear and whose
      competence is absolute, a ghost with a gun
    npc: >-
      a figure of legend — shows up, fixes what's broken, disappears,
      leaves behind stories that don't quite match because nobody
      can agree on the details
  - level_range: [10, 10]
    label: myth
    player: >-
      not a person anymore but a story the West tells itself — the
      stranger who always comes, who always leaves, who exists in
      the space between the law and the lawless where the only
      justice is whatever they decide it is

Gambler:
  - level_range: [1, 3]
    label: card sharp
    player: >-
      a clean shirt in a dirty town, a deck of cards worn soft at
      the edges, a derringer hidden somewhere personal, a smile that
      doesn't reach the eyes, the watchful patience of someone who
      makes their living reading people and letting them think they can't
    npc: >-
      a saloon regular who wins more than statistics allow, light
      fingers and a lighter conscience
  - level_range: [4, 6]
    label: high roller
    player: >-
      a tailored vest in a territory that doesn't deserve it, a marked
      deck and a clean one depending on the company, a reputation at
      every table between here and the coast, a derringer and a stiletto
      because the cards don't always work
    npc: >-
      a professional gambler who moves between towns like weather,
      leaving some richer and some poorer, always welcome and never
      trusted
  - level_range: [7, 9]
    label: kingmaker
    player: >-
      the gambler who doesn't play cards anymore — plays people,
      plays towns, plays the territory itself, a fortune built on
      knowing what everyone wants and who'll pay most to get it,
      a web of debts and favors that IS the power
    npc: >-
      a power broker who owns saloons, backs sheriffs, and bankrolls
      outlaws — all at the same time, because the house always wins
  - level_range: [10, 10]
    label: the devil's own
    player: >-
      luck that defies explanation, a fortune that defies accounting,
      a network that defies mapping — the gambler who won the
      territory in a card game nobody remembers the details of, whose
      luck is so persistent that people have stopped calling it luck

Marshal:
  - level_range: [1, 3]
    label: deputy
    player: >-
      a tin star pinned to a dusty coat, a revolver holstered on the
      wrong side because they're still learning, a horse borrowed from
      the county, the uncomfortable authority of someone who represents
      a law that most people out here consider a suggestion
    npc: >-
      a young lawman in over their head, trying to enforce order in
      a town that doesn't want it, brave and overwhelmed
  - level_range: [4, 6]
    label: sheriff
    player: >-
      a silver star worn smooth, a shotgun in the saddle scabbard,
      a reputation that keeps the peace more than the badge does,
      a jail that's been occupied and emptied and occupied again,
      the tired determination of someone who chose the law knowing
      what it costs
    npc: >-
      a town sheriff whose word holds within the town limits and
      whose jurisdiction ends at the signpost, respected by decent
      folk, tested by everyone else
  - level_range: [7, 9]
    label: territorial marshal
    player: >-
      federal authority in a land that doesn't recognize it, a badge
      that crosses jurisdictions, a posse that forms when needed and
      a reputation that makes it needed less, the iron conviction of
      someone who has brought law to places that killed the last
      marshal they sent
    npc: >-
      a federal lawman whose pursuit doesn't end at the county line,
      whose name makes outlaws consider retirement
  - level_range: [10, 10]
    label: hanging judge
    player: >-
      the law incarnate — not the badge, not the office, but the
      principle itself made flesh and iron, whose judgments have
      shaped the territory, whose pursuit has no statute of
      limitations, the last word in a land where words are usually
      backed by bullets
