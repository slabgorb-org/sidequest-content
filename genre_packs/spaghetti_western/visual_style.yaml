# Visual style configuration for spaghetti western genre pack
#
# Controls how Flux image generation renders scenes for this genre.
# Spaghetti western visual identity: cinematic film still, high contrast,
# harsh desert light. Think Sergio Leone's framing — extreme close-ups
# of weathered faces, wide establishing shots of sun-bleached landscapes,
# dust hanging in light shafts, sweat on leather. The palette is burnt
# sienna, bone white, deep shadow, and the occasional blood red.
# Everything looks like it has been in the sun too long.

# ── Core Style ────────────────────────────────────────────────

positive_suffix: >-
  1966 Techniscope film frame, Sergio Leone, desaturated washed-out color,
  heavy film grain, blown-out highlights, crushed blacks, overexposed sky,
  Ennio Morricone energy, Almería Spain location, dust in every frame,
  Tonino Delli Colli cinematography, weathered sun-damaged skin, sweat on
  cracked leather, faded denim, deep shadow under hat brims,
  not photorealistic, not clean, not digital, celluloid artifact

portrait_style: >-
  extreme close-up, eyes filling the frame, Sergio Leone dollar trilogy,
  every pore and sun crease visible, shallow depth of field background
  blown to nothing, sweat beading on upper lip, hat brim cutting a
  shadow line across the forehead, Techniscope film grain, desaturated,
  washed out, the stare before the draw

poi_style: >-
  ultra-wide establishing shot, tiny figures against vast empty landscape,
  2.35:1 anamorphic widescreen, Almería desert, bleached sky taking up
  two-thirds of the frame, single road or building dwarfed by geology,
  Sergio Leone distance shot, heat shimmer, no green, Techniscope grain

negative_prompt: >-
  clean, new, shiny, soft lighting, pastel colors, modern, anime,
  cartoon, cute, pristine, photorealistic, studio lighting, sharp focus,
  smooth skin, digital clarity, HDR, high saturation, vivid color,
  green lush landscape, snow, rain, fantasy, medieval, magic, neon,
  3d render, stock photo, portrait photography

preferred_model: dev

base_seed: 1966

# ── LoRA (story 35-15) ────────────────────────────────────────
# Genre-specific Flux LoRA for spaghetti-western visual style.
# Path is relative to this genre pack directory; the Rust
# dispatch layer resolves to an absolute path before sending
# to the daemon (per ADR-032).
# The trigger word activates the trained style and replaces
# `positive_suffix` in the CLIP prompt when the LoRA is loaded.
# The .safetensors file itself is trained/dropped in separately
# (Epic 32 scope) — this YAML ships the wire, not the weights.
lora: lora/spaghetti_western_style.safetensors
lora_trigger: sw_style

# ── Location Tag Overrides ────────────────────────────────────

visual_tag_overrides:
  saloon: >-
    dim interior of a frontier saloon, heavy wooden bar scarred by
    knife points and cigarette burns, oil lamp light casting deep
    amber pools, card table with scattered chips and a half-empty
    whiskey bottle, swinging doors letting in a blade of white
    sunlight and dust, wooden floor worn smooth by boots
  desert: >-
    vast sun-scorched desert stretching to distant mesas, bleached
    earth cracked into geometric patterns, single saguaro cactus
    throwing a thin shadow, heat shimmer distorting the horizon,
    vultures circling in a white sky, a faint trail of dust from
    a distant rider
  town: >-
    sun-bleached wooden buildings along a wide dirt street, hitching
    posts and water troughs, a church bell tower at one end, the
    sheriff's office with a barred window, laundry hanging motionless
    in dead air, empty rocking chairs on covered porches, dust
    devils in the street
  hacienda: >-
    thick adobe walls around a dusty courtyard, terra cotta tiles
    cracked by sun, a dry fountain basin, wrought iron gates standing
    open, bougainvillea growing wild over a neglected wall, armed
    men in the shade of an archway, wealth going to seed
  canyon: >-
    narrow sandstone canyon with walls striped red and ochre, deep
    shadow at the base where the sun never reaches, a thin stream
    of muddy water between boulders, the echo of hooves, perfect
    ambush terrain where every ledge hides a rifle
  jail: >-
    small stone building with a single barred window, a desk with
    a ring of keys and a half-written ledger, a potbelly stove gone
    cold, wanted posters papering the walls, a narrow cell with a
    straw pallet and scratched tally marks
  cemetery: >-
    hilltop cemetery with leaning wooden crosses and a few carved
    headstones, dry grass between the graves, a gnarled tree
    providing the only shade, the best view in town belonging to
    the dead, wind moving dust between the markers
  railroad: >-
    fresh-laid rails gleaming in the sun, Chinese and Irish workers
    driving spikes in brutal heat, a water tower and telegraph poles
    marching to the horizon, a locomotive trailing black smoke against
    a white sky, progress measured in ties per day
  camp: >-
    desert campfire of mesquite and scrub, bedrolls on bare ground,
    saddles used as pillows, coffee pot on a flat stone, horses
    hobbled nearby in the dark, a sky packed with stars so bright
    they cast shadows, the red eye of a cigarette
  mine: >-
    abandoned silver mine entrance braced with rotting timber, ore
    cart on rusted tracks, lantern light revealing pick-scarred walls
    and the dark throat of a tunnel descending into the hill, the
    smell of dust and old dynamite
  river: >-
    muddy river cutting between sandy banks, a rope ferry or wooden
    bridge in poor repair, cottonwood trees with pale bark, the
    border between territories or nations — crossing means something
  road: >-
    long straight dirt road between desert and sky, telegraph poles
    marking the miles, a stagecoach raising a column of dust, the
    horizon shimmering in heat, a signpost with distances to towns
    you have never heard of
  battlefield: >-
    aftermath of a frontier skirmish — overturned wagon, dead horses
    drawing flies, spent brass casings in the dirt, a hat with a
    bullet hole, smoke from a burning structure, crows settling
  church: >-
    small adobe mission with a single bell tower and a wooden cross,
    whitewashed walls cracked by sun, heavy wooden doors standing
    open, interior cool and dim with candle smoke and painted saints,
    the only quiet building in town
  mountain: >-
    high desert mountain pass with switchback trail, stunted pines
    at the tree line, loose scree and exposed rock, wind that never
    stops, a view that extends for a hundred miles of nothing, cold
    nights at altitude
