[project]
name = "cavern_renderer"
version = "0.1.0"
description = "Author-time tool: cellular-automata cavern → PNG + ASCII mask. ADR-096."
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "sidequest-server",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[project.scripts]
cavern_renderer = "cavern_renderer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cavern_renderer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
sidequest-server = { path = "../../../sidequest-server", editable = true }
