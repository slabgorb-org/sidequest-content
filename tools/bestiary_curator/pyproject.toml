[project]
name = "bestiary_curator"
version = "0.1.0"
description = "Author-time tool: SRD monster corpus -> per-world WWN bestiary via the world_register genre-truth gate + WWN stat ladder. Story 158-20 (generalizes the beneath_sunden curation pattern). ADR-140 / ADR-143."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bestiary_curator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
