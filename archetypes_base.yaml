      conscientiousness: [5.5, 8.0]
      extraversion: [4.0, 7.0]
      agreeableness: [7.5, 9.5]
      neuroticism: [4.0, 7.0]
    stat_affinity: [faith, endurance, spirit]

  - id: sage
    drive: "Seeks truth and understanding"
