schema_version: "1.0"

genre_pack:
  required_files:
    - pack.yaml
    - theme.yaml
    - archetypes.yaml
    - tropes.yaml
    - lore.yaml
    - visual_style.yaml
    - audio.yaml
    - rules.yaml
    - cultures.yaml
    - char_creation.yaml
    - inventory.yaml
    - lethality_policy.yaml
    - power_tiers.yaml
    - progression.yaml
    - prompts.yaml
    - axes.yaml
    - visibility_baseline.yaml
    - client_theme.css

  required_dirs:
    - audio/music
    - assets/fonts
    - assets/images/portraits
    - assets/images/poi
    - worlds

  extensions:
    magic:
      files: [magic.yaml]
    classes:
      files: [classes.yaml]
    spellbook:
      files: [spellbook.yaml]
      dirs: [spells]
    openings:
      files: [openings.yaml]
    projection:
      files: [projection.yaml]
    beat_vocabulary:
      files: [beat_vocabulary.yaml]
    archetype_constraints:
      files: [archetype_constraints.yaml]
    achievements:
      files: [achievements.yaml]
    powers:
      files: [powers.yaml]
    chassis_classes:
      files: [chassis_classes.yaml]
    calendar:
      files: [calendar.yaml]
    weather:
      files: [weather.yaml]
    history:
      files: [history.yaml]
    dogfight:
      dirs: [dogfight]
    pacing:
      files: [pacing.yaml]
    seed_tropes:
      files: [seed_tropes.yaml]
    equipment_tables:
      files: [equipment_tables.yaml]
    backstory_tables:
      files: [backstory_tables.yaml]

world:
  required_files:
    - world.yaml
    - cartography.yaml
    - history.yaml
    - lore.yaml
    - openings.yaml
    - portrait_manifest.yaml
    - tropes.yaml
    - visual_style.yaml
    - archetypes.yaml

  required_dirs:
    - cultures
    - legends
    - assets/images/portraits
    - assets/images/poi

  extensions:
    archetype_funnels:
      files: [archetype_funnels.yaml]
    npcs:
      files: [npcs.yaml]
    creatures:
      files: [creatures.yaml]
    magic:
      files: [magic.yaml]
    confrontations:
      files: [confrontations.yaml]
    encounter_tables:
      files: [encounter_tables.yaml]
    calendar:
      files: [calendar.yaml]
    demographics:
      files: [demographics.yaml]
    rooms:
      dirs: [rooms]
    cookbook:
      dirs: [cookbook]
    world_register:
      files: [world_register.yaml]
    faction_agendas:
      files: [faction_agendas.yaml]
    orbits:
      files: [orbits.yaml]
    rigs:
      files: [rigs.yaml]
    inventions:
      files: [inventions.yaml]
    items:
      files: [items.yaml]
