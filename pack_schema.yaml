schema_version: "1.0"

genre_pack:
  # Genre/world boundary correction (supersedes ADR-120 "mechanics-in-genre"):
  # the genre tier is the RULEBOOK ONLY (resolution rules, progression math,
  # tone/voice axes, narrator voice, lethality + visibility policy, theme/audio
  # chrome). The CAST and CATALOG — archetypes, tropes, char_creation, inventory,
  # power_tiers — are world-authoritative and live under worlds/<world>/. A genre
  # MAY still ship any of those as a shared default (validates normally when
  # present), but none are required at the genre tier. See world.required_files.
  required_files:
    - pack.yaml
    - theme.yaml
    # lore.yaml is FORBIDDEN at genre level (epic-74 story 74-3 — lore is
    # world-only; the genre tier is mechanics-only). The validator flags a
    # genre-tier lore.yaml as an error; world lore.yaml stays required below.
    # visual_style.yaml is OPTIONAL at genre level (2026-05-29 directive — all
    # visual prompts live at world level; see world.required_files below, where
    # visual_style.yaml remains mandatory because every world is self-contained).
    - audio.yaml
    - rules.yaml
    # cultures.yaml, archetypes.yaml, tropes.yaml, char_creation.yaml,
    # inventory.yaml, power_tiers.yaml are OPTIONAL at genre level — ALL cast and
    # catalog flavor lives in worlds/<world>/. Packs MAY still ship genre-tier
    # copies (some do) and they validate normally when present.
    - lethality_policy.yaml
    - progression.yaml
    - prompts.yaml
    - axes.yaml
    - visibility_baseline.yaml
    - client_theme.css

  required_dirs:
    - audio/music
    - assets/fonts
    # NOTE: assets/images/{portraits,poi} were retired as required dirs on
    # 2026-06-13. Rendered images are canonical in R2 (cdn.slabgorb.com),
    # indexed by r2_manifest.json — the local assets/images/* folders are
    # documented "historical drift" (see sidequest-content/CLAUDE.md "Asset
    # Hosting"; older worlds keep them only as empty .gitkeep residue, and
    # production rest.py resolves hero/POI art via assets/poi + R2, not
    # assets/images/*). Enforcing them rejected clean post-R2 worlds
    # (seaboard_of_saints) while passing residue-carrying ones.
    - worlds

  # Story 113-2: this list is reconciled against the server loader's genre-pack-root
  # allowlist (sidequest-server/sidequest/genre/loader.py
  # GENRE_PACK_ROOT_EXTENSION_FILES). The FILE set here MUST equal that constant —
  # a drift guard (test_pack_schema_loader_drift_113_2.py) fails CI otherwise, so
  # the validator can flag dead files and recognize live ones. Removed entries
  # (loader-dead at the genre tier): openings (loader sets openings=[]; world-tier
  # only), powers (unreferenced), weather (runtime reads world_dir, not pack root),
  # calendar (no genre-tier read), history (world-tier only); spellbook keeps its
  # `spells/` dir but drops the unread spellbook.yaml file.
  extensions:
    magic:
      files: [magic.yaml]
    classes:
      files: [classes.yaml]
    spellbook:
      dirs: [spells]
    projection:
      files: [projection.yaml]
    beat_vocabulary:
      files: [beat_vocabulary.yaml]
    archetype_constraints:
      files: [archetype_constraints.yaml]
    achievements:
      files: [achievements.yaml]
    chassis_classes:
      files: [chassis_classes.yaml]
    dogfight:
      dirs: [dogfight]
    pacing:
      files: [pacing.yaml]
    seed_tropes:
      files: [seed_tropes.yaml]
    equipment_tables:
      files: [equipment_tables.yaml]
    backstory_tables:
      files: [backstory_tables.yaml]
    # Live genre-tier mechanics the loader reads (ADR-143 chargen catalogs,
    # WWN/psionic spellbooks, SRD bestiary, mutation + witnessed-act vocab) —
    # previously omitted, so the validator could not recognize them.
    skills:
      files: [skills.yaml]
    spells_wwn:
      files: [spells_wwn.yaml]
    foci:
      files: [foci.yaml]
    bestiary:
      files: [bestiary.yaml]
    backgrounds:
      files: [backgrounds.yaml]
    witnessed_acts:
      files: [witnessed_acts.yaml]
    mutations:
      files: [mutations.yaml]
    disciplines_psionic:
      files: [disciplines_psionic.yaml]

world:
  required_files:
    - world.yaml
    - cartography.yaml
    - history.yaml
    - lore.yaml
    - openings.yaml
    - portrait_manifest.yaml
    - tropes.yaml
    - visual_style.yaml
    - archetypes.yaml

  required_dirs:
    - cultures
    - legends
    # assets/images/{portraits,poi} retired here too — see the genre-tier note
    # above. Rendered art is canonical in R2; the local folders are drift.

  extensions:
    archetype_funnels:
      files: [archetype_funnels.yaml]
    npcs:
      files: [npcs.yaml]
    creatures:
      files: [creatures.yaml]
    magic:
      files: [magic.yaml]
    confrontations:
      files: [confrontations.yaml]
    encounter_tables:
      files: [encounter_tables.yaml]
    calendar:
      files: [calendar.yaml]
    demographics:
      files: [demographics.yaml]
    rooms:
      dirs: [rooms]
    cookbook:
      dirs: [cookbook]
    world_register:
      files: [world_register.yaml]
    faction_agendas:
      files: [faction_agendas.yaml]
    orbits:
      files: [orbits.yaml]
    rigs:
      files: [rigs.yaml]
    inventions:
      files: [inventions.yaml]
    items:
      files: [items.yaml]
