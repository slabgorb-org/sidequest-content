schema_version: "1.0"

genre_pack:
  # Genre/world boundary correction (supersedes ADR-120 "mechanics-in-genre"):
  # the genre tier is the RULEBOOK ONLY (resolution rules, progression math,
  # tone/voice axes, narrator voice, lethality + visibility policy, theme/audio
  # chrome). The CAST and CATALOG — archetypes, tropes, char_creation, inventory,
  # power_tiers — are world-authoritative and live under worlds/<world>/. A genre
  # MAY still ship any of those as a shared default (validates normally when
  # present), but none are required at the genre tier. See world.required_files.
  required_files:
    - pack.yaml
    - theme.yaml
    # lore.yaml is FORBIDDEN at genre level (epic-74 story 74-3 — lore is
    # world-only; the genre tier is mechanics-only). The validator flags a
    # genre-tier lore.yaml as an error; world lore.yaml stays required below.
    # visual_style.yaml is OPTIONAL at genre level (2026-05-29 directive — all
    # visual prompts live at world level; see world.required_files below, where
    # visual_style.yaml remains mandatory because every world is self-contained).
    - audio.yaml
    - rules.yaml
    # cultures.yaml, archetypes.yaml, tropes.yaml, char_creation.yaml,
    # inventory.yaml, power_tiers.yaml are OPTIONAL at genre level — ALL cast and
    # catalog flavor lives in worlds/<world>/. Packs MAY still ship genre-tier
    # copies (some do) and they validate normally when present.
    - lethality_policy.yaml
    - progression.yaml
    - prompts.yaml
    - axes.yaml
    - visibility_baseline.yaml
    - client_theme.css

  required_dirs:
    - audio/music
    - assets/fonts
    - assets/images/portraits
    - assets/images/poi
    - worlds

  extensions:
    magic:
      files: [magic.yaml]
    classes:
      files: [classes.yaml]
    spellbook:
      files: [spellbook.yaml]
      dirs: [spells]
    openings:
      files: [openings.yaml]
    projection:
      files: [projection.yaml]
    beat_vocabulary:
      files: [beat_vocabulary.yaml]
    archetype_constraints:
      files: [archetype_constraints.yaml]
    achievements:
      files: [achievements.yaml]
    powers:
      files: [powers.yaml]
    chassis_classes:
      files: [chassis_classes.yaml]
    calendar:
      files: [calendar.yaml]
    weather:
      files: [weather.yaml]
    history:
      files: [history.yaml]
    dogfight:
      dirs: [dogfight]
    pacing:
      files: [pacing.yaml]
    seed_tropes:
      files: [seed_tropes.yaml]
    equipment_tables:
      files: [equipment_tables.yaml]
    backstory_tables:
      files: [backstory_tables.yaml]

world:
  required_files:
    - world.yaml
    - cartography.yaml
    - history.yaml
    - lore.yaml
    - openings.yaml
    - portrait_manifest.yaml
    - tropes.yaml
    - visual_style.yaml
    - archetypes.yaml

  required_dirs:
    - cultures
    - legends
    - assets/images/portraits
    - assets/images/poi

  extensions:
    archetype_funnels:
      files: [archetype_funnels.yaml]
    npcs:
      files: [npcs.yaml]
    creatures:
      files: [creatures.yaml]
    magic:
      files: [magic.yaml]
    confrontations:
      files: [confrontations.yaml]
    encounter_tables:
      files: [encounter_tables.yaml]
    calendar:
      files: [calendar.yaml]
    demographics:
      files: [demographics.yaml]
    rooms:
      dirs: [rooms]
    cookbook:
      dirs: [cookbook]
    world_register:
      files: [world_register.yaml]
    faction_agendas:
      files: [faction_agendas.yaml]
    orbits:
      files: [orbits.yaml]
    rigs:
      files: [rigs.yaml]
    inventions:
      files: [inventions.yaml]
    items:
      files: [items.yaml]
